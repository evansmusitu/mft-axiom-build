name: ATLAS Axiom Non-Compute Credential Qualification
on:
  push:
    branches:
      - feature/atlas-axiom-credential-preflight-20261022
    paths:
      - .github/workflows/atlas-axiom-credential-preflight.yml
      - apps/musitu-atlas-groq/api/axiom/_entitlementCheck.ts
      - apps/musitu-atlas-groq/api/axiom/preview.ts
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify read-only provider authentication classifications
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas-auth-test/node_modules/@neondatabase/serverless
          cp apps/musitu-atlas-groq/api/axiom/{_contract.ts,_rational.ts} /tmp/atlas-auth-test/
          for part in _ledger _entitlementCheck; do
            sed -e 's@./_contract.js@./_contract.ts@g' -e 's@./_ledger.js@./_ledger.ts@g' \
                "apps/musitu-atlas-groq/api/axiom/${part}.ts" > "/tmp/atlas-auth-test/${part}.ts"
          done
          printf '%s\n' '{"type":"module","name":"@neondatabase/serverless","exports":"./index.js"}' > /tmp/atlas-auth-test/node_modules/@neondatabase/serverless/package.json
          cat > /tmp/atlas-auth-test/node_modules/@neondatabase/serverless/index.js <<'JS'
          export function neon(){
           return async () => [{
            can_read:true,can_insert:true,can_update:true,
            can_delete_attempt:false,can_delete_audit:false,can_delete_quota:false,
            can_create:false,privileged_member:false,superuser:false,
            can_create_roles:false,can_create_dbs:false,can_bypass_rls:false
           }];
          }
          JS
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          process.env.ATLAS_AXIOM_DATABASE_URL='postgresql://unused.invalid/test';
          process.env.AXIOM_MCP_BEARER_TOKEN='test-scope-credential-not-a-real-token';
          const mod=await import('file:///tmp/atlas-auth-test/_entitlementCheck.ts');
          let calls=[],authorized=false;
          globalThis.fetch=async (_,options)=>{
           const o=JSON.parse(options.body);calls.push(o);
           if(o.method==='tools/list')return{
             ok:true,status:200,headers:{get:()=> 'application/json'},
             text:async()=>JSON.stringify({jsonrpc:'2.0',id:o.id,result:{tools:[{name:'axiom_arithmetic_evaluate'}]}})
           };
           assert.equal(o.method,'tools/call');
           assert.ok(!['axiom_arithmetic_evaluate','musitu_axiom_execute'].includes(o.params.name));
           const data=authorized?{jsonrpc:'2.0',id:o.id,error:{code:-32601,message:'Tool not found'}}:
             {jsonrpc:'2.0',id:o.id,result:{isError:true,structuredContent:{authenticated:false}}};
           return {ok:true,status:200,text:async()=>JSON.stringify(data)};
          };
          let first=await mod.preflight();
          assert.equal(first.providerGateStatus,'CREDENTIAL_REJECTED');
          assert.equal(first.operationExecuted,false);
          assert.equal(first.providerComputeUnitsClaimed,0);
          authorized=true;
          let second=await mod.preflight();
          assert.equal(second.providerGateStatus,'UNKNOWN_TOOL_AFTER_GATE');
          assert.equal(second.readyForApprovedArithmeticTest,true);
          assert.equal(second.operationExecuted,false);
          assert.equal(calls.length,4);
          assert.equal(calls.filter(x=>x.method==='tools/call').length,2);
          console.log('PASS: invalid credential distinguished from non-compute unknown-tool gate acceptance');
          console.log('PASS: no registered computational Axiom tool called');
          console.log('PASS: preflight does not enable account-metered execution');
          JS
