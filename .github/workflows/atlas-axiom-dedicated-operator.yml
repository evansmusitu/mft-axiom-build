name: ATLAS Dedicated Operator Authorization Contract
on:
  push:
    branches:
      - feature/atlas-axiom-dedicated-operator-20261024
    paths:
      - .github/workflows/atlas-axiom-dedicated-operator.yml
      - apps/musitu-atlas-groq/api/axiom/_contract.ts
      - apps/musitu-atlas-groq/api/axiom/preview.ts
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-operator-credential:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove Axiom private code separated from frontier credential
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {verifyApproval,authConfigured} from './apps/musitu-atlas-groq/api/axiom/_contract.ts';
          process.env.ATLAS_FRONTIER_ACCESS_CODE='frontier-legacy-secret-longer-than-24';
          process.env.ATLAS_AXIOM_OPERATOR_CODE='atlas-axiom-new-private-operator-secret';
          delete process.env.ATLAS_AXIOM_EXECUTE_ENABLED;
          delete process.env.AXIOM_MCP_BEARER_TOKEN;
          const digest='0'.repeat(64);
          assert.doesNotThrow(()=>verifyApproval('atlas-axiom-new-private-operator-secret',digest,true));
          assert.throws(()=>verifyApproval('frontier-legacy-secret-longer-than-24',digest,true),/Invalid private operator code/);
          assert.throws(()=>verifyApproval('incorrect-private-operator-secret',digest,true),/Invalid private operator code/);
          assert.throws(()=>verifyApproval('atlas-axiom-new-private-operator-secret',digest,false),/Approve/);
          assert.throws(()=>verifyApproval('atlas-axiom-new-private-operator-secret','broken-digest',true),/Preview digest/);
          assert.equal(authConfigured(),false);
          process.env.AXIOM_MCP_BEARER_TOKEN='an-entitled-service-credential-stub';
          assert.equal(authConfigured(),false);
          process.env.ATLAS_AXIOM_EXECUTE_ENABLED='enabled';
          assert.equal(authConfigured(),true);
          delete process.env.ATLAS_AXIOM_OPERATOR_CODE;
          assert.equal(authConfigured(),false);
          console.log('PASS: dedicated Axiom credential authenticates independently of frontier');
          console.log('PASS: rejected frontier and incorrect secrets');
          console.log('PASS: missing consent/digest blocks operation');
          console.log('PASS: account execution remains off without every separate gate');
          console.log('PASS: no provider, network, database or account compute calls');
          JS
