name: ATLAS Axiom Live Issuer Discovery Read-only
on:
  push:
    branches: [feature/atlas-axiom-oauth-owner-web-20261024]
    paths:
      - .github/workflows/atlas-axiom-issuer-observation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify official public issuer metadata without credentials
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://auth.mftintelligence.com';
          for(const path of ['/.well-known/oauth-authorization-server','/health']){
            let response;
            try{response=await fetch(base+path,{headers:{Accept:'application/json'},signal:AbortSignal.timeout(12000)});}
            catch(e){console.log('ISSUER_REACHABILITY_BLOCKED',path,String(e?.cause?.code||e?.name||'network_error'));process.exitCode=1;continue;}
            console.log('HTTP_STATUS',path,response.status);
            if(!response.ok){process.exitCode=1;continue;}
            let data;
            try{data=await response.json();}catch{console.log('ISSUER_RESPONSE_NOT_JSON',path);process.exitCode=1;continue;}
            if(path.includes('well-known')){
              if(data.issuer!==base||data.token_endpoint!==base+'/oauth/token'||
                 data.authorization_endpoint!==base+'/oauth/authorize'||
                 data.registration_endpoint!==base+'/oauth/register'||
                 !data.code_challenge_methods_supported?.includes('S256')||
                 !data.scopes_supported?.includes('axiom.execute')){
                console.log('ISSUER_METADATA_CONTRACT_INCOMPATIBLE');process.exitCode=1;
              }else console.log('ISSUER_METADATA_COMPATIBLE', 'scope=axiom.execute', 'pkce=S256');
            }else if(data.ok!==true||data.issuer!==base||data.resource!=='https://mcp.mftintelligence.com'){
              console.log('ISSUER_HEALTH_UNEXPECTED',Boolean(data.ok));process.exitCode=1;
            }else console.log('ISSUER_HEALTH_OK','read-only');
          }
          console.log('No account key, OAuth credentials, D1 writes, registered tools or Axiom compute used.');
          JS
