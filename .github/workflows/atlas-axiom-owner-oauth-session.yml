name: ATLAS Owner OAuth Session Contract
on:
  push:
    branches: [feature/atlas-axiom-oauth-owner-web-20261024]
    paths:
      - .github/workflows/atlas-axiom-owner-oauth-session.yml
      - apps/musitu-atlas-groq/api/axiom/**
      - apps/musitu-atlas-groq/src/AxiomDesk.tsx
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pkce-encrypted-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise PKCE, one-shot callback, encrypted tokens and refresh
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/atlas-owner-oauth-test
          mkdir -p "$ROOT/node_modules/@neondatabase/serverless"
          cp apps/musitu-atlas-groq/api/axiom/{_contract.ts,_rational.ts} "$ROOT/"
          for part in _ledger _oauth; do
            sed -e 's@./_contract.js@./_contract.ts@g' -e 's@./_ledger.js@./_ledger.ts@g' \
              "apps/musitu-atlas-groq/api/axiom/${part}.ts" > "$ROOT/${part}.ts"
          done
          printf '%s\n' '{"type":"module","name":"@neondatabase/serverless","exports":"./index.js"}' > "$ROOT/node_modules/@neondatabase/serverless/package.json"
          cat > "$ROOT/node_modules/@neondatabase/serverless/index.js" <<'STUB'
          export function neon(){
           return async (strings,...values)=>{
            const query=strings.join('?').trim();
            if(query.startsWith('SELECT')&&query.includes('FROM pg_roles r'))return [{
             can_read:true,can_insert:true,can_update:true,can_delete_attempt:false,can_delete_audit:false,can_delete_quota:false,
             can_create:false,privileged_member:false,superuser:false,can_create_roles:false,can_create_dbs:false,can_bypass_rls:false
            }];
            if(query.startsWith('INSERT INTO atlas_axiom_oauth_flows')){
             globalThis.__flow={hash:values[0],tenant:values[1],box:values[2],consumed:false};
             return [];
            }
            if(query.startsWith('UPDATE atlas_axiom_oauth_flows')){
             const f=globalThis.__flow;
             if(f&&f.hash===values[0]&&f.tenant===values[1]&&!f.consumed){f.consumed=true;return[{verifier_sealed:f.box}];}
             return [];
            }
            if(query.startsWith('INSERT INTO atlas_axiom_oauth_sessions')){
             globalThis.__session={tenant_id:values[0],client_id:values[1],access_sealed:values[2],refresh_sealed:values[3],scopes:values[4],expires_at:new Date(Date.now()+3600000).toISOString(),status:'ACTIVE'};
             return [];
            }
            if(query.startsWith('SELECT status,expires_at,scopes'))return globalThis.__session?[globalThis.__session]:[];
            if(query.startsWith('SELECT status,client_id,access_sealed'))return globalThis.__session?[globalThis.__session]:[];
            if(query.startsWith('UPDATE atlas_axiom_oauth_sessions SET status=\'REFRESHING\'')){
             if(globalThis.__session?.status!=='ACTIVE')return[];
             globalThis.__session.status='REFRESHING';
             return[{refresh_sealed:globalThis.__session.refresh_sealed}];
            }
            if(query.startsWith('UPDATE atlas_axiom_oauth_sessions')&&query.includes('SET access_sealed=')){
             const s=globalThis.__session;
             if(s?.status!=='REFRESHING')return[];
             Object.assign(s,{access_sealed:values[0],refresh_sealed:values[1],scopes:values[2],expires_at:new Date(Date.now()+3600000).toISOString(),status:'ACTIVE'});
             return[{tenant_id:s.tenant_id}];
            }
            if(query.startsWith('UPDATE atlas_axiom_oauth_sessions')&&query.includes('REAUTH_REQUIRED')){
             if(globalThis.__session)globalThis.__session.status='REAUTH_REQUIRED';
             return [];
            }
            throw Error('Unmocked SQL query: '+query.slice(0,140));
           };
          }
          STUB
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          process.env.ATLAS_AXIOM_DATABASE_URL='postgresql://unused.invalid/db';
          process.env.ATLAS_AXIOM_TENANT_ID='atlas-private-owner';
          process.env.ATLAS_AXIOM_OAUTH_ENABLED='enabled';
          process.env.ATLAS_AXIOM_OAUTH_CLIENT_ID='musitu_dcr_abcdefghijklmnopqrstu01';
          process.env.ATLAS_AXIOM_OAUTH_DATA_KEY=Buffer.alloc(32,7).toString('base64url');
          const base='file:///tmp/atlas-owner-oauth-test/';
          const {beginOAuth,finishOAuth,sessionStatus,oauthBearer,oauthConfigured}=await import(base+'_oauth.ts');
          let tokenCount=0,requests=[];
          globalThis.fetch=async (url,options)=>{
           requests.push(String(url));
           assert.equal(String(url),'https://auth.mftintelligence.com/oauth/token');
           const body=new URLSearchParams(options.body);
           assert.equal(body.get('resource'),'https://mcp.mftintelligence.com');
           assert.equal(body.get('client_id'),process.env.ATLAS_AXIOM_OAUTH_CLIENT_ID);
           assert.ok(['authorization_code','refresh_token'].includes(body.get('grant_type')));
           if(body.get('grant_type')==='authorization_code')assert.ok(body.get('code_verifier')?.length>=43);
           tokenCount++;
           return {ok:true,text:async()=>JSON.stringify({
             access_token:'musitu_oauth_at_fakeowner_'+tokenCount,
             refresh_token:'musitu_oauth_rt_fakeowner_'+tokenCount,
             token_type:'Bearer',expires_in:3600,scope:'axiom.execute',resource:'https://mcp.mftintelligence.com'
           })};
          };
          assert.equal(oauthConfigured(),true);
          const flow=await beginOAuth();
          const link=new URL(flow.authorizationUrl),state=link.searchParams.get('state');
          assert.equal(link.origin,'https://auth.mftintelligence.com');
          assert.equal(link.searchParams.get('scope'),'axiom.execute');
          assert.equal(link.searchParams.get('code_challenge_method'),'S256');
          assert.equal(link.searchParams.get('redirect_uri'),'https://musitu-atlas-ai-lab.vercel.app/api/axiom/capabilities');
          assert.equal(link.searchParams.get('code_challenge')?.length,43);
          assert.equal(state?.length,43);
          assert.ok(!JSON.stringify(globalThis.__flow).includes('musitu_oauth'));
          await assert.rejects(()=>finishOAuth({headers:{cookie:'atlas_axiom_oauth_state=invalid'}},
            'musitu_oauth_code_fakeownerabcdefghijklmnopqrst',state),/state mismatch/);
          assert.equal(tokenCount,0);
          const req={headers:{cookie:'atlas_axiom_oauth_state='+encodeURIComponent(state)}};
          const success=await finishOAuth(req,'musitu_oauth_code_fakeownerabcdefghijklmnopqrst',state);
          assert.equal(success.connected,true);
          assert.equal(tokenCount,1);
          assert.ok(!JSON.stringify(globalThis.__session).includes('musitu_oauth_at_fakeowner_1'));
          assert.equal((await sessionStatus()).connected,true);
          assert.equal(await oauthBearer(),'musitu_oauth_at_fakeowner_1');
          assert.equal(requests.length,1);
          await assert.rejects(()=>finishOAuth(req,'musitu_oauth_code_fakeownerabcdefghijklmnopqrst',state),/consumed/);
          globalThis.__session.expires_at=new Date(Date.now()-1000).toISOString();
          assert.equal(await oauthBearer(),'musitu_oauth_at_fakeowner_2');
          assert.equal(tokenCount,2);
          assert.equal(globalThis.__session.status,'ACTIVE');
          assert.equal((await sessionStatus()).connected,true);
          assert.equal((await sessionStatus()).accessTokenFresh,true);
          assert.equal((await sessionStatus()).renewalRequired,false);
          globalThis.__session.expires_at=new Date(Date.now()-5000).toISOString();
          const expiring=await sessionStatus();
          assert.equal(expiring.connected,true);
          assert.equal(expiring.accessTokenFresh,false);
          assert.equal(expiring.renewalRequired,true);
          assert.equal(expiring.status,'ACCESS_EXPIRED_OR_NEAR_EXPIRY');
          assert.equal(tokenCount,2,'read-only status must not trigger network refresh');
          process.env.ATLAS_AXIOM_OAUTH_ENABLED='disabled';
          assert.equal(oauthConfigured(),false);
          await assert.rejects(()=>oauthBearer(),/not activated/);
          assert.equal(requests.length,2);
          console.log('PASS: PKCE state, exact callback and expected issuer');
          console.log('PASS: browser state mismatch rejected before issuing token');
          console.log('PASS: OAuth callback one-time consumption');
          console.log('PASS: AES-GCM encrypted token storage, no raw tokens in database rows');
          console.log('PASS: one refresh exchange, precise expired-session status and disabled-owner fail-close');
          console.log('PASS: no actual MCP operations or external network were sent');
          JS
