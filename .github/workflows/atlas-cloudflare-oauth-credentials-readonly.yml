name: ATLAS Cloudflare OAuth Access Preflight (Read Only)
on:
  push:
    branches: [feature/atlas-axiom-oauth-owner-web-20261024]
    paths:
      - .github/workflows/atlas-cloudflare-oauth-credentials-readonly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudflare-access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_SCOPED_TOKEN: ${{ secrets.CLOUDFLARE_AXIOM_DEPLOY_TOKEN }}
    steps:
      - name: Check Cloudflare token without changing production
        env:
          ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
          D1_UUID: 504029cc-f9a5-495e-818f-63c6144b4ea4
        shell: bash
        run: |
          python3 - <<'PY'
          import os,sys,json,urllib.request,urllib.error
          token=os.getenv('CF_SCOPED_TOKEN','')
          summary=os.getenv('GITHUB_STEP_SUMMARY')
          def publish(message):
              print(message)
              if summary:
                  with open(summary,'a') as f:f.write(message+'\n')
          if not token:
              publish('**BLOCKED** — GitHub Actions secret CLOUDFLARE_AXIOM_DEPLOY_TOKEN not configured. No requests sent.')
              sys.exit(3)
          base='https://api.cloudflare.com/client/v4'
          def get(path):
              request=urllib.request.Request(base+path,headers={
                 'Authorization':'Bearer '+token,
                 'Accept':'application/json',
                 'User-Agent':'MUSITU-ATLAS-OAuth-ReadOnly-Diagnostics/1.0'
              },method='GET')
              try:
                  with urllib.request.urlopen(request,timeout=18) as response:
                      body=response.read(20000)
                      return response.status,json.loads(body or b'{}')
              except urllib.error.HTTPError as error:
                  return error.code,{}
              except Exception:
                  return 0,{}
          status,body=get('/user/tokens/verify')
          if status!=200 or body.get('success') is not True:
              publish('**BLOCKED** — Cloudflare bearer token verification failed. Check only its API Token value and validity; no DNS or Worker changes made.')
              sys.exit(4)
          publish('Cloudflare API bearer token: verified (no token value logged).')
          status,body=get('/accounts/'+os.environ['ACCOUNT_ID']+'/d1/database/'+os.environ['D1_UUID'])
          if status!=200 or body.get('success') is not True:
              publish('**BLOCKED** — Cloudflare D1 metadata access unavailable (HTTP '+str(status)+'). Account scope/D1 permissions need owner review.')
              sys.exit(5)
          publish('Cloudflare D1 target metadata: readable for authorized owner.')
          publish('PASS — read-only preflight. No schema, worker, DNS, zone or OAuth session changed.')
          PY
