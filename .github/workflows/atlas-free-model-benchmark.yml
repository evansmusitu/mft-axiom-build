name: ATLAS Free Model Benchmark
on:
  push:
    branches:
      - feature/atlas-zero-cost-gateway-benchmark-20261020
    paths:
      - '.github/workflows/atlas-free-model-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark-no-purchase:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Run identical 4-category tests on 2 already-configured Groq models
        shell: bash
        env:
          ATLAS_URL: https://musitu-atlas-groq.vercel.app
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json,urllib.request,urllib.error,time,datetime,os,re,pathlib
          tests=[
          {'id':'R1','category':'reasoning','prompt':'Four checks A, B, C, D must each run exactly once. A before B; C immediately after A; D last. What is the only possible ordering? Reply with exactly four letters separated by commas.','expected':'A,C,B,D'},
          {'id':'C1','category':'coding','prompt':'Evaluate this Python expression without running a tool: [n*n for n in [-3,-2,0,1,4] if n % 2 == 0]. Return ONLY a valid JSON array.','expected':'[4,0,16]'},
          {'id':'P1','category':'planning','prompt':'A founder has 7 days and $0 to validate a new AI customer-support tool with 2 potential small-business clients. Give a 3-step plan, one measurable acceptance check for each, and one risk you cannot verify without real customers. No fabricated data.','expected':None},
          {'id':'E1','category':'error recovery','prompt':'A payment API call timed out but could have charged a user; the webhook arrived twice. Explain a safe recovery procedure in 3 numbered steps. Must avoid duplicate charge and not claim payment succeeded without evidence.','expected':None}
          ]
          models=[('groq_fast','openai/gpt-oss-20b'),('groq_quality','openai/gpt-oss-120b')]
          base=os.environ['ATLAS_URL']
          rows=[]
          for t in tests:
            for key,model in models:
              payload={'mode':key,'prompt':t['prompt'],'approved':False}
              req=urllib.request.Request(base+'/api/model-test',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json','Accept':'application/json'},method='POST')
              start=time.perf_counter()
              try:
                with urllib.request.urlopen(req,timeout=68) as res:
                  data=json.load(res);status=res.status
              except urllib.error.HTTPError as ex:
                status=ex.code;data={'error':ex.read().decode(errors='replace')[:300]}
              except Exception as ex:
                status=None;data={'error':str(ex)[:250]}
              latency=round((time.perf_counter()-start)*1000)
              answer=data.get('answer','')
              objective=None
              if status==200 and t['id']=='R1':
                objective=re.sub(r'[^ABCD]','',answer.upper())=='ACBD'
              if status==200 and t['id']=='C1':
                try:
                  v=json.loads(re.sub(r'^\x60\x60\x60(?:json)?|\x60\x60\x60$','',answer.strip(),flags=re.I).strip())
                  objective=v==[4,0,16]
                except Exception: objective=False
              row={'case':t['id'],'category':t['category'],'model':model,'status':status,'latencyMs':latency,'reportedLatencyMs':data.get('latencyMs'),'answerWords':data.get('answerWords'),'objectivePass':objective,'providerCostUsd':None,'gatewayCreditUsedUsd':0,'answer':answer,'error':data.get('error'), 'measuredAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              rows.append(row)
              print(f"{t['id']}/{model}: status={status}, elapsed={latency} ms, objective={objective}",flush=True)
          pathlib.Path('output/benchmark.json').write_text(json.dumps({'experiment':'ATLAS free baseline','suiteVersion':'1.0','costNote':'No Vercel AI Gateway requests. Provider billing not reported by sandbox endpoint; gateway credit debited = $0.','rows':rows},indent=2))
          summary=['# ATLAS free sandbox baseline','', 'Models: '+', '.join(x[1] for x in models),'', '| Case | Model | HTTP | Latency ms | Deterministic check |','|---|---|---:|---:|---|']
          for r in rows:
            summary.append(f"| {r['case']} / {r['category']} | {r['model']} | {r['status']} | {r['latencyMs']} | {str(r['objectivePass']) if r['objectivePass'] is not None else 'Not scored automatically'} |")
          summary.extend(['','Planning and recovery require independent human review; no invented automatic score.','Gateway credit consumption: $0; Groq provider billing not returned and should not be claimed free without account verification.','Unconfigured Gemini, OpenRouter, GPT-6 and Claude were **not tested**.'])
          pathlib.Path('output/benchmark.md').write_text('\n'.join(summary)+'\n')
          assert len(rows)==8
          print('BENCHMARK COMPLETE: 8 attempts; outputs stored in artifacts',flush=True)
          PY
      - name: Publish reproducible results privately as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-atlas-free-baseline
          path: output/
          if-no-files-found: warn
          retention-days: 30
