name: ATLAS Independent Rational Proof Gate
on:
  push:
    branches:
      - feature/atlas-axiom-independent-verification-20261020
    paths:
      - '.github/workflows/atlas-independent-rational-proof.yml'
      - 'apps/musitu-atlas-groq/api/axiom/_rational.ts'
      - 'apps/musitu-atlas-groq/api/axiom/verify.ts'
      - 'apps/musitu-atlas-groq/api/axiom/execute.ts'
      - 'apps/musitu-atlas-groq/src/IndependentProof.tsx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate exact arithmetic, deterministic evidence and failure handling
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {computeRational,exactFraction,decimalDisplay,compareProvider,evaluate} from './apps/musitu-atlas-groq/api/axiom/_rational.ts';
          import {hashPayload,parseExpression} from './apps/musitu-atlas-groq/api/axiom/_contract.ts';
          const successful={
            '(2+3)*4':'20', '0.1+0.2':'3/10', '1/3+2/3':'1',
            '(2^3)^2':'64','2^3^2':'512','-2^2':'-4',
            '(-2)^3':'-8','2^-3':'1/8','12%5':'2',
            '1.5/0.5':'3','1/8':'1/8','0':'0',
            '-(1+2)*3':'-9', '1-(2-3)':'2', '.5+.25':'3/4',
            '1/3':'1/3', '5/2':'5/2'
          };
          for(const [expr,expected] of Object.entries(successful)){
            assert.equal(exactFraction(computeRational(expr)),expected,expr);
          }
          assert.deepEqual(decimalDisplay(computeRational('1/8')),{text:'0.125',rounded:false});
          assert.equal(decimalDisplay(computeRational('1/3')).rounded,true);
          assert.equal(compareProvider(computeRational('0.1+0.2'),'0.3000000000000000000000000').match,true);
          assert.equal(compareProvider(computeRational('0.1+0.2'),'0.30001').match,false);
          assert.equal(compareProvider(computeRational('(2+3)*4'),'20.0000000000000000000').exactAgreement,true);
          const proof=evaluate('(2+3)*4','20');
          assert.equal(proof.exact,'20');
          assert.equal(proof.comparison.match,true);
          assert.equal(hashPayload(parseExpression('(2+3)*4')),hashPayload(parseExpression('(2+3)*4')));
          for(const expr of ['1/0','(1+2','1+2)','0^0','0^-1','(1/2)%2','2^19','1+a','1;DROP TABLE','2**3','','('.repeat(16)+'1'+')'.repeat(16),'9'.repeat(150)])assert.throws(()=>computeRational(expr),expr);
          for(const unsafe of ['process.exit()','2;DROP TABLE','../../etc/passwd','1+abc'])assert.throws(()=>parseExpression(unsafe));
          console.log('PASS: '+Object.keys(successful).length+' exact expected values');
          console.log('PASS: finite-decimal, repeating-decimal and precision checks');
          console.log('PASS: independent provider comparison rejects incorrect numbers');
          console.log('PASS: arithmetic bounds, malformed input and injection rejection');
          console.log('PASS: no external network, model or Axiom API calls required');
          JS
