name: ATLAS Multi-Model Lab Gate Test
on:
  push:
    branches:
      - frontier/atlas-provider-orchestrator-20261019
    paths:
      - '.github/workflows/atlas-model-lab-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-model-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate model lab endpoints without incurring paid provider charges
        shell: bash
        env:
          LAB: https://musitu-atlas-groq-2lqwdj409-evansmusitu.vercel.app
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          root=os.environ['LAB'].rstrip('/')
          def check(path,payload=None):
              raw=None if payload is None else json.dumps(payload).encode()
              headers={'Accept':'application/json'}
              if raw is not None:headers['Content-Type']='application/json'
              req=urllib.request.Request(root+path,headers=headers,data=raw,method='POST' if raw is not None else 'GET')
              try:
                  with urllib.request.urlopen(req,timeout=25) as f:return f.status,json.load(f)
              except urllib.error.HTTPError as ex:
                  try:return ex.code,json.loads(ex.read())
                  except:return ex.code,{}
          code,models=check('/api/models')
          assert code==200 and len(models.get('models',[]))==6,(code,models)
          print('PASS: six provider models correctly catalogued')
          common='Explain one measurable step for improving a business website'
          for model in ('openai_sol','openai_astra','claude_sonnet','claude_opus'):
              code,out=check('/api/model-test',{'mode':model,'prompt':common,'approved':True,'accessCode':'NOT_THE_SECRET'})
              assert code==403 and 'error' in out,(model,code,out)
              print('PASS: '+model+' cannot incur charges without secure activation')
          code,out=check('/api/model-test',{'mode':'fake-model','prompt':common})
          assert code==400 and 'error' in out,(code,out)
          print('PASS: invalid model selection rejected')
          code,out=check('/api/model-test',{'mode':'groq_fast','prompt':'short'})
          assert code==400 and 'error' in out,(code,out)
          print('PASS: underspecified test prompt rejected before model invocation')
          print('ALL LAB GATE TESTS PASSED')
          PY
