name: ATLAS Axiom OAuth Redirect Isolation
on:
  push:
    branches: [feature/atlas-axiom-oauth-owner-web-20261024]
    paths:
      - auth/musitu_axiom_oauth_worker.mjs
      - .github/workflows/atlas-oauth-redirect-isolation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enforce exact ATLAS callback only under separate issuer opt-in
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const {allowedRedirect,ATLAS_OAUTH_REDIRECT,ATLAS_OAUTH_CLIENT_NAME}=await import('./auth/musitu_axiom_oauth_worker.mjs');
          const enabled={atlasEnabled:true},disabled={atlasEnabled:false};
          assert.equal(allowedRedirect(ATLAS_OAUTH_REDIRECT,disabled,ATLAS_OAUTH_CLIENT_NAME),false);
          assert.equal(allowedRedirect(ATLAS_OAUTH_REDIRECT,enabled,ATLAS_OAUTH_CLIENT_NAME),true);
          const dangerous=[
            'http://musitu-atlas-ai-lab.vercel.app/api/axiom/capabilities',
            'https://musitu-atlas-ai-lab.vercel.app.evil.example/api/axiom/capabilities',
            'https://musitu-atlas-ai-lab.vercel.app/api/axiom/capabilities?override=1',
            'https://musitu-atlas-ai-lab.vercel.app/api/axiom/execute',
            'https://evil.example/',
            'javascript:alert(1)',
            'https://musitu-atlas-ai-lab.vercel.app/api/axiom/capabilities#override',
            'https://musitu-atlas-ai-lab.vercel.app@evil.example/api/axiom/capabilities'
          ];
          for(const u of dangerous)assert.equal(allowedRedirect(u,enabled,ATLAS_OAUTH_CLIENT_NAME),false,u);
          assert.equal(allowedRedirect(ATLAS_OAUTH_REDIRECT,enabled,'Random Client'),false);
          assert.equal(allowedRedirect('https://chatgpt.com/connector/oauth/authorized',enabled,'ChatGPT'),true);
          assert.equal(allowedRedirect('https://chatgpt.com/connector/oauth/authorized',disabled,'ChatGPT'),true);
          assert.equal(allowedRedirect('https://attacker.chatgpt.com/connector/oauth/authorized',enabled,'ChatGPT'),false);
          assert.equal(allowedRedirect('https://chatgpt.com@evil.example/connector/oauth/authorized',enabled,'ChatGPT'),false);
          console.log('PASS: dedicated ATLAS exact redirect opt-in and ChatGPT redirects unchanged');
          console.log('PASS: external redirects and hostname/path impersonation blocked');
          JS
