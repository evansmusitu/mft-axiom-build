name: ATLAS Proof Endpoint and Replay Contract
on:
  push:
    branches:
      - feature/atlas-axiom-independent-verification-20261020
    paths:
      - .github/workflows/atlas-proof-endpoint-contract.yml
      - apps/musitu-atlas-groq/api/axiom/_rational.ts
      - apps/musitu-atlas-groq/api/axiom/verify.ts
      - apps/musitu-atlas-groq/src/IndependentProof.tsx
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise actual server handler contracts without calling Axiom or AI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas-proof
          cp apps/musitu-atlas-groq/api/axiom/{_rational.ts,_contract.ts} /tmp/atlas-proof/
          for file in verify; do
            sed -e 's@./_contract.js@./_contract.ts@g' -e 's@./_rational.js@./_rational.ts@g' apps/musitu-atlas-groq/api/axiom/$file.ts > /tmp/atlas-proof/$file.ts
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const {default:verify}=await import('file:///tmp/atlas-proof/verify.ts');
          const replay=verify;
          function invoke(handler,body,method='POST'){
           const res={statusCode:200,headers:{},data:null,
             setHeader(k,v){this.headers[k]=v;return this;},
             status(v){this.statusCode=v;return this;},
             json(v){this.data=v;return this;}};
           handler({method,body},res);
           return res;
          }
          const proof=invoke(verify,{expression:'0.1+0.2'});
          assert.equal(proof.statusCode,200);
          assert.equal(proof.data.status,'INDEPENDENT_ATLAS_COMPUTATION');
          assert.equal(proof.data.proof.exact,'3/10');
          assert.equal(proof.data.providerWasCalled,false);
          assert.equal(proof.data.modelWasCalled,false);
          assert.equal(proof.data.chargedComputeUnits,0);
          assert.match(proof.data.evidenceSha256,/^[0-9a-f]{64}$/);
          console.log('PASS: actual read/write-free proof endpoint and stable evidence digest');
          const good=invoke(replay,{action:'replay',receipt:proof.data});
          assert.equal(good.statusCode,200);
          assert.equal(good.data.status,'PROOF_REPLAY_CONSISTENT');
          assert.equal(good.data.recomputedExact,'3/10');
          console.log('PASS: exported receipt survives independent replay');
          const corrupt=structuredClone(proof.data);corrupt.proof.exact='99999';
          const bad=invoke(replay,{action:'replay',receipt:corrupt});
          assert.equal(bad.statusCode,409);
          console.log('PASS: changed exact answer rejected');
          const mutated=structuredClone(proof.data);mutated.evidenceSha256='0'.repeat(64);
          assert.equal(invoke(replay,{action:'replay',receipt:mutated}).statusCode,409);
          console.log('PASS: changed integrity digest rejected');
          assert.equal(invoke(verify,{expression:'process.exit()'}).statusCode,400);
          assert.equal(invoke(verify,{expression:'(1/0)'}).statusCode,400);
          console.log('PASS: invalid code and division-by-zero rejected');
          const provided=invoke(verify,{expression:'(2+3)*4',providerResult:'21'});
          assert.equal(provided.data.proof.comparison.match,false);
          assert.equal(invoke(replay,{action:'replay',receipt:provided.data}).statusCode,200);
          console.log('PASS: disagreeing provider is accurately marked as mismatch without invented verification');
          console.log('PROOF + REPLAY CONTRACT PASSED: zero remote Axiom or AI calls');
          JS
