name: AXIOM 12ui Isolated Design
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: axiom-12ui-isolated-design
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == 'refs/heads/design/axiom-12ui-isolated-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TWELVE_UI_API_KEY: ${{ secrets.TWELVE_UI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed on missing 12ui credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TWELVE_UI_API_KEY"
          echo "::add-mask::$TWELVE_UI_API_KEY"
      - name: Install pinned 12ui CLI
        shell: bash
        run: |
          set -euo pipefail
          npx -y @12ui/design@0.2.70 cli install
          12ui --version
          12ui auth status || true
      - name: Generate four isolated AXIOM design candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/axiom-12ui
          CONCEPT="$(cat design/axiom-12ui/CONCEPT.txt)"
          12ui draft --concept "$CONCEPT" --candidates 4 --aspect landscape --wait | tee /tmp/axiom-12ui/draft.log
          RUN_DIR="$(head -n 1 /tmp/axiom-12ui/draft.log)"
          test -d "$RUN_DIR"
          cp -R "$RUN_DIR" /tmp/axiom-12ui/run
      - name: Upload candidate evidence only
        uses: actions/upload-artifact@v4
        with:
          name: axiom-12ui-isolated-draft-candidates
          path: /tmp/axiom-12ui/**
          if-no-files-found: error
          retention-days: 14

  isolation-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert no production integration in isolated design workspace
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -nE 'wrangler deploy|cloudflare|mcp\.mftintelligence\.com|auth\.mftintelligence\.com|payments\.mftintelligence\.com' design/axiom-12ui .github/workflows/axiom-12ui-isolated-design.yml
