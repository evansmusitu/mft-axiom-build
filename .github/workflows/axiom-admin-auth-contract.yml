name: MFT Axiom Admin Authorization Contract

on:
  push:
    paths:
      - '.github/workflows/axiom-admin-auth-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct protected source
        env:
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          P=deploy_payload/runtime_min
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > runtime.enc.b64
          base64 -d runtime.enc.b64 > runtime.tar.gz.enc
          test "$(sha256sum runtime.tar.gz.enc | awk '{print $1}')" = 'b82448d6b4b34b302748815af976b535d69922c197d4b7a9056fc2f91a9e12cf'
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in runtime.tar.gz.enc -out runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          test "$(sha256sum runtime.tar.gz | awk '{print $1}')" = 'b4d5a0266446523969a619f5e9bb5a04d9b815c78a2ab82ed046ef5e23d53663'
          mkdir runtime && tar -xzf runtime.tar.gz -C runtime
      - name: Emit admin authorization metadata only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re
          idx=pathlib.Path('runtime/worker/src/index.js').read_text(errors='replace')
          db=pathlib.Path('runtime/worker/src/db.js').read_text(errors='replace')
          pos=idx.find('/v1/admin/customers')
          if pos<0: raise SystemExit('route missing')
          w=idx[max(0,pos-7000):min(len(idx),pos+9000)]
          # Safe literal metadata only.
          headers=sorted(set(x.lower() for x in re.findall(r'["\'](x-[a-z0-9-]+|authorization)["\']',w,re.I)))
          calls=sorted(set(re.findall(r'\b([A-Za-z_$][\w$]*)\s*\(',w)))
          relevant_calls=[x for x in calls if re.search(r'auth|admin|principal|customer|key|control|forbid|require|create|list',x,re.I)]
          props=sorted(set(re.findall(r'\b(?:principal|auth|actor|ctx)\.([A-Za-z_$][\w$]*)\b',w)))
          string_vals=sorted(set(x for x in re.findall(r'["\']([A-Za-z_][A-Za-z0-9_-]{2,40})["\']',w) if re.search(r'admin|internal|control|customer|owner|role|kind|mode',x,re.I)))
          helpers=[]
          combined=idx+'\n'+db
          for m in re.finditer(r'(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(([^)]*)\)',combined):
              n=m.group(1)
              if re.search(r'auth|admin|principal|control|customer|key',n,re.I):
                  helpers.append({'name':n,'params':[x.strip().split('=')[0].strip() for x in m.group(2).split(',') if x.strip()]})
          out={'schema':'mft.axiom.admin_auth_contract.v1','route':'/v1/admin/customers','header_literals':headers,'relevant_call_names':relevant_calls,'principal_auth_properties':props,'authorization_string_literals':string_vals,'helper_signatures':helpers,'plaintext_source_committed':False}
          pathlib.Path('admin-auth-contract.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mft-axiom-admin-auth-contract
          path: admin-auth-contract.json
          retention-days: 7
