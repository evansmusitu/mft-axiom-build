name: MFT Axiom Admin Create Customer Contract

on:
  push:
    paths:
      - '.github/workflows/axiom-admin-create-customer-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct protected source
        env:
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          P=deploy_payload/runtime_min
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > runtime.enc.b64
          base64 -d runtime.enc.b64 > runtime.tar.gz.enc
          test "$(sha256sum runtime.tar.gz.enc | awk '{print $1}')" = 'b82448d6b4b34b302748815af976b535d69922c197d4b7a9056fc2f91a9e12cf'
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in runtime.tar.gz.enc -out runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          test "$(sha256sum runtime.tar.gz | awk '{print $1}')" = 'b4d5a0266446523969a619f5e9bb5a04d9b815c78a2ab82ed046ef5e23d53663'
          mkdir runtime && tar -xzf runtime.tar.gz -C runtime
      - name: Emit customer creation metadata only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re
          src='\n'.join(p.read_text(errors='replace') for p in pathlib.Path('runtime/worker/src').glob('*.js'))
          def body(name):
              m=re.search(r'(?:async\s+)?function\s+'+re.escape(name)+r'\s*\([^)]*\)\s*\{',src)
              if not m:return ''
              st=m.end()-1;d=0;q=None;e=False
              for i in range(st,len(src)):
                  c=src[i]
                  if q:
                      if e:e=False
                      elif c=='\\':e=True
                      elif c==q:q=None
                      continue
                  if c in "'\"`":q=c;continue
                  if c=='{':d+=1
                  elif c=='}':
                      d-=1
                      if d==0:return src[st+1:i]
              return ''
          b=body('adminCreateCustomer')
          if not b: raise SystemExit('adminCreateCustomer missing')
          calls=sorted(set(re.findall(r'\b([A-Za-z_$][\w$]*)\s*\(',b)))
          # Discover variable assigned from request.json(), then only report properties read from it.
          jm=re.search(r'\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*await\s+request\.json\s*\(\s*\)',b)
          jvar=jm.group(1) if jm else None
          body_props=sorted(set(re.findall(r'\b'+re.escape(jvar)+r'\.([A-Za-z_$][\w$]*)\b',b))) if jvar else []
          literals=sorted(set(x for x in re.findall(r'["\']([^"\']{1,80})["\']',b) if re.search(r'forbid|required|invalid|customer|plan|email|name|status|active|internal|control|key',x,re.I)))
          env_names=sorted(set(re.findall(r'\benv\.([A-Z][A-Z0-9_]*)',b)))
          sql_ops=sorted(set(re.findall(r'\b(INSERT|UPDATE|DELETE|SELECT)\b',b,re.I)))
          return_keys=[]
          for m in re.finditer(r'\breturn\s+json\s*\(\s*\{([^{}]{0,1200})\}',b,re.S):
              return_keys.append(sorted(set(re.findall(r'([A-Za-z_$][\w$]*)\s*:',m.group(1)))))
          result={'schema':'mft.axiom.admin_create_customer_contract.v1','called_functions':[x for x in calls if re.search(r'internal|auth|json|customer|key|id|now|plan|hash|random|uuid',x,re.I)],'request_json_var_present':bool(jvar),'body_properties':body_props,'relevant_string_literals':literals,'env_bindings':env_names,'sql_operations':sql_ops,'return_object_key_sets':return_keys,'plaintext_source_committed':False}
          pathlib.Path('admin-create-customer-contract.json').write_text(json.dumps(result,indent=2,sort_keys=True))
          print(json.dumps(result,sort_keys=True))
          PY
