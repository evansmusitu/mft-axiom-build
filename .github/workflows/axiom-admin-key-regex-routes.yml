name: MFT Axiom Admin Key Regex Routes

on:
  push:
    paths:
      - '.github/workflows/axiom-admin-key-regex-routes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct protected source
        env:
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          P=deploy_payload/runtime_min
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > runtime.enc.b64
          base64 -d runtime.enc.b64 > runtime.tar.gz.enc
          test "$(sha256sum runtime.tar.gz.enc | awk '{print $1}')" = 'b82448d6b4b34b302748815af976b535d69922c197d4b7a9056fc2f91a9e12cf'
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in runtime.tar.gz.enc -out runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          test "$(sha256sum runtime.tar.gz | awk '{print $1}')" = 'b4d5a0266446523969a619f5e9bb5a04d9b815c78a2ab82ed046ef5e23d53663'
          mkdir runtime && tar -xzf runtime.tar.gz -C runtime
      - name: Emit route regex sources only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re
          s=pathlib.Path('runtime/worker/src/index.js').read_text(errors='replace')
          out={}
          for fn in ['adminIssueKey','adminRotateKey','adminRevokeKey']:
              pats=[]
              for m in re.finditer(r'\b'+fn+r'\s*\(',s):
                  prefix=s[max(0,m.start()-40):m.start()]
                  if re.search(r'function\s+$',prefix): continue
                  w=s[max(0,m.start()-2200):m.start()+300]
                  # Capture regex literal passed to pathname.match without exposing surrounding code.
                  for rm in re.finditer(r'pathname\.match\s*\(\s*/((?:\\.|[^/]){1,260})/[gimsuy]*\s*\)',w):
                      pat=rm.group(1)
                      if 'v1' in pat or 'admin' in pat or 'customers' in pat or 'keys' in pat:
                          pats.append(pat)
              out[fn]=sorted(set(pats))
          result={'schema':'mft.axiom.admin_key_regex_routes.v1','routes':out,'plaintext_source_committed':False}
          pathlib.Path('admin-key-regex-routes.json').write_text(json.dumps(result,indent=2,sort_keys=True))
          print(json.dumps(result,sort_keys=True))
          PY
