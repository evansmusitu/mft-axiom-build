name: AXIOM scoped anchor credential qualification
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/axiom-anchor-credential-20261102.yml']
permissions:
  contents: read
concurrency:
  group: axiom-anchor-credential-20261102
  cancel-in-progress: false
jobs:
  scoped-credentials:
    if: github.event.pull_request.head.sha == '13a8819247000a155526ffb7516affa5abcedd05' && github.repository == 'evansmusitu/mft-axiom-build' && github.event.pull_request.number == 55 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'repair/axiom-whole-system-20261029' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit the approved credential-check parent
        run: test "$(git rev-parse HEAD^)" = 3fef797df176adac6ff3c14314fa78064b12a6ef
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.12.0'
      - name: Verify scoped writer and read-only credentials without inference or Cloudflare
        env:
          AXIOM_GITHUB_ANCHOR_WRITE_TOKEN: ${{ secrets.AXIOM_GITHUB_ANCHOR_WRITE_TOKEN }}
          AXIOM_GITHUB_ANCHOR_READ_TOKEN: ${{ secrets.AXIOM_GITHUB_ANCHOR_READ_TOKEN }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node qualification/whole-system-20261029/github-anchor-credential-preflight.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: axiom-anchor-scoped-credential-evidence
          path: qualification/whole-system-20261029/anchor-credential-results/report.json
          retention-days: 90
          if-no-files-found: error
