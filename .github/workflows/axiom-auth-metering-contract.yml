name: MFT Axiom Authentication Metering Contract

on:
  push:
    paths:
      - '.github/workflows/axiom-auth-metering-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct protected source
        env:
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          P=deploy_payload/runtime_min
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > runtime.enc.b64
          base64 -d runtime.enc.b64 > runtime.tar.gz.enc
          test "$(sha256sum runtime.tar.gz.enc | awk '{print $1}')" = 'b82448d6b4b34b302748815af976b535d69922c197d4b7a9056fc2f91a9e12cf'
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in runtime.tar.gz.enc -out runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          test "$(sha256sum runtime.tar.gz | awk '{print $1}')" = 'b4d5a0266446523969a619f5e9bb5a04d9b815c78a2ab82ed046ef5e23d53663'
          mkdir runtime && tar -xzf runtime.tar.gz -C runtime
      - name: Emit non-source authentication and metering metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re
          files={p.name:p.read_text(errors='replace') for p in pathlib.Path('runtime/worker/src').glob('*.js')}
          s='\n'.join(files.values())
          control_occ=sum(t.lower().count('x-mft-control') for t in files.values())
          usage_occ=sum(t.count('usage_events') for t in files.values())
          # Bounded contexts around control and usage references; report only identifiers/branch markers.
          control_meta=[]
          usage_meta=[]
          for name,t in files.items():
              low=t.lower()
              for needle,dst in [('x-mft-control',control_meta),('usage_events',usage_meta)]:
                  start=0
                  while True:
                      i=(low if needle=='x-mft-control' else t).find(needle,start)
                      if i<0: break
                      w=t[max(0,i-1800):min(len(t),i+2600)]
                      dst.append({
                        'file':name,
                        'nearby_identifiers':sorted(set(re.findall(r'\b(?:auth|principal|customer|customerId|apiKey|keyHash|control|internal|meter|usage|units|plan|kind|role|mode|bypass|admin|usageEvent|usage_event|usage_events)\b',w,re.I)),key=str.lower),
                        'has_if':bool(re.search(r'\bif\s*\(',w)),
                        'has_else':bool(re.search(r'\belse\b',w)),
                        'has_return':bool(re.search(r'\breturn\b',w)),
                        'has_insert':bool(re.search(r'\bINSERT\s+INTO\b',w,re.I)),
                        'has_usage_insert':bool(re.search(r'INSERT\s+INTO\s+usage_events',w,re.I)),
                        'has_customer_guard':bool(re.search(r'if\s*\([^)]*customer',w,re.I)),
                        'has_control_guard':bool(re.search(r'if\s*\([^)]*control',w,re.I)),
                      })
                      start=i+len(needle)
          # Admin/customer route metadata only.
          route_meta=[]
          for name,t in files.items():
              for route in ['/v1/admin/customers','/v1/account','/v1/usage']:
                  if route in t:
                      pos=t.find(route); w=t[max(0,pos-2200):min(len(t),pos+4200)]
                      route_meta.append({
                        'file':name,'route':route,
                        'methods':sorted(set(re.findall(r"request\.method\s*(?:===|==)\s*['\"]([A-Z]+)['\"]",w))),
                        'body_property_names':sorted(set(re.findall(r'\bbody\.([A-Za-z_$][\w$]*)\b',w))),
                        'result_property_names':sorted(set(re.findall(r'\b(?:result|out|response|created)\.([A-Za-z_$][\w$]*)\b',w))),
                        'mentions_api_key':bool(re.search(r'api[_-]?key',w,re.I)),
                        'mentions_customer':bool(re.search(r'customer',w,re.I)),
                        'mentions_control':bool(re.search(r'control',w,re.I)),
                      })
          out={
            'schema':'mft.axiom.auth_metering_contract.v1',
            'control_header_occurrences':control_occ,
            'usage_events_occurrences':usage_occ,
            'control_contexts':control_meta,
            'usage_contexts':usage_meta,
            'route_metadata':route_meta,
            'plaintext_source_committed':False
          }
          pathlib.Path('auth-metering-contract.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mft-axiom-auth-metering-contract
          path: auth-metering-contract.json
          retention-days: 7
