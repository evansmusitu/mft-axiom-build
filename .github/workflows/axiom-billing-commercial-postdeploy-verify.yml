name: MUSITU Axiom Billing Commercial Post-Deploy Verify

# Read-only production verification; changing this comment intentionally re-runs the gate.
on:
  push:
    paths:
      - '.github/workflows/axiom-billing-commercial-postdeploy-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      D1_UUID: 504029cc-f9a5-495e-818f-63c6144b4ea4
      AUTHORITY: mft-phase8-external-authority
      TRANSPORT: mft-paynow-transport-gateway
      BILLING: mft-axiom-billing-ingress
      ROUTE: payments.mftintelligence.com/billing/*
      BASE: https://payments.mftintelligence.com
    steps:
      - uses: actions/checkout@v4
      - name: Verify production commercial billing invariants read-only
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,urllib.error,urllib.parse,urllib.request
          api=os.environ['CF_API'];aid=os.environ['ACCOUNT_ID'];zid=os.environ['ZONE_ID'];dbid=os.environ['D1_UUID'];auth=os.environ['AUTHORITY'];transport=os.environ['TRANSPORT'];billing=os.environ['BILLING'];route=os.environ['ROUTE'];base=os.environ['BASE']
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'Accept':'application/json','User-Agent':'MUSITU-Axiom-Billing-Commercial-Independent-Verify/1.0'}
          def http(url,method='GET',headers=None,body=None):
              q=urllib.request.Request(url,headers=dict(headers or {}),method=method,data=body)
              try:
                  with urllib.request.urlopen(q,timeout=35) as r:return r.status,r.headers,r.read()
              except urllib.error.HTTPError as e:return e.code,e.headers,e.read()
          def cf(path,method='GET',obj=None):
              h=dict(H);body=None
              if obj is not None:h['Content-Type']='application/json';body=json.dumps(obj,separators=(',',':')).encode()
              c,hh,b=http(api+path,method,h,body)
              if not 200<=c<300:raise SystemExit(f'FAIL Cloudflare HTTP {c} {path}')
              x=json.loads(b or b'{}')
              if isinstance(x,dict) and x.get('success') is False:raise SystemExit('FAIL Cloudflare success=false '+path)
              return x.get('result') if isinstance(x,dict) else None
          def live(path,method='GET',body=None,ctype=None,authz=None):
              h={'Accept':'application/json','User-Agent':'MUSITU-Axiom-Billing-Commercial-Independent-Verify/1.0'}
              if ctype:h['Content-Type']=ctype
              if authz:h['Authorization']=authz
              return http(base+path,method,h,body)
          def jobj(b):
              try:return json.loads(b or b'{}')
              except:return {}
          def d1(sql):
              x=cf(f'/accounts/{aid}/d1/database/{dbid}/query','POST',{'sql':sql});rows=[]
              for rr in x or []:rows.extend(rr.get('results') or [])
              return rows
          def source(script,needle):
              c,hh,raw=http(f'{api}/accounts/{aid}/workers/scripts/{urllib.parse.quote(script,safe="")}',headers=H)
              if c!=200:raise SystemExit('FAIL source read '+script)
              src=raw;ct=hh.get('content-type','')
              if 'multipart/' in ct.lower():
                  msg=email.message_from_bytes((f'Content-Type: {ct}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw);parts=[]
                  for p in msg.walk():
                      if p.is_multipart():continue
                      d=p.get_payload(decode=True) or b''
                      if needle.encode() in d:parts.append(d)
                  if len(parts)!=1:raise SystemExit('FAIL source module parse '+script)
                  src=parts[0]
              return src
          checks={}
          c,_,b=live('/billing/healthz');o=jobj(b);checks['health_http']=c;checks['health_ok']=o.get('ok');checks['catalog_configured']=o.get('catalog_configured');checks['checkout_enabled']=o.get('checkout_enabled');checks['live_money_certified']=o.get('live_money_certified');checks['provider']=o.get('provider')
          if not(c==200 and o.get('ok') is True and o.get('catalog_configured') is True and o.get('checkout_enabled') is True and o.get('live_money_certified') is False and o.get('provider')=='paynow'):raise SystemExit('FAIL health contract')
          c,_,b=live('/billing/catalog');o=jobj(b);checks['catalog_http']=c;plans=o.get('plans') or []
          expected=[('developer','axiom-developer-monthly',1900,1000),('pro','axiom-pro-monthly',4900,5000),('enterprise','axiom-enterprise-monthly',14900,25000)]
          got=[(p.get('id'),p.get('price_id'),p.get('amount_cents'),p.get('monthly_unit_limit')) for p in plans]
          checks['catalog']=got
          if c!=200 or got!=expected or any(p.get('currency')!='USD' for p in plans):raise SystemExit('FAIL catalog contract')
          c,_,_=live('/billing/checkout','POST',b'{"plan":"developer"}','application/json');checks['checkout_noauth_http']=c
          if c!=401:raise SystemExit('FAIL checkout noauth')
          c,_,_=live('/billing/checkout','POST',b'{"plan":"developer"}','application/json','Bearer invalid-invalid-invalid');checks['checkout_badbearer_http']=c
          if c!=401:raise SystemExit('FAIL checkout bad bearer')
          wb=d1('SELECT count(*) AS n FROM webhook_events;')[0]['n'];sb=d1('SELECT count(*) AS n FROM billing_subscriptions;')[0]['n'];ib=d1('SELECT count(*) AS n FROM billing_checkout_intents;')[0]['n']
          invalid=('status=Paid&reference=INDEPENDENTNEGATIVE&amount=19.00&hash='+'0'*128).encode();c,_,_=live('/billing/webhooks/paynow','POST',invalid,'application/x-www-form-urlencoded');checks['invalid_webhook_http']=c
          wa=d1('SELECT count(*) AS n FROM webhook_events;')[0]['n'];sa=d1('SELECT count(*) AS n FROM billing_subscriptions;')[0]['n'];ia=d1('SELECT count(*) AS n FROM billing_checkout_intents;')[0]['n'];checks['invalid_webhook_mutation']=(wb!=wa or sb!=sa or ib!=ia)
          if c!=400 or checks['invalid_webhook_mutation']:raise SystemExit('FAIL invalid webhook mutation')
          routes=cf(f'/zones/{zid}/workers/routes') or [];exact=[r for r in routes if isinstance(r,dict) and r.get('pattern')==route and r.get('script')==billing];checks['exact_route_count']=len(exact)
          if len(exact)!=1:raise SystemExit('FAIL route invariant')
          bset=cf(f'/accounts/{aid}/workers/scripts/{urllib.parse.quote(billing,safe="")}/settings') or {};bn={x.get('name'):x for x in bset.get('bindings') or [] if isinstance(x,dict)}
          required={'AXIOM_DB':'d1','PAYMENT_AUTHORITY':'service','PAYNOW_TRANSPORT':'service','BILLING_BRIDGE_CAPABILITY_TOKEN':'secret_text','BILLING_TRANSPORT_CAPABILITY_TOKEN':'secret_text'}
          checks['billing_required_bindings']=all(bn.get(k,{}).get('type')==v for k,v in required.items())
          if not checks['billing_required_bindings']:raise SystemExit('FAIL billing bindings')
          tset=cf(f'/accounts/{aid}/workers/scripts/{urllib.parse.quote(transport,safe="")}/settings') or {};tn={x.get('name'):x.get('type') for x in tset.get('bindings') or [] if isinstance(x,dict)};checks['transport_bridge_secret_present']=tn.get('BILLING_TRANSPORT_CAPABILITY_TOKEN')=='secret_text'
          if not checks['transport_bridge_secret_present']:raise SystemExit('FAIL transport bridge')
          aset=cf(f'/accounts/{aid}/workers/scripts/{urllib.parse.quote(auth,safe="")}/settings') or {};an={x.get('name'):x.get('type') for x in aset.get('bindings') or [] if isinstance(x,dict)};checks['authority_paynow_key_present']=an.get('PAYNOW_INTEGRATION_KEY')=='secret_text';checks['authority_billing_bridge_present']=an.get('BILLING_BRIDGE_CAPABILITY_TOKEN')=='secret_text'
          if not(checks['authority_paynow_key_present'] and checks['authority_billing_bridge_present']):raise SystemExit('FAIL authority bindings')
          asrc=source(auth,'/internal/paynow/verify-callback');tsrc=source(transport,'/internal/paynow/initiate');bsrc=source(billing,'/billing/healthz')
          checks['authority_signer_present']=b'/internal/paynow/sign-initiate' in asrc and b'__musituAxiomPaynowSignInitiate' in asrc
          checks['transport_bridge_code_present']=b'BILLING_TRANSPORT_CAPABILITY_TOKEN' in tsrc
          checks['billing_catalog_code_present']=b'axiom-developer-monthly' in bsrc and b'/billing/checkout/' in bsrc
          if not all((checks['authority_signer_present'],checks['transport_bridge_code_present'],checks['billing_catalog_code_present'])):raise SystemExit('FAIL source markers')
          sub=cf(f'/accounts/{aid}/workers/scripts/{urllib.parse.quote(billing,safe="")}/subdomain') or {};checks['workers_dev_enabled']=sub.get('enabled');checks['previews_enabled']=sub.get('previews_enabled')
          if sub.get('enabled') is not False or sub.get('previews_enabled') is not False:raise SystemExit('FAIL public subdomain exposure')
          checks['authority_source_sha256']=hashlib.sha256(asrc).hexdigest();checks['transport_source_sha256']=hashlib.sha256(tsrc).hexdigest();checks['billing_source_sha256']=hashlib.sha256(bsrc).hexdigest()
          evidence={'schema':'musitu.axiom.billing_commercial_postdeploy_verify.v1','checks':checks,'production_mutation_performed':False,'secret_values_read':False,'gate':'AXIOM_BILLING_COMMERCIAL_POSTDEPLOY_VERIFY_PASS'}
          raw=(json.dumps(evidence,indent=2,sort_keys=True)+'\n').encode();open('commercial-postdeploy-verify.json','wb').write(raw);dg=hashlib.sha256(raw).hexdigest();open('commercial-postdeploy-verify.sha256','w').write(dg+'  commercial-postdeploy-verify.json\n')
          print(json.dumps({'gate':evidence['gate'],'health_http':checks['health_http'],'catalog':checks['catalog'],'checkout_noauth_http':checks['checkout_noauth_http'],'checkout_badbearer_http':checks['checkout_badbearer_http'],'invalid_webhook_http':checks['invalid_webhook_http'],'invalid_webhook_mutation':checks['invalid_webhook_mutation'],'exact_route_count':checks['exact_route_count'],'workers_dev_enabled':checks['workers_dev_enabled'],'previews_enabled':checks['previews_enabled'],'authority_source_sha256':checks['authority_source_sha256'],'transport_source_sha256':checks['transport_source_sha256'],'billing_source_sha256':checks['billing_source_sha256'],'live_money_certified':checks['live_money_certified'],'production_mutation_performed':False,'secret_values_read':False,'evidence_sha256':dg},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-billing-commercial-postdeploy-verify
          path: |
            commercial-postdeploy-verify.json
            commercial-postdeploy-verify.sha256
          retention-days: 30
          if-no-files-found: error
