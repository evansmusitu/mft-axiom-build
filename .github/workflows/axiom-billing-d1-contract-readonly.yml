name: MUSITU Axiom Billing D1 Contract Read-Only

on:
  push:
    paths:
      - '.github/workflows/axiom-billing-d1-contract-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      D1_NAME: musitu-axiom-prod
      D1_UUID: 504029cc-f9a5-495e-818f-63c6144b4ea4
    steps:
      - uses: actions/checkout@v4
      - name: Read billing/auth table contracts without mutation
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,urllib.error,urllib.parse,urllib.request
          base=os.environ['CF_API']; aid=os.environ['ACCOUNT_ID']; name=os.environ['D1_NAME']; expected_uuid=os.environ['D1_UUID']
          headers={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'Content-Type':'application/json','User-Agent':'MUSITU-Axiom-Billing-D1-Contract/1.4'}
          def call(path,method='GET',body=None):
              data=None if body is None else json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(base+path,headers=headers,method=method,data=data)
              try:
                  with urllib.request.urlopen(req,timeout=45) as r: raw=r.read(); code=r.status
              except urllib.error.HTTPError as e:
                  raw=e.read(); code=e.code
              if not 200<=code<300: raise SystemExit(f'Cloudflare API failure http={code} path={path}')
              obj=json.loads(raw or b'{}')
              if isinstance(obj,dict) and obj.get('success') is False: raise SystemExit('Cloudflare API success=false')
              return obj
          dbs=call(f'/accounts/{aid}/d1/database?name='+urllib.parse.quote(name))
          rows=[x for x in dbs.get('result',[]) if x.get('name')==name]
          if len(rows)!=1 or rows[0].get('uuid')!=expected_uuid: raise SystemExit('Fail-closed D1 identity mismatch')
          dbid=expected_uuid
          def query(sql):
              obj=call(f'/accounts/{aid}/d1/database/{dbid}/query','POST',{'sql':sql})
              result=obj.get('result') or []
              if not result or not all(x.get('success') is True for x in result): raise SystemExit('D1 query failed')
              out=[]
              for x in result: out.extend(x.get('results') or [])
              return out
          tables=['customers','api_keys','billing_subscriptions','webhook_events','usage_events','usage_buckets']
          columns={}
          for t in tables:
              meta=query(f'PRAGMA table_info("{t}");')
              columns[t]=[r.get('name') for r in meta if r.get('name')]
              if not columns[t]: raise SystemExit('Fail-closed empty column metadata '+t)
          indexes=[r.get('name') for r in query("SELECT name FROM sqlite_master WHERE type='index' AND name NOT LIKE 'sqlite_%' ORDER BY name;") if r.get('name')]
          counts=query("SELECT 'customers' AS table_name,count(*) AS row_count FROM customers UNION ALL SELECT 'api_keys',count(*) FROM api_keys UNION ALL SELECT 'billing_subscriptions',count(*) FROM billing_subscriptions UNION ALL SELECT 'webhook_events',count(*) FROM webhook_events UNION ALL SELECT 'usage_events',count(*) FROM usage_events UNION ALL SELECT 'usage_buckets',count(*) FROM usage_buckets;")
          out={'schema':'musitu.axiom.billing_d1_contract.v1','database_name':name,'database_uuid':dbid,'table_columns':columns,'index_names':indexes,'row_counts':counts,'query_mode':'PRAGMA_AND_SELECT_ONLY','mutation_performed':False,'migration_sql_published':False,'row_values_exposed':False,'gate':'AXIOM_BILLING_D1_CONTRACT_READ_PASS'}
          raw=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode(); open('billing-d1-contract.json','wb').write(raw)
          digest=hashlib.sha256(raw).hexdigest(); open('billing-d1-contract.sha256','w').write(digest+'  billing-d1-contract.json\n')
          print(json.dumps({'gate':out['gate'],'database_uuid':dbid,'columns':columns,'row_counts':counts,'mutation_performed':False,'sha256':digest},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-billing-d1-contract
          path: |
            billing-d1-contract.json
            billing-d1-contract.sha256
          retention-days: 14
          if-no-files-found: error
