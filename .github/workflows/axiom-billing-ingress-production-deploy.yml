name: MUSITU Axiom Billing Ingress Production Deploy

on:
  push:
    paths:
      - '.github/workflows/axiom-billing-ingress-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      D1_UUID: 504029cc-f9a5-495e-818f-63c6144b4ea4
      AUTHORITY: mft-phase8-external-authority
      AUTHORITY_SHA256: 4f332c901334f6f7fa66d6ea3c7cb3d3c91819da020328845510a1cc6ba7d05e
      TRANSPORT: mft-paynow-transport-gateway
      BILLING: mft-axiom-billing-ingress
      BILLING_ROUTE: payments.mftintelligence.com/billing/*
      PAYMENTS_BASE: https://payments.mftintelligence.com
    steps:
      - uses: actions/checkout@v4
      - name: Deploy isolated fail-closed billing ingress with rollback
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,re,secrets,subprocess,sys,time,urllib.error,urllib.parse,urllib.request,uuid

          API=os.environ['CF_API']; AID=os.environ['ACCOUNT_ID']; ZID=os.environ['ZONE_ID']; DBID=os.environ['D1_UUID']
          AUTH=os.environ['AUTHORITY']; AUTH_SHA=os.environ['AUTHORITY_SHA256']; TRANSPORT=os.environ['TRANSPORT']; BILLING=os.environ['BILLING']; ROUTE=os.environ['BILLING_ROUTE']; BASE=os.environ['PAYMENTS_BASE']
          AUTH_HEADERS={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Axiom-Billing-Production-Deploy/1.0'}
          mutations={'authority_content':False,'authority_secret':False,'billing_worker':False,'billing_secret':False,'route_id':None}
          original_authority=None
          bridge=secrets.token_urlsafe(48)

          def request(url,method='GET',headers=None,body=None,timeout=45):
              h=dict(headers or {})
              q=urllib.request.Request(url,headers=h,method=method,data=body)
              try:
                  with urllib.request.urlopen(q,timeout=timeout) as r:return r.status,r.headers,r.read()
              except urllib.error.HTTPError as e:return e.code,e.headers,e.read()

          def cf(path,method='GET',obj=None,expected=None):
              h=dict(AUTH_HEADERS); body=None
              if obj is not None:
                  h['Content-Type']='application/json'; body=json.dumps(obj,separators=(',',':')).encode()
              c,hh,b=request(API+path,method,h,body)
              if expected is not None and c not in expected: raise RuntimeError(f'Cloudflare HTTP {c} {path}: '+b[:300].decode('utf-8','ignore'))
              if expected is None and not 200<=c<300: raise RuntimeError(f'Cloudflare HTTP {c} {path}: '+b[:300].decode('utf-8','ignore'))
              try:x=json.loads(b or b'{}')
              except Exception:return c,hh,b,None
              if isinstance(x,dict) and x.get('success') is False: raise RuntimeError('Cloudflare success=false '+path+' '+str(x.get('errors'))[:300])
              return c,hh,b,x

          def multipart(metadata,filename,content,content_type='application/javascript+module'):
              boundary='----MUSITU'+secrets.token_hex(18)
              pieces=[]
              def add(s): pieces.append(s.encode() if isinstance(s,str) else s)
              add(f'--{boundary}\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n')
              add(json.dumps(metadata,separators=(',',':'))); add('\r\n')
              add(f'--{boundary}\r\nContent-Disposition: form-data; name="{filename}"; filename="{filename}"\r\nContent-Type: {content_type}\r\n\r\n')
              add(content); add('\r\n'); add(f'--{boundary}--\r\n')
              return boundary,b''.join(pieces)

          def extract_module(raw,ctype,needle):
              if 'multipart/' not in (ctype or '').lower(): return raw
              msg=email.message_from_bytes((f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw)
              parts=[]
              for p in msg.walk():
                  if p.is_multipart(): continue
                  d=p.get_payload(decode=True) or b''
                  name=p.get_param('name',header='content-disposition') or p.get_filename() or ''
                  if needle.encode() in d: parts.append((name,d))
              if len(parts)!=1: raise RuntimeError(f'Expected exactly one executable module, got {len(parts)}')
              return parts[0][1]

          def put_content(script,source):
              meta={'main_module':'index.mjs'}; boundary,body=multipart(meta,'index.mjs',source)
              h=dict(AUTH_HEADERS); h['Content-Type']='multipart/form-data; boundary='+boundary
              c,hh,b=request(f'{API}/accounts/{AID}/workers/scripts/{urllib.parse.quote(script,safe="")}/content','PUT',h,body)
              if not 200<=c<300: raise RuntimeError(f'Content upload failed {script} HTTP {c}: '+b[:400].decode('utf-8','ignore'))
              x=json.loads(b or b'{}')
              if isinstance(x,dict) and x.get('success') is False: raise RuntimeError('Content upload success=false '+script)

          def put_new_worker(script,source,bindings):
              meta={'main_module':'index.mjs','compatibility_date':'2026-09-05','bindings':bindings}
              boundary,body=multipart(meta,'index.mjs',source)
              h=dict(AUTH_HEADERS); h['Content-Type']='multipart/form-data; boundary='+boundary
              c,hh,b=request(f'{API}/accounts/{AID}/workers/scripts/{urllib.parse.quote(script,safe="")}','PUT',h,body)
              if not 200<=c<300: raise RuntimeError(f'Worker upload failed HTTP {c}: '+b[:500].decode('utf-8','ignore'))
              x=json.loads(b or b'{}')
              if isinstance(x,dict) and x.get('success') is False: raise RuntimeError('Worker upload success=false')

          def put_secret(script,name,value):
              cf(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(script,safe="")}/secrets','PUT',{'name':name,'text':value,'type':'secret_text'})

          def delete_secret(script,name):
              try: cf(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(script,safe="")}/secrets/{urllib.parse.quote(name,safe="")}','DELETE',expected={200,404})
              except Exception: pass

          def patch_authority(src):
              text=src.decode('utf-8')
              pat=re.compile(r'(?P<prefix>(?:async\s+)?function\s+)authorized(?P<rest>\s*\([^)]*\)\s*\{)')
              ms=list(pat.finditer(text))
              if len(ms)!=1: raise RuntimeError(f'authorized definition count {len(ms)}')
              m=ms[0]; brace=text.find('{',m.start()); depth=0; quote=None; esc=False; end=None
              for i in range(brace,len(text)):
                  ch=text[i]
                  if quote:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: quote=None
                      continue
                  if ch in ('"',"'",'`'): quote=ch; continue
                  if ch=='{': depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0: end=i+1; break
              if end is None: raise RuntimeError('authorized function unmatched')
              original_fn=text[m.start():end]
              renamed=pat.sub(lambda z:z.group('prefix')+'authorizedLegacy'+z.group('rest'),original_fn,count=1)
              bridge_fn=r'''
async function authorized(request, env) {
  if (await authorizedLegacy(request, env)) return true;
  const expected = env.BILLING_BRIDGE_CAPABILITY_TOKEN;
  const header = request.headers.get("authorization") || "";
  if (!expected || !header.startsWith("Bearer ")) return false;
  const provided = header.slice(7);
  const enc = new TextEncoder();
  const a = enc.encode(provided);
  const b = enc.encode(expected);
  let diff = a.length ^ b.length;
  const n = Math.max(a.length, b.length);
  for (let i = 0; i < n; i++) diff |= (a[i] || 0) ^ (b[i] || 0);
  return diff === 0;
}
'''
              patched=text[:m.start()]+renamed+bridge_fn+text[end:]
              if patched.count('function authorizedLegacy')+patched.count('async function authorizedLegacy')<1: raise RuntimeError('legacy auth rename absent')
              if patched.count('BILLING_BRIDGE_CAPABILITY_TOKEN')!=1: raise RuntimeError('bridge token reference count mismatch')
              return patched.encode()

          BILLING_SOURCE=r'''const JSON_HEADERS={"content-type":"application/json; charset=utf-8","cache-control":"no-store"};
function out(status,body){return new Response(JSON.stringify(body),{status,headers:JSON_HEADERS});}
async function sha256Hex(text){const b=new TextEncoder().encode(text);const d=await crypto.subtle.digest("SHA-256",b);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("");}
async function authorityProbe(env){
  try{
    const r=await env.PAYMENT_AUTHORITY.fetch("https://payment-authority.internal/internal/paynow/verify-callback",{method:"POST",headers:{"authorization":"Bearer "+env.BILLING_BRIDGE_CAPABILITY_TOKEN,"content-type":"application/x-www-form-urlencoded"},body:""});
    return {reachable:true,bridge_auth_accepted:r.status!==401&&r.status!==403,status:r.status};
  }catch(e){return {reachable:false,bridge_auth_accepted:false,status:null};}
}
async function verifyCallback(raw,env){
  const r=await env.PAYMENT_AUTHORITY.fetch("https://payment-authority.internal/internal/paynow/verify-callback",{method:"POST",headers:{"authorization":"Bearer "+env.BILLING_BRIDGE_CAPABILITY_TOKEN,"content-type":"application/x-www-form-urlencoded"},body:raw});
  const text=await r.text();let obj={};try{obj=JSON.parse(text)}catch{}
  if(r.status===401||r.status===403)return {ok:false,kind:"authority_auth_rejected",status:r.status};
  if(!r.ok)return {ok:false,kind:"authority_rejected",status:r.status};
  if(obj?.valid!==true)return {ok:false,kind:"invalid_paynow_callback",status:r.status,reason:typeof obj?.reason==="string"?obj.reason:null};
  return {ok:true,status:r.status};
}
async function health(env){
  let d1=false;try{const row=await env.AXIOM_DB.prepare("SELECT 1 AS ok").first();d1=Number(row?.ok)===1}catch{}
  const authority=await authorityProbe(env);
  return out(d1&&authority.reachable&&authority.bridge_auth_accepted?200:503,{ok:d1&&authority.reachable&&authority.bridge_auth_accepted,service:"MUSITU Axiom Billing Ingress",mode:"catalog_fail_closed",catalog_configured:false,d1,authority,transport_bound:Boolean(env.PAYNOW_TRANSPORT),charges_enabled:false});
}
async function webhook(request,env){
  const ct=(request.headers.get("content-type")||"").toLowerCase();
  if(!ct.startsWith("application/x-www-form-urlencoded"))return out(415,{ok:false,error:"unsupported_media_type"});
  const declared=Number(request.headers.get("content-length")||0);if(declared>65536)return out(413,{ok:false,error:"payload_too_large"});
  const raw=await request.text();if(new TextEncoder().encode(raw).length>65536)return out(413,{ok:false,error:"payload_too_large"});
  const verified=await verifyCallback(raw,env);
  if(!verified.ok){if(verified.kind==="invalid_paynow_callback")return out(400,{ok:false,error:"invalid_paynow_callback"});return out(502,{ok:false,error:"payment_authority_unavailable"});}
  const digest=await sha256Hex(raw);const id="paynow_"+digest;const now=new Date().toISOString();
  const payload=JSON.stringify({verified:true,body_sha256:digest,raw_payload_stored:false,catalog_mapped:false,subscription_mutated:false});
  await env.AXIOM_DB.prepare("INSERT OR IGNORE INTO webhook_events (id,provider,event_type,payload_json,processed_at) VALUES (?1,?2,?3,?4,?5)").bind(id,"paynow","paynow.callback.verified.unmapped",payload,now).run();
  return out(202,{ok:true,verified:true,processed:false,subscription_mutated:false,reason:"catalog_not_configured"});
}
export default {async fetch(request,env){
  const u=new URL(request.url);const p=u.pathname;
  if(p==="/billing/healthz"&&request.method==="GET")return health(env);
  if(p==="/billing/catalog"&&request.method==="GET")return out(503,{ok:false,error:"catalog_not_configured",charges_enabled:false});
  if(p==="/billing/checkout"&&request.method==="POST")return out(503,{ok:false,error:"catalog_not_configured",charge_attempted:false});
  if(p==="/billing/webhooks/paynow"&&request.method==="POST")return webhook(request,env);
  return out(404,{ok:false,error:"not_found"});
}};
'''.encode()

          def syntax_check(path,data):
              open(path,'wb').write(data); subprocess.run(['node','--check',path],check=True,stdout=subprocess.DEVNULL)

          def rollback():
              # Remove route first so no request can hit a partially rolled back ingress.
              rid=mutations.get('route_id')
              if rid:
                  try: cf(f'/zones/{ZID}/workers/routes/{rid}','DELETE',expected={200,404})
                  except Exception: pass
              if mutations.get('billing_worker'):
                  try: cf(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(BILLING,safe="")}','DELETE',expected={200,404})
                  except Exception: pass
              if mutations.get('authority_content') and original_authority is not None:
                  try: put_content(AUTH,original_authority)
                  except Exception: pass
              if mutations.get('authority_secret'): delete_secret(AUTH,'BILLING_BRIDGE_CAPABILITY_TOKEN')

          try:
              # --- Preflight identities and zero-collision route topology ---
              c,h,b,x=cf(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(AUTH,safe="")}')
              original_authority=extract_module(b,h.get('content-type',''),'verifyPaynowCallback')
              if hashlib.sha256(original_authority).hexdigest()!=AUTH_SHA: raise RuntimeError('Fail-closed authority source hash mismatch')
              _,_,_,sx=cf(f'/accounts/{AID}/workers/scripts')
              names={str(z.get('id') or z.get('name')) for z in (sx.get('result') or []) if isinstance(z,dict)}
              if BILLING in names: raise RuntimeError('Fail-closed billing worker already exists')
              _,_,_,rx=cf(f'/zones/{ZID}/workers/routes')
              routes=rx.get('result') or []
              if any(str(r.get('pattern') or '')==ROUTE for r in routes if isinstance(r,dict)): raise RuntimeError('Fail-closed billing route already exists')
              _,_,_,dx=cf(f'/accounts/{AID}/workers/domains')
              domains=dx.get('result') or []
              matches=[d for d in domains if isinstance(d,dict) and d.get('hostname')=='payments.mftintelligence.com']
              if len(matches)!=1 or matches[0].get('service')!=TRANSPORT: raise RuntimeError('Fail-closed payments Custom Domain is not owned by expected transport')

              # --- Local syntax gates before any mutation ---
              patched=patch_authority(original_authority); syntax_check('authority-patched.mjs',patched); syntax_check('billing-index.mjs',BILLING_SOURCE)

              # --- Minimal authority content patch, config untouched ---
              put_content(AUTH,patched); mutations['authority_content']=True
              put_secret(AUTH,'BILLING_BRIDGE_CAPABILITY_TOKEN',bridge); mutations['authority_secret']=True

              # Verify authority config binding preservation and new secret presence by names only.
              _,_,_,aset=cf(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(AUTH,safe="")}/settings')
              ab={(z.get('name'),z.get('type')) for z in (aset.get('result',{}).get('bindings') or []) if isinstance(z,dict)}
              required={'AUTHORITY_CAPABILITY_TOKEN','PAYNOW_INTEGRATION_KEY','SIGNING_PRIVATE_G1_B64','SIGNING_PUBLIC_G1_B64','BILLING_BRIDGE_CAPABILITY_TOKEN'}
              if not required.issubset({n for n,t in ab}): raise RuntimeError('Authority binding preservation check failed')

              # --- New isolated billing Worker ---
              bindings=[
                {'type':'d1','name':'AXIOM_DB','id':DBID},
                {'type':'service','name':'PAYMENT_AUTHORITY','service':AUTH},
                {'type':'service','name':'PAYNOW_TRANSPORT','service':TRANSPORT}
              ]
              put_new_worker(BILLING,BILLING_SOURCE,bindings); mutations['billing_worker']=True
              put_secret(BILLING,'BILLING_BRIDGE_CAPABILITY_TOKEN',bridge); mutations['billing_secret']=True
              cf(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(BILLING,safe="")}/subdomain','POST',{'enabled':False,'previews_enabled':False})

              # Verify exact billing bindings by names/types only.
              _,_,_,bset=cf(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(BILLING,safe="")}/settings')
              bs=bset.get('result',{}).get('bindings') or []
              names_types={(z.get('name'),z.get('type')) for z in bs if isinstance(z,dict)}
              for need in [('AXIOM_DB','d1'),('PAYMENT_AUTHORITY','service'),('PAYNOW_TRANSPORT','service'),('BILLING_BRIDGE_CAPABILITY_TOKEN','secret_text')]:
                  if need not in names_types: raise RuntimeError('Billing binding missing '+str(need))

              # --- Narrow route in front of existing Custom Domain ---
              _,_,_,created=cf(f'/zones/{ZID}/workers/routes','POST',{'pattern':ROUTE,'script':BILLING})
              rid=(created.get('result') or {}).get('id')
              if not rid: raise RuntimeError('Route creation returned no id')
              mutations['route_id']=rid

              # Allow route propagation briefly, then execute fail-closed production probes.
              time.sleep(2)
              def public(path,method='GET',body=None,ctype=None):
                  h={'Accept':'application/json','User-Agent':'MUSITU-Axiom-Billing-Deploy-Probe/1.0'}
                  if ctype:h['Content-Type']=ctype
                  return request(BASE+path,method,h,body,30)

              c,hh,b=public('/billing/healthz')
              if c!=200: raise RuntimeError(f'Billing health failed HTTP {c}: '+b[:500].decode('utf-8','ignore'))
              health=json.loads(b); 
              if health.get('ok') is not True or health.get('catalog_configured') is not False or health.get('charges_enabled') is not False: raise RuntimeError('Billing health contract mismatch')
              if health.get('authority',{}).get('bridge_auth_accepted') is not True: raise RuntimeError('Authority bridge auth not accepted')

              c,hh,b=public('/billing/catalog')
              if c!=503 or json.loads(b).get('error')!='catalog_not_configured': raise RuntimeError('Catalog fail-closed gate failed')
              c,hh,b=public('/billing/checkout','POST',json.dumps({'price_id':'attacker-controlled','amount':'0.01'}).encode(),'application/json')
              checkout=json.loads(b)
              if c!=503 or checkout.get('error')!='catalog_not_configured' or checkout.get('charge_attempted') is not False: raise RuntimeError('Checkout fail-closed gate failed')

              # Invalid callback must never create a webhook row or subscription mutation.
              def d1(sql):
                  _,_,_,x=cf(f'/accounts/{AID}/d1/database/{DBID}/query','POST',{'sql':sql}); rows=[]
                  for rr in x.get('result') or []: rows.extend(rr.get('results') or [])
                  return rows
              before=d1("SELECT count(*) AS n FROM webhook_events;")[0]['n']
              subs_before=d1("SELECT count(*) AS n FROM billing_subscriptions;")[0]['n']
              c,hh,b=public('/billing/webhooks/paynow','POST',b'status=Paid&reference=invalid&hash=definitely-invalid','application/x-www-form-urlencoded')
              if c not in (400,502): raise RuntimeError('Invalid webhook unexpected status '+str(c))
              after=d1("SELECT count(*) AS n FROM webhook_events;")[0]['n']
              subs_after=d1("SELECT count(*) AS n FROM billing_subscriptions;")[0]['n']
              if before!=after or subs_before!=subs_after: raise RuntimeError('Invalid callback mutated billing state')

              # Legacy transport remains unchanged and its internal control remains protected.
              c,hh,b=request(BASE+'/',headers={'Accept':'application/json','User-Agent':'MUSITU-Axiom-Billing-Deploy-Probe/1.0'})
              if c!=200: raise RuntimeError('Legacy transport root unhealthy')
              try: root=json.loads(b)
              except Exception: root={}
              if root.get('authority')!='transport_only' or root.get('certifies_payments') is not False: raise RuntimeError('Legacy transport authority contract changed')
              c,hh,b=request(BASE+'/internal/paynow/poll','POST',{'Content-Type':'application/json','User-Agent':'MUSITU-Axiom-Billing-Deploy-Probe/1.0'},b'{}')
              if c!=401: raise RuntimeError('Legacy transport internal auth weakened')

              # Final control-plane verification.
              _,_,_,rr=cf(f'/zones/{ZID}/workers/routes')
              exact=[r for r in (rr.get('result') or []) if isinstance(r,dict) and r.get('pattern')==ROUTE and r.get('script')==BILLING]
              if len(exact)!=1: raise RuntimeError('Final route verification failed')
              _,_,_,sub=cf(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(BILLING,safe="")}/subdomain')
              sr=sub.get('result') or {}
              if sr.get('enabled') is not False or sr.get('previews_enabled') is not False: raise RuntimeError('workers.dev exposure not disabled')

              evidence={
                'schema':'musitu.axiom.billing_ingress_production_deploy.v1',
                'billing_worker':BILLING,'route':ROUTE,'route_id':rid,
                'authority_worker':AUTH,'transport_worker':TRANSPORT,'d1_uuid':DBID,
                'authority_original_sha256':AUTH_SHA,'authority_patched_sha256':hashlib.sha256(patched).hexdigest(),
                'billing_source_sha256':hashlib.sha256(BILLING_SOURCE).hexdigest(),
                'catalog_configured':False,'charges_enabled':False,'subscription_activation_enabled':False,
                'bridge_secret_generated_in_ci':True,'bridge_secret_exposed':False,
                'workers_dev_enabled':False,'preview_urls_enabled':False,
                'invalid_webhook_state_mutation':False,'legacy_transport_internal_unauthorized_http':401,
                'gate':'AXIOM_BILLING_INGRESS_PRODUCTION_FAIL_CLOSED_PASS'
              }
              raw=(json.dumps(evidence,indent=2,sort_keys=True)+'\n').encode(); open('billing-ingress-deploy-evidence.json','wb').write(raw)
              dg=hashlib.sha256(raw).hexdigest(); open('billing-ingress-deploy-evidence.sha256','w').write(dg+'  billing-ingress-deploy-evidence.json\n')
              print(json.dumps({'gate':evidence['gate'],'billing_worker':BILLING,'route':ROUTE,'catalog_configured':False,'charges_enabled':False,'subscription_activation_enabled':False,'bridge_secret_exposed':False,'workers_dev_enabled':False,'invalid_webhook_state_mutation':False,'legacy_transport_internal_unauthorized_http':401,'evidence_sha256':dg},sort_keys=True))
          except Exception as e:
              print('DEPLOYMENT_FAIL_CLOSED:',str(e),file=sys.stderr)
              rollback()
              raise
          finally:
              bridge=''
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-billing-ingress-production-deploy
          path: |
            billing-ingress-deploy-evidence.json
            billing-ingress-deploy-evidence.sha256
          retention-days: 30
          if-no-files-found: error
