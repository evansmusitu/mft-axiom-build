name: MUSITU Axiom Billing Provider Contract

on:
  push:
    paths:
      - '.github/workflows/axiom-billing-provider-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct protected source
        env:
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          P=deploy_payload/runtime_min
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > runtime.enc.b64
          base64 -d runtime.enc.b64 > runtime.tar.gz.enc
          test "$(sha256sum runtime.tar.gz.enc | awk '{print $1}')" = 'b82448d6b4b34b302748815af976b535d69922c197d4b7a9056fc2f91a9e12cf'
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in runtime.tar.gz.enc -out runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          test "$(sha256sum runtime.tar.gz | awk '{print $1}')" = 'b4d5a0266446523969a619f5e9bb5a04d9b815c78a2ab82ed046ef5e23d53663'
          mkdir runtime && tar -xzf runtime.tar.gz -C runtime
      - name: Emit billing metadata only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,re
          root=pathlib.Path('runtime/worker/src')
          texts={p.name:p.read_text(errors='replace') for p in root.glob('*.js')}
          combined='\n'.join(texts.values())
          terms=re.compile(r'(stripe|paynow|payment|billing|subscription|webhook|downgrade)',re.I)
          env_names=sorted(set(re.findall(r'\b(?:env\.|process\.env\.)?([A-Z][A-Z0-9_]{3,})\b',combined)))
          env_names=[x for x in env_names if terms.search(x)]
          routes=sorted(set(r for r in re.findall(r'["\'](/v1/[A-Za-z0-9_./{}:-]+)["\']',combined) if terms.search(r)))
          host_literals=sorted(set(h.lower() for h in re.findall(r'\b(?:[a-z0-9-]+\.)+[a-z]{2,}\b',combined,re.I) if terms.search(h)))
          helpers=[]
          for name,t in texts.items():
            for m in re.finditer(r'(?:export\s+)?(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(([^)]*)\)',t):
              fn=m.group(1)
              if terms.search(fn):
                helpers.append({'file':name,'name':fn,'params':[x.strip().split('=')[0].strip() for x in m.group(2).split(',') if x.strip()]})
          db_identifiers=sorted(set(x for x in re.findall(r'\b([A-Za-z_$][\w$]*)\b',combined) if terms.search(x) and len(x)<=80))
          out={
            'schema':'musitu.axiom.billing_provider_contract.v1',
            'environment_identifiers':env_names,
            'billing_routes':routes,
            'billing_host_literals':host_literals,
            'billing_helper_signatures':helpers,
            'billing_related_identifiers':db_identifiers[:250],
            'payments_mftintelligence_literal_present':'payments.mftintelligence.com' in combined.lower(),
            'stripe_literal_present':'stripe' in combined.lower(),
            'paynow_literal_present':'paynow' in combined.lower(),
            'plaintext_source_committed':False,
          }
          raw=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode()
          pathlib.Path('billing-provider-contract.json').write_bytes(raw)
          digest=hashlib.sha256(raw).hexdigest()
          pathlib.Path('billing-provider-contract.sha256').write_text(digest+'  billing-provider-contract.json\n')
          print(json.dumps({'schema':out['schema'],'environment_identifiers':env_names,'billing_routes':routes,'billing_host_literals':host_literals,'helper_names':[x['name'] for x in helpers],'payments_mftintelligence_literal_present':out['payments_mftintelligence_literal_present'],'stripe_literal_present':out['stripe_literal_present'],'paynow_literal_present':out['paynow_literal_present'],'sha256':digest},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-billing-provider-contract
          path: |
            billing-provider-contract.json
            billing-provider-contract.sha256
          retention-days: 7
          if-no-files-found: error
