name: MUSITU Axiom Canonical Kernel Payload Capture — QUARANTINED BY AR-02

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed at the AR-02 payload-capture boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'AR-02 QUARANTINE: the historical canonical-kernel payload capture is disabled.'
          echo 'It previously reconstructed protected source, resolved a production database, created runtime secrets, and deployed diagnostic workers.'
          echo 'No protected source is reconstructed, no database is accessed, no secret is created, and no diagnostic Worker is deployed.'
          echo 'A replacement must use synthetic isolated data, dedicated non-production resources, and bounded diagnostic credentials.'
          exit 1
