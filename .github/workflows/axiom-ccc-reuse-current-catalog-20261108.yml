name: AXIOM current staging D1 catalog and bindings 20261108 (READ ONLY)
on:
  pull_request:
    types: [opened]
    paths: ['.github/workflows/axiom-ccc-reuse-current-catalog-20261108.yml']
permissions: {contents: read}
concurrency:
  group: axiom-ccc-reuse-current-catalog-20261108
  cancel-in-progress: false
jobs:
  fixed-current-staging-catalog:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'build/axiom-ccc-reuse-current-catalog-20261108' && github.event.pull_request.base.ref == 'build/axiom-cloudflare-account-visibility-live-20261107' && github.event.pull_request.base.sha == '3e96a4064d3b49828cfe68807d0318ef7ebddaa3' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 868f191bd83acf898f106798673a1a44df946d1b
          persist-credentials: false
          fetch-depth: 1
      - name: Exact source and tests identity, fixed query only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 868f191bd83acf898f106798673a1a44df946d1b
          test "$(git hash-object customer_frontier/qualification/ccc_current_catalog_audit.py)" = 34fab291033cde14e13efdd9e87bd5e8d5d16100
          test "$(git hash-object customer_frontier/tests/test_ccc_current_catalog_audit.py)" = 251c15962293cdbf346e7929194373b51e3ce6b8
          python3 - <<'PY'
          import importlib.util
          p='customer_frontier/qualification/ccc_current_catalog_audit.py'
          spec=importlib.util.spec_from_file_location('ccc',p)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          assert list(m.CANDIDATES.items()) == [('ccc473f1-fbb5-4b8d-8a24-45f3696ac10f','7e98510fc457a669c29dd85ab1d87cc758fe0ba74d0833c20863b53d599b5b36')]
          assert m.SQL == "SELECT type,name,tbl_name,sql FROM sqlite_master WHERE type IN ('table','index','trigger','view') AND name NOT GLOB 'sqlite_*' ORDER BY type,name"
          assert "'target_admitted':False" in open(p).read()
          print('ONLY_FIXED_CCC_STAGING_READONLY_CATALOG_ADMITTED')
          PY
      - name: Run synthetic 20 privacy, pagination and deny tests BEFORE token
        run: python3 -m unittest discover -s customer_frontier/tests -p test_ccc_current_catalog_audit.py -v
      - name: Observe current exact D1 schema catalog and current consumer bindings only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AXIOM_CHECKOUT_SHA: 868f191bd83acf898f106798673a1a44df946d1b
        run: python3 customer_frontier/qualification/ccc_current_catalog_audit.py
      - name: Classify currently unbound candidate; no reuse admission or migration
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('ccc-current-catalog-audit.json').read_text())
          assert d['status']=='CURRENT_CATALOG_AND_BINDINGS_OBSERVED'
          assert d['query_count']==1 and d['query_zero_writes_confirmed']==1 and d['provider_query_mutations']==0
          assert d['workers']['status']=='OBSERVED_LISTED_SCRIPTS_AND_ENVIRONMENTS'
          assert d['pages']['status']=='OBSERVED_CURRENT_CONFIGS'
          assert d['target_admitted'] is False and d['release_authority'] is False
          assert len(d['catalogs'])==1
          c=d['catalogs']['ccc473f1-fbb5-4b8d-8a24-45f3696ac10f']
          if d['references']:
              print('STAGING_CURRENT_BINDINGS_FOUND_BLOCK_FURTHER_OPERATIONS count='+str(len(d['references'])))
              raise SystemExit(1)
          types={}
          for o in c['objects']:types[o['type']]=types.get(o['type'],0)+1
          print('STAGING_CATALOG_HASH='+c['catalog_sha256']+' SCHEMA_TYPES='+json.dumps(types,sort_keys=True))
          print('NOT_A_DESTRUCTIVE_RESTORE_ADMISSION')
          PY
      - name: Save only hashed catalog and metadata for independent review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-ccc-current-catalog-20261108
          path: |
            ccc-current-catalog-audit.json
            ccc-current-catalog-audit.json.sha256
          if-no-files-found: warn
          retention-days: 30
