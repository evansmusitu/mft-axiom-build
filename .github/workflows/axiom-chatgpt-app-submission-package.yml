name: MUSITU Axiom ChatGPT App Submission Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-axiom-chatgpt-submission-package
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate submission generator
        run: |
          set -euo pipefail
          python -m py_compile scripts/generate_chatgpt_submission.py

      - name: Generate package from live public MCP
        run: |
          set -euo pipefail
          python scripts/generate_chatgpt_submission.py
          python -m json.tool chatgpt-app-submission.json >/dev/null
          python -m json.tool submission/review-checks.json >/dev/null

      - name: Upload generated review package without repository mutation
        uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-chatgpt-review-package-not-submitted
          path: |
            chatgpt-app-submission.json
            submission/REVIEWER_NOTES.md
            submission/review-checks.json
            submission/chatgpt-app-submission.sha256
            SUPPORT.md
          retention-days: 14
          if-no-files-found: error
