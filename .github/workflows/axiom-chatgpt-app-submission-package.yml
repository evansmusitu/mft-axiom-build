name: MUSITU Axiom ChatGPT App Submission Package

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/axiom-chatgpt-app-submission-package.yml'
      - 'scripts/generate_chatgpt_submission.py'

permissions:
  contents: write

concurrency:
  group: musitu-axiom-chatgpt-submission-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate submission generator
        run: |
          set -euo pipefail
          python -m py_compile scripts/generate_chatgpt_submission.py

      - name: Generate package from live public MCP
        run: |
          set -euo pipefail
          python scripts/generate_chatgpt_submission.py
          python -m json.tool chatgpt-app-submission.json >/dev/null
          python -m json.tool submission/review-checks.json >/dev/null

      - name: Commit generated review package
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-app-submission.json submission/REVIEWER_NOTES.md submission/review-checks.json submission/chatgpt-app-submission.sha256 SUPPORT.md
          if git diff --cached --quiet; then
            echo "Submission package already current"
            exit 0
          fi
          git commit -m "Generate MUSITU Axiom ChatGPT submission package"
          git push origin HEAD:main
