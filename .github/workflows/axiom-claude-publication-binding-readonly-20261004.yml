name: Axiom Claude Publication Binding Read-Only 20261004

on:
  push:
    branches:
      - distribution/claude-remote-mcp-20261004
    paths:
      - '.github/workflows/axiom-claude-publication-binding-readonly-20261004.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Print sanitized publication binding metadata
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import email, hashlib, json, urllib.parse
          from frontier_v5.scripts.deploy_claude_workers_dev import ACCOUNT_ID, CF_API, cf, cloudflare_headers, raw
          worker="musitu-axiom-claude-mcp-publication"
          headers=cloudflare_headers()
          settings,_=cf(headers,f"/accounts/{ACCOUNT_ID}/workers/scripts/{urllib.parse.quote(worker,safe='')}/settings")
          if not isinstance(settings,dict):
              raise SystemExit("settings unavailable")
          rows=[]
          for item in settings.get("bindings") or []:
              if not isinstance(item,dict): continue
              typ=str(item.get("type") or "")
              name=str(item.get("name") or "")
              # Only known non-secret publication bindings may be emitted.
              if name not in {"AXIOM_DB","AUTH_ISSUER","MCP_PUBLIC_BASE","MCP_OAUTH_RESOURCE","MCP_CORE"}:
                  rows.append({"name":name,"type":typ,"unexpected":True})
                  continue
              row={"name":name,"type":typ}
              for k in ("text","id","service","environment","namespace_id"):
                  if item.get(k) is not None:
                      row[k]=item.get(k)
              rows.append(row)
          print("SANITIZED_BINDINGS="+json.dumps(sorted(rows,key=lambda x:x["name"]),sort_keys=True))
          print("compatibility_date="+str(settings.get("compatibility_date")))
          code,rh,body=raw(f"{CF_API}/accounts/{ACCOUNT_ID}/workers/scripts/{urllib.parse.quote(worker,safe='')}",headers=headers)
          if code!=200: raise SystemExit("worker source read failed")
          ct=str(rh.get("content-type") or "")
          src=body
          if "multipart/" in ct.lower():
              msg=email.message_from_bytes((f"Content-Type: {ct}\\r\\nMIME-Version: 1.0\\r\\n\\r\\n").encode()+body)
              parts=[]
              for part in msg.walk():
                  if part.is_multipart(): continue
                  data=part.get_payload(decode=True) or b""
                  if b"export default" in data and b"tools/call" in data: parts.append(data)
              if len(parts)!=1: raise SystemExit("worker executable source cardinality mismatch")
              src=parts[0]
          live_sha=hashlib.sha256(src).hexdigest()
          live_blob=hashlib.sha1(f"blob {len(src)}\\0".encode()+src).hexdigest()
          expected_blob="b35010542eb654974e40003a5e42874a93b6b2b9"
          print("LIVE_PUBLICATION_SOURCE_SHA256="+live_sha)
          print("LIVE_PUBLICATION_SOURCE_GIT_BLOB_SHA1="+live_blob)
          print("EXPECTED_PRE_FIX_GIT_BLOB_SHA1="+expected_blob)
          print("SOURCE_MATCH="+str(live_blob==expected_blob).lower())
          print("mutation_performed=false")
          PY
