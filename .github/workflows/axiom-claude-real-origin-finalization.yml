name: Axiom Claude Real-Origin Finalization

on:
  push:
    branches:
      - "distribution/claude-remote-mcp-20261004"
    paths:
      - "submission/claude/real-claude-origin-evidence.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-real-claude-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify fail-closed real-origin contract
        run: PYTHONPATH=. python -m pytest -q frontier_v5/tests/test_verify_real_claude_origin.py
      - name: Verify submitted real Claude-origin evidence and recheck frozen OpenAI surface
        run: |
          set -euo pipefail
          test -f submission/claude/real-claude-origin-evidence.json
          PYTHONPATH=. python frontier_v5/scripts/verify_real_claude_origin.py submission/claude/real-claude-origin-evidence.json
