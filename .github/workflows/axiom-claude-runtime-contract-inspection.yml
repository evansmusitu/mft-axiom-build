name: Axiom Claude Runtime Contract Inspection

on:
  push:
    branches:
      - "distribution/claude-remote-mcp-20261004"
    paths:
      - ".github/workflows/axiom-claude-runtime-contract-inspection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct sealed runtime source read-only
        env:
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_GLOBAL_API_KEY"
          P="$PWD/deploy_payload/runtime_min"
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > /tmp/runtime.enc.b64
          base64 -d /tmp/runtime.enc.b64 > /tmp/runtime.tar.gz.enc
          test "$(sha256sum /tmp/runtime.tar.gz.enc | awk '{print $1}')" = 'b82448d6b4b34b302748815af976b535d69922c197d4b7a9056fc2f91a9e12cf'
          python - <<'PY'
          import hashlib,hmac,os
          b=open('/tmp/runtime.tar.gz.enc','rb').read()
          got=hmac.new(os.environ['CLOUDFLARE_GLOBAL_API_KEY'].encode(),b,hashlib.sha256).hexdigest()
          if not hmac.compare_digest(got,'1a3193d4f3271d61d151e6ebd7cf4576d8ab86c2e79b84eff4ad0f635fe7ab47'):
              raise SystemExit('sealed runtime transport verification failed')
          print('sealed_runtime_transport=PASS')
          PY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in /tmp/runtime.tar.gz.enc -out /tmp/runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          test "$(sha256sum /tmp/runtime.tar.gz | awk '{print $1}')" = 'b4d5a0266446523969a619f5e9bb5a04d9b815c78a2ab82ed046ef5e23d53663'
          mkdir -p /tmp/axiom-runtime
          tar -xzf /tmp/runtime.tar.gz -C /tmp/axiom-runtime
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/axiom-runtime')
          m=json.loads((root/'RUNTIME_SOURCE_MANIFEST.json').read_text())
          problems=[]
          for f in m['files']:
              p=root/f['path']
              if not p.is_file(): problems.append((f['path'],'missing')); continue
              b=p.read_bytes()
              if len(b)!=f['size'] or hashlib.sha256(b).hexdigest()!=f['sha256']:
                  problems.append((f['path'],'integrity'))
          if problems: raise SystemExit('runtime source integrity mismatch')
          print('sealed_runtime_integrity=PASS')
          PY

      - name: Print sanitized operation contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,json,pathlib,re
          root=pathlib.Path('/tmp/axiom-runtime')
          targets={
            'algebra.solve','numeric.root','numeric.ode','numeric.interpolate',
            'finance.compound','finance.bond_price','finance.duration',
            'finance.portfolio_metrics','finance.drawdown','geometry.distance',
            'knowledge.constant','knowledge.element','algebra.polynomial_roots',
            'verify.evaluate','verify.crosscheck'
          }
          hits=[]
          for p in root.rglob('*.py'):
              try: text=p.read_text(errors='replace')
              except: continue
              present=sorted(op for op in targets if op in text)
              if not present: continue
              lines=text.splitlines()
              for op in present:
                  for i,line in enumerate(lines):
                      if op in line:
                          lo=max(0,i-18); hi=min(len(lines),i+35)
                          snippet='\n'.join(f'{j+1}: {lines[j]}' for j in range(lo,hi))
                          # Never emit obvious secret literals even if source evolves.
                          snippet=re.sub(r'(?i)(api[_-]?key|secret|token|password)\s*=\s*[^\n]+',r'\1=<redacted>',snippet)
                          hits.append({'operation':op,'file':str(p.relative_to(root)),'line':i+1,'snippet':snippet})
                          break
          print('AXIOM_OPERATION_CONTRACT_CONTEXT='+json.dumps(hits,separators=(',',':')))
          if not hits:
              raise SystemExit('no target operation contracts found')
          PY
