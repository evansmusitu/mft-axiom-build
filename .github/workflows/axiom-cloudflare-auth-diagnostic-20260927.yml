name: MUSITU Axiom Cloudflare Credential Diagnostic 20260927

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/axiom-cloudflare-auth-diagnostic-20260927.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      ZONE_NAME: mftintelligence.com

    steps:
      - uses: actions/checkout@v4

      - name: Fail-closed Cloudflare API-token diagnostic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "CLOUDFLARE_API_TOKEN is missing."
            echo "The public custom-domain deployment cannot be repaired without a valid Cloudflare API token."
            exit 20
          }

          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          api = os.environ["CF_API"]
          account_id = os.environ["ACCOUNT_ID"]
          zone_id = os.environ["ZONE_ID"]
          zone_name = os.environ["ZONE_NAME"]

          headers = {
              "Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"].strip(),
              "Accept": "application/json",
              "User-Agent": "MUSITU-Axiom-CF-Credential-Diagnostic/3.0",
          }

          paths = [
              ("user_verify", "/user/tokens/verify"),
              ("account_verify", "/accounts/" + account_id + "/tokens/verify"),
              ("zone", "/zones/" + zone_id),
              ("zone_lookup", "/zones?name=" + urllib.parse.quote(zone_name) + "&status=active"),
              ("workers_domains", "/accounts/" + account_id + "/workers/domains"),
              ("kv_namespaces", "/accounts/" + account_id + "/storage/kv/namespaces?per_page=1"),
          ]

          results = {}

          for name, path in paths:
              request = urllib.request.Request(
                  api + path,
                  headers=headers,
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read(4096)
                      status = response.status
              except urllib.error.HTTPError as error:
                  body = error.read(4096)
                  status = error.code
              except urllib.error.URLError as error:
                  body = str(error).encode()
                  status = 0

              try:
                  payload = json.loads(body or b"{}")
              except Exception:
                  payload = {}

              errors = (payload.get("errors") or []) if isinstance(payload, dict) else []
              messages = (payload.get("messages") or []) if isinstance(payload, dict) else []

              results[name] = {
                  "http": status,
                  "success": payload.get("success") if isinstance(payload, dict) else None,
                  "errors": [
                      {"code": item.get("code"), "message": item.get("message")}
                      for item in errors
                      if isinstance(item, dict)
                  ],
                  "messages": [
                      {"code": item.get("code"), "message": item.get("message")}
                      for item in messages
                      if isinstance(item, dict)
                  ],
              }

          print(json.dumps(results, indent=2, sort_keys=True))

          verification_names = ("user_verify", "account_verify")
          token_verified = any(
              results[name].get("http") == 200 and results[name].get("success") is True
              for name in verification_names
          )
          resource_names = ("zone", "zone_lookup", "workers_domains", "kv_namespaces")
          failures = {
              name: results[name]
              for name in resource_names
              if results[name].get("http") != 200 or results[name].get("success") is not True
          }

          print(json.dumps({
              "token_verification_passed": token_verified,
              "verification_scheme": (
                  "account_api_token"
                  if results["account_verify"].get("http") == 200 and results["account_verify"].get("success") is True
                  else "user_api_token"
                  if results["user_verify"].get("http") == 200 and results["user_verify"].get("success") is True
                  else "none"
              ),
              "resource_failures": sorted(failures),
          }, sort_keys=True))

          if not token_verified or failures:
              print("CLOUDFLARE_API_TOKEN_DIAGNOSTIC_FAIL", file=sys.stderr)
              if not token_verified:
                  print("Neither Cloudflare User API-token verification nor Account API-token verification succeeded.", file=sys.stderr)
              if failures:
                  print(json.dumps(failures, indent=2, sort_keys=True), file=sys.stderr)
              sys.exit(1)

          print("MUSITU_AXIOM_CLOUDFLARE_API_TOKEN_DIAGNOSTIC_PASS")
          PY
