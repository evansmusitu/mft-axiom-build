name: MUSITU Axiom Cloudflare Staging Deploy V2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected == true && github.repository_id == '1356837528' && github.actor_id == '285482095' && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      STAGING_WORKER: mft-axiom-staging
      STAGING_DB: mft-axiom-staging
      DEPLOY_BUILD_ID: MFT-AXIOM-V3-RUNTIME-RECONSTRUCTION-20260904
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Execute fail-closed staging deployment
        shell: bash
        run: bash scripts/axiom-staging-deploy.sh
      - name: Upload non-secret staging evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-axiom-cloudflare-staging-deployment-v2
          path: |
            axiom-staging-deployment-evidence.json
            axiom-staging-deployment-evidence.sha256
          if-no-files-found: error
          retention-days: 14
