name: MUSITU Axiom Bearer Compute Metering E2E v3

on:
  push:
    paths:
      - '.github/workflows/axiom-customer-bearer-compute-metering-e2e-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-axiom-bearer-compute-metering-v3
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      D1_UUID: 504029cc-f9a5-495e-818f-63c6144b4ea4
      EDGE: https://axiom-stage.mftintelligence.com
      EXPECTED_BUILD: MFT-AXIOM-V3-FULL-SELF-CONTAINED-20260904
    steps:
      - uses: actions/checkout@v4
      - name: Execute disposable authenticated compute and prove ledger delta
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime,hashlib,json,os,re,secrets,urllib.error,urllib.parse,urllib.request,uuid
          api=os.environ['CF_API'];aid=os.environ['ACCOUNT_ID'];dbid=os.environ['D1_UUID'];edge=os.environ['EDGE'];build=os.environ['EXPECTED_BUILD']
          CFH={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'Accept':'application/json','User-Agent':'MUSITU-Axiom-Bearer-Metering-E2E/3.0'}
          def http(url,method='GET',headers=None,body=None):
              q=urllib.request.Request(url,headers=dict(headers or {}),method=method,data=body)
              try:
                  with urllib.request.urlopen(q,timeout=45) as r:return r.status,r.headers,r.read()
              except urllib.error.HTTPError as e:return e.code,e.headers,e.read()
          def cf(path,obj):
              h=dict(CFH);h['Content-Type']='application/json';c,_,b=http(api+path,'POST',h,json.dumps(obj,separators=(',',':')).encode())
              if not 200<=c<300:raise RuntimeError(f'Cloudflare HTTP {c} {path}: '+b[:240].decode('utf-8','ignore'))
              x=json.loads(b or b'{}')
              if x.get('success') is False:raise RuntimeError('Cloudflare success=false '+path)
              return x.get('result') or []
          def d1(sql,params=None):
              obj={'sql':sql}
              if params is not None:obj['params']=params
              rows=[]
              for rr in cf(f'/accounts/{aid}/d1/database/{dbid}/query',obj):
                  if rr.get('success') is not True:raise RuntimeError('D1 statement failed')
                  rows.extend(rr.get('results') or [])
              return rows
          def live(path,obj=None,token=None,rid=None):
              h={'Accept':'application/json','User-Agent':'MUSITU-Axiom-Bearer-Metering-E2E/3.0'};body=None;method='GET'
              if obj is not None:method='POST';h['Content-Type']='application/json';body=json.dumps(obj,separators=(',',':')).encode()
              if token:h['Authorization']='Bearer '+token
              if rid:h['x-musitu-request-id']=rid
              c,hh,b=http(edge+path,method,h,body)
              try:o=json.loads(b or b'{}')
              except:o={}
              return c,hh,o
          def response_keys(x,depth=0,out=None):
              out=set() if out is None else out
              if depth>5:return out
              if isinstance(x,dict):
                  for k,v in x.items():out.add(str(k));response_keys(v,depth+1,out)
              elif isinstance(x,list):
                  for v in x[:30]:response_keys(v,depth+1,out)
              return out
          # Immutable public runtime contract.
          c,_,health=live('/health')
          if c!=200 or health.get('ok') is not True or health.get('build_id')!=build or int(health.get('operation_count') or -1)!=74:raise RuntimeError('stage health contract mismatch')
          payload={'operation':'arithmetic.evaluate','args':{'expression':'40+2'}}
          c,_,_=live('/v1/compute',payload)
          if c!=401:raise RuntimeError('unauthenticated compute must be 401')
          residue=d1("SELECT (SELECT count(*) FROM customers WHERE id LIKE 'fixture_compute_customer_%')+(SELECT count(*) FROM api_keys WHERE id LIKE 'fixture_compute_key_%')+(SELECT count(*) FROM usage_events WHERE customer_id LIKE 'fixture_compute_customer_%')+(SELECT count(*) FROM usage_buckets WHERE customer_id LIKE 'fixture_compute_customer_%') AS n;")
          if not residue or int(residue[0]['n'])!=0:raise RuntimeError('preexisting disposable fixture residue')
          suffix=uuid.uuid4().hex;customer='fixture_compute_customer_'+suffix;key_id='fixture_compute_key_'+suffix
          token='musitu_axiom_compute_test_'+secrets.token_urlsafe(36);print('::add-mask::'+token)
          email='axiom-compute-fixture-'+suffix+'@invalid.example';key_hash=hashlib.sha256(token.encode()).hexdigest();key_prefix=token[:16]
          now=datetime.datetime.now(datetime.timezone.utc);created=now.isoformat().replace('+00:00','Z');expires=(now+datetime.timedelta(hours=1)).isoformat().replace('+00:00','Z');rid='MUSITU-E2E-'+uuid.uuid4().hex.upper()
          evidence={};inserted=False
          try:
              d1('INSERT INTO customers(id,email,name,plan,status,monthly_unit_override,created_at,updated_at) VALUES(?1,?2,?3,?4,?5,?6,?7,?7)',[customer,email,'MUSITU disposable compute fixture','developer','active',100,created])
              d1('INSERT INTO api_keys(id,customer_id,key_hash,key_prefix,label,status,created_at,last_used_at,expires_at,revoked_at) VALUES(?1,?2,?3,?4,?5,?6,?7,NULL,?8,NULL)',[key_id,customer,key_hash,key_prefix,'disposable-compute-metering-e2e','active',created,expires]);inserted=True
              before_events=int(d1('SELECT count(*) AS n FROM usage_events WHERE customer_id=?1',[customer])[0]['n']);before_units=int(d1('SELECT COALESCE(SUM(used_units),0) AS n FROM usage_buckets WHERE customer_id=?1',[customer])[0]['n'])
              c,hh,o=live('/v1/compute',payload,token,rid)
              if c!=200:raise RuntimeError('authenticated compute failed HTTP '+str(c)+' error='+str(o.get('error')))
              serialized=json.dumps(o,separators=(',',':'),sort_keys=True)
              result42=bool(re.search(r'(?<![0-9])42(?:\.0+)?(?![0-9])',serialized))
              if not result42:raise RuntimeError('computed value 42 absent from response')
              keys=response_keys(o);receipt=any(('receipt' in k.lower() or 'signature' in k.lower()) for k in keys)
              if not receipt:raise RuntimeError('receipt/signature response key absent; keys='+','.join(sorted(keys)[:60]))
              events=d1('SELECT request_id,operation,compute_units,customer_id,key_id,status,http_status,result_sha256 FROM usage_events WHERE customer_id=?1 ORDER BY created_at DESC',[customer])
              if len(events)!=before_events+1:raise RuntimeError('usage event exact delta != 1')
              ev=events[0]
              if ev.get('request_id')!=rid or ev.get('operation')!='arithmetic.evaluate' or ev.get('customer_id')!=customer or ev.get('key_id')!=key_id:raise RuntimeError('usage-event identity mismatch')
              units=int(ev.get('compute_units') or 0)
              if units<=0 or int(ev.get('http_status') or 0)!=200 or len(str(ev.get('result_sha256') or ''))<32:raise RuntimeError('usage-event metering fields invalid')
              after_units=int(d1('SELECT COALESCE(SUM(used_units),0) AS n FROM usage_buckets WHERE customer_id=?1',[customer])[0]['n'])
              if after_units-before_units!=units:raise RuntimeError(f'usage-bucket delta mismatch event={units} bucket={after_units-before_units}')
              buckets=d1('SELECT used_units,unit_limit FROM usage_buckets WHERE customer_id=?1',[customer])
              if len(buckets)!=1 or int(buckets[0].get('unit_limit') or 0)!=100:raise RuntimeError('usage-bucket quota mismatch')
              last=d1('SELECT last_used_at FROM api_keys WHERE id=?1',[key_id])
              if not last or not last[0].get('last_used_at'):raise RuntimeError('API key last_used_at not advanced')
              evidence={'schema':'musitu.axiom.customer_bearer_compute_metering_e2e.v3','gate':'AXIOM_CUSTOMER_BEARER_COMPUTE_METERING_E2E_PASS','edge_host':urllib.parse.urlparse(edge).hostname,'build_id':health.get('build_id'),'operation_count':health.get('operation_count'),'unauth_compute_http':401,'authenticated_compute_http':c,'operation':'arithmetic.evaluate','arg_contract':['expression'],'result_42_observed':True,'receipt_or_signature_material_present':True,'usage_event_delta':1,'compute_units':units,'usage_bucket_unit_delta':units,'request_id_matched':True,'customer_id_matched':True,'key_id_matched':True,'result_sha256_present':True,'api_key_last_used_updated':True,'raw_api_key_published':False,'worker_secret_mutation':False}
          finally:
              if inserted:
                  try:
                      d1('DELETE FROM usage_events WHERE customer_id=?1',[customer]);d1('DELETE FROM usage_buckets WHERE customer_id=?1',[customer]);d1('DELETE FROM api_keys WHERE id=?1',[key_id]);d1('DELETE FROM customers WHERE id=?1',[customer])
                  finally:
                      remain=d1('SELECT (SELECT count(*) FROM customers WHERE id=?1)+(SELECT count(*) FROM api_keys WHERE id=?2)+(SELECT count(*) FROM usage_events WHERE customer_id=?1)+(SELECT count(*) FROM usage_buckets WHERE customer_id=?1) AS n',[customer,key_id]);evidence['fixture_rows_remaining']=int(remain[0]['n']) if remain else -1
          if evidence.get('gate')!='AXIOM_CUSTOMER_BEARER_COMPUTE_METERING_E2E_PASS' or evidence.get('fixture_rows_remaining')!=0:raise RuntimeError('E2E gate or cleanup failed')
          evidence['cleanup_complete']=True
          raw=(json.dumps(evidence,indent=2,sort_keys=True)+'\n').encode();open('bearer-compute-metering-e2e-v3.json','wb').write(raw);dg=hashlib.sha256(raw).hexdigest();open('bearer-compute-metering-e2e-v3.sha256','w').write(dg+'  bearer-compute-metering-e2e-v3.json\n')
          print(json.dumps({**evidence,'evidence_sha256':dg},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-bearer-compute-metering-e2e-v3
          path: |
            bearer-compute-metering-e2e-v3.json
            bearer-compute-metering-e2e-v3.sha256
          retention-days: 30
          if-no-files-found: error
