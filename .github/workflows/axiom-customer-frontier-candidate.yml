name: AXIOM Customer Frontier Candidate Gate

on:
  pull_request:
    paths:
      - 'customer_frontier/**'
      - '.github/workflows/axiom-customer-frontier-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiom-customer-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-tests-only:
    name: Isolated Tests (NO RELEASE)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PAYMENT_CHECKOUT_QUALIFIED: 'false'
      IDENTITY_ENROLLMENT_QUALIFIED: 'false'
      IDENTITY_LOGIN_QUALIFIED: 'false'
      ALLOW_INTERNAL_RECONCILIATION: 'false'
    steps:
      - name: Checkout candidate source (no credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22 for native SQLite test adapter
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python 3.12 for independent reference vectors
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JavaScript syntax
        run: |
          set -eu
          for p in customer_frontier/customer_control_plane/*.mjs customer_frontier/standalone_portal/portal.js; do node --check "$p"; done
      - name: Run customer ledger, auth and isolation tests
        run: node --test customer_frontier/tests/customer.test.mjs
      - name: Run reference and frontier-gate tests
        run: python -m unittest discover -s customer_frontier/tests -p 'test_*.py' -v
      - name: Fail closed on unqualified superiority claims
        run: |
          python customer_frontier/benchmarks/verify_benchmarks.py customer_frontier/benchmarks/frontier_manifest.json customer_frontier/benchmarks/observations_not_proven.json --output /tmp/axiom-frontier-not-certified.json
          python - <<'PY'
          import json
          o=json.load(open('/tmp/axiom-frontier-not-certified.json'))
          assert 'NOT_CERTIFIED' in str(o) or 'not_certified' in str(o).lower(), 'Missing fail-closed certification status'
          PY
