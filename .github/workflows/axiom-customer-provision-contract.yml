name: MUSITU Axiom Customer Provision Contract

on:
  push:
    paths:
      - '.github/workflows/axiom-customer-provision-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct protected source
        env:
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          P=deploy_payload/runtime_min
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > runtime.enc.b64
          base64 -d runtime.enc.b64 > runtime.tar.gz.enc
          test "$(sha256sum runtime.tar.gz.enc | awk '{print $1}')" = 'b82448d6b4b34b302748815af976b535d69922c197d4b7a9056fc2f91a9e12cf'
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in runtime.tar.gz.enc -out runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          test "$(sha256sum runtime.tar.gz | awk '{print $1}')" = 'b4d5a0266446523969a619f5e9bb5a04d9b815c78a2ab82ed046ef5e23d53663'
          mkdir runtime && tar -xzf runtime.tar.gz -C runtime
      - name: Emit provisioning metadata only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re
          idx=pathlib.Path('runtime/worker/src/index.js').read_text(errors='replace')
          db=pathlib.Path('runtime/worker/src/db.js').read_text(errors='replace')
          pos=idx.find('/v1/admin/customers')
          if pos<0: raise SystemExit('admin customers route missing')
          w=idx[max(0,pos-4500):min(len(idx),pos+8500)]
          # Function definitions/signatures in db.js, names only.
          funcs=[]
          for m in re.finditer(r'export\s+(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(([^)]*)\)',db):
              name=m.group(1); params=[x.strip().split('=')[0].strip() for x in m.group(2).split(',') if x.strip()]
              if re.search(r'customer|api.?key|key|usage',name,re.I): funcs.append({'name':name,'params':params})
          # Imports from db used in index route vicinity.
          imported=[]
          for m in re.finditer(r'import\s*\{([^}]+)\}\s*from\s*["\']\.\/db\.js["\']',idx,re.S):
              imported += [x.strip().split(' as ')[-1] for x in m.group(1).split(',') if x.strip()]
          route_calls=[]
          for name in imported:
              if re.search(r'\b'+re.escape(name)+r'\s*\(',w): route_calls.append(name)
          body_props=sorted(set(re.findall(r'\b(?:body|payload|input)\.([A-Za-z_$][\w$]*)\b',w)))
          destructured=[]
          for m in re.finditer(r'\{\s*([A-Za-z_$][\w$]*(?:\s*,\s*[A-Za-z_$][\w$]*)*)\s*\}\s*=\s*(?:body|payload|input)\b',w):
              destructured += [x.strip() for x in m.group(1).split(',')]
          string_keys=sorted(set(re.findall(r'["\']([A-Za-z_][A-Za-z0-9_]*)["\']\s*:',w)))
          auth_headers=sorted(set(x.lower() for x in re.findall(r'headers\.get\s*\(\s*["\']([^"\']+)["\']',w)))
          out={
            'schema':'musitu.axiom.customer_provision_contract.v1',
            'route':'/v1/admin/customers',
            'route_methods':sorted(set(re.findall(r'request\.method\s*(?:===|==)\s*["\']([A-Z]+)["\']',w))),
            'route_db_calls':sorted(set(route_calls)),
            'body_properties':body_props,
            'body_destructured_names':sorted(set(destructured)),
            'object_string_keys_near_route':string_keys,
            'auth_header_names':auth_headers,
            'db_exported_customer_key_usage_functions':funcs,
            'plaintext_source_committed':False
          }
          pathlib.Path('customer-provision-contract.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mft-axiom-customer-provision-contract
          path: customer-provision-contract.json
          retention-days: 7
