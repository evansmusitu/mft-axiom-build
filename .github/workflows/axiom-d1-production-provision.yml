name: MUSITU Axiom Production D1 Provision

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/axiom-d1-production-provision.yml'

permissions:
  contents: read

jobs:
  provision-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API: https://api.cloudflare.com/client/v4
      D1_NAME: mft-axiom-prod
    steps:
      - name: Resolve account and create or read D1
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.parse,urllib.request
          base=os.environ['CF_API']; h={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'Content-Type':'application/json'}
          def call(path,method='GET',body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(base+path,headers=h,method=method,data=data)
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          zones=call('/zones?name='+urllib.parse.quote('mftintelligence.com')+'&status=active')
          rows=zones.get('result') or []
          if not zones.get('success') or len(rows)!=1: raise SystemExit('zone invariant failed')
          aid=(rows[0].get('account') or {}).get('id')
          if not aid: raise SystemExit('account id missing')
          listing=call(f'/accounts/{aid}/d1/database?name='+urllib.parse.quote(os.environ['D1_NAME']))
          matches=[x for x in (listing.get('result') or []) if x.get('name')==os.environ['D1_NAME']]
          if len(matches)>1: raise SystemExit('duplicate production D1 invariant failed')
          created=False
          if not matches:
              created_resp=call(f'/accounts/{aid}/d1/database','POST',{'name':os.environ['D1_NAME'],'read_replication':{'mode':'auto'}})
              if not created_resp.get('success'): raise SystemExit('D1 create failed')
              matches=[created_resp.get('result') or {}]; created=True
          dbid=matches[0].get('uuid')
          if not dbid: raise SystemExit('D1 uuid missing')
          readback=call(f'/accounts/{aid}/d1/database/{dbid}')
          db=readback.get('result') or {}
          if not readback.get('success') or db.get('uuid')!=dbid or db.get('name')!=os.environ['D1_NAME']:
              raise SystemExit('D1 readback invariant failed')
          out={'schema':'musitu.axiom.d1.production_provision.v1','created':created,'database':db,'production_compute_active':False,'wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED'}
          json.dump(out,open('axiom-d1-production.json','w'),indent=2,sort_keys=True)
          print(json.dumps({'d1_provision_pass':True,'created':created,'name':db.get('name'),'uuid_present':bool(dbid),'num_tables':db.get('num_tables')}))
          PY
      - name: Seal D1 evidence
        run: sha256sum axiom-d1-production.json > axiom-d1-production.sha256
      - name: Upload D1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-production-d1
          path: |
            axiom-d1-production.json
            axiom-d1-production.sha256
          retention-days: 7
          if-no-files-found: error
