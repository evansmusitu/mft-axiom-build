name: MUSITU Databricks private pilot notebook import (no compute)

on:
  push:
    branches:
      - pilot/axiom-databricks-pat-20261027
    paths:
      - '.github/workflows/axiom-databricks-import-pilot.yml'
      - 'integrations/databricks/scripts/import_pilot_notebook.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-databricks-import-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-notebook-only:
    name: Import synthetic notebook into personal workspace (no compute)
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.ref == 'refs/heads/pilot/axiom-databricks-pat-20261027' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[databricks-import-pilot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Import restricted synthetic Python notebook via Databricks Workspace API
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 integrations/databricks/scripts/import_pilot_notebook.py
