name: MUSITU Axiom Databricks Unity Gateway read-only readiness

on:
  push:
    branches:
      - pilot/axiom-databricks-pat-20261027
    paths:
      - ".github/workflows/axiom-databricks-unity-readiness.yml"
      - "integrations/databricks/unity_readiness.py"
      - "integrations/databricks/tests/test_unity_readiness.py"

permissions:
  contents: read

concurrency:
  group: musitu-axiom-unity-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readiness-contract:
    name: Unit-test redaction and allowlisted GET requests
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref == 'refs/heads/pilot/axiom-databricks-pat-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate no-write/read-only probe contract
        shell: bash
        run: |
          set -euo pipefail
          (cd integrations/databricks && python3 -m unittest tests/test_unity_readiness.py -v)
          echo 'MUSITU_DATABRICKS_UNITY_CONTRACT_PASS'

  unity-readiness:
    name: One-time workspace Unity MCP API access check, zero compute
    needs: readiness-contract
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.ref == 'refs/heads/pilot/axiom-databricks-pat-20261027' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[databricks-unity-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: GET-only Databricks Unity catalog and MCP service discovery
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 integrations/databricks/unity_readiness.py
