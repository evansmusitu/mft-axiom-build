name: Axiom dedicated OpenAI reviewer access

on:
  push:
    branches: [openai/axiom-review-access-20261027]
    paths: ['.github/workflows/axiom-dedicated-reviewer-access.yml']

permissions:
  contents: read

concurrency:
  group: axiom-dedicated-openai-reviewer-20261027
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated review identity and verify genuine OAuth and five positive cases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 provision_dedicated_review_access.py
      - name: Preserve public evidence and RSA-sealed dedicated reviewer credential
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-dedicated-review-access-20261027
          path: reviewer-access-evidence/
          retention-days: 7
          if-no-files-found: error
