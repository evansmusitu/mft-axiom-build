name: AXIOM distribution gate

on:
  pull_request:
    branches:
      - frontier/axiom-orchestrator-integration-20260927

permissions:
  contents: read

jobs:
  distribution-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runtime versions
        run: |
          python3 --version
          node --version
      - name: Python distribution-policy tests
        run: PYTHONPATH=. python3 -m multiplatform.tests.test_distribution_profiles
      - name: JavaScript gateway syntax
        run: node --check mcp/musitu_axiom_mcp_worker_anthropic.mjs
