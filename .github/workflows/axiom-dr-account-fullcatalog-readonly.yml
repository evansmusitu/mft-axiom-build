name: AXIOM separate-account D1 catalog empty-and-unbound metadata only
on:
  push:
    branches: [ops/axiom-dr-account-fullcatalog-readonly-20261109]
    paths: [.github/workflows/axiom-dr-account-fullcatalog-readonly.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.actor == 'evansmusitu' &&
      github.ref == 'refs/heads/ops/axiom-dr-account-fullcatalog-readonly-20261109' &&
      github.event.before == 'c3c5aaab90e94f1ca84ac9903f9d481c23c4f350'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Exact separate-account metadata-only database catalog and Worker binding check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_AXIOM_DR_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,urllib.error,urllib.request
          from pathlib import Path
          ACCOUNT='c954f0c842a486d0388c05b19cd21e47'
          TARGET='e36972b3-850d-4273-b934-2fa67587d9f1'
          DBNAME='axiom-disposable-dr-target-20261108'
          ROOT='https://api.cloudflare.com/client/v4/accounts/'+ACCOUNT
          TOKEN=os.environ.get('TOKEN','')
          if not TOKEN or any(x in TOKEN for x in '\r\n'):raise SystemExit('NO_SCOPED_READ_TOKEN')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*a,**kw):return None
          opener=urllib.request.build_opener(NoRedirect)
          requests=[]
          def read(path):
            if path not in ('/d1/database?per_page=100&page=1','/workers/scripts') and not (
              re.fullmatch(r'/d1/database/[0-9a-f]{8}-[0-9a-f-]{27}',path) or
              re.fullmatch(r'/workers/scripts/[a-zA-Z0-9_-]{1,128}/settings',path)
            ):raise ValueError('UNREVIEWED_RESOURCE_PATH')
            request=urllib.request.Request(ROOT+path,method='GET',headers={
              'authorization':'Bearer '+TOKEN,'accept':'application/json',
              'user-agent':'MUSITU-AXIOM-DR-CATALOG-GET-ONLY/20261109'})
            try:
              with opener.open(request,timeout=16) as f:
                status=f.status;raw=f.read(150001)
            except urllib.error.HTTPError as exc:
              status=exc.code;raw=b''
            except (OSError,TimeoutError,ValueError):
              status='TRANSPORT_ERROR';raw=b''
            requests.append({'kind':'d1_detail' if path.startswith('/d1/database/') else (
              'workers_binding' if path.endswith('/settings') else 'catalog'),'http':status})
            if status!=200 or len(raw)>150000:return None
            try:doc=json.loads(raw)
            except (ValueError,UnicodeError):return None
            return doc if isinstance(doc,dict) and doc.get('success') is True else None
          cat=read('/d1/database?per_page=100&page=1')
          workers=read('/workers/scripts')
          rows=cat.get('result') if isinstance(cat,dict) else None
          paging=cat.get('result_info') if isinstance(cat,dict) else None
          scripts=workers.get('result') if isinstance(workers,dict) else None
          complete=(isinstance(rows,list) and 0<len(rows)<=30 and isinstance(paging,dict)
            and type(paging.get('count')) is int and paging['count']==len(rows)
            and type(paging.get('total_count')) is int and paging['total_count']==len(rows)
            and type(paging.get('page')) is int and paging['page']==1
            and all(isinstance(x,dict) and re.fullmatch(r'[0-9a-f]{8}-[0-9a-f-]{27}',str(x.get('uuid','')))
                and isinstance(x.get('name'),str) for x in rows))
          worker_complete=(isinstance(scripts,list) and len(scripts)<=30 and
            all(isinstance(x,dict) and re.fullmatch(r'[a-zA-Z0-9_-]{1,128}',str(x.get('id',''))) for x in scripts))
          target_binding_count=0
          other_binding_count=0
          if worker_complete:
            for script in scripts:
              response=read('/workers/scripts/'+script['id']+'/settings')
              settings=response.get('result') if isinstance(response,dict) else None
              bindings=settings.get('bindings') if isinstance(settings,dict) else None
              if not isinstance(bindings,list):
                worker_complete=False
                continue
              for binding in bindings:
                if isinstance(binding,dict) and isinstance(binding.get('id',binding.get('database_id')),str):
                  if binding.get('id',binding.get('database_id'))==TARGET:target_binding_count+=1
                  else:other_binding_count+=1
          candidates=[]
          verified=[]
          if complete:
            for row in rows:
              db=read('/d1/database/'+row['uuid'])
              detail=db.get('result') if isinstance(db,dict) else None
              identity_ok=isinstance(detail,dict) and detail.get('uuid')==row['uuid'] and detail.get('name')==row['name']
              tables=detail.get('num_tables') if identity_ok else None
              if type(tables) is not int:
                verified.append({'matches_historical_target':row['uuid']==TARGET,'metadata_verified':False})
                continue
              is_target=row['uuid']==TARGET and row['name']==DBNAME
              entry={'matches_historical_target':is_target,'metadata_verified':True,
                'table_count':tables,'zero_table':tables==0,
                'axiom_label':'axiom' in row['name'].lower(),
                'restore_purpose_label':any(s in row['name'].lower() for s in ('disposable','restore','sandbox','dr-target')),
                'preserve_existing_data':tables>0}
              verified.append(entry)
              if tables==0 and not is_target and 'axiom' in row['name'].lower() and worker_complete:
                candidates.append({'name':row['name'],'zero_table_metadata':True,
                   'not_restoration_approved':True})
          all_verified=complete and len(verified)==len(rows) and all(x.get('metadata_verified') is True for x in verified)
          observed={'schema':'AXIOM_SEPARATE_DR_ACCOUNT_DATABASE_CATALOG_READONLY_V1',
             'account_inventory_complete':bool(complete),'database_count':len(rows) if complete else None,
             'all_database_metadata_verified':bool(all_verified),
             'worker_bindings_complete':bool(worker_complete),
             'target_binding_count':target_binding_count if worker_complete else None,
             'other_binding_count':other_binding_count if worker_complete else None,
             'databases':verified,'potential_empty_axiom_names':candidates,
             'read_requests':len(requests),'http_non200_count':sum(x['http']!=200 for x in requests),
             'provider_mutations':0,'sql_queries':0,'customer_rows_read':0,
             'account_ownership_qualified':False,
             'backup_restore_qualified':False,'identity_signed_login_qualified':False,
             'production_oauth_touched':False,'release_qualified':False,
             'status':'GET_ONLY_METADATA_COMPLETE_RESTORE_NO_GO' if all_verified and worker_complete else 'INCOMPLETE_NO_GO'}
          payload=(json.dumps(observed,sort_keys=True,indent=2)+'\n').encode()
          p=Path('axiom-separate-account-d1-catalog.json');p.write_bytes(payload)
          p.with_name(p.name+'.sha256').write_text(hashlib.sha256(payload).hexdigest()+'  '+p.name+'\n')
          print('DR_D1_CATALOG='+observed['status']+' WRITES=0 SQL=0')
          if not all_verified or not worker_complete:raise SystemExit(2)
          PY
      - name: Preserve sanitized D1/Workers GET-only readback with detached SHA256
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-crossaccount-d1-catalog-readonly-20261109
          path: |
            axiom-separate-account-d1-catalog.json
            axiom-separate-account-d1-catalog.json.sha256
          if-no-files-found: warn
          retention-days: 14
