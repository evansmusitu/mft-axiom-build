name: AXIOM isolated D1 snapshot restore offline qualification 20261108 (NO CREDENTIALS)
on:
  pull_request:
    types: [opened]
    paths: ['.github/workflows/axiom-dr-hosted-restore-offline-20261108.yml']
permissions: {contents: read}
concurrency: {group: axiom-dr-hosted-restore-offline-20261108, cancel-in-progress: false}
jobs:
  private-snapshot-import-reorder-tests:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'build/axiom-dr-hosted-snapshot-restore-20261108' && github.event.pull_request.base.ref == 'build/axiom-dr-created-target-readback-20261108' && github.event.pull_request.base.sha == '675e9f9d9e5901883f2ee16ac3f312bac53a28ff' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 29a7e03f2b2f3ceb35a1297a9d1a1aae8a4072c6
          fetch-depth: 1
          persist-credentials: false
      - name: Pin exact source and target and keep customer SQL out of repository
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 29a7e03f2b2f3ceb35a1297a9d1a1aae8a4072c6
          test "$(git hash-object customer_frontier/qualification/isolated_hosted_restore_20261108.py)" = a62e1a32edf06ad91e0a56468db6fce7daac233f
          test "$(git hash-object customer_frontier/qualification/test_isolated_hosted_restore_20261108.py)" = 7ce664c79db1bc7c0fb736e474361c3aa0bb2fa9
          python3 -m py_compile customer_frontier/qualification/isolated_hosted_restore_20261108.py customer_frontier/qualification/test_isolated_hosted_restore_20261108.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('customer_frontier/qualification/isolated_hosted_restore_20261108.py').read_text()
          assert "SOURCE_DB='ccc473f1-fbb5-4b8d-8a24-45f3696ac10f'" in s
          assert "TARGET_DB='e36972b3-850d-4273-b934-2fa67587d9f1'" in s
          assert "ARCHIVED_SQL_SHA='1daa973a46c012f9c61b36814bf339fe93ae374e418b7938bb86c36f1dcde627'" in s
          assert "REORDERED_SQL_SHA='84fc058d1ae5986b15c996449827b05af962ad0483f47a3b14655be9a90c1d53'" in s
          assert "SOURCE_BACKUP_ENVELOPE_SHA='d8fdb7d06f27d3053799ba70eb2c4c12d2b5570eb9c5cf4724e7216908d0b3b3'" in s
          assert "if account==SOURCE_ACCOUNT and suffix not in ('','/query','/export')" in s
          assert "if account==TARGET_ACCOUNT and suffix not in ('','/query','/import')" in s
          assert "customer_row_values_logged':False" in s and "customer_data_artifact_created':False" in s
          assert "release_authority':False" in s
          print('EXACT_SHA_PINNED_ISOLATED_D1_RECOVERY_SOURCE_ADMITTED')
          PY
      - name: Seven fake no-secret safe-import, foreign-key and schema drift tests
        shell: bash
        run: python3 -m unittest discover -s customer_frontier/qualification -p test_isolated_hosted_restore_20261108.py -v
