name: AXIOM ECC S0 Local Recovery Hardening Candidate (No Provider Or Release)
on:
  push:
    branches:
      - build/axiom-ecc-s0-local-hardening-20261022
    paths:
      - 'ops/openhands_qualification/**'
      - '.github/workflows/axiom-ecc-s0-recovery-build-20261022.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-ecc-recovery-tests:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'build/axiom-ecc-s0-local-hardening-20261022'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require isolated historical parent and no external authorization
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 383f5f52d6191a2e55bb634c7dcabcafcd3bb654 HEAD
          test -z "${OPENHANDS_API_KEY:-}"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${AXIOM_PRODUCTION_AUTHORIZATION:-}"
          test -z "${AXIOM_SIGNING_PRIVATE_KEY:-}"
          echo AXIOM_S0_ONLY_NO_PROVIDER_OR_PRODUCTION_AUTHORIZATION
      - name: Local regression and adversarial recovery tests
        run: |
          set -euo pipefail
          python -m unittest discover -s ops/openhands_qualification/test -p 'test_*.py' -v
          python -m compileall -q ops/openhands_qualification
          echo AXIOM_LOCAL_ECC_RECOVERY_TESTS_PASS_NOT_EXTERNAL_AUTHORITY
      - name: Fail closed on unearned external security claims
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'FAILED_IN_SYNTHETIC_ATTACK' ops/openhands_qualification/README.md
          grep -Fq 'production_authority' ops/openhands_qualification/mission_ledger.py
          grep -Fq 'provider_dispatch_allowed' ops/openhands_qualification/mission_ledger.py
          grep -Fq 'The replay succeeds.' ops/trackb27/EVIDENCE_GLOBAL_ROLLBACK_COUNTEREXAMPLE.md
          echo AXIOM_B27_GLOBAL_ANTIROLLBACK_STILL_FAILED
