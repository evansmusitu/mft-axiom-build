name: AXIOM Phase2 encoded IPv4 origin guard (offline, NO RELEASE)

on:
  push:
    branches:
      - review/axiom-vpc-encoded-ip-rejection-20261109
    paths:
      - '.github/workflows/axiom-encoded-ip-guard-offline-20261109.yml'
      - 'reasoning/phase2/cloudflare-staging/private_origin_admission.py'
      - 'reasoning/phase2/cloudflare-staging/test_private_origin_encoded_ip_guard.py'

permissions:
  contents: read

concurrency:
  group: axiom-vpc-encoded-ip-offline-20261109
  cancel-in-progress: false

jobs:
  offline-ip-alias-denial:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.ref == 'refs/heads/review/axiom-vpc-encoded-ip-rejection-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run encoded IPv4 hostname rejection regressions without network
        shell: bash
        working-directory: reasoning/phase2/cloudflare-staging
        run: |
          set -euo pipefail
          python3 -m py_compile private_origin_admission.py test_private_origin_encoded_ip_guard.py
          python3 -m unittest -v test_private_origin_encoded_ip_guard.py
