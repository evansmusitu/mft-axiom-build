name: MUSITU Axiom Enterprise Customer Production Foundation

on:
  push:
    branches:
      - 'support/axiom-enterprise-customer-production-rollout-20261009'
    paths:
      - '.github/workflows/axiom-enterprise-customer-production-foundation.yml'

permissions:
  contents: read

jobs:
  foundation:
    if: github.event_name == 'push' && github.event.before == '5d21388ec416b12e671cf1c9bfe0ed0949f190fc'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 10
    env:
      CF_ACCOUNT: '93f395f5121954671f92fffa453d6b61'
      SUPPORT_DB: 'a525c8b6-9b44-413b-a219-46e419b71b12'
      ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      D1_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_GLOBAL_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Create deny-by-default Access app and migrate D1
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const api='https://api.cloudflare.com/client/v4',account=process.env.CF_ACCOUNT,db=process.env.SUPPORT_DB;
          const at=String(process.env.ACCESS_TOKEN||''),dt=String(process.env.D1_TOKEN||''),email=String(process.env.CF_EMAIL||''),key=String(process.env.CF_GLOBAL_KEY||'');
          async function raw(headers,path,{method='GET',body}={}){
            const r=await fetch(api+path,{method,headers:{...headers,accept:'application/json',...(body===undefined?{}:{'content-type':'application/json'})},...(body===undefined?{}:{body:JSON.stringify(body)})});
            let p={};try{p=await r.json()}catch{};return {r,p};
          }
          async function call(headers,path,opts={}){
            const {r,p}=await raw(headers,path,opts);if(!r.ok||p?.success===false)throw new Error('Cloudflare '+(opts.method||'GET')+' '+path+' failed HTTP '+r.status+' codes='+((p?.errors||[]).map(x=>x?.code).filter(Boolean).join(',')||'none'));return p.result;
          }
          const ah=at?{authorization:'Bearer '+at}:null,gh={'X-Auth-Email':email,'X-Auth-Key':key},dh={authorization:'Bearer '+dt};
          async function access(path,opts={}){
            if(ah){const a=await raw(ah,path,opts);if(a.r.ok&&a.p?.success!==false)return a.p.result;if(!(a.r.status===401||a.r.status===403))throw new Error('Access API failed '+a.r.status);}
            return call(gh,path,opts);
          }
          async function query(sql){
            const x=await call(dh,'/accounts/'+account+'/d1/database/'+db+'/query',{method:'POST',body:{sql}});
            const b=Array.isArray(x)?x[0]:x;return b?.results||[];
          }
          const [org,idps,apps]=await Promise.all([
            access('/accounts/'+account+'/access/organizations'),
            access('/accounts/'+account+'/access/identity_providers'),
            access('/accounts/'+account+'/access/apps?per_page=100')
          ]);
          const authDomain=String(org?.auth_domain||'').trim();if(!authDomain)throw new Error('Access auth domain missing');
          const idpRows=Array.isArray(idps)?idps:[];if(idpRows.length!==1)throw new Error('expected exactly one Access identity provider');
          const idpId=String(idpRows[0]?.id||'');if(!idpId)throw new Error('Access identity provider id missing');

          const target='support.mftintelligence.com/enterprise/*';
          let matches=(Array.isArray(apps)?apps:[]).filter(x=>String(x?.domain||'').toLowerCase()===target);
          if(matches.length>1)throw new Error('duplicate enterprise Access apps');
          let app=matches[0]||null,created=false;
          if(!app){
            app=await access('/accounts/'+account+'/access/apps',{method:'POST',body:{
              name:'MUSITU Axiom Enterprise Support',
              type:'self_hosted',domain:target,session_duration:'8h',
              allowed_idps:[idpId],auto_redirect_to_identity:true,app_launcher_visible:false
            }});
            created=true;
          }
          const appId=String(app?.id||''),aud=String(app?.aud||'');if(!appId||!aud)throw new Error('enterprise Access app incomplete');
          const policies=await access('/accounts/'+account+'/access/apps/'+encodeURIComponent(appId)+'/policies');
          if(!Array.isArray(policies)||policies.length!==0)throw new Error('enterprise Access must remain deny-by-default before Worker stage');

          const before=(await query("SELECT (SELECT COUNT(*) FROM support_cases) cases,(SELECT COUNT(*) FROM support_case_events) events,(SELECT COUNT(*) FROM support_case_messages) messages,(SELECT COUNT(*) FROM support_organizations) organizations,(SELECT COUNT(*) FROM support_support_entitlements) entitlements;"))[0]||{};
          const bookmark=await call(dh,'/accounts/'+account+'/d1/database/'+db+'/time_travel/bookmark');
          const bm=String(bookmark?.bookmark||'');if(!bm)throw new Error('D1 Time Travel bookmark missing');
          await query(fs.readFileSync('support/schema.sql','utf8'));
          const after=(await query("SELECT (SELECT COUNT(*) FROM support_cases) cases,(SELECT COUNT(*) FROM support_case_events) events,(SELECT COUNT(*) FROM support_case_messages) messages,(SELECT COUNT(*) FROM support_organizations) organizations,(SELECT COUNT(*) FROM support_support_entitlements) entitlements,(SELECT COUNT(*) FROM support_org_invites) org_invites,(SELECT COUNT(*) FROM support_org_memberships) org_memberships;"))[0]||{};
          for(const k of ['cases','events','messages','organizations','entitlements'])if(Number(before[k]||0)!==Number(after[k]||0))throw new Error('existing count changed: '+k);
          const objects=await query("SELECT name FROM sqlite_master WHERE type='table' AND name IN ('support_org_invites','support_org_memberships')");
          if(objects.length!==2)throw new Error('enterprise tables missing after migration');
          console.log(JSON.stringify({
            gate:'MUSITU_AXIOM_ENTERPRISE_CUSTOMER_PRODUCTION_FOUNDATION',status:'PASS',
            access:{created,domain:target,allow_policy_count:0,deny_by_default:true,app_id_present:true,audience_present:true,auth_domain_present:true},
            d1:{bookmark_sha256:createHash('sha256').update(bm).digest('hex'),bookmark_value_recorded:false,before,after,migration:'ADDITIVE_ONLY'},
            secret_values_recorded:false,customer_content_read:false,recovery_code_read:false
          }));
          NODE
