name: MUSITU Axiom Enterprise Customer Production Preflight

on:
  push:
    branches:
      - 'support/axiom-enterprise-customer-production-rollout-20261009'
    paths:
      - '.github/workflows/axiom-enterprise-customer-production-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    if: github.event_name == 'push' && github.event.before == '9d63260614efbc98cf9526894344388792dd434a'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 10
    env:
      CF_ACCOUNT: '93f395f5121954671f92fffa453d6b61'
      SUPPORT_DB: 'a525c8b6-9b44-413b-a219-46e419b71b12'
      ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      D1_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
      CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_GLOBAL_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact source and regression gate
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'support/axiom-enterprise-customer-production-rollout-20261009'
          test "${{ github.event.before }}" = '9d63260614efbc98cf9526894344388792dd434a'
          node --test support/tests/*.test.mjs

      - name: Read production enterprise preflight
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          const api='https://api.cloudflare.com/client/v4',account=process.env.CF_ACCOUNT,db=process.env.SUPPORT_DB;
          const at=String(process.env.ACCESS_TOKEN||''),dt=String(process.env.D1_TOKEN||''),wt=String(process.env.WORKER_TOKEN||'');
          const email=String(process.env.CF_EMAIL||''),key=String(process.env.CF_GLOBAL_KEY||'');
          async function raw(headers,path,{method='GET',body}={}){
            const r=await fetch(api+path,{method,headers:{...headers,accept:'application/json',...(body===undefined?{}:{'content-type':'application/json'})},...(body===undefined?{}:{body:JSON.stringify(body)})});
            let p={};try{p=await r.json()}catch{};return {r,p};
          }
          async function call(headers,path,opts={}){
            const {r,p}=await raw(headers,path,opts);if(!r.ok||p?.success===false)throw new Error('Cloudflare read failed '+r.status+' '+path);return p.result;
          }
          const ah=at?{authorization:'Bearer '+at}:null,gh={'X-Auth-Email':email,'X-Auth-Key':key},dh={authorization:'Bearer '+dt},wh={authorization:'Bearer '+wt};
          async function access(path){
            if(ah){const a=await raw(ah,path);if(a.r.ok&&a.p?.success!==false)return a.p.result;if(!(a.r.status===401||a.r.status===403))throw new Error('Access read failed '+a.r.status);}
            return call(gh,path);
          }
          async function query(sql){
            const x=await call(dh,'/accounts/'+account+'/d1/database/'+db+'/query',{method:'POST',body:{sql}});
            const b=Array.isArray(x)?x[0]:x;return b?.results||[];
          }
          const [apps,domains,scripts,pubSettings,opsSettings,bookmark,counts,objects]=await Promise.all([
            access('/accounts/'+account+'/access/apps?per_page=100'),
            call(wh,'/accounts/'+account+'/workers/domains'),
            call(wh,'/accounts/'+account+'/workers/scripts'),
            call(wh,'/accounts/'+account+'/workers/scripts/musitu-axiom-support/settings'),
            call(wh,'/accounts/'+account+'/workers/scripts/musitu-axiom-support-ops/settings'),
            call(dh,'/accounts/'+account+'/d1/database/'+db+'/time_travel/bookmark'),
            query("SELECT (SELECT COUNT(*) FROM support_cases) cases,(SELECT COUNT(*) FROM support_case_events) events,(SELECT COUNT(*) FROM support_case_messages) messages,(SELECT COUNT(*) FROM support_organizations) organizations,(SELECT COUNT(*) FROM support_support_entitlements) entitlements;"),
            query("SELECT type,name FROM sqlite_master WHERE type IN ('table','index','trigger') AND name LIKE 'support_%' ORDER BY type,name;")
          ]);
          const appRows=Array.isArray(apps)?apps:[],domainRows=Array.isArray(domains)?domains:[],scriptRows=Array.isArray(scripts)?scripts:[];
          const enterprise=appRows.filter(x=>String(x?.domain||'').toLowerCase()==='support.mftintelligence.com/enterprise/*');
          const bm=String(bookmark?.bookmark||'');if(!bm)throw new Error('D1 Time Travel bookmark missing');
          const pubBindings=Array.isArray(pubSettings?.bindings)?pubSettings.bindings:[],opsBindings=Array.isArray(opsSettings?.bindings)?opsSettings.bindings:[];
          console.log(JSON.stringify({
            gate:'MUSITU_AXIOM_ENTERPRISE_CUSTOMER_PRODUCTION_PREFLIGHT',
            status:'PASS',
            access:{enterprise_app_count:enterprise.length},
            d1:{
              bookmark_sha256:createHash('sha256').update(bm).digest('hex'),
              bookmark_value_recorded:false,
              counts:counts[0]||{},
              enterprise_tables_present:objects.filter(x=>['support_org_invites','support_org_memberships'].includes(String(x.name))).map(x=>String(x.name))
            },
            workers:{
              public_domain_ok:domainRows.some(x=>String(x?.hostname||'')==='support.mftintelligence.com'&&String(x?.service||'')==='musitu-axiom-support'),
              operator_domain_ok:domainRows.some(x=>String(x?.hostname||'')==='support-ops.mftintelligence.com'&&String(x?.service||'')==='musitu-axiom-support-ops'),
              public_worker_exists:scriptRows.some(x=>String(x?.id||x?.name||'')==='musitu-axiom-support'),
              operator_worker_exists:scriptRows.some(x=>String(x?.id||x?.name||'')==='musitu-axiom-support-ops'),
              public_binding_names:pubBindings.map(x=>String(x?.name||'')).sort(),
              operator_service_binding:opsBindings.some(x=>x?.type==='service'&&x?.name==='SUPPORT_API'&&x?.service==='musitu-axiom-support')
            },
            customer_content_read:false,recovery_code_read:false,secret_values_recorded:false,mutation_performed:false
          }));
          NODE
