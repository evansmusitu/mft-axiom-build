name: Axiom Exhaustive Defect Patch Candidate 20261004
on:
  push:
    branches: [audit/axiom-74-operation-exhaustive-20261004]
    paths:
      - 'frontier_v5/scripts/patch_exhaustive_operation_defects.py'
      - 'frontier_v5/scripts/verify_all_74_strict_args.py'
      - '.github/workflows/axiom-exhaustive-defect-patch-candidate-20261004.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Reconstruct exact live patched kernel
        env:
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          P=deploy_payload/runtime_min
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > runtime.enc.b64
          base64 -d runtime.enc.b64 > runtime.tar.gz.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in runtime.tar.gz.enc -out runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          mkdir runtime && tar -xzf runtime.tar.gz -C runtime
          test "$(sha256sum runtime/kernel/app/main.py | awk '{print $1}')" = '9389e4a501cd2385afe3820da685e97790e723da3bc5871a6dc2565b19f8fa3f'
          python frontier_v5/scripts/patch_quadratic_constraints_runtime.py runtime/kernel/app/main.py
          test "$(sha256sum runtime/kernel/app/main.py | awk '{print $1}')" = 'cfa39f0f17c56a183c5024a600086aba4644ec925343129245a62e18294f7c47'
          python frontier_v5/scripts/patch_exhaustive_operation_defects.py runtime/kernel/app/main.py
          sha256sum runtime/kernel/app/main.py
      - name: Install runtime roots
        run: python -m pip install --disable-pip-version-check --quiet fastapi==0.128.2 sympy==1.14.0 numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Prove all 74 canonical fixtures still execute
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          import importlib,json,pathlib,sys
          sys.path.insert(0,str(pathlib.Path('runtime').resolve()));m=importlib.import_module('kernel.app.main')
          fs=json.load(open('submission/claude/operation-fixtures.json'))['fixtures']; fail={}
          for op,args in fs.items():
              try:
                  r=m.dispatch(op,args,50);json.dumps(m.encode(r),allow_nan=False)
              except Exception as e:fail[op]=type(e).__name__+': '+str(e)
          if fail:raise SystemExit('canonical failures '+json.dumps(fail,sort_keys=True))
          if len(fs)!=74:raise SystemExit('operation count drift')
          print('MUSITU_AXIOM_ALL_74_CANONICAL_AFTER_DEFECT_PATCH_PASS')
          PY
      - name: Prove strict args for all 74
        run: PYTHONPATH=. python frontier_v5/scripts/verify_all_74_strict_args.py --runtime runtime --fixtures submission/claude/operation-fixtures.json
      - name: Rerun full property/metamorphic audit
        run: PYTHONPATH=. python frontier_v5/scripts/audit_all_74_properties.py --runtime runtime --fixtures submission/claude/operation-fixtures.json
