name: AXIOM Cloudflare existing GitHub secret auth classification (GET only)

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == 'evansmusitu/mft-axiom-build' &&
      github.head_ref == 'build/axiom-cf-auth-classify-readonly-20261108' &&
      github.base_ref == 'build/axiom-stage-config-global-owner-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Four exact read-only Cloudflare authentication classifications, no secrets logged
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,urllib.error,urllib.request
          from pathlib import Path
          API='https://api.cloudflare.com/client/v4'
          Z='5b56528f03948ff5917a5e0cd9f7109e'
          paths={'zone':'/zones/'+Z,'token_verify':'/user/tokens/verify','zone_list':'/zones?name=mftintelligence.com&status=active'}
          secrets={'bearer_scoped':os.environ.get('CLOUDFLARE_API_TOKEN',''),
                   'email_key':os.environ.get('CLOUDFLARE_GLOBAL_API_KEY',''),
                   'owner_email':os.environ.get('CLOUDFLARE_EMAIL','')}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*a,**kw):return None
          def call(path,headers):
            req=urllib.request.Request(API+paths[path],method='GET',headers=dict(headers,Accept='application/json'))
            try:
              with urllib.request.build_opener(NoRedirect).open(req,timeout=15) as resp:
                code=resp.status;raw=resp.read(24001)
            except urllib.error.HTTPError as ex:
              code=ex.code;raw=ex.read(24001)
            except (OSError,TimeoutError,ValueError):
              return {'http':'TRANSPORT_ERROR'}
            try:b=json.loads(raw)
            except (UnicodeError,ValueError):b={}
            e=b.get('errors',[])
            codes=[x.get('code') for x in e[:3] if isinstance(x,dict) and isinstance(x.get('code'),int)] if isinstance(e,list) else []
            return {'http':code,'provider_success':b.get('success') is True,'provider_error_codes':codes,
              'result_shape':'object' if isinstance(b.get('result'),dict) else ('list' if isinstance(b.get('result'),list) else 'other'),
              'status_active':(b.get('result') or {}).get('status')=='active' if isinstance(b.get('result'),dict) else False}
          result={'scope':'AXIOM_CLOUDFLARE_SECRETS_READONLY_AUTH_DIAGNOSTIC','methods':['GET'],
                  'provider_mutations':0,'production_oauth_touched':False,'credentials':{
                    'scoped_present':bool(secrets['bearer_scoped']),
                    'global_key_present':bool(secrets['email_key']),
                    'email_present':bool(secrets['owner_email'])},'observations':{}}
          if secrets['bearer_scoped']:
            result['observations']['scoped_bearer_zone']=call('zone',{'Authorization':'Bearer '+secrets['bearer_scoped']})
          if secrets['email_key'] and secrets['owner_email']:
            headers={'X-Auth-Email':secrets['owner_email'],'X-Auth-Key':secrets['email_key']}
            result['observations']['global_email_key_zone']=call('zone',headers)
            result['observations']['global_email_key_zone_list']=call('zone_list',headers)
            result['observations']['global_secret_as_bearer_token_verify']=call('token_verify',{'Authorization':'Bearer '+secrets['email_key']})
          text=json.dumps(result,sort_keys=True,indent=2)+'\n'
          p=Path('axiom-cloudflare-existing-secret-auth-status.json')
          p.write_text(text)
          p.with_name(p.name+'.sha256').write_text(hashlib.sha256(text.encode()).hexdigest()+'  '+p.name+'\n')
          print('EXISTING_CLOUDFLARE_SECRETS_AUTH_CLASSIFIED; ALL_REQUESTS_GET; ZERO_WRITES')
          PY
      - name: Preserve sanitized classification and independent digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-existing-cf-github-secret-authorization-readonly-20261108
          path: |
            axiom-cloudflare-existing-secret-auth-status.json
            axiom-cloudflare-existing-secret-auth-status.json.sha256
          retention-days: 7
          if-no-files-found: error
