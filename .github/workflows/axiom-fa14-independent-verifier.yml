name: MUSITU Axiom FA14 Independent Verifier

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      builder_run_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Independently verify frozen authority and candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BUILDER_RUN_ID: ${{ inputs.builder_run_id }}
        run: |
          set -euo pipefail
          SOURCE=4c99c4ccbc4a9e34f4e446f30c31f4d428359818
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$SOURCE" HEAD
          grep -q 'Status: AUTHORITY_FROZEN_FOR_IMPLEMENTATION' docs/axiom_final_product/FA14_PREWRITE_INTENT.md
          node --check axiom_interface/vnext/fa14_evidence_native_engine.js
          node --check axiom_interface/vnext/fa14_workspace_ui.js
          node --test axiom_interface/vnext/tests/fa14_*.test.mjs
          mkdir -p verifier-evidence
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          source='4c99c4ccbc4a9e34f4e446f30c31f4d428359818'
          changed=set(subprocess.check_output(['git','diff','--name-only',f'{source}..HEAD'],text=True).splitlines())
          if any(p.startswith(('mcp/','auth/','submission/')) or p=='chatgpt-app-submission.json' for p in changed): raise SystemExit('protected source drift')
          m=json.load(open('docs/axiom_final_product/FA14_ACCEPTANCE_MATRIX.json'))
          expected={x['id'] for x in m['rows']}
          if expected!={'research','analyze','twin','artifact','security','breadth'}: raise SystemExit('acceptance matrix row drift')
          files=['axiom_interface/vnext/fa14_evidence_native_engine.js','axiom_interface/vnext/fa14_workspace_ui.js','axiom_interface/vnext/tests/fa14_evidence_native_engine.test.mjs','axiom_interface/vnext/tests/fa14_adversarial_truth.test.mjs']
          out={'schema':'musitu.axiom.fa14.independent-verifier.v1','status':'INDEPENDENT_VERIFIER_PASS','candidate_commit':os.environ['CANDIDATE_SHA'],'builder_run_id':int(os.environ['BUILDER_RUN_ID']),'source_parent':source,'builder_and_verifier_distinct':True,'repository_write_authority_present':False,'production_credentials_present':False,'production_authority':False,'claim_source_gate_verified':True,'simulation_truth_gate_verified':True,'artifact_lineage_gate_verified':True,'legacy_phase_14_unchanged':True,'wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED','files_sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files}}
          p=pathlib.Path('verifier-evidence/fa14-independent-verifier.json');p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          (p.parent/'fa14-independent-verifier.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          PY
      - name: Upload independent verifier evidence
        uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-fa14-independent-verifier
          path: verifier-evidence/
          retention-days: 90
