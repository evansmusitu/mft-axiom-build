name: MUSITU Axiom FA15 Implementation Qualification

on:
  push:
    branches:
      - frontier/axiom-final-product-fa15-20260916
    paths:
      - 'docs/axiom_final_product/FA15_*'
      - 'axiom_interface/vnext/fa15_*'
      - 'axiom_interface/vnext/tests/fa15_*'
      - 'axiom_interface/vnext/index.html'
      - '.github/workflows/axiom-fa15-*.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test-and-attack:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze source authority and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=13bf88452a936a4619aafdbad445246314f72b3c
          test "$GITHUB_REF_NAME" = 'frontier/axiom-final-product-fa15-20260916'
          git merge-base --is-ancestor "$SOURCE" HEAD
          grep -q 'Status: AUTHORITY_FROZEN_FOR_IMPLEMENTATION' docs/axiom_final_product/FA15_PREWRITE_INTENT.md
          python - <<'PY'
          import json,subprocess
          source='13bf88452a936a4619aafdbad445246314f72b3c'
          changed=set(subprocess.check_output(['git','diff','--name-only',f'{source}..HEAD'],text=True).splitlines())
          allowed=lambda p:(p.startswith('docs/axiom_final_product/FA15_') or p.startswith('axiom_interface/vnext/fa15_') or p.startswith('axiom_interface/vnext/tests/fa15_') or p=='axiom_interface/vnext/index.html' or p.startswith('.github/workflows/axiom-fa15-'))
          bad=sorted(p for p in changed if not allowed(p))
          if bad: raise SystemExit('FA15 source drift outside bounded scope: '+repr(bad))
          protected=[p for p in changed if p.startswith(('mcp/','auth/','submission/')) or p=='chatgpt-app-submission.json']
          if protected: raise SystemExit('protected surface drift: '+repr(protected))
          m=json.load(open('docs/axiom_final_product/FA15_ACCEPTANCE_MATRIX.json'))
          if m['candidate_state']!='IMPLEMENTED_PENDING_INDEPENDENT_VERIFICATION': raise SystemExit('builder self-certification detected')
          if m['production_authority'] is not False or m['external_execution_authority'] is not False: raise SystemExit('authority boundary drift')
          if m['qualified_scheduler_connected'] is not False or m['legacy_phase_15_unchanged'] is not True: raise SystemExit('truth boundary drift')
          PY
      - name: Syntax and deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          node --check axiom_interface/vnext/fa15_advanced_surfaces_engine.js
          node --check axiom_interface/vnext/fa15_advanced_surfaces_ui.js
          node --test axiom_interface/vnext/tests/fa15_*.test.mjs
      - name: Security and adversarial assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,re
          engine=pathlib.Path('axiom_interface/vnext/fa15_advanced_surfaces_engine.js').read_text()
          ui=pathlib.Path('axiom_interface/vnext/fa15_advanced_surfaces_ui.js').read_text()
          index=pathlib.Path('axiom_interface/vnext/index.html').read_text()
          for marker in ['DATA_ONLY','POLICY_REQUIRED','externalExecutionAvailable:false','cloudSchedulerAvailable:false','legacyPhase15Unchanged:true']:
              if marker not in engine: raise SystemExit('missing engine authority marker: '+marker)
          for marker in ['Computer','Live','Automations','Developer','Marketplace','Enterprise','NO_AUTHORITY_WIDENING_WITHOUT_POLICY']:
              if marker not in ui: raise SystemExit('missing UI truth marker: '+marker)
          if 'fa15_advanced_surfaces_ui.js' not in index: raise SystemExit('FA15 loader absent')
          texts='\n'.join(p.read_text() for p in pathlib.Path('.github/workflows').glob('axiom-fa15-*.yml'))
          if re.search(r'(?m)^\s*(contents|deployments|packages|id-token):\s*write\s*$',texts): raise SystemExit('write/deploy token authority found')
          forbidden=['wrangler'+' deploy','kubectl '+'apply','terraform '+'apply','git '+'push','gh pr '+'merge']
          found=[x for x in forbidden if x in texts]
          if found: raise SystemExit('deployment/write command found: '+repr(found))
          PY
      - name: Build candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fa15-evidence
          python - <<'PY'
          import hashlib,json,os,pathlib
          files=['docs/axiom_final_product/FA15_PREWRITE_INTENT.md','docs/axiom_final_product/FA15_ACCEPTANCE_MATRIX.json','axiom_interface/vnext/fa15_advanced_surfaces_engine.js','axiom_interface/vnext/fa15_advanced_surfaces_ui.js','axiom_interface/vnext/fa15_advanced_surfaces.css','axiom_interface/vnext/tests/fa15_advanced_surfaces_engine.test.mjs','axiom_interface/vnext/tests/fa15_adversarial_authority.test.mjs','axiom_interface/vnext/index.html']
          hashes={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files}
          out={'schema':'musitu.axiom.fa15.builder-evidence.v1','status':'BUILDER_TESTS_AND_ADVERSARIAL_PASS','source_parent':'13bf88452a936a4619aafdbad445246314f72b3c','candidate_commit':os.environ['GITHUB_SHA'],'files_sha256':hashes,'production_authority':False,'external_execution_authority':False,'qualified_scheduler_connected':False,'independent_verification_required':True,'legacy_phase_15_unchanged':True,'wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED'}
          p=pathlib.Path('fa15-evidence/fa15-builder-evidence.json');p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          (p.parent/'fa15-builder-evidence.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          PY
      - name: Upload builder evidence
        uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-fa15-builder-evidence
          path: fa15-evidence/
          retention-days: 90

  security-review:
    runs-on: ubuntu-24.04
    needs: test-and-attack
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Adversarial security review
        shell: bash
        run: |
          set -euo pipefail
          node --test axiom_interface/vnext/tests/fa15_adversarial_authority.test.mjs
          python - <<'PY'
          import pathlib
          engine=pathlib.Path('axiom_interface/vnext/fa15_advanced_surfaces_engine.js').read_text()
          intent=pathlib.Path('docs/axiom_final_product/FA15_PREWRITE_INTENT.md').read_text()
          required=['DATA_ONLY','S4','S5','POLICY_REQUIRED','productionAuthority:false','legacyPhase15Unchanged:true']
          missing=[x for x in required if x not in engine]
          if missing: raise SystemExit('security truth marker missing: '+repr(missing))
          if 'No authority widening without policy' not in intent: raise SystemExit('frozen FA15 gate missing')
          PY

  independent-verifier:
    needs: security-review
    uses: ./.github/workflows/axiom-fa15-independent-verifier.yml
    with:
      candidate_sha: ${{ github.sha }}
      builder_run_id: ${{ github.run_id }}
    permissions:
      contents: read
      actions: read
