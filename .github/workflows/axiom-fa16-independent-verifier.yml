name: MUSITU Axiom FA16 Independent Software Verifier

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      builder_run_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Independently verify software, preserve phone proof and keep tablet open
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BUILDER_RUN_ID: ${{ inputs.builder_run_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base ab96c4347cd8ffd2a694c791d40932f175eb880d HEAD)" = ab96c4347cd8ffd2a694c791d40932f175eb880d
          grep -q 'Status: AUTHORITY_FROZEN_FOR_IMPLEMENTATION' docs/axiom_final_product/FA16_PREWRITE_INTENT.md
          node --check axiom_interface/vnext/fa16_pwa_engine.js
          node --check axiom_interface/vnext/fa16_mobile_pwa_ui.js
          node --check axiom_interface/vnext/fa16_service_worker.js
          node --test axiom_interface/vnext/tests/fa16_*.test.mjs
          mkdir -p fa16-independent-evidence
          python - <<'PY'
          import hashlib,json,os,pathlib,re
          matrix=json.load(open('docs/axiom_final_product/FA16_ACCEPTANCE_MATRIX.json'))
          expected={'candidate_state':'RECONCILED_PENDING_INDEPENDENT_VERIFICATION','software_implementation_verified':False,'phase_exit_earned':False,'phase_progression_authorized':True,'production_authority':False,'external_offline_execution':False,'real_device':'REAL_PHONE_EVIDENCED_TABLET_PENDING_CUSTOMER','real_phone_evidence':'EVIDENCED','tablet_evidence':'DEFERRED_PENDING_FUTURE_CUSTOMER','phone_evidence_sha256':'03478e2f17eb82f68417c826e86c29a1fed716d57d5fbe1e81f4d5f1c49a42f6','legacy_phase_14_unchanged':True}
          drift={key:(matrix.get(key),value) for key,value in expected.items() if matrix.get(key)!=value}
          if drift: raise SystemExit('candidate truth drift: '+repr(drift))
          engine=pathlib.Path('axiom_interface/vnext/fa16_pwa_engine.js').read_text();worker=pathlib.Path('axiom_interface/vnext/fa16_service_worker.js').read_text();index=pathlib.Path('axiom_interface/vnext/index.html').read_text()
          for marker in ['externalOfflineExecution:false',"realDeviceStatus:'REAL_PHONE_EVIDENCED_TABLET_PENDING_CUSTOMER'","tabletEvidence:'DEFERRED_PENDING_FUTURE_CUSTOMER'",'phaseProgressionAuthorized:true','phaseExitEarned:false','emulation_may_substitute:false',"typeof verifyAttestation!=='function'"]:
              if marker not in engine: raise SystemExit('engine truth marker missing: '+marker)
          for marker in ['api','mcp','auth','oauth','session','billing','health','Set-Cookie','no-store','private']:
              if marker not in worker: raise SystemExit('sensitive-cache boundary missing: '+marker)
          for marker in ['manifest.webmanifest','fa16_mobile_pwa.css','fa16_mobile_pwa_ui.js','fa16-mobile-you']:
              if marker not in index: raise SystemExit('application-shell integration missing: '+marker)
          workflows='\n'.join(path.read_text() for path in pathlib.Path('.github/workflows').glob('axiom-fa16-*.yml'))
          if re.search(r'(?m)^\s*(contents|deployments|packages|id-token):\s*write\s*$',workflows): raise SystemExit('verifier has mutation/deployment authority')
          files=['docs/axiom_final_product/FA16_PREWRITE_INTENT.md','docs/axiom_final_product/FA16_ACCEPTANCE_MATRIX.json','docs/axiom_final_product/FA16_DEVICE_EVIDENCE_RECONCILIATION.md','axiom_interface/vnext/fa16_pwa_engine.js','axiom_interface/vnext/fa16_mobile_pwa_ui.js','axiom_interface/vnext/fa16_mobile_pwa.css','axiom_interface/vnext/fa16_service_worker.js','axiom_interface/vnext/manifest.webmanifest','axiom_interface/vnext/axiom-icon.svg','axiom_interface/vnext/tests/fa16_pwa_engine.test.mjs','axiom_interface/vnext/tests/fa16_adversarial_truth.test.mjs','axiom_interface/vnext/index.html']
          hashes={path:hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() for path in files}
          evidence={'schema':'musitu.axiom.fa16.independent-verifier.v2','status':'SOFTWARE_IMPLEMENTATION_VERIFIED_PHONE_EVIDENCE_PRESERVED_TABLET_DEFERRED','candidate_commit':os.environ['CANDIDATE_SHA'],'builder_run_id':os.environ['BUILDER_RUN_ID'],'source_parent':'ab96c4347cd8ffd2a694c791d40932f175eb880d','files_sha256':hashes,'pwa_contract_verified':True,'offline_queue_integrity_verified':True,'reconnect_policy_gate_verified':True,'sensitive_cache_exclusion_verified':True,'mobile_supervision_contract_verified':True,'real_device':'REAL_PHONE_EVIDENCED_TABLET_PENDING_CUSTOMER','real_phone_evidence':'EVIDENCED','phone_evidence_sha256':'03478e2f17eb82f68417c826e86c29a1fed716d57d5fbe1e81f4d5f1c49a42f6','tablet_evidence':'DEFERRED_PENDING_FUTURE_CUSTOMER','device_truth_gate_preserved':True,'phase_progression_authorized':True,'phase_exit_earned':False,'builder_and_verifier_distinct':True,'repository_write_authority_present':False,'production_credentials_present':False,'production_authority':False,'legacy_phase_14_unchanged':True,'wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED'}
          path=pathlib.Path('fa16-independent-evidence/fa16-independent-verifier.json');path.write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          (path.parent/'fa16-independent-verifier.sha256').write_text(hashlib.sha256(path.read_bytes()).hexdigest()+'  '+path.name+'\n')
          PY
      - name: Upload independent verifier evidence
        uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-fa16-independent-verifier
          path: fa16-independent-evidence/
          retention-days: 90
