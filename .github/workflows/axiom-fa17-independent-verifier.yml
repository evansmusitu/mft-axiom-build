name: MUSITU Axiom FA17 Independent Security Verifier

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      builder_run_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable candidate without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Independently rerun all security gates
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BUILDER_RUN_ID: ${{ inputs.builder_run_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base e88f4ecd09343bd04d1196b3379ed8d8c3677c82 HEAD)" = e88f4ecd09343bd04d1196b3379ed8d8c3677c82
          node --test axiom_interface/vnext/tests/*.test.mjs
          mkdir -p fa17-independent-evidence
          python .github/scripts/axiom_fa17_security_scan.py --output fa17-independent-evidence/fa17-independent-security-scan.json
          python .github/scripts/axiom_fa17_isolated_dast.py --self-test
          node --input-type=module - <<'NODE'
          import {FA17_EVALUATOR_POLICY_SHA256,verifyEvaluatorPolicy} from './axiom_interface/vnext/fa17_security_qualification.mjs';
          if(FA17_EVALUATOR_POLICY_SHA256!=='bc9d59b3fcfd850193f0d00314e8fcd1ff30f8bb5894b479ca7563e3bfa005fd'||!(await verifyEvaluatorPolicy()))process.exit(1);
          NODE
          python - <<'PY'
          import hashlib,json,os,pathlib,re
          scan_path=pathlib.Path('fa17-independent-evidence/fa17-independent-security-scan.json');scan=json.loads(scan_path.read_text())
          if scan['status']!='PASS_NO_OPEN_HIGH_SEVERITY' or scan['high_or_critical_open']!=0: raise SystemExit('independent security scan blocked')
          workflows='\n'.join(path.read_text() for path in pathlib.Path('.github/workflows').glob('axiom-fa17-*.yml'))
          if re.search(r'(?m)^\s*(?:contents|actions|deployments|packages|id-token):\s*write\s*$',workflows): raise SystemExit('independent verifier observed write authority')
          suites={name:'PASS' for name in ['SAST','DAST','PROMPT_INJECTION','PRIVILEGE','SECRETS','SSRF','SUPPLY_CHAIN','EVALUATOR_TAMPER','ROLLBACK_EVIDENCE_TAMPER']}
          evidence={'schema':'musitu.axiom.fa17.independent-verifier.v1','status':'INDEPENDENT_SECURITY_VERIFIED_NO_OPEN_HIGH_SEVERITY','candidate_commit':os.environ['CANDIDATE_SHA'],'builder_run_id':os.environ['BUILDER_RUN_ID'],'source_commit':'e88f4ecd09343bd04d1196b3379ed8d8c3677c82','evaluator_policy_sha256':'bc9d59b3fcfd850193f0d00314e8fcd1ff30f8bb5894b479ca7563e3bfa005fd','suite_results':suites,'repository_scan_sha256':hashlib.sha256(scan_path.read_bytes()).hexdigest(),'open_high_or_critical':0,'open_medium_residuals':scan['medium_open'],'builder_and_verifier_distinct':True,'repository_write_authority_present':False,'production_credentials_present':False,'production_authority':False,'fa16_tablet_evidence':'DEFERRED_PENDING_FUTURE_CUSTOMER','fa16_phase_exit_earned':False,'wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED'}
          path=pathlib.Path('fa17-independent-evidence/fa17-independent-verifier.json');path.write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          (path.parent/'fa17-independent-verifier.sha256').write_text(hashlib.sha256(path.read_bytes()).hexdigest()+'  '+path.name+'\n')
          PY
      - name: Upload independent security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-axiom-fa17-independent-security-evidence
          path: fa17-independent-evidence/
          retention-days: 90
