name: MUSITU Axiom FA18 Build Challenge

on:
  push:
    branches:
      - frontier/axiom-final-product-fa18-20260916
    paths:
      - 'docs/axiom_final_product/FA18_*'
      - 'axiom_interface/vnext/fa18_*'
      - 'axiom_interface/vnext/tests/fa18_*'
      - '.github/scripts/axiom_fa18_*'
      - '.github/workflows/axiom-fa18-*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  builder-test-and-attack:
    runs-on: ubuntu-24.04
    outputs:
      builder_evidence_sha256: ${{ steps.builder-evidence.outputs.builder_evidence_sha256 }}
      builder_candidate_tree_sha256: ${{ steps.builder-evidence.outputs.builder_candidate_tree_sha256 }}
      builder_evidence_b64: ${{ steps.builder-evidence.outputs.builder_evidence_b64 }}
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze source scope and truth boundary
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=410bb43063a9bb8fd3ab3f44ca28dd7192d4508f
          test "$GITHUB_REF_NAME" = 'frontier/axiom-final-product-fa18-20260916'
          test "$(git merge-base "$SOURCE" HEAD)" = "$SOURCE"
          grep -q 'Status: AUTHORITY_FROZEN_FOR_QUALIFICATION' docs/axiom_final_product/FA18_PREWRITE_INTENT.md
          python - <<'PY'
          import json,subprocess
          source='410bb43063a9bb8fd3ab3f44ca28dd7192d4508f'
          changed=set(subprocess.check_output(['git','diff','--name-only',f'{source}..HEAD'],text=True).splitlines())
          allowed=lambda p:(p.startswith('docs/axiom_final_product/FA18_') or p.startswith('axiom_interface/vnext/fa18_') or p.startswith('axiom_interface/vnext/tests/fa18_') or p.startswith('.github/scripts/axiom_fa18_') or p.startswith('.github/workflows/axiom-fa18-'))
          bad=sorted(path for path in changed if not allowed(path))
          if bad: raise SystemExit('FA18 change escaped frozen scope: '+repr(bad))
          matrix=json.load(open('docs/axiom_final_product/FA18_CHALLENGE_MATRIX.json'))
          expected={'source_commit':source,'candidate_state':'FROZEN_BUILD_CHALLENGE_PENDING_INDEPENDENT_VERIFICATION','qualification_earned':False,'builder_and_verifier_must_be_distinct':True,'builder_and_human_must_be_distinct':True,'benchmark_only':True,'sole_builder':False,'repository_write_authority_present':False,'production_credentials_present':False,'production_authority':False,'fa16_tablet_evidence':'DEFERRED_PENDING_FUTURE_CUSTOMER','fa16_phase_exit_earned':False,'wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED'}
          drift={key:(matrix.get(key),value) for key,value in expected.items() if matrix.get(key)!=value}
          if drift: raise SystemExit('FA18 truth boundary drift: '+repr(drift))
          PY
      - name: Full final-app regression and FA18 adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          node --check axiom_interface/vnext/fa18_axiom_build_challenge.mjs
          node --check .github/scripts/axiom_fa18_run_challenge.mjs
          node --test axiom_interface/vnext/tests/*.test.mjs
      - name: Run exact frozen AXIOM builder challenge
        id: builder-evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fa18-builder-evidence
          node .github/scripts/axiom_fa18_run_challenge.mjs \
            --role builder \
            --candidate-commit "$GITHUB_SHA" \
            --output fa18-builder-evidence/fa18-builder-evidence.json
          sha256sum fa18-builder-evidence/fa18-builder-evidence.json > fa18-builder-evidence/fa18-builder-evidence.sha256
          test "$(jq -r .status fa18-builder-evidence/fa18-builder-evidence.json)" = AXIOM_BUILDER_CANDIDATE_PASS_PENDING_INDEPENDENT_VERIFICATION
          test "$(jq -r .injected_failure_observed fa18-builder-evidence/fa18-builder-evidence.json)" = true
          test "$(jq -r .baseline_tests fa18-builder-evidence/fa18-builder-evidence.json)" = FAIL
          test "$(jq -r .candidate_tests fa18-builder-evidence/fa18-builder-evidence.json)" = PASS
          test "$(jq -r .rollback_failure_observed fa18-builder-evidence/fa18-builder-evidence.json)" = true
          test "$(jq -r .production_authority fa18-builder-evidence/fa18-builder-evidence.json)" = false
          echo "builder_evidence_sha256=$(sha256sum fa18-builder-evidence/fa18-builder-evidence.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "builder_candidate_tree_sha256=$(jq -r .candidate_tree_sha256 fa18-builder-evidence/fa18-builder-evidence.json)" >> "$GITHUB_OUTPUT"
          echo "builder_evidence_b64=$(base64 -w0 fa18-builder-evidence/fa18-builder-evidence.json)" >> "$GITHUB_OUTPUT"
      - name: Credential-free security review
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/axiom_fa17_security_scan.py --output /tmp/fa18-security-scan.json
          test "$(jq -r .status /tmp/fa18-security-scan.json)" = PASS_NO_OPEN_HIGH_SEVERITY
          test "$(jq -r .high_or_critical_open /tmp/fa18-security-scan.json)" = 0
          python .github/scripts/axiom_fa17_isolated_dast.py --self-test
          python - <<'PY'
          import pathlib,re
          text='\n'.join(path.read_text() for path in pathlib.Path('.github/workflows').glob('axiom-fa18-*.yml'))
          if re.search(r'(?m)^\s*(?:contents|actions|deployments|packages|id-token):\s*write\s*$',text): raise SystemExit('FA18 workflow has write authority')
          if re.search(r'uses:\s*[^\s#]+@(?![0-9a-f]{40}(?:\s|$))',text): raise SystemExit('FA18 workflow action is not immutable')
          for token in ['wrangler '+'deploy','kubectl '+'apply','terraform '+'apply','git '+'push','gh pr '+'merge']:
              if token in text: raise SystemExit('FA18 workflow contains deploy/write command')
          PY
      - name: Upload builder challenge evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-axiom-fa18-builder-challenge-evidence
          path: fa18-builder-evidence/
          retention-days: 90

  separate-security-review:
    runs-on: ubuntu-24.04
    needs: builder-test-and-attack
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Challenge-specific adversarial review
        shell: bash
        run: |
          set -euo pipefail
          node --test axiom_interface/vnext/tests/fa18_*.test.mjs
          python .github/scripts/axiom_fa17_security_scan.py --output /tmp/fa18-security-review.json
          test "$(jq -r .high_or_critical_open /tmp/fa18-security-review.json)" = 0

  independent-verifier:
    needs: [builder-test-and-attack, separate-security-review]
    uses: ./.github/workflows/axiom-fa18-independent-verifier.yml
    with:
      candidate_sha: ${{ github.sha }}
      builder_run_id: ${{ github.run_id }}
      builder_evidence_sha256: ${{ needs.builder-test-and-attack.outputs.builder_evidence_sha256 }}
      builder_candidate_tree_sha256: ${{ needs.builder-test-and-attack.outputs.builder_candidate_tree_sha256 }}
      builder_evidence_b64: ${{ needs.builder-test-and-attack.outputs.builder_evidence_b64 }}
    permissions:
      contents: read
      actions: read
