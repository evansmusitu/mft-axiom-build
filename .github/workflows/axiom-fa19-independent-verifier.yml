name: MUSITU Axiom FA19 Independent Harness Verifier

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      builder_run_id:
        required: true
        type: string
      harness_evidence_sha256:
        required: true
        type: string
      harness_evidence_b64:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable candidate without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Independently replay harness and verify comparison blocker
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BUILDER_RUN_ID: ${{ inputs.builder_run_id }}
          HARNESS_EVIDENCE_SHA256: ${{ inputs.harness_evidence_sha256 }}
          HARNESS_EVIDENCE_B64: ${{ inputs.harness_evidence_b64 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base 2ddd7b8604d5a40e3c83818f6f90bd82c5c4a963 HEAD)" = 2ddd7b8604d5a40e3c83818f6f90bd82c5c4a963
          mkdir -p fa19-independent-evidence
          printf '%s' "$HARNESS_EVIDENCE_B64" | base64 -d > fa19-independent-evidence/fa19-harness-evidence.json
          test "$(sha256sum fa19-independent-evidence/fa19-harness-evidence.json | cut -d' ' -f1)" = "$HARNESS_EVIDENCE_SHA256"
          test "$(jq -r .candidate_commit fa19-independent-evidence/fa19-harness-evidence.json)" = "$CANDIDATE_SHA"
          node --test axiom_interface/vnext/tests/*.test.mjs
          node .github/scripts/axiom_fa19_evaluate.mjs \
            --role verifier \
            --candidate-commit "$CANDIDATE_SHA" \
            --builder-evidence fa19-independent-evidence/fa19-harness-evidence.json \
            --output fa19-independent-evidence/fa19-independent-verifier.json
          test "$(jq -r .status fa19-independent-evidence/fa19-independent-verifier.json)" = INDEPENDENT_VERIFIED_FA19_HARNESS_EXTERNAL_COMPARISON_NOT_PROVEN
          test "$(jq -r .builder_evidence_sha256 fa19-independent-evidence/fa19-independent-verifier.json)" = "$(jq -r .evidence_sha256 fa19-independent-evidence/fa19-harness-evidence.json)"
          test "$(jq -r .builder_and_verifier_distinct fa19-independent-evidence/fa19-independent-verifier.json)" = true
          test "$(jq -r .harness_qualification_earned fa19-independent-evidence/fa19-independent-verifier.json)" = true
          test "$(jq -r .external_comparison_earned fa19-independent-evidence/fa19-independent-verifier.json)" = false
          test "$(jq -r .level_5_earned fa19-independent-evidence/fa19-independent-verifier.json)" = false
          test "$(jq -r .level_6_earned fa19-independent-evidence/fa19-independent-verifier.json)" = false
          test "$(jq -r .level_7_earned fa19-independent-evidence/fa19-independent-verifier.json)" = false
          test "$(jq -r .phase_exit_earned fa19-independent-evidence/fa19-independent-verifier.json)" = false
          test "$(jq -r .repository_write_authority_present fa19-independent-evidence/fa19-independent-verifier.json)" = false
          test "$(jq -r .production_credentials_present fa19-independent-evidence/fa19-independent-verifier.json)" = false
          test "$(jq -r .production_authority fa19-independent-evidence/fa19-independent-verifier.json)" = false
          printf '%s\n' "$BUILDER_RUN_ID" > fa19-independent-evidence/builder-run-id.txt
          (cd fa19-independent-evidence && sha256sum fa19-independent-verifier.json > fa19-independent-verifier.sha256)
      - name: Upload independent harness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-axiom-fa19-independent-harness-verifier-evidence
          path: fa19-independent-evidence/
          retention-days: 90

