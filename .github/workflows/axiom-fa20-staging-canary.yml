name: MUSITU Axiom FA20 Isolated Staging Canary

on:
  push:
    branches:
      - frontier/axiom-final-product-fa20-20260916
    paths:
      - 'docs/axiom_final_product/FA20_STAGE_AUTHORITY.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: musitu-axiom-fa20-isolated-preproduction
  cancel-in-progress: false

jobs:
  staging-canary-rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      STAGING_WORKER: musitu-axiom-fa20-staging
      CANARY_WORKER: musitu-axiom-fa20-canary
      ROLLBACK_SOURCE: 4c99c4ccbc4a9e34f4e446f30c31f4d428359818
      RELEASE_POLICY_SHA256: d606db7b63576a275619ece77ad26f087919bede32f0025934ed6c2dc7598cff
    steps:
      - name: Checkout authority commit without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate exact staging authority and successful qualified parent
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git diff --name-only HEAD^..HEAD)" = docs/axiom_final_product/FA20_STAGE_AUTHORITY.json
          python - <<'PY'
          import json,os,re,urllib.request
          value=json.load(open('docs/axiom_final_product/FA20_STAGE_AUTHORITY.json'))
          expected={'schema':'musitu.axiom.fa20.staging-authority.v1','confirmation':'START FA20 STAGING AND CANARY','production_authority':False}
          drift={key:(value.get(key),wanted) for key,wanted in expected.items() if value.get(key)!=wanted}
          if drift: raise SystemExit('staging authority drift: '+repr(drift))
          parent=os.popen('git rev-parse HEAD^').read().strip()
          if value.get('qualified_candidate_sha')!=parent: raise SystemExit('authority is not bound to exact qualified parent')
          if not isinstance(value.get('qualification_run_id'),int): raise SystemExit('qualification run id required')
          for key in ('builder_evidence_sha256','independent_attestation_sha256'):
              if not re.fullmatch(r'[0-9a-f]{64}',str(value.get(key,''))): raise SystemExit(key+' required')
          request=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{value['qualification_run_id']}",
              headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
          )
          with urllib.request.urlopen(request,timeout=30) as response: run=json.load(response)
          if run.get('head_sha')!=parent or run.get('conclusion')!='success' or run.get('name')!='MUSITU Axiom FA20 Release Control':
              raise SystemExit('exact-parent FA20 qualification run is not successful')
          with open('/tmp/fa20-authority.json','w') as target: json.dump(value,target,sort_keys=True)
          print('QUALIFIED_CANDIDATE='+parent)
          with open(os.environ['GITHUB_ENV'],'a') as env: env.write('QUALIFIED_CANDIDATE='+parent+'\n')
          PY
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_API_KEY"
      - name: Requalify source and prepare immutable candidate and rollback assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base 9de2da15d9e532eff9f992354d25995ff9a76c7a "$QUALIFIED_CANDIDATE")" = 9de2da15d9e532eff9f992354d25995ff9a76c7a
          node --test axiom_interface/vnext/tests/*.test.mjs
          python .github/scripts/axiom_fa17_security_scan.py --output /tmp/fa20-stage-security.json
          test "$(jq -r .high_or_critical_open /tmp/fa20-stage-security.json)" = 0
          mkdir -p /tmp/fa20-candidate-export /tmp/fa20-candidate-assets /tmp/fa20-rollback-export /tmp/fa20-rollback-assets
          git archive "$QUALIFIED_CANDIDATE" axiom_interface | tar -x -C /tmp/fa20-candidate-export
          git archive "$ROLLBACK_SOURCE" axiom_interface | tar -x -C /tmp/fa20-rollback-export
          cp -a /tmp/fa20-candidate-export/axiom_interface/. /tmp/fa20-candidate-assets/
          cp -a /tmp/fa20-rollback-export/axiom_interface/. /tmp/fa20-rollback-assets/
          python - <<'PY'
          import json,os,pathlib
          for root,commit,kind in [('/tmp/fa20-candidate-assets',os.environ['QUALIFIED_CANDIDATE'],'FA20_ISOLATED_PREPRODUCTION_CANDIDATE'),('/tmp/fa20-rollback-assets',os.environ['ROLLBACK_SOURCE'],'SEALED_CURRENT_PRODUCTION_ROLLBACK_ORIGIN')]:
              target=pathlib.Path(root)/'vnext'/'fa20-build.json'
              target.write_text(json.dumps({'schema':'musitu.axiom.fa20.static-build.v1','source_commit':commit,'kind':kind,'production':False,'production_authority':False},sort_keys=True)+'\n')
          PY
          tar -C /tmp/fa20-candidate-assets -czf fa20-static-candidate.tgz .
          sha256sum fa20-static-candidate.tgz > fa20-static-candidate.sha256
      - name: Install pinned staging and browser toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --no-save wrangler@4.129.0 playwright@1.55.0
          npx playwright install --with-deps chromium >/tmp/fa20-playwright-install.log 2>&1
          npx wrangler --version
      - name: Resolve isolated workers URLs
        shell: bash
        run: |
          set -euo pipefail
          SUBDOMAIN="$(python - <<'PY'
          import json,os,urllib.request
          request=urllib.request.Request(f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/workers/subdomain",headers={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_API_KEY']})
          with urllib.request.urlopen(request,timeout=30) as response: value=json.load(response)
          if not value.get('success') or not (value.get('result') or {}).get('subdomain'): raise SystemExit('workers subdomain unavailable')
          print(value['result']['subdomain'])
          PY
          )"
          echo "STAGING_URL=https://${STAGING_WORKER}.${SUBDOMAIN}.workers.dev" >> "$GITHUB_ENV"
          echo "CANARY_URL=https://${CANARY_WORKER}.${SUBDOMAIN}.workers.dev" >> "$GITHUB_ENV"
      - name: Establish rollback origin then deploy exact candidate to staging and canary
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --name "$STAGING_WORKER" --compatibility-date 2026-09-16 --assets /tmp/fa20-rollback-assets > fa20-baseline-deploy.log 2>&1
          npx wrangler deploy --name "$STAGING_WORKER" --compatibility-date 2026-09-16 --assets /tmp/fa20-candidate-assets > fa20-staging-deploy.log 2>&1
          npx wrangler deploy --name "$CANARY_WORKER" --compatibility-date 2026-09-16 --assets /tmp/fa20-candidate-assets > fa20-canary-deploy.log 2>&1
          python - <<'PY'
          import json,os,time,urllib.request
          for label,base in [('staging',os.environ['STAGING_URL']),('canary',os.environ['CANARY_URL'])]:
              last=None
              for attempt in range(1,31):
                  try:
                      with urllib.request.urlopen(base+'/vnext/fa20-build.json?attempt='+str(attempt),timeout=30) as response: marker=json.load(response)
                      if marker.get('source_commit')==os.environ['QUALIFIED_CANDIDATE']: break
                      last='stale marker '+repr(marker)
                  except Exception as error: last=repr(error)
                  time.sleep(2)
              else: raise SystemExit(label+' candidate marker unavailable: '+str(last))
              for path,needle in [('/vnext/index.html',b'MUSITU AXIOM'),('/vnext/manifest.webmanifest',b'MUSITU AXIOM'),('/vnext/service_worker.js',b'CACHE')]:
                  with urllib.request.urlopen(base+path+'?candidate='+os.environ['QUALIFIED_CANDIDATE'],timeout=30) as response: body=response.read()
                  if needle not in body: raise SystemExit(label+' smoke contract failed: '+path)
          PY
      - name: Render desktop and mobile staging smoke in real Chromium
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs/promises';
          const browser=await chromium.launch({headless:true}),checks=[];
          for(const [name,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]){
            const page=await browser.newPage({viewport});
            await page.goto(`${process.env.STAGING_URL}/vnext/index.html?candidate=${process.env.QUALIFIED_CANDIDATE}`,{waitUntil:'networkidle'});
            if(!(await page.title()).includes('MUSITU AXIOM'))throw new Error(`${name} title smoke failed`);
            if(!(await page.locator('body').isVisible()))throw new Error(`${name} body smoke failed`);
            checks.push(`${name}_rendered`);await page.close();
          }
          await browser.close();
          await fs.writeFile('fa20-browser-smoke.json',JSON.stringify({schema:'musitu.axiom.fa20.browser-smoke.v1',candidate_commit:process.env.QUALIFIED_CANDIDATE,checks,production_authority:false},null,2)+'\n');
          JS
      - name: Prove rollback and candidate restoration on isolated staging
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --name "$STAGING_WORKER" --compatibility-date 2026-09-16 --assets /tmp/fa20-rollback-assets > fa20-rollback-deploy.log 2>&1
          python - <<'PY'
          import json,os,time,urllib.request
          def wait_for(commit,label):
              for attempt in range(1,31):
                  try:
                      with urllib.request.urlopen(os.environ['STAGING_URL']+'/vnext/fa20-build.json?'+label+'='+str(attempt),timeout=30) as response: value=json.load(response)
                      if value.get('source_commit')==commit: return
                  except Exception: pass
                  time.sleep(2)
              raise SystemExit(label+' marker unavailable')
          wait_for(os.environ['ROLLBACK_SOURCE'],'rollback')
          PY
          npx wrangler deploy --name "$STAGING_WORKER" --compatibility-date 2026-09-16 --assets /tmp/fa20-candidate-assets > fa20-restore-deploy.log 2>&1
          python - <<'PY'
          import json,os,time,urllib.request
          for attempt in range(1,31):
              try:
                  with urllib.request.urlopen(os.environ['STAGING_URL']+'/vnext/fa20-build.json?restore='+str(attempt),timeout=30) as response: value=json.load(response)
                  if value.get('source_commit')==os.environ['QUALIFIED_CANDIDATE']: break
              except Exception: pass
              time.sleep(2)
          else: raise SystemExit('candidate restoration marker unavailable')
          PY
      - name: Clean isolated workers after proof
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler delete --name "$CANARY_WORKER" --force > fa20-canary-cleanup.log 2>&1
          npx wrangler delete --name "$STAGING_WORKER" --force > fa20-staging-cleanup.log 2>&1
      - name: Seal preproduction evidence and exact S4 request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fa20-preproduction-evidence
          cp fa20-static-candidate.tgz fa20-static-candidate.sha256 fa20-browser-smoke.json fa20-*-cleanup.log fa20-preproduction-evidence/
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {createProductionApprovalRequest,createReleasePlan,advanceRelease,sealStageReceipt} from './axiom_interface/vnext/fa20_release_orchestrator.mjs';
          import {sha256} from './axiom_interface/vnext/execution_security.js';
          const candidate=process.env.QUALIFIED_CANDIDATE,artifactBytes=await fs.readFile('fa20-static-candidate.tgz');
          const artifactSha=createHash('sha256').update(artifactBytes).digest('hex');
          let plan=await createReleasePlan({candidateCommit:candidate,artifactSha256:artifactSha,createdAt:new Date().toISOString()});
          const stageEvidence=await sha256({candidate,staging_url:process.env.STAGING_URL,canary_url:process.env.CANARY_URL,browser:JSON.parse(await fs.readFile('fa20-browser-smoke.json','utf8'))});
          for(const stage of ['TESTS','ADVERSARIAL','STAGING','SMOKE','CANARY','ROLLBACK_REHEARSAL','STAGING_RESTORED']){
            const external=['STAGING','SMOKE','CANARY','ROLLBACK_REHEARSAL','STAGING_RESTORED'].includes(stage);
            const body={schema:'musitu.axiom.fa20.stage-receipt.v1',release_id:plan.release_id,candidate_commit:candidate,candidate_artifact_sha256:artifactSha,release_policy_sha256:process.env.RELEASE_POLICY_SHA256,stage,status:'PASS',actor_identity:'github-actions-fa20-staging-runner',verifier_identity:'github-actions-fa20-stage-readback-verifier',evidence_sha256:stageEvidence,observed_at:new Date().toISOString(),secrets_recorded:false,external_execution:external,environment:stage==='STAGING'?'ISOLATED_STAGING':stage==='CANARY'?'ISOLATED_CANARY':'QUALIFIED_CONTROL',all_required_checks_passed:stage==='SMOKE',rollback_succeeded:stage==='ROLLBACK_REHEARSAL',rollback_source_commit:stage==='ROLLBACK_REHEARSAL'?process.env.ROLLBACK_SOURCE:null,candidate_restored:stage==='STAGING_RESTORED',monitoring_samples:0,unsupported_claims_published:false,production_authority_proven:false};
            plan=await advanceRelease(plan,await sealStageReceipt(body));
          }
          const request=await createProductionApprovalRequest(plan);
          const evidence={schema:'musitu.axiom.fa20.preproduction-evidence.v1',status:'PASS_READY_FOR_EXACT_S4_APPROVAL',candidate_commit:candidate,candidate_artifact_sha256:artifactSha,release_plan_sha256:plan.plan_sha256,rollback_origin_commit:process.env.ROLLBACK_SOURCE,staging_executed:true,canary_executed:true,rollback_rehearsal_passed:true,candidate_restored_before_cleanup:true,isolated_workers_cleaned:true,production_executed:false,old_app_retained:true,tablet_evidence:'DEFERRED_PENDING_FUTURE_CUSTOMER',external_comparison:'DEFERRED_NO_PAID_PROVIDER_ACCESS',production_authority:false};
          const sealed={...evidence,evidence_sha256:await sha256(evidence)};
          await fs.writeFile('fa20-preproduction-evidence/fa20-preproduction-evidence.json',JSON.stringify(sealed,null,2)+'\n');
          await fs.writeFile('fa20-preproduction-evidence/fa20-s4-approval-request.json',JSON.stringify(request,null,2)+'\n');
          JS
          (cd fa20-preproduction-evidence && sha256sum * > fa20-preproduction.sha256)
      - name: Upload sealed preproduction evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-axiom-fa20-preproduction-evidence
          path: fa20-preproduction-evidence/
          retention-days: 90
      - name: Fail-closed cleanup on any earlier failure
        if: always()
        shell: bash
        run: |
          if [ -x node_modules/.bin/wrangler ] && [ -n "${CLOUDFLARE_EMAIL:-}" ] && [ -n "${CLOUDFLARE_API_KEY:-}" ]; then
            npx wrangler delete --name "$CANARY_WORKER" --force >/tmp/fa20-final-canary-cleanup.log 2>&1 || true
            npx wrangler delete --name "$STAGING_WORKER" --force >/tmp/fa20-final-staging-cleanup.log 2>&1 || true
          fi
