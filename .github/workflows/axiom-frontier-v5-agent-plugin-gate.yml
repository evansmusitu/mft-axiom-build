name: MUSITU Axiom Frontier v5 Agent Plugin Gate

on:
  push:
    branches:
      - frontier/axiom-v5-skill-fabric
    paths:
      - 'frontier_v5/agent_plugins/**'
      - 'frontier_v5/runtime/agent_plugin_package.py'
      - 'frontier_v5/tests/test_agent_plugin_package.py'
      - 'frontier_v5/MANIFEST.json'
      - 'frontier_v5/shared/**'
      - 'frontier_v5/skills/**'
      - '.github/workflows/axiom-frontier-v5-agent-plugin-gate.yml'
  pull_request:
    paths:
      - 'frontier_v5/agent_plugins/**'
      - 'frontier_v5/runtime/agent_plugin_package.py'
      - 'frontier_v5/tests/test_agent_plugin_package.py'
      - 'frontier_v5/MANIFEST.json'
      - 'frontier_v5/shared/**'
      - 'frontier_v5/skills/**'
      - '.github/workflows/axiom-frontier-v5-agent-plugin-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-axiom-frontier-v5-agent-plugin
  cancel-in-progress: true

jobs:
  agent-plugin-portability-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup patch-pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify Agent Plugins 1.0 portable public package
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_agent_plugin_package.py | tee /tmp/agent-plugin.log
          grep -q 'MUSITU_AXIOM_FRONTIER_AGENT_PLUGIN_1_0_PASS' /tmp/agent-plugin.log
