name: Axiom Frontier V5 Claude Distribution Gate

on:
  push:
    branches:
      - "distribution/claude-remote-mcp-*"
    paths:
      - "frontier_v5/distribution/**"
      - "frontier_v5/scripts/claude_distribution_gate.py"
      - "frontier_v5/scripts/deploy_claude_workers_dev.py"
      - "frontier_v5/scripts/claude_oauth_fixture_e2e.py"
      - "frontier_v5/scripts/deploy_claude_publication_domains.py"
      - "frontier_v5/tests/test_distribution_oauth_policy.py"
      - "frontier_v5/tests/test_claude_worker_isolation_contract.py"
      - "frontier_v5/tests/test_claude_distribution_gate.py"
      - "frontier_v5/tests/test_claude_workers_dev_deploy_contract.py"
      - "frontier_v5/tests/test_verify_real_claude_origin.py"
      - "frontier_v5/scripts/verify_real_claude_origin.py"
      - "submission/claude/real-claude-origin-evidence.template.json"
      - "frontier_v5/tests/test_claude_runtime_repair_contract.py"
      - "frontier_v5/tests/test_claude_oauth_fixture_e2e_contract.py"
      - "frontier_v5/tests/test_claude_publication_domain_contract.py"
      - "submission/claude/**"
      - ".github/workflows/axiom-frontier-v5-claude-distribution-gate.yml"
      - ".github/workflows/axiom-frontier-v5-claude-publication-domain.yml"
  pull_request:
    paths:
      - "frontier_v5/distribution/**"
      - "frontier_v5/scripts/claude_distribution_gate.py"
      - "frontier_v5/tests/test_distribution_oauth_policy.py"
      - "frontier_v5/tests/test_claude_worker_isolation_contract.py"
      - "frontier_v5/tests/test_claude_distribution_gate.py"
      - "frontier_v5/tests/test_claude_workers_dev_deploy_contract.py"
      - "submission/claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  claude-distribution-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Claude distribution contract tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            frontier_v5/tests/test_distribution_oauth_policy.py \
            frontier_v5/tests/test_claude_worker_isolation_contract.py \
            frontier_v5/tests/test_claude_distribution_gate.py \
            frontier_v5/tests/test_claude_workers_dev_deploy_contract.py \
            frontier_v5/tests/test_claude_oauth_fixture_e2e_contract.py \
            frontier_v5/tests/test_claude_publication_domain_contract.py \
            frontier_v5/tests/test_verify_real_claude_origin.py
      - name: Run static Claude candidate gate
        run: PYTHONPATH=. python frontier_v5/scripts/claude_distribution_gate.py
      - name: Record scoped-ruleset-token contract pass
        run: |
          set -euo pipefail
          mkdir -p EVIDENCE
          python - <<'PY'
          import json, os, pathlib
          payload = {
              "schema": "musitu.axiom.claude_scoped_ruleset_token_contract.v1",
              "gate": "MUSITU_AXIOM_CLAUDE_SCOPED_RULESET_TOKEN_CONTRACT_PASS",
              "source_commit": os.environ["GITHUB_SHA"],
              "publication_script_uses_dedicated_rulesets_token": True,
              "publication_workflow_wires_dedicated_rulesets_token": True,
              "claude_distribution_contract_tests_passed": True,
              "static_candidate_gate_passed": True,
              "cloudflare_write_performed": False,
              "openai_surface_mutated": False,
          }
          pathlib.Path("EVIDENCE/claude-scoped-ruleset-token-contract-pass.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EVIDENCE/claude-scoped-ruleset-token-contract-pass.json
          git commit -m "evidence: verify scoped Cloudflare ruleset token contract"
          git push origin HEAD:distribution/claude-remote-mcp-20261004
