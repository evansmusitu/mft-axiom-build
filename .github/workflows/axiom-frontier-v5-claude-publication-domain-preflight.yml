name: Axiom Claude Publication Domain Readonly Preflight

on:
  push:
    branches:
      - "distribution/claude-remote-mcp-20261004"
    paths:
      - "frontier_v5/scripts/check_claude_publication_domain_preflight.py"
      - "frontier_v5/tests/test_claude_publication_domain_contract.py"
      - ".github/workflows/axiom-frontier-v5-claude-publication-domain-preflight.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: musitu-axiom-claude-publication-domain-preflight
  cancel-in-progress: false

jobs:
  readonly-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify non-mutating publication preflight contract
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=. python -m pytest -q             frontier_v5/tests/test_claude_publication_domain_contract.py

      - name: Read Claude publication-domain topology
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/scripts/check_claude_publication_domain_preflight.py

      - name: Dry-run exact configuration-rule authorization
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          API = "https://api.cloudflare.com/client/v4"
          ZONE_ID = "5b56528f03948ff5917a5e0cd9f7109e"
          RULESET_ID = "8e8a2552a8ee4bb383abbe0d748e1da5"
          HOST = "claude-auth.mftintelligence.com"
          URL = f"{API}/zones/{ZONE_ID}/rulesets/{RULESET_ID}/rules?dry_run=true"
          BODY = json.dumps({
              "action": "set_config",
              "action_parameters": {
                  "security_level": "essentially_off",
                  "bic": False,
              },
              "expression": f'http.host eq "{HOST}"',
              "description": "MUSITU Axiom Claude hostname-scoped machine transport dry-run",
              "enabled": True,
              "ref": "mft_axiom_claude_auth_machine_transport_authority_dry_run",
          }, separators=(",", ":")).encode()

          def safe_errors(payload):
              out = []
              if isinstance(payload, dict):
                  for item in payload.get("errors") or []:
                      if isinstance(item, dict):
                          out.append({
                              "code": item.get("code"),
                              "message": str(item.get("message") or "")[:240],
                          })
              return out[:5]

          def probe(label, headers):
              if not headers:
                  return {
                      "credential_type": label,
                      "available": False,
                      "accepted": False,
                      "dry_run": True,
                      "write_performed": False,
                  }
              h = dict(headers)
              h["Accept"] = "application/json"
              h["Content-Type"] = "application/json"
              h["User-Agent"] = "MUSITU-Axiom-Claude-Publication-DryRun/1.0"
              req = urllib.request.Request(URL, method="POST", headers=h, data=BODY)
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      code = response.status
                      raw = response.read()
              except urllib.error.HTTPError as exc:
                  code = exc.code
                  raw = exc.read()
              try:
                  payload = json.loads(raw or b"{}")
              except Exception:
                  payload = {}
              accepted = (
                  200 <= code < 300
                  and not (isinstance(payload, dict) and payload.get("success") is False)
              )
              return {
                  "credential_type": label,
                  "available": True,
                  "http": code,
                  "accepted": accepted,
                  "errors": safe_errors(payload),
                  "dry_run": True,
                  "write_performed": False,
              }

          token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          email = os.environ.get("CLOUDFLARE_EMAIL", "").strip()
          global_key = os.environ.get("CLOUDFLARE_GLOBAL_API_KEY", "").strip()

          evidence = {
              "schema": "musitu.axiom.cloudflare.ruleset_authority_dry_run.v1",
              "zone_id": ZONE_ID,
              "ruleset_id": RULESET_ID,
              "hostname": HOST,
              "dry_run": True,
              "write_performed": False,
              "api_token": probe(
                  "api_token",
                  {"Authorization": "Bearer " + token} if token else None,
              ),
              "global_api_key": probe(
                  "global_api_key",
                  {
                      "X-Auth-Email": email,
                      "X-Auth-Key": global_key,
                  } if email and global_key else None,
              ),
          }
          out = pathlib.Path("submission/claude/cloudflare-ruleset-authority-dryrun-evidence.json")
          out.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({
              "dry_run": True,
              "write_performed": False,
              "api_token": evidence["api_token"],
              "global_api_key": evidence["global_api_key"],
          }, sort_keys=True))
          PY

      - name: Commit sanitized dry-run evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/claude/cloudflare-ruleset-authority-dryrun-evidence.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence: record Cloudflare ruleset authority dry-run"
            git push origin HEAD:distribution/claude-remote-mcp-20261004
          fi

