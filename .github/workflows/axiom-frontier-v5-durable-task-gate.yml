name: MUSITU Axiom Frontier v5 Durable Task Gate

on:
  push:
    branches:
      - frontier/axiom-v5-skill-fabric
    paths:
      - 'frontier_v5/runtime/durable_tasks.py'
      - 'frontier_v5/tests/test_durable_tasks.py'
      - '.github/workflows/axiom-frontier-v5-durable-task-gate.yml'
  pull_request:
    paths:
      - 'frontier_v5/runtime/durable_tasks.py'
      - 'frontier_v5/tests/test_durable_tasks.py'
      - '.github/workflows/axiom-frontier-v5-durable-task-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-axiom-frontier-v5-durable-task
  cancel-in-progress: true

jobs:
  durable-task-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup patch-pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify durable resumable task contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_durable_tasks.py | tee /tmp/durable-tasks.log
          grep -q 'MUSITU_AXIOM_FRONTIER_DURABLE_TASKS_PASS' /tmp/durable-tasks.log
