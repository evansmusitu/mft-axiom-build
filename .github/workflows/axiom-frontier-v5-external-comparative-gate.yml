name: MUSITU Axiom Frontier v5 External Comparative Gate

on:
  push:
    branches:
      - frontier/axiom-v5-skill-fabric
    paths:
      - 'frontier_v5/runtime/external_comparative.py'
      - 'frontier_v5/tests/test_external_comparative_gate.py'
      - '.github/workflows/axiom-frontier-v5-external-comparative-gate.yml'
  pull_request:
    paths:
      - 'frontier_v5/runtime/external_comparative.py'
      - 'frontier_v5/tests/test_external_comparative_gate.py'
      - '.github/workflows/axiom-frontier-v5-external-comparative-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-comparative-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify sealed external comparative evidence contract
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_external_comparative_gate.py | tee /tmp/external-comparative.log
          grep -q 'MUSITU_AXIOM_FRONTIER_EXTERNAL_COMPARATIVE_GATE_PASS' /tmp/external-comparative.log
