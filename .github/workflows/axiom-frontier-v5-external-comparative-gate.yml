name: MUSITU Axiom Frontier v5 External Comparative Gate

on:
  push:
    branches:
      - frontier/axiom-v5-skill-fabric
    paths:
      - 'frontier_v5/runtime/external_comparative.py'
      - 'frontier_v5/runtime/external_claim_boundary.py'
      - 'frontier_v5/tests/test_external_comparative_gate.py'
      - 'frontier_v5/tests/test_external_claim_boundary.py'
      - 'frontier_v5/scripts/run_external_claim_readiness.py'
      - 'frontier_v5/evals/EXTERNAL_BASELINE_REGISTRY.json'
      - 'frontier_v5/EVAL_CONTRACT.json'
      - 'frontier_v5/PROMOTION_GATE.json'
      - '.github/workflows/axiom-frontier-v5-external-comparative-gate.yml'
  pull_request:
    paths:
      - 'frontier_v5/runtime/external_comparative.py'
      - 'frontier_v5/runtime/external_claim_boundary.py'
      - 'frontier_v5/tests/test_external_comparative_gate.py'
      - 'frontier_v5/tests/test_external_claim_boundary.py'
      - 'frontier_v5/scripts/run_external_claim_readiness.py'
      - 'frontier_v5/evals/EXTERNAL_BASELINE_REGISTRY.json'
      - 'frontier_v5/EVAL_CONTRACT.json'
      - 'frontier_v5/PROMOTION_GATE.json'
      - '.github/workflows/axiom-frontier-v5-external-comparative-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-comparative-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify sealed external comparative evidence contract
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_external_comparative_gate.py | tee /tmp/external-comparative.log
          grep -q 'MUSITU_AXIOM_FRONTIER_EXTERNAL_COMPARATIVE_GATE_PASS' /tmp/external-comparative.log
      - name: Verify self-attested evidence cannot promote Level 5
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_external_claim_boundary.py | tee /tmp/external-claim-boundary.log
          grep -q 'MUSITU_AXIOM_FRONTIER_EXTERNAL_CLAIM_BOUNDARY_PASS' /tmp/external-claim-boundary.log
      - name: Verify external baseline registry remains non-certifying
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('frontier_v5/evals/EXTERNAL_BASELINE_REGISTRY.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['current_level5_status']=='NOT_VERIFIED'
          assert d['current_level6_status']=='NOT_VERIFIED'
          assert d['current_global_superiority_status']=='NOT_CERTIFIED'
          assert int(d['minimum_distinct_external_providers_for_broad_claim'])>=3
          assert len(d['required_comparison_domains'])>=6
          assert all(x['evidence_status'] not in {'PASS','VERIFIED','CERTIFIED'} for x in d['references'])
          print('MUSITU_AXIOM_FRONTIER_EXTERNAL_BASELINE_REGISTRY_PASS')
          PY
      - name: Emit current claim readiness and prove Level 5 promotion is blocked
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/scripts/run_external_claim_readiness.py | tee /tmp/external-claim-readiness.log
          grep -q 'MUSITU_AXIOM_EXTERNAL_COMPARATIVE_CLAIM_BLOCKED' /tmp/external-claim-readiness.log
          if PYTHONPATH=. python frontier_v5/scripts/run_external_claim_readiness.py --require-level5 >/tmp/external-level5-required.log 2>&1; then
            echo 'Level 5 gate unexpectedly passed without authenticated external comparative evidence' >&2
            exit 1
          fi
          grep -q 'MUSITU_AXIOM_EXTERNAL_COMPARATIVE_CLAIM_BLOCKED' /tmp/external-level5-required.log
