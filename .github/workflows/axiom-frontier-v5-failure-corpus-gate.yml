name: MUSITU Axiom Frontier v5 Failure Corpus Gate

on:
  push:
    branches:
      - frontier/axiom-v5-skill-fabric
    paths:
      - 'frontier_v5/tests/test_failure_corpus_contract.py'
      - 'frontier_v5/runtime/failure_corpus.py'
      - 'frontier_v5/evals/FAILURE_CORPUS.json'
      - '.github/workflows/axiom-frontier-v5-failure-corpus-gate.yml'
  pull_request:
    paths:
      - 'frontier_v5/tests/test_failure_corpus_contract.py'
      - 'frontier_v5/runtime/failure_corpus.py'
      - 'frontier_v5/evals/FAILURE_CORPUS.json'
      - '.github/workflows/axiom-frontier-v5-failure-corpus-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-axiom-frontier-v5-failure-corpus-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  failure-corpus-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup patch-pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify DEF-008 governed failure corpus and permanent regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_failure_corpus_contract.py | tee /tmp/failure-corpus.log
          grep -q 'MUSITU_AXIOM_FRONTIER_FAILURE_CORPUS_PASS' /tmp/failure-corpus.log
