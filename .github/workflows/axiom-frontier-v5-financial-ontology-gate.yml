name: MUSITU Axiom Frontier v5 Financial Ontology Gate

on:
  push:
    branches:
      - frontier/axiom-v5-skill-fabric
    paths:
      - 'frontier_v5/tests/test_financial_ontology_contract.py'
      - 'frontier_v5/runtime/financial_ontology.py'
      - 'frontier_v5/ontology/FINANCIAL_ONTOLOGY.json'
      - '.github/workflows/axiom-frontier-v5-financial-ontology-gate.yml'
  pull_request:
    paths:
      - 'frontier_v5/tests/test_financial_ontology_contract.py'
      - 'frontier_v5/runtime/financial_ontology.py'
      - 'frontier_v5/ontology/FINANCIAL_ONTOLOGY.json'
      - '.github/workflows/axiom-frontier-v5-financial-ontology-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-axiom-frontier-v5-financial-ontology-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  financial-ontology-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup patch-pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify DEF-005 canonical financial ontology contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_financial_ontology_contract.py | tee /tmp/financial-ontology.log
          grep -q 'MUSITU_AXIOM_FRONTIER_FINANCIAL_ONTOLOGY_PASS' /tmp/financial-ontology.log
