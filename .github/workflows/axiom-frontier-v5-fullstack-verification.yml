name: MUSITU Axiom Frontier v5 Full-Stack Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontier_v5/**'
      - '.github/workflows/axiom-frontier-v5-fullstack-verification.yml'

permissions:
  contents: read

concurrency:
  group: musitu-axiom-frontier-v5-fullstack-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  browser-fixture-prequalification:
    name: Isolated real Chromium browser prequalification (NOT RELEASE)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned Chromium browser only (no broad system apt)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'playwright==1.62.0' 'pyee==13.0.1' 'greenlet==3.5.5'
          python -m playwright install chromium
          python -m pip check
      - name: Run default-deny negative tests and real loopback browser fixture
        shell: bash
        env:
          FRONTIER_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_GLOBAL_API_KEY:-}"
          test -z "${CLOUDFLARE_EMAIL:-}"
          test -z "${AXIOM_PRODUCTION_AUTHORIZATION:-}"
          mkdir -p /tmp/musitu-frontier-browser
          PYTHONPATH=. python frontier_v5/tests/test_browser_network_preflight.py | tee /tmp/musitu-frontier-browser/browser-policy.log
          PYTHONPATH=. python frontier_v5/tests/test_isolated_browser_ci.py --output-dir /tmp/musitu-frontier-browser | tee /tmp/musitu-frontier-browser/browser-fixture.log
          grep -q 'MUSITU_AXIOM_FRONTIER_BROWSER_NETWORK_PREFLIGHT_PASS' /tmp/musitu-frontier-browser/browser-policy.log
          grep -q 'MUSITU_AXIOM_FRONTIER_ISOLATED_BROWSER_PASS_NOT_RELEASE' /tmp/musitu-frontier-browser/browser-fixture.log
      - name: Validate and hash non-release browser evidence
        shell: bash
        env:
          FRONTIER_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/musitu-frontier-browser')
          obj=json.loads((root/'browser-evidence.json').read_text())
          assert obj['source_head_sha']==os.environ['FRONTIER_SOURCE_HEAD']
          assert obj['github_run_id']==os.environ['GITHUB_RUN_ID']
          assert obj['status']=='PASS' and obj['scope']=='LOOPBACK_FIXTURE_ONLY_NOT_RELEASE'
          assert obj['claims']=={'full_stack':'NOT_CERTIFIED','production_adapter':'BLOCKED','superiority':'NOT_CERTIFIED'}
          assert all(obj['checks'].values())
          assert hashlib.sha256((root/'browser-fixture.png').read_bytes()).hexdigest()==obj['screenshot_sha256']
          names=('browser-evidence.json','browser-fixture.png','browser-policy.log','browser-fixture.log')
          with (root/'SHA256SUMS.txt').open('w') as f:
            for name in names:
              p=root/name
              f.write(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+name+'\n')
          print('MUSITU_AXIOM_ISOLATED_BROWSER_EVIDENCE_HASHED_NOT_RELEASE')
          PY
      - name: Retain commit-bound browser fixture evidence (NOT RELEASE)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-axiom-frontier-browser-isolated-not-release
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/musitu-frontier-browser/browser-evidence.json
            /tmp/musitu-frontier-browser/browser-fixture.png
            /tmp/musitu-frontier-browser/browser-policy.log
            /tmp/musitu-frontier-browser/browser-fixture.log
            /tmp/musitu-frontier-browser/SHA256SUMS.txt

  full-stack-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install locked frontier runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          # The Azure apt mirror throttled a prior run past its 35-minute limit.
          # Use the official Ubuntu mirror on this disposable CI runner only.
          if test -f /etc/apt/apt-mirrors.txt; then
            printf 'https://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg espeak-ng xvfb xdotool python3-tk scrot unzip ca-certificates
          python -m pip install 'pip==26.2.1'
          python -m pip install -r frontier_v5/requirements/fullstack.lock.txt
          python -m pip check
          python -m playwright install --with-deps chromium
          PYTHONPATH=. python frontier_v5/scripts/verify_supply_chain.py --output /tmp/musitu-frontier-supply-chain.json | tee /tmp/supply-chain-preasset.log
          grep -q 'MUSITU_AXIOM_FRONTIER_SUPPLY_CHAIN_LOCK_PASS' /tmp/supply-chain-preasset.log

      - name: Verify document spreadsheet presentation application browser and local runtime
        shell: bash
        run: |
          set -euo pipefail
          # Local test image only. No production credentials or host bind mounts.
          PYTHONPATH=. python frontier_v5/scripts/build_isolated_python_rootfs.py --output /tmp/axiom-frontier-rootfs --python /usr/bin/python3
          export AXIOM_SANDBOX_ROOTFS=/tmp/axiom-frontier-rootfs
          PYTHONPATH=. python -m unittest discover -s frontier_v5/tests -p test_namespace_security.py -v | tee /tmp/namespace-security.log
          PYTHONPATH=. python frontier_v5/tests/test_fullstack_local.py | tee /tmp/fullstack-local.log
          grep -q 'MUSITU_AXIOM_FRONTIER_FULLSTACK_LOCAL_PASS' /tmp/fullstack-local.log

      - name: Verify browser network preflight fails closed
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_browser_network_preflight.py | tee /tmp/browser-network-preflight.log
          grep -q 'MUSITU_AXIOM_FRONTIER_BROWSER_NETWORK_PREFLIGHT_PASS' /tmp/browser-network-preflight.log

      - name: Verify virtual-desktop computer use and screen capture
        shell: bash
        run: |
          set -euo pipefail
          rm -f frontier_v5/tests/_gui_result.txt /tmp/musitu-screen.png
          xvfb-run -a bash -c '
            set -euo pipefail
            python frontier_v5/tests/gui_fixture.py & app=$!
            wid=""
            for i in $(seq 1 30); do
              wid=$(xdotool search --name "MUSITU Desktop Fixture" 2>/dev/null | head -n1 || true)
              [ -n "$wid" ] && break
              sleep 0.2
            done
            [ -n "$wid" ]
            xdotool windowfocus --sync "$wid"
            sleep 0.2
            scrot /tmp/musitu-screen.png
            xdotool type --delay 45 "frontier-verified"
            xdotool key Return
            wait "$app"
          '
          test "$(cat frontier_v5/tests/_gui_result.txt)" = 'frontier-verified'
          test -s /tmp/musitu-screen.png
          echo MUSITU_AXIOM_FRONTIER_COMPUTER_USE_PASS

      - name: Verify real multimodal image audio speech video camera and screen paths
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/vosk
          mkdir -p /tmp/vosk
          curl -fsSL --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o /tmp/vosk/model.zip
          echo '30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498  /tmp/vosk/model.zip' | sha256sum -c -
          PYTHONPATH=. python frontier_v5/scripts/verify_supply_chain.py --asset /tmp/vosk/model.zip --output /tmp/musitu-frontier-supply-chain.json | tee /tmp/supply-chain-asset.log
          grep -q 'MUSITU_AXIOM_FRONTIER_SUPPLY_CHAIN_LOCK_PASS' /tmp/supply-chain-asset.log
          unzip -q /tmp/vosk/model.zip -d /tmp/vosk
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          from frontier_v5.runtime.fullstack import MultimodalWorkbench
          import json,subprocess
          root=Path('/tmp/musitu-mm');root.mkdir(exist_ok=True)
          im=Image.new('RGB',(640,360),'white');ImageDraw.Draw(im).text((40,160),'MUSITU AXIOM FRONTIER',fill='black');im.save(root/'image.png')
          image=MultimodalWorkbench.inspect_image(root/'image.png')
          MultimodalWorkbench.synthesize_speech('one two three four',root/'speech-raw.wav')
          subprocess.run(['ffmpeg','-y','-i',str(root/'speech-raw.wav'),'-ac','1','-ar','16000',str(root/'speech.wav')],check=True,capture_output=True)
          audio=MultimodalWorkbench.inspect_audio(root/'speech.wav')
          speech=MultimodalWorkbench.transcribe_vosk(root/'speech.wav','/tmp/vosk/vosk-model-small-en-us-0.15')
          if speech['word_count']<2: raise SystemExit('speech transcription too weak')
          subprocess.run(['ffmpeg','-y','-f','lavfi','-i','color=c=black:s=640x360:d=1.2','-f','lavfi','-i','sine=frequency=523:duration=1.2','-shortest','-pix_fmt','yuv420p',str(root/'video.mp4')],check=True,capture_output=True)
          video=MultimodalWorkbench.probe_video(root/'video.mp4')
          camera=MultimodalWorkbench.camera_stream_frames(str(root/'video.mp4'),max_frames=5); screen=MultimodalWorkbench.inspect_image('/tmp/musitu-screen.png')
          out={'schema':'musitu.axiom.frontier.multimodal.v1','status':'PASS','modalities':['image','audio','speech','video','camera-stream','screen'],'image':image,'audio':audio,'speech':speech,'video_sha256':video['sha256'],'camera':camera,'screen':screen}
          Path('/tmp/musitu-frontier-multimodal.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print('MUSITU_AXIOM_FRONTIER_MULTIMODAL_PASS')
          PY

      - name: Run adversarial retrieved-content and injection suite
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/scripts/run_adversarial_eval.py

      - name: Run independent external-data implementation validation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/scripts/frontier_independent_validate.py
          test -s /tmp/musitu-frontier-market-cache.json

      - name: Block legacy production-writing live adapter pending isolated staging security gate
        shell: bash
        run: |
          set -euo pipefail
          # The historical script accesses a sealed D1, can provision customer
          # fixtures and accepts broad Cloudflare credentials. Never invoke it
          # in the integration or use CI to grant itself production authority.
          echo 'MUSITU_AXIOM_FRONTIER_LIVE_ADAPTER_NOT_QUALIFIED: isolated staging and independent security approval required' >&2
          exit 1

      - name: Run longitudinal no-regression gate
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/scripts/run_longitudinal_gate.py

      - name: Seal five-year frontier objective evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          files={
            'multimodal':'/tmp/musitu-frontier-multimodal.json',
            'adversarial':'/tmp/musitu-frontier-adversarial.json',
            'independent':'/tmp/musitu-frontier-independent-validation.json',
            'market_cache':'/tmp/musitu-frontier-market-cache.json',
            'live':'/tmp/musitu-frontier-live-evidence.json',
            'longitudinal':'/tmp/musitu-frontier-longitudinal.json',
            'supply_chain_lock':'/tmp/musitu-frontier-supply-chain.json',
          }
          evidence={}
          for k,p in files.items():
            b=Path(p).read_bytes(); evidence[k]={'sha256':hashlib.sha256(b).hexdigest(),'payload':json.loads(b)}
          required={
            'multimodal':evidence['multimodal']['payload'].get('status')=='PASS',
            'adversarial':evidence['adversarial']['payload'].get('status')=='PASS',
            'independent':evidence['independent']['payload'].get('status')=='PASS',
            'market_cache':evidence['market_cache']['payload'].get('status')=='PASS',
            'live':evidence['live']['payload'].get('gate')=='MUSITU_AXIOM_FRONTIER_LIVE_ADAPTERS_PASS',
            'longitudinal':evidence['longitudinal']['payload'].get('status')=='PASS',
            'supply_chain_lock':evidence['supply_chain_lock']['payload'].get('status')=='PASS',
          }
          if not all(required.values()): raise SystemExit('five-year objective evidence incomplete '+repr(required))
          if evidence['supply_chain_lock']['payload'].get('attestation_scope')!='PARTIAL_REPRODUCIBILITY_NOT_COMPLETE_SUPPLY_CHAIN_ATTESTATION':
            raise SystemExit('supply-chain claim boundary missing')
          final={'schema':'musitu.axiom.frontier.five-year-objective.evidence.v3','required':required,'evidence_files':{k:v['sha256'] for k,v in evidence.items()},'head_sha':'${{ github.event.pull_request.head.sha || github.sha }}','claim_boundaries':{'supply_chain':'PARTIAL_REPRODUCIBILITY_NOT_COMPLETE_SUPPLY_CHAIN_ATTESTATION','external_frontier_leadership':'NOT_CERTIFIED'}}
          body=json.dumps(final,sort_keys=True,separators=(',',':')).encode(); final['evidence_sha256']=hashlib.sha256(body).hexdigest(); final['gate']='MUSITU_AXIOM_FIVE_YEAR_FRONTIER_OBJECTIVE_PASS'
          Path('/tmp/musitu-frontier-final-objective.json').write_text(json.dumps(final,indent=2),encoding='utf-8')
          print(final['gate']);print('evidence_sha256='+final['evidence_sha256'])
          PY

      - name: Upload sealed frontier evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-axiom-frontier-v5-fullstack-evidence
          path: |
            /tmp/musitu-frontier-multimodal.json
            /tmp/musitu-frontier-adversarial.json
            /tmp/musitu-frontier-independent-validation.json
            /tmp/musitu-frontier-market-cache.json
            /tmp/musitu-frontier-live-evidence.json
            /tmp/musitu-frontier-longitudinal.json
            /tmp/musitu-frontier-supply-chain.json
            /tmp/musitu-frontier-final-objective.json
            /tmp/musitu-screen.png
          if-no-files-found: error

      # Independent of failed live-adapter gate: retain only allowlisted
      # prequalification evidence. Must NOT change this job's failed status.
      - name: Test non-release evidence collector
        id: prequalification_tests
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s frontier_v5/tests -p test_prequalification_evidence.py -v

      - name: Seal partial prequalification evidence without live provider credentials
        id: prequalification_seal
        if: ${{ always() && steps.prequalification_tests.outcome == 'success' }}
        shell: bash
        env:
          FRONTIER_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python frontier_v5/scripts/seal_prequalification_evidence.py \
            --root /tmp \
            --output /tmp/musitu-frontier-prequalification.json \
            --head-sha "$FRONTIER_SOURCE_HEAD" \
            --run-id "$GITHUB_RUN_ID"
          test -s /tmp/musitu-frontier-prequalification.json
          grep -q '"status": "PARTIAL_NOT_RELEASE"' /tmp/musitu-frontier-prequalification.json
          grep -q '"full_stack": "NOT_CERTIFIED"' /tmp/musitu-frontier-prequalification.json

      - name: Upload retained prequalification evidence (NOT RELEASE)
        if: ${{ always() && steps.prequalification_tests.outcome == 'success' && steps.prequalification_seal.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-axiom-frontier-prequalification-not-release
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/musitu-frontier-prequalification.json
            /tmp/musitu-frontier-multimodal.json
            /tmp/musitu-frontier-adversarial.json
            /tmp/musitu-frontier-independent-validation.json
            /tmp/musitu-frontier-market-cache.json
            /tmp/musitu-frontier-supply-chain.json
            /tmp/musitu-screen.png

  oci-isolated-host-prequalification:
    name: Pinned scratch OCI boundary (separate hosted job; NOT RELEASE)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build local-only scratch image with no upstream base, credentials or mounts
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/axiom-oci-disposable-context"
          mkdir -p "$context"
          PYTHONPATH=. python3 frontier_v5/scripts/build_isolated_python_rootfs.py --output "$context/rootfs" --python /usr/bin/python3
          cat > "$context/Dockerfile" <<'DOCKERFILE'
          FROM scratch
          COPY rootfs/ /
          USER 65534:65534
          WORKDIR /
          DOCKERFILE
          docker build --network=none --pull=false -f "$context/Dockerfile" -t axiom-frontier-disposable-oci "$context"
          image_id="$(docker image inspect --format '{{.Id}}' axiom-frontier-disposable-oci)"
          case "$image_id" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1;; esac
          echo "AXIOM_SANDBOX_IMAGE_ID=$image_id" >> "$GITHUB_ENV"
      - name: Compile OCI candidate before runtime test
        shell: bash
        run: python3 -m py_compile frontier_v5/runtime/docker_isolated_sandbox.py frontier_v5/tests/test_oci_security.py
      - name: Execute real OCI network, filesystem, secret, timeout and output tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m unittest discover -s frontier_v5/tests -p test_oci_security.py -v
      - name: Record nonrelease boundary
        shell: bash
        run: |
          echo 'FRONTIER_OCI_HOSTED_PREQUALIFICATION_ONLY_NOT_RELEASE'
          echo 'FRONTIER_INDEPENDENT_SECURITY_REVIEW_PENDING'
