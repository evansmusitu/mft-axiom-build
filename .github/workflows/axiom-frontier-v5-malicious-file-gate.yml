name: MUSITU Axiom Frontier v5 Malicious File Gate

on:
  push:
    branches:
      - frontier/axiom-v5-skill-fabric
    paths:
      - 'frontier_v5/tests/test_malicious_file_contract.py'
      - 'frontier_v5/runtime/malicious_file_guard.py'
      - 'frontier_v5/runtime/fullstack.py'
      - '.github/workflows/axiom-frontier-v5-malicious-file-gate.yml'
  pull_request:
    paths:
      - 'frontier_v5/tests/test_malicious_file_contract.py'
      - 'frontier_v5/runtime/malicious_file_guard.py'
      - 'frontier_v5/runtime/fullstack.py'
      - '.github/workflows/axiom-frontier-v5-malicious-file-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-axiom-frontier-v5-malicious-file-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  malicious-file-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup patch-pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify SEC-004 malicious and hidden-content artifact ingress
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_malicious_file_contract.py | tee /tmp/malicious-file.log
          grep -q 'MUSITU_AXIOM_FRONTIER_MALICIOUS_FILE_PASS' /tmp/malicious-file.log
