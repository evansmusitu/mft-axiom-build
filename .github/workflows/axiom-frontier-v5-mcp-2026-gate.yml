name: MUSITU Axiom Frontier v5 MCP 2026 Conformance Gate

on:
  push:
    branches:
      - frontier/axiom-v5-skill-fabric
    paths:
      - 'frontier_v5/runtime/mcp_2026.py'
      - 'frontier_v5/tests/test_mcp_2026_contract.py'
      - '.github/workflows/axiom-frontier-v5-mcp-2026-gate.yml'
  pull_request:
    paths:
      - 'frontier_v5/runtime/mcp_2026.py'
      - 'frontier_v5/tests/test_mcp_2026_contract.py'
      - '.github/workflows/axiom-frontier-v5-mcp-2026-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-2026-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify isolated MCP 2026-07-28 contract
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_mcp_2026_contract.py | tee /tmp/mcp-2026.log
          grep -q 'MUSITU_AXIOM_FRONTIER_MCP_2026_CONTRACT_PASS' /tmp/mcp-2026.log
