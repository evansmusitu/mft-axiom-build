name: MUSITU Axiom Frontier v5 OIDC Identity Gate

on:
  push:
    branches:
      - frontier/axiom-v5-skill-fabric
    paths:
      - 'frontier_v5/runtime/oidc.py'
      - 'frontier_v5/tests/test_oidc_contract.py'
      - '.github/workflows/axiom-frontier-v5-oidc-gate.yml'
  pull_request:
    paths:
      - 'frontier_v5/runtime/oidc.py'
      - 'frontier_v5/tests/test_oidc_contract.py'
      - '.github/workflows/axiom-frontier-v5-oidc-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oidc-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify isolated OIDC identity contract
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_oidc_contract.py | tee /tmp/oidc.log
          grep -q 'MUSITU_AXIOM_FRONTIER_OIDC_CONTRACT_PASS' /tmp/oidc.log
