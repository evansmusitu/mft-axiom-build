name: MUSITU Axiom Frontier v5 OpenAI Plugin Package Gate

on:
  push:
    branches:
      - frontier/axiom-v5-skill-fabric
    paths:
      - 'frontier_v5/openai_plugins/**'
      - 'frontier_v5/runtime/openai_plugin_package.py'
      - 'frontier_v5/tests/test_openai_plugin_package.py'
      - 'frontier_v5/MANIFEST.json'
      - 'frontier_v5/shared/**'
      - 'frontier_v5/skills/**'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/axiom-frontier-v5-openai-plugin-package-gate.yml'
  pull_request:
    paths:
      - 'frontier_v5/openai_plugins/**'
      - 'frontier_v5/runtime/openai_plugin_package.py'
      - 'frontier_v5/tests/test_openai_plugin_package.py'
      - 'frontier_v5/MANIFEST.json'
      - 'frontier_v5/shared/**'
      - 'frontier_v5/skills/**'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/axiom-frontier-v5-openai-plugin-package-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-axiom-frontier-v5-openai-plugin-package
  cancel-in-progress: true

jobs:
  openai-plugin-package-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup patch-pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify current OpenAI plugin package
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_openai_plugin_package.py | tee /tmp/openai-plugin-package.log
          grep -q 'MUSITU_AXIOM_FRONTIER_OPENAI_PLUGIN_PACKAGE_PASS' /tmp/openai-plugin-package.log
