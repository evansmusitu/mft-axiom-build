name: MUSITU Axiom Frontier v5 Python Distribution Hash Capture

on:
  workflow_dispatch:
  push:
    branches:
      - frontier/axiom-v5-skill-fabric
    paths:
      - 'frontier_v5/scripts/capture_distribution_hashes.py'
      - 'frontier_v5/requirements/fullstack.lock.txt'
      - 'frontier_v5/supply_chain/LOCK.json'
      - '.github/workflows/axiom-frontier-v5-python-hash-capture.yml'

permissions:
  contents: read

concurrency:
  group: musitu-axiom-frontier-v5-python-hash-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup patch-pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Capture selected distribution hashes without installing them
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python frontier_v5/scripts/capture_distribution_hashes.py \
            --requirements frontier_v5/requirements/fullstack.lock.txt \
            --workdir /tmp/musitu-python-distributions \
            --manifest /tmp/musitu-python-distribution-hashes.json \
            --hashed-requirements /tmp/fullstack.hashed.lock.txt \
            | tee /tmp/python-hash-capture.log
          grep -q 'MUSITU_AXIOM_FRONTIER_PYTHON_DISTRIBUTION_HASH_CAPTURE_PASS' /tmp/python-hash-capture.log

      - name: Upload capture evidence for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-axiom-frontier-python-distribution-hash-capture
          path: |
            /tmp/musitu-python-distribution-hashes.json
            /tmp/fullstack.hashed.lock.txt
          if-no-files-found: error
