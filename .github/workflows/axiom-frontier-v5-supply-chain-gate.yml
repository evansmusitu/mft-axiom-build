name: MUSITU Axiom Frontier v5 Supply Chain Gate

on:
  push:
    branches:
      - frontier/axiom-v5-skill-fabric
    paths:
      - 'frontier_v5/tests/test_supply_chain_contract.py'
      - 'frontier_v5/supply_chain/LOCK.json'
      - 'frontier_v5/requirements/fullstack.lock.txt'
      - 'frontier_v5/scripts/verify_supply_chain.py'
      - '.github/workflows/axiom-frontier-v5-fullstack-verification.yml'
      - '.github/workflows/axiom-frontier-v5-security-regression.yml'
      - '.github/workflows/axiom-frontier-v5-external-comparative-gate.yml'
      - '.github/workflows/axiom-frontier-v5-skill-gate.yml'
      - '.github/workflows/axiom-frontier-v5-objective-gate.yml'
      - '.github/workflows/axiom-frontier-v5-python-hash-capture.yml'
      - '.github/workflows/axiom-frontier-v5-durable-task-gate.yml'
      - '.github/workflows/axiom-frontier-v5-mcp-2026-gate.yml'
      - '.github/workflows/axiom-frontier-v5-cimd-gate.yml'
      - '.github/workflows/axiom-frontier-v5-oidc-gate.yml'
      - '.github/workflows/axiom-frontier-v5-supply-chain-gate.yml'
  pull_request:
    paths:
      - 'frontier_v5/tests/test_supply_chain_contract.py'
      - 'frontier_v5/supply_chain/LOCK.json'
      - 'frontier_v5/requirements/fullstack.lock.txt'
      - 'frontier_v5/scripts/verify_supply_chain.py'
      - '.github/workflows/axiom-frontier-v5-fullstack-verification.yml'
      - '.github/workflows/axiom-frontier-v5-security-regression.yml'
      - '.github/workflows/axiom-frontier-v5-external-comparative-gate.yml'
      - '.github/workflows/axiom-frontier-v5-skill-gate.yml'
      - '.github/workflows/axiom-frontier-v5-objective-gate.yml'
      - '.github/workflows/axiom-frontier-v5-python-hash-capture.yml'
      - '.github/workflows/axiom-frontier-v5-durable-task-gate.yml'
      - '.github/workflows/axiom-frontier-v5-mcp-2026-gate.yml'
      - '.github/workflows/axiom-frontier-v5-cimd-gate.yml'
      - '.github/workflows/axiom-frontier-v5-oidc-gate.yml'
      - '.github/workflows/axiom-frontier-v5-supply-chain-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-axiom-frontier-v5-supply-chain
  cancel-in-progress: true

jobs:
  reproducibility-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup patch-pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify Frontier supply-chain contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_supply_chain_contract.py | tee /tmp/supply-chain-contract.log
          grep -q 'MUSITU_AXIOM_FRONTIER_SUPPLY_CHAIN_CONTRACT_PASS' /tmp/supply-chain-contract.log
