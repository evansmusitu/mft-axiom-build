name: MUSITU Axiom Frontier v5 Supply Chain Meta-RED Probe

on:
  push:
    branches:
      - frontier/axiom-v5-skill-fabric
    paths:
      - '.github/workflows/axiom-frontier-v5-supply-chain-meta-red-probe.yml'
  pull_request:
    paths:
      - '.github/workflows/axiom-frontier-v5-supply-chain-meta-red-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-axiom-frontier-v5-supply-chain-meta-red-probe
  cancel-in-progress: true

jobs:
  same-frozen-supply-chain-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup patch-pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Execute unchanged Supply Chain contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_supply_chain_contract.py
