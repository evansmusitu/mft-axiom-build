name: AXIOM Gate3 existing build credential GET observations (NOT CUSTODY)
on:
  push:
    branches: ['build/axiom-gate3-provider-preflight-20261124']
    paths:
      - '.github/workflows/axiom-gate3-build-credential-get-observation-20261124.yml'
      - 'customer_frontier/qualification/gate3_build_credential_readonly_probe.mjs'
permissions: {contents: read}
concurrency:
  group: axiom-gate3-provider-get-observation
  cancel-in-progress: false
jobs:
  readonly-observation:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.event_name == 'push' && github.ref == 'refs/heads/build/axiom-gate3-provider-preflight-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Verify synthetic redaction and GET-only contract first
        run: node --test customer_frontier/tests/gate3_build_credential_readonly_probe.test.mjs
      - name: Observe existing build credential metadata using GET only
        env:
          AXIOM_G3_READONLY_PROVIDER_PROBE: qualified_get_only
          AXIOM_D1_RECOVERY_CF_API_TOKEN: ${{ secrets.AXIOM_D1_RECOVERY_CF_API_TOKEN }}
          MUSITU_CLOUDFLARE_ADMIN_TOKEN: ${{ secrets.MUSITU_CLOUDFLARE_ADMIN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MUSITU_CF_STAGING_READ_TOKEN: ${{ secrets.MUSITU_CF_STAGING_READ_TOKEN }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: node customer_frontier/qualification/gate3_build_credential_readonly_probe.mjs
