name: AXIOM Gate3 custody observations and bounded canary denials (NOT RELEASE)
on:
  push:
    branches: ['build/axiom-gate3-custody-denial-20261124']
    paths:
      - '.github/workflows/axiom-gate3-custody-bounded-denial-20261124.yml'
      - 'customer_frontier/qualification/gate3_credential_boundary_acceptance.mjs'
permissions: {contents: read}
concurrency:
  group: axiom-gate3-bounded-credential-denial
  cancel-in-progress: false
jobs:
  bounded-canaries:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.event_name == 'push' && github.ref == 'refs/heads/build/axiom-gate3-custody-denial-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Prove synthetic isolation, redaction, controls and failure handling first
        run: node --test customer_frontier/tests/gate3_build_credential_readonly_probe.test.mjs customer_frontier/tests/gate3_credential_boundary_acceptance.test.mjs
      - name: Observe global-key identity and exercise bounded disposable controls and denials
        env:
          AXIOM_G3_WRITE_DENIAL_RUN: bounded_disposable_canaries_v1
          AXIOM_D1_RECOVERY_CF_API_TOKEN: ${{ secrets.AXIOM_D1_RECOVERY_CF_API_TOKEN }}
          MUSITU_CLOUDFLARE_ADMIN_TOKEN: ${{ secrets.MUSITU_CLOUDFLARE_ADMIN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MUSITU_CF_STAGING_READ_TOKEN: ${{ secrets.MUSITU_CF_STAGING_READ_TOKEN }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: node customer_frontier/qualification/gate3_credential_boundary_acceptance.mjs
