name: MUSITU Axiom Global Support Final Production Audit

on:
  push:
    branches:
      - support/axiom-global-support-ops-production-rollout-20261008
    paths:
      - .github/workflows/axiom-global-support-final-production-audit.yml

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'push' && github.event.before == 'b32e80660af94dc8e91e91657de91f0a1f9e06d6'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 8
    env:
      CF_ACCOUNT: '93f395f5121954671f92fffa453d6b61'
      CF_ZONE: '5b56528f03948ff5917a5e0cd9f7109e'
      SUPPORT_DB: 'a525c8b6-9b44-413b-a219-46e419b71b12'
      WORKER_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
      D1_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_GLOBAL_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
    steps:
      - name: Independent control-plane and data-plane readback
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const api='https://api.cloudflare.com/client/v4';
          const account=process.env.CF_ACCOUNT,zone=process.env.CF_ZONE,db=process.env.SUPPORT_DB;
          const wt=String(process.env.WORKER_TOKEN||''),dt=String(process.env.D1_TOKEN||''),email=String(process.env.CF_EMAIL||''),key=String(process.env.CF_GLOBAL_KEY||'');
          const wh={authorization:'Bearer '+wt,accept:'application/json'},dh={authorization:'Bearer '+dt,accept:'application/json','content-type':'application/json'},gh={'X-Auth-Email':email,'X-Auth-Key':key,accept:'application/json'};
          async function raw(headers,path,{method='GET',body}={}){
            const r=await fetch(api+path,{method,headers:{...headers,...(body===undefined?{}:{'content-type':'application/json'})},...(body===undefined?{}:{body:JSON.stringify(body)})});
            let p={};try{p=await r.json()}catch{}return {r,p};
          }
          async function call(headers,path,opts={}){
            const {r,p}=await raw(headers,path,opts);
            if(!r.ok||p?.success===false)throw new Error('Cloudflare '+(opts.method||'GET')+' '+path+' failed HTTP '+r.status);
            return p.result;
          }
          async function q(sql){
            const result=await call(dh,'/accounts/'+account+'/d1/database/'+db+'/query',{method:'POST',body:{sql}});
            const x=Array.isArray(result)?result[0]:result;return x?.results||[];
          }
          async function mail(path){
            let r=await raw(wh,path);if(r.r.ok&&r.p?.success!==false)return r.p.result;
            r=await raw(gh,path);if(r.r.ok&&r.p?.success!==false)return r.p.result;
            throw new Error('mail routing read unavailable');
          }
          const [pubSettings,opsSettings,pubSub,opsSub,schedules,domains,routingRules,catchAll,dns,configEntry,counts,objects]=await Promise.all([
            call(wh,'/accounts/'+account+'/workers/scripts/musitu-axiom-support/settings'),
            call(wh,'/accounts/'+account+'/workers/scripts/musitu-axiom-support-ops/settings'),
            call(wh,'/accounts/'+account+'/workers/scripts/musitu-axiom-support/subdomain'),
            call(wh,'/accounts/'+account+'/workers/scripts/musitu-axiom-support-ops/subdomain'),
            call(wh,'/accounts/'+account+'/workers/scripts/musitu-axiom-support/schedules'),
            call(wh,'/accounts/'+account+'/workers/domains'),
            mail('/zones/'+zone+'/email/routing/rules'),
            mail('/zones/'+zone+'/email/routing/rules/catch_all'),
            call(wh,'/zones/'+zone+'/dns_records?per_page=500'),
            call(wh,'/zones/'+zone+'/rulesets/phases/http_config_settings/entrypoint'),
            q(`SELECT
              (SELECT COUNT(*) FROM support_cases) cases,
              (SELECT COUNT(*) FROM support_case_events) events,
              (SELECT COUNT(*) FROM support_case_messages) messages,
              (SELECT COUNT(*) FROM support_webhook_subscriptions) webhook_subscriptions,
              (SELECT COUNT(*) FROM support_webhook_delivery_configs) webhook_delivery_configs,
              (SELECT COUNT(*) FROM support_webhook_outbox) webhook_outbox,
              (SELECT COUNT(*) FROM support_attachments) attachments,
              (SELECT COUNT(*) FROM support_notification_outbox) notifications,
              (SELECT COUNT(*) FROM support_notification_attempts) notification_attempts`),
            q("SELECT name FROM sqlite_master WHERE type='table' AND name IN ('support_webhook_delivery_configs','support_attachment_deletion_outbox','support_email_threads','support_case_sla')")
          ]);
          const pb=Array.isArray(pubSettings?.bindings)?pubSettings.bindings:[],ob=Array.isArray(opsSettings?.bindings)?opsSettings.bindings:[];
          const scheduleRows=Array.isArray(schedules?.schedules)?schedules.schedules:Array.isArray(schedules)?schedules:[];
          const domainRows=Array.isArray(domains)?domains:[];
          const routeRows=Array.isArray(routingRules)?routingRules:[];
          const supportRules=routeRows.filter(r=>(Array.isArray(r?.matchers)?r.matchers:[]).some(m=>String(m?.type||'').toLowerCase()==='literal'&&String(m?.field||'').toLowerCase()==='to'&&String(m?.value||'').toLowerCase()==='support@mftintelligence.com'));
          const caActions=Array.isArray(catchAll?.actions)?catchAll.actions:[];
          const dnsRows=Array.isArray(dns)?dns:[];
          const lower=v=>String(v||'').toLowerCase();
          const configRules=Array.isArray(configEntry?.rules)?configEntry.rules:[];
          const emailReady=pb.find(x=>x?.name==='SUPPORT_OPS_EMAIL_READY');
          const result={
            gate:'MUSITU_AXIOM_GLOBAL_SUPPORT_FINAL_PRODUCTION_AUDIT',
            status:'PASS',
            workers:{
              public_domain:domainRows.some(x=>String(x?.hostname||'')==='support.mftintelligence.com'&&String(x?.service||'')==='musitu-axiom-support'),
              operator_domain:domainRows.some(x=>String(x?.hostname||'')==='support-ops.mftintelligence.com'&&String(x?.service||'')==='musitu-axiom-support-ops'),
              public_workers_dev:pubSub?.enabled===true,
              public_previews:pubSub?.previews_enabled===true,
              operator_workers_dev:opsSub?.enabled===true,
              operator_previews:opsSub?.previews_enabled===true,
              d1_binding:pb.some(x=>x?.name==='SUPPORT_DB'),
              r2_binding:pb.some(x=>x?.name==='SUPPORT_ATTACHMENTS'&&x?.type==='r2_bucket'),
              operator_send_email_binding:pb.some(x=>x?.name==='SUPPORT_OPS_EMAIL'&&x?.type==='send_email'),
              operator_email_ready:String(emailReady?.text||'')==='true',
              operator_service_binding:ob.some(x=>x?.name==='SUPPORT_API'&&x?.type==='service'&&x?.service==='musitu-axiom-support')
            },
            scheduler:{
              exactly_one:scheduleRows.length===1,
              cron:scheduleRows[0]?String(scheduleRows[0]?.cron||''):null
            },
            inbound_email:{
              exact_support_forward_rule_count:supportRules.length,
              catch_all_enabled:catchAll?.enabled===true,
              catch_all_to_support_worker:caActions.some(x=>String(x?.type||'')==='worker'&&Array.isArray(x?.value)&&x.value.includes('musitu-axiom-support')),
              raw_destination_recorded:false
            },
            native_webhooks:{
              encrypted_config_table:(objects||[]).some(x=>x?.name==='support_webhook_delivery_configs'),
              config_rows:Number(counts?.[0]?.webhook_delivery_configs||0),
              subscription_rows:Number(counts?.[0]?.webhook_subscriptions||0),
              outbox_rows:Number(counts?.[0]?.webhook_outbox||0)
            },
            support_counts:Object.fromEntries(Object.entries(counts?.[0]||{}).filter(([k])=>!k.startsWith('webhook_')).map(([k,v])=>[k,Number(v||0)])),
            email_sending_boundary:{
              cf_bounce_mx:dnsRows.filter(x=>lower(x?.name)==='cf-bounce.mftintelligence.com'&&String(x?.type||'').toUpperCase()==='MX'&&lower(x?.content).includes('mx.cloudflare.net')).length,
              cf_bounce_spf:dnsRows.filter(x=>lower(x?.name)==='cf-bounce.mftintelligence.com'&&String(x?.type||'').toUpperCase()==='TXT'&&lower(x?.content).includes('_spf.mx.cloudflare.net')).length,
              cf_bounce_dkim:dnsRows.filter(x=>lower(x?.name)==='cf-bounce._domainkey.mftintelligence.com'&&String(x?.type||'').toUpperCase()==='TXT'&&lower(x?.content).startsWith('v=dkim1')).length,
              onboarding_complete:false
            },
            public_status_boundary:{
              configuration_rule_count:configRules.length,
              support_status_rule_count:configRules.filter(x=>String(x?.ref||'')==='musitu_axiom_public_status_security_level').length,
              configuration_rule_capacity_observed:10
            },
            customer_content_read:false,
            recovery_code_read:false,
            secret_values_recorded:false,
            mutation_performed:false
          };
          if(!result.workers.public_domain||!result.workers.operator_domain||result.workers.public_workers_dev||result.workers.public_previews||result.workers.operator_workers_dev||result.workers.operator_previews)throw new Error('Worker/domain posture drift');
          if(!result.workers.d1_binding||!result.workers.r2_binding||!result.workers.operator_service_binding)throw new Error('required binding drift');
          if(result.workers.operator_email_ready!==false)throw new Error('operator Email Sending must remain fail closed');
          if(!result.scheduler.exactly_one||result.scheduler.cron!=='*/5 * * * *')throw new Error('scheduler drift');
          if(result.inbound_email.exact_support_forward_rule_count!==1||!result.inbound_email.catch_all_enabled||!result.inbound_email.catch_all_to_support_worker)throw new Error('inbound email routing drift');
          if(!result.native_webhooks.encrypted_config_table)throw new Error('native webhook encrypted table missing');
          result.email_sending_boundary.onboarding_complete=result.email_sending_boundary.cf_bounce_mx>0&&result.email_sending_boundary.cf_bounce_spf>0&&result.email_sending_boundary.cf_bounce_dkim>0;
          console.log(JSON.stringify(result));
          NODE
