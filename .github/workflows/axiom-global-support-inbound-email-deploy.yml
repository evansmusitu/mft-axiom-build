name: MUSITU Axiom Global Support Inbound Email Deploy

on:
  push:
    branches:
      - 'support/axiom-global-support-ops-production-rollout-20261008'
    paths:
      - '.github/workflows/axiom-global-support-inbound-email-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' && github.event.before == '722055a2838e4af2ed01a90233d1380984d54555'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 12
    env:
      CF_ACCOUNT: '93f395f5121954671f92fffa453d6b61'
      CF_ZONE: '5b56528f03948ff5917a5e0cd9f7109e'
      WORKER_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
      CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_GLOBAL_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exact release gate and full regression
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'support/axiom-global-support-ops-production-rollout-20261008'
          test "${{ github.event.before }}" = '722055a2838e4af2ed01a90233d1380984d54555'
          node --check support/worker.js
          node --check support/email_worker.js
          node --check support/d1_case_store.js
          node --test support/tests/*.test.mjs

      - name: Build public Worker with email handler
        shell: bash
        run: |
          set -euo pipefail
          npx --yes esbuild@0.25.11 support/app.js --bundle --format=esm --platform=browser --target=es2022 --outfile=.support-public-app.js
          node <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('support/index.html','utf8'),css=fs.readFileSync('support/styles.css','utf8'),robots=fs.readFileSync('support/robots.txt','utf8'),sitemap=fs.readFileSync('support/sitemap.xml','utf8'),app=fs.readFileSync('.support-public-app.js','utf8');
          const recoveryHtml=fs.readFileSync('support/recovery/index.html','utf8'),recoveryApp=fs.readFileSync('support/recovery/app.js','utf8');
          const statusHtml=fs.readFileSync('support/status/index.html','utf8'),statusApp=fs.readFileSync('support/status/app.js','utf8');
          const source=[
            "import support,{handleOperatorRequest} from './support/worker.js';",
            "const HTML="+JSON.stringify(html)+";const CSS="+JSON.stringify(css)+";const ROBOTS="+JSON.stringify(robots)+";const SITEMAP="+JSON.stringify(sitemap)+";const APP="+JSON.stringify(app)+";",
            "const RECOVERY_HTML="+JSON.stringify(recoveryHtml)+";const RECOVERY_APP="+JSON.stringify(recoveryApp)+";const STATUS_HTML="+JSON.stringify(statusHtml)+";const STATUS_APP="+JSON.stringify(statusApp)+";",
            "const H=Object.freeze({'content-security-policy':\"default-src 'self'; connect-src 'self' https://challenges.cloudflare.com; img-src 'self' data:; style-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'\",'referrer-policy':'no-referrer','permissions-policy':'camera=(), microphone=(), geolocation=(), payment=()','x-content-type-options':'nosniff','cross-origin-opener-policy':'same-origin','cross-origin-resource-policy':'same-origin','cache-control':'no-store'});",
            "const RH=Object.freeze({...H,'x-robots-tag':'noindex, nofollow, noarchive','content-security-policy':\"default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'\"});",
            "function asset(body,type,headers=H){return new Response(body,{status:200,headers:{...headers,'content-type':type}})}",
            "export default {async scheduled(controller,env,ctx){return support.scheduled(controller,env,ctx);},async email(message,env,ctx){return support.email(message,env,ctx);},async fetch(request,env,ctx){const u=new URL(request.url);",
            "if(u.pathname.startsWith('/api/v1/operator/')) return handleOperatorRequest(request,env);",
            "if(request.method==='GET'&&(u.pathname==='/recovery/'||u.pathname==='/recovery/index.html')) return asset(RECOVERY_HTML,'text/html; charset=utf-8',RH);",
            "if(request.method==='GET'&&u.pathname==='/recovery/app.js') return asset(RECOVERY_APP,'text/javascript; charset=utf-8',RH);",
            "if(request.method==='GET'&&(u.pathname==='/status/'||u.pathname==='/status/index.html')) return asset(STATUS_HTML,'text/html; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/status/app.js') return asset(STATUS_APP,'text/javascript; charset=utf-8');",
            "if(request.method==='GET'&&(u.pathname==='/'||u.pathname==='/index.html')) return asset(HTML,'text/html; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/styles.css') return asset(CSS,'text/css; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/robots.txt') return asset(ROBOTS,'text/plain; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/sitemap.xml') return asset(SITEMAP,'application/xml; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/app.js') return asset(APP,'text/javascript; charset=utf-8');",
            "return support.fetch(request,env,ctx);}};"
          ].join('\n');
          fs.writeFileSync('.support-public-entry.mjs',source,{mode:0o600});
          NODE
          npx --yes esbuild@0.25.11 .support-public-entry.mjs --bundle --format=esm --platform=browser --target=es2022 --outfile=.support-public-bundle.mjs
          grep -q 'email-thread' .support-public-bundle.mjs

      - name: Deploy email-capable public Worker with strict inherited bindings
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {buildWorkerMultipart} from './support/scripts/provision_cloudflare_control_plane.mjs';
          const api='https://api.cloudflare.com/client/v4',account=process.env.CF_ACCOUNT,token=String(process.env.WORKER_TOKEN||'');
          if(!token)throw new Error('Worker token missing');
          const h={authorization:'Bearer '+token,accept:'application/json'};
          async function call(path,{method='GET',body,rawBody,contentType}={}){
            const r=await fetch(api+path,{method,headers:{...h,...(body===undefined?{}:{'content-type':'application/json'}),...(contentType?{'content-type':contentType}:{})},...(rawBody!==undefined?{body:rawBody}:body===undefined?{}:{body:JSON.stringify(body)})});
            const p=await r.json().catch(()=>({}));
            if(!r.ok||p?.success===false)throw new Error('Cloudflare '+method+' '+path+' failed HTTP '+r.status+' codes='+((p.errors||[]).map(x=>x.code).join(',')||'none'));
            return p.result;
          }
          const name='musitu-axiom-support';
          const [settings,secrets]=await Promise.all([call('/accounts/'+account+'/workers/scripts/'+name+'/settings'),call('/accounts/'+account+'/workers/scripts/'+name+'/secrets')]);
          const current=Array.isArray(settings?.bindings)?settings.bindings:[],secretNames=new Set((Array.isArray(secrets)?secrets:[]).map(x=>String(x?.name||'')));
          const bindings=[];
          for(const b of current){
            const n=String(b?.name||'');if(!n)continue;
            if(secretNames.has(n)||b?.type==='secret_text')bindings.push({type:'inherit',name:n,version_id:'latest'});
            else bindings.push(b);
          }
          const m=buildWorkerMultipart(fs.readFileSync('.support-public-bundle.mjs'),{
            main_module:'index.mjs',compatibility_date:'2026-10-08',bindings,
            annotations:{'workers/message':'MUSITU Axiom secure inbound support email threading'}
          },'----MUSITUInboundEmail');
          await call('/accounts/'+account+'/workers/scripts/'+name+'?bindings_inherit=strict',{method:'PUT',rawBody:m.body,contentType:'multipart/form-data; boundary='+m.boundary});
          await call('/accounts/'+account+'/workers/scripts/'+name+'/subdomain',{method:'POST',body:{enabled:false,previews_enabled:false}});
          await call('/accounts/'+account+'/workers/scripts/'+name+'/schedules',{method:'PUT',body:[{cron:'*/5 * * * *'}]});
          const schedules=await call('/accounts/'+account+'/workers/scripts/'+name+'/schedules');
          const scheduleRows=Array.isArray(schedules?.schedules)?schedules.schedules:Array.isArray(schedules)?schedules:[];
          if(!scheduleRows.some(x=>String(x?.cron||'')==='*/5 * * * *'))throw new Error('support cron missing after Worker redeploy');
          const after=await call('/accounts/'+account+'/workers/scripts/'+name+'/settings');
          const names=new Set((after?.bindings||[]).map(x=>String(x?.name||'')));
          for(const required of ['SUPPORT_DB','SUPPORT_DATA_KEY_B64','SUPPORT_ATTACHMENTS','SUPPORT_INTAKE_RATE_LIMITER'])if(!names.has(required))throw new Error('required binding missing after deploy: '+required);
          console.log(JSON.stringify({gate:'MUSITU_AXIOM_INBOUND_EMAIL_WORKER_DEPLOY',status:'PASS',strict_inherited_bindings:true,workers_dev:false,secret_values_read:false}));
          NODE

      - name: Route unmatched threaded replies to the support Worker with rollback
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          const api='https://api.cloudflare.com/client/v4',zone=process.env.CF_ZONE,token=String(process.env.WORKER_TOKEN||''),email=String(process.env.CF_EMAIL||''),key=String(process.env.CF_GLOBAL_KEY||'');
          const bh={authorization:'Bearer '+token},gh={'X-Auth-Email':email,'X-Auth-Key':key};
          async function raw(headers,path,{method='GET',body}={}){
            const r=await fetch(api+path,{method,headers:{...headers,accept:'application/json',...(body===undefined?{}:{'content-type':'application/json'})},...(body===undefined?{}:{body:JSON.stringify(body)})});
            let p={};try{p=await r.json()}catch{}return {r,p};
          }
          async function call(path,opts={}){
            let a=await raw(bh,path,opts);
            if(a.r.ok&&a.p?.success!==false)return a.p.result;
            if(email&&key){a=await raw(gh,path,opts);if(a.r.ok&&a.p?.success!==false)return a.p.result;}
            throw new Error('Cloudflare Email Routing '+(opts.method||'GET')+' failed '+a.r.status+' '+path+' codes='+((a.p?.errors||[]).map(x=>x.code).join(',')||'none'));
          }
          const rows=v=>Array.isArray(v)?v:[];
          const rulesBefore=await call('/zones/'+zone+'/email/routing/rules');
          const support=rows(rulesBefore).filter(r=>(rows(r?.matchers)).some(m=>String(m?.type||'').toLowerCase()==='literal'&&String(m?.field||'').toLowerCase()==='to'&&String(m?.value||'').toLowerCase()==='support@mftintelligence.com'));
          if(support.length!==1||support[0]?.enabled!==true||rows(support[0]?.actions).length!==1||String(support[0]?.actions?.[0]?.type||'')!=='forward')throw new Error('exact support forwarding rule missing');
          const supportFingerprint=createHash('sha256').update(JSON.stringify(support[0])).digest('hex');
          const catchBefore=await call('/zones/'+zone+'/email/routing/rules/catch_all');
          const old={name:String(catchBefore?.name||'Catch-all address'),enabled:catchBefore?.enabled===true,matchers:rows(catchBefore?.matchers),actions:rows(catchBefore?.actions)};
          if(old.enabled)throw new Error('catch-all unexpectedly enabled before bounded rollout');
          let changed=false;
          try{
            await call('/zones/'+zone+'/email/routing/rules/catch_all',{method:'PUT',body:{
              name:'MUSITU Axiom threaded support replies',enabled:true,matchers:[{type:'all'}],actions:[{type:'worker',value:['musitu-axiom-support']}]
            }});
            changed=true;
            const [after,rulesAfter]=await Promise.all([
              call('/zones/'+zone+'/email/routing/rules/catch_all'),
              call('/zones/'+zone+'/email/routing/rules')
            ]);
            const acts=rows(after?.actions),matches=rows(after?.matchers);
            if(after?.enabled!==true||acts.length!==1||String(acts[0]?.type||'')!=='worker'||String(acts[0]?.value?.[0]||'')!=='musitu-axiom-support'||matches.length!==1||String(matches[0]?.type||'')!=='all')throw new Error('threaded reply catch-all verification failed');
            const supportAfter=rows(rulesAfter).filter(r=>(rows(r?.matchers)).some(m=>String(m?.type||'').toLowerCase()==='literal'&&String(m?.field||'').toLowerCase()==='to'&&String(m?.value||'').toLowerCase()==='support@mftintelligence.com'));
            if(supportAfter.length!==1||createHash('sha256').update(JSON.stringify(supportAfter[0])).digest('hex')!==supportFingerprint)throw new Error('support forwarding rule drift');
            console.log(JSON.stringify({gate:'MUSITU_AXIOM_INBOUND_EMAIL_ROUTING',status:'PASS',support_forward_rule_unchanged:true,catch_all_worker:'musitu-axiom-support',raw_destination_recorded:false,secret_values_recorded:false}));
          }catch(error){
            if(changed)await call('/zones/'+zone+'/email/routing/rules/catch_all',{method:'PUT',body:old});
            throw error;
          }
          NODE

      - name: Cleanup
        if: always()
        run: rm -f .support-public-app.js .support-public-entry.mjs .support-public-bundle.mjs
