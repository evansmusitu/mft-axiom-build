name: MUSITU Axiom Global Support Production Deploy

on:
  push:
    branches:
      - 'support/axiom-global-support-ops-production-rollout-20261008'
    paths:
      - '.github/workflows/axiom-global-support-ops-production-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' && github.event.before == '6227e7c1a8a77a35d9d5a9bef99a7357b49cfd1d'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 15
    env:
      CF_ACCOUNT: '93f395f5121954671f92fffa453d6b61'
      SUPPORT_DB: 'a525c8b6-9b44-413b-a219-46e419b71b12'
      D1_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exact release gate and full regression
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'support/axiom-global-support-ops-production-rollout-20261008'
          test "${{ github.event.before }}" = '6227e7c1a8a77a35d9d5a9bef99a7357b49cfd1d'
          test "$GITHUB_REF_NAME" != 'main'
          node --check support/worker.js
          node --check support/operator_worker.js
          node --check support/d1_case_store.js
          node --check support/retention_lifecycle.js
          node --test support/tests/*.test.mjs

      - name: Take D1 checkpoint, apply additive schema and backfill operational clocks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const api='https://api.cloudflare.com/client/v4',account=process.env.CF_ACCOUNT,db=process.env.SUPPORT_DB;
          const token=String(process.env.D1_TOKEN||'');if(!token)throw new Error('D1 token missing');
          const h={authorization:'Bearer '+token,accept:'application/json','content-type':'application/json'};
          async function call(path,{method='GET',body}={}){
            const r=await fetch(api+path,{method,headers:h,...(body===undefined?{}:{body:JSON.stringify(body)})});
            const p=await r.json().catch(()=>({}));
            if(!r.ok||p?.success===false)throw new Error('Cloudflare D1 '+method+' '+path+' failed HTTP '+r.status+' codes='+((p.errors||[]).map(x=>x.code).join(',')||'none'));
            return p.result;
          }
          async function query(sql){return call('/accounts/'+account+'/d1/database/'+db+'/query',{method:'POST',body:{sql}})}
          const rows=result=>{const x=Array.isArray(result)?result[0]:result;return Array.isArray(x?.results)?x.results:[]};
          const countsSql="SELECT (SELECT COUNT(*) FROM support_cases) cases,(SELECT COUNT(*) FROM support_case_events) events,(SELECT COUNT(*) FROM support_case_messages) messages,(SELECT COUNT(*) FROM support_case_approvals) approvals,(SELECT COUNT(*) FROM support_case_approval_decisions) decisions,(SELECT COUNT(*) FROM support_notification_outbox) notifications,(SELECT COUNT(*) FROM support_case_recovery_bindings) recovery_bindings,(SELECT COUNT(*) FROM support_case_recovery_requests) recovery_requests,(SELECT COUNT(*) FROM support_case_recovery_rotations) recovery_rotations;";
          const before=rows(await query(countsSql))[0]||{};
          const bookmark=await call('/accounts/'+account+'/d1/database/'+db+'/time_travel/bookmark');
          const bm=String(bookmark?.bookmark||'');if(!bm)throw new Error('Time Travel bookmark unavailable');
          await query(fs.readFileSync('support/schema.sql','utf8'));
          const at=new Date().toISOString();
          const esc=v=>String(v).replace(/'/g,"''");
          const backfill=`
          INSERT OR IGNORE INTO support_case_sla(case_id,plan,ack_due_at,update_due_at,resolve_target_at,acknowledged_at,last_meaningful_update_at,resolved_at,contractual,updated_at)
          SELECT case_id,'STANDARD',
            CASE priority WHEN 'P0' THEN datetime('${esc(at)}','+15 minutes') WHEN 'P1' THEN datetime('${esc(at)}','+60 minutes') WHEN 'P2' THEN datetime('${esc(at)}','+480 minutes') ELSE datetime('${esc(at)}','+2880 minutes') END,
            CASE priority WHEN 'P0' THEN datetime('${esc(at)}','+60 minutes') WHEN 'P1' THEN datetime('${esc(at)}','+240 minutes') WHEN 'P2' THEN datetime('${esc(at)}','+1440 minutes') ELSE datetime('${esc(at)}','+4320 minutes') END,
            CASE priority WHEN 'P0' THEN datetime('${esc(at)}','+240 minutes') WHEN 'P1' THEN datetime('${esc(at)}','+1440 minutes') WHEN 'P2' THEN datetime('${esc(at)}','+4320 minutes') ELSE datetime('${esc(at)}','+10080 minutes') END,
            NULL,NULL,CASE WHEN state IN ('RESOLVED','CLOSED') THEN updated_at ELSE NULL END,0,'${esc(at)}'
          FROM support_cases;
          INSERT OR IGNORE INTO support_case_triage(case_id,lane,language,advisory_only,human_review_required,updated_at)
          SELECT case_id,
            CASE
              WHEN category='security_report' OR surface='security' THEN 'SECURITY'
              WHEN category='privacy_request' OR surface='privacy_data_rights' THEN 'PRIVACY'
              WHEN category='billing' OR surface='billing_commerce' THEN 'BILLING'
              WHEN category='incident' OR surface='status_incident' THEN 'INCIDENT'
              WHEN category='calculation_dispute' OR surface='quantitative_result' THEN 'QUANT_ENGINEERING'
              WHEN category='access' OR surface='oauth_account' THEN 'IDENTITY_ACCESS'
              ELSE 'PRODUCT_ENGINEERING'
            END,'und',1,1,'${esc(at)}' FROM support_cases;
          INSERT OR IGNORE INTO support_case_languages(case_id,language,detected_from,updated_at)
          SELECT case_id,'und','unknown','${esc(at)}' FROM support_cases;`;
          await query(backfill);
          const after=rows(await query(countsSql))[0]||{};
          for(const k of Object.keys(before))if(Number(before[k]||0)!==Number(after[k]||0))throw new Error('existing support row count changed: '+k);
          const global=rows(await query("SELECT (SELECT COUNT(*) FROM support_case_sla) sla,(SELECT COUNT(*) FROM support_case_triage) triage,(SELECT COUNT(*) FROM support_case_languages) languages,(SELECT COUNT(*) FROM support_attachment_deletion_outbox) attachment_deletions;"))[0]||{};
          if(Number(global.sla||0)<Number(after.cases||0)||Number(global.triage||0)<Number(after.cases||0)||Number(global.languages||0)<Number(after.cases||0))throw new Error('global ops backfill incomplete');
          console.log(JSON.stringify({
            gate:'MUSITU_AXIOM_GLOBAL_SUPPORT_D1_MIGRATION',
            status:'PASS',
            bookmark_sha256:createHash('sha256').update(bm).digest('hex'),
            bookmark_value_recorded:false,
            before:Object.fromEntries(Object.entries(before).map(([k,v])=>[k,Number(v||0)])),
            after:Object.fromEntries(Object.entries(after).map(([k,v])=>[k,Number(v||0)])),
            global:Object.fromEntries(Object.entries(global).map(([k,v])=>[k,Number(v||0)])),
            backfill_baseline:at,
            retroactive_sla_breach_created:false
          }));
          NODE

      - name: Provision private R2 attachment bucket
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const api='https://api.cloudflare.com/client/v4',account=process.env.CF_ACCOUNT;
          const token=String(process.env.WORKER_TOKEN||'');if(!token)throw new Error('Worker token missing');
          const h={authorization:'Bearer '+token,accept:'application/json','content-type':'application/json'};
          async function raw(path,{method='GET',body}={}){
            const r=await fetch(api+path,{method,headers:h,...(body===undefined?{}:{body:JSON.stringify(body)})});
            const p=await r.json().catch(()=>({}));return {r,p};
          }
          async function call(path,opts={}){const {r,p}=await raw(path,opts);if(!r.ok||p?.success===false)throw new Error('Cloudflare '+(opts.method||'GET')+' '+path+' failed HTTP '+r.status+' codes='+((p.errors||[]).map(x=>x.code).join(',')||'none'));return p.result;}
          const name='musitu-axiom-support-attachments';
          const list=await call('/accounts/'+account+'/r2/buckets');
          const buckets=Array.isArray(list)?list:Array.isArray(list?.buckets)?list.buckets:[];
          let created=false;
          if(!buckets.some(x=>String(x?.name||'')===name)){await call('/accounts/'+account+'/r2/buckets',{method:'POST',body:{name}});created=true;}
          const verify=await call('/accounts/'+account+'/r2/buckets');
          const rows=Array.isArray(verify)?verify:Array.isArray(verify?.buckets)?verify.buckets:[];
          if(!rows.some(x=>String(x?.name||'')===name))throw new Error('attachment R2 bucket missing after provision');
          console.log(JSON.stringify({gate:'MUSITU_AXIOM_GLOBAL_SUPPORT_R2',status:'PASS',bucket_name:name,created,public_access_configured:false}));
          NODE

      - name: Build public and operator Workers
        shell: bash
        run: |
          set -euo pipefail
          npx --yes esbuild@0.25.11 support/app.js --bundle --format=esm --platform=browser --target=es2022 --outfile=.support-public-app.js
          node <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('support/index.html','utf8');
          const css=fs.readFileSync('support/styles.css','utf8');
          const robots=fs.readFileSync('support/robots.txt','utf8');
          const sitemap=fs.readFileSync('support/sitemap.xml','utf8');
          const app=fs.readFileSync('.support-public-app.js','utf8');
          const recoveryHtml=fs.readFileSync('support/recovery/index.html','utf8');
          const recoveryApp=fs.readFileSync('support/recovery/app.js','utf8');
          const statusHtml=fs.readFileSync('support/status/index.html','utf8');
          const statusApp=fs.readFileSync('support/status/app.js','utf8');
          const source=[
            "import support,{handleOperatorRequest} from './support/worker.js';",
            "const HTML="+JSON.stringify(html)+";const CSS="+JSON.stringify(css)+";const ROBOTS="+JSON.stringify(robots)+";const SITEMAP="+JSON.stringify(sitemap)+";const APP="+JSON.stringify(app)+";",
            "const RECOVERY_HTML="+JSON.stringify(recoveryHtml)+";const RECOVERY_APP="+JSON.stringify(recoveryApp)+";const STATUS_HTML="+JSON.stringify(statusHtml)+";const STATUS_APP="+JSON.stringify(statusApp)+";",
            "const H=Object.freeze({'content-security-policy':\"default-src 'self'; connect-src 'self' https://challenges.cloudflare.com; img-src 'self' data:; style-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'\",'referrer-policy':'no-referrer','permissions-policy':'camera=(), microphone=(), geolocation=(), payment=()','x-content-type-options':'nosniff','cross-origin-opener-policy':'same-origin','cross-origin-resource-policy':'same-origin','cache-control':'no-store'});",
            "const RH=Object.freeze({...H,'x-robots-tag':'noindex, nofollow, noarchive','content-security-policy':\"default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'\"});",
            "function asset(body,type,headers=H){return new Response(body,{status:200,headers:{...headers,'content-type':type}})}",
            "export default {async scheduled(controller,env,ctx){return support.scheduled(controller,env,ctx);},async fetch(request,env,ctx){const u=new URL(request.url);",
            "if(u.pathname.startsWith('/api/v1/operator/')) return handleOperatorRequest(request,env);",
            "if(request.method==='GET'&&(u.pathname==='/recovery/'||u.pathname==='/recovery/index.html')) return asset(RECOVERY_HTML,'text/html; charset=utf-8',RH);",
            "if(request.method==='GET'&&u.pathname==='/recovery/app.js') return asset(RECOVERY_APP,'text/javascript; charset=utf-8',RH);",
            "if(request.method==='GET'&&(u.pathname==='/status/'||u.pathname==='/status/index.html')) return asset(STATUS_HTML,'text/html; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/status/app.js') return asset(STATUS_APP,'text/javascript; charset=utf-8');",
            "if(request.method==='GET'&&(u.pathname==='/'||u.pathname==='/index.html')) return asset(HTML,'text/html; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/styles.css') return asset(CSS,'text/css; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/robots.txt') return asset(ROBOTS,'text/plain; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/sitemap.xml') return asset(SITEMAP,'application/xml; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/app.js') return asset(APP,'text/javascript; charset=utf-8');",
            "return support.fetch(request,env,ctx);}};"
          ].join('\n');
          fs.writeFileSync('.support-public-entry.mjs',source,{mode:0o600});
          const oh=fs.readFileSync('support/console/index.html','utf8'),oc=fs.readFileSync('support/console/styles.css','utf8'),oa=fs.readFileSync('support/console/app.js','utf8');
          const ops=[
            "import operator from './support/operator_worker.js';import {verifyOperatorAccess} from './support/worker.js';",
            "const HTML="+JSON.stringify(oh)+";const CSS="+JSON.stringify(oc)+";const APP="+JSON.stringify(oa)+";",
            "const H=Object.freeze({'cache-control':'no-store','x-content-type-options':'nosniff','x-robots-tag':'noindex, nofollow, noarchive','referrer-policy':'no-referrer','content-security-policy':\"default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'\"});",
            "function asset(body,type){return new Response(body,{status:200,headers:{...H,'content-type':type}})}",
            "export default {async fetch(request,env){const principal=await verifyOperatorAccess(request,env);if(!principal)return operator.fetch(request,env);const u=new URL(request.url);",
            "if((request.method==='GET'||request.method==='HEAD')&&(u.pathname==='/'||u.pathname==='/index.html'))return asset(request.method==='HEAD'?null:HTML,'text/html; charset=utf-8');",
            "if((request.method==='GET'||request.method==='HEAD')&&u.pathname==='/styles.css')return asset(request.method==='HEAD'?null:CSS,'text/css; charset=utf-8');",
            "if((request.method==='GET'||request.method==='HEAD')&&u.pathname==='/app.js')return asset(request.method==='HEAD'?null:APP,'text/javascript; charset=utf-8');",
            "return operator.fetch(request,env);}};"
          ].join('\n');
          fs.writeFileSync('.support-ops-entry.mjs',ops,{mode:0o600});
          NODE
          npx --yes esbuild@0.25.11 .support-public-entry.mjs --bundle --format=esm --platform=browser --target=es2022 --outfile=.support-public-bundle.mjs
          npx --yes esbuild@0.25.11 .support-ops-entry.mjs --bundle --format=esm --platform=browser --target=es2022 --outfile=.support-ops-bundle.mjs

      - name: Deploy Workers with inherited secrets, R2 binding and schedule
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {buildWorkerMultipart} from './support/scripts/provision_cloudflare_control_plane.mjs';
          const api='https://api.cloudflare.com/client/v4',account=process.env.CF_ACCOUNT,token=String(process.env.WORKER_TOKEN||'');
          if(!token)throw new Error('Worker token missing');
          const h={authorization:'Bearer '+token,accept:'application/json'};
          async function call(path,{method='GET',body,rawBody,contentType}={}){
            const r=await fetch(api+path,{method,headers:{...h,...(body===undefined?{}:{'content-type':'application/json'}),...(contentType?{'content-type':contentType}:{})},...(rawBody!==undefined?{body:rawBody}:body===undefined?{}:{body:JSON.stringify(body)})});
            const p=await r.json().catch(()=>({}));
            if(!r.ok||p?.success===false)throw new Error('Cloudflare '+method+' '+path+' failed HTTP '+r.status+' codes='+((p.errors||[]).map(x=>x.code).join(',')||'none'));
            return p.result;
          }
          const bucket='musitu-axiom-support-attachments';
          async function deploy(name,file,extraBinding=null){
            const [settings,secrets]=await Promise.all([
              call('/accounts/'+account+'/workers/scripts/'+name+'/settings'),
              call('/accounts/'+account+'/workers/scripts/'+name+'/secrets')
            ]);
            const current=Array.isArray(settings?.bindings)?settings.bindings:[];
            const secretNames=new Set((Array.isArray(secrets)?secrets:[]).map(x=>String(x?.name||'')));
            const bindings=[];
            for(const b of current){
              const n=String(b?.name||'');if(!n||n==='SUPPORT_ATTACHMENTS')continue;
              if(secretNames.has(n)||b?.type==='secret_text')bindings.push({type:'inherit',name:n,version_id:'latest'});
              else bindings.push(b);
            }
            if(extraBinding)bindings.push(extraBinding);
            const m=buildWorkerMultipart(fs.readFileSync(file),{
              main_module:'index.mjs',compatibility_date:'2026-10-08',bindings,
              annotations:{'workers/message':'MUSITU Axiom Global Support Operations production rollout'}
            },'----MUSITUGlobalSupport'+name.replace(/[^a-z0-9]/gi,''));
            await call('/accounts/'+account+'/workers/scripts/'+name+'?bindings_inherit=strict',{method:'PUT',rawBody:m.body,contentType:'multipart/form-data; boundary='+m.boundary});
            await call('/accounts/'+account+'/workers/scripts/'+name+'/subdomain',{method:'POST',body:{enabled:false,previews_enabled:false}});
          }
          await deploy('musitu-axiom-support','.support-public-bundle.mjs',{type:'r2_bucket',name:'SUPPORT_ATTACHMENTS',bucket_name:bucket});
          await deploy('musitu-axiom-support-ops','.support-ops-bundle.mjs');
          await call('/accounts/'+account+'/workers/scripts/musitu-axiom-support/schedules',{method:'PUT',body:[{cron:'*/5 * * * *'}]});
          const [pub,ops,schedules,domains]=await Promise.all([
            call('/accounts/'+account+'/workers/scripts/musitu-axiom-support/settings'),
            call('/accounts/'+account+'/workers/scripts/musitu-axiom-support-ops/settings'),
            call('/accounts/'+account+'/workers/scripts/musitu-axiom-support/schedules'),
            call('/accounts/'+account+'/workers/domains')
          ]);
          const pb=Array.isArray(pub?.bindings)?pub.bindings:[],ob=Array.isArray(ops?.bindings)?ops.bindings:[],sc=Array.isArray(schedules?.schedules)?schedules.schedules:Array.isArray(schedules)?schedules:[];
          if(!pb.some(x=>x?.name==='SUPPORT_ATTACHMENTS'&&x?.type==='r2_bucket'))throw new Error('R2 binding missing');
          if(!ob.some(x=>x?.name==='SUPPORT_API'&&x?.type==='service'&&x?.service==='musitu-axiom-support'))throw new Error('operator service binding missing');
          if(!sc.some(x=>String(x?.cron||'')==='*/5 * * * *'))throw new Error('support cron missing');
          const ds=Array.isArray(domains)?domains:[];
          if(!ds.some(x=>x?.hostname==='support.mftintelligence.com'&&x?.service==='musitu-axiom-support'))throw new Error('public domain drift');
          if(!ds.some(x=>x?.hostname==='support-ops.mftintelligence.com'&&x?.service==='musitu-axiom-support-ops'))throw new Error('operator domain drift');
          console.log(JSON.stringify({gate:'MUSITU_AXIOM_GLOBAL_SUPPORT_WORKER_DEPLOY',status:'PASS',r2_binding:true,cron:'*/5 * * * *',public_domain:true,operator_domain:true,secret_values_read:false}));
          NODE

      - name: Cleanup bundles
        if: always()
        run: rm -f .support-public-app.js .support-public-entry.mjs .support-ops-entry.mjs .support-public-bundle.mjs .support-ops-bundle.mjs
