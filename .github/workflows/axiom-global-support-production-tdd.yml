name: MUSITU Axiom Global Support Production TDD

on:
  push:
    branches:
      - 'support/axiom-global-support-ops-production-rollout-20261008'
    paths:
      - 'support/**'
      - '.github/workflows/axiom-global-support-production-tdd.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check support/worker.js
          node --check support/d1_case_store.js
          node --check support/retention_lifecycle.js
      - name: Full support suite
        run: node --test support/tests/*.test.mjs
