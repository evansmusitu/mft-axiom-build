name: MUSITU Axiom Public Status Edge Activation

on:
  push:
    branches:
      - 'support/axiom-global-support-ops-production-rollout-20261008'
    paths:
      - '.github/workflows/axiom-global-support-status-edge.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' && github.event.before == '6ac124b8027dd0810a87fb437d8e3793d8534547'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 8
    env:
      CF_ZONE: '5b56528f03948ff5917a5e0cd9f7109e'
      TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
    steps:
      - name: Prove status API is public metadata-only in source
        run: |
          set -euo pipefail
          node --test support/tests/global_ops_http.test.mjs support/tests/global_ops_admin_ui.test.mjs

      - name: Apply narrow public-status WAF skip
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const api='https://api.cloudflare.com/client/v4',zone=process.env.CF_ZONE,token=String(process.env.TOKEN||'');
          const h={authorization:'Bearer '+token,accept:'application/json','content-type':'application/json'};
          async function call(path,{method='GET',body}={}){
            const r=await fetch(api+path,{method,headers:h,...(body===undefined?{}:{body:JSON.stringify(body)})});
            const p=await r.json().catch(()=>({}));
            if(!r.ok||p?.success===false)throw new Error('Cloudflare '+method+' '+path+' failed HTTP '+r.status+' codes='+((p.errors||[]).map(x=>x.code).join(',')||'none'));
            return p.result;
          }
          const entry=await call('/zones/'+zone+'/rulesets/phases/http_request_firewall_custom/entrypoint');
          const rulesetId=String(entry?.id||'');if(!rulesetId)throw new Error('custom WAF entrypoint missing');
          const ref='musitu_axiom_support_public_status';
          const expression='(http.host eq "support.mftintelligence.com" and http.request.method in {"GET" "HEAD"} and http.request.uri.path in {"/status/" "/status/index.html" "/status/app.js" "/api/v1/status" "/styles.css"})';
          const desired={
            action:'skip',expression,description:'MUSITU Axiom public status read-only assets',
            ref,enabled:true,action_parameters:{products:['bic','securityLevel']}
          };
          const current=(Array.isArray(entry?.rules)?entry.rules:[]).filter(r=>String(r?.ref||'')===ref);
          if(current.length>1)throw new Error('duplicate public status WAF rules');
          let ruleId=null,created=false;
          if(current.length===0){
            const made=await call('/zones/'+zone+'/rulesets/'+rulesetId+'/rules',{method:'POST',body:desired});
            ruleId=String(made?.id||'');created=true;
          }else{
            ruleId=String(current[0].id||'');
            await call('/zones/'+zone+'/rulesets/'+rulesetId+'/rules/'+ruleId,{method:'PATCH',body:desired});
          }
          const verify=await call('/zones/'+zone+'/rulesets/phases/http_request_firewall_custom/entrypoint');
          const rows=(Array.isArray(verify?.rules)?verify.rules:[]).filter(r=>String(r?.ref||'')===ref);
          if(rows.length!==1)throw new Error('public status WAF rule missing after apply');
          const row=rows[0],products=Array.isArray(row?.action_parameters?.products)?row.action_parameters.products:[];
          if(row?.enabled!==true||row?.action!=='skip'||String(row?.expression||'')!==expression||products.length!==2||!products.includes('bic')||!products.includes('securityLevel'))throw new Error('public status WAF readback mismatch');
          console.log(JSON.stringify({
            gate:'MUSITU_AXIOM_PUBLIC_STATUS_WAF',
            status:'PASS',created,rule_id_present:Boolean(ruleId),
            exact_host:true,methods:['GET','HEAD'],
            paths:['/status/','/status/index.html','/status/app.js','/api/v1/status','/styles.css'],
            skipped_products:['bic','securityLevel'],
            api_paths_outside_status_skipped:false
          }));
          NODE

      - name: Prove public status is reachable while protected surfaces stay blocked
        shell: bash
        run: |
          set -euo pipefail
          for path in /status/ /status/app.js /api/v1/status /styles.css; do
            code=$(curl --silent --show-error --connect-timeout 10 --max-time 30 -D /tmp/h -o /tmp/b -w '%{http_code}' "https://support.mftintelligence.com$path" || true)
            if [ "$code" != "200" ]; then
              echo "public status asset not reachable: $path -> $code" >&2
              exit 1
            fi
            printf '{"path":"%s","http_status":"%s","public_status_access":"PASS"}\n' "$path" "$code"
          done
          root=$(curl --silent --show-error --connect-timeout 10 --max-time 30 -D /tmp/h -o /tmp/b -w '%{http_code}' https://support.mftintelligence.com/ || true)
          case "$root" in
            403) grep -qi '^cf-mitigated:[[:space:]]*challenge' /tmp/h ;;
            200) : ;;
            *) echo "unexpected support root status $root" >&2; exit 1 ;;
          esac
          recovery=$(curl --silent --show-error --connect-timeout 10 --max-time 30 -o /tmp/b -w '%{http_code}' https://support.mftintelligence.com/recovery/ || true)
          case "$recovery" in 302|303|307|401|403) ;; *) echo "recovery protection drift: $recovery" >&2; exit 1;; esac
          ops=$(curl --silent --show-error --connect-timeout 10 --max-time 30 -o /tmp/b -w '%{http_code}' https://support-ops.mftintelligence.com/ || true)
          case "$ops" in 302|303|307|401|403) ;; *) echo "operator protection drift: $ops" >&2; exit 1;; esac
          rm -f /tmp/h /tmp/b
