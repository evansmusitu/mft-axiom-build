name: AXIOM bounded staging identity D1 Worker custody topology (READ ONLY)
on:
  push:
    branches: [review/axiom-stage-idp-custody-topology-20261110]
    paths: [.github/workflows/axiom-idp-custody-topology-audit-20261110.yml]
permissions: {contents: read}
concurrency:
  group: axiom-idp-custody-topology-20261110
  cancel-in-progress: false
jobs:
  inspect:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.actor == 'evansmusitu' &&
      github.ref == 'refs/heads/review/axiom-stage-idp-custody-topology-20261110' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Verify exact source and exercise zero-write topology safety tests before token
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object customer_frontier/qualification/identity_staging_topology_readonly.py)" = 'dd2bbacbca721b6cca585f37886c4a4ae4fa12bd'
          test "$(git hash-object customer_frontier/tests/test_identity_staging_topology_readonly.py)" = 'cd03ed75b7c50ecdbf0d8361de71265bd5310872'
          python3 -m py_compile customer_frontier/qualification/identity_staging_topology_readonly.py
          python3 -m unittest discover -s customer_frontier/tests -p test_identity_staging_topology_readonly.py -v
      - name: Read only Cloudflare Worker inventory, exact settings and staging D1 metadata
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 customer_frontier/qualification/identity_staging_topology_readonly.py
      - name: Preserve bounded sanitized no-authority receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-stage-idp-custody-topology-20261110
          retention-days: 14
          if-no-files-found: warn
          path: |
            axiom-stage-idp-custody-topology-readonly.json
            axiom-stage-idp-custody-topology-readonly.json.sha256
