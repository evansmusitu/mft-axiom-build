name: AXIOM independent verification acceptance (NO DEPLOY)
on:
  push:
    branches: [repair/axiom-independent-verification-20261118]
    paths:
      - mcp/**
      - ops/bundle_axiom_plugin_gate.py
      - ops/verify_enterprise_numerics.py
      - ops/verify_axiom_live_public.py
      - ops/deploy_axiom_verification_gateway.py
      - .github/workflows/axiom-independent-verification-acceptance.yml
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: c6bd56c03f8f2d86315abcbe6a8a2e8c148e9e08
          path: .verification-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund miniflare@4.20260730.0
      - name: Reproducible bundle and existing contracts
        run: |
          python3 ops/build_axiom_operation_contracts.py
          python3 ops/bundle_axiom_plugin_gate.py
          git diff --exit-code -- mcp/operation_contracts.json mcp/musitu_axiom_plugin_gate_v4.mjs mcp/tests/fixtures/operation-examples.json
          node --check mcp/musitu_axiom_plugin_gate_v4.mjs
      - name: Numerical, adversarial, OAuth and real workerd/D1 acceptance
        env:
          AXIOM_BASE_GATEWAY_FILE: .verification-baseline/mcp/musitu_axiom_plugin_gate_v4.mjs
        run: |
          mkdir -p verification-evidence
          set -o pipefail
          node --test mcp/tests/plugin_gate.test.mjs mcp/tests/independent_verification.test.mjs mcp/tests/verification_workerd.test.mjs | tee verification-evidence/tests.txt
          python3 ops/verify_enterprise_numerics.py
          sha256sum mcp/independent_verification.mjs mcp/musitu_axiom_plugin_gate_v4.mjs > verification-evidence/source.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axiom-independent-verification-acceptance
          path: verification-evidence/
          retention-days: 30
          if-no-files-found: error
