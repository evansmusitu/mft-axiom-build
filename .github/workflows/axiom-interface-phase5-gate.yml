name: MUSITU Axiom Interface Phase 5 Gate

on:
  push:
    branches:
      - frontier/axiom-v5-interface-phase5-universal-artifact-engine-20260912
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-axiom-interface-phase5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-versioning-and-protected-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup patch-pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Preserve exact authority anchors, protected objects and Phase 4 ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/frontier/axiom-v5-skill-fabric:refs/remotes/origin/frontier/axiom-v5-skill-fabric \
            +refs/heads/archive/axiom-track-a-post-freeze-20260912:refs/remotes/origin/archive/axiom-track-a-post-freeze-20260912 \
            +refs/heads/frontier/axiom-v5-world-top-tier-review-safe:refs/remotes/origin/frontier/axiom-v5-world-top-tier-review-safe
          test "$(git rev-parse refs/remotes/origin/main)" = "d6a846f6bbe0bccac1758713eb4de167caf07113"
          test "$(git rev-parse refs/remotes/origin/frontier/axiom-v5-skill-fabric)" = "d9196774a9fff3150922e2cb681d16e2423651da"
          test "$(git rev-parse refs/remotes/origin/archive/axiom-track-a-post-freeze-20260912)" = "20a84b1090b8ad986e35fee20008f3ed8920440c"
          test "$(git rev-parse refs/remotes/origin/frontier/axiom-v5-world-top-tier-review-safe)" = "73ecdbad38cb10020b6e30ebe42a9222a3bb6c55"
          git merge-base --is-ancestor 4ee9dec2f68dcc17f09457623f4a3c39aba98e88 HEAD
          PYTHONPATH=. python - <<'PY'
          import json,pathlib,subprocess
          from frontier_review_safe.review_snapshot import ReviewSnapshotGuard, ReviewSnapshotManifest
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          raw=json.loads(pathlib.Path('frontier_review_safe/review_snapshot_manifest.json').read_text(encoding='utf-8'))
          m=ReviewSnapshotManifest(schema=raw['schema'],authoritative_frontier_sha=raw['authoritative_frontier_sha'],sealed_main_sha=raw['sealed_main_sha'],public_tool_count=raw['public_tool_count'],required_scopes=tuple(raw['required_scopes']),forbidden_tools=tuple(raw['forbidden_tools']),protected_paths=tuple(raw['protected_paths']),protected_git_object_shas=dict(raw['protected_git_object_shas']),mcp_url=raw['mcp_url'],auth_url=raw['auth_url'],demo_url=raw['demo_url'])
          g=ReviewSnapshotGuard(m)
          authoritative={p:git('rev-parse',f'{m.authoritative_frontier_sha}:{p}') for p in m.protected_git_object_shas}
          current={p:git('rev-parse',f'HEAD:{p}') for p in m.protected_git_object_shas}
          g.verify_tree(authoritative);g.verify_tree(current)
          changed=[x for x in git('diff','--name-only',f'{m.authoritative_frontier_sha}..HEAD').splitlines() if x]
          g.verify_no_protected_diff(changed,m.protected_paths)
          print(json.dumps({'status':'PASS','phase4_ancestor':'4ee9dec2f68dcc17f09457623f4a3c39aba98e88','protected_objects_verified':len(current)},sort_keys=True))
          PY
      - name: Compile and run Phase 1 through Phase 5 contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q frontier_review_safe frontier_v5/runtime/claim_graph.py frontier_v5/runtime/claim_graph_quality.py frontier_v5/runtime/artifact_engine.py axiom_interface/tests
          PYTHONPATH=. python -m unittest discover -s axiom_interface/tests -p 'test_*.py' -v
          PYTHONPATH=. python frontier_v5/tests/test_durable_tasks.py
          PYTHONPATH=. python frontier_v5/tests/test_persistent_planner.py
          PYTHONPATH=. python frontier_v5/tests/test_outcome_contract_runtime.py
          PYTHONPATH=. python -m unittest frontier_v5.tests.test_freshness_contract frontier_v5.tests.test_claim_graph_integrity -v
          PYTHONPATH=. python frontier_v5/tests/test_claim_graph_quality.py | tee /tmp/phase4-quality-runtime.log
          grep -q 'MUSITU_AXIOM_INTERFACE_PHASE4_SOURCE_QUALITY_PASS' /tmp/phase4-quality-runtime.log
          PYTHONPATH=. python frontier_v5/tests/test_artifact_engine.py | tee /tmp/phase5-artifact-runtime.log
          grep -q 'MUSITU_AXIOM_INTERFACE_PHASE5_ARTIFACT_RUNTIME_PASS' /tmp/phase5-artifact-runtime.log
      - name: Run complete private review-safe regression suite
        run: PYTHONPATH=. python -m unittest discover -s frontier_review_safe/tests -v
      - name: Measure and gate protected scale workloads
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m frontier_review_safe.scale_benchmarks | tee /tmp/axiom-scale-evidence.json
          python - <<'PY'
          import json,os
          e=json.load(open('/tmp/axiom-scale-evidence.json',encoding='utf-8'))
          assert e['candidate_sha']==os.environ['GITHUB_SHA']
          assert len(e['benchmarks'])==7
          assert all(x['throughput_per_sec']>0 and x['peak_python_bytes']>=0 for x in e['benchmarks'])
          print('MUSITU_AXIOM_PHASE5_PROTECTED_SCALE_EVIDENCE_OK')
          PY
          workload_blob="$(git hash-object frontier_review_safe/scale_benchmarks.py)"
          PYTHONPATH=. python -m frontier_review_safe.scale_budget /tmp/axiom-scale-evidence.json "$workload_blob"
      - name: Measure degraded paths without promotion authority
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m frontier_review_safe.scale_experiments | tee /tmp/axiom-scale-experiments.json
          python - <<'PY'
          import json,os
          from frontier_review_safe.scale_experiments import validate_experimental_evidence
          e=json.load(open('/tmp/axiom-scale-experiments.json',encoding='utf-8'))
          assert e['candidate_sha']==os.environ['GITHUB_SHA']
          r=validate_experimental_evidence(e)
          assert r['status']=='PASS'
          assert r['promotion_status']=='MEASUREMENT_ONLY_UNBUDGETED'
          assert r['budget_authorized'] is False
          assert r['claim_authorized'] is False
          print('MUSITU_AXIOM_PHASE5_DEGRADED_PATHS_MEASURED_NOT_PROMOTED')
          PY

  browser-versioning-diff-rollback-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup patch-pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Install existing locked full-stack dependency set
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng xvfb xdotool python3-tk scrot unzip ca-certificates
          python -m pip install 'pip==26.2.1'
          python -m pip install -r frontier_v5/requirements/fullstack.lock.txt
          python -m pip check
          python -m playwright install --with-deps chromium
          PYTHONPATH=. python frontier_v5/scripts/verify_supply_chain.py --output /tmp/musitu-interface-supply-chain.json | tee /tmp/interface-supply-chain.log
          grep -q 'MUSITU_AXIOM_FRONTIER_SUPPLY_CHAIN_LOCK_PASS' /tmp/interface-supply-chain.log
      - name: Run deterministic full-stack and network regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_fullstack_local.py | tee /tmp/interface-fullstack-local.log
          grep -q 'MUSITU_AXIOM_FRONTIER_FULLSTACK_LOCAL_PASS' /tmp/interface-fullstack-local.log
          PYTHONPATH=. python frontier_v5/tests/test_browser_network_preflight.py | tee /tmp/interface-browser-preflight.log
          grep -q 'MUSITU_AXIOM_FRONTIER_BROWSER_NETWORK_PREFLIGHT_PASS' /tmp/interface-browser-preflight.log
      - name: Re-run qualified Phase 1 browser gate
        env:
          AXIOM_BROWSER_ARTIFACT_DIR: /tmp/axiom-interface-phase1
        run: python axiom_interface/tests/run_browser_phase1.py | tee /tmp/interface-phase1-browser.log
      - name: Re-run qualified Phase 2 browser gate
        env:
          AXIOM_PHASE2_ARTIFACT_DIR: /tmp/axiom-interface-phase2
        shell: bash
        run: |
          set -euo pipefail
          python axiom_interface/tests/run_browser_phase2.py | tee /tmp/interface-phase2-browser.log
          grep -q 'MUSITU_AXIOM_INTERFACE_PHASE2_PROJECT_GRAPH_PASS' /tmp/interface-phase2-browser.log
      - name: Re-run qualified Phase 3 browser gate
        env:
          AXIOM_PHASE3_ARTIFACT_DIR: /tmp/axiom-interface-phase3
        shell: bash
        run: |
          set -euo pipefail
          python axiom_interface/tests/run_browser_phase3.py | tee /tmp/interface-phase3-browser.log
          grep -q 'MUSITU_AXIOM_INTERFACE_PHASE3_WORK_PASS' /tmp/interface-phase3-browser.log
      - name: Re-run qualified Phase 4 citation gate
        env:
          AXIOM_PHASE4_ARTIFACT_DIR: /tmp/axiom-interface-phase4
        shell: bash
        run: |
          set -euo pipefail
          python axiom_interface/tests/run_browser_phase4.py | tee /tmp/interface-phase4-browser.log
          grep -q 'MUSITU_AXIOM_INTERFACE_PHASE4_RESEARCH_PASS' /tmp/interface-phase4-browser.log
      - name: Re-run qualified Phase 4 blueprint-completeness gate
        env:
          AXIOM_PHASE4_QUALITY_ARTIFACT_DIR: /tmp/axiom-interface-phase4-quality
        shell: bash
        run: |
          set -euo pipefail
          python axiom_interface/tests/run_browser_phase4_quality.py | tee /tmp/interface-phase4-quality-browser.log
          grep -q 'MUSITU_AXIOM_INTERFACE_PHASE4_BLUEPRINT_COMPLETENESS_PASS' /tmp/interface-phase4-quality-browser.log
      - name: Run Phase 5 versioning, diff, rollback and provenance gate
        env:
          AXIOM_PHASE5_ARTIFACT_DIR: /tmp/axiom-interface-phase5
        shell: bash
        run: |
          set -euo pipefail
          python axiom_interface/tests/run_browser_phase5.py | tee /tmp/interface-phase5-browser.log
          grep -q 'MUSITU_AXIOM_INTERFACE_PHASE5_ARTIFACT_BROWSER_PASS' /tmp/interface-phase5-browser.log
          test -s /tmp/axiom-interface-phase5/phase5-artifact-evidence.json
          test -s /tmp/axiom-interface-phase5/phase5-artifact-engine.png
          python - <<'PY'
          import json
          e=json.load(open('/tmp/axiom-interface-phase5/phase5-artifact-evidence.json',encoding='utf-8'))
          assert e['status']=='PASS'
          assert set(e['artifact_types'])=={'document','sheet','presentation','website','dashboard'}
          assert e['stable_identity_verified'] is True
          assert e['project_object_linkage_verified'] is True
          assert e['immutable_history_preserved_across_rollback'] is True
          assert e['diff_verified'] is True
          assert e['rollback_mode']=='NON_DESTRUCTIVE_NEW_VERSION_FROM_PRIOR_SNAPSHOT'
          assert e['provenance_chain_verified'] is True
          assert e['current_state_tamper_detected'] is True
          assert e['cross_reload_persistence_verified'] is True
          assert e['website_preview_execution']=='STATIC_DISPLAY_ONLY'
          assert e['cloud_collaboration_claimed'] is False
          assert e['external_publication_claimed'] is False
          assert e['deployment_claimed'] is False
          assert e['foreign_requests']==[]
          print('MUSITU_AXIOM_PHASE5_ARTIFACT_EVIDENCE_BOUNDARY_PASS')
          PY
      - name: Upload Phase 5 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-axiom-interface-phase5-artifact-evidence
          path: |
            /tmp/axiom-interface-phase5/phase5-artifact-evidence.json
            /tmp/axiom-interface-phase5/phase5-artifact-engine.png
            /tmp/axiom-interface-phase4/phase4-research-evidence.json
            /tmp/axiom-interface-phase4/research-claim-graph.png
            /tmp/axiom-interface-phase4-quality/phase4-blueprint-completeness-evidence.json
            /tmp/axiom-interface-phase4-quality/research-quality-contradiction-search.png
            /tmp/axiom-interface-phase3/phase3-work-evidence.json
            /tmp/axiom-interface-phase2/project-evidence.json
            /tmp/axiom-interface-phase1/browser-evidence.json
            /tmp/musitu-interface-supply-chain.json
          if-no-files-found: error
