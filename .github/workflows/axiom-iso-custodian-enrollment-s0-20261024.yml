name: AXIOM ISO Owner Custodian S0 - Evidence Only Not Release
on:
  push:
    branches:
      - build/axiom-iso-custodian-enrollment-s0-20261024
    paths:
      - 'ops/iso_trust_boundary/**'
      - '.github/workflows/axiom-iso-custodian-enrollment-s0-20261024.yml'
permissions:
  contents: read
jobs:
  local-possession-no-execution:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'build/axiom-iso-custodian-enrollment-s0-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Source authority and forbidden privileged paths
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 445d7e7004012d2be8a59161da914cd85558ccbe HEAD
          git diff --name-only 445d7e7004012d2be8a59161da914cd85558ccbe HEAD | tee /tmp/iso-custodian-changes
          if grep -Ev '^(ops/iso_trust_boundary/(custodian_enrollment_s0\.py|test/test_custodian_enrollment_s0\.py|CUSTODIAN_OWNER_ENROLLMENT_S0_20261024\.md)|\.github/workflows/axiom-iso-custodian-enrollment-s0-20261024\.yml)$' /tmp/iso-custodian-changes; then
            echo 'FORBIDDEN_SOURCE_CHANGE' >&2
            exit 1
          fi
          test -z "${OPENHANDS_API_KEY:-}"
          test -z "${AXIOM_PRODUCTION_AUTHORIZATION:-}"
          test -z "${AXIOM_SIGNING_PRIVATE_KEY:-}"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          echo AXIOM_ISO_LOCAL_CUSTODY_ONLY_NO_REAL_SECRETS
      - name: Install pinned synthetic test crypto
        run: python -m pip install -q --disable-pip-version-check 'cryptography==46.0.4'
      - name: Local-only custodian TDD and all ISO regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest ops.iso_trust_boundary.test.test_custodian_enrollment_s0 -v 2>&1 | tee /tmp/iso-custodian-focused.log
          grep -Eq 'Ran 20 tests in ' /tmp/iso-custodian-focused.log
          grep -Eq '^OK$' /tmp/iso-custodian-focused.log
          python -m unittest discover -s ops/iso_trust_boundary/test -p 'test_*.py' -v 2>&1 | tee /tmp/iso-custodian-full.log
          grep -Eq 'Ran 168 tests in ' /tmp/iso-custodian-full.log
          grep -Eq '^OK$' /tmp/iso-custodian-full.log
          python -m compileall -q ops/iso_trust_boundary
          echo AXIOM_ISO_LOCAL_CUSTODIAN_20_AND_TOTAL_168_NO_EXTERNAL_AUTHORITY
      - name: Preserve destructive B27 counterexample
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/trackb27/VERIFY_B27_LOCAL.py 2>&1 | tee /tmp/b27-custodian-negative.log
          grep -Eq 'Ran 15 tests in ' /tmp/b27-custodian-negative.log
          grep -Fq 'AXIOM_B27_GLOBAL_ROLLBACK_COUNTEREXAMPLE_REPRODUCED_NOT_FIXED' /tmp/b27-custodian-negative.log
          grep -Fq 'B27_EXTERNAL_INDEPENDENCE_NOT_PROVEN_ROLLBACK_ATTACK_REPRODUCED' /tmp/b27-custodian-negative.log
          echo AXIOM_B27_ROLLBACK_FAILURE_PRESERVED_NOT_FIXED
