name: AXIOM ISO Dual Custody Public Proof S0 - No Release
on:
  push:
    branches:
      - build/axiom-iso-dual-custody-proof-s0-20261024
    paths:
      - 'ops/iso_trust_boundary/custody_dual_proof.py'
      - 'ops/iso_trust_boundary/test/test_custody_dual_proof.py'
      - 'ops/iso_trust_boundary/CUSTODY_DUAL_PROOF_S0_20261024.md'
      - '.github/workflows/axiom-iso-dual-custody-s0-20261024.yml'
permissions:
  contents: read
jobs:
  s0-local-dual-public-proof:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'build/axiom-iso-dual-custody-proof-s0-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Exact parent and isolated-only scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 624934aba8abb5bac1765abd36ad38621ca316d9 HEAD
          git diff --name-only 624934aba8abb5bac1765abd36ad38621ca316d9 HEAD | tee /tmp/axiom-dual-scope.txt
          if grep -Ev '^(ops/iso_trust_boundary/(custody_dual_proof\.py|test/test_custody_dual_proof\.py|CUSTODY_DUAL_PROOF_S0_20261024\.md)|\.github/workflows/axiom-iso-dual-custody-s0-20261024\.yml)$' /tmp/axiom-dual-scope.txt; then
            echo UNAUTHORIZED_SOURCE_SCOPE >&2
            exit 1
          fi
          test -z "${AXIOM_SIGNING_PRIVATE_KEY:-}"
          test -z "${OPENHANDS_API_KEY:-}"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${AXIOM_PRODUCTION_AUTHORIZATION:-}"
          echo AXIOM_S0_DUAL_PUBLIC_ONLY_NO_PRIVILEGED_CREDENTIALS
      - name: Deterministic crypto testing only
        run: python -m pip install -q --disable-pip-version-check 'cryptography==46.0.4'
      - name: Two key proofs, all ISO regressions and compile
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest ops.iso_trust_boundary.test.test_custody_dual_proof -v 2>&1 | tee /tmp/axiom-dual-focused.log
          grep -Eq 'Ran 22 tests in ' /tmp/axiom-dual-focused.log
          grep -Eq '^OK$' /tmp/axiom-dual-focused.log
          python -m unittest discover -s ops/iso_trust_boundary/test -p 'test_*.py' -v 2>&1 | tee /tmp/axiom-dual-all.log
          grep -Eq 'Ran 193 tests in ' /tmp/axiom-dual-all.log
          grep -Eq '^OK$' /tmp/axiom-dual-all.log
          python -m compileall -q ops/iso_trust_boundary
          echo AXIOM_S0_DUAL_CUSTODY_193_TESTS_NOT_EXTERNAL
      - name: Reproduce B27 global rollback failure, never reclassify
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/trackb27/VERIFY_B27_LOCAL.py 2>&1 | tee /tmp/axiom-dual-b27.log
          grep -Eq 'Ran 15 tests in ' /tmp/axiom-dual-b27.log
          grep -Fq 'AXIOM_B27_GLOBAL_ROLLBACK_COUNTEREXAMPLE_REPRODUCED_NOT_FIXED' /tmp/axiom-dual-b27.log
          echo AXIOM_B27_GLOBAL_ANTIROLLBACK_FAILED_IN_SYNTHETIC_ATTACK
