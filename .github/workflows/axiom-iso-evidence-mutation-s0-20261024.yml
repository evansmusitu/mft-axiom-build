name: AXIOM ISO S0 Evidence Mutation Regression - NOT RELEASE

on:
  push:
    branches:
      - build/axiom-iso-evidence-mutation-s0-20261024
    paths:
      - 'ops/iso_trust_boundary/**'
      - '.github/workflows/axiom-iso-evidence-mutation-s0-20261024.yml'

permissions:
  contents: read

jobs:
  s0-adversarial-evidence:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'build/axiom-iso-evidence-mutation-s0-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Guard exact parent, isolated delta and no production credentials
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ea9f41d7931f380a1a729deb0b17c6a314063a8e HEAD
          test -z "${AXIOM_PRODUCTION_AUTHORIZATION:-}"
          test -z "${OPENHANDS_API_KEY:-}"
          test -z "${AXIOM_SIGNING_PRIVATE_KEY:-}"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          git diff --name-only ea9f41d7931f380a1a729deb0b17c6a314063a8e HEAD | tee /tmp/axiom-delta-paths.txt
          if grep -Ev '^(ops/iso_trust_boundary/(preconsumption_evidence\.py|EVIDENCE_INPUT_IMMUTABILITY_S0_20261024\.md|test/test_preconsumption_mutation\.py)|\.github/workflows/axiom-iso-evidence-mutation-s0-20261024\.yml)$' /tmp/axiom-delta-paths.txt; then
            echo 'FORBIDDEN_SOURCE_CHANGE' >&2
            exit 1
          fi
          echo AXIOM_S0_MUTATION_SOURCE_SCOPE_ONLY
      - name: Synthetic key dependency only
        run: python -m pip install -q --disable-pip-version-check 'cryptography==46.0.4'
      - name: Exercise mutation regressions, complete ISO suite and compile
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest ops.iso_trust_boundary.test.test_preconsumption_mutation -v 2>&1 | tee /tmp/axiom-mutation.log
          grep -Eq 'Ran 7 tests in ' /tmp/axiom-mutation.log
          grep -Eq '^OK$' /tmp/axiom-mutation.log
          python -m unittest discover -s ops/iso_trust_boundary/test -p 'test_*.py' -v 2>&1 | tee /tmp/axiom-iso-suite.log
          grep -Eq 'Ran 139 tests in ' /tmp/axiom-iso-suite.log
          grep -Eq '^OK$' /tmp/axiom-iso-suite.log
          python -m compileall -q ops/iso_trust_boundary
          echo AXIOM_S0_INPUT_MUTATION_REJECTED_LOCAL_139_TESTS_NOT_RELEASE
      - name: Preserve B27 destructive global rollback failure
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/trackb27/VERIFY_B27_LOCAL.py 2>&1 | tee /tmp/b27-negative.log
          grep -Fq 'AXIOM_B27_GLOBAL_ROLLBACK_COUNTEREXAMPLE_REPRODUCED_NOT_FIXED' /tmp/b27-negative.log
          grep -Fq 'B27_EXTERNAL_INDEPENDENCE_NOT_PROVEN_ROLLBACK_ATTACK_REPRODUCED' /tmp/b27-negative.log
          grep -Fq 'The replay succeeds.' ops/trackb27/EVIDENCE_GLOBAL_ROLLBACK_COUNTEREXAMPLE.md
          echo AXIOM_B27_STILL_FAILED_IN_SYNTHETIC_ATTACK
