name: AXIOM ISO Local Durable Witness S0 - Not Independent
on:
  push:
    branches:
      - build/axiom-iso-local-durable-witness-s0-20261023
    paths:
      - 'ops/iso_trust_boundary/**'
      - '.github/workflows/axiom-iso-local-durable-witness-s0-20261023.yml'
permissions:
  contents: read
jobs:
  lab-durability:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'build/axiom-iso-local-durable-witness-s0-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Enforce source authority and forbid provider exposure
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ea624fa20f5c2348a02c8e4064f57a984b433c39 HEAD
          test -z "${AXIOM_PRODUCTION_AUTHORIZATION:-}"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${OPENHANDS_API_KEY:-}"
          test -z "${AXIOM_SIGNING_PRIVATE_KEY:-}"
          echo AXIOM_ISO_S0_LAB_NO_PROVIDER_AND_NO_PRODUCTION
      - name: Install test-only Ed25519 dependency
        run: python -m pip install -q --disable-pip-version-check 'cryptography==46.0.4'
      - name: Test real local SQLite concurrency and preserved rollback attack
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s ops/iso_trust_boundary/test -p 'test_*.py' -v 2>&1 | tee /tmp/iso-witness-s0.log
          grep -Eq 'Ran 47 tests in ' /tmp/iso-witness-s0.log
          grep -Eq '^OK$' /tmp/iso-witness-s0.log
          python -m compileall -q ops/iso_trust_boundary
          echo AXIOM_ISO_LOCAL_SQLITE_WITNESS_47_TESTS_PASS_NOT_INDEPENDENT
      - name: Preserve historical negative gate
        run: |
          set -euo pipefail
          grep -Fq 'The replay succeeds.' ops/trackb27/EVIDENCE_GLOBAL_ROLLBACK_COUNTEREXAMPLE.md
          echo AXIOM_B27_FAILED_DESTRUCTIVE_ROLLBACK_PRESERVED
