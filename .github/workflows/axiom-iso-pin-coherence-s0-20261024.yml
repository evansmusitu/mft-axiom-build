name: AXIOM ISO S0 Pinned Config Integrity - Nonrelease
on:
  push:
    branches:
      - build/axiom-iso-pin-coherence-s0-20261024
    paths:
      - 'ops/iso_trust_boundary/**'
      - '.github/workflows/axiom-iso-pin-coherence-s0-20261024.yml'
permissions:
  contents: read
jobs:
  iso-s0-config-drift-contract:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'build/axiom-iso-pin-coherence-s0-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Protect previous source and deny privileged scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f566a1901a1e14ea3fcd8e17b058fbe337fb0935 HEAD
          git diff --name-only f566a1901a1e14ea3fcd8e17b058fbe337fb0935 HEAD | tee /tmp/iso-files.txt
          if grep -Ev '^(ops/iso_trust_boundary/(preconsumption_evidence\.py|test/test_pinned_config_integrity\.py|VERIFIER_PIN_DRIFT_S0_20261024\.md)|\.github/workflows/axiom-iso-pin-coherence-s0-20261024\.yml)$' /tmp/iso-files.txt; then
            echo 'FORBIDDEN_SOURCE_CHANGE' >&2
            exit 1
          fi
          test -z "${OPENHANDS_API_KEY:-}"
          test -z "${AXIOM_PRODUCTION_AUTHORIZATION:-}"
          test -z "${AXIOM_SIGNING_PRIVATE_KEY:-}"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          echo AXIOM_ISO_S0_SCOPE_ONLY
      - name: Use pinned synthetic crypto dependency
        run: python -m pip install -q --disable-pip-version-check 'cryptography==46.0.4'
      - name: PIN drift red-green regression, full ISO and syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest ops.iso_trust_boundary.test.test_pinned_config_integrity -v 2>&1 | tee /tmp/pin-drift.log
          grep -Eq 'Ran 8 tests in ' /tmp/pin-drift.log
          grep -Eq '^OK$' /tmp/pin-drift.log
          python -m unittest discover -s ops/iso_trust_boundary/test -p 'test_*.py' -v 2>&1 | tee /tmp/iso-suite.log
          grep -Eq 'Ran 148 tests in ' /tmp/iso-suite.log
          grep -Eq '^OK$' /tmp/iso-suite.log
          python -m compileall -q ops/iso_trust_boundary
          echo AXIOM_ISO_S0_148_TESTS_PASS_NO_INDEPENDENT_SECURITY
      - name: Preserve B27 global destructive rollback failure
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/trackb27/VERIFY_B27_LOCAL.py 2>&1 | tee /tmp/iso-b27.log
          grep -Eq 'Ran 15 tests in ' /tmp/iso-b27.log
          grep -Fq 'B27_EXTERNAL_INDEPENDENCE_NOT_PROVEN_ROLLBACK_ATTACK_REPRODUCED' /tmp/iso-b27.log
          grep -Fq 'AXIOM_B27_GLOBAL_ROLLBACK_COUNTEREXAMPLE_REPRODUCED_NOT_FIXED' /tmp/iso-b27.log
          echo AXIOM_B27_FAILED_IN_SYNTHETIC_ATTACK_NOT_RECLASSIFIED
