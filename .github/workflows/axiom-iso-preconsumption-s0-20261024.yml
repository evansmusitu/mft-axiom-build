name: AXIOM ISO Preconsumption S0 - Local Evidence Only - Not Release

on:
  push:
    branches:
      - build/axiom-iso-admission-reconciliation-s0-20261024
    paths:
      - 'ops/iso_trust_boundary/**'
      - '.github/workflows/axiom-iso-preconsumption-s0-20261024.yml'

permissions:
  contents: read

jobs:
  s0-preconsumption-local:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'build/axiom-iso-admission-reconciliation-s0-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Isolated lineage and forbidden credentials
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 41b49f834ea341964ffd2100e64be05b265537a3 HEAD
          test -z "${AXIOM_PRODUCTION_AUTHORIZATION:-}"
          test -z "${OPENHANDS_API_KEY:-}"
          test -z "${AXIOM_SIGNING_PRIVATE_KEY:-}"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          echo AXIOM_S0_PRECONSUMPTION_ONLY_NO_EXTERNAL_AUTHORITY
      - name: Pinned local synthetic crypto dependency
        run: python -m pip install -q --disable-pip-version-check 'cryptography==46.0.4'
      - name: ISO local verification and non-admission contract
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s ops/iso_trust_boundary/test -p 'test_*.py' -v 2>&1 | tee /tmp/axiom-iso-preconsumption-tests.log
          grep -Eq 'Ran 128 tests in ' /tmp/axiom-iso-preconsumption-tests.log
          grep -Eq '^OK$' /tmp/axiom-iso-preconsumption-tests.log
          python -m compileall -q ops/iso_trust_boundary
          echo AXIOM_S0_PRECONSUMPTION_128_LOCAL_TESTS_NOT_RELEASE
      - name: Reproduce historical B27 rollback counterexample
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/trackb27/VERIFY_B27_LOCAL.py 2>&1 | tee /tmp/b27-attack.log
          grep -Fq 'AXIOM_B27_GLOBAL_ROLLBACK_COUNTEREXAMPLE_REPRODUCED_NOT_FIXED' /tmp/b27-attack.log
          grep -Fq 'B27_EXTERNAL_INDEPENDENCE_NOT_PROVEN_ROLLBACK_ATTACK_REPRODUCED' /tmp/b27-attack.log
          grep -Fq 'The replay succeeds.' ops/trackb27/EVIDENCE_GLOBAL_ROLLBACK_COUNTEREXAMPLE.md
          echo AXIOM_B27_STILL_FAILED_IN_SYNTHETIC_ATTACK
