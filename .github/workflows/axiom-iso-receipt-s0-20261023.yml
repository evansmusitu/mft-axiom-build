name: AXIOM ISO Receipt S0 Contract — No Issuer Or Release
on:
  push:
    branches: [build/axiom-iso-receipt-verification-s0-20261023]
    paths:
      - 'ops/iso_trust_boundary/**'
      - '.github/workflows/axiom-iso-receipt-s0-20261023.yml'
permissions:
  contents: read
jobs:
  receipt-contract-test:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'build/axiom-iso-receipt-verification-s0-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Enforce isolated ancestry and no external authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a76465540c10d17ca2aa95f79b312aa6802764da HEAD
          test -z "${AXIOM_PRODUCTION_AUTHORIZATION:-}"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${AXIOM_SIGNING_PRIVATE_KEY:-}"
          test -z "${OPENHANDS_API_KEY:-}"
          echo AXIOM_ISO_S0_NO_SIGNER_NO_PROVIDER_NO_RELEASE
      - name: Install test-only Ed25519 verifier library
        run: python -m pip install -q --disable-pip-version-check 'cryptography==46.0.4'
      - name: Test signed receipts adversarially without any external action
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s ops/iso_trust_boundary/test -p 'test_*.py' -v
          python -m compileall -q ops/iso_trust_boundary
          echo AXIOM_ISO_RECEIPT_S0_LOCAL_TESTS_PASS_NOT_INDEPENDENT_CUSTODY
      - name: Preserve B27 negative evidence
        run: |
          set -euo pipefail
          grep -Fq 'The replay succeeds.' ops/trackb27/EVIDENCE_GLOBAL_ROLLBACK_COUNTEREXAMPLE.md
          echo AXIOM_B27_GLOBAL_ANTIROLLBACK_STILL_FAILED
