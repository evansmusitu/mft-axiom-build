name: AXIOM ISO S0 Signed Reservation Boundary - Not Release
on:
  push:
    branches:
      - build/axiom-iso-reservation-boundary-s0-20261023
    paths:
      - 'ops/iso_trust_boundary/**'
      - '.github/workflows/axiom-iso-reservation-s0-20261023.yml'
permissions:
  contents: read
jobs:
  reserved-proof-contract:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'build/axiom-iso-reservation-boundary-s0-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require isolated ancestry and no provider or production credentials
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d49be2c9c4a2f647bfdbdbeb25ab51124be96f81 HEAD
          test -z "${AXIOM_PRODUCTION_AUTHORIZATION:-}"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${AXIOM_SIGNING_PRIVATE_KEY:-}"
          test -z "${OPENHANDS_API_KEY:-}"
          echo AXIOM_ISO_SYNTHETIC_ONLY_NO_NETWORK_NO_PROVIDER
      - name: Install test-only signature verifier library
        run: python -m pip install -q --disable-pip-version-check 'cryptography==46.0.4'
      - name: Exercise non-authorizing proof/reservation contract
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s ops/iso_trust_boundary/test -p 'test_*.py' -v 2>&1 | tee /tmp/axiom-iso-reservation-s0.log
          grep -Eq 'Ran 37 tests in ' /tmp/axiom-iso-reservation-s0.log
          grep -Eq '^OK$' /tmp/axiom-iso-reservation-s0.log
          python -m compileall -q ops/iso_trust_boundary
          echo AXIOM_ISO_S0_RESERVATION_CONTRACT_ONLY_NOT_REAL_CUSTODY
      - name: Preserve B27 synthetic destructive rollback failure
        run: |
          set -euo pipefail
          grep -Fq 'The replay succeeds.' ops/trackb27/EVIDENCE_GLOBAL_ROLLBACK_COUNTEREXAMPLE.md
          echo AXIOM_B27_GLOBAL_ANTIROLLBACK_FAILED_PRESERVED
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Preserve whole-product ECC recovery and Project UI regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s ops/openhands_qualification/test -p 'test_*.py' -v 2>&1 | tee /tmp/axiom-ecc-s0.log
          grep -Eq 'Ran 37 tests in ' /tmp/axiom-ecc-s0.log
          grep -Eq '^OK$' /tmp/axiom-ecc-s0.log
          node --test axiom_interface/vnext/tests/fa13_engineering_command_center.test.mjs axiom_interface/vnext/tests/openhands_ecc_bridge.test.mjs 2>&1 | tee /tmp/axiom-ecc-js.log
          grep -Eq '^# tests 19$' /tmp/axiom-ecc-js.log
          grep -Eq '^# fail 0$' /tmp/axiom-ecc-js.log
          echo AXIOM_ECC_PROJECT_BREADTH_S0_56_REGRESSION_TESTS_PASS
      - name: Preserve actual B27 negative destructive rollback regression
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/trackb27/VERIFY_B27_LOCAL.py
          echo AXIOM_B27_SYNTHETIC_ROLLBACK_COUNTEREXAMPLE_PRESERVED_NOT_FIXED
