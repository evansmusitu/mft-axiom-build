name: AXIOM ISO Local Witness Integration S0 - Not Independent
on:
  push:
    branches:
      - build/axiom-iso-witness-e2e-s0-20261023
    paths:
      - 'ops/iso_trust_boundary/**'
      - '.github/workflows/axiom-iso-witness-e2e-s0-20261023.yml'
permissions:
  contents: read
jobs:
  integrated-contract:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'build/axiom-iso-witness-e2e-s0-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: No authority expansion and exact parent
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9accbfcbc8cf074304b5adc735f591406f8ebccd HEAD
          test -z "${AXIOM_PRODUCTION_AUTHORIZATION:-}"
          test -z "${OPENHANDS_API_KEY:-}"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${AXIOM_SIGNING_PRIVATE_KEY:-}"
          echo AXIOM_S0_LOCAL_E2E_NO_INDEPENDENT_CUSTODY
      - name: Install synthetic key test dependency
        run: python -m pip install -q --disable-pip-version-check 'cryptography==46.0.4'
      - name: Test real local SQLite witness and operation-bound signatures
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s ops/iso_trust_boundary/test -p 'test_*.py' -v 2>&1 | tee /tmp/iso-local-e2e.log
          grep -Eq 'Ran 53 tests in ' /tmp/iso-local-e2e.log
          grep -Eq '^OK$' /tmp/iso-local-e2e.log
          python -m compileall -q ops/iso_trust_boundary
          grep -Fq 'The replay succeeds.' ops/trackb27/EVIDENCE_GLOBAL_ROLLBACK_COUNTEREXAMPLE.md
          echo AXIOM_S0_E2E_53_PASS_GLOBAL_ANTIROLLBACK_STILL_FAILED
      - name: Preserve historical B27 negative test
        run: |
          set -euo pipefail
          python3 ops/trackb27/VERIFY_B27_LOCAL.py
          echo AXIOM_B27_NEGATIVE_ATTACK_NOT_RECLASSIFIED
