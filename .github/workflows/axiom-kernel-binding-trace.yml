name: MUSITU Axiom Kernel Binding Trace

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/axiom-kernel-binding-trace.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct encrypted source
        env:
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          P=deploy_payload/runtime_min
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > runtime.enc.b64
          base64 -d runtime.enc.b64 > runtime.tar.gz.enc
          test "$(sha256sum runtime.tar.gz.enc | awk '{print $1}')" = 'b82448d6b4b34b302748815af976b535d69922c197d4b7a9056fc2f91a9e12cf'
          python - <<'PY'
          import hashlib,hmac,os
          b=open('runtime.tar.gz.enc','rb').read()
          if not hmac.compare_digest(hmac.new(os.environ['CLOUDFLARE_GLOBAL_API_KEY'].encode(),b,hashlib.sha256).hexdigest(),'1a3193d4f3271d61d151e6ebd7cf4576d8ab86c2e79b84eff4ad0f635fe7ab47'):
              raise SystemExit('ciphertext HMAC mismatch')
          PY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in runtime.tar.gz.enc -out runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          test "$(sha256sum runtime.tar.gz | awk '{print $1}')" = 'b4d5a0266446523969a619f5e9bb5a04d9b815c78a2ab82ed046ef5e23d53663'
          mkdir runtime && tar -xzf runtime.tar.gz -C runtime
      - name: Trace binding structurally without source excerpts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('runtime')
          man=json.loads((root/'RUNTIME_SOURCE_MANIFEST.json').read_text())
          files=[]
          for f in man['files']:
              p=f['path']; q=root/p
              if p.startswith('worker/') and q.is_file() and q.suffix.lower() in {'.js','.mjs','.ts'}:
                  files.append((p,q.read_text(errors='replace')))
          aliases=[]; calls=[]; objects=[]; helper_methods=[]; direct=[]
          for path,t in files:
              for m in re.finditer(r'\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*env\.AXIOM_KERNEL\b',t):
                  aliases.append({'path':path,'alias':m.group(1)})
              for m in re.finditer(r'\b([A-Za-z_$][\w$]*)\s*:\s*env\.AXIOM_KERNEL\b',t):
                  objects.append({'path':path,'property':m.group(1)})
              for m in re.finditer(r'env\.AXIOM_KERNEL\s*\.\s*([A-Za-z_$][\w$]*)\s*\(',t):
                  direct.append({'path':path,'method':m.group(1)})
              # Detect simple helper calls with AXIOM_KERNEL as a top-level argument.
              for m in re.finditer(r'\b([A-Za-z_$][\w$]*)\s*\(([^\n;]{0,600}env\.AXIOM_KERNEL[^\n;]{0,600})\)',t):
                  callee=m.group(1); argtxt=m.group(2)
                  # lightweight comma count before the binding; sufficient for the canonical one-line helper call
                  pos=argtxt.find('env.AXIOM_KERNEL')
                  arg_index=argtxt[:pos].count(',')
                  calls.append({'path':path,'callee':callee,'arg_index':arg_index})
                  patterns=[
                    re.compile(r'(?:async\s+)?function\s+'+re.escape(callee)+r'\s*\(([^)]*)\)\s*\{'),
                    re.compile(r'\b(?:const|let|var)\s+'+re.escape(callee)+r'\s*=\s*(?:async\s*)?\(([^)]*)\)\s*=>\s*\{')
                  ]
                  for pat in patterns:
                      dm=pat.search(t)
                      if not dm: continue
                      params=[x.strip() for x in dm.group(1).split(',')]
                      if arg_index>=len(params): continue
                      param=re.sub(r'[^A-Za-z0-9_$].*','',params[arg_index])
                      if not param: continue
                      # inspect only structural method names on that parameter in a bounded function body prefix
                      body=t[dm.end():dm.end()+5000]
                      methods=sorted(set(re.findall(r'\b'+re.escape(param)+r'\s*\.\s*([A-Za-z_$][\w$]*)\s*\(',body)))
                      props=sorted(set(re.findall(r'\b'+re.escape(param)+r'\s*\.\s*([A-Za-z_$][\w$]*)\b',body)))
                      helper_methods.append({'path':path,'helper':callee,'parameter':param,'methods':methods,'properties':props[:20]})
          for a in aliases:
              for path,t in files:
                  if path!=a['path']: continue
                  methods=sorted(set(re.findall(r'\b'+re.escape(a['alias'])+r'\s*\.\s*([A-Za-z_$][\w$]*)\s*\(',t)))
                  a['methods']=methods
          out={'schema':'musitu.axiom.kernel_binding_trace.v1','source_build':man['source_build'],'aliases':aliases,'helper_calls':calls,'object_injections':objects,'helper_parameter_usage':helper_methods,'direct_methods':direct,'plaintext_source_committed':False}
          open('axiom-kernel-binding-trace.json','w').write(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,sort_keys=True))
          PY
          sha256sum axiom-kernel-binding-trace.json > axiom-kernel-binding-trace.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-kernel-binding-trace
          path: |
            axiom-kernel-binding-trace.json
            axiom-kernel-binding-trace.sha256
          retention-days: 7
