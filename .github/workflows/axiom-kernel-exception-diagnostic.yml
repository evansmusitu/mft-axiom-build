name: MUSITU Axiom Kernel Exception Diagnostic — QUARANTINED BY AR-02

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed at the AR-02 diagnostic boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'AR-02 QUARANTINE: the historical kernel-exception diagnostic is disabled.'
          echo 'It previously reconstructed protected source, resolved production D1, created secrets, and deployed diagnostic workers.'
          echo 'No provider credentials are loaded, no D1 is accessed, no worker is deployed, and no public diagnostic endpoint is created.'
          echo 'A replacement must use synthetic isolated resources and brokered non-production credentials.'
          exit 1
