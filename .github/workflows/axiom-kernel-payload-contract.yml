name: MUSITU Axiom Kernel Payload Contract

on:
  push:
    paths:
      - '.github/workflows/axiom-kernel-payload-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct protected source
        env:
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          P=deploy_payload/runtime_min
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > runtime.enc.b64
          base64 -d runtime.enc.b64 > runtime.tar.gz.enc
          test "$(sha256sum runtime.tar.gz.enc | awk '{print $1}')" = 'b82448d6b4b34b302748815af976b535d69922c197d4b7a9056fc2f91a9e12cf'
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in runtime.tar.gz.enc -out runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          test "$(sha256sum runtime.tar.gz | awk '{print $1}')" = 'b4d5a0266446523969a619f5e9bb5a04d9b815c78a2ab82ed046ef5e23d53663'
          mkdir runtime && tar -xzf runtime.tar.gz -C runtime
      - name: Emit non-source payload and response metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re
          s=pathlib.Path('runtime/worker/src/index.js').read_text(errors='replace')
          pos=s.find('http://container/v1/compute')
          if pos<0: raise SystemExit('container compute URL missing')
          ctx=s[max(0,pos-5000):min(len(s),pos+5000)]
          # Structural metadata only: string keys, method names, and response accessors.
          body_keys=[]
          for m in re.finditer(r'JSON\.stringify\s*\(\s*\{',ctx):
              start=m.end()-1; depth=0; quote=None; esc=False; end=None
              for i in range(start,len(ctx)):
                  c=ctx[i]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      continue
                  if c in "'\"`": quote=c; continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0: end=i; break
              if end is not None:
                  obj=ctx[start+1:end]
                  keys=re.findall(r'(?:^|[,\n]\s*)([A-Za-z_$][\w$]*)\s*:',obj)
                  if keys: body_keys.append(sorted(set(keys)))
          header_names=sorted(set(re.findall(r"['\"]([A-Za-z0-9-]{3,40})['\"]\s*:\s*",ctx)))
          response_methods=sorted(set(re.findall(r'\b(?:kernelResp|kernelResponse|response|resp|r)\.([A-Za-z_$][\w$]*)\b',ctx)))
          status_literals=sorted(set(int(x) for x in re.findall(r'\.status\s*(?:===|!==|==|!=|>=|<=|>|<)\s*(\d{3})',ctx)))
          out={
            'schema':'musitu.axiom.kernel_payload_contract.v1',
            'request_url':'http://container/v1/compute',
            'json_object_key_sets':body_keys,
            'header_name_literals':header_names,
            'response_member_names':response_methods,
            'response_status_literals':status_literals,
            'checks_response_ok':'.ok' in ctx,
            'calls_response_json':'.json(' in ctx,
            'calls_response_text':'.text(' in ctx,
            'kernel_unavailable_present':'kernel_unavailable' in ctx,
            'plaintext_source_committed':False,
          }
          pathlib.Path('kernel-payload-contract.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-kernel-payload-contract
          path: kernel-payload-contract.json
          retention-days: 7
