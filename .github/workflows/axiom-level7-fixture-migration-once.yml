name: MUSITU Axiom Level-7 Fixture Migration Once

on:
  push:
    branches:
      - frontier/axiom-v5-level7-semantic-binding-20260912

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor == 'evansmusitu'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Patch remaining integration fixtures and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('frontier_review_safe/tests/test_gap_closure.py')
          text = path.read_text(encoding='utf-8')

          import_anchor = '''from frontier_review_safe.external_validation import (\n    ClaimBoundary, ComparativeOutcome, ExternalEvidenceGate, IndependentValidationRecord, LongitudinalRefreshRecord,\n)\n'''
          import_replacement = import_anchor + 'from frontier_review_safe.tests.level7_semantic_fixtures import level7_artifact_fields\n'
          assert text.count(import_anchor) == 1
          text = text.replace(import_anchor, import_replacement, 1)

          helper_anchor = '''    return registry, runs\n\n\nclass GapClosureTests(unittest.TestCase):\n'''
          helper = '''    return registry, runs\n\n\ndef longitudinal_refresh(refresh_id, executed_at, candidate_sha, case_set_hash, baseline_registry_hash):\n    return LongitudinalRefreshRecord(\n        refresh_id=refresh_id,\n        executed_at=executed_at,\n        candidate_sha=candidate_sha,\n        case_set_hash=case_set_hash,\n        baseline_registry_hash=baseline_registry_hash,\n        passed=True,\n        executor_org="Independent Longitudinal Lab",\n        **level7_artifact_fields(\n            candidate_sha=candidate_sha,\n            case_set_hash=case_set_hash,\n            baseline_registry_hash=baseline_registry_hash,\n            generated_at=executed_at,\n        ),\n    )\n\n\nclass GapClosureTests(unittest.TestCase):\n'''
          assert text.count(helper_anchor) == 1
          text = text.replace(helper_anchor, helper, 1)

          old_one = '''        refreshes=[LongitudinalRefreshRecord(str(i),(NOW+timedelta(days=i*30)).isoformat(), EXTERNAL_CANDIDATE_SHA, H, (registry.fingerprint if i%2==0 else "5"*64), "1"*64,"2"*64,"3"*64,True, executor_org="Independent Longitudinal Lab") for i in range(3)]'''
          new_one = '''        refreshes=[longitudinal_refresh(str(i),(NOW+timedelta(days=i*30)).isoformat(), EXTERNAL_CANDIDATE_SHA, H, (registry.fingerprint if i%2==0 else "5"*64)) for i in range(3)]'''
          assert text.count(old_one) == 1
          text = text.replace(old_one, new_one, 1)

          old_two = '''        refreshes=[LongitudinalRefreshRecord(str(i),(NOW+timedelta(days=i*30)).isoformat(),EXTERNAL_CANDIDATE_SHA,case_set,\n                    (registry.fingerprint if i%2==0 else "5"*64),"1"*64,"2"*64,"3"*64,True, executor_org="Independent Longitudinal Lab") for i in range(3)]'''
          new_two = '''        refreshes=[longitudinal_refresh(str(i),(NOW+timedelta(days=i*30)).isoformat(),EXTERNAL_CANDIDATE_SHA,case_set,\n                    (registry.fingerprint if i%2==0 else "5"*64)) for i in range(3)]'''
          assert text.count(old_two) == 1
          text = text.replace(old_two, new_two, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/axiom-level7-fixture-migration-once.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontier_review_safe/tests/test_gap_closure.py .github/workflows/axiom-level7-fixture-migration-once.yml
          git diff --cached --check
          git commit -m 'Migrate remaining Level-7 integration fixtures [fixture-migration]'
          git push origin HEAD:frontier/axiom-v5-level7-semantic-binding-20260912
