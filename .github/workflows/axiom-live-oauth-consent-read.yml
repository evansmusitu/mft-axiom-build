name: Axiom live OAuth consent metadata
on:
  push:
    branches: [openai/axiom-review-access-20261027]
    paths: ['.github/workflows/axiom-live-oauth-consent-read.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect OAuth source contracts without changing workers or accounts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import email,hashlib,json,os,re,urllib.request
          root='https://api.cloudflare.com/client/v4/accounts/93f395f5121954671f92fffa453d6b61/workers/scripts'
          h={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=45) as r:return dict(r.headers),r.read()
          _,b=get(root)
          names=[x['id'] for x in json.loads(b)['result'] if x.get('id')=='musitu-axiom-oauth']
          out=[]
          for name in names:
              hh,raw=get(root+'/'+name)
              ct=hh.get('Content-Type') or hh.get('content-type') or ''
              if 'multipart/' in ct:
                  msg=email.message_from_bytes(('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw)
                  pieces=[p.get_payload(decode=True) or b'' for p in msg.walk() if not p.is_multipart()]
                  raw=b'\n'.join(p for p in pieces if b'authorize' in p)
              src=raw.decode('utf-8','replace')
              pos=src.find('async function authorizePost(')
              end=src.find('async function ',pos+20) if pos>=0 else -1
              part=src[pos:end if end>=0 else pos+10000] if pos>=0 else ''
              errors=re.findall(r'errorPage\("([^"]{1,180})"\)',part)
              item={'script':name,'source_sha256':hashlib.sha256(raw).hexdigest(),'authorizePost_present':bool(part),'function_calls':sorted(set(re.findall(r'\b([a-zA-Z_][a-zA-Z0-9_]*)\(',part))),'form_field_names':sorted(set(re.findall(r'f\.get\("([^"]+)"\)',part))),'error_texts':errors,'returns_redirect':('302' in part),'has_html_200':('html(200' in part),'new_response_codes':re.findall(r'status\s*:\s*(\d{3})',part),'all_form_fields':sorted(set(re.findall(r'name=["\']([A-Za-z_][A-Za-z_0-9]*)["\']',src)))}
              item['callback_helpers']=[line for line in src.splitlines() if line.startswith('function callbackResponse(') or line.startswith('function completionPage(')]
              out.append(item)
          print(json.dumps({'mutation_performed':False,'oauth_contracts':out},sort_keys=True))
          PY
