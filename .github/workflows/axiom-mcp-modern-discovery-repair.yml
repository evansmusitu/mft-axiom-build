name: MUSITU Axiom MCP Modern Discovery Repair

on:
  push:
    paths:
      - '.github/workflows/axiom-mcp-modern-discovery-repair.yml'

permissions:
  contents: write

concurrency:
  group: musitu-axiom-public-plugin-cutover
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      D1_UUID: 504029cc-f9a5-495e-818f-63c6144b4ea4
      MCP_HOST: mcp.mftintelligence.com
      MCP_PUBLIC_WORKER: musitu-axiom-mcp
      MCP_CORE_WORKER: musitu-axiom-mcp-core
      AUTH_ISSUER: https://auth.mftintelligence.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontier/axiom-v5-skill-fabric

      - name: Patch public gateway for stateless MCP 2026-07-28 discovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('mcp/musitu_axiom_plugin_gate_v4.mjs')
          s=p.read_text()
          old='const VERSION="4.0.0";'
          new='''const VERSION="4.0.1";
          const MODERN_PROTOCOL="2026-07-28";
          const SERVER_INFO_KEY="io.modelcontextprotocol/serverInfo";
          const PROTOCOL_META_KEY="io.modelcontextprotocol/protocolVersion";
          const SERVER_INSTRUCTIONS="MUSITU Axiom provides quantitative finance, statistics, optimization, time-series, verification, and mathematical tools for users with an existing MUSITU Axiom account entitlement. It does not execute investment trades or money transfers. Use search and fetch to discover supported capabilities.";'''
          if old not in s: raise SystemExit('expected v4 version marker not found')
          s=s.replace(old,new,1)

          marker='function response(status,body,extra={}){return new Response(JSON.stringify(body),{status,headers:{...JSON_HEADERS,...extra}})}'
          helpers='''function response(status,body,extra={}){return new Response(JSON.stringify(body),{status,headers:{...JSON_HEADERS,...extra}})}
          function serverMeta(){return{[SERVER_INFO_KEY]:{name:"musitu-axiom",version:VERSION}}}
          function isModern(req,m){return m?.method==="server/discover"||req.headers.get("mcp-protocol-version")===MODERN_PROTOCOL||m?.params?._meta?.[PROTOCOL_META_KEY]===MODERN_PROTOCOL}
          function discover(id){return response(200,{jsonrpc:"2.0",id,result:{resultType:"complete",supportedVersions:[MODERN_PROTOCOL],capabilities:{tools:{listChanged:false}},instructions:SERVER_INSTRUCTIONS,ttlMs:60000,cacheScope:"public",_meta:serverMeta()}})}
          async function modernizeResponse(r,modern,cacheable=false){if(!modern)return r;const text=await r.text();let o;try{o=JSON.parse(text||"{}")}catch{return new Response(text,{status:r.status,headers:r.headers})}if(o?.result&&typeof o.result==="object"&&!Array.isArray(o.result)){const meta=o.result._meta&&typeof o.result._meta==="object"?o.result._meta:{};o.result.resultType=o.result.resultType||"complete";if(cacheable){o.result.ttlMs=Number.isInteger(o.result.ttlMs)?o.result.ttlMs:60000;o.result.cacheScope=o.result.cacheScope||"public"}o.result._meta={...meta,...serverMeta()}}return new Response(JSON.stringify(o),{status:r.status,headers:r.headers})}'''
          if marker not in s: raise SystemExit('response helper marker not found')
          s=s.replace(marker,helpers,1)

          pattern=r'async function mcp\(req,c\)\{.*?\}\nasync function health'
          replacement='''async function mcp(req,c){
            if(req.method!=="POST")return response(405,{error:"method_not_allowed"},{allow:"POST"});
            const raw=await req.text();let m;try{m=JSON.parse(raw)}catch{return response(200,{jsonrpc:"2.0",id:null,error:{code:-32700,message:"Parse error"}})}
            const id=m?.id??null,modern=isModern(req,m);
            if(m?.method==="server/discover")return discover(id);
            if(m?.method==="initialize")return response(200,{jsonrpc:"2.0",id,result:{protocolVersion:m?.params?.protocolVersion||"2025-06-18",capabilities:{tools:{listChanged:false}},serverInfo:{name:"musitu-axiom",version:VERSION},instructions:SERVER_INSTRUCTIONS}});
            if(m?.method==="tools/list")return modernizeResponse(await toolsList(c,id),modern,true);
            if(m?.method==="tools/call"){
              const name=String(m?.params?.name||""),args=m?.params?.arguments||{};let r;
              if(HIDDEN.has(name))r=response(200,{jsonrpc:"2.0",id,error:{code:-32601,message:"Tool not available on this plugin surface"}});
              else if(name==="search")r=await publicSearch(c,id,args);
              else if(name==="fetch")r=await publicFetch(c,id,args);
              else if(name==="musitu_axiom_capabilities")r=await publicCapabilities(c,id);
              else r=await forwardCall(req,c,raw,id);
              return modernizeResponse(r,modern,false);
            }
            const h=new Headers(req.headers);h.set("content-type","application/json");h.set("accept","application/json");h.set("user-agent","MUSITU-Axiom-Plugin-Gate/4.0");
            const r=await core(c,"/mcp","POST",h,raw);return modernizeResponse(new Response(r.body,{status:r.status,headers:r.headers}),modern,false)
          }
          async function health'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('mcp function replacement failed')
          p.write_text(s2)
          PY
          node --check mcp/musitu_axiom_plugin_gate_v4.mjs
          git diff --check
          git diff -- mcp/musitu_axiom_plugin_gate_v4.mjs
          git config user.name 'evansmusitu'
          git config user.email 'evansmusitu5@gmail.com'
          git add mcp/musitu_axiom_plugin_gate_v4.mjs
          git commit -m 'Support MCP 2026 server discovery for OpenAI scan'
          git push origin HEAD:frontier/axiom-v5-skill-fabric

      - name: Deploy exact patched gateway and prove modern plus legacy contracts
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,secrets,time,urllib.error,urllib.parse,urllib.request
          api=os.environ['CF_API'];aid=os.environ['ACCOUNT_ID'];dbid=os.environ['D1_UUID'];host=os.environ['MCP_HOST'];pub=os.environ['MCP_PUBLIC_WORKER'];core=os.environ['MCP_CORE_WORKER'];issuer=os.environ['AUTH_ISSUER'];resource='https://'+host
          source=pathlib.Path('mcp/musitu_axiom_plugin_gate_v4.mjs').read_bytes()
          ah={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'Accept':'application/json','User-Agent':'MUSITU-Axiom-Modern-Discovery-Repair/1.0'}
          def raw(url,method='GET',headers=None,body=None,timeout=45):
            q=urllib.request.Request(url,headers=dict(headers or {}),method=method,data=body)
            try:
              with urllib.request.urlopen(q,timeout=timeout) as r:return r.status,r.headers,r.read()
            except urllib.error.HTTPError as e:return e.code,e.headers,e.read()
          def cf(path,method='GET',obj=None):
            h=dict(ah);b=None
            if obj is not None:h['Content-Type']='application/json';b=json.dumps(obj,separators=(',',':')).encode()
            c,_,r=raw(api+path,method,h,b)
            if not 200<=c<300:raise RuntimeError(f'CF HTTP {c} {method} {path}')
            o=json.loads(r or b'{}')
            if o.get('success') is False:raise RuntimeError('CF success=false '+path)
            return o.get('result')
          bd='----MUSITU'+secrets.token_hex(16);parts=[]
          def add(x):parts.append(x.encode() if isinstance(x,str) else x)
          meta={'main_module':'index.mjs','compatibility_date':'2026-09-05','bindings':[{'type':'d1','name':'AXIOM_DB','id':dbid},{'type':'plain_text','name':'AUTH_ISSUER','text':issuer},{'type':'plain_text','name':'MCP_PUBLIC_BASE','text':resource},{'type':'service','name':'MCP_CORE','service':core}]}
          add(f'--{bd}\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n');add(json.dumps(meta,separators=(',',':')));add('\r\n');add(f'--{bd}\r\nContent-Disposition: form-data; name="index.mjs"; filename="index.mjs"\r\nContent-Type: application/javascript+module\r\n\r\n');add(source);add('\r\n');add(f'--{bd}--\r\n')
          h=dict(ah);h['Content-Type']='multipart/form-data; boundary='+bd
          c,_,b=raw(f'{api}/accounts/{aid}/workers/scripts/{urllib.parse.quote(pub,safe="")}', 'PUT',h,b''.join(parts))
          if not 200<=c<300:raise RuntimeError('worker upload failed HTTP '+str(c)+' '+b[:180].decode('utf-8','ignore'))
          cf(f'/accounts/{aid}/workers/scripts/{urllib.parse.quote(pub,safe="")}/subdomain','POST',{'enabled':False,'previews_enabled':False})

          def rpc(payload,modern=False):
            h={'Content-Type':'application/json','Accept':'application/json, text/event-stream','User-Agent':'MUSITU-Axiom-Modern-Discovery-Proof/1.0'}
            if modern:
              h['MCP-Protocol-Version']='2026-07-28';h['Mcp-Method']=str(payload.get('method') or '')
            c,hh,b=raw(resource+'/mcp','POST',h,json.dumps(payload,separators=(',',':')).encode())
            try:o=json.loads(b or b'{}')
            except Exception:o={}
            return c,hh,o,b
          envmeta={'io.modelcontextprotocol/protocolVersion':'2026-07-28','io.modelcontextprotocol/clientCapabilities':{},'io.modelcontextprotocol/clientInfo':{'name':'production-proof','version':'1'}}
          ok=False;last={}
          for _ in range(30):
            hc,_,hb=raw(resource+'/health',headers={'Accept':'application/json'})
            try:ho=json.loads(hb or b'{}')
            except Exception:ho={}
            dc,_,do,_=rpc({'jsonrpc':'2.0','id':'d','method':'server/discover','params':{'_meta':envmeta}},True)
            tc,_,to,_=rpc({'jsonrpc':'2.0','id':'t','method':'tools/list','params':{'_meta':envmeta}},True)
            dr=do.get('result') or {};tr=to.get('result') or {};tools=tr.get('tools') or []
            last={'health_http':hc,'version':ho.get('server_version'),'discover_http':dc,'discover':dr,'tools_http':tc,'tool_count':len(tools),'tools_result_type':tr.get('resultType'),'tools_ttl':tr.get('ttlMs'),'tools_cache':tr.get('cacheScope')}
            if hc==200 and ho.get('server_version')=='4.0.1' and dc==200 and dr.get('resultType')=='complete' and dr.get('supportedVersions')==['2026-07-28'] and isinstance(dr.get('capabilities'),dict) and dr.get('ttlMs')==60000 and dr.get('cacheScope')=='public' and ((dr.get('_meta') or {}).get('io.modelcontextprotocol/serverInfo') or {}).get('version')=='4.0.1' and tc==200 and len(tools)==108 and tr.get('resultType')=='complete' and tr.get('ttlMs')==60000 and tr.get('cacheScope')=='public':ok=True;break
            time.sleep(2)
          if not ok:raise RuntimeError('modern discovery did not converge '+json.dumps(last,sort_keys=True)[:800])

          cc,_,co,_=rpc({'jsonrpc':'2.0','id':'c','method':'tools/call','params':{'name':'musitu_axiom_capabilities','arguments':{},'_meta':envmeta}},True);cr=co.get('result') or {};sc=cr.get('structuredContent') or {}
          if cc!=200 or cr.get('resultType')!='complete' or sc.get('operation_count')!=74 or sc.get('business_product_count')!=30 or sc.get('commerce_tools_exposed') is not False:raise RuntimeError('modern noauth tool call contract failed')
          ac,_,ao,_=rpc({'jsonrpc':'2.0','id':'a','method':'tools/call','params':{'name':'musitu_axiom_execute','arguments':{'operation':'arithmetic.evaluate','args':{'expression':'40+2'}},'_meta':envmeta}},True);ar=ao.get('result') or {}
          if ac!=200 or ar.get('resultType')!='complete' or ar.get('isError') is not True or not ((ar.get('_meta') or {}).get('mcp/www_authenticate')):raise RuntimeError('modern OAuth challenge contract failed')
          lc,_,lo,_=rpc({'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'legacy-proof','version':'1'}}},False);lr=lo.get('result') or {}
          if lc!=200 or lr.get('protocolVersion')!='2025-06-18' or 'resultType' in lr:raise RuntimeError('legacy initialize regression')
          ltc,_,lto,_=rpc({'jsonrpc':'2.0','id':2,'method':'tools/list','params':{}},False);ltr=lto.get('result') or {}
          if ltc!=200 or len(ltr.get('tools') or [])!=108 or 'resultType' in ltr:raise RuntimeError('legacy tools/list regression')
          print(json.dumps({'gate':'MUSITU_AXIOM_MCP_2026_DISCOVERY_PASS','server_version':'4.0.1','server_discover':True,'supported_versions':['2026-07-28'],'modern_tool_count':108,'modern_result_type':True,'modern_cache_hints':True,'modern_oauth_challenge':True,'legacy_initialize_preserved':True,'legacy_tool_count':108,'secrets_published':False},sort_keys=True))
          PY
