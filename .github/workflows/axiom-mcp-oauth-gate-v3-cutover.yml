name: MUSITU Axiom MCP OAuth Gate V3 Cutover

on:
  workflow_dispatch:
  push:
    paths:
      - 'mcp/musitu_axiom_mcp_oauth_gate_v3.mjs'
      - 'mcp/musitu_axiom_mcp_worker_v2.mjs'
      - '.github/workflows/axiom-mcp-oauth-gate-v3-cutover.yml'

permissions:
  contents: read

concurrency:
  group: musitu-axiom-mcp-v3-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      D1_UUID: 504029cc-f9a5-495e-818f-63c6144b4ea4
      MCP_HOST: mcp.mftintelligence.com
      MCP_PUBLIC_WORKER: musitu-axiom-mcp
      MCP_CORE_WORKER: musitu-axiom-mcp-core
      AXIOM_SERVICE: musitu-axiom-modal-edge-stage
      BILLING_SERVICE: mft-axiom-billing-ingress
      AXIOM_BASE: https://axiom.mftintelligence.com
      BILLING_BASE: https://payments.mftintelligence.com
      AUTH_ISSUER: https://auth.mftintelligence.com
      EXPECTED_BUILD: MFT-AXIOM-V3-FULL-SELF-CONTAINED-20260904
      EXPECTED_OPERATIONS: '74'
    steps:
      - uses: actions/checkout@v4

      - name: Validate v2 core and v3 OAuth gate sources
        shell: bash
        run: |
          set -euo pipefail
          node --check mcp/musitu_axiom_mcp_worker_v2.mjs
          node --check mcp/musitu_axiom_mcp_oauth_gate_v3.mjs
          grep -q 'oauth_access_tokens' mcp/musitu_axiom_mcp_oauth_gate_v3.mjs
          grep -q 'billing.write' mcp/musitu_axiom_mcp_oauth_gate_v3.mjs
          grep -q 'billing.read' mcp/musitu_axiom_mcp_oauth_gate_v3.mjs
          grep -q 'axiom.execute' mcp/musitu_axiom_mcp_oauth_gate_v3.mjs

      - name: Deploy private v2 core and public OAuth v3 gate
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime,hashlib,json,os,pathlib,secrets,time,urllib.error,urllib.parse,urllib.request,uuid

          api=os.environ['CF_API'];aid=os.environ['ACCOUNT_ID'];zid=os.environ['ZONE_ID'];dbid=os.environ['D1_UUID']
          host=os.environ['MCP_HOST'];public_worker=os.environ['MCP_PUBLIC_WORKER'];core_worker=os.environ['MCP_CORE_WORKER'];issuer=os.environ['AUTH_ISSUER'];resource='https://'+host
          v2=pathlib.Path('mcp/musitu_axiom_mcp_worker_v2.mjs').read_bytes();v3=pathlib.Path('mcp/musitu_axiom_mcp_oauth_gate_v3.mjs').read_bytes()
          v2sha=hashlib.sha256(v2).hexdigest();v3sha=hashlib.sha256(v3).hexdigest()
          cfh={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'Accept':'application/json','User-Agent':'MUSITU-Axiom-MCP-V3-Cutover/1.0'}

          def raw(url,method='GET',headers=None,body=None,timeout=45):
            q=urllib.request.Request(url,headers=dict(headers or {}),method=method,data=body)
            try:
              with urllib.request.urlopen(q,timeout=timeout) as r:return r.status,r.headers,r.read()
            except urllib.error.HTTPError as e:return e.code,e.headers,e.read()
            except urllib.error.URLError:return 0,{},b''

          def cf(path,method='GET',obj=None):
            h=dict(cfh);b=None
            if obj is not None:h['Content-Type']='application/json';b=json.dumps(obj,separators=(',',':')).encode()
            c,hh,r=raw(api+path,method,h,b)
            if not 200<=c<300:raise RuntimeError(f'Cloudflare HTTP {c}: {method} {path}')
            o=json.loads(r or b'{}')
            if o.get('success') is False:raise RuntimeError('Cloudflare success=false '+path+' '+str(o.get('errors'))[:200])
            return o.get('result')

          def d1(sql,params=None):
            obj={'sql':sql}
            if params is not None:obj['params']=params
            rr=cf(f'/accounts/{aid}/d1/database/{dbid}/query','POST',obj) or [];rows=[]
            if not rr or not all(x.get('success') is True for x in rr):raise RuntimeError('D1 statement failed')
            for x in rr:rows.extend(x.get('results') or [])
            return rows

          def multipart(source,meta):
            bd='----MUSITU'+secrets.token_hex(18);p=[]
            def a(v):p.append(v.encode() if isinstance(v,str) else v)
            a(f'--{bd}\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n');a(json.dumps(meta,separators=(',',':')));a('\r\n')
            a(f'--{bd}\r\nContent-Disposition: form-data; name="index.mjs"; filename="index.mjs"\r\nContent-Type: application/javascript+module\r\n\r\n');a(source);a('\r\n');a(f'--{bd}--\r\n')
            return bd,b''.join(p)

          def upload(worker,source,bindings):
            meta={'main_module':'index.mjs','compatibility_date':'2026-09-05','bindings':bindings}
            bd,body=multipart(source,meta);h=dict(cfh);h['Content-Type']='multipart/form-data; boundary='+bd
            c,_,b=raw(f'{api}/accounts/{aid}/workers/scripts/{urllib.parse.quote(worker,safe="")}', 'PUT',h,body)
            if not 200<=c<300:raise RuntimeError(f'Worker upload failed {worker} HTTP {c}: '+b[:200].decode('utf-8','ignore'))
            cf(f'/accounts/{aid}/workers/scripts/{urllib.parse.quote(worker,safe="")}/subdomain','POST',{'enabled':False,'previews_enabled':False})

          def probe(path,method='GET',obj=None,token=None):
            h={'Accept':'application/json','User-Agent':'MUSITU-Axiom-MCP-V3-Verify/1.0'};body=None
            if obj is not None:h['Content-Type']='application/json';body=json.dumps(obj,separators=(',',':')).encode()
            if token:h['Authorization']='Bearer '+token
            c,hh,b=raw(resource+path,method,h,body)
            try:o=json.loads(b or b'{}')
            except Exception:o={}
            return c,o

          domains=[x for x in (cf(f'/accounts/{aid}/workers/domains') or []) if x.get('hostname')==host]
          if len(domains)!=1 or domains[0].get('service')!=public_worker:raise RuntimeError('canonical MCP domain mapping drift')
          hc,pre=probe('/health')
          if hc!=200 or pre.get('ok') is not True or int(pre.get('operation_count') or -1)!=74:raise RuntimeError('pre-cutover MCP v2 health mismatch')
          ac,_,ab=raw(issuer+'/health',headers={'Accept':'application/json','User-Agent':'MUSITU-Axiom-MCP-V3-Verify/1.0'})
          try:ao=json.loads(ab or b'{}')
          except Exception:ao={}
          if ac!=200 or ao.get('ok') is not True or ao.get('resource')!=resource:raise RuntimeError('OAuth issuer not ready for MCP cutover')

          core_bindings=[
            {'type':'plain_text','name':'AXIOM_BASE','text':os.environ['AXIOM_BASE']},
            {'type':'plain_text','name':'BILLING_BASE','text':os.environ['BILLING_BASE']},
            {'type':'plain_text','name':'MCP_PUBLIC_BASE','text':resource},
            {'type':'plain_text','name':'AUTH_ISSUER','text':issuer},
            {'type':'service','name':'AXIOM_SERVICE','service':os.environ['AXIOM_SERVICE']},
            {'type':'service','name':'BILLING_SERVICE','service':os.environ['BILLING_SERVICE']},
          ]
          public_v3_bindings=[
            {'type':'d1','name':'AXIOM_DB','id':dbid},
            {'type':'plain_text','name':'AUTH_ISSUER','text':issuer},
            {'type':'plain_text','name':'MCP_PUBLIC_BASE','text':resource},
            {'type':'service','name':'MCP_CORE','service':core_worker},
          ]
          public_v2_bindings=core_bindings
          fixture_customer=None;fixture_key=None;public_mutated=False
          try:
            upload(core_worker,v2,core_bindings)
            core_settings=cf(f'/accounts/{aid}/workers/scripts/{urllib.parse.quote(core_worker,safe="")}/settings') or {};cb={x.get('name'):x for x in core_settings.get('bindings') or [] if isinstance(x,dict)}
            if cb.get('AXIOM_SERVICE',{}).get('service')!=os.environ['AXIOM_SERVICE'] or cb.get('BILLING_SERVICE',{}).get('service')!=os.environ['BILLING_SERVICE']:raise RuntimeError('private MCP core service bindings drift')
            core_sub=cf(f'/accounts/{aid}/workers/scripts/{urllib.parse.quote(core_worker,safe="")}/subdomain') or {}
            if core_sub.get('enabled') is not False or core_sub.get('previews_enabled') is not False:raise RuntimeError('private MCP core workers.dev exposure present')

            upload(public_worker,v3,public_v3_bindings);public_mutated=True
            ps=cf(f'/accounts/{aid}/workers/scripts/{urllib.parse.quote(public_worker,safe="")}/settings') or {};pb={x.get('name'):x for x in ps.get('bindings') or [] if isinstance(x,dict)}
            if pb.get('AXIOM_DB',{}).get('id')!=dbid or pb.get('MCP_CORE',{}).get('service')!=core_worker or pb.get('AUTH_ISSUER',{}).get('text')!=issuer:raise RuntimeError('public MCP v3 binding readback mismatch')
            ds=[x for x in (cf(f'/accounts/{aid}/workers/domains') or []) if x.get('hostname')==host]
            if len(ds)!=1 or ds[0].get('service')!=public_worker:raise RuntimeError('MCP custom domain changed during cutover')

            health=None
            for _ in range(30):
              c,o=probe('/health')
              co=o.get('core') or {}
              if c==200 and o.get('ok') is True and o.get('oauth_enforced') is True and o.get('auth_issuer')==issuer and o.get('resource')==resource and o.get('oauth_db_ready') is True and co.get('ok') is True and co.get('build_id')==os.environ['EXPECTED_BUILD'] and int(co.get('operation_count') or -1)==74 and co.get('catalog_configured') is True and co.get('checkout_enabled') is True and co.get('service_bound_axiom') is True and co.get('service_bound_billing') is True:
                health=o;break
              time.sleep(2)
            if health is None:raise RuntimeError('public OAuth MCP v3 health failed')

            mc,meta=probe('/.well-known/oauth-protected-resource')
            if mc!=200 or meta.get('resource')!=resource or meta.get('authorization_servers')!=[issuer] or set(meta.get('scopes_supported') or [])!={'axiom.execute','billing.read','billing.write'}:raise RuntimeError('protected-resource metadata mismatch')

            lc,lo=probe('/mcp','POST',{'jsonrpc':'2.0','id':2,'method':'tools/list','params':{}});tools=(lo.get('result') or {}).get('tools') or []
            if lc!=200 or not tools:raise RuntimeError('v3 tools/list failed')
            mapped={((t.get('_meta') or {}).get('musitu/operation')) for t in tools if isinstance(t,dict)}-{None}
            business=[t for t in tools if (t.get('_meta') or {}).get('musitu/business_product') is True]
            if len(mapped)!=74 or len(business)!=30 or len(tools)!=112:raise RuntimeError(f'commercial surface drift tools={len(tools)} business={len(business)} mapped={len(mapped)}')
            for t in tools:
              a=t.get('annotations') or {}
              if not all(k in a for k in ('readOnlyHint','openWorldHint','destructiveHint')):raise RuntimeError('missing explicit OpenAI safety annotation: '+str(t.get('name')))
              if not isinstance(t.get('outputSchema'),dict):raise RuntimeError('missing outputSchema: '+str(t.get('name')))
            by={t.get('name'):t for t in tools}
            if (by['musitu_axiom_checkout_status'].get('annotations') or {}).get('readOnlyHint') is not False:raise RuntimeError('checkout status reconciliation incorrectly marked read-only')
            if (by['musitu_axiom_start_checkout'].get('annotations') or {}).get('openWorldHint') is not True:raise RuntimeError('checkout creation open-world hint missing')

            uc,uo=probe('/mcp','POST',{'jsonrpc':'2.0','id':3,'method':'tools/call','params':{'name':'investment_npv','arguments':{'args':{}}}});ur=uo.get('result') or {};challenge=json.dumps((ur.get('_meta') or {}).get('mcp/www_authenticate') or [])
            if uc!=200 or ur.get('isError') is not True or ((ur.get('structuredContent') or {}).get('authenticated') is not False) or issuer not in challenge:raise RuntimeError('unauthenticated paid execution did not emit OAuth challenge')

            suffix=uuid.uuid4().hex;fixture_customer='fixture_mcp_v3_direct_'+suffix;fixture_key='fixture_mcp_v3_direct_key_'+suffix
            direct='musitu_axiom_direct_fixture_'+secrets.token_urlsafe(40);print('::add-mask::'+direct)
            now=datetime.datetime.now(datetime.timezone.utc);created=now.isoformat().replace('+00:00','Z');expires=(now+datetime.timedelta(hours=1)).isoformat().replace('+00:00','Z')
            d1('INSERT INTO customers(id,email,name,plan,status,monthly_unit_override,created_at,updated_at) VALUES(?1,?2,?3,?4,?5,?6,?7,?7)',[fixture_customer,fixture_customer+'@invalid.example','MUSITU MCP v3 direct-key rejection fixture','developer','active',100,created])
            d1('INSERT INTO api_keys(id,customer_id,key_hash,key_prefix,label,status,created_at,last_used_at,expires_at,revoked_at) VALUES(?1,?2,?3,?4,?5,?6,?7,NULL,?8,NULL)',[fixture_key,fixture_customer,hashlib.sha256(direct.encode()).hexdigest(),direct[:16],'mcp-v3-direct-key-rejection','active',created,expires])
            before=int(d1('SELECT count(*) AS n FROM usage_events WHERE customer_id=?1',[fixture_customer])[0]['n'])
            dc,do=probe('/mcp','POST',{'jsonrpc':'2.0','id':4,'method':'tools/call','params':{'name':'musitu_axiom_execute','arguments':{'operation':'arithmetic.evaluate','args':{'expression':'40+2'}}}},direct);dr=do.get('result') or {}
            after=int(d1('SELECT count(*) AS n FROM usage_events WHERE customer_id=?1',[fixture_customer])[0]['n'])
            if dc!=200 or dr.get('isError') is not True or ((dr.get('structuredContent') or {}).get('authenticated') is not False) or after!=before:raise RuntimeError('legacy/direct bearer key crossed OAuth-only MCP boundary')

            evidence={'schema':'musitu.axiom.mcp.oauth_gate_v3_cutover.v1','gate':'MUSITU_AXIOM_MCP_OAUTH_GATE_V3_CUTOVER_PASS','hostname':host,'mcp_endpoint':resource+'/mcp','v3_source_sha256':v3sha,'private_core_source_sha256':v2sha,'oauth_enforced':True,'oauth_issuer':issuer,'legacy_direct_bearer_rejected':True,'legacy_direct_bearer_usage_delta':0,'operation_count':74,'unique_axiom_operations_wired':74,'business_product_count':30,'advertised_tool_count':112,'all_tools_explicit_annotations':True,'all_tools_output_schema_present':True,'checkout_status_reconciliation_readonly_false':True,'checkout_creation_open_world_true':True,'protected_resource_metadata_verified':True,'private_core_workers_dev_disabled':True,'public_workers_dev_disabled':True,'kernel_mutated':False,'billing_worker_mutated':False,'raw_modal_public_exposure_added':False,'secret_values_logged':False,'wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED'}
          except Exception:
            if public_mutated:
              try:
                upload(public_worker,v2,public_v2_bindings)
                for _ in range(20):
                  c,o=probe('/health')
                  if c==200 and o.get('ok') is True and int(o.get('operation_count') or -1)==74:break
                  time.sleep(1)
              except Exception:
                pass
            raise
          finally:
            if fixture_customer:
              try:
                d1('DELETE FROM usage_events WHERE customer_id=?1',[fixture_customer]);d1('DELETE FROM usage_buckets WHERE customer_id=?1',[fixture_customer]);d1('DELETE FROM api_keys WHERE customer_id=?1',[fixture_customer]);d1('DELETE FROM customers WHERE id=?1',[fixture_customer])
              except Exception:
                pass

          remain=0
          if fixture_customer:
            rr=d1('SELECT (SELECT count(*) FROM customers WHERE id=?1)+(SELECT count(*) FROM api_keys WHERE customer_id=?1)+(SELECT count(*) FROM usage_events WHERE customer_id=?1)+(SELECT count(*) FROM usage_buckets WHERE customer_id=?1) AS n',[fixture_customer]);remain=int(rr[0]['n']) if rr else -1
          if remain!=0:raise RuntimeError('v3 direct-key fixture cleanup failed')
          evidence['fixture_rows_remaining']=0;evidence['cleanup_complete']=True
          p=pathlib.Path('musitu-axiom-mcp-oauth-gate-v3-cutover.json');p.write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n');dg=hashlib.sha256(p.read_bytes()).hexdigest();pathlib.Path('musitu-axiom-mcp-oauth-gate-v3-cutover.sha256').write_text(dg+'  '+p.name+'\n')
          print(json.dumps({'gate':evidence['gate'],'operation_count':74,'business_product_count':30,'advertised_tool_count':112,'oauth_enforced':True,'legacy_direct_bearer_rejected':True,'evidence_sha256':dg},sort_keys=True))
          PY

      - name: Upload sealed v3 cutover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-mcp-oauth-gate-v3-cutover
          path: |
            musitu-axiom-mcp-oauth-gate-v3-cutover.json
            musitu-axiom-mcp-oauth-gate-v3-cutover.sha256
          retention-days: 30
          if-no-files-found: warn
