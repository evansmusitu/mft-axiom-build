name: MUSITU Axiom Modal Adapter Exact Request Probe — QUARANTINED BY AR-02

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed at the AR-02 probe boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'AR-02 QUARANTINE: the historical Modal exact-request probe is disabled.'
          echo 'It previously used broad provider credentials and created a public temporary service-binding probe.'
          echo 'No provider credentials are loaded, no Worker is deployed, and no public probe endpoint is created.'
          echo 'A replacement must use dedicated non-production resources and bounded diagnostic credentials.'
          exit 1
