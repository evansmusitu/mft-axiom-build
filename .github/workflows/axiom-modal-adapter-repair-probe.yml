name: MUSITU Axiom Phase 2 Modal Fanout Token Remediation

on:
  push:
    branches:
      - frontier/axiom-product-intelligence-phase2-20261004
    paths:
      - '.github/workflows/axiom-modal-adapter-repair-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revoke-incident-token-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      INCIDENT_START_UTC: '2026-10-05T05:58:15Z'
      INCIDENT_END_UTC: '2026-10-05T05:58:25Z'
    steps:
      - name: Install exact Modal client
        run: python -m pip install --disable-pip-version-check --quiet 'modal==1.6.1'

      - name: Identify exactly one incident-created unnamed proxy token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          modal workspace proxy-tokens list --json >/tmp/tokens-before.json
          python - <<'PY'
          import datetime as dt, json, os, pathlib, re, sys

          raw=json.load(open('/tmp/tokens-before.json',encoding='utf-8'))
          start=dt.datetime.fromisoformat(os.environ['INCIDENT_START_UTC'].replace('Z','+00:00'))
          end=dt.datetime.fromisoformat(os.environ['INCIDENT_END_UTC'].replace('Z','+00:00'))
          id_re=re.compile(r'^wk-[A-Za-z0-9_-]+$')

          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values():
                      yield from walk(v)
              elif isinstance(x,list):
                  for v in x:
                      yield from walk(v)

          def parse_time(v):
              if not isinstance(v,str):
                  return None
              s=v.strip()
              try:
                  if s.endswith('Z'): s=s[:-1]+'+00:00'
                  d=dt.datetime.fromisoformat(s)
                  if d.tzinfo is None: d=d.replace(tzinfo=dt.timezone.utc)
                  return d.astimezone(dt.timezone.utc)
              except Exception:
                  return None

          seen={}
          for obj in walk(raw):
              ids=[v for v in obj.values() if isinstance(v,str) and id_re.match(v)]
              if len(ids)!=1:
                  continue
              token_id=ids[0]
              times=[]
              for k,v in obj.items():
                  lk=str(k).lower()
                  if any(word in lk for word in ('create','created','time','date','timestamp')):
                      d=parse_time(v)
                      if d: times.append(d)
              name=None
              for k,v in obj.items():
                  if str(k).lower() in ('name','token_name','display_name'):
                      name=v
                      break
              seen[token_id]={'times':times,'name':name,'keys':sorted(map(str,obj.keys()))}

          candidates=[]
          for token_id,meta in seen.items():
              if any(start <= d <= end for d in meta['times']) and meta['name'] in (None,''):
                  candidates.append(token_id)

          print('PROXY_TOKEN_RECORDS_WITH_IDS='+str(len(seen)))
          print('INCIDENT_TOKEN_CANDIDATE_COUNT='+str(len(candidates)))
          if len(candidates)==0:
              # A zero count is safe only when timestamp metadata exists somewhere:
              # it means the incident token is already absent.
              timed=sum(bool(m['times']) for m in seen.values())
              print('PROXY_TOKEN_RECORDS_WITH_TIMESTAMPS='+str(timed))
              if timed==0:
                  raise SystemExit('NOT_PROVEN: token-list schema exposes no usable creation timestamps; refusing deletion')
              pathlib.Path('/tmp/already-clean').write_text('1')
              print('INCIDENT_PROXY_TOKEN_ALREADY_ABSENT=TRUE')
          elif len(candidates)==1:
              pathlib.Path('/tmp/incident-token-id').write_text(candidates[0])
              print('INCIDENT_PROXY_TOKEN_EXACT_MATCH=TRUE')
          else:
              raise SystemExit('FAIL_CLOSED: multiple proxy tokens match the incident creation window')
          PY

      - name: Delete only the exact incident token
        if: ${{ hashFiles('/tmp/incident-token-id') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_ID="$(cat /tmp/incident-token-id)"
          modal workspace proxy-tokens delete -y "$TOKEN_ID"
          echo 'INCIDENT_PROXY_TOKEN_DELETE_REQUESTED=TRUE'

      - name: Independently verify incident window is clean
        shell: bash
        run: |
          set -euo pipefail
          modal workspace proxy-tokens list --json >/tmp/tokens-after.json
          python - <<'PY'
          import datetime as dt, json, os, re

          raw=json.load(open('/tmp/tokens-after.json',encoding='utf-8'))
          start=dt.datetime.fromisoformat(os.environ['INCIDENT_START_UTC'].replace('Z','+00:00'))
          end=dt.datetime.fromisoformat(os.environ['INCIDENT_END_UTC'].replace('Z','+00:00'))
          id_re=re.compile(r'^wk-[A-Za-z0-9_-]+$')

          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)

          def parse(v):
              if not isinstance(v,str): return None
              try:
                  s=v[:-1]+'+00:00' if v.endswith('Z') else v
                  d=dt.datetime.fromisoformat(s)
                  if d.tzinfo is None:d=d.replace(tzinfo=dt.timezone.utc)
                  return d.astimezone(dt.timezone.utc)
              except Exception:return None

          remain=[]
          for obj in walk(raw):
              ids=[v for v in obj.values() if isinstance(v,str) and id_re.match(v)]
              if len(ids)!=1: continue
              name=next((v for k,v in obj.items() if str(k).lower() in ('name','token_name','display_name')),None)
              times=[parse(v) for k,v in obj.items() if any(w in str(k).lower() for w in ('create','created','time','date','timestamp'))]
              times=[x for x in times if x]
              if name in (None,'') and any(start<=x<=end for x in times):
                  remain.append(ids[0])
          if remain:
              raise SystemExit('FAIL_CLOSED: incident-window proxy token still present')
          print('MUSITU_AXIOM_MODAL_INCIDENT_PROXY_TOKEN_REMEDIATION_PASS')
          print('PRODUCTION_AUTHORITY=FALSE')
          print('OPENAI_SURFACE_MUTATED=FALSE')
          print('MODAL_APP_ROLLBACK_PERFORMED=FALSE')
          PY
