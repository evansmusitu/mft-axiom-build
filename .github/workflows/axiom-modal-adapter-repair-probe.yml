name: MUSITU Axiom Modal Adapter Repair Probe — QUARANTINED BY AR-02

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed at the AR-02 repair boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'AR-02 QUARANTINE: the historical Modal adapter repair probe is disabled.'
          echo 'It previously created proxy credentials, redeployed the persistent adapter, rotated adapter secrets, and deployed a public probe.'
          echo 'No provider or Modal credentials are loaded and no persistent or public resource is mutated.'
          echo 'A replacement must separate observation from repair and use explicit repair authority plus brokered short-lived credentials.'
          exit 1
