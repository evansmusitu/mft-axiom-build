name: MUSITU Axiom Modal Adapter Repair Probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/axiom-modal-adapter-repair-probe.yml']
permissions:
  contents: read
jobs:
  repair-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      ADAPTER_WORKER: mft-axiom-modal-adapter
      PROBE_WORKER: musitu-axiom-modal-adapter-probe
      MODAL_BASE_URL: https://evansmusitu--mft-axiom-v3-modal-staging-axiom-kernel.modal.run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install and verify providers
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@4.129.0 >/dev/null
          python -m pip install --disable-pip-version-check --quiet 'modal>=1.5,<2'
          npx wrangler auth token --json >/tmp/cf-auth.json
          python - <<'PY'
          import json
          if json.load(open('/tmp/cf-auth.json')).get('type')!='api_key': raise SystemExit('Cloudflare auth mismatch')
          PY
          modal app list --json >/dev/null
          python - <<'PY'
          import modal
          r=modal.Function.from_name('mft-axiom-v3-modal-staging','runtime_probe').remote()
          if r.get('build_id')!='MFT-AXIOM-V3-FULL-SELF-CONTAINED-20260904': raise SystemExit('Modal build mismatch')
          PY
          test "$(curl -sS -o /tmp/u -w '%{http_code}' "$MODAL_BASE_URL/health" || true)" = 401
      - name: Create proxy credential
        shell: bash
        run: |
          set -euo pipefail
          modal workspace proxy-tokens create --json >/tmp/proxy.json
          python - <<'PY'
          import json,pathlib
          vals=[]
          def w(x):
              if isinstance(x,dict):
                  for v in x.values(): w(v)
              elif isinstance(x,list):
                  for v in x: w(v)
              elif isinstance(x,str): vals.append(x)
          w(json.load(open('/tmp/proxy.json')))
          k=[x for x in vals if x.startswith('wk-')]; s=[x for x in vals if x.startswith('ws-')]
          if len(k)!=1 or len(s)!=1: raise SystemExit('proxy token shape')
          pathlib.Path('/tmp/pk').write_text(k[0]); pathlib.Path('/tmp/ps').write_text(s[0])
          PY
          echo "::add-mask::$(cat /tmp/pk)"; echo "::add-mask::$(cat /tmp/ps)"
      - name: Deploy hardened private adapter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/adapter
          cat >/tmp/adapter/worker.js <<'JS'
          export default {async fetch(request,env){
            if(!env.MODAL_PROXY_KEY||!env.MODAL_PROXY_SECRET)return Response.json({ok:false,error:'ADAPTER_AUTH_NOT_CONFIGURED'},{status:503});
            const u=new URL(request.url), target=new URL(u.pathname+u.search,env.MODAL_BASE_URL), h=new Headers(request.headers);
            for(const n of ['host','content-length','transfer-encoding','connection','modal-key','modal-secret'])h.delete(n);
            h.set('Modal-Key',env.MODAL_PROXY_KEY); h.set('Modal-Secret',env.MODAL_PROXY_SECRET);
            const init={method:request.method,headers:h,redirect:'manual'};
            if(request.method!=='GET'&&request.method!=='HEAD'){const b=await request.arrayBuffer();if(b.byteLength)init.body=b;}
            try{return await fetch(target.toString(),init);}catch(e){return Response.json({ok:false,error:'ADAPTER_UPSTREAM_FETCH_FAILED'},{status:502});}
          }};
          JS
          python - <<'PY'
          import json,os
          json.dump({'name':os.environ['ADAPTER_WORKER'],'main':'worker.js','compatibility_date':'2026-09-04','workers_dev':False,'vars':{'MODAL_BASE_URL':os.environ['MODAL_BASE_URL']}},open('/tmp/adapter/wrangler.json','w'))
          PY
          (cd /tmp/adapter && npx wrangler deploy --config wrangler.json >/tmp/ad.log 2>&1) || { tail -100 /tmp/ad.log; exit 1; }
          printf '%s' "$(cat /tmp/pk)" | (cd /tmp/adapter && npx wrangler secret put MODAL_PROXY_KEY --config wrangler.json >/dev/null)
          printf '%s' "$(cat /tmp/ps)" | (cd /tmp/adapter && npx wrangler secret put MODAL_PROXY_SECRET --config wrangler.json >/dev/null)
      - name: Deploy service-binding probe and verify Modal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe
          cat >/tmp/probe/worker.js <<'JS'
          export default {async fetch(r,e){const u=new URL(r.url);if(u.pathname==='/h')return e.UP.fetch('http://container/health');if(u.pathname==='/c')return e.UP.fetch('http://container/v1/compute',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({operation:'arithmetic.evaluate',args:{expression:'40+2'},verify:true})});return new Response('x',{status:404});}};
          JS
          python - <<'PY'
          import json,os
          json.dump({'name':os.environ['PROBE_WORKER'],'main':'worker.js','compatibility_date':'2026-09-04','workers_dev':True,'services':[{'binding':'UP','service':os.environ['ADAPTER_WORKER']}]},open('/tmp/probe/wrangler.json','w'))
          PY
          (cd /tmp/probe && npx wrangler deploy --config wrangler.json >/tmp/pr.log 2>&1) || { tail -100 /tmp/pr.log; exit 1; }
          SUB="$(python - <<'PY'
          import json,os,urllib.request
          h={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_API_KEY']};q=urllib.request.Request(f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/workers/subdomain",headers=h)
          with urllib.request.urlopen(q) as r:x=json.load(r)
          print(x['result']['subdomain'])
          PY
          )"
          U="https://${PROBE_WORKER}.${SUB}.workers.dev"
          test "$(curl -sS --max-time 90 -o /tmp/h.json -w '%{http_code}' "$U/h")" = 200 || { cat /tmp/h.json; exit 1; }
          test "$(curl -sS --max-time 90 -o /tmp/c.json -w '%{http_code}' "$U/c")" = 200 || { cat /tmp/c.json; exit 1; }
          python - <<'PY'
          import json
          if json.load(open('/tmp/h.json')).get('ok') is not True: raise SystemExit('health body')
          if json.load(open('/tmp/c.json')).get('ok') is not True: raise SystemExit('compute body')
          print('SERVICE_BINDING_MODAL_PASS')
          PY
