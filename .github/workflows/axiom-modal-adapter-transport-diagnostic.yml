name: MUSITU Axiom Modal Adapter Transport Diagnostic — QUARANTINED BY AR-02

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed at the AR-02 transport-diagnostic boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'AR-02 QUARANTINE: the historical Modal adapter transport diagnostic is disabled.'
          echo 'It previously created diagnostic proxy credentials, rotated persistent adapter secrets, and deployed a public temporary Worker.'
          echo 'No proxy credential is created, no persistent secret is changed, and no Worker is deployed.'
          echo 'A replacement must be observation-only or use isolated ephemeral resources with bounded credentials and guaranteed revocation.'
          exit 1
