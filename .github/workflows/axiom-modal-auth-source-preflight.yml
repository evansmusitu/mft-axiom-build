name: MUSITU Axiom Modal Auth + Source Preflight

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/axiom-modal-auth-source-preflight.yml'

permissions:
  contents: read

jobs:
  modal-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.13 and Modal
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Modal credentials without exposing them
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          python -m pip install --disable-pip-version-check --quiet 'modal>=1.5,<2'
          modal app list --json >/dev/null
          echo 'modal_auth_pass=true'

      - name: Reconstruct encrypted Axiom source fail-closed
        env:
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_GLOBAL_API_KEY"
          P=deploy_payload/runtime_min
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > runtime.enc.b64
          base64 -d runtime.enc.b64 > runtime.tar.gz.enc
          test "$(sha256sum runtime.tar.gz.enc | awk '{print $1}')" = 'b82448d6b4b34b302748815af976b535d69922c197d4b7a9056fc2f91a9e12cf'
          python - <<'PY'
          import hashlib,hmac,os
          data=open('runtime.tar.gz.enc','rb').read()
          got=hmac.new(os.environ['CLOUDFLARE_GLOBAL_API_KEY'].encode(),data,hashlib.sha256).hexdigest()
          if not hmac.compare_digest(got,'1a3193d4f3271d61d151e6ebd7cf4576d8ab86c2e79b84eff4ad0f635fe7ab47'):
              raise SystemExit('Fail-closed: ciphertext HMAC mismatch')
          PY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in runtime.tar.gz.enc -out runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          test "$(sha256sum runtime.tar.gz | awk '{print $1}')" = 'b4d5a0266446523969a619f5e9bb5a04d9b815c78a2ab82ed046ef5e23d53663'
          mkdir runtime
          tar -xzf runtime.tar.gz -C runtime

      - name: Inspect deployability without revealing source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('runtime')
          m=json.loads((root/'RUNTIME_SOURCE_MANIFEST.json').read_text())
          assert m['schema']=='musitu.axiom.runtime_minimal_source.v1'
          assert m['source_build']=='MFT-AXIOM-V3-FULL-SELF-CONTAINED-20260904'
          problems=[]; paths=[]; total=0
          for f in m['files']:
              p=root/f['path']; paths.append(f['path'])
              if not p.is_file(): problems.append([f['path'],'missing']); continue
              b=p.read_bytes(); total += len(b)
              if len(b)!=f['size']: problems.append([f['path'],'size'])
              if hashlib.sha256(b).hexdigest()!=f['sha256']: problems.append([f['path'],'sha256'])
          if problems: raise SystemExit('Fail-closed source manifest mismatch')
          def anyp(pred): return any(pred(x) for x in paths)
          result={
            'schema':'musitu.axiom.modal_source_preflight.v1',
            'modal_auth':'PASS',
            'source_build':m['source_build'],
            'source_file_count':len(paths),
            'source_total_bytes':total,
            'has_python_kernel':anyp(lambda x:x.endswith('.py') and ('kernel' in x.lower() or 'engine' in x.lower())),
            'has_worker':anyp(lambda x:x.startswith('worker/')),
            'has_dockerfile':anyp(lambda x:pathlib.PurePosixPath(x).name.lower().startswith('dockerfile')),
            'has_requirements':anyp(lambda x:'requirements' in pathlib.PurePosixPath(x).name.lower() or pathlib.PurePosixPath(x).name=='pyproject.toml'),
            'has_vendored_runtime':anyp(lambda x:x.startswith('vendor/python/runtime-site-packages/')),
            'has_vendored_accelerators':anyp(lambda x:x.startswith('vendor/python/accelerator-site-packages/')),
            'operation_count':74,
            'plaintext_source_committed':False,
            'wolfram_parity':'NOT_CERTIFIED',
            'superiority':'NOT_CERTIFIED'
          }
          pathlib.Path('modal-source-preflight.json').write_text(json.dumps(result,indent=2,sort_keys=True))
          print(json.dumps(result,sort_keys=True))
          PY

      - name: Seal preflight evidence
        run: sha256sum modal-source-preflight.json > modal-source-preflight.sha256

      - name: Upload non-secret evidence
        uses: actions/upload-artifact@v4
        with:
          name: mft-axiom-modal-auth-source-preflight
          path: |
            modal-source-preflight.json
            modal-source-preflight.sha256
          if-no-files-found: error
          retention-days: 7
