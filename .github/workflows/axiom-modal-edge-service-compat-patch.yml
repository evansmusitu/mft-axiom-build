name: MFT Axiom Modal Edge Service Compatibility Patch
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/axiom-modal-edge-service-compat-patch.yml']
permissions:
  contents: read
jobs:
  patch-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      EDGE_WORKER: mft-axiom-modal-edge-stage
      ADAPTER_WORKER: mft-axiom-modal-adapter
      D1_NAME: mft-axiom-prod
      D1_ID: 4a62b374-7232-4103-b201-34443c467382
      BUILD_ID: MFT-AXIOM-V3-FULL-SELF-CONTAINED-20260904
      PATCH_SHA: 576f6c3e5d2bfc9bb14b62574778bd5cf5dceadd7b141210cbc49da9b21c03b2
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct protected source
        shell: bash
        run: |
          set -euo pipefail
          P=deploy_payload/runtime_min
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > runtime.enc.b64
          base64 -d runtime.enc.b64 > runtime.tar.gz.enc
          test "$(sha256sum runtime.tar.gz.enc|awk '{print $1}')" = b82448d6b4b34b302748815af976b535d69922c197d4b7a9056fc2f91a9e12cf
          python - <<'PY'
          import hashlib,hmac,os
          b=open('runtime.tar.gz.enc','rb').read(); g=hmac.new(os.environ['CLOUDFLARE_GLOBAL_API_KEY'].encode(),b,hashlib.sha256).hexdigest()
          if not hmac.compare_digest(g,'1a3193d4f3271d61d151e6ebd7cf4576d8ab86c2e79b84eff4ad0f635fe7ab47'): raise SystemExit('HMAC mismatch')
          PY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in runtime.tar.gz.enc -out runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          test "$(sha256sum runtime.tar.gz|awk '{print $1}')" = b4d5a0266446523969a619f5e9bb5a04d9b815c78a2ab82ed046ef5e23d53663
          mkdir runtime && tar -xzf runtime.tar.gz -C runtime
      - name: Apply exactly one compatibility transform
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,os
          p=Path('runtime/worker/src/index.js'); s=p.read_text(); token='kernel.fetch(new Request('
          if s.count(token)!=1: raise SystemExit('transform target count mismatch')
          pos=s.index(token); o=pos+len('kernel.fetch(new Request')
          def match(src,start):
              d=0;q=None;e=False
              for i in range(start,len(src)):
                  c=src[i]
                  if q:
                      if e:e=False
                      elif c=='\\':e=True
                      elif c==q:q=None
                      continue
                  if c in "'\"`":q=c;continue
                  if c=='(':d+=1
                  elif c==')':
                      d-=1
                      if d==0:return i
              raise SystemExit('unbalanced target')
          end=match(s,o)
          out=s[:pos+len('kernel.fetch(')]+s[pos+len('kernel.fetch(new Request('):end]+s[end+1:]
          if len(s)-len(out)!=13 or token in out: raise SystemExit('transform invariant')
          if hashlib.sha256(out.encode()).hexdigest()!=os.environ['PATCH_SHA']: raise SystemExit('patched hash mismatch')
          p.write_text(out)
          PY
          node --check runtime/worker/src/index.js
      - name: Bundle and deploy isolated Worker with existing bindings
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@4.129.0 esbuild@0.25.9 >/dev/null
          python - <<'PY'
          from pathlib import Path
          p=Path('runtime/worker/src/catalog.js'); s=p.read_text(); vals=['MFT-AXIOM-V3-SELF-CONTAINED-20260904','MFT-AXIOM-V3-RUNTIME-RECONSTRUCTION-20260904','MFT-AXIOM-V3-FULL-SELF-CONTAINED-20260904']; f=[x for x in vals if x in s]
          if len(f)!=1: raise SystemExit('build identity mismatch')
          p.write_text(s.replace(f[0],'MFT-AXIOM-V3-FULL-SELF-CONTAINED-20260904'))
          PY
          mkdir -p /tmp/edge
          npx esbuild runtime/worker/src/index.js --bundle --format=esm --platform=browser --target=es2022 --outfile=/tmp/edge/worker.js --log-level=warning
          python - <<'PY'
          import json,os
          json.dump({'name':os.environ['EDGE_WORKER'],'main':'worker.js','compatibility_date':'2026-09-04','workers_dev':True,'d1_databases':[{'binding':'AXIOM_DB','database_name':os.environ['D1_NAME'],'database_id':os.environ['D1_ID']}],'services':[{'binding':'AXIOM_KERNEL','service':os.environ['ADAPTER_WORKER']}]},open('/tmp/edge/wrangler.json','w'),indent=2)
          PY
          (cd /tmp/edge && npx wrangler deploy --config wrangler.json >/tmp/deploy.log 2>&1) || { tail -120 /tmp/deploy.log; exit 1; }
          echo service_compat_patch_deployed=PASS
      - name: Verify public non-secret gates
        shell: bash
        run: |
          set -euo pipefail
          SUB="$(python - <<'PY'
          import json,os,urllib.request
          h={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_API_KEY']};q=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/93f395f5121954671f92fffa453d6b61/workers/subdomain',headers=h)
          with urllib.request.urlopen(q) as r:x=json.load(r)
          print(x['result']['subdomain'])
          PY
          )"; U="https://${EDGE_WORKER}.${SUB}.workers.dev"
          test "$(curl -sS -o /tmp/h -w '%{http_code}' "$U/health")" = 200
          curl -fsS "$U/v1/tools" >/tmp/t
          python - <<'PY'
          import json
          x=json.load(open('/tmp/t'))
          if x.get('operation_count')!=74 or len(x.get('tools',[]))!=74: raise SystemExit('tools mismatch')
          PY
          test "$(curl -sS -o /tmp/u -w '%{http_code}' -X POST "$U/v1/compute" -H 'content-type: application/json' --data '{"operation":"arithmetic.evaluate","args":{"expression":"40+2"}}')" = 401
          echo public_gates=PASS
