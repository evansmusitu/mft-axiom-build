name: MUSITU Axiom Modal Edge Service Compatibility Patch — QUARANTINED BY AR-02

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed at the AR-02 compatibility-patch boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'AR-02 QUARANTINE: the historical Modal edge compatibility patch is disabled.'
          echo 'It previously reconstructed protected source, bound a production database, and deployed a public compatibility edge with broad provider credentials.'
          echo 'No protected source is reconstructed, no provider credential is loaded, no database is bound, and no Worker is deployed.'
          echo 'A replacement must qualify the compatibility transform against dedicated staging resources with brokered non-production credentials.'
          exit 1
