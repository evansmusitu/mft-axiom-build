name: MUSITU Axiom Modal Runtime Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/axiom-modal-runtime-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check --quiet 'modal>=1.5,<2'
      - name: Inspect deployed runtime contract read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, modal
          p=modal.Function.from_name('mft-axiom-v3-modal-staging','runtime_probe')
          r=p.remote()
          safe={
            'build_id':r.get('build_id'),
            'routes':r.get('routes'),
            'packages':r.get('packages'),
            'compute_request_schema':r.get('compute_request_schema'),
            'wolfram_parity':r.get('wolfram_parity'),
            'superiority':r.get('superiority'),
          }
          print(json.dumps(safe,sort_keys=True))
          PY
