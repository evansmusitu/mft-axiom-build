name: MUSITU Axiom Modal Stage Domain Auth Final V2
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/axiom-modal-stage-domain-auth-final-v2.yml']
permissions:
  contents: read
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      HOSTNAME: axiom-stage.mftintelligence.com
      EDGE_WORKER: mft-axiom-modal-edge-stage
      BUILD_ID: MFT-AXIOM-V3-FULL-SELF-CONTAINED-20260904
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Precondition promoted domain and bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          base='https://api.cloudflare.com/client/v4'; h={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_API_KEY']}
          def get(p):
              q=urllib.request.Request(base+p,headers=h)
              with urllib.request.urlopen(q,timeout=30) as r:x=json.load(r)
              if not x.get('success'): raise SystemExit('Cloudflare read failed')
              return x.get('result') or []
          ds=[d for d in get(f"/accounts/{os.environ['ACCOUNT_ID']}/workers/domains") if d.get('hostname')==os.environ['HOSTNAME']]
          if len(ds)!=1 or ds[0].get('service')!=os.environ['EDGE_WORKER']: raise SystemExit('domain service precondition')
          st=get(f"/accounts/{os.environ['ACCOUNT_ID']}/workers/scripts/{os.environ['EDGE_WORKER']}/settings")
          names={b.get('name') for b in st.get('bindings',[]) if isinstance(b,dict)}
          need={'AXIOM_DB','AXIOM_KERNEL','MFT_CONTROL_SECRET','MFT_RECEIPT_SECRET'}
          if not need.issubset(names): raise SystemExit('binding precondition '+repr(sorted(need-names)))
          print('promoted_domain_precondition=PASS')
          PY
      - name: Rotate only Axiom cryptographic runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@4.129.0 >/dev/null
          mkdir -p /tmp/w
          echo 'export default {fetch(){return new Response("unused")}}' >/tmp/w/placeholder.js
          python - <<'PY'
          import json,os
          json.dump({'name':os.environ['EDGE_WORKER'],'main':'placeholder.js','compatibility_date':'2026-09-04'},open('/tmp/w/wrangler.json','w'))
          PY
          C="$(openssl rand -hex 32)"; R="$(openssl rand -hex 32)"; echo "::add-mask::$C"; echo "::add-mask::$R"
          printf '%s' "$C" >/tmp/control; printf '%s' "$R" >/tmp/receipt
          printf '%s' "$C" | (cd /tmp/w && npx wrangler secret put MFT_CONTROL_SECRET --config wrangler.json >/dev/null)
          printf '%s' "$R" | (cd /tmp/w && npx wrangler secret put MFT_RECEIPT_SECRET --config wrangler.json >/dev/null)
          echo runtime_secrets=PASS
      - name: Verify real custom-domain compute and HMAC receipt
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${HOSTNAME}"
          test "$(curl -sS --max-time 30 -o /tmp/h.json -w '%{http_code}' "$BASE/health")" = 200
          test "$(curl -sS -o /tmp/u.json -w '%{http_code}' -X POST "$BASE/v1/compute" -H 'content-type: application/json' --data '{"operation":"arithmetic.evaluate","args":{"expression":"40+2"},"verify":true}')" = 401
          C="$(cat /tmp/control)"
          code="$(curl -sS --max-time 90 -o /tmp/c.json -w '%{http_code}' -X POST "$BASE/v1/compute" -H "x-mft-control: $C" -H 'content-type: application/json' --data '{"operation":"arithmetic.evaluate","args":{"expression":"40+2"},"verify":true}')"
          test "$code" = 200 || { echo "auth compute HTTP=$code"; cat /tmp/c.json; exit 1; }
          python - <<'PY'
          import json,os
          from decimal import Decimal, InvalidOperation
          h=json.load(open('/tmp/h.json'))
          exp={'ok':True,'status':'READY','version':'3.0.0','build_id':os.environ['BUILD_ID'],'operation_count':74,'state':'D1','wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED'}
          bad={k:(h.get(k),v) for k,v in exp.items() if h.get(k)!=v}
          if bad: raise SystemExit('health mismatch '+repr(bad))
          x=json.load(open('/tmp/c.json'))
          if x.get('ok') is not True: raise SystemExit('compute ok false')
          try: value=Decimal(str(x.get('result')))
          except InvalidOperation: raise SystemExit('compute result not numeric')
          if value!=Decimal(42): raise SystemExit('compute expected numeric 42 got '+repr(x.get('result')))
          r=x.get('receipt') or {}
          if r.get('signature_alg')!='HMAC-SHA256': raise SystemExit('receipt alg')
          for k in ('signature','request_sha256','result_sha256'):
              if not r.get(k): raise SystemExit('receipt missing '+k)
          print('AUTHENTICATED_COMPUTE_NUMERIC_42=PASS')
          print('SIGNED_RECEIPT_HMAC_SHA256=PASS')
          PY
      - name: Final domain D1 and scoped-security readback and seal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request,hashlib,pathlib
          base='https://api.cloudflare.com/client/v4'; aid=os.environ['ACCOUNT_ID']; zid=os.environ['ZONE_ID']; hdr={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_API_KEY'],'Content-Type':'application/json'}
          def call(p,method='GET',body=None):
              q=urllib.request.Request(base+p,headers=hdr,data=None if body is None else json.dumps(body).encode(),method=method)
              with urllib.request.urlopen(q,timeout=30) as r:x=json.load(r)
              if not x.get('success'): raise SystemExit('Cloudflare read failed')
              return x.get('result') or []
          d=[x for x in call(f'/accounts/{aid}/workers/domains') if x.get('hostname')==os.environ['HOSTNAME']]
          if len(d)!=1 or d[0].get('service')!=os.environ['EDGE_WORKER']: raise SystemExit('domain readback')
          db=[x for x in call(f'/accounts/{aid}/d1/database?name=mft-axiom-prod') if x.get('name')=='mft-axiom-prod']
          if len(db)!=1: raise SystemExit('D1 readback')
          sql="SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY name;"
          res=call(f"/accounts/{aid}/d1/database/{db[0]['uuid']}/query",'POST',{'sql':sql}); rr=[]
          for p in res: rr += p.get('results') or []
          tables=sorted(x['name'] for x in rr); expected=['api_keys','billing_subscriptions','customers','usage_buckets','usage_events','webhook_events']
          if tables!=expected: raise SystemExit('D1 tables '+repr(tables))
          found=[]
          for rs in call(f'/zones/{zid}/rulesets'):
              if not rs.get('id'): continue
              det=call(f"/zones/{zid}/rulesets/{rs['id']}")
              if isinstance(det,dict):
                  found += [r for r in det.get('rules',[]) if r.get('ref')=='mft_axiom_stage_machine_transport']
          if len(found)!=1 or found[0].get('expression')!='http.host eq "axiom-stage.mftintelligence.com"' or found[0].get('enabled') is not True: raise SystemExit('security rule readback')
          out={'schema':'musitu.axiom.modal_stage_domain_final.v2','hostname':os.environ['HOSTNAME'],'service':os.environ['EDGE_WORKER'],'build':os.environ['BUILD_ID'],'compute_host':'Modal','modal_app':'mft-axiom-v3-modal-staging','d1':'mft-axiom-prod','d1_tables':tables,'operation_count':74,'health':'PASS','unauthorized_compute':'401_PASS','authenticated_compute':'PASS_NUMERIC_42_HIGH_PRECISION','signed_receipt':'PASS_HMAC_SHA256','security_rule':'SCOPED_UNCHANGED_PASS','billing':'NOT_CONFIGURED','wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED','gate':'STAGING_MODAL_COMPUTE_ACTIVE_VERIFIED'}
          raw=json.dumps(out,sort_keys=True,separators=(',',':')).encode();out['evidence_sha256']=hashlib.sha256(raw).hexdigest();pathlib.Path('stage-modal-final-v2.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print('STAGING_MODAL_COMPUTE_ACTIVE_VERIFIED')
          PY
          sha256sum stage-modal-final-v2.json /tmp/h.json /tmp/c.json > stage-modal-final-v2.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-modal-stage-domain-final-v2
          path: |
            stage-modal-final-v2.json
            stage-modal-final-v2.sha256
          retention-days: 30
          if-no-files-found: error
