name: MUSITU Axiom Stage Protocol Cutover V5
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/axiom-modal-stage-domain-auth-final-v2.yml']
permissions:
  contents: read
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      HOSTNAME: axiom-stage.mftintelligence.com
      EDGE_WORKER: musitu-axiom-modal-edge-stage
      BACKEND_WORKER: mft-axiom-modal-edge-stage
      ADAPTER_WORKER: mft-axiom-modal-adapter
      MUSITU_D1: musitu-axiom-prod
      MUSITU_MODAL_URL: https://evansmusitu--musitu-axiom-v3-modal-staging-axiom-kernel.modal.run
      BUILD_ID: MFT-AXIOM-V3-FULL-SELF-CONTAINED-20260904
      PATCH_SHA: e0bf20748acbc47d1696b4678022580f0a4b787398c18d4d8cd1cea717ab7703
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Precondition MUSITU infrastructure and resolve D1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.parse,urllib.request,pathlib
          base='https://api.cloudflare.com/client/v4';aid=os.environ['ACCOUNT_ID'];h={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_API_KEY']}
          def get(p):
              q=urllib.request.Request(base+p,headers=h)
              with urllib.request.urlopen(q,timeout=30) as r:x=json.load(r)
              if not x.get('success'):raise SystemExit('Cloudflare read failed')
              return x.get('result') or []
          ds=[d for d in get(f'/accounts/{aid}/workers/domains') if d.get('hostname')==os.environ['HOSTNAME']]
          if len(ds)!=1 or ds[0].get('service')!=os.environ['EDGE_WORKER']:raise SystemExit('MUSITU public edge precondition')
          d1=[x for x in get(f'/accounts/{aid}/d1/database?name='+urllib.parse.quote(os.environ['MUSITU_D1'])) if x.get('name')==os.environ['MUSITU_D1']]
          if len(d1)!=1:raise SystemExit('MUSITU D1 resolution')
          d1id=d1[0].get('uuid') or d1[0].get('id');pathlib.Path('/tmp/musitu-d1-id').write_text(d1id)
          st=get(f'/accounts/{aid}/workers/scripts/{os.environ["BACKEND_WORKER"]}/settings');bs=st.get('bindings',[]) if isinstance(st,dict) else []
          names={b.get('name') for b in bs if isinstance(b,dict)}
          if not {'AXIOM_DB','AXIOM_KERNEL','MFT_CONTROL_SECRET','MFT_RECEIPT_SECRET'}.issubset(names):raise SystemExit('legacy protocol binding precondition')
          dbb=[b for b in bs if b.get('name')=='AXIOM_DB'];kb=[b for b in bs if b.get('name')=='AXIOM_KERNEL']
          if len(dbb)!=1 or dbb[0].get('id')!=d1id:raise SystemExit('MUSITU D1 not live')
          if len(kb)!=1 or kb[0].get('service')!=os.environ['ADAPTER_WORKER']:raise SystemExit('adapter binding drift')
          ast=get(f'/accounts/{aid}/workers/scripts/{os.environ["ADAPTER_WORKER"]}/settings');ab=ast.get('bindings',[]) if isinstance(ast,dict) else []
          mb=[b for b in ab if b.get('name')=='MODAL_BASE_URL']
          if len(mb)!=1 or mb[0].get('text')!=os.environ['MUSITU_MODAL_URL']:raise SystemExit('MUSITU Modal not live')
          print('musitu_infrastructure_precondition=PASS')
          PY
      - name: Reconstruct sealed Worker and build legacy plus MUSITU protocol variants
        shell: bash
        run: |
          set -euo pipefail
          P=deploy_payload/runtime_min
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > runtime.enc.b64
          base64 -d runtime.enc.b64 > runtime.tar.gz.enc
          test "$(sha256sum runtime.tar.gz.enc|awk '{print $1}')" = b82448d6b4b34b302748815af976b535d69922c197d4b7a9056fc2f91a9e12cf
          python - <<'PY'
          import hashlib,hmac,os
          b=open('runtime.tar.gz.enc','rb').read();g=hmac.new(os.environ['CLOUDFLARE_GLOBAL_API_KEY'].encode(),b,hashlib.sha256).hexdigest()
          if not hmac.compare_digest(g,'1a3193d4f3271d61d151e6ebd7cf4576d8ab86c2e79b84eff4ad0f635fe7ab47'):raise SystemExit('ciphertext HMAC mismatch')
          PY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in runtime.tar.gz.enc -out runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          test "$(sha256sum runtime.tar.gz|awk '{print $1}')" = b4d5a0266446523969a619f5e9bb5a04d9b815c78a2ab82ed046ef5e23d53663
          mkdir runtime && tar -xzf runtime.tar.gz -C runtime
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path('runtime/worker/src')
          # Apply already-proven service-binding compatibility patch first.
          p=root/'index.js';s=p.read_text();token='kernel.fetch(new Request('
          if s.count(token)!=1:raise SystemExit('request-wrapper target count mismatch')
          pos=s.index(token);o=pos+len('kernel.fetch(new Request')
          def match(src,start):
              d=0;q=None;e=False
              for i in range(start,len(src)):
                  c=src[i]
                  if q:
                      if e:e=False
                      elif c=='\\':e=True
                      elif c==q:q=None
                      continue
                  if c in "'\"`":q=c;continue
                  if c=='(':d+=1
                  elif c==')':
                      d-=1
                      if d==0:return i
              raise SystemExit('unbalanced Request wrapper')
          end=match(s,o);s=s[:pos+len('kernel.fetch(')]+s[pos+len('kernel.fetch(new Request('):end]+s[end+1:]
          old="if(typeof binding.fetch==='function'&&typeof binding.getByName!=='function'&&typeof binding.idFromName!=='function')return binding;"
          if s.count(old)!=1:raise SystemExit('selector target count mismatch')
          s=s.replace(old,"if(typeof binding.fetch==='function')return binding;")
          p.write_text(s)
          # Normalize runtime build identity without changing immutable historical evidence outside runtime.
          c=root/'catalog.js';x=c.read_text();vals=['MFT-AXIOM-V3-SELF-CONTAINED-20260904','MFT-AXIOM-V3-RUNTIME-RECONSTRUCTION-20260904','MFT-AXIOM-V3-FULL-SELF-CONTAINED-20260904'];f=[v for v in vals if v in x]
          if len(f)!=1:raise SystemExit('catalog build identity mismatch')
          c.write_text(x.replace(f[0],os.environ['BUILD_ID']))
          # Preserve a rollback tree before protocol renaming.
          rollback=Path('/tmp/legacy-src');rollback.mkdir(parents=True,exist_ok=True)
          for q in root.rglob('*.js'):
              rel=q.relative_to(root);dest=rollback/rel;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_text(q.read_text())
          mapping={
            'MFT_CONTROL_SECRET':'MUSITU_CONTROL_SECRET',
            'MFT_RECEIPT_SECRET':'MUSITU_RECEIPT_SECRET',
            'x-mft-control':'x-musitu-control',
            'x-mft-request-id':'x-musitu-request-id',
            'x-mft-axiom-version':'x-musitu-axiom-version',
            'mft-internal':'musitu-internal',
          }
          expected={'MFT_CONTROL_SECRET':4,'MFT_RECEIPT_SECRET':2,'x-mft-control':2,'x-mft-request-id':1,'x-mft-axiom-version':1,'mft-internal':3}
          counts={k:sum(q.read_text().count(k) for q in root.rglob('*.js')) for k in mapping}
          if counts!=expected:raise SystemExit('protocol source count mismatch '+repr(counts))
          for q in root.rglob('*.js'):
              t=q.read_text()
              for a,b in mapping.items():t=t.replace(a,b)
              q.write_text(t)
          remaining={k:sum(q.read_text().count(k) for q in root.rglob('*.js')) for k in mapping}
          if any(remaining.values()):raise SystemExit('legacy protocol symbol remained '+repr(remaining))
          hashes={str(q.relative_to(root)):hashlib.sha256(q.read_bytes()).hexdigest() for q in sorted(root.rglob('*.js'))}
          json.dump({'schema':'musitu.axiom.protocol_transform.v1','source_build':os.environ['BUILD_ID'],'replacement_counts':counts,'legacy_protocol_remaining':remaining,'transformed_file_sha256':hashes,'plaintext_source_committed':False},open('/tmp/protocol-transform.json','w'),indent=2,sort_keys=True)
          PY
          npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@4.129.0 esbuild@0.25.9 >/dev/null
          mkdir -p /tmp/protocol
          npx esbuild runtime/worker/src/index.js --bundle --format=esm --platform=browser --target=es2022 --outfile=/tmp/protocol/worker-musitu.js --log-level=warning
          npx esbuild /tmp/legacy-src/index.js --bundle --format=esm --platform=browser --target=es2022 --outfile=/tmp/protocol/worker-legacy.js --log-level=warning
          node --check /tmp/protocol/worker-musitu.js; node --check /tmp/protocol/worker-legacy.js
      - name: Install dual cryptographic bindings before source cutover
        shell: bash
        run: |
          set -euo pipefail
          C="$(openssl rand -hex 32)";R="$(openssl rand -hex 32)";echo "::add-mask::$C";echo "::add-mask::$R";printf '%s' "$C">/tmp/control;printf '%s' "$R">/tmp/receipt
          for k in MFT_CONTROL_SECRET MUSITU_CONTROL_SECRET;do printf '%s' "$C" | npx wrangler secret put "$k" --name "$BACKEND_WORKER" >/dev/null;done
          for k in MFT_RECEIPT_SECRET MUSITU_RECEIPT_SECRET;do printf '%s' "$R" | npx wrangler secret put "$k" --name "$BACKEND_WORKER" >/dev/null;done
          echo dual_secret_binding_transition=PASS
      - name: Deploy MUSITU protocol Worker with rollback armed
        shell: bash
        run: |
          set -euo pipefail
          D1_ID="$(cat /tmp/musitu-d1-id)"
          make_config(){
            local main="$1"
            MAIN="$main" D1_ID="$D1_ID" python - <<'PY'
          import json,os
          json.dump({'name':os.environ['BACKEND_WORKER'],'main':os.environ['MAIN'],'compatibility_date':'2026-09-04','workers_dev':True,'d1_databases':[{'binding':'AXIOM_DB','database_name':os.environ['MUSITU_D1'],'database_id':os.environ['D1_ID']}],'services':[{'binding':'AXIOM_KERNEL','service':os.environ['ADAPTER_WORKER']}]},open('/tmp/protocol/wrangler.json','w'),indent=2)
          PY
          }
          make_config worker-musitu.js
          (cd /tmp/protocol && npx wrangler deploy --config wrangler.json >/tmp/protocol-deploy.log 2>&1) || { tail -120 /tmp/protocol-deploy.log; exit 1; }
          echo musitu_protocol_worker_deployed=PASS
      - name: Prove MUSITU-only protocol and retire old secret bindings with rollback
        shell: bash
        run: |
          set -euo pipefail
          D1_ID="$(cat /tmp/musitu-d1-id)"
          rollback(){
            echo 'protocol verification failed; restoring legacy protocol'
            C="$(cat /tmp/control)";R="$(cat /tmp/receipt)"
            printf '%s' "$C" | npx wrangler secret put MFT_CONTROL_SECRET --name "$BACKEND_WORKER" >/dev/null || true
            printf '%s' "$R" | npx wrangler secret put MFT_RECEIPT_SECRET --name "$BACKEND_WORKER" >/dev/null || true
            MAIN=worker-legacy.js D1_ID="$D1_ID" python - <<'PY'
          import json,os
          json.dump({'name':os.environ['BACKEND_WORKER'],'main':os.environ['MAIN'],'compatibility_date':'2026-09-04','workers_dev':True,'d1_databases':[{'binding':'AXIOM_DB','database_name':os.environ['MUSITU_D1'],'database_id':os.environ['D1_ID']}],'services':[{'binding':'AXIOM_KERNEL','service':os.environ['ADAPTER_WORKER']}]},open('/tmp/protocol/wrangler.json','w'),indent=2)
          PY
            (cd /tmp/protocol && npx wrangler deploy --config wrangler.json >/tmp/protocol-rollback.log 2>&1) || true
            echo legacy_protocol_rollback_attempted=PASS
          }
          trap 'rollback' ERR
          BASE="https://${HOSTNAME}";C="$(cat /tmp/control)"
          ready=0
          for i in $(seq 1 30);do code="$(curl -sS --max-time 30 -o /tmp/h.json -w '%{http_code}' "$BASE/health"||true)";[ "$code" = 200 ]&&ready=1&&break;sleep 2;done
          test "$ready" = 1
          test "$(curl -sS -o /tmp/u.json -w '%{http_code}' -X POST "$BASE/v1/compute" -H 'content-type: application/json' --data '{"operation":"arithmetic.evaluate","args":{"expression":"40+2"}}')" = 401
          code="$(curl -sS --max-time 90 -o /tmp/c.json -w '%{http_code}' -X POST "$BASE/v1/compute" -H "x-musitu-control: $C" -H 'x-musitu-request-id: musitu-protocol-cutover-1' -H 'x-musitu-axiom-version: 3.0.0' -H 'content-type: application/json' --data '{"operation":"arithmetic.evaluate","args":{"expression":"40+2"},"verify":true}')"
          test "$code" = 200
          python - <<'PY'
          import json,os
          from decimal import Decimal,InvalidOperation
          h=json.load(open('/tmp/h.json'));x=json.load(open('/tmp/c.json'))
          if h.get('ok') is not True or h.get('build_id')!=os.environ['BUILD_ID'] or int(h.get('operation_count') or -1)!=74:raise SystemExit('health regression')
          if x.get('ok') is not True:raise SystemExit('MUSITU compute not ok')
          try:v=Decimal(str(x.get('result')))
          except InvalidOperation:raise SystemExit('result not numeric')
          if v!=Decimal(42):raise SystemExit('expected numeric 42')
          r=x.get('receipt') or {}
          if r.get('signature_alg')!='HMAC-SHA256' or not all(r.get(k) for k in ('signature','request_sha256','result_sha256')):raise SystemExit('receipt invalid')
          PY
          # Old control header must no longer authenticate even while the old secret binding still exists.
          legacy_code="$(curl -sS -o /tmp/legacy.json -w '%{http_code}' -X POST "$BASE/v1/compute" -H "x-mft-control: $C" -H 'content-type: application/json' --data '{"operation":"arithmetic.evaluate","args":{"expression":"40+2"}}')"
          test "$legacy_code" = 401
          # MUSITU internal principal must reach governed admin validation, not 403 and not create anything.
          admin_code=000
          for i in $(seq 1 8);do sleep 2;admin_code="$(curl -sS -o /tmp/admin.json -w '%{http_code}' -X POST "$BASE/v1/admin/customers" -H "x-musitu-control: $C" -H 'x-musitu-axiom-version: 3.0.0' -H 'content-type: application/json' --data '{}')";[ "$admin_code" != 403 ]&&break;done
          if [ "$admin_code" != 400 ] && [ "$admin_code" != 422 ];then cat /tmp/admin.json;exit 1;fi
          printf '{"MFT_CONTROL_SECRET":null,"MFT_RECEIPT_SECRET":null}' | npx wrangler secret bulk --name "$BACKEND_WORKER" >/dev/null
          # Re-prove MUSITU auth after old secret deletion.
          test "$(curl -sS --max-time 90 -o /tmp/c2.json -w '%{http_code}' -X POST "$BASE/v1/compute" -H "x-musitu-control: $C" -H 'x-musitu-request-id: musitu-protocol-cutover-2' -H 'x-musitu-axiom-version: 3.0.0' -H 'content-type: application/json' --data '{"operation":"arithmetic.evaluate","args":{"expression":"40+2"},"verify":true}')" = 200
          python - <<'PY'
          import json,os,urllib.request
          from decimal import Decimal
          x=json.load(open('/tmp/c2.json'))
          if x.get('ok') is not True or Decimal(str(x.get('result'))) != Decimal(42):raise SystemExit('post-retirement MUSITU compute failed')
          base='https://api.cloudflare.com/client/v4';h={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_API_KEY']}
          q=urllib.request.Request(f"{base}/accounts/{os.environ['ACCOUNT_ID']}/workers/scripts/{os.environ['BACKEND_WORKER']}/settings",headers=h)
          with urllib.request.urlopen(q,timeout=30) as r:s=json.load(r)
          names={b.get('name') for b in (s.get('result') or {}).get('bindings',[]) if isinstance(b,dict)}
          if not {'MUSITU_CONTROL_SECRET','MUSITU_RECEIPT_SECRET','AXIOM_DB','AXIOM_KERNEL'}.issubset(names):raise SystemExit('MUSITU binding readback failed')
          if 'MFT_CONTROL_SECRET' in names or 'MFT_RECEIPT_SECRET' in names:raise SystemExit('legacy secret bindings still present')
          PY
          trap - ERR
          echo MUSITU_PROTOCOL_ONLY_ACTIVE=PASS
      - name: Seal protocol cutover evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          transform=json.load(open('/tmp/protocol-transform.json'))
          out={'schema':'musitu.axiom.protocol_cutover.v1','hostname':os.environ['HOSTNAME'],'public_edge':os.environ['EDGE_WORKER'],'protected_backend':os.environ['BACKEND_WORKER'],'d1':'musitu-axiom-prod','modal_app':'musitu-axiom-v3-modal-staging','build_id':os.environ['BUILD_ID'],'protocol_transform':transform,'active_control_secret':'MUSITU_CONTROL_SECRET','active_receipt_secret':'MUSITU_RECEIPT_SECRET','active_control_header':'x-musitu-control','active_request_id_header':'x-musitu-request-id','active_version_header':'x-musitu-axiom-version','active_internal_principal':'musitu-internal','legacy_control_header_rejected_401':True,'legacy_secret_bindings_removed':True,'admin_internal_validation':'PASS','authenticated_compute_42_high_precision':'PASS','signed_receipt_hmac_sha256':'PASS','operation_count':74,'legacy_worker_handles_retained_for_next_cutover':True,'plaintext_source_committed':False,'billing':'NOT_CONFIGURED','wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED','gate':'MUSITU_PROTOCOL_ONLY_ACTIVE_VERIFIED'}
          raw=json.dumps(out,sort_keys=True,separators=(',',':')).encode();out['evidence_sha256']=hashlib.sha256(raw).hexdigest();pathlib.Path('musitu-protocol-cutover.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print('MUSITU_PROTOCOL_ONLY_ACTIVE_VERIFIED')
          PY
          sha256sum musitu-protocol-cutover.json > musitu-protocol-cutover.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-protocol-cutover
          path: |
            musitu-protocol-cutover.json
            musitu-protocol-cutover.sha256
          retention-days: 30
          if-no-files-found: error
