name: MUSITU Axiom Modal Stage Domain Promotion V2
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/axiom-modal-stage-domain-promotion-v2.yml']
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      ZONE_NAME: mftintelligence.com
      HOSTNAME: axiom-stage.mftintelligence.com
      OLD_SERVICE: mft-axiom-bootstrap
      NEW_SERVICE: mft-axiom-modal-edge-stage
      BUILD_ID: MFT-AXIOM-V3-FULL-SELF-CONTAINED-20260904
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Promote with exact old-target precondition and rollback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,time,urllib.request,urllib.error,pathlib
          base='https://api.cloudflare.com/client/v4'; aid=os.environ['ACCOUNT_ID']; host=os.environ['HOSTNAME']
          hdr={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'Content-Type':'application/json'}
          def call(path,method='GET',body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(base+path,headers=hdr,data=data,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: raw=r.read(); code=r.status
              except urllib.error.HTTPError as e: raw=e.read(); code=e.code
              if not 200<=code<300: raise RuntimeError(f'Cloudflare HTTP {code}: {raw[:400]!r}')
              x=json.loads(raw) if raw else {}
              if isinstance(x,dict) and x.get('success') is False: raise RuntimeError('Cloudflare success=false')
              return x
          def domains(): return call(f'/accounts/{aid}/workers/domains').get('result') or []
          def row():
              r=[x for x in domains() if x.get('hostname')==host]
              if len(r)!=1: raise RuntimeError(f'expected one staging custom domain, got {len(r)}')
              return r[0]
          def attach(service):
              return call(f'/accounts/{aid}/workers/domains','PUT',{
                'hostname':host,'service':service,'zone_id':os.environ['ZONE_ID'],'zone_name':os.environ['ZONE_NAME'],
                'override_existing_origin':True
              })
          before=row()
          if before.get('service')!=os.environ['OLD_SERVICE']: raise RuntimeError('old-service precondition failed: '+repr(before.get('service')))
          promoted=False
          try:
              attach(os.environ['NEW_SERVICE']); promoted=True
              after=row()
              if after.get('service')!=os.environ['NEW_SERVICE']: raise RuntimeError('domain readback did not change to Modal edge')
              print('domain_override_and_readback=PASS')
              expected=os.environ['BUILD_ID']; last=None
              for _ in range(45):
                  try:
                      q=urllib.request.Request('https://'+host+'/health')
                      with urllib.request.urlopen(q,timeout=20) as r: body=r.read(); code=r.status
                      h=json.loads(body)
                      if code==200 and h.get('ok') is True and h.get('status')=='READY' and h.get('version')=='3.0.0' and h.get('build_id')==expected and h.get('operation_count')==74 and h.get('state')=='D1' and h.get('wolfram_parity')=='NOT_CERTIFIED' and h.get('superiority')=='NOT_CERTIFIED':
                          pathlib.Path('promoted-health.json').write_bytes(body); break
                      last=repr(h)
                  except Exception as e: last=repr(e)
                  time.sleep(2)
              else: raise RuntimeError('canonical health not reached: '+str(last))
              with urllib.request.urlopen('https://'+host+'/v1/tools',timeout=30) as r: tools=json.loads(r.read())
              if tools.get('operation_count')!=74 or len(tools.get('tools') or [])!=74: raise RuntimeError('74-tools gate failed')
              data=json.dumps({'operation':'arithmetic.evaluate','args':{'expression':'40+2'},'verify':True}).encode()
              q=urllib.request.Request('https://'+host+'/v1/compute',data=data,headers={'content-type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(q,timeout=30) as r: c=r.status
              except urllib.error.HTTPError as e: c=e.code; e.read()
              if c!=401: raise RuntimeError(f'unauthorized compute expected 401 got {c}')
              out={'schema':'musitu.axiom.modal_stage_domain_promotion.v2','hostname':host,'old_service':os.environ['OLD_SERVICE'],'new_service':os.environ['NEW_SERVICE'],'build':expected,'operation_count':74,'health':'PASS','unauthorized_compute':'401_PASS','billing':'NOT_CONFIGURED','wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED','gate':'CUSTOM_DOMAIN_PUBLIC_PASS_AUTHENTICATED_FINAL_GATE_PENDING'}
              pathlib.Path('promotion-v2.json').write_text(json.dumps(out,indent=2,sort_keys=True))
              print('CUSTOM_DOMAIN_PUBLIC_PASS')
          except Exception:
              if promoted:
                  attach(os.environ['OLD_SERVICE'])
                  rb=row()
                  if rb.get('service')!=os.environ['OLD_SERVICE']: raise RuntimeError('rollback readback failed')
                  print('rollback_to_bootstrap=PASS')
              raise
          PY
          sha256sum promotion-v2.json promoted-health.json > promotion-v2.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mft-axiom-modal-stage-domain-promotion-v2
          path: |
            promotion-v2.json
            promotion-v2.sha256
            promoted-health.json
          retention-days: 14
          if-no-files-found: error
