name: MUSITU Axiom D1 Live Cutover — QUARANTINED BY AR-02

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed at the AR-02 production boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'AR-02 QUARANTINE: this historical production D1 cutover path is disabled.'
          echo 'No Cloudflare credentials are loaded and no provider mutation is permitted.'
          echo 'The prior implementation remains preserved in Git history before the AR-02 release-surface recovery branch.'
          echo 'Reactivation requires a separately governed production-release design with least-privilege credentials, protected environment approval, immutable dependencies, staging/canary qualification, independent verification, rollback proof, and explicit S4 authority.'
          exit 1
