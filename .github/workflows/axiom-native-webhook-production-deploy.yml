name: MUSITU Axiom Native Webhook Production Deploy

on:
  push:
    branches:
      - support/axiom-global-support-ops-production-rollout-20261008
    paths:
      - .github/workflows/axiom-native-webhook-production-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' && github.event.before == '35fc3f0e12554b12d3470734d602814b3e6516fc'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 12
    env:
      CF_ACCOUNT: '93f395f5121954671f92fffa453d6b61'
      SUPPORT_DB: 'a525c8b6-9b44-413b-a219-46e419b71b12'
      WORKER_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
      D1_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exact release gate and regression
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'support/axiom-global-support-ops-production-rollout-20261008'
          test "${{ github.event.before }}" = '35fc3f0e12554b12d3470734d602814b3e6516fc'
          node --check support/global_ops.js
          node --check support/d1_case_store.js
          node --check support/worker.js
          node --test support/tests/native_webhook_delivery.test.mjs
          node --test support/tests/global_ops_schedule_persistence.test.mjs

      - name: Take D1 checkpoint and apply additive webhook schema
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const api='https://api.cloudflare.com/client/v4',account=process.env.CF_ACCOUNT,db=process.env.SUPPORT_DB,token=String(process.env.D1_TOKEN||'');
          const headers={authorization:'Bearer '+token,accept:'application/json','content-type':'application/json'};
          async function call(path,{method='GET',body}={}){
            const r=await fetch(api+path,{method,headers,...(body===undefined?{}:{body:JSON.stringify(body)})});
            const p=await r.json().catch(()=>({}));
            if(!r.ok||p?.success===false)throw new Error('D1 '+method+' '+path+' failed HTTP '+r.status);
            return p.result;
          }
          async function q(sql){
            const result=await call('/accounts/'+account+'/d1/database/'+db+'/query',{method:'POST',body:{sql}});
            const x=Array.isArray(result)?result[0]:result;return x?.results||[];
          }
          const before=(await q(`SELECT
            (SELECT COUNT(*) FROM support_cases) cases,
            (SELECT COUNT(*) FROM support_case_events) events,
            (SELECT COUNT(*) FROM support_case_messages) messages,
            (SELECT COUNT(*) FROM support_webhook_subscriptions) webhook_subscriptions,
            (SELECT COUNT(*) FROM support_webhook_outbox) webhook_outbox`))[0]||{};
          const bookmark=await call('/accounts/'+account+'/d1/database/'+db+'/time_travel/bookmark');
          const value=String(bookmark?.bookmark||'');
          if(!value)throw new Error('D1 Time Travel bookmark unavailable');
          await q(fs.readFileSync('support/schema.sql','utf8'));
          const after=(await q(`SELECT
            (SELECT COUNT(*) FROM support_cases) cases,
            (SELECT COUNT(*) FROM support_case_events) events,
            (SELECT COUNT(*) FROM support_case_messages) messages,
            (SELECT COUNT(*) FROM support_webhook_subscriptions) webhook_subscriptions,
            (SELECT COUNT(*) FROM support_webhook_outbox) webhook_outbox,
            (SELECT COUNT(*) FROM support_webhook_delivery_configs) webhook_delivery_configs`))[0]||{};
          for(const key of ['cases','events','messages','webhook_subscriptions','webhook_outbox']){
            if(Number(before[key]||0)!==Number(after[key]||0))throw new Error('D1 count drift during additive webhook migration: '+key);
          }
          const object=await q("SELECT name FROM sqlite_master WHERE type='table' AND name='support_webhook_delivery_configs'");
          if(object.length!==1)throw new Error('encrypted webhook delivery config table missing');
          console.log(JSON.stringify({
            gate:'MUSITU_AXIOM_NATIVE_WEBHOOK_D1_MIGRATION',
            status:'PASS',
            bookmark_sha256:createHash('sha256').update(value).digest('hex'),
            bookmark_value_recorded:false,
            migration:'ADDITIVE_ONLY',
            before:Object.fromEntries(Object.entries(before).map(([k,v])=>[k,Number(v||0)])),
            after:Object.fromEntries(Object.entries(after).map(([k,v])=>[k,Number(v||0)])),
            plaintext_endpoint_columns:false,
            plaintext_signing_secret_columns:false
          }));
          NODE

      - name: Build public Worker with native webhook sender
        shell: bash
        run: |
          set -euo pipefail
          npx --yes esbuild@0.25.11 support/app.js --bundle --format=esm --platform=browser --target=es2022 --outfile=.support-public-app.js
          node <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('support/index.html','utf8'),css=fs.readFileSync('support/styles.css','utf8'),robots=fs.readFileSync('support/robots.txt','utf8'),sitemap=fs.readFileSync('support/sitemap.xml','utf8'),app=fs.readFileSync('.support-public-app.js','utf8');
          const recoveryHtml=fs.readFileSync('support/recovery/index.html','utf8'),recoveryApp=fs.readFileSync('support/recovery/app.js','utf8'),statusHtml=fs.readFileSync('support/status/index.html','utf8'),statusApp=fs.readFileSync('support/status/app.js','utf8');
          fs.writeFileSync('.support-public-entry.mjs',[
            "import support,{handleOperatorRequest} from './support/worker.js';",
            "const HTML="+JSON.stringify(html)+";const CSS="+JSON.stringify(css)+";const ROBOTS="+JSON.stringify(robots)+";const SITEMAP="+JSON.stringify(sitemap)+";const APP="+JSON.stringify(app)+";",
            "const RECOVERY_HTML="+JSON.stringify(recoveryHtml)+";const RECOVERY_APP="+JSON.stringify(recoveryApp)+";const STATUS_HTML="+JSON.stringify(statusHtml)+";const STATUS_APP="+JSON.stringify(statusApp)+";",
            "const H=Object.freeze({'content-security-policy':\"default-src 'self'; connect-src 'self' https://challenges.cloudflare.com; img-src 'self' data:; style-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'\",'referrer-policy':'no-referrer','permissions-policy':'camera=(), microphone=(), geolocation=(), payment=()','x-content-type-options':'nosniff','cross-origin-opener-policy':'same-origin','cross-origin-resource-policy':'same-origin','cache-control':'no-store'});",
            "const RH=Object.freeze({...H,'x-robots-tag':'noindex, nofollow, noarchive','content-security-policy':\"default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'\"});",
            "function asset(body,type,headers=H){return new Response(body,{status:200,headers:{...headers,'content-type':type}})}",
            "export default {async scheduled(controller,env,ctx){return support.scheduled(controller,env,ctx);},async email(message,env,ctx){return support.email(message,env,ctx);},async fetch(request,env,ctx){const u=new URL(request.url);",
            "if(u.pathname.startsWith('/api/v1/operator/')) return handleOperatorRequest(request,env);",
            "if(request.method==='GET'&&(u.pathname==='/recovery/'||u.pathname==='/recovery/index.html')) return asset(RECOVERY_HTML,'text/html; charset=utf-8',RH);",
            "if(request.method==='GET'&&u.pathname==='/recovery/app.js') return asset(RECOVERY_APP,'text/javascript; charset=utf-8',RH);",
            "if(request.method==='GET'&&(u.pathname==='/status/'||u.pathname==='/status/index.html')) return asset(STATUS_HTML,'text/html; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/status/app.js') return asset(STATUS_APP,'text/javascript; charset=utf-8');",
            "if(request.method==='GET'&&(u.pathname==='/'||u.pathname==='/index.html')) return asset(HTML,'text/html; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/styles.css') return asset(CSS,'text/css; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/robots.txt') return asset(ROBOTS,'text/plain; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/sitemap.xml') return asset(SITEMAP,'application/xml; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/app.js') return asset(APP,'text/javascript; charset=utf-8');",
            "return support.fetch(request,env,ctx);}};"
          ].join('\n'),{mode:0o600});
          NODE
          npx --yes esbuild@0.25.11 .support-public-entry.mjs --bundle --format=esm --platform=browser --target=es2022 --outfile=.support-public-bundle.mjs
          grep -q 'x-musitu-signature' .support-public-bundle.mjs
          grep -q 'support-webhook-delivery-config' .support-public-bundle.mjs

      - name: Deploy native webhook Worker and reassert scheduler
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {buildWorkerMultipart} from './support/scripts/provision_cloudflare_control_plane.mjs';
          const api='https://api.cloudflare.com/client/v4',account=process.env.CF_ACCOUNT,token=String(process.env.WORKER_TOKEN||'');
          const h={authorization:'Bearer '+token,accept:'application/json'};
          async function call(path,{method='GET',body,rawBody,contentType}={}){
            const r=await fetch(api+path,{method,headers:{...h,...(body===undefined?{}:{'content-type':'application/json'}),...(contentType?{'content-type':contentType}:{})},...(rawBody!==undefined?{body:rawBody}:body===undefined?{}:{body:JSON.stringify(body)})});
            const p=await r.json().catch(()=>({}));
            if(!r.ok||p?.success===false)throw new Error('Cloudflare '+method+' '+path+' failed HTTP '+r.status);
            return p.result;
          }
          const name='musitu-axiom-support';
          const [settings,secrets]=await Promise.all([
            call('/accounts/'+account+'/workers/scripts/'+name+'/settings'),
            call('/accounts/'+account+'/workers/scripts/'+name+'/secrets')
          ]);
          const current=Array.isArray(settings?.bindings)?settings.bindings:[],secretNames=new Set((Array.isArray(secrets)?secrets:[]).map(x=>String(x?.name||'')));
          const bindings=[];
          for(const b of current){
            const n=String(b?.name||'');if(!n)continue;
            if(secretNames.has(n)||b?.type==='secret_text')bindings.push({type:'inherit',name:n,version_id:'latest'});
            else bindings.push(b);
          }
          const multipart=buildWorkerMultipart(fs.readFileSync('.support-public-bundle.mjs'),{
            main_module:'index.mjs',compatibility_date:'2026-10-08',bindings,
            annotations:{'workers/message':'MUSITU Axiom native encrypted enterprise webhooks'}
          },'----MUSITUNativeWebhook');
          await call('/accounts/'+account+'/workers/scripts/'+name+'?bindings_inherit=strict',{method:'PUT',rawBody:multipart.body,contentType:'multipart/form-data; boundary='+multipart.boundary});
          await call('/accounts/'+account+'/workers/scripts/'+name+'/subdomain',{method:'POST',body:{enabled:false,previews_enabled:false}});
          await call('/accounts/'+account+'/workers/scripts/'+name+'/schedules',{method:'PUT',body:[{cron:'*/5 * * * *'}]});
          const [after,schedules,subdomain]=await Promise.all([
            call('/accounts/'+account+'/workers/scripts/'+name+'/settings'),
            call('/accounts/'+account+'/workers/scripts/'+name+'/schedules'),
            call('/accounts/'+account+'/workers/scripts/'+name+'/subdomain')
          ]);
          const bs=Array.isArray(after?.bindings)?after.bindings:[];
          for(const required of ['SUPPORT_DB','SUPPORT_DATA_KEY_B64','SUPPORT_ATTACHMENTS','SUPPORT_INTAKE_RATE_LIMITER','SUPPORT_OPS_EMAIL','SUPPORT_OPS_EMAIL_READY'])if(!bs.some(x=>x?.name===required))throw new Error('required binding drift: '+required);
          const ready=bs.find(x=>x?.name==='SUPPORT_OPS_EMAIL_READY');
          if(String(ready?.text||'')!=='false')throw new Error('operator email readiness unexpectedly enabled');
          const rows=Array.isArray(schedules?.schedules)?schedules.schedules:Array.isArray(schedules)?schedules:[];
          if(rows.length!==1||String(rows[0]?.cron||'')!=='*/5 * * * *')throw new Error('support cron missing after native webhook deploy');
          if(subdomain?.enabled===true||subdomain?.previews_enabled===true)throw new Error('workers.dev/previews enabled');
          console.log(JSON.stringify({
            gate:'MUSITU_AXIOM_NATIVE_WEBHOOK_WORKER_DEPLOY',
            status:'PASS',
            encrypted_config_schema:true,
            native_hmac_sender:true,
            operator_email_ready:false,
            cron:'*/5 * * * *',
            workers_dev:false,
            previews:false,
            secret_values_read:false
          }));
          NODE

      - name: Cleanup
        if: always()
        run: rm -f .support-public-app.js .support-public-entry.mjs .support-public-bundle.mjs
