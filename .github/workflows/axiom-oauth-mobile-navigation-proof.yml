name: MUSITU Axiom OAuth Mobile Navigation Proof

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/axiom-oauth-mobile-navigation-proof.yml'
      - 'auth/musitu_axiom_oauth_worker.mjs'

permissions:
  contents: read

jobs:
  prove-mobile-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ISSUER: https://auth.mftintelligence.com
      RESOURCE: https://mcp.mftintelligence.com
      MCP_BASE: https://mcp.mftintelligence.com
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      D1_UUID: 504029cc-f9a5-495e-818f-63c6144b4ea4
      REVIEWER_KEY: ${{ secrets.OPENAI_REVIEWER_ACCOUNT_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
    steps:
      - name: Prove POST 200 callback document, exact ChatGPT handoff, token exchange, and MCP execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, html, json, os, re, secrets, urllib.error, urllib.parse, urllib.request, uuid

          issuer=os.environ['ISSUER']; resource=os.environ['RESOURCE']; mcp=os.environ['MCP_BASE']
          reviewer=os.environ.get('REVIEWER_KEY','')
          if len(reviewer.strip()) < 48:
              raise RuntimeError('reviewer credential unavailable')
          print('::add-mask::'+reviewer)

          def raw(url,method='GET',headers=None,body=None,follow=True):
              req=urllib.request.Request(url,headers=dict(headers or {}),method=method,data=body)
              if follow:
                  opener=urllib.request.build_opener()
              else:
                  class NoRedirect(urllib.request.HTTPRedirectHandler):
                      def redirect_request(self,req,fp,code,msg,headers,newurl): return None
                  opener=urllib.request.build_opener(NoRedirect())
              try:
                  with opener.open(req,timeout=45) as r:return r.status,r.headers,r.read()
              except urllib.error.HTTPError as e:return e.code,e.headers,e.read()

          def jreq(url,method='GET',obj=None,headers=None):
              h={'Accept':'application/json','User-Agent':'MUSITU-Axiom-Mobile-Navigation-Proof/1.0'}
              if headers:h.update(headers)
              body=None
              if obj is not None:
                  h['Content-Type']='application/json';body=json.dumps(obj,separators=(',',':')).encode()
              c,hh,b=raw(url,method,h,body)
              try:o=json.loads(b or b'{}')
              except Exception:o={}
              return c,hh,o,b

          def form(url,data,headers=None,follow=False):
              h={'Accept':'text/html','Content-Type':'application/x-www-form-urlencoded','User-Agent':'MUSITU-Axiom-Mobile-Navigation-Proof/1.0'}
              if headers:h.update(headers)
              return raw(url,'POST',h,urllib.parse.urlencode(data).encode(),follow)

          def b64u(b):return base64.urlsafe_b64encode(b).rstrip(b'=').decode()

          cfh={
              'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],
              'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],
              'Content-Type':'application/json','Accept':'application/json',
              'User-Agent':'MUSITU-Axiom-Mobile-Navigation-Proof/1.0',
          }
          def d1(sql,params=None):
              obj={'sql':sql}
              if params is not None:obj['params']=params
              req=urllib.request.Request(os.environ['CF_API']+f"/accounts/{os.environ['ACCOUNT_ID']}/d1/database/{os.environ['D1_UUID']}/query",headers=cfh,data=json.dumps(obj,separators=(',',':')).encode(),method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=45) as r: rawb=r.read(); code=r.status
              except urllib.error.HTTPError as e: rawb=e.read(); code=e.code
              if not 200<=code<300: raise RuntimeError('D1 HTTP '+str(code))
              out=json.loads(rawb or b'{}')
              if out.get('success') is False: raise RuntimeError('D1 success=false')
              rows=[]
              for chunk in out.get('result') or []:
                  if chunk.get('success') is not True: raise RuntimeError('D1 statement failed')
                  rows.extend(chunk.get('results') or [])
              return rows

          callback='https://chatgpt.com/connector/oauth/musitu-mobile-navigation-proof'
          verifier=b64u(secrets.token_bytes(48)); challenge=b64u(hashlib.sha256(verifier.encode()).digest()); state='proof_'+secrets.token_urlsafe(32)
          print('::add-mask::'+verifier); print('::add-mask::'+state)
          client_id=''; access=''; code=''
          try:
              rc,_,reg,_=jreq(issuer+'/oauth/register','POST',{
                  'redirect_uris':[callback],
                  'client_name':'MUSITU Mobile Navigation Proof',
                  'token_endpoint_auth_method':'none',
                  'grant_types':['authorization_code','refresh_token'],
                  'response_types':['code'],
              })
              if rc!=201 or not reg.get('client_id'): raise RuntimeError('DCR failed HTTP '+str(rc))
              client_id=str(reg['client_id']); print('::add-mask::'+client_id)

              q=urllib.parse.urlencode({
                  'response_type':'code','client_id':client_id,'redirect_uri':callback,
                  'scope':'axiom.execute','state':state,'code_challenge':challenge,
                  'code_challenge_method':'S256','resource':resource,
              })
              ac,ah,ab=raw(issuer+'/oauth/authorize?'+q,headers={'Accept':'text/html','User-Agent':'MUSITU-Axiom-Mobile-Navigation-Proof/1.0'})
              if ac!=200: raise RuntimeError('authorize GET HTTP '+str(ac))
              page=ab.decode('utf-8','replace')
              fm=re.search(r'name="flow_id" value="([^"]+)"',page); nm=re.search(r'name="flow_nonce" value="([^"]+)"',page)
              if not fm or not nm: raise RuntimeError('flow id/nonce missing')
              flow_id=fm.group(1); flow_nonce=nm.group(1); print('::add-mask::'+flow_id); print('::add-mask::'+flow_nonce)

              pc,ph,pb=form(issuer+'/oauth/authorize',{
                  'flow_id':flow_id,'flow_nonce':flow_nonce,'musitu_account_key':reviewer,
              },follow=False)
              if pc!=200: raise RuntimeError('credential POST must return 200 navigation document, got '+str(pc))
              if ph.get('Location'): raise RuntimeError('credential POST still depends on HTTP redirect')
              nav=pb.decode('utf-8','replace')
              m=re.search(r'data-oauth-callback="([^"]+)"',nav)
              if not m: raise RuntimeError('callback data attribute missing')
              target=html.unescape(m.group(1)); u=urllib.parse.urlparse(target); qp=urllib.parse.parse_qs(u.query)
              if u.scheme!='https' or u.hostname!='chatgpt.com' or u.path!='/connector/oauth/musitu-mobile-navigation-proof':
                  raise RuntimeError('callback target mismatch')
              code=(qp.get('code') or [''])[0]
              if not code or (qp.get('state') or [''])[0]!=state: raise RuntimeError('callback code/state mismatch')
              print('::add-mask::'+code)
              if '<meta http-equiv="refresh"' not in nav: raise RuntimeError('meta-refresh fallback missing')
              if 'window.location.replace(' not in nav: raise RuntimeError('JS navigation fallback missing')
              if 'id="continue-chatgpt"' not in nav or 'href="' not in nav: raise RuntimeError('manual ChatGPT continuation anchor missing')
              if 'You do not need to authorize again.' not in nav: raise RuntimeError('safe retry UX missing')

              tc,_,tb=form(issuer+'/oauth/token',{
                  'grant_type':'authorization_code','code':code,'code_verifier':verifier,
                  'client_id':client_id,'redirect_uri':callback,'resource':resource,
              },headers={'Accept':'application/json'},follow=True)
              if tc!=200: raise RuntimeError('token exchange HTTP '+str(tc)+' '+tb[:200].decode('utf-8','ignore'))
              tok=json.loads(tb or b'{}'); access=str(tok.get('access_token') or '')
              if not access or tok.get('token_type')!='Bearer': raise RuntimeError('token response invalid')
              print('::add-mask::'+access)

              mc,_,mo,_=jreq(mcp+'/mcp','POST',{
                  'jsonrpc':'2.0','id':1,'method':'tools/call','params':{
                      'name':'musitu_axiom_execute','arguments':{
                          'operation':'arithmetic.evaluate','args':{'expression':'40+2'}
                      }
                  }
              },{'Authorization':'Bearer '+access,'x-musitu-request-id':'MOBILE-NAV-PROOF-'+uuid.uuid4().hex.upper()})
              if mc!=200 or (mo.get('result') or {}).get('isError') is True or '42' not in json.dumps(mo,separators=(',',':')):
                  raise RuntimeError('OAuth token failed MCP execution')

              vc,_,_,_=jreq(issuer+'/oauth/revoke','POST',None)
              # Revoke via form; jreq call above is harmless 404/405 guard and not relied upon.
              rvc,_,_=form(issuer+'/oauth/revoke',{'token':access,'client_id':client_id},headers={'Accept':'application/json'},follow=True)
              if rvc!=200: raise RuntimeError('revocation failed HTTP '+str(rvc))

              rows=d1('SELECT used_at FROM oauth_authorization_codes WHERE client_id=?1 ORDER BY created_at DESC LIMIT 1',[client_id])
              if len(rows)!=1 or not rows[0].get('used_at'): raise RuntimeError('authorization code was not redeemed')
              print(json.dumps({
                  'gate':'MUSITU_AXIOM_MOBILE_NAVIGATION_PROOF_PASS',
                  'credential_post_http':200,
                  'http_location_header_absent':True,
                  'exact_chatgpt_callback':True,
                  'state_preserved':True,
                  'pkce_token_exchange':True,
                  'authorization_code_redeemed':True,
                  'meta_refresh_present':True,
                  'js_replace_present':True,
                  'manual_anchor_present':True,
                  'mcp_authenticated_compute':True,
              },sort_keys=True))
          finally:
              if client_id:
                  try:
                      d1("DELETE FROM api_keys WHERE label='chatgpt-oauth-access' AND id IN (SELECT api_key_id FROM oauth_access_tokens WHERE client_id=?1)",[client_id])
                      d1('DELETE FROM oauth_refresh_tokens WHERE client_id=?1',[client_id])
                      d1('DELETE FROM oauth_access_tokens WHERE client_id=?1',[client_id])
                      d1('DELETE FROM oauth_authorization_codes WHERE client_id=?1',[client_id])
                      d1('DELETE FROM oauth_authorization_flows WHERE client_id=?1',[client_id])
                      d1('DELETE FROM oauth_clients WHERE client_id=?1',[client_id])
                  except Exception as cleanup_error:
                      print('cleanup warning:',type(cleanup_error).__name__)
          PY
