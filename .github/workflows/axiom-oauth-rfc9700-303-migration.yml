name: MUSITU Axiom OAuth RFC9700 303 Migration

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/axiom-oauth-rfc9700-303-migration.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: musitu-axiom-oauth-rfc9700-303-migration
  cancel-in-progress: false

jobs:
  migrate-verify-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BRANCH: frontier/axiom-v5-skill-fabric
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontier/axiom-v5-skill-fabric
          fetch-depth: 0

      - name: Patch only the credential-bearing authorization POST redirect contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('auth/musitu_axiom_oauth_worker.mjs'): (
                  'return new Response(null,{status:302,headers:{location:r.toString(),',
                  'return new Response(null,{status:303,headers:{location:r.toString(),',
              ),
              Path('.github/workflows/axiom-oauth-production-deploy.yml'): (
                  "if pc!=302:raise RuntimeError('authorization consent POST expected 302 got '+str(pc))",
                  "if pc!=303:raise RuntimeError('authorization consent POST expected 303 got '+str(pc))",
              ),
              Path('.github/workflows/axiom-openai-reviewer-demo-provision.yml'): (
                  "if pc!=302 or not code or (qp.get('state') or [''])[0]!=state: raise RuntimeError('reviewer account OAuth authentication failed')",
                  "if pc!=303 or not code or (qp.get('state') or [''])[0]!=state: raise RuntimeError('reviewer account OAuth authentication failed')",
              ),
              Path('scripts/rollout_oauth_userinfo.py'): (
                  'if pc != 302 or not raw_code or (params.get("state") or [""])[0] != state:',
                  'if pc != 303 or not raw_code or (params.get("state") or [""])[0] != state:',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'Fail-closed: {path} expected exactly one targeted 302 contract, found {count}')
              path.write_text(text.replace(old, new, 1))
              print(f'patched={path}')
          PY

          # No broad redirect rewrite: only the four reviewed authorization-POST contracts above.
          node --check auth/musitu_axiom_oauth_worker.mjs
          python -m py_compile scripts/rollout_oauth_userinfo.py
          git diff --check

          python - <<'PY'
          from pathlib import Path
          checks = {
            'auth/musitu_axiom_oauth_worker.mjs': ['status:303'],
            '.github/workflows/axiom-oauth-production-deploy.yml': ['authorization consent POST expected 303'],
            '.github/workflows/axiom-openai-reviewer-demo-provision.yml': ['pc!=303'],
            'scripts/rollout_oauth_userinfo.py': ['pc != 303'],
          }
          for p, needles in checks.items():
              text=Path(p).read_text()
              for needle in needles:
                  if needle not in text:
                      raise RuntimeError(f'Fail-closed: required 303 invariant missing: {p}: {needle}')
          worker=Path('auth/musitu_axiom_oauth_worker.mjs').read_text()
          if 'return new Response(null,{status:302,headers:{location:r.toString(),' in worker:
              raise RuntimeError('Fail-closed: credential-bearing worker redirect still uses 302')
          deploy=Path('.github/workflows/axiom-oauth-production-deploy.yml').read_text()
          if 'authorization consent POST expected 302' in deploy:
              raise RuntimeError('Fail-closed: production gate still expects 302')
          reviewer=Path('.github/workflows/axiom-openai-reviewer-demo-provision.yml').read_text()
          if "if pc!=302 or not code" in reviewer:
              raise RuntimeError('Fail-closed: reviewer gate still expects 302')
          rollout=Path('scripts/rollout_oauth_userinfo.py').read_text()
          if 'if pc != 302 or not raw_code' in rollout:
              raise RuntimeError('Fail-closed: UserInfo rollout gate still expects 302')
          print('RFC9700_303_TARGETED_INVARIANTS=PASS')
          PY

      - name: Commit the reviewed 303 migration on Frontier only
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          git status --short
          git diff -- auth/musitu_axiom_oauth_worker.mjs .github/workflows/axiom-oauth-production-deploy.yml .github/workflows/axiom-openai-reviewer-demo-provision.yml scripts/rollout_oauth_userinfo.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth/musitu_axiom_oauth_worker.mjs .github/workflows/axiom-oauth-production-deploy.yml .github/workflows/axiom-openai-reviewer-demo-provision.yml scripts/rollout_oauth_userinfo.py
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "4"
          git commit -m 'Use RFC 9700 303 for OAuth consent redirect'
          NEW_SHA="$(git rev-parse HEAD)"
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:$BRANCH"

      - name: Dispatch and require exact-SHA production OAuth deploy GREEN
        shell: bash
        env:
          NEW_SHA: ${{ steps.commit.outputs.new_sha }}
        run: |
          set -euo pipefail
          gh workflow run axiom-oauth-production-deploy.yml --ref "$BRANCH"
          RUN_ID=""
          for _ in $(seq 1 40); do
            RUN_ID="$(gh run list --workflow axiom-oauth-production-deploy.yml --branch "$BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt --jq '.[] | select(.headSha==env.NEW_SHA) | .databaseId' | head -n1 || true)"
            [ -n "$RUN_ID" ] && break
            sleep 3
          done
          [ -n "$RUN_ID" ] || { echo 'Fail-closed: exact-SHA production deploy run did not appear' >&2; exit 1; }
          echo "PRODUCTION_DEPLOY_RUN_ID=$RUN_ID"
          gh run watch "$RUN_ID" --exit-status
          GOT_SHA="$(gh run view "$RUN_ID" --json headSha --jq '.headSha')"
          CONCLUSION="$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion')"
          [ "$GOT_SHA" = "$NEW_SHA" ]
          [ "$CONCLUSION" = "success" ]

      - name: Dispatch and require exact-SHA persistent reviewer gate GREEN
        shell: bash
        env:
          NEW_SHA: ${{ steps.commit.outputs.new_sha }}
        run: |
          set -euo pipefail
          gh workflow run axiom-openai-reviewer-demo-provision.yml --ref "$BRANCH"
          RUN_ID=""
          for _ in $(seq 1 40); do
            RUN_ID="$(gh run list --workflow axiom-openai-reviewer-demo-provision.yml --branch "$BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt --jq '.[] | select(.headSha==env.NEW_SHA) | .databaseId' | head -n1 || true)"
            [ -n "$RUN_ID" ] && break
            sleep 3
          done
          [ -n "$RUN_ID" ] || { echo 'Fail-closed: exact-SHA reviewer verification run did not appear' >&2; exit 1; }
          echo "REVIEWER_RUN_ID=$RUN_ID"
          gh run watch "$RUN_ID" --exit-status
          GOT_SHA="$(gh run view "$RUN_ID" --json headSha --jq '.headSha')"
          CONCLUSION="$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion')"
          [ "$GOT_SHA" = "$NEW_SHA" ]
          [ "$CONCLUSION" = "success" ]

      - name: Re-prove sealed main did not move
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api repos/${{ github.repository }}/branches/main --jq '.commit.sha')"
          test "$MAIN_SHA" = 'd6a846f6bbe0bccac1758713eb4de167caf07113'
          echo 'SEALED_MAIN_UNCHANGED=PASS'
