name: AXIOM actual OAuth structural identity/link GET-SELECT-only 20261108 (NOT RELEASE)
on:
  pull_request:
    types: [opened]
    paths: ['.github/workflows/axiom-oauth-structural-links-live-20261108.yml']
permissions: {contents: read}
concurrency:
  group: axiom-oauth-structural-links-live-20261108
  cancel-in-progress: false
jobs:
  exact-structural-only-identity-counters:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'build/axiom-oauth-structural-links-live-20261108' && github.event.pull_request.base.ref == 'build/axiom-oauth-structural-links-readonly-20261108' && github.event.pull_request.base.sha == 'aa59077cc2d18e1aa1be0196c81400ff2cd9838d' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b56e1f7a26298ae4a216b309af0090c8b9dcf221
          fetch-depth: 1
          persist-credentials: false
      - name: Pin exact real OAuth reader, tests and no-mutation route before secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b56e1f7a26298ae4a216b309af0090c8b9dcf221
          test "$(git hash-object customer_frontier/qualification/oauth_identity_links_20261108.py)" = c1dab9b2d08a088db63f99568c2a607f28f10a36
          test "$(git hash-object customer_frontier/qualification/test_oauth_identity_links_20261108.py)" = f485dc025c95879aca2dbce628693d2783c130f5
          python3 -m py_compile customer_frontier/qualification/oauth_identity_links_20261108.py customer_frontier/qualification/test_oauth_identity_links_20261108.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('customer_frontier/qualification/oauth_identity_links_20261108.py').read_text()
          assert "DATABASE='504029cc-f9a5-495e-818f-63c6144b4ea4'" in s
          assert "WORKER='musitu-axiom-oauth'" in s
          assert "CATALOG_SHA='56c70460aecf66af4eab25d4c7e363efb0a76866f788bcd5ae70f52a0f3e7ee1'" in s
          assert "if kind not in ('binding','metadata','catalog','relationships') or calls>=4" in s
          assert "'provider_zero_write_queries':zero_write" in s
          assert "'real_identity_qualified':False" in s
          assert "'production_oauth_migration_qualified':False" in s
          assert "'release_authority':False" in s
          assert "SELECT * FROM" not in s and "DROP TABLE" not in s and "DELETE FROM" not in s
          assert "private_jwk" not in s and "oauth_oidc_signing_keys" not in s
          print('FIXED_OAUTH_IDENTITY_STRUCTURAL_ONLY_READ_ALLOWED')
          PY
      - name: Repeat seven fail-closed privacy, catalog, counter and write-denial tests
        run: python3 -m unittest discover -s customer_frontier/qualification -p test_oauth_identity_links_20261108.py -v
      - name: Four fixed live provider read-only identity, client and tenant reference observations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 customer_frontier/qualification/oauth_identity_links_20261108.py
      - name: Prevent any structural observation from promoting real IdP or migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('axiom-oauth-structural-link-preflight-20261108.json')
          r=json.loads(p.read_text())
          assert r['status']=='STRUCTURAL_LINK_COUNTERS_ZERO_NOT_REAL_IDENTITY'
          assert r['database_id']=='504029cc-f9a5-495e-818f-63c6144b4ea4'
          assert r['catalog_objects']==33 and r['provider_requests']==4 and r['provider_zero_write_queries']==2
          assert len(r['aggregate_counters'])==12 and all(v==0 for v in r['aggregate_counters'].values())
          for name in ('customer_row_contents_read','signing_private_keys_read','real_identity_qualified','provider_account_ownership_verified','production_oauth_migration_qualified','billing_settlement_qualified','release_authority'):
              assert r[name] is False
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          Path(p.name+'.sha256').write_text(h+'  '+p.name+'\n')
          print('ACTUAL_OAUTH_STRUCTURAL_LINK_COUNTS_PASS_NOT_REAL_IDENTITY_OR_MIGRATION sha256='+h)
          PY
      - name: Retain only non-identifying counts and SHA, including failed audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-oauth-structural-link-live-readonly-20261108
          path: |
            axiom-oauth-structural-link-preflight-20261108.json
            axiom-oauth-structural-link-preflight-20261108.json.sha256
          retention-days: 30
          if-no-files-found: warn
