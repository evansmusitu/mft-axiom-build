name: MUSITU Axiom OAuth UserInfo V2 Rollout

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-axiom-oauth-production
  cancel-in-progress: false

jobs:
  rollout:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and statically validate additive OAuth candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/patch_oauth_userinfo.py scripts/rollout_oauth_userinfo.py
          python scripts/patch_oauth_userinfo.py auth/musitu_axiom_oauth_worker.mjs /tmp/musitu_axiom_oauth_worker_v2.mjs
          node --check auth/musitu_axiom_oauth_worker.mjs
          node --check /tmp/musitu_axiom_oauth_worker_v2.mjs
          grep -q 'userinfo_endpoint' /tmp/musitu_axiom_oauth_worker_v2.mjs
          grep -q 'email_verified' /tmp/musitu_axiom_oauth_worker_v2.mjs
          grep -q '"openid","email"' /tmp/musitu_axiom_oauth_worker_v2.mjs

      - name: Hash candidate for independent source review; never deploy or push
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/musitu_axiom_oauth_worker_v2.mjs
          cp /tmp/musitu_axiom_oauth_worker_v2.mjs oauth-userinfo-v2-review-candidate.mjs
          node --check oauth-userinfo-v2-review-candidate.mjs
          sha256sum oauth-userinfo-v2-review-candidate.mjs > oauth-userinfo-v2-review-candidate.sha256
          echo 'OAUTH_REVIEW_CANDIDATE_ONLY_NOT_DEPLOYED'
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-oauth-userinfo-review-candidate
          path: |
            oauth-userinfo-v2-review-candidate.mjs
            oauth-userinfo-v2-review-candidate.sha256
          retention-days: 14
          if-no-files-found: error
