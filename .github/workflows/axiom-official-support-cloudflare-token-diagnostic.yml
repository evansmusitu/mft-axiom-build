name: MUSITU Axiom Cloudflare Token Capability Diagnostic

on:
  push:
    branches:
      - 'support/axiom-official-support-20261005'
    paths:
      - '.github/workflows/axiom-official-support-cloudflare-token-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-token-read-only:
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 5
    steps:
      - name: Read Cloudflare token capabilities without exposing token material
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = String(process.env.CLOUDFLARE_API_TOKEN || '');
          if (!token) throw new Error('CLOUDFLARE_API_TOKEN missing');
          const headers = {authorization: 'Bearer ' + token, accept: 'application/json'};
          async function read(path) {
            const response = await fetch('https://api.cloudflare.com/client/v4' + path, {headers});
            let payload = {};
            try { payload = await response.json(); } catch {}
            return {status: response.status, ok: response.ok && payload?.success !== false, result: payload?.result || null};
          }
          const userVerify = await read('/user/tokens/verify');
          const accountId = '93f395f5121954671f92fffa453d6b61';
          const accountVerify = await read('/accounts/' + accountId + '/tokens/verify');
          const verify = accountVerify.ok ? accountVerify : userVerify;
          let details = {status: 0, ok: false, result: null};
          if (verify.ok && verify.result?.id) {
            const base = accountVerify.ok ? '/accounts/' + accountId + '/tokens/' : '/user/tokens/';
            details = await read(base + encodeURIComponent(verify.result.id));
          }
          const names = [];
          if (details.ok && Array.isArray(details.result?.policies)) {
            for (const policy of details.result.policies) {
              for (const group of Array.isArray(policy?.permission_groups) ? policy.permission_groups : []) {
                if (group?.name) names.push(String(group.name));
              }
            }
          }
          const has = (...candidates) => names.some(name => candidates.includes(name));
          const evidence = {
            gate: 'MUSITU_AXIOM_CLOUDFLARE_TOKEN_CAPABILITY_DIAGNOSTIC',
            token_active: verify.ok && String(verify.result?.status || '').toLowerCase() === 'active',
            token_kind: accountVerify.ok ? 'account_owned' : (userVerify.ok ? 'user_owned' : 'unresolved'),
            user_verify_http_status: userVerify.status,
            account_verify_http_status: accountVerify.status,
            token_details_readable: details.ok,
            token_details_http_status: details.status,
            email_routing_rules_write: details.ok ? has('Email Routing Rules Write', 'Email Routing Rules Edit') : null,
            zone_settings_write: details.ok ? has('Zone Settings Write', 'Zone Settings Edit') : null,
            api_tokens_write: details.ok ? has('API Tokens Write', 'API Tokens Edit') : null,
            api_tokens_read: details.ok ? has('API Tokens Read') : null,
            raw_token_id_recorded: false,
            raw_permission_policy_recorded: false,
            secret_exposed: false,
            write_performed: false
          };
          process.stdout.write(JSON.stringify(evidence) + '\n');
          NODE
