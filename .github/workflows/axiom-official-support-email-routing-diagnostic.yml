name: MUSITU Axiom Support Email Routing Diagnostic

on:
  push:
    branches:
      - support/axiom-official-support-20261005
    paths:
      - '.github/workflows/axiom-official-support-email-routing-diagnostic.yml'
      - 'support/scripts/inspect_cloudflare_email_routing_rules.mjs'

permissions:
  contents: read

jobs:
  diagnose-email-routing:
    if: github.ref_name == 'support/axiom-official-support-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: axiom-support-production
    steps:
      - name: Checkout isolated support branch
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read redacted Cloudflare Email Routing state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: node support/scripts/inspect_cloudflare_email_routing_rules.mjs
