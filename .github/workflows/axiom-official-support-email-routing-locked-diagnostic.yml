name: MUSITU Axiom Email Routing Locked-State Diagnostic

on:
  push:
    branches:
      - 'support/axiom-official-support-20261005'
    paths:
      - '.github/workflows/axiom-official-support-email-routing-locked-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: axiom-support-production
    env:
      CF_ZONE_ID: '5b56528f03948ff5917a5e0cd9f7109e'
      CF_ZONE_NAME: 'mftintelligence.com'
      CF_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
    steps:
      - name: Inspect locked Email Routing state without writes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('node:crypto');
          const zid=process.env.CF_ZONE_ID, zone=process.env.CF_ZONE_NAME;
          const token=String(process.env.CF_TOKEN||'').trim();
          if(!token) throw new Error('scoped Cloudflare token missing');
          const headers={authorization:'Bearer '+token,accept:'application/json'};
          const hash=v=>crypto.createHash('sha256').update(String(v)).digest('hex');
          async function get(path){
            const r=await fetch('https://api.cloudflare.com/client/v4'+path,{headers});
            let p={};try{p=await r.json()}catch{}
            return {http:r.status,success:r.ok&&p?.success!==false,result:p?.result??null,
              errors:(p?.errors||[]).map(x=>({code:x?.code??null,message:String(x?.message||'').slice(0,160)})),
              messages:(p?.messages||[]).map(x=>({code:x?.code??null,message:String(x?.message||'').slice(0,160)}))};
          }
          const [settings,required,root]=await Promise.all([
            get('/zones/'+zid+'/email/routing'),
            get('/zones/'+zid+'/email/routing/dns'),
            get('/zones/'+zid+'/dns_records?name='+encodeURIComponent(zone)+'&per_page=100')
          ]);
          const safeSettings=settings.success&&settings.result?{
            enabled:settings.result.enabled===true,
            status:String(settings.result.status||''),
            name:String(settings.result.name||''),
            skip_wizard:settings.result.skip_wizard??null,
            support_subaddress:settings.result.support_subaddress??null,
            created:settings.result.created||null,
            modified:settings.result.modified||null,
            id_present:Boolean(settings.result.id)
          }:null;
          const safeRequired=(Array.isArray(required.result)?required.result:[]).map(r=>({
            type:String(r?.type||''),name:String(r?.name||''),content:String(r?.content||''),
            priority:Number.isFinite(Number(r?.priority))?Number(r.priority):null,
            ttl:Number.isFinite(Number(r?.ttl))?Number(r.ttl):null
          }));
          function txtKind(v){
            const s=String(v||'').toLowerCase();
            if(s.startsWith('v=spf1')) return 'spf';
            if(s.startsWith('v=dmarc1')) return 'dmarc';
            if(/v=dkim1|p=/.test(s)) return 'dkim_or_key';
            return 'other_txt';
          }
          const safeRoot=(Array.isArray(root.result)?root.result:[]).map(r=>{
            const type=String(r?.type||'').toUpperCase();
            const base={type,name:String(r?.name||''),ttl:r?.ttl??null,priority:r?.priority??null,
              proxied:r?.proxied??null,locked:r?.locked??null,
              auto_added:r?.meta?.auto_added??null,managed_by_apps:r?.meta?.managed_by_apps??null};
            if(type==='MX') base.content=String(r?.content||'');
            else if(type==='TXT'){base.txt_kind=txtKind(r?.content);base.content_sha256=hash(r?.content||'');}
            else base.content_sha256=hash(r?.content||'');
            return base;
          });
          const out={
            gate:'MUSITU_AXIOM_EMAIL_ROUTING_LOCKED_STATE_DIAGNOSTIC',
            settings:{http:settings.http,success:settings.success,value:safeSettings,errors:settings.errors,messages:settings.messages},
            required_dns:{http:required.http,success:required.success,records:safeRequired,errors:required.errors,messages:required.messages},
            root_dns:{http:root.http,success:root.success,records:safeRoot,errors:root.errors,messages:root.messages},
            write_performed:false,secret_exposed:false
          };
          console.log(JSON.stringify(out));
          NODE
