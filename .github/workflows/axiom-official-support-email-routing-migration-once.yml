name: MUSITU Axiom Official Support Email Routing Migration Once

on:
  push:
    branches:
      - 'support/axiom-official-support-20261005'
    paths:
      - '.github/workflows/axiom-official-support-email-routing-migration-once.yml'

permissions:
  contents: read

concurrency:
  group: musitu-axiom-official-support-email-routing-migration
  cancel-in-progress: false

jobs:
  migrate-root-mail-routing-once:
    if: github.event.before == 'd35779aae81e17cea24192f320e1a26741543516'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: axiom-support-production
    env:
      SUPPORT_EMAIL_ROUTING_MIGRATION_CONFIRM: MIGRATE_MUSITU_AXIOM_EMAIL_ROUTING
      SUPPORT_ZOHO_RETIREMENT_CONFIRM: RETIRE_UNUSED_ZOHO_TEST_MAILBOXES
      SUPPORT_MAILBOX_DESTINATION: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
    steps:
      - name: Checkout exact isolated support branch
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact branch and one-shot authorization gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'support/axiom-official-support-20261005'
          test "$GITHUB_REF_NAME" != 'main'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "${{ github.event.before }}" = 'd35779aae81e17cea24192f320e1a26741543516'
          mapfile -t authorization < support/MIGRATE_CLOUDFLARE_EMAIL_ROUTING.authorized
          test "${authorization[0]}" = 'MIGRATE_MUSITU_AXIOM_EMAIL_ROUTING'
          test "${authorization[1]}" = 'RETIRE_UNUSED_ZOHO_TEST_MAILBOXES'
          test "${#authorization[@]}" -eq 2
      - name: Re-run complete support gate before any Cloudflare write
        run: node --test support/tests/*.test.mjs
      - name: Migrate root inbound mail routing with proven scoped credential and automatic rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
        run: node support/scripts/migrate_cloudflare_email_routing.mjs
      - name: Publish non-secret migration summary
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const e=require("./support-email-routing-migration.json"); const h=require("node:fs").readFileSync("./support-email-routing-migration.json.sha256","utf8").split(" ")[0]; process.stdout.write(["### MUSITU Axiom support Email Routing migration", "", "- Gate: "+e.gate, "- Authentication mode: "+e.authentication_mode, "- Routing ready: "+e.routing.ready, "- Exact support rule: "+e.support_rule.exact_present, "- Retired Zoho test mailboxes: "+e.retired_zoho_test_mailboxes.count, "- Protected OpenAI/Claude DNS unchanged: "+e.protected_provider_dns.unchanged, "- Delivery verified: false", "- Public support deployed: false", "- Evidence SHA-256: "+h].join("\n")+"\n")' >> "$GITHUB_STEP_SUMMARY"
          node -e 'const e=require("./support-email-routing-migration.json"); const h=require("node:fs").readFileSync("./support-email-routing-migration.json.sha256","utf8").split(" ")[0]; process.stdout.write(JSON.stringify({gate:e.gate,authentication_mode:e.authentication_mode,routing_ready:e.routing.ready,exact_support_rule:e.support_rule.exact_present,retired_zoho_test_mailboxes:e.retired_zoho_test_mailboxes.count,protected_provider_dns_unchanged:e.protected_provider_dns.unchanged,delivery_verified:false,public_support_deployed:false,evidence_sha256:h})+"\n")'
          rm support-email-routing-migration.json support-email-routing-migration.json.sha256
