name: MUSITU Axiom Official Support Email Routing Preflight

on:
  push:
    branches:
      - 'support/axiom-official-support-20261005'
    paths:
      - 'support/VERIFY_CLOUDFLARE_EMAIL_ROUTING.authorized'
      - 'support/scripts/verify_cloudflare_email_routing.mjs'
      - 'support/tests/cloudflare_email_routing_preflight.test.mjs'
      - '.github/workflows/axiom-official-support-email-routing-preflight.yml'
  workflow_dispatch:
    inputs:
      authorization:
        description: Type VERIFY_MUSITU_AXIOM_SUPPORT_EMAIL_ROUTING
        required: true
        type: string
      expected_commit:
        description: Exact isolated support commit approved for read-only verification
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: musitu-axiom-official-support-email-routing-preflight
  cancel-in-progress: false

jobs:
  inspect-read-only:
    if: github.ref_name == 'support/axiom-official-support-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPPORT_EMAIL_ROUTING_CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.authorization || 'VERIFY_MUSITU_AXIOM_SUPPORT_EMAIL_ROUTING' }}
      SUPPORT_MAILBOX_DESTINATION: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
    steps:
      - name: Checkout isolated support branch
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact branch, commit and read-only authorization gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'support/axiom-official-support-20261005'
          test "$GITHUB_REF_NAME" != 'main'
          test "$SUPPORT_EMAIL_ROUTING_CONFIRM" = 'VERIFY_MUSITU_AXIOM_SUPPORT_EMAIL_ROUTING'
          IFS= read -r support_authorization < support/VERIFY_CLOUDFLARE_EMAIL_ROUTING.authorized
          test "$support_authorization" = 'VERIFY_MUSITU_AXIOM_SUPPORT_EMAIL_ROUTING'
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            test "$GITHUB_SHA" = '${{ inputs.expected_commit }}'
          else
            test "$GITHUB_EVENT_NAME" = 'push'
          fi
      - name: Re-run complete support gate
        run: node --test support/tests/*.test.mjs
      - name: Inspect destination, Email Routing, DNS and Worker domains without writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: node support/scripts/verify_cloudflare_email_routing.mjs
      - name: Publish non-secret preflight summary
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const e=require("./support-email-routing-preflight.json"); const h=require("node:fs").readFileSync("./support-email-routing-preflight.json.sha256","utf8").split(" ")[0]; process.stdout.write(["### MUSITU Axiom support Email Routing preflight", "", "- Gate: MUSITU_AXIOM_SUPPORT_EMAIL_ROUTING_PREFLIGHT_OBSERVED", "- Destination verified: "+e.destination.verified, "- Email Routing ready: "+e.email_routing.ready, "- Exact support rule present: "+e.support_rule.exact_present, "- Conflicting support rule: "+e.support_rule.conflict_present, "- Safe to create exact rule: "+e.support_rule.safe_to_create, "- OpenAI DNS readable: "+e.protected_openai_dns.readable, "- Write performed: false", "- Evidence SHA-256: "+h].join("\n")+"\n")' >> "$GITHUB_STEP_SUMMARY"
          rm support-email-routing-preflight.json support-email-routing-preflight.json.sha256
