name: MUSITU Axiom Support Email Sending DNS Preflight

on:
  push:
    branches:
      - 'support/axiom-official-support-20261005'
    paths:
      - '.github/workflows/axiom-official-support-email-sending-dns-preflight.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
      CF_ZONE_ID: '5b56528f03948ff5917a5e0cd9f7109e'
    steps:
      - name: Inspect bounded DNS namespaces read-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=await import('node:crypto');
          const token=String(process.env.CF_TOKEN||'');
          const zone=String(process.env.CF_ZONE_ID||'');
          const api='https://api.cloudflare.com/client/v4';
          const names=[
            'mftintelligence.com',
            'cf-bounce.mftintelligence.com',
            'cf-bounce._domainkey.mftintelligence.com',
            '_dmarc.mftintelligence.com',
            'auth.mftintelligence.com',
            'mcp.mftintelligence.com',
            'claude-auth.mftintelligence.com',
            'claude-mcp.mftintelligence.com'
          ];
          function fp(rows){
            const clean=rows.map(r=>({type:String(r.type||''),name:String(r.name||'').toLowerCase(),content:String(r.content||'').replace(/\.$/,''),priority:r.priority??null})).sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b)));
            return crypto.createHash('sha256').update(JSON.stringify(clean)).digest('hex');
          }
          async function get(name){
            const r=await fetch(api+'/zones/'+zone+'/dns_records?name='+encodeURIComponent(name)+'&per_page=100',{headers:{authorization:'Bearer '+token,accept:'application/json'}});
            let p={}; try{p=await r.json()}catch{}
            if(!r.ok||p?.success===false) return {http:r.status,ok:false,count:null,fingerprint:null};
            const rows=Array.isArray(p.result)?p.result:[];
            return {
              http:r.status,ok:true,count:rows.length,fingerprint:fp(rows),
              types:[...new Set(rows.map(x=>String(x.type||'')))].sort(),
              public_dmarc:name==='_dmarc.mftintelligence.com'?rows.filter(x=>String(x.type||'').toUpperCase()==='TXT').map(x=>String(x.content||'')):undefined
            };
          }
          const out={};
          for(const name of names) out[name]=await get(name);
          console.log(JSON.stringify({
            gate:'MUSITU_AXIOM_SUPPORT_EMAIL_SENDING_DNS_PREFLIGHT',
            records:out,
            write_performed:false,
            secret_exposed:false
          }));
          NODE
