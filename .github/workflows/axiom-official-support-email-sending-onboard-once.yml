name: MUSITU Axiom Support Email Sending Onboard Once

on:
  push:
    branches:
      - 'support/axiom-official-support-20261005'
    paths:
      - '.github/workflows/axiom-official-support-email-sending-onboard-once.yml'

permissions:
  contents: read

concurrency:
  group: musitu-axiom-support-email-sending-onboard
  cancel-in-progress: false

jobs:
  onboard:
    if: github.event.before == '508c63f90cc2dee07772bf39477d5beab9530c5c'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 10
    env:
      SUPPORT_EMAIL_SENDING_CONFIRM: ONBOARD_MUSITU_AXIOM_SUPPORT_EMAIL_SENDING
      CLOUDFLARE_ZONE_ID: '5b56528f03948ff5917a5e0cd9f7109e'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact isolated one-shot gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'support/axiom-official-support-20261005'
          test "$GITHUB_REF_NAME" != 'main'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "${{ github.event.before }}" = '508c63f90cc2dee07772bf39477d5beab9530c5c'
      - name: Re-run complete support gate before Cloudflare write
        run: node --test support/tests/*.test.mjs
      - name: Onboard sending domain transactionally
        run: node support/scripts/onboard_cloudflare_email_sending.mjs
      - name: Publish sanitized onboarding result
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const e=require("./support-email-sending-onboard.json"); const h=require("node:fs").readFileSync("./support-email-sending-onboard.json.sha256","utf8").split(" ")[0]; process.stdout.write(JSON.stringify({gate:e.gate,sending_enabled:e.sending.enabled,created_dns:e.created_dns,inbound_routing:e.inbound_routing,root_mail_dns_unchanged:e.root_mail_dns_unchanged,protected_provider_dns_unchanged:e.protected_provider_dns_unchanged,public_support_deployed:false,evidence_sha256:h})+"\n")'
          rm support-email-sending-onboard.json support-email-sending-onboard.json.sha256
