name: MUSITU Axiom Support Legal Hold Lifecycle Verification Once

on:
  push:
    branches:
      - 'support/axiom-official-support-20261005'
    paths:
      - '.github/workflows/axiom-official-support-legal-hold-once.yml'

permissions:
  contents: read

concurrency:
  group: musitu-axiom-support-legal-hold-lifecycle
  cancel-in-progress: false

jobs:
  verify-live:
    if: github.event.before == 'a339b101d3b5f23d6abe6a7cccb5145ce27fee76'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: axiom-support-production
    env:
      SUPPORT_LEGAL_HOLD_LIFECYCLE_CONFIRM: VERIFY_MUSITU_AXIOM_SUPPORT_LEGAL_HOLD_LIFECYCLE
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
      CLOUDFLARE_ZONE_ID: '5b56528f03948ff5917a5e0cd9f7109e'
      SUPPORT_D1_DATABASE_ID: 'a525c8b6-9b44-413b-a219-46e419b71b12'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact one-shot boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'support/axiom-official-support-20261005'
          test "$GITHUB_REF_NAME" != 'main'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "${{ github.event.before }}" = 'a339b101d3b5f23d6abe6a7cccb5145ce27fee76'
      - name: Re-run legal hold contract
        run: node --test support/tests/legal_hold_lifecycle.test.mjs
      - name: Exercise live dual-approved legal hold lifecycle
        run: node support/scripts/verify_legal_hold_lifecycle_live.mjs
      - name: Publish sanitized legal hold evidence
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const e=require("./support-legal-hold-live-evidence.json"); const h=require("node:fs").readFileSync("support-legal-hold-live-evidence.json.sha256","utf8").split(" ")[0]; console.log(JSON.stringify({gate:e.gate,status:e.status,overdue_review_never_auto_released:e.overdue_review_never_auto_released,overdue_purge_blocked:e.overdue_purge_blocked,hold_review_verified:e.hold_review_verified,hold_release_dual_approved:e.hold_release_dual_approved,post_release_purge_verified:e.post_release_purge_verified,live_case_count_after:e.live_case_count_after,live_event_count_after:e.live_event_count_after,purge_authorization_count_after:e.purge_authorization_count_after,deletion_receipt_count_after:e.deletion_receipt_count_after,evidence_sha256:h}))'
          rm support-legal-hold-live-evidence.json support-legal-hold-live-evidence.json.sha256
