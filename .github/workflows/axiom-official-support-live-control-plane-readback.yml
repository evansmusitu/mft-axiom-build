name: MUSITU Axiom Support Live Control Plane Readback

on:
  push:
    branches:
      - 'support/axiom-official-support-20261005'
    paths:
      - '.github/workflows/axiom-official-support-live-control-plane-readback.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 6
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
      CF_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
      CF_ZONE_ID: '5b56528f03948ff5917a5e0cd9f7109e'
      SUPPORT_D1_ID: 'a525c8b6-9b44-413b-a219-46e419b71b12'
      SUPPORT_WORKER: 'musitu-axiom-support'
    steps:
      - name: Read current isolated control plane without secret values
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=String(process.env.CF_TOKEN||'');
          const account=String(process.env.CF_ACCOUNT_ID||'');
          const zone=String(process.env.CF_ZONE_ID||'');
          const db=String(process.env.SUPPORT_D1_ID||'');
          const worker=String(process.env.SUPPORT_WORKER||'');
          const api='https://api.cloudflare.com/client/v4';
          async function req(path,{method='GET',body}={}){
            const r=await fetch(api+path,{method,headers:{authorization:'Bearer '+token,accept:'application/json',...(body===undefined?{}:{'content-type':'application/json'})},...(body===undefined?{}:{body:JSON.stringify(body)})});
            let p={}; try{p=await r.json()}catch{}
            return {http:r.status,ok:r.ok&&p?.success!==false,result:p?.result||null};
          }
          const [settings,secrets,subdomain,domains,widgets,dbInfo]=await Promise.all([
            req('/accounts/'+account+'/workers/scripts/'+worker+'/settings'),
            req('/accounts/'+account+'/workers/scripts/'+worker+'/secrets'),
            req('/accounts/'+account+'/workers/scripts/'+worker+'/subdomain'),
            req('/accounts/'+account+'/workers/domains'),
            req('/accounts/'+account+'/challenges/widgets?page=1&per_page=1000'),
            req('/accounts/'+account+'/d1/database/'+db),
          ]);
          async function query(sql){
            return req('/accounts/'+account+'/d1/database/'+db+'/query',{method:'POST',body:{sql}});
          }
          const [schema,caseCount,eventCount]=await Promise.all([
            query("SELECT type,name FROM sqlite_master WHERE type IN ('table','trigger') AND name IN ('support_cases','support_case_events','support_case_event_no_update','support_case_event_no_delete') ORDER BY type,name;"),
            query('SELECT COUNT(*) AS count FROM support_cases;'),
            query('SELECT COUNT(*) AS count FROM support_case_events;'),
          ]);
          const bindings=Array.isArray(settings.result?.bindings)?settings.result.bindings:[];
          const byName=new Map(bindings.map(x=>[String(x?.name||''),x]));
          const secretNames=new Set((Array.isArray(secrets.result)?secrets.result:[]).map(x=>String(x?.name||'')));
          const widgetRows=(Array.isArray(widgets.result)?widgets.result:[]).filter(x=>String(x?.name||'')==='MUSITU Axiom Official Support');
          const exactWidget=widgetRows.length===1&&String(widgetRows[0]?.mode||'')==='managed'&&Array.isArray(widgetRows[0]?.domains)&&widgetRows[0].domains.length===1&&widgetRows[0].domains[0]==='support.mftintelligence.com';
          const customDomains=(Array.isArray(domains.result)?domains.result:[]).filter(x=>String(x?.hostname||'')==='support.mftintelligence.com');
          const rows=x=>Array.isArray(x?.result)&&Array.isArray(x.result[0]?.results)?x.result[0].results:[];
          const schemaRows=rows(schema);
          const cases=Number(rows(caseCount)[0]?.count??-1);
          const events=Number(rows(eventCount)[0]?.count??-1);
          const owner=byName.get('SUPPORT_HUMAN_OWNER_REF');
          const approver=byName.get('SUPPORT_INDEPENDENT_APPROVER_REF');
          const d1=byName.get('SUPPORT_DB');
          console.log(JSON.stringify({
            gate:'MUSITU_AXIOM_SUPPORT_LIVE_CONTROL_PLANE_READBACK',
            worker_settings_readable:settings.ok,
            d1_binding_exact:String(d1?.id||'')===db,
            owner_ref_exact:String(owner?.text||'')==='github:evansmusitu',
            approver_ref_exact:String(approver?.text||'')==='person:elvis-musitu',
            owner_approver_distinct:String(owner?.text||'')!==String(approver?.text||''),
            data_key_secret_present:secretNames.has('SUPPORT_DATA_KEY_B64'),
            turnstile_secret_present:secretNames.has('TURNSTILE_SECRET_KEY'),
            exact_turnstile_widget:exactWidget,
            turnstile_widget_count:widgetRows.length,
            workers_dev_enabled:subdomain.result?.enabled===true,
            previews_enabled:subdomain.result?.previews_enabled===true,
            support_custom_domain_count:customDomains.length,
            d1_readable:dbInfo.ok,
            d1_schema_object_count:schemaRows.length,
            d1_schema_exact:schemaRows.length===4,
            support_case_count:cases,
            support_event_count:events,
            raw_secret_values_read:false,
            raw_private_contacts_recorded:false,
            write_performed:false,
            public_support_deployed:false
          }));
          NODE
