name: MUSITU Axiom Support Notification SMTP Preflight

on:
  push:
    branches:
      - 'support/axiom-official-support-20261005'
    paths:
      - '.github/workflows/axiom-official-support-notification-smtp-preflight.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 5
    env:
      CF_TOKEN_RULESETS: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
      CF_TOKEN_ACCESS: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      CF_TOKEN_DEFAULT: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_GLOBAL_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CF_GLOBAL_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_ZONE_ID: '5b56528f03948ff5917a5e0cd9f7109e'
      CF_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
    steps:
      - name: Probe legacy Cloudflare auth against Email Sending read endpoint
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const key=String(process.env.CF_GLOBAL_KEY||'');
          const email=String(process.env.CF_GLOBAL_EMAIL||'');
          const zone=String(process.env.CF_ZONE_ID||'');
          let out={gate:'MUSITU_AXIOM_SUPPORT_EMAIL_SENDING_LEGACY_AUTH_PROBE',present:Boolean(key&&email),http:null,success:false,error_codes:[],write_performed:false,secret_exposed:false};
          if(key&&email&&zone){
            const r=await fetch('https://api.cloudflare.com/client/v4/zones/'+zone+'/email/sending/subdomains',{headers:{'x-auth-email':email,'x-auth-key':key,accept:'application/json'}});
            let p={}; try{p=await r.json()}catch{}
            out.http=r.status;
            out.success=r.ok&&p?.success!==false;
            out.error_codes=Array.isArray(p?.errors)?p.errors.map(x=>x?.code).filter(x=>Number.isFinite(Number(x))).map(Number):[];
          }
          console.log(JSON.stringify(out));
          NODE
      - name: Match stored global key to Cloudflare account member identity privately
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const account=String(process.env.CF_ACCOUNT_ID||'');
          const zone=String(process.env.CF_ZONE_ID||'');
          const globalKey=String(process.env.CF_GLOBAL_KEY||'');
          const tokens=[
            ['CLOUDFLARE_RULESETS_API_TOKEN',process.env.CF_TOKEN_RULESETS],
            ['CLOUDFLARE_ACCESS_API_TOKEN',process.env.CF_TOKEN_ACCESS],
            ['CLOUDFLARE_API_TOKEN',process.env.CF_TOKEN_DEFAULT],
          ];
          async function jsonFetch(url,headers){
            const r=await fetch(url,{headers});
            let p={}; try{p=await r.json()}catch{}
            return {status:r.status,ok:r.ok&&p?.success!==false,result:p?.result||null};
          }
          let members=null,memberSource=null,memberHttp=null;
          for(const [name,raw] of tokens){
            const token=String(raw||'').trim();
            if(!token) continue;
            const x=await jsonFetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/members?per_page=100',{authorization:'Bearer '+token,accept:'application/json'});
            if(x.ok&&Array.isArray(x.result)){members=x.result;memberSource=name;memberHttp=x.status;break;}
            if(memberHttp===null) memberHttp=x.status;
          }
          let valid=[];
          if(Array.isArray(members)&&globalKey&&zone){
            for(const row of members){
              const email=String(row?.email||'').trim();
              if(!email) continue;
              const x=await jsonFetch('https://api.cloudflare.com/client/v4/zones/'+zone+'/email/sending/subdomains',{'x-auth-email':email,'x-auth-key':globalKey,accept:'application/json'});
              if(x.ok) valid.push({email,http:x.status});
            }
          }
          console.log(JSON.stringify({
            gate:'MUSITU_AXIOM_SUPPORT_GLOBAL_KEY_IDENTITY_MATCH',
            member_list_source:memberSource,
            member_list_http:memberHttp,
            member_count:Array.isArray(members)?members.length:null,
            valid_global_key_identity_count:valid.length,
            email_sending_read_http:valid.length===1?valid[0].http:null,
            raw_member_emails_recorded:false,
            global_key_recorded:false,
            write_performed:false,
            secret_exposed:false
          }));
          NODE
      - name: Authenticate SMTP and verify sender authorization without sending
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, smtplib, ssl
          candidates=[
              ('CLOUDFLARE_RULESETS_API_TOKEN', os.environ.get('CF_TOKEN_RULESETS','')),
              ('CLOUDFLARE_ACCESS_API_TOKEN', os.environ.get('CF_TOKEN_ACCESS','')),
              ('CLOUDFLARE_API_TOKEN', os.environ.get('CF_TOKEN_DEFAULT','')),
          ]
          results=[]
          for name,token in candidates:
              if not token:
                  results.append({'secret_name':name,'present':False})
                  continue
              row={'secret_name':name,'present':True,'auth_ok':False,'mail_from_code':None,'sender_authorized':False}
              try:
                  with smtplib.SMTP_SSL('smtp.mx.cloudflare.net',465,timeout=20,context=ssl.create_default_context()) as s:
                      s.login('api_token',token)
                      row['auth_ok']=True
                      code,_=s.mail('support@mftintelligence.com')
                      row['mail_from_code']=int(code)
                      row['sender_authorized']=200 <= code < 300
                      try: s.rset()
                      except Exception: pass
              except smtplib.SMTPResponseException as e:
                  row['smtp_error_code']=int(e.smtp_code)
              except Exception as e:
                  row['error_class']=type(e).__name__
              results.append(row)
          print(json.dumps({
              'gate':'MUSITU_AXIOM_SUPPORT_NOTIFICATION_SMTP_PREFLIGHT',
              'results':results,
              'message_sent':False,
              'recipient_supplied':False,
              'secret_exposed':False
          },sort_keys=True))
          PY
