name: MUSITU Axiom Support Notification SMTP Preflight

on:
  push:
    branches:
      - 'support/axiom-official-support-20261005'
    paths:
      - '.github/workflows/axiom-official-support-notification-smtp-preflight.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 5
    env:
      CF_TOKEN_RULESETS: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
      CF_TOKEN_ACCESS: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      CF_TOKEN_DEFAULT: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_GLOBAL_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CF_GLOBAL_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_ZONE_ID: '5b56528f03948ff5917a5e0cd9f7109e'
    steps:
      - name: Probe legacy Cloudflare auth against Email Sending read endpoint
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const key=String(process.env.CF_GLOBAL_KEY||'');
          const email=String(process.env.CF_GLOBAL_EMAIL||'');
          const zone=String(process.env.CF_ZONE_ID||'');
          let out={gate:'MUSITU_AXIOM_SUPPORT_EMAIL_SENDING_LEGACY_AUTH_PROBE',present:Boolean(key&&email),http:null,success:false,error_codes:[],write_performed:false,secret_exposed:false};
          if(key&&email&&zone){
            const r=await fetch('https://api.cloudflare.com/client/v4/zones/'+zone+'/email/sending/subdomains',{headers:{'x-auth-email':email,'x-auth-key':key,accept:'application/json'}});
            let p={}; try{p=await r.json()}catch{}
            out.http=r.status;
            out.success=r.ok&&p?.success!==false;
            out.error_codes=Array.isArray(p?.errors)?p.errors.map(x=>x?.code).filter(x=>Number.isFinite(Number(x))).map(Number):[];
          }
          console.log(JSON.stringify(out));
          NODE
      - name: Authenticate SMTP and verify sender authorization without sending
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, smtplib, ssl
          candidates=[
              ('CLOUDFLARE_RULESETS_API_TOKEN', os.environ.get('CF_TOKEN_RULESETS','')),
              ('CLOUDFLARE_ACCESS_API_TOKEN', os.environ.get('CF_TOKEN_ACCESS','')),
              ('CLOUDFLARE_API_TOKEN', os.environ.get('CF_TOKEN_DEFAULT','')),
          ]
          results=[]
          for name,token in candidates:
              if not token:
                  results.append({'secret_name':name,'present':False})
                  continue
              row={'secret_name':name,'present':True,'auth_ok':False,'mail_from_code':None,'sender_authorized':False}
              try:
                  with smtplib.SMTP_SSL('smtp.mx.cloudflare.net',465,timeout=20,context=ssl.create_default_context()) as s:
                      s.login('api_token',token)
                      row['auth_ok']=True
                      code,_=s.mail('support@mftintelligence.com')
                      row['mail_from_code']=int(code)
                      row['sender_authorized']=200 <= code < 300
                      try: s.rset()
                      except Exception: pass
              except smtplib.SMTPResponseException as e:
                  row['smtp_error_code']=int(e.smtp_code)
              except Exception as e:
                  row['error_class']=type(e).__name__
              results.append(row)
          print(json.dumps({
              'gate':'MUSITU_AXIOM_SUPPORT_NOTIFICATION_SMTP_PREFLIGHT',
              'results':results,
              'message_sent':False,
              'recipient_supplied':False,
              'secret_exposed':False
          },sort_keys=True))
          PY
