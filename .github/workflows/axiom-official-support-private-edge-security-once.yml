name: MUSITU Axiom Support Private Edge Security Once

on:
  push:
    branches:
      - 'support/axiom-official-support-20261005'
    paths:
      - '.github/workflows/axiom-official-support-private-edge-security-once.yml'

permissions:
  contents: read

concurrency:
  group: musitu-axiom-support-private-edge-security
  cancel-in-progress: false

jobs:
  verify-private-edge:
    if: github.event.before == 'b8a592f90e621dfb2b7771c46f26d18a083fb780'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: axiom-support-production
    env:
      CF_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
      SUPPORT_D1_ID: 'a525c8b6-9b44-413b-a219-46e419b71b12'
      CF_ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact isolated execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'support/axiom-official-support-20261005'
          test "$GITHUB_REF_NAME" != 'main'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "${{ github.event.before }}" = 'b8a592f90e621dfb2b7771c46f26d18a083fb780'
      - name: Re-run full support and rate-limit contracts
        run: node --test support/tests/*.test.mjs
      - name: Create Access-protected ephemeral edge, verify negatives and rate limiting, then destroy it
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const {spawnSync}=require('node:child_process');

          (async()=>{
          const account=String(process.env.CF_ACCOUNT_ID||'');
          const token=String(process.env.CF_ACCESS_TOKEN||'');
          const d1=String(process.env.SUPPORT_D1_ID||'');
          const runId=String(process.env.GITHUB_RUN_ID||'0');
          const suffix=runId.replace(/\D/g,'').slice(-8)||'edge';
          const worker='axiom-support-edge-'+suffix;
          const accessName='MUSITU Axiom Support Private Edge '+suffix;
          const serviceName='MUSITU Axiom Support Private Edge CI '+suffix;
          const policyName='MUSITU Axiom Support Private Edge Service Auth '+suffix;
          const configPath='.axiom-support-private-edge.json';
          const wrapperPath='.axiom-support-private-edge.mjs';
          const API='https://api.cloudflare.com/client/v4';
          if(!account||!token||!d1) throw new Error('private edge Cloudflare configuration missing');

          let workerCreated=false;
          let subdomainEnabled=false;
          let serviceTokenId='';
          let accessAppId='';
          let reusablePolicyId='';
          let clientId='';
          let clientSecret='';
          let probeSecret='';
          let previewDataKey='';
          let turnstileSecret='';
          let workerUrl='';
          const cleanupErrors=[];

          function mask(value){ if(value) process.stdout.write('::add-mask::'+value+'\n'); }
          function hash(value){ return crypto.createHash('sha256').update(String(value)).digest('hex'); }
          async function cf(path,{method='GET',body,allow404=false}={}){
            const r=await fetch(API+path,{
              method,
              headers:{authorization:'Bearer '+token,accept:'application/json',...(body===undefined?{}:{'content-type':'application/json'})},
              ...(body===undefined?{}:{body:JSON.stringify(body)})
            });
            let p={}; try{p=await r.json()}catch{}
            if(allow404&&r.status===404) return {http:r.status,result:null};
            if(!r.ok||p?.success===false){
              const codes=(p?.errors||[]).map(x=>x?.code).filter(Boolean);
              throw new Error('Cloudflare '+method+' '+path+' failed HTTP '+r.status+'; codes='+(codes.join(',')||'none'));
            }
            return {http:r.status,result:p?.result??null};
          }
          function run(cmd,args,{input,env}={}){
            const r=spawnSync(cmd,args,{encoding:'utf8',input,env:{...process.env,...env},maxBuffer:12*1024*1024});
            if(r.status!==0) {
              const safeErr=String(r.stderr||'').replaceAll(token,'[masked]');
              throw new Error(cmd+' '+args.join(' ')+' failed status '+r.status+'; stderr='+safeErr.slice(-1500));
            }
            return {stdout:String(r.stdout||''),stderr:String(r.stderr||'')};
          }
          async function d1Count(table){
            const x=await cf('/accounts/'+account+'/d1/database/'+d1+'/query',{
              method:'POST',body:{sql:'SELECT COUNT(*) AS count FROM '+table+';'}
            });
            const block=Array.isArray(x.result)?x.result[0]:x.result;
            return Number(block?.results?.[0]?.count??-1);
          }
          async function request(path,{method='GET',headers={},body}={}){
            return fetch(workerUrl+path,{method,headers,body,redirect:'manual'});
          }
          async function cleanup(){
            if(subdomainEnabled){
              try{
                await cf('/accounts/'+account+'/workers/scripts/'+encodeURIComponent(worker)+'/subdomain',{
                  method:'POST',body:{enabled:false,previews_enabled:false}
                });
                subdomainEnabled=false;
              }catch(e){cleanupErrors.push('disable_subdomain:'+e.message);}
            }
            if(accessAppId){
              try{await cf('/accounts/'+account+'/access/apps/'+encodeURIComponent(accessAppId),{method:'DELETE'});}
              catch(e){cleanupErrors.push('delete_access_app:'+e.message);}
              accessAppId='';
            }
            if(reusablePolicyId){
              try{await cf('/accounts/'+account+'/access/policies/'+encodeURIComponent(reusablePolicyId),{method:'DELETE'});}
              catch(e){cleanupErrors.push('delete_access_policy:'+e.message);}
              reusablePolicyId='';
            }
            if(serviceTokenId){
              try{await cf('/accounts/'+account+'/access/service_tokens/'+encodeURIComponent(serviceTokenId),{method:'DELETE'});}
              catch(e){cleanupErrors.push('delete_service_token:'+e.message);}
              serviceTokenId='';
            }
            if(workerCreated){
              try{await cf('/accounts/'+account+'/workers/scripts/'+encodeURIComponent(worker),{method:'DELETE'});}
              catch(e){cleanupErrors.push('delete_worker:'+e.message);}
              workerCreated=false;
            }
            for(const path of [configPath,wrapperPath]){try{fs.rmSync(path,{force:true});}catch{}}
            clientId='';clientSecret='';probeSecret='';previewDataKey='';turnstileSecret='';
          }

          let primaryError=null;
          let evidence=null;
          try{
            const [appsBefore,tokensBefore,scriptsBefore,prodSubBefore,prodDeployBefore,domainsBefore,casesBefore,eventsBefore]=await Promise.all([
              cf('/accounts/'+account+'/access/apps?per_page=100'),
              cf('/accounts/'+account+'/access/service_tokens?per_page=100'),
              cf('/accounts/'+account+'/workers/scripts'),
              cf('/accounts/'+account+'/workers/scripts/musitu-axiom-support/subdomain'),
              cf('/accounts/'+account+'/workers/scripts/musitu-axiom-support/deployments'),
              cf('/accounts/'+account+'/workers/domains'),
              d1Count('support_cases'),
              d1Count('support_case_events')
            ]);
            if(casesBefore!==0||eventsBefore!==0) throw new Error('private edge drill requires empty support D1');
            const existingApps=Array.isArray(appsBefore.result)?appsBefore.result:[];
            const existingTokens=Array.isArray(tokensBefore.result)?tokensBefore.result:[];
            if(existingApps.some(x=>String(x?.name||'').startsWith('MUSITU Axiom Support Private Edge'))) throw new Error('stale private edge Access app exists');
            if(existingTokens.some(x=>String(x?.name||'').startsWith('MUSITU Axiom Support Private Edge CI'))) throw new Error('stale private edge service token exists');
            const scripts=Array.isArray(scriptsBefore.result)?scriptsBefore.result:[];
            if(scripts.some(x=>String(x?.id||'')===worker)) throw new Error('stale private edge Worker exists');

            const prodSub=prodSubBefore.result||{};
            if(prodSub.enabled===true||prodSub.previews_enabled===true) throw new Error('production support worker public subdomain drift before private edge drill');
            const prodDomains=(Array.isArray(domainsBefore.result)?domainsBefore.result:[]).filter(x=>String(x?.hostname||'')==='support.mftintelligence.com');
            if(prodDomains.length!==0) throw new Error('production support custom domain unexpectedly exists before private edge drill');
            const prodDeployRows=Array.isArray(prodDeployBefore.result)?prodDeployBefore.result:(prodDeployBefore.result?.deployments||[]);
            const prodDeploymentId=String(prodDeployRows?.[0]?.id||'');

            probeSecret=crypto.randomBytes(32).toString('base64url');
            previewDataKey=crypto.randomBytes(32).toString('base64');
            turnstileSecret=crypto.randomBytes(32).toString('base64url');
            mask(probeSecret);mask(previewDataKey);mask(turnstileSecret);

            fs.writeFileSync(wrapperPath,
              "import support from './support/worker.js';\n"+
              "export default {async fetch(request,env){\n"+
              "  const got=request.headers.get('x-musitu-private-edge-probe')||'';\n"+
              "  if(!env.PRIVATE_EDGE_PROBE_SECRET||got!==env.PRIVATE_EDGE_PROBE_SECRET){return new Response('private edge closed',{status:418,headers:{'cache-control':'no-store','x-robots-tag':'noindex'}});}\n"+
              "  return support.fetch(request,env);\n"+
              "}};\n",
              {mode:0o600}
            );
            const config={
              name:worker,
              main:wrapperPath,
              compatibility_date:'2026-10-05',
              workers_dev:false,
              d1_databases:[{binding:'SUPPORT_DB',database_name:'musitu-axiom-support',database_id:d1}],
              ratelimits:[{name:'SUPPORT_INTAKE_RATE_LIMITER',namespace_id:'910052',simple:{limit:5,period:10}}],
              vars:{
                ENVIRONMENT:'production',
                SUPPORT_DOMAIN:'private-edge.invalid',
                TURNSTILE_SITE_KEY:'private-edge-site-key-000000000000',
                SUPPORT_HUMAN_OWNER_REF:'github:evansmusitu',
                SUPPORT_INDEPENDENT_APPROVER_REF:'person:elvis-musitu',
                SUPPORT_READINESS_SHA256:''
              },
              observability:{enabled:true}
            };
            fs.writeFileSync(configPath,JSON.stringify(config,null,2)+'\n',{mode:0o600});
            run('npx',['--yes','wrangler@4.143.0','deploy','--config',configPath],{
              env:{CLOUDFLARE_API_TOKEN:token,CLOUDFLARE_ACCOUNT_ID:account}
            });
            workerCreated=true;

            await cf('/accounts/'+account+'/workers/scripts/'+encodeURIComponent(worker)+'/secrets',{method:'PUT',body:{name:'SUPPORT_DATA_KEY_B64',text:previewDataKey,type:'secret_text'}});
            await cf('/accounts/'+account+'/workers/scripts/'+encodeURIComponent(worker)+'/secrets',{method:'PUT',body:{name:'TURNSTILE_SECRET_KEY',text:turnstileSecret,type:'secret_text'}});
            await cf('/accounts/'+account+'/workers/scripts/'+encodeURIComponent(worker)+'/secrets',{method:'PUT',body:{name:'PRIVATE_EDGE_PROBE_SECRET',text:probeSecret,type:'secret_text'}});

            const scriptsAfter=await cf('/accounts/'+account+'/workers/scripts');
            const edgeRow=(Array.isArray(scriptsAfter.result)?scriptsAfter.result:[]).find(x=>String(x?.id||'')===worker);
            const workerTag=String(edgeRow?.tag||'');
            if(!/^[a-f0-9]{32}$/i.test(workerTag)) throw new Error('ephemeral Worker immutable tag unavailable');

            const service=await cf('/accounts/'+account+'/access/service_tokens',{method:'POST',body:{name:serviceName,duration:'30m',enabled:true}});
            serviceTokenId=String(service.result?.id||'');
            clientId=String(service.result?.client_id||'');
            clientSecret=String(service.result?.client_secret||'');
            if(!serviceTokenId||!clientId||!clientSecret) throw new Error('Access service token creation did not return complete credentials');
            mask(clientId);mask(clientSecret);

            const policy=await cf('/accounts/'+account+'/access/policies',{method:'POST',body:{
              name:policyName,
              decision:'non_identity',
              include:[{service_token:{token_id:serviceTokenId}}]
            }});
            reusablePolicyId=String(policy.result?.id||'');
            if(!reusablePolicyId) throw new Error('Access reusable service policy id missing');

            const app=await cf('/accounts/'+account+'/access/apps',{method:'POST',body:{
              type:'self_hosted',
              name:accessName,
              session_duration:'30m',
              destinations:[{type:'worker',worker_id:workerTag}],
              policies:[{id:reusablePolicyId,precedence:1}]
            }});
            accessAppId=String(app.result?.id||'');
            if(!accessAppId) throw new Error('Access application id missing');

            const [appRead,appPolicies]=await Promise.all([
              cf('/accounts/'+account+'/access/apps/'+encodeURIComponent(accessAppId)),
              cf('/accounts/'+account+'/access/apps/'+encodeURIComponent(accessAppId)+'/policies?per_page=100')
            ]);
            const destinations=Array.isArray(appRead.result?.destinations)?appRead.result.destinations:[];
            if(!destinations.some(x=>x?.type==='worker'&&String(x?.worker_id||'')===workerTag)) throw new Error('Access app Worker destination readback mismatch');
            const policyRows=Array.isArray(appPolicies.result)?appPolicies.result:[];
            if(!policyRows.some(x=>String(x?.id||'')===reusablePolicyId&&String(x?.decision||'')==='non_identity')) throw new Error('Access service-auth policy readback mismatch');

            await new Promise(r=>setTimeout(r,5000));
            await cf('/accounts/'+account+'/workers/scripts/'+encodeURIComponent(worker)+'/subdomain',{method:'POST',body:{enabled:true,previews_enabled:false}});
            subdomainEnabled=true;
            const [sub,accountSubdomain]=await Promise.all([
              cf('/accounts/'+account+'/workers/scripts/'+encodeURIComponent(worker)+'/subdomain'),
              cf('/accounts/'+account+'/workers/subdomain')
            ]);
            if(sub.result?.enabled!==true) throw new Error('ephemeral Worker subdomain did not enable');
            const accountSub=String(accountSubdomain.result?.subdomain||'').trim();
            if(!/^[a-z0-9-]+$/i.test(accountSub)) throw new Error('account Workers subdomain unavailable');
            workerUrl='https://'+worker+'.'+accountSub+'.workers.dev';

            let unauthStatus=0;
            for(let i=0;i<12;i++){
              const r=await fetch(workerUrl+'/health',{redirect:'manual',headers:{'cache-control':'no-cache'}});
              unauthStatus=r.status;
              if(r.status!==418&&r.status!==200) break;
              await new Promise(x=>setTimeout(x,1000));
            }
            if([200,418].includes(unauthStatus)) throw new Error('Access did not intercept unauthenticated ephemeral Worker request');

            const accessHeaders={'CF-Access-Client-Id':clientId,'CF-Access-Client-Secret':clientSecret};
            let sentinelStatus=0;
            for(let i=0;i<12;i++){
              const r=await fetch(workerUrl+'/health',{redirect:'manual',headers:accessHeaders});
              sentinelStatus=r.status;
              if(r.status===418) break;
              await new Promise(x=>setTimeout(x,1000));
            }
            if(sentinelStatus!==418) throw new Error('Access service authentication did not reach closed Worker sentinel');

            const authHeaders={...accessHeaders,'x-musitu-private-edge-probe':probeSecret};
            const health=await request('/health',{headers:authHeaders});
            const healthBody=await health.json();
            if(health.status!==503||healthBody?.production!==true||healthBody?.secure_storage!==true||healthBody?.turnstile!==true||healthBody?.rate_limiter!==true||healthBody?.readiness_evidence!==false) {
              throw new Error('private edge health controls mismatch');
            }

            const sensitive=await request('/.git/config',{headers:authHeaders});
            if(sensitive.status!==404) throw new Error('private edge sensitive path did not fail closed');
            const csp=String(sensitive.headers.get('content-security-policy')||'');
            if(!csp.includes("object-src 'none'")||!csp.includes("frame-ancestors 'none'")) throw new Error('private edge CSP security headers missing');

            const wrongType=await request('/api/v1/cases',{method:'POST',headers:{...authHeaders,'content-type':'text/plain'},body:'{}'});
            if(wrongType.status!==415) throw new Error('private edge wrong content-type boundary mismatch');

            const malformed=await request('/api/v1/cases',{method:'POST',headers:{...authHeaders,'content-type':'application/json'},body:'{'});
            if(malformed.status!==400) throw new Error('private edge malformed JSON boundary mismatch');

            const oversized=await request('/api/v1/cases',{method:'POST',headers:{...authHeaders,'content-type':'application/json'},body:'x'.repeat(24001)});
            if(oversized.status!==413) throw new Error('private edge payload-size boundary mismatch');

            const noProofPayload={
              surface:'web_app',category:'bug',affected_scope:'self',
              summary:'Private edge negative probe',
              description:'Synthetic negative probe; no case should be stored.',
              reproduction:'none',impact:'none',evidence_refs:[],consent_to_process:true
            };
            const noProof=await request('/api/v1/cases',{method:'POST',headers:{...authHeaders,'content-type':'application/json'},body:JSON.stringify(noProofPayload)});
            if(noProof.status!==403) throw new Error('private edge missing Turnstile proof did not fail closed');

            let rateLimited=false;
            let rateAttempts=0;
            for(let i=0;i<24;i++){
              rateAttempts+=1;
              const r=await request('/api/v1/cases',{method:'POST',headers:{...authHeaders,'content-type':'text/plain'},body:'{}'});
              if(r.status===429){
                if(String(r.headers.get('retry-after')||'')!=='60') throw new Error('private edge 429 missing Retry-After');
                rateLimited=true;break;
              }
              if(r.status!==415) throw new Error('unexpected private edge pre-limit status '+r.status);
            }
            if(!rateLimited) throw new Error('live Cloudflare edge rate limiter did not produce 429');

            const [casesAfter,eventsAfter,prodSubAfter,prodDeployAfter,domainsAfter]=await Promise.all([
              d1Count('support_cases'),d1Count('support_case_events'),
              cf('/accounts/'+account+'/workers/scripts/musitu-axiom-support/subdomain'),
              cf('/accounts/'+account+'/workers/scripts/musitu-axiom-support/deployments'),
              cf('/accounts/'+account+'/workers/domains')
            ]);
            if(casesAfter!==0||eventsAfter!==0) throw new Error('private edge negative probes modified support D1');
            const prodSub2=prodSubAfter.result||{};
            if(prodSub2.enabled===true||prodSub2.previews_enabled===true) throw new Error('production support Worker subdomain changed during private edge drill');
            const prodDomains2=(Array.isArray(domainsAfter.result)?domainsAfter.result:[]).filter(x=>String(x?.hostname||'')==='support.mftintelligence.com');
            if(prodDomains2.length!==0) throw new Error('production support custom domain changed during private edge drill');
            const prodDeployRows2=Array.isArray(prodDeployAfter.result)?prodDeployAfter.result:(prodDeployAfter.result?.deployments||[]);
            if(prodDeploymentId&&String(prodDeployRows2?.[0]?.id||'')!==prodDeploymentId) throw new Error('production support Worker deployment changed during private edge drill');

            evidence={
              gate:'MUSITU_AXIOM_SUPPORT_PRIVATE_EDGE_SECURITY_PASS',
              access_unauthenticated_blocked:true,
              access_service_auth_verified:true,
              worker_layer_closed_sentinel_verified:true,
              production_like_health_controls_verified:true,
              sensitive_path_404_verified:true,
              csp_edge_headers_verified:true,
              invalid_media_type_415_verified:true,
              malformed_json_400_verified:true,
              oversized_payload_413_verified:true,
              missing_turnstile_403_verified:true,
              live_rate_limit_429_verified:true,
              live_rate_limit_attempts:rateAttempts,
              support_d1_unchanged:true,
              production_worker_unchanged:true,
              production_support_hostname_unattached:true,
              ephemeral_worker_url_sha256:hash(workerUrl),
              raw_ephemeral_url_recorded:false,
              access_secret_exposed:false,
              customer_data_used:false,
              public_support_deployed:false
            };
          }catch(e){
            primaryError=e;
          }finally{
            await cleanup();
            try{
              const [apps,tokens,scripts,prodSub,domains,cases,events]=await Promise.all([
                cf('/accounts/'+account+'/access/apps?per_page=100'),
                cf('/accounts/'+account+'/access/service_tokens?per_page=100'),
                cf('/accounts/'+account+'/workers/scripts'),
                cf('/accounts/'+account+'/workers/scripts/musitu-axiom-support/subdomain'),
                cf('/accounts/'+account+'/workers/domains'),
                d1Count('support_cases'),d1Count('support_case_events')
              ]);
              const tempApps=(Array.isArray(apps.result)?apps.result:[]).filter(x=>String(x?.name||'')===accessName);
              const tempTokens=(Array.isArray(tokens.result)?tokens.result:[]).filter(x=>String(x?.name||'')===serviceName);
              const tempWorkers=(Array.isArray(scripts.result)?scripts.result:[]).filter(x=>String(x?.id||'')===worker);
              const prodSubFinal=prodSub.result||{};
              const supportDomains=(Array.isArray(domains.result)?domains.result:[]).filter(x=>String(x?.hostname||'')==='support.mftintelligence.com');
              if(tempApps.length||tempTokens.length||tempWorkers.length||prodSubFinal.enabled===true||prodSubFinal.previews_enabled===true||supportDomains.length||cases!==0||events!==0) {
                cleanupErrors.push('post_cleanup_readback_mismatch');
              }
            }catch(e){cleanupErrors.push('post_cleanup_readback:'+e.message);}
          }
          if(primaryError) throw primaryError;
          if(cleanupErrors.length) throw new Error('private edge cleanup failed: '+cleanupErrors.join(';'));
          if(!evidence) throw new Error('private edge drill produced no evidence');
          evidence.cleanup_verified=true;
          evidence.secret_exposed=false;
          console.log(JSON.stringify(evidence));
          })().catch(error=>{ console.error(error?.stack||String(error)); process.exitCode=1; });
          NODE
      - name: Confirm protected repository branch state is unchanged by drill
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'support/axiom-official-support-20261005'
