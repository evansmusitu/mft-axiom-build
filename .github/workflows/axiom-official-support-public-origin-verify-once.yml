name: MUSITU Axiom Support Public Origin Verify Once

on:
  push:
    branches:
      - 'support/axiom-official-support-20261005'
    paths:
      - '.github/workflows/axiom-official-support-public-origin-verify-once.yml'

permissions:
  contents: read

concurrency:
  group: musitu-axiom-support-public-origin-verify-once
  cancel-in-progress: false

jobs:
  verify-public-origin:
    if: github.event_name == 'push' && github.event.before == '159c03caa38f2bf9dbd3705e817133f6f19a7e2b'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 15
    env:
      SUPPORT_DOMAIN: 'support.mftintelligence.com'
      SUPPORT_DEPLOYMENT_MODE: production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_RULESETS_API_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
      CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
      SUPPORT_WORKER_NAME: 'musitu-axiom-support'
      SUPPORT_D1_DATABASE_NAME: 'musitu-axiom-support'
      SUPPORT_HUMAN_OWNER_REF: 'github:evansmusitu'
      SUPPORT_INDEPENDENT_APPROVER_REF: 'person:elvis-musitu'
      GH_READ_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact authorized support commit
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: One-shot authorization and protected-boundary gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF_NAME" = 'support/axiom-official-support-20261005'
          test "$GITHUB_REF_NAME" != 'main'
          test "${{ github.event.before }}" = '159c03caa38f2bf9dbd3705e817133f6f19a7e2b'
          test "$SUPPORT_DOMAIN" = 'support.mftintelligence.com'
          node <<'NODE'
          const api='https://api.github.com/repos/evansmusitu/mft-axiom-build';
          const token=process.env.GH_READ_TOKEN;
          async function get(path){
            const r=await fetch(api+path,{headers:{authorization:'Bearer '+token,accept:'application/vnd.github+json'}});
            if(!r.ok) throw new Error('GitHub protected-boundary read failed HTTP '+r.status+' '+path);
            return r.json();
          }
          const enc=encodeURIComponent;
          const [main,support,claude,pr,authBlob,mcpBlob]=await Promise.all([
            get('/branches/main'),
            get('/branches/'+enc('support/axiom-official-support-20261005')),
            get('/branches/'+enc('distribution/claude-remote-mcp-20261004')),
            get('/pulls/1'),
            get('/git/blobs/8ba0dbc1b6dd1533c6c26bff23991429e03a71a5'),
            get('/git/blobs/4a1ad37a5e7df0e4d3966e8b5f9f0e8f2db69167'),
          ]);
          if(main?.commit?.sha!=='d6a846f6bbe0bccac1758713eb4de167caf07113') throw new Error('protected main drift');
          if(support?.commit?.sha!==process.env.GITHUB_SHA) throw new Error('support branch advanced during authorized run');
          if(claude?.commit?.sha!=='4d956f415431836018e5145227c8df5bd5fde7d8') throw new Error('Claude branch drift');
          if(pr?.state!=='open'||pr?.draft!==true||pr?.merged===true||pr?.head?.sha!=='8fc1fbb7c5ebbcc1604ecf24c5f4594f2d5667e3') throw new Error('PR #1 protected state drift');
          if(authBlob?.sha!=='8ba0dbc1b6dd1533c6c26bff23991429e03a71a5') throw new Error('frozen OpenAI auth blob unavailable');
          if(mcpBlob?.sha!=='4a1ad37a5e7df0e4d3966e8b5f9f0e8f2db69167') throw new Error('frozen OpenAI MCP blob unavailable');
          NODE

      - name: Require exact pre-public readiness boundary without promoting it
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const path='EVIDENCE/axiom-official-support-readiness-current.json';
          const raw=fs.readFileSync(path);
          const e=JSON.parse(raw);
          const expected={
            PUBLIC_ORIGIN:'MISSING',
            SECURE_STORAGE:'PASS',
            ENCRYPTION_KEY_MANAGEMENT:'PASS',
            ANTI_ABUSE:'PARTIAL',
            HUMAN_SUPPORT_OWNER:'PASS',
            ESCALATION_ROSTER:'PASS',
            PRIVACY_RETENTION:'PASS',
            ACCESSIBILITY_REALITY:'PARTIAL',
            SECURITY_REVIEW:'PASS',
            BACKUP_RESTORE:'PASS',
            NOTIFICATION_DELIVERY:'PASS',
          };
          const actual=Object.fromEntries((e.gates||[]).map(x=>[x.gate,x.status]));
          if(e.schema!=='musitu.axiom.support-readiness-snapshot.v1') throw new Error('readiness schema mismatch');
          if(e.required_gate_count!==11||e.pass_count!==8||e.partial_count!==2||e.missing_count!==1) throw new Error('authorized pre-public readiness counts changed');
          if(e.public_operational_claim_authorized!==false) throw new Error('public operational claim must remain false during verification');
          if(e.deployment_dispatch_authorized!==false) throw new Error('canonical 11/11 deployment dispatch must remain false during verification');
          if(e.public_support_deployed!==false) throw new Error('support was already publicly deployed before authorized bootstrap');
          if(JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error('authorized pre-public gate statuses changed');
          const hash=crypto.createHash('sha256').update(raw).digest('hex');
          fs.appendFileSync(process.env.GITHUB_ENV,'SUPPORT_READINESS_SHA256='+hash+'\n');
          NODE

      - name: Discover the already-provisioned D1 and exact Turnstile widget read-only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          import {
            SUPPORT_ACCOUNT_ID,
            listD1Databases,
            selectCloudflareCredential,
            cloudflareRequest,
          } from './support/scripts/provision_cloudflare_d1.mjs';
          const expectedAccount='93f395f5121954671f92fffa453d6b61';
          const expectedDbName='musitu-axiom-support';
          const widgetName='MUSITU Axiom Official Support';
          const supportDomain='support.mftintelligence.com';
          if(SUPPORT_ACCOUNT_ID!==expectedAccount||process.env.CLOUDFLARE_ACCOUNT_ID!==expectedAccount) throw new Error('support Cloudflare account mismatch');
          const credential=await selectCloudflareCredential({env:process.env,preferGlobal:true});
          const databases=await listD1Databases({headers:credential.headers});
          const matches=databases.filter(x=>String(x?.name||'')===expectedDbName);
          if(matches.length!==1) throw new Error('exact existing support D1 was not uniquely discoverable');
          const databaseId=String(matches[0]?.uuid||'');
          if(!/^[a-f0-9]{8}-[a-f0-9]{4}-[1-8][a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$/i.test(databaseId)) throw new Error('support D1 UUID invalid');
          const widgets=await cloudflareRequest({
            headers:credential.headers,
            path:'/accounts/'+expectedAccount+'/challenges/widgets?page=1&per_page=1000',
          });
          const named=(Array.isArray(widgets.result)?widgets.result:[]).filter(x=>String(x?.name||'')===widgetName);
          if(named.length!==1) throw new Error('exact existing support Turnstile widget was not uniquely discoverable');
          const widget=named[0];
          const sitekey=String(widget?.sitekey||'');
          const domains=Array.isArray(widget?.domains)?widget.domains:[];
          if(widget?.mode!=='managed'||domains.length!==1||domains[0]!==supportDomain||!/^[A-Za-z0-9_-]{20,100}$/.test(sitekey)) throw new Error('existing Turnstile widget configuration drift');
          appendFileSync(process.env.GITHUB_ENV,'SUPPORT_D1_DATABASE_ID='+databaseId+'\n');
          appendFileSync(process.env.GITHUB_ENV,'SUPPORT_TURNSTILE_SITE_KEY='+sitekey+'\n');
          NODE

      - name: Re-run complete support regression suite
        run: node --test support/tests/*.test.mjs

      - name: Render exact production configuration for verification origin
        run: node support/scripts/render_wrangler.mjs support-wrangler.generated.json

      - name: Verify public-origin config and secret bindings without reading secret values
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const c=require('./support-wrangler.generated.json');
          if(c.name!==process.env.SUPPORT_WORKER_NAME) throw new Error('worker name mismatch');
          if(c.workers_dev!==false) throw new Error('workers_dev must remain disabled');
          if(c.vars?.ENVIRONMENT!=='production') throw new Error('verification origin must exercise production controls');
          if(c.vars?.SUPPORT_DOMAIN!=='support.mftintelligence.com') throw new Error('support hostname mismatch');
          if(!Array.isArray(c.routes)||c.routes.length!==1||c.routes[0]?.pattern!=='support.mftintelligence.com'||c.routes[0]?.custom_domain!==true) throw new Error('exact custom support domain required');
          NODE
          node --input-type=module <<'NODE'
          import {selectCloudflareCredential,cloudflareRequest,SUPPORT_ACCOUNT_ID} from './support/scripts/provision_cloudflare_d1.mjs';
          const credential=await selectCloudflareCredential({env:process.env,preferGlobal:true});
          const response=await cloudflareRequest({
            headers:credential.headers,
            path:'/accounts/'+SUPPORT_ACCOUNT_ID+'/workers/scripts/musitu-axiom-support/secrets',
          });
          const names=new Set((Array.isArray(response.result)?response.result:[]).map(x=>String(x?.name||'')));
          for(const required of ['SUPPORT_DATA_KEY_B64','TURNSTILE_SECRET_KEY']) if(!names.has(required)) throw new Error('required support Worker secret binding missing: '+required);
          NODE

      - name: Require zero customer support rows before public verification
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const account=String(process.env.CLOUDFLARE_ACCOUNT_ID||'');
          const db=String(process.env.SUPPORT_D1_DATABASE_ID||'');
          const token=String(process.env.CLOUDFLARE_RULESETS_API_TOKEN||'');
          if(!account||!db||!token) throw new Error('Cloudflare D1 read configuration missing');
          function headers(){
            return {authorization:'Bearer '+token,'content-type':'application/json',accept:'application/json'};
          }
          async function count(table){
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+db+'/query',{
              method:'POST',headers:headers(),body:JSON.stringify({sql:'SELECT COUNT(*) AS count FROM '+table+';'})
            });
            const p=await r.json();
            if(!r.ok||p?.success===false) throw new Error('D1 read failed HTTP '+r.status);
            const block=Array.isArray(p.result)?p.result[0]:p.result;
            return Number(block?.results?.[0]?.count??-1);
          }
          const [cases,events]=await Promise.all([count('support_cases'),count('support_case_events')]);
          if(cases!==0||events!==0) throw new Error('public verification requires zero customer support rows');
          NODE

      - name: Verify required support schema objects read-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const account=String(process.env.CLOUDFLARE_ACCOUNT_ID||'');
          const db=String(process.env.SUPPORT_D1_DATABASE_ID||'');
          const token=String(process.env.CLOUDFLARE_RULESETS_API_TOKEN||'');
          if(!account||!db||!token) throw new Error('Cloudflare D1 schema read configuration missing');
          async function q(sql){
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+db+'/query',{
              method:'POST',
              headers:{authorization:'Bearer '+token,'content-type':'application/json',accept:'application/json'},
              body:JSON.stringify({sql})
            });
            const p=await r.json();
            if(!r.ok||p?.success===false) throw new Error('D1 schema read failed HTTP '+r.status);
            const block=Array.isArray(p.result)?p.result[0]:p.result;
            return block?.results||[];
          }
          const [objects,columns]=await Promise.all([
            q("SELECT type,name FROM sqlite_master WHERE type IN ('table','trigger')"),
            q('PRAGMA table_info(support_cases)')
          ]);
          const names=new Set(objects.map(x=>String(x?.name||'')));
          for(const required of [
            'support_cases','support_case_events','support_case_purge_authorizations','support_deletion_receipts',
            'support_case_event_no_update','support_case_event_no_delete','support_case_no_delete',
            'support_deletion_receipt_no_update','support_deletion_receipt_no_delete'
          ]) if(!names.has(required)) throw new Error('required support schema object missing: '+required);
          const cols=new Set(columns.map(x=>String(x?.name||'')));
          for(const required of ['closed_at','retention_expires_at','legal_hold_until','legal_hold_review_at']) if(!cols.has(required)) throw new Error('required retention column missing: '+required);
          NODE

      - name: Publish exact support custom domain for verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
        run: npx --yes wrangler@4.143.0 deploy --config support-wrangler.generated.json

      - name: Verify custom domain exists while workers.dev and previews remain disabled
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const account=String(process.env.CLOUDFLARE_ACCOUNT_ID||'');
          const worker=String(process.env.SUPPORT_WORKER_NAME||'');
          const token=String(process.env.CLOUDFLARE_ACCESS_API_TOKEN||'');
          function headers(){
            if(!token) throw new Error('Cloudflare Workers verification token missing');
            return {authorization:'Bearer '+token,accept:'application/json'};
          }
          async function cf(path){
            const r=await fetch('https://api.cloudflare.com/client/v4'+path,{headers:headers()});
            const p=await r.json();
            if(!r.ok||p?.success===false) throw new Error('Cloudflare read failed HTTP '+r.status+' '+path);
            return p?.result;
          }
          const [sub,domains]=await Promise.all([
            cf('/accounts/'+account+'/workers/scripts/'+encodeURIComponent(worker)+'/subdomain'),
            cf('/accounts/'+account+'/workers/domains'),
          ]);
          if(sub?.enabled===true||sub?.previews_enabled===true) throw new Error('workers.dev or previews unexpectedly enabled');
          const matches=(Array.isArray(domains)?domains:[]).filter(x=>String(x?.hostname||'')==='support.mftintelligence.com');
          if(matches.length!==1) throw new Error('exact support custom domain was not attached once');
          if(String(matches[0]?.service||matches[0]?.service_name||'') && String(matches[0]?.service||matches[0]?.service_name||'')!==worker) throw new Error('support custom domain points to unexpected Worker');
          NODE

      - name: Verify live public surface and fail-closed missing Turnstile proof
        shell: bash
        run: |
          set -euo pipefail
          rm -f support-health.json support-home.html support-missing-proof.json
          ok=0
          for i in $(seq 1 20); do
            if curl --fail --silent --show-error --proto '=https' "https://$SUPPORT_DOMAIN/health" > support-health.json; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          node -e "const h=require('./support-health.json'); if(h.status!=='READY'||!h.secure_storage||!h.abuse_gate||!h.turnstile||!h.rate_limiter||!h.human_owner||!h.independent_approver||!h.readiness_evidence||h.production!==true) process.exit(1)"
          curl --fail --silent --show-error --proto '=https' "https://$SUPPORT_DOMAIN/" > support-home.html
          grep -q 'MUSITU Axiom Support' support-home.html
          status=$(curl --silent --show-error --proto '=https' -o support-missing-proof.json -w '%{http_code}'             -X POST "https://$SUPPORT_DOMAIN/api/v1/cases"             -H 'content-type: application/json'             --data '{"surface":"web_app","category":"bug","affected_scope":"self","summary":"Synthetic public-origin verification","description":"Synthetic verification request; expected rejection before storage.","reproduction":"Verification only.","impact":"None.","evidence_refs":[],"consent_to_process":true}')
          test "$status" = '403'
          node -e "const r=require('./support-missing-proof.json'); if(!['ABUSE_PROOF_REQUIRED','TURNSTILE_REQUIRED'].includes(String(r.error||''))) process.exit(1)"
          rm support-health.json support-home.html support-missing-proof.json

      - name: Prove missing-proof probe stored no case data
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const account=String(process.env.CLOUDFLARE_ACCOUNT_ID||'');
          const db=String(process.env.SUPPORT_D1_DATABASE_ID||'');
          const token=String(process.env.CLOUDFLARE_API_TOKEN||'');
          const email=String(process.env.CLOUDFLARE_EMAIL||'');
          const key=String(process.env.CLOUDFLARE_API_KEY||'');
          function headers(){
            if(email&&key) return {'X-Auth-Email':email,'X-Auth-Key':key,'content-type':'application/json',accept:'application/json'};
            if(token) return {authorization:'Bearer '+token,'content-type':'application/json',accept:'application/json'};
            throw new Error('Cloudflare authentication missing');
          }
          async function count(table){
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+db+'/query',{
              method:'POST',headers:headers(),body:JSON.stringify({sql:'SELECT COUNT(*) AS count FROM '+table+';'})
            });
            const p=await r.json();
            if(!r.ok||p?.success===false) throw new Error('D1 readback failed HTTP '+r.status);
            const block=Array.isArray(p.result)?p.result[0]:p.result;
            return Number(block?.results?.[0]?.count??-1);
          }
          const [cases,events]=await Promise.all([count('support_cases'),count('support_case_events')]);
          if(cases!==0||events!==0) throw new Error('verification probe unexpectedly stored support data');
          console.log(JSON.stringify({
            gate:'MUSITU_AXIOM_SUPPORT_PUBLIC_ORIGIN_VERIFICATION',
            hostname:'support.mftintelligence.com',
            public_origin_live:true,
            workers_dev_enabled:false,
            previews_enabled:false,
            missing_turnstile_proof_http:403,
            customer_case_count:cases,
            customer_event_count:events,
            public_operational_claim_authorized:false,
            canonical_deployment_dispatch_authorized:false,
            secret_exposed:false
          }));
          NODE
          rm -f support-wrangler.generated.json
