name: MUSITU Axiom Support Retention Schema Migration Once

on:
  push:
    branches:
      - 'support/axiom-official-support-20261005'
    paths:
      - '.github/workflows/axiom-official-support-retention-migration-once.yml'

permissions:
  contents: read

concurrency:
  group: musitu-axiom-support-retention-schema-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.before == '5455f2a2d0b7d5fd4bdc71a3057272253f569940'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: axiom-support-production
    env:
      SUPPORT_RETENTION_MIGRATION_CONFIRM: MIGRATE_MUSITU_AXIOM_SUPPORT_RETENTION_SCHEMA
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
      CLOUDFLARE_ZONE_ID: '5b56528f03948ff5917a5e0cd9f7109e'
      SUPPORT_D1_DATABASE_ID: 'a525c8b6-9b44-413b-a219-46e419b71b12'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact one-shot boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'support/axiom-official-support-20261005'
          test "$GITHUB_REF_NAME" != 'main'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "${{ github.event.before }}" = '5455f2a2d0b7d5fd4bdc71a3057272253f569940'
      - name: Re-run retention contracts before D1 write
        run: |
          node --test support/tests/retention_policy.test.mjs
          node --test support/tests/retention_lifecycle.test.mjs
          node --test support/tests/retention_migration.test.mjs
      - name: Migrate empty non-public support D1 with Time Travel rollback
        run: node support/scripts/migrate_retention_schema.mjs
      - name: Publish sanitized migration evidence
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const e=require("./support-retention-schema-evidence.json"); const h=require("node:fs").readFileSync("support-retention-schema-evidence.json.sha256","utf8").split(" ")[0]; console.log(JSON.stringify({gate:e.gate,status:e.status,public_route_absent_verified:e.public_route_absent_verified,support_case_count_before:e.support_case_count_before,support_event_count_before:e.support_event_count_before,support_case_count_after:e.support_case_count_after,support_event_count_after:e.support_event_count_after,migration_write_performed:e.migration_write_performed,evidence_sha256:h}))'
          rm support-retention-schema-evidence.json support-retention-schema-evidence.json.sha256
