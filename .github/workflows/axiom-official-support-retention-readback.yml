name: MUSITU Axiom Retention Drill Readback

on:
  push:
    branches:
      - 'support/axiom-official-support-20261005'
    paths:
      - '.github/workflows/axiom-official-support-retention-readback.yml'

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
      CF_ACCOUNT: '93f395f5121954671f92fffa453d6b61'
      CF_DB: 'a525c8b6-9b44-413b-a219-46e419b71b12'
    steps:
      - name: Read synthetic retention state only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CF_TOKEN,account=process.env.CF_ACCOUNT,db=process.env.CF_DB;
          async function q(sql,params=[]){
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+db+'/query',{
              method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json',accept:'application/json'},
              body:JSON.stringify({sql,params})
            });
            const p=await r.json();
            if(!r.ok||p?.success===false) throw new Error('readback failed HTTP '+r.status);
            return p?.result?.[0]?.results||[];
          }
          const [cases,events,auth,receipts]=await Promise.all([
            q('SELECT case_id,state,legal_hold_until,legal_hold_review_at FROM support_cases ORDER BY case_id'),
            q('SELECT case_id,type FROM support_case_events ORDER BY sequence'),
            q('SELECT case_id FROM support_case_purge_authorizations ORDER BY case_id'),
            q('SELECT COUNT(*) AS count FROM support_deletion_receipts')
          ]);
          console.log(JSON.stringify({
            gate:'MUSITU_AXIOM_RETENTION_DRILL_READBACK',
            cases:cases.map(x=>({case_id:String(x.case_id||''),state:String(x.state||''),legal_hold_active:Boolean(x.legal_hold_until),review_due_present:Boolean(x.legal_hold_review_at)})),
            event_types:events.map(x=>String(x.type||'')),
            purge_authorization_count:auth.length,
            deletion_receipt_count:Number(receipts[0]?.count??-1),
            write_performed:false,secret_exposed:false
          }));
          NODE
