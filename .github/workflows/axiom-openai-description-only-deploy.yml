name: Axiom approved OpenAI description-only deployment

on:
  push:
    branches:
      - openai/axiom-descriptions-20261027

permissions:
  contents: read

concurrency:
  group: musitu-axiom-public-plugin-cutover
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref == 'refs/heads/openai/axiom-descriptions-20261027' && github.event.head_commit.message == 'Deploy approved Axiom tool descriptions 20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved source and preservation contracts
        run: |
          node --check candidate/mcp/musitu_axiom_plugin_gate_v4.mjs
          node --test tests/public-tool-descriptions.test.mjs
          python3 -m unittest discover -s tests -p 'test_description_deployment.py' -v
      - name: Deploy only the approved gate content and verify readback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 deploy_description_only.py
      - name: Retain deployment evidence and the guarded rollback plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-openai-description-only-deployment-20261027
          path: deployment-evidence/
          retention-days: 30
          if-no-files-found: warn
