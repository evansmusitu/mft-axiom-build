name: Axiom reviewer fix read-only source capture
on:
  push:
    branches: [openai/reviewer-fixes-20261028]
    paths: [.github/workflows/axiom-openai-review-readback-20261028.yml]
permissions:
  contents: read
jobs:
  capture-current-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture current sources and settings without mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AXIOM_LEGACY_PAYLOAD_PASSPHRASE: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: python3 ops/openai_review_readback.py
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-reviewer-fix-private-readback-20261028
          path: review-readback/
          retention-days: 7
          if-no-files-found: error
