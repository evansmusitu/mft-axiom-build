name: MUSITU Axiom OpenAI Reviewer Demo Publication V1

on:
  workflow_dispatch:
  push:
    branches:
      - frontier/axiom-v5-skill-fabric
    paths:
      - '.github/workflows/axiom-openai-reviewer-demo-publication-v1.yml'

permissions:
  contents: write

concurrency:
  group: musitu-axiom-public-plugin-cutover
  cancel-in-progress: false

jobs:
  publish-reviewer-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      D1_UUID: 504029cc-f9a5-495e-818f-63c6144b4ea4
      MCP_HOST: mcp.mftintelligence.com
      MCP_PUBLIC_WORKER: musitu-axiom-mcp
      MCP_CORE_WORKER: musitu-axiom-mcp-core
      AUTH_ISSUER: https://auth.mftintelligence.com
      TARGET_BRANCH: frontier/axiom-v5-skill-fabric
      VIDEO_PATH: submission/reviewer/MUSITU_Axiom_OpenAI_Reviewer_Demo_FINAL.mp4
      WRAPPER_PATH: mcp/musitu_axiom_plugin_gate_v4_demo.mjs
      EXPECTED_SHA256: 779be1d7948f0971f673d54d99572a6dada168104f10388cc3139a4cd423e5d3
      EXPECTED_SIZE: '6325952'
      RELAY_URL: 'https://uc2a5b1d3e25a043e851d6f67f7f.dl.dropboxusercontent.com/cd/0/get/DH3j42ZPYnBTlEYeY2J-WDlzZ13a98RBNMUh6xVQ9H2Ih0-_qY4mdQG2iwMFKMgLgngLRRxTHQvnFp9FT1_7wV8tJ6OUbqZklwDbNL96lSzySaJ2YA84F0oFGzvFLyUGEBko6JQNRKcYytq6vOrGYTG0DgE9bNgEQga4uh7_v_5eWw/file?c_luid=2441df78'

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Materialize exact reviewer video and commit immutable asset
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$GITHUB_SHA" || { echo 'Fail-closed: branch advanced before asset materialization'; exit 1; }
          mkdir -p "$(dirname "$VIDEO_PATH")"
          verify_video() {
            test -f "$VIDEO_PATH"
            test "$(stat -c%s "$VIDEO_PATH")" = "$EXPECTED_SIZE"
            test "$(sha256sum "$VIDEO_PATH" | awk '{print $1}')" = "$EXPECTED_SHA256"
            python - <<'PY'
          import os
          p=os.environ['VIDEO_PATH']
          b=open(p,'rb').read(32)
          if len(b)<12 or b[4:8] != b'ftyp':
              raise SystemExit('Fail-closed: expected ISO-BMFF/MP4 signature missing')
          print('mp4_signature=PASS')
          PY
          }
          if [ -f "$VIDEO_PATH" ]; then
            verify_video
            echo 'Verified reviewer asset already present.'
          else
            test -n "$RELAY_URL" || { echo 'Fail-closed: reviewer asset absent and relay unavailable'; exit 1; }
            curl --fail --location --silent --show-error --max-time 180 "$RELAY_URL" -o "$VIDEO_PATH"
            verify_video
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "$VIDEO_PATH"
            git commit -m 'Add verified OpenAI reviewer demo asset'
            git push origin HEAD:"$TARGET_BRANCH"
          fi
          ASSET_COMMIT="$(git log -1 --format=%H -- "$VIDEO_PATH")"
          test -n "$ASSET_COMMIT"
          echo "asset_commit=$ASSET_COMMIT" >> "$GITHUB_OUTPUT"
          echo "asset_sha256=$EXPECTED_SHA256" >> "$GITHUB_OUTPUT"

      - name: Generate immutable demo wrapper and commit source
        id: wrapper
        env:
          ASSET_COMMIT: ${{ steps.asset.outputs.asset_commit }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$WRAPPER_PATH")"
          python - <<'PY'
          from pathlib import Path
          import os
          asset=os.environ['ASSET_COMMIT']
          video=os.environ['VIDEO_PATH']
          sha=os.environ['EXPECTED_SHA256']
          size=os.environ['EXPECTED_SIZE']
          raw=f"https://raw.githubusercontent.com/evansmusitu/mft-axiom-build/{asset}/{video}"
          s=f'''import base from "./musitu_axiom_plugin_gate_v4.mjs";
          const DEMO_URL={raw!r};
          const DEMO_SHA256={sha!r};
          const DEMO_SIZE={size!r};
          async function reviewerDemo(req){{
            const h=new Headers();
            const range=req.headers.get("range");
            if(range)h.set("range",range);
            h.set("user-agent","MUSITU-Axiom-Reviewer-Demo/1.0");
            const method=req.method==="HEAD"?"HEAD":"GET";
            const r=await fetch(DEMO_URL,{{method,headers:h,redirect:"follow"}});
            if(r.status!==200&&r.status!==206)return new Response("Reviewer demo unavailable",{{status:502,headers:{{"content-type":"text/plain; charset=utf-8","cache-control":"no-store"}}}});
            const out=new Headers(r.headers);
            out.set("content-type","video/mp4");
            out.set("content-disposition",'inline; filename="MUSITU_Axiom_OpenAI_Reviewer_Demo_FINAL.mp4"');
            out.set("cache-control","public, max-age=3600, immutable");
            out.set("accept-ranges","bytes");
            out.set("x-content-type-options","nosniff");
            out.set("x-musitu-demo-sha256",DEMO_SHA256);
            out.set("x-musitu-demo-size",DEMO_SIZE);
            return new Response(method==="HEAD"?null:r.body,{{status:r.status,headers:out}});
          }}
          export default{{async fetch(req,env,ctx){{
            const u=new URL(req.url);
            if(u.pathname==="/demo.mp4"&&(req.method==="GET"||req.method==="HEAD"))return reviewerDemo(req);
            return base.fetch(req,env,ctx);
          }}}};
          '''
          Path(os.environ['WRAPPER_PATH']).write_text(s)
          PY
          node --check "$WRAPPER_PATH"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet -- "$WRAPPER_PATH" || [ -n "$(git status --porcelain -- "$WRAPPER_PATH")" ]; then
            git add "$WRAPPER_PATH"
            git commit -m 'Bind immutable reviewer demo to public MCP route'
            git push origin HEAD:"$TARGET_BRANCH"
          fi
          WRAPPER_COMMIT="$(git log -1 --format=%H -- "$WRAPPER_PATH")"
          test -n "$WRAPPER_COMMIT"
          echo "wrapper_commit=$WRAPPER_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Deploy wrapper, prove no regression, and verify exact public bytes
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          ASSET_COMMIT: ${{ steps.asset.outputs.asset_commit }}
          WRAPPER_COMMIT: ${{ steps.wrapper.outputs.wrapper_commit }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,secrets,time,urllib.error,urllib.parse,urllib.request
          api=os.environ['CF_API']; aid=os.environ['ACCOUNT_ID']; dbid=os.environ['D1_UUID']; host=os.environ['MCP_HOST']; pub=os.environ['MCP_PUBLIC_WORKER']; core=os.environ['MCP_CORE_WORKER']; issuer=os.environ['AUTH_ISSUER']; resource='https://'+host
          expected_sha=os.environ['EXPECTED_SHA256']; expected_size=int(os.environ['EXPECTED_SIZE'])
          wrapper=pathlib.Path(os.environ['WRAPPER_PATH']).read_bytes(); original=pathlib.Path('mcp/musitu_axiom_plugin_gate_v4.mjs').read_bytes()
          admin={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'Accept':'application/json','User-Agent':'MUSITU-Axiom-Reviewer-Demo-Publisher/1.0'}
          hidden={'musitu_axiom_plans','musitu_axiom_recommend_plan','musitu_axiom_start_checkout','musitu_axiom_checkout_status'}
          expected_scopes=['openid','email','axiom.execute']
          def raw(url,method='GET',headers=None,body=None,timeout=60):
            req=urllib.request.Request(url,headers=dict(headers or {}),method=method,data=body)
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,r.headers,r.read()
            except urllib.error.HTTPError as e:return e.code,e.headers,e.read()
            except urllib.error.URLError as e:return 0,{},str(e).encode()
          def cf(path,method='GET',obj=None):
            h=dict(admin); b=None
            if obj is not None:
              h['Content-Type']='application/json'; b=json.dumps(obj,separators=(',',':')).encode()
            c,_,r=raw(api+path,method,h,b)
            if not 200<=c<300: raise RuntimeError(f'Cloudflare HTTP {c} {method} {path}: {r[:180]!r}')
            o=json.loads(r or b'{}')
            if o.get('success') is False: raise RuntimeError('Cloudflare success=false '+path)
            return o.get('result')
          def multipart(main_source,include_original):
            bindings=[
              {'type':'d1','name':'AXIOM_DB','id':dbid},
              {'type':'plain_text','name':'AUTH_ISSUER','text':issuer},
              {'type':'plain_text','name':'MCP_PUBLIC_BASE','text':resource},
              {'type':'service','name':'MCP_CORE','service':core},
            ]
            meta={'main_module':'index.mjs','compatibility_date':'2026-09-05','bindings':bindings}
            bd='----MUSITU'+secrets.token_hex(16); parts=[]
            def add(x):parts.append(x.encode() if isinstance(x,str) else x)
            add(f'--{bd}\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n'); add(json.dumps(meta,separators=(',',':'))); add('\r\n')
            add(f'--{bd}\r\nContent-Disposition: form-data; name="index.mjs"; filename="index.mjs"\r\nContent-Type: application/javascript+module\r\n\r\n'); add(main_source); add('\r\n')
            if include_original:
              add(f'--{bd}\r\nContent-Disposition: form-data; name="musitu_axiom_plugin_gate_v4.mjs"; filename="musitu_axiom_plugin_gate_v4.mjs"\r\nContent-Type: application/javascript+module\r\n\r\n'); add(original); add('\r\n')
            add(f'--{bd}--\r\n')
            return bd,b''.join(parts)
          def upload(main_source,include_original):
            bd,body=multipart(main_source,include_original); h=dict(admin); h['Content-Type']='multipart/form-data; boundary='+bd
            c,_,b=raw(f'{api}/accounts/{aid}/workers/scripts/{urllib.parse.quote(pub,safe="")}', 'PUT',h,body,90)
            if not 200<=c<300: raise RuntimeError('Worker upload failed '+str(c)+' '+b[:180].decode('utf-8','ignore'))
          def probe(path,method='GET',headers=None,body=None):
            h={'User-Agent':'MUSITU-Axiom-Reviewer-Demo-Verify/1.0','Accept':'*/*'}
            if headers:h.update(headers)
            return raw(resource+path,method,h,body,90)
          def rpc(method,params=None,id=1):
            body=json.dumps({'jsonrpc':'2.0','id':id,'method':method,'params':params or {}},separators=(',',':')).encode()
            c,h,b=probe('/mcp','POST',{'content-type':'application/json','accept':'application/json'},body)
            try:o=json.loads(b or b'{}')
            except:o={}
            return c,h,o
          def verify_core_contract():
            hc,_,hb=probe('/health')
            if hc!=200: raise RuntimeError('health HTTP '+str(hc))
            h=json.loads(hb or b'{}')
            if h.get('ok') is not True or h.get('oauth_enforced') is not True or h.get('server_version')!='4.0.1': raise RuntimeError('health contract drift')
            lc,_,lo=rpc('tools/list',id=71); tools=(lo.get('result') or {}).get('tools') or []; names={t.get('name') for t in tools if isinstance(t,dict)}
            if lc!=200 or len(tools)!=108 or names&hidden: raise RuntimeError('public tool surface drift')
            mc,_,mb=probe('/.well-known/oauth-protected-resource')
            meta=json.loads(mb or b'{}') if mc==200 else {}
            if mc!=200 or meta.get('resource')!=resource or meta.get('authorization_servers')!=[issuer] or meta.get('scopes_supported')!=expected_scopes: raise RuntimeError('OAuth protected-resource metadata drift')
            dc,_,do=rpc('server/discover',id=72)
            if dc!=200 or (do.get('result') or {}).get('resultType')!='complete': raise RuntimeError('modern MCP discovery drift')
          verify_core_contract()
          mutated=False
          try:
            upload(wrapper,True); mutated=True
            ok=False
            for _ in range(40):
              try:
                verify_core_contract()
                hc,hh,_=probe('/demo.mp4','HEAD')
                if hc==200 and str(hh.get('content-type','')).lower().startswith('video/mp4') and hh.get('x-musitu-demo-sha256')==expected_sha:
                  ok=True; break
              except Exception:
                pass
              time.sleep(2)
            if not ok: raise RuntimeError('reviewer demo route did not converge')
            gc,gh,gb=probe('/demo.mp4','GET')
            if gc!=200: raise RuntimeError('demo GET HTTP '+str(gc))
            if not str(gh.get('content-type','')).lower().startswith('video/mp4'): raise RuntimeError('demo content-type drift')
            if len(gb)!=expected_size: raise RuntimeError(f'demo size mismatch {len(gb)}')
            got=hashlib.sha256(gb).hexdigest()
            if got!=expected_sha: raise RuntimeError('demo SHA-256 mismatch '+got)
            rc,rh,rb=probe('/demo.mp4','GET',{'Range':'bytes=0-1023'})
            if rc!=206 or len(rb)!=1024 or not str(rh.get('content-range','')).startswith(f'bytes 0-1023/{expected_size}'):
              raise RuntimeError('demo byte-range contract failed')
            hc,hh,_=probe('/demo.mp4','HEAD')
            if hc!=200 or hh.get('x-musitu-demo-sha256')!=expected_sha or hh.get('x-musitu-demo-size')!=str(expected_size): raise RuntimeError('demo HEAD integrity contract failed')
            verify_core_contract()
            evidence={
              'ok':True,
              'public_url':resource+'/demo.mp4',
              'sha256':expected_sha,
              'size':expected_size,
              'asset_commit':os.environ['ASSET_COMMIT'],
              'wrapper_commit':os.environ['WRAPPER_COMMIT'],
              'http_get':gc,
              'http_range':rc,
              'http_head':hc,
              'content_type':gh.get('content-type'),
              'content_range':rh.get('content-range'),
              'tool_count':108,
              'oauth_scopes':expected_scopes,
              'hidden_commerce_tools_exposed':False,
              'mcp_modern_discovery':'PASS',
            }
            pathlib.Path('/tmp/musitu-axiom-reviewer-demo-production-proof.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
            print('MUSITU_AXIOM_REVIEWER_DEMO_PUBLICATION_PASS')
            print(json.dumps(evidence,sort_keys=True))
          except Exception:
            if mutated:
              try:
                upload(original,False)
                for _ in range(30):
                  try:
                    verify_core_contract(); print('MUSITU_AXIOM_REVIEWER_DEMO_ROLLBACK_PASS'); break
                  except Exception: time.sleep(2)
              except Exception as re:
                print('ROLLBACK_ERROR',repr(re))
            raise
          PY

      - name: Upload reviewer demo production proof
        uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-reviewer-demo-production-proof
          path: /tmp/musitu-axiom-reviewer-demo-production-proof.json
          retention-days: 30
          if-no-files-found: error
