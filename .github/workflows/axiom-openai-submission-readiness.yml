name: MUSITU Axiom current plugin readiness
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/axiom-openai-submission-readiness.yml'
      - 'plugins/musitu-axiom/**'
      - 'mcp/musitu_axiom_plugin_gate_v4.mjs'
      - 'mcp/operation_contracts.json'
      - 'mcp/plugin_contract_runtime.mjs'
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation dependencies
        run: python3 -m pip install jsonschema==4.26.0 PyYAML==6.0.3
      - name: Verify package, contracts, and regression behavior
        run: |
          python3 ops/build_axiom_plugin_package.py
          python3 ops/verify_axiom_tool_schemas.py
          node --test mcp/tests/plugin_gate.test.mjs
      - name: Check the live public surface without credentials
        run: python3 ops/verify_axiom_live_public.py
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-v205-public-readiness
          path: axiom-v205-public-readiness.json
          retention-days: 30
          if-no-files-found: error
