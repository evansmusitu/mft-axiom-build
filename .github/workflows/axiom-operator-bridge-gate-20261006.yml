name: MUSITU Axiom Operator Bridge Gate 20261006

on:
  push:
    branches:
      - frontier/axiom-operator-bridge-20261006
    paths:
      - 'frontier_v5/runtime/operator_bridge.py'
      - 'frontier_v5/runtime/operator_mcp.py'
      - 'frontier_v5/runtime/operator_http.py'
      - 'frontier_v5/runtime/operator_state.py'
      - 'frontier_v5/runtime/operator_remote_core.py'
      - 'frontier_v5/runtime/operator_daemon.py'
      - 'api/operator_core.py'
      - 'api/health.mjs'
      - 'api/mcp.mjs'
      - 'package.json'
      - 'vercel.json'
      - 'frontier_v5/tests/test_operator_bridge_contract.py'
      - 'docs/axiom_final_product/AXIOM_OPERATOR_BRIDGE_V1.md'
      - '.github/workflows/axiom-operator-bridge-gate-20261006.yml'
      - '.github/workflows/axiom-operator-modal-private-deploy-20261006.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout isolated candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Prove isolated ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=07a01aa59e5c8512a074fcb5c4a147d265b1221a
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          python - <<'PY'
          import subprocess
          base='07a01aa59e5c8512a074fcb5c4a147d265b1221a'
          allowed={
            'frontier_v5/runtime/operator_bridge.py',
            'frontier_v5/runtime/operator_mcp.py',
            'frontier_v5/runtime/operator_http.py',
            'frontier_v5/runtime/operator_state.py',
            'frontier_v5/runtime/operator_remote_core.py',
            'frontier_v5/runtime/operator_daemon.py',
            'api/operator_core.py',
            'api/health.mjs',
            'api/mcp.mjs',
            'package.json',
            'vercel.json',
            'frontier_v5/tests/test_operator_bridge_contract.py',
            'docs/axiom_final_product/AXIOM_OPERATOR_BRIDGE_V1.md',
            '.github/workflows/axiom-operator-bridge-gate-20261006.yml',
            '.github/workflows/axiom-operator-modal-private-deploy-20261006.yml',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',f'{base}..HEAD'],text=True).splitlines())
          bad=sorted(changed-allowed)
          if bad:
              raise SystemExit('operator bridge scope escaped: '+repr(bad))
          PY

      - name: Run underlying AXIOM subsystem contracts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_persistent_planner.py
          PYTHONPATH=. python frontier_v5/tests/test_agent_automation.py
          PYTHONPATH=. python frontier_v5/tests/test_artifact_engine.py
          PYTHONPATH=. python frontier_v5/tests/test_evidence_observatory.py
          PYTHONPATH=. python frontier_v5/tests/test_computer_execution.py
          PYTHONPATH=. python frontier_v5/tests/test_provider_fallback_contract.py
          PYTHONPATH=. python frontier_v5/tests/test_mcp_2026_contract.py

      - name: Verify remote deployment adapters
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile api/operator_core.py frontier_v5/runtime/operator_remote_core.py frontier_v5/runtime/operator_state.py frontier_v5/runtime/operator_daemon.py
          node --check api/mcp.mjs
          node --check api/health.mjs
          python - <<'PY'
          import json
          for path in ('package.json','vercel.json'):
              json.load(open(path,encoding='utf-8'))
          print('MUSITU_AXIOM_OPERATOR_REMOTE_ADAPTERS_PASS')
          PY

      - name: Run operator bridge contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_operator_bridge_contract.py | tee /tmp/operator-bridge.log
          grep -q 'MUSITU_AXIOM_OPERATOR_BRIDGE_CONTRACT_PASS' /tmp/operator-bridge.log

      - name: Prove no production or public-submission authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files=[
            Path('frontier_v5/runtime/operator_bridge.py'),
            Path('frontier_v5/runtime/operator_mcp.py'),
            Path('frontier_v5/runtime/operator_http.py'),
            Path('frontier_v5/runtime/operator_state.py'),
            Path('frontier_v5/runtime/operator_remote_core.py'),
            Path('frontier_v5/runtime/operator_daemon.py'),
            Path('api/operator_core.py'),
            Path('api/health.mjs'),
            Path('api/mcp.mjs'),
            Path('vercel.json'),
            Path('.github/workflows/axiom-operator-bridge-gate-20261006.yml'),
            Path('.github/workflows/axiom-operator-modal-private-deploy-20261006.yml'),
          ]
          text='\n'.join(p.read_text() if p.exists() else '' for p in files)
          forbidden=[
            'wrangler'+' deploy',
            'kubectl'+' apply',
            'terraform'+' apply',
            'git'+' push',
            'gh pr'+' merge',
            'mcp/'+'musitu_axiom_plugin_gate_v4.mjs',
            'mcp/'+'musitu_axiom_mcp_worker_v2.mjs',
          ]
          bad=[x for x in forbidden if x in text]
          if bad:
              raise SystemExit('forbidden production/public authority present: '+repr(bad))
          print('MUSITU_AXIOM_OPERATOR_BRIDGE_NO_PRODUCTION_AUTHORITY_PASS')
          PY
