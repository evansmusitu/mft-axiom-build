name: MUSITU Axiom Operator Email Live Proof V2

on:
  push:
    branches:
      - 'support/axiom-global-support-ops-production-rollout-20261008'
    paths:
      - '.github/workflows/axiom-operator-email-live-proof-v2.yml'

permissions:
  contents: read

jobs:
  prove:
    if: github.event_name == 'push' && github.event.before == '12a37fc14d937e9947e5d3a22fd000e44832f0f3'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 15
    env:
      CF_ACCOUNT: '93f395f5121954671f92fffa453d6b61'
      SUPPORT_DB: 'a525c8b6-9b44-413b-a219-46e419b71b12'
      WORKER_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
      D1_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regression gate
        run: |
          set -euo pipefail
          node --check support/worker.js
          node --test support/tests/operator_alert_email.test.mjs
          node --test support/tests/global_ops_schedule_persistence.test.mjs

      - name: Build exact current public Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          npx --yes esbuild@0.25.11 support/app.js --bundle --format=esm --platform=browser --target=es2022 --outfile=.support-public-app.js
          node <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('support/index.html','utf8');
          const css=fs.readFileSync('support/styles.css','utf8');
          const robots=fs.readFileSync('support/robots.txt','utf8');
          const sitemap=fs.readFileSync('support/sitemap.xml','utf8');
          const app=fs.readFileSync('.support-public-app.js','utf8');
          const recoveryHtml=fs.readFileSync('support/recovery/index.html','utf8');
          const recoveryApp=fs.readFileSync('support/recovery/app.js','utf8');
          const statusHtml=fs.readFileSync('support/status/index.html','utf8');
          const statusApp=fs.readFileSync('support/status/app.js','utf8');
          const source=[
            "import support,{handleOperatorRequest} from './support/worker.js';",
            "const HTML="+JSON.stringify(html)+";const CSS="+JSON.stringify(css)+";const ROBOTS="+JSON.stringify(robots)+";const SITEMAP="+JSON.stringify(sitemap)+";const APP="+JSON.stringify(app)+";",
            "const RECOVERY_HTML="+JSON.stringify(recoveryHtml)+";const RECOVERY_APP="+JSON.stringify(recoveryApp)+";const STATUS_HTML="+JSON.stringify(statusHtml)+";const STATUS_APP="+JSON.stringify(statusApp)+";",
            "const H=Object.freeze({'content-security-policy':\"default-src 'self'; connect-src 'self' https://challenges.cloudflare.com; img-src 'self' data:; style-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'\",'referrer-policy':'no-referrer','permissions-policy':'camera=(), microphone=(), geolocation=(), payment=()','x-content-type-options':'nosniff','cross-origin-opener-policy':'same-origin','cross-origin-resource-policy':'same-origin','cache-control':'no-store'});",
            "const RH=Object.freeze({...H,'x-robots-tag':'noindex, nofollow, noarchive','content-security-policy':\"default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'\"});",
            "function asset(body,type,headers=H){return new Response(body,{status:200,headers:{...headers,'content-type':type}})}",
            "export default {async scheduled(controller,env,ctx){return support.scheduled(controller,env,ctx);},async email(message,env,ctx){return support.email(message,env,ctx);},async fetch(request,env,ctx){const u=new URL(request.url);",
            "if(u.pathname.startsWith('/api/v1/operator/')) return handleOperatorRequest(request,env);",
            "if(request.method==='GET'&&(u.pathname==='/recovery/'||u.pathname==='/recovery/index.html')) return asset(RECOVERY_HTML,'text/html; charset=utf-8',RH);",
            "if(request.method==='GET'&&u.pathname==='/recovery/app.js') return asset(RECOVERY_APP,'text/javascript; charset=utf-8',RH);",
            "if(request.method==='GET'&&(u.pathname==='/status/'||u.pathname==='/status/index.html')) return asset(STATUS_HTML,'text/html; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/status/app.js') return asset(STATUS_APP,'text/javascript; charset=utf-8');",
            "if(request.method==='GET'&&(u.pathname==='/'||u.pathname==='/index.html')) return asset(HTML,'text/html; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/styles.css') return asset(CSS,'text/css; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/robots.txt') return asset(ROBOTS,'text/plain; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/sitemap.xml') return asset(SITEMAP,'application/xml; charset=utf-8');",
            "if(request.method==='GET'&&u.pathname==='/app.js') return asset(APP,'text/javascript; charset=utf-8');",
            "return support.fetch(request,env,ctx);}};"
          ].join('\n');
          fs.writeFileSync('.support-public-entry.mjs',source,{mode:0o600});
          NODE
          npx --yes esbuild@0.25.11 .support-public-entry.mjs --bundle --format=esm --platform=browser --target=es2022 --outfile=.support-public-bundle.mjs
          grep -q 'SUPPORT_OPS_EMAIL_READY' .support-public-bundle.mjs

      - name: Enable operator email readiness only for live proof
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {buildWorkerMultipart} from './support/scripts/provision_cloudflare_control_plane.mjs';
          const api='https://api.cloudflare.com/client/v4',account=process.env.CF_ACCOUNT,token=String(process.env.WORKER_TOKEN||'');
          const h={authorization:'Bearer '+token,accept:'application/json'};
          async function call(path,{method='GET',body,rawBody,contentType}={}){
            const r=await fetch(api+path,{method,headers:{...h,...(body===undefined?{}:{'content-type':'application/json'}),...(contentType?{'content-type':contentType}:{})},...(rawBody!==undefined?{body:rawBody}:body===undefined?{}:{body:JSON.stringify(body)})});
            const p=await r.json().catch(()=>({}));
            if(!r.ok||p?.success===false)throw new Error('Cloudflare '+method+' '+path+' failed HTTP '+r.status);
            return p.result;
          }
          const name='musitu-axiom-support';
          const [settings,secrets]=await Promise.all([
            call('/accounts/'+account+'/workers/scripts/'+name+'/settings'),
            call('/accounts/'+account+'/workers/scripts/'+name+'/secrets')
          ]);
          const current=Array.isArray(settings?.bindings)?settings.bindings:[];
          const secretNames=new Set((Array.isArray(secrets)?secrets:[]).map(x=>String(x?.name||'')));
          if(!current.some(x=>x?.name==='SUPPORT_OPS_EMAIL'&&x?.type==='send_email'))throw new Error('send_email binding missing');
          const bindings=[];
          for(const b of current){
            const n=String(b?.name||'');
            if(!n||n==='SUPPORT_OPS_EMAIL_READY')continue;
            if(secretNames.has(n)||b?.type==='secret_text')bindings.push({type:'inherit',name:n,version_id:'latest'});
            else bindings.push(b);
          }
          bindings.push({type:'plain_text',name:'SUPPORT_OPS_EMAIL_READY',text:'true'});
          const m=buildWorkerMultipart(fs.readFileSync('.support-public-bundle.mjs'),{
            main_module:'index.mjs',compatibility_date:'2026-10-08',bindings,
            annotations:{'workers/message':'MUSITU Axiom operator email live proof v2'}
          },'----MUSITUOperatorEmailProofV2');
          await call('/accounts/'+account+'/workers/scripts/'+name+'?bindings_inherit=strict',{method:'PUT',rawBody:m.body,contentType:'multipart/form-data; boundary='+m.boundary});
          await call('/accounts/'+account+'/workers/scripts/'+name+'/subdomain',{method:'POST',body:{enabled:false,previews_enabled:false}});
          await call('/accounts/'+account+'/workers/scripts/'+name+'/schedules',{method:'PUT',body:[{cron:'*/5 * * * *'}]});
          const after=await call('/accounts/'+account+'/workers/scripts/'+name+'/settings');
          const bs=Array.isArray(after?.bindings)?after.bindings:[];
          if(!bs.some(x=>x?.name==='SUPPORT_OPS_EMAIL_READY'&&String(x?.text||'')==='true'))throw new Error('ready=true not applied');
          for(const required of ['SUPPORT_DB','SUPPORT_DATA_KEY_B64','SUPPORT_ATTACHMENTS','SUPPORT_INTAKE_RATE_LIMITER','SUPPORT_OPS_EMAIL'])if(!bs.some(x=>x?.name===required))throw new Error('binding drift: '+required);
          console.log(JSON.stringify({gate:'MUSITU_AXIOM_OPERATOR_EMAIL_READY_V2',status:'PASS',ready:true,send_email_binding:true,secret_values_read:false}));
          NODE

      - name: Create fresh metadata-only operator alert
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const api='https://api.cloudflare.com/client/v4',account=process.env.CF_ACCOUNT,db=process.env.SUPPORT_DB,token=String(process.env.D1_TOKEN||'');
          const h={authorization:'Bearer '+token,'content-type':'application/json',accept:'application/json'};
          async function q(sql,params=[]){
            const r=await fetch(api+'/accounts/'+account+'/d1/database/'+db+'/query',{method:'POST',headers:h,body:JSON.stringify({sql,params})});
            const p=await r.json();if(!r.ok||p?.success===false)throw new Error('D1 query failed HTTP '+r.status);
            const x=Array.isArray(p.result)?p.result[0]:p.result;return x?.results||[];
          }
          const cases=await q("SELECT case_id FROM support_cases ORDER BY created_at DESC LIMIT 1");
          if(!cases[0]?.case_id)throw new Error('no support case exists');
          const alphabet='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
          const bytes=crypto.getRandomValues(new Uint8Array(16));
          const id='AXN-'+[...bytes].map(b=>alphabet[b%alphabet.length]).join('');
          const at=new Date().toISOString();
          await q("INSERT INTO support_notification_outbox(notification_id,case_id,kind,audience,event_hash,created_at) VALUES (?,?,?,'operator',NULL,?)",[id,String(cases[0].case_id),'OPERATOR_EMAIL_LIVE_PROOF_V2',at]);
          console.log('TARGET_NOTIFICATION='+id);
          NODE

      - name: Wait for exact live delivery result and rollback on failure
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {buildWorkerMultipart} from './support/scripts/provision_cloudflare_control_plane.mjs';
          const api='https://api.cloudflare.com/client/v4',account=process.env.CF_ACCOUNT,db=process.env.SUPPORT_DB;
          const wt=String(process.env.WORKER_TOKEN||''),dt=String(process.env.D1_TOKEN||'');
          const wh={authorization:'Bearer '+wt,accept:'application/json'},dh={authorization:'Bearer '+dt,'content-type':'application/json',accept:'application/json'};
          async function cf(path,{method='GET',body,rawBody,contentType}={}){
            const r=await fetch(api+path,{method,headers:{...wh,...(body===undefined?{}:{'content-type':'application/json'}),...(contentType?{'content-type':contentType}:{})},...(rawBody!==undefined?{body:rawBody}:body===undefined?{}:{body:JSON.stringify(body)})});
            const p=await r.json().catch(()=>({}));if(!r.ok||p?.success===false)throw new Error('Cloudflare '+method+' failed HTTP '+r.status);return p.result;
          }
          async function q(sql){
            const r=await fetch(api+'/accounts/'+account+'/d1/database/'+db+'/query',{method:'POST',headers:dh,body:JSON.stringify({sql})});
            const p=await r.json();if(!r.ok||p?.success===false)throw new Error('D1 query failed HTTP '+r.status);
            const x=Array.isArray(p.result)?p.result[0]:p.result;return x?.results||[];
          }
          async function setReady(value){
            const name='musitu-axiom-support';
            const [settings,secrets]=await Promise.all([cf('/accounts/'+account+'/workers/scripts/'+name+'/settings'),cf('/accounts/'+account+'/workers/scripts/'+name+'/secrets')]);
            const current=Array.isArray(settings?.bindings)?settings.bindings:[],secretNames=new Set((Array.isArray(secrets)?secrets:[]).map(x=>String(x?.name||'')));
            const bindings=[];
            for(const b of current){const n=String(b?.name||'');if(!n||n==='SUPPORT_OPS_EMAIL_READY')continue;if(secretNames.has(n)||b?.type==='secret_text')bindings.push({type:'inherit',name:n,version_id:'latest'});else bindings.push(b);}
            bindings.push({type:'plain_text',name:'SUPPORT_OPS_EMAIL_READY',text:value?'true':'false'});
            const m=buildWorkerMultipart(fs.readFileSync('.support-public-bundle.mjs'),{main_module:'index.mjs',compatibility_date:'2026-10-08',bindings,annotations:{'workers/message':value?'MUSITU Axiom operator email ready':'MUSITU Axiom operator email rollback fail-closed'}},'----MUSITUOperatorEmailProofV2Toggle');
            await cf('/accounts/'+account+'/workers/scripts/'+name+'?bindings_inherit=strict',{method:'PUT',rawBody:m.body,contentType:'multipart/form-data; boundary='+m.boundary});
            await cf('/accounts/'+account+'/workers/scripts/'+name+'/subdomain',{method:'POST',body:{enabled:false,previews_enabled:false}});
            await cf('/accounts/'+account+'/workers/scripts/'+name+'/schedules',{method:'PUT',body:[{cron:'*/5 * * * *'}]});
          }
          let proof=null;
          for(let i=0;i<60;i++){
            const rows=await q(`SELECT a.state,a.provider_ref_hash,a.attempted_at,n.notification_id,n.kind
              FROM support_notification_attempts a JOIN support_notification_outbox n ON n.notification_id=a.notification_id
              WHERE n.kind='OPERATOR_EMAIL_LIVE_PROOF_V2' ORDER BY a.attempted_at DESC LIMIT 1`);
            if(rows[0]){proof=rows[0];break;}
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!proof){
            await setReady(false);
            throw new Error('no operator-email attempt observed; readiness rolled back');
          }
          const sent=String(proof.state||'')==='SENT'&&/^[a-f0-9]{64}$/i.test(String(proof.provider_ref_hash||''));
          if(!sent){
            await setReady(false);
            console.log(JSON.stringify({gate:'MUSITU_AXIOM_OPERATOR_EMAIL_LIVE_PROOF_V2',status:'FAILED_ROLLED_BACK',attempt_state:String(proof.state||''),receipt_hash_present:/^[a-f0-9]{64}$/i.test(String(proof.provider_ref_hash||'')),ready:false}));
            throw new Error('native operator email send failed; readiness rolled back');
          }
          console.log(JSON.stringify({gate:'MUSITU_AXIOM_OPERATOR_EMAIL_LIVE_PROOF_V2',status:'PASS',attempt_state:'SENT',provider_receipt_hash_present:true,ready:true,destination_value_recorded:false,customer_content_read:false}));
          NODE

      - name: Cleanup
        if: always()
        run: rm -f .support-public-app.js .support-public-entry.mjs .support-public-bundle.mjs
