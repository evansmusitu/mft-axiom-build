name: MUSITU Axiom Operator Reviewer MCP Code Only Deploy 20261007

on:
  push:
    branches:
      - frontier/axiom-operator-reviewer-clone-20261006
    paths:
      - 'reviewer_clone/musitu_axiom_operator_reviewer_gate.mjs'
      - 'reviewer_clone/deploy_reviewer_mcp_code_only.py'
      - '.github/workflows/axiom-operator-reviewer-mcp-code-only-20261007.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify and deploy reviewer MCP code only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          node --check reviewer_clone/musitu_axiom_operator_reviewer_gate.mjs
          python -m py_compile reviewer_clone/deploy_reviewer_mcp_code_only.py
          python reviewer_clone/deploy_reviewer_mcp_code_only.py | tee /tmp/reviewer-mcp-code-only.log
          grep -q 'REVIEWER_MCP_CODE_ONLY_DEPLOY=PASS' /tmp/reviewer-mcp-code-only.log
