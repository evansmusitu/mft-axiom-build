name: MUSITU Axiom Reviewer OAuth Stable Callback Deploy 20261006

on:
  push:
    branches:
      - frontier/axiom-operator-reviewer-clone-20261006
    paths:
      - 'reviewer_clone/musitu_axiom_operator_reviewer_oauth.mjs'
      - 'reviewer_clone/deploy_reviewer_oauth_stable_callback.py'
      - '.github/workflows/axiom-operator-reviewer-oauth-stable-callback-20261006.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-oauth:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Deploy reviewer OAuth stable callback only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          node --check reviewer_clone/musitu_axiom_operator_reviewer_oauth.mjs
          python reviewer_clone/deploy_reviewer_oauth_stable_callback.py | tee /tmp/reviewer-oauth-hotfix.log
          grep -q 'MUSITU_AXIOM_REVIEWER_OAUTH_HOTFIX_PASS' /tmp/reviewer-oauth-hotfix.log
