name: MUSITU Axiom Paynow Initiate Contract Read-Only

on:
  push:
    paths:
      - '.github/workflows/axiom-paynow-initiate-contract-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      TRANSPORT: mft-paynow-transport-gateway
    steps:
      - uses: actions/checkout@v4
      - name: Extract initiation transport semantics only
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,re,urllib.parse,urllib.request
          api=os.environ['CF_API']; aid=os.environ['ACCOUNT_ID']; w=os.environ['TRANSPORT']
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Axiom-Paynow-Initiate-Contract/1.1'}
          q=urllib.request.Request(f'{api}/accounts/{aid}/workers/scripts/{urllib.parse.quote(w,safe="")}',headers=H)
          with urllib.request.urlopen(q,timeout=45) as r: raw=r.read(); ct=r.headers.get('content-type','')
          src=raw
          if 'multipart/' in ct.lower():
              msg=email.message_from_bytes((f'Content-Type: {ct}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw); parts=[]
              for p in msg.walk():
                  if p.is_multipart(): continue
                  d=p.get_payload(decode=True) or b''
                  if any(x in d for x in (b'fetch(',b'export default',b'addEventListener')): parts.append(d)
              if len(parts)!=1: raise SystemExit(f'Fail-closed executable module count {len(parts)}')
              src=parts[0]
          text=src.decode('utf-8','ignore'); needle='/internal/paynow/initiate'; i=text.find(needle)
          if i<0: raise SystemExit('Fail-closed initiate route absent')
          win=text[max(0,i-5000):min(len(text),i+9000)]
          external_urls=sorted(set(re.findall(r'https://[^"\'\s)`}]+',text)))
          paynow_urls=[u for u in external_urls if 'paynow.co.zw' in u.lower()]
          content_types=sorted(set(re.findall(r'["\'](application/[A-Za-z0-9.+-]+(?:;\s*charset=[A-Za-z0-9_-]+)?)["\']',win,re.I)))
          readers=[]
          for reader in ('json','text','arrayBuffer','formData'):
              if re.search(r'\.(?:'+re.escape(reader)+r')\s*\(',win): readers.append(reader)
          semantics={
            'reads_authorization_header':bool(re.search(r'headers\.get\(["\']authorization["\']\)',win,re.I)),
            'uses_fetch':bool(re.search(r'\bfetch\s*\(',win)),
            'uses_urlsearchparams':bool(re.search(r'\bURLSearchParams\b',win)),
            'forwards_request_body_symbol':bool(re.search(r'\bbody\s*:\s*(?:raw|body|payload|bytes|requestBody)\b',win)),
            'mentions_form_urlencoded':('application/x-www-form-urlencoded' in win.lower()),
            'mentions_paynow_initiate_url':any('initiatetransaction' in u.lower() for u in paynow_urls),
            'request_body_readers':readers,
          }
          # Collect only nearby helper/function identifiers, never code.
          function_names=sorted(set(re.findall(r'(?:async\s+)?function\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(',win)))
          call_names=sorted(set(re.findall(r'\b([A-Za-z_][A-Za-z0-9_]*)\s*\(',win)))
          relevant_calls=[x for x in call_names if x.lower() in {'fetch','authorized','requirejson','requiretext','json','parse','urlsearchparams','initiatepaynow','forwardpaynow','relay'}]
          out={'schema':'musitu.axiom.paynow_initiate_contract.v2','source_sha256':hashlib.sha256(src).hexdigest(),'route':needle,'paynow_urls':paynow_urls,'content_types':content_types,'semantics':semantics,'nearby_function_names':function_names,'relevant_calls':relevant_calls,'secret_values_read':False,'mutation_performed':False,'source_published':False,'gate':'AXIOM_PAYNOW_INITIATE_CONTRACT_READ_PASS'}
          blob=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode(); open('paynow-initiate-contract.json','wb').write(blob); dg=hashlib.sha256(blob).hexdigest(); open('paynow-initiate-contract.sha256','w').write(dg+'  paynow-initiate-contract.json\n')
          print(json.dumps({**out,'evidence_sha256':dg},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-paynow-initiate-contract
          path: |
            paynow-initiate-contract.json
            paynow-initiate-contract.sha256
          retention-days: 14
          if-no-files-found: error
