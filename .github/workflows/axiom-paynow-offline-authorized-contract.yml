name: MUSITU Axiom Paynow Offline Authorized Contract

on:
  push:
    paths:
      - '.github/workflows/axiom-paynow-offline-authorized-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      PAYNOW_WORKER: mft-paynow-transport-gateway
    steps:
      - uses: actions/checkout@v4
      - name: Execute handlers with synthetic matching capability and mocked fetch
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,os,urllib.request
          api=os.environ['CF_API']; aid=os.environ['ACCOUNT_ID']; worker=os.environ['PAYNOW_WORKER']
          h={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Axiom-Offline-Authorized/1.0'}
          req=urllib.request.Request(f'{api}/accounts/{aid}/workers/scripts/{worker}',headers=h,method='GET')
          with urllib.request.urlopen(req,timeout=45) as r: raw=r.read(); ctype=r.headers.get('content-type','')
          source=raw
          if 'multipart/' in ctype.lower():
              msg=email.message_from_bytes((f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw)
              parts=[]
              for p in msg.walk():
                  if p.is_multipart(): continue
                  d=p.get_payload(decode=True) or b''
                  if b'handleInitiate' in d and b'handlePoll' in d: parts.append(d)
              if not parts: raise SystemExit('Fail-closed no module source')
              source=max(parts,key=len)
          text=source.decode('utf-8')
          if 'function handleInitiate' not in text or 'function handlePoll' not in text: raise SystemExit('Fail-closed handlers absent')
          text+='\nexport { handleInitiate as __init, handlePoll as __poll };\n'
          open('gateway.mjs','w').write(text)
          open('gateway.sha256','w').write(hashlib.sha256(source).hexdigest()+'\n')
          PY
          cat > run.mjs <<'JS'
          import {pathToFileURL} from 'node:url'; import fs from 'node:fs'; import crypto from 'node:crypto';
          const m=await import(pathToFileURL(process.cwd()+'/gateway.mjs').href+'?'+Date.now());
          const TOKEN='offline-synthetic-capability';
          const safeUrl=x=>{try{const u=new URL(String(x));return {host:u.host,path:u.pathname,query_keys:[...u.searchParams.keys()].sort()}}catch{return {opaque:true}}};
          const shape=async req=>{let t='';try{t=await req.clone().text()}catch{};let keys=[];try{const o=JSON.parse(t);if(o&&typeof o==='object')keys=Object.keys(o).sort()}catch{try{keys=[...new URLSearchParams(t).keys()].sort()}catch{}}return {keys,bytes:Buffer.byteLength(t),sha256:crypto.createHash('sha256').update(t).digest('hex')}};
          function env(){return {MFT_GATEWAY_CAPABILITY_TOKEN:TOKEN,CONTROL_RATE_LIMITER:{async limit(){return {success:true}}},PUBLIC_CALLBACK_RATE_LIMITER:{async limit(){return {success:true}}},CALLBACK_VAULT:{idFromName(){return 'mock'},get(){return {async fetch(){return new Response('{}',{status:200,headers:{'content-type':'application/json'}})}}}}}};
          function recorder(){const calls=[];const fn=async(input,init={})=>{const r=input instanceof Request?input:new Request(String(input),init);calls.push({url:safeUrl(r.url),method:r.method,headers:[...r.headers.keys()].sort(),body:await shape(r)});const u=new URL(r.url);const text=u.pathname.toLowerCase().includes('checkpayment')?'status=Paid&reference=mock-reference&paynowreference=mock-provider-reference&amount=1.00&hash=mockhash':'status=Ok&browserurl=https%3A%2F%2Fexample.invalid%2Fpay&pollurl=https%3A%2F%2Fwww.paynow.co.zw%2FInterface%2FCheckPayment%2F%3Fguid%3Dmock&hash=mockhash';return new Response(text,{status:200,headers:{'content-type':'application/x-www-form-urlencoded'}})};return {calls,fn}};
          async function run(handler,path,payload){const rec=recorder();const req=new Request('https://internal.invalid'+path,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+TOKEN},body:JSON.stringify(payload)});let res,err=null;try{res=await handler(req,env(),rec.fn)}catch(e){err={name:e?.name,message:String(e?.message||e).slice(0,120)}}let body='';if(res)body=await res.clone().text().catch(()=> '');let parsedKeys=[];try{const o=JSON.parse(body);if(o&&typeof o==='object')parsedKeys=Object.keys(o).sort()}catch{}return {http_status:res?.status??null,error:err,response_keys:parsedKeys,response_sha256:crypto.createHash('sha256').update(body).digest('hex'),fetch_calls:rec.calls}};
          const initiatePayload={order_id:'mock-order',reference:'mock-reference',amount:'1.00',email:'billing-test@example.invalid',additionalinfo:'MUSITU Axiom test',returnurl:'https://example.invalid/return',resulturl:'https://example.invalid/result',return_url:'https://example.invalid/return',result_url:'https://example.invalid/result'};
          const out={schema:'musitu.axiom.paynow_offline_authorized_contract.v1',network_mode:'FULLY_MOCKED_NO_PROVIDER_CALLS',live_secret_used:false,production_mutation_performed:false,initiate:await run(m.__init,'/internal/paynow/initiate',initiatePayload),poll:await run(m.__poll,'/internal/paynow/poll',{poll_url:'https://www.paynow.co.zw/Interface/CheckPayment/?guid=mock'}),gate:'AXIOM_PAYNOW_OFFLINE_AUTHORIZED_CONTRACT_PASS'};
          const raw=JSON.stringify(out,null,2)+'\n';fs.writeFileSync('authorized-contract.json',raw);const dig=crypto.createHash('sha256').update(raw).digest('hex');fs.writeFileSync('authorized-contract.sha256',dig+'  authorized-contract.json\n');console.log(JSON.stringify({...out,artifact_sha256:dig}));
          JS
          node run.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-paynow-offline-authorized-contract
          path: |
            authorized-contract.json
            authorized-contract.sha256
            gateway.sha256
          retention-days: 14
          if-no-files-found: error
