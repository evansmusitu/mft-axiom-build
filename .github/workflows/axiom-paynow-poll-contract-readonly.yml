name: MUSITU Axiom Paynow Poll Contract Read-Only

on:
  push:
    paths:
      - '.github/workflows/axiom-paynow-poll-contract-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      TRANSPORT: mft-paynow-transport-gateway
    steps:
      - uses: actions/checkout@v4
      - name: Extract poll transport interface metadata only
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,re,urllib.parse,urllib.request
          api=os.environ['CF_API'];aid=os.environ['ACCOUNT_ID'];w=os.environ['TRANSPORT']
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Axiom-Paynow-Poll-Contract/1.0'}
          q=urllib.request.Request(f'{api}/accounts/{aid}/workers/scripts/{urllib.parse.quote(w,safe="")}',headers=H)
          with urllib.request.urlopen(q,timeout=45) as r:raw=r.read();ct=r.headers.get('content-type','')
          src=raw
          if 'multipart/' in ct.lower():
              msg=email.message_from_bytes((f'Content-Type: {ct}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw);parts=[]
              for p in msg.walk():
                  if p.is_multipart():continue
                  d=p.get_payload(decode=True) or b''
                  if any(x in d for x in (b'fetch(',b'export default',b'addEventListener')):parts.append(d)
              if len(parts)!=1:raise SystemExit(f'Fail-closed executable module count {len(parts)}')
              src=parts[0]
          text=src.decode('utf-8','ignore');needle='/internal/paynow/poll';i=text.find(needle)
          if i<0:raise SystemExit('Fail-closed poll route absent')
          win=text[max(0,i-5000):min(len(text),i+9000)]
          readers=[x for x in ('json','text','arrayBuffer','formData') if re.search(r'\.'+x+r'\s*\(',win)]
          body_fields=sorted(set(re.findall(r'\b(?:body|payload|input|data)\.([A-Za-z_][A-Za-z0-9_]*)',win)))
          destructured=[]
          for m in re.finditer(r'\{([^{}]{1,800})\}\s*=\s*await\s+req(?:uest)?\.json\(\)',win,re.S):
              for part in m.group(1).split(','):
                  k=part.strip().split(':',1)[0].strip()
                  if re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*',k):destructured.append(k)
          headers=sorted(set(x.lower() for x in re.findall(r'headers\.get\(["\']([^"\']+)["\']\)',win,re.I)))
          literals=sorted(set(re.findall(r'["\']([A-Za-z][A-Za-z0-9_-]{1,60})["\']',win)))
          relevant=[x for x in literals if x.lower() in {'pollurl','poll_url','url','authorization','content-type','status','hash'}]
          semantics={'uses_fetch':bool(re.search(r'\bfetch\s*\(',win)),'empty_post_literal':bool(re.search(r'method\s*:\s*["\']POST["\'][^{}]{0,500}(?:body\s*:\s*(?:null|undefined|["\']["\']))?',win,re.S)),'requires_authorization_header':'authorization' in headers or bool(re.search(r'authorized\s*\(',win,re.I)),'mentions_paynow_host':'paynow.co.zw' in win.lower()}
          out={'schema':'musitu.axiom.paynow_poll_contract.v1','source_sha256':hashlib.sha256(src).hexdigest(),'route':needle,'request_body_readers':readers,'json_body_fields':sorted(set(body_fields+destructured)),'header_names':headers,'relevant_literals':relevant,'semantics':semantics,'secret_values_read':False,'mutation_performed':False,'source_published':False,'gate':'AXIOM_PAYNOW_POLL_CONTRACT_READ_PASS'}
          blob=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode();open('paynow-poll-contract.json','wb').write(blob);dg=hashlib.sha256(blob).hexdigest();open('paynow-poll-contract.sha256','w').write(dg+'  paynow-poll-contract.json\n')
          print(json.dumps({**out,'evidence_sha256':dg},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-paynow-poll-contract
          path: |
            paynow-poll-contract.json
            paynow-poll-contract.sha256
          retention-days: 14
          if-no-files-found: error
