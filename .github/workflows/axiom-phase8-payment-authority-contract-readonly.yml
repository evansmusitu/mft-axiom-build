name: MUSITU Axiom Phase-8 Payment Authority Contract Read-Only

on:
  push:
    paths:
      - '.github/workflows/axiom-phase8-payment-authority-contract-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      EXTERNAL_AUTHORITY: mft-phase8-external-authority
      SIGNING_AUTHORITY: mft-phase8-secret-signing-authority
    steps:
      - uses: actions/checkout@v4
      - name: Inspect authority topology and sanitized route contract
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,re,urllib.error,urllib.parse,urllib.request
          api=os.environ['CF_API']; aid=os.environ['ACCOUNT_ID']; zid=os.environ['ZONE_ID']
          workers=[os.environ['EXTERNAL_AUTHORITY'],os.environ['SIGNING_AUTHORITY']]
          headers={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'Accept':'application/json','User-Agent':'MUSITU-Axiom-Phase8-Authority-Audit/1.1'}
          def raw(path):
              q=urllib.request.Request(api+path,headers=headers,method='GET')
              try:
                  with urllib.request.urlopen(q,timeout=45) as r: return r.status,r.headers,r.read()
              except urllib.error.HTTPError as e: return e.code,e.headers,e.read()
          def cf(path):
              code,h,b=raw(path)
              if not 200<=code<300: raise SystemExit(f'Fail-closed Cloudflare HTTP {code} path={path}')
              x=json.loads(b or b'{}')
              if isinstance(x,dict) and x.get('success') is False: raise SystemExit('Fail-closed success=false '+path)
              return x.get('result') if isinstance(x,dict) else None

          domains=cf(f'/accounts/{aid}/workers/domains') or []
          routes=cf(f'/zones/{zid}/workers/routes') or []
          topology={}
          for w in workers:
              settings=cf(f'/accounts/{aid}/workers/scripts/{urllib.parse.quote(w,safe="")}/settings') or {}
              bindings=[]
              for b in settings.get('bindings') or []:
                  if not isinstance(b,dict) or not b.get('name'): continue
                  item={'name':str(b.get('name')),'type':str(b.get('type') or '')}
                  if b.get('type')=='service':
                      item['service']=b.get('service'); item['environment']=b.get('environment')
                  bindings.append(item)
              custom=sorted(d.get('hostname') for d in domains if isinstance(d,dict) and d.get('service')==w and d.get('hostname'))
              route_patterns=sorted(r.get('pattern') for r in routes if isinstance(r,dict) and r.get('script')==w and r.get('pattern'))
              topology[w]={'binding_metadata':sorted(bindings,key=lambda x:x['name']),'custom_domains':custom,'worker_routes':route_patterns}

          def module_source(worker):
              code,h,b=raw(f'/accounts/{aid}/workers/scripts/{urllib.parse.quote(worker,safe="")}')
              if code!=200: raise SystemExit(f'Fail-closed script HTTP {code} worker={worker}')
              ctype=h.get('content-type','')
              if 'multipart/' not in ctype.lower(): return b
              msg=email.message_from_bytes((f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+b)
              parts=[]
              for p in msg.walk():
                  if p.is_multipart(): continue
                  d=p.get_payload(decode=True) or b''
                  if not d: continue
                  # Pick executable-looking text by structure, independent of MIME labels/filenames.
                  probe=d[:200000].decode('utf-8','ignore')
                  score=0
                  for token in ('fetch(', 'export default', 'addEventListener', 'new Response', 'request.url', 'env.', 'PAYNOW_INTEGRATION_KEY'):
                      if token in probe: score+=1
                  if score: parts.append((score,len(d),d))
              if not parts: raise SystemExit('Fail-closed no executable-looking module part '+worker)
              parts.sort(key=lambda x:(x[0],x[1]),reverse=True)
              return parts[0][2]

          contracts={}
          for w in workers:
              src=module_source(w); text=src.decode('utf-8','ignore')
              paths=sorted({p for p in re.findall(r"['\"](\/[A-Za-z0-9_./{}:-]{1,140})['\"]",text) if not p.startswith('//')})
              methods=sorted(set(x.upper() for x in re.findall(r"(?:request\.)?method\s*(?:===|==)\s*['\"](GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)['\"]",text,re.I)))
              header_names=sorted(set(x.lower() for x in re.findall(r"headers\s*\.\s*get\s*\(\s*['\"]([A-Za-z0-9_-]{1,80})['\"]",text,re.I)))
              env_names=sorted(set(re.findall(r'\benv\.([A-Z][A-Z0-9_]{2,100})\b',text)))
              fn_names=sorted(set(re.findall(r'(?:async\s+)?function\s+([A-Za-z_$][A-Za-z0-9_$]{2,100})\s*\(',text)))
              relevant_fns=[x for x in fn_names if any(k in x.lower() for k in ('paynow','payment','verify','sign','authority','session','webhook','receipt','callback','poll','hash','status'))]
              provider_hosts=sorted(set(re.findall(r'https?://([A-Za-z0-9.-]+)',text)))
              contracts[w]={
                  'path_candidates':paths,
                  'http_methods':methods,
                  'header_names':header_names,
                  'env_binding_names':env_names,
                  'relevant_function_names':relevant_fns,
                  'literal_url_hosts':provider_hosts,
                  'source_sha256':hashlib.sha256(src).hexdigest(),
                  'source_length_bytes':len(src)
              }

          out={'schema':'musitu.axiom.phase8_payment_authority_contract_readonly.v1','topology':topology,'sanitized_contracts':contracts,'secret_values_read':False,'source_code_published':False,'mutation_performed':False,'gate':'AXIOM_PHASE8_PAYMENT_AUTHORITY_CONTRACT_READ_PASS'}
          blob=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode(); open('phase8-authority-contract.json','wb').write(blob)
          digest=hashlib.sha256(blob).hexdigest(); open('phase8-authority-contract.sha256','w').write(digest+'  phase8-authority-contract.json\n')
          print(json.dumps({'gate':out['gate'],'topology':topology,'sanitized_contracts':contracts,'secret_values_read':False,'source_code_published':False,'mutation_performed':False,'sha256':digest},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-phase8-payment-authority-contract-readonly
          path: |
            phase8-authority-contract.json
            phase8-authority-contract.sha256
          retention-days: 14
          if-no-files-found: error
