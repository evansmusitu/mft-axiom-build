name: MUSITU Axiom Phase-8 Sign Contract Read-Only

on:
  push:
    paths:
      - '.github/workflows/axiom-phase8-sign-contract-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      AUTHORITY: mft-phase8-external-authority
    steps:
      - uses: actions/checkout@v4
      - name: Extract sign interface metadata only
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,re,urllib.parse,urllib.request
          api=os.environ['CF_API']; aid=os.environ['ACCOUNT_ID']; worker=os.environ['AUTHORITY']
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Axiom-Phase8-Sign-Contract/1.0'}
          q=urllib.request.Request(f'{api}/accounts/{aid}/workers/scripts/{urllib.parse.quote(worker,safe="")}',headers=H)
          with urllib.request.urlopen(q,timeout=45) as r: raw=r.read(); ctype=r.headers.get('content-type','')
          src=raw
          if 'multipart/' in ctype.lower():
              msg=email.message_from_bytes((f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw); parts=[]
              for p in msg.walk():
                  if p.is_multipart(): continue
                  d=p.get_payload(decode=True) or b''
                  if b'/internal/sign' in d: parts.append(d)
              if len(parts)!=1: raise SystemExit(f'Fail-closed sign module count {len(parts)}')
              src=parts[0]
          text=src.decode('utf-8','ignore'); needle='/internal/sign'; i=text.find(needle)
          if i<0: raise SystemExit('Fail-closed /internal/sign absent')
          win=text[max(0,i-5000):min(len(text),i+9000)]
          body_fields=sorted(set(re.findall(r'\b(?:body|payload|input|data)\.([A-Za-z_][A-Za-z0-9_]*)',win)))
          destructured=[]
          for m in re.finditer(r'\{([^{}]{1,1000})\}\s*=\s*await\s+req(?:uest)?\.json\(\)',win,re.S):
              for part in m.group(1).split(','):
                  k=part.strip().split(':',1)[0].strip()
                  if re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*',k): destructured.append(k)
          response_fields=set()
          for m in re.finditer(r'(?:json|JSON\.stringify)\s*\(\s*\{([^{}]{1,1600})\}',win,re.S):
              for f in re.finditer(r'([A-Za-z_][A-Za-z0-9_]*)\s*:',m.group(1)): response_fields.add(f.group(1))
          literal_algs=sorted(set(x.upper() for x in re.findall(r'["\']((?:SHA|HMAC|ED25519|ECDSA|RSA)[A-Za-z0-9_-]*)["\']',win,re.I)))
          calls=sorted(set(re.findall(r'\b([A-Za-z_][A-Za-z0-9_]*)\s*\(',win)))
          relevant_calls=[x for x in calls if any(k in x.lower() for k in ('sign','digest','hash','base64','hex','crypto','authorized'))]
          out={'schema':'musitu.axiom.phase8_sign_contract.v1','worker':worker,'route':needle,'json_body_fields':sorted(set(body_fields+destructured)),'response_fields':sorted(response_fields),'algorithm_literals':literal_algs,'relevant_calls':relevant_calls,'uses_paynow_integration_key':'PAYNOW_INTEGRATION_KEY' in win,'uses_private_signing_material':bool(re.search(r'SIGNING_PRIVATE_',win)),'source_sha256':hashlib.sha256(src).hexdigest(),'secret_values_read':False,'source_published':False,'mutation_performed':False,'gate':'AXIOM_PHASE8_SIGN_CONTRACT_READ_PASS'}
          blob=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode(); open('sign-contract.json','wb').write(blob); dg=hashlib.sha256(blob).hexdigest(); open('sign-contract.sha256','w').write(dg+'  sign-contract.json\n')
          print(json.dumps({**out,'evidence_sha256':dg},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-phase8-sign-contract
          path: |
            sign-contract.json
            sign-contract.sha256
          retention-days: 14
          if-no-files-found: error
