name: MUSITU Axiom Plugin Docs Publication Fix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-axiom-public-plugin-cutover
  cancel-in-progress: false

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MCP_BASE: https://mcp.mftintelligence.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build one-line docs candidate and repaired full v4 harness
        shell: bash
        run: |
          set -euo pipefail
          cp mcp/musitu_axiom_plugin_gate_v4.mjs /tmp/musitu_axiom_plugin_gate_v4.old.mjs
          python - <<'PY'
          from pathlib import Path
          import re,textwrap

          source_path=Path('mcp/musitu_axiom_plugin_gate_v4.mjs')
          source=source_path.read_text()
          old='if(u.pathname==="/docs"&&req.method==="GET")return response(200,{service:"MUSITU Axiom",endpoint:c.resource+"/mcp",authentication:"OAuth 2.1",scope:"axiom.execute",purpose:"Quantitative finance, statistics, optimization, time-series, verification, and mathematical tools for existing MUSITU Axiom account holders.",commerce_tools_exposed:false,trade_execution:false,money_transfer:false,privacy_policy:c.resource+"/privacy",terms:c.resource+"/terms"});'
          new='if(u.pathname==="/docs"&&req.method==="GET")return html(200,"MUSITU Axiom Documentation",`<p>MUSITU Axiom provides quantitative finance, statistics, optimization, time-series, verification, and mathematical tools for users with an existing MUSITU Axiom account entitlement.</p><h2>Connect from ChatGPT</h2><p>Use the production MCP endpoint at <strong>${esc(c.resource+"/mcp")}</strong>. Authentication uses OAuth 2.1 with PKCE. Tool execution requires the <strong>axiom.execute</strong> scope; identity-only scopes do not grant compute access.</p><h2>Capabilities and boundaries</h2><ul><li>Use the public search and fetch tools to discover supported quantitative capabilities.</li><li>Authenticated capability calls use the existing MUSITU Axiom entitlement and metering boundary.</li><li>This public plugin does not expose subscription checkout tools, execute investment trades, or transfer money.</li></ul><h2>Policies</h2><p><a href="${esc(c.resource+"/privacy")}">Privacy Policy</a> · <a href="${esc(c.resource+"/terms")}">Terms of Use</a></p>`);'
          if source.count(old)!=1:
              raise SystemExit('expected single JSON /docs route not found')
          source=source.replace(old,new)
          source_path.write_text(source)

          # Reuse the complete sealed v4 certification harness, repairing its historical
          # one-line Python parser defect exactly as the already-proven V3 wrapper does.
          p=Path('.github/workflows/axiom-plugin-gate-v4-cutover-v2.yml')
          s=p.read_text()
          marker="if rc!=201 or not reg.get('client_id'):raise RuntimeError('DCR failed');client_id=str(reg['client_id']);print('::add-mask::'+client_id)"
          start=s.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=s.index("\n          PY",start)
          code=textwrap.dedent(s[start:end])
          m=re.search(r'(?m)^([ \\t]*)'+re.escape(marker)+r'$',code)
          if not m:
              raise SystemExit('expected V2 harness defect marker not found')
          indent=m.group(1)
          replacement=(indent+"if rc!=201 or not reg.get('client_id'):\n"+
                       indent+"  raise RuntimeError('DCR failed')\n"+
                       indent+"client_id=str(reg['client_id'])\n"+
                       indent+"print('::add-mask::'+client_id)")
          code=code[:m.start()]+replacement+code[m.end():]

          # Never let this documentation-only rollout fall back to the older v3 public
          # surface. On any certification failure, restore the exact pre-change v4 source.
          rollback='try:upload(v3)'
          safe_rollback="try:upload(pathlib.Path('/tmp/musitu_axiom_plugin_gate_v4.old.mjs').read_bytes())"
          if code.count(rollback)!=1:
              raise SystemExit('expected legacy rollback statement not found')
          code=code.replace(rollback,safe_rollback)
          compile(code,'<v4-docs-certification-harness>','exec')
          Path('/tmp/musitu-v4-docs-certification.py').write_text(code)
          print('MUSITU_V4_DOCS_CANDIDATE_READY')
          PY
          node --check mcp/musitu_axiom_plugin_gate_v4.mjs

      - name: Validate and hash MCP docs review candidate; never deploy or push
        shell: bash
        run: |
          set -euo pipefail
          test -s mcp/musitu_axiom_plugin_gate_v4.mjs
          node --check mcp/musitu_axiom_plugin_gate_v4.mjs
          cp mcp/musitu_axiom_plugin_gate_v4.mjs axiom-plugin-docs-review-candidate.mjs
          sha256sum axiom-plugin-docs-review-candidate.mjs > axiom-plugin-docs-review-candidate.sha256
          echo 'MCP_DOCUMENTATION_CANDIDATE_ONLY_NOT_DEPLOYED'
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-plugin-docs-review-candidate
          path: |
            axiom-plugin-docs-review-candidate.mjs
            axiom-plugin-docs-review-candidate.sha256
          retention-days: 14
          if-no-files-found: error
