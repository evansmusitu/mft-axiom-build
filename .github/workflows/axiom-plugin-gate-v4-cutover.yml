name: MUSITU Axiom Public Plugin Gate V4 Cutover

on:
  workflow_dispatch:
  push:
    paths:
      - 'mcp/musitu_axiom_plugin_gate_v4.mjs'
      - '.github/workflows/axiom-plugin-gate-v4-cutover.yml'

permissions:
  contents: read

concurrency:
  group: musitu-axiom-public-plugin-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      D1_UUID: 504029cc-f9a5-495e-818f-63c6144b4ea4
      MCP_HOST: mcp.mftintelligence.com
      MCP_PUBLIC_WORKER: musitu-axiom-mcp
      MCP_CORE_WORKER: musitu-axiom-mcp-core
      AUTH_ISSUER: https://auth.mftintelligence.com
      EXPECTED_BUILD: MFT-AXIOM-V3-FULL-SELF-CONTAINED-20260904
    steps:
      - uses: actions/checkout@v4
      - name: Validate public Plugin gate source
        run: |
          set -euo pipefail
          node --check mcp/musitu_axiom_plugin_gate_v4.mjs
          grep -q 'submission_safe_commerce_profile' mcp/musitu_axiom_plugin_gate_v4.mjs
          grep -q 'commerce_tools_exposed:false' mcp/musitu_axiom_plugin_gate_v4.mjs
      - name: Deploy and prove submission-safe public Plugin profile
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,datetime,hashlib,json,os,pathlib,re,secrets,time,urllib.error,urllib.parse,urllib.request,uuid
          api=os.environ['CF_API'];aid=os.environ['ACCOUNT_ID'];dbid=os.environ['D1_UUID'];host=os.environ['MCP_HOST'];pub=os.environ['MCP_PUBLIC_WORKER'];core=os.environ['MCP_CORE_WORKER'];issuer=os.environ['AUTH_ISSUER'];resource='https://'+host
          v3=pathlib.Path('mcp/musitu_axiom_mcp_oauth_gate_v3.mjs').read_bytes();v4=pathlib.Path('mcp/musitu_axiom_plugin_gate_v4.mjs').read_bytes();v4sha=hashlib.sha256(v4).hexdigest()
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'Accept':'application/json','User-Agent':'MUSITU-Axiom-Plugin-V4-Cutover/1.0'}
          def raw(url,method='GET',headers=None,body=None,timeout=45,follow=True):
            req=urllib.request.Request(url,headers=dict(headers or {}),method=method,data=body)
            opener=urllib.request.build_opener() if follow else urllib.request.build_opener(type('NoRedirect',(urllib.request.HTTPRedirectHandler,),{'redirect_request':lambda self,req,fp,code,msg,headers,newurl:None})())
            try:
              with opener.open(req,timeout=timeout) as r:return r.status,r.headers,r.read()
            except urllib.error.HTTPError as e:return e.code,e.headers,e.read()
            except urllib.error.URLError:return 0,{},b''
          def cf(path,method='GET',obj=None):
            h=dict(H);b=None
            if obj is not None:h['Content-Type']='application/json';b=json.dumps(obj,separators=(',',':')).encode()
