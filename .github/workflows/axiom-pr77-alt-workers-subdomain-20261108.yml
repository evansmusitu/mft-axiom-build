name: AXIOM owner alternate isolated Workers namespace for private PR77 D1 test 20261108
on:
  pull_request:
    types: [opened]
    paths: ['.github/workflows/axiom-pr77-alt-workers-subdomain-20261108.yml']
permissions: {contents: read}
concurrency: {group: axiom-pr77-alt-workers-subdomain-20261108, cancel-in-progress: false}
jobs:
  one-owned-alternate-namespace-no-script:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'build/axiom-pr77-alternate-workers-subdomain-20261108' && github.event.pull_request.base.ref == 'build/axiom-pr77-alt-worker-edit-scope-probe-20261108' && github.event.pull_request.base.sha == '8cda84364e246239f8359bd3e368fc5d27fcec77' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: One scope-bound owner alternate workers.dev namespace only, no Worker or D1
        shell: bash
        env:
          AXIOM_CUSTOMER_STAGING_CF_API_TOKEN: ${{ secrets.AXIOM_CUSTOMER_STAGING_CF_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.error,urllib.request
          from pathlib import Path
          ACCOUNT='c954f0c842a486d0388c05b19cd21e47'
          SUBDOMAIN='mftaxiomdr-c954f0c8-20261108'
          TOKEN=os.getenv('AXIOM_CUSTOMER_STAGING_CF_API_TOKEN','')
          URL='https://api.cloudflare.com/client/v4/accounts/'+ACCOUNT+'/workers/subdomain'
          out={'schema':'musitu.axiom.pr77_alternate_workers_subdomain_setup.v1','account_id':ACCOUNT,'subdomain':SUBDOMAIN,'status':'UNQUALIFIED','provider_http_status':[],'create_attempted':False,'subdomain_verified':False,'workers_deployed':0,'d1_mutations':0,'production_oauth_changed':False,'release_authority':False}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*a,**k):return None
          OPENER=urllib.request.build_opener(NoRedirect())
          def req(method,body=None):
           if not TOKEN or '\n' in TOKEN or '\r' in TOKEN:raise ValueError('TOKEN_UNAVAILABLE')
           data=None if body is None else json.dumps(body,separators=(',',':')).encode()
           hdr={'Authorization':'Bearer '+TOKEN,'Accept':'application/json','User-Agent':'AXIOM-IsolatedDR-WorkersNamespace-20261108'}
           if data:hdr['Content-Type']='application/json'
           r=urllib.request.Request(URL,method=method,data=data,headers=hdr)
           try:
            with OPENER.open(r,timeout=20) as resp:
             code=resp.status;payload=resp.read(100001)
           except urllib.error.HTTPError as exc:
            code=exc.code;payload=b''
           out['provider_http_status'].append({'method':method,'status':code})
           if code==404:return code,None
           try:obj=json.loads(payload)
           except (UnicodeError,ValueError):obj=None
           return code,obj
          try:
           before,b=req('GET')
           if before!=404:
            out['status']='EXISTING_WORKERS_NAMESPACE_OR_PROVIDER_STATE_NO_WRITES'
           else:
            out['create_attempted']=True
            code,b=req('PUT',{'subdomain':SUBDOMAIN})
            if code not in (200,201) or not isinstance(b,dict) or b.get('success') is not True or (b.get('result') or {}).get('subdomain')!=SUBDOMAIN:
             out['status']='WORKER_SUBDOMAIN_CREATE_NOT_CONFIRMED_DO_NOT_RETRY'
            else:
             after,verify=req('GET')
             if after==200 and isinstance(verify,dict) and verify.get('success') is True and (verify.get('result') or {}).get('subdomain')==SUBDOMAIN:
              out['subdomain_verified']=True
              out['status']='ISOLATED_ACCOUNT_WORKERS_NAMESPACE_CREATED_NO_SCRIPT'
             else:out['status']='WORKERS_NAMESPACE_READBACK_UNQUALIFIED'
          except Exception:out['status']='WORKERS_NAMESPACE_PROVIDER_UNKNOWN_NO_RETRY'
          Path('axiom-pr77-alternate-workers-subdomain-20261108.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          if not out['subdomain_verified']:raise SystemExit(1)
          
          PY
      - name: Archive safe provider setup receipt including refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-pr77-alternate-workers-namespace-no-script-20261108
          path: axiom-pr77-alternate-workers-subdomain-20261108.json
          retention-days: 30
          if-no-files-found: warn
