name: AXIOM live hosted PR77 strict synthetic crosscustomer denial 20261108 (NOT RELEASE)
on:
  pull_request:
    types: [opened]
    paths: ['.github/workflows/axiom-pr77-hosted-crosscustomer-denial-live-20261108.yml']
permissions: {contents: read}
concurrency: {group: axiom-pr77-hosted-crosscustomer-denial-live-20261108, cancel-in-progress: false}
jobs:
  one-time-two-denials-on-fixed-synthetic-d1-only:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'build/axiom-pr77-hosted-crosscustomer-denial-live-20261108' && github.event.pull_request.base.ref == 'build/axiom-pr77-crosscustomer-offline-pinned-v2-20261108' && github.event.pull_request.base.sha == 'e84f540baa50f225c8d3a442334864c4707a8f04' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2e1f103f87c1081e8afdff8ccafcd5251e10652c
          fetch-depth: 1
          persist-credentials: false
      - name: Pin exact source and tests, preserve all real production and release denials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2e1f103f87c1081e8afdff8ccafcd5251e10652c
          test "$(git hash-object customer_frontier/qualification/pr77_synthetic_crosscustomer_denials_20261108.py)" = fdbb9c2c55ad626c70034f8e6902ccd7aa4b4f71
          test "$(git hash-object customer_frontier/qualification/test_pr77_synthetic_crosscustomer_denials_20261108.py)" = 2a4710d840c74eed77fda2a578147431d8dd2b90
          python3 -m py_compile customer_frontier/qualification/pr77_synthetic_crosscustomer_denials_20261108.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('customer_frontier/qualification/pr77_synthetic_crosscustomer_denials_20261108.py').read_text()
          assert "ACCOUNT='c954f0c842a486d0388c05b19cd21e47'" in s
          assert "TARGET='1eff7a3d-b22b-4264-a0b8-196edf70074f'" in s
          assert "PRESERVED='e36972b3-850d-4273-b934-2fa67587d9f1'" in s
          assert "PLAN_SHA='6946e796539e6787033e20f1d0afdcb5259a130ca77be6e3c5afb60b5dc9888a'" in s
          assert "for kind in ('token','code')" in s
          assert "PROVIDER_SELECT_ZERO_WRITES_UNQUALIFIED" in s
          assert "CATALOG_CHANGED_AFTER_DENIAL" in s
          assert "'production_oauth_modified':False" in s and "'release_authority':False" in s
          assert "DELETE FROM" not in s and "DROP TABLE" not in s
          print('TWO_FIXED_SYNTHETIC_OAUTH_DENIALS_ONLY_SOURCE_ADMITTED')
          PY
      - name: Repeat seven offline negative tests before credential injection
        run: python3 -m unittest discover -s customer_frontier/qualification -p test_pr77_synthetic_crosscustomer_denials_20261108.py -v
      - name: Actual Cloudflare exact synthetic D1 two invalid crosscustomer INSERT attempts and readbacks
        env:
          AXIOM_CUSTOMER_STAGING_CF_API_TOKEN: ${{ secrets.AXIOM_CUSTOMER_STAGING_CF_API_TOKEN }}
        run: python3 customer_frontier/qualification/pr77_synthetic_crosscustomer_denials_20261108.py
      - name: Require both real PR77 trigger-denials, exact no-residue proof and no release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('axiom-pr77-synthetic-denials-20261108.json')
          x=json.loads(p.read_text())
          assert x['status']=='TWO_CROSSCUSTOMER_PR77_TRIGGER_DENIALS_NO_RESIDUE_PASS'
          assert x['confirmed_denial_types']==['token','code']
          assert x['synthetic_state_unchanged'] is True
          assert x['provider_zero_write_select_queries']==4
          for k in ('real_customer_data_read','production_oauth_modified','real_identity_qualified','production_tenant_isolation_qualified','release_authority'):
              assert x[k] is False
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          Path(p.name+'.sha256').write_text(h+'  '+p.name+'\n')
          print('HOSTED_SYNTHETIC_ONLY_OAUTH_CROSSCUSTOMER_DENIAL_PASS_NOT_RELEASE receipt_sha256='+h)
          PY
      - name: Preserve sanitized result even if provider rejects or any residue appears
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-pr77-hosted-synthetic-crosscustomer-denial-20261108
          path: |
            axiom-pr77-synthetic-denials-20261108.json
            axiom-pr77-synthetic-denials-20261108.json.sha256
          retention-days: 30
          if-no-files-found: warn
