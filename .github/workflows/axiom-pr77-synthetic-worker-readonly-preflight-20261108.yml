name: AXIOM PR77 synthetic D1 alternate-account worker read-only preflight 20261108
on:
  pull_request:
    types: [opened]
    paths: ['.github/workflows/axiom-pr77-synthetic-worker-readonly-preflight-20261108.yml']
permissions: {contents: read}
concurrency:
  group: axiom-pr77-synthetic-worker-readonly-preflight-20261108
  cancel-in-progress: false
jobs:
  verify-isolated-capacity-without-writing:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'build/axiom-pr77-cloudflare-alt-account-worker-readonly-20261108' && github.event.pull_request.base.ref == 'build/axiom-pr77-real-oauth-private-evidence-20261108' && github.event.pull_request.base.sha == 'c87e9d1324171df9bbd0cdf19f2b852edb31116a' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fixed owner alternate account D1 list and Workers subdomain GET only
        shell: bash
        env:
          AXIOM_CUSTOMER_STAGING_CF_API_TOKEN: ${{ secrets.AXIOM_CUSTOMER_STAGING_CF_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          from pathlib import Path
          a='c954f0c842a486d0388c05b19cd21e47'
          token=os.getenv('AXIOM_CUSTOMER_STAGING_CF_API_TOKEN','')
          out={'schema':'musitu.axiom.pr77_synthetic_d1_preflight.v1','account_id':a,'status':'UNQUALIFIED','d1_list_http':None,'existing_d1_count':None,'has_candidate_free_capacity':False,'workers_subdomain_http':None,'workers_subdomain_visible':False,'worker_edit_scope_verified':False,'target_created':False,'cloudflare_mutations':0,'release_authority':False}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect())
          def get(url):
           if not token:raise ValueError('SECRET_MISSING')
           req=urllib.request.Request(url,method='GET',headers={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'AXIOM-Pr77-SyntheticWorkerPreflight-20261108'})
           try:
            with opener.open(req,timeout=15) as r:return r.status,json.loads(r.read(120001))
           except urllib.error.HTTPError as e:return e.code,None
          try:
           status,result=get('https://api.cloudflare.com/client/v4/accounts/'+a+'/d1/database?page=1&per_page=100')
           out['d1_list_http']=status
           if status==200 and isinstance(result,dict) and result.get('success') is True and isinstance(result.get('result'),list) and isinstance(result.get('result_info'),dict):
            count=result['result_info'].get('total_count')
            if type(count) is int and count==len(result['result']):
             out['existing_d1_count']=count
             out['has_candidate_free_capacity']=count<10
           else:out['status']='D1_LIST_UNQUALIFIED'
           status2,response=get('https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/subdomain')
           out['workers_subdomain_http']=status2
           out['workers_subdomain_visible']=status2==200 and isinstance(response,dict) and response.get('success') is True and isinstance(response.get('result'),dict) and bool(response['result'].get('subdomain'))
           if out['has_candidate_free_capacity'] and out['workers_subdomain_visible']:
            out['status']='READ_ONLY_CAPACITY_AND_WORKER_READ_VISIBLE_NOT_WRITE_PROOF'
           elif out['has_candidate_free_capacity']:
            out['status']='D1_CAPACITY_VISIBLE_WORKER_API_READ_NOT_AUTHORIZED'
           else:out['status']='CANNOT_ADMIT_NEW_DISPOSABLE_DB'
          except Exception:out['status']='PROVIDER_PREFLIGHT_UNQUALIFIED'
          Path('axiom-pr77-synthetic-alt-account-preflight-20261108.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          
          PY
      - name: Archive non-secret read-only preflight
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-pr77-synthetic-d1-worker-readonly-preflight-20261108
          path: axiom-pr77-synthetic-alt-account-preflight-20261108.json
          if-no-files-found: warn
          retention-days: 30
