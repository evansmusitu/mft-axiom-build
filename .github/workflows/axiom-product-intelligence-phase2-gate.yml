name: MUSITU Axiom Product Intelligence Phase 2 Gate

on:
  push:
    branches:
      - frontier/axiom-product-intelligence-phase2-20261004
    paths:
      - 'axiom_interface/vnext/product_intelligence/**'
      - 'axiom_interface/vnext/deep_context_adapters.js'
      - 'axiom_interface/vnext/execution_store.js'
      - 'axiom_interface/vnext/tests/product_intelligence_pgvector_vector_index_*.test.mjs'
      - 'axiom_interface/vnext/tests/product_intelligence_signing_provenance_*.test.mjs'
      - 'axiom_interface/vnext/tests/product_intelligence_tree_sitter_code_intelligence.test.mjs'
      - 'axiom_interface/vnext/tests/product_intelligence_openfeature_flag_evaluation.test.mjs'
      - 'axiom_interface/vnext/tests/product_intelligence_openfeature_real_sdk_qualification.mjs'
      - 'axiom_interface/vnext/tests/product_intelligence_sandbox_backend.test.mjs'
      - 'axiom_interface/vnext/tests/product_intelligence_conditional_infrastructure_admission.test.mjs'
      - 'axiom_interface/vnext/tests/product_intelligence_optional_adapter_admission.test.mjs'
      - 'axiom_interface/vnext/tests/product_intelligence_living_product_graph.test.mjs'
      - 'axiom_interface/vnext/tests/product_intelligence_browser_execution_idempotency.html'
      - 'axiom_interface/vnext/tests/run_browser_execution_idempotency.mjs'
      - 'axiom_interface/vnext/tests/product_intelligence_objective_outcome_compiler.test.mjs'
      - 'axiom_interface/vnext/tests/product_intelligence_product_compiler_ir.test.mjs'
      - 'axiom_interface/vnext/tests/product_intelligence_compiler_checkpoint.test.mjs'
      - 'axiom_interface/vnext/tests/product_intelligence_change_admission.test.mjs'
      - 'axiom_interface/vnext/tests/pgvector_vector_index_test_fixture.mjs'
      - 'axiom_interface/vnext/tests/signing_provenance_test_fixture.mjs'
      - '.github/workflows/axiom-product-intelligence-phase2-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-axiom-product-intelligence-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record runtime
        run: node --version
      - name: Run pgvector 0.8.6 VectorIndex contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            axiom_interface/vnext/tests/product_intelligence_pgvector_vector_index_contract.test.mjs \
            axiom_interface/vnext/tests/product_intelligence_pgvector_vector_index_query.test.mjs \
            axiom_interface/vnext/tests/product_intelligence_pgvector_vector_index_write.test.mjs
      - name: Run cosign 3.1.3 and in-toto 3.1.0 provenance contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            axiom_interface/vnext/tests/product_intelligence_signing_provenance_contract.test.mjs \
            axiom_interface/vnext/tests/product_intelligence_signing_provenance_signer.test.mjs \
            axiom_interface/vnext/tests/product_intelligence_signing_provenance_verifier.test.mjs
      - name: Run Tree-sitter 0.27.0 integration contracts
        run: node --test axiom_interface/vnext/tests/product_intelligence_tree_sitter_code_intelligence.test.mjs
      - name: Run OpenFeature 1.23.0 AXIOM contracts
        run: node --test axiom_interface/vnext/tests/product_intelligence_openfeature_flag_evaluation.test.mjs
      - name: Run governed SandboxBackend contracts
        run: node --test axiom_interface/vnext/tests/product_intelligence_sandbox_backend.test.mjs
      - name: Run conditional distributed infrastructure admission contracts
        run: node --test axiom_interface/vnext/tests/product_intelligence_conditional_infrastructure_admission.test.mjs
      - name: Run optional adapter admission contracts
        run: node --test axiom_interface/vnext/tests/product_intelligence_optional_adapter_admission.test.mjs
      - name: Run Living Product Graph contracts
        run: node --test axiom_interface/vnext/tests/product_intelligence_living_product_graph.test.mjs
      - name: Qualify real-browser restart and cross-instance execution idempotency
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "MUSITU_AXIOM_PHASE2_BROWSER_RUNTIME_NOT_AVAILABLE"
            exit 1
          fi
          BROWSER_BIN="$chrome" node axiom_interface/vnext/tests/run_browser_execution_idempotency.mjs
      - name: Run Objective Outcome Compiler contracts
        run: node --test axiom_interface/vnext/tests/product_intelligence_objective_outcome_compiler.test.mjs
      - name: Run Product Compiler IR contracts
        run: node --test axiom_interface/vnext/tests/product_intelligence_product_compiler_ir.test.mjs
      - name: Run reversible Compiler Checkpoint contracts
        run: node --test axiom_interface/vnext/tests/product_intelligence_compiler_checkpoint.test.mjs
      - name: Run Change Admission contracts
        run: node --test axiom_interface/vnext/tests/product_intelligence_change_admission.test.mjs

  independent-replay-and-authority-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: focused-contract-tests
    steps:
      - name: Checkout immutable action without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Independently replay all frozen-order slice tests
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            axiom_interface/vnext/tests/product_intelligence_pgvector_vector_index_contract.test.mjs \
            axiom_interface/vnext/tests/product_intelligence_pgvector_vector_index_query.test.mjs \
            axiom_interface/vnext/tests/product_intelligence_pgvector_vector_index_write.test.mjs \
            axiom_interface/vnext/tests/product_intelligence_signing_provenance_contract.test.mjs \
            axiom_interface/vnext/tests/product_intelligence_signing_provenance_signer.test.mjs \
            axiom_interface/vnext/tests/product_intelligence_signing_provenance_verifier.test.mjs \
            axiom_interface/vnext/tests/product_intelligence_tree_sitter_code_intelligence.test.mjs \
            axiom_interface/vnext/tests/product_intelligence_openfeature_flag_evaluation.test.mjs \
            axiom_interface/vnext/tests/product_intelligence_sandbox_backend.test.mjs \
            axiom_interface/vnext/tests/product_intelligence_conditional_infrastructure_admission.test.mjs \
            axiom_interface/vnext/tests/product_intelligence_optional_adapter_admission.test.mjs \
            axiom_interface/vnext/tests/product_intelligence_living_product_graph.test.mjs \
            axiom_interface/vnext/tests/product_intelligence_objective_outcome_compiler.test.mjs \
            axiom_interface/vnext/tests/product_intelligence_product_compiler_ir.test.mjs \
            axiom_interface/vnext/tests/product_intelligence_compiler_checkpoint.test.mjs \
            axiom_interface/vnext/tests/product_intelligence_change_admission.test.mjs
      - name: Qualify real-browser restart and cross-instance execution idempotency
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "MUSITU_AXIOM_PHASE2_BROWSER_RUNTIME_NOT_AVAILABLE"
            exit 1
          fi
          BROWSER_BIN="$chrome" node axiom_interface/vnext/tests/run_browser_execution_idempotency.mjs
      - name: Fail closed on provider or release authority escalation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('axiom_interface/vnext/product_intelligence/backends/pgvector_vector_index_backend.js'),
              Path('axiom_interface/vnext/product_intelligence/signing_provenance.js'),
              Path('axiom_interface/vnext/product_intelligence/tree_sitter_code_intelligence.js'),
              Path('axiom_interface/vnext/product_intelligence/openfeature_flag_evaluation.js'),
              Path('axiom_interface/vnext/product_intelligence/backends/governed_sandbox_backend.js'),
              Path('axiom_interface/vnext/product_intelligence/conditional_infrastructure_admission.js'),
              Path('axiom_interface/vnext/product_intelligence/optional_adapter_admission.js'),
              Path('axiom_interface/vnext/product_intelligence/living_product_graph.js'),
              Path('axiom_interface/vnext/product_intelligence/objective_outcome_compiler.js'),
              Path('axiom_interface/vnext/product_intelligence/product_compiler_ir.js'),
              Path('axiom_interface/vnext/product_intelligence/compiler_checkpoint.js'),
              Path('axiom_interface/vnext/product_intelligence/change_admission.js'),
              Path('axiom_interface/vnext/product_intelligence/execution_outcome_reconciliation.js'),
              Path('axiom_interface/vnext/execution_store.js'),
          ]
          required = {
              'pgvector_vector_index_backend.js': ['0.8.6', 'MECHANISM_ONLY'],
              'signing_provenance.js': ['3.1.3', '3.1.0', 'MECHANISM_ONLY'],
              'tree_sitter_code_intelligence.js': ['0.27.0', 'MECHANISM_ONLY'],
              'openfeature_flag_evaluation.js': ['OpenFeature', '1.23.0', 'MECHANISM_ONLY'],
              'governed_sandbox_backend.js': ['SandboxBackend', 'FA11_S0_S5_V1', 'MECHANISM_ONLY', "external_process_runtime_qualification:'NOT_PROVEN'"],
              'conditional_infrastructure_admission.js': ['CONDITIONAL_INFRASTRUCTURE_COMPONENTS', 'MECHANISM_ONLY', 'mandatory:false', 'provider_selected:false', 'activation_authorized:false'],
              'optional_adapter_admission.js': ['OPTIONAL_ADAPTER_CATALOG', 'E2B', 'OpenHands', 'Langfuse', 'GrowthBook', 'Penpot', 'GrapesJS', 'MECHANISM_ONLY', 'mandatory:false', 'provider_selected:false', 'runtime_activation_authorized:false'],
              'living_product_graph.js': ['LIVING_PRODUCT_GRAPH_SCHEMA', 'PersistenceBackend', 'MECHANISM_ONLY', 'canonical_evidence:false', 'release_authority:false', 'production_authority:false', 'certification_authority:false'],
              'objective_outcome_compiler.js': ['PROJECT_SCHEMA', 'OUTCOME_SCHEMA', 'contract integrity must be verified', 'cross-project outcome contract blocked', 'external_execution_authority:false'],
              'product_compiler_ir.js': ['PRODUCT_COMPILER_IR_SCHEMA', 'DIFF_REQUIRES_RECONCILIATION', 'CONTENT_ADDRESSED_IMPACT_SET', 'can_overwrite_verified_nodes:false', "authority_effect:'NONE'"],
              'compiler_checkpoint.js': ['PRODUCT_COMPILER_CHECKPOINT_SCHEMA', 'PREPARE_ONLY', 'GOVERNED_WRITE_AUTHORIZATION', 'external_execution_authority:false', 'production_authority:false', "independent_verification:'NOT_PROVEN'"],
              'change_admission.js': ['CHANGE_RISK_MODEL', 'MECHANISM_ONLY', 'builder_may_approve:false', 'external_execution_authority:false', 'production_authority:false', "authority_effect:'ADMISSION_ONLY'"],
              'execution_outcome_reconciliation.js': ['EXECUTION_OUTCOME_VERIFICATION_SCHEMA', 'FA11_BROWSER_LOCAL_EXECUTION_RECEIPT', "authority_effect:'NONE'", 'release_authority:false', 'production_authority:false', 'certification_authority:false'],
              'execution_store.js': ["status:'FAILED'", 'execution.failed', 'normalizeActionRequest(envelopeRaw,raw)', 'evaluateAuthorization(envelopeRaw,request)', 'QUALIFIED_EXTERNAL_EXECUTOR_REQUIRED', 'this.inflight', 'multiple terminal execution receipts for one request', 'execution authority envelope changed', "['COMPLETED','FAILED']", 'network_request_performed:false', 'plaintext_secret_access:false', 'VERSION=2', 'execution_claims', 'musitu.axiom.execution-claim.browser.v1', 'concurrent execution already in flight', 'EXECUTION_CLAIM_TTL_MS', '_commitTerminalOutcome', 'terminal commit execution claim mismatch', "tx.objectStore('sandboxes').put", "tx.objectStore('receipts').put", "tx.objectStore('events').put", 'claimStore.delete'],
          }
          for path in files:
              text = path.read_text(encoding='utf-8')
              for marker in required[path.name]:
                  if marker not in text:
                      raise SystemExit(f'MISSING_REQUIRED_MARKER:{path}:{marker}')
              for forbidden in [
                  'release_authority:true',
                  'production_authority:true',
                  'certification_authority:true',
              ]:
                  if forbidden in text:
                      raise SystemExit(f'FORBIDDEN_AUTHORITY_ESCALATION:{path}:{forbidden}')
              if path.name == 'conditional_infrastructure_admission.js':
                  for forbidden in ['mandatory:true', 'provider_selected:true', 'activation_authorized:true']:
                      if forbidden in text:
                          raise SystemExit(f'FORBIDDEN_CONDITIONAL_INFRASTRUCTURE_PROMOTION:{path}:{forbidden}')
              if path.name == 'optional_adapter_admission.js':
                  for forbidden in ['mandatory:true', 'provider_selected:true', 'runtime_activation_authorized:true']:
                      if forbidden in text:
                          raise SystemExit(f'FORBIDDEN_OPTIONAL_ADAPTER_PROMOTION:{path}:{forbidden}')
          print('MUSITU_AXIOM_PHASE2_PROVIDER_AUTHORITY_FAIL_CLOSED_PASS')
          PY
      - name: Record non-release verification boundary
        run: |
          echo 'MUSITU_AXIOM_PHASE2_SLICE_VERIFICATION_PASS'
          echo 'RELEASE_AUTHORITY=FALSE'
          echo 'PRODUCTION_AUTHORITY=FALSE'
          echo 'CERTIFICATION_AUTHORITY=FALSE'
