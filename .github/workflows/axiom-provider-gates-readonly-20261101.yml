name: AXIOM provider cancellation capacity and account readback
on:
  pull_request:
    branches: [main]
    paths: ['qualification/whole-system-20261029/provider-gates-authorization-20261101.json']
permissions:
  contents: read
concurrency:
  group: axiom-provider-gates-readonly-20261101-01
  cancel-in-progress: false
jobs:
  read-only-provider-gates:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.event.pull_request.number == 55 && github.event.pull_request.head.repo.full_name == github.repository && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit only the direct authorized continuation
        run: test "$(git rev-parse HEAD^)" = 7132504d078e8c2263ccb538419e5dc8e34455f5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.12.0'
      - name: Read saved request records capacity and account access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AXIOM_ACCEPTANCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node qualification/whole-system-20261029/provider-gates-readonly-20261101.mjs
      - name: Preserve provider-origin observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-provider-gates-readonly-20261101-01
          path: qualification/whole-system-20261029/provider-gates-readonly-results/*.json
          retention-days: 90
          if-no-files-found: error
