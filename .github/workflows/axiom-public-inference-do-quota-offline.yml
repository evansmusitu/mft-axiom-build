name: AXIOM isolated SQLite Durable Object quota unit tests (no cloud calls)
on:
  push:
    branches: [frontier/axiom-public-inference-zero-cost-20261009]
    paths: ['ops/public_inference/durable_quota.mjs','ops/public_inference/durable_quota.test.mjs','.github/workflows/axiom-public-inference-do-quota-offline.yml']
permissions:
  contents: read
jobs:
  verify-sqlite-do-quota:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test ops/public_inference/durable_quota.test.mjs
