name: MUSITU Axiom public connectivity cross-check from GitHub

on:
  push:
    branches:
      - pilot/axiom-databricks-pat-20261027
    paths:
      - ".github/workflows/axiom-public-network-crosscheck.yml"
      - "integrations/databricks/scripts/public_axiom_connectivity.sh"

permissions:
  contents: read

jobs:
  public-endpoint-crosscheck:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.ref == 'refs/heads/pilot/axiom-databricks-pat-20261027' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[axiom-public-network-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate public probe script syntax
        shell: bash
        run: bash -n integrations/databricks/scripts/public_axiom_connectivity.sh
      - name: Check only unauthenticated Axiom MCP public endpoints
        shell: bash
        run: bash integrations/databricks/scripts/public_axiom_connectivity.sh
