name: Axiom Quadratic Candidate HTTP500 Diagnostic 20261004
on:
  push:
    branches: [fix/axiom-quadratic-constraints-20261004]
    paths: ['.github/workflows/axiom-quadratic-candidate-http500-diagnostic-20261004.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Reconstruct and patch sealed runtime
        env:
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          P=deploy_payload/runtime_min
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > runtime.enc.b64
          base64 -d runtime.enc.b64 > runtime.tar.gz.enc
          test "$(sha256sum runtime.tar.gz.enc | awk '{print $1}')" = 'b82448d6b4b34b302748815af976b535d69922c197d4b7a9056fc2f91a9e12cf'
          python - <<'PY'
          import hashlib,hmac,os
          b=open('runtime.tar.gz.enc','rb').read()
          got=hmac.new(os.environ['CLOUDFLARE_GLOBAL_API_KEY'].encode(),b,hashlib.sha256).hexdigest()
          if not hmac.compare_digest(got,'1a3193d4f3271d61d151e6ebd7cf4576d8ab86c2e79b84eff4ad0f635fe7ab47'):raise SystemExit('HMAC mismatch')
          PY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in runtime.tar.gz.enc -out runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          test "$(sha256sum runtime.tar.gz | awk '{print $1}')" = 'b4d5a0266446523969a619f5e9bb5a04d9b815c78a2ab82ed046ef5e23d53663'
          mkdir runtime && tar -xzf runtime.tar.gz -C runtime
          test "$(sha256sum runtime/kernel/app/main.py | awk '{print $1}')" = '9389e4a501cd2385afe3820da685e97790e723da3bc5871a6dc2565b19f8fa3f'
          python frontier_v5/scripts/patch_quadratic_constraints_runtime.py runtime/kernel/app/main.py
          test "$(sha256sum runtime/kernel/app/main.py | awk '{print $1}')" = 'cfa39f0f17c56a183c5024a600086aba4644ec925343129245a62e18294f7c47'
      - name: Install runtime roots
        run: python -m pip install --disable-pip-version-check --quiet fastapi==0.128.2 sympy==1.14.0 numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Exercise dispatch encode and actual compute handler
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import importlib,json,pathlib,sys,traceback
          sys.path.insert(0,str(pathlib.Path('runtime').resolve()))
          m=importlib.import_module('kernel.app.main')
          portfolio={'Q':[[0.04,0.006,0.012,0],[0.006,0.09,0.018,0.009],[0.012,0.018,0.16,0.03],[0,0.009,0.03,0.0625]],'c':[0,0,0,0],'A_eq':[[1,1,1,1],[0.06,0.09,0.14,0.07]],'b_eq':[1,0.09],'bounds':[[0,1],[0,1],[0,1],[0,1]]}
          print('ENCODE_FUNCTION_CONTEXT_BEGIN')
          import inspect
          print(inspect.getsource(m.encode))
          print('ENCODE_FUNCTION_CONTEXT_END')
          print('COMPUTE_REQUEST_SCHEMA='+json.dumps(m.ComputeRequest.model_json_schema(),sort_keys=True))
          r=m.dispatch('optimization.quadratic',portfolio,50)
          print('DISPATCH_TYPES='+json.dumps({k:type(v).__name__ for k,v in r.items()},sort_keys=True))
          try:
              er=m.encode(r)
              print('ENCODE_PASS='+json.dumps({'types':{k:type(v).__name__ for k,v in er.items()},'json_serializable':True},sort_keys=True))
              json.dumps(er,sort_keys=True,separators=(',',':'))
          except Exception as e:
              print('ENCODE_FAIL='+type(e).__name__+':'+str(e))
              traceback.print_exc()
              raise
          try:
              req=m.ComputeRequest(operation='optimization.quadratic',args=portfolio,verify=True)
              out=m.compute(req)
              print('COMPUTE_HANDLER_PASS='+json.dumps({'ok':out.get('ok'),'operation':out.get('operation'),'result_type':type(out.get('result')).__name__,'verified':out.get('verified')},sort_keys=True))
              json.dumps(out,sort_keys=True,separators=(',',':'))
          except Exception as e:
              print('COMPUTE_HANDLER_FAIL='+type(e).__name__+':'+str(e))
              traceback.print_exc()
              raise
          print('MUSITU_AXIOM_QP_HTTP_LAYER_LOCAL_PASS')
          PY
