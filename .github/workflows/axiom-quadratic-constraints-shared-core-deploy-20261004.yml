name: Axiom Quadratic Constraints Shared Core Deploy 20261004
on:
  push:
    branches: [fix/axiom-quadratic-constraints-20261004]
    paths: ['.github/workflows/axiom-quadratic-constraints-shared-core-deploy-20261004.yml']
permissions:
  contents: read
concurrency:
  group: musitu-axiom-shared-core-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      LIVE_APP: musitu-axiom-v3-modal-staging
      CANDIDATE_APP: musitu-axiom-v3-qp-candidate-20261004
      LIVE_MODAL_URL: https://evansmusitu--musitu-axiom-v3-modal-staging-axiom-kernel.modal.run
      ADAPTER_WORKER: mft-axiom-modal-adapter
      SEALED_MAIN: d6a846f6bbe0bccac1758713eb4de167caf07113
      OPENAI_AUTH_BLOB: 8ba0dbc1b6dd1533c6c26bff23991429e03a71a5
      OPENAI_MCP_BLOB: 4a1ad37a5e7df0e4d3966e8b5f9f0e8f2db69167
      PATCH_ID: MFT-AXIOM-QP-CONSTRAINED-20261004
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/axiom-quadratic-constraints-20261004
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Reverify protected repo and live adapter target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$SEALED_MAIN"
          test "$(git hash-object auth/musitu_axiom_oauth_worker.mjs)" = "$OPENAI_AUTH_BLOB"
          test "$(git hash-object mcp/musitu_axiom_plugin_gate_v4.mjs)" = "$OPENAI_MCP_BLOB"
          python - <<'PY'
          import json,os,urllib.request
          base='https://api.cloudflare.com/client/v4'
          hs=[]
          if os.environ.get('CLOUDFLARE_API_TOKEN'):hs.append({'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          if os.environ.get('CLOUDFLARE_EMAIL') and os.environ.get('CLOUDFLARE_GLOBAL_API_KEY'):hs.append({'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY']})
          result=None
          for h in hs:
              try:
                  q=urllib.request.Request(f"{base}/accounts/{os.environ['ACCOUNT_ID']}/workers/scripts/{os.environ['ADAPTER_WORKER']}/settings",headers=h)
                  with urllib.request.urlopen(q,timeout=30) as r:x=json.load(r)
                  if x.get('success') is not False: result=x.get('result');break
              except Exception: pass
          if not isinstance(result,dict):raise SystemExit('adapter settings unavailable')
          bs={b.get('name'):b for b in result.get('bindings') or [] if isinstance(b,dict)}
          if bs.get('MODAL_BASE_URL',{}).get('text')!=os.environ['LIVE_MODAL_URL']:raise SystemExit('live Modal URL drift')
          if bs.get('MODAL_PROXY_KEY',{}).get('type')!='secret_text' or bs.get('MODAL_PROXY_SECRET',{}).get('type')!='secret_text':raise SystemExit('adapter proxy secret bindings drift')
          print('LIVE_ADAPTER_TARGET_PRECONDITION_PASS')
          PY

      - name: Reconstruct original runtime and apply deterministic patch
        env:
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          P=deploy_payload/runtime_min
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > runtime.enc.b64
          base64 -d runtime.enc.b64 > runtime.tar.gz.enc
          test "$(sha256sum runtime.tar.gz.enc | awk '{print $1}')" = 'b82448d6b4b34b302748815af976b535d69922c197d4b7a9056fc2f91a9e12cf'
          python - <<'PY'
          import hashlib,hmac,os
          b=open('runtime.tar.gz.enc','rb').read()
          if not hmac.compare_digest(hmac.new(os.environ['CLOUDFLARE_GLOBAL_API_KEY'].encode(),b,hashlib.sha256).hexdigest(),'1a3193d4f3271d61d151e6ebd7cf4576d8ab86c2e79b84eff4ad0f635fe7ab47'):
              raise SystemExit('ciphertext HMAC mismatch')
          PY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in runtime.tar.gz.enc -out runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          test "$(sha256sum runtime.tar.gz | awk '{print $1}')" = 'b4d5a0266446523969a619f5e9bb5a04d9b815c78a2ab82ed046ef5e23d53663'
          mkdir runtime && tar -xzf runtime.tar.gz -C runtime
          test "$(sha256sum runtime/kernel/app/main.py | awk '{print $1}')" = '9389e4a501cd2385afe3820da685e97790e723da3bc5871a6dc2565b19f8fa3f'
          cp -a runtime runtime_original
          python frontier_v5/scripts/patch_quadratic_constraints_runtime.py runtime/kernel/app/main.py
          test "$(sha256sum runtime/kernel/app/main.py | awk '{print $1}')" = 'cfa39f0f17c56a183c5024a600086aba4644ec925343129245a62e18294f7c47'

      - name: Install Modal and runtime test roots
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet 'modal>=1.5,<2' fastapi==0.128.2 sympy==1.14.0 numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
          modal app list --json >/dev/null
          PYTHONPATH=. python frontier_v5/scripts/verify_quadratic_constraints_runtime.py --runtime runtime

      - name: Build candidate/live/rollback Modal wrappers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,pathlib
          template=r'''import importlib, importlib.metadata, sys, modal
          APP_NAME = __APP_NAME__
          PATCH_ID = __PATCH_ID__
          SOURCE_DIR = __SOURCE_DIR__
          roots = [
            "fastapi==0.128.2","uvicorn[standard]==0.38.0","sympy==1.14.0","numpy==2.3.5","scipy==1.17.0","mpmath==1.3.0",
            "duckdb==1.5.5","pyarrow==25.0.1","Pint==0.25.3","cvxpy==1.9.2","highspy==1.15.1","QuantLib==1.43","python-flint==0.9.0","z3-solver==5.1.0.0",
          ]
          image=(modal.Image.debian_slim(python_version="3.13").pip_install(*roots).add_local_dir(SOURCE_DIR+"/kernel","/opt/axiom/kernel",copy=True))
          app=modal.App(APP_NAME,include_source=True)
          @app.function(image=image,name="axiom_kernel",min_containers=0,max_containers=20,scaledown_window=300,timeout=300)
          @modal.asgi_app(requires_proxy_auth=True)
          def axiom_kernel():
              sys.path.insert(0,"/opt/axiom/kernel")
              from app.main import app as kernel_app
              return kernel_app
          @app.function(image=image,name="runtime_probe",min_containers=0,max_containers=1,scaledown_window=30,timeout=120)
          def runtime_probe():
              sys.path.insert(0,"/opt/axiom/kernel")
              m=importlib.import_module("app.main")
              routes=sorted({getattr(r,"path","") for r in m.app.routes if getattr(r,"path","")})
              return {"build_id":"MFT-AXIOM-V3-FULL-SELF-CONTAINED-20260904","runtime_patch":PATCH_ID,"main_sha256":__MAIN_SHA__,"routes":routes}
          '''
          specs=[
            ('modal_candidate.py',os.environ['CANDIDATE_APP'],'runtime',os.environ['PATCH_ID'],'cfa39f0f17c56a183c5024a600086aba4644ec925343129245a62e18294f7c47'),
            ('modal_live.py',os.environ['LIVE_APP'],'runtime',os.environ['PATCH_ID'],'cfa39f0f17c56a183c5024a600086aba4644ec925343129245a62e18294f7c47'),
            ('modal_rollback.py',os.environ['LIVE_APP'],'runtime_original','UNPATCHED_ROLLBACK','9389e4a501cd2385afe3820da685e97790e723da3bc5871a6dc2565b19f8fa3f'),
          ]
          for name,app,src,pid,digest in specs:
              s=template.replace('__APP_NAME__',repr(app)).replace('__PATCH_ID__',repr(pid)).replace('__SOURCE_DIR__',repr(src)).replace('__MAIN_SHA__',repr(digest))
              pathlib.Path(name).write_text(s)
          PY
          python -m py_compile modal_candidate.py modal_live.py modal_rollback.py

      - name: Deploy and prove private candidate
        shell: bash
        run: |
          set -euo pipefail
          modal deploy modal_candidate.py --name "$CANDIDATE_APP" --strategy recreate --tag "$PATCH_ID-CANDIDATE" >/tmp/candidate-deploy.log 2>&1 || { tail -120 /tmp/candidate-deploy.log; exit 1; }
          python - <<'PY' > /tmp/candidate-url
          import modal,os
          f=modal.Function.from_name(os.environ['CANDIDATE_APP'],'axiom_kernel')
          u=f.get_web_url()
          if not u: raise SystemExit('candidate URL unavailable')
          print(u)
          PY
          modal workspace proxy-tokens create --json >/tmp/proxy.json
          python - <<'PY'
          import json,pathlib
          vals=[]
          def walk(x):
              if isinstance(x,dict):
                  for v in x.values():walk(v)
              elif isinstance(x,list):
                  for v in x:walk(v)
              elif isinstance(x,str):vals.append(x)
          walk(json.load(open('/tmp/proxy.json')))
          ks=[x for x in vals if x.startswith('wk-')]; ss=[x for x in vals if x.startswith('ws-')]
          if len(ks)!=1 or len(ss)!=1:raise SystemExit('proxy token shape')
          pathlib.Path('/tmp/modal-key').write_text(ks[0]);pathlib.Path('/tmp/modal-secret').write_text(ss[0])
          PY
          echo "::add-mask::$(cat /tmp/modal-key)"; echo "::add-mask::$(cat /tmp/modal-secret)"
          python - <<'PY'
          import json,os,pathlib,urllib.request,urllib.error,math,time
          base=pathlib.Path('/tmp/candidate-url').read_text().strip().rstrip('/')
          headers={'Modal-Key':pathlib.Path('/tmp/modal-key').read_text(),'Modal-Secret':pathlib.Path('/tmp/modal-secret').read_text(),'content-type':'application/json','accept':'application/json'}
          def call(op,args,verify=True):
              q=urllib.request.Request(base+'/v1/compute',data=json.dumps({'operation':op,'args':args,'verify':verify}).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(q,timeout=120) as r:return r.status,json.loads(r.read() or b'{}')
              except urllib.error.HTTPError as e:
                  try:b=json.loads(e.read() or b'{}')
                  except:b={}
                  return e.code,b
          # Modal may return a transient 5xx while a freshly deployed ASGI container is cold-starting.
          ready=False
          for _ in range(60):
              q=urllib.request.Request(base+'/health',headers={k:v for k,v in headers.items() if k.lower()!='content-type'},method='GET')
              try:
                  with urllib.request.urlopen(q,timeout=30) as rr:
                      hb=json.loads(rr.read() or b'{}'); hc=rr.status
              except urllib.error.HTTPError as e:
                  hc=e.code; hb={}
              except Exception:
                  hc=0; hb={}
              if hc==200 and hb.get('ok') is True:
                  ready=True; break
              if hc not in {0,500,502,503,504}: raise SystemExit('candidate readiness unexpected HTTP '+str(hc))
              time.sleep(2)
          if not ready: raise SystemExit('candidate readiness timeout')
          portfolio={'Q':[[0.04,0.006,0.012,0],[0.006,0.09,0.018,0.009],[0.012,0.018,0.16,0.03],[0,0.009,0.03,0.0625]],'c':[0,0,0,0],'A_eq':[[1,1,1,1],[0.06,0.09,0.14,0.07]],'b_eq':[1,0.09],'bounds':[[0,1],[0,1],[0,1],[0,1]]}
          code=o=None
          for _ in range(20):
              code,o=call('optimization.quadratic',portfolio)
              if code==200: break
              if code not in {500,502,503,504}: break
              time.sleep(2)
          r=o.get('result') or {}; x=r.get('x') or []
          if code!=200 or o.get('ok') is not True or r.get('success') is not True or len(x)!=4:raise SystemExit('candidate portfolio execution failed '+repr((code,o))[:1500])
          expected=[0.30418737,0.25477424,0.25637699,0.18466141]
          if max(abs(float(a)-b) for a,b in zip(x,expected))>2e-6:raise SystemExit('candidate portfolio weights mismatch '+repr(x))
          if abs(sum(map(float,x))-1)>1e-8 or abs(sum(float(a)*b for a,b in zip([0.06,0.09,0.14,0.07],x))-0.09)>1e-8:raise SystemExit('candidate portfolio constraints violated')
          if not isinstance(r.get('verification'),dict) or r['verification'].get('verified') is not True:raise SystemExit('candidate QP verification failed '+repr(r.get('verification')))
          badcode,bad=call('optimization.quadratic',{'Q':[[2.0]],'c':[0.0],'Aeq':[[1.0]],'beq':[1.0]})
          if badcode==200 and bad.get('ok') is True:raise SystemExit('candidate unknown arguments did not fail closed')
          print(json.dumps({'candidate_qp_pass':True,'weights':x,'objective':r.get('fun'),'unknown_args_rejected':True},sort_keys=True))
          PY

      - name: Deploy patched shared live kernel with automatic rollback
        shell: bash
        run: |
          set -euo pipefail
          LIVE_MUTATED=0
          rollback(){
            if [ "$LIVE_MUTATED" = 1 ]; then
              echo "Live verification failed; restoring exact unpatched runtime."
              modal deploy modal_rollback.py --name "$LIVE_APP" --strategy recreate --tag 'MFT-AXIOM-V3-FULL-SELF-CONTAINED-20260904-ROLLBACK' >/tmp/rollback-deploy.log 2>&1 || { tail -120 /tmp/rollback-deploy.log; return 1; }
              python - <<'PY'
          import modal,os
          r=modal.Function.from_name(os.environ['LIVE_APP'],'runtime_probe').remote()
          if r.get('runtime_patch')!='UNPATCHED_ROLLBACK':raise SystemExit('rollback probe mismatch')
          print('MUSITU_AXIOM_QP_PRODUCTION_ROLLBACK_PASS')
          PY
            fi
          }
          trap 'rollback' ERR
          modal deploy modal_live.py --name "$LIVE_APP" --strategy recreate --tag "$PATCH_ID" >/tmp/live-deploy.log 2>&1 || { tail -120 /tmp/live-deploy.log; exit 1; }
          LIVE_MUTATED=1
          python - <<'PY'
          import modal,os
          r=modal.Function.from_name(os.environ['LIVE_APP'],'runtime_probe').remote()
          if r.get('runtime_patch')!=os.environ['PATCH_ID']:raise SystemExit('live runtime patch marker mismatch')
          if r.get('main_sha256')!='cfa39f0f17c56a183c5024a600086aba4644ec925343129245a62e18294f7c47':raise SystemExit('live main digest mismatch')
          print('LIVE_MODAL_PATCH_READBACK_PASS')
          PY
          python - <<'PY'
          import json,os,pathlib,urllib.request,urllib.error,time
          base=os.environ['LIVE_MODAL_URL'].rstrip('/')
          headers={'Modal-Key':pathlib.Path('/tmp/modal-key').read_text(),'Modal-Secret':pathlib.Path('/tmp/modal-secret').read_text(),'content-type':'application/json','accept':'application/json'}
          portfolio={'Q':[[0.04,0.006,0.012,0],[0.006,0.09,0.018,0.009],[0.012,0.018,0.16,0.03],[0,0.009,0.03,0.0625]],'c':[0,0,0,0],'A_eq':[[1,1,1,1],[0.06,0.09,0.14,0.07]],'b_eq':[1,0.09],'bounds':[[0,1],[0,1],[0,1],[0,1]]}
          def req(args):
              q=urllib.request.Request(base+'/v1/compute',data=json.dumps({'operation':'optimization.quadratic','args':args,'verify':True}).encode(),headers=headers,method='POST')
              try:
                with urllib.request.urlopen(q,timeout=120) as r:return r.status,json.loads(r.read() or b'{}')
              except urllib.error.HTTPError as e:
                try:o=json.loads(e.read() or b'{}')
                except:o={}
                return e.code,o
          # Wait for the newly recreated live ASGI container before evaluating semantics.
          ready=False
          for _ in range(60):
              q=urllib.request.Request(base+'/health',headers={k:v for k,v in headers.items() if k.lower()!='content-type'},method='GET')
              try:
                  with urllib.request.urlopen(q,timeout=30) as hr:
                      hb=json.loads(hr.read() or b'{}'); hc=hr.status
              except urllib.error.HTTPError as e:
                  hc=e.code; hb={}
              except Exception:
                  hc=0; hb={}
              if hc==200 and hb.get('ok') is True:
                  ready=True; break
              if hc not in {0,500,502,503,504}: raise SystemExit('live readiness unexpected HTTP '+str(hc))
              time.sleep(2)
          if not ready: raise SystemExit('live readiness timeout')
          code=o=None
          for _ in range(20):
              code,o=req(portfolio)
              if code==200: break
              if code not in {500,502,503,504}: break
              time.sleep(2)
          r=o.get('result') or {}; x=r.get('x') or []
          expected=[0.30418737,0.25477424,0.25637699,0.18466141]
          if code!=200 or o.get('ok') is not True or r.get('success') is not True or len(x)!=4 or max(abs(float(a)-b) for a,b in zip(x,expected))>2e-6:raise SystemExit('live direct QP mismatch '+repr((code,o))[:1800])
          if not isinstance(r.get('verification'),dict) or r['verification'].get('verified') is not True:raise SystemExit('live direct QP verification missing')
          bc,bo=req({'Q':[[2.0]],'c':[0.0],'Aeq':[[1.0]],'beq':[1.0]})
          if bc==200 and bo.get('ok') is True:raise SystemExit('live unknown args did not fail closed')
          print(json.dumps({'live_direct_qp_pass':True,'weights':x,'objective':r.get('fun'),'unknown_args_rejected':True},sort_keys=True))
          PY
          trap - ERR
          echo LIVE_SHARED_KERNEL_DEPLOY_AND_DIRECT_VERIFY_PASS

      - name: Verify Cloudflare service-binding chain uses patched live kernel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,urllib.request,urllib.error,secrets
          from frontier_v5.scripts.deploy_claude_workers_dev import cloudflare_headers,upload_worker,delete_worker,cf,ACCOUNT_ID
          worker='musitu-axiom-qp-shared-core-probe-20261004'
          source=r'''export default {async fetch(r,e){const u=new URL(r.url);const portfolio={Q:[[0.04,0.006,0.012,0],[0.006,0.09,0.018,0.009],[0.012,0.018,0.16,0.03],[0,0.009,0.03,0.0625]],c:[0,0,0,0],A_eq:[[1,1,1,1],[0.06,0.09,0.14,0.07]],b_eq:[1,0.09],bounds:[[0,1],[0,1],[0,1],[0,1]]};if(u.pathname==="/qp")return e.UP.fetch("http://container/v1/compute",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({operation:"optimization.quadratic",args:portfolio,verify:true})});if(u.pathname==="/bad")return e.UP.fetch("http://container/v1/compute",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({operation:"optimization.quadratic",args:{Q:[[2]],c:[0],Aeq:[[1]],beq:[1]},verify:true})});return new Response("x",{status:404})}};'''
          h=cloudflare_headers()
          try:
              try:delete_worker(h,worker)
              except:pass
              upload_worker(h,worker,source.encode(),[{'type':'service','name':'UP','service':os.environ['ADAPTER_WORKER'],'environment':'production'}])
              sub,_=cf(h,f"/accounts/{ACCOUNT_ID}/workers/subdomain")
              host=f"https://{worker}.{sub['subdomain']}.workers.dev"
              def get(path):
                  try:
                      with urllib.request.urlopen(host+path,timeout=120) as r:return r.status,json.loads(r.read() or b'{}')
                  except urllib.error.HTTPError as e:
                      try:o=json.loads(e.read() or b'{}')
                      except:o={}
                      return e.code,o
              c,o=get('/qp'); rr=o.get('result') or {}; x=rr.get('x') or []
              expected=[0.30418737,0.25477424,0.25637699,0.18466141]
              if c!=200 or o.get('ok') is not True or rr.get('success') is not True or len(x)!=4 or max(abs(float(a)-b) for a,b in zip(x,expected))>2e-6:raise RuntimeError('service-chain QP mismatch '+repr((c,o))[:1600])
              if not isinstance(rr.get('verification'),dict) or rr['verification'].get('verified') is not True:raise RuntimeError('service-chain verification absent')
              bc,bo=get('/bad')
              if bc==200 and bo.get('ok') is True:raise RuntimeError('service-chain unknown args not rejected')
              print(json.dumps({'gate':'MUSITU_AXIOM_SHARED_CORE_QP_SERVICE_CHAIN_PASS','weights':x,'objective':rr.get('fun'),'unknown_args_rejected':True},sort_keys=True))
          finally:
              try:delete_worker(h,worker)
              except:pass
          PY

      - name: Reverify protected repository state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$SEALED_MAIN"
          test "$(git hash-object auth/musitu_axiom_oauth_worker.mjs)" = "$OPENAI_AUTH_BLOB"
          test "$(git hash-object mcp/musitu_axiom_plugin_gate_v4.mjs)" = "$OPENAI_MCP_BLOB"
          echo PROTECTED_REPOSITORY_STATE_POST_QP_DEPLOY_PASS

      - name: Seal deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,os,datetime
          out={
            'schema':'musitu.axiom.shared_core_quadratic_constraints_deploy.v1',
            'timestamp_utc':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
            'gate':'MUSITU_AXIOM_SHARED_CORE_QUADRATIC_CONSTRAINTS_DEPLOY_PASS',
            'live_modal_app':os.environ['LIVE_APP'],
            'live_modal_url':os.environ['LIVE_MODAL_URL'],
            'patch_id':os.environ['PATCH_ID'],
            'original_main_sha256':'9389e4a501cd2385afe3820da685e97790e723da3bc5871a6dc2565b19f8fa3f',
            'patched_main_sha256':'cfa39f0f17c56a183c5024a600086aba4644ec925343129245a62e18294f7c47',
            'canonical_supported_keys':['Q','c','x0','A_eq','b_eq','A_ub','b_ub','bounds'],
            'unknown_arguments_fail_closed':True,
            'equality_constraints':True,'inequality_constraints':True,'box_bounds':True,
            'post_solve_constraint_and_stationarity_verification':True,
            'portfolio_regression_passed':True,
            'all_74_fixture_smoke_passed_predeploy':True,
            'candidate_private_deploy_passed':True,
            'live_direct_compute_passed':True,
            'cloudflare_service_binding_chain_passed':True,
            'main_unchanged':True,
            'openai_gate_source_unchanged':True,
            'oauth_source_unchanged':True,
