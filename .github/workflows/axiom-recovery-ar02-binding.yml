name: MUSITU Axiom AR-02 Binding Restore Gate

on:
  push:
    branches:
      - frontier/axiom-recovery-ar02-binding-20260917
    paths:
      - 'recovery/ar02/cloud_binding_contract.json'
      - 'recovery/ar02/provider_inventory_readonly.py'
      - 'recovery/ar02/restore_drill.py'
      - 'docs/axiom_recovery/AR02_BINDING_RESTORE_PROGRESS.json'
      - 'docs/axiom_recovery/AR02_ZERO_COST_RESOURCE_PLAN.json'
      - '.github/scripts/axiom_recovery_ar02_binding_verify.py'
      - '.github/workflows/axiom-recovery-ar02-binding.yml'
      - '.github/workflows/axiom-recovery-ar02-provider-readonly.yml'

permissions:
  contents: read

concurrency:
  group: musitu-axiom-ar02-binding-restore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  builder-contract-and-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reassert recovery authority and zero-provider boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = frontier/axiom-recovery-ar02-binding-20260917
          git merge-base --is-ancestor 0be6bee6d7638ef13738f22fc47e0f1b30960a7b HEAD
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = d6a846f6bbe0bccac1758713eb4de167caf07113
          test "$(git ls-remote origin refs/heads/frontier/axiom-runtime-connection-20260916 | awk '{print $1}')" = 216ee7d15f01a3fb558452cc4b906a055001ccdd
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_API_KEY:-}"
          test -z "${CLOUDFLARE_EMAIL:-}"
          test -z "${CLOUDFLARE_AR02_READ_TOKEN:-}"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ANTHROPIC_API_KEY:-}"

      - name: Run original AR-02 behavioral tests and compile recovery code
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest recovery.ar02.tests.test_ar02_isolation -v
          python -m py_compile \
            recovery/ar02/isolation.py \
            recovery/ar02/restore_drill.py \
            recovery/ar02/provider_inventory_readonly.py \
            .github/scripts/axiom_recovery_ar02_binding_verify.py
          python recovery/ar02/provider_inventory_readonly.py --self-test
          git diff --check

      - name: Builder-test provider preflight ordering and fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          workflow = Path('.github/workflows/axiom-recovery-ar02-provider-readonly.yml').read_text(encoding='utf-8')
          preflight = workflow.index('- name: Fail-closed provider-binding preflight')
          collector = workflow.index('- name: Collect redacted provider evidence with separated read-only identities')
          assert preflight < collector
          preflight_text = workflow[preflight:collector]
          assert ('${' + '{ secrets.') not in preflight_text
          for marker in (
              'READ_ONLY_PROVIDER_INVENTORY',
              'PASS_FAIL_CLOSED_PREFLIGHT',
              'receipt_sha256',
              'timestamp_utc',
              'workflow_sha256',
              'contract_sha256',
              '--remote',
              'wrangler_deploy = " wrangler " + "deploy"',
              ' deploy ',
              ' publish ',
              ' d1 execute ',
              ' insert into ',
              ' delete from ',
              ' drop table ',
              ' alter table ',
              ' create table ',
              'required_non_production_bindings',
              '{"staging", "canary"}',
              'production_denylist',
              'provider_readback_status',
              'NOT_PROVEN',
          ):
              assert marker in preflight_text, marker
          assert 'wrangler deploy' not in preflight_text
          collector_text = workflow[collector:]
          receipt_check = collector_text.index('preflight receipt hash mismatch')
          provider_call = collector_text.index('python recovery/ar02/provider_inventory_readonly.py')
          assert receipt_check < provider_call
          assert 'preflight receipt is stale' in collector_text

          contract = json.loads(Path('recovery/ar02/cloud_binding_contract.json').read_text(encoding='utf-8'))
          assert set(contract['required_non_production_bindings']) == {'staging', 'canary'}
          assert contract['state'] == 'UNBOUND_PROVIDER_INVENTORY_REQUIRED'
          assert contract['claim_boundary']['cloud_isolation'] == 'NOT_PROVEN'
          assert contract['claim_boundary']['production_mutated'] is False
          PY

      - name: Execute synthetic non-destructive restore drill
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(mktemp -d /tmp/axiom-ar02-restore-XXXXXX)"
          python -m recovery.ar02.restore_drill --workspace "$workspace" | tee /tmp/ar02-restore-evidence.json
          test "$(python -c 'import json; print(json.load(open("/tmp/ar02-restore-evidence.json"))["status"])')" = PASS_SYNTHETIC_NON_DESTRUCTIVE_RESTORE
          test "$(python -c 'import json; print(str(json.load(open("/tmp/ar02-restore-evidence.json"))["production_authority"]).lower())')" = false

      - name: Prove binding contract remains unbound and provider-native
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          c=json.load(open('recovery/ar02/cloud_binding_contract.json'))
          assert c['state']=='UNBOUND_PROVIDER_INVENTORY_REQUIRED'
          assert c['claim_boundary']['cloud_isolation']=='NOT_PROVEN'
          assert c['claim_boundary']['runtime_rebound_off_production_d1'] is False
          assert c['provider_identity_semantics']['r2_bucket']['identity_kind']=='NAME'
          assert all(v is False for v in c['promotion_preconditions'].values())
          for row in c['required_non_production_bindings'].values():
              assert row['provider_readback_status']=='NOT_PROVEN'
              assert row['artifact_bucket_provider_identity_kind']=='NAME'
              assert row['artifact_bucket_provider_identity_value'] is None
              for key in ('database_id','artifact_bucket_id','queue_id','workflow_id'):
                  assert row[key] is None
          PY
          ! rg -n 'wrangler deploy|d1 execute .*--remote' recovery/ar02/provider_inventory_readonly.py recovery/ar02/restore_drill.py

  independent-repository-verifier:
    needs: builder-contract-and-restore
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout independently without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Independently verify provider preflight cannot be skipped in workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/axiom-recovery-ar02-provider-readonly.yml').read_text(encoding='utf-8')
          preflight = workflow.index('- name: Fail-closed provider-binding preflight')
          collector = workflow.index('- name: Collect redacted provider evidence with separated read-only identities')
          assert preflight < collector
          preflight_text = workflow[preflight:collector]
          assert 'if operation != "READ_ONLY_PROVIDER_INVENTORY"' in preflight_text
          assert 'command != "python recovery/ar02/provider_inventory_readonly.py"' in preflight_text
          assert 'set(bindings) != {"staging", "canary"}' in preflight_text
          assert 'matches production denylist' in preflight_text
          assert 'cannot be trusted before provider readback' in preflight_text
          assert 'receipt_sha256' in preflight_text
          assert 'timestamp_utc' in preflight_text
          assert 'provider_readback": "NOT_PERFORMED_BY_PREFLIGHT"' in preflight_text
          collector_text = workflow[collector:]
          hash_check = collector_text.index('preflight receipt hash mismatch')
          source_check = collector_text.index('preflight source commit does not match HEAD')
          stale_check = collector_text.index('preflight receipt is stale')
          provider_call = collector_text.index('python recovery/ar02/provider_inventory_readonly.py')
          assert max(hash_check, source_check, stale_check) < provider_call
          assert 'wrangler deploy' not in collector_text
          assert 'd1 execute' not in collector_text
          PY

      - name: Run independent repository verifier
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_API_KEY:-}"
          test -z "${CLOUDFLARE_EMAIL:-}"
          test -z "${CLOUDFLARE_AR02_READ_TOKEN:-}"
          python .github/scripts/axiom_recovery_ar02_binding_verify.py
