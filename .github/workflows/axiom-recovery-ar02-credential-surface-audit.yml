name: MUSITU Axiom AR-02 Credential Surface Audit

on:
  push:
    branches:
      - frontier/axiom-recovery-ar02-credential-surface-audit-20260917
    paths:
      - '.github/workflows/axiom-recovery-ar02-credential-surface-audit.yml'
      - 'docs/axiom_recovery/AR02_CREDENTIAL_SURFACE_EVIDENCE.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-axiom-ar02-credential-surface-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  builder-static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      report_sha256: ${{ steps.audit.outputs.report_sha256 }}
      global_key_workflows: ${{ steps.audit.outputs.global_key_workflows }}
      mutation_indicator_workflows: ${{ steps.audit.outputs.mutation_indicator_workflows }}
      reference_only_workflows: ${{ steps.audit.outputs.reference_only_workflows }}
    steps:
      - name: Checkout exact audit branch without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reassert authority and zero-provider boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = frontier/axiom-recovery-ar02-credential-surface-audit-20260917
          git merge-base --is-ancestor e869b6fffa29ccf7990d7d49b24004f7fe103e08 HEAD
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = d6a846f6bbe0bccac1758713eb4de167caf07113
          test "$(git ls-remote origin refs/heads/frontier/axiom-runtime-connection-20260916 | awk '{print $1}')" = 216ee7d15f01a3fb558452cc4b906a055001ccdd
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_API_KEY:-}"
          test -z "${CLOUDFLARE_EMAIL:-}"
          test -z "${CLOUDFLARE_GLOBAL_API_KEY:-}"
          git diff --check

      - name: Verify exact two-file audit scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          base='e869b6fffa29ccf7990d7d49b24004f7fe103e08'
          expected={
            '.github/workflows/axiom-recovery-ar02-credential-surface-audit.yml',
            'docs/axiom_recovery/AR02_CREDENTIAL_SURFACE_EVIDENCE.json',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',f'{base}..HEAD'],text=True).splitlines())
          if changed != expected:
            raise SystemExit(f'audit scope mismatch missing={sorted(expected-changed)!r} extra={sorted(changed-expected)!r}')
          print('credential_surface_exact_two_file_scope=PASS')
          PY

      - name: Builder scan sealed-main credential surface
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re,subprocess
          SEALED='d6a846f6bbe0bccac1758713eb4de167caf07113'
          PREFIX='.github/workflows/'
          names=subprocess.check_output(['git','ls-tree','-r','--name-only',SEALED,PREFIX],text=True).splitlines()
          names=sorted(p for p in names if p.endswith(('.yml','.yaml')))

          rules={
            'WRANGLER_DEPLOY': [r'\bwrangler\s+deploy\b'],
            'WRANGLER_REMOTE_D1': [r'\bwrangler\s+d1\s+execute\b[^\n]*--remote',r'--remote[^\n]*\bwrangler\s+d1\s+execute\b'],
            'WRANGLER_SECRET_OR_CONFIG_WRITE': [r'\bwrangler\s+secret\s+put\b',r'\bwrangler\s+(?:kv|queues?|r2|d1)\b[^\n]*(?:create|delete|put|write)\b'],
            'CLOUDFLARE_HTTP_MUTATION': [r'api\.cloudflare\.com[^\n]{0,500}\b(?:POST|PUT|PATCH|DELETE)\b',r'\b(?:POST|PUT|PATCH|DELETE)\b[^\n]{0,500}api\.cloudflare\.com'],
            'EXPLICIT_HTTP_MUTATION_METHOD': [r"method\s*=\s*['\"](?:POST|PUT|PATCH|DELETE)['\"]",r"['\"](?:POST|PUT|PATCH|DELETE)['\"]\s*,\s*(?:obj|body|payload|data|None|\w+)"],
            'CURL_MUTATION': [r'\bcurl\b[^\n]*(?:-X|--request)\s+(?:POST|PUT|PATCH|DELETE)\b'],
            'D1_SQL_MUTATION': [r'\b(?:INSERT\s+INTO|UPDATE\s+[A-Za-z_]|DELETE\s+FROM|CREATE\s+TABLE|ALTER\s+TABLE|DROP\s+TABLE)\b'],
            'WORKER_SCRIPT_OR_SECRET_ENDPOINT': [r'/workers/scripts/',r'/secrets(?:\b|/)'],
            'DNS_ROUTE_OR_DOMAIN_MUTATION_SURFACE': [r'/zones/[^\s\"\']+/(?:dns_records|workers/routes)',r'/workers/domains'],
          }
          compiled={k:[re.compile(x,re.I|re.S) for x in xs] for k,xs in rules.items()}
          rows=[]
          for path in names:
            text=subprocess.check_output(['git','show',f'{SEALED}:{path}'],text=True,errors='replace')
            if 'CLOUDFLARE_GLOBAL_API_KEY' not in text:
              continue
            hits=[]
            for label,patterns in compiled.items():
              if any(p.search(text) for p in patterns): hits.append(label)
            rows.append({'path':path,'indicators':sorted(hits),'classification':'STATIC_MUTATION_INDICATOR_PRESENT' if hits else 'GLOBAL_KEY_REFERENCE_ONLY_MUTATION_NOT_PROVEN'})
          rows.sort(key=lambda x:x['path'])
          report={
            'schema':'musitu.axiom.recovery.ar02-credential-surface-static-audit.v1',
            'sealed_main_commit':SEALED,
            'workflow_files_scanned':len(names),
            'global_key_workflows':len(rows),
            'mutation_indicator_workflows':sum(r['classification']=='STATIC_MUTATION_INDICATOR_PRESENT' for r in rows),
            'reference_only_workflows':sum(r['classification']=='GLOBAL_KEY_REFERENCE_ONLY_MUTATION_NOT_PROVEN' for r in rows),
            'classification_semantics':{
              'STATIC_MUTATION_INDICATOR_PRESENT':'Source contains the global Cloudflare key and at least one static mutation-capable indicator. This is source evidence of risk, not proof that a mutation executed.',
              'GLOBAL_KEY_REFERENCE_ONLY_MUTATION_NOT_PROVEN':'The global key is referenced but this scanner found none of its bounded mutation indicators. This MUST NOT be interpreted as safe or read-only.'
            },
            'provider_execution_performed':False,
            'production_mutated':False,
            'rows':rows,
          }
          canonical=json.dumps(report,sort_keys=True,separators=(',',':'))
          digest=hashlib.sha256(canonical.encode()).hexdigest()
          print(json.dumps(report,indent=2,sort_keys=True))
          print('REPORT_SHA256='+digest)
          with open('/tmp/ar02-credential-surface-builder.json','w') as f: json.dump(report,f,indent=2,sort_keys=True)
          import os
          out=os.environ['GITHUB_OUTPUT']
          with open(out,'a') as f:
            f.write(f'report_sha256={digest}\n')
            f.write(f'global_key_workflows={report["global_key_workflows"]}\n')
            f.write(f'mutation_indicator_workflows={report["mutation_indicator_workflows"]}\n')
            f.write(f'reference_only_workflows={report["reference_only_workflows"]}\n')
          if not rows:
            raise SystemExit('sealed main unexpectedly has zero global-key workflow references')
          if report['mutation_indicator_workflows'] < 16:
            raise SystemExit('static audit regressed below the already-proven 16 mutation-capable paths')
          PY

      - name: Builder verify frozen credential-surface evidence
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.repository.private }}' = 'true'
          python - <<'PY'
          import json
          p='docs/axiom_recovery/AR02_CREDENTIAL_SURFACE_EVIDENCE.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['schema']=='musitu.axiom.recovery.ar02-credential-surface-evidence.v1'
          assert d['source']['sealed_main_commit']=='d6a846f6bbe0bccac1758713eb4de167caf07113'
          assert d['source']['runtime_source_commit']=='216ee7d15f01a3fb558452cc4b906a055001ccdd'
          assert d['source']['qualifying_audit_commit']=='6c423553a3ea100a78acac8f9d8d10d40271db9e'
          assert d['source']['workflow_run_id']==35271270868
          a=d['static_audit']
          assert (a['workflow_files_scanned'],a['global_key_workflows'],a['mutation_indicator_workflows'],a['reference_only_workflows'])==(171,158,99,59)
          assert a['canonical_report_sha256']=='16992fcf6234e90ad4552c2c40c9164b6a2b10281b45643d89e91c846d29dfa3'
          assert a['builder_verified'] is True and a['independent_digest_reproduced'] is True
          r=d['repository_security_readback']
          assert r['repository_visibility']=='private' and r['repository_private'] is True
          assert r['privacy_blocker_closed'] is True
          assert r['main_protected'] is False and r['branch_protection_blocker_closed'] is False
          assert r['rulesets_status']=='BLOCKED_BY_GITHUB_PLAN' and r['ruleset_blocker_closed'] is False
          b=d['claim_boundary']
          assert b['provider_execution_performed'] is False
          assert b['cloudflare_provider_readback_performed'] is False
          assert b['production_mutated'] is False
          assert b['staging_canary_isolation']=='NOT_PROVEN'
          assert b['nonproduction_credentials_cannot_mutate_production']=='NOT_PROVEN'
          assert b['ar02_complete'] is False and b['ar03_started'] is False
          assert b['full_product_connection']=='NOT_PROVEN'
          assert b['wolfram_parity']=='NOT_CERTIFIED' and b['superiority']=='NOT_CERTIFIED'
          print('credential_surface_frozen_evidence=PASS')
          PY

      - name: Preserve builder claim boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'This is a static sealed-main source audit only.'
          echo 'No provider credential was supplied; no provider API was called; no production mutation occurred.'
          echo 'Reference-only means mutation NOT PROVEN by this bounded scanner, not SAFE.'

  independent-static-audit:
    needs: builder-static-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout independently without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Independent scanner recompute and compare canonical digest
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.builder-static-audit.outputs.report_sha256 }}
          EXPECTED_GLOBAL: ${{ needs.builder-static-audit.outputs.global_key_workflows }}
          EXPECTED_MUTATION: ${{ needs.builder-static-audit.outputs.mutation_indicator_workflows }}
          EXPECTED_REFERENCE_ONLY: ${{ needs.builder-static-audit.outputs.reference_only_workflows }}
        run: |
          set -euo pipefail
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_API_KEY:-}"
          test -z "${CLOUDFLARE_EMAIL:-}"
          test -z "${CLOUDFLARE_GLOBAL_API_KEY:-}"
          python - <<'PY'
          import hashlib,json,os,re,subprocess
          sealed='d6a846f6bbe0bccac1758713eb4de167caf07113'
          paths=sorted(p for p in subprocess.check_output(['git','ls-tree','-r','--name-only',sealed,'.github/workflows/'],text=True).splitlines() if p.endswith(('.yml','.yaml')))
          patterns={
            'WRANGLER_DEPLOY': re.compile(r'\bwrangler\s+deploy\b',re.I),
            'WRANGLER_REMOTE_D1': re.compile(r'(?:\bwrangler\s+d1\s+execute\b[^\n]*--remote|--remote[^\n]*\bwrangler\s+d1\s+execute\b)',re.I),
            'WRANGLER_SECRET_OR_CONFIG_WRITE': re.compile(r'(?:\bwrangler\s+secret\s+put\b|\bwrangler\s+(?:kv|queues?|r2|d1)\b[^\n]*(?:create|delete|put|write)\b)',re.I),
            'CLOUDFLARE_HTTP_MUTATION': re.compile(r'(?:api\.cloudflare\.com[^\n]{0,500}\b(?:POST|PUT|PATCH|DELETE)\b|\b(?:POST|PUT|PATCH|DELETE)\b[^\n]{0,500}api\.cloudflare\.com)',re.I|re.S),
            'EXPLICIT_HTTP_MUTATION_METHOD': re.compile(r'(?:method\s*=\s*[\"\'](?:POST|PUT|PATCH|DELETE)[\"\']|[\"\'](?:POST|PUT|PATCH|DELETE)[\"\']\s*,\s*(?:obj|body|payload|data|None|\w+))',re.I),
            'CURL_MUTATION': re.compile(r'\bcurl\b[^\n]*(?:-X|--request)\s+(?:POST|PUT|PATCH|DELETE)\b',re.I),
            'D1_SQL_MUTATION': re.compile(r'\b(?:INSERT\s+INTO|UPDATE\s+[A-Za-z_]|DELETE\s+FROM|CREATE\s+TABLE|ALTER\s+TABLE|DROP\s+TABLE)\b',re.I),
            'WORKER_SCRIPT_OR_SECRET_ENDPOINT': re.compile(r'(?:/workers/scripts/|/secrets(?:\b|/))',re.I),
            'DNS_ROUTE_OR_DOMAIN_MUTATION_SURFACE': re.compile(r'(?:/zones/[^\s\"\']+/(?:dns_records|workers/routes)|/workers/domains)',re.I),
          }
          rows=[]
          for path in paths:
            raw=subprocess.check_output(['git','show',f'{sealed}:{path}'])
            text=raw.decode('utf-8','replace')
            if 'CLOUDFLARE_GLOBAL_API_KEY' not in text: continue
            hits=sorted(name for name,rx in patterns.items() if rx.search(text))
            rows.append({'path':path,'indicators':hits,'classification':'STATIC_MUTATION_INDICATOR_PRESENT' if hits else 'GLOBAL_KEY_REFERENCE_ONLY_MUTATION_NOT_PROVEN'})
          rows.sort(key=lambda x:x['path'])
          report={
            'schema':'musitu.axiom.recovery.ar02-credential-surface-static-audit.v1',
            'sealed_main_commit':sealed,
            'workflow_files_scanned':len(paths),
            'global_key_workflows':len(rows),
            'mutation_indicator_workflows':sum(x['classification']=='STATIC_MUTATION_INDICATOR_PRESENT' for x in rows),
            'reference_only_workflows':sum(x['classification']=='GLOBAL_KEY_REFERENCE_ONLY_MUTATION_NOT_PROVEN' for x in rows),
            'classification_semantics':{
              'STATIC_MUTATION_INDICATOR_PRESENT':'Source contains the global Cloudflare key and at least one static mutation-capable indicator. This is source evidence of risk, not proof that a mutation executed.',
              'GLOBAL_KEY_REFERENCE_ONLY_MUTATION_NOT_PROVEN':'The global key is referenced but this scanner found none of its bounded mutation indicators. This MUST NOT be interpreted as safe or read-only.'
            },
            'provider_execution_performed':False,
            'production_mutated':False,
            'rows':rows,
          }
          digest=hashlib.sha256(json.dumps(report,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          if digest!=os.environ['EXPECTED_SHA']: raise SystemExit(f'independent report digest mismatch {digest} != {os.environ["EXPECTED_SHA"]}')
          if str(report['global_key_workflows'])!=os.environ['EXPECTED_GLOBAL']: raise SystemExit('global-key count mismatch')
          if str(report['mutation_indicator_workflows'])!=os.environ['EXPECTED_MUTATION']: raise SystemExit('mutation-indicator count mismatch')
          if str(report['reference_only_workflows'])!=os.environ['EXPECTED_REFERENCE_ONLY']: raise SystemExit('reference-only count mismatch')
          print(json.dumps({'status':'PASS_INDEPENDENT_STATIC_AUDIT','report_sha256':digest,'global_key_workflows':report['global_key_workflows'],'mutation_indicator_workflows':report['mutation_indicator_workflows'],'reference_only_workflows':report['reference_only_workflows'],'provider_execution_performed':False,'production_mutated':False},sort_keys=True))
          PY

      - name: Independent verify frozen evidence does not overclaim
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.repository.private }}' = 'true'
          python - <<'PY'
          import json
          d=json.load(open('docs/axiom_recovery/AR02_CREDENTIAL_SURFACE_EVIDENCE.json',encoding='utf-8'))
          a=d['static_audit']
          expected=(171,158,99,59,'16992fcf6234e90ad4552c2c40c9164b6a2b10281b45643d89e91c846d29dfa3')
          got=(a['workflow_files_scanned'],a['global_key_workflows'],a['mutation_indicator_workflows'],a['reference_only_workflows'],a['canonical_report_sha256'])
          if got!=expected: raise SystemExit(f'frozen audit evidence mismatch {got!r}')
          r=d['repository_security_readback']
          if not r['repository_private'] or r['main_protected'] or r['rulesets_status']!='BLOCKED_BY_GITHUB_PLAN':
            raise SystemExit('repository security evidence drift or overclaim')
          b=d['claim_boundary']
          if b['provider_execution_performed'] or b['production_mutated'] or b['ar02_complete'] or b['ar03_started']:
            raise SystemExit('claim boundary overstated')
          if b['staging_canary_isolation']!='NOT_PROVEN' or b['superiority']!='NOT_CERTIFIED':
            raise SystemExit('external claim boundary overstated')
          print('credential_surface_frozen_evidence_independent=PASS')
          PY

      - name: Independent authority readback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = d6a846f6bbe0bccac1758713eb4de167caf07113
          test "$(git ls-remote origin refs/heads/frontier/axiom-runtime-connection-20260916 | awk '{print $1}')" = 216ee7d15f01a3fb558452cc4b906a055001ccdd
          echo 'provider_execution_performed=false'
          echo 'production_mutated=false'
