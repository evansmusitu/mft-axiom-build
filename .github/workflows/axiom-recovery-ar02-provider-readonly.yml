name: MUSITU Axiom AR-02 Provider Read-Only Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-axiom-ar02-provider-readonly
  cancel-in-progress: false

jobs:
  provider-readonly-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fail closed unless repository is private
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.repository.private }}" = "true"

      - name: Checkout exact recovery branch without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: frontier/axiom-recovery-ar02-binding-20260917
          persist-credentials: false
          fetch-depth: 0

      - name: Reassert source authority before provider read
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = d6a846f6bbe0bccac1758713eb4de167caf07113
          test "$(git ls-remote origin refs/heads/frontier/axiom-runtime-connection-20260916 | awk '{print $1}')" = 216ee7d15f01a3fb558452cc4b906a055001ccdd
          python recovery/ar02/provider_inventory_readonly.py --self-test

      - name: Fail-closed provider-binding preflight
        shell: bash
        env:
          PROVIDER_OPERATION: READ_ONLY_PROVIDER_INVENTORY
          PROVIDER_COMMAND: python recovery/ar02/provider_inventory_readonly.py
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/ar02-provider-preflight.json"
          python - "$receipt" "$PROVIDER_OPERATION" "$PROVIDER_COMMAND" <<'PY'
          import datetime
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys

          receipt_path = pathlib.Path(sys.argv[1])
          operation = sys.argv[2]
          command = sys.argv[3]
          if operation != "READ_ONLY_PROVIDER_INVENTORY":
              raise SystemExit("FAIL_CLOSED: unclassified provider operation")
          lowered = " " + command.casefold() + " "
          wrangler_deploy = " wrangler " + "deploy"
          prohibited = (
              "--remote",
              wrangler_deploy,
              " deploy ",
              " publish ",
              " d1 execute ",
              " insert into ",
              " delete from ",
              " update ",
              " drop table ",
              " alter table ",
              " create table ",
          )
          if any(marker in lowered for marker in prohibited):
              raise SystemExit("FAIL_CLOSED: prohibited provider/deploy/write command")
          if command != "python recovery/ar02/provider_inventory_readonly.py":
              raise SystemExit("FAIL_CLOSED: provider command is not the frozen read-only collector")

          contract_path = pathlib.Path("recovery/ar02/cloud_binding_contract.json")
          workflow_path = pathlib.Path(".github/workflows/axiom-recovery-ar02-provider-readonly.yml")
          contract = json.loads(contract_path.read_text(encoding="utf-8"))
          if contract.get("state") != "UNBOUND_PROVIDER_INVENTORY_REQUIRED":
              raise SystemExit("FAIL_CLOSED: unexpected cloud binding state")
          bindings = contract.get("required_non_production_bindings")
          if not isinstance(bindings, dict) or set(bindings) != {"staging", "canary"}:
              raise SystemExit("FAIL_CLOSED: exact staging/canary binding set required")

          required_text_fields = (
              "database_name",
              "artifact_bucket_name",
              "queue_name",
              "workflow_name",
              "identity_audience",
          )
          provider_id_fields = (
              "database_id",
              "artifact_bucket_id",
              "artifact_bucket_provider_identity_value",
              "queue_id",
              "workflow_id",
          )
          deny = contract.get("production_denylist", {})
          deny_values = {
              str(value).casefold()
              for group in ("database_names", "database_ids", "hostnames")
              for value in deny.get(group, [])
          }
          seen = set()
          for environment in ("staging", "canary"):
              row = bindings[environment]
              if row.get("provider_readback_status") != "NOT_PROVEN":
                  raise SystemExit(f"FAIL_CLOSED: {environment} unverified provider state was relabelled")
              for field in provider_id_fields:
                  if row.get(field) is not None:
                      raise SystemExit(f"FAIL_CLOSED: {environment}.{field} cannot be trusted before provider readback")
              for field in required_text_fields:
                  value = row.get(field)
                  if not isinstance(value, str) or not value:
                      raise SystemExit(f"FAIL_CLOSED: {environment}.{field} missing")
                  folded = value.casefold()
                  if folded in deny_values:
                      raise SystemExit(f"FAIL_CLOSED: {environment}.{field} matches production denylist")
                  if folded in seen:
                      raise SystemExit(f"FAIL_CLOSED: duplicate non-production identity {value}")
                  seen.add(folded)
              if environment not in row["identity_audience"]:
                  raise SystemExit(f"FAIL_CLOSED: {environment} audience is not environment-scoped")

          if bindings["staging"]["database_name"] == bindings["canary"]["database_name"]:
              raise SystemExit("FAIL_CLOSED: staging/canary D1 names must be distinct")
          if bindings["staging"]["artifact_bucket_name"] == bindings["canary"]["artifact_bucket_name"]:
              raise SystemExit("FAIL_CLOSED: staging/canary R2 names must be distinct")
          if bindings["staging"]["queue_name"] == bindings["canary"]["queue_name"]:
              raise SystemExit("FAIL_CLOSED: staging/canary queue names must be distinct")
          if bindings["staging"]["workflow_name"] == bindings["canary"]["workflow_name"]:
              raise SystemExit("FAIL_CLOSED: staging/canary workflow names must be distinct")

          source_commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          provenance = {
              "source_commit": source_commit,
              "workflow_path": str(workflow_path),
              "workflow_sha256": hashlib.sha256(workflow_path.read_bytes()).hexdigest(),
              "contract_path": str(contract_path),
              "contract_sha256": hashlib.sha256(contract_path.read_bytes()).hexdigest(),
          }
          evidence = {
              "schema": "musitu.axiom.recovery.ar02-provider-binding-preflight.v1",
              "status": "PASS_FAIL_CLOSED_PREFLIGHT",
              "operation": operation,
              "command": command,
              "environments": ["staging", "canary"],
              "production_denylist_clear": True,
              "unverified_provider_ids_rejected": True,
              "unsafe_provider_commands_rejected": True,
              "provider_mutation_enabled": False,
              "production_authority": False,
              "provider_readback": "NOT_PERFORMED_BY_PREFLIGHT",
              "timestamp_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "provenance": provenance,
          }
          canonical = json.dumps(evidence, sort_keys=True, separators=(",", ":")).encode()
          evidence["receipt_sha256"] = hashlib.sha256(canonical).hexdigest()
          receipt_path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          receipt_path.chmod(0o600)
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Collect redacted provider evidence with separated read-only identities
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AR02_READ_TOKEN: ${{ secrets.CLOUDFLARE_AR02_READ_TOKEN }}
          CLOUDFLARE_AR02_TOKEN_AUDITOR_TOKEN: ${{ secrets.CLOUDFLARE_AR02_TOKEN_AUDITOR_TOKEN }}
          CLOUDFLARE_AR02_INVENTORY_TOKEN_ID: ${{ secrets.CLOUDFLARE_AR02_INVENTORY_TOKEN_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_AR02_READ_TOKEN:-}"
          test -n "${CLOUDFLARE_AR02_TOKEN_AUDITOR_TOKEN:-}"
          test -n "${CLOUDFLARE_AR02_INVENTORY_TOKEN_ID:-}"
          test "$CLOUDFLARE_AR02_READ_TOKEN" != "$CLOUDFLARE_AR02_TOKEN_AUDITOR_TOKEN"

          preflight="$RUNNER_TEMP/ar02-provider-preflight.json"
          test -s "$preflight"
          python - "$preflight" <<'PY'
          import datetime
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys

          path = pathlib.Path(sys.argv[1])
          evidence = json.loads(path.read_text(encoding="utf-8"))
          receipt_hash = evidence.pop("receipt_sha256", "")
          canonical = json.dumps(evidence, sort_keys=True, separators=(",", ":")).encode()
          if hashlib.sha256(canonical).hexdigest() != receipt_hash:
              raise SystemExit("FAIL_CLOSED: preflight receipt hash mismatch")
          if evidence.get("status") != "PASS_FAIL_CLOSED_PREFLIGHT":
              raise SystemExit("FAIL_CLOSED: provider preflight did not pass")
          if evidence.get("operation") != "READ_ONLY_PROVIDER_INVENTORY":
              raise SystemExit("FAIL_CLOSED: provider operation changed after preflight")
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if evidence.get("provenance", {}).get("source_commit") != head:
              raise SystemExit("FAIL_CLOSED: preflight source commit does not match HEAD")
          issued = datetime.datetime.fromisoformat(evidence["timestamp_utc"])
          age = datetime.datetime.now(datetime.timezone.utc) - issued
          if age.total_seconds() < 0 or age.total_seconds() > 600:
              raise SystemExit("FAIL_CLOSED: preflight receipt is stale")
          PY

          out="$RUNNER_TEMP/ar02-provider-redacted.json"
          python recovery/ar02/provider_inventory_readonly.py \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --output "$out" >/dev/null
          python - "$out" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          evidence = json.loads(p.read_text())
          assert evidence["production_mutated"] is False
          assert evidence["billing_mutated"] is False
          assert evidence["provider_mutation_enabled"] is False
          assert evidence["http_methods_used"] == ["GET"]
          assert evidence["credential_scope_verifier_identity"] == "SEPARATE_AUDITOR"
          assert evidence["ar02_complete"] is False
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
          rm -f "$out" "$preflight"

      - name: Preserve claim boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'This workflow is S2 read-only evidence collection with separate inventory and token-policy-auditor identities.'
          echo 'Its fail-closed preflight requires distinct staging/canary non-production bindings and a fresh hashed provenance receipt before any provider read.'
          echo 'It does not create resources, rebind runtime, deploy staging/canary, mutate billing, or certify AR-02.'
