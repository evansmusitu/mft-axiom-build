name: MUSITU Axiom restricted Databricks service policy contract

on:
  push:
    branches:
      - pilot/axiom-databricks-pat-20261027
    paths:
      - "integrations/databricks/restricted_axiom_mcp_candidate.mjs"
      - "integrations/databricks/tests/restricted_axiom_mcp_candidate.test.mjs"
      - ".github/workflows/axiom-restricted-gateway-contract.yml"

permissions:
  contents: read

jobs:
  scoped-service-policy:
    name: Test staging-only credential and tool allowlist (no deployment)
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref == 'refs/heads/pilot/axiom-databricks-pat-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Syntax check the candidate and contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --check integrations/databricks/restricted_axiom_mcp_candidate.mjs
          node --check integrations/databricks/tests/restricted_axiom_mcp_candidate.test.mjs
      - name: Enforce token, native arguments and deny-by-default policy
        shell: bash
        run: |
          set -euo pipefail
          node --test integrations/databricks/tests/restricted_axiom_mcp_candidate.test.mjs
          echo 'MUSITU_AXIOM_DATABRICKS_SCOPED_GATE_CONTRACT_PASS'
