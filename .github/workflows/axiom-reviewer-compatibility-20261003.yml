name: MUSITU Axiom Reviewer Code Only Deployment 20261003
on:
  push:
    branches: [reviewer/mcp-compatibility-20261003]
    paths: [.github/workflows/axiom-reviewer-compatibility-20261003.yml]
permissions:
  contents: read
concurrency:
  group: musitu-axiom-mcp-code-only
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/reviewer/mcp-compatibility-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify and deploy only reviewed public MCP protocol changes
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import email.policy,email.parser,hashlib,json,os,pathlib,urllib.request,urllib.error
          out=pathlib.Path('evidence');out.mkdir(exist_ok=True)
          report={'worker':'musitu-axiom-mcp','mode':'READ_ONLY_PREFLIGHT','production_writes':0}
          def seal():
              out.joinpath('preflight.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          def stop(reason):
              report['status']='BLOCKED';report['reason']=reason;seal();raise SystemExit(reason)
          token=os.environ.get('CF_TOKEN','')
          if token:
              auth={'Authorization':'Bearer '+token};report['credential_method']='repository_api_token'
          elif os.environ.get('CF_EMAIL') and os.environ.get('CF_KEY'):
              auth={'X-Auth-Email':os.environ['CF_EMAIL'],'X-Auth-Key':os.environ['CF_KEY']};report['credential_method']='existing_repository_credential'
          else: stop('Repository Cloudflare credential unavailable')
          base='https://api.cloudflare.com/client/v4/accounts/93f395f5121954671f92fffa453d6b61/workers'
          def request(path):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path,headers=auth),timeout=30) as r:
                      return r.read(),dict(r.headers)
              except urllib.error.HTTPError as e: stop('Cloudflare read failed HTTP '+str(e.code))
              except Exception: stop('Cloudflare read transport failed')
          def cf(path):
              raw,_=request(path)
              try: obj=json.loads(raw)
              except Exception: stop('Invalid Cloudflare JSON response')
              if not obj.get('success'):stop('Cloudflare read success=false')
              return obj.get('result')
          settings=cf('/scripts/musitu-axiom-mcp/settings')
          script_settings=cf('/scripts/musitu-axiom-mcp/script-settings')
          report['settings_sha256']=hashlib.sha256(json.dumps(settings,sort_keys=True).encode()).hexdigest()
          report['script_settings_sha256']=hashlib.sha256(json.dumps(script_settings,sort_keys=True).encode()).hexdigest()
          bindings=settings.get('bindings',[])
          report['binding_metadata']=[{'name':b.get('name'),'type':b.get('type')} for b in bindings]
          if not any(b.get('name')=='MCP_CORE' and b.get('type')=='service' and b.get('service')=='musitu-axiom-mcp-core' for b in bindings):stop('MCP_CORE binding invariant failed')
          deployments=cf('/scripts/musitu-axiom-mcp/deployments')
          rows=deployments.get('deployments',[]) if isinstance(deployments,dict) else deployments
          if not rows:stop('No rollback deployment available')
          active=rows[0];versions=active.get('versions',[])
          if len(versions)!=1 or versions[0].get('percentage')!=100:stop('Active deployment is not one version at 100 percent')
          report['rollback_version_id']=versions[0]['version_id']
          report['active_deployment_id']=active.get('id')
          raw,headers=request('/scripts/musitu-axiom-mcp/content/v2')
          ctype=next((v for k,v in headers.items() if k.lower()=='content-type'),'')
          if 'multipart/' in ctype:
              message=email.parser.BytesParser(policy=email.policy.default).parsebytes(('Content-Type: '+ctype+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw)
              modules=[]
              for part in message.iter_parts():
                  data=part.get_payload(decode=True)
                  if data is None:stop('Non-binary source module')
                  modules.append({'name':part.get_filename() or part.get_param('name',header='content-disposition'),'bytes':data})
          else:modules=[{'name':'worker.js','bytes':raw}]
          report['modules']=[{'name':m['name'],'sha256':hashlib.sha256(m['bytes']).hexdigest(),'size':len(m['bytes'])} for m in modules]

          if len(modules)!=1 or report['modules'][0]['sha256']!='399ba37608c570f4fae94b22ed15adf3255b183d28810ae40308e9b905b2289a':stop('Live source changed since classified preflight')
          import subprocess,gzip,base64
          changes=[('const VERSION="4.0.0";\n', 'const VERSION="4.0.1";\nconst MODERN_PROTOCOL="2026-07-28";\nconst SERVER_INFO_KEY="io.modelcontextprotocol/serverInfo";\nconst PROTOCOL_META_KEY="io.modelcontextprotocol/protocolVersion";\nconst SERVER_INSTRUCTIONS="MUSITU Axiom provides quantitative finance, statistics, optimization, time-series, verification, and mathematical tools for users with an existing MUSITU Axiom account entitlement. It does not execute investment trades or money transfers. Use search and fetch to discover supported capabilities.";\n'), ('function html(', 'function serverMeta(){return{[SERVER_INFO_KEY]:{name:"musitu-axiom",version:VERSION}}}\nfunction isModern(req,m){return m?.method==="server/discover"||req.headers.get("mcp-protocol-version")===MODERN_PROTOCOL||m?.params?._meta?.[PROTOCOL_META_KEY]===MODERN_PROTOCOL}\nfunction discover(id){return response(200,{jsonrpc:"2.0",id,result:{resultType:"complete",supportedVersions:[MODERN_PROTOCOL],capabilities:{tools:{listChanged:false}},instructions:SERVER_INSTRUCTIONS,ttlMs:60000,cacheScope:"public",_meta:serverMeta()}})}\nasync function modernizeResponse(r,modern,cacheable=false){if(!modern)return r;const text=await r.text();let o;try{o=JSON.parse(text||"{}")}catch{return new Response(text,{status:r.status,headers:r.headers})}if(o?.result&&typeof o.result==="object"&&!Array.isArray(o.result)){const meta=o.result._meta&&typeof o.result._meta==="object"?o.result._meta:{};o.result.resultType=o.result.resultType||"complete";if(cacheable){o.result.ttlMs=Number.isInteger(o.result.ttlMs)?o.result.ttlMs:60000;o.result.cacheScope=o.result.cacheScope||"public"}o.result._meta={...meta,...serverMeta()}}return new Response(JSON.stringify(o),{status:r.status,headers:r.headers})}\nfunction html('), ('async function mcp(req,c){if(req.method!=="POST")return response(405,{error:"method_not_allowed"},{allow:"POST"});const raw=await req.text();let m;try{m=JSON.parse(raw)}catch{return response(200,{jsonrpc:"2.0",id:null,error:{code:-32700,message:"Parse error"}})}const id=m?.id??null;if(m?.method==="initialize")return response(200,{jsonrpc:"2.0",id,result:{protocolVersion:m?.params?.protocolVersion||"2025-06-18",capabilities:{tools:{listChanged:false}},serverInfo:{name:"musitu-axiom",version:VERSION},instructions:"MUSITU Axiom provides quantitative finance, statistics, optimization, time-series, verification, and mathematical tools for users with an existing MUSITU Axiom account entitlement. It does not execute investment trades or money transfers. Use search and fetch to discover supported capabilities."}});if(m?.method==="tools/list")return toolsList(c,id);if(m?.method==="tools/call"){const name=String(m?.params?.name||"");const args=m?.params?.arguments||{};if(HIDDEN.has(name))return response(200,{jsonrpc:"2.0",id,error:{code:-32601,message:"Tool not available on this plugin surface"}});if(name==="search")return publicSearch(c,id,args);if(name==="fetch")return publicFetch(c,id,args);if(name==="musitu_axiom_capabilities")return publicCapabilities(c,id);return forwardCall(req,c,raw,id)}const h=new Headers(req.headers);h.set("content-type","application/json");h.set("accept","application/json");h.set("user-agent","MUSITU-Axiom-Plugin-Gate/4.0");const r=await core(c,"/mcp","POST",h,raw);return new Response(r.body,{status:r.status,headers:r.headers})}\n', 'async function mcp(req,c){\n  if(req.method!=="POST")return response(405,{error:"method_not_allowed"},{allow:"POST"});\n  const raw=await req.text();let m;try{m=JSON.parse(raw)}catch{return response(200,{jsonrpc:"2.0",id:null,error:{code:-32700,message:"Parse error"}})}\n  const id=m?.id??null,modern=isModern(req,m);\n  if(m?.method==="server/discover")return discover(id);\n  if(m?.method==="initialize")return response(200,{jsonrpc:"2.0",id,result:{protocolVersion:m?.params?.protocolVersion||"2025-06-18",capabilities:{tools:{listChanged:false}},serverInfo:{name:"musitu-axiom",version:VERSION},instructions:SERVER_INSTRUCTIONS}});\n  if(m?.method==="tools/list")return modernizeResponse(await toolsList(c,id),modern,true);\n  if(m?.method==="tools/call"){\n    const name=String(m?.params?.name||""),args=m?.params?.arguments||{};let r;\n    if(HIDDEN.has(name))r=response(200,{jsonrpc:"2.0",id,error:{code:-32601,message:"Tool not available on this plugin surface"}});\n    else if(name==="search")r=await publicSearch(c,id,args);\n    else if(name==="fetch")r=await publicFetch(c,id,args);\n    else if(name==="musitu_axiom_capabilities")r=await publicCapabilities(c,id);\n    else r=await forwardCall(req,c,raw,id);\n    return modernizeResponse(r,modern,false);\n  }\n  const h=new Headers(req.headers);h.set("content-type","application/json");h.set("accept","application/json");h.set("user-agent","MUSITU-Axiom-Plugin-Gate/4.0");\n  const r=await core(c,"/mcp","POST",h,raw);return modernizeResponse(new Response(r.body,{status:r.status,headers:r.headers}),modern,false)\n}\n')]
          live=modules[0]['bytes'].decode()
          patched=live
          for old,new in changes:
              if patched.count(old)!=1:stop('Reviewed protocol patch anchor mismatch')
              patched=patched.replace(old,new,1)
          restored=patched
          for old,new in reversed(changes):
              if restored.count(new)!=1:stop('Protocol patch reverse anchor mismatch')
              restored=restored.replace(new,old,1)
          if restored!=live:stop('Non-protocol live bytes changed')
          report['live_pages_and_all_other_source_preserved']=True
          report['patched_source_sha256']=hashlib.sha256(patched.encode()).hexdigest()
          pathlib.Path('sealed_plugin_gate_v4_4.0.0.mjs').write_text(live)
          pathlib.Path('candidate_plugin_gate_v4_4.0.1.mjs').write_text(patched)
          pathlib.Path('test_plugin_gate_compatibility.mjs').write_bytes(gzip.decompress(base64.b64decode('')))
          pathlib.Path('ANONYMOUS_PUBLIC_TOOL_FIXTURE.json').write_bytes(gzip.decompress(base64.b64decode('')))
          if subprocess.run(['node','--check','candidate_plugin_gate_v4_4.0.1.mjs'],capture_output=True).returncode:stop('Patched live source syntax check failed')
          r=subprocess.run(['node','test_plugin_gate_compatibility.mjs'],capture_output=True)
          if r.returncode:stop('Patched live source compatibility checks failed')
          tests=json.loads(pathlib.Path('COMPATIBILITY_TEST_RESULTS.json').read_text())
          report['compatibility_checks']=tests
          report['source_baseline_match']='All protocol patch anchors exact; live support/policy changes preserved'
          report['mode']='AUTHORIZED_CODE_ONLY_DEPLOYMENT'
          if os.environ.get('CF_TOKEN','')=='':stop('API token required for production code-only update')
          if report['patched_source_sha256']!='48c87d308255a2c91fa4280ab007e743b8621174a8f9c10f7b25315895e054de':stop('Patched source hash invariant failed')
          def mutate(path,method,data,content_type):
              h=dict(auth);h['Content-Type']=content_type
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path,headers=h,data=data,method=method),timeout=45) as r:obj=json.load(r)
              except urllib.error.HTTPError as e:raise RuntimeError('Cloudflare code write HTTP '+str(e.code)) from None
              except Exception:raise RuntimeError('Cloudflare code write transport outcome uncertain') from None
              if not obj.get('success'):raise RuntimeError('Cloudflare code write success=false')
              return obj.get('result')
          def public(path,payload=None,headers=None):
              h={'Accept':'application/json, text/event-stream','User-Agent':'MUSITU-Axiom-Reviewer-Code-Only-Verification/1'};h.update(headers or {})
              data=None
              if payload is not None:h['Content-Type']='application/json';data=json.dumps(payload).encode()
              with urllib.request.urlopen(urllib.request.Request('https://mcp.mftintelligence.com'+path,headers=h,data=data),timeout=25) as r:return r.status,r.read()
          def rpc(method,params=None,modern=False):
              headers={'MCP-Protocol-Version':'2026-07-28','Mcp-Method':method} if modern else {}
              status,body=public('/mcp',{'jsonrpc':'2.0','id':'reviewer-verification','method':method,'params':params or {}},headers)
              if status!=200:raise RuntimeError('Public RPC HTTP invariant')
              return json.loads(body)
          page_paths=['/privacy','/terms','/support','/.well-known/openai-apps-challenge','/.well-known/oauth-protected-resource']
          pages={}
          for path in page_paths:
              try:status,body=public(path);pages[path]=(status,hashlib.sha256(body).hexdigest())
              except urllib.error.HTTPError as e:pages[path]=(e.code,hashlib.sha256(e.read()).hexdigest())
          before_registry=rpc('tools/list')['result']['tools']
          bd='axiom-reviewed-code-only-20261003'
          body=(f'--{bd}\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n'+json.dumps({'main_module':'index.mjs'})+f'\r\n--{bd}\r\nContent-Disposition: form-data; name="index.mjs"; filename="index.mjs"\r\nContent-Type: application/javascript+module\r\n\r\n').encode()+patched.encode()+f'\r\n--{bd}--\r\n'.encode()
          report['production_writes']=1;seal()
          try:
              mutate('/scripts/musitu-axiom-mcp/content','PUT',body,'multipart/form-data; boundary='+bd)
              after_settings=cf('/scripts/musitu-axiom-mcp/settings')
              after_script_settings=cf('/scripts/musitu-axiom-mcp/script-settings')
              if after_settings!=settings or after_script_settings!=script_settings:raise RuntimeError('Worker configuration readback differs')
              report['configuration_preserved']=True
              for path in page_paths:
                  try:status,body=public(path);after=(status,hashlib.sha256(body).hexdigest())
                  except urllib.error.HTTPError as e:after=(e.code,hashlib.sha256(e.read()).hexdigest())
                  if after!=pages[path]:raise RuntimeError('Public page or discovery metadata changed unexpectedly')
              report['policy_support_domain_challenge_oauth_metadata_preserved']=True
              initialized=rpc('initialize',{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'reviewer-verification','version':'1'}})['result']
              if initialized.get('serverInfo',{}).get('version')!='4.0.1':raise RuntimeError('Legacy server version readback failed')
              discovered=rpc('server/discover',modern=True)['result']
              if discovered.get('resultType')!='complete' or discovered.get('supportedVersions')!=['2026-07-28']:raise RuntimeError('Modern discovery contract failed')
              if discovered.get('cacheScope')!='public' or discovered.get('ttlMs')!=60000:raise RuntimeError('Modern discovery cache contract failed')
              legacy=rpc('tools/list')['result']
              modern=rpc('tools/list',modern=True)['result']
              if legacy['tools']!=before_registry or modern['tools']!=before_registry:raise RuntimeError('Live descriptors changed')
              if modern.get('resultType')!='complete' or modern.get('cacheScope')!='public' or modern.get('ttlMs')!=60000:raise RuntimeError('Modern list envelope failed')
              tools=modern['tools'];names={t['name'] for t in tools}
              ops={t.get('_meta',{}).get('musitu/operation') for t in tools}-{None}
              business=sum(t.get('_meta',{}).get('musitu/business_product') is True for t in tools)
              if (len(tools),len(ops),business)!=(108,74,30):raise RuntimeError('Registry counts changed')
              hidden={'musitu_axiom_plans','musitu_axiom_recommend_plan','musitu_axiom_start_checkout','musitu_axiom_checkout_status'}
              if names&hidden:raise RuntimeError('Commerce exposed')
              for name in hidden:
                  if rpc('tools/call',{'name':name,'arguments':{}},True).get('error',{}).get('code')!=-32601:raise RuntimeError('Hidden commerce invocation allowed')
              unauth=rpc('tools/call',{'name':'axiom_arithmetic_evaluate','arguments':{'args':{'expression':'40+2'}}},True)['result']
              if unauth.get('isError') is not True or unauth.get('structuredContent',{}).get('authenticated') is not False:raise RuntimeError('Unauthenticated execution boundary failed')
              report['post_deploy_checks']={'legacy_initialize':'PASS','modern_discover':'PASS','legacy_and_modern_exact_descriptor_preservation':'PASS','tool_count':len(tools),'operation_count':len(ops),'business_product_count':business,'commerce_tools_absent':'PASS','four_hidden_commerce_invocations_rejected':'PASS','unauthenticated_execution_blocked':'PASS'}
              deployments=cf('/scripts/musitu-axiom-mcp/deployments')
              rows=deployments.get('deployments',[]) if isinstance(deployments,dict) else deployments
              active=rows[0];report['new_deployment_id']=active.get('id');report['new_version_id']=active['versions'][0]['version_id']
              report['status']='DEPLOYED_PROTOCOL_CHECKS_PASS';seal()
          except Exception as error:
              report['post_deploy_failure']=str(error)
              rollback={'strategy':'percentage','versions':[{'version_id':report['rollback_version_id'],'percentage':100}]}
              try:
                  mutate('/scripts/musitu-axiom-mcp/deployments','POST',json.dumps(rollback).encode(),'application/json')
                  report['production_writes']+=1;report['rollback_status']='PASS';report['status']='ROLLED_BACK'
              except Exception as rollback_error:report['rollback_status']='UNVERIFIED';report['rollback_failure']=str(rollback_error);report['status']='DEPLOYMENT_FAILED_ROLLBACK_UNVERIFIED'
              seal();raise SystemExit(report['status'])
          print(json.dumps(report,sort_keys=True))
          PY
      - name: Report sanitized preflight evidence
        if: always()
        run: cat evidence/preflight.json
