name: Deploy verified Axiom reviewer gateway fixes
on:
  push:
    branches: [openai/reviewer-fixes-20261028]
    paths: [.github/workflows/axiom-reviewer-gateway-fix-20261028.yml]
permissions:
  contents: read
concurrency:
  group: musitu-axiom-public-plugin-cutover
  cancel-in-progress: false
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and verify contracts
        run: |
          python3 ops/build_axiom_operation_contracts.py
          python3 ops/bundle_axiom_plugin_gate.py
          git diff --exit-code -- mcp/operation_contracts.json mcp/musitu_axiom_plugin_gate_v4.mjs mcp/tests/fixtures/operation-examples.json
          node --check mcp/musitu_axiom_plugin_gate_v4.mjs
          node --test mcp/tests/plugin_gate.test.mjs
      - name: Deploy only after live source and settings guards pass
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 ops/deploy_axiom_reviewer_gateway.py --apply
