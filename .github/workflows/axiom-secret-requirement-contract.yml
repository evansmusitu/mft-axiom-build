name: MFT Axiom Secret Requirement Contract

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/axiom-secret-requirement-contract.yml'

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct encrypted source
        env:
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          P=deploy_payload/runtime_min
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > runtime.enc.b64
          base64 -d runtime.enc.b64 > runtime.tar.gz.enc
          test "$(sha256sum runtime.tar.gz.enc | awk '{print $1}')" = 'b82448d6b4b34b302748815af976b535d69922c197d4b7a9056fc2f91a9e12cf'
          python - <<'PY'
          import hashlib,hmac,os
          b=open('runtime.tar.gz.enc','rb').read()
          if not hmac.compare_digest(hmac.new(os.environ['CLOUDFLARE_GLOBAL_API_KEY'].encode(),b,hashlib.sha256).hexdigest(),'1a3193d4f3271d61d151e6ebd7cf4576d8ab86c2e79b84eff4ad0f635fe7ab47'):
              raise SystemExit('HMAC mismatch')
          PY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in runtime.tar.gz.enc -out runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          test "$(sha256sum runtime.tar.gz | awk '{print $1}')" = 'b4d5a0266446523969a619f5e9bb5a04d9b815c78a2ab82ed046ef5e23d53663'
          mkdir runtime && tar -xzf runtime.tar.gz -C runtime
      - name: Classify secret dependencies without source excerpts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('runtime')
          man=json.loads((root/'RUNTIME_SOURCE_MANIFEST.json').read_text())
          sources={}
          for f in man['files']:
              p=f['path']; q=root/p
              if p.startswith('worker/src/') and q.is_file() and q.suffix in {'.js','.mjs','.ts'}:
                  sources[p]=q.read_text(errors='replace')
          names=['MFT_CONTROL_SECRET','MFT_RECEIPT_SECRET','STRIPE_WEBHOOK_SECRET','STRIPE_PRICE_PLAN_MAP','AXIOM_DOWNGRADE_ON_CANCEL']
          out={}
          route_re=re.compile(r"['\"](/(?:health|mcp|v1/[A-Za-z0-9_{}:./-]+))['\"]")
          for name in names:
              rows=[]
              for p,t in sources.items():
                  for m in re.finditer(r'\benv\.'+re.escape(name)+r'\b',t):
                      lo=max(0,m.start()-1800); hi=min(len(t),m.end()+1800); w=t[lo:hi]
                      routes=sorted(set(route_re.findall(w)))
                      rows.append({
                        'path':p,
                        'routes_nearby':routes,
                        'missing_check_nearby':bool(re.search(r'!\s*env\.'+re.escape(name)+r'\b|env\.'+re.escape(name)+r'\s*(?:==={0,1}|!=={0,1})\s*(?:undefined|null|[\'\"]{2})',w)),
                        'fallback_operator_nearby':bool(re.search(r'env\.'+re.escape(name)+r'\s*(?:\?\?|\|\|)',w)),
                        'crypto_context_nearby':bool(re.search(r'(?i)hmac|sign|signature|digest|sha-?256|crypto\.subtle',w)),
                        'comparison_context_nearby':bool(re.search(r'===|!==|timing|constant.?time|safe.?equal',w)),
                      })
              out[name]={'occurrence_count':len(rows),'uses':rows}
          result={'schema':'mft.axiom.secret_requirement_contract.v1','source_build':man['source_build'],'requirements':out,'plaintext_source_committed':False}
          open('secret-requirement-contract.json','w').write(json.dumps(result,indent=2,sort_keys=True))
          print(json.dumps(result,sort_keys=True))
          PY
          sha256sum secret-requirement-contract.json > secret-requirement-contract.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mft-axiom-secret-requirement-contract
          path: |
            secret-requirement-contract.json
            secret-requirement-contract.sha256
          retention-days: 7
