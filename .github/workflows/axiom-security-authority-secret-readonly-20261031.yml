name: AXIOM Security Authority - Secret-backed Account Read-Only Audit
# Secret-bearing job is manual and main-only; an editable branch MUST NOT
# receive even the scoped staging read credential. The PR remains draft and
# no credentialed run is authorized until independently reviewed and merged.
on:
  pull_request:
    paths:
      - .github/workflows/axiom-security-authority-secret-readonly-20261031.yml
      - tests/security/test_security_authority_audit_workflow.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: axiom-security-authority-metadata-readonly
  cancel-in-progress: false
jobs:
  static-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout candidate (never persist credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify audit cannot expose secrets on an editable branch
        run: python3 -m unittest tests.security.test_security_authority_audit_workflow -v
  provider-account-readonly:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MUSITU_CF_STAGING_ACCOUNT_ID: ${{ secrets.MUSITU_CF_STAGING_ACCOUNT_ID }}
      MUSITU_CF_PRODUCTION_ACCOUNT_ID: ${{ secrets.MUSITU_CF_PRODUCTION_ACCOUNT_ID }}
      MUSITU_CF_STAGING_READ_TOKEN: ${{ secrets.MUSITU_CF_STAGING_READ_TOKEN }}
    steps:
      - name: Provider-origin account metadata read (GET only, no checkout)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,hashlib,json,os,re,sys,urllib.error,urllib.request
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          output={
            'schema':'musitu.axiom.security_authority.github_secret_readonly.v1',
            'observed_at':now,
            'source':'Cloudflare API GET under dedicated staging-read GitHub Actions secret',
            'http_methods':['GET'],
            'account_id_sha256':None,
            'production_account_distinct':False,
            'provider_token_active':False,
            'provider_account_metadata_observed':False,
            'operator_account_name_matched':False,
            'secret_value_exposed':False,
            'production_mutation':False,
            'staging_mutation':False,
            'independent_custody_certified':False,
            'operator_mfa_certified':False,
            'independent_b27_rollback_certified':False,
            'b27_historical_status':'FAILED_IN_SYNTHETIC_ATTACK',
            'release_authorized':False,
            'decision':'NOT_PROVEN',
            'blocker':'NOT_EXECUTED',
          }
          def finish(reason,ok=False):
            output['blocker']=reason
            output['decision']='ACCOUNT_METADATA_OBSERVED_ONLY_NOT_SECURITY_CERTIFIED' if ok else 'NOT_PROVEN'
            with open('security-authority-account-readonly.json','w') as f:
              json.dump(output,f,indent=2,sort_keys=True);f.write('\n')
            print('AXIOM_SECURITY_ACCOUNT_AUDIT='+output['decision']+' REASON='+reason)
            summary=os.environ.get('GITHUB_STEP_SUMMARY')
            if summary:
              with open(summary,'a') as f:
                f.write('Security Authority metadata read: '+output['decision']+'\n\n')
                f.write('Reason: '+reason+'\n\nNo independent MFA/custody, B27 or production release certification.\n')
            sys.exit(0 if ok else 2)
          account=os.environ.get('MUSITU_CF_STAGING_ACCOUNT_ID','').strip()
          token=os.environ.get('MUSITU_CF_STAGING_READ_TOKEN','').strip()
          production=os.environ.get('MUSITU_CF_PRODUCTION_ACCOUNT_ID','').strip()
          missing=[]
          if not re.fullmatch('[a-fA-F0-9]{32}',account):
            missing.append('MUSITU_CF_STAGING_ACCOUNT_ID')
          if not token:
            missing.append('MUSITU_CF_STAGING_READ_TOKEN')
          output['missing_required_secret_names']=missing
          output['production_account_secret_configured']=bool(production)
          if missing:
            finish('REQUIRED_STAGING_GITHUB_SECRETS_MISSING')
          output['account_id_sha256']=hashlib.sha256(account.lower().encode()).hexdigest()
          known_prod={'93f395f5121954671f92fffa453d6b61'}
          if production:
            if not re.fullmatch('[a-fA-F0-9]{32}',production):finish('PRODUCTION_ACCOUNT_ID_INVALID')
            known_prod.add(production.lower())
          if account.lower() in known_prod:
            finish('STAGING_IDENTICAL_TO_PRODUCTION')
          output['production_account_distinct']=True
          def get(path):
            req=urllib.request.Request(
              'https://api.cloudflare.com/client/v4'+path,
              headers={'Authorization':'Bearer '+token,'Accept':'application/json',
                       'User-Agent':'MUSITU-Axiom-Scoped-Staging-Read/1.0'},
              method='GET')
            try:
              with urllib.request.urlopen(req,timeout=12) as res:
                if res.status!=200:return None
                raw=res.read(32769)
                if len(raw)>32768:return None
                obj=json.loads(raw.decode('utf-8'))
                return obj if type(obj) is dict and obj.get('success') is True else None
            except (urllib.error.HTTPError,urllib.error.URLError,ValueError,TimeoutError):
              return None
          verified=get('/user/tokens/verify')
          if not verified or (verified.get('result') or {}).get('status')!='active':
            finish('SCOPED_TOKEN_PROVIDER_VERIFICATION_FAILED')
          output['provider_token_active']=True
          account_result=get('/accounts/'+account)
          data=account_result.get('result') if account_result else None
          if type(data) is not dict or str(data.get('id','')).lower()!=account.lower():
            finish('ACCOUNT_METADATA_GET_NOT_AUTHORIZED_OR_NOT_VERIFIED')
          output['provider_account_metadata_observed']=True
          if data.get('name')!='MUSITU AXIOM Security Authority':
            finish('SECURITY_AUTHORITY_ACCOUNT_NAME_NOT_MATCHED')
          output['operator_account_name_matched']=True
          finish('PROVIDER_METADATA_OBSERVED_EXTERNAL_SECURITY_GATES_STILL_BLOCKED',True)
          PY
      - name: Retain sanitized GET-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-security-authority-readonly-evidence
          path: security-authority-account-readonly.json
          if-no-files-found: warn
          retention-days: 3
