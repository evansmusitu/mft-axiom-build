name: MUSITU Axiom Service Binding Request Object Probe — QUARANTINED BY AR-02

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed at the AR-02 request-object probe boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'AR-02 QUARANTINE: the historical Request-object service-binding probe is disabled.'
          echo 'It previously used broad provider credentials and deployed a public temporary service-binding Worker.'
          echo 'No provider credential is loaded, no service binding is exercised remotely, and no Worker is deployed.'
          echo 'A replacement must run against isolated test resources with bounded non-production credentials.'
          exit 1
