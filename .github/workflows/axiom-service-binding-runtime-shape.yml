name: MUSITU Axiom Service Binding Runtime Shape — QUARANTINED BY AR-02

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed at the AR-02 diagnostic boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'AR-02 QUARANTINE: the historical service-binding runtime-shape probe is disabled.'
          echo 'No provider credentials are loaded, no public probe is deployed, and no workers.dev endpoint is created.'
          echo 'The prior implementation remains preserved in Git history at sealed main.'
          echo 'A replacement diagnostic must use isolated test resources and bounded non-production credentials.'
          exit 1
