name: AXIOM owner-approved exact staging config via existing global GitHub secrets (one-use)

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: musitu-axiom-exact-staging-config-global-ownerapproved-20261108
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == 'evansmusitu/mft-axiom-build' &&
      github.head_ref == 'build/axiom-stage-config-global-owner-20261108' &&
      github.base_ref == 'build/axiom-stage-config-ownerapproved-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fixed same-repository checkout, no persistent write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify immutable source and execute 10 negative/positive tests BEFORE secret access
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git hash-object customer_frontier/qualification/staging_override.py)" = '42f2f8196e80041235a9a03fd9bc9db1f4508c2d'
          test "$(git hash-object customer_frontier/qualification/test_staging_override.py)" = '18db97c49a7e79f462ef5f4c95be22974f3fad1f'
          python3 -m py_compile customer_frontier/qualification/staging_override.py customer_frontier/qualification/test_staging_override.py
          (cd customer_frontier/qualification && python3 -m unittest -v test_staging_override.py)
      - name: Exact original Cloudflare zone version-25 rollback check, provider dry run, single full-ruleset PUT
        id: apply
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -uo pipefail
          python3 customer_frontier/qualification/staging_override.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test -f axiom-staging-configuration-oneuse.json || exit 3
          exit 0
      - name: Retain immutable redacted provider receipt and SHA256 digest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-stage-global-auth-ownerapproved-config-oneuse-20261108
          path: |
            axiom-staging-configuration-oneuse.json
            axiom-staging-configuration-oneuse.json.sha256
          retention-days: 14
          if-no-files-found: warn
      - name: Fail closed on denial or ambiguous state; never retry writes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.apply.outputs.exit_code }}" = 0
