name: AXIOM historical staged canonical lineage aggregate only 20261110 (NO MUTATIONS)
on:
  push:
    branches: [review/axiom-stage-idp-canonical-aggregate-20261110]
    paths: [.github/workflows/axiom-stage-idp-canonical-aggregate-20261110.yml]
permissions: {contents: read}
concurrency:
  group: axiom-stage-idp-canonical-aggregate-20261110
  cancel-in-progress: false
jobs:
  read-current-aggregates:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.actor == 'evansmusitu' &&
      github.ref == 'refs/heads/review/axiom-stage-idp-canonical-aggregate-20261110' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Pin restricted count-only query source and offline tests before Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object customer_frontier/qualification/stage_canonical_aggregate_readonly.py)" = '4a5d364699317c715139e85559df7d02c7e061c1'
          test "$(git hash-object customer_frontier/tests/test_stage_canonical_aggregate_readonly.py)" = 'e222f603a3fc34a218a4252fac4f6fe0144e70e0'
          python3 -m py_compile customer_frontier/qualification/stage_canonical_aggregate_readonly.py customer_frontier/tests/test_stage_canonical_aggregate_readonly.py
          python3 -m unittest discover -s customer_frontier/tests -p test_stage_canonical_aggregate_readonly.py -v
      - name: Only 4 pinned SELECT count queries against already identified existing identity database
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          python3 customer_frontier/qualification/stage_canonical_aggregate_readonly.py
          code=$?
          test -s axiom-stage-canonical-aggregate-readonly.json || exit 4
          exit "$code"
      - name: Retain only sanitized aggregate counts and independent hash
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-staging-canonical-aggregate-readonly-20261110
          retention-days: 14
          if-no-files-found: warn
          path: |
            axiom-stage-canonical-aggregate-readonly.json
            axiom-stage-canonical-aggregate-readonly.json.sha256
