name: AXIOM staged Cloudflare secret metadata inspection (read only)

on:
  push:
    branches:
      - ops/axiom-staging-secret-presence-20261108
    paths:
      - .github/workflows/axiom-stage-secret-presence.yml

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.actor == 'evansmusitu' &&
      github.event.before == 'c3c5aaab90e94f1ca84ac9903f9d481c23c4f350'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report only GitHub secret availability and status; never print values
        env:
          CF_READER: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_CONFIG: ${{ secrets.CLOUDFLARE_STAGING_CONFIG_RULES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json
          a=os.environ.get('CF_READER','')
          b=os.environ.get('CF_CONFIG','')
          print(json.dumps({
              'schema':'AXIOM_STAGING_GITHUB_SECRET_PRESENT_ONLY',
              'read_token_present':bool(a),
              'new_config_token_present':bool(b),
              'new_config_token_distinct':bool(a and b and a!=b),
              'cloudflare_writes':0,
              'production_oauth_touched':False
          },sort_keys=True))
          PY
