name: AXIOM Step1 current canonical state aggregate 12 Nov (4 pinned SELECT counts ONLY)
on:
  push:
    branches:
      - review/axiom-step1-d1-origin-provider-audit-readonly-20261110
    paths:
      - .github/workflows/axiom-step1-current-canonical-aggregates-20261112.yml
permissions:
  contents: read
jobs:
  current-no-row-values:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.actor == 'evansmusitu' &&
      github.ref == 'refs/heads/review/axiom-step1-d1-origin-provider-audit-readonly-20261110' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin original allowed SELECT-only SQL and 5 hostile response regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object customer_frontier/qualification/stage_canonical_aggregate_readonly.py)" = "4a5d364699317c715139e85559df7d02c7e061c1"
          test "$(git hash-object customer_frontier/tests/test_stage_canonical_aggregate_readonly.py)" = "e222f603a3fc34a218a4252fac4f6fe0144e70e0"
          python3 -m unittest discover -s customer_frontier/tests -p test_stage_canonical_aggregate_readonly.py -v
      - name: Read only 4 pinned aggregate counts and foreign-key violation count in historical D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 customer_frontier/qualification/stage_canonical_aggregate_readonly.py
      - name: Retain count-only state without row values and SHA256 companion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-step1-current-canonical-counts-20261112
          retention-days: 10
          if-no-files-found: error
          path: |
            axiom-stage-canonical-aggregate-readonly.json
            axiom-stage-canonical-aggregate-readonly.json.sha256
