name: AXIOM D1 historical v1 creation audit (GET ONLY; NO RELEASE)
on:
  push:
    branches:
      - review/axiom-step1-d1-origin-provider-audit-readonly-20261110
    paths:
      - .github/workflows/axiom-step1-d1-legacy-v1-origin-20261110.yml
permissions:
  contents: read
jobs:
  scan:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.actor == 'evansmusitu' &&
      github.ref == 'refs/heads/review/axiom-step1-d1-origin-provider-audit-readonly-20261110' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin source and execute offline negative tests before secret use
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object customer_frontier/qualification/step1_legacy_v1_origin_readonly.py)" = "8d88e00c43fc3df0ffe18d9a40d1a3bd68387359"
          test "$(git hash-object customer_frontier/tests/test_step1_legacy_v1_origin_readonly.py)" = "d78bcb47a39f37223b80f87e7be16c667b629e92"
          python3 -m py_compile customer_frontier/qualification/step1_legacy_v1_origin_readonly.py
          python3 -m unittest discover -s customer_frontier/tests -p test_step1_legacy_v1_origin_readonly.py -v
      - name: Exact existing D1 historical v1 provider readback; no mutations
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 customer_frontier/qualification/step1_legacy_v1_origin_readonly.py
      - name: Retain only sanitized SHA-evidenced receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-stage-d1-legacy-v1-origin-readonly-20261110
          retention-days: 10
          if-no-files-found: warn
          path: |
            axiom_stage_d1_legacy_v1_origin_20261110.json
            axiom_stage_d1_legacy_v1_origin_20261110.json.sha256
