name: AXIOM D1 origin metadata and legacy v1 narrow probe (GET only; NO RELEASE)
on:
  push:
    branches:
      - review/axiom-step1-d1-origin-provider-audit-readonly-20261110
    paths:
      - .github/workflows/axiom-step1-d1-origin-metadata-legacy-20261110.yml
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.actor == 'evansmusitu'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Cloudflare D1 exact metadata and legacy audit availability (no writes)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import hashlib,json,os,urllib.error,urllib.parse,urllib.request
          ACCOUNT="93f395f5121954671f92fffa453d6b61"
          D1="ccc473f1-fbb5-4b8d-8a24-45f3696ac10f"
          NAME_SHA="7e98510fc457a669c29dd85ab1d87cc758fe0ba74d0833c20863b53d599b5b36"
          token=os.environ.get("CLOUDFLARE_API_TOKEN","")
          if not token or any(c in token for c in "\r\n"):raise SystemExit("CREDENTIAL_UNAVAILABLE")
          class NeverRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kw):return None
          opener=urllib.request.build_opener(NeverRedirect())
          root="https://api.cloudflare.com/client/v4/accounts/"+ACCOUNT
          def get(path):
              req=urllib.request.Request(root+path,method="GET",headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              try:
                  with opener.open(req,timeout=16) as response:
                      code=response.status;blob=response.read(5000001)
                      if len(blob)>5000000:raise ValueError("oversized")
                      return code,json.loads(blob)
              except urllib.error.HTTPError as exc:return exc.code,None
              except (OSError,ValueError):return "NETWORK_OR_SHAPE_ERROR",None
          r={"schema":"AXIOM_STEP1_D1_ORIGIN_METADATA_AND_LEGACY_AVAILABILITY_V1",
           "database_uuid":D1,"method":"GET_ONLY","metadata_status":None,"legacy_status":None,
           "created_at":None,"original_name_sha256_matches":False,"original_uuid_matches":False,
           "legacy_page_1_events":None,"legacy_count":None,"raw_legacy_retained":False,
           "customer_rows_read":0,"database_mutations":0,"historical_ownership_qualified":False,
           "current_backup_qualified":False,"independent_restore_qualified":False,
           "source_reuse_authorized":False,"step_2_authorized":False,
           "release_authority":False,"status":"NO_GO_INDEPENDENT_OWNER_CUSTODY_UNPROVEN"}
          code,payload=get("/d1/database/"+D1)
          r["metadata_status"]=code
          if code==200 and isinstance(payload,dict) and payload.get("success") is True and isinstance(payload.get("result"),dict):
              data=payload["result"]
              r["original_uuid_matches"]=data.get("uuid")==D1
              r["original_name_sha256_matches"]=hashlib.sha256(str(data.get("name","")).encode()).hexdigest()==NAME_SHA
              stamp=data.get("created_at")
              if isinstance(stamp,str):
                  try:
                      when=dt.datetime.fromisoformat(stamp.replace("Z","+00:00")).astimezone(dt.timezone.utc)
                      r["created_at"]=when.isoformat().replace("+00:00","Z")
                      start=(when-dt.timedelta(days=2)).date().isoformat()
                      end=(when+dt.timedelta(days=3)).date().isoformat()
                      query=urllib.parse.urlencode({"since":start,"before":end,"page":"1","per_page":"100","direction":"asc"})
                      lcode,logs=get("/audit_logs?"+query)
                      r["legacy_status"]=lcode
                      if lcode==200 and isinstance(logs,dict) and isinstance(logs.get("result"),list):
                          r["legacy_page_1_events"]=len(logs["result"])
                          info=logs.get("result_info") or {}
                          for k in ("total_count","total_pages"):
                              if type(info.get(k)) is int:r["legacy_"+k]=info[k]
                  except (ValueError,TypeError,OverflowError):
                      r["metadata_created_at_invalid"]=True
          data=(json.dumps(r,indent=2,sort_keys=True)+"\n").encode()
          name="axiom_step1_d1_origin_metadata_legacy_probe.json"
          open(name,"wb").write(data)
          open(name+".sha256","w").write(hashlib.sha256(data).hexdigest()+"  "+name+"\n")
          print("AXIOM_STEP1_D1_METADATA_AND_LEGACY_STATUS_ONLY_NO_GO")
          
          PY
      - name: Save narrow provider metadata and legacy status receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-step1-d1-origin-metadata-legacy-readonly-20261110
          retention-days: 5
          if-no-files-found: error
          path: |
            axiom_step1_d1_origin_metadata_legacy_probe.json
            axiom_step1_d1_origin_metadata_legacy_probe.json.sha256
