name: AXIOM Step1 synthetic encrypted export custody transport (OFFLINE; NOT RELEASE)
on:
  push:
    branches:
      - review/axiom-step1-d1-origin-provider-audit-readonly-20261110
    paths:
      - .github/workflows/axiom-step1-encrypted-transport-20261112.yml
permissions:
  contents: read
jobs:
  synthetic-aead:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.actor == 'evansmusitu' &&
      github.ref == 'refs/heads/review/axiom-step1-d1-origin-provider-audit-readonly-20261110' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact reviewed source and 18 hostile synthetic tests, no secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object customer_frontier/recovery/step1_encrypted_sql_export_transport.mjs)" = "7ee20964d812756b1dda7e91e02f55107e2e5739"
          test "$(git hash-object customer_frontier/tests/step1_encrypted_sql_export_transport.test.mjs)" = "ff3d74e3030ad04f5ad1b02016fcc8fb80128817"
          node --test customer_frontier/tests/step1_encrypted_sql_export_transport.test.mjs
      - name: Enforce no customer SQL export, provider call or backup artifacts
        shell: bash
        run: |
          echo "STEP1_SYNTHETIC_ENCRYPTION_ONLY"
          echo "NO_CLOUDFLARE_SECRETS_OR_EXPORT"
          echo "NO_INDEPENDENT_BACKUP_CUSTODY"
          echo "NO_RESTORE_TARGET_ADMITTED"
          echo "STEP1_NOT_CLOSED_STEP2_BLOCKED_NOT_RELEASE"
