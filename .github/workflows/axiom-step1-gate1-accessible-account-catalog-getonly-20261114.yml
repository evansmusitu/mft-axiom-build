name: AXIOM Gate1 accessible Cloudflare account count GET ONLY (NOT RELEASE)
on:
  push:
    branches:
      - review/axiom-step1-owner-sole-authority-policy-20261112-not-release
    paths:
      - customer_frontier/qualification/step1_gate1_accessible_accounts_readonly_20261114.py
      - customer_frontier/tests/test_step1_gate1_accessible_accounts_readonly_20261114.py
      - .github/workflows/axiom-step1-gate1-accessible-account-catalog-getonly-20261114.yml
permissions: {contents: read}
jobs:
  isolated-readonly:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.actor == 'evansmusitu' &&
      github.ref == 'refs/heads/review/axiom-step1-owner-sole-authority-policy-20261112-not-release' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Test metadata-only pagination, duplicate, redaction and NO_GO invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object customer_frontier/qualification/step1_gate1_accessible_accounts_readonly_20261114.py)" = '9d2613057ffb98a54df0485fa468cbb9211b7cec'
          test "$(git hash-object customer_frontier/tests/test_step1_gate1_accessible_accounts_readonly_20261114.py)" = '130b2bd88fa2b8743ad543289f8cb8888df0ee84'
          python3 -m unittest discover -s customer_frontier/tests -p test_step1_gate1_accessible_accounts_readonly_20261114.py -v
      - name: Authenticated GET-only Cloudflare account-list metadata; no other account reads
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 customer_frontier/qualification/step1_gate1_accessible_accounts_readonly_20261114.py
      - name: Preserve only sanitized count metadata and hash
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-step1-gate1-accessible-account-catalog-20261114
          retention-days: 10
          if-no-files-found: error
          path: |
            axiom_step1_gate1_accessible_accounts_readonly_20261114.json
            axiom_step1_gate1_accessible_accounts_readonly_20261114.json.sha256
