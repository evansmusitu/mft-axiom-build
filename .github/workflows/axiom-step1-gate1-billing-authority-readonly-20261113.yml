name: AXIOM Gate1 Cloudflare billing and authority GET only (NOT RELEASE)
on:
  push:
    branches:
      - review/axiom-step1-owner-sole-authority-policy-20261112-not-release
    paths:
      - customer_frontier/qualification/step1_gate1_billing_authority_readonly_20261113.py
      - customer_frontier/tests/test_step1_gate1_billing_authority_readonly_20261113.py
      - .github/workflows/axiom-step1-gate1-billing-authority-readonly-20261113.yml
permissions: {contents: read}
jobs:
  gate1-cloudflare-billing-probe:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.actor == 'evansmusitu' &&
      github.ref == 'refs/heads/review/axiom-step1-owner-sole-authority-policy-20261112-not-release' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout isolated draft without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Pin provider code and run 20 synthetic positive/negative tests BEFORE secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object customer_frontier/qualification/step1_gate1_billing_authority_readonly_20261113.py)" = '78c0029375da565aa510497ce67bd6964f792caf'
          test "$(git hash-object customer_frontier/tests/test_step1_gate1_billing_authority_readonly_20261113.py)" = '02338d0c2d8ce0db6baabc90d54b87083519c5c1'
          python3 -m unittest discover -s customer_frontier/tests -p test_step1_gate1_billing_authority_readonly_20261113.py -v
          echo 'AXIOM_GATE1_SYNTHETIC_20_CASES_PASS_NO_GO_NOT_RELEASE'
      - name: Exact-account Cloudflare billing metadata GET only; no invoices or secrets saved
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 customer_frontier/qualification/step1_gate1_billing_authority_readonly_20261113.py
      - name: Retain sanitized status booleans and integrity only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-step1-gate1-billing-authority-readonly-20261113
          retention-days: 10
          if-no-files-found: error
          path: |
            axiom_step1_gate1_billing_authority_readonly_20261113.json
            axiom_step1_gate1_billing_authority_readonly_20261113.json.sha256
