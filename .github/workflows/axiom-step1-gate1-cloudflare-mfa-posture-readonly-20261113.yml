name: AXIOM Gate1 Cloudflare MFA posture GET only (NOT RELEASE)
on:
  push:
    branches:
      - review/axiom-step1-owner-sole-authority-policy-20261112-not-release
    paths:
      - customer_frontier/qualification/step1_gate1_cloudflare_mfa_posture_readonly_20261113.py
      - customer_frontier/tests/test_step1_gate1_cloudflare_mfa_posture_readonly_20261113.py
      - .github/workflows/axiom-step1-gate1-cloudflare-mfa-posture-readonly-20261113.yml
permissions: {contents: read}
jobs:
  gate1-provider-mfa-posture:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.actor == 'evansmusitu' &&
      github.ref == 'refs/heads/review/axiom-step1-owner-sole-authority-policy-20261112-not-release' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Isolated checkout with no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Verify exact source and execute 17 offline adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object customer_frontier/qualification/step1_gate1_cloudflare_mfa_posture_readonly_20261113.py)" = '6206f05331b1fb93fef8623e94c87a079396810d'
          test "$(git hash-object customer_frontier/tests/test_step1_gate1_cloudflare_mfa_posture_readonly_20261113.py)" = '058c55e61eba67318e59f4772ab80104ae0eac45'
          python3 -m unittest discover -s customer_frontier/tests -p test_step1_gate1_cloudflare_mfa_posture_readonly_20261113.py -v
          echo 'AXIOM_GATE1_MFA_SYNTHETIC_17_DENIAL_PASS_NOT_RELEASE'
      - name: Exact-account GET-only MFA posture; sanitize names and email fields
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 customer_frontier/qualification/step1_gate1_cloudflare_mfa_posture_readonly_20261113.py
      - name: Archive only sanitized boolean counts and digest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-step1-gate1-cloudflare-mfa-readonly-20261113
          retention-days: 10
          if-no-files-found: error
          path: |
            axiom_step1_gate1_mfa_posture_readonly_20261113.json
            axiom_step1_gate1_mfa_posture_readonly_20261113.json.sha256
