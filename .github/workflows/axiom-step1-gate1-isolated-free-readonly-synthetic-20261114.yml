name: AXIOM Gate1 isolated Free account negative proofs SYNTHETIC ONLY (NOT RELEASE)
on:
  push:
    branches:
      - review/axiom-step1-owner-sole-authority-policy-20261112-not-release
    paths:
      - customer_frontier/qualification/step1_gate1_free_isolated_account_readonly_20261114.py
      - customer_frontier/tests/test_step1_gate1_free_isolated_account_readonly_20261114.py
      - .github/workflows/axiom-step1-gate1-isolated-free-readonly-synthetic-20261114.yml
permissions: {contents: read}
jobs:
  synthetic-no-go:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.ref == 'refs/heads/review/axiom-step1-owner-sole-authority-policy-20261112-not-release' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Synthetic metadata and veto tests (no secrets)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s customer_frontier/tests -p 'test_step1_gate1_free_isolated_account_readonly_20261114.py' -v
      - name: Missing owner account credentials MUST refuse and leave NO_GO receipt
        shell: bash
        run: |
          set -euo pipefail
          unset AXIOM_GATE1_OWNER_FREE_ACCOUNT_ID AXIOM_GATE1_OWNER_FREE_ACCOUNT_READ_TOKEN || true
          if python3 customer_frontier/qualification/step1_gate1_free_isolated_account_readonly_20261114.py; then
            echo 'ERROR: unexpected live account qualification'; exit 1
          fi
          python3 - <<'PY'
          import json
          f='axiom_step1_gate1_isolated_free_readonly_20261114.json'
          data=json.load(open(f))
          assert data['gate1_closed'] is False and data['release_status']=='NOT_RELEASE'
          assert data['status']=='ISOLATED_FREE_PROBE_PRECONDITION_NO_GO'
          print('AXIOM_GATE1_FREE_ISOLATED_SYNTHETIC_PASS_REAL_ACCOUNT_UNQUALIFIED_NOT_RELEASE')
          PY
