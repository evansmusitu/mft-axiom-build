name: AXIOM Step1 local fail-closed SQL restore hardening (synthetic only; NO RELEASE)
on:
  push:
    branches:
      - review/axiom-step1-d1-origin-provider-audit-readonly-20261110
    paths:
      - .github/workflows/axiom-step1-offline-restore-regression-20261112.yml
permissions:
  contents: read
jobs:
  local-no-customer-data:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.actor == 'evansmusitu' &&
      github.ref == 'refs/heads/review/axiom-step1-d1-origin-provider-audit-readonly-20261110' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin exact offline restore source and seven adversarial recovery tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object customer_frontier/recovery/restore_sql_private.py)" = "64af413594ccffc8642526f31ec3dfd124be03fe"
          test "$(git hash-object customer_frontier/tests/test_existing_d1_private_restore.py)" = "15c5c4cdc136c5eee31eec949e87cd81f92f2595"
          python3 -m unittest discover -s customer_frontier/tests -p test_existing_d1_private_restore.py -v
      - name: Confirm no customer backup, credential, or hosted target ever used
        shell: bash
        run: |
          echo "SYNTHETIC_ONLY: no current customer D1 export, no target admitted, no Cloudflare token"
          echo "SOURCE_DB_UNMODIFIED, OWNER_CUSTODIAN_ATTESTATION_REQUIRED, NOT_RELEASE"
