name: AXIOM Step1 source D1 current bookmark GET-only (NOT RELEASE)
on:
  push:
    branches:
      - review/axiom-step1-owner-sole-authority-policy-20261112-not-release
    paths:
      - .github/workflows/axiom-step1-owner-source-bookmark-getonly-20261112.yml
      - customer_frontier/qualification/step1_owner_bookmark_readonly.py
      - customer_frontier/tests/test_step1_owner_bookmark_readonly.py
permissions: { contents: read }
jobs:
  owner-step1-bookmark:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.actor == 'evansmusitu' &&
      github.ref == 'refs/heads/review/axiom-step1-owner-sole-authority-policy-20261112-not-release' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout isolated review branch without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - name: Verify bookmark parser and provider scope (synthetic)
        run: python3 -m unittest discover -s customer_frontier/tests -p test_step1_owner_bookmark_readonly.py -v
      - name: Read exact current source D1 metadata and bookmark ONLY (no raw bookmark output)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 customer_frontier/qualification/step1_owner_bookmark_readonly.py
      - name: Store sanitized evidence and SHA-256 only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-step1-owner-source-bookmark-20261112
          retention-days: 10
          if-no-files-found: warn
          path: |
            axiom_step1_owner_bookmark_readonly_20261112.json
            axiom_step1_owner_bookmark_readonly_20261112.json.sha256
