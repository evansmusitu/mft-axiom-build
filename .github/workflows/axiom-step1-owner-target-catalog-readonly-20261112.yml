name: AXIOM Step1 owner-only D1 target catalog GET-only (NOT RELEASE)
on:
  push:
    branches:
      - review/axiom-step1-owner-sole-authority-policy-20261112-not-release
    paths:
      - .github/workflows/axiom-step1-owner-target-catalog-readonly-20261112.yml
      - customer_frontier/qualification/step1_owner_target_catalog_readonly.py
      - customer_frontier/tests/test_step1_owner_target_catalog_readonly.py
permissions:
  contents: read
jobs:
  owner-step1-target-inventory:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.actor == 'evansmusitu' &&
      github.ref == 'refs/heads/review/axiom-step1-owner-sole-authority-policy-20261112-not-release' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out isolated draft only (no persisted write credential)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run synthetic fail-closed target inventory tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s customer_frontier/tests -p test_step1_owner_target_catalog_readonly.py -v
      - name: Observe complete Cloudflare D1 catalog only via GET and issue NO_GO evidence
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 customer_frontier/qualification/step1_owner_target_catalog_readonly.py
      - name: Preserve sanitized evidence and SHA256, no SQL, no tokens, no customer data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-step1-owner-target-catalog-20261112
          retention-days: 10
          if-no-files-found: warn
          path: |
            axiom_step1_owner_target_catalog_readonly_20261112.json
            axiom_step1_owner_target_catalog_readonly_20261112.json.sha256
