name: AXIOM production OAuth separate restore target (NOT RELEASE)
on:
  push:
    branches:
      - review/axiom-step1-owner-sole-authority-policy-20261112-not-release
    paths:
      - .github/workflows/axiom-step2-create-oauth-restore-target-20261114.yml
      - customer_frontier/recovery/step2_create_oauth_restore_target_20261114.mjs
      - customer_frontier/tests/step2_create_oauth_restore_target_20261114.test.mjs
      - customer_frontier/evidence/hosted_recovery_20261114/native_batch_qualified_20261114.json
permissions: {contents: read}
concurrency:
  group: axiom-hosted-recovery-67469478aa9349fa0a57fe3a72da200a
  cancel-in-progress: false
jobs:
  create-separate-oauth-target:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.actor == 'evansmusitu' &&
      github.ref == 'refs/heads/review/axiom-step1-owner-sole-authority-policy-20261112-not-release' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Verify isolated creation scope and actual native witness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object customer_frontier/recovery/step2_create_oauth_restore_target_20261114.mjs)" = 'ef711cf6c71803466d49f212257fe6bc02b274fd'
          test "$(git hash-object customer_frontier/tests/step2_create_oauth_restore_target_20261114.test.mjs)" = '13c6a0576ab30e3a43cd7a905a27aa538f8f4787'
          test "$(git hash-object customer_frontier/evidence/hosted_recovery_20261114/native_batch_qualified_20261114.json)" = '1238402c24e39e133405894c64c83d9e28b32b22'
          test "$(git hash-object customer_frontier/recovery/step2_create_restore_target_20261114.mjs)" = 'c312e02b358f28bb7a880c5ac17a40c8581c76bb'
          test "$(git hash-object customer_frontier/recovery/step2_hosted_restore_20261114.mjs)" = '371efc17a4c881ac06bc874f7640206c0f6064b9'
          test "$(git hash-object customer_frontier/recovery/step1_encrypted_sql_export_transport.mjs)" = 'b4d0f65cdcf22083d252107f7d324ee4a3bbd3dd'
          test "$(git hash-object customer_frontier/qualification/step1_gate1_free_isolated_account_readonly_20261114.mjs)" = '32b9bd3ec61657cd0bd9a0e784f3e23d8430e490'
          node --test customer_frontier/tests/step2_create_oauth_restore_target_20261114.test.mjs
      - name: Create one empty OAuth rehearsal D1 in the isolated Free account
        shell: bash
        env:
          AXIOM_D1_RECOVERY_CF_API_TOKEN: ${{ secrets.AXIOM_D1_RECOVERY_CF_API_TOKEN }}
        run: |
          set -euo pipefail
          ulimit -c 0
          node customer_frontier/recovery/step2_create_oauth_restore_target_20261114.mjs
      - name: Preserve sanitized creation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-oauth-separate-restore-target-20261114
          retention-days: 10
          if-no-files-found: error
          path: |
            oauth_restore_target_20261114.json
            oauth_restore_target_20261114.json.sha256
