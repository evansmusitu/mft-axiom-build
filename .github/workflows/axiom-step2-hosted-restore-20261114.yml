name: AXIOM hosted encrypted current backup restore parity rollback (NOT RELEASE)
on:
  push:
    branches:
      - review/axiom-step1-owner-sole-authority-policy-20261112-not-release
    paths:
      - .github/workflows/axiom-step2-hosted-restore-20261114.yml
      - customer_frontier/recovery/step2_hosted_restore_20261114.mjs
      - customer_frontier/recovery/step2_sql_memory_fingerprint_20261114.py
      - customer_frontier/tests/step2_hosted_restore_20261114.test.mjs
      - customer_frontier/tests/test_step2_sql_memory_fingerprint_20261114.py
permissions: {contents: read}
concurrency:
  group: axiom-hosted-recovery-67469478aa9349fa0a57fe3a72da200a
  cancel-in-progress: false
jobs:
  hosted-recovery:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.actor == 'evansmusitu' &&
      github.ref == 'refs/heads/review/axiom-step1-owner-sole-authority-policy-20261112-not-release' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Pin every credentialed dependency and test recovery failures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object customer_frontier/recovery/step2_hosted_restore_20261114.mjs)" = '371efc17a4c881ac06bc874f7640206c0f6064b9'
          test "$(git hash-object customer_frontier/recovery/step2_sql_memory_fingerprint_20261114.py)" = '4b9cc07c868a232c017fa0d025e836b38bb0398e'
          test "$(git hash-object customer_frontier/tests/step2_hosted_restore_20261114.test.mjs)" = 'c952cc7f5c75bf048e30541d0a1a8a94ef5134e2'
          test "$(git hash-object customer_frontier/tests/test_step2_sql_memory_fingerprint_20261114.py)" = 'e7482bb9999a29c0f16d54cd737e93bed6ea31bb'
          test "$(git hash-object customer_frontier/recovery/step2_create_restore_target_20261114.mjs)" = 'c312e02b358f28bb7a880c5ac17a40c8581c76bb'
          test "$(git hash-object customer_frontier/qualification/step1_gate1_free_isolated_account_readonly_20261114.mjs)" = '32b9bd3ec61657cd0bd9a0e784f3e23d8430e490'
          test "$(git hash-object customer_frontier/recovery/step1_encrypted_sql_export_transport.mjs)" = 'b4d0f65cdcf22083d252107f7d324ee4a3bbd3dd'
          test "$(git hash-object customer_frontier/tests/step2_create_restore_target_20261114.test.mjs)" = '15d13bfed67c395d618576861a94d5173b8f3498'
          test "$(git hash-object customer_frontier/tests/step1_gate1_free_isolated_account_readonly_20261114.test.mjs)" = '8e4509df2dfbb9388c9e8e7a5916d892967c0e83'
          test "$(git hash-object customer_frontier/tests/step1_encrypted_sql_export_transport.test.mjs)" = 'ff3d74e3030ad04f5ad1b02016fcc8fb80128817'
          test "$(git hash-object customer_frontier/evidence/hosted_recovery_20261114/import_completed_fk_check_stopped.json)" = '615999040f031ed67d72cda82b46245cd777ec69'
          node --test customer_frontier/tests/step2_hosted_restore_20261114.test.mjs customer_frontier/tests/step2_create_restore_target_20261114.test.mjs customer_frontier/tests/step1_gate1_free_isolated_account_readonly_20261114.test.mjs customer_frontier/tests/step1_encrypted_sql_export_transport.test.mjs
          python3 -m unittest discover -s customer_frontier/tests -p test_step2_sql_memory_fingerprint_20261114.py -v
      - name: Encrypted current source backup and exact disposable target restore qualification
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AXIOM_D1_RECOVERY_CF_API_TOKEN: ${{ secrets.AXIOM_D1_RECOVERY_CF_API_TOKEN }}
        run: |
          set -euo pipefail
          ulimit -c 0
          node customer_frontier/recovery/step2_hosted_restore_20261114.mjs --verify-imported
      - name: Preserve encrypted backup and sanitized parity evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-hosted-restore-parity-20261114
          retention-days: 10
          if-no-files-found: error
          path: |
            hosted_restore_parity_20261114.json
            hosted_restore_parity_20261114.json.sha256
            owner_encrypted_current_d1_20261114.json
            owner_encrypted_current_d1_20261114.json.sha256
