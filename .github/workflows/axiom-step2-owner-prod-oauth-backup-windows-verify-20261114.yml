name: AXIOM production OAuth Windows backup verifier safety (NOT RELEASE)
on:
  push:
    branches:
      - review/axiom-step1-owner-sole-authority-policy-20261112-not-release
    paths:
      - .github/workflows/axiom-step2-owner-prod-oauth-backup-windows-verify-20261114.yml
      - customer_frontier/recovery/Run_MUSITU_AXIOM_Verify_Production_OAuth_Backup.ps1
      - customer_frontier/recovery/step2_owner_verify_prod_oauth_backup_20261114.mjs
      - customer_frontier/tests/step2_owner_verify_prod_oauth_backup_20261114.test.mjs
      - customer_frontier/tests/step2_prod_oauth_backup_windows_fixture_20261114.mjs
      - customer_frontier/tests/test_step2_prod_oauth_backup_windows_transport_20261114.ps1
permissions: {contents: read}
jobs:
  windows-verifier-synthetic-safety:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.actor == 'evansmusitu' &&
      github.ref == 'refs/heads/review/axiom-step1-owner-sole-authority-policy-20261112-not-release'
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Pin code and verify synthetic authenticated decryption
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git hash-object customer_frontier/recovery/Run_MUSITU_AXIOM_Verify_Production_OAuth_Backup.ps1) -cne '87b6bf3ed6f427fba46b11c2c1076867bfef2316') { throw 'SOURCE_PIN_MISMATCH' }
          if ((git hash-object customer_frontier/recovery/step2_owner_verify_prod_oauth_backup_20261114.mjs) -cne '05337742896ee163920f63c462a7ed7f7f34bbab') { throw 'SOURCE_PIN_MISMATCH' }
          if ((git hash-object customer_frontier/recovery/step2_prod_oauth_encrypted_sql_transport_20261114.mjs) -cne '63e26bfe918c14f91d32c040711dad923417421e') { throw 'SOURCE_PIN_MISMATCH' }
          if ((git hash-object customer_frontier/tests/step2_owner_verify_prod_oauth_backup_20261114.test.mjs) -cne '1d52d4f7146fabb08c796d65ac62196cfac5e49e') { throw 'SOURCE_PIN_MISMATCH' }
          if ((git hash-object customer_frontier/tests/step2_prod_oauth_encrypted_sql_transport_20261114.test.mjs) -cne '7a4e55456936033a7cc9125db48eae5b473f0b38') { throw 'SOURCE_PIN_MISMATCH' }
          if ((git hash-object customer_frontier/tests/step2_prod_oauth_backup_windows_fixture_20261114.mjs) -cne '6f9fdf7b2b1b1366ccb0062629a03c43206fd806') { throw 'SOURCE_PIN_MISMATCH' }
          if ((git hash-object customer_frontier/tests/test_step2_prod_oauth_backup_windows_transport_20261114.ps1) -cne 'cd00689e5eb9a2bddc9992fae8afca0cbfd7b5a1') { throw 'SOURCE_PIN_MISMATCH' }
          node --test customer_frontier/tests/step2_owner_verify_prod_oauth_backup_20261114.test.mjs customer_frontier/tests/step2_prod_oauth_encrypted_sql_transport_20261114.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'SYNTHETIC_CRYPTO_CHECK_FAILED' }
      - name: Windows PowerShell 5.1 actual shared transport and encrypted PEM roundtrip
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\customer_frontier\tests\test_step2_prod_oauth_backup_windows_transport_20261114.ps1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_PIPE_ROUNDTRIP_FAILED' }
      - name: PowerShell 7 actual shared transport and encrypted PEM roundtrip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\customer_frontier\tests\test_step2_prod_oauth_backup_windows_transport_20261114.ps1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_PIPE_ROUNDTRIP_FAILED' }
      - name: Require owner script refusal in cloud CI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $script = Join-Path $PWD 'customer_frontier/recovery/Run_MUSITU_AXIOM_Verify_Production_OAuth_Backup.ps1'
          foreach ($engineName in @('powershell.exe','pwsh.exe')) {
              $engine = (Get-Command $engineName -CommandType Application).Source
              & $engine -NoProfile -NonInteractive -File $script 2>&1 | Out-String | Write-Host
              $denialExit = $LASTEXITCODE
              if ($denialExit -ne 2) { throw 'CLOUD_REFUSAL_REQUIRED' }
          }
          $ErrorActionPreference = 'Stop'
          if (Test-Path (Join-Path (Split-Path $script) 'OWNER_PROD_OAUTH_BACKUP_DECRYPTION_PROOF.json')) { throw 'CLOUD_PROOF_FORBIDDEN' }
          if (Test-Path (Join-Path (Split-Path $script) 'OWNER_PROD_OAUTH_BACKUP_DIAGNOSTIC.json')) { throw 'CLOUD_OWNER_DIAGNOSTIC_FORBIDDEN' }
          Write-Host 'CLOUD_REFUSAL_PASS_NOT_OWNER_EXECUTION'
          exit 0
      - name: Record native Windows synthetic qualification boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version51 = (& powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' | Out-String).Trim()
          $receipt = [ordered]@{
              schema = 'musitu.axiom.production-oauth-windows-verifier-ci.v1'
              status = 'WINDOWS_PRODUCTION_OAUTH_VERIFIER_SYNTHETIC_TRANSPORT_PASS'
              observed_at_utc = [DateTime]::UtcNow.ToString('o')
              github_head_sha = $env:GITHUB_SHA
              powershell_51_version = $version51
              powershell_7_version = $PSVersionTable.PSVersion.ToString()
              synthetic_node_tests_passed = 27
              large_synthetic_sql_bytes_minimum = 2666698
              unicode_passphrase_and_spaced_path_passed = $true
              wrong_password_refused = $true
              timeout_and_cleanup_passed = $true
              owner_cli_refused_in_cloud = $true
              actual_owner_production_backup_decryption_qualified = $false
              provider_operations = 0
              release_status = 'NOT_RELEASE'
          } | ConvertTo-Json
          $file = Join-Path $PWD 'prod_oauth_windows_verifier_ci_20261114.json'
          [IO.File]::WriteAllText($file, $receipt, (New-Object Text.UTF8Encoding($false)))
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(($file + '.sha256'), ($hash + '  prod_oauth_windows_verifier_ci_20261114.json'), (New-Object Text.UTF8Encoding($false)))
      - name: Retain sanitized native Windows qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-prod-oauth-native-windows-verifier-20261114
          retention-days: 10
          if-no-files-found: error
          path: |
            prod_oauth_windows_verifier_ci_20261114.json
            prod_oauth_windows_verifier_ci_20261114.json.sha256
