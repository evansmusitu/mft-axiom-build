name: AXIOM production OAuth backup and isolated restore (NOT RELEASE)
on:
  push:
    branches:
      - review/axiom-step1-owner-sole-authority-policy-20261112-not-release
    paths:
      - .github/workflows/axiom-step2-prod-oauth-hosted-restore-20261114.yml
      - customer_frontier/recovery/step2_prod_oauth_hosted_restore_20261114.mjs
      - customer_frontier/recovery/step2_prod_oauth_encrypted_sql_transport_20261114.mjs
      - customer_frontier/tests/step2_prod_oauth_hosted_restore_20261114.test.mjs
      - customer_frontier/tests/step2_prod_oauth_encrypted_sql_transport_20261114.test.mjs
permissions: {contents: read}
concurrency:
  group: axiom-hosted-recovery-67469478aa9349fa0a57fe3a72da200a
  cancel-in-progress: false
jobs:
  restore-production-oauth-copy:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.actor == 'evansmusitu' &&
      github.ref == 'refs/heads/review/axiom-step1-owner-sole-authority-policy-20261112-not-release' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Pin the production source, new target, owner recipient and recovery helpers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object customer_frontier/recovery/step2_prod_oauth_encrypted_sql_transport_20261114.mjs)" = '63e26bfe918c14f91d32c040711dad923417421e'
          test "$(git hash-object customer_frontier/recovery/step2_prod_oauth_hosted_restore_20261114.mjs)" = '0067615ae81c3cdd6c768ca9709cc0c98d2bbc85'
          test "$(git hash-object customer_frontier/tests/step2_prod_oauth_encrypted_sql_transport_20261114.test.mjs)" = '7a4e55456936033a7cc9125db48eae5b473f0b38'
          test "$(git hash-object customer_frontier/tests/step2_prod_oauth_hosted_restore_20261114.test.mjs)" = '9b370e0a66b5cbce93ad8d965d6be704a6db4532'
          test "$(git hash-object customer_frontier/evidence/hosted_recovery_20261114/oauth_restore_target_created_20261114.json)" = 'da4aff3fa7a6465d1b05eb279473cf6502aefb2a'
          test "$(git hash-object customer_frontier/recovery/step2_create_oauth_restore_target_20261114.mjs)" = 'ef711cf6c71803466d49f212257fe6bc02b274fd'
          test "$(git hash-object customer_frontier/recovery/step2_create_restore_target_20261114.mjs)" = 'c312e02b358f28bb7a880c5ac17a40c8581c76bb'
          test "$(git hash-object customer_frontier/recovery/step2_hosted_restore_20261114.mjs)" = '371efc17a4c881ac06bc874f7640206c0f6064b9'
          test "$(git hash-object customer_frontier/recovery/step1_encrypted_sql_export_transport.mjs)" = 'b4d0f65cdcf22083d252107f7d324ee4a3bbd3dd'
          test "$(git hash-object customer_frontier/recovery/step2_sql_memory_fingerprint_20261114.py)" = '4b9cc07c868a232c017fa0d025e836b38bb0398e'
          test "$(git hash-object customer_frontier/qualification/step1_gate1_free_isolated_account_readonly_20261114.mjs)" = '32b9bd3ec61657cd0bd9a0e784f3e23d8430e490'
          node --test customer_frontier/tests/step2_prod_oauth_encrypted_sql_transport_20261114.test.mjs customer_frontier/tests/step2_prod_oauth_hosted_restore_20261114.test.mjs
      - name: Seal current production export and restore only to the new disposable OAuth D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AXIOM_D1_RECOVERY_CF_API_TOKEN: ${{ secrets.AXIOM_D1_RECOVERY_CF_API_TOKEN }}
        run: |
          set -euo pipefail
          ulimit -c 0
          node customer_frontier/recovery/step2_prod_oauth_hosted_restore_20261114.mjs
      - name: Preserve only owner-encrypted SQL and sanitized parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-prod-oauth-current-backup-and-hosted-restore-20261114
          retention-days: 10
          if-no-files-found: error
          path: |
            prod_oauth_hosted_restore_parity_20261114.json
            prod_oauth_hosted_restore_parity_20261114.json.sha256
            owner_encrypted_current_prod_oauth_20261114.json
            owner_encrypted_current_prod_oauth_20261114.json.sha256
