name: AXIOM recovered D1 tenant boundary qualification (NOT RELEASE)
on:
  push:
    branches:
      - review/axiom-step1-owner-sole-authority-policy-20261112-not-release
    paths:
      - .github/workflows/axiom-step2-recovered-tenant-qualification-20261114.yml
      - customer_frontier/recovery/step2_recovered_tenant_qualification_20261114.mjs
      - customer_frontier/tests/step2_recovered_tenant_qualification_20261114.test.mjs
permissions: {contents: read}
concurrency:
  group: axiom-hosted-recovery-67469478aa9349fa0a57fe3a72da200a
  cancel-in-progress: false
jobs:
  recovered-tenant-boundaries:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.actor == 'evansmusitu' &&
      github.ref == 'refs/heads/review/axiom-step1-owner-sole-authority-policy-20261112-not-release' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Pin the unchanged application seam and every credentialed dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object customer_frontier/recovery/step2_recovered_tenant_qualification_20261114.mjs)" = '5c2a53411b16304458324c1e3df5bd9ff51a0235'
          test "$(git hash-object customer_frontier/tests/step2_recovered_tenant_qualification_20261114.test.mjs)" = '44fe83b36f7b5f915a53f60b104bfd104de19de7'
          test "$(git hash-object customer_frontier/recovery/step2_hosted_restore_20261114.mjs)" = '371efc17a4c881ac06bc874f7640206c0f6064b9'
          test "$(git hash-object customer_frontier/recovery/step2_create_restore_target_20261114.mjs)" = 'c312e02b358f28bb7a880c5ac17a40c8581c76bb'
          test "$(git hash-object customer_frontier/recovery/step1_encrypted_sql_export_transport.mjs)" = 'b4d0f65cdcf22083d252107f7d324ee4a3bbd3dd'
          test "$(git hash-object customer_frontier/recovery/step2_sql_memory_fingerprint_20261114.py)" = '4b9cc07c868a232c017fa0d025e836b38bb0398e'
          test "$(git hash-object customer_frontier/qualification/step1_gate1_free_isolated_account_readonly_20261114.mjs)" = '32b9bd3ec61657cd0bd9a0e784f3e23d8430e490'
          test "$(git hash-object customer_frontier/customer_control_plane/canonical_identity.mjs)" = '01f1592859404242220120f02b4bcc9f445a6182'
          test "$(git hash-object customer_frontier/customer_control_plane/identity_session.mjs)" = '727a4c24810e56b8a771e0aaeaa7c70673c2194e'
          test "$(git hash-object customer_frontier/customer_control_plane/ledger.mjs)" = 'a9d3abf9bbe637e09ee9b76ce164c55c2bd8b822'
          test "$(git hash-object customer_frontier/customer_control_plane/schema.sql)" = '274446b98fbea044aeb6ae835758777e76a10adc'
          test "$(git hash-object auth/keyless_customer_link_candidate.mjs)" = 'd9ec25e012a00fd0627981088cd1a1fb6af64d6f'
          test "$(git hash-object customer_frontier/evidence/hosted_recovery_20261114/hosted_restore_parity_rollback_passed.json)" = 'b7c0737f500f978cd110116c85af3f2822f2e19f'
          test "$(git hash-object customer_frontier/evidence/hosted_recovery_20261114/owner_submitted_decryption_proof_20261114.json)" = '9067be7db011d88529f9cc9862090903cd8ba248'
          node --test customer_frontier/tests/step2_recovered_tenant_qualification_20261114.test.mjs
      - name: Test only synthetic principals on the exact recovered target and restore its baseline
        shell: bash
        env:
          AXIOM_D1_RECOVERY_CF_API_TOKEN: ${{ secrets.AXIOM_D1_RECOVERY_CF_API_TOKEN }}
        run: |
          set -euo pipefail
          ulimit -c 0
          node customer_frontier/recovery/step2_recovered_tenant_qualification_20261114.mjs
      - name: Preserve sanitized boundary and full cleanup parity receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-recovered-tenant-qualification-20261114
          retention-days: 10
          if-no-files-found: error
          path: |
            recovered_tenant_qualification_20261114.json
            recovered_tenant_qualification_20261114.json.sha256
