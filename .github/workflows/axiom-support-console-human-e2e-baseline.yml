name: MUSITU Axiom Support Console Human E2E Baseline

on:
  push:
    branches:
      - 'support/axiom-support-console-production-rollout-20261008'
    paths:
      - '.github/workflows/axiom-support-console-human-e2e-baseline.yml'

permissions:
  contents: read

jobs:
  baseline:
    if: github.event_name == 'push' && github.event.before == '39a6b7960d210676e40972f91168b458528d6066'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 5
    env:
      CF_ACCOUNT: '93f395f5121954671f92fffa453d6b61'
      SUPPORT_DB: 'a525c8b6-9b44-413b-a219-46e419b71b12'
      D1_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read metadata-only baseline
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const api='https://api.cloudflare.com/client/v4';
          const account=process.env.CF_ACCOUNT, db=process.env.SUPPORT_DB, token=process.env.D1_TOKEN;
          async function q(sql){
            const r=await fetch(api+'/accounts/'+account+'/d1/database/'+db+'/query',{
              method:'POST',
              headers:{authorization:'Bearer '+token,'content-type':'application/json',accept:'application/json'},
              body:JSON.stringify({sql})
            });
            const p=await r.json();
            if(!r.ok||p?.success===false) throw new Error('D1 query failed HTTP '+r.status);
            const b=Array.isArray(p.result)?p.result[0]:p.result;
            return b?.results||[];
          }
          const counts=(await q("SELECT (SELECT COUNT(*) FROM support_cases) AS cases,(SELECT COUNT(*) FROM support_case_events) AS events,(SELECT COUNT(*) FROM support_case_messages) AS messages,(SELECT COUNT(*) FROM support_case_assignments) AS assignments,(SELECT COUNT(*) FROM support_case_approvals) AS approvals,(SELECT COUNT(*) FROM support_notification_outbox) AS notifications;"))[0]||{};
          const latest=await q("SELECT case_id,state,priority,surface,category,created_at,updated_at FROM support_cases ORDER BY created_at DESC LIMIT 5;");
          console.log(JSON.stringify({
            gate:'MUSITU_AXIOM_SUPPORT_CONSOLE_HUMAN_E2E_BASELINE',
            status:'PASS',
            counts:Object.fromEntries(Object.entries(counts).map(([k,v])=>[k,Number(v||0)])),
            latest_cases:latest,
            plaintext_customer_narrative_read:false,
            recovery_code_read:false,
            secret_values_recorded:false
          }));
          NODE
