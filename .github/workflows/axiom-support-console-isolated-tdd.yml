name: MUSITU Axiom Support Console Isolated TDD

on:
  push:
    branches:
      - 'support/axiom-support-console-isolated-20261008'
    paths:
      - 'support/**'
      - '.github/workflows/axiom-support-console-isolated-tdd.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check support/control_plane.js
          node --check support/d1_case_store.js
          node --check support/worker.js
          node --check support/operator_worker.js
          node --check support/app.js
          node --check support/console/app.js

      - name: Full support regression suite
        run: node --test support/tests/*.test.mjs

      - name: Console secret and authority gate
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIE --exclude='*.test.mjs' --exclude='*.md' '(sk-proj-[A-Za-z0-9_-]{20,}|Bearer[[:space:]]+[A-Za-z0-9._-]{24,}|-----BEGIN[[:space:]]+(RSA|EC|OPENSSH|PRIVATE)[[:space:]]+KEY-----)' support/console support/operator_worker.js
          ! grep -RIE 'localStorage|sessionStorage|indexedDB' support/console/app.js support/app.js
          ! grep -RIE 'recovery[_-]?code' support/console/app.js
          grep -q 'production_authority: false' support/console/CONTRACT.md
