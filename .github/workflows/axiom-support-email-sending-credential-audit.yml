name: MUSITU Axiom Support Email Sending Credential Audit

on:
  push:
    branches:
      - 'support/axiom-global-support-ops-production-rollout-20261008'
    paths:
      - '.github/workflows/axiom-support-email-sending-credential-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'push' && github.event.before == '891e1c70a10c73b67b25b4bf0e44bf7d1db483d5'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 5
    env:
      CF_ZONE: '5b56528f03948ff5917a5e0cd9f7109e'
      TOKEN_A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOKEN_B: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
      CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_GLOBAL_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
    steps:
      - name: Read Email Sending capability with existing production credentials
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const api='https://api.cloudflare.com/client/v4',zone=process.env.CF_ZONE;
          async function probe(headers){
            const r=await fetch(api+'/zones/'+zone+'/email/sending/subdomains',{headers:{...headers,accept:'application/json'}});
            let p={};try{p=await r.json()}catch{}
            return {http_status:r.status,available:r.ok&&p?.success!==false,codes:(p?.errors||[]).map(x=>x?.code).filter(Boolean)};
          }
          const a=String(process.env.TOKEN_A||''),b=String(process.env.TOKEN_B||''),email=String(process.env.CF_EMAIL||''),key=String(process.env.CF_GLOBAL_KEY||'');
          const results={};
          if(a)results.cloudflare_api_token=await probe({authorization:'Bearer '+a});
          if(b)results.cloudflare_rulesets_token=await probe({authorization:'Bearer '+b});
          if(email&&key)results.global_api_key=await probe({'X-Auth-Email':email,'X-Auth-Key':key});
          console.log(JSON.stringify({
            gate:'MUSITU_AXIOM_SUPPORT_EMAIL_SENDING_CREDENTIAL_AUDIT',
            status:'PASS',
            credentials:results,
            any_available:Object.values(results).some(x=>x.available===true),
            mutation_performed:false,
            secret_values_recorded:false
          }));
          NODE
