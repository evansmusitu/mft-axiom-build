name: MUSITU Axiom Secure Recovery Production Audit

on:
  push:
    branches:
      - 'support/axiom-support-recovery-production-rollout-20261008'
    paths:
      - '.github/workflows/axiom-support-recovery-production-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'push' && github.event.before == 'cf62aa92fde13ad4001650d38bf4ae5ecd662711'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 7
    env:
      CF_ACCOUNT: '93f395f5121954671f92fffa453d6b61'
      SUPPORT_DB: 'a525c8b6-9b44-413b-a219-46e419b71b12'
      ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      D1_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
      CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_GLOBAL_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
    steps:
      - name: Read live recovery production state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const api='https://api.cloudflare.com/client/v4';
          const account=process.env.CF_ACCOUNT,db=process.env.SUPPORT_DB;
          const accessToken=String(process.env.ACCESS_TOKEN||''),d1Token=String(process.env.D1_TOKEN||''),workerToken=String(process.env.WORKER_TOKEN||'');
          const email=String(process.env.CF_EMAIL||''),globalKey=String(process.env.CF_GLOBAL_KEY||'');
          async function raw(headers,path,{method='GET',body}={}){
            const r=await fetch(api+path,{method,headers:{...headers,accept:'application/json',...(body===undefined?{}:{'content-type':'application/json'})},...(body===undefined?{}:{body:JSON.stringify(body)})});
            let p={};try{p=await r.json()}catch{}
            return {r,p};
          }
          async function call(headers,path,opts={}){
            const {r,p}=await raw(headers,path,opts);
            if(!r.ok||p?.success===false) throw new Error('Cloudflare read failed '+r.status+' '+path);
            return p?.result;
          }
          const wh={authorization:'Bearer '+workerToken},dh={authorization:'Bearer '+d1Token};
          const ah=accessToken?{authorization:'Bearer '+accessToken}:null,gh={'X-Auth-Email':email,'X-Auth-Key':globalKey};
          async function access(path){
            if(ah){
              const a=await raw(ah,path);
              if(a.r.ok&&a.p?.success!==false) return a.p?.result;
              if(!(a.r.status===401||a.r.status===403)) throw new Error('Access API read failed '+a.r.status);
            }
            return call(gh,path);
          }
          async function query(sql){
            const result=await call(dh,'/accounts/'+account+'/d1/database/'+db+'/query',{method:'POST',body:{sql}});
            const b=Array.isArray(result)?result[0]:result;return Array.isArray(b?.results)?b.results:[];
          }
          const [apps,domains,pubSub,opsSub,pubSettings,opsSettings,counts]=await Promise.all([
            access('/accounts/'+account+'/access/apps?per_page=100'),
            call(wh,'/accounts/'+account+'/workers/domains'),
            call(wh,'/accounts/'+account+'/workers/scripts/musitu-axiom-support/subdomain'),
            call(wh,'/accounts/'+account+'/workers/scripts/musitu-axiom-support-ops/subdomain'),
            call(wh,'/accounts/'+account+'/workers/scripts/musitu-axiom-support/settings'),
            call(wh,'/accounts/'+account+'/workers/scripts/musitu-axiom-support-ops/settings'),
            query("SELECT (SELECT COUNT(*) FROM support_cases) AS cases,(SELECT COUNT(*) FROM support_case_events) AS events,(SELECT COUNT(*) FROM support_case_messages) AS messages,(SELECT COUNT(*) FROM support_case_approvals) AS approvals,(SELECT COUNT(*) FROM support_case_approval_decisions) AS decisions,(SELECT COUNT(*) FROM support_notification_outbox) AS notifications,(SELECT COUNT(*) FROM support_case_recovery_bindings) AS recovery_bindings,(SELECT COUNT(*) FROM support_case_recovery_requests) AS recovery_requests,(SELECT COUNT(*) FROM support_case_recovery_rotations) AS recovery_rotations;")
          ]);
          const appRows=Array.isArray(apps)?apps:[];
          const recoveryApps=appRows.filter(x=>String(x?.domain||'').toLowerCase()==='support.mftintelligence.com/recovery/*');
          if(recoveryApps.length!==1) throw new Error('recovery Access app drift');
          const recoveryPolicies=await access('/accounts/'+account+'/access/apps/'+encodeURIComponent(String(recoveryApps[0].id))+'/policies');
          const pol=Array.isArray(recoveryPolicies)?recoveryPolicies:[];
          if(pol.length!==1||String(pol[0]?.decision||'')!=='allow') throw new Error('recovery Access policy drift');
          const selectors=Array.isArray(pol[0]?.include)?pol[0].include:[];
          const authenticatedEveryone=selectors.some(x=>x&&typeof x==='object'&&x.everyone&&typeof x.everyone==='object');
          if(!authenticatedEveryone) throw new Error('recovery Access selector drift');

          const pubBindings=Array.isArray(pubSettings?.bindings)?pubSettings.bindings:[];
          const opsBindings=Array.isArray(opsSettings?.bindings)?opsSettings.bindings:[];
          const recoveryTeam=pubBindings.find(x=>x?.name==='SUPPORT_RECOVERY_ACCESS_TEAM_DOMAIN')?.text||'';
          const recoveryAud=pubBindings.find(x=>x?.name==='SUPPORT_RECOVERY_ACCESS_AUD')?.text||'';
          const ownerRef=pubBindings.find(x=>x?.name==='SUPPORT_HUMAN_OWNER_REF')?.text||'';
          const approverRef=pubBindings.find(x=>x?.name==='SUPPORT_INDEPENDENT_APPROVER_REF')?.text||'';
          const mappingRaw=String(pubBindings.find(x=>x?.name==='SUPPORT_OPERATOR_BINDINGS_JSON')?.text||'{}');
          let mapping={};try{mapping=JSON.parse(mappingRaw)}catch{}
          const bindingValues=Object.values(mapping&&typeof mapping==='object'&&!Array.isArray(mapping)?mapping:{});
          const actorRefs=bindingValues.map(x=>String(x?.actor_ref||'')).filter(Boolean);
          const roles=bindingValues.map(x=>String(x?.role||'')).filter(Boolean);
          const distinctApproverBound=Boolean(approverRef&&ownerRef&&approverRef!==ownerRef&&actorRefs.includes(approverRef));
          const d=Array.isArray(domains)?domains:[];
          if(!d.some(x=>String(x?.hostname||'')==='support.mftintelligence.com'&&String(x?.service||'')==='musitu-axiom-support')) throw new Error('public support domain drift');
          if(!d.some(x=>String(x?.hostname||'')==='support-ops.mftintelligence.com'&&String(x?.service||'')==='musitu-axiom-support-ops')) throw new Error('operator domain drift');
          if(pubSub?.enabled===true||pubSub?.previews_enabled===true||opsSub?.enabled===true||opsSub?.previews_enabled===true) throw new Error('workers.dev/previews enabled');
          if(!recoveryTeam||!recoveryAud) throw new Error('recovery Access Worker bindings missing');
          if(!opsBindings.some(x=>x?.type==='service'&&x?.name==='SUPPORT_API'&&x?.service==='musitu-axiom-support')) throw new Error('operator service binding drift');

          console.log(JSON.stringify({
            gate:'MUSITU_AXIOM_SUPPORT_RECOVERY_PRODUCTION_AUDIT',
            status:'PASS',
            access:{recovery_app_count:1,policy_count:1,authenticated_everyone:true,bypass:false},
            workers:{recovery_access_bindings:true,operator_service_binding:true,workers_dev:false,previews:false},
            operator_authority:{
              operator_binding_count:bindingValues.length,
              roles:[...new Set(roles)],
              independent_approver_reference_configured:Boolean(approverRef),
              independent_approver_reference_distinct:Boolean(approverRef&&ownerRef&&approverRef!==ownerRef),
              distinct_independent_approver_identity_bound:distinctApproverBound,
              identity_values_recorded:false,
              ref_values_recorded:false
            },
            d1:counts[0]||{},
            public_support_preserved:true,
            operator_support_preserved:true,
            customer_content_read:false,
            recovery_code_read:false,
            secret_values_recorded:false
          }));
          NODE
