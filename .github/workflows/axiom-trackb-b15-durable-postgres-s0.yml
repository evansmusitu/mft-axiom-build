name: AXIOM Track B15 independent durable PostgreSQL quota S0
on:
  push:
    branches:
      - frontier/axiom-trackb-b15-durable-quota-s0-20261012
    paths:
      - ops/trackb15/**
      - .github/workflows/axiom-trackb-b15-durable-postgres-s0.yml
permissions:
  contents: read
jobs:
  isolated-b15-postgres:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'frontier/axiom-trackb-b15-durable-quota-s0-20261012'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: axiomtest
          POSTGRES_PASSWORD: isolated-test-not-secret
          POSTGRES_DB: axiom_b15_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiomtest -d axiom_b15_test"
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      B15_DATABASE_URL: postgresql://axiomtest:isolated-test-not-secret@localhost:5432/axiom_b15_test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Enforce synthetic-only scope
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${AXIOM_SIGNING_PRIVATE_KEY:-}"
          echo 'B15_PROVIDER_CREDENTIALS_ABSENT'
      - name: Install local-test libraries
        shell: bash
        run: python -m pip install -q --disable-pip-version-check 'psycopg[binary]>=3.2,<3.4' 'cryptography>=42,<50'
      - name: Run native PostgreSQL signed concurrent reservation qualification
        shell: bash
        run: |
          set -euo pipefail
          cd ops/trackb15
          python -m unittest -v test_durable_quota
          echo 'AXIOM_B15_NATIVE_POSTGRES_ATOMIC_ADMISSION_S0_PASS'
