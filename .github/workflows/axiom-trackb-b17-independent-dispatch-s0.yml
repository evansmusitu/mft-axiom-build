name: AXIOM Track B17 isolated signed-payload dispatch gate S0
on:
  push:
    branches:
      - frontier/axiom-trackb-b17-broker-payload-gate-s0-20261013
    paths:
      - ops/trackb17/**
      - ops/trackb16/src/identity.mjs
      - .github/workflows/axiom-trackb-b17-independent-dispatch-s0.yml
permissions:
  contents: read
jobs:
  builder-contract-s0:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'frontier/axiom-trackb-b17-broker-payload-gate-s0-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    defaults:
      run:
        working-directory: ops/trackb17
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Enforce isolated synthetic-only S0 and no provider access
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${AXIOM_SIGNING_PRIVATE_KEY:-}"
          test -z "${AXIOM_PRODUCTION_AUTHORIZATION:-}"
          test -z "${OPENAI_API_KEY:-}"
          echo AXIOM_B17_NO_PROVIDER_SECRETS_S0
      - name: Verify parent dependency and manifests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c MANIFEST.sha256
          node --version
          node --check dispatch_guard.mjs
          node --check test/dispatch_guard.test.mjs
          node --check test/independent_security.test.mjs
          echo AXIOM_B17_SOURCE_MANIFEST_AND_SYNTAX_PASS
      - name: Run broker payload-binding behavior cases
        shell: bash
        run: |
          set -euo pipefail
          node --test test/dispatch_guard.test.mjs
          echo AXIOM_B17_LOCAL_BROKER_PAYLOAD_BINDING_S0_PASS
  independent-adversarial-verifier-s0:
    needs: builder-contract-s0
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'frontier/axiom-trackb-b17-broker-payload-gate-s0-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    defaults:
      run:
        working-directory: ops/trackb17
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact independent attack suite and NO live credentials
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c MANIFEST.sha256
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${AXIOM_SIGNING_PRIVATE_KEY:-}"
          echo AXIOM_B17_REVIEWER_ONLY_S0_NO_SECRETS
      - name: Independently attack quota receipts, replay, and model-scope binding
        shell: bash
        run: |
          set -euo pipefail
          node --test test/independent_security.test.mjs
          echo AXIOM_B17_INDEPENDENT_SYNTHETIC_ATTACK_SUITE_PASS_NO_PRODUCTION_CERTIFICATION
