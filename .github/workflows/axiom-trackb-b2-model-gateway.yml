name: MUSITU AXIOM Track B B2 Signed Model Gateway Contract

on:
  push:
    branches:
      - frontier/axiom-trackb-openhands-selfhost-20261008
    paths:
      - '.github/workflows/axiom-trackb-b2-model-gateway.yml'
      - 'ops/openhands_self_hosted/model_gateway_guard.py'
      - 'ops/openhands_self_hosted/model_https_transport.py'
      - 'ops/openhands_self_hosted/model_budget_ledger.py'
      - 'ops/openhands_self_hosted/test_model_gateway_guard.py'
      - 'ops/openhands_self_hosted/test_model_https_transport.py'
      - 'ops/openhands_self_hosted/test_model_budget_ledger.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiom-trackb-b2-model-gateway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-provider-gateway-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AXIOM_ISOLATED_QUALIFICATION: 'TRUE'
    steps:
      - name: Enforce isolated qualification boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'frontier/axiom-trackb-openhands-selfhost-20261008'
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ANTHROPIC_API_KEY:-}"
          echo 'MODEL_PROVIDER_CREDENTIALS_NOT_INJECTED=TRUE'
          echo 'EXTERNAL_PROVIDER_EGRESS=FALSE'
          echo 'PRODUCTION_AUTHORITY=FALSE'
      - name: Checkout isolated source without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run gateway authorization and concurrency regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ops/openhands_self_hosted -p 'test_*.py' -v
          python3 -m compileall -q ops/openhands_self_hosted
          echo 'MUSITU_AXIOM_TRACK_B_SIGNED_MODEL_GATEWAY_OFFLINE_CONTRACT_PASS'
          echo 'REAL_MODEL_PROVIDER_EXECUTION=NOT_PROVEN'
          echo 'INDEPENDENT_CERTIFICATION=NOT_PROVEN'
          echo 'PRODUCTION_AUTHORITY=FALSE'
