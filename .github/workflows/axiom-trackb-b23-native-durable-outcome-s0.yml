name: AXIOM B23 native SDK durable outcome causal join S0
on:
  push:
    branches: [frontier/axiom-trackb-b23-native-durable-outcome-s0-20261013]
    paths:
      - ops/trackb23/**
      - .github/workflows/axiom-trackb-b23-native-durable-outcome-s0.yml
permissions:
  contents: read
jobs:
  offline-adversarial-s0:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'frontier/axiom-trackb-b23-native-durable-outcome-s0-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: No live secrets or production authority
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${AXIOM_SIGNING_PRIVATE_KEY:-}"
          test -z "${AXIOM_PRODUCTION_AUTHORIZATION:-}"
          test "$(git hash-object ops/trackb12/b12_runner.py)" = f1ac799d6b00636247c2b773122267031a67aa8f
          test ! -e ops/trackb23/.dev.vars
      - name: Signed causal join and storage attacks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q --disable-pip-version-check 'cryptography>=42,<50'
          python3 ops/trackb23/VERIFY_B23.py
          python3 -m compileall -q ops/trackb23
          python3 -m unittest discover -v -s ops/trackb23/test -p 'test_*.py'
          echo AXIOM_B23_OFFLINE_ADVERSARIAL_PASS_NOT_REAL_WORKERD
  native-workerd-s0:
    needs: offline-adversarial-s0
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'frontier/axiom-trackb-b23-native-durable-outcome-s0-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    outputs:
      payload_b64: ${{ steps.native.outputs.payload_b64 }}
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Install actual SDK and Workerd in disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${AXIOM_PRODUCTION_AUTHORIZATION:-}"
          test "$(git hash-object ops/trackb12/b12_runner.py)" = f1ac799d6b00636247c2b773122267031a67aa8f
          python3 -m venv /tmp/axiom-b23-sdk
          /tmp/axiom-b23-sdk/bin/pip install -q --disable-pip-version-check 'openhands-agent-server==1.51.0' 'cryptography>=42,<50'
          /tmp/axiom-b23-sdk/bin/python -c 'from openhands.sdk import Agent,LLM,Conversation,Tool; print("B23_GENUINE_NATIVE_SDK_IMPORT_PASS")'
          NPM_CONFIG_PREFIX="$RUNNER_TEMP/axiom-b23-npm" npm install -g npm@11.19.1 --no-audit --no-fund
          export PATH="$RUNNER_TEMP/axiom-b23-npm/bin:$PATH"
          cd ops/trackb22
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm ls workerd
      - name: Produce raw SDK, Workerd journal and quota join with signed B19 native events
        id: native
        shell: bash
        run: |
          set -euo pipefail
          sudo install -o root -g root -m 0644 ops/trackb12/b12_runner.py /tmp/axiom-b22-unmodified-b12.py
          sudo install -o root -g root -m 0644 ops/trackb23/gated_b12.py /tmp/axiom-b19-verified-b12.py
          sudo install -o root -g root -m 0600 /dev/null /tmp/axiom-b22-local-token
          synthetic_secret="$(openssl rand -hex 32)"
          printf %s "$synthetic_secret" | sudo tee /tmp/axiom-b22-local-token >/dev/null
          sudo iptables -I OUTPUT 1 -m owner --uid-owner 65532 ! -d 127.0.0.0/8 -j REJECT
          sudo iptables -I OUTPUT 1 -m owner --uid-owner 65533 ! -d 127.0.0.0/8 -j REJECT
          cleanup() {
            sudo iptables -D OUTPUT -m owner --uid-owner 65532 ! -d 127.0.0.0/8 -j REJECT 2>/dev/null || true
            sudo iptables -D OUTPUT -m owner --uid-owner 65533 ! -d 127.0.0.0/8 -j REJECT 2>/dev/null || true
            if [ -n "${workerd_pid:-}" ]; then kill "$workerd_pid" 2>/dev/null || true; wait "$workerd_pid" 2>/dev/null || true; fi
            sudo rm -f /tmp/axiom-b22-local-token /tmp/axiom-b22-unmodified-b12.py /tmp/axiom-b19-verified-b12.py
            unset synthetic_secret
          }
          trap cleanup EXIT
          export PATH="$RUNNER_TEMP/axiom-b23-npm/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/b23-workerd-store"
          (cd ops/trackb22 && ./node_modules/.bin/wrangler dev --local --ip 127.0.0.1 --port 18768 --inspector-port 0 \
            --persist-to "$RUNNER_TEMP/b23-workerd-store" --var "AXIOM_B22_TEST_SECRET:$synthetic_secret" \
            > "$RUNNER_TEMP/b23-workerd.log" 2>&1) &
          workerd_pid=$!
          ready=0
          for i in $(seq 1 70); do
            if curl -fsS --max-time 2 -H "X-Axiom-B21-Local-Secret: $synthetic_secret" \
               http://127.0.0.1:18768/_internal_s0_health | grep -q '"ready":true'; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then tail -120 "$RUNNER_TEMP/b23-workerd.log"; exit 75; fi
          test "$(curl -sS --max-time 3 -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18768/_internal_s0_admit)" = 403
          sudo env -i PATH=/usr/bin:/bin:/usr/local/bin PYTHONUNBUFFERED=1 B19_SOURCE_COMMIT="$GITHUB_SHA" \
            /tmp/axiom-b23-sdk/bin/python ops/trackb19/native_qualification.py | tee "$RUNNER_TEMP/b23-native.log"
          /tmp/axiom-b23-sdk/bin/python ops/trackb22/verify_gate.py "$RUNNER_TEMP/b23-native.log"
          kill "$workerd_pid" || true
          wait "$workerd_pid" 2>/dev/null || true
          unset workerd_pid
          /tmp/axiom-b23-sdk/bin/python ops/trackb23/cli.py produce \
            --native-log "$RUNNER_TEMP/b23-native.log" \
            --state-dir "$RUNNER_TEMP/b23-workerd-store" \
            --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/b23-outcome.json"
          payload="$(base64 -w 0 < "$RUNNER_TEMP/b23-outcome.json")"
          test "${#payload}" -lt 60000
          echo "payload_b64=$payload" >> "$GITHUB_OUTPUT"
          echo AXIOM_B23_ORIGINAL_SDK_WORKERD_SOURCE_JOIN_S0_PASS_NOT_EXTERNAL_AUTHORITY
  independent-consumer-s0:
    needs: [native-workerd-s0]
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'frontier/axiom-trackb-b23-native-durable-outcome-s0-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      B23_PAYLOAD_B64: ${{ needs.native-workerd-s0.outputs.payload_b64 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Independently reject missing/cross-workload modified execution and quota records
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${OPENAI_API_KEY:-}"
          test -n "${B23_PAYLOAD_B64:-}"
          python3 -m pip install -q --disable-pip-version-check 'cryptography>=42,<50'
          printf %s "$B23_PAYLOAD_B64" | base64 -d > "$RUNNER_TEMP/b23-original.json"
          python3 ops/trackb23/cli.py consume --file "$RUNNER_TEMP/b23-original.json" --commit "$GITHUB_SHA"
          echo MUSITU_AXIOM_B23_BOUND_NATIVE_WORKERD_DURABLE_EVIDENCE_S0_PASS_NOT_PRODUCTION
