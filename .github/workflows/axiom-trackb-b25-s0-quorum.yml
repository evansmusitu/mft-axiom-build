name: AXIOM B25 synthetic local quorum test S0
on:
  push:
    branches: [frontier/axiom-trackb-b25-local-audit-quorum-s0-20261013]
    paths:
      - ops/trackb25/**
      - .github/workflows/axiom-trackb-b25-s0-quorum.yml
permissions:
  contents: read
jobs:
  local-synthetic-quorum-attack:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'frontier/axiom-trackb-b25-local-audit-quorum-s0-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: No provider credentials, no production authority
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ANTHROPIC_API_KEY:-}"
          test -z "${AXIOM_SIGNING_PRIVATE_KEY:-}"
          test -z "${AXIOM_PRODUCTION_AUTHORIZATION:-}"
          echo B25_S0_ALL_PROVIDER_SECRETS_ABSENT
      - name: Install test-only pinned crypto wheel
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/axiom-b25-env
          /tmp/axiom-b25-env/bin/pip install --only-binary=:all: 'cryptography==45.0.7'
      - name: Verify source hashes and 19 adversarial S0 cases
        shell: bash
        run: |
          set -euo pipefail
          cd ops/trackb25
          /tmp/axiom-b25-env/bin/python VERIFY_B25.py
          echo AXIOM_B25_LOCAL_SYNTHETIC_2_OF_3_AUDIT_QUORUM_PASS_NOT_GLOBAL_NOT_PRODUCTION
