name: AXIOM OpenHands Engineering Command Center S0 requalification (not release)
on:
  push:
    branches:
      - frontier/axiom-trackb-openhands-ecc-requalification-s0-20261022
    paths:
      - ops/openhands_qualification/**
      - axiom_interface/vnext/openhands_engineering_bridge.js
      - axiom_interface/vnext/engineering_command_center_ui.js
      - axiom_interface/vnext/tests/openhands_ecc_bridge.test.mjs
      - .github/workflows/axiom-trackb-openhands-ecc-requalification-s0-20261022.yml
permissions:
  contents: read
jobs:
  local-multiprocess-recovery-and-ecc-contract:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'frontier/axiom-trackb-openhands-ecc-requalification-s0-20261022'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Fail closed on provider/production credentials, require isolated ancestry
        shell: bash
        run: |
          set -euo pipefail
          test -z "${OPENHANDS_API_KEY:-}"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${AXIOM_PRODUCTION_AUTHORIZATION:-}"
          test -z "${AXIOM_SIGNING_PRIVATE_KEY:-}"
          git merge-base --is-ancestor c57cf8505ceee91a6b9b93ae6368f54c6b9ae127 HEAD
          echo AXIOM_OPENHANDS_ISOLATED_S0_NO_PROVIDER_OR_PRODUCTION_ACCESS
      - name: Test project-bound Engineering Command Center bridge without cloud claims
        run: |
          set -euo pipefail
          node --test axiom_interface/vnext/tests/fa13_engineering_command_center.test.mjs axiom_interface/vnext/tests/openhands_ecc_bridge.test.mjs
          node --check axiom_interface/vnext/engineering_command_center_ui.js
          node --check axiom_interface/vnext/openhands_engineering_bridge.js
          echo AXIOM_OPENHANDS_ECC_PROJECT_BOUND_BRIDGE_LOCAL_PASS_NO_S3
      - name: Exercise actual local multiprocess persistence and crash recovery
        run: |
          set -euo pipefail
          python -m unittest discover -s ops/openhands_qualification/test -p 'test_*.py' -v
          python -m compileall -q ops/openhands_qualification
          echo AXIOM_OPENHANDS_MULTIPROCESS_LOCAL_RECOVERY_S0_PASS_NOT_EXTERNAL
  credentialless-historical-native-run-verifier:
    needs: local-multiprocess-recovery-and-ecc-contract
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'frontier/axiom-trackb-openhands-ecc-requalification-s0-20261022'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Independently obtain public native OpenHands run metadata (no secrets, no provider call)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request
          from ops.openhands_qualification.verify_history import PINS,verify_runs
          rows={}
          for role,(run_id,head) in PINS.items():
              url='https://api.github.com/repos/evansmusitu/mft-axiom-build/actions/runs/'+str(run_id)
              request=urllib.request.Request(url,headers={'User-Agent':'musitu-axiom-openhands-s0-evidence-reconciler','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=15) as reply: data=json.load(reply)
              rows[str(run_id)]={k:data[k] for k in ('id','head_sha','status','conclusion','event')}
              rows[str(run_id)]['repository']={'full_name':data['repository']['full_name']}
          result=verify_runs(rows)
          assert result['production_authority'] is False
          assert result['end_to_end_s3_git_mutation']=='NOT_PROVEN'
          assert result['global_rollback_resistance']=='FAILED_IN_SYNTHETIC_ATTACK'
          print(json.dumps(result,sort_keys=True))
          print('AXIOM_OPENHANDS_HISTORICAL_GENUINE_NATIVE_CI_PROVENANCE_RECONFIRMED_NOT_NEW_EXECUTION')
          PY
      - name: Permanent claim boundary
        run: |
          set -euo pipefail
          grep -Fq 'PRODUCTION AUTHORITY: FALSE' axiom_interface/vnext/engineering_command_center_ui.js
          grep -Fq 'FAILED_IN_SYNTHETIC_ATTACK' ops/openhands_qualification/README.md
          echo AXIOM_OPENHANDS_END_TO_END_S3_NOT_PROVEN_HOLD_RELEASE
