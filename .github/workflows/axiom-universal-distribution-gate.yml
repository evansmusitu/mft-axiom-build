name: MUSITU Axiom Universal Distribution Gate

on:
  push:
    branches:
      - 'distribution/**'
    paths:
      - 'frontier_v5/distribution/**'
      - 'frontier_v5/tests/test_distribution_surface.py'
      - '.github/workflows/axiom-universal-distribution-gate.yml'
      - 'docs/plans/2026-10-03-claude-remote-mcp-distribution.md'
      - 'progress.md'
  pull_request:
    paths:
      - 'frontier_v5/distribution/**'
      - 'frontier_v5/tests/test_distribution_surface.py'
      - '.github/workflows/axiom-universal-distribution-gate.yml'

permissions:
  contents: read

jobs:
  distribution-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Prove frozen OpenAI surface unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 8fc1fbb7c5ebbcc1604ecf24c5f4594f2d5667e3 HEAD --             auth/ mcp/ submission/ chatgpt-app-submission.json

      - name: Test distribution contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_distribution_surface.py

      - name: Test existing frontier runtime
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_frontier_runtime.py
          PYTHONPATH=. python frontier_v5/tests/test_advanced_runtime.py

      - name: Universal distribution sentinel
        shell: bash
        run: |
          set -euo pipefail
          echo MUSITU_AXIOM_UNIVERSAL_DISTRIBUTION_GATE_PASS
