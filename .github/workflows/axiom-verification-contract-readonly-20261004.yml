name: Axiom Verification Contract Read-Only 20261004
on:
  push:
    branches: [fix/axiom-all-operation-contracts-20261004]
    paths: ['.github/workflows/axiom-verification-contract-readonly-20261004.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Reconstruct current production-QP runtime only
        shell: bash
        run: |
          set -euo pipefail
          P=deploy_payload/runtime_min
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > runtime.enc.b64
          base64 -d runtime.enc.b64 > runtime.tar.gz.enc
          test "$(sha256sum runtime.tar.gz.enc | awk '{print $1}')" = 'b82448d6b4b34b302748815af976b535d69922c197d4b7a9056fc2f91a9e12cf'
          python - <<'PY'
          import hashlib,hmac,os
          b=open('runtime.tar.gz.enc','rb').read()
          if not hmac.compare_digest(hmac.new(os.environ['CLOUDFLARE_GLOBAL_API_KEY'].encode(),b,hashlib.sha256).hexdigest(),'1a3193d4f3271d61d151e6ebd7cf4576d8ab86c2e79b84eff4ad0f635fe7ab47'):raise SystemExit('HMAC mismatch')
          PY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in runtime.tar.gz.enc -out runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          test "$(sha256sum runtime.tar.gz | awk '{print $1}')" = 'b4d5a0266446523969a619f5e9bb5a04d9b815c78a2ab82ed046ef5e23d53663'
          mkdir runtime && tar -xzf runtime.tar.gz -C runtime
          python frontier_v5/scripts/patch_quadratic_constraints_runtime.py runtime/kernel/app/main.py
          test "$(sha256sum runtime/kernel/app/main.py | awk '{print $1}')" = 'cfa39f0f17c56a183c5024a600086aba4644ec925343129245a62e18294f7c47'
      - name: Install minimal runtime roots
        run: python -m pip install --disable-pip-version-check --quiet fastapi==0.128.2 sympy==1.14.0 numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Inspect compute route and verify flag behavior
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import importlib,inspect,json,pathlib,sys
          sys.path.insert(0,str(pathlib.Path('runtime').resolve()))
          m=importlib.import_module('kernel.app.main')
          print('COMPUTE_SOURCE_BEGIN')
          print(inspect.getsource(m.compute))
          print('COMPUTE_SOURCE_END')
          routes=[]
          for r in m.app.routes:
              if getattr(r,'path',None)=='/v1/compute':
                  fn=getattr(r,'endpoint',None)
                  routes.append({'name':getattr(fn,'__name__',None),'source':inspect.getsource(fn) if fn else None})
          print('COMPUTE_ROUTES='+json.dumps(routes,sort_keys=True))
          cases=[
            ('numeric.root',{'expression':'x^2-2','symbol':'x','guess':1}),
            ('numeric.integrate',{'expression':'x^2','a':0,'b':1}),
            ('linear.solve',{'A':[[2,0],[0,3]],'b':[4,9]}),
            ('finance.black_scholes',{'S':100,'K':100,'T':1,'r':.05,'sigma':.2,'kind':'call'}),
            ('optimization.quadratic',{'Q':[[2]],'c':[-4],'bounds':[[0,3]]}),
          ]
          for op,args in cases:
              for verify in (False,True):
                  req=m.ComputeRequest(operation=op,args=args,verify=verify)
                  out=m.compute(req)
                  print('VERIFY_CASE='+json.dumps({'operation':op,'verify_requested':verify,'top_verified':out.get('verified'),'result_verification':(out.get('result') or {}).get('verification') if isinstance(out.get('result'),dict) else None},sort_keys=True,default=str))
          PY
