name: AXIOM verification source readback (GET only)
# Retain encrypted diagnostic detail if existing provider file-read access fails.
on:
  push:
    branches: [repair/axiom-independent-verification-20261118]
    paths:
      - .github/workflows/axiom-verification-source-readback.yml
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check --quiet 'modal>=1.5,<2'
      - name: Capture only existing Axiom verification sources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AXIOM_LEGACY_PAYLOAD_PASSPHRASE: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python3 ops/verification_source_readback.py
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-verification-source-readback
          path: verification-readback/
          retention-days: 1
          if-no-files-found: error
