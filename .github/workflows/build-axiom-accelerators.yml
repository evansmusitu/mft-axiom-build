name: Build MFT Axiom Accelerators

on:
  push:
    paths:
      - '.github/workflows/build-axiom-accelerators.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheelhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Acquire exact accelerator dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          mkdir -p wheelhouse metadata
          python -m pip download --only-binary=:all: --dest wheelhouse \
            'duckdb==1.5.5' \
            'pyarrow==25.0.1' \
            'Pint==0.25.3' \
            'cvxpy==1.9.2' \
            'highspy' \
            'QuantLib==1.43' \
            'python-flint==0.9.0' \
            'z3-solver==5.0.0.0'
          (cd wheelhouse && sha256sum * | sort) > metadata/SHA256SUMS.txt
          python - <<'PY'
          import json, pathlib, hashlib, platform, sys
          root=pathlib.Path('wheelhouse')
          files=[]
          for p in sorted(root.iterdir()):
              if p.is_file():
                  files.append({'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          manifest={'schema':'mft.axiom.accelerators.v1','python':sys.version,'platform':platform.platform(),'required_roots':['duckdb==1.5.5','pyarrow==25.0.1','Pint==0.25.3','cvxpy==1.9.2','highspy','QuantLib==1.43','python-flint==0.9.0','z3-solver==5.0.0.0'],'files':files}
          pathlib.Path('metadata/manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True))
          PY
      - name: Offline install and import verification
        shell: bash
        run: |
          set -euo pipefail
          python -m venv verify-env
          verify-env/bin/python -m pip install --no-index --find-links=wheelhouse \
            'duckdb==1.5.5' 'pyarrow==25.0.1' 'Pint==0.25.3' 'cvxpy==1.9.2' highspy \
            'QuantLib==1.43' 'python-flint==0.9.0' 'z3-solver==5.0.0.0'
          verify-env/bin/python - <<'PY'
          import duckdb, pyarrow, pint, cvxpy, highspy, QuantLib, flint, z3
          import json, pathlib
          out={'duckdb':duckdb.__version__,'pyarrow':pyarrow.__version__,'pint':pint.__version__,'cvxpy':cvxpy.__version__,'QuantLib':QuantLib.__version__,'python_flint':flint.__version__,'z3':z3.get_version_string(),'imports':'PASS'}
          pathlib.Path('metadata/verification.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(out)
          PY
      - name: Verify hashes
        run: cd wheelhouse && sha256sum -c ../metadata/SHA256SUMS.txt
      - name: Upload immutable Axiom accelerator bundle
        uses: actions/upload-artifact@v4
        with:
          name: mft-axiom-accelerators-linux-x86_64-cp313
          path: |
            wheelhouse/
            metadata/
          if-no-files-found: error
          retention-days: 30
