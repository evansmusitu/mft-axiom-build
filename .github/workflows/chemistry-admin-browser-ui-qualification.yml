name: MUSITU Chemistry Admin Browser UI Qualification

on:
  push:
    paths:
      - '.github/workflows/chemistry-admin-browser-ui-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      WORKER: musitu-chemistry-commerce
      BASELINE_SHA: d6ad30d11205a0bfaff008aeb3e9ae46075518186e7c717ba82b5a9e6c3bc567
      OLD_TARGET_SHA: f3d73cb03e8c4b6ed642e232025594220aad89c43ec302d4f5cb14a62b015531
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact baseline and qualify repaired candidate without mutation
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,subprocess,urllib.parse,urllib.request
          from pathlib import Path
          API=os.environ['CF_API']; A=os.environ['ACCOUNT_ID']; W=os.environ['WORKER']
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Admin-Browser-Qualification/1.0'}
          q=urllib.request.Request(f'{API}/accounts/{A}/workers/scripts/{urllib.parse.quote(W,safe="")}',headers=H)
          with urllib.request.urlopen(q,timeout=45) as r: raw=r.read(); ct=r.headers.get('content-type','')
          if 'multipart/' in ct.lower():
            msg=email.message_from_bytes((f'Content-Type: {ct}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw); matches=[]
            for p in msg.walk():
              if p.is_multipart(): continue
              d=p.get_payload(decode=True) or b''
              if b'MUSITU Chemistry Commerce' in d: matches.append(d)
            if len(matches)!=1: raise SystemExit(f'commerce module extraction mismatch {len(matches)}')
            live=matches[0]
          else: live=raw
          sha=lambda b:hashlib.sha256(b).hexdigest()
          live_sha=sha(live)
          if live_sha!=os.environ['OLD_TARGET_SHA']: raise SystemExit(f'live old target drift {live_sha}')
          text=live.decode('utf-8')
          route="if(p==='/chemistry/admin'||p.startsWith('/chemistry/admin/'))return adminRouterV2(req,env);"
          start='/* MUSITU Chemistry Admin Command Center v1'
          anchor='async function createOrder(env,{plan,holder,email,deviceId,seatsInput})'
          if text.count(route)!=1 or text.count(start)!=1 or text.count(anchor)!=1: raise SystemExit('old Admin structural anchors not unique')
          text=text.replace(route,'',1)
          a=text.index(start); b=text.index(anchor,a)
          baseline=(text[:a]+text[b:]).encode('utf-8')
          baseline_sha=sha(baseline)
          if baseline_sha!=os.environ['BASELINE_SHA']: raise SystemExit(f'baseline reconstruction mismatch {baseline_sha}')
          Path('/tmp/baseline.mjs').write_bytes(baseline)
          subprocess.run(['python','commerce/chemistry/patch_admin_command_center.py','--input','/tmp/baseline.mjs','--output','/tmp/candidate.mjs'],check=True)
          candidate=Path('/tmp/candidate.mjs').read_bytes(); candidate_sha=sha(candidate)
          subprocess.run(['node','--check','/tmp/candidate.mjs'],check=True)
          # Independently validate the exact browser runtime generated by the repaired UI source.
          ui=Path('commerce/chemistry/admin_command_center_ui_v2.mjs').read_text(encoding='utf-8')
          Path('/tmp/ui-eval.js').write_text(ui+"\nrequire('fs').writeFileSync('/tmp/admin-runtime.js',ADMIN2_JS,'utf8');\nrequire('fs').writeFileSync('/tmp/admin-runtime.css',ADMIN2_CSS,'utf8');\n",encoding='utf-8')
          subprocess.run(['node','/tmp/ui-eval.js'],check=True)
          subprocess.run(['node','--check','/tmp/admin-runtime.js'],check=True)
          runtime=Path('/tmp/admin-runtime.js').read_text(encoding='utf-8'); css=Path('/tmp/admin-runtime.css').read_text(encoding='utf-8')
          for tok in ["go('dashboard')","dashboard().catch(show)","SAVE THIS CREDENTIAL NOW — IT IS SHOWN ONCE:\\n","/chemistry/admin/api/"]:
            if tok not in runtime: raise SystemExit('browser runtime invariant missing '+repr(tok))
          if '.app{grid-template-columns:1fr;grid-template-rows:auto auto;min-height:0;align-content:start}' not in css: raise SystemExit('mobile layout repair missing')
          # Exact reversibility of the new candidate back to baseline.
          cand=candidate.decode('utf-8')
          if cand.count(route)!=1 or cand.count(start)!=1 or cand.count(anchor)!=1: raise SystemExit('candidate Admin structural anchors not unique')
          rev=cand.replace(route,'',1); x=rev.index(start); y=rev.index(anchor,x); rebuilt=(rev[:x]+rev[y:]).encode('utf-8')
          if rebuilt!=baseline: raise SystemExit('candidate is not exactly reversible to baseline')
          required=["const DIRECT_PAYNOW_FALLBACK_ACTIVE=false;","currency:'USD'","/internal/paynow/sign-initiate-chemistry","/internal/paynow/initiate","/chemistry/webhooks/paynow","form-action 'self' https://www.paynow.co.zw"]
          for tok in required:
            if tok not in cand: raise SystemExit('secure USD/Paynow invariant missing '+tok)
          report={'gate':'MUSITU_ADMIN_BROWSER_REPAIR_QUALIFICATION_PASS','live_old_target_sha256':live_sha,'baseline_sha256':baseline_sha,'new_target_sha256':candidate_sha,'new_target_bytes':len(candidate),'browser_js_syntax':True,'mobile_layout_repaired':True,'exact_reversal_to_baseline':True,'secure_usd_paynow_preserved':True,'production_mutation':False}
          Path('admin-browser-repair-qualification.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-admin-browser-repair-qualification
          path: admin-browser-repair-qualification.json
          retention-days: 90
          if-no-files-found: error
