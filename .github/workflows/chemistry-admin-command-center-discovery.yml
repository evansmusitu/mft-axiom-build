name: MUSITU Chemistry Admin Command Center Discovery

on:
  push:
    paths:
      - '.github/workflows/chemistry-admin-command-center-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      COMMERCE_WORKER: musitu-chemistry-commerce
    steps:
      - uses: actions/checkout@v4
      - name: Inventory exact live Commerce schema and authority surfaces read-only
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,re,urllib.error,urllib.parse,urllib.request
          API=os.environ['CF_API'];A=os.environ['ACCOUNT_ID'];W=os.environ['COMMERCE_WORKER']
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'Content-Type':'application/json','User-Agent':'MUSITU-Admin-Discovery/1.2'}
          def call(path,method='GET',obj=None):
              data=None if obj is None else json.dumps(obj).encode()
              q=urllib.request.Request(API+path,method=method,headers=H,data=data)
              try:
                  with urllib.request.urlopen(q,timeout=45) as r:raw=r.read();ct=r.headers.get('content-type','');code=r.status
              except urllib.error.HTTPError as e:raw=e.read();ct=e.headers.get('content-type','');code=e.code
              if not 200<=code<300:raise SystemExit(f'Cloudflare API failure http={code} path={path} body={raw[:300]!r}')
              return raw,ct
          raw,ct=call(f'/accounts/{A}/workers/scripts/{urllib.parse.quote(W,safe="")}')
          if 'multipart/' in ct.lower():
              msg=email.message_from_bytes((f'Content-Type: {ct}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw);parts=[]
              for p in msg.walk():
                  if p.is_multipart():continue
                  d=p.get_payload(decode=True) or b''
                  if b'MUSITU Chemistry Commerce' in d:parts.append(d)
              if len(parts)!=1:raise SystemExit('commerce module extraction mismatch')
              source=parts[0]
          else: source=raw
          text=source.decode('utf-8','ignore')
          settings=json.loads(call(f'/accounts/{A}/workers/scripts/{urllib.parse.quote(W,safe="")}/settings')[0] or b'{}').get('result') or {}
          bindings=settings.get('bindings') or []
          db=[b for b in bindings if b.get('name')=='CHEMISTRY_DB']
          if len(db)!=1:raise SystemExit('CHEMISTRY_DB binding mismatch')
          binding={k:db[0].get(k) for k in ('name','type','id','database_id') if db[0].get(k) is not None}
          dbs=json.loads(call(f'/accounts/{A}/d1/database?per_page=100')[0] or b'{}').get('result') or []
          candidate=str(db[0].get('id') or db[0].get('database_id') or '')
          matches=[x for x in dbs if str(x.get('uuid'))==candidate or str(x.get('name'))==candidate]
          if len(matches)!=1:
              available=[{'name':x.get('name'),'uuid':x.get('uuid')} for x in dbs]
              raise SystemExit('CHEMISTRY_DB resolution mismatch binding='+repr(binding)+' available='+repr(available))
          dbid=matches[0].get('uuid');dbname=matches[0].get('name')
          def d1(sql):
              raw,_=call(f'/accounts/{A}/d1/database/{urllib.parse.quote(str(dbid),safe="")}/query','POST',{'sql':sql})
              d=json.loads(raw or b'{}')
              if d.get('success') is False:raise SystemExit('D1 API success=false')
              result=d.get('result') or []
              if not result or not all(x.get('success') is True for x in result):raise SystemExit('D1 SELECT result failed')
              rows=[]
              for chunk in result:rows.extend(chunk.get('results') or [])
              return rows
          tables=[r.get('name') for r in d1("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY name")]
          schema={}
          for name in tables:
              if not re.fullmatch(r'[A-Za-z0-9_]+',str(name)):continue
              schema[name]=[{k:r.get(k) for k in ('name','type','notnull','pk')} for r in d1(f'PRAGMA table_info({name})')]
          route_literals=sorted(set(re.findall(r"['\"](/chemistry/[A-Za-z0-9_?&=./:-]+)['\"]",text)))
          fn=sorted(set(re.findall(r'\b(?:async\s+)?function\s+([A-Za-z0-9_]+)\s*\(',text)))
          markers={'issueLicense':'issueLicense' in fn,'fulfil':'fulfil' in fn,'createOrder':'createOrder' in fn,'orderByReference':'orderByReference' in fn,'quote':'quote' in fn,'secure_usd':"currency:'USD'" in text and 'const DIRECT_PAYNOW_FALLBACK_ACTIVE=false;' in text,'paynow_authority':'/internal/paynow/sign-initiate-chemistry' in text}
          def snippet(token,before=900,after=3200):
              i=text.find(token)
              if i<0:return None
              s=text[max(0,i-before):min(len(text),i+after)]
              s=re.sub(r'(?i)(authorization\s*[:=]\s*["\']?Bearer\s+)[A-Za-z0-9._~-]+',r'\1<redacted>',s)
              s=re.sub(r'(?i)(TOKEN\s*[=:]\s*)[^,;\n}]+',r'\1<redacted>',s)
              s=re.sub(r'(?i)(KEY\s*[=:]\s*)[^,;\n}]+',r'\1<redacted>',s)
              return s
          snippets={
            'claim_route':snippet("p==='/chemistry/claim'"),
            'claim_function':snippet('function claim'),
            'issue_license':snippet('function issueLicense'),
            'fulfil':snippet('function fulfil'),
            'checkout_route':snippet("p==='/chemistry/checkout/start'"),
          }
          out={'schema':'musitu.chemistry.admin.discovery.v2','commerce_worker_sha256':hashlib.sha256(source).hexdigest(),'database_name':dbname,'database_uuid':dbid,'database_binding':binding,'tables':tables,'table_schema':schema,'route_literals':route_literals[:200],'function_markers':markers,'snippets':snippets,'production_mutation':False,'customer_rows_read':False,'secret_values_read':False,'gate':'MUSITU_CHEMISTRY_ADMIN_DISCOVERY_PASS'}
          print(json.dumps(out,sort_keys=True))
          open('admin-discovery.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-admin-discovery
          path: admin-discovery.json
          retention-days: 30
          if-no-files-found: error
