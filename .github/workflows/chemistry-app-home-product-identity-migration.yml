name: MUSITU Chemistry Home Identity Migration

on:
  push:
    branches:
      - chemistry-national-rescue-growth-20260907
    paths:
      - .github/workflows/chemistry-app-home-product-identity-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "eaa8e939d0acbea7300ef39b21a68429d968497e"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/chemistry-app-home-product-identity-migration.yml"
          git diff --quiet HEAD^ HEAD -- commerce/chemistry

      - name: Patch Home identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('commerce/chemistry/storefront/app-shell.mjs')
          s=p.read_text()
          pairs=[
            ('Chemistry Rescue 2026','MUSITU Chemistry · Education Nexus'),
            ('One focused place to find what needs attention, revise deliberately, and prepare for exam pressure — without the public website chrome.','One focused place to revise deliberately, express Chemistry precisely, and use Rescue when you need targeted support — without the public website chrome.'),
            ('<a class="app-primary" href="/chemistry/app?view=rescue">Continue Chemistry Rescue</a>','<a class="app-primary" href="/chemistry/app?view=exam">Open Scientific Response OS</a>'),
            ('aria-label="MUSITU rescue method"','aria-label="MUSITU Chemistry workspace"'),
            ('<b>01</b><span>Diagnose what needs attention</span>','<b>01</b><span>Use Rescue when a topic needs targeted support</span>'),
            ('<div class="app-section-head"><h2>Quick access</h2><p>Stay inside MUSITU</p></div>','<div class="app-section-head"><h2>Quick access</h2><p>Stay inside MUSITU Chemistry</p></div>'),
            ('<a class="app-action primary" href="/chemistry/app?view=rescue">Continue Rescue</a><a class="app-action" href="/chemistry/app?view=exam">Open Scientific Response OS</a>','<a class="app-action primary" href="/chemistry/app?view=exam">Open Scientific Response OS</a><a class="app-action" href="/chemistry/app?view=rescue">Chemistry Rescue</a>'),
            ('<strong>Installed app mode:</strong> MUSITU runs from the same secure web origin, but the installed launch surface is separated from the public marketing site. Rescue, Prove, Premium and Help navigation stay inside the installed app surface. Payment and entitlement remain server-authoritative.','<strong>Installed app mode:</strong> MUSITU Chemistry runs from the same secure web origin, with a dedicated installed launch surface separated from the public marketing site. Home, Rescue, Prove, Premium and Help stay inside the installed app surface. Payment and entitlement remain server-authoritative.')
          ]
          for old,new in pairs:
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'anchor rejected count={count}: {old[:70]}')
              s=s.replace(old,new)
          p.write_text(s)
          print('CHEMISTRY_HOME_IDENTITY_PATCH=PASS')
          PY

      - name: Verify focused contract
        shell: bash
        run: |
          set -euo pipefail
          node --test commerce/chemistry/storefront/app-shell.test.mjs

      - name: Verify full storefront contract
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-home-base /tmp/mchem-home-source.zip
          mkdir -p /tmp/mchem-home-base
          cat commerce/chemistry/source.b64.* | base64 -d > /tmp/mchem-home-source.zip
          echo '5b2618499eed8dc90261bc4f8260246d5593534500dd2fb145f2d24b5c47754c  /tmp/mchem-home-source.zip' | sha256sum -c -
          unzip -q /tmp/mchem-home-source.zip -d /tmp/mchem-home-base
          echo '848e1cec17ec580822d36e595196cda5978713849e8b45c5bc8dc7fcf9765db8  /tmp/mchem-home-base/src/index.mjs' | sha256sum -c -
          cp /tmp/mchem-home-base/src/index.mjs commerce/chemistry/index.base.mjs
          python commerce/chemistry/patch_storefront.py
          python commerce/chemistry/patch_rescue_growth.py
          node --check commerce/chemistry/index.storefront-v3.mjs
          node --test commerce/chemistry/storefront/*.test.mjs
          sha256sum commerce/chemistry/index.storefront-v3.mjs

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "commerce/chemistry/storefront/app-shell.mjs"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add commerce/chemistry/storefront/app-shell.mjs
          git commit -m 'fix: make MUSITU Chemistry the installed Home identity'
          git push origin HEAD:chemistry-national-rescue-growth-20260907
