name: MUSITU Chemistry App Offline Reconnect Browser Acceptance

on:
  push:
    branches: [chemistry-national-rescue-growth-20260907]
    paths:
      - '.github/workflows/chemistry-app-offline-reconnect-browser-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-chemistry-app-offline-reconnect-browser-acceptance
  cancel-in-progress: false

jobs:
  offline-reconnect-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BASE_URL: https://payments.mftintelligence.com
      DEPLOYED_SOURCE_SHA: de92b9b75a585b4933645f5c33eca424ec518949
      SOURCE_ZIP_SHA256: 5b2618499eed8dc90261bc4f8260246d5593534500dd2fb145f2d24b5c47754c
      BASE_WORKER_SHA256: 848e1cec17ec580822d36e595196cda5978713849e8b45c5bc8dc7fcf9765db8
      RECORDED_WORKER_SHA256: 68786463cdb6527adac1df1ec9a3b3424f0e5cdb0544dbbf1a1c9ffaa3ec6967
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact deployed Chemistry source lineage
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            commerce/chemistry/storefront/app-shell.mjs
            commerce/chemistry/storefront/app-shell.test.mjs
            commerce/chemistry/storefront/app-shell-worker.test.mjs
            commerce/chemistry/storefront/offline-sw-v5.mjs
            commerce/chemistry/storefront/install.mjs
            commerce/chemistry/storefront/install-browser-matrix.mjs
            commerce/chemistry/patch_rescue_growth.py
          )
          for p in "${paths[@]}"; do
            cmp <(git show "$DEPLOYED_SOURCE_SHA:$p") "$p" || {
              echo "DEPLOYED_SOURCE_DRIFT $p" >&2
              exit 1
            }
          done
          rm -rf /tmp/mchem-offline-base /tmp/mchem-offline-source.zip
          mkdir -p /tmp/mchem-offline-base
          cat commerce/chemistry/source.b64.* | base64 -d > /tmp/mchem-offline-source.zip
          echo "$SOURCE_ZIP_SHA256  /tmp/mchem-offline-source.zip" | sha256sum -c -
          unzip -q /tmp/mchem-offline-source.zip -d /tmp/mchem-offline-base
          echo "$BASE_WORKER_SHA256  /tmp/mchem-offline-base/src/index.mjs" | sha256sum -c -
          cp /tmp/mchem-offline-base/src/index.mjs commerce/chemistry/index.base.mjs
          python commerce/chemistry/patch_storefront.py
          python commerce/chemistry/patch_rescue_growth.py
          echo "$RECORDED_WORKER_SHA256  commerce/chemistry/index.storefront-v3.mjs" | sha256sum -c -
          node --check commerce/chemistry/index.storefront-v3.mjs
          echo 'EXACT_CHEMISTRY_WORKER_RECONSTRUCTION=PASS'

      - name: Re-run Chemistry storefront and offline authority contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test commerce/chemistry/storefront/*.test.mjs

      - name: Exercise live offline shell sensitive boundaries and reconnect in Chrome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mchem-offline-evidence
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          DRIVER_BIN="$(command -v chromedriver || true)"
          test -n "$CHROME_BIN" || { echo 'Google Chrome missing from runner' >&2; exit 1; }
          test -n "$DRIVER_BIN" || { echo 'ChromeDriver missing from runner' >&2; exit 1; }
          "$CHROME_BIN" --version | tee /tmp/mchem-offline-evidence/chrome-version.txt
          "$DRIVER_BIN" --version | tee /tmp/mchem-offline-evidence/chromedriver-version.txt
          "$DRIVER_BIN" --port=9516 --log-path=/tmp/mchem-offline-evidence/chromedriver.log --verbose >/tmp/mchem-offline-evidence/chromedriver.stdout 2>&1 &
          DRIVER_PID=$!
          trap 'kill "$DRIVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            curl -fsS http://127.0.0.1:9516/status >/dev/null && break
            sleep .1
          done
          curl -fsS http://127.0.0.1:9516/status >/dev/null

          python - <<'PY'
          import json, os, secrets, time, urllib.error, urllib.request
          from pathlib import Path

          base=os.environ['BASE_URL']
          root='http://127.0.0.1:9516'
          nonce=secrets.token_hex(8)

          def live(path, marker):
              sep='&' if '?' in path else '?'
              req=urllib.request.Request(base+path+sep+'__mchem_offline='+nonce,headers={'Cache-Control':'no-cache','User-Agent':'MUSITU-Chemistry-Offline-Reconnect-Acceptance/2.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  text=r.read().decode('utf-8','replace')
                  if r.status!=200 or marker not in text: raise SystemExit('LIVE_EDGE_REJECTED '+path)

          live('/chemistry/app','Your Chemistry workspace.')
          live('/chemistry/sw.js','musitu-chemistry-install-v6')

          def wd(method,path,payload=None,timeout=45):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(root+path,method=method,data=data,headers={'Content-Type':'application/json;charset=UTF-8'})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r: obj=json.loads(r.read() or b'{}')
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f'WebDriver HTTP {e.code} {path}: '+e.read().decode('utf-8','replace')[:1200])
              value=obj.get('value')
              if isinstance(value,dict) and value.get('error'): raise RuntimeError('WebDriver error '+json.dumps(value,sort_keys=True))
              return value

          created=wd('POST','/session',{'capabilities':{'alwaysMatch':{
              'browserName':'chrome','pageLoadStrategy':'normal',
              'goog:chromeOptions':{'args':['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1280,900']}
          }}})
          sid=created.get('sessionId') if isinstance(created,dict) else None
          if not sid: raise SystemExit('CHROMEDRIVER_SESSION_ID_MISSING '+json.dumps(created,sort_keys=True))

          def js(script,args=None): return wd('POST',f'/session/{sid}/execute/sync',{'script':script,'args':args or []})
          def jsa(script,args=None): return wd('POST',f'/session/{sid}/execute/async',{'script':script,'args':args or []})
          def cdp(cmd,params=None): return wd('POST',f'/session/{sid}/goog/cdp/execute',{'cmd':cmd,'params':params or {}})

          def wait(marker):
              last=''
              for _ in range(180):
                  try:
                      last=js('return document.body ? document.body.innerText : ""') or ''
                      if js('return document.readyState')=='complete' and marker in last: return last
                  except Exception: pass
                  time.sleep(.1)
              raise RuntimeError('PAGE_READY_TIMEOUT '+marker+' '+repr(last[:500]))

          def nav(path,marker):
              wd('POST',f'/session/{sid}/url',{'url':base+path})
              text=wait(marker)
              state={
                  'path':js('return location.pathname+location.search'),
                  'marker':marker,
                  'app_shell':bool(js("return !!document.querySelector('.app-shell')")),
                  'footer_absent':bool(js("return document.querySelector('footer')===null")),
                  'navigator_online_observed':bool(js('return navigator.onLine')),
                  'text_sample':text[:180]
              }
              if not state['app_shell'] or not state['footer_absent']: raise SystemExit('APP_SHELL_STATE_REJECTED '+json.dumps(state,sort_keys=True))
              return state

          wd('POST',f'/session/{sid}/timeouts',{'script':30000,'pageLoad':45000,'implicit':0})
          online_home=nav('/chemistry/app','Your Chemistry workspace.')
          if js("return document.body.innerText.includes('MUSITU Chemistry') && document.body.innerText.includes('EDUCATION NEXUS')") is not True: raise SystemExit('APP_IDENTITY_REJECTED')
          if js("const x=document.getElementById('app-onboarding'); return !!x && !x.hidden"):
              if js("const b=document.getElementById('app-onboarding-skip'); if(!b)return false; b.click(); return true") is not True: raise SystemExit('ONBOARDING_NOT_ACTIONABLE')

          prime=jsa("""
            const done=arguments[arguments.length-1];
            (async()=>{try{
              if(!('serviceWorker' in navigator)||!('caches' in window)){done({ok:false,reason:'api-missing'});return}
              await navigator.serviceWorker.ready;
              const deadline=Date.now()+20000;
              while(Date.now()<deadline&&!navigator.serviceWorker.controller) await new Promise(r=>setTimeout(r,200));
              const c=await caches.open('musitu-chemistry-install-v6');
              const required=['/chemistry/app','/chemistry/app?view=rescue','/chemistry/app?view=premium','/chemistry/app?view=help'];
              const missing=[]; for(const p of required) if(!(await c.match(p))) missing.push(p);
              const sensitive=['/chemistry/checkout','/chemistry/return','/chemistry/claim','/chemistry/telemetry','/chemistry/plans'];
              const hits=[]; for(const n of await caches.keys()){const x=await caches.open(n);for(const p of sensitive) if(await x.match(p)) hits.push(n+':'+p)}
              done({ok:!!navigator.serviceWorker.controller&&missing.length===0&&hits.length===0,controller:!!navigator.serviceWorker.controller,missing,sensitive_hits:hits,cache_names:await caches.keys()});
            }catch(e){done({ok:false,error:String(e)})}})();
          """)
          if not isinstance(prime,dict) or prime.get('ok') is not True: raise SystemExit('SERVICE_WORKER_CACHE_PRIME_REJECTED '+json.dumps(prime,sort_keys=True))

          cdp('Network.enable')
          cdp('Network.emulateNetworkConditions',{'offline':True,'latency':0,'downloadThroughput':0,'uploadThroughput':0})
          time.sleep(.2)

          offline_states=[]
          for path,marker in [
              ('/chemistry/app','Your Chemistry workspace.'),
              ('/chemistry/app?view=rescue','Chemistry Rescue.'),
              ('/chemistry/app?view=premium','Unlock full mastery.'),
              ('/chemistry/app?view=help','Help without leaving MUSITU.')
          ]: offline_states.append(nav(path,marker))

          sensitive=jsa("""
            const done=arguments[arguments.length-1];
            (async()=>{const out=[];for(const p of ['/chemistry/checkout','/chemistry/return','/chemistry/claim','/chemistry/telemetry','/chemistry/plans']){
              try{const r=await fetch(p,{cache:'no-store'});out.push({path:p,resolved:true,status:r.status})}
              catch(e){out.push({path:p,resolved:false,error:e&&e.name?e.name:String(e)})}
            }done(out)})();
          """)
          if not isinstance(sensitive,list) or len(sensitive)!=5 or any(x.get('resolved') for x in sensitive): raise SystemExit('SENSITIVE_OFFLINE_AUTHORITY_REJECTED '+json.dumps(sensitive,sort_keys=True))

          cdp('Network.emulateNetworkConditions',{'offline':False,'latency':0,'downloadThroughput':-1,'uploadThroughput':-1})
          time.sleep(.2)
          update=jsa("""
            const done=arguments[arguments.length-1];
            (async()=>{try{const r=await navigator.serviceWorker.ready;await r.update();done({ok:true,controller:!!navigator.serviceWorker.controller,scriptURL:r.active&&r.active.scriptURL||null})}catch(e){done({ok:false,error:String(e)})}})();
          """)
          if not isinstance(update,dict) or update.get('ok') is not True: raise SystemExit('RECONNECT_SW_UPDATE_REJECTED '+json.dumps(update,sort_keys=True))

          reconnect=nav('/chemistry/app?__mchem_reconnect='+nonce,'Your Chemistry workspace.')
          if '/chemistry/rescue' in reconnect['path']: raise SystemExit('RECONNECT_REDIRECTED_TO_RESCUE '+reconnect['path'])
          health=jsa("""
            const done=arguments[arguments.length-1];
            fetch('/chemistry/healthz',{cache:'no-store'}).then(async r=>done({status:r.status,body:await r.json()})).catch(e=>done({error:String(e)}));
          """)
          hb=health.get('body',{}) if isinstance(health,dict) else {}
          if not isinstance(health,dict) or health.get('status')!=200 or hb.get('ok') is not True or hb.get('payment_authority_bound') is not True or hb.get('transport_bound') is not True or hb.get('raw_paynow_key_present') is not False: raise SystemExit('RECONNECT_HEALTH_REJECTED '+json.dumps(health,sort_keys=True))

          result={
              'schema':'musitu.chemistry.offline_reconnect_browser_acceptance.v2',
              'tested_at_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
              'github_sha':os.environ['GITHUB_SHA'],
              'deployed_source_sha':os.environ['DEPLOYED_SOURCE_SHA'],
              'recorded_production_worker_sha256':os.environ['RECORDED_WORKER_SHA256'],
              'online_home':online_home,
              'service_worker_prime':prime,
              'offline_app_views_pass':True,
              'offline_states':offline_states,
              'offline_proof_basis':'CDP transport blocking plus successful service-worker-cached app navigations; navigator.onLine is recorded but not used as a gate',
              'sensitive_routes_network_authoritative_in_browser_offline_mode':True,
              'sensitive_route_probe':sensitive,
              'reconnect_service_worker_update_requested':True,
              'reconnect_update_probe':update,
              'reconnect_reload_pass':True,
              'reconnect_home':reconnect,
              'reconnect_health_authority_pass':True,
              'physical_A8_update_reload_gate_closed':False,
              'physical_A9_native_navigation_gate_closed':False,
              'physical_device_claimed':False,
              'real_money_settlement_performed':False
          }
          Path('/tmp/mchem-offline-evidence/result.json').write_text(json.dumps(result,indent=2)+'\n')
          print('MUSITU_CHEMISTRY_OFFLINE_RECONNECT_BROWSER_ACCEPTANCE=PASS')
          print(json.dumps(result,sort_keys=True))
          try: wd('DELETE',f'/session/{sid}')
          except Exception: pass
          PY

      - name: Seal offline reconnect browser evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mchem-offline-evidence
          cat > provenance.json <<EOF
          {
            "schema": "musitu.chemistry.offline_reconnect_browser_acceptance.provenance.v2",
            "github_repository": "${GITHUB_REPOSITORY}",
            "github_sha": "${GITHUB_SHA}",
            "github_run_id": "${GITHUB_RUN_ID}",
            "github_run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "deployed_source_sha": "${DEPLOYED_SOURCE_SHA}",
            "recorded_production_worker_sha256": "${RECORDED_WORKER_SHA256}",
            "production_url": "${BASE_URL}/chemistry/app",
            "read_only_acceptance": true,
            "deployment_performed": false,
            "physical_device_claimed": false,
            "physical_A8_gate_closed": false,
            "physical_A9_gate_closed": false,
            "real_money_settlement_performed": false
          }
          EOF
          sha256sum result.json provenance.json chrome-version.txt chromedriver-version.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload immutable offline reconnect browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-offline-reconnect-browser-acceptance
          path: /tmp/mchem-offline-evidence/
          if-no-files-found: error
          retention-days: 90
