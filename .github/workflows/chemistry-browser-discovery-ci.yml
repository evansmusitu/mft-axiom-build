name: MUSITU Chemistry Browser Discovery Focused CI

on:
  push:
    branches: [chemistry-browser-discovery-20260907]
    paths:
      - 'commerce/chemistry/**'
      - '.github/workflows/chemistry-browser-discovery-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct deterministic Chemistry Worker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-discovery-base /tmp/mchem-discovery-source.zip
          mkdir -p /tmp/mchem-discovery-base
          cat commerce/chemistry/source.b64.* | base64 -d > /tmp/mchem-discovery-source.zip
          echo "5b2618499eed8dc90261bc4f8260246d5593534500dd2fb145f2d24b5c47754c  /tmp/mchem-discovery-source.zip" | sha256sum -c -
          unzip -q /tmp/mchem-discovery-source.zip -d /tmp/mchem-discovery-base
          echo "848e1cec17ec580822d36e595196cda5978713849e8b45c5bc8dc7fcf9765db8  /tmp/mchem-discovery-base/src/index.mjs" | sha256sum -c -
          cp /tmp/mchem-discovery-base/src/index.mjs commerce/chemistry/index.base.mjs
          python commerce/chemistry/patch_storefront.py
          python commerce/chemistry/patch_rescue_growth.py
          node --check commerce/chemistry/index.storefront-v3.mjs
      - name: Run focused browser discovery contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            commerce/chemistry/storefront/rescue-render.test.mjs \
            commerce/chemistry/storefront/rescue-worker.test.mjs
