name: MUSITU Chemistry Browser Discovery Guarded RUM Disable

on:
  push:
    branches: [chemistry-browser-discovery-20260907]
    paths: ['.github/workflows/chemistry-browser-discovery-disable-rum-guarded-temp.yml']

permissions:
  contents: read

jobs:
  mutate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_WORKER_SHA: 1af4a2a7d79de14d9539eda3d3e0f7917da98536c0d87c8253562893df9af707
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      RULESET_ID: 8e8a2552a8ee4bb383abbe0d748e1da5
      EXPECTED_PREDECESSOR_VERSION: '5'
      RULE_REF: musitu_chemistry_disable_cloudflare_rum
      RULE_EXPRESSION: '(http.host eq "payments.mftintelligence.com" and (raw.http.request.uri.path eq "/chemistry" or starts_with(raw.http.request.uri.path, "/chemistry/")))'
    steps:
      - uses: actions/checkout@v4

      - name: Preflight exact Worker and configuration predecessor
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-rum-mutation && mkdir -p /tmp/mchem-rum-mutation
          python - <<'PY'
          import email,hashlib,json,os,urllib.request
          from pathlib import Path
          API='https://api.cloudflare.com/client/v4'; ACCOUNT='93f395f5121954671f92fffa453d6b61'; WORKER='musitu-chemistry-commerce'
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Chemistry-RUM-Guard/1.0'}
          def get(url):
              q=urllib.request.Request(url,method='GET',headers=H)
              with urllib.request.urlopen(q,timeout=90) as r:return r.headers,r.read()
          h,raw=get(f'{API}/accounts/{ACCOUNT}/workers/scripts/{WORKER}')
          ctype=h.get('content-type','')
          if 'multipart/' in ctype.lower():
              msg=email.message_from_bytes((f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw); parts=[]
              for p in msg.walk():
                  if p.is_multipart():continue
                  d=p.get_payload(decode=True) or b''
                  if b'MUSITU Chemistry Commerce' in d:parts.append(d)
              if len(parts)!=1:raise SystemExit('worker extraction mismatch')
              raw=parts[0]
          livehash=hashlib.sha256(raw).hexdigest()
          if livehash!=os.environ['EXPECTED_WORKER_SHA']:raise SystemExit('LIVE_WORKER_HASH_MISMATCH '+livehash)
          _,body=get(f"{API}/zones/{os.environ['ZONE_ID']}/rulesets/{os.environ['RULESET_ID']}")
          payload=json.loads(body); rs=payload.get('result') or {}
          if payload.get('success') is not True or rs.get('id')!=os.environ['RULESET_ID'] or rs.get('phase')!='http_config_settings' or rs.get('kind')!='zone':raise SystemExit('ruleset identity mismatch')
          if str(rs.get('version'))!=os.environ['EXPECTED_PREDECESSOR_VERSION']:raise SystemExit('RULESET_VERSION_DRIFT '+str(rs.get('version')))
          expected={
            'mft_payments_machine_transport':('15ad7cfa5d20422cb585fee04ea2d574','http.host eq "payments.mftintelligence.com"'),
            'mft_axiom_stage_machine_transport':('57f8a7896c0246a0a16b7a4fa018cf13','http.host eq "axiom-stage.mftintelligence.com"'),
            'musitu_axiom_prod_machine_transport':('954764cb51104a808c3d0da6f8695d9a','http.host eq "axiom.mftintelligence.com"'),
            'musitu_axiom_mcp_machine_transport':('c792da7cea7e4584b13296ecd7f38f87','http.host eq "mcp.mftintelligence.com"'),
            'musitu_axiom_oauth_machine_transport':('fa9bb46869114c7fb86add03f5151cf2','http.host eq "auth.mftintelligence.com"')}
          rules=rs.get('rules') or []
          if len(rules)!=5:raise SystemExit('unexpected predecessor rule count '+str(len(rules)))
          snapshot=[]
          for rule in rules:
              ref=rule.get('ref')
              if ref not in expected:raise SystemExit('unexpected predecessor rule '+str(ref))
              rid,expr=expected[ref]
              if rule.get('id')!=rid or rule.get('expression')!=expr or rule.get('action')!='set_config' or rule.get('enabled') is not True:raise SystemExit('predecessor rule drift '+str(ref))
              if (rule.get('action_parameters') or {}).get('disable_rum') is not None:raise SystemExit('pre-existing disable_rum '+str(ref))
              snapshot.append({'id':rule.get('id'),'ref':ref,'expression':rule.get('expression'),'action':rule.get('action'),'enabled':rule.get('enabled'),'action_parameters':rule.get('action_parameters') or {}})
          if any(r.get('ref')==os.environ['RULE_REF'] for r in rules):raise SystemExit('target rule already exists')
          ev={'schema':'musitu.chemistry.browser_discovery.rum_mutation_preflight.v1','live_worker_sha256':livehash,'ruleset_id':rs.get('id'),'ruleset_version':str(rs.get('version')),'predecessor_rules':snapshot,'predecessor_rule_count':len(snapshot),'request_methods':['GET'],'production_mutation':False,'gate':'MUSITU_CHEMISTRY_RUM_MUTATION_PREFLIGHT_PASS'}
          Path('/tmp/mchem-rum-mutation/preflight.json').write_text(json.dumps(ev,indent=2,sort_keys=True)+'\n')
          Path('/tmp/mchem-rum-mutation/predecessor-rules.json').write_text(json.dumps(snapshot,indent=2,sort_keys=True)+'\n')
          print(json.dumps(ev,sort_keys=True))
          PY

      - name: Add only scoped Chemistry disable_rum configuration rule
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.error,urllib.request
          from pathlib import Path
          API='https://api.cloudflare.com/client/v4'; H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'Content-Type':'application/json','User-Agent':'MUSITU-Chemistry-RUM-Guard/1.0'}
          base=f"{API}/zones/{os.environ['ZONE_ID']}/rulesets/{os.environ['RULESET_ID']}"
          def req(url,method='GET',obj=None):
              data=None if obj is None else json.dumps(obj,separators=(',',':')).encode()
              q=urllib.request.Request(url,method=method,headers=H,data=data)
              try:
                  with urllib.request.urlopen(q,timeout=90) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f'{method} HTTP {e.code}: '+e.read().decode('utf-8','replace')[:1000])
          body={'action':'set_config','action_parameters':{'disable_rum':True},'expression':os.environ['RULE_EXPRESSION'],'description':'MUSITU Chemistry: disable Cloudflare Web Analytics injection on /chemistry only; preserve strict self-only CSP and same-origin aggregate field telemetry','enabled':True,'ref':os.environ['RULE_REF']}
          created=None
          try:
              out=req(base+'/rules','POST',body)
              if out.get('success') is not True:raise RuntimeError('create rule unsuccessful')
              result=out.get('result') or {}; created_id=result.get('id')
              if not created_id:raise RuntimeError('created rule id absent')
              created={'id':created_id,'ref':result.get('ref'),'expression':result.get('expression'),'action':result.get('action'),'enabled':result.get('enabled'),'disable_rum':(result.get('action_parameters') or {}).get('disable_rum')}
              Path('/tmp/mchem-rum-mutation/created-rule.json').write_text(json.dumps(created,indent=2,sort_keys=True)+'\n')
              with open(os.environ['GITHUB_ENV'],'a') as f:f.write('CREATED_RULE_ID='+created_id+'\n')
              current=req(base).get('result') or {}; rules=current.get('rules') or []
              prior=json.load(open('/tmp/mchem-rum-mutation/predecessor-rules.json'))
              byid={r.get('id'):r for r in rules}
              for p in prior:
                  r=byid.get(p['id'])
                  if not r or r.get('ref')!=p['ref'] or r.get('expression')!=p['expression'] or r.get('action')!=p['action'] or r.get('enabled')!=p['enabled'] or (r.get('action_parameters') or {})!=p['action_parameters']:raise RuntimeError('predecessor changed '+p['ref'])
              matches=[r for r in rules if r.get('ref')==os.environ['RULE_REF']]
              if len(matches)!=1:raise RuntimeError('target rule cardinality '+str(len(matches)))
              r=matches[0]
              if r.get('id')!=created_id or r.get('expression')!=os.environ['RULE_EXPRESSION'] or r.get('action')!='set_config' or r.get('enabled') is not True or (r.get('action_parameters') or {}).get('disable_rum') is not True:raise RuntimeError('target rule contract mismatch')
              ev={'schema':'musitu.chemistry.browser_discovery.rum_mutation.v1','ruleset_id':current.get('id'),'predecessor_version':os.environ['EXPECTED_PREDECESSOR_VERSION'],'resulting_version':str(current.get('version')),'created_rule':created,'predecessor_rules_preserved':True,'production_mutation':True,'mutation_scope':'Cloudflare configuration rule only','worker_deployed':False,'payment_configuration_changed':False,'gate':'MUSITU_CHEMISTRY_RUM_SCOPED_RULE_CREATED_PASS'}
              Path('/tmp/mchem-rum-mutation/mutation.json').write_text(json.dumps(ev,indent=2,sort_keys=True)+'\n')
              print(json.dumps(ev,sort_keys=True))
          except Exception:
              if created and created.get('id'):
                  try:req(base+'/rules/'+created['id'],'DELETE')
                  except Exception as rollback_error:print('ROLLBACK_ERROR='+repr(rollback_error))
              raise
          PY

      - name: Persistent Chrome proves manifest installability and zero injected beacon
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright >/dev/null
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          export CHROME_PATH
          rm -rf /tmp/mchem-rum-chrome-profile
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const context=await chromium.launchPersistentContext('/tmp/mchem-rum-chrome-profile',{headless:true,executablePath:process.env.CHROME_PATH,viewport:{width:390,height:844},args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=context.pages()[0]||await context.newPage();
          const consoleErrors=[]; const requests=[];
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          page.on('request',r=>requests.push(r.url()));
          let response;
          for(let attempt=1;attempt<=5;attempt++){
            consoleErrors.length=0; requests.length=0;
            response=await page.goto('https://payments.mftintelligence.com/chemistry/rescue?src=direct&__mchem_rum_guard='+Date.now()+'-'+attempt,{waitUntil:'networkidle'});
            if(response&&response.status()===200&&!requests.some(x=>x.includes('static.cloudflareinsights.com/beacon')))break;
            await page.waitForTimeout(1500);
          }
          if(!response||response.status()!==200)throw new Error('live Rescue HTTP '+response?.status());
          const csp=response.headers()['content-security-policy']||'';
          if(!csp.includes("manifest-src 'self'")||!csp.includes("script-src 'self'")||!csp.includes("style-src 'self'")||!csp.includes("connect-src 'self'")||csp.includes('unsafe-inline')||csp.includes('unsafe-eval')||csp.includes('static.cloudflareinsights.com'))throw new Error('production CSP contract '+csp);
          const dom=await page.evaluate(()=>{const install=document.getElementById('install-rescue');return {canonical:document.querySelector('link[rel=canonical]')?.href||'',manifest:document.querySelector('link[rel=manifest]')?.getAttribute('href')||'',robots:document.querySelector('meta[name=robots]')?.content||'',installExists:!!install,installHidden:install?.hidden===true,cloudflareBeaconScripts:document.querySelectorAll('script[src*="static.cloudflareinsights.com"]').length}});
          if(dom.canonical!=='https://payments.mftintelligence.com/chemistry/rescue'||dom.manifest!=='/chemistry/manifest.webmanifest'||!dom.robots.includes('index,follow')||dom.installExists!==true||dom.cloudflareBeaconScripts!==0)throw new Error('live DOM discovery contract '+JSON.stringify(dom));
          const client=await context.newCDPSession(page); await client.send('Page.enable');
          const appManifest=await client.send('Page.getAppManifest');
          if(appManifest.url!=='https://payments.mftintelligence.com/chemistry/manifest.webmanifest')throw new Error('manifest URL '+JSON.stringify(appManifest));
          if(!Array.isArray(appManifest.errors)||appManifest.errors.length)throw new Error('manifest processing errors '+JSON.stringify(appManifest.errors));
          const manifest=JSON.parse(appManifest.data||'{}');
          if(manifest.name!=='MUSITU Chemistry Rescue 2026'||manifest.short_name!=='MUSITU Chemistry'||manifest.start_url!=='/chemistry/rescue?src=direct'||manifest.scope!=='/chemistry/'||manifest.display!=='standalone'||manifest.prefer_related_applications!==false||!Array.isArray(manifest.icons)||manifest.icons.length!==2)throw new Error('processed manifest contract '+JSON.stringify(manifest));
          const installability=await client.send('Page.getInstallabilityErrors');
          const installabilityErrors=Array.isArray(installability.installabilityErrors)?installability.installabilityErrors:[];
          if(installabilityErrors.length)throw new Error('Chrome installability errors '+JSON.stringify(installabilityErrors));
          const relevantErrors=consoleErrors.filter(x=>/manifest|content security policy|csp|cloudflareinsights/i.test(x));
          if(relevantErrors.length)throw new Error('browser publication console errors '+JSON.stringify(relevantErrors));
          const beaconRequests=requests.filter(x=>x.includes('static.cloudflareinsights.com/beacon'));
          if(beaconRequests.length)throw new Error('Cloudflare beacon still requested');
          const out={schema:'musitu.chemistry.browser_discovery.rum_scoped_live_browser.v1',live_url:page.url(),manifest_url:appManifest.url,manifest_errors:appManifest.errors,manifest_parsed:manifest,installability_errors:installabilityErrors,production_csp:csp,dom,browser_install_prompt_available:dom.installHidden===false,cloudflare_beacon_requests:beaconRequests,csp_or_manifest_console_errors:relevantErrors,persistent_context:true,pass:true,gate:'MUSITU_CHEMISTRY_BROWSER_DISCOVERY_RUM_SCOPED_LIVE_BROWSER_PASS'};
          fs.writeFileSync('/tmp/mchem-rum-mutation/browser.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out));
          await context.close();
          JS

      - name: Re-read Worker and ruleset after browser proof
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,urllib.request
          from pathlib import Path
          API='https://api.cloudflare.com/client/v4'; ACCOUNT='93f395f5121954671f92fffa453d6b61'; H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Chemistry-RUM-Guard/1.0'}
          def read(url):
              q=urllib.request.Request(url,method='GET',headers=H)
              with urllib.request.urlopen(q,timeout=90) as r:return r.headers,r.read()
          h,raw=read(f'{API}/accounts/{ACCOUNT}/workers/scripts/musitu-chemistry-commerce'); ctype=h.get('content-type','')
          if 'multipart/' in ctype.lower():
              msg=email.message_from_bytes((f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw); parts=[]
              for p in msg.walk():
                  if p.is_multipart():continue
                  d=p.get_payload(decode=True) or b''
                  if b'MUSITU Chemistry Commerce' in d:parts.append(d)
              if len(parts)!=1:raise SystemExit('worker extraction mismatch')
              raw=parts[0]
          digest=hashlib.sha256(raw).hexdigest()
          if digest!=os.environ['EXPECTED_WORKER_SHA']:raise SystemExit('LIVE_WORKER_HASH_MISMATCH '+digest)
          _,b=read(f"{API}/zones/{os.environ['ZONE_ID']}/rulesets/{os.environ['RULESET_ID']}"); rs=json.loads(b).get('result') or {}; rules=rs.get('rules') or []
          target=[r for r in rules if r.get('ref')==os.environ['RULE_REF']]
          if len(target)!=1 or target[0].get('id')!=os.environ['CREATED_RULE_ID'] or target[0].get('expression')!=os.environ['RULE_EXPRESSION'] or (target[0].get('action_parameters') or {}).get('disable_rum') is not True:raise SystemExit('final rule proof failed')
          ev={'schema':'musitu.chemistry.browser_discovery.rum_scoped_final.v1','live_worker_sha256':digest,'ruleset_id':rs.get('id'),'ruleset_version':str(rs.get('version')),'created_rule_id':target[0].get('id'),'created_rule_ref':target[0].get('ref'),'expression':target[0].get('expression'),'disable_rum':True,'worker_bytes_changed':False,'production_mutation':True,'mutation_scope':'Cloudflare configuration rule only','rollback_available':True,'rollback_used':False,'real_money_settlement_observed':False,'real_money_settlement_claimed':False,'field_inp_claimed':False,'gate':'MUSITU_CHEMISTRY_BROWSER_DISCOVERY_RUM_SCOPED_FINAL_PASS'}
          Path('/tmp/mchem-rum-mutation/final.json').write_text(json.dumps(ev,indent=2,sort_keys=True)+'\n'); print(json.dumps(ev,sort_keys=True))
          PY

      - name: Roll back exact new rule on failure
        if: failure() && env.CREATED_RULE_ID != ''
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          API='https://api.cloudflare.com/client/v4'; H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Chemistry-RUM-Rollback/1.0'}
          base=f"{API}/zones/{os.environ['ZONE_ID']}/rulesets/{os.environ['RULESET_ID']}"
          q=urllib.request.Request(base+'/rules/'+os.environ['CREATED_RULE_ID'],method='DELETE',headers=H)
          with urllib.request.urlopen(q,timeout=90) as r:out=json.load(r)
          if out.get('success') is not True:raise SystemExit('rollback delete failed')
          q=urllib.request.Request(base,method='GET',headers=H)
          with urllib.request.urlopen(q,timeout=90) as r:rs=json.load(r).get('result') or {}
          if any(x.get('id')==os.environ['CREATED_RULE_ID'] or x.get('ref')==os.environ['RULE_REF'] for x in rs.get('rules') or []):raise SystemExit('rollback verification failed')
          ev={'schema':'musitu.chemistry.browser_discovery.rum_rollback.v1','deleted_rule_id':os.environ['CREATED_RULE_ID'],'rollback_verified':True,'gate':'MUSITU_CHEMISTRY_RUM_ROLLBACK_PASS'}
          Path('/tmp/mchem-rum-mutation/rollback.json').write_text(json.dumps(ev,indent=2,sort_keys=True)+'\n'); print(json.dumps(ev,sort_keys=True))
          PY

      - name: Seal guarded mutation evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mchem-rum-mutation
          sha256sum *.json > SHA256SUMS.txt
          cat final.json

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: musitu-chemistry-browser-discovery-rum-scoped-guarded
          path: /tmp/mchem-rum-mutation
          retention-days: 90
          if-no-files-found: error
