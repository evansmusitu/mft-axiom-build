name: MUSITU Chemistry Browser Discovery Guarded Deploy

on:
  push:
    branches: [chemistry-browser-discovery-20260907]
    paths: ['.github/workflows/chemistry-browser-discovery-guarded-deploy.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: musitu-chemistry-global-storefront-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIOUS_WORKER_SHA: 7b17d37b514913a59a66fa1339ced59ab0b06ff9759ef51cd5ec16d4e5e20af0
      CANDIDATE_WORKER_SHA: 1af4a2a7d79de14d9539eda3d3e0f7917da98536c0d87c8253562893df9af707
      PREFLIGHT_RUN_ID: '34101069516'
      PREFLIGHT_HEAD_SHA: 1f1426d5fe695577fb578bf1358ebebdf32f668a
      PREFLIGHT_ARTIFACT_ID: '10010507729'
      PREFLIGHT_ARTIFACT_SHA256: 079e83c2101b37d17cd120f54dc0f7a1641afa91b2bebbf2e1b1ae920c649b42
      WEB_VITALS_SHA256: 6b3e4ac9d6f6abd4ea1810621668bec7d7adb121279570e6870be4fb98ab3909
      LICENCE_KEY_ID: chem-lic-2026-6783aa7535d1
      APK_SHA256: 055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d
    steps:
      - uses: actions/checkout@v4

      - name: Prove exact browser discovery preflight and rebuild candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-discovery-deploy /tmp/mchem-discovery-base /tmp/mchem-discovery-source.zip /tmp/mchem-discovery-core
          mkdir -p /tmp/mchem-discovery-deploy /tmp/mchem-discovery-base /tmp/mchem-discovery-core/src
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}" > /tmp/mchem-discovery-deploy/preflight-run.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}/artifacts?per_page=100" > /tmp/mchem-discovery-deploy/preflight-artifacts.json
          python - <<'PY'
          import json,os
          r=json.load(open('/tmp/mchem-discovery-deploy/preflight-run.json'))
          checks={
            'success':r.get('conclusion')=='success',
            'sha':r.get('head_sha')==os.environ['PREFLIGHT_HEAD_SHA'],
            'branch':r.get('head_branch')=='chemistry-browser-discovery-20260907',
            'name':r.get('name')=='MUSITU Chemistry Browser Discovery Full Preflight'
          }
          if not all(checks.values()): raise SystemExit('browser discovery preflight proof failed '+json.dumps(checks,sort_keys=True))
          arts=json.load(open('/tmp/mchem-discovery-deploy/preflight-artifacts.json')).get('artifacts',[])
          m=[x for x in arts if str(x.get('id'))==os.environ['PREFLIGHT_ARTIFACT_ID']]
          if len(m)!=1 or m[0].get('expired') is not False or m[0].get('name')!='musitu-chemistry-browser-discovery-full-preflight': raise SystemExit('browser discovery preflight artifact identity failed')
          digest=str(m[0].get('digest') or '').removeprefix('sha256:')
          if digest!=os.environ['PREFLIGHT_ARTIFACT_SHA256']: raise SystemExit('browser discovery preflight artifact digest failed '+digest)
          print('BROWSER_DISCOVERY_FULL_PREFLIGHT_PROOF=PASS')
          PY
          cat commerce/chemistry/source.b64.* | base64 -d > /tmp/mchem-discovery-source.zip
          echo "5b2618499eed8dc90261bc4f8260246d5593534500dd2fb145f2d24b5c47754c  /tmp/mchem-discovery-source.zip" | sha256sum -c -
          unzip -q /tmp/mchem-discovery-source.zip -d /tmp/mchem-discovery-base
          echo "848e1cec17ec580822d36e595196cda5978713849e8b45c5bc8dc7fcf9765db8  /tmp/mchem-discovery-base/src/index.mjs" | sha256sum -c -
          echo "$WEB_VITALS_SHA256  commerce/chemistry/storefront/web-vitals-6.0.1.iife.js" | sha256sum -c -
          cp /tmp/mchem-discovery-base/src/index.mjs commerce/chemistry/index.base.mjs
          python commerce/chemistry/patch_storefront.py
          python commerce/chemistry/patch_rescue_growth.py
          echo "$CANDIDATE_WORKER_SHA  commerce/chemistry/index.storefront-v3.mjs" | sha256sum -c -
          node --check commerce/chemistry/index.storefront-v3.mjs
          node --test commerce/chemistry/storefront/*.test.mjs
          cp commerce/chemistry/index.storefront-v3.mjs /tmp/mchem-discovery-core/src/index.mjs
          cp -a /tmp/mchem-discovery-base/test /tmp/mchem-discovery-core/
          cp /tmp/mchem-discovery-base/package.json /tmp/mchem-discovery-core/
          cd /tmp/mchem-discovery-core && npm test && npm run check

      - name: Guarded browser discovery cutover with rollback
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,secrets,time,urllib.error,urllib.parse,urllib.request
          from pathlib import Path
          API='https://api.cloudflare.com/client/v4'; AID='93f395f5121954671f92fffa453d6b61'; WORKER='musitu-chemistry-commerce'; BASE='https://payments.mftintelligence.com'
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Chemistry-Browser-Discovery-Deploy/1.0'}
          OLD=os.environ['PREVIOUS_WORKER_SHA']; NEW=os.environ['CANDIDATE_WORKER_SHA']; KEY=os.environ['LICENCE_KEY_ID']; APK=os.environ['APK_SHA256']; VITALS=os.environ['WEB_VITALS_SHA256']
          candidate=Path('commerce/chemistry/index.storefront-v3.mjs').read_bytes()
          if hashlib.sha256(candidate).hexdigest()!=NEW: raise SystemExit('candidate hash mismatch')

          def req(url,method='GET',headers=None,body=None,timeout=60):
              q=urllib.request.Request(url,method=method,headers=dict(headers or {}),data=body)
              try:
                  with urllib.request.urlopen(q,timeout=timeout) as r:return r.status,r.headers,r.read()
              except urllib.error.HTTPError as e:return e.code,e.headers,e.read()

          def public(path,accept='*/*',nonce=None):
              if nonce: path += ('&' if '?' in path else '?')+'__mchem_discovery='+urllib.parse.quote(nonce)
              return req(BASE+path,headers={'Accept':accept,'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache','User-Agent':'MUSITU-Discovery-Live/'+secrets.token_hex(4)})

          def extract(raw,ctype,needle):
              if 'multipart/' not in (ctype or '').lower(): return raw
              msg=email.message_from_bytes((f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw); parts=[]
              for p in msg.walk():
                  if p.is_multipart(): continue
                  d=p.get_payload(decode=True) or b''
                  if needle.encode() in d: parts.append(d)
              if len(parts)!=1: raise RuntimeError('module extraction mismatch')
              return parts[0]

          def read_worker():
              c,h,b=req(f'{API}/accounts/{AID}/workers/scripts/{WORKER}',headers=H)
              if c!=200: raise RuntimeError(f'worker read HTTP {c}')
              return extract(b,h.get('content-type',''),'MUSITU Chemistry Commerce')

          def upload(source):
              boundary='----MUSITU'+secrets.token_hex(16); meta=json.dumps({'main_module':'index.mjs'},separators=(',',':'))
              body=(f'--{boundary}\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n{meta}\r\n--{boundary}\r\nContent-Disposition: form-data; name="index.mjs"; filename="index.mjs"\r\nContent-Type: application/javascript+module\r\n\r\n').encode()+source+f'\r\n--{boundary}--\r\n'.encode()
              h=dict(H); h['Content-Type']='multipart/form-data; boundary='+boundary
              c,_,b=req(f'{API}/accounts/{AID}/workers/scripts/{WORKER}/content','PUT',h,body)
              if not 200<=c<300: raise RuntimeError(f'content upload HTTP {c}: '+b[:300].decode('utf-8','ignore'))

          def strict(h):
              csp=h.get('content-security-policy') or ''
              return ("style-src 'self'" in csp and "script-src 'self'" in csp and "connect-src 'self'" in csp and "manifest-src 'self'" in csp and
                      'unsafe-inline' not in csp and 'unsafe-eval' not in csp and 'http://' not in csp and 'https://' not in csp and
                      (h.get('referrer-policy') or '')=='no-referrer' and (h.get('x-frame-options') or '')=='DENY' and (h.get('x-content-type-options') or '')=='nosniff')

          def check_png(data,size):
              if len(data)<24 or data[:8]!=bytes([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]): raise RuntimeError('PNG signature')
              if int.from_bytes(data[16:20],'big')!=size or int.from_bytes(data[20:24],'big')!=size: raise RuntimeError('PNG dimensions '+str(size))

          lifecycle=[
            ('/chemistry/','Know what you don’t know'),('/chemistry/plans','Choose access without guessing'),('/chemistry/privacy','Anonymous experience measurement'),('/chemistry/experience','Real-user experience evidence'),('/chemistry/support','payment-status link created during checkout'),('/chemistry/verify','Verify this MUSITU release'),('/chemistry/releases','Release notes'),('/chemistry/terms','Premium access is granted only by a valid MUSITU-signed licence after verified settlement'),('/chemistry/rescue?src=wa_student','MUSITU Chemistry Rescue 2026'),('/chemistry/rescue/teachers','Teacher Rescue Kit'),('/chemistry/rescue/schools','School Rescue Pack'),('/chemistry/rescue/ambassadors','Rescue Ambassador Kit')]

          original=read_worker(); oldhash=hashlib.sha256(original).hexdigest()
          if oldhash!=OLD: raise SystemExit('LIVE_SOURCE_DRIFT '+oldhash)
          hc,_,hb=public('/chemistry/healthz','application/json','pre-health-'+secrets.token_hex(4)); health=json.loads(hb or b'{}')
          if hc!=200 or health.get('ok') is not True or health.get('licence_key_id')!=KEY or health.get('raw_paynow_key_present') is not False or health.get('payment_authority_bound') is not True or health.get('transport_bound') is not True: raise SystemExit('predeploy health boundary failed')
          cc,_,cb=public('/chemistry/catalog','application/json','pre-catalog-'+secrets.token_hex(4)); cat=json.loads(cb or b'{}'); ids=[p.get('id') for p in cat.get('plans') or []]
          if cc!=200 or ids!=['term','annual','lifetime','family','tutor','school']: raise SystemExit('predeploy catalog boundary failed')
          ac,_,apk=public('/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk','application/vnd.android.package-archive','pre-apk-'+secrets.token_hex(4))
          if ac!=200 or len(apk)!=5314934 or hashlib.sha256(apk).hexdigest()!=APK: raise SystemExit('predeploy APK boundary failed')

          upload(candidate); rollback_used=False; attempts=0; streak=0; required_streak=6; rays=[]
          try:
              if hashlib.sha256(read_worker()).hexdigest()!=NEW: raise RuntimeError('Cloudflare source API did not retain discovery candidate')
              for attempt in range(1,121):
                  attempts=attempt; all_ok=True; sweep=[]
                  for idx,(path,needle) in enumerate(lifecycle):
                      c,h,b=public(path,'text/html',f'sweep-{attempt}-{idx}-{secrets.token_hex(3)}'); t=b.decode('utf-8','replace'); ray=h.get('cf-ray') or ''
                      if ray: sweep.append(ray)
                      if c!=200 or needle not in t or not strict(h): all_ok=False; break
                  if all_ok:
                      streak+=1; rays.extend(sweep); print(f'DISCOVERY_EDGE_SWEEP_PASS attempt={attempt} streak={streak} rays={json.dumps(sweep)}')
                      if streak>=required_streak: break
                  else: streak=0
                  time.sleep(1.0)
              if streak<required_streak: raise RuntimeError(f'sustained edge convergence timeout streak={streak} attempts={attempts}')

              c,h,b=public('/chemistry/rescue?src=direct','text/html','metadata-'+secrets.token_hex(5)); html=b.decode('utf-8','replace')
              required_html=[
                '<link rel="canonical" href="https://payments.mftintelligence.com/chemistry/rescue">',
                '<meta name="robots" content="index,follow,max-image-preview:large">',
                '<meta property="og:title" content="MUSITU Chemistry Rescue 2026">',
                '<meta name="twitter:card" content="summary">',
                '<link rel="manifest" href="/chemistry/manifest.webmanifest">',
                '<link rel="sitemap" type="application/xml" href="https://payments.mftintelligence.com/chemistry/sitemap.xml">',
                '<script type="application/ld+json">'
              ]
              if c!=200 or not strict(h) or any(x not in html for x in required_html): raise RuntimeError('live discovery metadata failed')
              import re
              m=re.search(r'<script type="application/ld\+json">([^<]+)</script>',html)
              if not m: raise RuntimeError('structured data missing')
              ld=json.loads(m.group(1))
              if ld.get('@type')!='SoftwareApplication' or ld.get('applicationCategory')!='EducationalApplication' or ld.get('operatingSystem')!='Android' or ld.get('isAccessibleForFree') is not True or 'aggregateRating' in ld or 'review' in ld: raise RuntimeError('structured data contract failed')

              mc,mh,mb=public('/chemistry/manifest.webmanifest','application/manifest+json','manifest-'+secrets.token_hex(4)); manifest=json.loads(mb or b'{}')
              if mc!=200 or not (mh.get('content-type') or '').startswith('application/manifest+json') or manifest.get('name')!='MUSITU Chemistry Rescue 2026' or manifest.get('start_url')!='/chemistry/rescue?src=direct' or manifest.get('scope')!='/chemistry/' or manifest.get('display')!='standalone' or manifest.get('prefer_related_applications') is not False or len(manifest.get('icons') or [])!=2: raise RuntimeError('manifest contract failed')
              for path,size in [('/chemistry/assets/musitu-chemistry-192.png',192),('/chemistry/assets/musitu-chemistry-512.png',512)]:
                  ic,ih,ib=public(path,'image/png','icon-'+str(size)+'-'+secrets.token_hex(3))
                  if ic!=200 or (ih.get('content-type') or '')!='image/png': raise RuntimeError('icon response failed '+path)
                  check_png(ib,size)
              jc,_,jb=public('/chemistry/assets/rescue-install.js','application/javascript','install-'+secrets.token_hex(4)); js=jb.decode('utf-8','replace')
              if jc!=200 or 'beforeinstallprompt' not in js or '.prompt()' not in js or any(x in js for x in ['Notification.requestPermission','pushManager','document.cookie','localStorage','sessionStorage']): raise RuntimeError('install JS contract failed')
              sc,_,sb=public('/chemistry/sitemap.xml','application/xml','sitemap-'+secrets.token_hex(4)); st=sb.decode('utf-8','replace')
              if sc!=200 or '/chemistry/rescue' not in st: raise RuntimeError('sitemap discovery coverage failed')
              vc,_,vb=public('/chemistry/assets/web-vitals-6.0.1.iife.js','application/javascript','vitals-'+secrets.token_hex(4))
              if vc!=200 or len(vb)!=8987 or hashlib.sha256(vb).hexdigest()!=VITALS: raise RuntimeError('web-vitals asset changed')
              rc,_,rb=public('/chemistry/support','text/html','recovery-'+secrets.token_hex(4)); rt=rb.decode('utf-8','replace')
              if rc!=200 or 'href="/chemistry/return"' in rt or 'contact MUSITU support' not in rt: raise RuntimeError('recovery hardening changed')
              hc,_,hb=public('/chemistry/healthz','application/json','health-'+secrets.token_hex(4)); health2=json.loads(hb or b'{}')
              if hc!=200 or health2.get('ok') is not True or health2.get('licence_key_id')!=KEY or health2.get('raw_paynow_key_present') is not False or health2.get('payment_authority_bound') is not True or health2.get('transport_bound') is not True: raise RuntimeError('postdeploy health boundary failed')
              cc,_,cb=public('/chemistry/catalog','application/json','catalog-'+secrets.token_hex(4)); cat2=json.loads(cb or b'{}'); ids2=[p.get('id') for p in cat2.get('plans') or []]
              if cc!=200 or ids2!=ids: raise RuntimeError('catalog changed')
              ac,ah,apk2=public('/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk','application/vnd.android.package-archive','apk-'+secrets.token_hex(4)); digest=hashlib.sha256(apk2).hexdigest()
              if ac!=200 or len(apk2)!=5314934 or digest!=APK or 'MUSITU_Chemistry_Mastery_1.2.0.apk' not in (ah.get('content-disposition') or ''): raise RuntimeError('APK changed')
              ec,_,eb=public('/chemistry/experience.json','application/json','experience-'+secrets.token_hex(4)); experience=json.loads(eb or b'{}')
              if ec!=200 or experience.get('minimum_public_sample')!=100 or experience.get('status') not in ('insufficient_field_sample','field_core_web_vitals_available'): raise RuntimeError('experience boundary failed')
              livehash=hashlib.sha256(read_worker()).hexdigest()
              if livehash!=NEW: raise RuntimeError('live Worker hash mismatch '+livehash)
          except Exception as primary:
              rollback_used=True; upload(original)
              rh=hashlib.sha256(read_worker()).hexdigest(); rc2,_,_=public('/chemistry/healthz','application/json','rollback-'+secrets.token_hex(4))
              if rh!=OLD or rc2!=200: raise RuntimeError(f'ROLLBACK_VERIFY_FAILED hash={rh} http={rc2}') from primary
              raise

          ev={
            'schema':'musitu.chemistry.browser_discovery.deploy.v1','predecessor_worker_sha256':oldhash,'candidate_worker_sha256':NEW,'live_worker_sha256':livehash,
            'preflight_run_id':os.environ['PREFLIGHT_RUN_ID'],'preflight_head_sha':os.environ['PREFLIGHT_HEAD_SHA'],'preflight_artifact_id':os.environ['PREFLIGHT_ARTIFACT_ID'],'preflight_artifact_sha256':os.environ['PREFLIGHT_ARTIFACT_SHA256'],
            'bindings_preserved':True,'licence_key_id':KEY,'payment_authority_bound':True,'transport_bound':True,'raw_paynow_key_present':False,'plan_ids':ids2,'apk_sha256':digest,'apk_bytes':len(apk2),'web_vitals_sha256':VITALS,'web_vitals_bytes':len(vb),
            'canonical_verified':True,'robots_index_follow_verified':True,'open_graph_verified':True,'twitter_preview_verified':True,'software_application_structured_data_verified':True,'unverified_review_or_rating_present':False,
            'manifest_verified':True,'icon_192_verified':True,'icon_512_verified':True,'browser_install_script_verified':True,'browser_install_prompt_forced':False,'sitemap_rescue_verified':True,
            'experience_status':experience.get('status'),'public_minimum_metric_sample':experience.get('minimum_public_sample'),'field_inp_claimed':False,'real_money_settlement_observed':False,'real_money_settlement_claimed':False,
            'search_console_submission_performed':False,'indexing_claimed':False,'indexnow_submission_performed':False,'rollback_available':True,'rollback_used':rollback_used,
            'sustained_edge_required_streak':required_streak,'sustained_edge_achieved_streak':streak,'edge_convergence_attempts':attempts,'observed_cf_rays':rays[-30:],
            'gate':'MUSITU_CHEMISTRY_BROWSER_DISCOVERY_GUARDED_DEPLOY_PASS'
          }
          raw=(json.dumps(ev,indent=2,sort_keys=True)+'\n').encode(); Path('/tmp/mchem-discovery-deploy/deploy.json').write_bytes(raw); Path('/tmp/mchem-discovery-deploy/deploy.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  deploy.json\n'); print(json.dumps(ev,sort_keys=True))
          PY

      - name: Seal deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mchem-discovery-deploy
          sha256sum *.json *.sha256 > SHA256SUMS.txt
          cat deploy.json

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-browser-discovery-guarded-deploy
          path: /tmp/mchem-discovery-deploy
          retention-days: 90
          if-no-files-found: error
