name: MUSITU Chemistry Browser Discovery Lighthouse Diagnostic

on:
  push:
    branches: [chemistry-browser-discovery-20260907]
    paths: ['.github/workflows/chemistry-browser-discovery-lighthouse-diagnostic.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-lh-base /tmp/mchem-lh-source.zip
          mkdir -p /tmp/mchem-lh-base
          cat commerce/chemistry/source.b64.* | base64 -d > /tmp/mchem-lh-source.zip
          echo "5b2618499eed8dc90261bc4f8260246d5593534500dd2fb145f2d24b5c47754c  /tmp/mchem-lh-source.zip" | sha256sum -c -
          unzip -q /tmp/mchem-lh-source.zip -d /tmp/mchem-lh-base
          echo "848e1cec17ec580822d36e595196cda5978713849e8b45c5bc8dc7fcf9765db8  /tmp/mchem-lh-base/src/index.mjs" | sha256sum -c -
          cp /tmp/mchem-lh-base/src/index.mjs commerce/chemistry/index.base.mjs
          python commerce/chemistry/patch_storefront.py
          python commerce/chemistry/patch_rescue_growth.py
          node --check commerce/chemistry/index.storefront-v3.mjs
          sha256sum commerce/chemistry/index.storefront-v3.mjs
      - name: Run Rescue Lighthouse diagnostic
        shell: bash
        env:
          WORKER_PATH: ${{ github.workspace }}/commerce/chemistry/index.storefront-v3.mjs
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock lighthouse
          node commerce/chemistry/storefront/browser-smoke.mjs serve "$WORKER_PATH" >/tmp/lh-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/chemistry/rescue >/dev/null && break; sleep 0.5; done
          npx lighthouse http://127.0.0.1:8787/chemistry/rescue?src=direct --output=json --output-path=/tmp/lighthouse-rescue.json --only-categories=performance,accessibility,best-practices --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const l=JSON.parse(fs.readFileSync('/tmp/lighthouse-rescue.json','utf8'));
          console.log('SCORES',JSON.stringify(Object.fromEntries(Object.entries(l.categories).map(([k,v])=>[k,v.score]))));
          const refs=l.categories['best-practices'].auditRefs;
          const out=[];
          for(const ref of refs){
            const a=l.audits[ref.id];
            if(a&&a.score!==1&&a.scoreDisplayMode!=='notApplicable') out.push({id:ref.id,weight:ref.weight,score:a.score,displayValue:a.displayValue||'',title:a.title,description:a.description,details:a.details||null});
          }
          console.log('BEST_PRACTICES_NONPASS='+JSON.stringify(out));
          JS
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
