name: MUSITU Chemistry Browser Discovery RUM Reconcile Audit

on:
  push:
    branches: [chemistry-browser-discovery-20260907]
    paths: ['.github/workflows/chemistry-browser-discovery-rum-reconcile-audit-temp.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_WORKER_SHA: 1af4a2a7d79de14d9539eda3d3e0f7917da98536c0d87c8253562893df9af707
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      RULESET_ID: 8e8a2552a8ee4bb383abbe0d748e1da5
      RULE_REF: musitu_chemistry_disable_cloudflare_rum
      RULE_EXPRESSION: '(http.host eq "payments.mftintelligence.com" and (raw.http.request.uri.path eq "/chemistry" or starts_with(raw.http.request.uri.path, "/chemistry/")))'
    steps:
      - uses: actions/checkout@v4

      - name: GET-only reconcile Worker and current config ruleset
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-rum-reconcile && mkdir -p /tmp/mchem-rum-reconcile
          python - <<'PY'
          import email,hashlib,json,os,urllib.request
          from pathlib import Path
          API='https://api.cloudflare.com/client/v4'; ACCOUNT='93f395f5121954671f92fffa453d6b61'; H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Chemistry-RUM-Reconcile/1.0'}
          def get(url):
              q=urllib.request.Request(url,method='GET',headers=H)
              with urllib.request.urlopen(q,timeout=90) as r:return r.headers,r.read()
          h,raw=get(f'{API}/accounts/{ACCOUNT}/workers/scripts/musitu-chemistry-commerce'); ctype=h.get('content-type','')
          if 'multipart/' in ctype.lower():
              msg=email.message_from_bytes((f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw); parts=[]
              for p in msg.walk():
                  if p.is_multipart():continue
                  d=p.get_payload(decode=True) or b''
                  if b'MUSITU Chemistry Commerce' in d:parts.append(d)
              if len(parts)!=1:raise SystemExit('worker extraction mismatch')
              raw=parts[0]
          livehash=hashlib.sha256(raw).hexdigest()
          if livehash!=os.environ['EXPECTED_WORKER_SHA']:raise SystemExit('LIVE_WORKER_HASH_MISMATCH '+livehash)
          _,body=get(f"{API}/zones/{os.environ['ZONE_ID']}/rulesets/{os.environ['RULESET_ID']}"); payload=json.loads(body); rs=payload.get('result') or {}; rules=rs.get('rules') or []
          if payload.get('success') is not True:raise SystemExit('ruleset GET unsuccessful')
          expected={
            'mft_payments_machine_transport':('15ad7cfa5d20422cb585fee04ea2d574','http.host eq "payments.mftintelligence.com"'),
            'mft_axiom_stage_machine_transport':('57f8a7896c0246a0a16b7a4fa018cf13','http.host eq "axiom-stage.mftintelligence.com"'),
            'musitu_axiom_prod_machine_transport':('954764cb51104a808c3d0da6f8695d9a','http.host eq "axiom.mftintelligence.com"'),
            'musitu_axiom_mcp_machine_transport':('c792da7cea7e4584b13296ecd7f38f87','http.host eq "mcp.mftintelligence.com"'),
            'musitu_axiom_oauth_machine_transport':('fa9bb46869114c7fb86add03f5151cf2','http.host eq "auth.mftintelligence.com"')}
          byref={r.get('ref'):r for r in rules}
          preserved=True
          for ref,(rid,expr) in expected.items():
              r=byref.get(ref); preserved=preserved and bool(r and r.get('id')==rid and r.get('expression')==expr and r.get('action')=='set_config' and r.get('enabled') is True)
          if not preserved:raise SystemExit('predecessor rules not preserved')
          target=[r for r in rules if r.get('ref')==os.environ['RULE_REF']]
          target_summary=[]
          for r in target:target_summary.append({'id':r.get('id'),'ref':r.get('ref'),'expression':r.get('expression'),'action':r.get('action'),'enabled':r.get('enabled'),'disable_rum':(r.get('action_parameters') or {}).get('disable_rum'),'version':r.get('version')})
          if len(target)>1:raise SystemExit('duplicate target rules '+str(len(target)))
          if target:
              r=target[0]
              if r.get('expression')!=os.environ['RULE_EXPRESSION'] or r.get('action')!='set_config' or r.get('enabled') is not True or (r.get('action_parameters') or {}).get('disable_rum') is not True:raise SystemExit('target rule malformed')
          ev={'schema':'musitu.chemistry.browser_discovery.rum_reconcile.v1','live_worker_sha256':livehash,'ruleset_id':rs.get('id'),'ruleset_version':str(rs.get('version')),'rule_count':len(rules),'predecessor_rules_preserved':True,'target_rule_present':len(target)==1,'target_rules':target_summary,'request_methods':['GET'],'production_mutation':False,'gate':'MUSITU_CHEMISTRY_RUM_RECONCILE_GET_PASS'}
          Path('/tmp/mchem-rum-reconcile/state.json').write_text(json.dumps(ev,indent=2,sort_keys=True)+'\n'); print(json.dumps(ev,sort_keys=True))
          PY

      - name: GET-only persistent Chrome observes current production behavior
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright >/dev/null
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"; export CHROME_PATH
          rm -rf /tmp/mchem-rum-reconcile-profile
          node --input-type=module <<'JS'
          import fs from 'node:fs'; import {chromium} from 'playwright';
          const context=await chromium.launchPersistentContext('/tmp/mchem-rum-reconcile-profile',{headless:true,executablePath:process.env.CHROME_PATH,viewport:{width:390,height:844},args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=context.pages()[0]||await context.newPage(); const consoleErrors=[]; const requests=[];
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())}); page.on('request',r=>requests.push(r.url()));
          const response=await page.goto('https://payments.mftintelligence.com/chemistry/rescue?src=direct&__mchem_reconcile='+Date.now(),{waitUntil:'networkidle'});
          if(!response||response.status()!==200)throw new Error('live Rescue HTTP '+response?.status());
          const csp=response.headers()['content-security-policy']||'';
          const dom=await page.evaluate(()=>({manifest:document.querySelector('link[rel=manifest]')?.getAttribute('href')||'',beaconScripts:document.querySelectorAll('script[src*="static.cloudflareinsights.com"]').length,installExists:!!document.getElementById('install-rescue'),installHidden:document.getElementById('install-rescue')?.hidden===true}));
          const client=await context.newCDPSession(page); await client.send('Page.enable'); const appManifest=await client.send('Page.getAppManifest'); const installability=await client.send('Page.getInstallabilityErrors');
          const installabilityErrors=Array.isArray(installability.installabilityErrors)?installability.installabilityErrors:[]; const beaconRequests=requests.filter(x=>x.includes('static.cloudflareinsights.com/beacon')); const relevantErrors=consoleErrors.filter(x=>/manifest|content security policy|csp|cloudflareinsights/i.test(x));
          const out={schema:'musitu.chemistry.browser_discovery.rum_reconcile_browser.v1',http:response.status(),production_csp:csp,dom,manifest_url:appManifest.url,manifest_errors:appManifest.errors,installability_errors:installabilityErrors,cloudflare_beacon_requests:beaconRequests,csp_or_manifest_console_errors:relevantErrors,beacon_absent:beaconRequests.length===0&&dom.beaconScripts===0,manifest_processed:appManifest.url==='https://payments.mftintelligence.com/chemistry/manifest.webmanifest'&&Array.isArray(appManifest.errors)&&appManifest.errors.length===0,installability_clean:installabilityErrors.length===0,request_methods:['GET'],production_mutation:false};
          fs.writeFileSync('/tmp/mchem-rum-reconcile/browser.json',JSON.stringify(out,null,2)+'\n'); console.log(JSON.stringify(out)); await context.close();
          JS

      - name: Seal reconciliation evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mchem-rum-reconcile
          sha256sum *.json > SHA256SUMS.txt
          cat state.json
          cat browser.json

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-browser-discovery-rum-reconcile
          path: /tmp/mchem-rum-reconcile
          retention-days: 30
          if-no-files-found: error
