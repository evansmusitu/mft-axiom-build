name: MUSITU Chemistry Commerce Live Read-Only Verify

on:
  push:
    branches: [chemistry-commerce-live-20260906]
    paths: ['.github/workflows/chemistry-commerce-diagnose.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe live public Chemistry commerce without mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse,hashlib
          base='https://payments.mftintelligence.com'
          def get(path,accept='*/*'):
              q=urllib.request.Request(base+path,headers={'Accept':accept,'User-Agent':'MUSITU-Chemistry-Live-ReadOnly-Verify/1.0'})
              try:
                  with urllib.request.urlopen(q,timeout=30) as r:return r.status,(r.headers.get('content-type') or ''),r.read()
              except urllib.error.HTTPError as e:return e.code,(e.headers.get('content-type') or ''),e.read()
          hc,hct,hb=get('/chemistry/healthz','application/json');h=json.loads(hb or b'{}')
          if hc!=200 or h.get('ok') is not True:raise SystemExit('health failed')
          if h.get('raw_paynow_key_present') is not False or h.get('payment_authority_bound') is not True or h.get('transport_bound') is not True:raise SystemExit('security boundary failed')
          if h.get('licence_key_id')!='chem-lic-2026-6783aa7535d1':raise SystemExit('production key mismatch')
          cc,cct,cb=get('/chemistry/catalog','application/json');c=json.loads(cb or b'{}');ids=[p.get('id') for p in c.get('plans') or []]
          if cc!=200 or ids!=['term','annual','lifetime','family','tutor','school']:raise SystemExit('catalog failed')
          device='RC3-LIVE-PROBE-DEVICE-98765'
          q='/chemistry/checkout/start?'+urllib.parse.urlencode({'plan':'annual','device_id':device})
          pc,pct,pb=get(q,'text/html');pt=pb.decode('utf-8','replace')
          if pc!=200 or 'text/html' not in pct.lower() or 'name=plan value="annual"' not in pt or device not in pt or 'Continue securely to Paynow' not in pt:raise SystemExit('annual hosted checkout failed')
          sc,sct,sb=get('/chemistry/checkout/start?'+urllib.parse.urlencode({'plan':'school','device_id':device}),'text/html');st=sb.decode('utf-8','replace')
          if sc!=200 or 'name=seats' not in st or 'min=1' not in st or 'max=999' not in st:raise SystemExit('school checkout failed')
          clc,clct,clb=get('/chemistry/claim','text/html');clt=clb.decode('utf-8','replace')
          if clc!=200 or 'Activate a paid seat' not in clt:raise SystemExit('seat claim page failed')
          ev={'schema':'musitu.chemistry.live_readonly_verify.v1','health_http':hc,'catalog_http':cc,'checkout_annual_http':pc,'checkout_school_http':sc,'claim_http':clc,'licence_key_id':h.get('licence_key_id'),'plan_ids':ids,'raw_paynow_key_present':False,'production_mutation':False,'gate':'MUSITU_CHEMISTRY_LIVE_PUBLIC_COMMERCE_PASS'}
          raw=(json.dumps(ev,indent=2,sort_keys=True)+'\n').encode();open('chemistry-live-readonly.json','wb').write(raw);open('chemistry-live-readonly.sha256','w').write(hashlib.sha256(raw).hexdigest()+'  chemistry-live-readonly.json\n')
          print(json.dumps(ev,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-live-readonly-verify
          path: |
            chemistry-live-readonly.json
            chemistry-live-readonly.sha256
          retention-days: 30
          if-no-files-found: error
