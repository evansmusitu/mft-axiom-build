name: MUSITU Chemistry Dedicated App Identity Guarded Deploy

on:
  push:
    branches: [chemistry-national-rescue-growth-20260907]
    paths: ['.github/workflows/chemistry-dedicated-app-identity-guarded-deploy.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: musitu-chemistry-global-storefront-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: 6fed3639712de008c84c1e47fa20f93b196bcdfd
      SOURCE_TREE_SHA: bd6491a1ec5712df33ecccd76db0e942fa95ba1f
      PREVIOUS_WORKER_SHA: 6f8d5a326b5a43ed25f6674ea73f83a94cf2fc7f7751380bfb0577c99dc6e210
      CANDIDATE_WORKER_SHA: 128af0981d82e96c491a7da8e7c681f4e87ec8119bfd5b43b2cf29d07914ff07
      PREFLIGHT_RUN_ID: '34203876705'
      PREFLIGHT_ARTIFACT_ID: '10046940504'
      PREFLIGHT_ARTIFACT_SHA256: 888e0b65ac48baca1ba8070004a7eee03f7915c79570da356316993b800beec2
      FOCUSED_RUN_ID: '34203876724'
      ZERO_COST_RUN_ID: '34203876701'
      ZERO_COST_ARTIFACT_ID: '10046920452'
      ZERO_COST_ARTIFACT_SHA256: 959cad2dcf7eaee8e1be7027d974b11141caea543292955721751e5628425139
      SOURCE_ZIP_SHA256: 5b2618499eed8dc90261bc4f8260246d5593534500dd2fb145f2d24b5c47754c
      BASE_WORKER_SHA256: 848e1cec17ec580822d36e595196cda5978713849e8b45c5bc8dc7fcf9765db8
      WEB_VITALS_SHA256: 6b3e4ac9d6f6abd4ea1810621668bec7d7adb121279570e6870be4fb98ab3909
      LICENCE_KEY_ID: chem-lic-2026-6783aa7535d1
      APK_SHA256: 055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact source CI evidence and candidate identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/chemistry-dedicated-app-identity-guarded-deploy.yml"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE_SHA"

          rm -rf /tmp/mchem-id-deploy /tmp/mchem-id-base /tmp/mchem-id-source.zip /tmp/mchem-id-core
          mkdir -p /tmp/mchem-id-deploy /tmp/mchem-id-base /tmp/mchem-id-core/src

          for rid in "$PREFLIGHT_RUN_ID" "$FOCUSED_RUN_ID" "$ZERO_COST_RUN_ID"; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${rid}" > "/tmp/mchem-id-deploy/run-${rid}.json"
          done
          for rid in "$PREFLIGHT_RUN_ID" "$ZERO_COST_RUN_ID"; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${rid}/artifacts?per_page=100" > "/tmp/mchem-id-deploy/artifacts-${rid}.json"
          done

          python - <<'PY'
          import json,os
          root='/tmp/mchem-id-deploy/'
          expected=[
            (os.environ['PREFLIGHT_RUN_ID'],'MUSITU Chemistry Rescue Full Preflight'),
            (os.environ['FOCUSED_RUN_ID'],'MUSITU Chemistry Rescue Growth Focused CI'),
            (os.environ['ZERO_COST_RUN_ID'],'MUSITU Chemistry Zero-Cost Install CI'),
          ]
          for rid,name in expected:
            r=json.load(open(root+'run-'+rid+'.json'))
            observed={k:r.get(k) for k in ('status','conclusion','head_sha','name')}
            want={'status':'completed','conclusion':'success','head_sha':os.environ['SOURCE_SHA'],'name':name}
            if observed!=want: raise SystemExit('exact CI evidence rejected '+name+' '+json.dumps(observed,sort_keys=True))
          artifacts=[
            (os.environ['PREFLIGHT_RUN_ID'],os.environ['PREFLIGHT_ARTIFACT_ID'],'musitu-chemistry-rescue-full-preflight',os.environ['PREFLIGHT_ARTIFACT_SHA256']),
            (os.environ['ZERO_COST_RUN_ID'],os.environ['ZERO_COST_ARTIFACT_ID'],'musitu-chemistry-dedicated-app-installer-candidate',os.environ['ZERO_COST_ARTIFACT_SHA256']),
          ]
          for rid,aid,name,digest in artifacts:
            items=json.load(open(root+'artifacts-'+rid+'.json')).get('artifacts',[])
            matches=[a for a in items if str(a.get('id'))==aid]
            if len(matches)!=1 or matches[0].get('name')!=name or matches[0].get('expired') is not False:
              raise SystemExit('artifact identity rejected '+name)
            got=str(matches[0].get('digest') or '').removeprefix('sha256:')
            if got!=digest: raise SystemExit('artifact digest rejected '+name+' '+got)
          print('DEDICATED_APP_IDENTITY_EXACT_EVIDENCE=PASS')
          PY

          cat commerce/chemistry/source.b64.* | base64 -d > /tmp/mchem-id-source.zip
          echo "$SOURCE_ZIP_SHA256  /tmp/mchem-id-source.zip" | sha256sum -c -
          unzip -q /tmp/mchem-id-source.zip -d /tmp/mchem-id-base
          echo "$BASE_WORKER_SHA256  /tmp/mchem-id-base/src/index.mjs" | sha256sum -c -
          echo "$WEB_VITALS_SHA256  commerce/chemistry/storefront/web-vitals-6.0.1.iife.js" | sha256sum -c -
          cp /tmp/mchem-id-base/src/index.mjs commerce/chemistry/index.base.mjs
          python commerce/chemistry/patch_storefront.py
          python commerce/chemistry/patch_rescue_growth.py
          echo "$CANDIDATE_WORKER_SHA  commerce/chemistry/index.storefront-v3.mjs" | sha256sum -c -
          node --check commerce/chemistry/index.storefront-v3.mjs
          node --test commerce/chemistry/storefront/*.test.mjs | tee /tmp/mchem-id-deploy/storefront-tests.txt
          cp commerce/chemistry/index.storefront-v3.mjs /tmp/mchem-id-core/src/index.mjs
          cp -a /tmp/mchem-id-base/test /tmp/mchem-id-core/
          cp /tmp/mchem-id-base/package.json /tmp/mchem-id-core/
          cd /tmp/mchem-id-core
          npm test | tee /tmp/mchem-id-deploy/core-tests.txt
          npm run check | tee /tmp/mchem-id-deploy/core-check.txt

      - name: Guarded production identity cutover with automatic rollback
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,secrets,time,urllib.error,urllib.parse,urllib.request
          from pathlib import Path

          API='https://api.cloudflare.com/client/v4'
          ACCOUNT='93f395f5121954671f92fffa453d6b61'
          WORKER='musitu-chemistry-commerce'
          BASE='https://payments.mftintelligence.com'
          AUTH={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Dedicated-App-Identity-Deploy/1.0'}
          OLD=os.environ['PREVIOUS_WORKER_SHA']; NEW=os.environ['CANDIDATE_WORKER_SHA']
          KEY=os.environ['LICENCE_KEY_ID']; APK_SHA=os.environ['APK_SHA256']
          evidence=Path('/tmp/mchem-id-deploy')
          candidate=Path('commerce/chemistry/index.storefront-v3.mjs').read_bytes()
          if hashlib.sha256(candidate).hexdigest()!=NEW: raise SystemExit('candidate hash mismatch')

          def req(url,method='GET',headers=None,body=None,timeout=60):
            r=urllib.request.Request(url,method=method,headers=dict(headers or {}),data=body)
            try:
              with urllib.request.urlopen(r,timeout=timeout) as x: return x.status,x.headers,x.read()
            except urllib.error.HTTPError as e: return e.code,e.headers,e.read()

          def public(path,accept='*/*',nonce=None):
            if nonce: path+=('&' if '?' in path else '?')+'__mchem_id='+urllib.parse.quote(nonce)
            h={'Accept':accept,'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache','User-Agent':'MUSITU-ID-Live/'+secrets.token_hex(6)}
            return req(BASE+path,headers=h)

          def extract(raw,ctype,needle):
            if 'multipart/' not in (ctype or '').lower(): return raw
            msg=email.message_from_bytes((f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw)
            parts=[]
            for p in msg.walk():
              if p.is_multipart(): continue
              data=p.get_payload(decode=True) or b''
              if needle.encode() in data: parts.append(data)
            if len(parts)!=1: raise RuntimeError('worker module extraction mismatch')
            return parts[0]

          def read_worker():
            c,h,b=req(f'{API}/accounts/{ACCOUNT}/workers/scripts/{WORKER}',headers=AUTH)
            if c!=200: raise RuntimeError(f'worker read HTTP {c}')
            return extract(b,h.get('content-type',''),'MUSITU Chemistry Commerce')

          def read_hash(): return hashlib.sha256(read_worker()).hexdigest()

          def upload(source):
            boundary='----MUSITU'+secrets.token_hex(16)
            meta=json.dumps({'main_module':'index.mjs'},separators=(',',':'))
            body=(f'--{boundary}\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n{meta}\r\n--{boundary}\r\nContent-Disposition: form-data; name="index.mjs"; filename="index.mjs"\r\nContent-Type: application/javascript+module\r\n\r\n').encode()+source+f'\r\n--{boundary}--\r\n'.encode()
            h=dict(AUTH); h['Content-Type']='multipart/form-data; boundary='+boundary
            c,_,b=req(f'{API}/accounts/{ACCOUNT}/workers/scripts/{WORKER}/content','PUT',h,body)
            if not 200<=c<300: raise RuntimeError(f'worker upload HTTP {c}: '+b[:300].decode('utf-8','ignore'))

          def strict(h):
            csp=h.get('content-security-policy') or ''
            return "style-src 'self'" in csp and "script-src 'self'" in csp and "connect-src 'self'" in csp and "manifest-src 'self'" in csp and 'unsafe-inline' not in csp and 'unsafe-eval' not in csp and (h.get('referrer-policy') or '')=='no-referrer' and (h.get('x-frame-options') or '')=='DENY' and (h.get('x-content-type-options') or '')=='nosniff'

          def health():
            c,_,b=public('/chemistry/healthz','application/json','health-'+secrets.token_hex(4))
            try: d=json.loads(b or b'{}')
            except: return False,{}
            ok=c==200 and d.get('ok') is True and d.get('licence_key_id')==KEY and d.get('raw_paynow_key_present') is False and d.get('payment_authority_bound') is True and d.get('transport_bound') is True
            return ok,d

          def wait_hash(target,allowed,seconds=75):
            deadline=time.time()+seconds; reads=0
            while time.time()<deadline:
              got=read_hash(); reads+=1
              if got==target:
                print('CLOUDFLARE_SCRIPT_HASH_CONVERGED',got,'reads='+str(reads)); return
              if got not in allowed: raise RuntimeError('unexpected Cloudflare script hash '+got)
              time.sleep(1)
            raise RuntimeError('Cloudflare script hash convergence timeout')

          def text_ok(path,required=(),forbidden=()):
            c,h,b=public(path,'text/html','html-'+secrets.token_hex(5))
            text=b.decode('utf-8','replace')
            return c==200 and strict(h) and all(x in text for x in required) and not any(x in text for x in forbidden),h,text

          def manifest_ok():
            c,_,b=public('/chemistry/manifest.webmanifest?v=2','application/manifest+json','manifest-'+secrets.token_hex(5))
            try: m=json.loads(b or b'{}')
            except: return False,{}
            ok=(c==200 and m.get('id')=='/chemistry/app' and m.get('name')=='MUSITU Chemistry' and m.get('short_name')=='MUSITU Chemistry' and m.get('start_url')=='/chemistry/app' and m.get('scope')=='/chemistry/' and m.get('display')=='standalone' and 'Rescue' not in str(m.get('description') or ''))
            return ok,m

          original=read_worker(); live_before=hashlib.sha256(original).hexdigest()
          if live_before!=OLD: raise SystemExit('LIVE_SOURCE_DRIFT '+live_before)
          health_before,health_before_body=health()
          if not health_before: raise SystemExit('predeploy health boundary failed')
          c,_,apk=public('/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk','application/vnd.android.package-archive','apk-pre-'+secrets.token_hex(4))
          if c!=200 or len(apk)!=5314934 or hashlib.sha256(apk).hexdigest()!=APK_SHA: raise SystemExit('predeploy APK provenance boundary failed')

          rollback=False; streak=0; attempts=0; rays=[]; manifest_after={}
          upload(candidate)
          try:
            wait_hash(NEW,{OLD,NEW})
            for attempt in range(1,121):
              attempts=attempt; ok=True; sweep=[]
              page_checks=[
                ('/chemistry/install',('Get MUSITU Chemistry on this device','manifest.webmanifest?v=2','href="/chemistry/app">Open MUSITU Chemistry'),('Download verified Android APK','You are ready. Open Chemistry Rescue')),
                ('/chemistry/app',('Your Chemistry workspace.','class="app-topbar"','class="app-nav"','manifest.webmanifest?v=2'),('class="site-header"','class="site-footer"')),
                ('/chemistry/app?view=exam',('Answer Chemistry as Chemistry.','data-scientific-response-os','Scientific Response Graph'),('class="site-header"','class="site-footer"')),
                ('/chemistry/app?view=premium',('Unlock full mastery.','class="app-topbar"'),('class="site-footer"',)),
                ('/chemistry/app?view=help',('Help without leaving MUSITU.','class="app-topbar"'),('class="site-footer"',)),
                ('/chemistry/rescue?src=direct',('MUSITU Chemistry Rescue 2026','manifest.webmanifest?v=2','index,follow,max-image-preview:large'),()),
              ]
              for idx,(path,required,forbidden) in enumerate(page_checks):
                good,h,_=text_ok(path,required,forbidden)
                ray=h.get('cf-ray') or ''
                if ray: sweep.append(ray)
                if not good: ok=False; break
              if ok:
                mok,m=manifest_ok(); ok=mok; manifest_after=m
              if ok:
                c,_,b=public('/chemistry/sw.js','application/javascript','sw-'+secrets.token_hex(4)); sw=b.decode('utf-8','replace')
                ok=c==200 and 'musitu-chemistry-install-v8' in sw and '/chemistry/manifest.webmanifest?v=2' in sw and '/chemistry/app?view=exam' in sw and 'checkout|return|claim|telemetry|plans' in sw
              if ok:
                c,_,b=public('/chemistry/assets/app-shell.js','application/javascript','js-'+secrets.token_hex(4)); js=b.decode('utf-8','replace')
                ok=c==200 and 'musitu.scientific_response_graph.v1' in js and 'finalized:parsed.finalized===true' in js and 'same-scientific-concept' in js
              if ok:
                hok,_=health(); ok=hok
              if ok:
                streak+=1; rays.extend(sweep); print('DEDICATED_APP_IDENTITY_EDGE_SWEEP_PASS attempt='+str(attempt)+' streak='+str(streak))
                if streak>=6: break
              else:
                streak=0; time.sleep(.75)
            if streak<6: raise RuntimeError('six consecutive production edge sweeps not achieved')
            if read_hash()!=NEW: raise RuntimeError('post-sweep Worker hash drift')
            c,_,apk2=public('/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk','application/vnd.android.package-archive','apk-post-'+secrets.token_hex(4))
            if c!=200 or len(apk2)!=5314934 or hashlib.sha256(apk2).hexdigest()!=APK_SHA: raise RuntimeError('postdeploy APK provenance boundary failed')
          except BaseException:
            rollback=True
            upload(original)
            wait_hash(OLD,{OLD,NEW})
            if read_hash()!=OLD: raise RuntimeError('rollback hash did not converge')
            raise

          health_after,health_after_body=health()
          result={
            'schema':'musitu.chemistry.dedicated_app_identity.deploy.v1',
            'source_sha':os.environ['SOURCE_SHA'],'source_tree_sha':os.environ['SOURCE_TREE_SHA'],
            'previous_worker_sha256':OLD,'production_worker_sha256':NEW,'predeploy_worker_sha256':live_before,
            'rollback_used':rollback,'edge_sweep_attempts':attempts,'final_consecutive_edge_sweeps':streak,'cf_ray_count':len(rays),
            'manifest_id':manifest_after.get('id'),'manifest_name':manifest_after.get('name'),'manifest_start_url':manifest_after.get('start_url'),'manifest_scope':manifest_after.get('scope'),
            'versioned_manifest_url':'/chemistry/manifest.webmanifest?v=2','service_worker_cache':'musitu-chemistry-install-v8',
            'installed_handoff_url':'/chemistry/app','public_rescue_preserved':True,'scientific_response_preserved':True,
            'health_before':health_before,'health_after':health_after,
            'raw_paynow_key_present':health_after_body.get('raw_paynow_key_present'),'payment_authority_bound':health_after_body.get('payment_authority_bound'),'transport_bound':health_after_body.get('transport_bound'),
            'legacy_apk_sha256':APK_SHA,'legacy_apk_bytes':5314934,
            'physical_fresh_install_claimed':False,'physical_device_certified':False,'real_money_settlement_performed':False
          }
          provenance={
            'schema':'musitu.chemistry.dedicated_app_identity.deploy.provenance.v1','github_run_id':os.environ.get('GITHUB_RUN_ID'),'github_sha':os.environ.get('GITHUB_SHA'),
            'source_sha':os.environ['SOURCE_SHA'],'candidate_worker_sha256':NEW,'preflight_run_id':os.environ['PREFLIGHT_RUN_ID'],'focused_run_id':os.environ['FOCUSED_RUN_ID'],'zero_cost_run_id':os.environ['ZERO_COST_RUN_ID'],
            'preflight_artifact_id':os.environ['PREFLIGHT_ARTIFACT_ID'],'zero_cost_artifact_id':os.environ['ZERO_COST_ARTIFACT_ID']
          }
          evidence.mkdir(parents=True,exist_ok=True)
          (evidence/'live-result.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          (evidence/'provenance.json').write_text(json.dumps(provenance,sort_keys=True,indent=2)+'\n')
          (evidence/'cf-rays.txt').write_text('\n'.join(rays)+'\n')
          for p in ['live-result.json','provenance.json','cf-rays.txt']:
            q=evidence/p; print(hashlib.sha256(q.read_bytes()).hexdigest(),p)
          print('MUSITU_CHEMISTRY_DEDICATED_APP_IDENTITY_DEPLOY=PASS')
          PY

      - name: Seal deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum commerce/chemistry/index.storefront-v3.mjs > /tmp/mchem-id-deploy/candidate.sha256
          sha256sum /tmp/mchem-id-deploy/* | sort > /tmp/mchem-id-deploy/SHA256SUMS.txt
          {
            echo '## MUSITU Chemistry dedicated app identity production cutover'
            echo
            echo "- Source evidence SHA: $SOURCE_SHA"
            echo "- Previous production Worker: $PREVIOUS_WORKER_SHA"
            echo "- New production Worker: $CANDIDATE_WORKER_SHA"
            echo "- Manifest id: /chemistry/app"
            echo "- Manifest start_url: /chemistry/app"
            echo "- Manifest discovery: /chemistry/manifest.webmanifest?v=2"
            echo "- Service-worker cache: musitu-chemistry-install-v8"
            echo "- Full Preflight: $PREFLIGHT_RUN_ID"
            echo "- Focused CI: $FOCUSED_RUN_ID"
            echo "- Zero-Cost Install CI: $ZERO_COST_RUN_ID"
            echo '- Automatic rollback is mandatory on any production verification failure.'
            echo '- Existing pre-migration Rescue installs are not claimed migrated in-place.'
            echo '- Physical fresh-install certification is not claimed.'
            echo '- No real-money settlement was performed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-dedicated-app-identity-production-deploy
          path: /tmp/mchem-id-deploy
          if-no-files-found: error
          retention-days: 90
