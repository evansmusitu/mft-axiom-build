name: MUSITU Chemistry Field Evidence Check Temp

on:
  push:
    branches: [chemistry-national-rescue-growth-20260907]
    paths: ['.github/workflows/chemistry-field-evidence-check-temp.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET field evidence only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url='https://payments.mftintelligence.com/chemistry/experience.json'
          req=urllib.request.Request(url,method='GET',headers={'Accept':'application/json','Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'MUSITU-Field-Evidence-Check/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read().decode('utf-8')
          data=json.loads(body)
          print('FIELD_EVIDENCE_JSON='+json.dumps(data,sort_keys=True,separators=(',',':')))
          print('REQUEST_METHOD=GET')
          PY
