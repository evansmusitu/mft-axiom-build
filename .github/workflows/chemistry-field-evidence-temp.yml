name: MUSITU Chemistry Field Evidence Check
on:
  push:
    branches: [chemistry-national-rescue-growth-20260907]
    paths: ['.github/workflows/chemistry-field-evidence-temp.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET field evidence only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          u='https://payments.mftintelligence.com/chemistry/experience.json'
          q=urllib.request.Request(u,method='GET',headers={'Accept':'application/json','Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache','User-Agent':'MUSITU-Field-Evidence-Check/1.0'})
          with urllib.request.urlopen(q,timeout=30) as r:
              d=json.load(r)
          print(json.dumps(d,sort_keys=True))
          status=d.get('status')
          metrics=d.get('metrics') or d.get('core_web_vitals') or {}
          def norm(name):
              m=metrics.get(name) or metrics.get(name.lower()) or metrics.get(name.upper()) or {}
              return {'count':m.get('sample_count',m.get('count',m.get('samples'))),'p75':m.get('p75'),'rating':m.get('rating')}
          out={k:norm(k) for k in ('LCP','INP','CLS')}
          ready=status=='field_core_web_vitals_available' and all(isinstance(v['count'],(int,float)) and v['count']>=100 for v in out.values())
          print('FIELD_EVIDENCE_SUMMARY='+json.dumps({'status':status,'metrics':out,'ready':ready},sort_keys=True))
          PY
