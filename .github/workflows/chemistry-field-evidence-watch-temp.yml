name: MUSITU Chemistry Field Evidence Watch Temp

on:
  push:
    branches: [chemistry-national-rescue-growth-20260907]
    paths: ['.github/workflows/chemistry-field-evidence-watch-temp.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET field evidence only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          u='https://payments.mftintelligence.com/chemistry/experience.json?__field_watch=1'
          q=urllib.request.Request(u, method='GET', headers={'Accept':'application/json','Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache','User-Agent':'MUSITU-Field-Evidence-Watch/1.0'})
          with urllib.request.urlopen(q, timeout=60) as r:
              if r.status != 200: raise SystemExit(f'HTTP {r.status}')
              d=json.load(r)
          print('FIELD_EVIDENCE_JSON='+json.dumps(d,sort_keys=True,separators=(',',':')))
          print('REQUEST_METHOD=GET')
          PY
