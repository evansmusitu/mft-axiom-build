name: MUSITU Chemistry Fix Installer App Identity

on:
  push:
    branches: [chemistry-national-rescue-growth-20260907]
    paths: ['.github/workflows/chemistry-fix-installer-app-identity.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact failed-migration lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "26f5b1b9fc5ca85de7c8f197a61124c6dbda4d59"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/chemistry-fix-installer-app-identity.yml"

      - name: Apply dedicated app-identity migration only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p=Path(path)
              s=p.read_text()
              n=s.count(old)
              if n!=expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {n}')
              p.write_text(s.replace(old,new,expected))

          p=Path('commerce/chemistry/patch_rescue_growth.py')
          lines=p.read_text().splitlines()
          hits=[i for i,l in enumerate(lines) if "'Installed app manifest launch target'" in l]
          if len(hits)!=1:
              raise SystemExit(f'patch_rescue_growth manifest anchor count={len(hits)}')
          lines[hits[0]]="s=once_in_section(s,'// storefront/rescue-discovery.mjs\\n','// storefront/rescue-render.mjs\\n','\\\\\"name\\\\\":\\\\\"MUSITU Chemistry Rescue 2026\\\\\",\\\\\"short_name\\\\\":\\\\\"MUSITU Chemistry\\\\\",\\\\\"description\\\\\":\\\\\"Free A-Level Chemistry readiness and revision entry point from MUSITU Chemistry Mastery.\\\\\",\\\\\"start_url\\\\\":\\\\\"/chemistry/rescue?src=direct\\\\\"','\\\\\"name\\\\\":\\\\\"MUSITU Chemistry\\\\\",\\\\\"short_name\\\\\":\\\\\"MUSITU Chemistry\\\\\",\\\\\"description\\\\\":\\\\\"Installable MUSITU Chemistry learning, revision and scientific-response app.\\\\\",\\\\\"id\\\\\":\\\\\"/chemistry/app\\\\\",\\\\\"start_url\\\\\":\\\\\"/chemistry/app\\\\\"','Dedicated installed app manifest identity')"
          p.write_text('\n'.join(lines)+'\n')

          replace_exact('commerce/chemistry/storefront/install.mjs','<link rel="manifest" href="/chemistry/manifest.webmanifest">','<link rel="manifest" href="/chemistry/manifest.webmanifest?v=2">')
          replace_exact('commerce/chemistry/storefront/install.mjs',"['manifest','/chemistry/manifest.webmanifest']","['manifest','/chemistry/manifest.webmanifest?v=2']")
          replace_exact('commerce/chemistry/storefront/install.mjs','You are ready. Open Chemistry Rescue and continue learning.','You are ready. Open MUSITU Chemistry and continue learning.')
          old_installed='<article class="install-card" data-install-panel="installed"><span class="install-state good">Installed ✓</span><h1>MUSITU is installed</h1><p class="lead">You are ready. Open MUSITU Chemistry and continue learning.</p><div class="install-actions"><a class="button" href="/chemistry/rescue?src=direct">Open Chemistry Rescue</a></div></article>'
          new_installed='<article class="install-card" data-install-panel="installed"><span class="install-state good">Installed ✓</span><h1>MUSITU is installed</h1><p class="lead">You are ready. Open MUSITU Chemistry and continue learning.</p><div class="install-actions"><a class="button" href="/chemistry/app">Open MUSITU Chemistry</a></div></article>'
          replace_exact('commerce/chemistry/storefront/install.mjs',old_installed,new_installed)
          replace_exact('commerce/chemistry/storefront/install.mjs','Installation is complete. Open Chemistry Rescue.','Installation is complete. Open MUSITU Chemistry.')

          replace_exact('commerce/chemistry/storefront/app-shell.mjs','/chemistry/manifest.webmanifest','/chemistry/manifest.webmanifest?v=2',expected=2)
          replace_exact('commerce/chemistry/storefront/rescue-render.mjs','<link rel="manifest" href="/chemistry/manifest.webmanifest">','<link rel="manifest" href="/chemistry/manifest.webmanifest?v=2">')
          replace_exact('commerce/chemistry/storefront/offline-sw-v5.mjs','musitu-chemistry-install-v7','musitu-chemistry-install-v8')
          replace_exact('commerce/chemistry/storefront/offline-sw-v5.mjs',"  '/chemistry/manifest.webmanifest'\n];","  '/chemistry/manifest.webmanifest?v=2'\n];")
          PY
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "commerce/chemistry/patch_rescue_growth.py commerce/chemistry/storefront/app-shell.mjs commerce/chemistry/storefront/install.mjs commerce/chemistry/storefront/offline-sw-v5.mjs commerce/chemistry/storefront/rescue-render.mjs "

      - name: Reconstruct and prove GREEN contracts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-install-fix-base /tmp/mchem-install-fix-source.zip
          mkdir -p /tmp/mchem-install-fix-base
          cat commerce/chemistry/source.b64.* | base64 -d > /tmp/mchem-install-fix-source.zip
          echo "5b2618499eed8dc90261bc4f8260246d5593534500dd2fb145f2d24b5c47754c  /tmp/mchem-install-fix-source.zip" | sha256sum -c -
          unzip -q /tmp/mchem-install-fix-source.zip -d /tmp/mchem-install-fix-base
          echo "848e1cec17ec580822d36e595196cda5978713849e8b45c5bc8dc7fcf9765db8  /tmp/mchem-install-fix-base/src/index.mjs" | sha256sum -c -
          cp /tmp/mchem-install-fix-base/src/index.mjs commerce/chemistry/index.base.mjs
          python commerce/chemistry/patch_storefront.py
          python commerce/chemistry/patch_rescue_growth.py
          node --check commerce/chemistry/index.storefront-v3.mjs
          node --test commerce/chemistry/storefront/*.test.mjs
          node - <<'NODE'
          const {handleRequest}=await import('./commerce/chemistry/index.storefront-v3.mjs');
          const base='https://payments.mftintelligence.com';
          const req=async p=>handleRequest(new Request(base+p),{});
          const manifestResponse=await req('/chemistry/manifest.webmanifest?v=2');
          const manifest=JSON.parse(await manifestResponse.text());
          if(manifest.id!=='/chemistry/app'||manifest.name!=='MUSITU Chemistry'||manifest.start_url!=='/chemistry/app'||manifest.scope!=='/chemistry/'||/Rescue/i.test(manifest.description||''))throw new Error('dedicated app manifest rejected '+JSON.stringify(manifest));
          const install=await (await req('/chemistry/install')).text();
          if(!install.includes('manifest.webmanifest?v=2')||!install.includes('href="/chemistry/app">Open MUSITU Chemistry')||install.includes('You are ready. Open Chemistry Rescue'))throw new Error('install handoff still rescue-bound');
          const app=await (await req('/chemistry/app')).text();
          if(!app.includes('manifest.webmanifest?v=2'))throw new Error('app manifest cache-bust missing');
          const rescue=await (await req('/chemistry/rescue?src=direct')).text();
          if(!rescue.includes('manifest.webmanifest?v=2')||!rescue.includes('MUSITU Chemistry Rescue 2026'))throw new Error('public Rescue boundary changed');
          const sw=await (await req('/chemistry/sw.js')).text();
          if(!sw.includes('musitu-chemistry-install-v8')||!sw.includes('/chemistry/manifest.webmanifest?v=2')||!sw.includes('checkout|return|claim|telemetry|plans'))throw new Error('service-worker migration boundary rejected');
          console.log('DEDICATED_CHEMISTRY_INSTALL_IDENTITY=PASS');
          NODE

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commerce/chemistry/patch_rescue_growth.py commerce/chemistry/storefront/install.mjs commerce/chemistry/storefront/app-shell.mjs commerce/chemistry/storefront/rescue-render.mjs commerce/chemistry/storefront/offline-sw-v5.mjs
          git commit -m "fix: give Chemistry installer a dedicated app identity"
          git push origin HEAD:chemistry-national-rescue-growth-20260907
          git rev-parse HEAD
