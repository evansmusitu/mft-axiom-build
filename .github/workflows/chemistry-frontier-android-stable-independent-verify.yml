name: MUSITU Chemistry Frontier Android Stable Independent Verify

on:
  push:
    branches: [chemistry-frontier-universal-20260908]
    paths: ['.github/workflows/chemistry-frontier-android-stable-independent-verify.yml']

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/chemistry-frontier-universal-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Independently fetch stable, legacy and canary alias
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-stable-independent
          mkdir -p /tmp/mchem-stable-independent
          python - <<'PY'
          import hashlib,json,time,urllib.request
          base='https://payments.mftintelligence.com/chemistry/download/'
          specs={
            'stable':{
              'name':'MUSITU_Chemistry_Mastery_1.3.0.apk','bytes':5892286,
              'sha':'4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd','status':'stable'
            },
            'legacy':{
              'name':'MUSITU_Chemistry_Mastery_1.2.0.apk','bytes':5314934,
              'sha':'055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d','status':'legacy'
            },
            'canary_alias':{
              'name':'MUSITU_Chemistry_1.3.0-frontier-sidecar-rc1.apk','bytes':5892286,
              'sha':'4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd','status':'canary-alias'
            }
          }
          evidence={
            'schema':'musitu.chemistry.frontier.android_stable.independent_verify.v1',
            'production_mutation':False,'uses_deployment_secrets':False,'samples':{}
          }
          for kind,s in specs.items():
              samples=[]
              for n in (1,2):
                  q=urllib.request.Request(base+s['name'],headers={
                    'User-Agent':f'MUSITU-Frontier-Android-Stable-Independent/{kind}/{n}',
                    'Accept':'application/vnd.android.package-archive','Cache-Control':'no-cache'
                  })
                  with urllib.request.urlopen(q,timeout=90) as r:
                      body=r.read(); http=r.status; h={k.lower():v for k,v in r.headers.items()}
                  digest=hashlib.sha256(body).hexdigest()
                  if http!=200: raise SystemExit(f'{kind} sample {n} HTTP {http}')
                  if len(body)!=s['bytes']: raise SystemExit(f'{kind} sample {n} bytes {len(body)}')
                  if digest!=s['sha']: raise SystemExit(f'{kind} sample {n} SHA {digest}')
                  if body[:4]!=b'PK\x03\x04': raise SystemExit(f'{kind} sample {n} not APK/ZIP')
                  if h.get('x-musitu-sha256')!=s['sha']: raise SystemExit(f'{kind} sample {n} SHA header mismatch')
                  if h.get('x-musitu-release-status')!=s['status']: raise SystemExit(f'{kind} sample {n} release status mismatch')
                  cd=h.get('content-disposition','')
                  if 'attachment' not in cd.lower() or s['name'] not in cd: raise SystemExit(f'{kind} sample {n} content disposition mismatch {cd}')
                  ctype=h.get('content-type','')
                  if 'application/vnd.android.package-archive' not in ctype: raise SystemExit(f'{kind} sample {n} content type mismatch {ctype}')
                  samples.append({'sample':n,'http':http,'bytes':len(body),'sha256':digest,'release_status':h.get('x-musitu-release-status'),'x_musitu_sha256':h.get('x-musitu-sha256'),'content_disposition':cd,'content_type':ctype,'cache_control':h.get('cache-control')})
                  time.sleep(1)
              evidence['samples'][kind]=samples
          stable_hashes={x['sha256'] for x in evidence['samples']['stable']}
          canary_hashes={x['sha256'] for x in evidence['samples']['canary_alias']}
          if stable_hashes!=canary_hashes or stable_hashes!={'4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd'}:
              raise SystemExit('stable/canary byte identity failed')
          evidence.update({
            'stable_version':'1.3.0',
            'stable_url':base+'MUSITU_Chemistry_Mastery_1.3.0.apk',
            'stable_sha256':'4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd',
            'stable_bytes':5892286,
            'legacy_1_2_preserved':True,
            'legacy_1_2_sha256':'055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d',
            'canary_byte_identical_to_stable':True,
            'customer_install_verified_before_promotion':True,
            'explicit_promotion_authorization':True,
            'universal_web_carrier_deployed':False,
            'gate':'MUSITU_CHEMISTRY_FRONTIER_ANDROID_STABLE_INDEPENDENT_VERIFY_PASS'
          })
          raw=(json.dumps(evidence,indent=2,sort_keys=True)+'\n').encode()
          open('/tmp/mchem-stable-independent/independent-live.json','wb').write(raw)
          open('/tmp/mchem-stable-independent/independent-live.sha256','w').write(hashlib.sha256(raw).hexdigest()+'  independent-live.json\n')
          print(json.dumps(evidence,sort_keys=True))
          print('MUSITU_CHEMISTRY_FRONTIER_ANDROID_STABLE_INDEPENDENT_VERIFY_PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-frontier-android-stable-independent-verify
          path: /tmp/mchem-stable-independent
          retention-days: 90
          if-no-files-found: error
