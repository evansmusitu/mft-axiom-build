name: MUSITU Chemistry Frontier Android Stable Promotion

on:
  push:
    branches: [chemistry-frontier-universal-20260908]
    paths: ['.github/workflows/chemistry-frontier-android-stable-promotion.yml']

permissions:
  contents: read

concurrency:
  group: musitu-chemistry-frontier-android-stable-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/chemistry-frontier-universal-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: https://payments.mftintelligence.com/chemistry/download
      LEGACY_NAME: MUSITU_Chemistry_Mastery_1.2.0.apk
      LEGACY_SHA256: 055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d
      LEGACY_BYTES: '5314934'
      CANARY_NAME: MUSITU_Chemistry_1.3.0-frontier-sidecar-rc1.apk
      STABLE_NAME: MUSITU_Chemistry_Mastery_1.3.0.apk
      STABLE_SHA256: 4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd
      STABLE_BYTES: '5892286'
    steps:
      - uses: actions/checkout@v4

      - name: Verify authorized canary and preserved legacy stable bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-promote /tmp/mchem-rollback /tmp/mchem-promotion-evidence
          mkdir -p /tmp/mchem-promote/public/chemistry/download /tmp/mchem-promote/src \
                   /tmp/mchem-rollback/public/chemistry/download /tmp/mchem-rollback/src \
                   /tmp/mchem-promotion-evidence

          curl --fail --location --silent --show-error --max-time 180 "$BASE/$LEGACY_NAME" -o /tmp/legacy.apk
          echo "$LEGACY_SHA256  /tmp/legacy.apk" | sha256sum -c -
          test "$(stat -c %s /tmp/legacy.apk)" = "$LEGACY_BYTES"

          curl --fail --location --silent --show-error --max-time 180 "$BASE/$CANARY_NAME" -o /tmp/canary.apk
          echo "$STABLE_SHA256  /tmp/canary.apk" | sha256sum -c -
          test "$(stat -c %s /tmp/canary.apk)" = "$STABLE_BYTES"
          python - <<'PY'
          from pathlib import Path
          for p in [Path('/tmp/legacy.apk'),Path('/tmp/canary.apk')]:
              if p.read_bytes()[:4] != b'PK\x03\x04': raise SystemExit('not APK/ZIP: '+str(p))
          PY

          cp /tmp/legacy.apk /tmp/mchem-promote/public/chemistry/download/$LEGACY_NAME
          cp /tmp/canary.apk /tmp/mchem-promote/public/chemistry/download/$CANARY_NAME
          cp /tmp/canary.apk /tmp/mchem-promote/public/chemistry/download/$STABLE_NAME

          cp /tmp/legacy.apk /tmp/mchem-rollback/public/chemistry/download/$LEGACY_NAME
          cp /tmp/canary.apk /tmp/mchem-rollback/public/chemistry/download/$CANARY_NAME

          cat > /tmp/mchem-promote/src/index.js <<'JS'
          const RELEASES={
            '/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk':{name:'MUSITU_Chemistry_Mastery_1.2.0.apk',sha:'055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d',cache:'public, max-age=86400, immutable',status:'legacy'},
            '/chemistry/download/MUSITU_Chemistry_1.3.0-frontier-sidecar-rc1.apk':{name:'MUSITU_Chemistry_1.3.0-frontier-sidecar-rc1.apk',sha:'4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd',cache:'no-store',status:'canary-alias'},
            '/chemistry/download/MUSITU_Chemistry_Mastery_1.3.0.apk':{name:'MUSITU_Chemistry_Mastery_1.3.0.apk',sha:'4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd',cache:'public, max-age=86400, immutable',status:'stable'}
          };
          export default {async fetch(request,env){
            const path=new URL(request.url).pathname;
            const response=await env.ASSETS.fetch(request);
            if(!response.ok || !RELEASES[path]) return response;
            const meta=RELEASES[path],h=new Headers(response.headers);
            h.set('Content-Type','application/vnd.android.package-archive');
            h.set('Content-Disposition',`attachment; filename="${meta.name}"`);
            h.set('X-Content-Type-Options','nosniff');
            h.set('Cache-Control',meta.cache);
            h.set('X-MUSITU-SHA256',meta.sha);
            h.set('X-MUSITU-Release-Status',meta.status);
            return new Response(response.body,{status:response.status,statusText:response.statusText,headers:h});
          }};
          JS

          cat > /tmp/mchem-rollback/src/index.js <<'JS'
          const RELEASES={
            '/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk':{name:'MUSITU_Chemistry_Mastery_1.2.0.apk',sha:'055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d',cache:'public, max-age=86400, immutable',status:'stable'},
            '/chemistry/download/MUSITU_Chemistry_1.3.0-frontier-sidecar-rc1.apk':{name:'MUSITU_Chemistry_1.3.0-frontier-sidecar-rc1.apk',sha:'4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd',cache:'no-store',status:'canary'}
          };
          export default {async fetch(request,env){const path=new URL(request.url).pathname;const response=await env.ASSETS.fetch(request);if(!response.ok||!RELEASES[path])return response;const meta=RELEASES[path],h=new Headers(response.headers);h.set('Content-Type','application/vnd.android.package-archive');h.set('Content-Disposition',`attachment; filename="${meta.name}"`);h.set('X-Content-Type-Options','nosniff');h.set('Cache-Control',meta.cache);h.set('X-MUSITU-SHA256',meta.sha);h.set('X-MUSITU-Release-Status',meta.status);return new Response(response.body,{status:response.status,statusText:response.statusText,headers:h})}};
          JS

          for dir in /tmp/mchem-promote /tmp/mchem-rollback; do
            cat > "$dir/wrangler.jsonc" <<'JSON'
          {
            "name":"musitu-chemistry-downloads",
            "account_id":"93f395f5121954671f92fffa453d6b61",
            "compatibility_date":"2026-09-06",
            "workers_dev":false,
            "main":"src/index.js",
            "routes":[{"pattern":"payments.mftintelligence.com/chemistry/download*","zone_id":"5b56528f03948ff5917a5e0cd9f7109e"}],
            "assets":{"directory":"./public","binding":"ASSETS","run_worker_first":true}
          }
          JSON
          done

      - name: Promote 1.3.0 with fail-closed rollback
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          rollback(){
            echo 'PROMOTION_ROLLBACK=START'
            (cd /tmp/mchem-rollback && npx --yes wrangler@latest deploy --config wrangler.jsonc)
            python - <<'PY'
          import hashlib,urllib.request
          specs=[('MUSITU_Chemistry_Mastery_1.2.0.apk',5314934,'055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d'),('MUSITU_Chemistry_1.3.0-frontier-sidecar-rc1.apk',5892286,'4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd')]
          for name,size,sha in specs:
              with urllib.request.urlopen(urllib.request.Request('https://payments.mftintelligence.com/chemistry/download/'+name,headers={'Cache-Control':'no-cache','User-Agent':'MUSITU-Promotion-Rollback/1.0'}),timeout=90) as r:b=r.read(); status=r.status
              if status!=200 or len(b)!=size or hashlib.sha256(b).hexdigest()!=sha: raise SystemExit('rollback verification failed '+name)
          print('PROMOTION_ROLLBACK=PASS')
          PY
          }

          (cd /tmp/mchem-promote && npx --yes wrangler@latest deploy --config wrangler.jsonc)

          if ! python - <<'PY'
          import hashlib,json,time,urllib.request
          base='https://payments.mftintelligence.com/chemistry/download/'
          specs={
            'legacy':('MUSITU_Chemistry_Mastery_1.2.0.apk',5314934,'055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d','legacy'),
            'stable':('MUSITU_Chemistry_Mastery_1.3.0.apk',5892286,'4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd','stable'),
            'canary_alias':('MUSITU_Chemistry_1.3.0-frontier-sidecar-rc1.apk',5892286,'4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd','canary-alias')
          }
          out={}
          for kind,(name,size,sha,state) in specs.items():
              last='not attempted'
              for _ in range(30):
                  try:
                      q=urllib.request.Request(base+name,headers={'Cache-Control':'no-cache','User-Agent':'MUSITU-Frontier-Stable-Promotion/1.0','Accept':'application/vnd.android.package-archive'})
                      with urllib.request.urlopen(q,timeout=90) as r: body=r.read(); status=r.status; h={k.lower():v for k,v in r.headers.items()}
                      digest=hashlib.sha256(body).hexdigest()
                      if status==200 and len(body)==size and digest==sha and h.get('x-musitu-sha256')==sha and h.get('x-musitu-release-status')==state:
                          out[kind]={'http':status,'bytes':len(body),'sha256':digest,'release_status':h.get('x-musitu-release-status'),'content_disposition':h.get('content-disposition')};break
                      last=f'{status}/{len(body)}/{digest}/{h.get("x-musitu-release-status")}'
                  except Exception as e:last=repr(e)
                  time.sleep(1.5)
              else: raise SystemExit(kind+' verification failed '+last)
          if out['stable']['sha256']!=out['canary_alias']['sha256']: raise SystemExit('stable is not byte-identical to verified canary')
          ev={'schema':'musitu.chemistry.frontier.android_stable_promotion.live.v1','stable_version':'1.3.0','stable_url':base+'MUSITU_Chemistry_Mastery_1.3.0.apk','stable_sha256':'4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd','customer_install_verified':True,'explicit_promotion_authorization':True,'legacy_1_2_preserved':True,'universal_web_carrier_deployed':False,'rollback_invoked':False,'samples':out,'gate':'MUSITU_CHEMISTRY_FRONTIER_ANDROID_STABLE_PROMOTION_PASS'}
          raw=(json.dumps(ev,indent=2,sort_keys=True)+'\n').encode();open('/tmp/mchem-promotion-evidence/live.json','wb').write(raw);open('/tmp/mchem-promotion-evidence/live.sha256','w').write(hashlib.sha256(raw).hexdigest()+'  live.json\n');print(json.dumps(ev,sort_keys=True))
          PY
          then
            rollback
            exit 1
          fi
          echo 'MUSITU_CHEMISTRY_FRONTIER_ANDROID_STABLE_PROMOTION_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-frontier-android-stable-promotion
          path: /tmp/mchem-promotion-evidence
          retention-days: 90
          if-no-files-found: error
