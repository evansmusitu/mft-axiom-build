name: Chemistry Frontier APK Source Inspection

on:
  push:
    branches: [chemistry-frontier-universal-20260908]
    paths: ['.github/workflows/chemistry-frontier-apk-source-inspection.yml']

permissions:
  contents: read

env:
  EXPECTED_SOURCE_ZIP_SHA256: 5b2618499eed8dc90261bc4f8260246d5593534500dd2fb145f2d24b5c47754c
  EXPECTED_BASE_WORKER_SHA256: 848e1cec17ec580822d36e595196cda5978713849e8b45c5bc8dc7fcf9765db8

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct canonical Chemistry Worker source
        shell: bash
        run: |
          set -euo pipefail
          cat commerce/chemistry/source.b64.* | base64 -d > /tmp/mchem-source.zip
          echo "$EXPECTED_SOURCE_ZIP_SHA256  /tmp/mchem-source.zip" | sha256sum -c -
          rm -rf /tmp/mchem-source && mkdir -p /tmp/mchem-source
          unzip -q /tmp/mchem-source.zip -d /tmp/mchem-source
          echo "$EXPECTED_BASE_WORKER_SHA256  /tmp/mchem-source/src/index.mjs" | sha256sum -c -
      - name: Print base and final APK delivery contract only
        shell: python
        run: |
          from pathlib import Path
          for label,path in [
              ('BASE','/tmp/mchem-source/src/index.mjs'),
              ('FINAL','commerce/chemistry/index.storefront-v3.mjs'),
          ]:
              p=Path(path)
              print(f'===== {label} {path} =====')
              print(f'exists={p.exists()} bytes={p.stat().st_size if p.exists() else 0}')
              if not p.exists():
                  continue
              lines=p.read_text().splitlines()
              needles=('download','apk','bucket','r2','kv','asset','object','storage','MUSITU_Chemistry','APK_URL','APK_')
              hits=[]
              for i,line in enumerate(lines):
                  if any(n.lower() in line.lower() for n in needles):
                      hits.append(i)
              merged=[]
              for i in hits:
                  a=max(0,i-4); b=min(len(lines),i+7)
                  if merged and a <= merged[-1][1]: merged[-1]=(merged[-1][0],max(merged[-1][1],b))
                  else: merged.append((a,b))
              for a,b in merged:
                  print(f'--- lines {a+1}-{b} ---')
                  for j in range(a,b): print(f'{j+1}: {lines[j]}')
          print('INSPECTION_COMPLETE=true')
      - name: Assert inspection is read-only
        run: |
          echo 'production_mutation=false'
          echo 'cloudflare_contacted=false'
          echo 'publication_performed=false'
