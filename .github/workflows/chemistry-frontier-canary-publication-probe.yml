name: MUSITU Chemistry Frontier Canary Publication Probe

on:
  push:
    branches: [chemistry-frontier-canary-public-20260909]
    paths: ['.github/workflows/chemistry-frontier-canary-publication-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe existing public carrier assets without mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,urllib.request,urllib.error
          base='https://payments.mftintelligence.com'
          paths=['/chemistry/manifest.webmanifest','/chemistry/sw.js','/chemistry/assets/musitu-chemistry-192.png','/chemistry/assets/musitu-chemistry-512.png','/chemistry/app.js','/chemistry/commercial.js','/chemistry/frontier.js','/chemistry/frontier.css','/chemistry/styles.css','/chemistry/app']
          expected={'/chemistry/manifest.webmanifest':'6c59e09327d6411fb64abccbb977ec6568f644d4ea516e342a079821454beb30','/chemistry/sw.js':'a542a5aa5d29d4614fd5289ba6a089262fd9194d9ece093789f55b4975c174ef','/chemistry/assets/musitu-chemistry-192.png':'d8954271509104f8993bfb7b57fa30dae7c4b9b0675ce098a4ec7fe5206fe535','/chemistry/assets/musitu-chemistry-512.png':'7f6b756c6e5e9263357c8ed2cc446d96a6cb178a88473d8dd95dd800e4c5f2ca','/chemistry/app.js':'f2e8828674bc166ea03acc30302a37633221ae85b091c2801dfe7c2919c57c61','/chemistry/commercial.js':'cc6532b8c669ec373a934d9c5a4b5f6f60d87507bfb9d11de143181b7bccb58c','/chemistry/frontier.js':'ad889c5b30c81a530a405b84c52fd5b0d2b14ae30118bd743f923e8c347bf926','/chemistry/frontier.css':'c3fb84e67964caca1f907c258a69be2da6ebcd8fb8df3905e20ab64a95a68b23','/chemistry/styles.css':'ba5db59c8293b61dd1b5fa121415ea5bcfa3e38a04b0ff952b38bcc9608b5f76'}
          for p in paths:
            req=urllib.request.Request(base+p,headers={'User-Agent':'MUSITU-Frontier-Canary-Probe/1.0','Cache-Control':'no-cache'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                data=r.read(); sha=hashlib.sha256(data).hexdigest(); exp=expected.get(p)
                print('PROBE',p,'HTTP',r.status,'BYTES',len(data),'SHA256',sha,'TARGET_MATCH',sha==exp if exp else 'n/a','CTYPE',r.headers.get('content-type',''))
                if p=='/chemistry/app':
                  text=data.decode('utf-8','replace')
                  for line in text.splitlines():
                    if 'src=' in line or 'href=' in line: print('APP_REF',line[:500])
            except urllib.error.HTTPError as e: print('PROBE',p,'HTTP',e.code,'ERROR')
            except Exception as e: print('PROBE',p,'ERROR',type(e).__name__,str(e))
          PY
          echo MUSITU_CHEMISTRY_FRONTIER_CANARY_PUBLICATION_PROBE_COMPLETE
