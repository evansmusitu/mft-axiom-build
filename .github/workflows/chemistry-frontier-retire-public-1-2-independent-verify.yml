name: MUSITU Chemistry 1.2.0 Public Retirement Independent Verify

on:
  push:
    branches: [chemistry-frontier-universal-20260908]
    paths: ['.github/workflows/chemistry-frontier-retire-public-1-2-independent-verify.yml']

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/chemistry-frontier-universal-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Independently verify retired 1.2.0 and preserved 1.3.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-retire-12-independent
          mkdir -p /tmp/mchem-retire-12-independent
          python - <<'PY'
          import hashlib,json,time,urllib.error,urllib.request
          base='https://payments.mftintelligence.com/chemistry/download/'
          old_name='MUSITU_Chemistry_Mastery_1.2.0.apk'
          old_sha='055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d'
          stable_sha='4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd'
          specs={
            'stable':('MUSITU_Chemistry_Mastery_1.3.0.apk',5892286,stable_sha,'stable'),
            'canary_alias':('MUSITU_Chemistry_1.3.0-frontier-sidecar-rc1.apk',5892286,stable_sha,'canary-alias')
          }
          ev={'schema':'musitu.chemistry.frontier.android_1_2_public_retirement.independent_verify.v1','production_mutation':False,'deployment_secrets_used':False,'samples':{}}

          for kind,(name,size,sha,state) in specs.items():
              rows=[]
              for n in (1,2):
                  q=urllib.request.Request(base+name,headers={'Cache-Control':'no-cache','User-Agent':f'MUSITU-Retire-1.2-Independent/{kind}/{n}','Accept':'application/vnd.android.package-archive'})
                  with urllib.request.urlopen(q,timeout=90) as r:
                      body=r.read(); http=r.status; h={k.lower():v for k,v in r.headers.items()}
                  digest=hashlib.sha256(body).hexdigest()
                  if http!=200 or len(body)!=size or digest!=sha or body[:4]!=b'PK\x03\x04': raise SystemExit(f'{kind} sample {n} payload mismatch')
                  if h.get('x-musitu-sha256')!=sha or h.get('x-musitu-release-status')!=state: raise SystemExit(f'{kind} sample {n} header mismatch')
                  rows.append({'sample':n,'http':http,'bytes':len(body),'sha256':digest,'release_status':h.get('x-musitu-release-status')})
                  time.sleep(1)
              ev['samples'][kind]=rows

          retired=[]
          for n in (1,2):
              q=urllib.request.Request(base+old_name,headers={'Cache-Control':'no-cache','User-Agent':f'MUSITU-Retire-1.2-Independent/retired/{n}'})
              try:
                  with urllib.request.urlopen(q,timeout=30) as r:
                      body=r.read(); http=r.status; h={k.lower():v for k,v in r.headers.items()}
              except urllib.error.HTTPError as e:
                  body=e.read(); http=e.code; h={k.lower():v for k,v in e.headers.items()}
              digest=hashlib.sha256(body).hexdigest()
              if http!=410: raise SystemExit(f'retired sample {n} HTTP {http}')
              if h.get('x-musitu-release-status')!='retired': raise SystemExit(f'retired sample {n} status header mismatch')
              if body[:4]==b'PK\x03\x04' or len(body)==5314934 or digest==old_sha: raise SystemExit(f'retired sample {n} still serves old APK')
              retired.append({'sample':n,'http':http,'bytes':len(body),'sha256':digest,'release_status':h.get('x-musitu-release-status'),'apk_bytes_served':False})
              time.sleep(1)
          ev['samples']['retired_1_2']=retired

          historical='https://mft-chemistry-downloads.evansmft.workers.dev/MFT_Chemistry_Mastery_1.2.0.apk'
          historical_result={'url':historical,'serves_retired_apk':False}
          try:
              q=urllib.request.Request(historical,headers={'Cache-Control':'no-cache','User-Agent':'MUSITU-Retire-1.2-Independent/historical'})
              with urllib.request.urlopen(q,timeout=30) as r: body=r.read(); http=r.status
              digest=hashlib.sha256(body).hexdigest()
              historical_result.update({'http':http,'bytes':len(body),'sha256':digest})
              if http==200 and len(body)==5314934 and digest==old_sha: raise SystemExit('historical workers.dev endpoint still serves retired 1.2.0 APK')
          except urllib.error.HTTPError as e:
              historical_result.update({'http':e.code,'bytes':len(e.read())})
          except Exception as e:
              historical_result.update({'unavailable':True,'detail':type(e).__name__})
          ev['historical_workers_dev']=historical_result

          ev.update({'retired_version':'1.2.0','retired_url':base+old_name,'retired_sha256':old_sha,'retired_from_public_distribution':True,'stable_1_3_url':base+'MUSITU_Chemistry_Mastery_1.3.0.apk','stable_1_3_sha256':stable_sha,'stable_1_3_preserved':True,'canary_alias_preserved':True,'gate':'MUSITU_CHEMISTRY_ANDROID_1_2_PUBLIC_RETIREMENT_INDEPENDENT_VERIFY_PASS'})
          raw=(json.dumps(ev,indent=2,sort_keys=True)+'\n').encode()
          open('/tmp/mchem-retire-12-independent/independent.json','wb').write(raw)
          open('/tmp/mchem-retire-12-independent/independent.sha256','w').write(hashlib.sha256(raw).hexdigest()+'  independent.json\n')
          print(json.dumps(ev,sort_keys=True))
          print('MUSITU_CHEMISTRY_ANDROID_1_2_PUBLIC_RETIREMENT_INDEPENDENT_VERIFY_PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-android-1-2-public-retirement-independent
          path: /tmp/mchem-retire-12-independent
          retention-days: 90
          if-no-files-found: error
