name: MUSITU Chemistry Frontier Universal Preview Browser Matrix v3

on:
  push:
    branches: [chemistry-frontier-universal-20260908]
    paths: ['.github/workflows/chemistry-frontier-universal-preview-browser-matrix-v3.yml']

permissions:
  contents: read

concurrency:
  group: musitu-chemistry-frontier-universal-preview-browser-matrix-v3
  cancel-in-progress: false

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome, msedge, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_URL: https://payments.mftintelligence.com/chemistry/frontier-universal-preview/
      BROWSER_NAME: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright 1.63.0 and browser engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mchem-browser-v3-${BROWSER_NAME}
          cd /tmp/mchem-browser-v3-${BROWSER_NAME}
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps "$BROWSER_NAME"
          node -p "require('playwright/package.json').version" > playwright-version.txt
      - name: Run proven first-run-aware hosted scenario
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mchem-browser-v3-${BROWSER_NAME}
          python - <<'PY'
          from pathlib import Path
          import os
          text=Path(os.environ['GITHUB_WORKSPACE']+'/.github/workflows/chemistry-frontier-universal-preview-browser-matrix.yml').read_text()
          start=text.index("          cat > verify.cjs <<'JS'\n")+len("          cat > verify.cjs <<'JS'\n")
          end=text.index("\n          JS\n",start)
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end].splitlines())+'\n'
          script=script.replace("getByRole('button',{name:n})","getByRole('button',{name:n,exact:true})")
          script=script.replace("getByRole('button',{name:'Home'})","getByRole('button',{name:'Home',exact:true})")
          needle="await page.locator('#app').waitFor({state:'visible'});"
          insert=needle+"\n            const onboarding=page.locator('#frontier-onboarding'); if(await onboarding.isVisible().catch(()=>false)){await onboarding.locator('[data-frontier-done]').last().click();}"
          script=script.replace(needle,insert,1)
          mobile="await p.getByRole('button',{name:'Home',exact:true}).waitFor();"
          mobile_insert="if(await p.locator('#frontier-onboarding').isVisible().catch(()=>false)){await p.locator('#frontier-onboarding [data-frontier-done]').last().click();} "+mobile
          script=script.replace(mobile,mobile_insert)
          Path('verify.cjs').write_text(script)
          PY
          node verify.cjs
          sha256sum result.json > result.sha256
          echo MUSITU_BROWSER_${BROWSER_NAME}_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musitu-universal-preview-browser-v3-${{ matrix.browser }}
          path: |
            /tmp/mchem-browser-v3-${{ matrix.browser }}/result.json
            /tmp/mchem-browser-v3-${{ matrix.browser }}/result.sha256
            /tmp/mchem-browser-v3-${{ matrix.browser }}/failure.txt
            /tmp/mchem-browser-v3-${{ matrix.browser }}/playwright-version.txt
          if-no-files-found: warn
          retention-days: 90

  matrix-gate:
    needs: browser
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every browser engine green
        env:
          MATRIX_RESULT: ${{ needs.browser.result }}
        run: |
          set -euo pipefail
          test "$MATRIX_RESULT" = success
          echo MUSITU_CHEMISTRY_FRONTIER_UNIVERSAL_PREVIEW_BROWSER_MATRIX_PASS
