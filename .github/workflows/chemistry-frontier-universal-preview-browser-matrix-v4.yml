name: MUSITU Chemistry Frontier Universal Preview Browser Matrix v4

on:
  push:
    branches: [chemistry-frontier-universal-20260908]
    paths: ['.github/workflows/chemistry-frontier-universal-preview-browser-matrix-v4.yml']

permissions:
  contents: read

concurrency:
  group: musitu-chemistry-frontier-universal-preview-browser-matrix-v4
  cancel-in-progress: false

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome, msedge, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_URL: https://payments.mftintelligence.com/chemistry/frontier-universal-preview/
      BROWSER_NAME: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright 1.63.0 and browser engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mchem-browser-v4-${BROWSER_NAME}
          cd /tmp/mchem-browser-v4-${BROWSER_NAME}
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps "$BROWSER_NAME"
          node -p "require('playwright/package.json').version" > playwright-version.txt

      - name: Exercise full learner intelligence and platform/install contract
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mchem-browser-v4-${BROWSER_NAME}
          cat > verify.cjs <<'JS'
          const fs=require('fs');
          const {chromium,firefox,webkit}=require('playwright');
          const name=process.env.BROWSER_NAME, base=process.env.BASE_URL;
          const engines={chromium:()=>chromium.launch({headless:true}),chrome:()=>chromium.launch({headless:true,channel:'chrome'}),msedge:()=>chromium.launch({headless:true,channel:'msedge'}),firefox:()=>firefox.launch({headless:true}),webkit:()=>webkit.launch({headless:true})};
          function assert(v,m){if(!v)throw new Error(m)}
          async function visibleText(page,sel,needle){const t=await page.locator(sel).innerText();assert(t.includes(needle),`missing ${needle} in ${sel}`)}
          async function dismissOnboarding(page){const o=page.locator('#frontier-onboarding');if(await o.isVisible().catch(()=>false)){await o.locator('[data-frontier-done]').last().click();}}
          async function safeReload(page,timeout=30000){
            try{await page.evaluate(()=>location.reload());await page.waitForLoadState('domcontentloaded',{timeout});}
            catch(e){if(!/internal error|navigation|closed/i.test(String(e)))throw e;await page.waitForTimeout(1200);}
            await page.locator('#app').waitFor({state:'visible',timeout});
          }
          async function coreScenario(browser){
            const context=await browser.newContext({viewport:{width:1366,height:768}}), page=await context.newPage();
            const pageErrors=[],consoleErrors=[],network=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('request',r=>network.push(r.url()));
            const response=await page.goto(base,{waitUntil:'domcontentloaded',timeout:45000});
            assert(response&&response.status()===200,'initial HTTP not 200');
            await page.locator('#app').waitFor({state:'visible'});await dismissOnboarding(page);
            assert((await page.title())==='MUSITU Chemistry Mastery','wrong title');
            for(const n of ['Home','Learn','Review','Prove','More']) await page.getByRole('button',{name:n,exact:true}).waitFor();
            const bridge=await page.evaluate(()=>({present:!!window.MUSITUActionBridge,version:window.MUSITUActionBridge?.version,strict:window.MUSITUActionBridge?.strictCsp,platform:MUSITUFrontier.runtimePlatform(),guidance:MUSITUFrontier.installGuidance()}));
            assert(bridge.present&&bridge.version==='1.0.0'&&bridge.strict===true,'strict-CSP action bridge missing');
            assert(bridge.guidance&&bridge.guidance.length>20,'automatic platform/install guidance absent');

            await page.getByRole('button',{name:'Learn',exact:true}).click();
            await page.getByRole('heading',{name:'Mastery chapters'}).waitFor();
            await page.locator('.chapter').first().click();
            await page.getByRole('button',{name:/Bookmark/}).click();
            await page.getByRole('button',{name:'Confidence: low'}).click();
            await safeReload(page);await dismissOnboarding(page);
            await page.getByRole('button',{name:/Bookmark/}).waitFor();
            assert((await page.getByRole('button',{name:/Bookmark/}).getAttribute('class')||'').includes('on'),'bookmark did not persist');
            assert((await page.getByRole('button',{name:'Confidence: low'}).getAttribute('class')||'').includes('on'),'confidence did not persist');

            await page.evaluate(()=>go('diagnostic'));
            await page.getByRole('heading',{name:'36-mark entry diagnostic'}).waitFor();
            await page.locator('#dq0').fill('Committed chemistry diagnostic response');
            await page.getByRole('button',{name:'Reveal self-mark guide'}).first().click();
            assert(!(await page.locator('#da0').getAttribute('class')).includes('hidden'),'diagnostic marking guide failed to reveal after committed answer');

            await page.evaluate(()=>go('exam'));
            await page.getByRole('heading',{name:'Exam mode'}).waitFor();
            await page.evaluate(()=>startExam(5));
            await page.getByRole('heading',{name:'5-minute exam session'}).waitFor();
            await page.locator('textarea[aria-label="Exam answer 1"]').fill('Timed candidate answer');
            await page.evaluate(()=>finishExam());
            await page.getByText('Marking guidance').first().waitFor();

            await page.evaluate(()=>go('prove'));
            await page.getByRole('heading',{name:'Answer Chemistry as Chemistry.'}).waitFor();
            await page.locator('[data-sr-equation]').fill('HCl + NaOH → NaCl + H₂O');
            await page.locator('[data-sr-mode="structure"]').click();
            await page.locator('[data-sr-panel="structure"] [data-sr-add]').first().click();
            await page.locator('[data-sr-finalize]').click();
            await visibleText(page,'[data-sr-status]','Response locked for review');
            await safeReload(page);await dismissOnboarding(page);
            assert((await page.locator('[data-sr-equation]').inputValue()).includes('HCl + NaOH'),'scientific response draft did not persist');
            assert(await page.locator('[data-sr-reopen]').isEnabled(),'reopen unavailable after reload');
            await page.locator('[data-sr-reopen]').click();
            assert(await page.locator('[data-sr-equation]').isEditable(),'equation not editable after reopen');

            await page.evaluate(()=>go('store'));
            await page.locator('#app').getByText(/Free edition|Premium|Annual/i).first().waitFor();
            const device=await page.evaluate(()=>({id:document.body.innerText.includes('Device ID'),commerce:!!window.musituChemistryCommerceV1||document.body.innerText.includes('Premium')}));
            assert(device.id&&device.commerce,'Device ID / Premium boundary missing');
            await page.evaluate(()=>go('help'));
            await page.getByRole('heading',{name:'Offline behavior'}).waitFor();

            await page.setViewportSize({width:390,height:844});await page.evaluate(()=>go('home'));await dismissOnboarding(page);await page.getByRole('button',{name:'Home',exact:true}).waitFor();
            assert((await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth))<=2,'mobile horizontal overflow');
            await page.setViewportSize({width:1440,height:900});assert((await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth))<=2,'desktop horizontal overflow');

            const sw=await page.evaluate(async()=>{if(!('serviceWorker' in navigator))return {supported:false};const r=await navigator.serviceWorker.ready;return {supported:true,scope:r.scope,controller:!!navigator.serviceWorker.controller}});
            assert(sw.supported,'service worker unsupported');
            await safeReload(page);await dismissOnboarding(page);
            assert(await page.evaluate(()=>!!navigator.serviceWorker.controller),'service worker did not control page after reload');
            await context.setOffline(true);await safeReload(page,20000);await dismissOnboarding(page);await page.getByRole('button',{name:'Home',exact:true}).waitFor();await context.setOffline(false);

            const manifest=await page.evaluate(async()=>{const u=document.querySelector('link[rel="manifest"]')?.href;if(!u)return null;const r=await fetch(u,{cache:'no-store'});return {status:r.status,json:await r.json()}});
            assert(manifest&&manifest.status===200&&manifest.json.display==='standalone','PWA manifest contract failed');
            const prohibited=network.filter(u=>/openai|anthropic|gemini|generativelanguage|api\.groq|cohere/i.test(u));
            assert(!prohibited.length,'unexpected remote AI request '+JSON.stringify(prohibited));
            assert(pageErrors.length===0,'page errors: '+JSON.stringify(pageErrors));
            const meaningfulConsole=consoleErrors.filter(x=>!/favicon/i.test(x));
            assert(meaningfulConsole.length===0,'console errors: '+JSON.stringify(meaningfulConsole));
            await context.close();return {browser:name,http:response.status(),navigation:'PASS',learner_state_persistence:'PASS',diagnostic:'PASS',exam:'PASS',scientific_response:'PASS',premium_device_boundary:'PASS',responsive:'PASS',offline:'PASS',manifest:'PASS',platform:bridge.platform,install_guidance:'PASS',strict_csp_action_bridge:'PASS',console_errors:meaningfulConsole,page_errors:pageErrors};
          }
          async function platformDiscovery(browser){
            const profiles=[
              ['android-chrome',{userAgent:'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36',viewport:{width:390,height:844},isMobile:true,hasTouch:true},'android-chrome'],
              ['samsung',{userAgent:'Mozilla/5.0 (Linux; Android 14; SAMSUNG SM-S921B) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/27.0 Chrome/125.0 Mobile Safari/537.36',viewport:{width:390,height:844},isMobile:true,hasTouch:true},'samsung'],
              ['ios-safari',{userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1',viewport:{width:390,height:844},isMobile:true,hasTouch:true},'ios-safari'],
              ['ios-inapp',{userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Instagram 350.0.0',viewport:{width:390,height:844},isMobile:true,hasTouch:true},'ios-inapp'],
              ['desktop-edge',{userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36 Edg/128.0',viewport:{width:1366,height:768}},'desktop-edge'],
              ['desktop-firefox',{userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:130.0) Gecko/20100101 Firefox/130.0',viewport:{width:1366,height:768}},'desktop-firefox']
            ];
            const out=[];
            for(const [label,opts,want] of profiles){const c=await browser.newContext(opts);const p=await c.newPage();await p.goto(base,{waitUntil:'domcontentloaded',timeout:45000});await p.locator('#app').waitFor();await dismissOnboarding(p);const got=await p.evaluate(()=>({platform:MUSITUFrontier.runtimePlatform(),guidance:MUSITUFrontier.installGuidance()}));assert(got.platform===want,`${label} classified as ${got.platform}`);assert(got.guidance.length>20,`${label} guidance absent`);out.push({profile:label,platform:got.platform,guidance:'PASS'});await c.close();}
            return out;
          }
          (async()=>{const browser=await engines[name]();try{const core=await coreScenario(browser);const discovery=name==='chromium'?await platformDiscovery(browser):null;const out={schema:'musitu.chemistry.frontier.universal.browser_matrix.v4',github_sha:process.env.GITHUB_SHA,base_url:base,playwright_version:require('playwright/package.json').version,core,platform_discovery:discovery,physical_device_certification:false,gate:'PASS'};fs.writeFileSync('result.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out));}finally{await browser.close()}})().catch(e=>{fs.writeFileSync('failure.txt',String(e.stack||e)+'\n');console.error(e);process.exit(1)});
          JS
          node verify.cjs
          sha256sum result.json > result.sha256
          echo MUSITU_BROWSER_${BROWSER_NAME}_PARITY_PASS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musitu-universal-preview-browser-v4-${{ matrix.browser }}
          path: |
            /tmp/mchem-browser-v4-${{ matrix.browser }}/result.json
            /tmp/mchem-browser-v4-${{ matrix.browser }}/result.sha256
            /tmp/mchem-browser-v4-${{ matrix.browser }}/failure.txt
            /tmp/mchem-browser-v4-${{ matrix.browser }}/playwright-version.txt
          if-no-files-found: warn
          retention-days: 90

  matrix-gate:
    needs: browser
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all five engines green
        env:
          MATRIX_RESULT: ${{ needs.browser.result }}
        run: |
          set -euo pipefail
          test "$MATRIX_RESULT" = success
          echo MUSITU_CHEMISTRY_FRONTIER_UNIVERSAL_PREVIEW_BROWSER_MATRIX_V4_PASS
