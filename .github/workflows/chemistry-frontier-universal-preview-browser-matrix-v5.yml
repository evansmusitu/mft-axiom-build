name: MUSITU Chemistry Frontier Universal Preview Browser Matrix v5

on:
  push:
    branches: [chemistry-frontier-universal-20260908]
    paths: ['.github/workflows/chemistry-frontier-universal-preview-browser-matrix-v5.yml']

permissions:
  contents: read

concurrency:
  group: musitu-chemistry-frontier-universal-preview-browser-matrix-v5
  cancel-in-progress: false

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome, msedge, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_URL: https://payments.mftintelligence.com/chemistry/frontier-universal-preview/
      BROWSER_NAME: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright 1.63.0 and engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mchem-browser-v5-${BROWSER_NAME}
          cd /tmp/mchem-browser-v5-${BROWSER_NAME}
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps "$BROWSER_NAME"
          node -p "require('playwright/package.json').version" > playwright-version.txt

      - name: Run full parity with realistic platform discovery
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mchem-browser-v5-${BROWSER_NAME}
          python - <<'PY'
          from pathlib import Path
          import os, textwrap
          src=Path(os.environ['GITHUB_WORKSPACE']+'/.github/workflows/chemistry-frontier-universal-preview-browser-matrix-v4.yml').read_text()
          marker="          cat > verify.cjs <<'JS'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          JS\n",start)
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end].splitlines())+'\n'

          old_start=script.index('async function platformDiscovery(browser){')
          old_end=script.index('\n(async()=>',old_start)
          replacement=textwrap.dedent(r'''
          async function platformDiscovery(browser){
            let profiles=[];
            if(name==='chromium')profiles=[
              ['android-chrome',{userAgent:'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36',viewport:{width:390,height:844},isMobile:true,hasTouch:true},'android-chrome'],
              ['samsung',{userAgent:'Mozilla/5.0 (Linux; Android 14; SAMSUNG SM-S921B) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/27.0 Chrome/125.0 Mobile Safari/537.36',viewport:{width:390,height:844},isMobile:true,hasTouch:true},'samsung'],
              ['desktop-edge',{userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36 Edg/128.0',viewport:{width:1366,height:768}},'desktop-edge']
            ];
            else if(name==='webkit')profiles=[
              ['ios-safari',{userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1',viewport:{width:390,height:844},isMobile:true,hasTouch:true},'ios-safari'],
              ['ios-inapp',{userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Instagram 350.0.0',viewport:{width:390,height:844},isMobile:true,hasTouch:true},'ios-inapp']
            ];
            else if(name==='firefox')profiles=[
              ['desktop-firefox',{userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:130.0) Gecko/20100101 Firefox/130.0',viewport:{width:1366,height:768}},'desktop-firefox']
            ];
            const out=[];
            for(const [label,opts,want] of profiles){
              const c=await browser.newContext(opts),p=await c.newPage();
              const errors=[];p.on('pageerror',e=>errors.push(String(e)));
              const r=await p.goto(base,{waitUntil:'domcontentloaded',timeout:45000});assert(r&&r.status()===200,label+' HTTP failed');
              await p.locator('#app').waitFor();await dismissOnboarding(p);
              const got=await p.evaluate(()=>({platform:MUSITUFrontier.runtimePlatform(),guidance:MUSITUFrontier.installGuidance(),requestInstall:typeof MUSITUFrontier.requestInstall}));
              assert(got.platform===want,`${label} classified as ${got.platform}`);
              assert(got.guidance&&got.guidance.length>20,`${label} guidance absent`);
              assert(got.requestInstall==='function',`${label} requestInstall API absent`);
              assert(errors.length===0,`${label} page errors ${JSON.stringify(errors)}`);
              out.push({profile:label,platform:got.platform,automatic_device_discovery:'PASS',install_guidance:'PASS',request_install_api:'PASS'});
              await c.close();
            }
            return out;
          }
          ''').strip()
          script=script[:old_start]+replacement+script[old_end:]
          script=script.replace("const discovery=name==='chromium'?await platformDiscovery(browser):null;","const discovery=await platformDiscovery(browser);if(['chromium','webkit','firefox'].includes(name))assert(discovery.length>0,'platform discovery profiles did not run');")
          script=script.replace("browser_matrix.v4","browser_matrix.v5")
          hdr="assert(response&&response.status()===200,'initial HTTP not 200');"
          script=script.replace(hdr,hdr+"\n  const headers=await response.allHeaders();assert(headers['x-musitu-carrier']==='frontier-universal-1.3.0-parity-v2','wrong carrier header');assert(headers['x-musitu-compatibility-overlay']==='strict-csp-event-bridge-v1','compatibility overlay header absent');",1)

          # Attribute console diagnostics to online/offline phases. WebKit 26.6 emits one
          # driver-level resource diagnostic during a deliberately offline reload even when
          # the service worker successfully restores the app. Only that exact message, only
          # in the offline phase, is classified as a harness diagnostic; all other console
          # and page errors remain fatal.
          script=script.replace("const pageErrors=[],consoleErrors=[],network=[];","const pageErrors=[],consoleErrors=[],network=[];let testPhase='online';",1)
          script=script.replace("page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});","page.on('console',m=>{if(m.type()==='error')consoleErrors.push({phase:testPhase,text:m.text()})});",1)
          offline="await context.setOffline(true);await safeReload(page,20000);await dismissOnboarding(page);await page.getByRole('button',{name:'Home',exact:true}).waitFor();await context.setOffline(false);"
          offline_repl="testPhase='offline';await context.setOffline(true);await safeReload(page,20000);await dismissOnboarding(page);await page.getByRole('button',{name:'Home',exact:true}).waitFor();await context.setOffline(false);testPhase='online';"
          if offline not in script: raise SystemExit('offline phase anchor drift')
          script=script.replace(offline,offline_repl,1)
          old_console="const meaningfulConsole=consoleErrors.filter(x=>!/favicon/i.test(x));"
          new_console="const harnessDiagnostics=consoleErrors.filter(x=>name==='webkit'&&x.phase==='offline'&&x.text==='Failed to load resource: WebKit encountered an internal error');const meaningfulConsole=consoleErrors.filter(x=>!/favicon/i.test(x.text)&&!(name==='webkit'&&x.phase==='offline'&&x.text==='Failed to load resource: WebKit encountered an internal error'));"
          if old_console not in script: raise SystemExit('console filter anchor drift')
          script=script.replace(old_console,new_console,1)
          script=script.replace("console_errors:meaningfulConsole,page_errors:pageErrors","console_errors:meaningfulConsole,webkit_offline_harness_diagnostics:harnessDiagnostics,page_errors:pageErrors",1)
          Path('verify.cjs').write_text(script)
          PY
          node verify.cjs
          sha256sum result.json > result.sha256
          echo MUSITU_BROWSER_${BROWSER_NAME}_FULL_PARITY_V5_PASS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musitu-universal-preview-browser-v5-${{ matrix.browser }}
          path: |
            /tmp/mchem-browser-v5-${{ matrix.browser }}/result.json
            /tmp/mchem-browser-v5-${{ matrix.browser }}/result.sha256
            /tmp/mchem-browser-v5-${{ matrix.browser }}/failure.txt
            /tmp/mchem-browser-v5-${{ matrix.browser }}/playwright-version.txt
          if-no-files-found: warn
          retention-days: 90

  matrix-gate:
    needs: browser
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all five engines and realistic discovery profiles green
        env:
          MATRIX_RESULT: ${{ needs.browser.result }}
        run: |
          set -euo pipefail
          test "$MATRIX_RESULT" = success
          echo MUSITU_CHEMISTRY_FRONTIER_UNIVERSAL_PREVIEW_BROWSER_MATRIX_V5_PASS
