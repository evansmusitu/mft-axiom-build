name: MUSITU Chemistry Frontier Universal Production App Deploy v1

on:
  push:
    branches: [chemistry-frontier-universal-20260908]
    paths: ['.github/workflows/chemistry-frontier-universal-production-app-deploy-v1.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: musitu-chemistry-universal-production-app
  cancel-in-progress: false

jobs:
  deploy-production-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STABLE_APK_URL: https://payments.mftintelligence.com/chemistry/download/MUSITU_Chemistry_Mastery_1.3.0.apk
      STABLE_APK_PATH: /chemistry/download/MUSITU_Chemistry_Mastery_1.3.0.apk
      STABLE_APK_SHA256: 4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd
      STABLE_APK_BYTES: '5892286'
      RETIRED_APK_URL: https://payments.mftintelligence.com/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk
      SEALED_REPRO_WEB_ARCHIVE_SHA256: 1445074e87e8c4a9a15281baa586855fe31f92c06dd393a11458adce9821ec30
      MATRIX_RUN_ID: '34333111224'
      MATRIX_HEAD_SHA: 61655b7a5135084e0eef031c6ad36acada743b01
      PREVIEW_RUN_ID: '34332415214'
      PREVIEW_HEAD_SHA: 0048b13b1a542a4c9d5a546e8b5b490fbf411583
      APP_BASE: https://payments.mftintelligence.com/chemistry/app
      INSTALL_URL: https://payments.mftintelligence.com/chemistry/install
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      WORKER_NAME: musitu-chemistry-universal-app

    steps:
      - uses: actions/checkout@v4

      - name: Pin successful preview and five-engine parity gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-production-app /tmp/mchem-production-app-evidence
          mkdir -p /tmp/mchem-production-app/public/chemistry/app /tmp/mchem-production-app/src /tmp/mchem-production-app-evidence
          python - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          def get(path):
            q=urllib.request.Request('https://api.github.com'+path,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'MUSITU-Universal-Production-v1'})
            with urllib.request.urlopen(q,timeout=30) as r:return json.load(r)
          matrix=get(f'/repos/{repo}/actions/runs/{os.environ["MATRIX_RUN_ID"]}')
          preview=get(f'/repos/{repo}/actions/runs/{os.environ["PREVIEW_RUN_ID"]}')
          if matrix.get('status')!='completed' or matrix.get('conclusion')!='success' or matrix.get('head_sha')!=os.environ['MATRIX_HEAD_SHA']:raise SystemExit('five-engine matrix gate rejected')
          if preview.get('status')!='completed' or preview.get('conclusion')!='success' or preview.get('head_sha')!=os.environ['PREVIEW_HEAD_SHA']:raise SystemExit('preview gate rejected')
          jobs=get(f'/repos/{repo}/actions/runs/{os.environ["MATRIX_RUN_ID"]}/jobs?per_page=100').get('jobs',[])
          required={'browser (chromium)','browser (chrome)','browser (msedge)','browser (firefox)','browser (webkit)','matrix-gate'}
          observed={j.get('name'):j.get('conclusion') for j in jobs}
          if not required.issubset(observed) or any(observed[n]!='success' for n in required):raise SystemExit('matrix job set rejected '+repr(observed))
          out={'preview_run_id':int(os.environ['PREVIEW_RUN_ID']),'preview_head_sha':os.environ['PREVIEW_HEAD_SHA'],'matrix_run_id':int(os.environ['MATRIX_RUN_ID']),'matrix_head_sha':os.environ['MATRIX_HEAD_SHA'],'required_jobs':sorted(required),'all_required_jobs_success':True,'gate':'MUSITU_CHEMISTRY_UNIVERSAL_PRODUCTION_PREREQUISITES_PASS'}
          open('/tmp/mchem-production-app-evidence/prerequisites.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Prove current public release boundaries before mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,urllib.error,urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          no=urllib.request.build_opener(NoRedirect); yes=urllib.request.build_opener()
          ANDROID='Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Mobile Safari/537.36'
          DESKTOP='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'
          def req(url,ua,follow=True):
            q=urllib.request.Request(url,headers={'User-Agent':ua,'Cache-Control':'no-cache, no-store','Pragma':'no-cache'})
            try:
              with (yes if follow else no).open(q,timeout=60) as r:return r.status,r.geturl(),{k.lower():v for k,v in r.headers.items()},r.read()
            except urllib.error.HTTPError as e:return e.code,e.geturl(),{k.lower():v for k,v in e.headers.items()},e.read()
          c,u,h,b=req(os.environ['STABLE_APK_URL'],DESKTOP,True)
          if c!=200 or len(b)!=int(os.environ['STABLE_APK_BYTES']) or hashlib.sha256(b).hexdigest()!=os.environ['STABLE_APK_SHA256']:raise SystemExit('stable Android artifact drift before mutation')
          c12,u12,h12,b12=req(os.environ['RETIRED_APK_URL'],DESKTOP,False)
          if c12!=410 or h12.get('x-musitu-release-status')!='retired' or b12[:2]==b'PK':raise SystemExit('1.2 retirement boundary drift before mutation')
          ca,ua,ha,ba=req(os.environ['APP_BASE'],ANDROID,False)
          ci,ui,hi,bi=req(os.environ['INSTALL_URL'],ANDROID,False)
          if ca not in (301,302,303,307,308) or '/chemistry/install' not in ha.get('location',''):raise SystemExit('current Android app handoff drift')
          if ci not in (301,302,303,307,308) or os.environ['STABLE_APK_PATH'] not in hi.get('location',''):raise SystemExit('current Android install handoff drift')
          out={'stable_1_3_http':c,'stable_1_3_sha256':hashlib.sha256(b).hexdigest(),'stable_1_3_bytes':len(b),'retired_1_2_http':c12,'retired_1_2_status':h12.get('x-musitu-release-status'),'android_app_predeploy_http':ca,'android_app_predeploy_location':ha.get('location'),'android_install_predeploy_http':ci,'android_install_predeploy_location':hi.get('location'),'gate':'MUSITU_CHEMISTRY_PREDEPLOY_BOUNDARIES_PASS'}
          open('/tmp/mchem-production-app-evidence/predeploy.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Reconstruct exact Android-embedded 27-file carrier and apply sealed compatibility overlay
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 180 "$STABLE_APK_URL" -o /tmp/stable-production.apk
          echo "$STABLE_APK_SHA256  /tmp/stable-production.apk" | sha256sum -c -
          test "$(stat -c %s /tmp/stable-production.apk)" = "$STABLE_APK_BYTES"
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          manifest=json.load(open('commerce/chemistry/frontier_universal/FULL_PARITY_MANIFEST_20260909.json'))
          expected={k:v['sha256'] for k,v in manifest['files'].items()}
          out=pathlib.Path('/tmp/mchem-production-app/public/chemistry/app'); observed={}
          with zipfile.ZipFile('/tmp/stable-production.apk') as z:
            for n in z.namelist():
              if not n.startswith('assets/www/') or n.endswith('/'):continue
              rel=n[len('assets/www/'):]
              if not rel:continue
              data=z.read(n); p=out/rel; p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data); observed[rel]=hashlib.sha256(data).hexdigest()
          if observed!=expected:raise SystemExit('Android embedded carrier drift')
          print('ANDROID_EMBEDDED_PRODUCTION_CARRIER=27/27 PASS')
          PY
          python commerce/chemistry/frontier_universal/patch_web_event_bridge.py /tmp/mchem-production-app/public/chemistry/app | tee /tmp/mchem-production-app-evidence/overlay.json
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/mchem-production-app/public/chemistry/app')
          base=json.load(open('commerce/chemistry/frontier_universal/FULL_PARITY_MANIFEST_20260909.json'))
          overlay=json.load(open('/tmp/mchem-production-app-evidence/overlay.json'))
          expected={k:v['sha256'] for k,v in base['files'].items()}
          for k,v in overlay.items():expected[k]=v['sha256']
          observed={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if observed!=expected:raise SystemExit('post-overlay production carrier drift')
          pathlib.Path('/tmp/mchem-production-app-evidence/live-expected.json').write_text(json.dumps(expected,indent=2,sort_keys=True)+'\n')
          print('PRODUCTION_PARITY_CARRIER_POST_OVERLAY=27/27 PASS')
          PY

      - name: Build bounded device-aware production worker
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mchem-production-app/src/index.js <<'JS'
          const APP='/chemistry/app';
          const INSTALL='/chemistry/install';
          const APK='/chemistry/download/MUSITU_Chemistry_Mastery_1.3.0.apk';
          const APK_SHA='4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd';
          const ARCHIVE='1445074e87e8c4a9a15281baa586855fe31f92c06dd393a11458adce9821ec30';
          const OVERLAY='strict-csp-event-bridge-v1';
          const android=ua=>/Android/i.test(ua||'');
          const navigation=req=>req.method==='GET'&&((req.headers.get('sec-fetch-dest')||'').toLowerCase()==='document'||(req.headers.get('accept')||'').toLowerCase().includes('text/html'));
          const redirect=(location,status,extra={})=>new Response(null,{status,headers:{location,'cache-control':'no-store',...extra}});
          function secure(response,path){
            const h=new Headers(response.headers);
            h.set('X-Content-Type-Options','nosniff');h.set('Referrer-Policy','no-referrer');h.set('X-Frame-Options','DENY');
            h.set('Permissions-Policy','camera=(), microphone=(), geolocation=()');h.set('Cross-Origin-Resource-Policy','same-origin');
            h.set('X-MUSITU-Carrier','frontier-universal-1.3.0-parity-v2');h.set('X-MUSITU-Origin-Archive-SHA256',ARCHIVE);h.set('X-MUSITU-Compatibility-Overlay',OVERLAY);h.set('X-MUSITU-Carrier-Files','27');
            if(path===APP+'/'||path===APP+'/index.html')h.set('Content-Security-Policy',"default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; script-src-attr 'none'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'");
            if(path===APP+'/'||path===APP+'/index.html'||path.endsWith('/sw.js')||path.endsWith('/manifest.webmanifest'))h.set('Cache-Control','no-cache, no-store, max-age=0');
            else h.set('Cache-Control','public, max-age=86400, immutable');
            return new Response(response.body,{status:response.status,statusText:response.statusText,headers:h});
          }
          export default {async fetch(request,env){
            const u=new URL(request.url),p=u.pathname,ua=request.headers.get('user-agent')||'';
            if(p===INSTALL||p===INSTALL+'/diagnostics'){
              if(android(ua))return redirect(APK,302,{'x-musitu-platform-route':'android-native','x-musitu-release-version':'1.3.0','x-musitu-release-sha256':APK_SHA});
              return redirect(APP+'/#help',302,{'x-musitu-platform-route':'universal-parity','x-musitu-install-surface':'carrier-help'});
            }
            if(p===APP){
              if(android(ua))return redirect(INSTALL,302,{'x-musitu-platform-route':'android-native'});
              return redirect(APP+'/',308,{'x-musitu-platform-route':'universal-parity'});
            }
            if(!p.startsWith(APP+'/'))return new Response('Not found',{status:404});
            if(android(ua)&&navigation(request))return redirect(INSTALL,302,{'x-musitu-platform-route':'android-native'});
            if(p===APP+'/index.html'){
              const root=new URL(request.url);root.pathname=APP+'/';
              const r=await env.ASSETS.fetch(new Request(root.toString(),request));
              return secure(r,p);
            }
            const r=await env.ASSETS.fetch(request);return secure(r,p);
          }};
          JS
          node --check /tmp/mchem-production-app/src/index.js
          cat > /tmp/mchem-production-app/wrangler.jsonc <<'JSON'
          {
            "name":"musitu-chemistry-universal-app",
            "account_id":"93f395f5121954671f92fffa453d6b61",
            "compatibility_date":"2026-09-06",
            "workers_dev":false,
            "main":"src/index.js",
            "routes":[
              {"pattern":"payments.mftintelligence.com/chemistry/app*","zone_id":"5b56528f03948ff5917a5e0cd9f7109e"},
              {"pattern":"payments.mftintelligence.com/chemistry/install*","zone_id":"5b56528f03948ff5917a5e0cd9f7109e"}
            ],
            "assets":{"directory":"./public","binding":"ASSETS","run_worker_first":true}
          }
          JSON
          cat > /tmp/mchem-production-app/wrangler-rollback.jsonc <<'JSON'
          {
            "name":"musitu-chemistry-universal-app",
            "account_id":"93f395f5121954671f92fffa453d6b61",
            "compatibility_date":"2026-09-06",
            "workers_dev":false,
            "main":"src/index.js",
            "routes":[],
            "assets":{"directory":"./public","binding":"ASSETS","run_worker_first":true}
          }
          JSON

      - name: Deploy production app routes and verify all bytes plus platform handoffs
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          rollback(){
            echo 'Production verification failed; removing specific app/install routes to restore commerce-worker routing.' >&2
            (cd /tmp/mchem-production-app && npx --yes wrangler@latest deploy --config wrangler-rollback.jsonc) >> /tmp/mchem-production-app-evidence/rollback.txt 2>&1 || true
          }
          trap rollback ERR
          (cd /tmp/mchem-production-app && npx --yes wrangler@latest deploy --config wrangler.jsonc) | tee /tmp/mchem-production-app-evidence/wrangler.txt
          python - <<'PY'
          import hashlib,json,os,pathlib,time,urllib.error,urllib.request
          expected=json.load(open('/tmp/mchem-production-app-evidence/live-expected.json'))
          APP=os.environ['APP_BASE'].rstrip('/'); INSTALL=os.environ['INSTALL_URL']; APK=os.environ['STABLE_APK_URL']; APK_PATH=os.environ['STABLE_APK_PATH']
          ANDROID='Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Mobile Safari/537.36'
          SAMSUNG='Mozilla/5.0 (Linux; Android 14; SAMSUNG SM-S921B) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/27.0 Chrome/125.0 Mobile Safari/537.36'
          IPHONE='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          DESKTOP='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'
          FIREFOX='Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:130.0) Gecko/20100101 Firefox/130.0'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          no=urllib.request.build_opener(NoRedirect); yes=urllib.request.build_opener()
          def req(url,ua=DESKTOP,follow=True,accept='*/*'):
            q=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':accept,'Cache-Control':'no-cache, no-store','Pragma':'no-cache'})
            try:
              with (yes if follow else no).open(q,timeout=60) as r:return r.status,r.geturl(),{k.lower():v for k,v in r.headers.items()},r.read()
            except urllib.error.HTTPError as e:return e.code,e.geturl(),{k.lower():v for k,v in e.headers.items()},e.read()
          # Wait for route convergence using a non-Android app root.
          last=None
          for _ in range(60):
            c,u,h,b=req(APP+'/',DESKTOP,True,'text/html')
            last=(c,h.get('x-musitu-carrier'),h.get('x-musitu-compatibility-overlay'),len(b))
            if c==200 and h.get('x-musitu-carrier')=='frontier-universal-1.3.0-parity-v2' and h.get('x-musitu-compatibility-overlay')=='strict-csp-event-bridge-v1':break
            time.sleep(1)
          else:raise SystemExit('production app route did not converge '+repr(last))
          live={}
          for rel,want in expected.items():
            url=APP+'/' if rel=='index.html' else APP+'/'+rel; last=None
            for _ in range(20):
              c,u,h,b=req(url,DESKTOP,True)
              got=hashlib.sha256(b).hexdigest();last=(c,len(b),got,h.get('x-musitu-carrier'))
              if c==200 and got==want and h.get('x-musitu-carrier')=='frontier-universal-1.3.0-parity-v2':live[rel]={'http':c,'bytes':len(b),'sha256':got};break
              time.sleep(.5)
            else:raise SystemExit('live production file mismatch '+rel+' '+repr(last))
          # Exact device-aware routing boundaries.
          for ua,label in [(ANDROID,'android-chrome'),(SAMSUNG,'samsung')]:
            c,u,h,b=req(APP,ua,False,'text/html')
            if c!=302 or h.get('location')!='/chemistry/install' or h.get('x-musitu-platform-route')!='android-native':raise SystemExit(label+' app route mismatch '+repr((c,h)))
            c,u,h,b=req(INSTALL,ua,False,'text/html')
            if c!=302 or h.get('location')!=APK_PATH or h.get('x-musitu-release-sha256')!=os.environ['STABLE_APK_SHA256']:raise SystemExit(label+' install route mismatch '+repr((c,h)))
          for ua,label in [(IPHONE,'ios-safari'),(DESKTOP,'desktop-chrome'),(FIREFOX,'desktop-firefox')]:
            c,u,h,b=req(APP,ua,False,'text/html')
            if c!=308 or h.get('location')!='/chemistry/app/' or h.get('x-musitu-platform-route')!='universal-parity':raise SystemExit(label+' app route mismatch '+repr((c,h)))
            c,u,h,b=req(INSTALL,ua,False,'text/html')
            if c!=302 or h.get('location')!='/chemistry/app/#help' or h.get('x-musitu-platform-route')!='universal-parity':raise SystemExit(label+' install route mismatch '+repr((c,h)))
          # Stable/retired Android release invariants remain exact.
          c,u,h,b=req(APK,DESKTOP,True)
          if c!=200 or len(b)!=int(os.environ['STABLE_APK_BYTES']) or hashlib.sha256(b).hexdigest()!=os.environ['STABLE_APK_SHA256']:raise SystemExit('stable APK changed after cutover')
          c12,u12,h12,b12=req(os.environ['RETIRED_APK_URL'],DESKTOP,False)
          if c12!=410 or h12.get('x-musitu-release-status')!='retired' or b12[:2]==b'PK':raise SystemExit('retired 1.2 boundary changed')
          # Existing commerce authority must remain reachable outside the bounded routes.
          commerce={}
          for path in ['/chemistry/verify','/chemistry/plans','/chemistry/healthz']:
            c,u,h,b=req('https://payments.mftintelligence.com'+path,DESKTOP,True,'text/html,application/json')
            if c!=200:raise SystemExit('commerce endpoint changed '+path+' '+str(c))
            commerce[path]={'http':c,'bytes':len(b)}
          c,u,h,b=req(APP+'/',DESKTOP,True,'text/html');csp=h.get('content-security-policy','')
          if "script-src 'self'" not in csp or "script-src-attr 'none'" not in csp:raise SystemExit('production strict CSP missing')
          ev={'schema':'musitu.chemistry.frontier.universal_production_app.v1','github_sha':os.environ['GITHUB_SHA'],'production_app_url':APP+'/','install_url':INSTALL,'stable_android_source_sha256':os.environ['STABLE_APK_SHA256'],'stable_android_bytes':int(os.environ['STABLE_APK_BYTES']),'sealed_origin_archive_sha256':os.environ['SEALED_REPRO_WEB_ARCHIVE_SHA256'],'live_carrier_identity':'27/27 PASS','deterministic_compatibility_overlay':'strict-csp-event-bridge-v1','strict_script_csp_preserved':True,'automatic_platform_routes':{'android_chrome':'native-1.3','samsung':'native-1.3','ios_safari':'universal-parity','desktop_chrome':'universal-parity','desktop_firefox':'universal-parity'},'install_help_route_non_android':'/chemistry/app/#help','stable_1_3_unchanged':True,'retired_1_2_still_410':True,'commerce_worker_script_changed':False,'commerce_endpoints':commerce,'vercel_used':False,'gate':'MUSITU_CHEMISTRY_FRONTIER_UNIVERSAL_PRODUCTION_APP_DEPLOY_PASS'}
          raw=(json.dumps(ev,indent=2,sort_keys=True)+'\n').encode();pathlib.Path('/tmp/mchem-production-app-evidence/result.json').write_bytes(raw);pathlib.Path('/tmp/mchem-production-app-evidence/result.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  result.json\n');print(json.dumps(ev,sort_keys=True))
          PY
          trap - ERR
          echo MUSITU_CHEMISTRY_FRONTIER_UNIVERSAL_PRODUCTION_APP_DEPLOY_PASS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musitu-chemistry-frontier-universal-production-app-v1
          path: /tmp/mchem-production-app-evidence
          retention-days: 90
          if-no-files-found: warn
