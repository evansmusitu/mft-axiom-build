name: MUSITU Chemistry Frontier Universal Web Bounded Preview Deploy v2

on:
  push:
    branches: [chemistry-frontier-universal-20260908]
    paths: ['.github/workflows/chemistry-frontier-universal-web-bounded-preview-deploy-v2.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: musitu-chemistry-frontier-universal-web-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STABLE_APK_URL: https://payments.mftintelligence.com/chemistry/download/MUSITU_Chemistry_Mastery_1.3.0.apk
      STABLE_APK_SHA256: 4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd
      STABLE_APK_BYTES: '5892286'
      SEALED_REPRO_WEB_ARCHIVE_SHA256: 1445074e87e8c4a9a15281baa586855fe31f92c06dd393a11458adce9821ec30
      PREFLIGHT_RUN_ID: '34322054750'
      PREFLIGHT_ARTIFACT_ID: '10092227395'
      PREFLIGHT_ARTIFACT_SHA256: d84eeae257c1ad34da319fc1254564e79e7b1e22ff6a2bbfda1e7fb83e451ea9
      PREVIEW_BASE: https://payments.mftintelligence.com/chemistry/frontier-universal-preview
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact pinned 27-file preview payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-universal-preview-v2 /tmp/mchem-universal-preview-v2-evidence /tmp/preflight-v2 /tmp/preflight-v2.zip
          mkdir -p /tmp/mchem-universal-preview-v2/public/chemistry/frontier-universal-preview /tmp/mchem-universal-preview-v2/src /tmp/mchem-universal-preview-v2-evidence /tmp/preflight-v2
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}" > /tmp/preflight-v2-run.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREFLIGHT_ARTIFACT_ID}/zip" -o /tmp/preflight-v2.zip
          echo "$PREFLIGHT_ARTIFACT_SHA256  /tmp/preflight-v2.zip" | sha256sum -c -
          unzip -q /tmp/preflight-v2.zip -d /tmp/preflight-v2
          python - <<'PY'
          import json,os
          r=json.load(open('/tmp/preflight-v2-run.json'))
          ev=json.load(open('/tmp/preflight-v2/result.json'))
          if r.get('status')!='completed' or r.get('conclusion')!='success' or r.get('head_sha')!='a8b565bf68da8b515937c67b831a0e250d8ca1f7': raise SystemExit('pinned preflight run rejected')
          if ev.get('gate')!='MUSITU_CHEMISTRY_FRONTIER_UNIVERSAL_WEB_PUBLISH_PREFLIGHT_PASS' or ev.get('carrier_payload_byte_identity')!='27/27 PASS': raise SystemExit('pinned preflight evidence rejected')
          if ev.get('sealed_repro_web_archive_sha256')!=os.environ['SEALED_REPRO_WEB_ARCHIVE_SHA256']: raise SystemExit('sealed archive provenance drift')
          PY
          curl --fail --location --silent --show-error --max-time 180 "$STABLE_APK_URL" -o /tmp/stable-v2.apk
          echo "$STABLE_APK_SHA256  /tmp/stable-v2.apk" | sha256sum -c -
          test "$(stat -c %s /tmp/stable-v2.apk)" = "$STABLE_APK_BYTES"
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          expected=json.load(open('/tmp/preflight-v2/carrier-file-sha256.json'))
          out=pathlib.Path('/tmp/mchem-universal-preview-v2/public/chemistry/frontier-universal-preview'); observed={}
          with zipfile.ZipFile('/tmp/stable-v2.apk') as z:
            for n in z.namelist():
              if not n.startswith('assets/www/') or n.endswith('/'): continue
              rel=n[len('assets/www/'):]
              if not rel: continue
              data=z.read(n); p=out/rel; p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data); observed[rel]=hashlib.sha256(data).hexdigest()
          if observed!=expected: raise SystemExit('27-file payload drift')
          print('PINNED_PREVIEW_PAYLOAD=27/27 PASS')
          PY
          cat > /tmp/mchem-universal-preview-v2/src/index.js <<'JS'
          const PREFIX='/chemistry/frontier-universal-preview';
          const ARCHIVE='1445074e87e8c4a9a15281baa586855fe31f92c06dd393a11458adce9821ec30';
          function secure(response,path){
            const h=new Headers(response.headers);
            h.set('X-Content-Type-Options','nosniff'); h.set('Referrer-Policy','no-referrer'); h.set('X-Frame-Options','DENY');
            h.set('Permissions-Policy','camera=(), microphone=(), geolocation=()'); h.set('Cross-Origin-Resource-Policy','same-origin');
            h.set('X-MUSITU-Carrier','frontier-universal-1.3.0'); h.set('X-MUSITU-Sealed-Archive-SHA256',ARCHIVE); h.set('X-MUSITU-Carrier-Files','27');
            if(path===PREFIX+'/' || path.endsWith('.html')) h.set('Content-Security-Policy',"default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'");
            if(path===PREFIX+'/' || path.endsWith('.html') || path.endsWith('sw.js') || path.endsWith('manifest.webmanifest')) h.set('Cache-Control','no-cache, no-store, max-age=0');
            else h.set('Cache-Control','public, max-age=86400, immutable');
            return new Response(response.body,{status:response.status,statusText:response.statusText,headers:h});
          }
          export default {async fetch(request,env){
            const u=new URL(request.url), path=u.pathname;
            if(path===PREFIX) return Response.redirect(u.origin+PREFIX+'/',308);
            if(!path.startsWith(PREFIX+'/')) return new Response('Not found',{status:404});
            const r=await env.ASSETS.fetch(request);
            return secure(r,path);
          }};
          JS
          cat > /tmp/mchem-universal-preview-v2/wrangler.jsonc <<'JSON'
          {
            "name":"musitu-chemistry-universal-preview",
            "account_id":"93f395f5121954671f92fffa453d6b61",
            "compatibility_date":"2026-09-06",
            "workers_dev":false,
            "main":"src/index.js",
            "routes":[{"pattern":"payments.mftintelligence.com/chemistry/frontier-universal-preview*","zone_id":"5b56528f03948ff5917a5e0cd9f7109e"}],
            "assets":{"directory":"./public","binding":"ASSETS","run_worker_first":true}
          }
          JSON

      - name: Deploy corrected bounded preview and verify 27 live files
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          (cd /tmp/mchem-universal-preview-v2 && npx --yes wrangler@latest deploy --config wrangler.jsonc) | tee /tmp/mchem-universal-preview-v2-evidence/wrangler.txt
          python - <<'PY'
          import hashlib,json,os,pathlib,time,urllib.request
          expected=json.load(open('/tmp/preflight-v2/carrier-file-sha256.json')); root=os.environ['PREVIEW_BASE'].rstrip('/')+'/'
          out={}
          for rel,want in expected.items():
            url=root if rel=='index.html' else root+rel; last=None
            for _ in range(40):
              try:
                q=urllib.request.Request(url,headers={'Cache-Control':'no-cache, no-store','Pragma':'no-cache','User-Agent':'MUSITU-Universal-Preview-v2/1.0'})
                with urllib.request.urlopen(q,timeout=30) as r: body=r.read(); status=r.status; h={k.lower():v for k,v in r.headers.items()}
                got=hashlib.sha256(body).hexdigest()
                if status==200 and got==want and h.get('x-musitu-carrier')=='frontier-universal-1.3.0' and h.get('x-musitu-sealed-archive-sha256')==os.environ['SEALED_REPRO_WEB_ARCHIVE_SHA256']:
                  out[rel]={'url':url,'http':status,'bytes':len(body),'sha256':got}; break
                last=(status,len(body),got,h.get('x-musitu-carrier'))
              except Exception as e: last=repr(e)
              time.sleep(1)
            else: raise SystemExit('live preview mismatch '+rel+' '+repr(last))
          q=urllib.request.Request(root,headers={'Cache-Control':'no-cache, no-store','User-Agent':'MUSITU-Universal-Preview-v2/1.0'})
          with urllib.request.urlopen(q,timeout=30) as r: html=r.read(); h={k.lower():v for k,v in r.headers.items()}; status=r.status
          csp=h.get('content-security-policy','')
          if status!=200 or hashlib.sha256(html).hexdigest()!=expected['index.html'] or b'MUSITU Chemistry' not in html or "script-src 'self'" not in csp or "'unsafe-eval'" in csp: raise SystemExit('canonical preview root/security failed')
          ev={'schema':'musitu.chemistry.frontier.universal_web_preview.live.v2','github_sha':os.environ['GITHUB_SHA'],'preview_url':root,'sealed_repro_web_archive_sha256':os.environ['SEALED_REPRO_WEB_ARCHIVE_SHA256'],'live_file_identity':'27/27 PASS','canonical_index_url':root,'pwa_https':True,'production_app_route_changed':False,'commerce_worker_changed':False,'android_stable_changed':False,'vercel_used':False,'files':out,'gate':'MUSITU_CHEMISTRY_FRONTIER_UNIVERSAL_WEB_BOUNDED_PREVIEW_PASS'}
          raw=(json.dumps(ev,indent=2,sort_keys=True)+'\n').encode(); pathlib.Path('/tmp/mchem-universal-preview-v2-evidence/result.json').write_bytes(raw); pathlib.Path('/tmp/mchem-universal-preview-v2-evidence/result.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  result.json\n'); print(json.dumps(ev,sort_keys=True))
          PY
          echo MUSITU_CHEMISTRY_FRONTIER_UNIVERSAL_WEB_BOUNDED_PREVIEW_PASS

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-frontier-universal-web-bounded-preview-v2
          path: /tmp/mchem-universal-preview-v2-evidence
          retention-days: 90
          if-no-files-found: error
