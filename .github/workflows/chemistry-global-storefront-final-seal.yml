name: MUSITU Chemistry Global Storefront Final Seal

on:
  push:
    branches: [chemistry-global-storefront-20260906]
    paths: ['.github/workflows/chemistry-global-storefront-final-seal.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_WORKER_SHA: d6642aefacc8d6765d17c1d33c2df65df33a9531f843c0bbbc2c304482d3d5f1
      EXPECTED_MAIN_SHA: d6a846f6bbe0bccac1758713eb4de167caf07113
      APK_SHA256: 055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact current storefront and run full contracts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-base /tmp/mchem-source.zip /tmp/mchem-core /tmp/mchem-final
          mkdir -p /tmp/mchem-base /tmp/mchem-core/src /tmp/mchem-final
          cat commerce/chemistry/source.b64.* | base64 -d > /tmp/mchem-source.zip
          echo "5b2618499eed8dc90261bc4f8260246d5593534500dd2fb145f2d24b5c47754c  /tmp/mchem-source.zip" | sha256sum -c -
          unzip -q /tmp/mchem-source.zip -d /tmp/mchem-base
          echo "848e1cec17ec580822d36e595196cda5978713849e8b45c5bc8dc7fcf9765db8  /tmp/mchem-base/src/index.mjs" | sha256sum -c -
          cp /tmp/mchem-base/src/index.mjs commerce/chemistry/index.base.mjs
          python commerce/chemistry/patch_storefront.py
          echo "$EXPECTED_WORKER_SHA  commerce/chemistry/index.storefront-v3.mjs" | sha256sum -c -
          node --check commerce/chemistry/index.storefront-v3.mjs
          node --test commerce/chemistry/storefront/storefront.test.mjs commerce/chemistry/storefront/worker-contract.test.mjs
          cp commerce/chemistry/index.storefront-v3.mjs /tmp/mchem-core/src/index.mjs
          cp -a /tmp/mchem-base/test /tmp/mchem-core/
          cp /tmp/mchem-base/package.json /tmp/mchem-core/
          cd /tmp/mchem-core && npm test && npm run check

      - name: Verify sealed release manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          o=json.load(open('commerce/chemistry/RELEASE_BASELINE_20260906.json'))
          checks={
            'schema':o.get('schema')=='musitu.chemistry.release_baseline.v3',
            'status':o.get('status')=='VERIFIED_GLOBAL_PRODUCT_TRUST_STOREFRONT_BASELINE',
            'branch':o.get('branch')=='chemistry-global-storefront-20260906',
            'worker':o.get('storefront',{}).get('current_worker_sha256')==os.environ['EXPECTED_WORKER_SHA'],
            'preflight':o.get('verified_runs',{}).get('recovery_hardening_preflight')==34057143087,
            'deploy':o.get('verified_runs',{}).get('recovery_hardening_guarded_deploy')==34057240422,
            'real_money_boundary':o.get('evidence_boundaries',{}).get('real_money_settlement_claimed') is False,
            'field_inp_boundary':o.get('standards',{}).get('field_inp_status')=='unavailable_no_field_dataset'
          }
          if not all(checks.values()):raise SystemExit('manifest verification failed '+json.dumps(checks,sort_keys=True))
          print('RELEASE_MANIFEST=PASS')
          PY

      - name: Read-only live Worker and public journey verification
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,secrets,urllib.error,urllib.parse,urllib.request
          from pathlib import Path
          API='https://api.cloudflare.com/client/v4';AID='93f395f5121954671f92fffa453d6b61';WORKER='musitu-chemistry-commerce';BASE='https://payments.mftintelligence.com'
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Chemistry-Final-Seal/1.0'}
          def req(url,headers=None):
              q=urllib.request.Request(url,headers=dict(headers or {}))
              try:
                  with urllib.request.urlopen(q,timeout=60) as r:return r.status,r.headers,r.read()
              except urllib.error.HTTPError as e:return e.code,e.headers,e.read()
          c,h,b=req(f'{API}/accounts/{AID}/workers/scripts/{WORKER}',H)
          if c!=200:raise SystemExit('worker read failed')
          ctype=h.get('content-type','')
          if 'multipart/' in ctype.lower():
              msg=email.message_from_bytes((f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+b);parts=[]
              for p in msg.walk():
                  if p.is_multipart():continue
                  d=p.get_payload(decode=True) or b''
                  if b'MUSITU Chemistry Commerce' in d:parts.append(d)
              if len(parts)!=1:raise SystemExit('module extraction mismatch')
              b=parts[0]
          livehash=hashlib.sha256(b).hexdigest()
          if livehash!=os.environ['EXPECTED_WORKER_SHA']:raise SystemExit('live Worker drift '+livehash)
          def public(path,accept='*/*'):
              path += ('&' if '?' in path else '?')+'__mchem_final='+urllib.parse.quote(secrets.token_hex(8))
              return req(BASE+path,{'Accept':accept,'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'MUSITU-Final-Seal-Public/1.0'})
          checks=[('/chemistry/','Start Free'),('/chemistry/plans','Choose access without guessing'),('/chemistry/verify',os.environ['APK_SHA256']),('/chemistry/releases','Release notes'),('/chemistry/support','payment-status link created during checkout'),('/chemistry/privacy','Data is not sold to advertisers'),('/chemistry/terms','verified settlement'),('/chemistry/checkout/start?plan=annual','Continue securely to Paynow'),('/chemistry/claim','Activate a paid seat')]
          pages={}
          for path,needle in checks:
              c,h,b=public(path,'text/html');t=b.decode('utf-8','replace');csp=h.get('content-security-policy') or ''
              if c!=200 or needle not in t:raise SystemExit('public route failed '+path)
              if "style-src 'self'" not in csp or "script-src 'self'" not in csp or 'unsafe-inline' in csp or 'unsafe-eval' in csp or (h.get('referrer-policy') or '')!='no-referrer':raise SystemExit('public security failed '+path)
              if path=='/chemistry/support' and ('href="/chemistry/return"' in t or 'contact MUSITU support' not in t):raise SystemExit('recovery surface regressed')
              pages[path]=c
          hc,_,hb=public('/chemistry/healthz','application/json');health=json.loads(hb or b'{}')
          cc,_,cb=public('/chemistry/catalog','application/json');catalog=json.loads(cb or b'{}');ids=[x.get('id') for x in catalog.get('plans') or []]
          ac,_,apk=public('/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk','application/vnd.android.package-archive');digest=hashlib.sha256(apk).hexdigest()
          if hc!=200 or health.get('licence_key_id')!='chem-lic-2026-6783aa7535d1' or health.get('raw_paynow_key_present') is not False or health.get('payment_authority_bound') is not True or health.get('transport_bound') is not True:raise SystemExit('health boundary failed')
          if ids!=['term','annual','lifetime','family','tutor','school']:raise SystemExit('catalog drift')
          if ac!=200 or len(apk)!=5314934 or digest!=os.environ['APK_SHA256']:raise SystemExit('APK drift')
          ev={'schema':'musitu.chemistry.global_storefront.final_seal.v1','live_worker_sha256':livehash,'pages':pages,'licence_key_id':health.get('licence_key_id'),'plan_ids':ids,'apk_sha256':digest,'apk_bytes':len(apk),'recovery_bare_return_link_present':False,'production_mutation':False,'gate':'MUSITU_CHEMISTRY_GLOBAL_STOREFRONT_FINAL_SEAL_PASS'}
          raw=(json.dumps(ev,indent=2,sort_keys=True)+'\n').encode();Path('/tmp/mchem-final/final-seal.json').write_bytes(raw);Path('/tmp/mchem-final/final-seal.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  final-seal.json\n');print(json.dumps(ev,sort_keys=True))
          PY

      - name: Prove Axiom main remains sealed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACTUAL="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" | python -c 'import json,sys;print(json.load(sys.stdin)["commit"]["sha"])')"
          test "$ACTUAL" = "$EXPECTED_MAIN_SHA"
          printf '%s\n' "$ACTUAL" > /tmp/mchem-final/axiom-main.sha
          echo "AXIOM_MAIN_SEALED=$ACTUAL"

      - name: Seal evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mchem-final
          sha256sum * > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-global-storefront-final-seal
          path: /tmp/mchem-final
          retention-days: 90
          if-no-files-found: error
