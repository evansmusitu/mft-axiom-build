name: MUSITU Chemistry Global Storefront Recovery Delta Deploy

on:
  push:
    branches: [chemistry-global-storefront-20260906]
    paths: ['.github/workflows/chemistry-global-storefront-recovery-deploy.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: musitu-chemistry-global-storefront-recovery-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIOUS_WORKER_SHA: 8cb1bf7187eb6eb5242ecd57e53e5f3a83fe52c92dc1958285cc71260c7fc210
      CANDIDATE_WORKER_SHA: d6642aefacc8d6765d17c1d33c2df65df33a9531f843c0bbbc2c304482d3d5f1
      PREFLIGHT_RUN_ID: '34057930558'
      PREFLIGHT_HEAD_SHA: c9fce598a8eec4445d68b241d4efcb8b2bc4a4f9
      LICENCE_KEY_ID: chem-lic-2026-6783aa7535d1
      APK_SHA256: 055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d
    steps:
      - uses: actions/checkout@v4

      - name: Prove exact successful recovery preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}" > /tmp/preflight-run.json
          python - <<'PY'
          import json,os
          o=json.load(open('/tmp/preflight-run.json'))
          checks={
            'success':o.get('conclusion')=='success',
            'head':o.get('head_sha')==os.environ['PREFLIGHT_HEAD_SHA'],
            'branch':o.get('head_branch')=='chemistry-global-storefront-20260906',
            'workflow':o.get('name')=='MUSITU Chemistry Global Storefront Recovery Delta Preflight'
          }
          if not all(checks.values()): raise SystemExit('recovery preflight proof failed '+json.dumps(checks,sort_keys=True))
          print('RECOVERY_PREFLIGHT_PROOF=PASS')
          PY

      - name: Reconstruct exact candidate and rerun contracts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-base /tmp/mchem-source.zip /tmp/mchem-core /tmp/mchem-recovery-deploy
          mkdir -p /tmp/mchem-base /tmp/mchem-core/src /tmp/mchem-recovery-deploy
          cat commerce/chemistry/source.b64.* | base64 -d > /tmp/mchem-source.zip
          echo "5b2618499eed8dc90261bc4f8260246d5593534500dd2fb145f2d24b5c47754c  /tmp/mchem-source.zip" | sha256sum -c -
          unzip -q /tmp/mchem-source.zip -d /tmp/mchem-base
          echo "848e1cec17ec580822d36e595196cda5978713849e8b45c5bc8dc7fcf9765db8  /tmp/mchem-base/src/index.mjs" | sha256sum -c -
          cp /tmp/mchem-base/src/index.mjs commerce/chemistry/index.base.mjs
          python commerce/chemistry/patch_storefront.py
          echo "$CANDIDATE_WORKER_SHA  commerce/chemistry/index.storefront-v3.mjs" | sha256sum -c -
          node --check commerce/chemistry/index.storefront-v3.mjs
          node --test commerce/chemistry/storefront/storefront.test.mjs commerce/chemistry/storefront/worker-contract.test.mjs
          cp commerce/chemistry/index.storefront-v3.mjs /tmp/mchem-core/src/index.mjs
          cp -a /tmp/mchem-base/test /tmp/mchem-core/
          cp /tmp/mchem-base/package.json /tmp/mchem-core/
          cd /tmp/mchem-core && npm test && npm run check

      - name: Guarded recovery UX production cutover with rollback
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,secrets,time,urllib.error,urllib.parse,urllib.request
          from pathlib import Path
          API='https://api.cloudflare.com/client/v4';AID='93f395f5121954671f92fffa453d6b61';WORKER='musitu-chemistry-commerce';BASE='https://payments.mftintelligence.com'
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Chemistry-Recovery-Delta/1.0'}
          OLD=os.environ['PREVIOUS_WORKER_SHA'];NEW=os.environ['CANDIDATE_WORKER_SHA'];KEY=os.environ['LICENCE_KEY_ID'];APK=os.environ['APK_SHA256']
          candidate=Path('commerce/chemistry/index.storefront-v3.mjs').read_bytes()
          if hashlib.sha256(candidate).hexdigest()!=NEW: raise SystemExit('candidate hash mismatch')
          def req(url,method='GET',headers=None,body=None,timeout=60):
              q=urllib.request.Request(url,method=method,headers=dict(headers or {}),data=body)
              try:
                  with urllib.request.urlopen(q,timeout=timeout) as r:return r.status,r.headers,r.read()
              except urllib.error.HTTPError as e:return e.code,e.headers,e.read()
          def public(path,accept='*/*',nonce=None):
              if nonce:path += ('&' if '?' in path else '?')+'__mchem_recovery='+urllib.parse.quote(nonce)
              return req(BASE+path,headers={'Accept':accept,'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'MUSITU-Recovery-Delta-Live/1.0'})
          def extract(raw,ctype,needle):
              if 'multipart/' not in (ctype or '').lower():return raw
              msg=email.message_from_bytes((f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw);parts=[]
              for p in msg.walk():
                  if p.is_multipart():continue
                  d=p.get_payload(decode=True) or b''
                  if needle.encode() in d:parts.append(d)
              if len(parts)!=1:raise RuntimeError('module extraction mismatch')
              return parts[0]
          def read_worker():
              c,h,b=req(f'{API}/accounts/{AID}/workers/scripts/{WORKER}',headers=H)
              if c!=200:raise RuntimeError(f'worker read HTTP {c}')
              return extract(b,h.get('content-type',''),'MUSITU Chemistry Commerce')
          def upload(source):
              boundary='----MUSITU'+secrets.token_hex(16);meta=json.dumps({'main_module':'index.mjs'},separators=(',',':'))
              body=(f'--{boundary}\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n{meta}\r\n--{boundary}\r\nContent-Disposition: form-data; name="index.mjs"; filename="index.mjs"\r\nContent-Type: application/javascript+module\r\n\r\n').encode()+source+f'\r\n--{boundary}--\r\n'.encode()
              h=dict(H);h['Content-Type']='multipart/form-data; boundary='+boundary
              c,_,b=req(f'{API}/accounts/{AID}/workers/scripts/{WORKER}/content','PUT',h,body)
              if not 200<=c<300:raise RuntimeError(f'content upload HTTP {c}: '+b[:300].decode('utf-8','ignore'))
          original=read_worker();oldhash=hashlib.sha256(original).hexdigest()
          if oldhash!=OLD:raise SystemExit('LIVE_SOURCE_DRIFT '+oldhash)
          hc,_,hb=public('/chemistry/healthz','application/json','pre-'+secrets.token_hex(4));health=json.loads(hb or b'{}')
          if hc!=200 or health.get('ok') is not True or health.get('licence_key_id')!=KEY or health.get('raw_paynow_key_present') is not False or health.get('payment_authority_bound') is not True or health.get('transport_bound') is not True:raise SystemExit('predeploy health boundary failed')
          ac,_,apk=public('/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk','application/vnd.android.package-archive','pre-'+secrets.token_hex(4))
          if ac!=200 or len(apk)!=5314934 or hashlib.sha256(apk).hexdigest()!=APK:raise SystemExit('predeploy APK boundary failed')
          upload(candidate)
          attempts=0
          try:
              if hashlib.sha256(read_worker()).hexdigest()!=NEW:raise RuntimeError('Cloudflare content hash mismatch')
              for attempt in range(1,31):
                  attempts=attempt;c,h,b=public('/chemistry/support','text/html',f'{int(time.time()*1000)}-{attempt}-{secrets.token_hex(3)}');t=b.decode('utf-8','replace')
                  if c==200 and 'use the payment-status link created during checkout' in t and 'href="/chemistry/return"' not in t:break
                  time.sleep(1.5)
              else:raise RuntimeError('recovery delta edge propagation timeout')
              pages={}
              for i,(path,needle) in enumerate([('/chemistry/','Start Free'),('/chemistry/plans','Choose access without guessing'),('/chemistry/verify','Verify this MUSITU release'),('/chemistry/releases','Release notes'),('/chemistry/support','use the payment-status link created during checkout'),('/chemistry/privacy','Data is not sold to advertisers'),('/chemistry/terms','verified settlement'),('/chemistry/checkout/start?plan=annual','Continue securely to Paynow'),('/chemistry/claim','Activate a paid seat')]):
                  c,h,b=public(path,'text/html',f'post-{i}-{secrets.token_hex(4)}');t=b.decode('utf-8','replace');csp=h.get('content-security-policy') or ''
                  if c!=200 or needle not in t:raise RuntimeError('route verification failed '+path)
                  if "style-src 'self'" not in csp or "script-src 'self'" not in csp or 'unsafe-inline' in csp or 'unsafe-eval' in csp or (h.get('referrer-policy') or '')!='no-referrer':raise RuntimeError('security header verification failed '+path)
                  pages[path]=c
              sc,_,sb=public('/chemistry/support','text/html','support-final-'+secrets.token_hex(4));st=sb.decode('utf-8','replace')
              if sc!=200 or 'href="/chemistry/return"' in st or 'contact MUSITU support' not in st:raise RuntimeError('recovery guidance contract failed')
              cc,_,cb=public('/chemistry/catalog','application/json','catalog-'+secrets.token_hex(4));cat=json.loads(cb or b'{}');ids=[p.get('id') for p in cat.get('plans') or []]
              if cc!=200 or ids!=['term','annual','lifetime','family','tutor','school']:raise RuntimeError('catalog changed')
              hc,_,hb=public('/chemistry/healthz','application/json','health-'+secrets.token_hex(4));health2=json.loads(hb or b'{}')
              if hc!=200 or health2.get('licence_key_id')!=KEY or health2.get('raw_paynow_key_present') is not False or health2.get('payment_authority_bound') is not True or health2.get('transport_bound') is not True:raise RuntimeError('health boundary changed')
              ac,_,apk=public('/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk','application/vnd.android.package-archive','apk-'+secrets.token_hex(4))
              if ac!=200 or len(apk)!=5314934 or hashlib.sha256(apk).hexdigest()!=APK:raise RuntimeError('APK changed')
              livehash=hashlib.sha256(read_worker()).hexdigest()
              if livehash!=NEW:raise RuntimeError('live Worker hash mismatch '+livehash)
          except Exception as primary:
              upload(original)
              rh=hashlib.sha256(read_worker()).hexdigest();rc,_,_=public('/chemistry/healthz','application/json','rollback-'+secrets.token_hex(4))
              if rh!=OLD or rc!=200:raise RuntimeError(f'ROLLBACK_VERIFY_FAILED hash={rh} http={rc}') from primary
              raise
          ev={'schema':'musitu.chemistry.global_storefront.recovery_deploy.v1','predecessor_worker_sha256':oldhash,'candidate_worker_sha256':NEW,'live_worker_sha256':livehash,'recovery_dead_end_removed':True,'licence_key_id':KEY,'bindings_preserved':True,'apk_sha256':APK,'apk_bytes':5314934,'plan_ids':ids,'verified_routes':pages,'edge_propagation_attempts':attempts,'rollback_available':True,'rollback_used':False,'gate':'MUSITU_CHEMISTRY_GLOBAL_STOREFRONT_RECOVERY_DEPLOY_PASS'}
          raw=(json.dumps(ev,indent=2,sort_keys=True)+'\n').encode();Path('/tmp/mchem-recovery-deploy/deploy.json').write_bytes(raw);Path('/tmp/mchem-recovery-deploy/deploy.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  deploy.json\n');print(json.dumps(ev,sort_keys=True))
          PY

      - name: Independent public recovery verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,secrets,urllib.error,urllib.parse,urllib.request
          from pathlib import Path
          base='https://payments.mftintelligence.com';apk_sha='055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d'
          def get(path,accept='*/*'):
              path += ('&' if '?' in path else '?')+'__mchem_independent='+urllib.parse.quote(secrets.token_hex(8))
              q=urllib.request.Request(base+path,headers={'Accept':accept,'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'MUSITU-Recovery-Independent/1.0'})
              try:
                  with urllib.request.urlopen(q,timeout=60) as r:return r.status,dict(r.headers),r.read()
              except urllib.error.HTTPError as e:return e.code,dict(e.headers),e.read()
          sc,sh,sb=get('/chemistry/support','text/html');st=sb.decode('utf-8','replace');csp=sh.get('content-security-policy') or sh.get('Content-Security-Policy') or ''
          if sc!=200 or 'use the payment-status link created during checkout' not in st or 'contact MUSITU support' not in st or 'href="/chemistry/return"' in st:raise SystemExit('independent recovery UX failed')
          if "style-src 'self'" not in csp or "script-src 'self'" not in csp or 'unsafe-inline' in csp:raise SystemExit('independent CSP failed')
          hc,_,hb=get('/chemistry/healthz','application/json');health=json.loads(hb or b'{}')
          cc,_,cb=get('/chemistry/catalog','application/json');catalog=json.loads(cb or b'{}');ids=[p.get('id') for p in catalog.get('plans') or []]
          ac,_,apk=get('/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk','application/vnd.android.package-archive');digest=hashlib.sha256(apk).hexdigest()
          if hc!=200 or health.get('licence_key_id')!='chem-lic-2026-6783aa7535d1' or health.get('raw_paynow_key_present') is not False:raise SystemExit('independent health failed')
          if ids!=['term','annual','lifetime','family','tutor','school']:raise SystemExit('independent catalog failed')
          if ac!=200 or len(apk)!=5314934 or digest!=apk_sha:raise SystemExit('independent APK failed')
          ev={'schema':'musitu.chemistry.global_storefront.recovery_live.v1','support_http':sc,'health_http':hc,'catalog_http':cc,'apk_http':ac,'apk_sha256':digest,'apk_bytes':len(apk),'licence_key_id':health.get('licence_key_id'),'plan_ids':ids,'recovery_dead_end_removed':True,'production_mutation_in_this_step':False,'gate':'MUSITU_CHEMISTRY_GLOBAL_STOREFRONT_RECOVERY_LIVE_PASS'}
          raw=(json.dumps(ev,indent=2,sort_keys=True)+'\n').encode();Path('/tmp/mchem-recovery-deploy/live.json').write_bytes(raw);Path('/tmp/mchem-recovery-deploy/live.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  live.json\n');print(json.dumps(ev,sort_keys=True))
          PY

      - name: Seal recovery deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/preflight-run.json /tmp/mchem-recovery-deploy/preflight-run.json
          cd /tmp/mchem-recovery-deploy
          sha256sum *.json *.sha256 > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-global-storefront-recovery-deploy
          path: /tmp/mchem-recovery-deploy
          retention-days: 90
          if-no-files-found: error
