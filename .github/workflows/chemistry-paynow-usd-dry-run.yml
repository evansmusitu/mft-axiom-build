name: MUSITU Chemistry Paynow USD dry-run

on:
  push:
    branches: [chemistry-paynow-usd-fix-20260914]
    paths:
      - '.github/workflows/chemistry-paynow-usd-dry-run.yml'
      - 'commerce/chemistry/patch_restore_usd_paynow.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      WORKER_NAME: musitu-chemistry-commerce
      EXPECTED_LIVE_SHA: 9461afb5c86667574ea3e10bfdffdd22788db3e19ee28915f5d0f44b1808a830
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact live Commerce worker read-only
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mchem-usd evidence-out
          python - <<'PY'
          import email,hashlib,os,urllib.parse,urllib.request
          from pathlib import Path
          API=os.environ['CF_API'];A=os.environ['ACCOUNT_ID'];W=os.environ['WORKER_NAME']
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Paynow-USD-DryRun/1.0'}
          q=urllib.request.Request(f'{API}/accounts/{A}/workers/scripts/{urllib.parse.quote(W,safe="")}',headers=H)
          with urllib.request.urlopen(q,timeout=45) as r:raw=r.read();ct=r.headers.get('content-type','')
          if 'multipart/' in ct.lower():
              msg=email.message_from_bytes((f'Content-Type: {ct}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw);parts=[]
              for p in msg.walk():
                  if p.is_multipart():continue
                  d=p.get_payload(decode=True) or b''
                  if b'MUSITU Chemistry Commerce' in d:parts.append(d)
              if len(parts)!=1:raise SystemExit('module extraction mismatch')
              raw=parts[0]
          sha=hashlib.sha256(raw).hexdigest()
          if sha!=os.environ['EXPECTED_LIVE_SHA']:raise SystemExit('live Worker drift '+sha)
          Path('/tmp/mchem-usd/live.mjs').write_bytes(raw)
          print('LIVE_WORKER_SHA256='+sha)
          print('PRODUCTION_MUTATION=FALSE')
          PY
      - name: Build and prove exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python commerce/chemistry/patch_restore_usd_paynow.py --input /tmp/mchem-usd/live.mjs --output /tmp/mchem-usd/candidate.mjs | tee evidence-out/build.txt
          node --check /tmp/mchem-usd/candidate.mjs
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          a=Path('/tmp/mchem-usd/live.mjs').read_text();b=Path('/tmp/mchem-usd/candidate.mjs').read_text()
          changes=[
            ("const DIRECT_PAYNOW_FALLBACK_ACTIVE=true;","const DIRECT_PAYNOW_FALLBACK_ACTIVE=false;"),
            ("You will leave MUSITU for the Paynow payment step. Keep the MUSITU order reference shown by Paynow and your Paynow receipt/reference. Payment credentials are entered with Paynow, not into MUSITU or this storefront. During the temporary direct-payment fallback, Premium remains locked until MUSITU independently verifies settlement.","You will leave MUSITU for the secure Paynow payment step. Payment credentials are entered with Paynow, not into MUSITU or this storefront. Premium is issued only after MUSITU independently verifies Paynow settlement."),
            ("<li>If payment is pending, do not create repeated payments. Premium stays locked until settlement is independently verified.</li><li><strong>Temporary direct Paynow route:</strong> keep both the MUSITU order reference and the Paynow receipt/reference. If activation is not automatic, send those references through MUSITU support so settlement can be verified before a signed licence is issued.</li>","<li>If payment is pending, do not create repeated payments. Premium stays locked until settlement is independently verified.</li>"),
            ("direct_paynow_entitlement_mode:'manual_verified_settlement_only'","direct_paynow_entitlement_mode:'provider_verified_settlement_only'"),
          ]
          r=b
          for old,new in reversed(changes):
              assert r.count(new)==1,new[:50]
              r=r.replace(new,old,1)
          assert r==a,'candidate differs outside approved USD restoration deltas'
          required=["async function initiateProvider(env,reference,q)","/internal/paynow/sign-initiate-chemistry","/internal/paynow/initiate","currency:'USD'","return new Response(null,{status:303,headers:{location:created.browserUrl","form-action 'self' https://www.paynow.co.zw"]
          for t in required:assert t in b,t
          report={'schema':'musitu.chemistry.paynow_usd.candidate.v1','result':'PASS','baseline_sha256':hashlib.sha256(a.encode()).hexdigest(),'candidate_sha256':hashlib.sha256(b.encode()).hexdigest(),'direct_fallback_active':False,'secure_provider_path':True,'currency_contract':'USD','pricing_changed':False,'production_mutation':False}
          Path('evidence-out/candidate.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,sort_keys=True))
          print('MUSITU_PAYNOW_USD_DRY_RUN=PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musitu-chemistry-paynow-usd-dry-run
          path: evidence-out
          retention-days: 30
          if-no-files-found: error
