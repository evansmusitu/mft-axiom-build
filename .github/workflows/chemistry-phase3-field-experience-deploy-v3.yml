name: MUSITU Chemistry Phase 3 Field Experience Guarded Deploy v3

on:
  push:
    branches: [chemistry-field-experience-20260906]
    paths: ['.github/workflows/chemistry-phase3-field-experience-deploy-v3.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: musitu-chemistry-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIOUS_WORKER_SHA: d6642aefacc8d6765d17c1d33c2df65df33a9531f843c0bbbc2c304482d3d5f1
      CANDIDATE_WORKER_SHA: 1134a2581d423547b9876fe8a680ef99ca949edbdbfd6757624150a23d049bec
      PREFLIGHT_RUN_ID: '34060650777'
      PREFLIGHT_HEAD_SHA: 8d3716c92a9bb44bb5beecaeca87f9157397f335
      PREFLIGHT_ARTIFACT_ID: '9997354002'
      PREFLIGHT_ARTIFACT_SHA256: dc73383949e8b1b036f9a57d1b6ca977fe701f08902130543d5fb8b092dbce89
      WEB_VITALS_SHA256: 6b3e4ac9d6f6abd4ea1810621668bec7d7adb121279570e6870be4fb98ab3909
      LICENCE_KEY_ID: chem-lic-2026-6783aa7535d1
      APK_SHA256: 055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d

    steps:
      - uses: actions/checkout@v4

      - name: Prove exact stronger preflight and rebuild candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-p3d3 /tmp/mchem-base /tmp/mchem-source.zip /tmp/mchem-core
          mkdir -p /tmp/mchem-p3d3 /tmp/mchem-base /tmp/mchem-core/src
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}" > /tmp/mchem-p3d3/preflight-run.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}/artifacts?per_page=100" > /tmp/mchem-p3d3/preflight-artifacts.json
          python - <<'PY'
          import json,os
          r=json.load(open('/tmp/mchem-p3d3/preflight-run.json'))
          checks={'success':r.get('conclusion')=='success','sha':r.get('head_sha')==os.environ['PREFLIGHT_HEAD_SHA'],'branch':r.get('head_branch')=='chemistry-field-experience-20260906','name':r.get('name')=='MUSITU Chemistry Phase 3 Field Experience Preflight'}
          if not all(checks.values()):raise SystemExit('preflight mismatch '+json.dumps(checks,sort_keys=True))
          arts=json.load(open('/tmp/mchem-p3d3/preflight-artifacts.json')).get('artifacts',[])
          m=[x for x in arts if str(x.get('id'))==os.environ['PREFLIGHT_ARTIFACT_ID']]
          if len(m)!=1 or m[0].get('expired') is not False or m[0].get('name')!='musitu-chemistry-field-experience-preflight':raise SystemExit('artifact identity failed')
          digest=str(m[0].get('digest') or '').removeprefix('sha256:')
          if digest!=os.environ['PREFLIGHT_ARTIFACT_SHA256']:raise SystemExit('artifact digest failed '+digest)
          print('PHASE3_STRONGER_PREFLIGHT_PROOF=PASS')
          PY
          cat commerce/chemistry/source.b64.* | base64 -d > /tmp/mchem-source.zip
          echo "5b2618499eed8dc90261bc4f8260246d5593534500dd2fb145f2d24b5c47754c  /tmp/mchem-source.zip" | sha256sum -c -
          unzip -q /tmp/mchem-source.zip -d /tmp/mchem-base
          echo "848e1cec17ec580822d36e595196cda5978713849e8b45c5bc8dc7fcf9765db8  /tmp/mchem-base/src/index.mjs" | sha256sum -c -
          echo "$WEB_VITALS_SHA256  commerce/chemistry/storefront/web-vitals-6.0.1.iife.js" | sha256sum -c -
          cp /tmp/mchem-base/src/index.mjs commerce/chemistry/index.base.mjs
          python commerce/chemistry/patch_storefront.py
          echo "$CANDIDATE_WORKER_SHA  commerce/chemistry/index.storefront-v3.mjs" | sha256sum -c -
          node --check commerce/chemistry/index.storefront-v3.mjs
          node --test commerce/chemistry/storefront/field-experience.test.mjs commerce/chemistry/storefront/storefront.test.mjs commerce/chemistry/storefront/worker-contract.test.mjs
          cp commerce/chemistry/index.storefront-v3.mjs /tmp/mchem-core/src/index.mjs
          cp -a /tmp/mchem-base/test /tmp/mchem-core/
          cp /tmp/mchem-base/package.json /tmp/mchem-core/
          cd /tmp/mchem-core && npm test && npm run check

      - name: Guarded cutover with sustained all-route convergence and rollback
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,secrets,time,urllib.error,urllib.parse,urllib.request
          from pathlib import Path
          API='https://api.cloudflare.com/client/v4';AID='93f395f5121954671f92fffa453d6b61';WORKER='musitu-chemistry-commerce';BASE='https://payments.mftintelligence.com'
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Phase3-Deploy-v3/1.0'}
          OLD=os.environ['PREVIOUS_WORKER_SHA'];NEW=os.environ['CANDIDATE_WORKER_SHA'];KEY=os.environ['LICENCE_KEY_ID'];APK=os.environ['APK_SHA256'];VITALS=os.environ['WEB_VITALS_SHA256']
          candidate=Path('commerce/chemistry/index.storefront-v3.mjs').read_bytes()
          if hashlib.sha256(candidate).hexdigest()!=NEW:raise SystemExit('candidate hash mismatch')

          def req(url,method='GET',headers=None,body=None,timeout=60):
              q=urllib.request.Request(url,method=method,headers=dict(headers or {}),data=body)
              try:
                  with urllib.request.urlopen(q,timeout=timeout) as r:return r.status,r.headers,r.read()
              except urllib.error.HTTPError as e:return e.code,e.headers,e.read()
          def public(path,accept='*/*',nonce=None,method='GET',headers=None,body=None):
              if nonce and method=='GET':path += ('&' if '?' in path else '?')+'__mchem_p3v3='+urllib.parse.quote(nonce)
              h={'Accept':accept,'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache','User-Agent':'MUSITU-Phase3-v3-Live/'+secrets.token_hex(4)}
              if headers:h.update(headers)
              return req(BASE+path,method=method,headers=h,body=body)
          def extract(raw,ctype,needle):
              if 'multipart/' not in (ctype or '').lower():return raw
              msg=email.message_from_bytes((f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw);parts=[]
              for p in msg.walk():
                  if p.is_multipart():continue
                  d=p.get_payload(decode=True) or b''
                  if needle.encode() in d:parts.append(d)
              if len(parts)!=1:raise RuntimeError('module extraction mismatch')
              return parts[0]
          def read_worker():
              c,h,b=req(f'{API}/accounts/{AID}/workers/scripts/{WORKER}',headers=H)
              if c!=200:raise RuntimeError(f'worker read HTTP {c}')
              return extract(b,h.get('content-type',''),'MUSITU Chemistry Commerce')
          def upload(source):
              boundary='----MUSITU'+secrets.token_hex(16);meta=json.dumps({'main_module':'index.mjs'},separators=(',',':'))
              body=(f'--{boundary}\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n{meta}\r\n--{boundary}\r\nContent-Disposition: form-data; name="index.mjs"; filename="index.mjs"\r\nContent-Type: application/javascript+module\r\n\r\n').encode()+source+f'\r\n--{boundary}--\r\n'.encode()
              h=dict(H);h['Content-Type']='multipart/form-data; boundary='+boundary
              c,_,b=req(f'{API}/accounts/{AID}/workers/scripts/{WORKER}/content','PUT',h,body)
              if not 200<=c<300:raise RuntimeError(f'content upload HTTP {c}: '+b[:300].decode('utf-8','ignore'))
          def strict(h):
              csp=h.get('content-security-policy') or ''
              return "style-src 'self'" in csp and "script-src 'self'" in csp and "connect-src 'self'" in csp and 'unsafe-inline' not in csp and 'unsafe-eval' not in csp and 'http://' not in csp and 'https://' not in csp and (h.get('referrer-policy') or '')=='no-referrer'
          routes=[('/chemistry/','Know what you don’t know'),('/chemistry/plans','Choose access without guessing'),('/chemistry/privacy','Anonymous experience measurement'),('/chemistry/experience','Real-user experience evidence'),('/chemistry/checkout/start?plan=annual','Continue securely to Paynow'),('/chemistry/checkout/start?plan=school','Student seats'),('/chemistry/claim','Activate a paid seat'),('/chemistry/support','payment-status link created during checkout'),('/chemistry/verify','Verify this MUSITU release'),('/chemistry/releases','Release notes'),('/chemistry/terms','Premium access is granted only by a valid MUSITU-signed licence after verified settlement')]

          original=read_worker();oldhash=hashlib.sha256(original).hexdigest()
          if oldhash!=OLD:raise SystemExit('LIVE_SOURCE_DRIFT '+oldhash)
          hc,_,hb=public('/chemistry/healthz','application/json','pre-'+secrets.token_hex(4));health=json.loads(hb or b'{}')
          if hc!=200 or health.get('ok') is not True or health.get('licence_key_id')!=KEY or health.get('raw_paynow_key_present') is not False or health.get('payment_authority_bound') is not True or health.get('transport_bound') is not True:raise SystemExit('predeploy health boundary failed')
          ac,_,apk=public('/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk','application/vnd.android.package-archive','pre-'+secrets.token_hex(4))
          if ac!=200 or len(apk)!=5314934 or hashlib.sha256(apk).hexdigest()!=APK:raise SystemExit('predeploy APK boundary failed')
          neg=json.dumps({'events':[{'kind':'event','name':'page_view','route':'home','viewport':'mobile','detail':''}]}).encode()
          tc,_,_=public('/chemistry/telemetry/v1','application/json',method='POST',headers={'Origin':'https://invalid.musitu.example','Content-Type':'application/json'},body=neg)
          if tc not in (404,405):raise SystemExit('predecessor telemetry route unexpectedly present '+str(tc))

          upload(candidate);rollback_used=False;attempts=0;streak=0;required_streak=6;edge_rays=[]
          try:
              if hashlib.sha256(read_worker()).hexdigest()!=NEW:raise RuntimeError('Cloudflare script API did not retain Phase 3 candidate')
              for attempt in range(1,121):
                  attempts=attempt;all_ok=True;sweep=[]
                  for idx,(path,needle) in enumerate(routes):
                      c,h,b=public(path,'text/html',f'sweep-{attempt}-{idx}-{secrets.token_hex(4)}');t=b.decode('utf-8','replace');ray=h.get('cf-ray') or ''
                      if ray:sweep.append(ray)
                      if c!=200 or needle not in t or not strict(h):all_ok=False;break
                  if all_ok:
                      streak+=1;edge_rays.extend(sweep)
                      print(f'PHASE3_EDGE_SWEEP_PASS attempt={attempt} streak={streak} rays={json.dumps(sweep)}')
                      if streak>=required_streak:break
                  else:
                      if streak:print(f'PHASE3_EDGE_STREAK_RESET attempt={attempt} previous_streak={streak}')
                      streak=0
                  time.sleep(1.0)
              if streak<required_streak:raise RuntimeError(f'sustained edge convergence timeout streak={streak} attempts={attempts}')

              pages={}
              for idx,(path,needle) in enumerate(routes):
                  c,h,b=public(path,'text/html',f'accept-{idx}-{secrets.token_hex(6)}');t=b.decode('utf-8','replace')
                  if c!=200 or needle not in t or not strict(h):raise RuntimeError('acceptance route/security failed '+path)
                  pages[path]=c
              ec,_,eb=public('/chemistry/experience.json','application/json','experience-'+secrets.token_hex(4));experience=json.loads(eb or b'{}')
              if ec!=200 or experience.get('minimum_public_sample')!=100 or experience.get('status') not in ('insufficient_field_sample','field_core_web_vitals_available'):raise RuntimeError('experience snapshot contract failed')
              vc,_,vb=public('/chemistry/assets/web-vitals-6.0.1.iife.js','application/javascript','vitals-'+secrets.token_hex(4))
              if vc!=200 or len(vb)!=8987 or hashlib.sha256(vb).hexdigest()!=VITALS:raise RuntimeError('web-vitals asset changed')
              fc,_,fb=public('/chemistry/assets/field-experience.js','application/javascript','field-'+secrets.token_hex(4))
              if fc!=200 or b'/chemistry/telemetry/v1' not in fb or b'https://' in fb or b'http://' in fb:raise RuntimeError('field client asset failed')
              tc,th,_=public('/chemistry/telemetry/v1','application/json',method='POST',headers={'Origin':'https://invalid.musitu.example','Content-Type':'application/json'},body=neg)
              if tc!=400 or th.get('set-cookie'):raise RuntimeError('telemetry privacy boundary failed')
              hc,_,hb=public('/chemistry/healthz','application/json','health-'+secrets.token_hex(4));o=json.loads(hb or b'{}')
              if hc!=200 or o.get('licence_key_id')!=KEY or o.get('raw_paynow_key_present') is not False or o.get('payment_authority_bound') is not True or o.get('transport_bound') is not True:raise RuntimeError('postdeploy health failed')
              cc,_,cb=public('/chemistry/catalog','application/json','catalog-'+secrets.token_hex(4));cat=json.loads(cb or b'{}');ids=[p.get('id') for p in cat.get('plans') or []]
              if cc!=200 or ids!=['term','annual','lifetime','family','tutor','school']:raise RuntimeError('catalog changed')
              rc,_,rb=public('/chemistry/support','text/html','recovery-'+secrets.token_hex(4));rt=rb.decode('utf-8','replace')
              if rc!=200 or 'href="/chemistry/return"' in rt or 'contact MUSITU support' not in rt:raise RuntimeError('recovery hardening changed')
              ac,_,apk=public('/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk','application/vnd.android.package-archive','apk-'+secrets.token_hex(4))
              if ac!=200 or len(apk)!=5314934 or hashlib.sha256(apk).hexdigest()!=APK:raise RuntimeError('APK changed')
              livehash=hashlib.sha256(read_worker()).hexdigest()
              if livehash!=NEW:raise RuntimeError('live Worker hash mismatch '+livehash)
          except Exception as primary:
              rollback_used=True;upload(original)
              rh=hashlib.sha256(read_worker()).hexdigest();rc2,_,_=public('/chemistry/healthz','application/json','rollback-'+secrets.token_hex(4))
              if rh!=OLD or rc2!=200:raise RuntimeError(f'ROLLBACK_VERIFY_FAILED hash={rh} http={rc2}') from primary
              raise

          ev={'schema':'musitu.chemistry.field_experience.deploy.v3','predecessor_worker_sha256':oldhash,'candidate_worker_sha256':NEW,'live_worker_sha256':livehash,'licence_key_id':KEY,'bindings_preserved':True,'apk_sha256':APK,'apk_bytes':5314934,'plan_ids':ids,'verified_routes':pages,'experience_status':experience.get('status'),'public_minimum_metric_sample':experience.get('minimum_public_sample'),'web_vitals_sha256':VITALS,'web_vitals_bytes':8987,'telemetry_cross_origin_rejected':True,'synthetic_valid_telemetry_written':False,'measurement_cookies_used':False,'persistent_tracking_identifier_used':False,'raw_event_rows_retained':False,'field_inp_claimed':False,'recovery_bare_return_link_present':False,'sustained_edge_required_streak':required_streak,'sustained_edge_achieved_streak':streak,'edge_convergence_attempts':attempts,'observed_cf_rays':edge_rays[-30:],'rollback_available':True,'rollback_used':rollback_used,'gate':'MUSITU_CHEMISTRY_FIELD_EXPERIENCE_DEPLOY_V3_PASS'}
          raw=(json.dumps(ev,indent=2,sort_keys=True)+'\n').encode();Path('/tmp/mchem-p3d3/deploy-v3.json').write_bytes(raw);Path('/tmp/mchem-p3d3/deploy-v3.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  deploy-v3.json\n');print(json.dumps(ev,sort_keys=True))
          PY

      - name: Seal deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mchem-p3d3
          sha256sum *.json *.sha256 > SHA256SUMS.txt
          cat deploy-v3.json

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-field-experience-deploy-v3
          path: /tmp/mchem-p3d3
          retention-days: 90
          if-no-files-found: error
