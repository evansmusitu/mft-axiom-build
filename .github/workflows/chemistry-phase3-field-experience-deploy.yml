name: MUSITU Chemistry Phase 3 Field Experience Guarded Deploy

on:
  push:
    branches: [chemistry-field-experience-20260906]
    paths: ['.github/workflows/chemistry-phase3-field-experience-deploy.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: musitu-chemistry-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIOUS_WORKER_SHA: d6642aefacc8d6765d17c1d33c2df65df33a9531f843c0bbbc2c304482d3d5f1
      CANDIDATE_WORKER_SHA: 1134a2581d423547b9876fe8a680ef99ca949edbdbfd6757624150a23d049bec
      PREFLIGHT_RUN_ID: '34060357586'
      PREFLIGHT_HEAD_SHA: 779550b89a442a5faa543ac13a5e42b763be8669
      PREFLIGHT_ARTIFACT_ID: '9997267832'
      PREFLIGHT_ARTIFACT_SHA256: 4e1d15aec33e82f2ce6c7d978e5f336d4865348f154becd3ef5f8e7eb25a636e
      WEB_VITALS_SHA256: 6b3e4ac9d6f6abd4ea1810621668bec7d7adb121279570e6870be4fb98ab3909
      LICENCE_KEY_ID: chem-lic-2026-6783aa7535d1
      APK_SHA256: 055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d

    steps:
      - uses: actions/checkout@v4

      - name: Prove exact Phase 3 preflight, artifact and reconstruct candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-phase3-deploy /tmp/mchem-base /tmp/mchem-source.zip /tmp/mchem-core
          mkdir -p /tmp/mchem-phase3-deploy /tmp/mchem-base /tmp/mchem-core/src
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}" > /tmp/mchem-phase3-deploy/preflight-run.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}/artifacts?per_page=100" > /tmp/mchem-phase3-deploy/preflight-artifacts.json
          python - <<'PY'
          import json,os
          r=json.load(open('/tmp/mchem-phase3-deploy/preflight-run.json'))
          checks={
            'conclusion':r.get('conclusion')=='success',
            'head_sha':r.get('head_sha')==os.environ['PREFLIGHT_HEAD_SHA'],
            'branch':r.get('head_branch')=='chemistry-field-experience-20260906',
            'workflow':r.get('name')=='MUSITU Chemistry Phase 3 Field Experience Preflight'
          }
          if not all(checks.values()):raise SystemExit('preflight proof failed '+json.dumps(checks,sort_keys=True))
          a=json.load(open('/tmp/mchem-phase3-deploy/preflight-artifacts.json'))
          matches=[x for x in a.get('artifacts',[]) if str(x.get('id'))==os.environ['PREFLIGHT_ARTIFACT_ID']]
          if len(matches)!=1:raise SystemExit('preflight artifact identity missing')
          art=matches[0]
          if art.get('expired') is not False:raise SystemExit('preflight artifact expired')
          if art.get('name')!='musitu-chemistry-field-experience-preflight':raise SystemExit('preflight artifact name mismatch')
          digest=str(art.get('digest') or '').removeprefix('sha256:')
          if digest!=os.environ['PREFLIGHT_ARTIFACT_SHA256']:raise SystemExit('preflight artifact digest mismatch '+digest)
          print('PHASE3_PREFLIGHT_PROOF=PASS')
          PY
          cat commerce/chemistry/source.b64.* | base64 -d > /tmp/mchem-source.zip
          echo "5b2618499eed8dc90261bc4f8260246d5593534500dd2fb145f2d24b5c47754c  /tmp/mchem-source.zip" | sha256sum -c -
          unzip -q /tmp/mchem-source.zip -d /tmp/mchem-base
          echo "848e1cec17ec580822d36e595196cda5978713849e8b45c5bc8dc7fcf9765db8  /tmp/mchem-base/src/index.mjs" | sha256sum -c -
          echo "$WEB_VITALS_SHA256  commerce/chemistry/storefront/web-vitals-6.0.1.iife.js" | sha256sum -c -
          cp /tmp/mchem-base/src/index.mjs commerce/chemistry/index.base.mjs
          python commerce/chemistry/patch_storefront.py
          echo "$CANDIDATE_WORKER_SHA  commerce/chemistry/index.storefront-v3.mjs" | sha256sum -c -
          node --check commerce/chemistry/index.storefront-v3.mjs
          node --test commerce/chemistry/storefront/field-experience.test.mjs commerce/chemistry/storefront/storefront.test.mjs commerce/chemistry/storefront/worker-contract.test.mjs
          cp commerce/chemistry/index.storefront-v3.mjs /tmp/mchem-core/src/index.mjs
          cp -a /tmp/mchem-base/test /tmp/mchem-core/
          cp /tmp/mchem-base/package.json /tmp/mchem-core/
          cd /tmp/mchem-core && npm test && npm run check

      - name: Guarded content-only Phase 3 update with rollback
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,secrets,time,urllib.error,urllib.parse,urllib.request
          from pathlib import Path
          API='https://api.cloudflare.com/client/v4'
          AID='93f395f5121954671f92fffa453d6b61'
          WORKER='musitu-chemistry-commerce'
          BASE='https://payments.mftintelligence.com'
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Chemistry-Field-Experience-Deploy/1.0'}
          OLD=os.environ['PREVIOUS_WORKER_SHA'];NEW=os.environ['CANDIDATE_WORKER_SHA'];KEY=os.environ['LICENCE_KEY_ID'];APK=os.environ['APK_SHA256'];VITALS=os.environ['WEB_VITALS_SHA256']
          candidate=Path('commerce/chemistry/index.storefront-v3.mjs').read_bytes()
          if hashlib.sha256(candidate).hexdigest()!=NEW:raise SystemExit('candidate hash mismatch')

          def req(url,method='GET',headers=None,body=None,timeout=60):
              q=urllib.request.Request(url,method=method,headers=dict(headers or {}),data=body)
              try:
                  with urllib.request.urlopen(q,timeout=timeout) as r:return r.status,r.headers,r.read()
              except urllib.error.HTTPError as e:return e.code,e.headers,e.read()

          def public(path,accept='*/*',nonce=None,method='GET',headers=None,body=None):
              if nonce and method=='GET':path += ('&' if '?' in path else '?')+'__mchem_phase3='+urllib.parse.quote(nonce)
              h={'Accept':accept,'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'MUSITU-Phase3-Live/1.0'}
              if headers:h.update(headers)
              return req(BASE+path,method=method,headers=h,body=body)

          def extract(raw,ctype,needle):
              if 'multipart/' not in (ctype or '').lower():return raw
              msg=email.message_from_bytes((f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw);parts=[]
              for p in msg.walk():
                  if p.is_multipart():continue
                  d=p.get_payload(decode=True) or b''
                  if needle.encode() in d:parts.append(d)
              if len(parts)!=1:raise RuntimeError('module extraction mismatch')
              return parts[0]

          def read_worker():
              c,h,b=req(f'{API}/accounts/{AID}/workers/scripts/{WORKER}',headers=H)
              if c!=200:raise RuntimeError(f'worker read HTTP {c}')
              return extract(b,h.get('content-type',''),'MUSITU Chemistry Commerce')

          def upload(source):
              boundary='----MUSITU'+secrets.token_hex(16);meta=json.dumps({'main_module':'index.mjs'},separators=(',',':'))
              body=(f'--{boundary}\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n{meta}\r\n--{boundary}\r\nContent-Disposition: form-data; name="index.mjs"; filename="index.mjs"\r\nContent-Type: application/javascript+module\r\n\r\n').encode()+source+f'\r\n--{boundary}--\r\n'.encode()
              h=dict(H);h['Content-Type']='multipart/form-data; boundary='+boundary
              c,_,b=req(f'{API}/accounts/{AID}/workers/scripts/{WORKER}/content','PUT',h,body)
              if not 200<=c<300:raise RuntimeError(f'content upload HTTP {c}: '+b[:300].decode('utf-8','ignore'))

          # LIVE SOURCE DRIFT LOCK: no mutation is allowed before this exact check passes.
          original=read_worker();oldhash=hashlib.sha256(original).hexdigest()
          if oldhash!=OLD:raise SystemExit('LIVE_SOURCE_DRIFT '+oldhash)

          hc,_,hb=public('/chemistry/healthz','application/json','pre-'+secrets.token_hex(4));health=json.loads(hb or b'{}')
          if hc!=200 or health.get('ok') is not True or health.get('licence_key_id')!=KEY or health.get('raw_paynow_key_present') is not False or health.get('payment_authority_bound') is not True or health.get('transport_bound') is not True:raise SystemExit('predeploy health boundary failed')
          ac,_,apk=public('/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk','application/vnd.android.package-archive','pre-'+secrets.token_hex(4))
          if ac!=200 or len(apk)!=5314934 or hashlib.sha256(apk).hexdigest()!=APK:raise SystemExit('predeploy APK boundary failed')

          # Cross-origin negative control before deployment; must fail without a valid telemetry event.
          neg=json.dumps({'events':[{'kind':'event','name':'page_view','route':'home','viewport':'mobile','detail':''}]}).encode()
          tc,_,_=public('/chemistry/telemetry/v1','application/json',method='POST',headers={'Origin':'https://invalid.musitu.example','Content-Type':'application/json'},body=neg)
          if tc not in (404,405):raise SystemExit('predecessor unexpectedly has telemetry route '+str(tc))

          upload(candidate)
          propagation_attempts=0
          try:
              if hashlib.sha256(read_worker()).hexdigest()!=NEW:raise RuntimeError('Cloudflare script API did not retain Phase 3 candidate')
              for attempt in range(1,31):
                  propagation_attempts=attempt;nonce=f'{int(time.time()*1000)}-{attempt}-{secrets.token_hex(3)}'
                  c,h,b=public('/chemistry/experience','text/html',nonce);t=b.decode('utf-8','replace');csp=h.get('content-security-policy') or ''
                  ready=c==200 and 'Real-user experience evidence' in t and 'insufficient field sample' in t.lower() and "connect-src 'self'" in csp and "script-src 'self'" in csp and 'unsafe-inline' not in csp and 'unsafe-eval' not in csp and (h.get('referrer-policy') or '')=='no-referrer'
                  if ready:break
                  time.sleep(1.5)
              else:raise RuntimeError('Phase 3 public-edge propagation timeout')

              checks=[
                ('/chemistry/','Know what you don’t know'),
                ('/chemistry/plans','Choose access without guessing'),
                ('/chemistry/plans?who=myself&duration=year','Recommended for you: Annual'),
                ('/chemistry/verify','Verify this MUSITU release'),
                ('/chemistry/releases','Release notes'),
                ('/chemistry/support','payment-status link created during checkout'),
                ('/chemistry/privacy','Anonymous experience measurement'),
                ('/chemistry/terms','Premium access is granted only by a valid MUSITU-signed licence after verified settlement'),
                ('/chemistry/experience','Real-user experience evidence'),
                ('/chemistry/checkout/start?plan=annual','Continue securely to Paynow'),
                ('/chemistry/claim','Activate a paid seat')
              ]
              pages={}
              for i,(path,needle) in enumerate(checks):
                  c,h,b=public(path,'text/html',f'post-{i}-{secrets.token_hex(4)}');t=b.decode('utf-8','replace');csp=h.get('content-security-policy') or ''
                  if c!=200 or needle not in t:raise RuntimeError('route verification failed '+path)
                  if "style-src 'self'" not in csp or "script-src 'self'" not in csp or "connect-src 'self'" not in csp or 'unsafe-inline' in csp or 'unsafe-eval' in csp or 'http://' in csp or 'https://' in csp or (h.get('referrer-policy') or '')!='no-referrer':raise RuntimeError('security header verification failed '+path)
                  pages[path]=c

              # Experience JSON must stay truthful; no synthetic valid telemetry is written by this workflow.
              ec,_,eb=public('/chemistry/experience.json','application/json','experience-'+secrets.token_hex(4));experience=json.loads(eb or b'{}')
              if ec!=200 or experience.get('minimum_public_sample')!=100:raise RuntimeError('experience snapshot contract failed')
              if experience.get('status') not in ('insufficient_field_sample','field_core_web_vitals_available'):raise RuntimeError('experience snapshot status invalid')

              vc,_,vb=public('/chemistry/assets/web-vitals-6.0.1.iife.js','application/javascript','vitals-'+secrets.token_hex(4))
              if vc!=200 or len(vb)!=8987 or hashlib.sha256(vb).hexdigest()!=VITALS:raise RuntimeError('vendored web-vitals asset changed')
              fc,_,fb=public('/chemistry/assets/field-experience.js','application/javascript','field-'+secrets.token_hex(4))
              if fc!=200 or b'/chemistry/telemetry/v1' not in fb or b'https://' in fb or b'http://' in fb:raise RuntimeError('field client asset boundary failed')

              # Cross-origin telemetry must be rejected. This is deliberately invalid and cannot seed field evidence.
              tc,th,tb=public('/chemistry/telemetry/v1','application/json',method='POST',headers={'Origin':'https://invalid.musitu.example','Content-Type':'application/json'},body=neg)
              if tc!=400:raise RuntimeError('cross-origin telemetry was not rejected '+str(tc))
              if th.get('set-cookie'):raise RuntimeError('telemetry response set a cookie')

              hc,_,hb=public('/chemistry/healthz','application/json','health-'+secrets.token_hex(4));o=json.loads(hb or b'{}')
              if hc!=200 or o.get('licence_key_id')!=KEY or o.get('raw_paynow_key_present') is not False or o.get('payment_authority_bound') is not True or o.get('transport_bound') is not True:raise RuntimeError('postdeploy health boundary failed')
              cc,_,cb=public('/chemistry/catalog','application/json','catalog-'+secrets.token_hex(4));cat=json.loads(cb or b'{}');ids=[p.get('id') for p in cat.get('plans') or []]
              if cc!=200 or ids!=['term','annual','lifetime','family','tutor','school']:raise RuntimeError('catalog changed')
              qc,_,qb=public('/chemistry/checkout/start?plan=annual','text/html','annual-'+secrets.token_hex(4));qt=qb.decode('utf-8','replace')
              if qc!=200 or 'US$9.99' not in qt or 'Continue securely to Paynow' not in qt:raise RuntimeError('annual checkout changed')
              sc,_,sb=public('/chemistry/checkout/start?plan=school','text/html','school-'+secrets.token_hex(4));st=sb.decode('utf-8','replace')
              if sc!=200 or 'min="1"' not in st or 'max="999"' not in st:raise RuntimeError('school checkout changed')
              rc,_,rb=public('/chemistry/support','text/html','recovery-'+secrets.token_hex(4));rt=rb.decode('utf-8','replace')
              if rc!=200 or 'href="/chemistry/return"' in rt or 'contact MUSITU support' not in rt:raise RuntimeError('recovery hardening changed')
              ac,_,apk=public('/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk','application/vnd.android.package-archive','apk-'+secrets.token_hex(4))
              if ac!=200 or len(apk)!=5314934 or hashlib.sha256(apk).hexdigest()!=APK:raise RuntimeError('APK changed')
              livehash=hashlib.sha256(read_worker()).hexdigest()
              if livehash!=NEW:raise RuntimeError('live Worker content hash mismatch '+livehash)
          except Exception as primary:
              upload(original)
              rh=hashlib.sha256(read_worker()).hexdigest();rc2,_,_=public('/chemistry/healthz','application/json','rollback-'+secrets.token_hex(4))
              if rh!=OLD or rc2!=200:raise RuntimeError(f'ROLLBACK_VERIFY_FAILED hash={rh} http={rc2}') from primary
              raise

          ev={
            'schema':'musitu.chemistry.field_experience.deploy.v1',
            'predecessor_worker_sha256':oldhash,
            'candidate_worker_sha256':NEW,
            'live_worker_sha256':livehash,
            'licence_key_id':KEY,
            'bindings_preserved':True,
            'apk_sha256':APK,
            'apk_bytes':5314934,
            'plan_ids':ids,
            'verified_routes':pages,
            'experience_status':experience.get('status'),
            'public_minimum_metric_sample':experience.get('minimum_public_sample'),
            'web_vitals_sha256':VITALS,
            'web_vitals_bytes':8987,
            'telemetry_cross_origin_rejected':True,
            'synthetic_valid_telemetry_written':False,
            'measurement_cookies_used':False,
            'persistent_tracking_identifier_used':False,
            'raw_event_rows_retained':False,
            'field_inp_claimed':False,
            'recovery_bare_return_link_present':False,
            'edge_propagation_attempts':propagation_attempts,
            'rollback_available':True,
            'rollback_used':False,
            'gate':'MUSITU_CHEMISTRY_FIELD_EXPERIENCE_DEPLOY_PASS'
          }
          raw=(json.dumps(ev,indent=2,sort_keys=True)+'\n').encode();Path('/tmp/mchem-phase3-deploy/deploy.json').write_bytes(raw);Path('/tmp/mchem-phase3-deploy/deploy.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  deploy.json\n');print(json.dumps(ev,sort_keys=True))
          PY

      - name: Independent cache-busted public verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,secrets,urllib.error,urllib.parse,urllib.request
          from pathlib import Path
          BASE='https://payments.mftintelligence.com';EXPECTED='1134a2581d423547b9876fe8a680ef99ca949edbdbfd6757624150a23d049bec';APK='055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d';VITALS='6b3e4ac9d6f6abd4ea1810621668bec7d7adb121279570e6870be4fb98ab3909'
          def get(path,accept='*/*',method='GET',headers=None,body=None):
              if method=='GET':path += ('&' if '?' in path else '?')+'__mchem_phase3_independent='+urllib.parse.quote(secrets.token_hex(8))
              h={'Accept':accept,'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'MUSITU-Phase3-Independent/1.0'}
              if headers:h.update(headers)
              q=urllib.request.Request(BASE+path,method=method,headers=h,data=body)
              try:
                  with urllib.request.urlopen(q,timeout=60) as r:return r.status,dict(r.headers),r.read()
              except urllib.error.HTTPError as e:return e.code,dict(e.headers),e.read()
          pages={}
          checks=[('/chemistry/','Start Free'),('/chemistry/plans','Choose access without guessing'),('/chemistry/verify',APK),('/chemistry/releases','Release notes'),('/chemistry/support','payment-status link created during checkout'),('/chemistry/privacy','Anonymous experience measurement'),('/chemistry/terms','verified settlement'),('/chemistry/experience','Real-user experience evidence')]
          for path,needle in checks:
              c,h,b=get(path,'text/html');t=b.decode('utf-8','replace');csp=h.get('content-security-policy') or h.get('Content-Security-Policy') or ''
              if c!=200 or needle not in t:raise SystemExit('independent page failed '+path)
              if "style-src 'self'" not in csp or "script-src 'self'" not in csp or "connect-src 'self'" not in csp or 'unsafe-inline' in csp or 'unsafe-eval' in csp or (h.get('referrer-policy') or h.get('Referrer-Policy') or '')!='no-referrer':raise SystemExit('independent security failed '+path)
              pages[path]=c
          ec,_,eb=get('/chemistry/experience.json','application/json');experience=json.loads(eb or b'{}')
          if ec!=200 or experience.get('minimum_public_sample')!=100:raise SystemExit('independent experience failed')
          vc,_,vb=get('/chemistry/assets/web-vitals-6.0.1.iife.js','application/javascript')
          if vc!=200 or len(vb)!=8987 or hashlib.sha256(vb).hexdigest()!=VITALS:raise SystemExit('independent web-vitals failed')
          fc,_,fb=get('/chemistry/assets/field-experience.js','application/javascript')
          if fc!=200 or b'/chemistry/telemetry/v1' not in fb:raise SystemExit('independent field asset failed')
          neg=json.dumps({'events':[{'kind':'event','name':'page_view','route':'home','viewport':'mobile','detail':''}]}).encode()
          tc,th,_=get('/chemistry/telemetry/v1','application/json','POST',{'Origin':'https://invalid.musitu.example','Content-Type':'application/json'},neg)
          if tc!=400 or any(k.lower()=='set-cookie' for k in th):raise SystemExit('independent telemetry boundary failed')
          hc,_,hb=get('/chemistry/healthz','application/json');health=json.loads(hb or b'{}')
          cc,_,cb=get('/chemistry/catalog','application/json');catalog=json.loads(cb or b'{}');ids=[p.get('id') for p in catalog.get('plans') or []]
          qc,_,qb=get('/chemistry/checkout/start?plan=annual','text/html');qt=qb.decode('utf-8','replace')
          sc,_,sb=get('/chemistry/checkout/start?plan=school','text/html');st=sb.decode('utf-8','replace')
          ac,_,apk=get('/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk','application/vnd.android.package-archive');digest=hashlib.sha256(apk).hexdigest()
          if hc!=200 or health.get('licence_key_id')!='chem-lic-2026-6783aa7535d1' or health.get('raw_paynow_key_present') is not False or health.get('payment_authority_bound') is not True or health.get('transport_bound') is not True:raise SystemExit('independent health failed')
          if ids!=['term','annual','lifetime','family','tutor','school']:raise SystemExit('independent catalog changed')
          if qc!=200 or 'US$9.99' not in qt or 'Continue securely to Paynow' not in qt:raise SystemExit('independent annual checkout failed')
          if sc!=200 or 'min="1"' not in st or 'max="999"' not in st:raise SystemExit('independent school checkout failed')
          if ac!=200 or len(apk)!=5314934 or digest!=APK:raise SystemExit('independent APK failed')
          ev={'schema':'musitu.chemistry.field_experience.live.v1','candidate_worker_sha256':EXPECTED,'pages':pages,'experience_status':experience.get('status'),'public_minimum_metric_sample':experience.get('minimum_public_sample'),'health_http':hc,'catalog_http':cc,'plan_ids':ids,'apk_http':ac,'apk_sha256':digest,'apk_bytes':len(apk),'web_vitals_sha256':VITALS,'telemetry_cross_origin_rejected':True,'synthetic_valid_telemetry_written':False,'production_mutation_in_this_step':False,'field_inp_claimed':False,'gate':'MUSITU_CHEMISTRY_FIELD_EXPERIENCE_LIVE_PASS'}
          raw=(json.dumps(ev,indent=2,sort_keys=True)+'\n').encode();Path('/tmp/mchem-phase3-deploy/live.json').write_bytes(raw);Path('/tmp/mchem-phase3-deploy/live.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  live.json\n');print(json.dumps(ev,sort_keys=True))
          PY

      - name: Seal Phase 3 deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mchem-phase3-deploy
          sha256sum *.json *.sha256 > SHA256SUMS.txt
          cat deploy.json
          cat live.json

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-field-experience-deploy
          path: /tmp/mchem-phase3-deploy
          retention-days: 90
          if-no-files-found: error
