name: MUSITU Chemistry Phase 3 Field Experience Preflight
# source-revision: 5e1b9ea43f77c63c032bd350886a7321fb3f8841

on:
  push:
    branches: [chemistry-field-experience-20260906]
    paths: ['.github/workflows/chemistry-phase3-field-experience-preflight.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-chemistry-phase3-field-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_PREDECESSOR_SHA: d6642aefacc8d6765d17c1d33c2df65df33a9531f843c0bbbc2c304482d3d5f1
      VENDOR_SHA: 6b3e4ac9d6f6abd4ea1810621668bec7d7adb121279570e6870be4fb98ab3909
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct sealed base and prove predecessor boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-phase3 /tmp/mchem-base /tmp/mchem-source.zip /tmp/mchem-core
          mkdir -p /tmp/mchem-phase3 /tmp/mchem-base /tmp/mchem-core/src
          cat commerce/chemistry/source.b64.* | base64 -d > /tmp/mchem-source.zip
          echo "5b2618499eed8dc90261bc4f8260246d5593534500dd2fb145f2d24b5c47754c  /tmp/mchem-source.zip" | sha256sum -c -
          unzip -q /tmp/mchem-source.zip -d /tmp/mchem-base
          echo "848e1cec17ec580822d36e595196cda5978713849e8b45c5bc8dc7fcf9765db8  /tmp/mchem-base/src/index.mjs" | sha256sum -c -
          python - <<'PY'
          import json,os
          p='commerce/chemistry/RELEASE_BASELINE_20260906.json'
          o=json.load(open(p))
          expected=os.environ['LIVE_PREDECESSOR_SHA']
          assert o['schema']=='musitu.chemistry.release_baseline.v4',o['schema']
          assert o['status']=='VERIFIED_GLOBAL_PRODUCT_TRUST_STOREFRONT_BASELINE',o['status']
          assert o['source']['current_recovery_hardened_worker_sha256']==expected
          assert o['storefront']['current_worker_sha256']==expected
          assert o['evidence_boundaries']['independent_recovery_live_recertified'] is True
          assert o['evidence_boundaries']['field_inp_observed'] is False
          print('SEALED_V4_PREDECESSOR_MANIFEST=PASS')
          PY
          cp /tmp/mchem-base/src/index.mjs commerce/chemistry/index.base.mjs

      - name: Verify pinned web-vitals provenance and build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          echo "$VENDOR_SHA  commerce/chemistry/storefront/web-vitals-6.0.1.iife.js" | sha256sum -c -
          python - <<'PY'
          import json
          p='commerce/chemistry/storefront/WEB_VITALS_PROVENANCE.json'
          o=json.load(open(p))
          assert o['version']=='6.0.1'
          assert o['license']=='Apache-2.0'
          assert o['vendored_file_sha256']=='6b3e4ac9d6f6abd4ea1810621668bec7d7adb121279570e6870be4fb98ab3909'
          assert o['vendored_file_bytes']==8987
          print('VENDOR_PROVENANCE=PASS')
          PY
          CANDIDATE_SHA="$(python commerce/chemistry/patch_storefront.py | tail -1)"
          test "$CANDIDATE_SHA" != "$LIVE_PREDECESSOR_SHA"
          grep -q "/chemistry/telemetry/v1" commerce/chemistry/index.storefront-v3.mjs
          grep -q "/chemistry/experience" commerce/chemistry/index.storefront-v3.mjs
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" | tee -a "$GITHUB_ENV" /tmp/mchem-phase3/candidate.env
          echo "$CANDIDATE_SHA  commerce/chemistry/index.storefront-v3.mjs" | sha256sum -c -
          node --check commerce/chemistry/index.storefront-v3.mjs

      - name: Run field, storefront, Worker and original commerce contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            commerce/chemistry/storefront/field-experience.test.mjs \
            commerce/chemistry/storefront/storefront.test.mjs \
            commerce/chemistry/storefront/worker-contract.test.mjs | tee /tmp/mchem-phase3/source-tests.txt
          cp commerce/chemistry/index.storefront-v3.mjs /tmp/mchem-core/src/index.mjs
          cp -a /tmp/mchem-base/test /tmp/mchem-core/
          cp /tmp/mchem-base/package.json /tmp/mchem-core/
          cd /tmp/mchem-core
          npm test | tee /tmp/mchem-phase3/core-tests.txt
          npm run check | tee /tmp/mchem-phase3/core-check.txt

      - name: Verify generated privacy and security invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('commerce/chemistry/index.storefront-v3.mjs').read_text()
          required=[
            "/chemistry/telemetry/v1",
            "/chemistry/experience",
            "connect-src 'self'",
            'chemistry_field_aggregate',
            'Global Privacy Control',
            'Individual visits are not stored as analytics rows',
            'web-vitals-6.0.1.iife.js'
          ]
          for x in required:
            assert x in s,x
          for x in ["connect-src 'none'",'google-analytics','googletagmanager','posthog.com','segment.com','mixpanel.com']:
            assert x not in s,x
          assert "unsafe-inline" not in s
          assert "unsafe-eval" not in s
          print('PHASE3_STATIC_PRIVACY_SECURITY=PASS')
          PY

      - name: Install browser audit tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright axe-core lighthouse
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          node -e "console.log('playwright='+require('playwright/package.json').version);console.log('axe-core='+require('axe-core/package.json').version);console.log('lighthouse='+require('lighthouse/package.json').version)" | tee /tmp/mchem-phase3/tool-versions.txt

      - name: Run axe keyboard reflow reduced-motion and AX-tree gates
        shell: bash
        env:
          WORKER_PATH: ${{ github.workspace }}/commerce/chemistry/index.storefront-v3.mjs
          BROWSER_EVIDENCE: /tmp/mchem-phase3/browser-evidence.json
        run: |
          set -euo pipefail
          node commerce/chemistry/storefront/browser-smoke.mjs test "$WORKER_PATH"

      - name: Run Lighthouse mobile budgets with Phase 3 assets
        shell: bash
        env:
          WORKER_PATH: ${{ github.workspace }}/commerce/chemistry/index.storefront-v3.mjs
        run: |
          set -euo pipefail
          node commerce/chemistry/storefront/browser-smoke.mjs serve "$WORKER_PATH" >/tmp/store-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/chemistry/ >/dev/null && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8787/chemistry/ >/dev/null
          npx lighthouse http://127.0.0.1:8787/chemistry/ --output=json --output-path=/tmp/mchem-phase3/lighthouse.json --only-categories=performance,accessibility,best-practices --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const budget=JSON.parse(fs.readFileSync('commerce/chemistry/storefront/lighthouse-budget.json','utf8'));
          const l=JSON.parse(fs.readFileSync('/tmp/mchem-phase3/lighthouse.json','utf8'));
          const got={performance:l.categories.performance.score,accessibility:l.categories.accessibility.score,best_practices:l.categories['best-practices'].score,lcp_ms:l.audits['largest-contentful-paint'].numericValue,cls:l.audits['cumulative-layout-shift'].numericValue,tbt_ms:l.audits['total-blocking-time'].numericValue};
          const ok=got.performance>=budget.performance_score_min&&got.accessibility>=budget.accessibility_score_min&&got.best_practices>=budget.best_practices_score_min&&got.lcp_ms<=budget.lcp_ms_max&&got.cls<=budget.cls_max&&got.tbt_ms<=budget.tbt_ms_max;
          fs.writeFileSync('/tmp/mchem-phase3/lighthouse-summary.json',JSON.stringify({schema:'musitu.chemistry.phase3.lighthouse.v1',budget,results:got,pass:ok},null,2)+'\n');
          console.log(JSON.stringify(got));
          if(!ok) process.exit(1);
          JS
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Seal preflight evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mchem-phase3/preflight-summary.json <<JSON
          {
            "schema":"musitu.chemistry.field_experience.preflight.v1",
            "live_predecessor_worker_sha256":"$LIVE_PREDECESSOR_SHA",
            "candidate_worker_sha256":"$CANDIDATE_SHA",
            "web_vitals_version":"6.0.1",
            "web_vitals_sha256":"$VENDOR_SHA",
            "storage_model":"aggregate_histogram_only",
            "raw_event_rows_retained":false,
            "cookies_for_measurement":false,
            "persistent_tracking_identifier":false,
            "query_strings_collected":false,
            "referrers_collected":false,
            "ip_addresses_stored":false,
            "gpc_and_dnt_suppression":true,
            "public_minimum_metric_sample":100,
            "field_inp_status":"collection_candidate_not_yet_deployed",
            "payment_contract_changed":false,
            "licence_contract_changed":false,
            "gate":"MUSITU_CHEMISTRY_FIELD_EXPERIENCE_PREFLIGHT_PASS"
          }
          JSON
          cd /tmp/mchem-phase3
          sha256sum *.json *.txt *.env > SHA256SUMS.txt
          cat preflight-summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-field-experience-preflight
          path: /tmp/mchem-phase3
          retention-days: 90
          if-no-files-found: error
