name: MUSITU Chemistry Public Surfaces One-Shot Deploy

on:
  push:
    branches: [chemistry-commerce-live-20260906]
    paths: ['.github/workflows/chemistry-public-surfaces-one-shot.yml']

permissions:
  contents: read

concurrency:
  group: musitu-chemistry-public-surfaces-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct current storefront and verify public patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-source /tmp/mchem-source.zip /tmp/mchem-public
          mkdir -p /tmp/mchem-source /tmp/mchem-public/src
          cat commerce/chemistry/source.b64.* | base64 -d > /tmp/mchem-source.zip
          echo "5b2618499eed8dc90261bc4f8260246d5593534500dd2fb145f2d24b5c47754c  /tmp/mchem-source.zip" | sha256sum -c -
          unzip -q /tmp/mchem-source.zip -d /tmp/mchem-source
          echo "848e1cec17ec580822d36e595196cda5978713849e8b45c5bc8dc7fcf9765db8  /tmp/mchem-source/src/index.mjs" | sha256sum -c -
          cp /tmp/mchem-source/src/index.mjs commerce/chemistry/index.base.mjs
          python commerce/chemistry/patch_storefront.py
          echo "8b63862f7528d7e4144f8706e48c7ccd833a4da47659d3df79266f5ce024468b  commerce/chemistry/index.storefront.mjs" | sha256sum -c -
          python commerce/chemistry/patch_public_surfaces.py
          node --check commerce/chemistry/index.public.mjs
          NEW_SHA="$(sha256sum commerce/chemistry/index.public.mjs | awk '{print $1}')"
          echo "$NEW_SHA" > /tmp/public-worker.sha256
          cp commerce/chemistry/index.public.mjs /tmp/mchem-public/src/index.mjs
          cp -a /tmp/mchem-source/test /tmp/mchem-public/
          cp /tmp/mchem-source/package.json /tmp/mchem-public/
          rm -f commerce/chemistry/index.base.mjs commerce/chemistry/index.storefront.mjs commerce/chemistry/index.public.mjs
          cd /tmp/mchem-public
          npm test
          node --input-type=module <<'JS'
          import {handleRequest} from './src/index.mjs';
          const checks=[
            ['/chemistry/','MUSITU Chemistry Mastery'],
            ['/chemistry/privacy','Information processed for purchases'],
            ['/chemistry/terms','Premium licences'],
            ['/chemistry/support','Find your Device ID'],
            ['/chemistry/sitemap.xml','<urlset'],
            ['/chemistry/security.txt','Canonical:']
          ];
          for(const [path,needle] of checks){
            const r=await handleRequest(new Request('https://payments.mftintelligence.com'+path),{});
            const t=await r.text();
            if(r.status!==200||!t.includes(needle))throw new Error('route check failed '+path);
            if(path.endsWith('/')||['/chemistry/privacy','/chemistry/terms','/chemistry/support'].includes(path)){
              if(r.headers.get('x-content-type-options')!=='nosniff')throw new Error('nosniff missing '+path);
              if(r.headers.get('x-frame-options')!=='DENY')throw new Error('frame deny missing '+path);
              if(!r.headers.get('content-security-policy')?.includes("frame-ancestors 'none'"))throw new Error('csp missing '+path);
            }
          }
          console.log('PUBLIC_ROUTE_CHECKS=PASS');
          JS
          echo "PUBLIC_WORKER_SHA256=$NEW_SHA"

      - name: Content-only deploy with rollback and binding preservation
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,secrets,time,urllib.error,urllib.request
          from pathlib import Path
          API='https://api.cloudflare.com/client/v4';AID='93f395f5121954671f92fffa453d6b61';WORKER='musitu-chemistry-commerce';BASE='https://payments.mftintelligence.com'
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Chemistry-Public-Surfaces/1.0'}
          EXPECTED_OLD='8b63862f7528d7e4144f8706e48c7ccd833a4da47659d3df79266f5ce024468b';KEY_ID='chem-lic-2026-6783aa7535d1'
          new=Path('/tmp/mchem-public/src/index.mjs').read_bytes();newhash=hashlib.sha256(new).hexdigest();recorded=Path('/tmp/public-worker.sha256').read_text().strip()
          if newhash!=recorded:raise SystemExit('generated source hash drift')
          def req(url,method='GET',headers=None,body=None,timeout=60):
              q=urllib.request.Request(url,method=method,headers=dict(headers or {}),data=body)
              try:
                  with urllib.request.urlopen(q,timeout=timeout) as r:return r.status,r.headers,r.read()
              except urllib.error.HTTPError as e:return e.code,e.headers,e.read()
          def extract(raw,ctype,needle):
              if 'multipart/' not in (ctype or '').lower():return raw
              msg=email.message_from_bytes((f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw);parts=[]
              for p in msg.walk():
                  if p.is_multipart():continue
                  d=p.get_payload(decode=True) or b''
                  if needle.encode() in d:parts.append(d)
              if len(parts)!=1:raise RuntimeError('module extraction mismatch')
              return parts[0]
          def read_worker():
              c,h,b=req(f'{API}/accounts/{AID}/workers/scripts/{WORKER}',headers=H)
              if c!=200:raise RuntimeError(f'worker read HTTP {c}')
              return extract(b,h.get('content-type',''),'MUSITU Chemistry Commerce')
          def upload_content(source):
              boundary='----MUSITU'+secrets.token_hex(16);meta=json.dumps({'main_module':'index.mjs'},separators=(',',':'))
              body=(f'--{boundary}\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n{meta}\r\n--{boundary}\r\nContent-Disposition: form-data; name="index.mjs"; filename="index.mjs"\r\nContent-Type: application/javascript+module\r\n\r\n').encode()+source+f'\r\n--{boundary}--\r\n'.encode()
              h=dict(H);h['Content-Type']='multipart/form-data; boundary='+boundary
              c,_,b=req(f'{API}/accounts/{AID}/workers/scripts/{WORKER}/content','PUT',h,body)
              if not 200<=c<300:raise RuntimeError(f'content upload HTTP {c}: '+b[:300].decode('utf-8','ignore'))
          original=read_worker();oldhash=hashlib.sha256(original).hexdigest()
          if oldhash!=EXPECTED_OLD:raise SystemExit('live Worker source drift: '+oldhash)
          upload_content(new)
          try:
              for _ in range(20):
                  c,h,b=req(BASE+'/chemistry/healthz',headers={'Accept':'application/json','User-Agent':'MUSITU-Public-Surfaces-Verify/1.0'})
                  try:o=json.loads(b or b'{}')
                  except:o={}
                  if c==200 and o.get('ok') is True:break
                  time.sleep(1.5)
              else:raise RuntimeError('health readiness timeout')
              if o.get('licence_key_id')!=KEY_ID or o.get('raw_paynow_key_present') is not False or o.get('payment_authority_bound') is not True or o.get('transport_bound') is not True:raise RuntimeError('binding/key preservation failed')
              for path,needle in [('/chemistry/','Privacy'),('/chemistry/privacy','Information processed for purchases'),('/chemistry/terms','Premium licences'),('/chemistry/support','Find your Device ID'),('/chemistry/sitemap.xml','<urlset'),('/chemistry/security.txt','Canonical:')]:
                  c,h,b=req(BASE+path,headers={'User-Agent':'MUSITU-Public-Surfaces-Verify/1.0'});t=b.decode('utf-8','replace')
                  if c!=200 or needle not in t:raise RuntimeError('live route verification failed '+path)
                  if path in ['/chemistry/','/chemistry/privacy','/chemistry/terms','/chemistry/support']:
                      if (h.get('x-content-type-options') or '')!='nosniff' or (h.get('x-frame-options') or '')!='DENY':raise RuntimeError('security header verification failed '+path)
              live=read_worker();livehash=hashlib.sha256(live).hexdigest()
              if livehash!=newhash:raise RuntimeError('live Worker content hash mismatch '+livehash)
          except Exception:
              upload_content(original)
              raise
          Path('/tmp/public-surfaces-deploy.json').write_text(json.dumps({'schema':'musitu.chemistry.public_surfaces.v1','old_source_sha256':oldhash,'new_source_sha256':newhash,'licence_key_id':KEY_ID,'bindings_preserved':True,'routes':['/chemistry/','/chemistry/privacy','/chemistry/terms','/chemistry/support','/chemistry/sitemap.xml','/chemistry/security.txt'],'gate':'MUSITU_CHEMISTRY_PUBLIC_SURFACES_PASS'},indent=2,sort_keys=True)+'\n')
          print('PUBLIC_WORKER_SHA256='+newhash)
          PY

      - name: Independent live journey verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,urllib.error,urllib.request
          base='https://payments.mftintelligence.com';expected_apk='055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d'
          def get(path,accept='*/*'):
              q=urllib.request.Request(base+path,headers={'Accept':accept,'User-Agent':'MUSITU-Chemistry-Public-Final/1.0'})
              try:
                  with urllib.request.urlopen(q,timeout=60) as r:return r.status,dict(r.headers),r.read()
              except urllib.error.HTTPError as e:return e.code,dict(e.headers),e.read()
          hc,hh,hb=get('/chemistry/healthz','application/json');health=json.loads(hb or b'{}')
          cc,ch,cb=get('/chemistry/catalog','application/json');catalog=json.loads(cb or b'{}')
          qc,qh,qb=get('/chemistry/checkout/start?plan=annual','text/html')
          ac,ah,apk=get('/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk','application/vnd.android.package-archive')
          pages={}
          for path in ['/chemistry/','/chemistry/privacy','/chemistry/terms','/chemistry/support','/chemistry/sitemap.xml','/chemistry/security.txt']:
              c,h,b=get(path);pages[path]={'status':c,'nosniff':h.get('x-content-type-options'),'frame':h.get('x-frame-options'),'bytes':len(b)}
              if c!=200:raise SystemExit('page failed '+path)
          ids=[p.get('id') for p in catalog.get('plans') or []]
          digest=hashlib.sha256(apk).hexdigest()
          if health.get('licence_key_id')!='chem-lic-2026-6783aa7535d1' or health.get('raw_paynow_key_present') is not False:raise SystemExit('health boundary failed')
          if ids!=['term','annual','lifetime','family','tutor','school']:raise SystemExit('catalog changed')
          if qc!=200 or b'Continue securely to Paynow' not in qb:raise SystemExit('checkout changed')
          if ac!=200 or len(apk)!=5314934 or digest!=expected_apk:raise SystemExit('APK changed')
          ev={'schema':'musitu.chemistry.public_surfaces.live.v1','health_http':hc,'checkout_http':qc,'apk_http':ac,'apk_sha256':digest,'apk_bytes':len(apk),'licence_key_id':health.get('licence_key_id'),'plan_ids':ids,'pages':pages,'production_mutation_in_this_step':False,'gate':'MUSITU_CHEMISTRY_PUBLIC_SURFACES_FINAL_VERIFY_PASS'}
          raw=(json.dumps(ev,indent=2,sort_keys=True)+'\n').encode();open('/tmp/public-surfaces-live.json','wb').write(raw);open('/tmp/public-surfaces-live.sha256','w').write(hashlib.sha256(raw).hexdigest()+'  public-surfaces-live.json\n');print(json.dumps(ev,sort_keys=True))
          PY

      - name: Collect evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-surfaces-evidence
          cp /tmp/public-surfaces-deploy.json public-surfaces-evidence/
          cp /tmp/public-surfaces-live.json public-surfaces-evidence/
          cp /tmp/public-surfaces-live.sha256 public-surfaces-evidence/
          sha256sum public-surfaces-evidence/public-surfaces-deploy.json public-surfaces-evidence/public-surfaces-live.json > public-surfaces-evidence/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-public-surfaces-live
          path: public-surfaces-evidence
          retention-days: 90
          if-no-files-found: error
