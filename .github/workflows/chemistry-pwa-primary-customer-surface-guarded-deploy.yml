name: MUSITU Chemistry PWA Primary Customer Surface Guarded Deploy

on:
  push:
    branches: [chemistry-national-rescue-growth-20260907]
    paths: ['.github/workflows/chemistry-pwa-primary-customer-surface-guarded-deploy.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: musitu-chemistry-global-storefront-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PREVIOUS_WORKER_SHA: 68786463cdb6527adac1df1ec9a3b3424f0e5cdb0544dbbf1a1c9ffaa3ec6967
      CANDIDATE_WORKER_SHA: c25d6785e1a7cc10a3dada2e373d44e11aea240bbfd7412dc0d854c91c7e2592
      EVIDENCE_HEAD_SHA: 3689b683671598ce5ae3fd86bd7f40aa057b45ba
      EVIDENCE_TREE_SHA: 38b1799d8abadfe26f976c325ffdcc89634ced47
      PREFLIGHT_RUN_ID: '34194314676'
      PREFLIGHT_ARTIFACT_ID: '10043328101'
      PREFLIGHT_ARTIFACT_SHA256: 7a8bea25139da4fa2a199328b4dcd0d96b1688130a284b92ebd6390fe1861228
      FOCUSED_CI_RUN_ID: '34194314681'
      SOURCE_ZIP_SHA256: 5b2618499eed8dc90261bc4f8260246d5593534500dd2fb145f2d24b5c47754c
      BASE_WORKER_SHA256: 848e1cec17ec580822d36e595196cda5978713849e8b45c5bc8dc7fcf9765db8
      WEB_VITALS_SHA256: 6b3e4ac9d6f6abd4ea1810621668bec7d7adb121279570e6870be4fb98ab3909
      LICENCE_KEY_ID: chem-lic-2026-6783aa7535d1
      APK_SHA256: 055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact green PWA-first evidence and rebuild candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-pwa-deploy /tmp/mchem-pwa-base /tmp/mchem-pwa-source.zip /tmp/mchem-pwa-core
          mkdir -p /tmp/mchem-pwa-deploy /tmp/mchem-pwa-base /tmp/mchem-pwa-core/src

          for rid in "$PREFLIGHT_RUN_ID" "$FOCUSED_CI_RUN_ID"; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${rid}" > "/tmp/mchem-pwa-deploy/run-${rid}.json"
          done
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}/artifacts?per_page=100" > "/tmp/mchem-pwa-deploy/artifacts-${PREFLIGHT_RUN_ID}.json"

          python - <<'PY'
          import json,os,subprocess
          root='/tmp/mchem-pwa-deploy/'
          def load(name): return json.load(open(root+name))
          expected=[
            (os.environ['PREFLIGHT_RUN_ID'],'MUSITU Chemistry Rescue Full Preflight'),
            (os.environ['FOCUSED_CI_RUN_ID'],'MUSITU Chemistry Rescue Growth Focused CI'),
          ]
          for rid,name in expected:
            r=load('run-'+rid+'.json')
            observed={k:r.get(k) for k in ('status','conclusion','head_sha','name')}
            if observed != {'status':'completed','conclusion':'success','head_sha':os.environ['EVIDENCE_HEAD_SHA'],'name':name}:
              raise SystemExit('exact CI evidence rejected '+name+' '+json.dumps(observed,sort_keys=True))
          arts=load('artifacts-'+os.environ['PREFLIGHT_RUN_ID']+'.json').get('artifacts',[])
          matches=[a for a in arts if str(a.get('id'))==os.environ['PREFLIGHT_ARTIFACT_ID']]
          if len(matches)!=1 or matches[0].get('name')!='musitu-chemistry-rescue-full-preflight' or matches[0].get('expired') is not False:
            raise SystemExit('preflight artifact identity rejected')
          got=str(matches[0].get('digest') or '').removeprefix('sha256:')
          if got!=os.environ['PREFLIGHT_ARTIFACT_SHA256']:
            raise SystemExit('preflight artifact digest rejected '+got)
          tree=subprocess.check_output(['git','rev-parse',os.environ['EVIDENCE_HEAD_SHA']+'^{tree}'],text=True).strip()
          if tree!=os.environ['EVIDENCE_TREE_SHA']:
            raise SystemExit('evidence tree mismatch '+tree)
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only',os.environ['EVIDENCE_HEAD_SHA'],'commerce/chemistry/storefront'],text=True).splitlines()
          paths += ['commerce/chemistry/patch_storefront.py','commerce/chemistry/patch_rescue_growth.py']
          for p in paths:
            expected_bytes=subprocess.check_output(['git','show',os.environ['EVIDENCE_HEAD_SHA']+':'+p])
            with open(p,'rb') as f: current=f.read()
            if expected_bytes!=current: raise SystemExit('source drift after green evidence '+p)
          print('PWA_PRIMARY_EXACT_EVIDENCE=PASS files='+str(len(paths)))
          PY

          cat commerce/chemistry/source.b64.* | base64 -d > /tmp/mchem-pwa-source.zip
          echo "$SOURCE_ZIP_SHA256  /tmp/mchem-pwa-source.zip" | sha256sum -c -
          unzip -q /tmp/mchem-pwa-source.zip -d /tmp/mchem-pwa-base
          echo "$BASE_WORKER_SHA256  /tmp/mchem-pwa-base/src/index.mjs" | sha256sum -c -
          echo "$WEB_VITALS_SHA256  commerce/chemistry/storefront/web-vitals-6.0.1.iife.js" | sha256sum -c -
          cp /tmp/mchem-pwa-base/src/index.mjs commerce/chemistry/index.base.mjs
          python commerce/chemistry/patch_storefront.py
          python commerce/chemistry/patch_rescue_growth.py
          echo "$CANDIDATE_WORKER_SHA  commerce/chemistry/index.storefront-v3.mjs" | sha256sum -c -
          node --check commerce/chemistry/index.storefront-v3.mjs
          node --test commerce/chemistry/storefront/*.test.mjs
          cp commerce/chemistry/index.storefront-v3.mjs /tmp/mchem-pwa-core/src/index.mjs
          cp -a /tmp/mchem-pwa-base/test /tmp/mchem-pwa-core/
          cp /tmp/mchem-pwa-base/package.json /tmp/mchem-pwa-core/
          cd /tmp/mchem-pwa-core && npm test && npm run check

      - name: Guarded PWA-first production cutover with automatic rollback
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,secrets,time,urllib.error,urllib.parse,urllib.request
          from pathlib import Path

          API='https://api.cloudflare.com/client/v4'
          ACCOUNT='93f395f5121954671f92fffa453d6b61'
          WORKER='musitu-chemistry-commerce'
          BASE='https://payments.mftintelligence.com'
          AUTH={
            'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],
            'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],
            'User-Agent':'MUSITU-PWA-Primary-Deploy/1.0',
          }
          OLD=os.environ['PREVIOUS_WORKER_SHA']
          NEW=os.environ['CANDIDATE_WORKER_SHA']
          KEY=os.environ['LICENCE_KEY_ID']
          APK_SHA=os.environ['APK_SHA256']
          VITALS_SHA=os.environ['WEB_VITALS_SHA256']
          evidence=Path('/tmp/mchem-pwa-deploy')
          candidate=Path('commerce/chemistry/index.storefront-v3.mjs').read_bytes()
          if hashlib.sha256(candidate).hexdigest()!=NEW: raise SystemExit('candidate hash mismatch')

          def req(url,method='GET',headers=None,body=None,timeout=60):
            r=urllib.request.Request(url,method=method,headers=dict(headers or {}),data=body)
            try:
              with urllib.request.urlopen(r,timeout=timeout) as x: return x.status,x.headers,x.read()
            except urllib.error.HTTPError as e: return e.code,e.headers,e.read()

          def public(path,accept='*/*',nonce=None,ua=None):
            if nonce: path+=('&' if '?' in path else '?')+'__mchem_pwa='+urllib.parse.quote(nonce)
            h={'Accept':accept,'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache','User-Agent':ua or ('MUSITU-PWA-Live/'+secrets.token_hex(4))}
            return req(BASE+path,headers=h)

          def extract(raw,ctype,needle):
            if 'multipart/' not in (ctype or '').lower(): return raw
            msg=email.message_from_bytes((f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw)
            parts=[]
            for p in msg.walk():
              if p.is_multipart(): continue
              data=p.get_payload(decode=True) or b''
              if needle.encode() in data: parts.append(data)
            if len(parts)!=1: raise RuntimeError('worker module extraction mismatch')
            return parts[0]

          def read_worker():
            c,h,b=req(f'{API}/accounts/{ACCOUNT}/workers/scripts/{WORKER}',headers=AUTH)
            if c!=200: raise RuntimeError(f'worker read HTTP {c}')
            return extract(b,h.get('content-type',''),'MUSITU Chemistry Commerce')

          def read_hash(): return hashlib.sha256(read_worker()).hexdigest()

          def upload(source):
            boundary='----MUSITU'+secrets.token_hex(16)
            meta=json.dumps({'main_module':'index.mjs'},separators=(',',':'))
            body=(f'--{boundary}\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n{meta}\r\n--{boundary}\r\nContent-Disposition: form-data; name="index.mjs"; filename="index.mjs"\r\nContent-Type: application/javascript+module\r\n\r\n').encode()+source+f'\r\n--{boundary}--\r\n'.encode()
            h=dict(AUTH); h['Content-Type']='multipart/form-data; boundary='+boundary
            c,_,b=req(f'{API}/accounts/{ACCOUNT}/workers/scripts/{WORKER}/content','PUT',h,body)
            if not 200<=c<300: raise RuntimeError(f'worker upload HTTP {c}: '+b[:300].decode('utf-8','ignore'))

          def strict(h):
            csp=h.get('content-security-policy') or ''
            return (
              "style-src 'self'" in csp and "script-src 'self'" in csp and "connect-src 'self'" in csp and "manifest-src 'self'" in csp and
              'unsafe-inline' not in csp and 'unsafe-eval' not in csp and
              (h.get('referrer-policy') or '')=='no-referrer' and
              (h.get('x-frame-options') or '')=='DENY' and
              (h.get('x-content-type-options') or '')=='nosniff'
            )

          def health_ok():
            c,_,b=public('/chemistry/healthz','application/json','health-'+secrets.token_hex(4))
            try: d=json.loads(b or b'{}')
            except: return False
            return c==200 and d.get('ok') is True and d.get('licence_key_id')==KEY and d.get('raw_paynow_key_present') is False and d.get('payment_authority_bound') is True and d.get('transport_bound') is True

          def wait_hash(target,allowed,seconds):
            deadline=time.time()+seconds; reads=0
            while time.time()<deadline:
              got=read_hash(); reads+=1
              if got==target:
                print(f'CLOUDFLARE_SCRIPT_HASH_CONVERGED {got} reads={reads}')
                return
              if got not in allowed: raise RuntimeError('unexpected Cloudflare script hash '+got)
              time.sleep(1)
            raise RuntimeError('Cloudflare script hash convergence timeout')

          def text_route(path,required=(),forbidden=()):
            c,h,b=public(path,'text/html','route-'+secrets.token_hex(4))
            text=b.decode('utf-8','replace')
            if c!=200 or not strict(h): raise RuntimeError('route boundary failed '+path+' HTTP '+str(c))
            for needle in required:
              if needle not in text: raise RuntimeError(path+' missing '+needle)
            for needle in forbidden:
              if needle in text: raise RuntimeError(path+' exposed forbidden '+needle)
            return h,text

          original=read_worker()
          live_hash=hashlib.sha256(original).hexdigest()
          if live_hash!=OLD: raise SystemExit('LIVE_SOURCE_DRIFT '+live_hash)
          if not health_ok(): raise SystemExit('predeploy health boundary failed')
          c,_,apk=public('/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk','application/vnd.android.package-archive','apk-pre-'+secrets.token_hex(4))
          if c!=200 or len(apk)!=5314934 or hashlib.sha256(apk).hexdigest()!=APK_SHA: raise SystemExit('predeploy legacy APK provenance boundary failed')

          rollback=False
          upload(candidate)
          try:
            wait_hash(NEW,{OLD,NEW},60)
            streak=0; attempts=0; rays=[]
            for attempt in range(1,121):
              attempts=attempt; sweep=[]; ok=True
              checks=[
                ('/chemistry/',('Installable web app','href="/chemistry/install">Start Free','Installable MUSITU web app'),('Authentic Android installer','APK installation is free','href="/chemistry/download/')),
                ('/chemistry/install',('Get MUSITU Chemistry on this device','Open in Chrome to install','Use MUSITU now'),('Download verified Android APK','href="/chemistry/download/')),
                ('/chemistry/support',('Install MUSITU','href="/chemistry/install"','Reinstall'),('href="/chemistry/download/',)),
                ('/chemistry/verify',('Legacy Android package provenance','href="/chemistry/install"'),('Download verified APK','href="/chemistry/download/')),
                ('/chemistry/rescue?src=direct',('Help another Chemistry student before exams',),()),
                ('/chemistry/app',('Your Chemistry workspace.','class="app-topbar"','class="app-nav"'),('class="site-footer"',)),
                ('/chemistry/app?view=premium',('Unlock full mastery.','class="app-topbar"','class="app-nav"'),('class="site-footer"',)),
                ('/chemistry/app?view=help',('Help without leaving MUSITU.','class="app-topbar"','class="app-nav"'),('class="site-footer"',)),
              ]
              for idx,(path,required,forbidden) in enumerate(checks):
                c,h,b=public(path,'text/html',f'sweep-{attempt}-{idx}-{secrets.token_hex(4)}')
                text=b.decode('utf-8','replace'); ray=h.get('cf-ray') or ''
                if ray: sweep.append(ray)
                if c!=200 or not strict(h) or any(x not in text for x in required) or any(x in text for x in forbidden):
                  ok=False; break
              if ok and health_ok():
                streak+=1; rays.extend(sweep)
                print(f'PWA_PRIMARY_EDGE_SWEEP_PASS attempt={attempt} streak={streak} rays={json.dumps(sweep)}')
                if streak>=6: break
              else: streak=0
              time.sleep(1)
            if streak<6: raise RuntimeError(f'edge convergence timeout attempts={attempts} streak={streak}')

            _,root=text_route('/chemistry/',required=('Installable web app','href="/chemistry/install">Start Free'),forbidden=('href="/chemistry/download/','Authentic Android installer','APK installation is free'))
            _,install=text_route('/chemistry/install',required=('Get MUSITU Chemistry on this device','Open in Chrome to install'),forbidden=('href="/chemistry/download/','Download verified Android APK'))
            _,support=text_route('/chemistry/support',required=('href="/chemistry/install"','Install MUSITU','Reinstall'),forbidden=('href="/chemistry/download/',))
            _,verify=text_route('/chemistry/verify',required=('Legacy Android package provenance','href="/chemistry/install"'),forbidden=('Download verified APK','href="/chemistry/download/'))

            c,h,b=public('/chemistry/sw.js','application/javascript','sw-'+secrets.token_hex(4)); sw=b.decode('utf-8','replace')
            if c!=200 or 'no-cache' not in (h.get('cache-control') or '') or (h.get('service-worker-allowed') or '')!='/chemistry/': raise RuntimeError('service worker headers failed')
            for needle in ['musitu-chemistry-install-v6','/chemistry/app?view=premium','/chemistry/app?view=help','checkout|return|claim|telemetry|plans']:
              if needle not in sw: raise RuntimeError('service worker missing '+needle)

            c,_,b=public('/chemistry/assets/app-shell.js?v=3','application/javascript','appjs-'+secrets.token_hex(4)); appjs=b.decode('utf-8','replace')
            for needle in ['musitu-chemistry-app-shell-v3','/chemistry/app?view=premium','/chemistry/app?view=help','primeOfflineShell']:
              if needle not in appjs: raise RuntimeError('app shell JS missing '+needle)
            for forbidden in ['/chemistry/checkout','/chemistry/return','/chemistry/claim','/chemistry/telemetry','/chemistry/plans']:
              if forbidden in appjs: raise RuntimeError('sensitive route cached in app shell JS '+forbidden)

            c,_,b=public('/chemistry/manifest.webmanifest','application/manifest+json','manifest-'+secrets.token_hex(4)); manifest=json.loads(b or b'{}')
            if c!=200 or manifest.get('id')!='/chemistry/rescue?src=direct' or manifest.get('start_url')!='/chemistry/app' or manifest.get('scope')!='/chemistry/' or manifest.get('display')!='standalone': raise RuntimeError('manifest identity boundary failed')

            c,_,b=public('/chemistry/assets/web-vitals-6.0.1.iife.js','application/javascript','vitals-'+secrets.token_hex(4))
            if c!=200 or len(b)!=8987 or hashlib.sha256(b).hexdigest()!=VITALS_SHA: raise RuntimeError('web-vitals asset changed')
            if not health_ok(): raise RuntimeError('postdeploy health boundary failed')
            c,_,apk=public('/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk','application/vnd.android.package-archive','apk-post-'+secrets.token_hex(4))
            if c!=200 or len(apk)!=5314934 or hashlib.sha256(apk).hexdigest()!=APK_SHA: raise RuntimeError('legacy APK provenance boundary changed')
            wait_hash(NEW,{NEW},15)

            result={
              'schema':'musitu.chemistry.pwa_primary_customer_surface.deploy.v1',
              'source_evidence_sha':os.environ['EVIDENCE_HEAD_SHA'],
              'candidate_worker_sha256':NEW,
              'previous_worker_sha256':OLD,
              'edge_sweep_streak':streak,
              'edge_sweep_attempts':attempts,
              'edge_ray_sample':rays[-24:],
              'storefront_start_free_routes_to_install':True,
              'customer_install_surface_apk_links_absent':True,
              'support_apk_links_absent':True,
              'verify_primary_install_surface':True,
              'legacy_apk_provenance_preserved':True,
              'dedicated_app_shell_preserved':True,
              'premium_help_internal_views_preserved':True,
              'service_worker_cache':'musitu-chemistry-install-v6',
              'sensitive_routes_network_authoritative':True,
              'payment_authority_preserved':True,
              'transport_binding_preserved':True,
              'physical_device_claimed':False,
              'real_money_settlement_performed':False,
              'rollback_used':rollback,
            }
            (evidence/'live-result.json').write_text(json.dumps(result,indent=2)+'\n')
            print('MUSITU_CHEMISTRY_PWA_PRIMARY_CUSTOMER_SURFACE_DEPLOY_PASS')
            print(json.dumps(result,sort_keys=True))
          except Exception as exc:
            print('PWA_PRIMARY_ACCEPTANCE_FAILED '+repr(exc))
            rollback=True
            upload(original)
            try: wait_hash(OLD,{OLD,NEW},120)
            except Exception as restore_exc: raise SystemExit('candidate rejected and rollback source verification failed: '+repr(exc)+' / '+repr(restore_exc))
            deadline=time.time()+120
            while time.time()<deadline:
              try:
                c,h,b=public('/chemistry/app','text/html','rollback-'+secrets.token_hex(4))
                if c==200 and strict(h) and health_ok():
                  (evidence/'rollback-result.json').write_text(json.dumps({'rollback_used':True,'restored_worker_sha256':OLD,'reason':repr(exc)},indent=2)+'\n')
                  print('MUSITU_CHEMISTRY_PWA_PRIMARY_ROLLBACK_PASS')
                  raise SystemExit('candidate rejected; rollback completed: '+repr(exc))
              except SystemExit: raise
              except Exception: pass
              time.sleep(1)
            raise SystemExit('candidate rejected and rollback edge verification failed: '+repr(exc))
          PY

      - name: Seal guarded deployment evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mchem-pwa-deploy
          cat > provenance.json <<EOF
          {
            "schema":"musitu.chemistry.pwa_primary_customer_surface.deploy.provenance.v1",
            "github_repository":"${GITHUB_REPOSITORY}",
            "github_sha":"${GITHUB_SHA}",
            "github_run_id":"${GITHUB_RUN_ID}",
            "github_run_attempt":"${GITHUB_RUN_ATTEMPT}",
            "source_evidence_sha":"${EVIDENCE_HEAD_SHA}",
            "candidate_worker_sha256":"${CANDIDATE_WORKER_SHA}",
            "previous_worker_sha256":"${PREVIOUS_WORKER_SHA}",
            "preflight_run_id":"${PREFLIGHT_RUN_ID}",
            "preflight_artifact_id":"${PREFLIGHT_ARTIFACT_ID}",
            "preflight_artifact_sha256":"${PREFLIGHT_ARTIFACT_SHA256}",
            "focused_ci_run_id":"${FOCUSED_CI_RUN_ID}",
            "physical_device_claimed":false,
            "real_money_settlement_performed":false
          }
          EOF
          sha256sum *.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload guarded deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-pwa-primary-customer-surface-deploy-evidence
          path: /tmp/mchem-pwa-deploy
          if-no-files-found: error
          retention-days: 90
