name: MUSITU Chemistry Rescue Growth Focused CI

on:
  push:
    branches: [chemistry-national-rescue-growth-20260907]
    paths:
      - 'commerce/chemistry/storefront/**'
      - 'commerce/chemistry/patch_storefront.py'
      - '.github/workflows/chemistry-rescue-growth-task1-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run focused Rescue growth contracts
        shell: bash
        run: |
          set -euo pipefail
          files=(commerce/chemistry/storefront/field-experience.test.mjs commerce/chemistry/storefront/rescue-growth.test.mjs)
          if [[ -f commerce/chemistry/storefront/rescue-render.test.mjs ]]; then files+=(commerce/chemistry/storefront/rescue-render.test.mjs); fi
          if [[ -f commerce/chemistry/storefront/rescue-kits.test.mjs ]]; then files+=(commerce/chemistry/storefront/rescue-kits.test.mjs); fi
          node --test "${files[@]}"
