name: MUSITU Chemistry Rescue Growth Task 1 CI

on:
  push:
    branches: [chemistry-national-rescue-growth-20260907]
    paths:
      - 'commerce/chemistry/storefront/field-experience.mjs'
      - 'commerce/chemistry/storefront/field-experience.test.mjs'
      - 'commerce/chemistry/storefront/rescue-growth.mjs'
      - 'commerce/chemistry/storefront/rescue-growth.test.mjs'
      - '.github/workflows/chemistry-rescue-growth-task1-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run focused Rescue growth contracts
        run: node --test commerce/chemistry/storefront/field-experience.test.mjs commerce/chemistry/storefront/rescue-growth.test.mjs 2>/tmp/rescue-test.err || { cat /tmp/rescue-test.err; exit 1; }
        if: ${{ hashFiles('commerce/chemistry/storefront/rescue-growth.test.mjs') != '' }}
      - name: Run Phase 3 field baseline when Rescue tests are absent
        run: node --test commerce/chemistry/storefront/field-experience.test.mjs
        if: ${{ hashFiles('commerce/chemistry/storefront/rescue-growth.test.mjs') == '' }}
