name: MUSITU Chemistry Rescue Independent Live Verify

on:
  push:
    branches: [chemistry-national-rescue-growth-20260907]
    paths: ['.github/workflows/chemistry-rescue-independent-live-verify.yml']

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_WORKER_SHA: 7b17d37b514913a59a66fa1339ced59ab0b06ff9759ef51cd5ec16d4e5e20af0
      DEPLOY_RUN_ID: '34078264681'
      DEPLOY_HEAD_SHA: 5f410e541c8df3296fe7bb5e178c9dad8d7d81e9
      DEPLOY_ARTIFACT_ID: '10002817712'
      DEPLOY_ARTIFACT_SHA256: f32fe7ce17489232f0360b72f02209634016d710cb0e89fbb032d652af0002cc
      WEB_VITALS_SHA256: 6b3e4ac9d6f6abd4ea1810621668bec7d7adb121279570e6870be4fb98ab3909
      APK_SHA256: 055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d
      LICENCE_KEY_ID: chem-lic-2026-6783aa7535d1
    steps:
      - uses: actions/checkout@v4

      - name: Prove exact successful Rescue deployment evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-rescue-live && mkdir -p /tmp/mchem-rescue-live
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOY_RUN_ID}" > /tmp/mchem-rescue-live/deploy-run.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOY_RUN_ID}/artifacts?per_page=100" > /tmp/mchem-rescue-live/deploy-artifacts.json
          python - <<'PY'
          import json,os
          r=json.load(open('/tmp/mchem-rescue-live/deploy-run.json'))
          checks={'success':r.get('conclusion')=='success','sha':r.get('head_sha')==os.environ['DEPLOY_HEAD_SHA'],'branch':r.get('head_branch')=='chemistry-national-rescue-growth-20260907','name':r.get('name')=='MUSITU Chemistry Rescue Guarded Deploy'}
          if not all(checks.values()):raise SystemExit('deploy proof failed '+json.dumps(checks,sort_keys=True))
          arts=json.load(open('/tmp/mchem-rescue-live/deploy-artifacts.json')).get('artifacts',[])
          m=[x for x in arts if str(x.get('id'))==os.environ['DEPLOY_ARTIFACT_ID']]
          if len(m)!=1 or m[0].get('expired') is not False or m[0].get('name')!='musitu-chemistry-rescue-guarded-deploy':raise SystemExit('deploy artifact identity failed')
          digest=str(m[0].get('digest') or '').removeprefix('sha256:')
          if digest!=os.environ['DEPLOY_ARTIFACT_SHA256']:raise SystemExit('deploy artifact digest failed '+digest)
          print('RESCUE_DEPLOY_EVIDENCE_PROOF=PASS')
          PY

      - name: Independently verify live Worker and public Rescue system
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,secrets,time,urllib.error,urllib.parse,urllib.request
          from pathlib import Path
          API='https://api.cloudflare.com/client/v4';AID='93f395f5121954671f92fffa453d6b61';WORKER='musitu-chemistry-commerce';BASE='https://payments.mftintelligence.com'
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Rescue-Independent-Live-Verify/1.0'}
          EXPECTED=os.environ['EXPECTED_WORKER_SHA'];APK=os.environ['APK_SHA256'];VITALS=os.environ['WEB_VITALS_SHA256'];KEY=os.environ['LICENCE_KEY_ID']
          def req(url,method='GET',headers=None,body=None,timeout=60):
              q=urllib.request.Request(url,method=method,headers=dict(headers or {}),data=body)
              try:
                  with urllib.request.urlopen(q,timeout=timeout) as r:return r.status,r.headers,r.read()
              except urllib.error.HTTPError as e:return e.code,e.headers,e.read()
          def public(path,accept='*/*',method='GET',headers=None,body=None):
              if method=='GET':path += ('&' if '?' in path else '?')+'__mchem_rescue_seal='+urllib.parse.quote(secrets.token_hex(10))
              h={'Accept':accept,'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache','User-Agent':'MUSITU-Rescue-Seal/'+secrets.token_hex(5)}
              if headers:h.update(headers)
              return req(BASE+path,method=method,headers=h,body=body)
          def extract(raw,ctype,needle):
              if 'multipart/' not in (ctype or '').lower():return raw
              msg=email.message_from_bytes((f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw);parts=[]
              for p in msg.walk():
                  if p.is_multipart():continue
                  d=p.get_payload(decode=True) or b''
                  if needle.encode() in d:parts.append(d)
              if len(parts)!=1:raise RuntimeError('module extraction mismatch')
              return parts[0]
          c,h,b=req(f'{API}/accounts/{AID}/workers/scripts/{WORKER}',headers=H)
          if c!=200:raise SystemExit('worker read HTTP '+str(c))
          source=extract(b,h.get('content-type',''),'MUSITU Chemistry Commerce');livehash=hashlib.sha256(source).hexdigest()
          if livehash!=EXPECTED:raise SystemExit('LIVE_WORKER_HASH_MISMATCH '+livehash)
          def strict(h):
              csp=h.get('content-security-policy') or ''
              return "style-src 'self'" in csp and "script-src 'self'" in csp and "connect-src 'self'" in csp and 'unsafe-inline' not in csp and 'unsafe-eval' not in csp and 'http://' not in csp and 'https://' not in csp and (h.get('referrer-policy') or '')=='no-referrer' and (h.get('x-frame-options') or '')=='DENY' and (h.get('x-content-type-options') or '')=='nosniff'
          routes=[
              ('/chemistry/','Know what you don’t know'),('/chemistry/plans','Choose access without guessing'),('/chemistry/privacy','Anonymous experience measurement'),('/chemistry/experience','Real-user experience evidence'),('/chemistry/checkout/start?plan=annual','Continue securely to Paynow'),('/chemistry/checkout/start?plan=school','Student seats'),('/chemistry/claim','Activate a paid seat'),('/chemistry/support','payment-status link created during checkout'),('/chemistry/verify','Verify this MUSITU release'),('/chemistry/releases','Release notes'),('/chemistry/terms','Premium access is granted only by a valid MUSITU-signed licence after verified settlement'),
              ('/chemistry/rescue?src=wa_student','MUSITU Chemistry Rescue 2026'),('/chemistry/rescue/teachers','Teacher Rescue Kit'),('/chemistry/rescue/schools','School Rescue Pack'),('/chemistry/rescue/ambassadors','Rescue Ambassador Kit')
          ]
          sweeps=[]
          for sweep_no in range(1,5):
              rays=[]
              for path,needle in routes:
                  c,h,b=public(path,'text/html');t=b.decode('utf-8','replace');ray=h.get('cf-ray') or ''
                  if c!=200 or needle not in t or not strict(h):raise SystemExit(f'independent route/security failed sweep={sweep_no} path={path}')
                  if ray:rays.append(ray)
              sweeps.append(rays);time.sleep(0.75)
          sources={}
          for src in ['wa_student','wa_teacher','school','creator','meta','tiktok','ambassador','direct']:
              c,h,b=public('/chemistry/rescue?src='+urllib.parse.quote(src),'text/html');t=b.decode('utf-8','replace')
              if c!=200 or f'data-rescue-source="{src}"' not in t or not strict(h):raise SystemExit('source class failed '+src)
              sources[src]=c
          hostile=[]
          for value in ['school<script>','student-123','utm_campaign=private','unknown']:
              c,h,b=public('/chemistry/rescue?src='+urllib.parse.quote(value),'text/html');t=b.decode('utf-8','replace')
              if c!=200 or 'data-rescue-source="direct"' not in t or value in t or not strict(h):raise SystemExit('hostile source failed')
              hostile.append(value)
          sc,_,sb=public('/chemistry/sitemap.xml','application/xml');st=sb.decode('utf-8','replace')
          if sc!=200 or any(x not in st for x in ['/chemistry/rescue','/chemistry/rescue/teachers','/chemistry/rescue/schools','/chemistry/rescue/ambassadors']):raise SystemExit('sitemap Rescue coverage failed')
          pc,_,pb=public('/chemistry/assets/rescue-print.css','text/css')
          if pc!=200 or b'@media print' not in pb:raise SystemExit('print asset failed')
          ec,_,eb=public('/chemistry/experience.json','application/json');experience=json.loads(eb or b'{}')
          if ec!=200 or experience.get('minimum_public_sample')!=100 or experience.get('status') not in ('insufficient_field_sample','field_core_web_vitals_available'):raise SystemExit('experience contract failed')
          vc,_,vb=public('/chemistry/assets/web-vitals-6.0.1.iife.js','application/javascript')
          if vc!=200 or len(vb)!=8987 or hashlib.sha256(vb).hexdigest()!=VITALS:raise SystemExit('web-vitals asset failed')
          fc,_,fb=public('/chemistry/assets/field-experience.js','application/javascript')
          if fc!=200 or b'/chemistry/telemetry/v1' not in fb or b'rescue_visit' not in fb or b'rescue_peer_start' not in fb or b'https://' in fb or b'http://' in fb:raise SystemExit('field client failed')
          neg=json.dumps({'events':[{'kind':'event','name':'rescue_visit','route':'rescue','viewport':'mobile','detail':'direct'}]}).encode();tc,th,_=public('/chemistry/telemetry/v1','application/json','POST',{'Origin':'https://invalid.musitu.example','Content-Type':'application/json'},neg)
          if tc!=400 or th.get('set-cookie'):raise SystemExit('telemetry privacy boundary failed')
          hc,_,hb=public('/chemistry/healthz','application/json');health=json.loads(hb or b'{}')
          if hc!=200 or health.get('ok') is not True or health.get('licence_key_id')!=KEY or health.get('raw_paynow_key_present') is not False or health.get('payment_authority_bound') is not True or health.get('transport_bound') is not True:raise SystemExit('health boundary failed')
          cc,_,cb=public('/chemistry/catalog','application/json');cat=json.loads(cb or b'{}');ids=[p.get('id') for p in cat.get('plans') or []]
          if cc!=200 or ids!=['term','annual','lifetime','family','tutor','school']:raise SystemExit('catalog changed')
          ac,ah,apk=public('/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk','application/vnd.android.package-archive');digest=hashlib.sha256(apk).hexdigest();cd=ah.get('content-disposition') or ''
          if ac!=200 or len(apk)!=5314934 or digest!=APK or 'MUSITU_Chemistry_Mastery_1.2.0.apk' not in cd:raise SystemExit('APK boundary failed')
          ev={'schema':'musitu.chemistry.rescue.independent_live_verify.v1','live_worker_sha256':livehash,'verified_route_count':len(routes),'independent_consecutive_sweeps':len(sweeps),'observed_cf_rays':[r for s in sweeps for r in s][-40:],'rescue_source_classes':list(sources),'hostile_source_collapses_to_direct':True,'experience_status':experience.get('status'),'public_minimum_metric_sample':experience.get('minimum_public_sample'),'licence_key_id':KEY,'payment_authority_bound':True,'transport_bound':True,'plan_ids':ids,'apk_sha256':digest,'apk_bytes':len(apk),'web_vitals_sha256':VITALS,'web_vitals_bytes':len(vb),'telemetry_cross_origin_rejected':True,'synthetic_valid_telemetry_written':False,'measurement_cookies_used':False,'persistent_tracking_identifier_used':False,'raw_event_rows_retained':False,'production_mutation':False,'field_inp_claimed':False,'real_money_settlement_observed':False,'real_money_settlement_claimed':False,'gate':'MUSITU_CHEMISTRY_RESCUE_INDEPENDENT_LIVE_VERIFY_PASS'}
          raw=(json.dumps(ev,indent=2,sort_keys=True)+'\n').encode();Path('/tmp/mchem-rescue-live/independent-live.json').write_bytes(raw);Path('/tmp/mchem-rescue-live/independent-live.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  independent-live.json\n');print(json.dumps(ev,sort_keys=True))
          PY

      - name: Seal read-only evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mchem-rescue-live
          sha256sum *.json *.sha256 > SHA256SUMS.txt
          cat independent-live.json

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-rescue-independent-live-verify
          path: /tmp/mchem-rescue-live
          retention-days: 90
          if-no-files-found: error
