name: MUSITU Chemistry SRG Finalization One-Shot Fix

on:
  push:
    branches:
      - chemistry-national-rescue-growth-20260907
    paths:
      - .github/workflows/chemistry-srg-finalization-one-shot-fix.yml

permissions:
  contents: write

concurrency:
  group: chemistry-srg-finalization-one-shot-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact pre-repair state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d589653fe4dceb12c7c8b71bbd6166194c3de28c"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/chemistry-srg-finalization-one-shot-fix.yml"
          test "$(git branch --show-current)" = "chemistry-national-rescue-growth-20260907"

      - name: Apply exact finalization patch
        shell: bash
        run: |
          set -euo pipefail
          python commerce/chemistry/patch_srg_finalization.py
          git diff --check

      - name: Reconstruct exact Chemistry worker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-srg-base /tmp/mchem-srg-source.zip
          mkdir -p /tmp/mchem-srg-base
          cat commerce/chemistry/source.b64.* | base64 -d > /tmp/mchem-srg-source.zip
          echo "5b2618499eed8dc90261bc4f8260246d5593534500dd2fb145f2d24b5c47754c  /tmp/mchem-srg-source.zip" | sha256sum -c -
          unzip -q /tmp/mchem-srg-source.zip -d /tmp/mchem-srg-base
          echo "848e1cec17ec580822d36e595196cda5978713849e8b45c5bc8dc7fcf9765db8  /tmp/mchem-srg-base/src/index.mjs" | sha256sum -c -
          cp /tmp/mchem-srg-base/src/index.mjs commerce/chemistry/index.base.mjs
          python commerce/chemistry/patch_storefront.py
          python commerce/chemistry/patch_rescue_growth.py | tee /tmp/mchem-srg-candidate-sha.txt
          node --check commerce/chemistry/index.storefront-v3.mjs

      - name: Run exact source and sealed commerce tests
        shell: bash
        run: |
          set -euo pipefail
          node --test commerce/chemistry/storefront/*.test.mjs
          rm -rf /tmp/mchem-srg-core
          mkdir -p /tmp/mchem-srg-core/src
          cp commerce/chemistry/index.storefront-v3.mjs /tmp/mchem-srg-core/src/index.mjs
          cp -a /tmp/mchem-srg-base/test /tmp/mchem-srg-core/
          cp /tmp/mchem-srg-base/package.json /tmp/mchem-srg-core/
          cd /tmp/mchem-srg-core
          npm test
          npm run check

      - name: Run real Chromium Scientific Response acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright axe-core
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          node commerce/chemistry/storefront/browser-smoke.mjs serve commerce/chemistry/index.storefront-v3.mjs >/tmp/mchem-srg-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/chemistry/install >/dev/null; then ready=true; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then cat /tmp/mchem-srg-server.log; exit 1; fi
            sleep 0.25
          done
          test "$ready" = true
          CHROME_PATH="$CHROME_PATH" INSTALL_MATRIX_ORIGIN="http://127.0.0.1:8787" node commerce/chemistry/storefront/install-browser-matrix.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Commit only verified source and regression changes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed
          printf '%s\n' \
            commerce/chemistry/storefront/app-shell.mjs \
            commerce/chemistry/storefront/install-browser-matrix.mjs \
            commerce/chemistry/storefront/scientific-response.test.mjs | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commerce/chemistry/storefront/app-shell.mjs commerce/chemistry/storefront/install-browser-matrix.mjs commerce/chemistry/storefront/scientific-response.test.mjs
          git commit -m "fix: freeze finalized Scientific Response Graph"
          git push origin HEAD:chemistry-national-rescue-growth-20260907
          git rev-parse HEAD
