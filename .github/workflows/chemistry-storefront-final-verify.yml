name: MUSITU Chemistry Storefront Final Read-Only Verify

on:
  push:
    branches: [chemistry-commerce-live-20260906]
    paths: ['.github/workflows/chemistry-storefront-final-verify.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live storefront and exact public APK without mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,urllib.request,urllib.error
          base='https://payments.mftintelligence.com';apk_path='/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk';expected='055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d'
          def get(path,accept='*/*'):
              q=urllib.request.Request(base+path,headers={'Accept':accept,'User-Agent':'MUSITU-Chemistry-Storefront-Seal-Verify/1.0'})
              try:
                  with urllib.request.urlopen(q,timeout=60) as r:return r.status,dict(r.headers),r.read()
              except urllib.error.HTTPError as e:return e.code,dict(e.headers),e.read()
          hc,hh,hb=get('/chemistry/healthz','application/json');h=json.loads(hb or b'{}')
          cc,ch,cb=get('/chemistry/catalog','application/json');c=json.loads(cb or b'{}')
          pc,ph,pb=get('/chemistry/','text/html');page=pb.decode('utf-8','replace')
          qc,qh,qb=get('/chemistry/checkout/start?plan=annual','text/html');qt=qb.decode('utf-8','replace')
          ac,ah,apk=get(apk_path,'application/vnd.android.package-archive');digest=hashlib.sha256(apk).hexdigest()
          ids=[p.get('id') for p in c.get('plans') or []]
          checks={
            'health':hc==200 and h.get('ok') is True and h.get('licence_key_id')=='chem-lic-2026-6783aa7535d1' and h.get('raw_paynow_key_present') is False and h.get('payment_authority_bound') is True and h.get('transport_bound') is True,
            'catalog':cc==200 and ids==['term','annual','lifetime','family','tutor','school'],
            'storefront':pc==200 and all(x in page for x in ['MUSITU Chemistry Mastery','Download free · Android','US$4.99','US$9.99','US$19.99','US$24.99','US$39','from US$3/student/year',expected]),
            'checkout':qc==200 and 'Continue securely to Paynow' in qt,
            'download':ac==200 and len(apk)==5314934 and digest==expected and 'attachment' in ((ah.get('Content-Disposition') or ah.get('content-disposition') or '').lower())
          }
          if not all(checks.values()):raise SystemExit('FINAL_VERIFY_FAIL '+json.dumps(checks,sort_keys=True))
          print(json.dumps({'gate':'MUSITU_CHEMISTRY_STOREFRONT_FINAL_VERIFY_PASS','checks':checks,'storefront_http':pc,'checkout_http':qc,'download_http':ac,'download_bytes':len(apk),'apk_sha256':digest,'licence_key_id':h.get('licence_key_id'),'production_mutation':False},sort_keys=True))
          PY
