name: MUSITU Chemistry Storefront One-Shot Deploy

on:
  push:
    branches: [chemistry-commerce-live-20260906]
    paths: ['.github/workflows/chemistry-storefront-one-shot.yml']

permissions:
  contents: read

concurrency:
  group: musitu-chemistry-storefront-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify storefront Worker source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-source /tmp/mchem-source.zip /tmp/mchem-storefront
          mkdir -p /tmp/mchem-source /tmp/mchem-storefront
          cat commerce/chemistry/source.b64.* | base64 -d > /tmp/mchem-source.zip
          echo "5b2618499eed8dc90261bc4f8260246d5593534500dd2fb145f2d24b5c47754c  /tmp/mchem-source.zip" | sha256sum -c -
          unzip -q /tmp/mchem-source.zip -d /tmp/mchem-source
          echo "848e1cec17ec580822d36e595196cda5978713849e8b45c5bc8dc7fcf9765db8  /tmp/mchem-source/src/index.mjs" | sha256sum -c -
          cp /tmp/mchem-source/src/index.mjs commerce/chemistry/index.base.mjs
          python commerce/chemistry/patch_storefront.py
          echo "8b63862f7528d7e4144f8706e48c7ccd833a4da47659d3df79266f5ce024468b  commerce/chemistry/index.storefront.mjs" | sha256sum -c -
          node --check commerce/chemistry/index.storefront.mjs
          cp commerce/chemistry/index.storefront.mjs /tmp/mchem-storefront/index.mjs
          rm -f commerce/chemistry/index.base.mjs commerce/chemistry/index.storefront.mjs
          cp -a /tmp/mchem-source/test /tmp/mchem-storefront/
          cp /tmp/mchem-source/package.json /tmp/mchem-storefront/
          cd /tmp/mchem-storefront
          npm test

      - name: Fetch exact verified APK for static publishing
        shell: bash
        env:
          APK_TRANSFER_URL: https://uc05ff0a74b5dd70b3a01ae6cf8c.dl.dropboxusercontent.com/cd/0/get/DHqEKBOsYkWuSOu7eZLHQ7EHmvp5VxCcu4vXrLBx7PVO45ftC9c-4NX9XtDpUMMBoWMyHX3pUEd0h6Wyp2kn8pEjZbM5kZfnWZDRrEDd2Ri-BZzlbiiNda7qz4jPIxAnfax54vLm925coSKByV8uD-4eTKwPG0_V60f6PkBM6iiZ6g/file?c_luid=2441df78
        run: |
          set -euo pipefail
          mkdir -p /tmp/mchem-assets/public/chemistry/download /tmp/mchem-assets/src
          curl --fail --location --silent --show-error --max-time 180 "$APK_TRANSFER_URL" -o /tmp/mchem-assets/public/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk
          echo "055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d  /tmp/mchem-assets/public/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk" | sha256sum -c -
          test "$(stat -c %s /tmp/mchem-assets/public/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk)" = "5314934"
          cat > /tmp/mchem-assets/src/index.js <<'JS'
          export default {async fetch(request,env){const response=await env.ASSETS.fetch(request);if(!response.ok)return response;const h=new Headers(response.headers);h.set('Content-Type','application/vnd.android.package-archive');h.set('Content-Disposition','attachment; filename="MUSITU_Chemistry_Mastery_1.2.0.apk"');h.set('X-Content-Type-Options','nosniff');h.set('Cache-Control','public, max-age=86400, immutable');h.set('X-MUSITU-SHA256','055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d');return new Response(response.body,{status:response.status,headers:h})}};
          JS
          cat > /tmp/mchem-assets/wrangler.jsonc <<'JSON'
          {
            "name": "musitu-chemistry-downloads",
            "account_id": "93f395f5121954671f92fffa453d6b61",
            "compatibility_date": "2026-09-06",
            "workers_dev": false,
            "main": "src/index.js",
            "routes": [{"pattern":"payments.mftintelligence.com/chemistry/download*","zone_id":"5b56528f03948ff5917a5e0cd9f7109e"}],
            "assets": {"directory":"./public","binding":"ASSETS","run_worker_first":true}
          }
          JSON

      - name: Publish immutable APK static asset route
        shell: bash
        working-directory: /tmp/mchem-assets
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Update storefront content while preserving live bindings and secrets
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,secrets,urllib.error,urllib.parse,urllib.request,time
          from pathlib import Path
          API='https://api.cloudflare.com/client/v4';AID='93f395f5121954671f92fffa453d6b61';WORKER='musitu-chemistry-commerce';BASE='https://payments.mftintelligence.com'
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'User-Agent':'MUSITU-Chemistry-Storefront-Deploy/1.0'}
          EXPECTED_OLD='848e1cec17ec580822d36e595196cda5978713849e8b45c5bc8dc7fcf9765db8';EXPECTED_NEW='8b63862f7528d7e4144f8706e48c7ccd833a4da47659d3df79266f5ce024468b';KEY_ID='chem-lic-2026-6783aa7535d1'
          new=Path('/tmp/mchem-storefront/index.mjs').read_bytes()
          if hashlib.sha256(new).hexdigest()!=EXPECTED_NEW:raise SystemExit('patched source hash mismatch')
          def req(url,method='GET',headers=None,body=None,timeout=60):
              q=urllib.request.Request(url,method=method,headers=dict(headers or {}),data=body)
              try:
                  with urllib.request.urlopen(q,timeout=timeout) as r:return r.status,r.headers,r.read()
              except urllib.error.HTTPError as e:return e.code,e.headers,e.read()
          def extract(raw,ctype,needle):
              if 'multipart/' not in (ctype or '').lower():return raw
              msg=email.message_from_bytes((f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw);parts=[]
              for p in msg.walk():
                  if p.is_multipart():continue
                  d=p.get_payload(decode=True) or b''
                  if needle.encode() in d:parts.append(d)
              if len(parts)!=1:raise RuntimeError('module extraction mismatch')
              return parts[0]
          def read_worker():
              c,h,b=req(f'{API}/accounts/{AID}/workers/scripts/{WORKER}',headers=H)
              if c!=200:raise RuntimeError(f'worker read HTTP {c}')
              return extract(b,h.get('content-type',''),'MUSITU Chemistry Commerce')
          def upload_content(source):
              boundary='----MUSITU'+secrets.token_hex(16);meta=json.dumps({'main_module':'index.mjs'},separators=(',',':'))
              body=(f'--{boundary}\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n{meta}\r\n--{boundary}\r\nContent-Disposition: form-data; name="index.mjs"; filename="index.mjs"\r\nContent-Type: application/javascript+module\r\n\r\n').encode()+source+f'\r\n--{boundary}--\r\n'.encode()
              h=dict(H);h['Content-Type']='multipart/form-data; boundary='+boundary
              c,_,b=req(f'{API}/accounts/{AID}/workers/scripts/{WORKER}/content','PUT',h,body)
              if not 200<=c<300:raise RuntimeError(f'content upload HTTP {c}: '+b[:300].decode('utf-8','ignore'))
          original=read_worker();oldhash=hashlib.sha256(original).hexdigest()
          if oldhash!=EXPECTED_OLD:raise SystemExit('live Worker source drift: '+oldhash)
          upload_content(new)
          try:
              for _ in range(20):
                  c,h,b=req(BASE+'/chemistry/healthz',headers={'Accept':'application/json','User-Agent':'MUSITU-Storefront-Verify/1.0'})
                  try:o=json.loads(b or b'{}')
                  except:o={}
                  if c==200 and o.get('ok') is True:break
                  time.sleep(1.5)
              else:raise RuntimeError('health readiness timeout')
              if o.get('licence_key_id')!=KEY_ID or o.get('raw_paynow_key_present') is not False or o.get('payment_authority_bound') is not True or o.get('transport_bound') is not True:raise RuntimeError('binding/key preservation failed')
              c,_,page=req(BASE+'/chemistry/',headers={'Accept':'text/html'});text=page.decode('utf-8','replace')
              required=['MUSITU Chemistry Mastery','Download free · Android','US$4.99','US$9.99','US$19.99','US$24.99','US$39','from US$3/student/year',EXPECTED_NEW[:8],'/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk']
              required.remove(EXPECTED_NEW[:8]);required.append('055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d')
              if c!=200 or any(x not in text for x in required):raise RuntimeError('storefront marker verification failed')
              live=read_worker();livehash=hashlib.sha256(live).hexdigest()
              if livehash!=EXPECTED_NEW:raise RuntimeError('live Worker content hash mismatch '+livehash)
          except Exception:
              upload_content(original)
              raise
          Path('/tmp/storefront-worker-update.json').write_text(json.dumps({'schema':'musitu.chemistry.storefront.worker_update.v1','old_source_sha256':oldhash,'new_source_sha256':EXPECTED_NEW,'licence_key_id':KEY_ID,'bindings_preserved':True,'gate':'MUSITU_CHEMISTRY_STOREFRONT_WORKER_PASS'},indent=2,sort_keys=True)+'\n')
          PY

      - name: Verify live storefront, checkout, and exact APK bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,urllib.request,urllib.error
          base='https://payments.mftintelligence.com';apk_path='/chemistry/download/MUSITU_Chemistry_Mastery_1.2.0.apk';expected='055b63f271c18faab540985faefb970f472ea55ba9cb3495db459797902b790d'
          def get(path,accept='*/*'):
              q=urllib.request.Request(base+path,headers={'Accept':accept,'User-Agent':'MUSITU-Chemistry-Storefront-Final-Verify/1.0'})
              try:
                  with urllib.request.urlopen(q,timeout=60) as r:return r.status,dict(r.headers),r.read()
              except urllib.error.HTTPError as e:return e.code,dict(e.headers),e.read()
          hc,hh,hb=get('/chemistry/healthz','application/json');h=json.loads(hb or b'{}')
          cc,ch,cb=get('/chemistry/catalog','application/json');c=json.loads(cb or b'{}')
          pc,ph,pb=get('/chemistry/','text/html');page=pb.decode('utf-8','replace')
          ac,ah,apk=get(apk_path,'application/vnd.android.package-archive');digest=hashlib.sha256(apk).hexdigest()
          qc,qh,qb=get('/chemistry/checkout/start?plan=annual','text/html');qt=qb.decode('utf-8','replace')
          ids=[p.get('id') for p in c.get('plans') or []]
          if hc!=200 or h.get('ok') is not True or h.get('licence_key_id')!='chem-lic-2026-6783aa7535d1':raise SystemExit('health/key check failed')
          if cc!=200 or ids!=['term','annual','lifetime','family','tutor','school']:raise SystemExit('catalog check failed')
          if pc!=200 or 'MUSITU Chemistry Mastery' not in page or 'Download free · Android' not in page or expected not in page:raise SystemExit('storefront check failed')
          if qc!=200 or 'Continue securely to Paynow' not in qt:raise SystemExit('checkout page check failed')
          if ac!=200 or len(apk)!=5314934 or digest!=expected:raise SystemExit('APK byte verification failed')
          cd=(ah.get('Content-Disposition') or ah.get('content-disposition') or '')
          if 'attachment' not in cd.lower():raise SystemExit('APK content-disposition missing')
          ev={'schema':'musitu.chemistry.storefront.live.v1','storefront_http':pc,'health_http':hc,'catalog_http':cc,'checkout_annual_http':qc,'download_http':ac,'download_bytes':len(apk),'apk_sha256':digest,'licence_key_id':h.get('licence_key_id'),'plan_ids':ids,'download_content_disposition':cd,'gate':'MUSITU_CHEMISTRY_STOREFRONT_LIVE_PASS'}
          raw=(json.dumps(ev,indent=2,sort_keys=True)+'\n').encode();open('/tmp/storefront-live.json','wb').write(raw);open('/tmp/storefront-live.sha256','w').write(hashlib.sha256(raw).hexdigest()+'  storefront-live.json\n')
          print(json.dumps(ev,sort_keys=True))
          PY

      - name: Collect evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storefront-evidence
          cp /tmp/storefront-worker-update.json storefront-evidence/
          cp /tmp/storefront-live.json storefront-evidence/
          cp /tmp/storefront-live.sha256 storefront-evidence/
          sha256sum storefront-evidence/storefront-worker-update.json storefront-evidence/storefront-live.json > storefront-evidence/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-storefront-live
          path: storefront-evidence
          retention-days: 90
          if-no-files-found: error
