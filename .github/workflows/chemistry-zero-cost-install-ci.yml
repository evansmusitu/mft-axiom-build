name: MUSITU Chemistry Zero-Cost Install CI

on:
  push:
    branches: [chemistry-national-rescue-growth-20260907]
    paths:
      - 'commerce/chemistry/storefront/install.mjs'
      - 'commerce/chemistry/storefront/install-handoff.test.mjs'
      - 'commerce/chemistry/storefront/install-worker.test.mjs'
      - 'commerce/chemistry/storefront/install-browser-matrix.mjs'
      - 'commerce/chemistry/storefront/app-shell.mjs'
      - 'commerce/chemistry/storefront/app-shell.test.mjs'
      - 'commerce/chemistry/storefront/app-shell-worker.test.mjs'
      - 'commerce/chemistry/storefront/rescue-discovery.mjs'
      - 'commerce/chemistry/storefront/rescue-render.mjs'
      - 'commerce/chemistry/storefront/rescue-worker.test.mjs'
      - 'commerce/chemistry/storefront/field-experience.mjs'
      - 'commerce/chemistry/storefront/field-experience.test.mjs'
      - 'commerce/chemistry/patch_rescue_growth.py'
      - '.github/workflows/chemistry-zero-cost-install-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact Chemistry worker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-install-base /tmp/mchem-install-source.zip /tmp/mchem-install-evidence
          mkdir -p /tmp/mchem-install-base /tmp/mchem-install-evidence
          cat commerce/chemistry/source.b64.* | base64 -d > /tmp/mchem-install-source.zip
          echo "5b2618499eed8dc90261bc4f8260246d5593534500dd2fb145f2d24b5c47754c  /tmp/mchem-install-source.zip" | sha256sum -c -
          unzip -q /tmp/mchem-install-source.zip -d /tmp/mchem-install-base
          echo "848e1cec17ec580822d36e595196cda5978713849e8b45c5bc8dc7fcf9765db8  /tmp/mchem-install-base/src/index.mjs" | sha256sum -c -
          cp /tmp/mchem-install-base/src/index.mjs commerce/chemistry/index.base.mjs
          python commerce/chemistry/patch_storefront.py
          python commerce/chemistry/patch_rescue_growth.py | tee /tmp/mchem-install-evidence/candidate-sha.txt
          node --check commerce/chemistry/index.storefront-v3.mjs

      - name: Run storefront, privacy, install and app-shell contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --test commerce/chemistry/storefront/*.test.mjs | tee /tmp/mchem-install-evidence/storefront-tests.txt
          grep -Fq "'/chemistry/install'" commerce/chemistry/index.storefront-v3.mjs
          grep -Fq "'/chemistry/app'" commerce/chemistry/index.storefront-v3.mjs
          grep -Fq "/chemistry/install/diagnostics" commerce/chemistry/index.storefront-v3.mjs
          grep -Fq "/chemistry/assets/install-handoff.js" commerce/chemistry/index.storefront-v3.mjs
          grep -Fq "/chemistry/assets/install-concierge.css" commerce/chemistry/index.storefront-v3.mjs
          grep -Fq "/chemistry/assets/app-bridge.js" commerce/chemistry/index.storefront-v3.mjs
          grep -Fq "/chemistry/assets/app-shell.js" commerce/chemistry/index.storefront-v3.mjs
          grep -Fq "/chemistry/assets/app-shell.css" commerce/chemistry/index.storefront-v3.mjs
          grep -Fq "Your Chemistry workspace" commerce/chemistry/index.storefront-v3.mjs
          grep -Fq "/chemistry/sw.js" commerce/chemistry/index.storefront-v3.mjs
          grep -Fq "Install / Start Free" commerce/chemistry/index.storefront-v3.mjs
          grep -Fq "MUSITU_Chemistry_Mastery_1.2.0.apk" commerce/chemistry/index.storefront-v3.mjs

      - name: Prove existing core commerce regressions stay green
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mchem-install-core
          mkdir -p /tmp/mchem-install-core/src
          cp commerce/chemistry/index.storefront-v3.mjs /tmp/mchem-install-core/src/index.mjs
          cp -a /tmp/mchem-install-base/test /tmp/mchem-install-core/
          cp /tmp/mchem-install-base/package.json /tmp/mchem-install-core/
          cd /tmp/mchem-install-core
          npm test | tee /tmp/mchem-install-evidence/core-tests.txt
          npm run check | tee /tmp/mchem-install-evidence/core-check.txt

      - name: Install browser acceptance tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright axe-core
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          node -e "console.log('playwright='+require('playwright/package.json').version);console.log('axe-core='+require('axe-core/package.json').version)" | tee /tmp/mchem-install-evidence/browser-tooling.txt

      - name: Run adaptive install browser-emulation acceptance matrix
        shell: bash
        env:
          WORKER_PATH: ${{ github.workspace }}/commerce/chemistry/index.storefront-v3.mjs
          INSTALL_MATRIX_ORIGIN: http://127.0.0.1:8787
        run: |
          set -euo pipefail
          node commerce/chemistry/storefront/browser-smoke.mjs serve "$WORKER_PATH" >/tmp/mchem-install-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/chemistry/install >/dev/null; then ready=true; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then cat /tmp/mchem-install-server.log; exit 1; fi
            sleep 0.25
          done
          if [[ "$ready" != true ]]; then cat /tmp/mchem-install-server.log; exit 1; fi
          node commerce/chemistry/storefront/install-browser-matrix.mjs | tee /tmp/mchem-install-evidence/browser-matrix.json
          curl -fsS http://127.0.0.1:8787/chemistry/app | grep -Fq 'Your Chemistry workspace'
          node - <<'NODE'
          const r=await fetch('http://127.0.0.1:8787/chemistry/manifest.webmanifest?v=2');
          if(!r.ok) throw new Error('manifest HTTP '+r.status);
          const m=await r.json();
          if(m.id!=='/chemistry/app'||m.name!=='MUSITU Chemistry'||m.short_name!=='MUSITU Chemistry'||m.start_url!=='/chemistry/app'||m.scope!=='/chemistry/'||m.display!=='standalone'||/Rescue/i.test(m.description||'')) throw new Error('dedicated Chemistry manifest contract mismatch '+JSON.stringify(m));
          console.log('DEDICATED_CHEMISTRY_APP_MANIFEST_CONTRACT=PASS');
          NODE
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Seal candidate identity
        shell: bash
        run: |
          set -euo pipefail
          sha256sum commerce/chemistry/index.storefront-v3.mjs | tee /tmp/mchem-install-evidence/candidate.sha256
          cat > /tmp/mchem-install-evidence/acceptance-boundary.json <<'JSON'
          {
            "schema":"musitu.chemistry.install_acceptance_boundary.v3",
            "universal_install_url":"https://payments.mftintelligence.com/chemistry/install",
            "installed_app_url":"https://payments.mftintelligence.com/chemistry/app",
            "platform_detection":["iPhone/iPad Safari","iPhone/iPad non-Safari","iOS in-app","Android Chrome","Samsung Internet","Android in-app/WebView","desktop Chrome/Edge","already-installed"],
            "installed_launch_contract":{"manifest_identity_migrated":true,"manifest_id":"/chemistry/app","manifest_name":"MUSITU Chemistry","start_url":"/chemistry/app","manifest_versioned_url":"/chemistry/manifest.webmanifest?v=2","service_worker_cache":"musitu-chemistry-install-v8","legacy_rescue_standalone_bridge":true,"public_site_chrome_removed_from_app_shell":true},
            "privacy_safe_install_events":["install_view","install_prompt_available","install_started","install_completed","install_fallback","install_help_needed"],
            "offline_shell_tested":true,
            "payment_routes_cached":false,
            "physical_device_new_install_retest":false,
            "note":"CI proves the dedicated MUSITU Chemistry PWA identity and browser install/app-shell contracts. A pre-migration Rescue PWA remains a legacy installation and physical fresh-install certification remains separate until retested on hardware."
          }
          JSON
          {
            echo '## MUSITU dedicated Chemistry installer candidate'
            echo
            echo '```'
            cat /tmp/mchem-install-evidence/candidate.sha256
            echo '```'
            echo '- One universal install URL.'
            echo '- Dedicated PWA id /chemistry/app and name MUSITU Chemistry.'
            echo '- start_url /chemistry/app.'
            echo '- Versioned manifest discovery /chemistry/manifest.webmanifest?v=2.'
            echo '- Service-worker cache migrated to musitu-chemistry-install-v8.'
            echo '- Legacy Rescue PWA identity is not treated as the new app identity.'
            echo '- Public Rescue campaign remains available separately.'
            echo '- Payment and entitlement routes remain network/server authoritative.'
            echo '- Physical fresh-install identity remains explicitly unclaimed until hardware retest.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: musitu-chemistry-dedicated-app-installer-candidate
          path: |
            /tmp/mchem-install-evidence
            commerce/chemistry/index.storefront-v3.mjs
            commerce/chemistry/storefront/install.mjs
            commerce/chemistry/storefront/install-handoff.test.mjs
            commerce/chemistry/storefront/install-worker.test.mjs
            commerce/chemistry/storefront/install-browser-matrix.mjs
            commerce/chemistry/storefront/app-shell.mjs
            commerce/chemistry/storefront/app-shell.test.mjs
            commerce/chemistry/storefront/app-shell-worker.test.mjs
            commerce/chemistry/storefront/field-experience.mjs
            commerce/chemistry/storefront/field-experience.test.mjs
          if-no-files-found: error
          retention-days: 30
