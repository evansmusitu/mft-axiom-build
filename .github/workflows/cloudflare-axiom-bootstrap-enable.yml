name: MUSITU Axiom Edge Bootstrap Enable — QUARANTINED BY AR-02

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed at the AR-02 public-exposure boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'AR-02 QUARANTINE: the historical bootstrap workers.dev enable path is disabled.'
          echo 'No Cloudflare credentials are loaded, no public route is enabled, and no provider mutation is permitted.'
          echo 'The prior implementation remains preserved in Git history before the AR-02 release-surface recovery branch.'
          echo 'Any future public exposure requires an access-protected design, least-privilege operation-scoped credentials, independent verification, and explicit governed release authority.'
          exit 1
