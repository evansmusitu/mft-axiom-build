name: MUSITU Axiom Claude Publication Domain Activation — Authorized

on:
  push:
    branches:
      - "distribution/claude-remote-mcp-20261004"
    paths:
      - ".github/workflows/cloudflare-axiom-stage-domain.yml"

permissions:
  contents: read

concurrency:
  group: musitu-axiom-claude-publication-domain
  cancel-in-progress: false

jobs:
  attach-claude-publication-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLAUDE_PUBLICATION_CONFIRM: ATTACH_CLAUDE_PUBLICATION_DOMAINS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify authorized publication contract before Cloudflare writes
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=. python -m pytest -q \
            frontier_v5/tests/test_claude_publication_domain_contract.py \
            frontier_v5/tests/test_distribution_oauth_policy.py \
            frontier_v5/tests/test_claude_worker_isolation_contract.py

      - name: Attach only Claude publication Workers and domains
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          GITHUB_EVENT_NAME=workflow_dispatch \
          PYTHONPATH=. python frontier_v5/scripts/deploy_claude_publication_domains.py

      - name: Upload Claude publication evidence
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-claude-publication-domain-evidence
          path: |
            musitu-axiom-claude-publication-domain-evidence.json
            musitu-axiom-claude-publication-domain-evidence.sha256
          retention-days: 30
