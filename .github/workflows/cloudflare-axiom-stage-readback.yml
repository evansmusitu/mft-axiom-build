name: MFT Axiom Staging Readback

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloudflare-axiom-stage-readback.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API: https://api.cloudflare.com/client/v4
      HOSTNAME: axiom-stage.mftintelligence.com
      RULE_REF: mft_axiom_stage_machine_transport
    steps:
      - name: Read back exact configuration rule
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request,urllib.parse
          base=os.environ['CF_API']; h={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY']}
          def get(p):
            with urllib.request.urlopen(urllib.request.Request(base+p,headers=h),timeout=30) as r:return json.load(r)
          z=get('/zones?name='+urllib.parse.quote('mftintelligence.com')+'&status=active'); rows=z.get('result') or []
          if not z.get('success') or len(rows)!=1: raise SystemExit('zone invariant failed')
          zid=rows[0]['id']; rs=get(f'/zones/{zid}/rulesets'); m=[x for x in (rs.get('result') or []) if x.get('phase')=='http_config_settings' and x.get('kind')=='zone']
          if len(m)!=1: raise SystemExit('configuration ruleset invariant failed')
          d=get(f'/zones/{zid}/rulesets/{m[0]["id"]}'); rules=(d.get('result') or {}).get('rules') or []
          found=[r for r in rules if r.get('ref')==os.environ['RULE_REF']]
          if len(found)!=1: raise SystemExit(f'expected one staging rule, observed {len(found)}')
          r=found[0]; ap=r.get('action_parameters') or {}; exp='http.host eq "axiom-stage.mftintelligence.com"'
          if r.get('action')!='set_config' or r.get('expression')!=exp or ap.get('security_level')!='essentially_off' or ap.get('bic') is not False or r.get('enabled') is False: raise SystemExit('staging rule contract mismatch')
          out={'schema':'mft.axiom.cloudflare.stage_config_readback.v1','id':r.get('id'),'ref':r.get('ref'),'action':r.get('action'),'action_parameters':ap,'expression':r.get('expression'),'enabled':r.get('enabled')}
          json.dump(out,open('config-readback.json','w'),indent=2,sort_keys=True)
          print(json.dumps({'config_readback_pass':True,'rule_id_present':bool(r.get('id'))}))
          PY
      - name: Verify challenge is removed and bootstrap remains fail-closed
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time,urllib.request,urllib.error
          url='https://axiom-stage.mftintelligence.com/health'; last=''
          for _ in range(12):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'MFT-Axiom-Deployment-Verifier/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=20) as r:
                h=json.load(r); code=r.status; mitigated=r.headers.get('cf-mitigated')
              expected={'ok':True,'product':'MFT Axiom','build':'MFT-AXIOM-EDGE-BOOTSTRAP-20260904','deployment_state':'EDGE_BOOTSTRAP_ONLY','production_compute_active':False,'tool_count':0,'wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED'}
              bad=[k for k,v in expected.items() if h.get(k)!=v]
              if code==200 and not mitigated and not bad:
                json.dump({'http_status':code,'cf_mitigated':mitigated,'health':h,'url':url},open('health-readback.json','w'),indent=2,sort_keys=True)
                print(json.dumps({'health_pass':True,'http_status':200,'cf_mitigated':None,'url':url})); raise SystemExit(0)
              last='mismatch '+','.join(bad)
            except urllib.error.HTTPError as e:
              last=f'HTTP {e.code}; cf-mitigated={e.headers.get("cf-mitigated")}'
            except Exception as e:last=f'{type(e).__name__}: {e}'
            time.sleep(5)
          raise SystemExit('staging health not reachable after bounded wait: '+last)
          PY
      - name: Verify compute routes remain disabled
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.request,urllib.error
          url='https://axiom-stage.mftintelligence.com/v1/compute'
          req=urllib.request.Request(url,method='GET',headers={'Accept':'application/json','User-Agent':'MFT-Axiom-Deployment-Verifier/1.0'})
          try:
            urllib.request.urlopen(req,timeout=20); raise SystemExit('compute route unexpectedly active')
          except urllib.error.HTTPError as e:
            body=json.loads(e.read().decode())
            if e.code!=503 or body.get('error')!='AXIOM_PRODUCTION_COMPUTE_NOT_ACTIVATED': raise SystemExit(f'fail-closed compute invariant failed HTTP {e.code}')
          print(json.dumps({'compute_fail_closed':True,'status':503}))
          PY
      - name: Seal and upload evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          out={'schema':'mft.axiom.cloudflare.stage_readback.v1','config':json.load(open('config-readback.json')),'health':json.load(open('health-readback.json')),'production_compute_active':False,'production_hostname_bound':False,'wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED'}
          json.dump(out,open('axiom-stage-readback.json','w'),indent=2,sort_keys=True)
          PY
          sha256sum axiom-stage-readback.json > axiom-stage-readback.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mft-axiom-stage-readback
          path: |
            axiom-stage-readback.json
            axiom-stage-readback.sha256
          retention-days: 7
          if-no-files-found: error
