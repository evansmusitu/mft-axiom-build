name: MFT Axiom Staging Security Exception

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloudflare-axiom-stage-security-exception.yml'

permissions:
  contents: read

jobs:
  configure-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API: https://api.cloudflare.com/client/v4
      HOSTNAME: axiom-stage.mftintelligence.com
      RULE_REF: mft_axiom_stage_machine_transport
    steps:
      - name: Resolve zone and configuration ruleset
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request,urllib.parse
          base=os.environ['CF_API']; h={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY']}
          def get(path):
            req=urllib.request.Request(base+path,headers=h)
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          z=get('/zones?name='+urllib.parse.quote('mftintelligence.com')+'&status=active'); rows=z.get('result') or []
          if not z.get('success') or len(rows)!=1: raise SystemExit('zone invariant failed')
          zid=rows[0]['id']; open('zone_id.txt','w').write(zid)
          rs=get(f'/zones/{zid}/rulesets'); matches=[x for x in (rs.get('result') or []) if x.get('phase')=='http_config_settings' and x.get('kind')=='zone']
          if len(matches)!=1: raise SystemExit(f'expected exactly one zone http_config_settings ruleset, got {len(matches)}')
          rid=matches[0]['id']; open('ruleset_id.txt','w').write(rid)
          d=get(f'/zones/{zid}/rulesets/{rid}'); rules=(d.get('result') or {}).get('rules') or []
          existing=[r for r in rules if r.get('ref')==os.environ['RULE_REF']]
          if len(existing)>1: raise SystemExit('duplicate Axiom staging configuration rules')
          if existing:
            r=existing[0]
            expected_expr='http.host eq "axiom-stage.mftintelligence.com"'
            ap=r.get('action_parameters') or {}
            if r.get('action')!='set_config' or r.get('expression')!=expected_expr or ap.get('security_level')!='essentially_off' or ap.get('bic') is not False or r.get('enabled') is False:
              raise SystemExit('existing Axiom staging rule differs from required fail-closed contract')
            open('existing_rule_id.txt','w').write(r.get('id') or '')
          else: open('existing_rule_id.txt','w').write('')
          print(json.dumps({'ruleset_found':True,'existing_expected_rule':bool(existing)}))
          PY

      - name: Add narrowly-scoped staging machine-transport configuration rule if absent
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -s existing_rule_id.txt ]; then echo 'Expected rule already exists; no write needed.'; exit 0; fi
          ZONE_ID="$(cat zone_id.txt)"; RULESET_ID="$(cat ruleset_id.txt)"
          cat > rule.json <<'JSON'
          {
            "action": "set_config",
            "action_parameters": {"security_level": "essentially_off", "bic": false},
            "expression": "http.host eq \"axiom-stage.mftintelligence.com\"",
            "description": "MFT Axiom staging machine transport: disable Under Attack and Browser Integrity Check only on isolated staging hostname",
            "enabled": true,
            "ref": "mft_axiom_stage_machine_transport"
          }
          JSON
          HTTP=$(curl -sS -o rule-write.json -w '%{http_code}' -X POST \
            -H "X-Auth-Email: $CLOUDFLARE_EMAIL" -H "X-Auth-Key: $CLOUDFLARE_GLOBAL_API_KEY" \
            -H 'Content-Type: application/json' --data-binary @rule.json \
            "$CF_API/zones/$ZONE_ID/rulesets/$RULESET_ID/rules")
          python - "$HTTP" <<'PY'
          import json,sys
          code=int(sys.argv[1]); b=json.load(open('rule-write.json'))
          if code not in (200,201) or not b.get('success'): raise SystemExit(f'configuration rule write failed HTTP {code}: {b.get("errors")}')
          r=b.get('result') or {}
          if r.get('ref')!='mft_axiom_stage_machine_transport' or r.get('action')!='set_config': raise SystemExit('rule write response invariant failed')
          open('new_rule_id.txt','w').write(r.get('id') or '')
          print(json.dumps({'rule_created':True,'rule_id_present':bool(r.get('id'))}))
          PY

      - name: Read back exact security exception
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          zid=open('zone_id.txt').read().strip(); rid=open('ruleset_id.txt').read().strip()
          h={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY']}
          req=urllib.request.Request(os.environ['CF_API']+f'/zones/{zid}/rulesets/{rid}',headers=h)
          with urllib.request.urlopen(req,timeout=30) as r:b=json.load(r)
          matches=[x for x in ((b.get('result') or {}).get('rules') or []) if x.get('ref')==os.environ['RULE_REF']]
          if len(matches)!=1: raise SystemExit('readback expected exactly one Axiom staging rule')
          r=matches[0]; ap=r.get('action_parameters') or {}; exp='http.host eq "axiom-stage.mftintelligence.com"'
          if r.get('action')!='set_config' or r.get('expression')!=exp or ap.get('security_level')!='essentially_off' or ap.get('bic') is not False or r.get('enabled') is False: raise SystemExit('security exception readback mismatch')
          out={'schema':'mft.axiom.cloudflare.stage_security_exception.v1','rule_id':r.get('id'),'ref':r.get('ref'),'expression':r.get('expression'),'action':r.get('action'),'action_parameters':ap,'enabled':r.get('enabled'),'scope':'axiom-stage.mftintelligence.com only'}
          json.dump(out,open('stage-security-exception.json','w'),indent=2,sort_keys=True)
          print(json.dumps({'readback_pass':True,'rule_id_present':bool(r.get('id'))}))
          PY

      - name: Verify staging endpoint reaches Axiom Worker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time,urllib.request
          url='https://axiom-stage.mftintelligence.com/health'; last=''
          for _ in range(12):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'MFT-Axiom-Deployment-Verifier/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=20) as r:h=json.load(r)
              expected={'ok':True,'product':'MFT Axiom','build':'MFT-AXIOM-EDGE-BOOTSTRAP-20260904','deployment_state':'EDGE_BOOTSTRAP_ONLY','production_compute_active':False,'tool_count':0,'wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED'}
              bad=[k for k,v in expected.items() if h.get(k)!=v]
              if not bad:
                json.dump(h,open('stage-health.json','w'),indent=2,sort_keys=True); print(json.dumps({'worker_reached':True,'url':url})); raise SystemExit(0)
              last='health mismatch '+','.join(bad)
            except Exception as e:last=f'{type(e).__name__}: {e}'
            time.sleep(5)
          raise SystemExit('staging Worker verification failed: '+last)
          PY

      - name: Seal evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          out={'schema':'mft.axiom.cloudflare.stage_security_activation.v1','security_exception':json.load(open('stage-security-exception.json')),'health':json.load(open('stage-health.json')),'production_compute_active':False,'production_hostname_bound':False,'wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED'}
          json.dump(out,open('axiom-stage-security-activation.json','w'),indent=2,sort_keys=True)
          PY
          sha256sum axiom-stage-security-activation.json > axiom-stage-security-activation.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mft-axiom-stage-security-activation
          path: |
            axiom-stage-security-activation.json
            axiom-stage-security-activation.sha256
          retention-days: 7
          if-no-files-found: error
