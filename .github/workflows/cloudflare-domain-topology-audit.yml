name: MUSITU Axiom Cloudflare Domain Topology Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloudflare-domain-topology-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API: https://api.cloudflare.com/client/v4
      EXPECTED_ZONE: mftintelligence.com
      EXPECTED_ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      EXPECTED_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
    steps:
      - name: Read Axiom Worker custom-domain topology
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_GLOBAL_API_KEY"
          python - <<'PY'
          import json,os,urllib.parse,urllib.request
          base=os.environ['CF_API']
          headers={
            'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],
            'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],
            'Content-Type':'application/json',
            'User-Agent':'MUSITU-Axiom-Topology-Audit/1.0',
          }
          def get(path):
            req=urllib.request.Request(base+path,headers=headers,method='GET')
            with urllib.request.urlopen(req,timeout=30) as r:
              body=json.load(r)
            if r.status!=200 or not body.get('success'):
              raise SystemExit(f'Fail-closed Cloudflare read: {path} HTTP {r.status}')
            return body.get('result')

          zones=get('/zones?name='+urllib.parse.quote(os.environ['EXPECTED_ZONE'])+'&status=active') or []
          if len(zones)!=1: raise SystemExit(f'Fail-closed: expected one active zone, got {len(zones)}')
          zone=zones[0]; zid=zone.get('id'); aid=(zone.get('account') or {}).get('id')
          if zid!=os.environ['EXPECTED_ZONE_ID'] or aid!=os.environ['EXPECTED_ACCOUNT_ID']:
            raise SystemExit('Fail-closed: canonical zone/account identity mismatch')

          domains=get(f'/accounts/{aid}/workers/domains') or []
          relevant=[]
          for d in domains:
            host=str(d.get('hostname') or '')
            service=str(d.get('service') or '')
            if ('axiom' in host.lower() or 'mft' in host.lower() or 'axiom' in service.lower()) and host.endswith('.mftintelligence.com'):
              relevant.append({k:d.get(k) for k in ('id','hostname','service','environment','zone_id') if d.get(k) is not None})
          relevant=sorted(relevant,key=lambda x:(str(x.get('hostname')),str(x.get('service'))))

          dns=get('/zones/'+zid+'/dns_records?per_page=500') or []
          relevant_dns=[]
          hosts={str(x.get('hostname')) for x in relevant if x.get('hostname')}
          for d in dns:
            name=str(d.get('name') or '')
            if name in hosts or ('axiom' in name.lower() and name.endswith('mftintelligence.com')):
              relevant_dns.append({k:d.get(k) for k in ('id','name','type','content','proxied','proxiable') if d.get(k) is not None})
          relevant_dns=sorted(relevant_dns,key=lambda x:(str(x.get('name')),str(x.get('type'))))

          stage=[x for x in relevant if x.get('hostname')=='axiom-stage.mftintelligence.com']
          nonstage=[x for x in relevant if x.get('hostname')!='axiom-stage.mftintelligence.com']
          out={
            'schema':'musitu.axiom.cloudflare_domain_topology.v1',
            'zone':{'id':zid,'name':zone.get('name'),'status':zone.get('status'),'account_id':aid},
            'relevant_worker_domains':relevant,
            'relevant_dns':relevant_dns,
            'stage_domain_count':len(stage),
            'nonstage_axiom_domain_count':len(nonstage),
            'nonstage_axiom_domains':nonstage,
            'write_performed':False,
            'wolfram_parity':'NOT_CERTIFIED',
            'superiority':'NOT_CERTIFIED',
          }
          open('cloudflare-domain-topology.json','w').write(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps({
            'topology_pass':True,
            'stage_domain_count':len(stage),
            'stage_mappings':[{'hostname':x.get('hostname'),'service':x.get('service'),'environment':x.get('environment')} for x in stage],
            'nonstage_axiom_domain_count':len(nonstage),
            'nonstage_axiom_mappings':[{'hostname':x.get('hostname'),'service':x.get('service'),'environment':x.get('environment')} for x in nonstage],
            'write_performed':False,
          },sort_keys=True))
          PY
      - name: Seal topology evidence
        run: sha256sum cloudflare-domain-topology.json > cloudflare-domain-topology.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mft-axiom-cloudflare-domain-topology
          path: |
            cloudflare-domain-topology.json
            cloudflare-domain-topology.sha256
          retention-days: 7
          if-no-files-found: error
