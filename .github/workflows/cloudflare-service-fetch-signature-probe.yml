name: MUSITU Axiom Cloudflare Service Fetch Signature Probe — QUARANTINED BY AR-02

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed at the AR-02 diagnostic boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'AR-02 QUARANTINE: the historical service-fetch signature probe is disabled.'
          echo 'No global Cloudflare credential is loaded, no temporary worker is deployed, and no public workers.dev probe is exposed.'
          echo 'The prior implementation remains preserved in Git history at sealed main.'
          echo 'A replacement must run against isolated test resources with bounded non-production credentials.'
          exit 1
