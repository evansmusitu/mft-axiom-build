name: Cloudflare Token Capability Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloudflare-token-capability-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
    steps:
      - name: Read token permission groups
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          req=urllib.request.Request('https://api.cloudflare.com/client/v4/user/tokens/permission_groups',headers={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'Content-Type':'application/json','User-Agent':'MUSITU-Axiom-Control-Plane/2.0'})
          with urllib.request.urlopen(req,timeout=30) as r: x=json.load(r)
          if not x.get('success'): raise SystemExit('permission-group read failed')
          rows=x.get('result') or []
          wanted=[]
          for p in rows:
            name=(p.get('name') or '')
            low=name.lower()
            if any(k in low for k in ('workers','container','d1','account settings','api tokens')):
              wanted.append({'id':p.get('id'),'name':name,'scopes':p.get('scopes')})
          with open('cloudflare-token-permission-groups.json','w') as f: json.dump({'success':True,'groups':wanted},f,indent=2,sort_keys=True)
          print(json.dumps({'success':True,'matched_group_count':len(wanted),'names':[x['name'] for x in wanted]},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-token-permission-groups
          path: cloudflare-token-permission-groups.json
          if-no-files-found: error
          retention-days: 3
