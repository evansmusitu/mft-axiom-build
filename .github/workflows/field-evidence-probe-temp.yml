name: MUSITU Field Evidence Probe

on:
  push:
    branches: [chemistry-national-rescue-growth-20260907]
    paths: ['.github/workflows/field-evidence-probe-temp.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET field evidence only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url='https://payments.mftintelligence.com/chemistry/experience.json'
          req=urllib.request.Request(url,method='GET',headers={'Accept':'application/json','Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache','User-Agent':'MUSITU-Field-Evidence-Probe/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read().decode('utf-8')
              print('HTTP_STATUS='+str(r.status))
              print('FIELD_EVIDENCE_JSON='+body)
              data=json.loads(body)
              print('FIELD_EVIDENCE_STATUS='+str(data.get('status')))
          PY
