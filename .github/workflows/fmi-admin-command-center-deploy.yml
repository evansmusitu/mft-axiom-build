name: MUSITU FMI Admin Command Center Deploy

on:
  push:
    paths:
      - 'admin/fmi_admin_worker.mjs'
      - 'scripts/deploy_fmi_admin.py'
      - 'scripts/deploy_fmi_admin_v2.py'
      - '.github/workflows/fmi-admin-command-center-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-fmi-admin-command-center
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      ZONE_NAME: mftintelligence.com
      FMI_DB_UUID: a03dc12d-8206-47be-b904-1f24e4e37d91
      ADMIN_HOST: admin.mftintelligence.com
      ADMIN_WORKER: mft-fmi-admin
      PUBLIC_BASE: https://mft-fmi-global-edge.mft-education-nexus-93f395f5.workers.dev
      BOOTSTRAP_HASH: 3dfd2d74058edd2bbb91080c2f4a841e2dc17eadd7de1250a7892ee39d17ce88
    steps:
      - uses: actions/checkout@v4
      - name: Validate admin source and deploy scripts
        run: |
          set -euo pipefail
          node --check admin/fmi_admin_worker.mjs
          python -m py_compile scripts/deploy_fmi_admin.py scripts/deploy_fmi_admin_v2.py
      - name: Deploy isolated FMI admin command center and run E2E safety proof
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_GLOBAL_API_KEY"
          python scripts/deploy_fmi_admin_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-fmi-admin-command-center-deployment
          path: |
            fmi-admin-deployment-evidence.json
            fmi-admin-deployment-evidence.sha256
          retention-days: 30
          if-no-files-found: error
