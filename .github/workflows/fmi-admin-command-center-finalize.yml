name: MUSITU FMI Admin Command Center Finalize

on:
  push:
    paths:
      - 'scripts/fmi_admin_finalize.py'
      - '.github/workflows/fmi-admin-command-center-finalize.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-fmi-admin-command-center-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      ZONE_NAME: mftintelligence.com
      FMI_DB_UUID: a03dc12d-8206-47be-b904-1f24e4e37d91
      ADMIN_HOST: admin.mftintelligence.com
      ADMIN_WORKER: mft-fmi-admin
      PUBLIC_BASE: https://mft-fmi-global-edge.mft-education-nexus-93f395f5.workers.dev
      BOOTSTRAP_HASH: e65673ab2f27740c609ae78b1db9a88c706ab01d303c300984f5a6a125abb109
    steps:
      - uses: actions/checkout@v4
      - name: Validate finalizer
        run: |
          set -euo pipefail
          node --check admin/fmi_admin_worker.mjs
          python -m py_compile scripts/fmi_admin_finalize.py
      - name: Finalize owner command center and prove custom-domain E2E
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_GLOBAL_API_KEY"
          python scripts/fmi_admin_finalize.py
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-fmi-admin-command-center-finalization
          path: |
            fmi-admin-finalization-evidence.json
            fmi-admin-finalization-evidence.sha256
          retention-days: 30
          if-no-files-found: error
