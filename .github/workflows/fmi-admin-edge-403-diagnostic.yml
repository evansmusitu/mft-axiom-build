name: MUSITU FMI Admin Edge 403 Diagnostic

on:
  push:
    paths:
      - 'scripts/fmi_admin_edge_403_diagnostic.py'
      - '.github/workflows/fmi-admin-edge-403-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      ADMIN_HOST: admin.mftintelligence.com
      ADMIN_WORKER: mft-fmi-admin
    steps:
      - uses: actions/checkout@v4
      - name: Validate diagnostic
        run: python -m py_compile scripts/fmi_admin_edge_403_diagnostic.py
      - name: Inspect Cloudflare edge policy read-only
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_GLOBAL_API_KEY"
          python scripts/fmi_admin_edge_403_diagnostic.py | tee fmi-admin-edge-403-diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-fmi-admin-edge-403-diagnostic
          path: fmi-admin-edge-403-diagnostic.json
          retention-days: 14
          if-no-files-found: error
