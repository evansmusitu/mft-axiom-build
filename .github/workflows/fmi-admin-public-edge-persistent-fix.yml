name: MUSITU FMI Admin Public Edge Persistent Fix

on:
  push:
    branches: [fmi-revenue-certification-20260913]
    paths:
      - '.github/workflows/fmi-admin-public-edge-persistent-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: musitu-fmi-admin-public-edge-persistent-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      FMI_DB_UUID: a03dc12d-8206-47be-b904-1f24e4e37d91
      ADMIN_HOST: admin.mftintelligence.com
      ADMIN_WORKER: mft-fmi-admin
      PUBLIC_BASE: https://mft-fmi-global-edge.mft-education-nexus-93f395f5.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist canonical health route and cache-busted system request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('admin/fmi_admin_worker.mjs')
          s=p.read_text()
          old="env.PUBLIC_BASE + '/health'"
          new="env.PUBLIC_BASE + '/healthz'"
          if old in s:
              if s.count(old)!=1: raise SystemExit(f'unexpected obsolete probe count: {s.count(old)}')
              s=s.replace(old,new,1)
          elif s.count(new)!=1:
              raise SystemExit('neither exact obsolete nor canonical public probe found')
          diag="""    if (url.pathname === '/health/public-edge' && request.method === 'GET') {\n      const s = await systemStatus(env);\n      return json({ ok: s.public_edge?.ok === true, public_edge: s.public_edge, authority: 'PAPER_SHADOW_ONLY' });\n    }\n"""
          anchor="    if (url.pathname === '/health') return json({ ok: true, product: PRODUCT, surface: 'admin', authentication: 'required', live_trading_authorized: false });\n"
          if "url.pathname === '/health/public-edge'" not in s:
              if s.count(anchor)!=1: raise SystemExit('admin health route anchor missing')
              s=s.replace(anchor,diag+anchor,1)
          ui_old="async function system(main){const x=await api('/api/system');"
          ui_new="async function system(main){const x=await api('/api/system?ts='+Date.now());"
          if ui_old in s:
              if s.count(ui_old)!=1: raise SystemExit('unexpected system UI call count')
              s=s.replace(ui_old,ui_new,1)
          elif s.count(ui_new)!=1:
              raise SystemExit('system UI cache-bust invariant missing')
          if old in s or s.count(new)!=1: raise SystemExit('public health canonicalization failed')
          if s.count("url.pathname === '/health/public-edge'")!=1: raise SystemExit('diagnostic route invariant failed')
          if s.count("/api/system?ts='+Date.now()")!=1: raise SystemExit('system cache-bust invariant failed')
          p.write_text(s)
          PY
          node --check admin/fmi_admin_worker.mjs
          python -m py_compile scripts/fmi_admin_public_edge_persistent_fix.py
          ! grep -q '/d1/database' scripts/fmi_admin_public_edge_persistent_fix.py
      - name: Commit canonical repair on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- admin/fmi_admin_worker.mjs; then
            echo 'Canonical source already repaired.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add admin/fmi_admin_worker.mjs
            git commit -m 'fix(fmi-admin): persist canonical public edge health route'
            git push origin HEAD:fmi-revenue-certification-20260913
          fi
      - name: Deploy persistent repair and prove Worker-to-edge health
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_GLOBAL_API_KEY"
          python scripts/fmi_admin_public_edge_persistent_fix.py
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-fmi-admin-public-edge-persistent-fix
          path: |
            fmi-admin-public-edge-persistent-fix.json
            fmi-admin-public-edge-persistent-fix.sha256
          retention-days: 30
          if-no-files-found: error
