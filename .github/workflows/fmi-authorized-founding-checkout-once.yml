name: MUSITU FMI Authorized Founding Checkout Once

on:
  push:
    branches:
      - fmi-billing-binding-20260912-ephemeral
    paths:
      - .github/workflows/fmi-authorized-founding-checkout-once.yml

permissions:
  contents: read

jobs:
  initiate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FMI_PUBLIC_BASE: https://mft-fmi-global-edge.mft-education-nexus-93f395f5.workers.dev
      FMI_PLAN: FOUNDING
      FMI_PAYER_AUTHORIZATION: AUTHORIZE_FMI_FOUNDING_USD_49
    steps:
      - name: Enforce one-shot authorization envelope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF_NAME}" = "fmi-billing-binding-20260912-ephemeral"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "${FMI_PLAN}" = "FOUNDING"
          test "${FMI_PAYER_AUTHORIZATION}" = "AUTHORIZE_FMI_FOUNDING_USD_49"
          echo "one_shot_authorization_envelope=PASS"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create exactly one explicitly authorized US$49 FOUNDING provider checkout
        run: python ops/fmi_real_payer_checkout_initiate.py
      - name: Upload short-lived checkout handoff
        uses: actions/upload-artifact@v4
        with:
          name: musitu-fmi-real-payer-checkout-${{ github.run_id }}
          path: |
            fmi-real-payer-checkout.json
            fmi-real-payer-checkout.sha256
          retention-days: 1
          if-no-files-found: error
