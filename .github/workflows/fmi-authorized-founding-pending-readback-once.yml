name: MUSITU FMI Authorized Founding Pending Readback Once

on:
  push:
    branches:
      - fmi-billing-binding-20260912-ephemeral
    paths:
      - .github/workflows/fmi-authorized-founding-pending-readback-once.yml

permissions:
  contents: read

jobs:
  verify-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API: https://api.cloudflare.com/client/v4
      AID: 93f395f5121954671f92fffa453d6b61
      DBID: a03dc12d-8206-47be-b904-1f24e4e37d91
      PUBLIC: https://mft-fmi-global-edge.mft-education-nexus-93f395f5.workers.dev
      FMI_REFERENCE: FMI-MTYO41LA-CD6240DEB118
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
    steps:
      - name: Verify unpaid checkout remains pending and unentitled
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          python - <<'PY'
          import hashlib,json,os,urllib.request
          from datetime import datetime,timezone
          API=os.environ['API']; AID=os.environ['AID']; DBID=os.environ['DBID']; REF=os.environ['FMI_REFERENCE']; PUBLIC=os.environ['PUBLIC'].rstrip('/')
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'Content-Type':'application/json','User-Agent':'MUSITU-FMI-Pending-Readback/1.0'}
          def d1(sql,params=None):
              obj={'sql':sql}
              if params is not None: obj['params']=params
              req=urllib.request.Request(f'{API}/accounts/{AID}/d1/database/{DBID}/query',headers=H,method='POST',data=json.dumps(obj,separators=(',',':')).encode())
              with urllib.request.urlopen(req,timeout=30) as r: x=json.load(r)
              if x.get('success') is False: raise SystemExit('D1 API success=false')
              rows=[]
              for rr in x.get('result') or []:
                  if rr.get('success') is not True: raise SystemExit('D1 query failed')
                  rows.extend(rr.get('results') or [])
              return rows
          def public(path):
              req=urllib.request.Request(PUBLIC+path,headers={'Accept':'application/json','User-Agent':'MUSITU-FMI-Pending-Readback/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r: return r.status,json.loads(r.read() or b'{}')
          hc,health=public('/healthz'); assert hc==200 and health.get('authority')=='PAPER_SHADOW_ONLY'
          bc,bh=public('/v1/billing/healthz'); assert bc==200 and bh.get('ok') is True and bh.get('settlement_certified') is False
          rows=d1('SELECT reference,customer_id,plan,amount_cents,currency,status,paynow_reference,created_at,completed_at FROM billing_checkout_intents WHERE reference=?1 LIMIT 2',[REF])
          assert len(rows)==1
          intent=rows[0]
          assert intent.get('reference')==REF
          assert intent.get('plan')=='FOUNDING'
          assert int(intent.get('amount_cents',-1))==4900
          assert intent.get('currency')=='USD'
          assert intent.get('status')=='pending'
          assert not intent.get('completed_at')
          customer_id=intent['customer_id']
          customers=d1('SELECT id,plan,status FROM customers WHERE id=?1 LIMIT 2',[customer_id]); assert len(customers)==1
          customer=customers[0]
          assert customer.get('plan')=='FREE'
          assert customer.get('status')=='active'
          subs=d1("SELECT count(*) AS n FROM billing_subscriptions WHERE customer_id=?1 AND status='active'",[customer_id]); active_subs=int(subs[0]['n'])
          events=d1("SELECT count(*) AS n FROM lifecycle_events WHERE customer_id=?1 AND event_name='PLAN_ACTIVATED'",[customer_id]); activated=int(events[0]['n'])
          assert active_subs==0
          assert activated==0
          total=d1('SELECT count(*) AS n FROM billing_checkout_intents WHERE reference=?1',[REF]); assert int(total[0]['n'])==1
          record={
            'schema':'musitu-fmi.unpaid-checkout-readback.v1','verified_at':datetime.now(timezone.utc).isoformat(),
            'reference':REF,'plan':'FOUNDING','amount_cents':4900,'currency':'USD','provider':'paynow',
            'intent_status':'pending','customer_plan':'FREE','active_paid_subscription_count':0,'plan_activated_event_count':0,
            'checkout_intent_count_for_reference':1,'real_money_settlement_tested':False,'real_money_settlement_certified':False,
            'checkout_initiation_certified':True,'paper_shadow_authority_preserved':True,'live_trading_authorized':False,
            'model_authorized_trade_execution':False,'production_model_authority':False
          }
          raw=(json.dumps(record,indent=2,sort_keys=True)+'\n').encode(); open('fmi-unpaid-checkout-readback.json','wb').write(raw)
          sha=hashlib.sha256(raw).hexdigest(); open('fmi-unpaid-checkout-readback.sha256','w').write(f'{sha}  fmi-unpaid-checkout-readback.json\n')
          print(json.dumps({'gate':'PASS','reference':REF,'intent_status':'pending','customer_plan':'FREE','active_paid_subscription_count':0,'plan_activated_event_count':0,'checkout_initiation_certified':True,'real_money_settlement_certified':False,'evidence_sha256':sha},sort_keys=True))
          PY
      - name: Upload read-only pending evidence
        uses: actions/upload-artifact@v4
        with:
          name: musitu-fmi-unpaid-checkout-readback-${{ github.run_id }}
          path: |
            fmi-unpaid-checkout-readback.json
            fmi-unpaid-checkout-readback.sha256
          retention-days: 1
          if-no-files-found: error