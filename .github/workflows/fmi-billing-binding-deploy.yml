name: MUSITU FMI Billing Binding Deploy

on:
  push:
    branches: [fmi-billing-binding-20260912-ephemeral]
    paths: ['.github/workflows/fmi-billing-binding-deploy.yml']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      FMI_DB_UUID: a03dc12d-8206-47be-b904-1f24e4e37d91
      AUTHORITY: mft-phase8-external-authority
      TRANSPORT: mft-paynow-transport-gateway
      FMI_BILLING: mft-fmi-billing
      FMI_EDGE: mft-fmi-global-edge
      FMI_PUBLIC_BASE: https://mft-fmi-global-edge.mft-education-nexus-93f395f5.workers.dev
      AUTHORITY_SHA256: b58ed574e496189a22cff20496ccc1b68b59cb94f001877cd4357eeab66e66ea
      TRANSPORT_SHA256: 03e6c04cf837f64c7f209a2c184993e13b2dd6249438f63f5864939b7cabc59b
      FMI_EDGE_SHA256: b1145126c6e4fcf1706144ba72ae37160620bb579d9ab89df0d515541abaa25d
      EXPECTED_SCRIPT_BYTES: '35067'
      EXPECTED_SCRIPT_SHA256: c43e07796f1facc2b9477d868e10a9aa7cccf02828728016e53f1e91585500a9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Consume private one-time billing deployment artifact and verify exact bytes
        shell: bash
        run: |
          set -euo pipefail
          URL="$(printf '%s' '' | base64 -d)"
          curl -fL --connect-timeout 20 --max-time 120 "$URL" -o /tmp/fmi_billing_deploy.py
          unset URL
          test "$(stat -c %s /tmp/fmi_billing_deploy.py)" = "$EXPECTED_SCRIPT_BYTES"
          test "$(sha256sum /tmp/fmi_billing_deploy.py | awk '{print $1}')" = "$EXPECTED_SCRIPT_SHA256"
          python -m py_compile /tmp/fmi_billing_deploy.py
          echo exact_deploy_artifact=PASS

      - name: Execute hash-guarded isolated FMI billing binding
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_GLOBAL_API_KEY"
          python /tmp/fmi_billing_deploy.py | tee fmi-billing-deploy.log

      - name: Assert evidence remains non-settlement-certified
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('fmi-billing-binding-deployment.json')
          x=json.loads(p.read_text())
          assert x['gate']=='PASS'
          assert x['result']=='PROVIDER_BOUND_AWAITING_REAL_PAYER_CERTIFICATION'
          assert x['provider_checkout_created_by_deploy'] is False
          assert x['real_money_settlement_tested'] is False
          assert x['real_money_settlement_certified'] is False
          a=x['authority']
          assert a['paper_shadow_only'] is True
          assert a['live_trading_authorized'] is False
          assert a['production_model_authority'] is False
          assert a['model_authorized_trade_execution'] is False
          assert a['scaled_autonomy_authorized'] is False
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          expected=pathlib.Path('fmi-billing-binding-deployment.sha256').read_text().split()[0]
          assert got==expected
          print('evidence_gate=PASS sha256='+got)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-fmi-billing-binding-deployment-20260912
          path: |
            fmi-billing-binding-deployment.json
            fmi-billing-binding-deployment.sha256
            fmi-billing-deploy.log
          retention-days: 7
          if-no-files-found: error
