name: MUSITU FMI Billing Post-Deploy Readback

on:
  push:
    branches: [fmi-billing-binding-20260912-ephemeral]
    paths: ['.github/workflows/fmi-billing-postdeploy-readback.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      API: https://api.cloudflare.com/client/v4
      AID: 93f395f5121954671f92fffa453d6b61
      DBID: a03dc12d-8206-47be-b904-1f24e4e37d91
      AUTH: mft-phase8-external-authority
      TRANSPORT: mft-paynow-transport-gateway
      EDGE: mft-fmi-global-edge
      BILLING: mft-fmi-billing
      PUBLIC: https://mft-fmi-global-edge.mft-education-nexus-93f395f5.workers.dev
      AUTH_SHA: ec2294e7bb9109a8b7b96ecfbc5c1bdc85c141d4aed501eed7a2c1cca1a94f26
      TRANSPORT_SHA: e3c6db1ced0ab7e8e9844364b69777dfc7a15c8c2daf08b5bd330e035979f4ac
      EDGE_SHA: 591f40e44a744655e439e5d8c154ccdd7e7379b47c7a583ce76f3a0b1c89572e
    steps:
      - name: Verify live billing state independently
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import email,hashlib,json,os,urllib.error,urllib.parse,urllib.request
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY']}; API=os.environ['API']; AID=os.environ['AID']
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(API+path,headers=H),timeout=30) as r:return r.headers,r.read()
          def src(n):
              h,b=get(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(n,safe="")}'); ct=h.get('content-type','')
              if 'multipart/' not in ct.lower():return b
              m=email.message_from_bytes((f'Content-Type: {ct}\r\nMIME-Version: 1.0\r\n\r\n').encode()+b); p=[]
              for x in m.walk():
                  if x.is_multipart():continue
                  d=x.get_payload(decode=True) or b''
                  if any(k in d for k in (b'export default',b'addEventListener',b'fetch(')):p.append(d)
              if len(p)!=1:raise SystemExit(f'{n}: module count {len(p)}')
              return p[0]
          def settings(n):
              _,b=get(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(n,safe="")}/settings'); return (json.loads(b).get('result') or {}).get('bindings') or []
          def public(path,method='GET',body=None):
              h={'Accept':'application/json','User-Agent':'MUSITU-FMI-Billing-Independent-Readback/1.0'}
              if body is not None:h['Content-Type']='application/json'
              q=urllib.request.Request(os.environ['PUBLIC']+path,headers=h,method=method,data=body)
              try:
                  with urllib.request.urlopen(q,timeout=30) as r:return r.status,json.loads(r.read() or b'{}')
              except urllib.error.HTTPError as e:
                  raw=e.read()
                  try:x=json.loads(raw or b'{}')
                  except Exception:x={}
                  return e.code,x
          assert hashlib.sha256(src(os.environ['AUTH'])).hexdigest()==os.environ['AUTH_SHA']
          assert hashlib.sha256(src(os.environ['TRANSPORT'])).hexdigest()==os.environ['TRANSPORT_SHA']
          assert hashlib.sha256(src(os.environ['EDGE'])).hexdigest()==os.environ['EDGE_SHA']
          _,b=get(f'/accounts/{AID}/workers/scripts'); names={(x.get('id') or x.get('name')) for x in (json.loads(b).get('result') or [])}
          assert os.environ['BILLING'] in names
          assert {'mft-axiom-modal-adapter','mft-axiom-modal-edge-stage'}.issubset(names)
          ab={x.get('name'):x for x in settings(os.environ['AUTH']) if isinstance(x,dict)}; tb={x.get('name'):x for x in settings(os.environ['TRANSPORT']) if isinstance(x,dict)}; eb={x.get('name'):x for x in settings(os.environ['EDGE']) if isinstance(x,dict)}; bb={x.get('name'):x for x in settings(os.environ['BILLING']) if isinstance(x,dict)}
          assert ab.get('FMI_AUTHORITY_BRIDGE_TOKEN',{}).get('type')=='secret_text'
          assert tb.get('FMI_TRANSPORT_BRIDGE_TOKEN',{}).get('type')=='secret_text'
          assert eb.get('FMI_BILLING',{}).get('service')==os.environ['BILLING']
          assert bb.get('FMI_DB',{}).get('id')==os.environ['DBID']
          assert bb.get('PAYMENT_AUTHORITY',{}).get('service')==os.environ['AUTH']
          assert bb.get('PAYNOW_TRANSPORT',{}).get('service')==os.environ['TRANSPORT']
          _,b=get(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(os.environ["BILLING"],safe="")}/subdomain'); sub=(json.loads(b).get('result') or {}); assert sub.get('enabled') is False
          q=json.dumps({'sql':"SELECT count(*) AS n FROM billing_checkout_intents;"}).encode(); hh=dict(H);hh['Content-Type']='application/json'
          with urllib.request.urlopen(urllib.request.Request(f"{API}/accounts/{AID}/d1/database/{os.environ['DBID']}/query",headers=hh,method='POST',data=q),timeout=30) as r:x=json.load(r)
          intents=int(x['result'][0]['results'][0]['n']); assert intents==0
          hc,h=public('/healthz'); assert hc==200 and h.get('authority')=='PAPER_SHADOW_ONLY'
          bc,bh=public('/v1/billing/healthz'); assert bc==200 and bh.get('ok') is True and bh.get('settlement_certified') is False
          cc,cat=public('/v1/billing/catalog'); assert cc==200; plans=cat.get('plans') or {}; assert (plans.get('FOUNDING') or {}).get('amount_cents')==4900 and (plans.get('PRO') or {}).get('amount_cents')==14900
          uc,u=public('/v1/billing/checkout','POST',b'{"plan":"FOUNDING"}'); assert uc==401
          # Re-read intent count after unauthorized checkout proof.
          with urllib.request.urlopen(urllib.request.Request(f"{API}/accounts/{AID}/d1/database/{os.environ['DBID']}/query",headers=hh,method='POST',data=q),timeout=30) as r:x=json.load(r)
          assert int(x['result'][0]['results'][0]['n'])==0
          print(json.dumps({'gate':'PASS','provider_bound':True,'billing_worker_private':True,'billing_health':'PASS','catalog':'PASS','unauthorized_checkout':'REJECTED','provider_checkout_intents':0,'real_money_settlement_tested':False,'real_money_settlement_certified':False,'protected_axiom_workers_preserved':True,'secret_values_read_or_logged':False},sort_keys=True))
          PY
