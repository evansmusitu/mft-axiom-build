name: MUSITU FMI Commercial Global Deploy

on:
  push:
    branches:
      - fmi-commercial-launch-20260912-ephemeral
    paths:
      - '.github/workflows/fmi-commercial-global-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      FMI_MODAL_APP: mft-fmi-commercial
      FMI_D1_NAME: musitu-fmi-global
      FMI_ADAPTER_WORKER: mft-fmi-modal-adapter
      FMI_EDGE_WORKER: mft-fmi-global-edge
      EXPECTED_TRANSPORT_BYTES: '333338'
      EXPECTED_TRANSPORT_SHA256: c87009714befc99bf88c81d882aad98cd7dfa32f56daa1c8a5a38987f978152e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Require authenticated control-plane handles
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_GLOBAL_API_KEY"
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          echo credential_handles=PASS

      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check --quiet 'modal>=1.5,<2'

      - name: Fail closed if dedicated FMI names already exist
        shell: bash
        run: |
          set -euo pipefail
          modal app list --json > /tmp/modal-apps.json
          python - <<'PY'
          import json, os, urllib.request
          apps=json.load(open('/tmp/modal-apps.json'))
          rows=apps if isinstance(apps,list) else apps.get('apps',apps.get('data',[])) if isinstance(apps,dict) else []
          names={(r.get('name') or r.get('app_name')) for r in rows if isinstance(r,dict)}
          if os.environ['FMI_MODAL_APP'] in names:
              raise SystemExit('Fail-closed: dedicated FMI Modal app unexpectedly already exists')
          base='https://api.cloudflare.com/client/v4'
          aid=os.environ['CLOUDFLARE_ACCOUNT_ID']
          h={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY']}
          def get(path):
              req=urllib.request.Request(base+path,headers=h)
              with urllib.request.urlopen(req,timeout=30) as r: x=json.load(r)
              if not x.get('success'): raise SystemExit('Cloudflare preflight read failed')
              return x.get('result')
          dbs=get(f'/accounts/{aid}/d1/database') or []
          db_names={x.get('name') for x in dbs if isinstance(x,dict)}
          scripts=get(f'/accounts/{aid}/workers/scripts') or []
          worker_names={(x.get('id') or x.get('name')) for x in scripts if isinstance(x,dict)}
          collisions=[
            os.environ['FMI_D1_NAME'] in db_names,
            os.environ['FMI_ADAPTER_WORKER'] in worker_names,
            os.environ['FMI_EDGE_WORKER'] in worker_names,
          ]
          if any(collisions):
              raise SystemExit('Fail-closed: dedicated FMI Cloudflare name unexpectedly already exists')
          print('dedicated_namespace_absent=PASS')
          PY

      - name: Consume one-time Dropbox transport and verify exact bytes
        shell: bash
        run: |
          set -euo pipefail
          URL="$(printf '%s' 'aHR0cHM6Ly91Y2IzMDZjNzY0NWFlMTRmOGVmOWRjMmRmMGMwLmRsLmRyb3Bib3h1c2VyY29udGVudC5jb20vY2QvMC9nZXQvREg5SVVKV...snip...' | base64 -d)"
          curl -fL --connect-timeout 20 --max-time 120 "$URL" -o fmi-launch.zip
          unset URL
          size="$(stat -c %s fmi-launch.zip)"
          sha="$(sha256sum fmi-launch.zip | awk '{print $1}')"
          test "$size" = "$EXPECTED_TRANSPORT_BYTES"
          test "$sha" = "$EXPECTED_TRANSPORT_SHA256"
          unzip -tq fmi-launch.zip
          mkdir -p fmi-runtime
          unzip -q fmi-launch.zip -d fmi-runtime
          python - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path('fmi-runtime')
          mp=root/'MUSITU_FMI_COMMERCIAL_GLOBAL_LAUNCH_TRANSPORT_MANIFEST_20260912.json'
          manifest=json.loads(mp.read_text())
          if manifest.get('classification')!='EPHEMERAL_PRIVATE_GITHUB_ACTIONS_TRANSPORT':
              raise SystemExit('Fail-closed: transport classification mismatch')
          if manifest.get('controlled_files') != 168:
              raise SystemExit('Fail-closed: controlled file count mismatch')
          authority=manifest.get('authority') or {}
          required={
              'paper_shadow_only': True,
              'live_trading_authorized': False,
              'production_model_authority': False,
              'model_authorized_trade_execution': False,
              'frontier': 'NOT_YET_CERTIFIED',
          }
          for k,v in required.items():
              if authority.get(k) != v:
                  raise SystemExit(f'Fail-closed: authority drift {k}')
          listed=set()
          for row in manifest['files']:
              rel=row['path']; listed.add(rel)
              p=root/rel
              if not p.is_file():
                  raise SystemExit(f'Fail-closed: missing controlled file {rel}')
              b=p.read_bytes()
              if len(b)!=row['bytes'] or hashlib.sha256(b).hexdigest()!=row['sha256']:
                  raise SystemExit(f'Fail-closed: controlled file mismatch {rel}')
          actual={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          allowed=listed | {mp.name}
          if actual != allowed:
              raise SystemExit('Fail-closed: archive file set differs from manifest')
          print('transport_manifest_verified=PASS')
          PY
          python -m compileall -q fmi-runtime/src
          echo "$sha  fmi-launch.zip" > fmi-launch.sha256
          echo transport_gate=PASS

      - name: Deploy dedicated private FMI Modal application
        shell: bash
        working-directory: fmi-runtime
        run: |
          set -euo pipefail
          touch ../modal_writes_started.flag
          modal deploy deploy/modal_fmi_commercial.py --name "$FMI_MODAL_APP" --strategy recreate --tag 'MUSITU-FMI-COMMERCIAL-20260912' | tee ../modal-deploy.log
          python - <<'PY' > ../modal-url.txt
          import modal
          f=modal.Function.from_name('mft-fmi-commercial','fmi_commercial')
          u=f.get_web_url()
          if not u or not u.startswith('https://'):
              raise SystemExit('Fail-closed: dedicated FMI Modal HTTPS URL missing')
          print(u)
          PY
          URL="$(cat ../modal-url.txt)"
          code="$(curl -sS -o ../modal-unauth.txt -w '%{http_code}' "$URL/healthz" || true)"
          if [ "$code" != 401 ] && [ "$code" != 403 ]; then
            echo "Fail-closed: private Modal endpoint unauthenticated HTTP=$code" >&2
            exit 1
          fi
          echo "modal_proxy_auth_boundary=PASS"

      - name: Verify deployed Modal contract remotely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, modal
          f=modal.Function.from_name('mft-fmi-commercial','contract_probe')
          x=f.remote()
          if x.get('app')!='mft-fmi-commercial':
              raise SystemExit('Fail-closed: Modal app identity mismatch')
          if x.get('build_class')!='OPERATIONAL_R0_COMMERCIAL_PAPER_SHADOW_READ_ONLY':
              raise SystemExit('Fail-closed: Modal build class mismatch')
          if x.get('live_trading_authorized') is not False:
              raise SystemExit('Fail-closed: live trading authority drift')
          if x.get('production_model_authority') is not False:
              raise SystemExit('Fail-closed: production model authority drift')
          if x.get('model_authorized_trade_execution') is not False:
              raise SystemExit('Fail-closed: model trade authority drift')
          paths={r[1] for r in x.get('routes',[]) if isinstance(r,(list,tuple)) and len(r)>=2}
          for p in ['/healthz','/v1/plans','/v1/signup','/v1/intelligence/analyze']:
              if p not in paths:
                  raise SystemExit(f'Fail-closed: missing Modal route {p}')
          open('modal-contract-probe.json','w').write(json.dumps(x,indent=2,sort_keys=True)+'\n')
          print('modal_contract_probe=PASS')
          PY

      - name: Create dedicated Modal proxy credential for private adapter
        shell: bash
        run: |
          set -euo pipefail
          modal workspace proxy-tokens create --json > proxy-token.json
          python - <<'PY'
          import json, pathlib
          obj=json.load(open('proxy-token.json'))
          vals=[]
          def walk(x):
              if isinstance(x,dict):
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
              elif isinstance(x,str): vals.append(x)
          walk(obj)
          keys=[x for x in vals if x.startswith('wk-')]
          secs=[x for x in vals if x.startswith('ws-')]
          if len(keys)!=1 or len(secs)!=1:
              raise SystemExit('Fail-closed: unexpected Modal proxy token response')
          pathlib.Path('proxy-key.txt').write_text(keys[0])
          pathlib.Path('proxy-secret.txt').write_text(secs[0])
          PY
          echo "::add-mask::$(cat proxy-key.txt)"
          echo "::add-mask::$(cat proxy-secret.txt)"
          echo modal_adapter_proxy_credential_created=PASS

      - name: Deploy dedicated FMI Cloudflare D1 and workers, then live-verify
        shell: bash
        env:
          FMI_MODAL_ENDPOINT: ${{ env.FMI_MODAL_ENDPOINT }}
        run: |
          set -euo pipefail
          touch cf_writes_started.flag
          export FMI_MODAL_ENDPOINT="$(cat modal-url.txt)"
          export FMI_MODAL_KEY="$(cat proxy-key.txt)"
          export FMI_MODAL_SECRET="$(cat proxy-secret.txt)"
          export FMI_RUNTIME_ROOT="$PWD/fmi-runtime"
          python fmi-runtime/deploy/cloudflare_fmi_global.py
          touch cloudflare-deploy-succeeded.flag
          echo cloudflare_global_launch=PASS

      - name: Seal combined launch evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          cf=json.load(open('fmi-cloudflare-global-launch-evidence.json'))
          modal=json.load(open('modal-contract-probe.json'))
          base='https://api.cloudflare.com/client/v4'
          aid=os.environ['CLOUDFLARE_ACCOUNT_ID']
          h={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY']}
          def get(path):
              req=urllib.request.Request(base+path,headers=h)
              with urllib.request.urlopen(req,timeout=30) as r: x=json.load(r)
              if not x.get('success'): raise SystemExit('Cloudflare postdeploy read failed')
              return x.get('result')
          scripts=get(f'/accounts/{aid}/workers/scripts') or []
          names={(x.get('id') or x.get('name')) for x in scripts if isinstance(x,dict)}
          protected={'mft-axiom-modal-adapter','mft-axiom-modal-edge-stage'}
          if not protected.issubset(names):
              raise SystemExit('Fail-closed: protected Axiom worker identity changed/disappeared')
          out={
            'schema':'musitu-fmi.commercial-global-deployment-evidence.v1',
            'gate':'PASS',
            'transport':{
              'bytes':int(os.environ['EXPECTED_TRANSPORT_BYTES']),
              'sha256':os.environ['EXPECTED_TRANSPORT_SHA256'],
              'source':'temporary_single_use_dropbox_transport'
            },
            'modal':{
              'app':'mft-fmi-commercial',
              'endpoint':pathlib.Path('modal-url.txt').read_text().strip(),
              'requires_proxy_auth':True,
              'contract_probe':modal,
              'adapter_proxy_credential_bound':True,
              'adapter_proxy_credential_value_recorded':False,
            },
            'cloudflare':cf,
            'protected_axiom_workers_preserved':True,
            'billing':'FAIL_CLOSED_PENDING_PRODUCT_SPECIFIC_PAYMENT_CAPABILITY_BINDING',
            'authority':{
              'paper_shadow_only':True,
              'live_trading_authorized':False,
              'production_model_authority':False,
              'model_authorized_trade_execution':False,
              'frontier':'NOT_YET_CERTIFIED',
            }
          }
          p=pathlib.Path('fmi-commercial-global-deployment-evidence.json')
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          pathlib.Path('fmi-commercial-global-deployment-evidence.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          print(json.dumps({'deployment_gate':'PASS','public_base':cf['workers']['public_base']}))
          PY
          rm -f proxy-token.json proxy-key.txt proxy-secret.txt
          echo evidence_sealed=PASS

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-fmi-commercial-global-deployment-20260912
          path: |
            fmi-launch.sha256
            modal-deploy.log
            modal-url.txt
            modal-contract-probe.json
            fmi-cloudflare-global-launch-evidence.json
            fmi-cloudflare-global-launch-evidence.sha256
            fmi-commercial-global-deployment-evidence.json
            fmi-commercial-global-deployment-evidence.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Fail-closed cleanup of partial FMI Cloudflare writes
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          if [ -f cf_writes_started.flag ] && [ ! -f cloudflare-deploy-succeeded.flag ]; then
            python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          base='https://api.cloudflare.com/client/v4'; aid=os.environ['CLOUDFLARE_ACCOUNT_ID']
          h={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY']}
          def req(path,method='GET'):
              q=urllib.request.Request(base+path,method=method,headers=h)
              try:
                  with urllib.request.urlopen(q,timeout=30) as r: return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  try: body=json.load(e)
                  except Exception: body={}
                  return e.code, body
          for worker in [os.environ['FMI_EDGE_WORKER'],os.environ['FMI_ADAPTER_WORKER']]:
              req(f"/accounts/{aid}/workers/scripts/{urllib.parse.quote(worker,safe='')}",'DELETE')
          code,x=req(f'/accounts/{aid}/d1/database')
          if code==200:
              for db in (x.get('result') or []):
                  if db.get('name')==os.environ['FMI_D1_NAME'] and db.get('uuid'):
                      req(f"/accounts/{aid}/d1/database/{db['uuid']}",'DELETE')
          print('partial_cloudflare_cleanup_attempted=true')
          PY
          fi
          if [ -f proxy-key.txt ] && [ ! -f cloudflare-deploy-succeeded.flag ]; then
            modal workspace proxy-tokens delete -y "$(cat proxy-key.txt)" >/dev/null 2>&1 || true
          fi
          rm -f proxy-token.json proxy-key.txt proxy-secret.txt
