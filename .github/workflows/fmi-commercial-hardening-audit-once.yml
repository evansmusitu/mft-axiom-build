name: MUSITU FMI Commercial Hardening Audit Once

on:
  push:
    branches:
      - fmi-billing-binding-20260912-ephemeral
    paths:
      - .github/workflows/fmi-commercial-hardening-audit-once.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      API: https://api.cloudflare.com/client/v4
      AID: 93f395f5121954671f92fffa453d6b61
      DBID: a03dc12d-8206-47be-b904-1f24e4e37d91
      EDGE: mft-fmi-global-edge
      BILLING: mft-fmi-billing
      ADAPTER: mft-fmi-modal-adapter
      AUTHORITY: mft-phase8-external-authority
      TRANSPORT: mft-paynow-transport-gateway
      PUBLIC: https://mft-fmi-global-edge.mft-education-nexus-93f395f5.workers.dev
      FMI_REFERENCE: FMI-MTYO41LA-CD6240DEB118
      EDGE_SHA256: 591f40e44a744655e439e5d8c154ccdd7e7379b47c7a583ce76f3a0b1c89572e
      BILLING_SHA256: fb9ed06245d5e02017fd3778253d3fd23ef57ce6418e0a1a5f3b5fd3e681599e
      AUTHORITY_SHA256: ec2294e7bb9109a8b7b96ecfbc5c1bdc85c141d4aed501eed7a2c1cca1a94f26
      TRANSPORT_SHA256: e3c6db1ced0ab7e8e9844364b69777dfc7a15c8c2daf08b5bd330e035979f4ac
    steps:
      - name: Audit live FMI commercial hardening without payment or provider call
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          python - <<'PY'
          import email, hashlib, json, os, re, urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timezone

          API=os.environ['API']; AID=os.environ['AID']; DBID=os.environ['DBID']; PUBLIC=os.environ['PUBLIC'].rstrip('/')
          H={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY']}

          def cf_get(path):
              req=urllib.request.Request(API+path,headers=H)
              with urllib.request.urlopen(req,timeout=30) as r: return r.headers,r.read()

          def worker_src(name):
              h,b=cf_get(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(name,safe="")}')
              ct=h.get('content-type','')
              if 'multipart/' not in ct.lower(): return b
              m=email.message_from_bytes((f'Content-Type: {ct}\r\nMIME-Version: 1.0\r\n\r\n').encode()+b)
              parts=[]
              for x in m.walk():
                  if x.is_multipart(): continue
                  d=x.get_payload(decode=True) or b''
                  if any(k in d for k in (b'export default',b'addEventListener',b'fetch(')): parts.append(d)
              if len(parts)!=1: raise SystemExit(f'{name}: unexpected module count {len(parts)}')
              return parts[0]

          def worker_settings(name):
              _,b=cf_get(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(name,safe="")}/settings')
              return (json.loads(b).get('result') or {}).get('bindings') or []

          def worker_subdomain(name):
              _,b=cf_get(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(name,safe="")}/subdomain')
              return json.loads(b).get('result') or {}

          def d1(sql,params=None):
              hh=dict(H); hh['Content-Type']='application/json'
              obj={'sql':sql}
              if params is not None: obj['params']=params
              req=urllib.request.Request(f'{API}/accounts/{AID}/d1/database/{DBID}/query',headers=hh,method='POST',data=json.dumps(obj,separators=(',',':')).encode())
              with urllib.request.urlopen(req,timeout=30) as r: x=json.load(r)
              if x.get('success') is False: raise SystemExit('D1 API success=false')
              rows=[]
              for rr in x.get('result') or []:
                  if rr.get('success') is not True: raise SystemExit('D1 query failed')
                  rows.extend(rr.get('results') or [])
              return rows

          def http(path,method='GET',obj=None,bearer=None,headers=None):
              h={'Accept':'application/json','User-Agent':'MUSITU-FMI-Commercial-Hardening-Audit/1.0'}
              if headers: h.update(headers)
              data=None
              if obj is not None:
                  h['Content-Type']='application/json'; data=json.dumps(obj,separators=(',',':')).encode()
              if bearer is not None: h['Authorization']='Bearer '+bearer
              req=urllib.request.Request(PUBLIC+path,headers=h,method=method,data=data)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read(); rh={k.lower():v for k,v in r.headers.items()}
                      try: body=json.loads(raw or b'{}')
                      except Exception: body={'raw':raw[:300].decode('utf-8','ignore')}
                      return r.status,body,rh
              except urllib.error.HTTPError as e:
                  raw=e.read(); rh={k.lower():v for k,v in e.headers.items()}
                  try: body=json.loads(raw or b'{}')
                  except Exception: body={'raw':raw[:300].decode('utf-8','ignore')}
                  return e.code,body,rh

          names={'edge':os.environ['EDGE'],'billing':os.environ['BILLING'],'authority':os.environ['AUTHORITY'],'transport':os.environ['TRANSPORT']}
          expected={'edge':os.environ['EDGE_SHA256'],'billing':os.environ['BILLING_SHA256'],'authority':os.environ['AUTHORITY_SHA256'],'transport':os.environ['TRANSPORT_SHA256']}
          sources={k:worker_src(v) for k,v in names.items()}
          source_shas={k:hashlib.sha256(v).hexdigest() for k,v in sources.items()}
          for k in expected: assert source_shas[k]==expected[k], (k,source_shas[k],expected[k])

          edge_bind={x.get('name'):x for x in worker_settings(os.environ['EDGE']) if isinstance(x,dict)}
          billing_bind={x.get('name'):x for x in worker_settings(os.environ['BILLING']) if isinstance(x,dict)}
          assert edge_bind.get('FMI_BILLING',{}).get('service')==os.environ['BILLING']
          assert billing_bind.get('FMI_DB',{}).get('id')==DBID
          assert billing_bind.get('PAYMENT_AUTHORITY',{}).get('service')==os.environ['AUTHORITY']
          assert billing_bind.get('PAYNOW_TRANSPORT',{}).get('service')==os.environ['TRANSPORT']
          assert billing_bind.get('FMI_AUTHORITY_BRIDGE_TOKEN',{}).get('type')=='secret_text'
          assert billing_bind.get('FMI_TRANSPORT_BRIDGE_TOKEN',{}).get('type')=='secret_text'
          assert worker_subdomain(os.environ['BILLING']).get('enabled') is False
          assert worker_subdomain(os.environ['ADAPTER']).get('enabled') is False

          billing_text=sources['billing'].decode('utf-8','ignore')
          static_checks={
              'provider_key_not_in_billing_source':'PAYNOW_INTEGRATION_KEY' not in billing_text,
              'founding_server_price_present':'4900' in billing_text,
              'pro_server_price_present':'14900' in billing_text,
              'checkout_route_present':'/v1/billing/checkout' in billing_text,
              'poll_route_present':'/v1/billing/poll' in billing_text,
              'webhook_route_present':'/v1/billing/webhooks/paynow' in billing_text,
              'authority_verification_present':('verify' in billing_text.lower() and 'PAYMENT_AUTHORITY' in billing_text),
              'idempotency_state_present':('webhook_events' in billing_text and 'idempot' in billing_text.lower()),
          }
          assert all(static_checks.values()), static_checks

          ref=os.environ['FMI_REFERENCE']
          before={
              'intent':d1('SELECT reference,customer_id,plan,amount_cents,currency,status,paynow_reference,completed_at FROM billing_checkout_intents WHERE reference=?1 LIMIT 2',[ref]),
              'total_intents':d1('SELECT count(*) AS n FROM billing_checkout_intents'),
              'active_subs':d1("SELECT count(*) AS n FROM billing_subscriptions WHERE status='active'"),
              'activations':d1("SELECT count(*) AS n FROM lifecycle_events WHERE event_name='PLAN_ACTIVATED'"),
          }
          assert len(before['intent'])==1
          intent=before['intent'][0]
          assert intent.get('plan')=='FOUNDING' and int(intent.get('amount_cents',-1))==4900 and intent.get('currency')=='USD'
          assert intent.get('status')=='pending' and not intent.get('completed_at')

          hc,health,hh=http('/healthz'); assert hc==200 and health.get('authority')=='PAPER_SHADOW_ONLY'
          bc,bh,bhh=http('/v1/billing/healthz'); assert bc==200 and bh.get('ok') is True and bh.get('settlement_certified') is False
          cc,cat,ch=http('/v1/billing/catalog'); assert cc==200
          plans=cat.get('plans') or {}; assert (plans.get('FOUNDING') or {}).get('amount_cents')==4900 and (plans.get('PRO') or {}).get('amount_cents')==14900

          probes={}
          for name,path,method,obj,bearer in [
              ('checkout_no_auth','/v1/billing/checkout','POST',{'plan':'FOUNDING'},None),
              ('checkout_bad_auth','/v1/billing/checkout','POST',{'plan':'FOUNDING'},'definitely-invalid-token'),
              ('poll_no_auth','/v1/billing/poll','POST',{'reference':ref},None),
              ('poll_bad_auth','/v1/billing/poll','POST',{'reference':ref},'definitely-invalid-token'),
              ('me_no_auth','/v1/me','GET',None,None),
              ('me_bad_auth','/v1/me','GET',None,'definitely-invalid-token'),
              ('intelligence_no_auth','/v1/intelligence/analyze','POST',{'query':'audit'},None),
              ('intelligence_bad_auth','/v1/intelligence/analyze','POST',{'query':'audit'},'definitely-invalid-token'),
          ]:
              s,b,_=http(path,method,obj,bearer)
              probes[name]={'status':s,'rejected':s in (400,401,403)}
              assert probes[name]['rejected'], (name,s,b)

          ws,wb,_=http('/v1/billing/webhooks/paynow','POST',{'reference':ref,'status':'paid','amount':'49.00','hash':'invalid'})
          probes['forged_webhook']={'status':ws,'rejected': not (200 <= ws < 300)}
          assert probes['forged_webhook']['rejected'], (ws,wb)
          us,ub,_=http('/__definitely_unknown_fmi_path__')
          probes['unknown_route']={'status':us,'rejected':us==404}
          assert us==404

          after={
              'intent':d1('SELECT reference,customer_id,plan,amount_cents,currency,status,paynow_reference,completed_at FROM billing_checkout_intents WHERE reference=?1 LIMIT 2',[ref]),
              'total_intents':d1('SELECT count(*) AS n FROM billing_checkout_intents'),
              'active_subs':d1("SELECT count(*) AS n FROM billing_subscriptions WHERE status='active'"),
              'activations':d1("SELECT count(*) AS n FROM lifecycle_events WHERE event_name='PLAN_ACTIVATED'"),
          }
          assert after==before, (before,after)

          def security_headers(h):
              return {
                  'strict_transport_security':'strict-transport-security' in h,
                  'x_content_type_options':h.get('x-content-type-options','').lower()=='nosniff',
                  'x_frame_options':'x-frame-options' in h,
                  'content_security_policy':'content-security-policy' in h,
                  'referrer_policy':'referrer-policy' in h,
                  'permissions_policy':'permissions-policy' in h,
              }
          posture={'health':security_headers(hh),'billing_health':security_headers(bhh),'catalog':security_headers(ch)}
          header_score=sum(sum(1 for v in x.values() if v) for x in posture.values())
          header_total=sum(len(x) for x in posture.values())

          record={
              'schema':'musitu-fmi.commercial-hardening-audit.v1',
              'verified_at':datetime.now(timezone.utc).isoformat(),
              'gate':'PASS',
              'reference':ref,
              'source_shas':source_shas,
              'service_binding_isolation':'PASS',
              'billing_worker_private':True,
              'modal_adapter_private':True,
              'static_billing_checks':static_checks,
              'unauthorized_and_forged_probes':probes,
              'database_state_unchanged':True,
              'pending_checkout_preserved':True,
              'provider_call_executed':False,
              'payment_action_executed':False,
              'real_money_settlement_tested':False,
              'real_money_settlement_certified':False,
              'paper_shadow_authority_preserved':True,
              'live_trading_authorized':False,
              'model_authorized_trade_execution':False,
              'production_model_authority':False,
              'security_header_posture':posture,
              'security_header_score':{'present':header_score,'possible':header_total},
              'security_headers_full_baseline': header_score==header_total,
          }
          raw=(json.dumps(record,indent=2,sort_keys=True)+'\n').encode()
          open('fmi-commercial-hardening-audit.json','wb').write(raw)
          sha=hashlib.sha256(raw).hexdigest()
          open('fmi-commercial-hardening-audit.sha256','w').write(f'{sha}  fmi-commercial-hardening-audit.json\n')
          print(json.dumps({'gate':'PASS','database_state_unchanged':True,'pending_checkout_preserved':True,'unauthorized_probes':'PASS','forged_webhook':'REJECTED','service_binding_isolation':'PASS','security_header_score':f'{header_score}/{header_total}','real_money_settlement_certified':False,'evidence_sha256':sha},sort_keys=True))
          PY

      - name: Upload hardening audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: musitu-fmi-commercial-hardening-audit-${{ github.run_id }}
          path: |
            fmi-commercial-hardening-audit.json
            fmi-commercial-hardening-audit.sha256
          retention-days: 1
          if-no-files-found: error
