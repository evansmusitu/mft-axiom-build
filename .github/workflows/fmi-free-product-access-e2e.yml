name: MUSITU FMI FREE Product Surface E2E

on:
  push:
    branches: [fmi-revenue-certification-20260913]
    paths:
      - '.github/workflows/fmi-free-product-access-e2e.yml'
      - 'scripts/fmi_free_product_access_e2e.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-fmi-free-product-access-e2e
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      FMI_DB_UUID: a03dc12d-8206-47be-b904-1f24e4e37d91
      PUBLIC_BASE: https://mft-fmi-global-edge.mft-education-nexus-93f395f5.workers.dev
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require protected Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_API_KEY"
      - name: Verify disposable FREE customer product surfaces and cleanup
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fmi_free_product_access_e2e.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: musitu-fmi-free-product-access-e2e
          path: |
            fmi-free-product-access-e2e.json
            fmi-free-product-access-e2e.sha256
          retention-days: 30
          if-no-files-found: error
