name: MUSITU FMI Real Payer Harness Static Validation

on:
  push:
    branches: [fmi-billing-binding-20260912-ephemeral]
    paths: ['.github/workflows/fmi-real-payer-harness-static-validation.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile committed certification scripts
        run: |
          set -euo pipefail
          python -m py_compile ops/fmi_real_payer_checkout_initiate.py ops/fmi_real_payer_settlement_verify.py
      - name: Prove checkout and settlement workflows are manual-only and fail-closed
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          checkout = Path('.github/workflows/fmi-real-payer-checkout-initiate.yml').read_text()
          verify = Path('.github/workflows/fmi-real-payer-settlement-verify.yml').read_text()
          initiator = Path('ops/fmi_real_payer_checkout_initiate.py').read_text()
          verifier = Path('ops/fmi_real_payer_settlement_verify.py').read_text()

          for name, text in [('checkout_workflow', checkout), ('settlement_workflow', verify)]:
              assert 'workflow_dispatch:' in text, name
              assert '\n  push:' not in text, name
              assert '\n  schedule:' not in text, name
              assert '\n  pull_request:' not in text, name

          assert 'AUTHORIZE_FMI_FOUNDING_USD_49' in initiator
          assert 'AUTHORIZE_FMI_PRO_USD_149' in initiator
          assert "payer authorization phrase mismatch; refusing to create checkout" in initiator
          assert "health.get('authority') != 'PAPER_SHADOW_ONLY'" in initiator
          assert "billing.get('settlement_certified') is not False" in initiator
          assert "u.hostname not in {'paynow.co.zw', 'www.paynow.co.zw'}" in initiator
          assert "'api_key_persisted': False" in initiator

          assert "intent.get('status') != 'paid'" in verifier
          assert "poll.get('idempotent') is not True" in verifier
          assert "DELETE FROM api_keys WHERE id=?1" in verifier
          assert "after_event_count != before_event_count" in verifier
          assert "after_sub_count != before_sub_count" in verifier
          assert "health2.get('authority') != 'PAPER_SHADOW_ONLY'" in verifier
          assert "'live_trading_authorized': False" in verifier
          assert "'model_authorized_trade_execution': False" in verifier
          assert "'production_model_authority': False" in verifier
          assert "'global_claim_admission_pending': True" in verifier

          print('manual_only=PASS')
          print('python_compile=PASS')
          print('explicit_payer_authorization_gate=PASS')
          print('server_price_and_provider_host_checks=PASS')
          print('paid_state_and_idempotency_checks=PASS')
          print('temporary_key_cleanup_check=PASS')
          print('paper_shadow_authority_preservation=PASS')
          print('no_payment_or_provider_call_executed=PASS')
          PY
