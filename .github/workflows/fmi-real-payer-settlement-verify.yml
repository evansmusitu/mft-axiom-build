name: MUSITU FMI Real Payer Settlement Verify

on:
  workflow_dispatch:
    inputs:
      reference:
        description: FMI checkout reference returned by the initiation workflow
        required: true
        type: string
      expected_plan:
        description: Expected paid FMI plan
        required: true
        type: choice
        options:
          - FOUNDING
          - PRO

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      FMI_DB_UUID: a03dc12d-8206-47be-b904-1f24e4e37d91
      FMI_PUBLIC_BASE: https://mft-fmi-global-edge.mft-education-nexus-93f395f5.workers.dev
      FMI_REFERENCE: ${{ inputs.reference }}
      FMI_EXPECTED_PLAN: ${{ inputs.expected_plan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify real settlement and replay/idempotency without duplicating entitlement
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_GLOBAL_API_KEY"
          python ops/fmi_real_payer_settlement_verify.py
      - name: Upload settlement certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: musitu-fmi-real-payer-settlement-certification-${{ github.run_id }}
          path: |
            fmi-real-payer-settlement-certification.json
            fmi-real-payer-settlement-certification.sha256
          retention-days: 7
          if-no-files-found: error
