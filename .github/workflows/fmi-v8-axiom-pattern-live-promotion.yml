name: MUSITU FMI V8 Axiom-Pattern Live Promotion

on:
  workflow_dispatch:
  push:
    branches: [fmi-v8-live-promotion-20260913]
    paths:
      - '.github/workflows/fmi-v8-axiom-pattern-live-promotion.yml'

permissions:
  contents: read

jobs:
  promote-v8:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CF_API: https://api.cloudflare.com/client/v4
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      FMI_DB_NAME: musitu-fmi-global
      FMI_DB_UUID: a03dc12d-8206-47be-b904-1f24e4e37d91
      FMI_EDGE: mft-fmi-global-edge
      FMI_ADAPTER: mft-fmi-modal-adapter
      FMI_BILLING: mft-fmi-billing
      PUBLIC_BASE: https://mft-fmi-global-edge.mft-education-nexus-93f395f5.workers.dev
      EXPECTED_CURRENT_EDGE_SHA: 8b96455c0237dad85312606dc0c984efa4d278726924edf94f4abab4c2b9e891
      EXPECTED_V8_EDGE_SHA: 00fa486ddf3f51f3c435b8db33c5ec1d1c42d6b175abc95f4e1ad9328e40f2b3
      EXPECTED_V8_WORKSPACE_SHA: 64accddb375d9f1c0f0d7fddd319e83a0242c9740ae1ae5bcc59185ac3ca7ec3
      EXPECTED_BILLING_SHA: cd55b2b7b34bc5f73c394eddebd9edbc22690250b4ab7aff36a209064a3b9454
      EXPECTED_BUNDLE_SHA: 396c33c9b726e18faf255055c992794cb208d681097a5d8a68ea8a1f5f71a448
      WRANGLER_VERSION: 4.129.0

    steps:
      - uses: actions/checkout@v4

      - name: Require protected Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_API_KEY"

      - name: Reconstruct and verify exact V8 payload
        shell: bash
        run: |
          set -euo pipefail
          P=deploy_payload/fmi_v8
          cat "$P/chunk_00.b64" "$P/chunk_01.b64" "$P/chunk_02.b64" "$P/chunk_03.b64" | base64 -d > /tmp/fmi-v8.tar.gz
          test "$(sha256sum /tmp/fmi-v8.tar.gz | awk '{print $1}')" = "$EXPECTED_BUNDLE_SHA"
          mkdir -p /tmp/fmi-v8-runtime
          tar -xzf /tmp/fmi-v8.tar.gz -C /tmp/fmi-v8-runtime
          python - <<'PY'
          import hashlib,json,os,pathlib
          r=pathlib.Path('/tmp/fmi-v8-runtime'); m=json.loads((r/'MANIFEST.json').read_text()); bad=[]
          for f in m['files']:
              p=r/f['path']; b=p.read_bytes() if p.is_file() else b''
              if not p.is_file() or len(b)!=f['size'] or hashlib.sha256(b).hexdigest()!=f['sha256']: bad.append(f['path'])
          if bad: raise SystemExit('Fail-closed payload integrity: '+repr(bad))
          got=hashlib.sha256((r/'edge/fmi-global/worker.js').read_bytes()).hexdigest()
          if got!=os.environ['EXPECTED_V8_EDGE_SHA']: raise SystemExit('Fail-closed V8 edge SHA: '+got)
          PY
          node --check /tmp/fmi-v8-runtime/edge/fmi-global/worker.js
          grep -q 'PAPER_SHADOW_ONLY' /tmp/fmi-v8-runtime/edge/fmi-global/worker.js
          grep -q 'DETERMINISTIC_TOOL_ONLY' /tmp/fmi-v8-runtime/edge/fmi-global/worker.js

      - name: Install exact Wrangler and verify API-key authentication
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund wrangler@"$WRANGLER_VERSION"
          test "$(npx wrangler --version | awk '{print $NF}')" = "$WRANGLER_VERSION"
          npx wrangler auth token --json >/tmp/cf-auth.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/cf-auth.json'))
          if x.get('type')!='api_key': raise SystemExit('Fail-closed Wrangler auth type')
          PY
          rm -f /tmp/cf-auth.json

      - name: Predeploy readback and freeze exact production bindings
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fmi_v8_predeploy.py

      - name: Apply ordered V8 D1 schema and migrations
        shell: bash
        run: |
          set -euo pipefail
          R=/tmp/fmi-v8-runtime/edge/fmi-global
          for f in schema.sql migration_002_workspace_research_radar.sql migration_003_market_context_attestations.sql migration_004_analysis_evidence_index.sql migration_005_evidence_change_monitors.sql; do
            npx wrangler d1 execute "$FMI_DB_NAME" --remote --file "$R/$f" --yes
          done
          npx wrangler d1 execute "$FMI_DB_NAME" --remote --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" --json >/tmp/fmi-v8-schema.json
          python - <<'PY'
          import json
          text=json.dumps(json.load(open('/tmp/fmi-v8-schema.json')))
          req=['customers','api_keys','usage_buckets','usage_events','billing_subscriptions','webhook_events','watchlists','watchlist_items','market_context_attestations','analysis_evidence_index','evidence_monitors','evidence_monitor_events']
          miss=[x for x in req if x not in text]
          if miss: raise SystemExit('Fail-closed D1 schema missing: '+repr(miss))
          PY

      - name: Generate exact Wrangler production configuration from frozen bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          frozen=json.loads(pathlib.Path('/tmp/frozen-edge-bindings.json').read_text())
          cfg={'name':os.environ['FMI_EDGE'],'main':'worker.js','compatibility_date':'2026-09-12','workers_dev':True,'observability':{'enabled':True}}
          d1=[]; services=[]
          for b in frozen:
              if b['type']=='d1': d1.append({'binding':b['name'],'database_name':os.environ['FMI_DB_NAME'],'database_id':b['id']})
              elif b['type']=='service': services.append({'binding':b['name'],'service':b['service']})
              else: raise SystemExit('Fail-closed unsupported frozen binding')
          cfg['d1_databases']=d1; cfg['services']=services
          if len(d1)!=1 or d1[0]['binding']!='FMI_DB' or d1[0]['database_id']!=os.environ['FMI_DB_UUID']: raise SystemExit('Fail-closed generated D1 config')
          names={x['binding'] for x in services}
          if not {'FMI_KERNEL','FMI_BILLING'}.issubset(names): raise SystemExit('Fail-closed generated service config')
          p=pathlib.Path('/tmp/fmi-v8-runtime/edge/fmi-global/wrangler-promotion.json'); p.write_text(json.dumps(cfg,indent=2))
          print(json.dumps({'binding_names':sorted({'FMI_DB'}|names),'generated_config':'PASS'},sort_keys=True))
          PY

      - name: Deploy exact V8 edge through pinned Wrangler
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          touch /tmp/fmi-v8-deploy-attempted
          cd /tmp/fmi-v8-runtime/edge/fmi-global
          "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" deploy --config wrangler-promotion.json
          echo 'mutated=true' >> "$GITHUB_OUTPUT"

      - name: Independent live readback and V8 functional verification
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fmi_v8_postverify.py

      - name: Roll back exact previous edge on any post-attempt failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/fmi-v8-deploy-attempted ]; then echo 'No edge deployment attempted; no rollback required.'; exit 0; fi
          mkdir -p /tmp/fmi-v8-rollback
          cp /tmp/previous-edge.mjs /tmp/fmi-v8-rollback/worker.js
          cp /tmp/fmi-v8-runtime/edge/fmi-global/wrangler-promotion.json /tmp/fmi-v8-rollback/wrangler-promotion.json
          cd /tmp/fmi-v8-rollback
          "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" deploy --config wrangler-promotion.json
          cd "$GITHUB_WORKSPACE"
          python scripts/fmi_v8_predeploy.py
          cp fmi-v8-predeploy-readback.json fmi-v8-rollback-readback.json
          echo 'rollback_gate=VERIFIED'

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: musitu-fmi-v8-live-promotion-evidence
          path: |
            fmi-v8-predeploy-readback.json
            fmi-v8-live-promotion-evidence.json
            fmi-v8-live-promotion-evidence.sha256
            fmi-v8-rollback-readback.json
          if-no-files-found: warn
          retention-days: 30
