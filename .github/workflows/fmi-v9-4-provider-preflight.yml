name: MUSITU FMI V9.4 Provider Rights Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-rights-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_API: https://api.cloudflare.com/client/v4
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      FMI_EDGE: mft-fmi-global-edge
      FMI_ADAPTER: mft-fmi-modal-adapter
      FMI_BILLING: mft-fmi-billing
      FMI_DB_UUID: a03dc12d-8206-47be-b904-1f24e4e37d91
      FMI_MARKET_ROUTER: mft-fmi-market-router
      FMI_TWELVE_DATA_ADAPTER: mft-fmi-twelve-data-adapter
      TWELVE_DATA_LICENSE_AUTHORIZED: ${{ secrets.TWELVE_DATA_LICENSE_AUTHORIZED }}
      TWELVE_DATA_REDISTRIBUTION_AUTHORIZED: ${{ secrets.TWELVE_DATA_REDISTRIBUTION_AUTHORIZED }}
      TWELVE_DATA_EXTERNAL_API_AUTHORIZED: ${{ secrets.TWELVE_DATA_EXTERNAL_API_AUTHORIZED }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      TWELVE_DATA_ENTITLEMENT_LABEL: ${{ secrets.TWELVE_DATA_ENTITLEMENT_LABEL }}
      TWELVE_DATA_FRESHNESS_LABEL: ${{ secrets.TWELVE_DATA_FRESHNESS_LABEL }}
      TWELVE_DATA_RIGHTS_REFERENCE: ${{ secrets.TWELVE_DATA_RIGHTS_REFERENCE }}
      TWELVE_DATA_RIGHTS_EFFECTIVE_AT: ${{ secrets.TWELVE_DATA_RIGHTS_EFFECTIVE_AT }}
      TWELVE_DATA_RIGHTS_EXPIRES_AT: ${{ secrets.TWELVE_DATA_RIGHTS_EXPIRES_AT }}
      TWELVE_DATA_ALLOWED_MARKET_CLASSES: ${{ secrets.TWELVE_DATA_ALLOWED_MARKET_CLASSES }}
      TWELVE_DATA_MAX_RETENTION_SECONDS: ${{ secrets.TWELVE_DATA_MAX_RETENTION_SECONDS }}
      TWELVE_DATA_ATTRIBUTION_REQUIRED: ${{ secrets.TWELVE_DATA_ATTRIBUTION_REQUIRED }}
      TWELVE_DATA_ATTRIBUTION_TEXT: ${{ secrets.TWELVE_DATA_ATTRIBUTION_TEXT }}
      TWELVE_DATA_ATTRIBUTION_URL: ${{ secrets.TWELVE_DATA_ATTRIBUTION_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Require protected Cloudflare read authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_API_KEY"

      - name: Reconstruct and verify immutable V9.4 payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,pathlib,tarfile
          root=pathlib.Path('deploy_payload/fmi_v9_4_control')
          m=json.loads((root/'TRANSPORT_MANIFEST.json').read_text())
          parts=[]
          for row in m['chunks']:
              p=root/row['file']; b=p.read_bytes()
              if len(b)!=row['size'] or hashlib.sha256(b).hexdigest()!=row['sha256']:
                  raise SystemExit('Fail-closed V9.4 transport chunk mismatch: '+row['file'])
              parts.append(b)
          encoded=b''.join(parts)
          if len(encoded)!=m['base64_size'] or hashlib.sha256(encoded).hexdigest()!=m['base64_sha256']:
              raise SystemExit('Fail-closed V9.4 reconstructed Base64 transport mismatch')
          raw=base64.b64decode(encoded,validate=True)
          if len(raw)!=m['tar_gz_size'] or hashlib.sha256(raw).hexdigest()!=m['tar_gz_sha256']:
              raise SystemExit('Fail-closed V9.4 tar authority mismatch')
          tar_path=pathlib.Path('/tmp/fmi-v9-4-control.tar.gz'); tar_path.write_bytes(raw)
          out=pathlib.Path('/tmp/fmi-v9-4-runtime'); out.mkdir(parents=True,exist_ok=True)
          with tarfile.open(tar_path,'r:gz') as t:
              for member in t.getmembers():
                  q=(out/member.name).resolve()
                  if out.resolve() not in q.parents and q!=out.resolve():
                      raise SystemExit('Fail-closed unsafe tar path')
              t.extractall(out)
          inner=json.loads((out/'MANIFEST.json').read_text())
          if inner!=m['payload_manifest']:
              raise SystemExit('Fail-closed inner manifest mismatch')
          for row in inner['files']:
              p=out/row['path']; b=p.read_bytes()
              if len(b)!=row['size'] or hashlib.sha256(b).hexdigest()!=row['sha256']:
                  raise SystemExit('Fail-closed payload file mismatch: '+row['path'])
          print(json.dumps({'transport_gate':'PASS','tar_sha256':m['tar_gz_sha256'],'payload_files':len(inner['files'])},sort_keys=True))
          PY
          node --check /tmp/fmi-v9-4-runtime/edge/fmi-global/worker.js
          node --check /tmp/fmi-v9-4-runtime/edge/fmi-market-data/router.js
          node --check /tmp/fmi-v9-4-runtime/edge/fmi-market-data/providers/twelve-data-adapter.js

      - name: Verify V9.4 fail-closed control contracts offline
        shell: bash
        env:
          FMI_V94_PAYLOAD_ROOT: /tmp/fmi-v9-4-runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet 'pytest==8.4.2'
          python -m pytest -q tests/test_fmi_v9_4_provider_control.py
          python -m py_compile scripts/fmi_v9_4_provider_preflight.py scripts/fmi_v9_4_provider_promote.py

      - name: Execute read-only V9.4 provider rights preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fmi_v9_4_provider_preflight.py \
            --payload-root /tmp/fmi-v9-4-runtime \
            --output fmi-v9-4-provider-preflight.json

      - name: Enforce zero mutation and classify blockers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open('fmi-v9-4-provider-preflight.json'))
          if x.get('mutation_performed') is not False: raise SystemExit('Fail-closed mutation flag')
          if x.get('secret_values_logged') is not False: raise SystemExit('Fail-closed secret logging flag')
          blockers=x.get('blockers') or []
          non_rights=[b for b in blockers if not str(b).startswith('RIGHTS_GATE:')]
          if non_rights: raise SystemExit('Non-rights preflight blockers: '+repr(non_rights))
          summary={
            'gate':'V9_4_READ_ONLY_PREFLIGHT_PASS',
            'promotion_ready':x.get('promotion_ready'),
            'rights_blockers':blockers,
            'mutation_performed':False,
            'live_edge_sha256':x['live_readback']['edge_sha256'],
            'billing_sha256':x['live_readback']['billing_sha256'],
            'adapter_sha256':x['live_readback']['adapter_sha256'],
            'candidate_hashes':x.get('candidate_hashes'),
            'planned_workers':x.get('planned_workers'),
          }
          open('fmi-v9-4-preflight-summary.json','w').write(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: musitu-fmi-v9-4-provider-rights-preflight-evidence
          path: |
            fmi-v9-4-provider-preflight.json
            fmi-v9-4-preflight-summary.json
          if-no-files-found: warn
          retention-days: 30
