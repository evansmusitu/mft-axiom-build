name: MUSITU Foundry FORGE Config Rule Detail Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/foundry-forge-config-rule-detail-20260914.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      FORGE_HOST: forge.mftintelligence.com
    steps:
      - name: Read exact configuration ruleset authority
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone

          base=os.environ['CF_API']; zid=os.environ['ZONE_ID']; host=os.environ['FORGE_HOST']
          headers={
            'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],
            'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],
            'Content-Type':'application/json',
            'User-Agent':'MUSITU-Foundry-FORGE-Config-Rule-Audit/1.0',
          }
          def get(path):
            req=urllib.request.Request(base+path,headers=headers,method='GET')
            with urllib.request.urlopen(req,timeout=30) as r:
              body=json.load(r)
              if r.status != 200 or not body.get('success'):
                raise SystemExit('cloudflare_get_failed')
              return body.get('result') or {}

          security=get(f'/zones/{zid}/settings/security_level')
          config=get(f'/zones/{zid}/rulesets/phases/http_config_settings/entrypoint')
          rules=[]
          for rule in config.get('rules') or []:
            rules.append({
              'id':rule.get('id'),
              'ref':rule.get('ref'),
              'version':rule.get('version'),
              'last_updated':rule.get('last_updated'),
              'action':rule.get('action'),
              'action_parameters':rule.get('action_parameters'),
              'expression':rule.get('expression'),
              'description':rule.get('description'),
              'enabled':rule.get('enabled',True),
            })
          exact=[r for r in rules if host.lower() in str(r.get('expression') or '').lower() or 'forge' in str(r.get('ref') or '').lower() or 'forge' in str(r.get('description') or '').lower()]
          out={
            'schema':'musitu.foundry_forge.cloudflare_config_rule_authority.v1',
            'observed_at':datetime.now(timezone.utc).isoformat(),
            'zone_id':zid,
            'account_id':os.environ['ACCOUNT_ID'],
            'forge_host':host,
            'zone_security_level':security.get('value'),
            'ruleset':{
              'id':config.get('id'),
              'name':config.get('name'),
              'kind':config.get('kind'),
              'phase':config.get('phase'),
              'version':config.get('version'),
              'last_updated':config.get('last_updated'),
              'rule_count':len(rules),
            },
            'rules':rules,
            'forge_matching_rules':exact,
            'forge_matching_rule_count':len(exact),
            'write_performed':False,
            'production_authorized':False,
          }
          open('foundry-forge-config-rule-authority.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Seal authority evidence
        run: sha256sum foundry-forge-config-rule-authority.json > foundry-forge-config-rule-authority.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-foundry-forge-config-rule-authority-20260914
          path: |
            foundry-forge-config-rule-authority.json
            foundry-forge-config-rule-authority.sha256
          retention-days: 7
          if-no-files-found: error
