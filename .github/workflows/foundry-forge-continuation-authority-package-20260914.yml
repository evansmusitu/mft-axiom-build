name: MUSITU FOUNDRY FORGE Continuation Authority 20260914

on:
  push:
    branches:
      - foundry-forge-handoff-packager-20260914
    paths:
      - '.github/workflows/foundry-forge-continuation-authority-package-20260914.yml'
      - 'ops/package_foundry_forge_continuation_20260914.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Generate sealed continuation authority
        run: python ops/package_foundry_forge_continuation_20260914.py
      - name: Verify continuation authority
        run: |
          set -euo pipefail
          cd handoff
          python VERIFY_CONTINUATION.py
          test "$(wc -l < SHA256SUMS)" = 10
          test "$(stat -c %s 07_EXACT_NEW_CHAT_COMMAND.txt)" -gt 1000
          echo HANDOFF_CONTENT_GATE_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: MUSITU_FOUNDRY_FORGE_CONTINUATION_AUTHORITY_20260914_0815_AUTHORITATIVE
          path: handoff/
          retention-days: 90
          if-no-files-found: error
          compression-level: 9
