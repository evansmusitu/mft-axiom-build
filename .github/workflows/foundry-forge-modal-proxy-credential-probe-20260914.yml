name: MUSITU Foundry FORGE Modal Proxy Credential Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/foundry-forge-modal-proxy-credential-probe-20260914.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      WORKER_NAME: musitu-forge-edge
      PROTOCOL_DIGEST: c9fe2c0dcbc51ed7329aeea8b8d9985c0ccfc70123ac181c755285f1a0fbf3de
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Authenticate Modal workspace and read FORGE binding shape
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_API_KEY"
          python -m pip install --disable-pip-version-check --quiet 'modal>=1.5,<2'
          modal app list --json >/dev/null
          python - <<'PY'
          import hashlib,json,os,urllib.request
          h={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_API_KEY']}
          url=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/workers/scripts/{os.environ['WORKER_NAME']}/settings"
          q=urllib.request.Request(url,headers=h)
          with urllib.request.urlopen(q,timeout=30) as r:x=json.load(r)
          if not x.get('success'): raise SystemExit('cloudflare_settings_read_failed')
          rows=(x.get('result') or {}).get('bindings') or []
          by={b.get('name'):b for b in rows if isinstance(b,dict) and b.get('name')}
          required={'MODAL_ORIGIN','MODAL_KEY','MODAL_SECRET','FORGE_PROTOCOL_DIGEST'}
          missing=sorted(required-set(by))
          if missing: raise SystemExit('missing_required_bindings:'+','.join(missing))
          origin=by['MODAL_ORIGIN'].get('text') or by['MODAL_ORIGIN'].get('value')
          if not isinstance(origin,str) or not origin.startswith('https://'):
              raise SystemExit('modal_origin_not_readable_https_plaintext')
          if by['MODAL_KEY'].get('type') not in ('secret_text','secret') or by['MODAL_SECRET'].get('type') not in ('secret_text','secret'):
              raise SystemExit('modal_proxy_bindings_not_secret_text')
          open('/tmp/forge-modal-origin','w').write(origin)
          print(json.dumps({
            'modal_workspace_auth':'PASS',
            'binding_names':sorted(by),
            'modal_origin_scheme':'https',
            'modal_origin_sha256':hashlib.sha256(origin.encode()).hexdigest(),
            'modal_key_type':by['MODAL_KEY'].get('type'),
            'modal_secret_type':by['MODAL_SECRET'].get('type'),
            'write_performed':False,
          },sort_keys=True))
          PY

      - name: Create temporary proxy credential and prove existing FORGE origin
        shell: bash
        run: |
          set -euo pipefail
          modal workspace proxy-tokens create --json >/tmp/forge-proxy.json
          python - <<'PY'
          import json,pathlib
          obj=json.load(open('/tmp/forge-proxy.json')); vals=[]
          def walk(x):
              if isinstance(x,dict):
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
              elif isinstance(x,str): vals.append(x)
          walk(obj)
          keys=[x for x in vals if x.startswith('wk-')]
          secs=[x for x in vals if x.startswith('ws-')]
          if len(keys)!=1 or len(secs)!=1: raise SystemExit('proxy_token_shape_mismatch')
          pathlib.Path('/tmp/forge-proxy-key').write_text(keys[0])
          pathlib.Path('/tmp/forge-proxy-secret').write_text(secs[0])
          PY
          KEY="$(cat /tmp/forge-proxy-key)"; SECRET="$(cat /tmp/forge-proxy-secret)"
          echo "::add-mask::$KEY"; echo "::add-mask::$SECRET"
          echo 'TEMP_PROXY_CREATED=1' >> "$GITHUB_ENV"
          ORIGIN="$(cat /tmp/forge-modal-origin)"
          echo "::add-mask::$ORIGIN"
          code="$(curl -sS --max-time 30 -D /tmp/upstream.headers -o /tmp/upstream.body -w '%{http_code}' "$ORIGIN/v1/health" -H "Modal-Key: $KEY" -H "Modal-Secret: $SECRET" -H 'Accept: application/json' -H 'x-musitu-edge: forge-credential-probe-v1' || true)"
          python - <<'PY'
          import hashlib,json,os,pathlib
          code=int(os.environ['UPSTREAM_CODE'])
          raw=pathlib.Path('/tmp/upstream.body').read_bytes()
          payload=None
          try: payload=json.loads(raw)
          except Exception: pass
          expected_protocol=os.environ['PROTOCOL_DIGEST']
          contract=(
              code==200 and isinstance(payload,dict)
              and payload.get('schema')=='musitu.forge.health.v1'
              and payload.get('status')=='READY'
              and payload.get('protocol_digest')==expected_protocol
              and payload.get('custody_uploads_ready') is True
              and payload.get('production_authorized') is False
          )
          out={
            'schema':'musitu.foundry_forge.modal_proxy_credential_probe.v1',
            'fresh_proxy_credential_authorized':contract,
            'upstream_http_status':code,
            'upstream_body_sha256':hashlib.sha256(raw).hexdigest(),
            'upstream_body_size':len(raw),
            'health_contract_pass':contract,
            'production_authorized_claimed':False,
            'persistent_binding_changed':False,
          }
          pathlib.Path('foundry-forge-modal-proxy-credential-probe.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          if not contract: raise SystemExit('fresh_proxy_did_not_authorize_existing_forge_origin')
          PY
        env:
          UPSTREAM_CODE: ${{ env.UPSTREAM_CODE }}

      - name: Seal probe evidence
        if: ${{ success() }}
        run: sha256sum foundry-forge-modal-proxy-credential-probe.json > foundry-forge-modal-proxy-credential-probe.sha256

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: musitu-foundry-forge-modal-proxy-credential-probe-20260914
          path: |
            foundry-forge-modal-proxy-credential-probe.json
            foundry-forge-modal-proxy-credential-probe.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Revoke temporary proxy credential
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [ "${TEMP_PROXY_CREATED:-0}" = 1 ] && [ -s /tmp/forge-proxy-key ]; then
            KEY="$(cat /tmp/forge-proxy-key)"
            modal workspace proxy-tokens delete -y "$KEY" >/dev/null 2>&1 || true
          fi
          rm -f /tmp/forge-proxy.json /tmp/forge-proxy-key /tmp/forge-proxy-secret /tmp/forge-modal-origin /tmp/upstream.headers /tmp/upstream.body
