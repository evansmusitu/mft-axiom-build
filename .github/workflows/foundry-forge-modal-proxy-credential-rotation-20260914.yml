name: MUSITU Foundry FORGE Modal Proxy Credential Rotation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/foundry-forge-modal-proxy-credential-rotation-20260914.yml'

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      WORKER_NAME: musitu-forge-edge
      PUBLIC_ORIGIN: https://forge.mftintelligence.com
      EXPECTED_WORKER_SOURCE_SHA256: 76579eedd3736bbec43fee065c84ba9c553f982d36117c1cbe54a56671f12222
      EXPECTED_MODAL_ORIGIN_SHA256: 68d869d065ea4d4fee0e28fc65f862f5e5b24cc2b71088a7201185e3d9e723bd
      PROTOCOL_DIGEST: c9fe2c0dcbc51ed7329aeea8b8d9985c0ccfc70123ac181c755285f1a0fbf3de
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify exact deployed Worker and current stale-auth symptom
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_API_KEY"
          python - <<'PY'
          import hashlib,json,os,urllib.error,urllib.request
          from email.parser import BytesParser
          from email.policy import default

          h={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_API_KEY']}
          base=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/workers/scripts/{os.environ['WORKER_NAME']}"
          with urllib.request.urlopen(urllib.request.Request(base,headers=h),timeout=30) as r:
              raw=r.read(); ctype=r.headers.get('Content-Type','')
          candidates=[]
          if 'multipart/' in ctype.lower():
              msg=BytesParser(policy=default).parsebytes((f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw)
              for part in msg.iter_parts():
                  payload=part.get_payload(decode=True) or b''
                  name=part.get_param('name',header='content-disposition') or part.get_filename() or ''
                  ptype=part.get_content_type()
                  if ptype in ('application/javascript','text/javascript','application/typescript','text/plain') or name.endswith(('.js','.mjs','.ts')):
                      candidates.append(payload)
          else:
              candidates=[raw]
          if not candidates: raise SystemExit('worker_source_part_not_found')
          code=max(candidates,key=len)
          got=hashlib.sha256(code).hexdigest()
          if got != os.environ['EXPECTED_WORKER_SOURCE_SHA256']:
              raise SystemExit('precondition_worker_source_changed')

          with urllib.request.urlopen(urllib.request.Request(base+'/settings',headers=h),timeout=30) as r:x=json.load(r)
          if not x.get('success'): raise SystemExit('cloudflare_settings_read_failed')
          rows=(x.get('result') or {}).get('bindings') or []
          by={b.get('name'):b for b in rows if isinstance(b,dict) and b.get('name')}
          required={'FORGE_DB','FORGE_EDGE_RPM_LIMIT','FORGE_PROTOCOL_DIGEST','MODAL_KEY','MODAL_ORIGIN','MODAL_SECRET'}
          if required-set(by): raise SystemExit('precondition_binding_set_incomplete')
          origin=by['MODAL_ORIGIN'].get('text') or by['MODAL_ORIGIN'].get('value')
          if hashlib.sha256((origin or '').encode()).hexdigest()!=os.environ['EXPECTED_MODAL_ORIGIN_SHA256']:
              raise SystemExit('precondition_modal_origin_changed')
          if by['MODAL_KEY'].get('type') not in ('secret_text','secret') or by['MODAL_SECRET'].get('type') not in ('secret_text','secret'):
              raise SystemExit('precondition_proxy_binding_type_changed')
          print(json.dumps({'worker_source_sha256':got,'binding_names':sorted(by),'modal_origin_sha256':os.environ['EXPECTED_MODAL_ORIGIN_SHA256'],'preconditions':'PASS'},sort_keys=True))
          PY
          before="$(curl -sS --max-time 30 -o /tmp/public-before.body -w '%{http_code}' "$PUBLIC_ORIGIN/v1/health" || true)"
          test "$before" = 401 || { echo "Fail-closed: expected stale public health 401 before rotation, got $before" >&2; exit 1; }
          test "$(sha256sum /tmp/public-before.body | awk '{print $1}')" = 'f7eba6394f5bab21bc2ada46e6ee858b603f49f0497daf7ff84727d0c34d12ac'
          echo stale_proxy_symptom_confirmed=PASS

      - name: Create fresh persistent proxy credential and bind only MODAL_KEY/MODAL_SECRET
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          python -m pip install --disable-pip-version-check --quiet 'modal>=1.5,<2'
          npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@4.129.0 >/dev/null
          modal app list --json >/dev/null
          npx wrangler auth token --json >/tmp/cf-auth.json
          modal workspace proxy-tokens create --json >/tmp/forge-proxy.json
          python - <<'PY'
          import json,pathlib
          obj=json.load(open('/tmp/forge-proxy.json')); vals=[]
          def walk(x):
              if isinstance(x,dict):
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
              elif isinstance(x,str): vals.append(x)
          walk(obj)
          keys=[x for x in vals if x.startswith('wk-')]; secs=[x for x in vals if x.startswith('ws-')]
          if len(keys)!=1 or len(secs)!=1: raise SystemExit('proxy_token_shape_mismatch')
          pathlib.Path('/tmp/forge-proxy-key').write_text(keys[0]); pathlib.Path('/tmp/forge-proxy-secret').write_text(secs[0])
          PY
          KEY="$(cat /tmp/forge-proxy-key)"; SECRET="$(cat /tmp/forge-proxy-secret)"
          echo "::add-mask::$KEY"; echo "::add-mask::$SECRET"
          echo 'PERSIST_PROXY_CREATED=1' >> "$GITHUB_ENV"
          printf '%s' "$KEY" | npx wrangler secret put MODAL_KEY --name "$WORKER_NAME" >/dev/null
          printf '%s' "$SECRET" | npx wrangler secret put MODAL_SECRET --name "$WORKER_NAME" >/dev/null
          echo cloudflare_modal_proxy_secret_rotation=PASS

      - name: Verify public health contract after rotation
        shell: bash
        run: |
          set -euo pipefail
          code=0
          for i in $(seq 1 30); do
            code="$(curl -sS --max-time 30 -D /tmp/public-after.headers -o /tmp/public-after.body -w '%{http_code}' "$PUBLIC_ORIGIN/v1/health" -H 'Origin: https://mftintelligence.com' || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          export PUBLIC_HEALTH_CODE="$code"
          python - <<'PY'
          import hashlib,json,os,pathlib
          code=int(os.environ['PUBLIC_HEALTH_CODE']); raw=pathlib.Path('/tmp/public-after.body').read_bytes()
          try:x=json.loads(raw)
          except Exception: raise SystemExit('public_health_not_json')
          expected={
            'schema':'musitu.forge.health.v1',
            'status':'READY',
            'canonical_service_origin':os.environ['PUBLIC_ORIGIN'],
            'protocol_digest':os.environ['PROTOCOL_DIGEST'],
            'custody_uploads_ready':True,
            'production_authorized':False,
          }
          bad={k:(x.get(k),v) for k,v in expected.items() if x.get(k)!=v}
          if code!=200 or bad: raise SystemExit('public_health_contract_failed:'+repr({'status':code,'bad':bad}))
          hdr={}
          for line in pathlib.Path('/tmp/public-after.headers').read_text(errors='replace').splitlines():
            if ':' in line:
              k,v=line.split(':',1); hdr[k.strip().lower()]=v.strip()
          if hdr.get('access-control-allow-origin')!='https://mftintelligence.com': raise SystemExit('public_health_cors_origin_missing')
          if hdr.get('cache-control')!='no-store': raise SystemExit('public_health_cache_control_invalid')
          if hdr.get('x-content-type-options')!='nosniff': raise SystemExit('public_health_nosniff_invalid')
          if hdr.get('referrer-policy')!='no-referrer': raise SystemExit('public_health_referrer_policy_invalid')
          key_hash=hashlib.sha256(pathlib.Path('/tmp/forge-proxy-key').read_bytes()).hexdigest()
          out={
            'schema':'musitu.foundry_forge.modal_proxy_credential_rotation.v1',
            'worker_name':os.environ['WORKER_NAME'],
            'worker_source_sha256':os.environ['EXPECTED_WORKER_SOURCE_SHA256'],
            'modal_origin_sha256':os.environ['EXPECTED_MODAL_ORIGIN_SHA256'],
            'proxy_key_sha256':key_hash,
            'public_health_status':code,
            'public_health_body_sha256':hashlib.sha256(raw).hexdigest(),
            'public_health_contract_pass':True,
            'public_health_cors_pass':True,
            'source_changed':False,
            'origin_changed':False,
            'production_authorized':False,
            'write_performed':True,
            'changed_bindings':['MODAL_KEY','MODAL_SECRET'],
            'result':'PASS',
          }
          pathlib.Path('foundry-forge-modal-proxy-credential-rotation.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
          echo 'PERSIST_PROXY_RETAIN=1' >> "$GITHUB_ENV"

      - name: Seal rotation evidence
        run: sha256sum foundry-forge-modal-proxy-credential-rotation.json > foundry-forge-modal-proxy-credential-rotation.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-foundry-forge-modal-proxy-credential-rotation-20260914
          path: |
            foundry-forge-modal-proxy-credential-rotation.json
            foundry-forge-modal-proxy-credential-rotation.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Revoke newly created proxy only if rotation verification failed
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [ "${PERSIST_PROXY_CREATED:-0}" = 1 ] && [ "${PERSIST_PROXY_RETAIN:-0}" != 1 ] && [ -s /tmp/forge-proxy-key ]; then
            KEY="$(cat /tmp/forge-proxy-key)"
            modal workspace proxy-tokens delete -y "$KEY" >/dev/null 2>&1 || true
          fi
          rm -f /tmp/forge-proxy.json /tmp/forge-proxy-key /tmp/forge-proxy-secret /tmp/public-before.body /tmp/public-after.body /tmp/public-after.headers /tmp/cf-auth.json
