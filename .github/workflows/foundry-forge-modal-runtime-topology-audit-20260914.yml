name: MUSITU Foundry FORGE Modal Runtime Topology Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/foundry-forge-modal-runtime-topology-audit-20260914.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      TARGET_APP: musitu-forge-private-staging
      TARGET_FUNCTION: forge_authority
      TARGET_VOLUME: musitu-forge-state
      PUBLIC_ORIGIN: https://forge.mftintelligence.com
      CF_API: https://api.cloudflare.com/client/v4
      CF_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CF_WORKER_NAME: musitu-forge-edge
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Resolve exact Modal objects
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          python -m pip install --disable-pip-version-check --quiet 'modal>=1.5,<2'
          python - <<'PY'
          import json, modal, os, pathlib
          app=modal.App.lookup(os.environ['TARGET_APP'], create_if_missing=False)
          app_id=app.app_id
          if not isinstance(app_id,str) or not app_id.startswith('ap-'):
              raise SystemExit('target_app_id_missing')
          volume=modal.Volume.from_name(os.environ['TARGET_VOLUME'], create_if_missing=False)
          volume.hydrate()
          volume_id=volume.object_id
          if not isinstance(volume_id,str) or not volume_id.startswith('vo-'):
              raise SystemExit('target_volume_id_missing')
          pathlib.Path('/tmp/app-id').write_text(app_id)
          pathlib.Path('/tmp/topology-base.json').write_text(json.dumps({
              'schema':'musitu.foundry_forge.modal_runtime_topology_audit.v2',
              'target_app':os.environ['TARGET_APP'],
              'target_app_id':app_id,
              'target_volume':os.environ['TARGET_VOLUME'],
              'target_volume_id':volume_id,
              'workspace_inventory_read':False,
              'write_performed':False,
          },sort_keys=True))
          PY

      - name: Collect hashed edge/function and public-health diagnostics
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,modal,os,pathlib,ssl,urllib.error,urllib.request
          out={'edge_modal_origin_matches_live_function':False,'public_health_pass':False}
          try:
              fn_url=modal.Function.from_name(os.environ['TARGET_APP'],os.environ['TARGET_FUNCTION']).get_web_url()
              if not isinstance(fn_url,str) or not fn_url.startswith('https://'):
                  raise RuntimeError('modal_function_url_missing')
              fn_norm=fn_url.rstrip('/')
              out['live_function_origin_sha256']=hashlib.sha256(fn_norm.encode()).hexdigest()
              if not os.environ.get('CLOUDFLARE_EMAIL') or not os.environ.get('CLOUDFLARE_GLOBAL_API_KEY'):
                  raise RuntimeError('cloudflare_credentials_missing')
              settings=f"{os.environ['CF_API']}/accounts/{os.environ['CF_ACCOUNT_ID']}/workers/scripts/{os.environ['CF_WORKER_NAME']}/settings"
              headers={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY']}
              with urllib.request.urlopen(urllib.request.Request(settings,headers=headers),timeout=30) as response:
                  body=json.load(response)
              if not body.get('success'):
                  raise RuntimeError('cloudflare_settings_read_failed')
              matches=[]
              for binding in (body.get('result') or {}).get('bindings') or []:
                  if isinstance(binding,dict) and binding.get('name')=='MODAL_ORIGIN':
                      value=binding.get('text') if binding.get('text') is not None else binding.get('value')
                      if isinstance(value,str): matches.append(value.rstrip('/'))
              out['edge_modal_origin_binding_count']=len(matches)
              if len(matches)!=1:
                  raise RuntimeError('modal_origin_binding_count_invalid')
              out['edge_modal_origin_sha256']=hashlib.sha256(matches[0].encode()).hexdigest()
              out['edge_modal_origin_matches_live_function']=(matches[0]==fn_norm)
          except Exception as exc:
              out['edge_probe_error']=type(exc).__name__+':'+str(exc)

          try:
              ctx=ssl.create_default_context()
              req=urllib.request.Request(os.environ['PUBLIC_ORIGIN']+'/v1/health',headers={'Accept':'application/json','User-Agent':'MUSITU-FORGE-topology-audit/2'})
              with urllib.request.urlopen(req,context=ctx,timeout=30) as response:
                  raw=response.read(131073); status=response.status
              if len(raw)>131072: raise RuntimeError('health_response_too_large')
              health=json.loads(raw)
              out['public_health_status']=status
              out['public_health_body_sha256']=hashlib.sha256(raw).hexdigest()
              out['public_health']={k:health.get(k) for k in (
                  'schema','status','video_derivation_runtime_configured','field_dataset_admission_configured',
                  'expert_review_projection_configured','fault_episode_submission_configured','production_authorized')}
              out['public_health_pass']=(status==200 and health.get('schema')=='musitu.forge.health.v1' and health.get('status')=='READY' and health.get('production_authorized') is False)
          except Exception as exc:
              out['public_health_error']=type(exc).__name__+':'+str(exc)
          pathlib.Path('/tmp/connectivity.json').write_text(json.dumps(out,sort_keys=True))
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Resolve active container without aborting diagnostics
        shell: bash
        run: |
          set -uo pipefail
          APP_ID="$(cat /tmp/app-id)"
          if modal container list --app-id "$APP_ID" --json > /tmp/containers.json 2>/tmp/container-list.err; then
            python - <<'PY'
          import json,pathlib,re
          doc=json.load(open('/tmp/containers.json'))
          ids=[]
          def walk(v):
              if isinstance(v,str) and re.fullmatch(r'ta-[A-Za-z0-9_-]+',v):
                  if v not in ids: ids.append(v)
              elif isinstance(v,dict):
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(doc)
          out={'container_list_command_pass':True,'active_container_count':len(ids),'active_container_resolved':bool(ids)}
          if ids: pathlib.Path('/tmp/container-id').write_text(ids[0])
          pathlib.Path('/tmp/container-resolution.json').write_text(json.dumps(out,sort_keys=True))
          print(json.dumps(out,sort_keys=True))
          PY
          else
            python - <<'PY'
          import json,pathlib
          out={'container_list_command_pass':False,'active_container_count':0,'active_container_resolved':False}
          pathlib.Path('/tmp/container-resolution.json').write_text(json.dumps(out,sort_keys=True))
          print(json.dumps(out,sort_keys=True))
          PY
          fi

      - name: Probe selected runtime readiness if container is active
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -s /tmp/container-id ]; then
            printf '%s\n' '{"runtime_probe_executed":false,"runtime_probe_pass":false,"reason":"no_active_target_container"}' > /tmp/runtime-probe.json
            exit 0
          fi
          cat > /tmp/forge_probe.py <<'PY'
          import hashlib,json,os,pathlib
          names=[
              'FORGE_FIELD_DATASET_ROOT','FORGE_EXPERT_CREDENTIAL_CUSTODY_ROOT','FORGE_EXPERT_REVIEW_CUSTODY_ROOT',
              'FORGE_FAULT_EPISODE_ROOT','FORGE_VIDEO_DERIVATION_ROOT','FORGE_VIDEO_DERIVATION_ADAPTER_SHA256',
              'FORGE_FFMPEG_FILE','FORGE_FFMPEG_SHA256','FORGE_FFPROBE_FILE','FORGE_FFPROBE_SHA256',
          ]
          out={'runtime_probe_executed':True,'runtime_probe_pass':True,'selected_env':{},
               'persistent_mount_present':pathlib.Path('/var/lib/musitu-forge').is_dir(),
               'runtime_manifest_present':pathlib.Path('/opt/forge/runtime/FORGE_DEPLOY_RUNTIME_MANIFEST.json').is_file(),
               'media_candidates':[]}
          for name in names:
              value=os.environ.get(name,'').strip(); row={'configured':bool(value)}
              if name.endswith('_ROOT') and value:
                  path=pathlib.Path(value).expanduser(); text=str(path)
                  row.update({'is_dir':path.is_dir(),'under_persistent_mount':text=='/var/lib/musitu-forge' or text.startswith('/var/lib/musitu-forge/')})
              if name in ('FORGE_FFMPEG_FILE','FORGE_FFPROBE_FILE') and value:
                  path=pathlib.Path(value).expanduser(); row['is_file']=path.is_file()
                  if path.is_file(): row.update({'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'size_bytes':path.stat().st_size})
              out['selected_env'][name]=row
          seen=set(); candidates=[pathlib.Path('/usr/bin/ffmpeg'),pathlib.Path('/usr/bin/ffprobe')]
          runtime=pathlib.Path('/opt/forge/runtime')
          if runtime.is_dir(): candidates += list(runtime.rglob('ffmpeg')) + list(runtime.rglob('ffprobe'))
          for path in candidates:
              try:
                  if path.is_file():
                      digest=hashlib.sha256(path.read_bytes()).hexdigest(); key=(path.name,digest,path.stat().st_size)
                      if key not in seen:
                          seen.add(key); out['media_candidates'].append({'name':path.name,'sha256':digest,'size_bytes':path.stat().st_size})
              except Exception: pass
          print('FORGE_RUNTIME_PROBE_JSON='+json.dumps(out,sort_keys=True))
          PY
          PROBE_B64="$(base64 -w0 /tmp/forge_probe.py)"
          CID="$(cat /tmp/container-id)"
          if modal container exec --no-pty "$CID" python3 -c "import base64;exec(base64.b64decode('$PROBE_B64'))" > /tmp/container-probe.log 2>/tmp/container-probe.err; then
            grep '^FORGE_RUNTIME_PROBE_JSON=' /tmp/container-probe.log | tail -1 | sed 's/^FORGE_RUNTIME_PROBE_JSON=//' > /tmp/runtime-probe.json
            if [ ! -s /tmp/runtime-probe.json ]; then printf '%s\n' '{"runtime_probe_executed":true,"runtime_probe_pass":false,"reason":"probe_output_missing"}' > /tmp/runtime-probe.json; fi
          else
            printf '%s\n' '{"runtime_probe_executed":true,"runtime_probe_pass":false,"reason":"container_exec_failed"}' > /tmp/runtime-probe.json
          fi
          cat /tmp/runtime-probe.json

      - name: Seal diagnostics before verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          def load(path,default):
              try:return json.loads(pathlib.Path(path).read_text())
              except Exception:return default
          base=load('/tmp/topology-base.json',{'schema':'musitu.foundry_forge.modal_runtime_topology_audit.v2','write_performed':False})
          connectivity=load('/tmp/connectivity.json',{})
          containers=load('/tmp/container-resolution.json',{})
          runtime=load('/tmp/runtime-probe.json',{})
          strict_pass=bool(connectivity.get('edge_modal_origin_matches_live_function') and connectivity.get('public_health_pass') and containers.get('active_container_resolved') and runtime.get('runtime_probe_pass'))
          out={**base,'connectivity':connectivity,'container_resolution':containers,'runtime_probe':runtime,'strict_topology_audit_pass':strict_pass,'result':'PASS' if strict_pass else 'DIAGNOSTIC_FAILURE'}
          pathlib.Path('foundry-forge-modal-runtime-topology-audit.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum foundry-forge-modal-runtime-topology-audit.json > foundry-forge-modal-runtime-topology-audit.sha256

      - name: Upload topology diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-foundry-forge-modal-runtime-topology-audit-20260914
          path: |
            foundry-forge-modal-runtime-topology-audit.json
            foundry-forge-modal-runtime-topology-audit.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Enforce strict topology verdict
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          x=json.load(open('foundry-forge-modal-runtime-topology-audit.json'))
          if x.get('strict_topology_audit_pass') is not True:
              raise SystemExit('strict_topology_audit_not_passed')
          print('STRICT_TOPOLOGY_AUDIT_PASS')
          PY
