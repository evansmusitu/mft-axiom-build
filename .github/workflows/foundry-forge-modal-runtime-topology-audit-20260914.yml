name: MUSITU Foundry FORGE Modal Runtime Topology Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/foundry-forge-modal-runtime-topology-audit-20260914.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      TARGET_APP: musitu-forge-private-staging
      TARGET_FUNCTION: forge_authority
      TARGET_VOLUME: musitu-forge-state
      PUBLIC_ORIGIN: https://forge.mftintelligence.com
      CF_API: https://api.cloudflare.com/client/v4
      CF_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CF_WORKER_NAME: musitu-forge-edge
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Modal CLI and resolve exact objects through SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          python -m pip install --disable-pip-version-check --quiet 'modal>=1.5,<2'
          python - <<'PY'
          import json, modal, os, pathlib
          app=modal.App.lookup(os.environ['TARGET_APP'], create_if_missing=False)
          app_id=app.app_id
          if not isinstance(app_id,str) or not app_id.startswith('ap-'):
              raise SystemExit('target_app_id_missing')
          volume=modal.Volume.from_name(os.environ['TARGET_VOLUME'], create_if_missing=False)
          volume.hydrate()
          volume_id=volume.object_id
          if not isinstance(volume_id,str) or not volume_id.startswith('vo-'):
              raise SystemExit('target_volume_id_missing')
          pathlib.Path('/tmp/app-id').write_text(app_id)
          safe={
              'schema':'musitu.foundry_forge.modal_runtime_topology_audit.v1',
              'target_app':os.environ['TARGET_APP'],
              'target_app_id':app_id,
              'target_volume':os.environ['TARGET_VOLUME'],
              'target_volume_id':volume_id,
              'workspace_inventory_read':False,
              'write_performed':False,
          }
          pathlib.Path('/tmp/topology-base.json').write_text(json.dumps(safe, sort_keys=True))
          print(json.dumps(safe, sort_keys=True))
          PY

      - name: Prove Cloudflare edge points to this exact Modal function and wake service
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_GLOBAL_API_KEY"
          python - <<'PY'
          import hashlib, json, modal, os, pathlib, urllib.request
          fn_url=modal.Function.from_name(os.environ['TARGET_APP'], os.environ['TARGET_FUNCTION']).get_web_url()
          if not isinstance(fn_url,str) or not fn_url.startswith('https://'):
              raise SystemExit('modal_function_url_missing')
          settings=f"{os.environ['CF_API']}/accounts/{os.environ['CF_ACCOUNT_ID']}/workers/scripts/{os.environ['CF_WORKER_NAME']}/settings"
          headers={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY']}
          with urllib.request.urlopen(urllib.request.Request(settings,headers=headers),timeout=30) as response:
              body=json.load(response)
          if not body.get('success'):
              raise SystemExit('cloudflare_settings_read_failed')
          matches=[]
          for binding in (body.get('result') or {}).get('bindings') or []:
              if isinstance(binding,dict) and binding.get('name')=='MODAL_ORIGIN':
                  value=binding.get('text') if binding.get('text') is not None else binding.get('value')
                  if isinstance(value,str): matches.append(value)
          if len(matches)!=1:
              raise SystemExit(f'modal_origin_binding_count_{len(matches)}')
          modal_norm=fn_url.rstrip('/')
          edge_norm=matches[0].rstrip('/')
          if modal_norm != edge_norm:
              raise SystemExit('cloudflare_modal_origin_does_not_match_live_function')
          digest=hashlib.sha256(modal_norm.encode()).hexdigest()
          pathlib.Path('/tmp/modal-origin-sha').write_text(digest)
          print(json.dumps({'edge_modal_origin_matches_live_function':True,'normalized_modal_origin_sha256':digest},sort_keys=True))
          PY
          curl --fail --silent --show-error --max-time 30 "$PUBLIC_ORIGIN/v1/health" > /tmp/public-health.json
          python - <<'PY'
          import json
          h=json.load(open('/tmp/public-health.json'))
          if h.get('schema') != 'musitu.forge.health.v1' or h.get('status') != 'READY':
              raise SystemExit('public_health_not_ready')
          if h.get('production_authorized') is not False:
              raise SystemExit('production_authorization_boundary_changed')
          print('PUBLIC_FORGE_WAKE_PASS')
          PY

      - name: Resolve active FORGE container
        shell: bash
        run: |
          set -euo pipefail
          APP_ID="$(cat /tmp/app-id)"
          modal container list --app-id "$APP_ID" --json > /tmp/containers.json
          python - <<'PY'
          import json, pathlib, re
          doc=json.load(open('/tmp/containers.json'))
          found=[]
          def walk(value):
              if isinstance(value, str) and re.fullmatch(r'ta-[A-Za-z0-9_-]+', value):
                  if value not in found:
                      found.append(value)
              elif isinstance(value, dict):
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(doc)
          if not found:
              raise SystemExit('active_forge_container_not_found_after_wake')
          pathlib.Path('/tmp/container-id').write_text(found[0])
          print('FORGE_CONTAINER_RESOLVED=true')
          PY

      - name: Inspect selected runtime readiness only
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/forge_probe.py <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          names=[
              'FORGE_FIELD_DATASET_ROOT',
              'FORGE_EXPERT_CREDENTIAL_CUSTODY_ROOT',
              'FORGE_EXPERT_REVIEW_CUSTODY_ROOT',
              'FORGE_FAULT_EPISODE_ROOT',
              'FORGE_VIDEO_DERIVATION_ROOT',
              'FORGE_VIDEO_DERIVATION_ADAPTER_SHA256',
              'FORGE_FFMPEG_FILE',
              'FORGE_FFMPEG_SHA256',
              'FORGE_FFPROBE_FILE',
              'FORGE_FFPROBE_SHA256',
          ]
          out={
              'selected_env':{},
              'persistent_mount_present':pathlib.Path('/var/lib/musitu-forge').is_dir(),
              'runtime_manifest_present':pathlib.Path('/opt/forge/runtime/FORGE_DEPLOY_RUNTIME_MANIFEST.json').is_file(),
              'media_candidates':[],
          }
          for name in names:
              value=os.environ.get(name, '').strip()
              row={'configured':bool(value)}
              if name.endswith('_ROOT') and value:
                  path=pathlib.Path(value).expanduser()
                  text=str(path)
                  row.update({
                      'is_dir':path.is_dir(),
                      'under_persistent_mount':text == '/var/lib/musitu-forge' or text.startswith('/var/lib/musitu-forge/'),
                  })
              if name in ('FORGE_FFMPEG_FILE','FORGE_FFPROBE_FILE') and value:
                  path=pathlib.Path(value).expanduser()
                  row['is_file']=path.is_file()
                  if path.is_file():
                      row.update({'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'size_bytes':path.stat().st_size})
              out['selected_env'][name]=row

          seen=set()
          candidates=[pathlib.Path('/usr/bin/ffmpeg'),pathlib.Path('/usr/bin/ffprobe')]
          runtime=pathlib.Path('/opt/forge/runtime')
          if runtime.is_dir():
              candidates += list(runtime.rglob('ffmpeg')) + list(runtime.rglob('ffprobe'))
          for path in candidates:
              try:
                  if path.is_file():
                      digest=hashlib.sha256(path.read_bytes()).hexdigest()
                      key=(path.name,digest,path.stat().st_size)
                      if key not in seen:
                          seen.add(key)
                          out['media_candidates'].append({'name':path.name,'sha256':digest,'size_bytes':path.stat().st_size})
              except Exception:
                  pass
          print('FORGE_RUNTIME_PROBE_JSON='+json.dumps(out, sort_keys=True))
          PY
          PROBE_B64="$(base64 -w0 /tmp/forge_probe.py)"
          CID="$(cat /tmp/container-id)"
          modal container exec --no-pty "$CID" python3 -c "import base64;exec(base64.b64decode('$PROBE_B64'))" | tee /tmp/container-probe.log
          grep '^FORGE_RUNTIME_PROBE_JSON=' /tmp/container-probe.log | tail -1 | sed 's/^FORGE_RUNTIME_PROBE_JSON=//' > /tmp/runtime-probe.json
          python - <<'PY'
          import json
          probe=json.load(open('/tmp/runtime-probe.json'))
          if not probe.get('persistent_mount_present'):
              raise SystemExit('persistent_mount_missing')
          if not probe.get('runtime_manifest_present'):
              raise SystemExit('runtime_manifest_missing')
          print(json.dumps(probe, sort_keys=True))
          PY

      - name: Seal safe topology evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          base=json.load(open('/tmp/topology-base.json'))
          probe=json.load(open('/tmp/runtime-probe.json'))
          health=json.load(open('/tmp/public-health.json'))
          out={**base,
              'normalized_modal_origin_sha256':pathlib.Path('/tmp/modal-origin-sha').read_text().strip(),
              'edge_modal_origin_matches_live_function':True,
              'persistent_mount_present':probe['persistent_mount_present'],
              'runtime_manifest_present':probe['runtime_manifest_present'],
              'selected_env':probe['selected_env'],
              'media_candidates':probe['media_candidates'],
              'public_health':{
                  'schema':health.get('schema'),
                  'status':health.get('status'),
                  'video_derivation_runtime_configured':health.get('video_derivation_runtime_configured'),
                  'field_dataset_admission_configured':health.get('field_dataset_admission_configured'),
                  'expert_review_projection_configured':health.get('expert_review_projection_configured'),
                  'fault_episode_submission_configured':health.get('fault_episode_submission_configured'),
                  'production_authorized':health.get('production_authorized'),
              },
              'result':'PASS',
          }
          pathlib.Path('foundry-forge-modal-runtime-topology-audit.json').write_text(json.dumps(out, indent=2, sort_keys=True)+'\n')
          PY
          sha256sum foundry-forge-modal-runtime-topology-audit.json > foundry-forge-modal-runtime-topology-audit.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-foundry-forge-modal-runtime-topology-audit-20260914
          path: |
            foundry-forge-modal-runtime-topology-audit.json
            foundry-forge-modal-runtime-topology-audit.sha256
          retention-days: 14
          if-no-files-found: error
