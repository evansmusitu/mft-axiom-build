name: MUSITU Foundry FORGE Modal Namespace Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/foundry-forge-modal-runtime-topology-audit-20260914.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      TARGET_APP: musitu-forge-private-staging
      TARGET_FUNCTION: forge_authority
      TARGET_VOLUME: musitu-forge-state
      PUBLIC_ORIGIN: https://forge.mftintelligence.com
      CF_API: https://api.cloudflare.com/client/v4
      CF_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CF_WORKER_NAME: musitu-forge-edge
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Modal client
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          python -m pip install --disable-pip-version-check --quiet 'modal>=1.5,<2'

      - name: Read current Cloudflare origin and public contract independently
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,ssl,urllib.request
          test_email=os.environ.get('CLOUDFLARE_EMAIL','')
          test_key=os.environ.get('CLOUDFLARE_GLOBAL_API_KEY','')
          if not test_email or not test_key: raise SystemExit('cloudflare_credentials_missing')
          settings=f"{os.environ['CF_API']}/accounts/{os.environ['CF_ACCOUNT_ID']}/workers/scripts/{os.environ['CF_WORKER_NAME']}/settings"
          headers={'X-Auth-Email':test_email,'X-Auth-Key':test_key}
          with urllib.request.urlopen(urllib.request.Request(settings,headers=headers),timeout=30) as response:
              body=json.load(response)
          if not body.get('success'): raise SystemExit('cloudflare_settings_read_failed')
          vals=[]
          for b in (body.get('result') or {}).get('bindings') or []:
              if isinstance(b,dict) and b.get('name')=='MODAL_ORIGIN':
                  value=b.get('text') if b.get('text') is not None else b.get('value')
                  if isinstance(value,str): vals.append(value.rstrip('/'))
          if len(vals)!=1: raise SystemExit(f'modal_origin_binding_count_{len(vals)}')
          pathlib.Path('/tmp/edge-origin').write_text(vals[0])
          edge_hash=hashlib.sha256(vals[0].encode()).hexdigest()
          req=urllib.request.Request(os.environ['PUBLIC_ORIGIN']+'/v1/health',headers={'Accept':'application/json','User-Agent':'MUSITU-FORGE-namespace-audit/1'})
          with urllib.request.urlopen(req,context=ssl.create_default_context(),timeout=30) as response:
              raw=response.read(131073); status=response.status
          if len(raw)>131072: raise SystemExit('public_health_too_large')
          h=json.loads(raw)
          public_ok=(status==200 and h.get('schema')=='musitu.forge.health.v1' and h.get('status')=='READY' and h.get('production_authorized') is False)
          if not public_ok: raise SystemExit('public_health_contract_failed')
          out={'edge_origin_sha256':edge_hash,'public_health_status':status,'public_health_body_sha256':hashlib.sha256(raw).hexdigest(),'public_health_contract_pass':True,'public_capability_flags':{k:h.get(k) for k in ('video_derivation_runtime_configured','field_dataset_admission_configured','expert_review_projection_configured','fault_episode_submission_configured','production_authorized')}}
          pathlib.Path('/tmp/edge-public.json').write_text(json.dumps(out,sort_keys=True))
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Discover exact Modal environment containing live function
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,modal,os,pathlib
          edge=pathlib.Path('/tmp/edge-origin').read_text().strip().rstrip('/')
          envs=modal.Environment.objects.list()
          checked=[]; matches=[]; app_hits=[]
          for obj in envs:
              name=getattr(obj,'name',None)
              if callable(name): name=name()
              if not isinstance(name,str) or not name: continue
              row={'environment':name,'app_present':False,'function_present':False,'origin_matches_edge':False}
              try:
                  app=modal.App.lookup(os.environ['TARGET_APP'],environment_name=name,create_if_missing=False)
                  aid=app.app_id
                  if isinstance(aid,str) and aid.startswith('ap-'):
                      row['app_present']=True; row['app_id']=aid; app_hits.append(name)
              except Exception as exc:
                  row['app_lookup_error_type']=type(exc).__name__
                  checked.append(row); continue
              try:
                  url=modal.Function.from_name(os.environ['TARGET_APP'],os.environ['TARGET_FUNCTION'],environment_name=name).get_web_url()
                  if isinstance(url,str) and url.startswith('https://'):
                      norm=url.rstrip('/'); row['function_present']=True; row['function_origin_sha256']=hashlib.sha256(norm.encode()).hexdigest(); row['origin_matches_edge']=(norm==edge)
                      if row['origin_matches_edge']: matches.append(name)
              except Exception as exc:
                  row['function_lookup_error_type']=type(exc).__name__
              checked.append(row)
          out={'environment_count':len(envs),'target_app_environment_count':len(app_hits),'live_function_match_count':len(matches),'live_function_environment':matches[0] if len(matches)==1 else None,'environments':checked}
          pathlib.Path('/tmp/environment-scan.json').write_text(json.dumps(out,sort_keys=True))
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Inspect deployment history only for environments containing target app
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,subprocess
          scan=json.load(open('/tmp/environment-scan.json'))
          result=[]
          for row in scan.get('environments',[]):
              if not row.get('app_present'): continue
              env=row['environment']
              p=subprocess.run(['modal','app','history','musitu-forge-private-staging','--env',env,'--json'],capture_output=True,text=True)
              safe={'environment':env,'history_command_rc':p.returncode,'history_stdout_sha256':None,'candidate_versions':[]}
              import hashlib
              safe['history_stdout_sha256']=hashlib.sha256(p.stdout.encode()).hexdigest()
              if p.returncode==0:
                  try:
                      doc=json.loads(p.stdout)
                      versions=[]
                      def walk(v,key=''):
                          if isinstance(v,dict):
                              for k,x in v.items():
                                  lk=k.lower()
                                  if isinstance(x,int) and ('version' in lk or lk in ('revision','revision_number')): versions.append(x)
                                  walk(x,k)
                          elif isinstance(v,list):
                              for x in v: walk(x,key)
                      walk(doc)
                      safe['candidate_versions']=sorted(set(versions))
                      safe['history_json_type']=type(doc).__name__
                      safe['history_entry_count']=len(doc) if isinstance(doc,list) else None
                  except Exception as exc: safe['history_parse_error_type']=type(exc).__name__
              else:
                  safe['history_error_sha256']=hashlib.sha256(p.stderr.encode()).hexdigest()
              result.append(safe)
          pathlib.Path('/tmp/history-scan.json').write_text(json.dumps({'app_histories':result},sort_keys=True))
          print(pathlib.Path('/tmp/history-scan.json').read_text())
          PY

      - name: Resolve active container and classify exec behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,subprocess,re,hashlib
          scan=json.load(open('/tmp/environment-scan.json'))
          rows=[]
          for envrow in scan.get('environments',[]):
              if not envrow.get('app_present'): continue
              env=envrow['environment']; aid=envrow['app_id']
              p=subprocess.run(['modal','container','list','--app-id',aid,'--env',env,'--json'],capture_output=True,text=True)
              item={'environment':env,'list_rc':p.returncode,'container_count':0,'exec_true_pass':False}
              if p.returncode==0:
                  try:
                      doc=json.loads(p.stdout); ids=[]
                      def walk(v):
                          if isinstance(v,str) and re.fullmatch(r'ta-[A-Za-z0-9_-]+',v):
                              if v not in ids: ids.append(v)
                          elif isinstance(v,dict):
                              for x in v.values(): walk(x)
                          elif isinstance(v,list):
                              for x in v: walk(x)
                      walk(doc); item['container_count']=len(ids)
                      if ids:
                          q=subprocess.run(['modal','container','exec','--no-pty',ids[0],'/bin/true'],capture_output=True,text=True)
                          item['exec_true_pass']=(q.returncode==0); item['exec_rc']=q.returncode; item['exec_stderr_sha256']=hashlib.sha256(q.stderr.encode()).hexdigest()
                          low=q.stderr.lower()
                          categories=[]
                          for token in ('not found','permission','forbidden','stopped','terminated','not running','sandbox','function','container'):
                              if token in low: categories.append(token.replace(' ','_'))
                          item['exec_error_categories']=categories
                  except Exception as exc: item['parse_error_type']=type(exc).__name__
              else: item['list_stderr_sha256']=hashlib.sha256(p.stderr.encode()).hexdigest()
              rows.append(item)
          pathlib.Path('/tmp/container-scan.json').write_text(json.dumps({'app_container_scans':rows},sort_keys=True))
          print(pathlib.Path('/tmp/container-scan.json').read_text())
          PY

      - name: Seal namespace diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          def load(p,d):
              try:return json.loads(pathlib.Path(p).read_text())
              except Exception:return d
          out={'schema':'musitu.foundry_forge.modal_namespace_audit.v1','write_performed':False,'edge_public':load('/tmp/edge-public.json',{}),'environment_scan':load('/tmp/environment-scan.json',{}),'history_scan':load('/tmp/history-scan.json',{}),'container_scan':load('/tmp/container-scan.json',{})}
          out['live_namespace_resolved']=bool(out['environment_scan'].get('live_function_match_count')==1)
          out['result']='PASS' if out['live_namespace_resolved'] else 'DIAGNOSTIC_FAILURE'
          pathlib.Path('foundry-forge-modal-namespace-audit.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum foundry-forge-modal-namespace-audit.json > foundry-forge-modal-namespace-audit.sha256

      - name: Upload namespace diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-foundry-forge-modal-namespace-audit-20260914
          path: |
            foundry-forge-modal-namespace-audit.json
            foundry-forge-modal-namespace-audit.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Enforce namespace verdict
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          x=json.load(open('foundry-forge-modal-namespace-audit.json'))
          if x.get('live_namespace_resolved') is not True: raise SystemExit('live_modal_namespace_not_resolved')
          print('LIVE_MODAL_NAMESPACE_RESOLVED')
          PY
