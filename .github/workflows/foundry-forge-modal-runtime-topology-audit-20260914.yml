name: MUSITU Foundry FORGE Modal Runtime Topology Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/foundry-forge-modal-runtime-topology-audit-20260914.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      TARGET_APP: musitu-forge-private-staging
      TARGET_FUNCTION: forge_authority
      TARGET_VOLUME: musitu-forge-state
      PUBLIC_ORIGIN: https://forge.mftintelligence.com
      EXPECTED_MODAL_ORIGIN_SHA256: 68d869d065ea4d4fee0e28fc65f862f5e5b24cc2b71088a7201185e3d9e723bd
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Modal CLI and authenticate read-only probe
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          python -m pip install --disable-pip-version-check --quiet 'modal>=1.5,<2'
          modal app list --json > /tmp/apps.json
          modal volume list --json > /tmp/volumes.json

      - name: Resolve exact FORGE app and persistent volume without exposing workspace inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, re

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)

          def exact_record(doc, target):
              candidates=[]
              for row in walk(doc):
                  direct=[v for v in row.values() if isinstance(v,str)]
                  if target in direct:
                      candidates.append(row)
              if len(candidates) != 1:
                  raise SystemExit(f'exact_record_count_{target}_{len(candidates)}')
              return candidates[0]

          def first_prefixed(value, prefix):
              if isinstance(value,str) and value.startswith(prefix): return value
              if isinstance(value,dict):
                  for child in value.values():
                      hit=first_prefixed(child,prefix)
                      if hit: return hit
              if isinstance(value,list):
                  for child in value:
                      hit=first_prefixed(child,prefix)
                      if hit: return hit
              return None

          apps=json.load(open('/tmp/apps.json'))
          volumes=json.load(open('/tmp/volumes.json'))
          app=exact_record(apps,os.environ['TARGET_APP'])
          volume=exact_record(volumes,os.environ['TARGET_VOLUME'])
          app_id=first_prefixed(app,'ap-')
          volume_id=first_prefixed(volume,'vo-')
          if not app_id: raise SystemExit('target_app_id_not_found')
          if not volume_id: raise SystemExit('target_volume_id_not_found')
          pathlib.Path('/tmp/app-id').write_text(app_id)
          safe={
            'schema':'musitu.foundry_forge.modal_runtime_topology_audit.v1',
            'target_app':os.environ['TARGET_APP'],
            'target_app_id':app_id,
            'target_volume':os.environ['TARGET_VOLUME'],
            'target_volume_id':volume_id,
            'workspace_inventory_disclosed':False,
            'write_performed':False,
          }
          pathlib.Path('/tmp/topology-base.json').write_text(json.dumps(safe,sort_keys=True))
          print(json.dumps(safe,sort_keys=True))
          PY

      - name: Verify exact Modal origin identity and wake live FORGE container
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, modal, os, pathlib
          url=modal.Function.from_name(os.environ['TARGET_APP'],os.environ['TARGET_FUNCTION']).get_web_url()
          if not isinstance(url,str) or not url.startswith('https://'):
              raise SystemExit('modal_function_url_missing')
          digest=hashlib.sha256(url.encode()).hexdigest()
          if digest != os.environ['EXPECTED_MODAL_ORIGIN_SHA256']:
              raise SystemExit('modal_origin_identity_mismatch')
          pathlib.Path('/tmp/modal-origin-sha').write_text(digest)
          print(json.dumps({'modal_origin_sha256':digest,'modal_origin_matches_v46':True},sort_keys=True))
          PY
          curl --fail --silent --show-error --max-time 30 "$PUBLIC_ORIGIN/v1/health" > /tmp/public-health.json
          python - <<'PY'
          import json
          h=json.load(open('/tmp/public-health.json'))
          if h.get('schema')!='musitu.forge.health.v1' or h.get('status')!='READY': raise SystemExit('public_health_not_ready')
          if h.get('production_authorized') is not False: raise SystemExit('production_authorization_boundary_changed')
          print('PUBLIC_FORGE_WAKE_PASS')
          PY

      - name: Inspect selected runtime readiness only
        shell: bash
        run: |
          set -euo pipefail
          APP_ID="$(cat /tmp/app-id)"
          modal container list --app-id "$APP_ID" --json > /tmp/containers.json
          python - <<'PY'
          import json,pathlib,re
          doc=json.load(open('/tmp/containers.json'))
          found=[]
          def walk(v):
              if isinstance(v,str):
                  if re.fullmatch(r'ta-[A-Za-z0-9_-]+',v): found.append(v)
              elif isinstance(v,dict):
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(doc)
          ids=[]
          for x in found:
              if x not in ids: ids.append(x)
          if not ids: raise SystemExit('active_forge_container_not_found_after_wake')
          pathlib.Path('/tmp/container-id').write_text(ids[0])
          print('FORGE_CONTAINER_RESOLVED=true')
          PY
          CID="$(cat /tmp/container-id)"
          modal container exec --no-pty "$CID" python3 -c 'import hashlib,json,os,pathlib; names=["FORGE_FIELD_DATASET_ROOT","FORGE_EXPERT_CREDENTIAL_CUSTODY_ROOT","FORGE_EXPERT_REVIEW_CUSTODY_ROOT","FORGE_FAULT_EPISODE_ROOT","FORGE_VIDEO_DERIVATION_ROOT","FORGE_VIDEO_DERIVATION_ADAPTER_SHA256","FORGE_FFMPEG_FILE","FORGE_FFMPEG_SHA256","FORGE_FFPROBE_FILE","FORGE_FFPROBE_SHA256"]; out={"selected_env":{},"persistent_mount_present":pathlib.Path("/var/lib/musitu-forge").is_dir(),"runtime_manifest_present":pathlib.Path("/opt/forge/runtime/FORGE_DEPLOY_RUNTIME_MANIFEST.json").is_file(),"media_candidates":[]};
for n in names:
 v=os.environ.get(n,"").strip(); row={"configured":bool(v)};
 if n.endswith("_ROOT") and v:
  p=pathlib.Path(v).expanduser(); row.update({"is_dir":p.is_dir(),"under_persistent_mount":str(p).startswith("/var/lib/musitu-forge/") or str(p)=="/var/lib/musitu-forge"});
 if n in ("FORGE_FFMPEG_FILE","FORGE_FFPROBE_FILE") and v:
  p=pathlib.Path(v).expanduser(); row["is_file"]=p.is_file();
  if p.is_file(): row.update({"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"size_bytes":p.stat().st_size});
 out["selected_env"][n]=row;
seen=set();
for p in [pathlib.Path("/usr/bin/ffmpeg"),pathlib.Path("/usr/bin/ffprobe")]+list(pathlib.Path("/opt/forge/runtime").rglob("ffmpeg"))+list(pathlib.Path("/opt/forge/runtime").rglob("ffprobe")):
 try:
  if p.is_file():
   h=hashlib.sha256(p.read_bytes()).hexdigest(); k=(p.name,h,p.stat().st_size);
   if k not in seen: seen.add(k); out["media_candidates"].append({"name":p.name,"sha256":h,"size_bytes":p.stat().st_size})
 except Exception: pass
print("FORGE_RUNTIME_PROBE_JSON="+json.dumps(out,sort_keys=True))' | tee /tmp/container-probe.log
          grep '^FORGE_RUNTIME_PROBE_JSON=' /tmp/container-probe.log | tail -1 | sed 's/^FORGE_RUNTIME_PROBE_JSON=//' > /tmp/runtime-probe.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/runtime-probe.json'))
          if not p.get('persistent_mount_present'): raise SystemExit('persistent_mount_missing')
          if not p.get('runtime_manifest_present'): raise SystemExit('runtime_manifest_missing')
          print(json.dumps(p,sort_keys=True))
          PY

      - name: Seal safe topology evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          base=json.load(open('/tmp/topology-base.json'))
          probe=json.load(open('/tmp/runtime-probe.json'))
          health=json.load(open('/tmp/public-health.json'))
          out={**base,
            'modal_origin_sha256':pathlib.Path('/tmp/modal-origin-sha').read_text().strip(),
            'modal_origin_matches_v46':True,
            'persistent_mount_present':probe['persistent_mount_present'],
            'runtime_manifest_present':probe['runtime_manifest_present'],
            'selected_env':probe['selected_env'],
            'media_candidates':probe['media_candidates'],
            'public_health':{
              'schema':health.get('schema'),
              'status':health.get('status'),
              'video_derivation_runtime_configured':health.get('video_derivation_runtime_configured'),
              'field_dataset_admission_configured':health.get('field_dataset_admission_configured'),
              'expert_review_projection_configured':health.get('expert_review_projection_configured'),
              'fault_episode_submission_configured':health.get('fault_episode_submission_configured'),
              'production_authorized':health.get('production_authorized'),
            },
            'result':'PASS',
          }
          pathlib.Path('foundry-forge-modal-runtime-topology-audit.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum foundry-forge-modal-runtime-topology-audit.json > foundry-forge-modal-runtime-topology-audit.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-foundry-forge-modal-runtime-topology-audit-20260914
          path: |
            foundry-forge-modal-runtime-topology-audit.json
            foundry-forge-modal-runtime-topology-audit.sha256
          retention-days: 14
          if-no-files-found: error
