name: MUSITU Foundry FORGE Public Health Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/foundry-forge-public-health-audit-20260914.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Observe certificate-validated public FORGE edge contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, socket, ssl, urllib.error, urllib.request
          from datetime import datetime, timezone

          origin='https://forge.mftintelligence.com'
          web='https://mftintelligence.com'
          protocol='c9fe2c0dcbc51ed7329aeea8b8d9985c0ccfc70123ac181c755285f1a0fbf3de'
          safe_headers={
            'server','content-type','content-length','cache-control','x-content-type-options',
            'referrer-policy','access-control-allow-origin','access-control-allow-methods',
            'access-control-allow-headers','access-control-max-age','vary','cf-ray',
            'cf-cache-status','cf-mitigated','location','www-authenticate'
          }

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener=urllib.request.build_opener(
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              NoRedirect(),
          )

          def observe(name, path, method='GET', headers=None):
              url=origin+path
              h={'Accept':'application/json','User-Agent':'MUSITU-FORGE-public-health-audit/2'}
              h.update(headers or {})
              request=urllib.request.Request(url,headers=h,method=method)
              try:
                  r=opener.open(request,timeout=20)
                  status=r.status
                  response_headers=r.headers
                  final_url=r.geturl()
                  raw=r.read(131073)
              except urllib.error.HTTPError as exc:
                  status=exc.code
                  response_headers=exc.headers
                  final_url=exc.geturl()
                  raw=exc.read(131073)
              if len(raw)>131072:
                  raw=raw[:131072]
                  truncated=True
              else:
                  truncated=False
              selected={k.lower():v for k,v in response_headers.items() if k.lower() in safe_headers}
              prefix=raw[:2048].decode('utf-8','replace')
              return {
                  'name':name,
                  'url':url,
                  'final_url':final_url,
                  'method':method,
                  'status':status,
                  'headers':dict(sorted(selected.items())),
                  'body_sha256':hashlib.sha256(raw).hexdigest(),
                  'body_size_observed':len(raw),
                  'body_truncated':truncated,
                  'body_prefix_utf8':prefix,
              }

          addresses=sorted({x[4][0] for x in socket.getaddrinfo('forge.mftintelligence.com',443,type=socket.SOCK_STREAM)})
          observations=[
              observe('health_no_origin','/v1/health'),
              observe('health_allowed_origin','/v1/health',headers={'Origin':web}),
              observe('health_allowed_origin_protocol','/v1/health',headers={'Origin':web,'X-MUSITU-Client-Protocol':protocol}),
              observe('root_no_origin','/'),
              observe('assignments_preflight','/v1/field/assignments',method='OPTIONS',headers={
                  'Origin':web,
                  'Access-Control-Request-Method':'GET',
                  'Access-Control-Request-Headers':'authorization, content-type, x-musitu-client-protocol',
              }),
          ]

          health=next(x for x in observations if x['name']=='health_allowed_origin')
          preflight=next(x for x in observations if x['name']=='assignments_preflight')
          health_payload=None
          health_contract=False
          try:
              health_payload=json.loads(health['body_prefix_utf8'])
          except Exception:
              pass
          if isinstance(health_payload,dict):
              hh=health['headers']
              health_contract=(
                  health['status']==200
                  and health['final_url']==origin+'/v1/health'
                  and hh.get('content-type','').lower().startswith('application/json')
                  and hh.get('cache-control')=='no-store'
                  and hh.get('x-content-type-options')=='nosniff'
                  and hh.get('referrer-policy')=='no-referrer'
                  and hh.get('access-control-allow-origin')==web
                  and health_payload.get('schema')=='musitu.forge.health.v1'
                  and health_payload.get('status')=='READY'
                  and health_payload.get('canonical_service_origin')==origin
                  and health_payload.get('protocol_digest')==protocol
                  and health_payload.get('custody_uploads_ready') is True
                  and health_payload.get('production_authorized') is False
              )
          ph=preflight['headers']
          methods={x.strip().upper() for x in ph.get('access-control-allow-methods','').split(',') if x.strip()}
          allowed={x.strip().lower() for x in ph.get('access-control-allow-headers','').split(',') if x.strip()}
          preflight_contract=(
              preflight['status']==204
              and preflight['final_url']==origin+'/v1/field/assignments'
              and ph.get('access-control-allow-origin')==web
              and {'GET','POST','PUT'}.issubset(methods)
              and {'authorization','content-type','x-musitu-client-protocol'}.issubset(allowed)
              and ph.get('cache-control')=='no-store'
              and ph.get('x-content-type-options')=='nosniff'
              and ph.get('referrer-policy')=='no-referrer'
          )

          out={
              'schema':'musitu.foundry_forge.public_edge_observation.v2',
              'observed_at':datetime.now(timezone.utc).isoformat(),
              'canonical_origin':origin,
              'resolved_addresses':addresses,
              'protocol_digest':protocol,
              'observations':observations,
              'health_contract_pass':health_contract,
              'preflight_contract_pass':preflight_contract,
              'backend_health_contract_pass':health_contract and preflight_contract,
              'write_performed':False,
              'production_authorized_claimed':False,
          }
          text=json.dumps(out,indent=2,sort_keys=True)+'\n'
          open('foundry-forge-public-edge-observation.json','w').write(text)
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Seal observation evidence
        run: sha256sum foundry-forge-public-edge-observation.json > foundry-forge-public-edge-observation.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-foundry-forge-public-edge-observation-20260914
          path: |
            foundry-forge-public-edge-observation.json
            foundry-forge-public-edge-observation.sha256
          retention-days: 7
          if-no-files-found: error
