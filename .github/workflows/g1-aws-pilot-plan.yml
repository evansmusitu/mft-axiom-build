name: G1 Ohio PrivateLink offline proposal gate
on:
  workflow_dispatch:
    inputs:
      confirm_offline_plan:
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan-only:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected == true && github.repository_id == '1356837528' && github.actor_id == '285482095' && (github.event_name == 'workflow_dispatch' && github.repository_id == '1356837528' && github.ref == 'refs/heads/main' && github.ref_protected == true && github.actor_id == '285482095' && inputs.confirm_offline_plan == true)
    environment: g1-aws-admin
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate cost, TTL and teardown proposal without cloud credentials
        env:
          G1_PILOT_REQUEST_JSON: ${{ secrets.G1_AWS_PILOT_REQUEST_JSON }}
        run: python3 -m ops.g1_aws.guardrails plan
