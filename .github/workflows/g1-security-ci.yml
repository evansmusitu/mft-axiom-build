name: G1 repository security verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/g1-completion-20261126]
permissions:
  contents: read
concurrency:
  group: g1-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  g1-workflow-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r .github/g1-ci-requirements.txt
      - name: Audit every workflow credential and artifact boundary
        run: python -m ops.g1_aws.workflow_security
      - name: Lint G1 executable source for Python errors
        run: ruff check --isolated --select E9,F63,F7,F82,F401 ops/g1_aws tests/g1_aws
      - name: Analyze G1 source for security defects
        run: bandit -q -r ops/g1_aws -lll
      - name: Verify all Actions syntax using upstream checksummed binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=
  g1-dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit Python qualification dependencies
        run: pip-audit -r infra/qualification/requirements.txt
      - name: Audit JavaScript lockfile without executing install scripts
        working-directory: reasoning/phase2
        run: npm audit --package-lock-only --ignore-scripts --audit-level=moderate
  g1-secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Scan the complete working tree with redacted output
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner
