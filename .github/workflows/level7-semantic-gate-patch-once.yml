name: MUSITU Axiom Level-7 Semantic Gate Patch Once

on:
  push:
    branches:
      - frontier/axiom-v5-level7-semantic-verification-20260912

permissions:
  contents: write

jobs:
  patch-once:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply anchor-checked Level-7 semantic patch
        run: |
          set -euo pipefail
          python tools/apply_level7_semantic_gate.py
          python -m py_compile \
            frontier_review_safe/external_validation.py \
            frontier_review_safe/longitudinal_artifacts.py
          git diff --check
          git diff -- frontier_review_safe/external_validation.py

      - name: Remove one-time patch machinery
        run: |
          set -euo pipefail
          rm -f tools/apply_level7_semantic_gate.py
          rm -f .github/workflows/level7-semantic-gate-patch-once.yml

      - name: Commit deterministic patch result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 1
          fi
          git commit -m "[skip ci] Apply Level-7 semantic gate"
          git push origin HEAD:frontier/axiom-v5-level7-semantic-verification-20260912
