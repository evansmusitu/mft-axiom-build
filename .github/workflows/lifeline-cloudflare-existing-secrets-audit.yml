name: LIFELINE Cloudflare Existing Secrets Qualification
on:
  push:
    branches: [product/lifeline-mt5-fivecloud-isolated-20261020]
    paths: ['.github/workflows/lifeline-cloudflare-existing-secrets-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-existing-secrets-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_GLOBAL_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CF_ALTERNATE_GLOBAL: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_ALT_KEY: ${{ secrets.CF_API_KEY }}
      CF_LIFELINE_TOKEN: ${{ secrets.LIFELINE_CLOUDFLARE_API_TOKEN }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_SHORT_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
      CF_WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CF_MFT_TOKEN: ${{ secrets.MFT_CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Audit previously configured secrets for exact owner, without ever printing credentials
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request,urllib.parse,urllib.error
          AID='93f395f5121954671f92fffa453d6b61'
          API='https://api.cloudflare.com/client/v4'
          zone='/zones?name='+urllib.parse.quote('mftintelligence.com')+'&per_page=2'
          account='/accounts/'+AID
          scripts='/accounts/'+AID+'/workers/scripts?per_page=1'
          output=[]
          candidates=[
            ('lifeline_token','CF_LIFELINE_TOKEN','bearer'),('cloudflare_api_token','CF_TOKEN','bearer'),
            ('cf_api_token','CF_SHORT_TOKEN','bearer'),('cloudflare_auth_token','CF_AUTH_TOKEN','bearer'),
            ('workers_token','CF_WORKERS_TOKEN','bearer'),('mft_token','CF_MFT_TOKEN','bearer'),
            ('global_key','CF_GLOBAL_KEY','global'),('alternate_global','CF_ALTERNATE_GLOBAL','global'),
            ('cf_key','CF_ALT_KEY','global')
          ]
          def read(path,headers):
              try:
                  req=urllib.request.Request(API+path,headers=headers,method='GET')
                  with urllib.request.urlopen(req,timeout=12) as r:
                      obj=json.loads(r.read(128000))
                      return r.status,(obj.get('result') if obj.get('success') is True else None)
              except urllib.error.HTTPError as e: return e.code,None
              except Exception: return 0,None
          for alias,field,auth in candidates:
              secret=os.environ.get(field,'')
              if not secret: continue
              if auth=='global' and not os.environ.get('CF_EMAIL'):continue
              head={'User-Agent':'LIFELINE-MT5-read-only-qualification/1.0','Accept':'application/json'}
              if auth=='bearer':head['Authorization']='Bearer '+secret
              else:head.update({'X-Auth-Email':os.environ['CF_EMAIL'],'X-Auth-Key':secret})
              zone_http,zones=read(zone,head)
              verified=any(z.get('name')=='mftintelligence.com' and (z.get('account') or {}).get('id')==AID for z in zones) if isinstance(zones,list) else False
              account_http,details=read(account,head)
              exact_account=bool(isinstance(details,dict) and details.get('id')==AID)
              scripts_http,listing=read(scripts,head) if (verified or exact_account) else (None,None)
              # Never show key, token, raw response body, or other accounts.
              out={'credential_alias':alias,'auth_style':auth,'zone_http':zone_http,'zone_account_verified':verified,
                   'exact_account_http':account_http,'exact_account_verified':exact_account,
                   'worker_read_http':scripts_http,'eligible_readonly':bool((verified or exact_account) and scripts_http==200)}
              output.append(out)
              print(json.dumps(out,sort_keys=True))
          summary={'schema':'lifeline.cloudflare.existing_secret_readonly.v1','exact_cloudflare_account':AID,
                   'tested':len(output),'qualified':sum(1 for x in output if x['eligible_readonly']),
                   'mutation_performed':False,'results':output}
          with open('lifeline-cloudflare-secret-qualification.json','w') as f:json.dump(summary,f,indent=2,sort_keys=True)
          print('qualified_for_readonly_workers='+str(summary['qualified']>0).lower())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lifeline-cloudflare-secret-qualification
          path: lifeline-cloudflare-secret-qualification.json
          retention-days: 3
          if-no-files-found: error
