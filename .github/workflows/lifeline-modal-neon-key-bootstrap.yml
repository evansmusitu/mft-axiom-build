name: LIFELINE Encrypted Neon Credential Handoff Bootstrap
on:
  push:
    branches: [product/lifeline-mt5-fivecloud-isolated-20261020]
    paths: ['.github/workflows/lifeline-modal-neon-key-bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  create-private-modal-key:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generate RSA-OAEP recipient and store ONLY private key in Modal Secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"; test -n "$MODAL_TOKEN_SECRET"
          python -m pip install --disable-pip-version-check --quiet 'modal==1.6.2' 'cryptography>=44,<47'
          python - <<'PY'
          import base64, json, modal
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          key=rsa.generate_private_key(public_exponent=65537,key_size=3072)
          private=key.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption())
          public=key.public_key().public_bytes(serialization.Encoding.DER,serialization.PublicFormat.SubjectPublicKeyInfo)
          name='lifeline-mt5-neon-stage-unwrap-key-20261021'
          modal.Secret.objects.create(name,{'RSA_PRIVATE_PEM_B64':base64.b64encode(private).decode('ascii')},allow_existing=False)
          # PUBLIC key only. No password, private key, database credentials, or token printed.
          print(json.dumps({'schema':'lifeline.rsa_oaep_recipient.v1','secret_name':name,
             'public_der_b64':base64.b64encode(public).decode('ascii'),
             'algorithm':'RSA3072_OAEP_SHA256','private_key_printed':False}))
          PY
