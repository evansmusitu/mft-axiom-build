name: LIFELINE Windows Agent Contract Tests
on:
  push:
    branches: [product/lifeline-mt5-fivecloud-isolated-20261020]
    paths:
      - 'products/lifeline-mt5-ai-studio/windows/agent.py'
      - 'products/lifeline-mt5-ai-studio/windows/test_agent.py'
      - '.github/workflows/lifeline-mt5-agent-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-safety:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify signatures, source integrity and no-trading policy
        shell: bash
        run: |
          cd products/lifeline-mt5-ai-studio/windows
          python -m unittest -v test_agent.py
