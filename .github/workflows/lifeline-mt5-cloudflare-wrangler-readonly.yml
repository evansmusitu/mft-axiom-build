name: LIFELINE MT5 Wrangler Existing Token Dry Run
on:
  push:
    branches: [product/lifeline-mt5-fivecloud-isolated-20261020]
    paths: ['.github/workflows/lifeline-mt5-cloudflare-wrangler-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-account-and-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert token scope and exact account (no writes)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@4.129.0 >/dev/null
          npx wrangler whoami > /tmp/lifeline-wrangler-whoami.txt 2>/dev/null
          grep -Fq '93f395f5121954671f92fffa453d6b61' /tmp/lifeline-wrangler-whoami.txt
          echo 'exact_account_wrangler_verified=true'
      - name: Static Worker bundling only; no deployment
        shell: bash
        run: |
          set -euo pipefail
          cd products/lifeline-mt5-ai-studio/infra/cloudflare
          npm install --ignore-scripts --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/lifeline-cf-bundle
          test -d /tmp/lifeline-cf-bundle
          echo 'lifeline_worker_dry_run_pass=true'
          echo 'cloudflare_network_mutations=false'
