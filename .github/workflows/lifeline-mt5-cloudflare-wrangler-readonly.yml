name: LIFELINE Cloudflare Wrangler Read-Only Identity Fallback
on:
  push:
    branches: [product/lifeline-mt5-fivecloud-isolated-20261020]
    paths: ['.github/workflows/lifeline-mt5-cloudflare-wrangler-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-account:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
    steps:
      - name: Verify preexisting Cloudflare credential is present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_EMAIL" && test -n "$CLOUDFLARE_API_KEY"
      - name: Read-only Wrangler account identity
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@4.129.0 >/dev/null
          npx wrangler whoami > /tmp/whoami.txt 2>/tmp/whoami-errors.txt || {
            echo 'wrangler_auth_failed=true'
            exit 1
          }
          grep -Fq '93f395f5121954671f92fffa453d6b61' /tmp/whoami.txt || {
            echo 'wrong_cloudflare_account_or_missing_scope=true'
            exit 1
          }
          echo 'lifeline_cloudflare_exact_account_verified=true'
          echo 'No Worker, Access, DNS or secret was modified.'
