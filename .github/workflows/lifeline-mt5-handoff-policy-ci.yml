name: LIFELINE Ephemeral Modal Secret Handoff Offline Policy Tests
on:
  push:
    branches: [product/lifeline-mt5-fivecloud-isolated-20261020]
    paths:
      - 'products/lifeline-mt5-ai-studio/infra/modal/test_handoff_policy.py'
      - 'products/lifeline-mt5-ai-studio/infra/modal/handoff_policy.py'
      - '.github/workflows/lifeline-mt5-handoff-policy-ci.yml'
permissions: {contents: read}
jobs:
  validate-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet --disable-pip-version-check 'cryptography>=44,<47'
      - name: Offline handoff security cases, no credentials, no compute
        run: |
          cd products/lifeline-mt5-ai-studio/infra/modal
          python -m unittest test_handoff_policy -v
