name: LIFELINE Isolated Modal Private Proxy-Auth Proof
on:
  push:
    branches: [product/lifeline-mt5-fivecloud-isolated-20261020]
    paths:
      - 'products/lifeline-mt5-ai-studio/infra/modal/private_probe.py'
      - '.github/workflows/lifeline-mt5-modal-private-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-isolated-private-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Modal free-credit/billing fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"; test -n "$MODAL_TOKEN_SECRET"
          python -m pip install --disable-pip-version-check --quiet 'modal==1.6.2'
          modal billing summary --for 'this month' --json >/tmp/lifeline-modal-billing.json
          python - <<'PY'
          import json
          from decimal import Decimal
          data=json.load(open('/tmp/lifeline-modal-billing.json'))
          cost=Decimal(str(data['metered_cost']))
          billed=Decimal(str(data['billed_cost']))
          if cost<0 or cost>Decimal('5') or billed!=0:
              raise SystemExit('Modal workspace spend gate DENIED')
          print('modal_monthly_metered_less_than_5=true')
          print('modal_out_of_pocket_so_far=0')
          print('bounded_private_probe_only=true')
          PY
      - name: Refuse collision with other Modal apps
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile products/lifeline-mt5-ai-studio/infra/modal/private_probe.py
          modal app list --json >/tmp/lifeline-modal-apps.json
          python - <<'PY'
          import json
          rows=json.load(open('/tmp/lifeline-modal-apps.json'))
          if not isinstance(rows,list): raise SystemExit('cannot safely check app names')
          app='lifeline-mt5-private-probe-isolated'
          existing=[r for r in rows if isinstance(r,dict) and (r.get('name')==app or r.get('app_name')==app)]
          if existing: raise SystemExit('isolated_probe_app_already_exists_abort_no_replace')
          print('isolated_modal_app_name_unoccupied=true')
          PY
      - name: Deploy proxy-auth only, scale-to-zero bounded probe
        shell: bash
        run: |
          set -euo pipefail
          modal deploy products/lifeline-mt5-ai-studio/infra/modal/private_probe.py --name lifeline-mt5-private-probe-isolated --strategy recreate >/tmp/lifeline-modal-deploy.log 2>&1 || {
            echo 'private_probe_deploy_failed'
            tail -20 /tmp/lifeline-modal-deploy.log | sed -E 's/[A-Za-z0-9_-]{36,}/[redacted]/g'
            exit 1
          }
          echo 'isolated_private_modal_app_deployed=true'
      - name: Prove anonymous denial BEFORE positive API probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/lifeline-private-url.txt
          import modal
          fn=modal.Function.from_name('lifeline-mt5-private-probe-isolated','private_status')
          url=fn.get_web_url()
          if not isinstance(url,str) or not url.startswith('https://') or '.modal.run' not in url:
              raise SystemExit('no valid private Modal HTTPS endpoint')
          print(url.rstrip('/'))
          PY
          URL="$(cat /tmp/lifeline-private-url.txt)"
          STATUS=$(curl -sS -o /tmp/lifeline-guest-response -w '%{http_code}' --max-time 30 "$URL/healthz")
          if [[ "$STATUS" != "401" && "$STATUS" != "403" ]]; then
            echo "FAILED: anonymous Modal HTTP $STATUS"; exit 1
          fi
          echo "modal_guest_http=$STATUS"
          echo 'modal_guest_denied=true'
      - name: Prove authenticated read-only health with Modal API context
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat /tmp/lifeline-private-url.txt)"
          modal curl --silent --show-error --max-time 40 "$URL/healthz" >/tmp/lifeline-private-health.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/lifeline-private-health.json'))
          expected={'schema':'lifeline.private_modal_probe.v1','runtime':'modal-private-stage',
             'access':'proxy_auth_required','neon_connected':False,
             'windows_agent_connected':False,'cloudflare_gateway_connected':False,
             'live_trading':False,'public_mcp_enabled':False}
          if x!=expected: raise SystemExit('Modal response not fail-closed')
          print('modal_private_authenticated_health=PASS')
          print('modal_no_orders_no_windows_no_neon=true')
          PY
      - name: Capture no-secret deployment evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          path=pathlib.Path('/tmp/lifeline-private-url.txt')
          summary={'schema':'lifeline.modal.private_acceptance.v1','app':'lifeline-mt5-private-probe-isolated',
                   'private_proxy_auth_required':True,'live_trading':False,
                   'database_connected':False,'dedicated_windows_host_connected':False}
          if path.exists():summary['private_url']=path.read_text().strip()
          pathlib.Path('lifeline-private-modal-evidence.json').write_text(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifeline-private-modal-stage-proof
          path: lifeline-private-modal-evidence.json
          retention-days: 3
          if-no-files-found: error
