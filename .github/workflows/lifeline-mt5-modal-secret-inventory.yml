name: LIFELINE Secret Source and Backend No-Cutover Readiness
# Control-plane metadata ONLY; no remote function, deployment or mutation.
# Running on this workflow's source changes gives read-only acceptance evidence.
on:
  push:
    branches: [product/lifeline-mt5-fivecloud-isolated-20261020]
    paths: ['.github/workflows/lifeline-mt5-modal-secret-inventory.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  readonly-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Preflight owner-only Access authorization (read-only, no owner data)
        run: python products/lifeline-mt5-ai-studio/infra/cloudflare/owner_login_audit.py
      - name: Verify Modal SDK available without dispatching functions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET"
          python -m pip install --disable-pip-version-check --quiet 'modal==1.6.2'
      - name: Qualify existing Modal secret names and exact identity-only Worker
        shell: bash
        run: |
          set -euo pipefail
          python products/lifeline-mt5-ai-studio/infra/cloudflare/modal_source_inventory.py
