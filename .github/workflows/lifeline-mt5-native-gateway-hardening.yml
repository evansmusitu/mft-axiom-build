name: LIFELINE Windows Gateway and Native MCP Hardened Tests
on:
  push:
    branches: [product/lifeline-mt5-fivecloud-isolated-20261020]
    paths:
      - 'products/lifeline-mt5-ai-studio/windows/poller.py'
      - 'products/lifeline-mt5-ai-studio/windows/native_mcp.py'
      - 'products/lifeline-mt5-ai-studio/windows/test_poller.py'
      - 'products/lifeline-mt5-ai-studio/windows/test_native_mcp.py'
      - '.github/workflows/lifeline-mt5-native-gateway-hardening.yml'
permissions: {contents: read}
jobs:
  localhost-security:
    strategy:
      matrix: {os: [windows-2022, ubuntu-24.04]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run Windows and Linux outbound HTTPS + native MCP fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet 'fastapi>=0.115,<1' 'httpx>=0.28,<1'
          cd products/lifeline-mt5-ai-studio/windows
          python -m unittest -v test_agent.py test_poller.py test_native_mcp.py
