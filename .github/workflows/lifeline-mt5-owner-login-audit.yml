name: LIFELINE Owner App Access Authentication Audit
on:
  push:
    branches: [product/lifeline-mt5-fivecloud-isolated-20261020]
    paths:
      - '.github/workflows/lifeline-mt5-owner-login-audit.yml'
      - 'products/lifeline-mt5-ai-studio/infra/cloudflare/owner_login_audit.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit-login-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check Access auth logs, exact owner MFA policy and app sessions, no PII
        run: python products/lifeline-mt5-ai-studio/infra/cloudflare/owner_login_audit.py
