name: LIFELINE Activate Owner-Only MFA Access
on:
  push:
    branches: [product/lifeline-mt5-fivecloud-isolated-20261020]
    paths:
      - '.github/workflows/lifeline-mt5-owner-mfa-activate.yml'
      - 'products/lifeline-mt5-ai-studio/infra/cloudflare/activate_owner_mfa.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  owner-only-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Activate only known Access user MFA policy without routing or secrets
        run: python products/lifeline-mt5-ai-studio/infra/cloudflare/activate_owner_mfa.py
