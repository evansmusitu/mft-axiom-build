name: LIFELINE Cloudflare Single-Owner MFA Prepolicy
on:
  push:
    branches: [product/lifeline-mt5-fivecloud-isolated-20261020]
    paths:
      - '.github/workflows/lifeline-mt5-owner-mfa-prepolicy.yml'
      - 'products/lifeline-mt5-ai-studio/infra/cloudflare/owner_mfa_prepolicy.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  owner-prepolicy:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Enroll unique known owner into explicit MFA Access policy without removing denial
        run: python products/lifeline-mt5-ai-studio/infra/cloudflare/owner_mfa_prepolicy.py
