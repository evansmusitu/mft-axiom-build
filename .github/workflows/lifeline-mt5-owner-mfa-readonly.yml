name: LIFELINE Cloudflare Owner MFA Readonly Qualification
on:
  push:
    branches: [product/lifeline-mt5-fivecloud-isolated-20261020]
    paths:
      - '.github/workflows/lifeline-mt5-owner-mfa-readonly.yml'
      - 'products/lifeline-mt5-ai-studio/infra/cloudflare/owner_mfa_readonly.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  owner-mfa-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Read exact account, Zero Trust Access app, deny policy and enrollment evidence
        run: python products/lifeline-mt5-ai-studio/infra/cloudflare/owner_mfa_readonly.py
      - name: Preserve redacted owner enrollment state
        uses: actions/upload-artifact@v4
        with:
          name: lifeline-owner-mfa-redacted-readback
          path: lifeline-owner-mfa-readback.json
          retention-days: 3
