name: LIFELINE Access Owner Session Readonly Check
on:
  push:
    branches: [product/lifeline-mt5-fivecloud-isolated-20261020]
    paths:
      - '.github/workflows/lifeline-mt5-owner-session-readonly.yml'
      - 'products/lifeline-mt5-ai-studio/infra/cloudflare/owner_session_readonly.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  positive-owner-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Read only recent verified Access app session and classify guest denial
        run: python products/lifeline-mt5-ai-studio/infra/cloudflare/owner_session_readonly.py
