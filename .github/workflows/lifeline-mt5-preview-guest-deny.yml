name: LIFELINE Private Preview Anonymous Denial
on:
  push:
    branches: [product/lifeline-mt5-fivecloud-isolated-20261020]
    paths: ['.github/workflows/lifeline-mt5-preview-guest-deny.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  protected-guest-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Probe exact LIFELINE stage preview without cookies/redirects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request,urllib.error
          url='https://lifeline-mt5-ai-studio-stage-ib2qzv419-evansmusitu.vercel.app/'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          client=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
          req=urllib.request.Request(url,headers={'User-Agent':'LIFELINE-Private-Guest-Denial/1',
              'Cache-Control':'no-cache'})
          try:
              with client.open(req,timeout=25) as resp:
                  code=resp.status
          except urllib.error.HTTPError as exc:
              code=exc.code
          if code not in (302,401,403):
              raise SystemExit('PRIVATE_VERCEL_GUEST_DENIAL_FAILED: unexpected HTTP '+str(code))
          print(json.dumps({'schema':'lifeline.vercel_guest_negative.v1',
              'deployment_id':'dpl_A8QasAqio1t7BuoyoZqDonXsFYnF',
              'guest_http_status':code,'authenticated_content_exposed':False,
              'no_cookies_used':True,'redirects_followed':False,
              'trade_execution_enabled':False},sort_keys=True))
          PY
