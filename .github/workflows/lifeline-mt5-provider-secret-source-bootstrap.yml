name: LIFELINE Provider-GitHub Secrets Bridge — One Safe Binding
on:
  push:
    branches: [product/lifeline-mt5-fivecloud-isolated-20261020]
    paths: [.github/workflows/lifeline-mt5-provider-secret-source-bootstrap.yml]
permissions: {contents: read}
jobs:
  qualify-existing-credentials-and-bind-modal-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      LIFELINE_AGENT_ID_GH: ${{ secrets.LIFELINE_AGENT_ID }}
      LIFELINE_AGENT_TENANT_GH: ${{ secrets.LIFELINE_AGENT_TENANT }}
      LIFELINE_AGENT_HMAC_KEY_GH: ${{ secrets.LIFELINE_AGENT_HMAC_KEY }}
      LIFELINE_EDGE_SHARED_SECRET_GH: ${{ secrets.LIFELINE_EDGE_SHARED_SECRET }}
      LIFELINE_MODAL_PROXY_KEY_GH: ${{ secrets.LIFELINE_MODAL_PROXY_KEY }}
      LIFELINE_MODAL_PROXY_SECRET_GH: ${{ secrets.LIFELINE_MODAL_PROXY_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Static Python syntax and exact Cloudflare account owner-only MFA preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile products/lifeline-mt5-ai-studio/infra/cloudflare/backend_gate_readonly.py
          python products/lifeline-mt5-ai-studio/infra/cloudflare/backend_gate_readonly.py >/dev/null
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET"
      - name: Install authenticated Modal control-plane SDK without deploying compute
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet 'modal==1.6.2'
      - name: Read existing GitHub credential availability and bind provider-derived Modal origin only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, urllib.request
          from decimal import Decimal
          from urllib.parse import urlsplit
          import modal
          AID='93f395f5121954671f92fffa453d6b61'
          WORKER='lifeline-mt5-edge-isolated'
          APP='71c315f0-3cfa-4217-98f1-e31d9ec8a44b'
          HOST='lifeline-mt5-stage.mftintelligence.com'
          IDENT={'ACCESS_ISSUER','ACCESS_AUD','ACCESS_OPERATOR_SUB'}
          ORIGIN='MODAL_ORIGIN'
          REQUIRED_BACKEND={'MODAL_ORIGIN','MODAL_PROXY_KEY','MODAL_PROXY_SECRET',
            'EDGE_SHARED_SECRET','AGENT_ID','AGENT_TENANT','AGENT_HMAC_KEY'}
          token=os.environ['CLOUDFLARE_API_TOKEN']
          API='https://api.cloudflare.com/client/v4'
          def call(path,method='GET',data=None):
              h={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'LIFELINE-Existing-Credentials-Only/1'}
              if data is not None:h['Content-Type']='application/json'
              req=urllib.request.Request(API+path,headers=h,data=json.dumps(data).encode() if data is not None else None,method=method)
              with urllib.request.urlopen(req,timeout=25) as resp:
                  body=json.load(resp)
              if body.get('success') is not True:raise RuntimeError('provider rejected request')
              return body.get('result')
          if call('/accounts/'+AID).get('id')!=AID:raise RuntimeError('wrong Cloudflare account')
          app=call('/accounts/'+AID+'/access/apps/'+APP)
          if app.get('id')!=APP or app.get('domain')!=HOST:raise RuntimeError('wrong Access app')
          pol=call('/accounts/'+AID+'/access/apps/'+APP+'/policies?per_page=20')
          if (len(pol)!=1 or pol[0].get('decision')!='allow' or
              (pol[0].get('mfa_config') or {}).get('mfa_disabled') is not False or
              (pol[0].get('mfa_config') or {}).get('session_duration')!='0m'):
              raise RuntimeError('owner MFA policy drift')
          path='/accounts/'+AID+'/workers/scripts/'+WORKER+'/secrets'
          secrets=call(path)
          names={v['name'] for v in secrets if isinstance(v,dict) and isinstance(v.get('name'),str)}
          if not IDENT.issubset(names) or names-IDENT-REQUIRED_BACKEND:
              raise RuntimeError('unexpected Worker bindings; refuse touch')
          budget=modal.Workspace.from_context().billing.summary()
          billed=Decimal(str(budget.billed_cost));metered=Decimal(str(budget.metered_cost))
          if billed!=0 or not (Decimal('0')<=metered<=Decimal('5')):
              raise RuntimeError('no-spend guard blocked')
          secret_names={s.name for s in modal.Secret.objects.list(max_objects=100)}
          if not {'lifeline-mt5-bridge-probe-20261021','lifeline-mt5-neon-stage-unwrap-key-20261021'}.issubset(secret_names):
              raise RuntimeError('LIFELINE-only Modal stores missing')
          originurl=modal.Function.from_name('lifeline-mt5-analytics-isolated','private_api').get_web_url()
          u=urlsplit(originurl or '')
          if (u.scheme!='https' or not (u.hostname or '').endswith('.modal.run') or
              u.username or u.password or u.query or u.fragment or u.port is not None):
              raise RuntimeError('private Modal URL not qualified')
          origin=u.scheme+'://'+u.hostname+'/'
          added=False
          if ORIGIN not in names:
              if names!=IDENT:
                  raise RuntimeError('partial backend secrets already installed; refuse implicit cutover')
              call(path,'PUT',{'name':'MODAL_ORIGIN','text':origin,'type':'secret_text'})
              added=True
          after=call(path)
          actual={v['name'] for v in after if isinstance(v,dict) and isinstance(v.get('name'),str)}
          if not IDENT.issubset(actual) or not (actual-IDENT)<=REQUIRED_BACKEND or ORIGIN not in actual:
              raise RuntimeError('Worker origin binding failed readback')
          # Never print or save any secret value, proxy token, customer identity or URL.
          aliases={'AGENT_ID':'LIFELINE_AGENT_ID_GH','AGENT_TENANT':'LIFELINE_AGENT_TENANT_GH',
            'AGENT_HMAC_KEY':'LIFELINE_AGENT_HMAC_KEY_GH',
            'EDGE_SHARED_SECRET':'LIFELINE_EDGE_SHARED_SECRET_GH',
            'MODAL_PROXY_KEY':'LIFELINE_MODAL_PROXY_KEY_GH',
            'MODAL_PROXY_SECRET':'LIFELINE_MODAL_PROXY_SECRET_GH'}
          source_status={k:bool(os.environ.get(env)) for k,env in aliases.items()}
          record={'schema':'lifeline.github_provider_secret_source.v1',
            'exact_account_and_owner_mfa_confirmed':True,
            'github_cloudflare_api_token_works':True,
            'github_modal_api_token_works':True,
            'modal_billed_zero':True,
            'modal_metered_under_5_usd':True,
            'existing_modal_lifeline_stores_present':True,
            'modal_private_endpoint_metadata_qualified':True,
            'github_lifeline_binding_sources_present':source_status,
            'modal_origin_binding_added':added,
            'worker_binding_count':len(actual),
            'worker_missing_binding_names':sorted(REQUIRED_BACKEND-actual),
            'modal_proxy_token_created':False,
            'modal_function_invoked':False,
            'paid_resources_provisioned':False,
            'native_windows_paired':False,
            'trading_enabled':False}
          print(json.dumps(record,sort_keys=True))
          with open('lifeline-existing-credential-binding-audit.json','w') as f:json.dump(record,f,sort_keys=True,indent=2)
          PY
      - name: Keep only nonsecret artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeline-existing-credential-sources
          path: lifeline-existing-credential-binding-audit.json
          retention-days: 3
          if-no-files-found: warn
