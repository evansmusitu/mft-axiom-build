name: MUSITU MCN-072 active version ETag and script digest GET-only (NO RELEASE)

on:
  push:
    branches:
      - audit/mcn072-cloudflare-consumer-field-diag-20261113
    paths:
      - .github/workflows/mcn072-consumer-field-diag-readonly-20261113.yml

permissions:
  contents: read

concurrency:
  group: mcn072-cloudflare-consumer-field-diag-20261113
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.ref == 'refs/heads/audit/mcn072-cloudflare-consumer-field-diag-20261113' &&
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout without persisted GitHub credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact source/test hashes and 36 adverse controls before injecting secret
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object qualification/mcn072_cloudflare_consumer_field_diag.py)" = "2e907fb3460d3cc19c6709775bff35fe043d16c8"
          test "$(git hash-object tests/test_mcn072_cloudflare_consumer_field_diag.py)" = "2daa6320d3a88bc14396b70add9cd61a994942a5"
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m py_compile qualification/mcn072_cloudflare_consumer_field_diag.py tests/test_mcn072_cloudflare_consumer_field_diag.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -p 'test_mcn072_cloudflare_consumer_field_diag.py' -v
      - name: Compare active version ETag to current content digest using pre-existing Cloudflare secret GET only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B qualification/mcn072_cloudflare_consumer_field_diag.py
      - name: Store sanitized hash-comparison observation and detached digest (always NO-GO)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-mcn072-cloudflare-active-etag-20261114
          path: |
            mcn072-cloudflare-consumer-field-diag.json
            mcn072-cloudflare-consumer-field-diag.json.sha256
          retention-days: 7
          if-no-files-found: warn
