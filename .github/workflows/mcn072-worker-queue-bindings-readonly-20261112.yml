name: MUSITU MCN-072 Worker-Queue binding inventory GET-only (NO RELEASE)

on:
  push:
    branches:
      - audit/mcn072-cloudflare-pg-link-readonly-20261112
    paths:
      - .github/workflows/mcn072-worker-queue-bindings-readonly-20261112.yml

permissions:
  contents: read

concurrency:
  group: mcn072-worker-queue-bindings-readonly-20261112
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.repository == 'evansmusitu/mft-axiom-build' &&
      github.ref == 'refs/heads/audit/mcn072-cloudflare-pg-link-readonly-20261112' &&
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout without retaining repository credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin exact source and run 13 adversarial tests BEFORE Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object qualification/mcn072_worker_queue_bindings_readonly.py)" = "3907466902c8c7fb26c294dc7a0ae68d650a86ef"
          test "$(git hash-object tests/test_mcn072_worker_queue_bindings_readonly.py)" = "ba84ac37142f61a78e6e5cab30b03e91aef29ad0"
          python3 -B -m py_compile qualification/mcn072_worker_queue_bindings_readonly.py tests/test_mcn072_worker_queue_bindings_readonly.py
          python3 -B -m unittest discover -s tests -p 'test_mcn072_worker_queue_bindings_readonly.py' -v
      - name: Execute limited Cloudflare GET-only Worker/Queue binding read
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B qualification/mcn072_worker_queue_bindings_readonly.py
      - name: Upload only sanitized, non-qualifying metadata and detached digest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-mcn072-worker-queue-bindings-readonly-20261112
          path: |
            mcn072-worker-queue-bindings-readonly.json
            mcn072-worker-queue-bindings-readonly.json.sha256
          retention-days: 7
          if-no-files-found: warn
