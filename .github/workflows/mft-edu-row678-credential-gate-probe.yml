name: MFT Education Nexus Row678 Credential Gate Probe
on:
  push:
    branches: [mft-edu-row678-builder-20260912]
    paths: ['.github/workflows/mft-edu-row678-credential-gate-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify existing Cloudflare credential without disclosure
        shell: bash
        env:
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CF_EMAIL" && test -n "$CF_KEY"
          code=$(curl -sS -o response.json -w '%{http_code}' -H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_KEY" -H 'Content-Type: application/json' https://api.cloudflare.com/client/v4/user)
          test "$code" = 200
          python - <<'PY'
          import json
          d=json.load(open('response.json',encoding='utf-8'))
          assert d.get('success') is True
          print('CREDENTIAL_GATE=PASS')
          PY
