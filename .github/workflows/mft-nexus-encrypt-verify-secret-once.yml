name: MFT AI NEXUS — safely encrypt previously plaintext verify token
on:
  push:
    branches: ['feature/mft-ai-nexus-cloudflare-20261012']
    paths: ['.github/workflows/mft-nexus-encrypt-verify-secret-once.yml']
permissions:
  contents: read
jobs:
  encrypt-existing-secret-only:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'feature/mft-ai-nexus-cloudflare-20261012'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
    steps:
      - name: Convert only the existing MFT webhook verifier binding to encrypted Secret
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const id=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          if(id!=='93f395f5121954671f92fffa453d6b61'||!token||token.length<20)throw Error('MFT_AUTH_UNAVAILABLE');
          const script='mft-nexus-chatbot-20261012';
          const base='https://api.cloudflare.com/client/v4/accounts/'+id+'/workers/scripts/'+script;
          const headers={Authorization:'Bearer '+token,Accept:'application/json'};
          const get=async path=>{
            const r=await fetch(base+path,{headers,signal:AbortSignal.timeout(15000)});
            if(!r.ok)throw Error('MFT_READ_FAILED');
            const j=await r.json();if(j.success!==true)throw Error('MFT_READ_REJECTED');
            return j.result;
          };
          const settings=await get('/settings');
          const items=settings?.bindings;
          if(!Array.isArray(items)||!items.some(x=>x.name==='AI'&&x.type==='ai')||!items.some(x=>x.name==='AI_BUDGET'&&x.type==='durable_object_namespace'))throw Error('MFT_TARGET_BINDINGS_UNVERIFIED');
          const names=new Set((await get('/secrets')).map(x=>x.name));
          for(const n of ['WHATSAPP_APP_SECRET','WHATSAPP_ACCESS_TOKEN','WHATSAPP_PHONE_NUMBER_ID','WHATSAPP_TEST_RECIPIENTS'])if(!names.has(n))throw Error('MFT_EXPECTED_SECRET_MISSING');
          if(names.has('WHATSAPP_VERIFY_TOKEN')){console.log('MFT_VERIFY_ALREADY_ENCRYPTED_NO_CHANGE');process.exit(0);}
          const binding=items.find(x=>x.name==='WHATSAPP_VERIFY_TOKEN');
          if(!binding||binding.type!=='plain_text')throw Error('MFT_VERIFY_BINDING_NOT_PLAINTEXT');
          // Value stays in memory; never printed, committed, saved as artifact, or used in shell arguments.
          const value=binding.text;
          if(typeof value!=='string'||value.length<32||value.length>512)throw Error('MFT_VERIFY_TOKEN_DOES_NOT_SATISFY_SECURITY_REQUIREMENTS');
          const result=await fetch(base+'/secrets',{
            method:'PUT',
            headers:{...headers,'content-type':'application/json'},
            body:JSON.stringify({type:'secret_text',name:'WHATSAPP_VERIFY_TOKEN',text:value}),
            signal:AbortSignal.timeout(20000)
          });
          if(!result.ok)throw Error('MFT_VERIFY_TOKEN_ENCRYPTION_PROVIDER_REJECTED_'+result.status);
          const resp=await result.json();
          if(resp.success!==true)throw Error('MFT_VERIFY_TOKEN_ENCRYPTION_FAILED');
          const after=await get('/secrets');
          if(!after.some(x=>x.name==='WHATSAPP_VERIFY_TOKEN'&&x.type==='secret_text'))throw Error('MFT_ENCRYPTED_SECRET_READBACK_FAILED');
          const finalSettings=await get('/settings');
          if(finalSettings?.bindings?.find(x=>x.name==='WHATSAPP_VERIFY_TOKEN')?.type!=='secret_text')throw Error('MFT_OLD_PLAINTEXT_BINDING_STILL_PRESENT');
          console.log('MFT_VERIFY_TOKEN_ENCRYPTED=true');
          console.log('MFT_NO_SECRET_VALUES_LOGGED=true');
          console.log('MFT_WHATSAPP_PRODUCTION_NOT_ACTIVATED=true');
          NODE
