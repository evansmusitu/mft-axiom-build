name: MFT AI NEXUS — private Meta secret readiness check
on:
  push:
    branches:
      - feature/mft-ai-nexus-cloudflare-20261012
    paths:
      - .github/workflows/mft-nexus-meta-secret-readonly.yml
permissions:
  contents: read
jobs:
  check-existing-worker-only:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'feature/mft-ai-nexus-cloudflare-20261012'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
    steps:
      - name: Read only exact existing MFT Worker private setting names
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const id=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
          if(id!=='93f395f5121954671f92fffa453d6b61'||!token||token.length<20)throw Error('MFT_SCOPED_AUTH_ABSENT');
          const name='mft-nexus-chatbot-20261012';
          const base='https://api.cloudflare.com/client/v4/accounts/'+id+'/workers/scripts/'+name;
          const get=async suffix=>{
            const r=await fetch(base+suffix,{headers:{Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(15000)});
            const j=await r.json();
            if(r.status!==200||j.success!==true)throw Error('MFT_SCOPED_WORKER_READ_DENIED');
            return j.result;
          };
          const settings=await get('/settings');
          if(!Array.isArray(settings.bindings)||!settings.bindings.some(b=>b.name==='AI'&&b.type==='ai')||!settings.bindings.some(b=>b.name==='AI_BUDGET'&&b.type==='durable_object_namespace'))throw Error('MFT_EXACT_WORKER_IDENTITY_UNVERIFIED');
          const items=await get('/secrets');
          if(!Array.isArray(items))throw Error('MFT_SECRETS_RESPONSE_INVALID');
          const names=new Set(items.map(x=>x.name));
          const required=['WHATSAPP_APP_SECRET','WHATSAPP_ACCESS_TOKEN','WHATSAPP_PHONE_NUMBER_ID','WHATSAPP_VERIFY_TOKEN','WHATSAPP_TEST_RECIPIENTS'];
          const status=Object.fromEntries(required.map(k=>[k,names.has(k)]));
          console.log('MFT_NEXUS_SECRET_NAMES_ONLY='+JSON.stringify(status));
          console.log('MFT_NEXUS_PRIVATE_SETTINGS_READY='+required.every(x=>names.has(x)));
          const verifyBinding=settings.bindings.find(b=>b.name==='WHATSAPP_VERIFY_TOKEN');
          console.log('MFT_NEXUS_VERIFY_TOKEN_BINDING_TYPE='+(verifyBinding?verifyBinding.type:'absent'));
          console.log('MFT_NEXUS_TEST_READY_FLAG=OFF_UNCHANGED');
          console.log('MFT_NEXUS_GET_ONLY_NO_TOKEN_OR_SECRET_VALUES_LOGGED');
          NODE

# Recheck existing secret-name presence after user confirmed Cloudflare secure token entry (no values read).

# Recheck after operator confirmed the existing sender ID and test-recipient settings; secret values are never read.

# Operator confirmed Meta App Secret entry; rerun GET-only inspection of secret names.

# Recheck all five encrypted WhatsApp secret names after user confirmed verification-token setup; no values accessed.

# Verify final encrypted webhook secret after the owner corrected its Cloudflare binding type (no secret value access).
      - name: Verify public Meta callback route without sharing or guessing the secret
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base='https://mft-nexus-chatbot-20261012.mft-education-nexus-93f395f5.workers.dev';
          const req=async path=>{
            const r=await fetch(base+path,{redirect:'manual',signal:AbortSignal.timeout(15000)});
            return {status:r.status,body:(await r.text()).slice(0,1000),redirected:r.redirected};
          };
          const health=await req('/health');
          if(health.status!==200)throw Error('MFT_PUBLIC_HEALTH_UNREACHABLE_'+health.status);
          const status=JSON.parse(health.body);
          if(status.status!=='ok'||status.service!=='MFT EDUCATION NEXUS')throw Error('MFT_PUBLIC_WRONG_WORKER');
          const denied=await req('/webhook?hub.mode=subscribe&hub.verify_token=definitely-not-the-correct-token&hub.challenge=81029');
          if(denied.status!==403||denied.body!=='Forbidden')throw Error('MFT_CALLBACK_NOT_REACHABLE_OR_UNEXPECTED_RESPONSE_'+denied.status);
          console.log('MFT_META_CALLBACK_PUBLIC_HTTPS_REACHABLE=true');
          console.log('MFT_META_CALLBACK_EXPECTED_403_ON_WRONG_TOKEN=true');
          console.log('MFT_META_CALLBACK_REAL_TOKEN_MATCH=NOT_CHECKED');
          console.log('MFT_WHATSAPP_READY='+Boolean(status.whatsappReady));
          NODE

# Callback-rotation follow-up audit 2026-10-14: never read or output secret values.
