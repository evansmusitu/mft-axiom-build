name: MFT AI NEXUS — private Meta secret readiness check
on:
  push:
    branches:
      - feature/mft-ai-nexus-cloudflare-20261012
    paths:
      - .github/workflows/mft-nexus-meta-secret-readonly.yml
permissions:
  contents: read
jobs:
  check-existing-worker-only:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref_name == 'feature/mft-ai-nexus-cloudflare-20261012'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
    steps:
      - name: Read only exact existing MFT Worker private setting names
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const id=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
          if(id!=='93f395f5121954671f92fffa453d6b61'||!token||token.length<20)throw Error('MFT_SCOPED_AUTH_ABSENT');
          const name='mft-nexus-chatbot-20261012';
          const base='https://api.cloudflare.com/client/v4/accounts/'+id+'/workers/scripts/'+name;
          const get=async suffix=>{
            const r=await fetch(base+suffix,{headers:{Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(15000)});
            const j=await r.json();
            if(r.status!==200||j.success!==true)throw Error('MFT_SCOPED_WORKER_READ_DENIED');
            return j.result;
          };
          const settings=await get('/settings');
          if(!Array.isArray(settings.bindings)||!settings.bindings.some(b=>b.name==='AI'&&b.type==='ai')||!settings.bindings.some(b=>b.name==='AI_BUDGET'&&b.type==='durable_object_namespace'))throw Error('MFT_EXACT_WORKER_IDENTITY_UNVERIFIED');
          const items=await get('/secrets');
          if(!Array.isArray(items))throw Error('MFT_SECRETS_RESPONSE_INVALID');
          const names=new Set(items.map(x=>x.name));
          const required=['WHATSAPP_APP_SECRET','WHATSAPP_ACCESS_TOKEN','WHATSAPP_PHONE_NUMBER_ID','WHATSAPP_VERIFY_TOKEN','WHATSAPP_TEST_RECIPIENTS'];
          const status=Object.fromEntries(required.map(k=>[k,names.has(k)]));
          console.log('MFT_NEXUS_SECRET_NAMES_ONLY='+JSON.stringify(status));
          console.log('MFT_NEXUS_PRIVATE_SETTINGS_READY='+required.every(x=>names.has(x)));
          console.log('MFT_NEXUS_GET_ONLY_NO_TOKEN_OR_SECRET_VALUES_LOGGED');
          NODE

# Recheck existing secret-name presence after user confirmed Cloudflare secure token entry (no values read).
