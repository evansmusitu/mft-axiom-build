name: MFT Phase5 Authority Gate Negative Test

on:
  push:
    branches: [main]
    paths:
      - 'tools/mft_phase5_authority_gate.py'
      - '.github/workflows/mft-phase5-authority-gate-negative.yml'

permissions:
  contents: read

jobs:
  negative-authority-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prove Phase5 promotion gate fails closed without an external trust anchor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out tmp
          set +e
          python tools/mft_phase5_authority_gate.py \
            --candidate-digest 138016dc11fe44c1ace0bb34922040acb7171acf21e38d40561a677747c86b35 \
            --candidate-artifact-id 9966621912 \
            --candidate-run-id 33956793559 \
            --trusted-key-fingerprint-file authority/phase5-authority-ed25519-public.sha256 \
            --public-key authority/phase5-authority-ed25519-public.pem \
            --approval authority/PHASE5_APPROVAL.json \
            --signature authority/PHASE5_APPROVAL.sig \
            --out out/PHASE5_EXTERNAL_AUTHORITY_VERIFICATION.json \
            > tmp/gate.log 2>&1
          rc=$?
          set -e
          cat tmp/gate.log
          test "$rc" = '42'
          grep -F 'PHASE5_AUTHORITY_GATE_BLOCKED:TRUSTED_AUTHORITY_KEY_FINGERPRINT_MISSING' tmp/gate.log
          test ! -e out/PHASE5_EXTERNAL_AUTHORITY_VERIFICATION.json
          test ! -e out/A14_V_PHASE5_EXIT_SEAL.json
          test ! -e out/FINAL_EXTERNAL_DEPENDENCY_LOCK.json
          printf '%s\n' \
            'PHASE5_AUTHORITY_GATE_NEGATIVE_TEST_PASS' \
            'trusted_authority_key_present=false' \
            'promotion_performed=false' \
            'A14_V_PHASE5_EXIT_SEAL.json=NOT_CREATED' \
            'FINAL_EXTERNAL_DEPENDENCY_LOCK.json=NOT_CREATED' \
            > out/PHASE5_AUTHORITY_GATE_NEGATIVE_STATUS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: phase5-authority-gate-negative-test-v1
          path: out/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
