name: MMF Dashboard Access Public Pin Refresh 20261025
on:
  push:
    branches: ['product/musitu-mail-fabric-isolated-20261009']
    paths: ['.github/workflows/mmf-dashboard-access-pin-refresh-20261025.yml']
permissions:
  contents: read
concurrency:
  group: mmf-private-identity-edge-content
  cancel-in-progress: false
jobs:
  refresh-dashboard-pins:
    if: github.event.before == 'b5c81eb187a88cd43d098c1d24c54d5c82ba78bd'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact parent, scoped diff and protected refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'product/musitu-mail-fabric-isolated-20261009'
          test "$(git rev-parse HEAD^)" = 'b5c81eb187a88cd43d098c1d24c54d5c82ba78bd'
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {isDeepStrictEqual} from 'node:util';
          const expected=['.github/workflows/mmf-dashboard-access-pin-refresh-20261025.yml',
            'musitu-mail-fabric/src/staging/mmf-dashboard-access-pin-refresh-20261025.mjs',
            'musitu-mail-fabric/test/mmf-dashboard-access-pin-refresh.test.mjs'].sort();
          const actual=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split('\n').sort();
          if(!isDeepStrictEqual(expected,actual))throw Error('MMF_SOURCE_SCOPE_DRIFT');
          const root='https://api.github.com/repos/evansmusitu/mft-axiom-build/';
          const get=async path=>{const r=await fetch(root+path,{headers:{authorization:'Bearer '+process.env.GH_TOKEN},redirect:'error',signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('MMF_GIT_READ_DENIED');return r.json()};
          const [main,pr,head]=await Promise.all([get('git/ref/heads/main'),get('pulls/1'),get('git/ref/heads/product/musitu-mail-fabric-isolated-20261009')]);
          if(main.object?.sha!=='bc48ab8aed137e61b76e25f113bb29e1efd7b11a'||pr.state!=='open'||pr.draft!==true||pr.merged!==false||
             pr.head?.sha!=='8fc1fbb7c5ebbcc1604ecf24c5f4594f2d5667e3'||head.object?.sha!==process.env.GITHUB_SHA)throw Error('MMF_PROTECTED_REF_DRIFT');
          console.log('MMF_EXACT_PARENT_SCOPE_AND_PROTECTED_REFS_VERIFIED');
          NODE
      - name: Complete automated suite without production credentials
        working-directory: musitu-mail-fabric
        run: |
          set -euo pipefail
          node --check src/staging/mmf-dashboard-access-pin-refresh-20261025.mjs
          npm run check
          npm test
      - name: Refresh only public Access pins through existing connection
        env:
          CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node musitu-mail-fabric/src/staging/mmf-dashboard-access-pin-refresh-20261025.mjs
      - name: Verify protected refs after execution
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.github.com/repos/evansmusitu/mft-axiom-build/';
          const get=async path=>{const r=await fetch(root+path,{headers:{authorization:'Bearer '+process.env.GH_TOKEN},redirect:'error',signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('MMF_GIT_READ_DENIED');return r.json()};
          const [main,pr]=await Promise.all([get('git/ref/heads/main'),get('pulls/1')]);
          if(main.object?.sha!=='bc48ab8aed137e61b76e25f113bb29e1efd7b11a'||pr.state!=='open'||pr.draft!==true||pr.merged!==false||
             pr.head?.sha!=='8fc1fbb7c5ebbcc1604ecf24c5f4594f2d5667e3')throw Error('MMF_PROTECTED_REF_DRIFT');
          console.log('MMF_MAIN_AND_DRAFT_PR1_UNCHANGED');
          NODE
      - name: Remove ephemeral proof
        if: always()
        run: rm -f "$RUNNER_TEMP/mmf-dashboard-pin-refresh-proof.json"
