name: MMF Full Launch Secret-Backed Preflight 20261026
# One-shot GET-only inventory through existing GitHub environment secrets.
# It never changes Access, DNS, Workers, mail, payments, or customer state.
on:
  push:
    branches: ['product/musitu-mail-fabric-isolated-20261009']
    paths: ['.github/workflows/mmf-full-launch-secret-backed-preflight-20261026.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mmf-full-launch-secret-backed-preflight-20261026
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_RULESETS_API_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact parent, isolated scope and protected refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'product/musitu-mail-fabric-isolated-20261009'
          test "$(git merge-base HEAD 70e8155643cdc0731b8a44fd313add8a53e6d905)" = '70e8155643cdc0731b8a44fd313add8a53e6d905'
          test "$(git diff --name-only 70e8155643cdc0731b8a44fd313add8a53e6d905 HEAD)" = '.github/workflows/mmf-full-launch-secret-backed-preflight-20261026.yml'
          node --input-type=module <<'NODE'
          const root='https://api.github.com/repos/evansmusitu/mft-axiom-build/';
          const get=async path=>{const r=await fetch(root+path,{headers:{authorization:'Bearer '+process.env.GH_TOKEN,
            accept:'application/vnd.github+json'},redirect:'error',signal:AbortSignal.timeout(12000)});
            if(!r.ok)throw Error('MMF_GITHUB_READ_DENIED');return r.json()};
          const [main,pr,head]=await Promise.all([get('git/ref/heads/main'),get('pulls/1'),
            get('git/ref/heads/product/musitu-mail-fabric-isolated-20261009')]);
          if(main.object?.sha!=='bc48ab8aed137e61b76e25f113bb29e1efd7b11a'||
             pr.state!=='open'||pr.draft!==true||pr.merged!==false||
             pr.head?.sha!=='8fc1fbb7c5ebbcc1604ecf24c5f4594f2d5667e3'||
             head.object?.sha!==process.env.GITHUB_SHA)throw Error('MMF_PROTECTED_REF_DRIFT');
          console.log('MMF_PARENT_SCOPE_AND_PROTECTED_REFS_VERIFIED');
          NODE
      - name: Require existing GitHub environment secret references without exposing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_RULESETS_API_TOKEN:-}"
          test "${#CLOUDFLARE_API_TOKEN}" -ge 20
          test "${#CLOUDFLARE_RULESETS_API_TOKEN}" -ge 20
          echo MMF_GITHUB_ENVIRONMENT_SECRETS_PRESENT
      - name: Complete automated suite before any authenticated inventory
        working-directory: musitu-mail-fabric
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test
      - name: Inspect closed MMF control plane and shared-worker binding baseline with GET only
        id: closed_control
        continue-on-error: true
        working-directory: musitu-mail-fabric
        shell: bash
        run: |
          set -euo pipefail
          node src/staging/mmf-private-cloud-controls-readonly.mjs --get-only
      - name: Inspect shared Paynow source and binding integrity with GET only
        id: paynow_integrity
        continue-on-error: true
        working-directory: musitu-mail-fabric
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node src/staging/mmf-joint-source-binding-getonly.mjs --get-only
      - name: Inspect disabled MMF Paynow canary with GET only
        id: paynow_canary
        continue-on-error: true
        working-directory: musitu-mail-fabric
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node src/staging/mmf-canary-bindings-getonly.mjs | tee "$RUNNER_TEMP/mmf-paynow-canary-getonly.json"
      - name: Inspect real OIDC claim capability with GET only
        id: oidc_claims
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node musitu-mail-fabric/src/staging/mmf-oidc-claim-capability-getonly-20261017.mjs
      - name: Independently read back OIDC, Access MFA, source pins and anonymous denial
        id: oidc_readback
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node musitu-mail-fabric/src/staging/readback-mmf-oidc-qualification-20261017.mjs
      - name: Record sanitized one-run outcomes
        if: always()
        env:
          CLOSED_CONTROL_OUTCOME: ${{ steps.closed_control.outcome }}
          PAYNOW_INTEGRITY_OUTCOME: ${{ steps.paynow_integrity.outcome }}
          PAYNOW_CANARY_OUTCOME: ${{ steps.paynow_canary.outcome }}
          OIDC_CLAIMS_OUTCOME: ${{ steps.oidc_claims.outcome }}
          OIDC_READBACK_OUTCOME: ${{ steps.oidc_readback.outcome }}
        shell: bash
        run: |
          umask 077
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const allowed=new Set(['success','failure','cancelled','skipped']);
          const outcome=name=>allowed.has(process.env[name])?process.env[name]:'unknown';
          const checks={
            closedControl:outcome('CLOSED_CONTROL_OUTCOME'),
            sharedPaynowIntegrity:outcome('PAYNOW_INTEGRITY_OUTCOME'),
            disabledPaynowCanary:outcome('PAYNOW_CANARY_OUTCOME'),
            oidcClaimCapability:outcome('OIDC_CLAIMS_OUTCOME'),
            oidcIndependentReadback:outcome('OIDC_READBACK_OUTCOME'),
          };
          const report={schema:'mmf-full-launch-secret-backed-preflight-v1',
            observedAt:new Date().toISOString(),sourceSha:process.env.GITHUB_SHA,
            branch:process.env.GITHUB_REF_NAME,checks,cloudflareMutationCount:0,
            secretValuesRead:false,secretValuesStored:false,mailSent:false,paymentsAttempted:false,
            accessChanged:false,dnsChanged:false,workersChanged:false,
            technicalReadbackPassed:Object.values(checks).every(x=>x==='success'),
            humanBrowserAcceptancePerformed:false,independentSecurityApprovalSupplied:false,
            customerConsentSupplied:false,legalApprovalSupplied:false};
          writeFileSync(join(process.env.RUNNER_TEMP,'mmf-full-launch-secret-backed-preflight.json'),
            JSON.stringify(report,null,2)+'\n',{mode:0o600,flag:'wx'});
          console.log(JSON.stringify(report));
          NODE
      - name: Upload sanitized private evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmf-full-launch-secret-backed-preflight-20261026
          path: |
            ${{ runner.temp }}/mmf-full-launch-secret-backed-preflight.json
            ${{ runner.temp }}/mmf-private-control-getonly-20261015.json
            ${{ runner.temp }}/mmf-paynow-joint-source-binding-getonly.json
            ${{ runner.temp }}/mmf-paynow-canary-getonly.json
            ${{ runner.temp }}/mmf-oidc-claim-capability-getonly-proof.json
            ${{ runner.temp }}/mmf-oidc-qualification-readback-proof.json
          retention-days: 14
          if-no-files-found: warn
      - name: Verify protected refs after execution
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.github.com/repos/evansmusitu/mft-axiom-build/';
          const get=async path=>{const r=await fetch(root+path,{headers:{authorization:'Bearer '+process.env.GH_TOKEN},redirect:'error',signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('MMF_GITHUB_READ_DENIED');return r.json()};
          const [main,pr]=await Promise.all([get('git/ref/heads/main'),get('pulls/1')]);
          if(main.object?.sha!=='bc48ab8aed137e61b76e25f113bb29e1efd7b11a'||
             pr.state!=='open'||pr.draft!==true||pr.merged!==false||
             pr.head?.sha!=='8fc1fbb7c5ebbcc1604ecf24c5f4594f2d5667e3')throw Error('MMF_PROTECTED_REF_DRIFT');
          console.log('MMF_MAIN_AND_DRAFT_PR1_UNCHANGED');
          NODE
      - name: Fail closed on authenticated technical drift
        if: always()
        env:
          CLOSED_CONTROL_OUTCOME: ${{ steps.closed_control.outcome }}
          PAYNOW_INTEGRITY_OUTCOME: ${{ steps.paynow_integrity.outcome }}
          PAYNOW_CANARY_OUTCOME: ${{ steps.paynow_canary.outcome }}
          OIDC_CLAIMS_OUTCOME: ${{ steps.oidc_claims.outcome }}
          OIDC_READBACK_OUTCOME: ${{ steps.oidc_readback.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CLOSED_CONTROL_OUTCOME" = success
          test "$PAYNOW_INTEGRITY_OUTCOME" = success
          test "$PAYNOW_CANARY_OUTCOME" = success
          test "$OIDC_CLAIMS_OUTCOME" = success
          test "$OIDC_READBACK_OUTCOME" = success
      - name: Remove transient evidence
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/mmf-full-launch-secret-backed-preflight.json" \
            "$RUNNER_TEMP/mmf-private-control-getonly-20261015.json" \
            "$RUNNER_TEMP/mmf-paynow-joint-source-binding-getonly.json" \
            "$RUNNER_TEMP/mmf-paynow-canary-getonly.json" \
            "$RUNNER_TEMP/mmf-oidc-claim-capability-getonly-proof.json" \
            "$RUNNER_TEMP/mmf-oidc-qualification-readback-proof.json"
