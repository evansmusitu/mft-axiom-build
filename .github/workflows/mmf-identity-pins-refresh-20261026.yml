name: MMF Private Identity Pins Refresh 20261026
# One-shot content-only repair of the existing Access-protected MMF Worker.
# No Access, DNS, bindings, customer API, mail, payment, or unrelated Worker changes.
on:
  push:
    branches: ['product/musitu-mail-fabric-isolated-20261009']
    paths:
      - '.github/workflows/mmf-identity-pins-refresh-20261026.yml'
      - 'musitu-mail-fabric/package.json'
      - 'musitu-mail-fabric/src/staging/mmf-identity-pins-refresh-20261026.mjs'
      - 'musitu-mail-fabric/test/mmf-identity-pins-refresh-20261026.test.mjs'
permissions:
  contents: read
concurrency:
  group: mmf-private-identity-edge-content
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event.before == 'faa8d8fbc27e0dfc344512ca2c52fa77c036831a'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact parent, scoped files and protected refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'product/musitu-mail-fabric-isolated-20261009'
          test "$(git rev-parse HEAD^)" = 'faa8d8fbc27e0dfc344512ca2c52fa77c036831a'
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {isDeepStrictEqual} from 'node:util';
          const expected=['.github/workflows/mmf-identity-pins-refresh-20261026.yml','musitu-mail-fabric/package.json',
            'musitu-mail-fabric/src/staging/mmf-identity-pins-refresh-20261026.mjs',
            'musitu-mail-fabric/test/mmf-identity-pins-refresh-20261026.test.mjs'].sort();
          const actual=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split('\n').sort();
          if(!isDeepStrictEqual(actual,expected))throw Error('MMF_SOURCE_SCOPE_DRIFT');
          const root='https://api.github.com/repos/evansmusitu/mft-axiom-build/';
          const get=async path=>{const r=await fetch(root+path,{headers:{authorization:'Bearer '+process.env.GH_TOKEN,
            accept:'application/vnd.github+json'},redirect:'error',signal:AbortSignal.timeout(12000)});
            if(!r.ok)throw Error('MMF_GITHUB_READ_DENIED');return r.json()};
          const [main,pr,head]=await Promise.all([get('git/ref/heads/main'),get('pulls/1'),
            get('git/ref/heads/product/musitu-mail-fabric-isolated-20261009')]);
          if(main.object?.sha!=='bc48ab8aed137e61b76e25f113bb29e1efd7b11a'||
             pr.state!=='open'||pr.draft!==true||pr.merged!==false||
             pr.head?.sha!=='8fc1fbb7c5ebbcc1604ecf24c5f4594f2d5667e3'||
             head.object?.sha!==process.env.GITHUB_SHA)throw Error('MMF_PROTECTED_REF_DRIFT');
          console.log('MMF_EXACT_PARENT_SCOPE_AND_PROTECTED_REFS_VERIFIED');
          NODE
      - name: Complete automated suite before deployment
        working-directory: musitu-mail-fabric
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test
      - name: Confirm the authenticated pre-deploy failure is exactly the stale OIDC pin
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          set +e
          node musitu-mail-fabric/src/staging/readback-mmf-oidc-qualification-20261017.mjs > "$RUNNER_TEMP/mmf-identity-predeploy.log"
          status=$?
          set -e
          test "$status" -eq 2
          grep -q '"failure":"MMF_OIDC_CONFIG_DRIFT"' "$RUNNER_TEMP/mmf-identity-predeploy.log"
          grep -q '"adminOnlyMfa":true' "$RUNNER_TEMP/mmf-identity-predeploy.log"
          grep -q '"sourceVerified":true' "$RUNNER_TEMP/mmf-identity-predeploy.log"
          echo MMF_EXACT_STALE_OIDC_PIN_CONFIRMED
      - name: Refresh only verified public Access and OIDC pins through GitHub secret
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test "${#CLOUDFLARE_API_TOKEN}" -ge 20
          node musitu-mail-fabric/src/staging/mmf-identity-pins-refresh-20261026.mjs
      - name: Independently read back exact source, MFA, isolation and anonymous denial
        shell: bash
        run: |
          set -euo pipefail
          node musitu-mail-fabric/src/staging/readback-mmf-oidc-qualification-20261017.mjs
      - name: Upload sanitized private deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmf-private-identity-pins-refresh-20261026
          path: |
            ${{ runner.temp }}/mmf-private-identity-pins-refresh-proof.json
            ${{ runner.temp }}/mmf-oidc-qualification-readback-proof.json
          retention-days: 14
          if-no-files-found: warn
      - name: Verify protected refs after deployment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.github.com/repos/evansmusitu/mft-axiom-build/';
          const get=async path=>{const r=await fetch(root+path,{headers:{authorization:'Bearer '+process.env.GH_TOKEN},redirect:'error',signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('MMF_GITHUB_READ_DENIED');return r.json()};
          const [main,pr]=await Promise.all([get('git/ref/heads/main'),get('pulls/1')]);
          if(main.object?.sha!=='bc48ab8aed137e61b76e25f113bb29e1efd7b11a'||
             pr.state!=='open'||pr.draft!==true||pr.merged!==false||
             pr.head?.sha!=='8fc1fbb7c5ebbcc1604ecf24c5f4594f2d5667e3')throw Error('MMF_PROTECTED_REF_DRIFT');
          console.log('MMF_MAIN_AND_DRAFT_PR1_UNCHANGED');
          NODE
      - name: Remove transient evidence
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/mmf-identity-predeploy.log" \
            "$RUNNER_TEMP/mmf-private-identity-pins-refresh-proof.json" \
            "$RUNNER_TEMP/mmf-oidc-qualification-readback-proof.json"
