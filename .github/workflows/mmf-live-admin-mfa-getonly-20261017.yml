name: MMF Live Administrator MFA Readback 20261017
# One-shot GET ONLY; never emits identity, email, device IDs, tokens or auth logs.
on:
  push:
    branches: ['product/musitu-mail-fabric-isolated-20261009']
    paths: ['.github/workflows/mmf-live-admin-mfa-getonly-20261017.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.before == '5bd246590f333f75920508e74fdde53f24faf110'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify protected refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const g=async p=>{const r=await fetch('https://api.github.com/repos/evansmusitu/mft-axiom-build/'+p,{headers:{authorization:'Bearer '+process.env.GH_TOKEN},signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error('MMF_GITHUB_REF_UNAVAILABLE');return r.json()};
          const [m,p]=await Promise.all([g('git/ref/heads/main'),g('pulls/1')]);
          if(m.object?.sha!=='bc48ab8aed137e61b76e25f113bb29e1efd7b11a'||p.state!=='open'||p.draft!==true||p.merged!==false)throw Error('MMF_GITHUB_PROTECTED_REF_DRIFT');
          console.log('MMF_PROTECTED_REFS_OK');
          NODE
      - name: Inspect sole administrator enrolled MFA and closed gateway
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const acct='93f395f5121954671f92fffa453d6b61';
          const tok=process.env.CLOUDFLARE_API_TOKEN;
          if(process.env.CLOUDFLARE_ACCOUNT_ID!==acct||!tok||tok.length<20)throw Error('MMF_CLOUDFLARE_TOKEN_MISSING');
          const prefix='accounts/'+acct+'/access/';
          const gatewayId='f8ab12fe-251f-44fa-80de-1c2f2bdc4055';
          const clientId='4ae515a1-189d-41c2-8020-c99ea157b021';
          const launcherId='9dfc2a78-0dae-463b-9235-03ae134be007';
          const idpId='ec04a8ab-9382-4df0-9589-d2c98618e6af';
          let gets=0;
          const get=async p=>{
            gets++;
            const r=await fetch('https://api.cloudflare.com/client/v4/'+p,{method:'GET',headers:{authorization:'Bearer '+tok,accept:'application/json'},redirect:'error',cache:'no-store',signal:AbortSignal.timeout(15000)});
            if(!r.ok||r.redirected)throw Error('MMF_CLOUDFLARE_READ_ERROR');
            const len=r.headers.get('content-length');if(len!==null&&Number(len)>200000)throw Error('MMF_RESPONSE_LIMIT');
            const txt=await r.text();if(txt.length>200000)throw Error('MMF_RESPONSE_LIMIT');
            const obj=JSON.parse(txt);if(obj.success!==true||!Object.hasOwn(obj,'result')||Number(obj.result_info?.total_pages||1)!==1)throw Error('MMF_CLOUDFLARE_READ_INCOMPLETE');
            return obj.result;
          };
          const proof={schema:'mmf-human-mfa-enrollment-getonly-20261017',observedAt:new Date().toISOString(),
            scopedAccountVerified:false,soleAdminLauncherVerified:false,
            accountMfaEnabled:null,accessAuthenticatorRegistered:null,accessUserRecentlyAuthenticated:false,
            mfaAppConfigured:false,orgMfaMethodsAvailable:false,
            oidcRegisteredClientClosed:false,customerGatewayClosed:false,
            trueBrowserMfaChallengeObserved:false,realBrowserAcceptancePassed:false,publicIngressEnabled:false,
            allowPolicyCreated:false,cloudflareMutationCount:0,gate:'MMF_PERSONAL_MFA_NOT_INDEPENDENTLY_PROVEN'};
          try{
            const [zones,org,launcher,launcherPolicies,gateway,gatewayPolicies,client,clientPolicies,members,users]=await Promise.all([
              get('zones?name=mftintelligence.com&per_page=100'),
              get(prefix+'organizations'),get(prefix+'apps/'+launcherId),get(prefix+'apps/'+launcherId+'/policies?per_page=100'),
              get(prefix+'apps/'+gatewayId),get(prefix+'apps/'+gatewayId+'/policies?per_page=100'),
              get(prefix+'apps/'+clientId),get(prefix+'apps/'+clientId+'/policies?per_page=100'),
              get('accounts/'+acct+'/members?per_page=100'),get(prefix+'users?per_page=100')]);
            proof.scopedAccountVerified=Array.isArray(zones)&&zones.length===1&&zones[0].account?.id===acct&&zones[0].status==='active';
            proof.soleAdminLauncherVerified=launcher?.id===launcherId&&launcher.type==='app_launcher'&&launcher.domain==='musitu-axiom.cloudflareaccess.com'&&
              Array.isArray(launcherPolicies)&&launcherPolicies.length===1&&launcherPolicies[0].decision==='allow'&&
              launcherPolicies[0].include?.length===1&&launcherPolicies[0].require?.length===1&&launcherPolicies[0].require[0].login_method?.id===idpId;
            proof.orgMfaMethodsAvailable=org?.mfa_config?.allowed_authenticators?.includes('totp')===true&&org?.mfa_config?.allowed_authenticators?.includes('security_key')===true;
            proof.mfaAppConfigured=gateway?.id===gatewayId&&gateway?.mfa_config?.mfa_disabled===false&&gateway?.mfa_config?.allowed_authenticators?.includes('totp')===true;
            proof.customerGatewayClosed=gateway?.id===gatewayId&&gateway.domain==='mail-stage.mftintelligence.com'&&Array.isArray(gatewayPolicies)&&gatewayPolicies.length===0;
            proof.oidcRegisteredClientClosed=client?.id===clientId&&client.type==='saas'&&client.saas_app?.auth_type==='oidc'&&Array.isArray(clientPolicies)&&clientPolicies.length===0;
            if(!proof.scopedAccountVerified||!proof.soleAdminLauncherVerified||!proof.customerGatewayClosed||!proof.oidcRegisteredClientClosed)throw Error('MMF_PROTECTED_BASELINE_DRIFT');
            const subject=launcherPolicies[0].include[0]?.email?.email;
            if(typeof subject!=='string'||subject.length>254||!subject.includes('@'))throw Error('MMF_APPROVED_ADMIN_POLICY_MISSING');
            const same=x=>typeof x==='string'&&x.toLowerCase()===subject.toLowerCase();
            const ms=Array.isArray(members)?members.filter(m=>same(m.user?.email)):[];
            const us=Array.isArray(users)?users.filter(u=>same(u.email)||u.emails?.some(e=>same(e.value))):[];
            proof.adminMemberFound=ms.length===1;
            proof.adminAccessUserFound=us.length===1;
            if(ms.length===1){
              const flag=ms[0].user?.two_factor_authentication_enabled;
              proof.accountMfaEnabled=typeof flag==='boolean'?flag:null;
            }
            if(us.length===1&&typeof us[0].id==='string'){
              const record=await get(prefix+'users/'+encodeURIComponent(us[0].id));
              const authenticators=Array.isArray(record?.mfa_authenticators)?record.mfa_authenticators:null;
              proof.accessAuthenticatorRegistered=authenticators===null?null:authenticators.some(a=>typeof a==='object'&&['totp','authenticator','security_key','biometrics'].includes(String(a.type||a.method||'').toLowerCase()));
              proof.accessAuthenticatorCount=authenticators===null?null:authenticators.length;
              proof.accessUserRecentlyAuthenticated=typeof record?.last_successful_login==='string'&&
                Number.isFinite(Date.parse(record.last_successful_login))&&Date.parse(record.last_successful_login)>Date.now()-72*3600000;
            }
            proof.getCount=gets;
            proof.gate=proof.accountMfaEnabled===true&&proof.accessAuthenticatorRegistered===true&&proof.orgMfaMethodsAvailable&&proof.mfaAppConfigured?
              'MMF_ADMIN_MFA_DEVICE_METADATA_CONFIRMED_NOT_BROWSER_TESTED':'MMF_PERSONAL_MFA_METADATA_PARTIAL_OR_UNAVAILABLE';
          }catch{
            proof.gate='MMF_MFA_INSPECTION_INCONCLUSIVE';proof.getCount=gets;
          }finally{
            writeFileSync(join(process.env.RUNNER_TEMP,'mmf-private-admin-mfa-status-20261017.json'),JSON.stringify(proof,null,2)+'\n',{mode:0o600,flag:'wx'});
            console.log(JSON.stringify({gate:proof.gate,accountMfa:proof.accountMfaEnabled,accessMfa:proof.accessAuthenticatorRegistered,
              userRecentlyAuthenticated:proof.accessUserRecentlyAuthenticated,allowPoliciesCreated:false,mutations:0}));
          }
          if(proof.gate==='MMF_MFA_INSPECTION_INCONCLUSIVE')process.exitCode=2;
          NODE
      - name: Preserve strictly non-identifying evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmf-private-admin-mfa-getonly-20261017
          path: ${{ runner.temp }}/mmf-private-admin-mfa-status-20261017.json
          retention-days: 14
          if-no-files-found: warn
      - name: Delete transient evidence
        if: always()
        run: rm -f "$RUNNER_TEMP/mmf-private-admin-mfa-status-20261017.json"
