name: MMF Live Identity Read-Only Diagnostic 20261016
on:
  push:
    branches: ['product/musitu-mail-fabric-isolated-20261009']
    paths: ['.github/workflows/mmf-live-identity-diagnostic-20261016.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.event.before == '80afc06b742904ab885b31cf3177f3413c85b366'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify protected refs before using the existing connection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.github.com/repos/evansmusitu/mft-axiom-build/';
          const get=async p=>{const r=await fetch(root+p,{headers:{authorization:'Bearer '+process.env.GH_TOKEN},signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('GIT_READ_DENIED');return r.json()};
          const [main,pr]=await Promise.all([get('git/ref/heads/main'),get('pulls/1')]);
          if(main.object?.sha!=='bc48ab8aed137e61b76e25f113bb29e1efd7b11a'||pr.state!=='open'||!pr.draft||pr.merged)throw Error('PROTECTED_REFS_DRIFT');
          console.log('PROTECTED_REFS_PRESERVED');
          NODE
      - name: Read Cloudflare identity, MFA and MMF ingress configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MMF_EVIDENCE_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAgmHj/TdhsrVKKuRrPkHQ
            kl9uZyVcBaC1IxEnfaDwFyWCwNOS9p7ElhybBKVKWNNDylEGCvYotges3PY+B2GR
            YygiDmxC+C0rYgwwajQUKx4js6fj1Jufi/2Ps7fnzj3KnF2gKoKznaK0cDrKWZH7
            p3GUubC4XgO0AZyek1vscnzj+01gXFooNXEaew6Hk7au7IWdGAseU7vWAxb1Mf0o
            maDE95Zgvgnx5us1KziF1QzUnR8951KmCt1JH2p+alrQSgv8wLSSMyXyCeZSNLr9
            7/5rRZqkRJR3wbYO59yYibbe+9cF/nFfoMRNGAqsAqfO+O98YH30ugq6fOtZl7Aa
            6eg2hkRtQF7eanQwhlbonqk0iWep3vmHGv1E189rcIfZgtOIUGyExi+GBHEBLf44
            3XleKzQKEImnPPGA+8ueAIUHPmXpnZfwlT/2SV4dJexhphI8ffDna2j6lJjk1Sk3
            gHU3SmbuYW7OY+JREcBzYToqvm2jdY2qWZlsbylWOnh1AgMBAAE=
            -----END PUBLIC KEY-----
        run: node musitu-mail-fabric/src/staging/cloudflare-identity-diagnostic-20261016.mjs
      - name: Preserve encrypted configuration and non-sensitive status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmf-live-identity-diagnostic-20261016
          path: |
            ${{ runner.temp }}/mmf-identity-diagnostic.encrypted.json
            ${{ runner.temp }}/mmf-identity-diagnostic-summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Export exact MMF-only source for private continuation
        run: |
          set -euo pipefail
          git ls-files -z -- musitu-mail-fabric '.github/workflows/mmf*' '.github/workflows/musitu-mail*' > "$RUNNER_TEMP/mmf-source-files"
          tar --null -T "$RUNNER_TEMP/mmf-source-files" -czf "$RUNNER_TEMP/mmf-source-exact.tar.gz"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/mmf-source-commit.txt"
          sha256sum "$RUNNER_TEMP/mmf-source-exact.tar.gz" > "$RUNNER_TEMP/mmf-source-sha256.txt"
      - name: Export public source snapshot only
        uses: actions/upload-artifact@v4
        with:
          name: mmf-current-exact-source-20261016
          path: |
            ${{ runner.temp }}/mmf-source-exact.tar.gz
            ${{ runner.temp }}/mmf-source-commit.txt
            ${{ runner.temp }}/mmf-source-sha256.txt
          retention-days: 7
          if-no-files-found: error
