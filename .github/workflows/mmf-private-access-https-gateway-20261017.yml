name: MMF Administrator-Only HTTPS Staging Gateway 20261017
# One-shot push gate; only own new private Worker + exact reserved MMF custom domain.
on:
  push:
    branches: ['product/musitu-mail-fabric-isolated-20261009']
    paths: ['.github/workflows/mmf-private-access-https-gateway-20261017.yml']
permissions:
  contents: read
jobs:
  deploy-private-gate:
    if: github.event.before == '19ce36f956bb943aa07475a3a62be982609e6e94'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm protected Git surfaces
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const g=async path=>{const r=await fetch('https://api.github.com/repos/evansmusitu/mft-axiom-build/'+path,{headers:{authorization:'Bearer '+process.env.GH_TOKEN},signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error('MMF_GIT_GUARD_UNAVAILABLE');return r.json()};
          const [main,pr]=await Promise.all([g('git/ref/heads/main'),g('pulls/1')]);
          if(main.object?.sha!=='bc48ab8aed137e61b76e25f113bb29e1efd7b11a'||pr.state!=='open'||!pr.draft||pr.merged)throw Error('MMF_GIT_GUARD_DRIFT');
          console.log('MMF_PROTECTED_GIT_GUARD_PASSED');
          NODE
      - name: Verify and deploy isolated cryptographic Access backstop
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          const acct='93f395f5121954671f92fffa453d6b61',token=process.env.CLOUDFLARE_API_TOKEN;
          const domain='mail-stage.mftintelligence.com',worker='mmf-private-identity-edge-20261017';
          const p='accounts/'+acct+'/access/';
          const appId='f8ab12fe-251f-44fa-80de-1c2f2bdc4055',oidcId='4ae515a1-189d-41c2-8020-c99ea157b021';
          const launcherId='9dfc2a78-0dae-463b-9235-03ae134be007',providerId='ec04a8ab-9382-4df0-9589-d2c98618e6af';
          let gets=0,mutations=0;
          const proof={schema:'mmf-private-https-access-gate-v20261017',observedAt:new Date().toISOString(),
             sourceCommit:process.env.GITHUB_SHA,cloudflareMutations:0,hostname:domain,
             protectedGitVerified:true,cloudflareAccountVerified:false,operatorOnlyPoliciesVerified:false,
             mfaGatewayConfigured:false,accessAudiencePinned:false,workerUploaded:false,
             workersDevDisabled:false,previewsDisabled:false,domainAttached:false,customDomainReadback:false,
             unauthorizedDenied:false,independentRealUserBrowserTest:false,appLevelOidcLoginVerified:false,
             realSending:false,commerce:false,customerApi:false,
             gate:'MMF_ACCESS_GATE_PRECONDITIONS_NOT_MET'};
          const log=(gate)=>{proof.gate=gate;proof.cloudflareGets=gets;proof.cloudflareMutations=mutations;
            writeFileSync(join(process.env.RUNNER_TEMP,'mmf-private-https-gateway-proof.json'),JSON.stringify(proof,null,2)+'\n',{flag:'wx',mode:0o600});
            console.log(JSON.stringify({gate:proof.gate,uploaded:proof.workerUploaded,domainAttached:proof.domainAttached,
              unauthorizedDenied:proof.unauthorizedDenied,workersDevDisabled:proof.workersDevDisabled,mutations}));};
          async function request(path,method='GET',payload=null){
            if(!['GET','PUT','POST'].includes(method))throw Error('MMF_UNSUPPORTED_MUTATION');
            if(method==='GET')gets++;else mutations++;
            const headers={authorization:'Bearer '+token,accept:'application/json'};
            if(payload!==null&&! (payload instanceof FormData))headers['content-type']='application/json';
            const r=await fetch('https://api.cloudflare.com/client/v4/'+path,{method,headers,
              ...(payload===null?{}:{body:payload instanceof FormData?payload:JSON.stringify(payload)}),
              redirect:'error',cache:'no-store',signal:AbortSignal.timeout(25000)});
            const content=await r.text();if(content.length>200000)throw Error('MMF_CF_RESPONSE_TOO_BIG');
            let response;try{response=JSON.parse(content)}catch{throw Error('MMF_CF_INVALID_JSON')}
            if(!r.ok||response.success!==true||!Object.hasOwn(response,'result')||response.result_info?.total_pages>1){
              proof.lastHttpStatus=r.status;
              proof.lastCloudflareCodes=(response.errors||[]).map(x=>Number.isInteger(x.code)?x.code:null);
              throw Error('MMF_CF_REQUEST_REJECTED');
            }
            return response.result;
          }
          const eligiblePolicy=(r,email)=>r?.decision==='allow'&&r.name==='MMF sole administrator private staging only'&&
            r.session_duration==='15m'&&r.include?.length===1&&r.include[0].email?.email===email&&
            r.require?.length===1&&r.require[0].login_method?.id===providerId&&
            Array.isArray(r.exclude)&&r.exclude.length===0;
          const mfaOk=x=>x?.mfa_config?.mfa_disabled===false&&
            x.mfa_config.allowed_authenticators?.includes('totp')&&x.mfa_config.session_duration==='15m';
          try{
            if(process.env.CLOUDFLARE_ACCOUNT_ID!==acct||!token||token.length<20)throw Error('MMF_CF_TOKEN_NOT_PRESENT');
            const [zones,org,app,gwPolicies,oidc,oidcPolicies,launcher,launcherPolicies,members,domains,scripts]=await Promise.all([
               request('zones?name=mftintelligence.com&per_page=100'),request(p+'organizations'),
               request(p+'apps/'+appId),request(p+'apps/'+appId+'/policies?per_page=100'),
               request(p+'apps/'+oidcId),request(p+'apps/'+oidcId+'/policies?per_page=100'),
               request(p+'apps/'+launcherId),request(p+'apps/'+launcherId+'/policies?per_page=100'),
               request('accounts/'+acct+'/members?per_page=100'),request('accounts/'+acct+'/workers/domains?per_page=100'),
               request('accounts/'+acct+'/workers/scripts?per_page=100')]);
            if(zones?.length!==1||zones[0].account?.id!==acct||zones[0].status!=='active'||
               org?.auth_domain!=='musitu-axiom.cloudflareaccess.com'||
               !org.mfa_config?.allowed_authenticators?.includes('totp')||
               app?.id!==appId||app.domain!==domain||app.type!=='self_hosted'||!mfaOk(app)||
               oidc?.id!==oidcId||oidc.type!=='saas'||!mfaOk(oidc)||
               !Array.isArray(gwPolicies)||gwPolicies.length!==1||!Array.isArray(oidcPolicies)||oidcPolicies.length!==1||
               launcher?.id!==launcherId||launcher.type!=='app_launcher'||launcherPolicies?.length!==1||
               !Array.isArray(domains)||!Array.isArray(scripts))throw Error('MMF_BASELINE_DRIFT');
            const email=launcherPolicies[0].include?.[0]?.email?.email;
            if(typeof email!=='string'||email.length>254||!email.includes('@')||
               !eligiblePolicy(gwPolicies[0],email)||!eligiblePolicy(oidcPolicies[0],email)||
               !Array.isArray(members)||members.filter(x=>x.user?.email?.toLowerCase()===email.toLowerCase()&&
                 x.user?.two_factor_authentication_enabled===true).length!==1)throw Error('MMF_ADMIN_MFA_OR_POLICY_NOT_VERIFIED');
            proof.cloudflareAccountVerified=true;proof.operatorOnlyPoliciesVerified=true;proof.mfaGatewayConfigured=true;
            if(typeof app.aud!=='string'||app.aud.length<21||app.aud.length>200||
               !/^[A-Za-z0-9_-]+$/.test(app.aud))throw Error('MMF_ACCESS_AUD_UNAVAILABLE');
            proof.accessAudiencePinned=true;
            const [dns,routes]=await Promise.all([
              request('zones/'+zones[0].id+'/dns_records?name='+domain+'&per_page=100'),
              request('zones/'+zones[0].id+'/workers/routes?per_page=100')]);
            if(!Array.isArray(dns)||dns.length!==0||
               domains.some(d=>d.hostname===domain)||
               scripts.some(w=>w.id===worker)||
               !Array.isArray(routes)||routes.some(r=>typeof r.pattern==='string'&&
                  (r.pattern.includes(domain)||r.pattern.includes('*.mftintelligence.com')||r.pattern==='*/*')))
               throw Error('MMF_HOST_WORKER_OR_ROUTE_COLLISION');
            const source=readFileSync('musitu-mail-fabric/src/edge/mmf-access-stage-gateway.mjs','utf8');
            if(!source.includes('MMF_PRIVATE_ACCESS_DENIED')||source.length>20000)throw Error('MMF_WORKER_SOURCE_UNTRUSTED');
            const form=new FormData();
            const adminHash=createHash('sha256').update(email.toLowerCase()).digest('hex');
            form.set('metadata',new Blob([JSON.stringify({main_module:'mmf-access-stage-gateway.mjs',compatibility_date:'2026-10-17',bindings:[
              {type:'plain_text',name:'MMF_ACCESS_AUD',text:app.aud},
              {type:'plain_text',name:'MMF_APPROVED_ADMIN_SHA256',text:adminHash},
              {type:'plain_text',name:'MMF_REAL_SEND_ENABLED',text:'false'},
              {type:'plain_text',name:'MMF_COMMERCE_ENABLED',text:'false'},
              {type:'plain_text',name:'MMF_CUSTOMER_API_ENABLED',text:'false'}
            ]})],{type:'application/json'}));
            form.set('mmf-access-stage-gateway.mjs',new Blob([source],{type:'application/javascript+module'}),'mmf-access-stage-gateway.mjs');
            const uploaded=await request('accounts/'+acct+'/workers/scripts/'+worker,'PUT',form);
            if(uploaded?.id!==worker)throw Error('MMF_WORKER_UPLOAD_READBACK_INCOMPLETE');
            proof.workerUploaded=true;
            const disabled=await request('accounts/'+acct+'/workers/scripts/'+worker+'/subdomain','POST',{enabled:false,previews_enabled:false});
            const read=await request('accounts/'+acct+'/workers/scripts/'+worker+'/subdomain');
            proof.workersDevDisabled=disabled?.enabled===false&&read?.enabled===false;
            proof.previewsDisabled=disabled?.previews_enabled===false&&read?.previews_enabled===false;
            if(!proof.workersDevDisabled||!proof.previewsDisabled)throw Error('MMF_WORKER_PUBLIC_BYPASS_PATH');
            const updated=await request('accounts/'+acct+'/workers/domains','PUT',{
              hostname:domain,service:worker,zone_id:zones[0].id,zone_name:'mftintelligence.com'});
            proof.domainAttached=updated?.hostname===domain&&updated?.service===worker;
            if(!proof.domainAttached)throw Error('MMF_CUSTOM_DOMAIN_ATTACHMENT_UNCONFIRMED');
            const readDomains=await request('accounts/'+acct+'/workers/domains?per_page=100');
            proof.customDomainReadback=Array.isArray(readDomains)&&readDomains.filter(x=>x.hostname===domain&&x.service===worker).length===1;
            if(!proof.customDomainReadback)throw Error('MMF_CUSTOM_DOMAIN_READBACK_FAILED');
            const url='https://'+domain+'/private/gateway';
            const probe=await fetch(url,{method:'GET',redirect:'manual',signal:AbortSignal.timeout(12000)}).catch(()=>null);
            proof.anonymousHttpStatus=probe?.status??null;
            proof.unauthorizedDenied=probe!==null&&probe.status!==200&&probe.status!==201;
            if(probe?.body)await probe.body.cancel().catch(()=>{});
            proof.gate=proof.unauthorizedDenied?'MMF_PRIVATE_HTTPS_GATEWAY_ATTACHED_ANONYMOUS_DENIED_LOGIN_STILL_REQUIRED':
              'MMF_PRIVATE_GATEWAY_ATTACHED_ANONYMOUS_PROBE_UNCONFIRMED';
          }catch(error){proof.failure=/^[A-Z0-9_]+$/.test(error?.message||'')?error.message:'MMF_CLOUDFLARE_OR_TLS_ERROR';
            proof.gate=proof.domainAttached?'MMF_PRIVATE_GATEWAY_READBACK_REQUIRES_REVIEW':'MMF_PRIVATE_GATEWAY_NOT_ACTIVATED';
          }finally{
            if(proof.gate.startsWith('MMF_PRIVATE_HTTPS_GATEWAY_ATTACHED')){
              log(proof.gate);
            }else{
              log(proof.gate);process.exitCode=2;
            }
          }
          NODE
      - name: Save sanitized staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmf-https-stage-only-gate-20261017
          path: ${{ runner.temp }}/mmf-private-https-gateway-proof.json
          retention-days: 14
          if-no-files-found: warn
      - name: Wipe transient staging evidence
        if: always()
        run: rm -f "$RUNNER_TEMP/mmf-private-https-gateway-proof.json"