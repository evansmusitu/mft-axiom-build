name: MMF Private Cloud GET Only Control Recheck 20261015
# One-time isolated owner-authorized read-only inventory, NEVER a deployment.
# No customer state, email, DNS, payment, or shared Worker modification.
on:
  push:
    branches: ['product/musitu-mail-fabric-isolated-20261009']
    paths:
      - '.github/workflows/mmf-private-getonly-control-recheck-20261015.yml'
permissions:
  contents: read
concurrency:
  group: mmf-private-control-getonly-20261015
  cancel-in-progress: false
jobs:
  closed-stage-getonly:
    if: github.event.before == 'bd3fad52872c66216a735828b3daa2cea290fb78'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require pinned source parent, protected main and draft PR 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'product/musitu-mail-fabric-isolated-20261009'
          test "$(git rev-parse HEAD^)" = 'bd3fad52872c66216a735828b3daa2cea290fb78'
          node --input-type=module <<'NODE'
          const root='https://api.github.com/repos/evansmusitu/mft-axiom-build/';
          const get=async p=>{const r=await fetch(root+p,{headers:{authorization:'Bearer '+process.env.GH_TOKEN,accept:'application/vnd.github+json'},signal:AbortSignal.timeout(12_000)});
            if(!r.ok)throw Error('MMF_GITHUB_READ_FAIL_CLOSED');return r.json()};
          const [main,pr]=await Promise.all([get('git/ref/heads/main'),get('pulls/1')]);
          if(main.object?.sha!=='bc48ab8aed137e61b76e25f113bb29e1efd7b11a'||
             pr.state!=='open'||pr.draft!==true||pr.merged!==false)
            throw Error('MMF_PROTECTED_CONTROL_DRIFT_BLOCKED');
          console.log('MMF_PROTECTED_GIT_REFS_INTACT');
          NODE
      - name: Offline GET-only contract tests and complete MMF regressions
        working-directory: musitu-mail-fabric
        shell: bash
        run: |
          set -euo pipefail
          node --check src/staging/mmf-private-cloud-controls-readonly.mjs
          node --test test/mmf-private-cloud-controls-readonly.test.mjs
          npm run check
          npm test
          set +e
          npm run check:phase1 > "$RUNNER_TEMP/mmf-commercial-denial.log" 2>&1
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'BLOCKED' "$RUNNER_TEMP/mmf-commercial-denial.log"
      - name: Live Cloudflare GET-only stage, canary and shared binding recheck
        working-directory: musitu-mail-fabric
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node src/staging/mmf-private-cloud-controls-readonly.mjs --get-only
      - name: Store only sanitized non-identifying observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmf-private-cloud-getonly-control-20261015
          path: ${{ runner.temp }}/mmf-private-control-getonly-20261015.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove temporary output
        if: always()
        run: rm -f "$RUNNER_TEMP/mmf-commercial-denial.log" "$RUNNER_TEMP/mmf-private-control-getonly-20261015.json"
