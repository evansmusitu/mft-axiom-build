name: MMF Live Private HTTPS Gateway Readback 20261017
# Existing authenticated connection. Cloudflare API access is GET-only.
on:
  push:
    branches: ['product/musitu-mail-fabric-isolated-20261009']
    paths: ['.github/workflows/mmf-private-https-final-readback-20261017.yml']
permissions:
  contents: read
jobs:
  readback:
    if: github.event.before == 'e9387cc5a31b1939b08c9a4cba96ad0d4ff2e3f7'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify protected refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const root='https://api.github.com/repos/evansmusitu/mft-axiom-build/';
          const get=async p=>{const r=await fetch(root+p,{headers:{authorization:'Bearer '+process.env.GH_TOKEN},signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('MMF_GIT_READ_FAILED');return r.json()};
          const [m,p]=await Promise.all([get('git/ref/heads/main'),get('pulls/1')]);
          if(m.object?.sha!=='bc48ab8aed137e61b76e25f113bb29e1efd7b11a'||p.state!=='open'||p.draft!==true||p.merged!==false)throw Error('MMF_PROTECTED_GIT_DRIFT');
          console.log('MMF_PROTECTED_GIT_REFS_VERIFIED');
          NODE
      - name: Read existing Cloudflare account, exact dashboard code, MFA and recent Access outcomes
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          const account='93f395f5121954671f92fffa453d6b61',token=process.env.CLOUDFLARE_API_TOKEN;
          const host='mail-stage.mftintelligence.com',worker='mmf-private-identity-edge-20261017';
          const prefix='accounts/'+account+'/access/';
          const appId='f8ab12fe-251f-44fa-80de-1c2f2bdc4055',launcherId='9dfc2a78-0dae-463b-9235-03ae134be007',idpId='ec04a8ab-9382-4df0-9589-d2c98618e6af';
          let getCount=0;
          const report={schema:'mmf-dashboard-existing-connection-getonly-v2',observedAt:new Date().toISOString(),sourceSha:process.env.GITHUB_SHA,
            cloudflareConnectionVerified:false,accountVerified:false,adminOnly:false,mfaRequired:false,bindingsVerified:false,
            customDomainVerified:false,previewsDisabled:false,exactDashboardSourceVerified:false,pinnedKeysValid:false,
            realSending:false,payments:false,customerApi:false,ownerBrowserAcceptance:false,applicationOidcAcceptance:false,
            cloudflareMutationCount:0,gate:'MMF_EXISTING_CONNECTION_READBACK_INCOMPLETE'};
          const get=async(path,raw=false)=>{
            getCount++;
            const r=await fetch('https://api.cloudflare.com/client/v4/'+path,{method:'GET',headers:{authorization:'Bearer '+token,accept:'application/json'},redirect:'error',cache:'no-store',signal:AbortSignal.timeout(20000)});
            if(!r.ok||r.redirected)throw Error('MMF_CF_READ_HTTP_'+r.status);
            const text=await r.text();if(text.length>500000)throw Error('MMF_CF_READ_TOO_BIG');
            if(raw)return text;
            const j=JSON.parse(text);if(j.success!==true||!Object.hasOwn(j,'result')||Number(j.result_info?.total_pages||1)>1)throw Error('MMF_CF_READ_INCOMPLETE');return j.result;
          };
          try{
            if(process.env.CLOUDFLARE_ACCOUNT_ID!==account||!token||token.length<20)throw Error('MMF_EXISTING_TOKEN_MISSING');
            const [zones,org,app,policies,launcher,lp,settings,sub,domains,remote]=await Promise.all([
              get('zones?name=mftintelligence.com&per_page=100'),get(prefix+'organizations'),get(prefix+'apps/'+appId),get(prefix+'apps/'+appId+'/policies?per_page=100'),
              get(prefix+'apps/'+launcherId),get(prefix+'apps/'+launcherId+'/policies?per_page=100'),
              get('accounts/'+account+'/workers/scripts/'+worker+'/settings'),get('accounts/'+account+'/workers/scripts/'+worker+'/subdomain'),
              get('accounts/'+account+'/workers/domains?per_page=100'),get('accounts/'+account+'/workers/scripts/'+worker+'/content/v2',true)]);
            report.cloudflareConnectionVerified=true;
            report.accountVerified=zones?.length===1&&zones[0].account?.id===account&&zones[0].status==='active'&&org?.auth_domain==='musitu-axiom.cloudflareaccess.com';
            const email=lp?.[0]?.include?.[0]?.email?.email;
            report.adminOnly=app?.id===appId&&app.type==='self_hosted'&&app.domain===host&&launcher?.type==='app_launcher'&&typeof email==='string'&&email.includes('@')&&
              policies?.length===1&&policies[0].decision==='allow'&&policies[0].include?.length===1&&policies[0].include[0].email?.email===email&&
              policies[0].require?.length===1&&policies[0].require[0].login_method?.id===idpId;
            report.mfaRequired=app.mfa_config?.mfa_disabled===false&&app.mfa_config?.allowed_authenticators?.includes('totp')===true;
            const b=settings?.bindings,names=['MMF_ACCESS_AUD','MMF_APPROVED_ADMIN_SHA256','MMF_REAL_SEND_ENABLED','MMF_COMMERCE_ENABLED','MMF_CUSTOMER_API_ENABLED'];
            report.bindingsVerified=Array.isArray(b)&&b.length===5&&names.every(name=>b.some(x=>x.name===name&&x.type==='plain_text'))&&
              b.find(x=>x.name==='MMF_ACCESS_AUD')?.text===app.aud&&
              typeof email==='string'&&b.find(x=>x.name==='MMF_APPROVED_ADMIN_SHA256')?.text===createHash('sha256').update(email.toLowerCase()).digest('hex')&&
              ['MMF_REAL_SEND_ENABLED','MMF_COMMERCE_ENABLED','MMF_CUSTOMER_API_ENABLED'].every(name=>b.find(x=>x.name===name)?.text==='false');
            report.customDomainVerified=Array.isArray(domains)&&domains.filter(x=>x.hostname===host&&x.service===worker).length===1;
            report.previewsDisabled=sub?.enabled===false&&sub?.previews_enabled===false;
            const match=[...remote.matchAll(/const PINNED_ACCESS_CERTS=Object\.freeze\((\{[^;\n]+\})\);/g)];
            if(match.length===1){
              const pins=JSON.parse(match[0][1]);
              report.pinnedKeysValid=Array.isArray(pins.keys)&&pins.keys.length>0&&pins.keys.length<=5&&Number.isSafeInteger(pins.validUntil)&&pins.validUntil>Date.now()&&pins.validUntil<Date.now()+15*86400000;
              report.keyCount=Array.isArray(pins.keys)?pins.keys.length:null;
              report.pinValidUntil=Number.isSafeInteger(pins.validUntil)?new Date(pins.validUntil).toISOString():null;
              const template=readFileSync('musitu-mail-fabric/src/edge/mmf-access-stage-gateway.mjs','utf8');
              const marker='const PINNED_ACCESS_CERTS={keys:[],validUntil:0};';
              report.exactDashboardSourceVerified=template.split(marker).length===2&&remote.includes(template.replace(marker,match[0][0]).trimEnd())&&remote.includes('privateOperatorDashboard')&&remote.includes("u.pathname==='/private/dashboard'");
            }
            const since=new Date(Date.now()-2*3600000).toISOString(),until=new Date().toISOString();
            try{
              const logs=await get(prefix+'logs/access_requests?per_page=100&limit=100&since='+encodeURIComponent(since)+'&until='+encodeURIComponent(until));
              report.accessLogsReadable=Array.isArray(logs);
              const matches=Array.isArray(logs)?logs.filter(x=>x.app_uid===appId||x.app_id===appId||x.application?.id===appId):[];
              report.gatewayEventsLastTwoHours=matches.length;
              report.gatewayAllowedLastTwoHours=matches.filter(x=>x.allowed===true||x.action==='allow').length;
              report.gatewayDeniedLastTwoHours=matches.filter(x=>x.allowed===false||x.action==='deny').length;
            }catch(e){report.accessLogsReadable=false;report.logReadFailure=/^MMF_[A-Z0-9_]+$/.test(e.message)?e.message:'MMF_LOG_READ_UNAVAILABLE';}
            report.gate=[report.cloudflareConnectionVerified,report.accountVerified,report.adminOnly,report.mfaRequired,report.bindingsVerified,report.customDomainVerified,report.previewsDisabled,report.exactDashboardSourceVerified,report.pinnedKeysValid].every(Boolean)?
              'MMF_EXISTING_CLOUDFLARE_CONNECTION_AND_DEPLOYED_DASHBOARD_VERIFIED_BROWSER_PENDING':'MMF_EXISTING_CONNECTION_CONFIGURATION_DRIFT';
          }catch(e){report.failure=/^MMF_[A-Z0-9_]+$/.test(e.message||'')?e.message:'MMF_READ_UNEXPECTED_FAILURE';}
          finally{
            report.cfGetCount=getCount;
            writeFileSync(join(process.env.RUNNER_TEMP,'mmf-dashboard-existing-connection-getonly.json'),JSON.stringify(report,null,2)+'\n',{flag:'wx',mode:0o600});
            console.log(JSON.stringify(report));
          }
          if(report.gate!=='MMF_EXISTING_CLOUDFLARE_CONNECTION_AND_DEPLOYED_DASHBOARD_VERIFIED_BROWSER_PENDING')process.exitCode=2;
          NODE
      - name: Preserve non-identifying readback proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmf-dashboard-existing-connection-getonly-20261017
          path: ${{ runner.temp }}/mmf-dashboard-existing-connection-getonly.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove ephemeral proof
        if: always()
        run: rm -f "$RUNNER_TEMP/mmf-dashboard-existing-connection-getonly.json"
