name: MMF Live Private HTTPS Gateway Readback 20261017
# Existing authenticated connection. Every Cloudflare API request is GET-only.
on:
  push:
    branches: ['product/musitu-mail-fabric-isolated-20261009']
    paths: ['.github/workflows/mmf-private-https-final-readback-20261017.yml']
permissions:
  contents: read
jobs:
  readback:
    if: github.event.before == '78e9b47e89b202a843d0f0432954113699f6babd'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify protected refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const root='https://api.github.com/repos/evansmusitu/mft-axiom-build/';
          const get=async path=>{const r=await fetch(root+path,{headers:{authorization:'Bearer '+process.env.GH_TOKEN},signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('MMF_GIT_READ_FAILED');return r.json()};
          const [main,pr]=await Promise.all([get('git/ref/heads/main'),get('pulls/1')]);
          if(main.object?.sha!=='bc48ab8aed137e61b76e25f113bb29e1efd7b11a'||pr.state!=='open'||pr.draft!==true||pr.merged!==false)throw Error('MMF_PROTECTED_REF_DRIFT');
          console.log('MMF_PROTECTED_REFS_UNCHANGED');
          NODE
      - name: Independent GET-only exact source, binding, signing pin and anonymous-route readback
        run: |
          set -euo pipefail
          node --check musitu-mail-fabric/src/staging/readback-mmf-oidc-qualification-20261017.mjs
          node musitu-mail-fabric/src/staging/readback-mmf-oidc-qualification-20261017.mjs
      - name: Preserve sanitized readback proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmf-oidc-qualification-readback-proof-20261017
          path: ${{ runner.temp }}/mmf-oidc-qualification-readback-proof.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove ephemeral proof
        if: always()
        run: rm -f "$RUNNER_TEMP/mmf-oidc-qualification-readback-proof.json"
