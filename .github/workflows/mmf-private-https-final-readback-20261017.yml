name: MMF Live Private HTTPS Gateway Readback 20261017
# GET-only safety evidence after domain was attached; no access tokens/cookies in logs.
on:
  push:
    branches: ['product/musitu-mail-fabric-isolated-20261009']
    paths: ['.github/workflows/mmf-private-https-final-readback-20261017.yml']
permissions:
  contents: read
jobs:
  readback:
    if: github.event.before == '32e2d886f18e7c18fc9c442f4886220992566389'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect actual HTTPS, Worker subdomain and sole administrator Access
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';import {join} from 'node:path';
          const a='93f395f5121954671f92fffa453d6b61',t=process.env.CLOUDFLARE_API_TOKEN;
          if(a!==process.env.CLOUDFLARE_ACCOUNT_ID||!t||t.length<20)throw Error('MMF_TOKEN_NOT_PRESENT');
          const p='accounts/'+a+'/access/',host='mail-stage.mftintelligence.com',
                worker='mmf-private-identity-edge-20261017',
                id='f8ab12fe-251f-44fa-80de-1c2f2bdc4055',idp='ec04a8ab-9382-4df0-9589-d2c98618e6af';
          let count=0;
          const api=async name=>{count++;
            const r=await fetch('https://api.cloudflare.com/client/v4/'+name,{method:'GET',headers:{authorization:'Bearer '+t,accept:'application/json'},redirect:'error',cache:'no-store',signal:AbortSignal.timeout(12000)});
            const str=await r.text();if(str.length>100000)throw Error('MMF_RESPONSE_BIG');
            const j=JSON.parse(str);if(!r.ok||j.success!==true||j.result_info?.total_pages>1)throw Error('MMF_CF_READ_FAILED');return j.result;
          };
          const out={schema:'mmf-https-gateway-final-real-getonly-20261017',observedAt:new Date().toISOString(),
            configuredHostname:host,accountVerified:false,appMfaRequired:false,adminOnlyPolicyVerified:false,
            customDomainBoundToOwnedWorker:false,workersDevAndPreviewsOff:false,identityWorkerSettingsVerified:false,
            noAnonymousSuccess:false,realBrowserMfaAccepted:false,realOidcLoginVerified:false,
            noRealCustomerSending:true,noPayments:true,noPublicCustomerApis:true,
            cfGetCount:0,mutations:0,gate:'MMF_PRIVATE_GATEWAY_NOT_VERIFIED'};
          try{
            const [zones,org,app,policies,domains,sub,settings,launcher,lp]=await Promise.all([
              api('zones?name=mftintelligence.com&per_page=100'),api(p+'organizations'),
              api(p+'apps/'+id),api(p+'apps/'+id+'/policies?per_page=100'),
              api('accounts/'+a+'/workers/domains?per_page=100'),
              api('accounts/'+a+'/workers/scripts/'+worker+'/subdomain'),
              api('accounts/'+a+'/workers/scripts/'+worker+'/settings'),
              api(p+'apps/9dfc2a78-0dae-463b-9235-03ae134be007'),
              api(p+'apps/9dfc2a78-0dae-463b-9235-03ae134be007/policies?per_page=100')]);
            out.accountVerified=zones?.length===1&&zones[0].account?.id===a&&zones[0].status==='active'&&org?.auth_domain==='musitu-axiom.cloudflareaccess.com';
            out.appMfaRequired=app?.id===id&&app.domain===host&&app.mfa_config?.mfa_disabled===false&&app.mfa_config.allowed_authenticators?.includes('totp')===true;
            const email=lp?.[0]?.include?.[0]?.email?.email;
            out.adminOnlyPolicyVerified=launcher?.type==='app_launcher'&&typeof email==='string'&&email.length>5&&policies?.length===1&&
              policies[0].decision==='allow'&&policies[0].include?.length===1&&policies[0].include[0].email?.email===email&&
              policies[0].require?.length===1&&policies[0].require[0].login_method?.id===idp;
            out.customDomainBoundToOwnedWorker=Array.isArray(domains)&&domains.filter(d=>d.hostname===host&&d.service===worker).length===1;
            out.workersDevAndPreviewsOff=sub?.enabled===false&&sub?.previews_enabled===false;
            const b=settings?.bindings;
            const allowed=['MMF_ACCESS_AUD','MMF_APPROVED_ADMIN_SHA256','MMF_REAL_SEND_ENABLED','MMF_COMMERCE_ENABLED','MMF_CUSTOMER_API_ENABLED'];
            out.identityWorkerSettingsVerified=Array.isArray(b)&&b.length===5&&b.every(x=>x.type==='plain_text'&&allowed.includes(x.name))&&
              ['MMF_REAL_SEND_ENABLED','MMF_COMMERCE_ENABLED','MMF_CUSTOMER_API_ENABLED'].every(name=>b.some(x=>x.name===name&&x.text==='false'));
            if(!out.accountVerified||!out.appMfaRequired||!out.adminOnlyPolicyVerified||!out.customDomainBoundToOwnedWorker||!out.workersDevAndPreviewsOff||!out.identityWorkerSettingsVerified)throw Error('MMF_PRIVATE_CONFIG_READBACK_DRIFT');
            for(let n=0;n<3;n++){
              try{
                const r=await fetch('https://'+host+'/private/gateway',{redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(9000)});
                out.lastAnonymousHttpStatus=r.status;
                const location=r.headers.get('location')||'';
                out.accessRedirectObserved=[301,302,303,307,308].includes(r.status)&&
                   (location.includes('/cdn-cgi/access/')||location.includes('musitu-axiom.cloudflareaccess.com'));
                out.noAnonymousSuccess=out.accessRedirectObserved||r.status===403||r.status===401;
                await r.body?.cancel();
                if(out.noAnonymousSuccess)break;
              }catch{out.httpsProbeTransportUnavailable=true}
              if(n<2)await new Promise(res=>setTimeout(res,4000));
            }
            out.gate=out.noAnonymousSuccess?'MMF_REAL_HTTPS_ACCESS_CHALLENGE_VERIFIED_AUTHENTICATED_BROWSER_PENDING':
              'MMF_HTTPS_CUSTOM_DOMAIN_BOUND_TLS_OR_ANON_PROBE_PENDING';
          }catch(error){out.gate='MMF_CLOUDFLARE_READBACK_INCOMPLETE';out.reason=/^[A-Z_]+$/.test(error.message)?error.message:'UNKNOWN';}
          finally{
            out.cfGetCount=count;
            writeFileSync(join(process.env.RUNNER_TEMP,'mmf-private-https-final-proof.json'),JSON.stringify(out,null,2)+'\n',{flag:'wx',mode:0o600});
            console.log(JSON.stringify({gate:out.gate,domain:out.customDomainBoundToOwnedWorker,
              mfa:out.appMfaRequired,adminOnly:out.adminOnlyPolicyVerified,workerSubdomainsDisabled:out.workersDevAndPreviewsOff,
              readback:out.identityWorkerSettingsVerified,anonymousDenied:out.noAnonymousSuccess,status:out.lastAnonymousHttpStatus??null,mutations:0}));
          }
          if(out.gate!=='MMF_REAL_HTTPS_ACCESS_CHALLENGE_VERIFIED_AUTHENTICATED_BROWSER_PENDING')process.exitCode=2;
          NODE
      - name: Preserve only redacted GET-only observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmf-private-https-final-getonly-20261017
          path: ${{ runner.temp }}/mmf-private-https-final-proof.json
          retention-days: 14
          if-no-files-found: warn
      - name: Clean ephemeral evidence
        if: always()
        run: rm -f "$RUNNER_TEMP/mmf-private-https-final-proof.json"