name: MMF Private OIDC Qualification Harness Release 20261017
# One-time deployment; the old dashboard module and all Access settings must match.
on:
  push:
    branches: ['product/musitu-mail-fabric-isolated-20261009']
    paths: ['.github/workflows/mmf-private-oidc-qualification-release-20261017.yml']
permissions:
  contents: read
jobs:
  release:
    if: github.event.before == 'ab26fe3504a61ad5cc0edf2a5653b7745820b574'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact parent and protected refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'ab26fe3504a61ad5cc0edf2a5653b7745820b574'
          node --input-type=module <<'NODE'
          const base='https://api.github.com/repos/evansmusitu/mft-axiom-build/';
          const get=async path=>{const r=await fetch(base+path,{headers:{authorization:'Bearer '+process.env.GH_TOKEN},signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('MMF_GITHUB_READ_DENIED');return r.json()};
          const [main,pr]=await Promise.all([get('git/ref/heads/main'),get('pulls/1')]);
          if(main.object?.sha!=='bc48ab8aed137e61b76e25f113bb29e1efd7b11a'||pr.state!=='open'||pr.draft!==true||pr.merged!==false)throw Error('MMF_PROTECTED_REF_DRIFT');
          console.log('MMF_PROTECTED_REFS_UNCHANGED');
          NODE
      - name: Complete automated suite before deployment
        working-directory: musitu-mail-fabric
        run: |
          set -euo pipefail
          node --check src/edge/mmf-oidc-qualification-cloudflare.mjs
          node --check src/staging/mmf-oidc-qualification-flow.mjs
          node --check src/staging/deploy-mmf-oidc-qualification-20261017.mjs
          npm run check
          npm test
      - name: Existing Cloudflare connection scoped qualification release and independent readback
        run: node musitu-mail-fabric/src/staging/deploy-mmf-oidc-qualification-20261017.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mmf-oidc-qualification-release-proof-20261017
          path: ${{ runner.temp }}/mmf-oidc-qualification-release-proof.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove local sanitized proof
        if: always()
        run: rm -f "$RUNNER_TEMP/mmf-oidc-qualification-release-proof.json"
