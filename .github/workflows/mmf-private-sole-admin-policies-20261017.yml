name: MMF Single-Admin Access Policy Stage 20261017
# Scope: ONLY existing MMF staging self-hosted and registered OIDC client.
# No DNS, no Worker, no secret, no public/all-users policy, no customer release.
on:
  push:
    branches: ['product/musitu-mail-fabric-isolated-20261009']
    paths: ['.github/workflows/mmf-private-sole-admin-policies-20261017.yml']
permissions:
  contents: read
jobs:
  configure:
    if: github.event.before == '492faa7b67df9fe777e9dc0a996f28656c275332'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 9
    env:
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify protected main and draft PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const get=async p=>{const r=await fetch('https://api.github.com/repos/evansmusitu/mft-axiom-build/'+p,{headers:{authorization:'Bearer '+process.env.GH_TOKEN},signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('MMF_GIT_PROTECT_READ_ERROR');return r.json()};
          const [m,pr]=await Promise.all([get('git/ref/heads/main'),get('pulls/1')]);
          if(m.object?.sha!=='bc48ab8aed137e61b76e25f113bb29e1efd7b11a'||pr.state!=='open'||pr.draft!==true||pr.merged!==false)throw Error('MMF_PROTECTED_REFS_DRIFT');
          console.log('MMF_PROTECTED_REFS_VERIFIED');
          NODE
      - name: Attach narrowly scoped administrator MFA-required policies only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const a='93f395f5121954671f92fffa453d6b61',t=process.env.CLOUDFLARE_API_TOKEN;
          if(process.env.CLOUDFLARE_ACCOUNT_ID!==a||!t||t.length<20)throw Error('MMF_TOKEN_UNAVAILABLE');
          const pre='accounts/'+a+'/access/';
          const gw='f8ab12fe-251f-44fa-80de-1c2f2bdc4055';
          const oidc='4ae515a1-189d-41c2-8020-c99ea157b021';
          const launcher='9dfc2a78-0dae-463b-9235-03ae134be007';
          const idp='ec04a8ab-9382-4df0-9589-d2c98618e6af';
          let getCount=0,postCount=0;
          const report={schema:'mmf-single-admin-access-policy-v20261017',
            observedAt:new Date().toISOString(),beforeGetCount:0,policyPostCount:0,
            readbackVerified:false,soleAdminOnly:false,mfaAppRequired:false,
            enrolledMfaChallengeObserved:false,
            httpsGatewayQualified:false,realBrowserAcceptancePassed:false,
            realSendingEnabled:false,realPaymentsEnabled:false,
            publicDnsCreated:false,workerDeployed:false,
            gate:'MMF_ACCESS_POLICY_NOT_QUALIFIED'};
          async function api(p,method='GET',body){
            if(method!=='GET'&&method!=='POST')throw Error('MMF_UNAUTHORIZED_METHOD');
            if(method==='POST'&&!p.endsWith('/policies'))throw Error('MMF_UNAUTHORIZED_WRITE_PATH');
            method==='GET'?getCount++:postCount++;
            const r=await fetch('https://api.cloudflare.com/client/v4/'+p,{method,headers:{authorization:'Bearer '+t,accept:'application/json',...(body?{'content-type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),redirect:'error',cache:'no-store',signal:AbortSignal.timeout(15000)});
            if(!r.ok||r.redirected)throw Error('MMF_CLOUDFLARE_HTTP_REJECTED');
            const txt=await r.text();if(txt.length>250000)throw Error('MMF_RESPONSE_TOO_LARGE');
            const j=JSON.parse(txt);
            if(j.success!==true||!Object.hasOwn(j,'result')||j.result_info?.total_pages>1)throw Error('MMF_CLOUDFLARE_API_REJECTED');
            return j.result;
          }
          const strictPolicy=(p,email)=>{
            return p?.decision==='allow'&&p?.name==='MMF sole administrator private staging only'&&
              p?.session_duration==='15m'&&p.include?.length===1&&
              p.include[0]?.email?.email===email&&p.require?.length===1&&
              p.require[0]?.login_method?.id===idp&&
              Array.isArray(p.exclude)&&p.exclude.length===0;
          };
          try{
            const [zones,org,apps,providers,launch,launchPolicies,members]=await Promise.all([
              api('zones?name=mftintelligence.com&per_page=100'),
              api(pre+'organizations'),api(pre+'apps?per_page=100'),
              api(pre+'identity_providers?per_page=100'),
              api(pre+'apps/'+launcher),api(pre+'apps/'+launcher+'/policies?per_page=100'),
              api('accounts/'+a+'/members?per_page=100')
            ]);
            if(!Array.isArray(zones)||zones.length!==1||zones[0].account?.id!==a||zones[0].status!=='active'||
               org?.auth_domain!=='musitu-axiom.cloudflareaccess.com'||
               !org.mfa_config?.allowed_authenticators?.includes('totp')||
               !providers?.some(x=>x.id===idp&&x.type==='cloudflare'&&x.config?.restrict_to_account_members===true)||
               !apps?.some(x=>x.id===gw&&x.type==='self_hosted')||
               !apps?.some(x=>x.id===oidc&&x.type==='saas'))throw Error('MMF_OWNER_ACCOUNT_OR_MFA_DRIFT');
            if(launch?.id!==launcher||launch.type!=='app_launcher'||launch.domain!==org.auth_domain||
               launchPolicies?.length!==1||launchPolicies[0].decision!=='allow'||
               launchPolicies[0].include?.length!==1||launchPolicies[0].require?.length!==1||
               launchPolicies[0].require[0].login_method?.id!==idp||(launchPolicies[0].exclude||[]).length)throw Error('MMF_LAUNCHER_SCOPE_DRIFT');
            const email=launchPolicies[0].include[0]?.email?.email;
            if(typeof email!=='string'||!email.includes('@')||email.length>254)throw Error('MMF_ADMIN_UNKNOWN');
            const member=members?.filter(m=>typeof m.user?.email==='string'&&m.user.email.toLowerCase()===email.toLowerCase());
            if(member?.length!==1||member[0].user?.two_factor_authentication_enabled!==true)throw Error('MMF_ADMIN_ACCOUNT_MFA_NOT_VERIFIED');
            const [gateway,gwPolicies,saas,oidcPolicies,dns,routes,domains]=await Promise.all([
              api(pre+'apps/'+gw),api(pre+'apps/'+gw+'/policies?per_page=100'),
              api(pre+'apps/'+oidc),api(pre+'apps/'+oidc+'/policies?per_page=100'),
              api('zones/'+zones[0].id+'/dns_records?name=mail-stage.mftintelligence.com&per_page=100'),
              api('zones/'+zones[0].id+'/workers/routes?per_page=100'),
              api('accounts/'+a+'/workers/domains?per_page=100')
            ]);
            const mfaOK=x=>x?.mfa_config?.mfa_disabled===false&&
              x.mfa_config.allowed_authenticators?.includes('totp')===true&&
              x.mfa_config.session_duration==='15m';
            const noIngress=Array.isArray(dns)&&dns.length===0&&Array.isArray(routes)&&
              !routes.some(x=>typeof x?.pattern==='string'&&
                (x.pattern.includes('mail-stage.mftintelligence.com')||x.pattern.includes('*.mftintelligence.com')||x.pattern==='*/*'))&&
              Array.isArray(domains)&&!domains.some(x=>x.hostname==='mail-stage.mftintelligence.com'||x.domain==='mail-stage.mftintelligence.com');
            if(gateway?.id!==gw||gateway.type!=='self_hosted'||gateway.domain!=='mail-stage.mftintelligence.com'||
              saas?.id!==oidc||saas.type!=='saas'||saas.saas_app?.auth_type!=='oidc'||
              !mfaOK(gateway)||!mfaOK(saas)||!noIngress)throw Error('MMF_MFA_OR_INGRESS_NOT_SAFE');
            const existing=[[gw,gwPolicies],[oidc,oidcPolicies]];
            if(existing.some(([id,policies])=>!Array.isArray(policies)||policies.length!==0&&
                 (policies.length!==1||!strictPolicy(policies[0],email))))throw Error('MMF_POLICY_DRIFT');
            const desired={name:'MMF sole administrator private staging only',decision:'allow',
              include:[{email:{email}}],require:[{login_method:{id:idp}}],exclude:[],session_duration:'15m'};
            for(const [id,policies] of existing){
              if(policies.length===0)await api(pre+'apps/'+id+'/policies','POST',desired);
            }
            const [gp,op,g2,o2,finalDns,finalRoutes]=await Promise.all([
              api(pre+'apps/'+gw+'/policies?per_page=100'),
              api(pre+'apps/'+oidc+'/policies?per_page=100'),
              api(pre+'apps/'+gw),api(pre+'apps/'+oidc),
              api('zones/'+zones[0].id+'/dns_records?name=mail-stage.mftintelligence.com&per_page=100'),
              api('zones/'+zones[0].id+'/workers/routes?per_page=100')
            ]);
            report.readbackVerified=gp?.length===1&&op?.length===1&&
              strictPolicy(gp[0],email)&&strictPolicy(op[0],email);
            report.mfaAppRequired=mfaOK(g2)&&mfaOK(o2);
            report.soleAdminOnly=report.readbackVerified;
            report.publicDnsCreated=Array.isArray(finalDns)&&finalDns.length!==0;
            report.workerRouteObserved=Array.isArray(finalRoutes)&&finalRoutes.some(x=>typeof x.pattern==='string'&&x.pattern.includes('mail-stage.mftintelligence.com'));
            if(!report.readbackVerified||!report.mfaAppRequired||report.publicDnsCreated||report.workerRouteObserved)throw Error('MMF_POLICY_READBACK_OR_ISOLATION_FAILED');
            report.gate='MMF_PRIVATE_SINGLE_ADMIN_MFA_POLICIES_CONFIGURED_NO_PUBLIC_INGRESS';
          }catch{
            report.gate='MMF_PRIVATE_POLICY_CONFIG_OR_READBACK_INCONCLUSIVE';
          }finally{
            report.beforeGetCount=getCount;report.policyPostCount=postCount;
            writeFileSync(join(process.env.RUNNER_TEMP,'mmf-private-policy-stage-summary-20261017.json'),JSON.stringify(report,null,2)+'\n',{mode:0o600,flag:'wx'});
            console.log(JSON.stringify({gate:report.gate,policyPosts:postCount,readback:report.readbackVerified,onlyAdmin:report.soleAdminOnly,mfaConfig:report.mfaAppRequired,publicDns:report.publicDnsCreated}));
          }
          if(report.gate!=='MMF_PRIVATE_SINGLE_ADMIN_MFA_POLICIES_CONFIGURED_NO_PUBLIC_INGRESS')process.exitCode=2;
          NODE
      - name: Save sanitized private-stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmf-private-sole-admin-access-20261017
          path: ${{ runner.temp }}/mmf-private-policy-stage-summary-20261017.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove transient evidence
        if: always()
        run: rm -f "$RUNNER_TEMP/mmf-private-policy-stage-summary-20261017.json"
