name: MUSITU Mail Fabric Actual Cloud Queue to SQLite Verification 20261010
on:
  push:
    branches: ['product/musitu-mail-fabric-isolated-20261009']
    paths: ['.github/workflows/mmf-staging-queue-consumer-proof-20261010.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.before == 'f2dce680f58c13f7cc9c2ff72d232e35f9e28f1c'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
      MMF_QUEUE_ID: '1ff13f921b90488397e7f76970117aee'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard only the private exact Worker and staging Queue
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,k=process.env.CLOUDFLARE_API_TOKEN,q=process.env.MMF_QUEUE_ID;
          if(a!=='93f395f5121954671f92fffa453d6b61'||q!=='1ff13f921b90488397e7f76970117aee'||String(k||'').length<16)throw Error('SCOPE_GUARD');
          const base='https://api.cloudflare.com/client/v4/accounts/'+a;
          const get=async p=>{const r=await fetch(base+p,{headers:{authorization:'Bearer '+k},signal:AbortSignal.timeout(12000)});const o=await r.json();if(!r.ok||!o.success)throw Error('CF_READ_'+r.status);return o.result};
          const [queue,settings,sub,secrets]=await Promise.all([get('/queues/'+q),get('/workers/scripts/musitu-mail-fabric-staging-20261010/settings'),get('/workers/scripts/musitu-mail-fabric-staging-20261010/subdomain'),get('/workers/scripts/musitu-mail-fabric-staging-20261010/secrets')]);
          const bs=settings?.bindings||[],value=n=>bs.find(x=>x.name===n)?.text;
          if(queue?.queue_name!=='musitu-mail-fabric-staging-20261010'||sub?.enabled===true||sub?.previews_enabled===true||value('MMF_STAGE_ONLY')!=='true'||value('MMF_REAL_SEND_ENABLED')!=='false'||value('MMF_API_ENABLED')!=='false'||value('MMF_WEBHOOK_ENABLED')!=='false'||!bs.some(x=>x.name==='MMF_LEDGER'&&x.type==='durable_object_namespace')||!Array.isArray(secrets)||!secrets.some(x=>x.name==='MMF_STORAGE_RPC_SECRET'))throw Error('PRIVATE_STAGING_DRIFT');
          console.log(JSON.stringify({gate:'MMF_STAGE_LOG_VERIFICATION_PREFLIGHT',status:'PASS',private:true,realMail:false}));
          NODE
      - name: Read-only runtime trace and synthetic-only queue probe
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          err="$(mktemp)"
          (
            cd musitu-mail-fabric
            npx --yes wrangler@4 tail musitu-mail-fabric-staging-20261010 --format json >"$tmp" 2>"$err"
          ) &
          tail_pid="$!"
          cleanup(){ kill "$tail_pid" 2>/dev/null || true; rm -f "$tmp" "$err"; }
          trap cleanup EXIT
          sleep 7
          if ! kill -0 "$tail_pid" 2>/dev/null; then
            printf 'MMF_TAIL_NOT_CONNECTED; logs are not sufficient to prove cloud persistence\n'
            sed -E 's/(Bearer|token|secret).*/[REDACTED]/i' "$err" | tail -8
            exit 1
          fi
          node --input-type=module <<'NODE'
          import {randomBytes} from 'node:crypto';
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,k=process.env.CLOUDFLARE_API_TOKEN,q=process.env.MMF_QUEUE_ID;
          const probe='probe-cloud-'+randomBytes(6).toString('hex');
          const body={content_type:'json',body:{type:'MMF_STAGE_PROBE',probeId:probe}};
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+a+'/queues/'+q+'/messages',{
            method:'POST',headers:{Authorization:'Bearer '+k,'Content-Type':'application/json'},
            body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});
          const j=await r.json();
          if(!r.ok||j.success===false)throw Error('SYNTHETIC_QUEUE_POST_FAILED_'+r.status);
          console.log(JSON.stringify({gate:'MMF_SYNTHETIC_QUEUE_POST',status:'PASS',customerMessages:false}));
          NODE
          for attempt in $(seq 1 35); do
            if grep -q 'MMF_ISOLATED_QUEUE_TO_SQLITE_DO' "$tmp"; then break; fi
            if ! kill -0 "$tail_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module - "$tmp" <<'NODE'
          import fs from 'node:fs';
          const file=process.argv.at(-1);
          const lines=fs.readFileSync(file,'utf8').split('\n');
          let proven=false;
          for(const line of lines){
            if(!line.includes('MMF_ISOLATED_QUEUE_TO_SQLITE_DO'))continue;
            try{
              const obj=JSON.parse(line);
              for(const log of obj.logs||[]){
                for(const s of log.message||[]){
                  let event; try{event=JSON.parse(s)}catch{continue}
                  if(event.gate==='MMF_ISOLATED_QUEUE_TO_SQLITE_DO'&&event.status==='PASS'&&event.probeRecorded===true&&event.customerMailSent===false)proven=true;
                }
              }
            }catch{}
          }
          console.log(JSON.stringify({gate:'MMF_CLOUD_QUEUE_TO_SQLITE_DO_LIVE',status:proven?'PASS':'NOT_VERIFIED',cloud_log_observed:proven,publicAccess:false,customerMailSent:false}));
          if(!proven)process.exit(1);
          NODE