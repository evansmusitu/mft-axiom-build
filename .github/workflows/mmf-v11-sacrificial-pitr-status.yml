name: MUSITU Mail Fabric Sacrificial PITR Status Proof 20261010
on:
  push:
    branches: ['product/musitu-mail-fabric-isolated-20261009']
    paths: ['.github/workflows/mmf-v11-sacrificial-pitr-status.yml']
permissions:
  contents: read
concurrency:
  group: mmf-stage-20261010-sole-worker
  cancel-in-progress: false
jobs:
  qualify:
    if: github.event.before == 'a660ea46506098dc2a34ea8c582c40bb2cdd5bd2'
    runs-on: ubuntu-latest
    environment: axiom-support-production
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_RULESETS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '93f395f5121954671f92fffa453d6b61'
      MMF_QUEUE_ID: '1ff13f921b90488397e7f76970117aee'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove isolated source, sacrificial namespace, no customer transport
        working-directory: musitu-mail-fabric
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'product/musitu-mail-fabric-isolated-20261009'
          npm run check
          npm test
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('wrangler.mmf.do-staging.jsonc','utf8'));
          const bindings=c.durable_objects.bindings;
          const original=bindings.find(x=>x.name==='MMF_LEDGER');
          const isolated=bindings.find(x=>x.name==='MMF_PITR_SANDBOX');
          if(c.name!=='musitu-mail-fabric-staging-20261010'||c.main!=='src/edge/worker-do-staging.mjs'||
             c.workers_dev!==false||JSON.stringify(c.routes)!=='[]'||c.queues.consumers?.[0]?.queue!=='musitu-mail-fabric-staging-20261010'||
             c.vars.MMF_STAGE_ONLY!=='true'||c.vars.MMF_REAL_SEND_ENABLED!=='false'||
             c.vars.MMF_API_ENABLED!=='false'||c.vars.MMF_WEBHOOK_ENABLED!=='false'||
             c.vars.MMF_STAGE_PITR_RESTORE_ENABLED!=='true'||c.vars.MMF_STAGE_CRYPTO_READY!=='true'||
             original?.class_name!=='MmfStagingSqliteDO'||isolated?.class_name!=='MmfPitrSacrificialDO'||
             bindings.length!==2||!c.migrations.some(x=>x.new_sqlite_classes?.includes('MmfPitrSacrificialDO')))
             throw Error('SACRIFICIAL_CONFIGURATION_NOT_ISOLATED');
          console.log(JSON.stringify({gate:'MMF_PITR_SACRIFICIAL_STATIC_SAFETY',status:'PASS',publicRoutes:0,networkMail:false}));
          NODE
      - name: Check Cloudflare predeploy restricted Worker and Queue
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,k=process.env.CLOUDFLARE_API_TOKEN,q=process.env.MMF_QUEUE_ID;
          if(a!=='93f395f5121954671f92fffa453d6b61'||q!=='1ff13f921b90488397e7f76970117aee'||String(k||'').length<16)
            throw Error('ACCOUNT_SCOPE_NOT_AUTHORIZED');
          const root='https://api.cloudflare.com/client/v4/accounts/'+a;
          const get=async path=>{const r=await fetch(root+path,{headers:{authorization:'Bearer '+k},signal:AbortSignal.timeout(15000)});
            const data=await r.json();if(!r.ok||data.success===false)throw Error('CLOUD_PREFLIGHT_'+r.status);return data.result;};
          const worker='musitu-mail-fabric-staging-20261010';
          const [queue,settings,sub]=await Promise.all([get('/queues/'+q),get('/workers/scripts/'+worker+'/settings'),get('/workers/scripts/'+worker+'/subdomain')]);
          const bindings=settings.bindings||[],v=n=>bindings.find(b=>b.name===n)?.text;
          if(queue?.queue_name!=='musitu-mail-fabric-staging-20261010'||sub?.enabled===true||sub?.previews_enabled===true||
             v('MMF_STAGE_ONLY')!=='true'||v('MMF_REAL_SEND_ENABLED')!=='false'||
             v('MMF_API_ENABLED')!=='false'||v('MMF_WEBHOOK_ENABLED')!=='false'||
             !bindings.some(x=>x.name==='MMF_LEDGER'&&x.type==='durable_object_namespace'))
            throw Error('NONPUBLIC_STAGE_PREFLIGHT_FAILED');
          console.log(JSON.stringify({gate:'MMF_PITR_SACRIFICIAL_CLOUD_PREFLIGHT',status:'PASS',publicAccess:false,customerSending:false}));
          NODE
      - name: Deploy only isolated private Worker and new sacrificial SQLite class
        working-directory: musitu-mail-fabric
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.mmf.do-staging.jsonc
      - name: Independently read back private flags and distinct Durable Object namespaces
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,k=process.env.CLOUDFLARE_API_TOKEN;
          const root='https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/scripts/musitu-mail-fabric-staging-20261010/';
          const get=async p=>{const r=await fetch(root+p,{headers:{authorization:'Bearer '+k},signal:AbortSignal.timeout(15000)});
            const x=await r.json();if(!r.ok||x.success===false)throw Error('PRIVATE_READBACK_FAILED');return x.result;};
          const [settings,sub,secrets]=await Promise.all([get('settings'),get('subdomain'),get('secrets')]);
          const b=settings.bindings||[],v=n=>b.find(x=>x.name===n)?.text;
          const ledger=b.find(x=>x.name==='MMF_LEDGER'&&x.type==='durable_object_namespace');
          const sandbox=b.find(x=>x.name==='MMF_PITR_SANDBOX'&&x.type==='durable_object_namespace');
          if(sub?.enabled===true||sub?.previews_enabled===true||
             v('MMF_STAGE_ONLY')!=='true'||v('MMF_REAL_SEND_ENABLED')!=='false'||v('MMF_API_ENABLED')!=='false'||
             v('MMF_WEBHOOK_ENABLED')!=='false'||v('MMF_STAGE_PITR_RESTORE_ENABLED')!=='true'||
             !ledger||!sandbox||ledger.namespace_id===sandbox.namespace_id||
             !['MMF_STORAGE_RPC_SECRET','MMF_STAGE_DATA_KEY_B64','MMF_STAGE_SIGNING_PRIVATE_KEY_PEM'].every(n=>secrets.some(x=>x.name===n)))
             throw Error('SACRIFICIAL_NAMESPACE_OR_PRIVACY_FAILED');
          console.log(JSON.stringify({gate:'MMF_PITR_SACRIFICIAL_NAMESPACE_SEPARATION',status:'PASS',
           separateObjects:true,publicAccess:false,customerSending:false}));
          NODE
      - name: Prove live sacrificial SQLite PITR rollback and unchanged tenant binding
        shell: bash
        run: |
          set -euo pipefail
          trace="$(mktemp)"; expected="$(mktemp)"
          export MMF_SACRIFICIAL_EXPECTED_FILE="$expected"
          cd musitu-mail-fabric
          npx --yes wrangler@4 tail musitu-mail-fabric-staging-20261010 --format json > "$trace" 2>/dev/null &
          pid=$!
          cleanup(){ kill "$pid" 2>/dev/null || true; rm -f "$trace" "$expected"; }
          trap cleanup EXIT
          sleep 8
          kill -0 "$pid" || { echo 'STAGE_TAIL_UNAVAILABLE'; exit 1; }
          node --input-type=module <<'NODE'
          import {randomBytes,createHash} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          const probe='probe-pitr-sacrificial-'+randomBytes(10).toString('hex');
          const digest=createHash('sha256').update(probe).digest('hex');
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
            '/queues/'+process.env.MMF_QUEUE_ID+'/messages';
          const r=await fetch(url,{method:'POST',headers:{
            authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'},
            body:JSON.stringify({content_type:'json',body:{type:'MMF_STAGE_SACRIFICIAL_PITR_PROBE',probeId:probe}}),
            signal:AbortSignal.timeout(15000)});
          const data=await r.json();
          if(!r.ok||data.success===false)throw Error('PRIVATE_PITR_QUEUE_POST_FAILED');
          writeFileSync(process.env.MMF_SACRIFICIAL_EXPECTED_FILE,digest+'\n');
          console.log(JSON.stringify({gate:'MMF_SACRIFICIAL_PITR_QUEUE_POST',status:'PASS',noCustomerData:true}));
          NODE
          for i in $(seq 1 70); do
            grep -q 'MMF_REAL_CLOUDFLARE_SACRIFICIAL_PITR_ROLLBACK' "$trace" && break
            sleep 1
          done
          node --input-type=module - "$trace" "$expected" <<'NODE'
          import {readFileSync} from 'node:fs';
          const raw=readFileSync(process.argv.at(-2),'utf8'),expected=readFileSync(process.argv.at(-1),'utf8').trim();
          let proof=null;const diagnostics=[];
          for(let i=0;i<raw.length;i++){
            if(raw[i]!=='{')continue;
            let depth=0,quoted=false,escaped=false,j=i;
            for(;j<raw.length;j++){
              const ch=raw[j];
              if(quoted){if(escaped)escaped=false;else if(ch==='\\')escaped=true;else if(ch==='"')quoted=false;continue;}
              if(ch==='"'){quoted=true;continue;}
              if(ch==='{')depth++;if(ch==='}'&&--depth===0){j++;break;}
            }
            if(depth!==0||j<=i)continue;
            let obj;try{obj=JSON.parse(raw.slice(i,j));}catch{continue;}
            for(const log of obj.logs||[])for(const line of log.message||[]){
              let e;try{e=JSON.parse(line)}catch{continue;}
              if(e.gate==='MMF_STAGE_SACRIFICIAL_PITR_DIAGNOSTIC'&&e.probeSha256===expected&&typeof e.reason==='string')diagnostics.push(e.reason);
              if(e.gate==='MMF_REAL_CLOUDFLARE_SACRIFICIAL_PITR_ROLLBACK'&&
                 e.probeSha256===expected&&e.status==='PASS'&&
                 /^[a-f0-9]{64}$/.test(e.bookmarkSha256||'')&&
                 e.sameDedicatedObjectRestored===true&&e.mainTenantUntouched===true&&
                 e.publicAccess===false&&e.customerMailSent===false)proof=e;
            }
            if(proof)break;i=j-1;
          }
          console.log(JSON.stringify({gate:'MMF_REAL_CLOUD_DISPOSABLE_SQLITE_PITR_RESTORE',
             status:proof?'PASS':'NOT_VERIFIED',safeDiagnostic:[...new Set(diagnostics)].slice(0,4),
             originalValueVerifiedAfterRestart:!!proof,ownSeparateObjectOnly:!!proof,
             customerMailSent:false,productionTouched:false}));
          if(!proof)process.exit(1);
          NODE
