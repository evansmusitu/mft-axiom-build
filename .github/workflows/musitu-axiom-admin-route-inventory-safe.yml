name: MUSITU Axiom Admin Route Inventory Safe

on:
  push:
    branches: ['feat/musitu-connect-frontier']
    paths:
      - '.github/workflows/musitu-axiom-admin-route-inventory-safe.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct protected source
        env:
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          P=deploy_payload/runtime_min
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > runtime.enc.b64
          base64 -d runtime.enc.b64 > runtime.tar.gz.enc
          test "$(sha256sum runtime.tar.gz.enc | awk '{print $1}')" = 'b82448d6b4b34b302748815af976b535d69922c197d4b7a9056fc2f91a9e12cf'
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in runtime.tar.gz.enc -out runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          test "$(sha256sum runtime.tar.gz | awk '{print $1}')" = 'b4d5a0266446523969a619f5e9bb5a04d9b815c78a2ab82ed046ef5e23d53663'
          mkdir runtime && tar -xzf runtime.tar.gz -C runtime
      - name: Emit safe admin route and entitlement metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re
          src='\n'.join(p.read_text(errors='replace') for p in pathlib.Path('runtime/worker/src').glob('*.js'))
          funcs=sorted(set(re.findall(r'(?:async\s+)?function\s+(admin[A-Za-z0-9_$]+)\s*\(',src)))
          literal_paths=sorted(set(re.findall(r'["\'](/v1/admin/[A-Za-z0-9_./:{}-]+)["\']',src)))
          regex_routes=[]
          for m in re.finditer(r'\.match\s*\(\s*/((?:\\.|[^/]){1,280})/[gimsuy]*\s*\)',src):
              p=m.group(1)
              if 'v1' in p and 'admin' in p: regex_routes.append(p)
          status_402=[]
          for m in re.finditer(r'(?:status\s*[:=]\s*402|\b402\b)',src):
              w=src[max(0,m.start()-1200):min(len(src),m.end()+1200)]
              tokens=sorted(set(x for x in re.findall(r'["\']([^"\']{1,90})["\']',w) if re.search(r'entitl|payment|subscription|quota|unit|plan|billing|limit|exceed',x,re.I)))
              fields=sorted(set(re.findall(r'\b(?:customer|row|cust|bucket|sub)\.([A-Za-z_$][\w$]*)\b',w)))
              status_402.append({'tokens':tokens,'fields':fields})
          out={'schema':'musitu.axiom.admin_route_inventory_safe.v1','admin_functions':funcs,'literal_admin_paths':literal_paths,'regex_admin_routes':sorted(set(regex_routes)),'status_402_contexts':status_402,'plaintext_source_committed':False}
          print(json.dumps(out,sort_keys=True))
          PY
