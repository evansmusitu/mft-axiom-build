name: MUSITU Axiom LightGBM research challenger

on:
  push:
    branches: ['feat/musitu-connect-frontier']
    paths:
      - '.github/workflows/musitu-axiom-lightgbm-research.yml'
      - 'benchmarks/mining_adapter/lightgbm_challenger.py'
      - 'benchmarks/mining_adapter/regime_shadow.py'
      - 'tests/connect/test_regime_shadow.py'
      - 'tests/connect/test_lightgbm_challenger.py'
      - 'benchmarks/mining_adapter/CHALLENGER_README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-axiom-lightgbm-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      EXPECTED_SOURCE_SHA256: 28e2eed4c4a314daa4319f656a09bb43d8acea603dcb906e31c98049c91a8fdc
      OPENML_SKIP_PARQUET: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned research dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            openml==0.15.1 scikit-learn==1.9.1 lightgbm==4.6.0

      - name: Verify real LightGBM training and safety contracts
        run: |
          python -m py_compile benchmarks/mining_adapter/lightgbm_challenger.py benchmarks/mining_adapter/regime_shadow.py
          python -m unittest tests.connect.test_regime_shadow -v
          python -m unittest tests.connect.test_lightgbm_challenger -v
          python -m unittest tests.connect.test_methane_backtest tests.connect.test_methane_prediction -q

      - name: Acquire exact qualified public dataset
        run: |
          mkdir -p /tmp/musitu-axiom-research qualification/axiom_lightgbm_research
          python - <<'PY'
          import hashlib, openml, shutil
          from pathlib import Path
          data = openml.datasets.get_dataset(
              42701, download_data=True, download_qualities=False,
              download_features_meta_data=False,
          )
          if data.dataset_id != 42701 or str(data.name).strip().casefold() != 'methane':
              raise SystemExit('RESEARCH_DATASET_IDENTITY_MISMATCH')
          target = Path('/tmp/musitu-axiom-research/Methane-OpenML-42701.arff')
          shutil.copyfile(data.data_file, target)
          digest = hashlib.file_digest(target.open('rb'), 'sha256').hexdigest()
          if digest != '28e2eed4c4a314daa4319f656a09bb43d8acea603dcb906e31c98049c91a8fdc':
              raise SystemExit('RESEARCH_SOURCE_SHA256_MISMATCH')
          print('RESEARCH_SOURCE_SHA256_VERIFIED=' + digest)
          PY

      - name: Evaluate LightGBM against frozen methane backtest
        run: |
          python benchmarks/mining_adapter/lightgbm_challenger.py \
            --source /tmp/musitu-axiom-research/Methane-OpenML-42701.arff \
            --output qualification/axiom_lightgbm_research/lightgbm_research.json

      - name: Verify evidence remains research-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          item = json.loads(Path('qualification/axiom_lightgbm_research/lightgbm_research.json').read_text())
          assert item['status'] == 'RESEARCH_ONLY_NOT_ADMITTED'
          assert item['production_admission'] is False
          assert item['independent_validation'] is False
          assert item['source_sha256'] == '28e2eed4c4a314daa4319f656a09bb43d8acea603dcb906e31c98049c91a8fdc'
          assert item['execution']['source_rows'] >= 9_000_000
          assert len(item['execution']['folds']) == 4
          for fold in item['execution']['folds']:
              assert fold['temporal_leakage_check'] is True
              assert fold['online_recalibration_leakage_check'] is True
              assert fold['hard_observed_warning_preserved'] is True
              assert fold['model']['tp'] + fold['model']['fn'] == fold['test_positives']
              shadow = fold['research_only_regime_shadow']
              assert shadow['evaluation_role'] == 'RESEARCH_ONLY_REGIME_CALIBRATION'
              assert shadow['qualified_for_admission'] is False
              assert shadow['independent_validation'] is False
              assert shadow['leakage_safe'] is True
              assert shadow['policy']['hard_observed_warning'] == 'never_suppressed'
              assert shadow['hard_warnings'] >= 0
              assert shadow['metrics']['tp'] + shadow['metrics']['fn'] == fold['test_positives']
              assert sum(shadow['metrics'][k] for k in ('tp','tn','fp','fn')) == fold['test_examples']
              assert sum(shadow['regime_example_counts'].values()) == fold['test_examples']
              from datetime import datetime
              assert all(
                  datetime.fromisoformat(entry['latest_label_window_end_used']) <
                  datetime.fromisoformat(entry['prediction_time'])
                  for entry in shadow['update_audit']
              )
          assert item['existing_gate_diagnostic_only']['gate'] in (
              'REAL_MINE_METHANE_BACKTEST_FAILED', 'REAL_MINE_METHANE_BACKTEST_QUALIFIED'
          )
          print('RESEARCH_EVIDENCE_INTEGRITY=PASS')
          print('REGIME_SHADOW_RESEARCH_ONLY=TRUE')
          print('MODEL_GATE_DIAGNOSTIC=' + item['existing_gate_diagnostic_only']['gate'])
          print('PRODUCTION_ADMISSION=BLOCKED')
          PY
          sha256sum qualification/axiom_lightgbm_research/lightgbm_research.json
          {
            echo '## MUSITU Axiom LightGBM Research Challenger'
            echo
            echo 'Research-only; never mine-safety certification, independent validation, or production admission.'
            echo
            python - <<'PY'
          import json
          from pathlib import Path
          item = json.loads(Path('qualification/axiom_lightgbm_research/lightgbm_research.json').read_text())
          print('Comparison:', json.dumps(item['comparison'], sort_keys=True))
          print('Gate diagnostic:', item['existing_gate_diagnostic_only']['gate'])
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive immutable research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-lightgbm-research-evidence
          path: qualification/axiom_lightgbm_research/*.json
          retention-days: 90
          if-no-files-found: warn
