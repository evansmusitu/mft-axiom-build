name: MUSITU Brand Blob Map Builder

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/musitu-brand-blob-map.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create validated MUSITU replacement blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, re, subprocess, urllib.request, urllib.error
          old='M'+'FT'; low=old.lower()
          protected=pathlib.Path('deploy_payload/runtime_min')
          excluded={pathlib.Path('.github/workflows/musitu-canonical-brand-migration.yml'),pathlib.Path('.github/workflows/musitu-brand-bundle.yml'),pathlib.Path('.github/workflows/musitu-brand-detached-commit.yml'),pathlib.Path('.github/workflows/musitu-brand-blob-map.yml')}
          binary={'.zip','.gz','.tgz','.png','.jpg','.jpeg','.gif','.webp','.pdf','.pyc','.so','.dll','.exe','.bin','.enc'}
          def is_text(p):
            if p.suffix.lower() in binary:return False
            try:b=p.read_bytes()
            except OSError:return False
            if b'\0' in b:return False
            try:b.decode('utf-8');return True
            except UnicodeDecodeError:return False
          tracked=[pathlib.Path(x.decode()) for x in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if x]
          changed=[]; counts={'product_display':0,'user_agent_display':0,'standalone_brand':0,'schema_prefix':0}
          hist=re.compile(r'\b'+re.escape(old)+r'-[A-Z0-9][A-Z0-9-]*\b')
          for p in tracked:
            if p in excluded or p==protected or protected in p.parents or not p.is_file() or not is_text(p):continue
            t=p.read_text(); original=t; saved={}
            def stash(m):k=f'__MUSITU_HIST_{len(saved)}__';saved[k]=m.group(0);return k
            t=hist.sub(stash,t)
            a=old+' Axiom';n=t.count(a);counts['product_display']+=n;t=t.replace(a,'MUSITU Axiom')
            a=old+'-Axiom';n=t.count(a);counts['user_agent_display']+=n;t=t.replace(a,'MUSITU-Axiom')
            t,n=re.subn(r'\b'+re.escape(old)+r'\b','MUSITU',t);counts['standalone_brand']+=n
            a=low+'.axiom';n=t.count(a);counts['schema_prefix']+=n;t=t.replace(a,'musitu.axiom')
            for k,v in saved.items():t=t.replace(k,v)
            if t!=original:p.write_text(t);changed.append(str(p))
          pathlib.Path('branding').mkdir(exist_ok=True)
          canonical={'schema':'musitu.brand.canonical.v1','company_brand':'MUSITU','canonical_product_family':{'axiom':'MUSITU Axiom','foundry':'MUSITU Foundry','markets':'MUSITU Markets','worldfabric':'MUSITU WorldFabric','education':'MUSITU Education','fmi':'MUSITU Frontier Market Intelligence'},'deprecated_company_brand':old,'legacy_identifier_policy':'The retired namespace may remain only inside exact live compatibility handles or immutable historical evidence until verified cutover.','truth_boundary':{'wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED'}}
          pathlib.Path('branding/MUSITU_BRAND_CANONICAL.json').write_text(json.dumps(canonical,indent=2,sort_keys=True)+'\n')
          pathlib.Path('branding/MUSITU_BRAND_POLICY.md').write_text('# MUSITU Canonical Brand\n\nMUSITU is the company brand and root namespace. Canonical products include MUSITU Axiom, MUSITU Foundry, MUSITU Markets, MUSITU WorldFabric, MUSITU Education, and MUSITU Frontier Market Intelligence. The retired namespace is not used for new branding. Existing live resource identifiers carrying it are compatibility handles only and must be removed by verified resource cutover.\n')
          files=sorted(set(changed+['branding/MUSITU_BRAND_CANONICAL.json','branding/MUSITU_BRAND_POLICY.md']))
          report={'schema':'musitu.brand.migration.blob_map.v1','company_brand':'MUSITU','changed_file_count':len(changed),'replacement_counts':counts,'files':files,'protected_encrypted_runtime':str(protected),'plaintext_proprietary_source_exposed':False,'truth_boundary':{'wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED'}}
          pathlib.Path('branding/MUSITU_BRAND_MIGRATION_REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          files=sorted(set(files+['branding/MUSITU_BRAND_MIGRATION_REPORT.json']))
          report['files']=files;report['bundle_file_count']=len(files)
          pathlib.Path('branding/MUSITU_BRAND_MIGRATION_REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          subprocess.check_call(['git','diff','--check']);assert counts['product_display']>0 and len(changed)>0
          api=os.environ.get('GITHUB_API_URL','https://api.github.com');repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GH_TOKEN'];branch=os.environ.get('GITHUB_REF_NAME','main')
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'MUSITU-Brand-Blob-Builder'}
          def call(method,path,payload=None):
            data=None if payload is None else json.dumps(payload).encode();req=urllib.request.Request(api+path,headers=headers,data=data,method=method)
            try:
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
            except urllib.error.HTTPError as e:raise SystemExit(f'GitHub API {method} {path} failed HTTP {e.code}: {e.read().decode(errors="replace")[:500]}')
          ref=call('GET',f'/repos/{repo}/git/ref/heads/{branch}');parent=ref['object']['sha'];pc=call('GET',f'/repos/{repo}/git/commits/{parent}');base_tree=pc['tree']['sha']
          entries=[]
          for name in files:
            blob=call('POST',f'/repos/{repo}/git/blobs',{'content':pathlib.Path(name).read_text(),'encoding':'utf-8'})
            entries.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          evidence={'status':'PASS','parent_sha':parent,'base_tree_sha':base_tree,'tree_entries':entries,'changed_file_count':len(changed),'bundle_file_count':len(files),'replacement_counts':counts,'plaintext_proprietary_source_exposed':False}
          pathlib.Path('musitu-brand-blob-map.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print('MUSITU_PARENT_SHA='+parent)
          print('MUSITU_BASE_TREE_SHA='+base_tree)
          print('MUSITU_TREE_ENTRIES_JSON='+json.dumps(entries,separators=(',',':')))
          print('MUSITU_REPLACEMENT_COUNTS='+json.dumps(counts,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-brand-blob-map
          path: musitu-brand-blob-map.json
          retention-days: 7
          if-no-files-found: error
