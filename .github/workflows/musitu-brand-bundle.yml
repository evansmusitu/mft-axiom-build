name: MUSITU Brand Migration Bundle

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/musitu-brand-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build validated MUSITU migration bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re, subprocess, zipfile

          old='M'+'FT'
          old_lower=old.lower()
          root=pathlib.Path('.')
          excluded={
            pathlib.Path('.github/workflows/musitu-canonical-brand-migration.yml'),
            pathlib.Path('.github/workflows/musitu-brand-bundle.yml'),
          }
          protected=pathlib.Path('deploy_payload/runtime_min')
          binary={'.zip','.gz','.tgz','.png','.jpg','.jpeg','.gif','.webp','.pdf','.pyc','.so','.dll','.exe','.bin','.enc'}

          def text_file(p):
            if p.suffix.lower() in binary: return False
            try: b=p.read_bytes()
            except OSError: return False
            if b'\0' in b: return False
            try: b.decode('utf-8'); return True
            except UnicodeDecodeError: return False

          tracked=[pathlib.Path(x.decode()) for x in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if x]
          changed=[]
          counts={'product_display':0,'user_agent_display':0,'standalone_brand':0,'schema_prefix':0}
          historical=re.compile(r'\b'+re.escape(old)+r'-[A-Z0-9][A-Z0-9-]*\b')

          for p in tracked:
            if p in excluded or protected==p or protected in p.parents or not p.is_file() or not text_file(p):
              continue
            t=p.read_text(encoding='utf-8'); original=t
            saved={}
            def stash(m):
              k=f'__MUSITU_HIST_{len(saved)}__'; saved[k]=m.group(0); return k
            t=historical.sub(stash,t)
            a=old+' Axiom'; b='MUSITU Axiom'; n=t.count(a); counts['product_display']+=n; t=t.replace(a,b)
            a=old+'-Axiom'; b='MUSITU-Axiom'; n=t.count(a); counts['user_agent_display']+=n; t=t.replace(a,b)
            t,n=re.subn(r'\b'+re.escape(old)+r'\b','MUSITU',t); counts['standalone_brand']+=n
            a=old_lower+'.axiom'; b='musitu.axiom'; n=t.count(a); counts['schema_prefix']+=n; t=t.replace(a,b)
            for k,v in saved.items(): t=t.replace(k,v)
            if t!=original:
              p.write_text(t,encoding='utf-8'); changed.append(str(p))

          pathlib.Path('branding').mkdir(exist_ok=True)
          canonical={
            'schema':'musitu.brand.canonical.v1','company_brand':'MUSITU',
            'canonical_product_family':{
              'axiom':'MUSITU Axiom','foundry':'MUSITU Foundry','markets':'MUSITU Markets',
              'worldfabric':'MUSITU WorldFabric','education':'MUSITU Education',
              'fmi':'MUSITU Frontier Market Intelligence'},
            'deprecated_company_brand':old,
            'legacy_identifier_policy':'Old namespace strings may remain only as exact live compatibility handles or immutable historical evidence until verified resource cutover.',
            'truth_boundary':{'wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED'}
          }
          pathlib.Path('branding/MUSITU_BRAND_CANONICAL.json').write_text(json.dumps(canonical,indent=2,sort_keys=True)+'\n')
          pathlib.Path('branding/MUSITU_BRAND_POLICY.md').write_text(
            '# MUSITU Canonical Brand\n\nMUSITU is the company brand and root namespace. New company, product, UI, documentation, evidence-schema and marketing names use MUSITU. Existing live infrastructure handles carrying the retired namespace are compatibility identifiers only and are migrated through verified cutover rather than blind replacement.\n')
          brand=['branding/MUSITU_BRAND_CANONICAL.json','branding/MUSITU_BRAND_POLICY.md']
          all_paths=sorted(set(changed+brand))
          report={'schema':'musitu.brand.migration.bundle.v1','company_brand':'MUSITU','base_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'changed_file_count':len(changed),'bundle_file_count':len(all_paths),'replacement_counts':counts,'files':all_paths,'protected_encrypted_runtime':str(protected),'plaintext_proprietary_source_exposed':False,'truth_boundary':{'wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED'}}
          pathlib.Path('branding/MUSITU_BRAND_MIGRATION_REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          all_paths=sorted(set(all_paths+['branding/MUSITU_BRAND_MIGRATION_REPORT.json']))
          report['files']=all_paths; report['bundle_file_count']=len(all_paths)
          pathlib.Path('branding/MUSITU_BRAND_MIGRATION_REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')

          with zipfile.ZipFile('musitu-brand-migration-files.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
            for name in all_paths: z.write(name,name)
          pathlib.Path('musitu-brand-bundle-summary.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'bundle':'PASS','changed_file_count':len(changed),'bundle_file_count':len(all_paths),'replacement_counts':counts},sort_keys=True))
          PY
          git diff --check

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-brand-migration-bundle
          path: |
            musitu-brand-migration-files.zip
            musitu-brand-bundle-summary.json
          retention-days: 7
          if-no-files-found: error
