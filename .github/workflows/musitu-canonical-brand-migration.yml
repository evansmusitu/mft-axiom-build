name: MUSITU Canonical Brand Migration

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/musitu-canonical-brand-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Migrate public control-plane branding to MUSITU
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re, subprocess

          root = pathlib.Path('.')
          self_path = pathlib.Path('.github/workflows/musitu-canonical-brand-migration.yml')
          protected_prefixes = (
              pathlib.Path('deploy_payload/runtime_min'),
          )
          binary_suffixes = {'.zip','.gz','.tgz','.png','.jpg','.jpeg','.gif','.webp','.pdf','.pyc','.so','.dll','.exe','.bin','.enc'}

          def is_protected_path(p: pathlib.Path) -> bool:
              if p == self_path:
                  return True
              return any(p == q or q in p.parents for q in protected_prefixes)

          def is_text_file(p: pathlib.Path) -> bool:
              if p.suffix.lower() in binary_suffixes:
                  return False
              try:
                  b = p.read_bytes()
              except OSError:
                  return False
              if b'\x00' in b:
                  return False
              try:
                  b.decode('utf-8')
                  return True
              except UnicodeDecodeError:
                  return False

          tracked = subprocess.check_output(['git','ls-files','-z']).split(b'\0')
          paths = [pathlib.Path(x.decode()) for x in tracked if x]
          changed = []
          replacement_counts = {
              'MFT Axiom -> MUSITU Axiom': 0,
              'MFT-Axiom -> MUSITU-Axiom': 0,
              'standalone MFT -> MUSITU': 0,
              'mft.axiom schema -> musitu.axiom': 0,
          }

          # Preserve immutable historical/build identifiers that are evidence keys, not branding.
          historical_token = re.compile(r'\bMFT-[A-Z0-9][A-Z0-9-]*\b')

          for p in paths:
              if is_protected_path(p) or not p.is_file() or not is_text_file(p):
                  continue
              text = p.read_text(encoding='utf-8')
              original = text

              protected = {}
              def stash(m):
                  key = f'__MUSITU_LEGACY_BUILD_TOKEN_{len(protected)}__'
                  protected[key] = m.group(0)
                  return key
              text = historical_token.sub(stash, text)

              n = text.count('MFT Axiom')
              if n:
                  replacement_counts['MFT Axiom -> MUSITU Axiom'] += n
                  text = text.replace('MFT Axiom','MUSITU Axiom')
              n = text.count('MFT-Axiom')
              if n:
                  replacement_counts['MFT-Axiom -> MUSITU-Axiom'] += n
                  text = text.replace('MFT-Axiom','MUSITU-Axiom')

              # Company-brand token only. Underscored secret names and legacy resource slugs are intentionally not matched.
              text, n = re.subn(r'\bMFT\b','MUSITU',text)
              replacement_counts['standalone MFT -> MUSITU'] += n

              n = text.count('mft.axiom')
              if n:
                  replacement_counts['mft.axiom schema -> musitu.axiom'] += n
                  text = text.replace('mft.axiom','musitu.axiom')

              for key, value in protected.items():
                  text = text.replace(key, value)

              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed.append(str(p))

          brand_dir = pathlib.Path('branding')
          brand_dir.mkdir(exist_ok=True)
          canonical = {
              'schema': 'musitu.brand.canonical.v1',
              'company_brand': 'MUSITU',
              'canonical_product_family': {
                  'axiom': 'MUSITU Axiom',
                  'foundry': 'MUSITU Foundry',
                  'markets': 'MUSITU Markets',
                  'worldfabric': 'MUSITU WorldFabric',
                  'education': 'MUSITU Education',
                  'fmi': 'MUSITU Frontier Market Intelligence'
              },
              'deprecated_company_brand': 'M' + 'FT',
              'policy': 'The deprecated token is not a company or product brand. It may remain only inside immutable historical evidence or still-live legacy infrastructure identifiers until those resources are cut over safely.',
              'legacy_infrastructure_classes': [
                  'existing repository slugs',
                  'existing DNS zone and hostnames',
                  'existing Worker and D1 resource ids',
                  'existing secret/env variable names required by deployed source',
                  'immutable historical build ids and evidence hashes',
                  'encrypted runtime payload bytes whose integrity hashes would otherwise be invalidated'
              ],
              'truth_boundary': {
                  'wolfram_parity': 'NOT_CERTIFIED',
                  'superiority': 'NOT_CERTIFIED'
              }
          }
          (brand_dir/'MUSITU_BRAND_CANONICAL.json').write_text(json.dumps(canonical,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          policy = '''# MUSITU Canonical Brand\n\n**MUSITU** is the company brand and root namespace.\n\nCanonical product names include **MUSITU Axiom**, **MUSITU Foundry**, **MUSITU Markets**, **MUSITU WorldFabric**, **MUSITU Education**, and **MUSITU Frontier Market Intelligence**.\n\nThe former three-letter company label is deprecated immediately. It is not to be used for new product, company, UI, documentation, workflow-display, evidence-schema, or marketing names.\n\nOld strings may survive temporarily only when they are immutable historical evidence or the exact identifier of an already-live resource. Those strings are compatibility handles, not branding, and must be removed through verified cutover rather than blind text replacement.\n\nNo branding migration changes the standing truth boundaries: Wolfram parity and superiority remain NOT_CERTIFIED until independently justified.\n'''
          (brand_dir/'MUSITU_BRAND_POLICY.md').write_text(policy,encoding='utf-8')

          # Inventory residual old token occurrences without printing secret values or file contents.
          residual=[]
          for p in paths + [brand_dir/'MUSITU_BRAND_CANONICAL.json', brand_dir/'MUSITU_BRAND_POLICY.md']:
              if not p.exists() or is_protected_path(p) or not p.is_file() or not is_text_file(p):
                  continue
              t=p.read_text(encoding='utf-8')
              upper=len(re.findall(r'\bMFT\b',t))
              lower=t.lower().count('mft')
              if upper or lower:
                  residual.append({'path':str(p),'standalone_upper_count':upper,'case_insensitive_substring_count':lower})

          report = {
              'schema':'musitu.brand.migration.v1',
              'company_brand':'MUSITU',
              'changed_file_count':len(changed),
              'changed_files':sorted(changed),
              'replacement_counts':replacement_counts,
              'residual_legacy_identifier_files':sorted(residual,key=lambda x:x['path']),
              'protected_encrypted_runtime':'deploy_payload/runtime_min',
              'plaintext_proprietary_source_exposed':False,
              'truth_boundary':{'wolfram_parity':'NOT_CERTIFIED','superiority':'NOT_CERTIFIED'}
          }
          (brand_dir/'MUSITU_BRAND_MIGRATION_REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({'brand':'MUSITU','changed_file_count':len(changed),'replacement_counts':replacement_counts,'residual_file_count':len(residual)},sort_keys=True))
          PY

      - name: Validate migration without triggering deployments
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import json,pathlib
          b=json.loads(pathlib.Path('branding/MUSITU_BRAND_CANONICAL.json').read_text())
          r=json.loads(pathlib.Path('branding/MUSITU_BRAND_MIGRATION_REPORT.json').read_text())
          assert b['company_brand']=='MUSITU'
          assert b['canonical_product_family']['axiom']=='MUSITU Axiom'
          assert r['plaintext_proprietary_source_exposed'] is False
          assert r['changed_file_count'] >= 1
          print({'brand_validation':'PASS','changed_file_count':r['changed_file_count'],'residual_legacy_identifier_files':len(r['residual_legacy_identifier_files'])})
          PY

      - name: Commit canonical MUSITU brand migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'musitu-brand-migration'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No brand changes required.'
            exit 0
          fi
          git commit -m 'Adopt MUSITU as canonical company brand [skip ci]'
          git push origin HEAD:main
