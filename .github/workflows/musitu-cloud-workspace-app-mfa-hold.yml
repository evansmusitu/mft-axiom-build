name: MUSITU Cloud Workspace DENY-ALL App MFA Hardening

on:
  push:
    branches: [feature/musitu-cloud-workspace-isolated-20261020]
    paths:
      - 'studio-edge/cloud-workspace/tests/access_app_mfa_hold.py'
      - 'studio-edge/cloud-workspace/tests/test_access_app_mfa_hold.py'
      - '.github/workflows/musitu-cloud-workspace-app-mfa-hold.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-workspace-app-only-mfa-hold
  cancel-in-progress: false

jobs:
  owner-mfa-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      EXPECTED_DOMAIN: mftintelligence.com
      MUSITU_ACCESS_MFA_HOLD_INTENT: APP_ONLY_MFA_NO_ALLOW
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Test exact application-only write scope and denial invariants
        run: |
          set -euo pipefail
          python3 -m unittest discover -s studio-edge/cloud-workspace/tests -p test_access_app_mfa_hold.py -v
          python3 -m unittest discover -s studio-edge/cloud-workspace/tests -p test_independent_mfa_assessment.py -v
      - name: Confirm public application still excluded and disabled
        run: |
          set -euo pipefail
          grep -Fq '"WORKSPACE_ENABLED": "false"' studio-edge/cloud-workspace/wrangler.durable.isolated.example.jsonc
          grep -Fq '"workers_dev": false' studio-edge/cloud-workspace/wrangler.durable.isolated.example.jsonc
          grep -Fq '"preview_urls": false' studio-edge/cloud-workspace/wrangler.durable.isolated.example.jsonc
          if grep -q 'cloud-workspace' studio-edge/worker.mjs; then
            echo 'BLOCK: protected production MUSITU Worker changed' >&2
            exit 1
          fi
      - name: Update ONLY existing DENY-ALL Access application's MFA config
        run: python3 studio-edge/cloud-workspace/tests/access_app_mfa_hold.py
      - name: Seal sanitized app MFA readback
        if: always()
        run: |
          if test -f musitu-cloud-workspace-app-mfa-hold.json; then
            sha256sum musitu-cloud-workspace-app-mfa-hold.json > musitu-cloud-workspace-app-mfa-hold.sha256
          fi
      - name: Upload isolated MFA evidence for reviewer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-access-app-only-mfa-hold-${{ github.run_id }}
          path: |
            musitu-cloud-workspace-app-mfa-hold.json
            musitu-cloud-workspace-app-mfa-hold.sha256
          if-no-files-found: ignore
          retention-days: 14
