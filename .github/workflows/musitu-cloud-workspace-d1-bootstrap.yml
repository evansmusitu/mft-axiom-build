name: MUSITU Cloud Workspace Isolated D1 Bootstrap

on:
  push:
    branches:
      - feature/musitu-cloud-workspace-isolated-20261020
    paths:
      - 'studio-edge/cloud-workspace/schema.sql'
      - 'studio-edge/cloud-workspace/tests/d1_bootstrap.py'
      - 'studio-edge/cloud-workspace/tests/test_d1_bootstrap.py'
      - '.github/workflows/musitu-cloud-workspace-d1-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-cloud-workspace-d1-bootstrap
  cancel-in-progress: false

jobs:
  isolated-only:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      EXPECTED_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      EXPECTED_DOMAIN: mftintelligence.com
      MUSITU_D1_BOOTSTRAP_INTENT: CREATE_ONLY_ISOLATED_DB
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout isolated source
        uses: actions/checkout@v4
      - name: Run strictly offline bootstrap negative cases
        run: |
          set -euo pipefail
          python3 -m unittest discover -s studio-edge/cloud-workspace/tests -p test_d1_bootstrap.py -v
          python3 studio-edge/cloud-workspace/tests/sql_contract.py
      - name: Verify protected production Workers are not included
        run: |
          set -euo pipefail
          test -f studio-edge/cloud-workspace/schema.sql
          grep -Fq '"WORKSPACE_ENABLED": "false"' studio-edge/cloud-workspace/wrangler.isolated.example.jsonc
          if grep -q 'cloud-workspace' studio-edge/worker.mjs; then
            echo 'A protected production Worker has been modified.' >&2
            exit 1
          fi
      - name: Create a dedicated D1 database inside free-tier-compatible capacity only
        run: python3 studio-edge/cloud-workspace/tests/d1_bootstrap.py
      - name: Seal verification evidence
        if: always()
        run: |
          if test -f musitu-cloud-workspace-d1-bootstrap-result.json; then
            sha256sum musitu-cloud-workspace-d1-bootstrap-result.json > musitu-cloud-workspace-d1-bootstrap-result.sha256
          fi
      - name: Upload sanitized D1 bootstrap receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-cloud-workspace-d1-bootstrap-${{ github.run_id }}
          path: |
            musitu-cloud-workspace-d1-bootstrap-result.json
            musitu-cloud-workspace-d1-bootstrap-result.sha256
          if-no-files-found: ignore
          retention-days: 14
