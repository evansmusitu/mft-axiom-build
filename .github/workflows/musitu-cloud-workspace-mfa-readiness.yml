name: MUSITU Cloud Workspace MFA Readiness Inventory

on:
  push:
    branches: [feature/musitu-cloud-workspace-isolated-20261020]
    paths:
      - 'studio-edge/cloud-workspace/tests/access_mfa_readiness.py'
      - '.github/workflows/musitu-cloud-workspace-mfa-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      EXPECTED_DOMAIN: mftintelligence.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Read canonical Access App and identity provider types only
        run: python3 studio-edge/cloud-workspace/tests/access_mfa_readiness.py
      - name: SHA-256 seal sanitized identity capability summary
        if: always()
        run: |
          if test -f musitu-cloud-workspace-mfa-readiness.json; then
            sha256sum musitu-cloud-workspace-mfa-readiness.json > musitu-cloud-workspace-mfa-readiness.sha256
          fi
      - name: Keep security readiness summary in review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-access-mfa-readiness-${{ github.run_id }}
          path: |
            musitu-cloud-workspace-mfa-readiness.json
            musitu-cloud-workspace-mfa-readiness.sha256
          if-no-files-found: ignore
          retention-days: 14
