name: MUSITU Cloud Workspace Read-Only Inventory

on:
  push:
    branches: [feature/musitu-cloud-workspace-isolated-20261020]
    paths:
      - '.github/workflows/musitu-cloud-workspace-readonly-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      EXPECTED_DOMAIN: mftintelligence.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Read account-scoped Access and D1 inventory without changes
        run: python3 studio-edge/cloud-workspace/tests/cloudflare_readonly_inventory.py
      - name: Seal read-only assessment
        if: always()
        run: |
          test -f musitu-cloud-workspace-readonly-assessment.json || exit 0
          sha256sum musitu-cloud-workspace-readonly-assessment.json > musitu-cloud-workspace-readonly-assessment.sha256
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-cloud-workspace-readonly-assessment-${{ github.run_id }}
          path: |
            musitu-cloud-workspace-readonly-assessment.json
            musitu-cloud-workspace-readonly-assessment.sha256
          if-no-files-found: ignore
          retention-days: 7
