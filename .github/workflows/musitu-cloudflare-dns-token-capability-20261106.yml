name: MUSITU Cloudflare DNS Token Capability Probe 20261106
on:
  push:
    branches:
      - audit/musitu-corporate-cloudflare-readonly-20261103
    paths:
      - .github/workflows/musitu-cloudflare-dns-token-capability-20261106.yml
permissions: {}
jobs:
  probe:
    if: github.repository == 'evansmusitu/mft-axiom-build'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: "93f395f5121954671f92fffa453d6b61"
    steps:
      - name: Probe token-management permissions with invalid no-op requests only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.error,urllib.request
          token=os.environ['CF_TOKEN'];account=os.environ['CF_ACCOUNT_ID']
          h={'Authorization':'Bearer '+token,'Accept':'application/json','Content-Type':'application/json'}
          def probe(path):
              req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,headers=h,method='POST',data=b'{}')
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf8','replace')
                  try:b=json.loads(raw)
                  except:b={}
                  return e.code,b
          user_code,user_body=probe('/user/tokens')
          account_code,account_body=probe(f'/accounts/{account}/tokens')
          print('user_token_create_invalid_probe_http:',user_code)
          print('account_token_create_invalid_probe_http:',account_code)
          print('user_token_management_capability:', 'PRESENT' if user_code in (400,422) else 'ABSENT_OR_BLOCKED')
          print('account_token_management_capability:', 'PRESENT' if account_code in (400,422) else 'ABSENT_OR_BLOCKED')
          assert user_code!=200 and account_code!=200,'No-op probe unexpectedly created a token'
          PY
