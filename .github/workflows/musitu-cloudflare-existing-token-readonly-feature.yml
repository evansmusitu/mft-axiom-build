name: MUSITU Cloudflare existing GitHub secret token GET verification only

on:
  push:
    branches: ['feat/musitu-commercial-ga-phase123-evidence-20261031']
    paths:
      - '.github/workflows/musitu-cloudflare-existing-token-readonly-feature.yml'
      - 'tests/connect/test_cloudflare_existing_token_readonly_policy.py'

permissions:
  contents: read

concurrency:
  group: musitu-existing-cloudflare-token-readonly-feature
  cancel-in-progress: false

jobs:
  policy:
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref == 'refs/heads/feat/musitu-commercial-ga-phase123-evidence-20261031' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify read-only credential workflow restrictions without secrets
        run: python3 -m unittest tests.connect.test_cloudflare_existing_token_readonly_policy -v

  token-verify:
    needs: [policy]
    if: github.repository == 'evansmusitu/mft-axiom-build' && github.ref == 'refs/heads/feat/musitu-commercial-ga-phase123-evidence-20261031' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      READONLY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check only bearer token validity at Cloudflare, no data-plane access
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ.get('READONLY_TOKEN', '')
          if not token or len(token) < 20:
              print('CLOUDFLARE_READONLY_TOKEN=UNAVAILABLE')
              sys.exit(2)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *_args, **_kwargs):
                  return None

          request = urllib.request.Request(
              'https://api.cloudflare.com/client/v4/accounts/93f395f5121954671f92fffa453d6b61/tokens/verify',
              headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json'},
              method='GET',
          )
          try:
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=12) as response:
                  raw = response.read(4097)
                  status = response.status
              if status != 200 or not raw or len(raw) > 4096:
                  raise ValueError('unacceptable_response')
              def unique_object(pairs):
                  obj = {}
                  for key, value in pairs:
                      if key in obj:
                          raise ValueError('ambiguous_response')
                      obj[key] = value
                  return obj
              doc = json.loads(raw.decode('utf-8', errors='strict'), object_pairs_hook=unique_object)
              if not isinstance(doc, dict) or doc.get('success') is not True:
                  raise ValueError('provider_rejected')
              result = doc.get('result')
              if not isinstance(result, dict) or result.get('status') != 'active':
                  raise ValueError('inactive_token')
          except urllib.error.HTTPError as error:
              # Report only the HTTP status; never read provider bodies or credentials.
              print('CLOUDFLARE_READONLY_TOKEN=HTTP_STATUS_' + str(error.code))
              sys.exit(2)
          except Exception:
              print('CLOUDFLARE_READONLY_TOKEN=PROVIDER_AUTH_UNVERIFIED')
              sys.exit(2)
          print('CLOUDFLARE_READONLY_TOKEN=ACTIVE_NOT_STAGING_QUALIFIED')
          PY
