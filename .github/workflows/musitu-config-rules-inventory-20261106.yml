name: MUSITU Config Rules Inventory 20261106
on:
  push:
    branches:
      - audit/musitu-corporate-cloudflare-readonly-20261103
    paths:
      - .github/workflows/musitu-config-rules-inventory-20261106.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ZONE_ID: "5b56528f03948ff5917a5e0cd9f7109e"
      PARENT_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Print non-secret configuration rule shapes read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          z=os.environ['CF_ZONE_ID'];t=os.environ['PARENT_TOKEN'];base='https://api.cloudflare.com/client/v4'
          h={'Authorization':'Bearer '+t,'Accept':'application/json'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=h),timeout=25) as r:b=json.load(r)
              assert b.get('success') is True,(path,b.get('errors'))
              return b.get('result')
          sets=get(f'/zones/{z}/rulesets') or []
          rs=[x for x in sets if x.get('phase')=='http_config_settings' and x.get('kind')=='zone']
          assert len(rs)==1
          detail=get(f'/zones/{z}/rulesets/{rs[0]["id"]}') or {}
          rows=[]
          for r in detail.get('rules') or []:
              rows.append({'id':r.get('id'),'ref':r.get('ref'),'description':r.get('description'),'expression':r.get('expression'),'action':r.get('action'),'action_parameters':r.get('action_parameters'),'enabled':r.get('enabled',True)})
          print('config_rule_inventory:',json.dumps(rows,sort_keys=True))
          print('write_performed: false')
          PY
