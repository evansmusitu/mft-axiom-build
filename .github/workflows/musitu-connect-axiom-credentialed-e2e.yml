name: MUSITU Connect credentialed Axiom E2E

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/musitu-connect-axiom-credentialed-e2e.yml'

permissions:
  contents: read

concurrency:
  group: musitu-connect-axiom-credentialed-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      D1_UUID: 504029cc-f9a5-495e-818f-63c6144b4ea4
      MCP_BASE: https://mcp.mftintelligence.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove Connect-generated OAuth Axiom request-ID chain
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import re
          import secrets
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid
          from unittest.mock import patch

          from connect.adapters import AdapterCatalog, AdapterContract
          from connect.axiom_gateway import AxiomGateway, AxiomMcpExecutor
          from connect.core import IntegrationGate
          from connect.fabric import ConnectFabric
          from connect.mining import normalize_mining_rows
          from connect.runtime import ConnectRuntime
          from connect.security import canonical_bytes

          api=os.environ["CF_API"]
          account_id=os.environ["ACCOUNT_ID"]
          dbid=os.environ["D1_UUID"]
          mcp_base=os.environ["MCP_BASE"]
          cf_headers={
              "X-Auth-Email":os.environ["CLOUDFLARE_EMAIL"],
              "X-Auth-Key":os.environ["CLOUDFLARE_GLOBAL_API_KEY"],
              "Accept":"application/json",
              "User-Agent":"MUSITU-Connect-Axiom-E2E/2.0",
          }

          def http(url, method="GET", headers=None, body=None, timeout=50, follow=True):
              req=urllib.request.Request(url,headers=dict(headers or {}),method=method,data=body)
              opener=urllib.request.build_opener() if follow else urllib.request.build_opener(urllib.request.HTTPHandler)
              if not follow:
                  class NoRedirect(urllib.request.HTTPRedirectHandler):
                      def redirect_request(self, req, fp, code, msg, headers, newurl):
                          return None
                  opener=urllib.request.build_opener(NoRedirect)
              try:
                  with opener.open(req,timeout=timeout) as response:
                      return response.status,response.headers,response.read()
              except urllib.error.HTTPError as exc:
                  return exc.code,exc.headers,exc.read()

          def http_json(url, method="GET", obj=None, headers=None, follow=True):
              h={"Accept":"application/json","User-Agent":"MUSITU-Connect-Axiom-E2E/2.0"}
              if headers:
                  h.update(headers)
              body=None
              if obj is not None:
                  h["Content-Type"]="application/json"
                  body=json.dumps(obj,separators=(",",":")).encode("utf-8")
              status,resp_headers,raw=http(url,method,h,body,follow=follow)
              try:
                  parsed=json.loads(raw or b"{}")
              except Exception:
                  parsed={}
              return status,resp_headers,parsed,raw

          def form(url, fields, headers=None, follow=True):
              h={"Accept":"application/json","User-Agent":"MUSITU-Connect-Axiom-E2E/2.0"}
              if headers:
                  h.update(headers)
              h["Content-Type"]="application/x-www-form-urlencoded"
              body=urllib.parse.urlencode(fields).encode("utf-8")
              return http(url,"POST",h,body,follow=follow)

          def d1(sql, params=None):
              payload={"sql":sql}
              if params is not None:
                  payload["params"]=params
              headers=dict(cf_headers)
              headers["Content-Type"]="application/json"
              status,_,body=http(
                  f"{api}/accounts/{account_id}/d1/database/{dbid}/query",
                  "POST",
                  headers,
                  json.dumps(payload,separators=(",",":")).encode("utf-8"),
              )
              if not 200 <= status < 300:
                  raise RuntimeError(f"D1 HTTP {status}")
              obj=json.loads(body or b"{}")
              result=obj.get("result") or []
              if not result or not all(item.get("success") is True for item in result):
                  raise RuntimeError("D1 statement failed")
              rows=[]
              for item in result:
                  rows.extend(item.get("results") or [])
              return rows

          def mcp_call(payload, *, token=None, request_id=None):
              headers={
                  "Accept":"application/json",
                  "Content-Type":"application/json",
                  "User-Agent":"MUSITU-Connect-Axiom-E2E/2.0",
              }
              if token:
                  headers["Authorization"]="Bearer "+token
              if request_id:
                  headers["x-musitu-request-id"]=request_id
              return http(
                  mcp_base+"/mcp",
                  "POST",
                  headers,
                  json.dumps(payload,separators=(",",":")).encode("utf-8"),
              )

          def b64url(raw):
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode("ascii")

          health_status,_,health_body=http(
              mcp_base+"/health",
              headers={"Accept":"application/json","User-Agent":"MUSITU-Connect-Axiom-E2E/2.0"},
          )
          health=json.loads(health_body or b"{}")
          core_health=health.get("core") if isinstance(health.get("core"),dict) else health
          operation_count=int(core_health.get("operation_count") or 0)
          if (
              health_status != 200
              or health.get("ok") is not True
              or core_health.get("ok") is not True
              or operation_count <= 0
              or health.get("oauth_enforced") is not True
          ):
              raise RuntimeError("live Axiom public MCP health contract mismatch")
          issuer=str(health.get("auth_issuer") or "")
          resource=str(health.get("resource") or "")
          if not issuer.startswith("https://") or resource != mcp_base:
              raise RuntimeError("live Axiom OAuth issuer/resource mismatch")
          print("AXIOM_MCP_HEALTH="+json.dumps({
              "service":health.get("service"),
              "server_version":health.get("server_version"),
              "core_build_id":core_health.get("build_id"),
              "operation_count":operation_count,
              "oauth_enforced":health.get("oauth_enforced"),
              "issuer":issuer,
              "resource":resource,
          },sort_keys=True))

          scenario=[{
              "hazard":"Ground collapse",
              "exposure":0.54,
              "severity":10,
              "likelihood":0.62,
              "cost":18000,
              "benefit":0.34,
          }]
          run_id="mining-live-"+uuid.uuid4().hex[:12]

          catalog=AdapterCatalog()
          catalog.register(AdapterContract(
              name="Mining Adapter",
              domain="mining",
              version="1.0.0",
              normalize=normalize_mining_rows,
          ))
          fabric=ConnectFabric(signing_secret=secrets.token_bytes(32))
          ingest_runtime=ConnectRuntime(
              catalog=catalog,
              fabric=fabric,
              axiom=AxiomGateway(IntegrationGate()),
          )
          run=ingest_runtime.ingest(
              run_id=run_id,
              connector_name="credentialed-live-qualification",
              domain="mining",
              adapter_name="Mining Adapter",
              records=scenario,
          )
          canonical_input={
              "contract":run.canonical.contract,
              "domain":run.canonical.domain,
              "records":[dict(item) for item in run.canonical.records],
              "run_id":run.fabric.run_id,
          }
          canonical_sha256=hashlib.sha256(canonical_bytes(canonical_input)).hexdigest()
          expected_request_id=f"MUSITU-CONNECT-{run_id}-{canonical_sha256[:16]}"

          unauthorized_id=expected_request_id+"-UNAUTHORIZED"
          unauth_payload={
              "jsonrpc":"2.0",
              "id":unauthorized_id,
              "method":"tools/call",
              "params":{
                  "name":"musitu_axiom_execute",
                  "arguments":{
                      "operation":"arithmetic.evaluate",
                      "args":{"expression":"0.54*10.0*0.62"},
                  },
              },
          }
          unauth_status,_,unauth_body=mcp_call(unauth_payload,request_id=unauthorized_id)
          unauth_obj=json.loads(unauth_body or b"{}")
          unauth_result=unauth_obj.get("result") or {}
          unauth_structured=unauth_result.get("structuredContent") or {}
          if unauth_status != 200 or unauth_result.get("isError") is not True or unauth_structured.get("authenticated") is not False:
              raise RuntimeError("unauthorized live Axiom MCP call did not fail closed")

          prefix="fixture_connect_oauth_"+uuid.uuid4().hex
          customer=prefix+"_customer"
          source_key_id=prefix+"_sourcekey"
          callback="https://chatgpt.com/connector/oauth/musitu-connect-e2e"
          now=datetime.datetime.now(datetime.timezone.utc)
          created=now.isoformat().replace("+00:00","Z")
          source_expires=(now+datetime.timedelta(hours=1)).isoformat().replace("+00:00","Z")
          account_key="musitu_axiom_connect_fixture_"+secrets.token_urlsafe(40)
          print("::add-mask::"+account_key)
          account_hash=hashlib.sha256(account_key.encode("utf-8")).hexdigest()
          account_prefix=account_key[:16]
          verifier=b64url(secrets.token_bytes(48))
          challenge=b64url(hashlib.sha256(verifier.encode("utf-8")).digest())
          state="st_"+secrets.token_urlsafe(20)
          print("::add-mask::"+verifier)

          inserted=False
          client_id=None
          access=None
          refresh=None
          evidence={}
          try:
              residue=d1(
                  "SELECT "
                  "(SELECT count(*) FROM customers WHERE id LIKE 'fixture_connect_oauth_%')+"
                  "(SELECT count(*) FROM api_keys WHERE id LIKE 'fixture_connect_oauth_%')+"
                  "(SELECT count(*) FROM oauth_clients WHERE client_name LIKE 'MUSITU Connect OAuth E2E%') AS n;"
              )
              if not residue or int(residue[0]["n"]) != 0:
                  raise RuntimeError("preexisting Connect OAuth fixture residue")

              d1(
                  "INSERT INTO customers(id,email,name,plan,status,monthly_unit_override,created_at,updated_at) "
                  "VALUES(?1,?2,?3,?4,?5,?6,?7,?7)",
                  [customer,prefix+"@invalid.example","MUSITU Connect OAuth E2E fixture","developer","active",100,created],
              )
              d1(
                  "INSERT INTO api_keys(id,customer_id,key_hash,key_prefix,label,status,created_at,last_used_at,expires_at,revoked_at) "
                  "VALUES(?1,?2,?3,?4,?5,?6,?7,NULL,?8,NULL)",
                  [source_key_id,customer,account_hash,account_prefix,"connect-oauth-e2e-source-key","active",created,source_expires],
              )
              inserted=True

              rc,_,reg,_=http_json(
                  issuer+"/oauth/register",
                  "POST",
                  {
                      "redirect_uris":[callback],
                      "client_name":"MUSITU Connect OAuth E2E",
                      "token_endpoint_auth_method":"none",
                      "grant_types":["authorization_code","refresh_token"],
                      "response_types":["code"],
                  },
              )
              if rc != 201 or not reg.get("client_id"):
                  raise RuntimeError("OAuth dynamic client registration failed")
              client_id=str(reg["client_id"])
              print("::add-mask::"+client_id)

              auth_query={
                  "response_type":"code",
                  "client_id":client_id,
                  "redirect_uri":callback,
                  "scope":"axiom.execute",
                  "state":state,
                  "code_challenge":challenge,
                  "code_challenge_method":"S256",
                  "resource":resource,
              }
              ac,auth_headers,auth_body=http(
                  issuer+"/oauth/authorize?"+urllib.parse.urlencode(auth_query),
                  headers={"Accept":"text/html","User-Agent":"MUSITU-Connect-Axiom-E2E/2.0"},
              )
              if ac != 200:
                  raise RuntimeError("OAuth authorization page failed")
              page=auth_body.decode("utf-8","replace")
              flow_match=re.search(r'name="flow_id" value="([^"]+)"',page)
              cookie_header=str(auth_headers.get("Set-Cookie") or "")
              if not flow_match or "musitu_oauth_flow=" not in cookie_header:
                  raise RuntimeError("OAuth authorization flow/cookie missing")
              flow_id=flow_match.group(1)
              cookie=cookie_header.split(";",1)[0]
              print("::add-mask::"+flow_id)

              consent_status,consent_headers,_=form(
                  issuer+"/oauth/authorize",
                  {"flow_id":flow_id,"musitu_account_key":account_key},
                  {"Accept":"text/html","Cookie":cookie},
                  follow=False,
              )
              if consent_status != 302:
                  raise RuntimeError("OAuth consent did not redirect")
              location=str(consent_headers.get("Location") or "")
              parsed=urllib.parse.urlparse(location)
              params=urllib.parse.parse_qs(parsed.query)
              code=(params.get("code") or [""])[0]
              if not code or (params.get("state") or [""])[0] != state:
                  raise RuntimeError("OAuth authorization code/state mismatch")
              print("::add-mask::"+code)

              token_status,_,token_body=form(
                  issuer+"/oauth/token",
                  {
                      "grant_type":"authorization_code",
                      "code":code,
                      "code_verifier":verifier,
                      "client_id":client_id,
                      "redirect_uri":callback,
                      "resource":resource,
                  },
              )
              if token_status != 200:
                  raise RuntimeError("OAuth token exchange failed")
              token_obj=json.loads(token_body or b"{}")
              access=str(token_obj.get("access_token") or "")
              refresh=str(token_obj.get("refresh_token") or "")
              if (
                  not access
                  or not refresh
                  or token_obj.get("token_type") != "Bearer"
                  or token_obj.get("resource") != resource
                  or "axiom.execute" not in str(token_obj.get("scope") or "").split()
              ):
                  raise RuntimeError("OAuth token response contract mismatch")
              print("::add-mask::"+access)
              print("::add-mask::"+refresh)

              access_hash=hashlib.sha256(access.encode("utf-8")).hexdigest()
              access_rows=d1(
                  "SELECT a.api_key_id,a.customer_id,a.issuer,a.resource,a.scope,a.expires_at,a.revoked_at,k.status "
                  "FROM oauth_access_tokens a JOIN api_keys k ON k.id=a.api_key_id "
                  "WHERE a.token_hash=?1",
                  [access_hash],
              )
              if (
                  len(access_rows) != 1
                  or access_rows[0].get("customer_id") != customer
                  or access_rows[0].get("issuer") != issuer
                  or access_rows[0].get("resource") != resource
                  or access_rows[0].get("status") != "active"
                  or access_rows[0].get("revoked_at")
              ):
                  raise RuntimeError("OAuth access-token ledger mismatch")

              captured={}
              transport=AxiomMcpExecutor(mcp_base+"/mcp",access,timeout=50)
              def audited_executor(request):
                  captured.clear()
                  captured.update(request)
                  return transport(request)

              live_runtime=ConnectRuntime(
                  catalog=catalog,
                  fabric=fabric,
                  axiom=AxiomGateway(
                      IntegrationGate(allowed=True,reason="controlled credentialed qualification only"),
                      executor=audited_executor,
                  ),
              )
              before_events=int(d1(
                  "SELECT count(*) AS n FROM usage_events WHERE customer_id=?1",
                  [customer],
              )[0]["n"])
              structured=live_runtime.execute_mining_risk(run)

              if captured.get("canonical_sha256") != canonical_sha256:
                  raise RuntimeError("Connect canonical SHA-256 mismatch")
              if captured.get("request_id") != expected_request_id:
                  raise RuntimeError("Connect-generated request ID mismatch")
              if structured.get("request_id") is not None:
                  raise RuntimeError("public MCP leaked sanitized internal request ID")
              result_text=json.dumps(structured,separators=(",",":"),sort_keys=True)
              if "3.348" not in result_text:
                  raise RuntimeError("expected live arithmetic result absent")

              positive_events=d1(
                  "SELECT request_id,operation,compute_units,customer_id,key_id,http_status,result_sha256 "
                  "FROM usage_events WHERE customer_id=?1 ORDER BY created_at DESC",
                  [customer],
              )
              if len(positive_events) != before_events+1:
                  raise RuntimeError("Axiom usage event exact delta mismatch")
              matching=[
                  item for item in positive_events
                  if item.get("request_id")==expected_request_id
                  and item.get("operation")=="arithmetic.evaluate"
                  and item.get("customer_id")==customer
                  and int(item.get("http_status") or 0)==200
              ]
              if len(matching) != 1:
                  raise RuntimeError("Axiom usage ledger request-ID correlation mismatch")
              ledger_event=matching[0]
              if int(ledger_event.get("compute_units") or 0) <= 0 or len(str(ledger_event.get("result_sha256") or "")) < 32:
                  raise RuntimeError("Axiom usage ledger evidence incomplete")

              malformed_id=expected_request_id+"-MALFORMED"
              malformed_payload={
                  "jsonrpc":"2.0",
                  "id":malformed_id,
                  "method":"tools/call",
                  "params":{
                      "name":"musitu_axiom_execute",
                      "arguments":{
                          "operation":"arithmetic.evaluate",
                          "args":{"expression":"("},
                      },
                  },
              }
              malformed_status,_,malformed_body=mcp_call(
                  malformed_payload,
                  token=access,
                  request_id=malformed_id,
              )
              malformed_obj=json.loads(malformed_body or b"{}")
              malformed_result=malformed_obj.get("result") or {}
              malformed_rejected=(
                  400 <= malformed_status < 500
                  or malformed_result.get("isError") is True
                  or bool(malformed_obj.get("error"))
              )
              if not malformed_rejected:
                  raise RuntimeError("malformed authenticated Axiom MCP request was accepted")

              class FakeResponse:
                  def __init__(self,payload):
                      self.payload=payload
                  def read(self):
                      return json.dumps(self.payload,separators=(",",":")).encode("utf-8")

              replay_request=dict(captured)
              bad_jsonrpc={
                  "jsonrpc":"2.0",
                  "id":expected_request_id+"-MISMATCH",
                  "result":{"structuredContent":dict(structured)},
              }
              jsonrpc_mismatch_rejected=False
              with patch("urllib.request.urlopen",return_value=FakeResponse(bad_jsonrpc)):
                  try:
                      transport(replay_request)
                  except RuntimeError as exc:
                      jsonrpc_mismatch_rejected=str(exc)=="AXIOM_REQUEST_ID_MISMATCH"
              if not jsonrpc_mismatch_rejected:
                  raise RuntimeError("Connect accepted mismatched JSON-RPC response ID")

              bad_structured=dict(structured)
              bad_structured["request_id"]=expected_request_id+"-MISMATCH"
              bad_structured_response={
                  "jsonrpc":"2.0",
                  "id":expected_request_id,
                  "result":{"structuredContent":bad_structured},
              }
              structured_mismatch_rejected=False
              with patch("urllib.request.urlopen",return_value=FakeResponse(bad_structured_response)):
                  try:
                      transport(replay_request)
                  except RuntimeError as exc:
                      structured_mismatch_rejected=str(exc)=="AXIOM_REQUEST_ID_MISMATCH"
              if not structured_mismatch_rejected:
                  raise RuntimeError("Connect accepted mismatched structured response request ID")

              evidence={
                  "schema":"musitu.connect.axiom_credentialed_e2e.v2",
                  "gate":"MUSITU_CONNECT_CREDENTIALED_AXIOM_E2E_PASS",
                  "source_commit":os.environ.get("GITHUB_SHA"),
                  "workflow_run_id":os.environ.get("GITHUB_RUN_ID"),
                  "product":"MUSITU Connect",
                  "adapter":"Mining Adapter",
                  "axiom_role":"downstream engine",
                  "production_axiom_integration_enabled":False,
                  "mcp_endpoint":mcp_base+"/mcp",
                  "oauth_issuer":issuer,
                  "oauth_resource":resource,
                  "oauth_authorization_code_flow":True,
                  "oauth_dynamic_client_registration":True,
                  "oauth_pkce_s256":True,
                  "oauth_scope":"axiom.execute",
                  "axiom_public_gate_version":health.get("server_version"),
                  "axiom_core_build_id":core_health.get("build_id"),
                  "axiom_operation_count":operation_count,
                  "canonical_input":canonical_input,
                  "canonical_sha256":canonical_sha256,
                  "connect_request_id":expected_request_id,
                  "authenticated_mcp_call":True,
                  "bearer_token_published":False,
                  "jsonrpc_response_id_exact_match_enforced":True,
                  "public_structured_request_id_sanitized":True,
                  "axiom_usage_ledger_request_id":ledger_event.get("request_id"),
                  "axiom_usage_ledger_result_sha256_present":True,
                  "end_to_end_request_id_correlation":ledger_event.get("request_id")==expected_request_id,
                  "result_3_348_observed":True,
                  "lineage":run.fabric.lineage,
                  "negative_tests":{
                      "unauthorized":{
                          "pass":True,
                          "http_status":unauth_status,
                          "authenticated":unauth_structured.get("authenticated"),
                      },
                      "malformed":{
                          "pass":True,
                          "http_status":malformed_status,
                          "is_error":malformed_result.get("isError"),
                      },
                      "jsonrpc_request_id_mismatch":{
                          "pass":True,
                          "mode":"controlled replay of live sanitized response shape through production Connect executor",
                      },
                      "structured_request_id_mismatch":{
                          "pass":True,
                          "mode":"controlled injected internal-id mismatch through production Connect executor",
                      },
                  },
                  "claims":{
                      "production_mining_connectors":"NOT_DEMONSTRATED",
                      "mine_specific_predictive_accuracy":"NOT_CERTIFIED",
                      "mine_safety_certification":"NOT_CERTIFIED",
                      "global_superiority":"NOT_CERTIFIED",
                  },
              }
          finally:
              if inserted:
                  try:
                      d1("DELETE FROM usage_events WHERE customer_id=?1",[customer])
                      d1("DELETE FROM usage_buckets WHERE customer_id=?1",[customer])
                      d1("DELETE FROM oauth_access_tokens WHERE customer_id=?1",[customer])
                      d1("DELETE FROM oauth_refresh_tokens WHERE customer_id=?1",[customer])
                      d1("DELETE FROM oauth_authorization_codes WHERE customer_id=?1",[customer])
                      d1("DELETE FROM oauth_authorization_flows WHERE client_id=?1",[client_id or ""])
                      d1("DELETE FROM oauth_clients WHERE client_id=?1",[client_id or ""])
                      d1("DELETE FROM api_keys WHERE customer_id=?1",[customer])
                      d1("DELETE FROM customers WHERE id=?1",[customer])
                  finally:
                      remaining=d1(
                          "SELECT "
                          "(SELECT count(*) FROM customers WHERE id=?1)+"
                          "(SELECT count(*) FROM api_keys WHERE customer_id=?1)+"
                          "(SELECT count(*) FROM usage_events WHERE customer_id=?1)+"
                          "(SELECT count(*) FROM usage_buckets WHERE customer_id=?1)+"
                          "(SELECT count(*) FROM oauth_access_tokens WHERE customer_id=?1)+"
                          "(SELECT count(*) FROM oauth_refresh_tokens WHERE customer_id=?1)+"
                          "(SELECT count(*) FROM oauth_authorization_codes WHERE customer_id=?1) AS n",
                          [customer],
                      )
                      evidence["fixture_rows_remaining"]=int(remaining[0]["n"]) if remaining else -1

          if evidence.get("gate") != "MUSITU_CONNECT_CREDENTIALED_AXIOM_E2E_PASS" or evidence.get("fixture_rows_remaining") != 0:
              raise RuntimeError("Connect credentialed Axiom E2E gate or cleanup failed")
          evidence["cleanup_complete"]=True
          raw=(json.dumps(evidence,indent=2,sort_keys=True)+"\n").encode("utf-8")
          pathlib.Path("musitu-connect-axiom-credentialed-e2e.json").write_bytes(raw)
          digest=hashlib.sha256(raw).hexdigest()
          pathlib.Path("musitu-connect-axiom-credentialed-e2e.sha256").write_text(
              digest+"  musitu-connect-axiom-credentialed-e2e.json\n",
              encoding="utf-8",
          )
          print("CONNECT_AXIOM_E2E_EVIDENCE="+json.dumps({**evidence,"evidence_sha256":digest},sort_keys=True))
          PY
      - name: Publish evidence summary
        if: success()
        shell: bash
        run: |
          {
            echo '## MUSITU Connect credentialed Axiom E2E'
            echo
            echo 'Evidence SHA-256:'
            cat musitu-connect-axiom-credentialed-e2e.sha256
            echo
            echo '\`\`\`json'
            cat musitu-connect-axiom-credentialed-e2e.json
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
