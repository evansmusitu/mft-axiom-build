name: MUSITU Connect Axiom provisioning contract

on:
  push:
    paths:
      - '.github/workflows/musitu-connect-axiom-provisioning-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct protected runtime snapshot
        env:
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          P=deploy_payload/runtime_min
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > runtime.enc.b64
          base64 -d runtime.enc.b64 > runtime.tar.gz.enc
          test "$(sha256sum runtime.tar.gz.enc | awk '{print $1}')" = 'b82448d6b4b34b302748815af976b535d69922c197d4b7a9056fc2f91a9e12cf'
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in runtime.tar.gz.enc -out runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          test "$(sha256sum runtime.tar.gz | awk '{print $1}')" = 'b4d5a0266446523969a619f5e9bb5a04d9b815c78a2ab82ed046ef5e23d53663'
          mkdir runtime
          tar -xzf runtime.tar.gz -C runtime
      - name: Probe live admin contract read-only
        env:
          MFT_CONTROL_SECRET: ${{ secrets.MFT_CONTROL_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.error,urllib.request
          base='https://axiom.mftintelligence.com'
          secret=os.environ.get('MFT_CONTROL_SECRET') or ''
          if not secret:
              raise RuntimeError('MFT_CONTROL_SECRET unavailable')
          req=urllib.request.Request(
              base+'/v1/admin/customers',
              headers={
                  'Accept':'application/json',
                  'x-mft-control':secret,
                  'x-mft-axiom-version':'3.0.0',
                  'User-Agent':'MUSITU-Connect-Provisioning-Probe/1.0',
              },
          )
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  status=r.status; raw=r.read()
          except urllib.error.HTTPError as e:
              status=e.code; raw=e.read()
          try:
              obj=json.loads(raw or b'{}')
          except Exception:
              obj={}
          rows=[]
          if isinstance(obj,list): rows=obj
          elif isinstance(obj,dict):
              for k in ('customers','items','data','results'):
                  if isinstance(obj.get(k),list):
                      rows=obj[k]; break
          fixture_like=[]
          for row in rows:
              if not isinstance(row,dict): continue
              s=' '.join(str(row.get(k) or '') for k in ('id','email','name','label')).lower()
              if any(x in s for x in ('fixture','e2e','test','invalid.example')):
                  fixture_like.append(row)
          print('CONNECT_AXIOM_ADMIN_PROBE='+json.dumps({
              'http_status':status,
              'customer_count':len(rows),
              'fixture_like_count':len(fixture_like),
              'authenticated':status==200,
              'raw_customer_data_published':False,
              'secret_values_published':False,
          },sort_keys=True))
          if status!=200:
              raise RuntimeError('live admin read-only probe failed HTTP '+str(status))
          PY
      - name: Emit safe provisioning contract metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re
          src='\n'.join(p.read_text(errors='replace') for p in pathlib.Path('runtime/worker/src').glob('*.js'))

          def body(name):
              m=re.search(r'(?:async\s+)?function\s+'+re.escape(name)+r'\s*\([^)]*\)\s*\{',src)
              if not m:return ''
              start=m.end()-1; depth=0; quote=None; esc=False
              for i in range(start,len(src)):
                  ch=src[i]
                  if quote:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: quote=None
                      continue
                  if ch in ("'",'"',chr(96)):
                      quote=ch; continue
                  if ch=='{': depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0:return src[start+1:i]
              return ''

          def props(b):
              m=re.search(r'\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*await\s+request\.json\s*\(\s*\)[^;\n]*',b)
              if not m:return []
              v=m.group(1)
              return sorted(set(re.findall(r'\b'+re.escape(v)+r'\.([A-Za-z_$][\w$]*)\b',b)))

          def destructured(b):
              names=[]
              for m in re.finditer(r'\b(?:const|let|var)\s*\{([^}]{1,500})\}\s*=\s*(?:await\s+)?(?:request\.json\s*\(\s*\)|[A-Za-z_$][\w$]*)',b):
                  for part in m.group(1).split(','):
                      token=part.strip().split('=')[0].strip()
                      if ':' in token: token=token.split(':',1)[0].strip()
                      if re.fullmatch(r'[A-Za-z_$][\w$]*',token): names.append(token)
              return sorted(set(names))

          def signature(name):
              m=re.search(r'(?:async\s+)?function\s+'+re.escape(name)+r'\s*\(([^)]*)\)',src)
              return [x.strip().split('=')[0].strip() for x in m.group(1).split(',') if x.strip()] if m else []

          def property_names(b):
              names=set(re.findall(r'(?:\?\.|\.)\s*([A-Za-z_$][\w$]*)',b))
              names.update(re.findall(r'\[\s*["\']([A-Za-z_$][\w$]*)["\']\s*\]',b))
              return sorted(names)

          def object_keys(b):
              return sorted(set(re.findall(r'(?<![?\w$])([A-Za-z_$][\w$]*)\s*:',b)))

          def call_names(b):
              return sorted(set(re.findall(r'\b([A-Za-z_$][\w$]*)\s*\(',b)))

          def return_keys(b):
              out=[]
              for m in re.finditer(r'\breturn\s+json\s*\(\s*\{([^{}]{0,1800})\}',b,re.S):
                  out.append(sorted(set(re.findall(r'([A-Za-z_$][\w$]*)\s*:',m.group(1)))))
              return out

          def literals(b):
              vals=[]
              for x in re.findall(r'["\']([^"\']{1,100})["\']',b):
                  if re.search(r'customer|key|label|email|name|plan|status|required|invalid|active|admin|internal|control|forbid|authorization|bearer',x,re.I):
                      vals.append(x)
              return sorted(set(vals))

          customer=body('adminCreateCustomer')
          issue=body('adminIssueKey')
          auth=body('authenticate')
          internal=body('authenticateInternal') or body('requireInternal') or body('internalPrincipal')

          route_windows=[]
          for m in re.finditer(re.escape('/v1/admin/customers'),src):
              w=src[max(0,m.start()-3500):min(len(src),m.start()+6000)]
              route_windows.append({
                  'methods':sorted(set(re.findall(r'request\.method\s*(?:===|==)\s*["\']([A-Z]+)["\']',w))),
                  'headers':sorted(set(x.lower() for x in re.findall(r'headers\.get\s*\(\s*["\']([^"\']+)["\']',w))),
                  'calls':sorted(set(x for x in re.findall(r'\b([A-Za-z_$][\w$]*)\s*\(',w) if re.search(r'admin|auth|customer|key|internal|control',x,re.I))),
              })

          regex_routes=[]
          for m in re.finditer(r'url\.pathname\.match\s*\(\s*\/([^\n]{1,240})\/\s*\)',src):
              if 'admin' in m.group(1): regex_routes.append(m.group(1))
          for m in re.finditer(r'/((?:\\.|[^/\n]){1,240})/[gimsyu]*',src):
              raw=m.group(1)
              if re.search(r'admin|customers|keys',raw,re.I): regex_routes.append(raw)

          combined=customer+'\n'+issue+'\n'+auth+'\n'+internal
          env_names=sorted(set(re.findall(r'\benv\.([A-Z][A-Z0-9_]*)',combined)))
          out={
              'schema':'musitu.connect.axiom_provisioning_contract.v1',
              'admin_literal_paths':sorted(set(re.findall(r'["\'](\/v1\/admin\/[A-Za-z0-9_./:{}-]+)["\']',src))),
              'admin_regex_routes':sorted(set(regex_routes)),
              'route_windows':route_windows[:10],
              'admin_create_customer':{
                  'present':bool(customer),
                  'signature_params':signature('adminCreateCustomer'),
                  'body_properties':props(customer),
                  'destructured_names':destructured(customer),
                  'property_names':property_names(customer),
                  'object_keys':object_keys(customer),
                  'call_names':[x for x in call_names(customer) if re.search(r'customer|email|plan|json|auth|internal|create|id|now',x,re.I)],
                  'return_object_key_sets':return_keys(customer),
                  'safe_literals':literals(customer),
              },
              'admin_issue_key':{
                  'present':bool(issue),
                  'signature_params':signature('adminIssueKey'),
                  'body_properties':props(issue),
                  'destructured_names':destructured(issue),
                  'property_names':property_names(issue),
                  'object_keys':object_keys(issue),
                  'call_names':[x for x in call_names(issue) if re.search(r'key|json|auth|internal|issue|id|now',x,re.I)],
                  'return_object_key_sets':return_keys(issue),
                  'safe_literals':literals(issue),
              },
              'auth':{
                  'header_names':sorted(set(x.lower() for x in re.findall(r'headers\.get\s*\(\s*["\']([^"\']+)["\']',auth+'\n'+internal))),
                  'secret_env_names':[x for x in env_names if re.search(r'CONTROL|SECRET|ADMIN',x,re.I)],
                  'mentions_bearer':bool(re.search(r'bearer',auth+'\n'+internal,re.I)),
              },
              'plaintext_source_published':False,
              'secret_values_published':False,
          }
          print('CONNECT_AXIOM_PROVISIONING_CONTRACT='+json.dumps(out,sort_keys=True))
          pathlib.Path('connect-axiom-provisioning-contract.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
