name: MUSITU Connect dedicated identity provision

on:
  push:
    branches: ['feat/musitu-connect-frontier']
    paths:
      - '.github/workflows/musitu-connect-dedicated-identity-provision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      REPO: evansmusitu/mft-axiom-build
      AXIOM_ADMIN_BASE: https://axiom.mftintelligence.com
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      D1_UUID: 504029cc-f9a5-495e-818f-63c6144b4ea4
      SERVICE_EMAIL: musitu-connect@mftintelligence.com
      SERVICE_NAME: MUSITU Connect Production Service
      SERVICE_PLAN: developer
      KEY_LABEL: musitu-connect-production
      TARGET_SECRET: MUSITU_CONNECT_AXIOM_ACCOUNT_KEY
    steps:
      - uses: actions/checkout@v4

      - name: Provision dedicated identity and escrow key directly into Actions secret
        env:
          MUSITU_CONTROL_SECRET: ${{ secrets.MUSITU_CONTROL_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MUSITU_SECRET_WRITER_TOKEN: ${{ secrets.MUSITU_SECRET_WRITER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import secrets
          import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          required = ["MUSITU_CONTROL_SECRET","CLOUDFLARE_API_TOKEN","MUSITU_SECRET_WRITER_TOKEN"]
          for name in required:
              if not os.environ.get(name,"").strip():
                  raise SystemExit("FAIL_CLOSED_MISSING_"+name)

          control=os.environ["MUSITU_CONTROL_SECRET"].strip()
          cf_token=os.environ["CLOUDFLARE_API_TOKEN"].strip()
          writer=os.environ["MUSITU_SECRET_WRITER_TOKEN"].strip()
          print("::add-mask::"+control)
          print("::add-mask::"+writer)

          repo=os.environ["REPO"]
          target_secret=os.environ["TARGET_SECRET"]
          admin=os.environ["AXIOM_ADMIN_BASE"].rstrip("/")
          cf_api=os.environ["CF_API"].rstrip("/")
          account=os.environ["ACCOUNT_ID"]
          d1_uuid=os.environ["D1_UUID"]
          email=os.environ["SERVICE_EMAIL"]
          name=os.environ["SERVICE_NAME"]
          plan=os.environ["SERVICE_PLAN"]
          label=os.environ["KEY_LABEL"]

          def http(url, method="GET", headers=None, body=None, timeout=40):
              req=urllib.request.Request(url,method=method,headers=dict(headers or {}),data=body)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as resp:
                      return resp.status,resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code,exc.read()

          def d1(sql, params=None):
              payload={"sql":sql}
              if params is not None:
                  payload["params"]=params
              code,raw=http(
                  f"{cf_api}/accounts/{account}/d1/database/{d1_uuid}/query",
                  "POST",
                  {
                      "Authorization":"Bearer "+cf_token,
                      "Accept":"application/json",
                      "Content-Type":"application/json",
                      "User-Agent":"MUSITU-Connect-Dedicated-Identity-Provision/1.0",
                  },
                  json.dumps(payload,separators=(",",":")).encode(),
              )
              if code!=200:
                  raise RuntimeError("D1_QUERY_HTTP_"+str(code))
              obj=json.loads(raw or b"{}")
              batches=obj.get("result") or []
              if not batches or not all(x.get("success") is True for x in batches):
                  raise RuntimeError("D1_QUERY_FAILED")
              out=[]
              for batch in batches:
                  out.extend(batch.get("results") or [])
              return out

          gh_env=dict(os.environ)
          gh_env["GH_TOKEN"]=writer

          def gh(args, input_text=None):
              p=subprocess.run(
                  ["gh",*args],
                  input=input_text,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  env=gh_env,
              )
              if p.returncode!=0:
                  raise RuntimeError("GH_COMMAND_FAILED")
              return p.stdout

          # Prove the temporary writer token can actually write/delete repository secrets
          # before performing any Axiom production mutation.
          gh(["api",f"repos/{repo}/actions/secrets/public-key"])
          canary="writer-probe-"+secrets.token_urlsafe(24)
          print("::add-mask::"+canary)
          gh(["secret","set","MUSITU_SECRET_WRITER_PROBE","--repo",repo],canary)
          listing=json.loads(gh(["api",f"repos/{repo}/actions/secrets?per_page=100"]) or "{}")
          if "MUSITU_SECRET_WRITER_PROBE" not in {x.get("name") for x in listing.get("secrets",[])}:
              raise RuntimeError("WRITER_CANARY_NOT_VISIBLE")
          gh(["secret","delete","MUSITU_SECRET_WRITER_PROBE","--repo",repo])
          print("SECRET_WRITER_PREFLIGHT=PASS")

          # Idempotent customer preflight. Never create a second customer with this identity.
          rows=d1(
              "SELECT id,email,name,plan,status FROM customers WHERE lower(email)=lower(?1) ORDER BY created_at",
              [email],
          )
          if len(rows)>1:
              raise RuntimeError("DUPLICATE_SERVICE_CUSTOMER")
          if len(rows)==1:
              customer=rows[0]
              if (
                  customer.get("name")!=name
                  or customer.get("plan")!=plan
                  or customer.get("status")!="active"
              ):
                  raise RuntimeError("EXISTING_SERVICE_CUSTOMER_CONTRACT_MISMATCH")
              customer_id=str(customer["id"])
              customer_created=False
          else:
              code,raw=http(
                  admin+"/v1/admin/customers",
                  "POST",
                  {
                      "x-musitu-control":control,
                      "x-musitu-axiom-version":"3.0.0",
                      "Accept":"application/json",
                      "Content-Type":"application/json",
                      "User-Agent":"MUSITU-Connect-Dedicated-Identity-Provision/1.0",
                  },
                  json.dumps({"email":email,"name":name,"plan":plan},separators=(",",":")).encode(),
              )
              try:
                  obj=json.loads(raw or b"{}")
              except Exception:
                  obj={}
              if code not in (200,201) or obj.get("ok") is not True:
                  raise RuntimeError("CUSTOMER_CREATE_FAILED_HTTP_"+str(code))
              rows=d1(
                  "SELECT id,email,name,plan,status FROM customers WHERE lower(email)=lower(?1)",
                  [email],
              )
              if len(rows)!=1 or rows[0].get("status")!="active":
                  raise RuntimeError("CUSTOMER_CREATE_READBACK_FAILED")
              customer_id=str(rows[0]["id"])
              customer_created=True

          # A rerun must not mint a second live key.
          existing=d1(
              "SELECT id FROM api_keys WHERE customer_id=?1 AND label=?2 AND status='active' "
              "AND revoked_at IS NULL AND (expires_at IS NULL OR expires_at>datetime('now'))",
              [customer_id,label],
          )
          if existing:
              raise RuntimeError("DEDICATED_ACTIVE_KEY_ALREADY_EXISTS")

          raw_key=None
          key_id=None
          secret_stored=False
          try:
              code,raw=http(
                  admin+"/v1/admin/customers/"+urllib.parse.quote(customer_id,safe="")+"/keys",
                  "POST",
                  {
                      "x-musitu-control":control,
                      "x-musitu-axiom-version":"3.0.0",
                      "Accept":"application/json",
                      "Content-Type":"application/json",
                      "User-Agent":"MUSITU-Connect-Dedicated-Identity-Provision/1.0",
                  },
                  json.dumps({"label":label},separators=(",",":")).encode(),
              )
              try:
                  obj=json.loads(raw or b"{}")
              except Exception:
                  obj={}
              if code not in (200,201) or obj.get("ok") is not True:
                  raise RuntimeError("KEY_ISSUE_FAILED_HTTP_"+str(code))
              api_key=obj.get("api_key")
              if isinstance(api_key,dict):
                  raw_key=str(api_key.get("key") or "")
              elif isinstance(api_key,str):
                  raw_key=api_key
              else:
                  raw_key=""
              if len(raw_key)<24:
                  raise RuntimeError("KEY_ISSUE_RESPONSE_MISSING_RAW_KEY")
              print("::add-mask::"+raw_key)

              digest=hashlib.sha256(raw_key.encode()).hexdigest()
              key_rows=d1(
                  "SELECT id,status,label FROM api_keys WHERE customer_id=?1 AND key_hash=?2",
                  [customer_id,digest],
              )
              if len(key_rows)!=1 or key_rows[0].get("status")!="active" or key_rows[0].get("label")!=label:
                  raise RuntimeError("ISSUED_KEY_READBACK_FAILED")
              key_id=str(key_rows[0]["id"])

              # gh encrypts client-side and writes the value directly to the repository secret.
              gh(["secret","set",target_secret,"--repo",repo],raw_key)
              after=json.loads(gh(["api",f"repos/{repo}/actions/secrets?per_page=100"]) or "{}")
              if target_secret not in {x.get("name") for x in after.get("secrets",[])}:
                  raise RuntimeError("TARGET_SECRET_WRITE_NOT_VISIBLE")
              secret_stored=True
              print("AXIOM_KEY_ESCROW_TO_ACTIONS_SECRET=PASS")
          finally:
              # If a key was minted but escrow did not complete, revoke it through the
              # supported admin route rather than leaving an orphan credential live.
              if raw_key and not secret_stored:
                  try:
                      if not key_id:
                          digest=hashlib.sha256(raw_key.encode()).hexdigest()
                          rr=d1("SELECT id FROM api_keys WHERE customer_id=?1 AND key_hash=?2",[customer_id,digest])
                          key_id=str(rr[0]["id"]) if len(rr)==1 else None
                      if key_id:
                          rc,_=http(
                              admin+"/v1/admin/keys/"+urllib.parse.quote(key_id,safe="")+"/revoke",
                              "POST",
                              {
                                  "x-musitu-control":control,
                                  "x-musitu-axiom-version":"3.0.0",
                                  "Accept":"application/json",
                                  "Content-Type":"application/json",
                                  "User-Agent":"MUSITU-Connect-Dedicated-Identity-Provision/1.0",
                              },
                              b"{}",
                          )
                          print("FAILED_ESCROW_KEY_REVOCATION_HTTP="+str(rc))
                  except Exception:
                      print("FAILED_ESCROW_KEY_REVOCATION=ATTEMPTED")

          if not secret_stored:
              raise RuntimeError("DEDICATED_KEY_ESCROW_FAILED")

          # Remove temporary duplicated/high-privilege repository secrets after success.
          for temporary in ["MUSITU_CONTROL_SECRET_CANDIDATE_PROBE","MUSITU_SECRET_WRITER_TOKEN"]:
              try:
                  gh(["secret","delete",temporary,"--repo",repo])
                  print("TEMP_SECRET_REMOVED="+temporary)
              except Exception:
                  print("TEMP_SECRET_REMOVAL_WARNING="+temporary)

          print("CUSTOMER_CREATED="+("true" if customer_created else "false"))
          print("MUSITU_CONNECT_DEDICATED_IDENTITY_PROVISION=PASS")
          PY

      - name: Publish safe provisioning summary
        if: success()
        shell: bash
        run: |
          {
            echo '## MUSITU Connect dedicated Axiom identity'
            echo
            echo '- Dedicated non-fixture service customer: provisioned or reused safely'
            echo '- Dedicated API key: issued exactly once'
            echo '- Raw API key published: no'
            echo '- API key stored as Actions secret: MUSITU_CONNECT_AXIOM_ACCOUNT_KEY'
            echo '- Temporary writer/candidate repository secrets: removal attempted'
            echo '- Production Connect → Axiom runtime enablement: unchanged / blocked'
          } >> "$GITHUB_STEP_SUMMARY"
