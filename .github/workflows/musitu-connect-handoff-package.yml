name: MUSITU Connect continuation handoff package

on:
  push:
    branches:
      - 'handoff/musitu-connect-20261008-cba0a3b'
    paths:
      - '.github/workflows/musitu-connect-handoff-package.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FROZEN_HEAD: 'cba0a3b1c29d7607c0668d8e4a5a1399152dd932'
      SEALED_MAIN: 'd6a846f6bbe0bccac1758713eb4de167caf07113'
      PACKAGE_NAME: 'MUSITU_CONNECT_CLEAN_WHOLE_PRODUCT_CONTINUATION_HANDOFF_20261008_CBA0A3B_AUTHORITATIVE'
    steps:
      - name: Checkout exact frozen product snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_HEAD }}
          path: handoff-root/PRODUCT
          fetch-depth: 1

      - name: Remove VCS working metadata
        run: |
          rm -rf handoff-root/PRODUCT/.git
          test ! -e handoff-root/PRODUCT/.git

      - name: Create continuation authority
        run: |
          mkdir -p handoff-root/HANDOFF handoff-root/EVIDENCE

          cat > handoff-root/HANDOFF/00_READ_FIRST.md <<'EOF'
          # MUSITU Connect — continuation authority

          This package is the authoritative clean continuation snapshot for MUSITU Connect created on 2026-10-08.

          ## Read order in a new chat

          Before changing anything, read these files in this exact order:

          1. `HANDOFF/00_READ_FIRST.md`
          2. `HANDOFF/STATE.json`
          3. `HANDOFF/CONTINUATION.md`
          4. `HANDOFF/EVIDENCE_INDEX.json`
          5. `HANDOFF/PACKAGE_MANIFEST.json`
          6. `HANDOFF/MANIFEST.sha256`
          7. `HANDOFF/EXACT_NEW_CHAT_COMMAND.txt`

          Then immediately re-read the live GitHub PR/head/CI state before modifying the repository, because the live feature branch may have advanced after this snapshot was frozen.

          ## Frozen source baseline

          - Repository: `evansmusitu/mft-axiom-build`
          - Product branch: `feat/musitu-connect-frontier`
          - PR: `#9`
          - Frozen package head: `cba0a3b1c29d7607c0668d8e4a5a1399152dd932`
          - Sealed `main`: `d6a846f6bbe0bccac1758713eb4de167caf07113`

          The complete source tree at the frozen head is under `PRODUCT/`.

          ## Immutable operating rules

          - MUSITU Connect is the general-purpose enterprise interoperability/runtime platform.
          - Mining is the first adapter.
          - Axiom is a downstream intelligence/quant engine and must not become the integration layer.
          - Keep PR #9 open/unmerged unless the user explicitly authorizes merge.
          - Keep sealed `main` exactly at the SHA above unless the user explicitly authorizes otherwise.
          - Do not redeploy or mutate production merely because of a chat shift, CI result, or infrastructure qualification.
          - Do not weaken Cloudflare/Axiom security.
          - Do not expose, print, rotate, or ask the user to paste credentials/secrets.
          - `connect.musitu.com` remains deferred unless scoped Cloudflare transport/security permission can be solved without weakening security.
          - Commercial/named-baseline superiority claims require identical workload/topology/hardware/licensing evidence.

          ## Exact status at freeze

          PR #9 was open, unmerged and mergeable. Normal Connect qualification, infrastructure qualification and Brand Guard were green on the frozen head. The methane forecasting backtest was intentionally red and is the active engineering frontier.

          Latest red methane run:
          - Workflow run: `37728089126`
          - Artifact ID: `11529095892`
          - Gate: `REAL_MINE_METHANE_BACKTEST_FAILED`
          - Source rows: 9,199,930
          - Eligible examples: 306,601
          - Median recall: 0.8968409598533875
          - Median precision: 0.05242017983047713
          - Median F2: 0.21223930547348396
          - Persistence baseline median F2: 0.29807984913409546
          - Passing folds: 0 / 4
          - Required passing folds: 3 / 4

          Do **not** lower the gate to turn CI green. Diagnose and improve the predictive policy/model while preserving chronological leakage controls and the published task geometry.

          ## Published real-mine prediction geometry currently enforced

          - Dataset identity: Mendeley Data `yd7vw4c5mk`, DOI `10.17632/yd7vw4c5mk.1`
          - License: CC BY 4.0
          - Anonymous transport used in qualified telemetry evidence: OpenML dataset 42701
          - Exact source SHA-256: `28e2eed4c4a314daa4319f656a09bb43d8acea603dcb906e31c98049c91a8fdc`
          - History window: 600 seconds
          - Forecast target: methane threshold exceedance 180–360 seconds ahead
          - Target sensors: MM263, MM264, MM256
          - Warning threshold: 1.0
          - Rolling temporal folds are leakage-purged.
          - Online recalibration may use only outcomes whose complete future label window has elapsed.
          - The hard observed-methane warning rule must never be suppressed by a learned model.

          Continue from live state, not from assumptions.
          EOF

          cat > handoff-root/HANDOFF/CONTINUATION.md <<'EOF'
          # MUSITU Connect — full continuation context

          ## Product architecture

          MUSITU Connect is being built as a world-class general-purpose enterprise interoperability/runtime platform. Mining is only its first adapter. The durable path already spans protocol ingress, canonical contracts, signed lineage, SQLite WAL durability, analytical/spatial integration, workflow durability, OTLP observability, optimization and a controlled Axiom downstream boundary.

          Axiom is downstream intelligence. It must never absorb the integration layer.

          ## Proven engineering layers already established

          ### Durable Mining Adapter
          - MQTT JSON ingress with a 1 MiB bound.
          - Explicit OPC-UA node mapping.
          - Canonical normalization/signing.
          - SQLite WAL ledger with `synchronous=FULL`.
          - Idempotence/conflict protection.
          - Tamper-evident hash-chained audit.
          - Exact replay and tamper detection.
          - Qualified workflow boundary.
          - Axiom execution only through a controlled downstream gateway.

          ### Persistence performance frontier
          The initial ingest persistence path was optimized without weakening durability:
          - run row + `RUN_RECORDED` + `INGEST_COMPLETED` are committed atomically,
          - the sealing SHA is carried into persistence rather than redundantly recomputed,
          - replay still independently re-hashes stored canonical bytes.

          Verified reference-lane median durable MQTT throughput improved from about 15,278 events/s to 41,534 events/s (~2.72x), with p99 improving about 4.84x. The stronger four-round counterbalanced reference-vs-EMQX result remained TIE within the 5% band.

          ### Industrial field evidence
          A full one-million-event MQTT stress path and 10-minute restart soak passed for both reference Mosquitto and EMQX-backed lanes, plus a one-million-point OPC-UA forced-recovery run. This is field/load software evidence, not mine-safety certification.

          ### Mine Reality Gate
          A separate adversarial synthetic mining-telemetry gate passed:
          - 1,000,000 / 1,000,000 events,
          - deliberate duplicates,
          - stale/out-of-order/clock-drift data,
          - multiple broker restarts,
          - fail-closed malformed telemetry probes,
          - replay/audit verification.

          ### Real public mine incident data
          The official MSHA Accident Injuries corpus was qualified:
          - 275,094 source records,
          - zero parse failures,
          - 2000-01-01 through 2026-09-25 at that run,
          - latest 50,000 records persisted through a dedicated real-incident canonical contract.
          No fake optimizer likelihood/cost/benefit fields were invented.

          ### Real underground mine telemetry
          A dedicated `mining_telemetry` canonical contract was added for real sensor streams instead of coercing telemetry into the intervention-risk contract.

          Qualified longwall corpus:
          - Mendeley Data `yd7vw4c5mk`, DOI `10.17632/yd7vw4c5mk.1`, CC BY 4.0.
          - 9,199,930 one-second rows.
          - 28 sensor/operational channels.
          - zero parse failures.
          - 1,000,000 records durably ingested in 1,000 signed batches.
          - exact replay, audit and signature checks passed.
          - `F_SIDE` is preserved as non-numeric operational state.
          - real numeric outliers are preserved instead of silently clipped.

          ## Current active frontier: methane forecasting

          The project moved beyond ingestion into a leakage-safe real-mine forecasting benchmark using the same qualified longwall source.

          The current benchmark deliberately fails closed. At the frozen head, the latest four-fold rolling backtest did not meet the gate:
          - median recall 0.8968409598533875 (target >= 0.90),
          - median precision 0.05242017983047713 (target >= 0.10),
          - median F2 0.21223930547348396,
          - baseline median F2 0.29807984913409546,
          - 0/4 folds passed, 3/4 required.

          Historical development showed strong ranking discrimination in some folds, but threshold/policy transfer under methane-regime drift is the bottleneck. Do not reinterpret or hide this failure.

          ### Required next engineering behavior
          1. Re-read live branch/PR/CI state first.
          2. Inspect the latest `benchmarks/mining_adapter/methane_backtest.py`, runner, tests and failed artifact.
          3. Preserve the published 600-second history and 180–360 second future label.
          4. Preserve temporal leakage checks.
          5. Never use unresolved future labels for threshold/model adaptation.
          6. Never allow the learned model to suppress an observed hard methane >= 1.0 warning.
          7. Improve model/policy/feature regime handling without weakening:
             - test recall >= 0.90,
             - test precision >= 0.10,
             - F2 >= baseline F2 * 1.05,
             - at least 3/4 passing rolling folds.
          8. Run the same real-corpus backtest and report the actual result.
          9. If it still fails, keep it red and preserve the evidence.

          ## Evidence and claims discipline

          Evidence artifacts are bundled under `EVIDENCE/` and indexed in `HANDOFF/EVIDENCE_INDEX.json`.

          Current defensible scope:
          - strong Connect software qualification,
          - optimized durable MQTT path,
          - industrial load/fault-soak evidence,
          - real public mining incident ingestion,
          - real public underground-mine telemetry ingestion.

          Not yet defensible:
          - mine-safety certification,
          - customer-mine deployment evidence,
          - proven economic intervention value,
          - product-wide superiority over HighByte/Azure/EMQX,
          - qualified methane predictive signal while the rolling backtest remains red.

          HighByte Intelligence Hub and Azure IoT Operations remain blocked until legitimate licensed same-workload environments are available. Never fabricate these results or accept license/EULA terms on the user's behalf.

          ## Production / repository safety

          Do not merge PR #9.
          Do not move sealed main.
          Do not redeploy production.
          Do not enable production Axiom merely because infrastructure gates are green.
          Do not modify custom-domain/Cloudflare security without explicit scope.
          EOF

          cat > handoff-root/HANDOFF/EXACT_NEW_CHAT_COMMAND.txt <<'EOF'
          @MUSITU Axiom — Continue MUSITU Connect from the authoritative continuation package in my connected Google Drive named "MUSITU_CONNECT_CLEAN_WHOLE_PRODUCT_CONTINUATION_HANDOFF_20261008_CBA0A3B_AUTHORITATIVE.zip".

          First locate and read the package, then read HANDOFF/00_READ_FIRST.md, HANDOFF/STATE.json, HANDOFF/CONTINUATION.md, HANDOFF/EVIDENCE_INDEX.json, HANDOFF/PACKAGE_MANIFEST.json, and HANDOFF/MANIFEST.sha256 before doing anything else. Treat GitHub repo "evansmusitu/mft-axiom-build", branch "feat/musitu-connect-frontier", PR #9, packaged head "cba0a3b1c29d7607c0668d8e4a5a1399152dd932", and sealed main "d6a846f6bbe0bccac1758713eb4de167caf07113" as the continuation baseline, but immediately re-read the live PR/head/CI state before modifying it because it may have advanced after packaging.

          Preserve the architecture and safety boundaries: MUSITU Connect is the general-purpose enterprise interoperability/runtime platform; Mining is the first adapter; Axiom is downstream intelligence and must not become the integration layer. Do not merge PR #9, move sealed main, redeploy production, weaken Cloudflare/Axiom security, expose credentials, or enable production Axiom integration unless I explicitly authorize it.

          The active frontier at package freeze is the real-mine methane forecasting backtest. Normal Connect qualification, infrastructure qualification and Brand Guard were green, but methane backtest run 37728089126 was intentionally red: gate REAL_MINE_METHANE_BACKTEST_FAILED, 9,199,930 source rows, 306,601 eligible examples, median recall 0.8968409598533875, median precision 0.05242017983047713, median F2 0.21223930547348396 versus persistence baseline median F2 0.29807984913409546, with 0/4 folds passing and 3/4 required. Do not lower the gate to make CI green.

          Continue the engineering directly from live state. Preserve the published task geometry and leakage controls: 600-second history, methane threshold >=1.0 on MM263/MM264/MM256 predicted 180–360 seconds ahead, chronological/purged folds, online adaptation only from fully resolved labels, and the hard observed-methane warning rule must never be suppressed by the learned model. Improve the predictive model/policy/features until the existing strict gate passes honestly, or keep the gate red and report the measured blocker if it does not. Keep HighByte/Azure qualification blocked until legitimate licensed environments exist.
          EOF

          python - <<'PY'
          import json
