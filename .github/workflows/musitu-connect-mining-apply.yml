name: MUSITU Connect Mining Adapter source apply

on:
  push:
    branches: ['feat/musitu-connect-frontier']
    paths: ['.github/workflows/musitu-connect-mining-apply.yml']

permissions:
  contents: write

concurrency:
  group: musitu-connect-mining-source-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/musitu-connect-frontier

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify expected lineage and reconstruct tested bundle
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d918e56e9a305f6509bbe07b3404ed392aba8839 HEAD
          cat .musitu-apply/chunk-*.b64 | tr -d '\n' | base64 -d > /tmp/musitu-connect-mining-changes.tar.gz
          echo '82ce929258fef759d9ed019ed7d8574ee7c3873e5b3289c8cf1c968ea33c9b95  /tmp/musitu-connect-mining-changes.tar.gz' | sha256sum -c -
          tar -tzf /tmp/musitu-connect-mining-changes.tar.gz
          tar -xzf /tmp/musitu-connect-mining-changes.tar.gz -C "$GITHUB_WORKSPACE"
          rm -rf .musitu-apply
          rm -f .github/workflows/musitu-connect-mining-apply.yml
          git add -A
          git diff --cached --check

      - name: Verify reconstructed source before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q connect qualification benchmarks/mining_adapter infra/qualification
          python -m pip install --disable-pip-version-check scipy==1.18.1
          python -m unittest discover -s tests/connect -p 'test_*.py' -v
          node --test tests/connect/test_production_worker.mjs

      - name: Commit verified Mining Adapter source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Build production-complete Mining Adapter qualification'
          git push origin HEAD:feat/musitu-connect-frontier
