name: MUSITU Connect Neon synthetic admission qualification

on:
  push:
    branches: ['feat/musitu-connect-frontier']
    paths:
      - '.github/workflows/musitu-connect-neon-synthetic-qualification.yml'
      - 'connect/customer_neon_admission.mjs'
      - 'tests/connect/test_customer_neon_admission.mjs'
      - 'infra/connect_customer_neon_qualification.sql'
      - 'qualification/neon_pg_contract_test.py'
      - 'qualification/neon_role_attestation.py'
      - 'tests/connect/test_neon_role_attestation.py'
      - 'tests/connect/test_neon_pg_adapter_integration.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and fail-closed adapter behavior
        run: |
          node --check connect/customer_neon_admission.mjs
          node --test tests/connect/test_customer_neon_admission.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed Neon effective role attestation unit tests
        run: python -m unittest discover -s tests/connect -p 'test_neon_role_attestation.py' -v
      - name: PostgreSQL 17 least-privilege, concurrency, revocation and UUID evidence
        env:
          NEON_TEST_PG_DSN: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/postgres
        run: |
          python -m pip install 'psycopg[binary]==3.2.6'
          python qualification/neon_pg_contract_test.py
      - name: Real Node adapter to restricted PostgreSQL login (synthetic CI)
        env:
          NEON_TEST_PG_DSN: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/postgres
        run: |
          npm install --no-save --package-lock=false --ignore-scripts pg@8.16.3
          node --test tests/connect/test_neon_pg_adapter_integration.mjs
      - name: Confirm prototype remains out of live Worker imports
        run: |
          if grep -Fq "customer_neon_admission" connect/production_worker.mjs; then
            echo "NEON_RUNTIME_WIRING_UNAUTHORIZED" >&2
            exit 1
          fi
          echo "NEON_PROTOTYPE_ONLY=PASS"
