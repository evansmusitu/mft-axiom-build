name: MUSITU Connect operational admission rehearsal

on:
  workflow_dispatch:
  push:
    branches: ['feat/musitu-connect-frontier']
    paths:
      - 'qualification/connect_admission_canary_worker.mjs'
      - 'qualification/operational_admission_rehearsal.py'
      - '.github/workflows/musitu-connect-operational-admission.yml'

permissions:
  contents: read

concurrency:
  group: musitu-connect-operational-admission
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate rehearsal sources
        run: |
          python -m py_compile qualification/operational_admission_rehearsal.py
          node --check qualification/connect_admission_canary_worker.mjs
      - name: Install pinned Wrangler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/musitu-connect-wrangler
          npm install --prefix /tmp/musitu-connect-wrangler --ignore-scripts --no-audit --no-fund wrangler@4.129.0
          /tmp/musitu-connect-wrangler/node_modules/.bin/wrangler --version
      - name: Run isolated operational rehearsal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          WRANGLER_BIN: /tmp/musitu-connect-wrangler/node_modules/.bin/wrangler
        run: python qualification/operational_admission_rehearsal.py
      - name: Publish operational rehearsal evidence
        if: success()
        shell: bash
        run: |
          {
            echo '## MUSITU Connect operational admission rehearsal'
            echo
            echo 'Evidence SHA-256:'
            cat musitu-connect-operational-canary-rehearsal.sha256
            echo
            echo '```json'
            cat musitu-connect-operational-canary-rehearsal.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sealed operational rehearsal evidence
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: musitu-connect-operational-canary-rehearsal
          path: |
            musitu-connect-operational-canary-rehearsal.json
            musitu-connect-operational-canary-rehearsal.sha256
          retention-days: 30
          if-no-files-found: error
