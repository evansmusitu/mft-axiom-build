name: MUSITU Connect service entitlement bootstrap

on:
  push:
    branches: ['feat/musitu-connect-frontier']
    paths:
      - '.github/workflows/musitu-connect-service-entitlement-bootstrap.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      D1_UUID: 504029cc-f9a5-495e-818f-63c6144b4ea4
      SERVICE_EMAIL: musitu-connect@mftintelligence.com
      SERVICE_NAME: MUSITU Connect Production Service
      KEY_LABEL: musitu-connect-production
      QUOTA_UNITS: '100'
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded internal service quota
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MUSITU_CONNECT_AXIOM_ACCOUNT_KEY: ${{ secrets.MUSITU_CONNECT_AXIOM_ACCOUNT_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,urllib.error,urllib.request
          api=os.environ['CF_API'].rstrip('/'); aid=os.environ['ACCOUNT_ID']; dbid=os.environ['D1_UUID']
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip(); key=os.environ['MUSITU_CONNECT_AXIOM_ACCOUNT_KEY'].strip()
          if not token or not key: raise SystemExit('FAIL_CLOSED_MISSING_SECRET')
          print('::add-mask::'+key)
          def q(sql,params=None):
              obj={'sql':sql}
              if params is not None: obj['params']=params
              req=urllib.request.Request(f'{api}/accounts/{aid}/d1/database/{dbid}/query',method='POST',headers={'Authorization':'Bearer '+token,'Accept':'application/json','Content-Type':'application/json','User-Agent':'MUSITU-Connect-Service-Entitlement/1.0'},data=json.dumps(obj,separators=(',',':')).encode())
              try:
                  with urllib.request.urlopen(req,timeout=40) as r: raw=r.read(); code=r.status
              except urllib.error.HTTPError as e: raw=e.read(); code=e.code
              if code!=200: raise RuntimeError('D1_HTTP_'+str(code))
              out=json.loads(raw or b'{}'); batches=out.get('result') or []
              if not batches or not all(x.get('success') is True for x in batches): raise RuntimeError('D1_FAILED')
              rows=[]
              for b in batches: rows.extend(b.get('results') or [])
              return rows
          digest=hashlib.sha256(key.encode()).hexdigest()
          rows=q("SELECT c.id,c.email,c.name,c.plan,c.status,c.monthly_unit_override,k.label,k.status AS key_status,k.revoked_at,k.expires_at FROM api_keys k JOIN customers c ON c.id=k.customer_id WHERE k.key_hash=?1",[digest])
          if len(rows)!=1: raise RuntimeError('SERVICE_IDENTITY_MATCH_COUNT')
          r=rows[0]
          if r.get('email')!=os.environ['SERVICE_EMAIL'] or r.get('name')!=os.environ['SERVICE_NAME'] or r.get('plan')!='developer' or r.get('status')!='active' or r.get('label')!=os.environ['KEY_LABEL'] or r.get('key_status')!='active' or r.get('revoked_at') is not None:
              raise RuntimeError('SERVICE_IDENTITY_CONTRACT_MISMATCH')
          current=int(r.get('monthly_unit_override') or 0); target=int(os.environ['QUOTA_UNITS'])
          if current not in (0,target): raise RuntimeError('UNEXPECTED_EXISTING_QUOTA')
          if current==0:
              q("UPDATE customers SET monthly_unit_override=?2,updated_at=datetime('now') WHERE id=?1 AND status='active' AND plan='developer' AND (monthly_unit_override IS NULL OR monthly_unit_override=0)",[r['id'],target])
          check=q('SELECT monthly_unit_override FROM customers WHERE id=?1',[r['id']])
          if len(check)!=1 or int(check[0].get('monthly_unit_override') or 0)!=target: raise RuntimeError('QUOTA_READBACK_FAILED')
          print('MUSITU_CONNECT_SERVICE_QUOTA=100')
          print('MUSITU_CONNECT_SERVICE_ENTITLEMENT_BOOTSTRAP=PASS')
          PY
