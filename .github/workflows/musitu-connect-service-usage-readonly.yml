name: MUSITU Connect service usage readonly

on:
  push:
    branches: ['feat/musitu-connect-frontier']
    paths:
      - '.github/workflows/musitu-connect-service-usage-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      D1_UUID: 504029cc-f9a5-495e-818f-63c6144b4ea4
    steps:
      - name: Read dedicated service usage without mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MUSITU_CONNECT_AXIOM_ACCOUNT_KEY: ${{ secrets.MUSITU_CONNECT_AXIOM_ACCOUNT_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,urllib.request,urllib.error
          base=os.environ['CF_API'].rstrip('/'); aid=os.environ['ACCOUNT_ID']; db=os.environ['D1_UUID']
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip(); key=os.environ['MUSITU_CONNECT_AXIOM_ACCOUNT_KEY'].strip()
          if not token or not key: raise SystemExit('FAIL_CLOSED_MISSING_SECRET')
          print('::add-mask::'+key)
          def q(sql,params=None):
              payload={'sql':sql}
              if params is not None: payload['params']=params
              req=urllib.request.Request(f'{base}/accounts/{aid}/d1/database/{db}/query',method='POST',headers={'Authorization':'Bearer '+token,'Accept':'application/json','Content-Type':'application/json','User-Agent':'MUSITU-Connect-Usage-Readonly/1.0'},data=json.dumps(payload,separators=(',',':')).encode())
              try:
                  with urllib.request.urlopen(req,timeout=40) as r: raw=r.read(); code=r.status
              except urllib.error.HTTPError as e: raw=e.read(); code=e.code
              if code!=200: raise RuntimeError('D1_HTTP_'+str(code))
              obj=json.loads(raw or b'{}'); batches=obj.get('result') or []
              if not batches or not all(x.get('success') is True for x in batches): raise RuntimeError('D1_FAILED')
              rows=[]
              for b in batches: rows.extend(b.get('results') or [])
              return rows
          digest=hashlib.sha256(key.encode()).hexdigest()
          identity=q('SELECT c.id,c.monthly_unit_override FROM api_keys k JOIN customers c ON c.id=k.customer_id WHERE k.key_hash=?1 AND k.status=\'active\' AND c.status=\'active\'',[digest])
          if len(identity)!=1: raise RuntimeError('IDENTITY_MATCH_COUNT')
          cid=identity[0]['id']; quota=int(identity[0].get('monthly_unit_override') or 0)
          tables={r['name'] for r in q("SELECT name FROM sqlite_master WHERE type='table'")}
          event_cols=[r['name'] for r in q('PRAGMA table_info(usage_events)')] if 'usage_events' in tables else []
          total=q('SELECT count(*) AS n,COALESCE(sum(compute_units),0) AS units FROM usage_events WHERE customer_id=?1',[cid])[0] if 'usage_events' in tables else {'n':0,'units':0}
          bucket_cols=[r['name'] for r in q('PRAGMA table_info(usage_buckets)')] if 'usage_buckets' in tables else []
          bucket_rows=q('SELECT * FROM usage_buckets WHERE customer_id=?1 ORDER BY rowid DESC LIMIT 3',[cid]) if 'usage_buckets' in tables and 'customer_id' in bucket_cols else []
          safe_buckets=[]
          for row in bucket_rows:
              safe={k:v for k,v in row.items() if k not in {'customer_id','id','key_id'}}
              safe_buckets.append(safe)
          out={'gate':'MUSITU_CONNECT_SERVICE_USAGE_READONLY_PASS','monthly_unit_override':quota,'usage_event_count_total':int(total.get('n') or 0),'usage_compute_units_total':int(total.get('units') or 0),'usage_event_columns':event_cols,'usage_bucket_columns':bucket_cols,'recent_usage_buckets':safe_buckets,'write_performed':False}
          print('MUSITU_CONNECT_SERVICE_USAGE='+json.dumps(out,sort_keys=True))
          PY
