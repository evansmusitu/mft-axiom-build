name: MUSITU Connect qualification
on:
  push:
    branches: ['feat/musitu-connect-frontier']
  pull_request:
    branches: ['main']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Connect tests
        run: python -m unittest discover -s tests/connect -p 'test_*.py' -v
