name: MUSITU Control Secret Candidate Probe

on:
  workflow_dispatch:
  push:
    branches: ['feat/musitu-connect-frontier']
    paths:
      - '.github/workflows/musitu-control-secret-candidate-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      AXIOM_ADMIN_BASE: https://axiom.mftintelligence.com
    steps:
      - name: Probe remembered control secret without mutation
        env:
          CANDIDATE: ${{ secrets.MUSITU_CONTROL_SECRET_CANDIDATE_PROBE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CANDIDATE:-}" ]; then
            echo 'MUSITU_CONTROL_SECRET_CANDIDATE_PROBE is not configured.' >> "$GITHUB_STEP_SUMMARY"
            exit 10
          fi
          echo "::add-mask::$CANDIDATE"
          python - <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.request

          url = os.environ["AXIOM_ADMIN_BASE"].rstrip("/") + "/v1/admin/customers"
          secret = os.environ["CANDIDATE"]
          request = urllib.request.Request(
              url,
              data=b"{}",
              method="POST",
              headers={
                  "x-musitu-control": secret,
                  "x-musitu-axiom-version": "3.0.0",
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "User-Agent": "MUSITU-Control-Secret-Candidate-Probe/1.0",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
                  response.read()
          except urllib.error.HTTPError as exc:
              status = exc.code
              exc.read()

          summary = os.environ["GITHUB_STEP_SUMMARY"]
          if status in (400, 422):
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## MUSITU control-secret candidate probe\n\n")
                  handle.write("**Result: ACCEPTED**\n\n")
                  handle.write(f"Authenticated admin validation reached (HTTP {status}). No provisioning request was supplied.\n")
              print(f"MUSITU_CONTROL_SECRET_CANDIDATE=ACCEPTED HTTP={status}")
              raise SystemExit(0)

          if status in (401, 403):
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## MUSITU control-secret candidate probe\n\n")
                  handle.write("**Result: REJECTED**\n\n")
                  handle.write(f"The candidate was not accepted by the admin endpoint (HTTP {status}).\n")
              print(f"MUSITU_CONTROL_SECRET_CANDIDATE=REJECTED HTTP={status}")
              raise SystemExit(2)

          with open(summary, "a", encoding="utf-8") as handle:
              handle.write("## MUSITU control-secret candidate probe\n\n")
              handle.write("**Result: INDETERMINATE — FAIL CLOSED**\n\n")
              handle.write(f"Unexpected HTTP status {status}; no credential conclusion was made.\n")
          print(f"MUSITU_CONTROL_SECRET_CANDIDATE=INDETERMINATE HTTP={status}")
          raise SystemExit(3)
          PY
