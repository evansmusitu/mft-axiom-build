name: MUSITU Corporate Cloudflare Access Readback (No Writes)

on:
  push:
    branches: [ops/corporate-cf-readonly-20261106]

permissions:
  contents: read

concurrency:
  group: musitu-corporate-cf-readonly
  cancel-in-progress: false

jobs:
  cloudflare-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
    steps:
      - name: Identify Cloudflare GET authentication and resource permissions
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,json,os
          email=os.environ.get('CF_EMAIL','')
          key=os.environ.get('CF_KEY','')
          assert email and key,'GitHub secret pair is absent'
          print('Scoped Cloudflare legacy credentials available: true')
          headers={'X-Auth-Email':email,'X-Auth-Key':key,'Accept':'application/json','User-Agent':'MUSITU-Corporate-ReadOnly-Preflight/1.0'}
          base='https://api.cloudflare.com/client/v4'
          def probe(label,path):
            request=urllib.request.Request(base+path,headers=headers,method='GET')
            try:
              with urllib.request.urlopen(request,timeout=18) as r:
                data=json.loads(r.read(300000))
                status=r.status
            except urllib.error.HTTPError as e:
              status=e.code
              try:data=json.loads(e.read(300000))
              except Exception:data={}
            except Exception as e:
              print(label,'network_error_class',type(e).__name__)
              return None
            errors=data.get('errors') or []
            print(label,'http_status',status,'cloudflare_success',data.get('success') is True,
                  'error_codes',[str(x.get('code')) for x in errors][:3])
            return data if status==200 and data.get('success') else None
          auth=probe('account_user','/user')
          acct='93f395f5121954671f92fffa453d6b61'
          a=probe('known_account','/accounts/'+acct)
          projects=probe('pages_projects','/accounts/'+acct+'/pages/projects?per_page=50')
          if projects:
            ps=[x for x in projects.get('result',[]) if x.get('name')=='musitu-corporate']
            print('exact_corporate_pages_project_accessible',len(ps)==1)
            if ps:
              print('known_pages_production_branch',ps[0].get('production_branch'))
              print('corporate_project_domain_present',any(x in ('mftintelligence.com','www.mftintelligence.com') for x in (ps[0].get('domains') or [])))
          zones=probe('corporate_zone','/zones?name=mftintelligence.com&per_page=5')
          if zones:
            zz=[z for z in zones.get('result',[]) if z.get('name')=='mftintelligence.com']
            print('exact_corporate_zone_accessible',len(zz)==1)
            if len(zz)==1:
              zid=zz[0]['id']
              m=probe('corporate_mx','/zones/'+zid+'/dns_records?type=MX&name=mftintelligence.com')
              if m:print('visible_mx_count',len(m.get('result') or []))
              d=probe('corporate_dmarc','/zones/'+zid+'/dns_records?type=TXT&name=_dmarc.mftintelligence.com')
              if d:print('visible_dmarc_count',len(d.get('result') or []))
          print('Strictly read-only preflight complete.')
          PY
      - name: Check whether a separately scoped API token is available (read only)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,urllib.request,urllib.error,json
          t=os.environ.get('CF_TOKEN','')
          print('Additional Cloudflare API token secret present:',bool(t))
          if not t:raise SystemExit(0)
          h={'Authorization':'Bearer '+t,'Accept':'application/json'}
          for label,path in [('verify','/user/tokens/verify'),('pages','/accounts/93f395f5121954671f92fffa453d6b61/pages/projects'),('zones','/zones?name=mftintelligence.com')]:
            req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,method='GET',headers=h)
            try:
              with urllib.request.urlopen(req,timeout=18) as r:d=json.loads(r.read(200000));status=r.status
            except urllib.error.HTTPError as e:
              status=e.code
              try:d=json.loads(e.read(200000))
              except Exception:d={}
            print('Scoped token '+label+' GET status:',status,'success:',bool(d.get('success')),'codes:',[x.get('code') for x in d.get('errors',[])][:3])
            if label=='pages' and d.get('success'):
              print('Exact corporate Pages project visible:',any(p.get('name')=='musitu-corporate' for p in d.get('result') or []))
            if label=='zones' and d.get('success'):
              print('Exact corporate zone visible:',any(z.get('name')=='mftintelligence.com' for z in d.get('result') or []))
          print('No writes and no credential contents disclosed.')
          PY
      - name: Confirm precise production Pages and DNS rollback baseline (read only)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          token=os.environ['CF_TOKEN']; aid='93f395f5121954671f92fffa453d6b61'
          assert token,'Token absent'
          h={'Authorization':'Bearer '+token,'Accept':'application/json'}
          base='https://api.cloudflare.com/client/v4'
          def get(path):
            req=urllib.request.Request(base+path,method='GET',headers=h)
            try:
              with urllib.request.urlopen(req,timeout=20) as r:d=json.loads(r.read(250000))
            except urllib.error.HTTPError as e:
              raise SystemExit('API GET blocked '+path.split('?')[0]+' HTTP '+str(e.code))
            if not d.get('success'):raise SystemExit('API GET rejected '+path.split('?')[0])
            return d['result']
          p=get('/accounts/'+aid+'/pages/projects/musitu-corporate')
          assert p.get('name')=='musitu-corporate'
          print('Pages project name confirmed:',p.get('name'))
          print('Pages origin source type:',(p.get('source') or {}).get('type') or 'direct-upload')
          print('Pages production branch:',p.get('production_branch'))
          print('Corporate custom domain mapping:',sorted(x for x in p.get('domains',[]) if 'mftintelligence.com' in x))
          deployments=get('/accounts/'+aid+'/pages/projects/musitu-corporate/deployments?per_page=100')
          prod=[d for d in deployments if d.get('environment')=='production']
          good=[d for d in prod if (d.get('latest_stage') or {}).get('status')=='success']
          print('Recent successful production rollback candidates:',len(good))
          if good:
            print('Last successful production deployment id:',good[0].get('id'))
            print('Last successful production deployment created:',good[0].get('created_on'))
            print('Last successful production deployment branch:',(good[0].get('deployment_trigger') or {}).get('metadata',{}).get('branch') or 'unknown')
          zones=get('/zones?name=mftintelligence.com&per_page=10')
          found=[z for z in zones if z.get('name')=='mftintelligence.com']
          assert len(found)==1
          zone=found[0]
          print('Verified exact corporate zone account ownership:',(zone.get('account') or {}).get('id')==aid)
          assert (zone.get('account') or {}).get('id')==aid
          zid=zone['id']
          mx=get('/zones/'+zid+'/dns_records?type=MX&name=mftintelligence.com')
          assert len(mx)==3 and all(str(x.get('content','')).endswith('cloudflare.net') for x in mx),'MX baseline unexpected'
          print('Protected inbound MX records:',len(mx))
          txt=get('/zones/'+zid+'/dns_records?type=TXT&per_page=100')
          print('Present root SPF count:',sum(x.get('name')=='mftintelligence.com' and str(x.get('content','')).startswith('v=spf1') for x in txt))
          print('Present Resend DKIM count:',sum(x.get('name')=='resend._domainkey.mftintelligence.com' for x in txt))
          print('Present DMARC count:',sum(x.get('name')=='_dmarc.mftintelligence.com' for x in txt))
          print('Confirmed no Pages or DNS writes.')
          PY
