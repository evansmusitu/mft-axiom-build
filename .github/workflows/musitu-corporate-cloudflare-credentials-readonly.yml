name: MUSITU Corporate Cloudflare Access Readback (No Writes)

on:
  push:
    branches: [ops/corporate-cf-readonly-20261106]

permissions:
  contents: read

concurrency:
  group: musitu-corporate-cf-readonly
  cancel-in-progress: false

jobs:
  cloudflare-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
    steps:
      - name: Confirm exact corporate zone, Pages project, and DMARC status without any writes
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,json,os
          email=os.environ.get('CF_EMAIL','')
          key=os.environ.get('CF_KEY','')
          print('Cloudflare credential pair available:',bool(email and key))
          if not (email and key):raise SystemExit('MISSING_CREDENTIALS')
          def get(path):
            headers={'X-Auth-Email':email,'X-Auth-Key':key,'Accept':'application/json'}
            req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,headers=headers,method='GET')
            try:
              with urllib.request.urlopen(req,timeout=20) as r: d=json.loads(r.read())
            except urllib.error.HTTPError as e:
              raise SystemExit('Cloudflare GET blocked at '+path.split('?')[0]+' status '+str(e.code))
            if not d.get('success'):raise SystemExit('Cloudflare API returned non-success for '+path.split('?')[0])
            return d['result']
          zones=get('/zones?name=mftintelligence.com&per_page=10')
          assert len([x for x in zones if x['name']=='mftintelligence.com'])==1,'Zone must be unique'
          zone=next(x for x in zones if x['name']=='mftintelligence.com')
          zid=zone['id'];acct=(zone.get('account') or {}).get('id')
          print('Exact zone accessible:',zone['name']=='mftintelligence.com')
          print('Zone active:',zone.get('status')=='active')
          print('Zone account matches existing MUSITU Cloudflare integration:',acct=='93f395f5121954671f92fffa453d6b61')
          assert acct=='93f395f5121954671f92fffa453d6b61','Refusing unexpected Cloudflare account'
          projects=get('/accounts/'+acct+'/pages/projects?per_page=100')
          ps=[x for x in projects if x.get('name')=='musitu-corporate']
          print('Exact corporate Pages project accessible:',len(ps)==1)
          assert len(ps)==1,'Refusing unknown Pages project'
          p=ps[0]
          print('Pages production branch:',p.get('production_branch') or 'none')
          print('Pages production domain present:',any(d in ('mftintelligence.com','www.mftintelligence.com') for d in (p.get('domains') or [])))
          deployments=get('/accounts/'+acct+'/pages/projects/musitu-corporate/deployments?per_page=5')
          print('Recent Pages deployment count:',len(deployments))
          print('Most recent Pages deployment status:',(deployments[0].get('latest_stage') or {}).get('status') if deployments else 'none')
          records=get('/zones/'+zid+'/dns_records?type=TXT&name=_dmarc.mftintelligence.com&per_page=10')
          print('Existing DMARC record count:',len(records))
          mx=get('/zones/'+zid+'/dns_records?type=MX&name=mftintelligence.com&per_page=100')
          print('Existing corporate MX record count:',len(mx))
          print('Cloudflare access readback complete: no DNS, Pages, account or other system writes.')
          PY
