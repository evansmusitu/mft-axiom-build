name: MUSITU Corporate Cloudflare Token-Only Read-Only Audit
on:
  push:
    branches:
      - 'audit/musitu-corporate-cloudflare-readonly-20261103'
    paths:
      - '.github/workflows/musitu-corporate-cloudflare-readonly.yml'
permissions: {}
concurrency:
  group: musitu-corporate-cf-readonly-probe
  cancel-in-progress: false
jobs:
  cloudflare-readonly:
    if: github.repository == 'evansmusitu/mft-axiom-build'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify intended Cloudflare zone, DNS and Pages without any writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.error,urllib.parse,urllib.request
          token=os.environ.get('CF_TOKEN') or ''
          if not token:
              raise SystemExit('Cloudflare API token secret unavailable')
          account='93f395f5121954671f92fffa453d6b61'
          zone='5b56528f03948ff5917a5e0cd9f7109e'
          allowed=['/zones?','/zones/'+zone+'/dns_records?','/accounts/'+account+'/pages/projects']
          base='https://api.cloudflare.com/client/v4'
          def read(path):
              if not any(path.startswith(p) for p in allowed):
                  raise SystemExit('Refused unapproved Cloudflare endpoint')
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+token,'Accept':'application/json'},method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status,json.load(r)
              except urllib.error.HTTPError as exc:
                  return exc.code,{}
              except Exception as exc:
                  raise SystemExit('Cloudflare read transport failed: '+type(exc).__name__)
          zcode,zbody=read('/zones?'+urllib.parse.urlencode({'name':'mftintelligence.com','status':'active'}))
          zs=zbody.get('result') or []
          assert zcode==200 and zbody.get('success') is True and len(zs)==1, 'Canonical Cloudflare zone check failed'
          info=zs[0]
          assert info.get('id')==zone and info.get('name')=='mftintelligence.com', 'Zone identity mismatch'
          assert (info.get('account') or {}).get('id')==account, 'Account identity mismatch'
          print('cloudflare_account_and_zone: VERIFIED')
          # Production-hostname readiness: inventory only; do not create or mutate records.
          observed={}
          for name in ['mftintelligence.com','www.mftintelligence.com','corporate.mftintelligence.com']:
              dcode,dbody=read('/zones/'+zone+'/dns_records?'+urllib.parse.urlencode({'name':name,'per_page':100}))
              assert dcode==200 and dbody.get('success') is True, 'DNS read denied for '+name
              records=dbody.get('result') or []
              observed[name]=[{'type':r.get('type'),'name':r.get('name'),'proxied':r.get('proxied'),'content':r.get('content') if r.get('type') in ('A','AAAA','CNAME') else '<preserved>'} for r in records]
              print('dns_inventory_'+name.replace('.','_')+':',json.dumps(observed[name],sort_keys=True))
          # Fail if www/corporate already point somewhere unexpected; apex may legitimately carry mail-only records.
          for name in ['www.mftintelligence.com','corporate.mftintelligence.com']:
              web=[r for r in observed[name] if r.get('type') in ('A','AAAA','CNAME')]
              assert not web,'Unexpected existing web record collision at '+name
          apex_web=[r for r in observed['mftintelligence.com'] if r.get('type') in ('A','AAAA','CNAME')]
          print('apex_existing_web_records:',json.dumps(apex_web,sort_keys=True))
          pcode,pbody=read('/accounts/'+account+'/pages/projects')
          assert pcode==200 and pbody.get('success') is True, 'Cloudflare Pages account read denied'
          print('cloudflare_pages_read: VERIFIED')
          ccode,cbody=read('/accounts/'+account+'/pages/projects/musitu-corporate')
          assert ccode==200 and cbody.get('success') is True, 'Target Pages project missing or unreadable'
          project=cbody.get('result') or {}
          assert project.get('name')=='musitu-corporate' and project.get('production_branch')=='main'
          print('musitu_corporate_pages_project_exists: true')
          print('pages_current_domains:',json.dumps(sorted(project.get('domains') or [])))
          print('pages_production_branch:',project.get('production_branch'))
          print('production_hostname_cutover_ready_without_collision:',str(not apex_web).lower())
          print('cloudflare_write_operations: 0')
          print('global_api_key_binding: NONE')
          print('cloudflare_secret_values_output: NONE')
          PY
