name: MUSITU Corporate Cloudflare Read-Only Access Probe
on:
  push:
    branches:
      - 'audit/musitu-corporate-cloudflare-readonly-20261103'
    paths:
      - '.github/workflows/musitu-corporate-cloudflare-readonly.yml'
permissions: {}
concurrency:
  group: musitu-corporate-cf-readonly-probe
  cancel-in-progress: false
jobs:
  cloudflare-readonly:
    if: github.repository == 'evansmusitu/mft-axiom-build'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_GLOBAL_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Validate supported auth modes with GET-only requests, without outputting credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.error, urllib.parse, urllib.request
          z_id='5b56528f03948ff5917a5e0cd9f7109e'
          a_id='93f395f5121954671f92fffa453d6b61'
          base='https://api.cloudflare.com/client/v4'
          email=os.environ.get('CF_EMAIL') or ''
          key=os.environ.get('CF_GLOBAL_KEY') or ''
          token=os.environ.get('CF_TOKEN') or ''
          print('cloudflare_secret_presence:', json.dumps({'global_pair':bool(email and key),'api_token':bool(token)},sort_keys=True))
          def get(path,headers):
              if not (path.startswith('/zones?') or path.startswith('/zones/'+z_id+'/dns_records?') or path.startswith('/accounts/'+a_id+'/pages/projects') or path in ('/user','/user/tokens/verify')):
                  raise SystemExit('Refused API path outside read-only allowlist')
              req=urllib.request.Request(base+path,headers={**headers,'Accept':'application/json','User-Agent':'MUSITU-Corporate-ReadOnly/2.0'},method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      status=r.status
                      data=json.load(r)
              except urllib.error.HTTPError as exc:
                  try:
                      problem=json.load(exc)
                      codes=[str(e.get('code')) for e in (problem.get('errors') or []) if isinstance(e,dict) and isinstance(e.get('code'),int)]
                  except Exception:
                      codes=[]
                  return exc.code,{'error_codes':codes}
              except Exception as exc:
                  print('transport_exception_type:',type(exc).__name__)
                  return 0,{}
              if data.get('success') is not True:
                  return status,{}
              return status,data
          modes=[]
          if token: modes.append(('api_token',{'Authorization':'Bearer '+token},'/user/tokens/verify'))
          if email and key: modes.append(('global_key',{'X-Auth-Email':email,'X-Auth-Key':key},'/user'))
          verified=False
          for label,headers,verify_path in modes:
              s_verify,d_verify=get(verify_path,headers)
              s_zone,d_zone=get('/zones?'+urllib.parse.urlencode({'name':'mftintelligence.com','status':'active'}),headers)
              zs=(d_zone.get('result') or []) if s_zone==200 else []
              target=[z for z in zs if z.get('id')==z_id and z.get('name')=='mftintelligence.com' and (z.get('account') or {}).get('id')==a_id]
              if len(target)==1:
                  q=urllib.parse.urlencode({'name':'corporate.mftintelligence.com','per_page':100})
                  s_dns,d_dns=get('/zones/'+z_id+'/dns_records?'+q,headers)
                  print(label+'_dns_read_http:',s_dns)
                  if s_dns==200:
                      print(label+'_corporate_dns_record_count:',len(d_dns.get('result') or []))
              s_pages,d_pages=get('/accounts/'+a_id+'/pages/projects',headers)
              print(label+'_status:',json.dumps({'credential_check_http':s_verify,'zone_list_http':s_zone,'zone_verified':len(target)==1,'pages_list_http':s_pages,'pages_api_verified':s_pages==200,'pages_error_codes':d_pages.get('error_codes',[])},sort_keys=True))
              if len(target)==1 and s_pages==200:
                  q=urllib.parse.urlencode({'name':'corporate.mftintelligence.com','per_page':100})
                  s_dns,d_dns=get('/zones/'+z_id+'/dns_records?'+q,headers)
                  print(label+'_corporate_dns:',json.dumps({'http':s_dns,'record_count':len(d_dns.get('result') or []) if s_dns==200 else None}))
                  projects=d_pages.get('result') or []
                  print(label+'_target_pages_project_exists:',any(p.get('name')=='musitu-corporate' for p in projects))
                  verified=verified or s_dns==200
          print('cloudflare_mutations: NONE')
          if not verified:
              raise SystemExit('Cloudflare credential access not verified for required zone and Pages APIs')
          print('cloudflare_corporate_readonly_access: VERIFIED')
          PY
