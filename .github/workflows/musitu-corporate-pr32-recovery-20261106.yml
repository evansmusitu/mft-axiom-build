name: MUSITU PR32 Staging Backup and Rollback Rehearsal 20261106
on:
  push:
    branches:
      - 'audit/musitu-corporate-cloudflare-readonly-20261103'
    paths:
      - '.github/workflows/musitu-corporate-pr32-recovery-20261106.yml'
permissions:
  contents: read
concurrency:
  group: musitu-corporate-restricted-v4-stage
  cancel-in-progress: false
jobs:
  protected-preview:
    if: github.repository == 'evansmusitu/mft-axiom-build'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: "93f395f5121954671f92fffa453d6b61"
      CF_ZONE_ID: "5b56528f03948ff5917a5e0cd9f7109e"
      CF_PAGES_NAME: musitu-corporate
      CF_PREVIEW_BRANCH: corporate-private-20261103
      EXPECTED_ARCHIVE_SHA256: 3462413cbfa02f0d74319e9636b8a5cf6cd1d8253def14bc749741747a6dd724
      EXACT_PR32_SHA: ecb86b3165d494d1b18c740d2d43ab637be50650
      MEDIA_SOURCE_SHA: c3751047d714033585d20163709f10cef2ea3d2c
    steps:
      - name: Preflight verified Access gates and isolated Pages project
        id: access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.error,urllib.request
          token=os.environ.get('CLOUDFLARE_API_TOKEN') or ''
          assert token,'Cloudflare API token unavailable'
          account=os.environ['CF_ACCOUNT_ID']; project=os.environ['CF_PAGES_NAME']
          base='https://api.cloudflare.com/client/v4/accounts/'+account
          head={'Authorization':'Bearer '+token,'Accept':'application/json'}
          def get(p):
            assert p in ['/access/apps?per_page=100','/pages/projects/'+project],'Unapproved API request'
            req=urllib.request.Request(base+p,headers=head,method='GET')
            with urllib.request.urlopen(req,timeout=25) as r:
              assert r.status==200
              body=json.load(r)
            assert body.get('success') is True,'Cloudflare API result failed'
            return body
          proj=get('/pages/projects/'+project)['result']
          assert proj.get('name')==project and proj.get('production_branch')=='main','Pages identity/branch drift'
          apps=get('/access/apps?per_page=100')
          assert (apps.get('result_info') or {}).get('total_pages',1)==1,'Access inventory pagination not audited'
          for domain in [project+'.pages.dev','*.'+project+'.pages.dev']:
            matching=[a for a in (apps['result'] or []) if a.get('domain')==domain]
            assert len(matching)==1,'Missing or duplicate Access application for '+domain
            a=matching[0]
            assert a.get('type')=='self_hosted','Unexpected Access application type'
            policies=a.get('policies') or []
            assert policies,'Access application has no policies'
            assert all(p.get('decision')!='bypass' for p in policies if isinstance(p,dict)),'Access bypass exists'
            allow=[p for p in policies if isinstance(p,dict) and p.get('decision')=='allow']
            assert allow and any(
              any((item.get('cloudflare_account_member') or {}).get('account_id')==account
                  for item in (p.get('include') or []) if isinstance(item,dict))
              for p in allow),'Account-member allow policy not verified'
          print('corporate_access_base_and_preview: VERIFIED')
          print('corporate_pages_project: VERIFIED')
          print('cloudflare_production_branch_untouched:',proj.get('production_branch'))
          PY
      - name: Retrieve immutable reviewed historical baseline for reversible staging
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,hashlib,urllib.request,base64,io,tarfile,json
          sha=os.environ['GITHUB_SHA']
          url='https://raw.githubusercontent.com/evansmusitu/mft-axiom-build/'+sha+'/corporate/staging/musitu-corporate-v4-static.tar.xz.b64'
          req=urllib.request.Request(url,headers={'User-Agent':'MUSITU-Corporate-Staging/1.0'})
          with urllib.request.urlopen(req,timeout=35) as res:
            encoded=res.read()
          assert len(encoded)<100000,'Unexpected archive wrapper length'
          raw=base64.b64decode(encoded.strip(),validate=True)
          digest=hashlib.sha256(raw).hexdigest()
          assert digest==os.environ['EXPECTED_ARCHIVE_SHA256'],'Archive integrity mismatch'
          dest=Path(os.environ['RUNNER_TEMP'])/'musitu-corporate-v4'
          dest.mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:xz') as archive:
            members=archive.getmembers()
            names=set()
            assert len(members)==45,'Unexpected file count'
            for entry in members:
              name=entry.name
              p=Path(name)
              assert entry.isfile() and not p.is_absolute() and '..' not in p.parts and not name.startswith('.'),'Unsafe archive member'
              assert name not in names,'Duplicate archive member'
              names.add(name)
              out=dest/p
              out.parent.mkdir(parents=True,exist_ok=True)
              with archive.extractfile(entry) as inp:
                out.write_bytes(inp.read())
          manifest=json.loads((dest/'build-manifest.json').read_text())
          assert manifest.get('review_mode')=='NOINDEX_STAGING_ONLY','Unexpected release mode'
          asserted={row['path'] for row in manifest['files']}
          assert asserted==names-{'build-manifest.json'},'Manifest/file mismatch'
          for row in manifest['files']:
            data=(dest/row['path']).read_bytes()
            assert hashlib.sha256(data).hexdigest()==row['sha256'] and len(data)==row['bytes'],'Manifest hash/size mismatch'
          headers=(dest/'_headers').read_text().lower()
          robots=(dest/'robots.txt').read_text().lower()
          assert 'x-robots-tag: noindex' in headers and 'content-security-policy:' in headers,'Noindex/CSP header missing'
          assert 'disallow: /' in robots,'Staging robots file missing'
          for route in ['legal/privacy/index.html','legal/terms/index.html']:
            legal=(dest/route).read_text().lower()
            assert 'working draft' in legal and 'not approved' in legal,'Legal draft state drift: public publishing forbidden'
          assert len(list(dest.rglob('index.html')))==34,'34-route site requirement failed'
          print('verified_archive_sha256:',digest)
          print('staging_files_and_hashes: VERIFIED')
          print('staging_noindex_and_draft_disclosures: VERIFIED')
          print('public_release_authorized_by_archive: false')
          PY
      - name: Fetch exact immutable PR32 source, test and build NOINDEX
        id: exact
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pytest==8.4.2 beautifulsoup4==4.14.2
          mkdir -p "$RUNNER_TEMP/musitu-source"
          git -C "$RUNNER_TEMP/musitu-source" init -q
          git -C "$RUNNER_TEMP/musitu-source" remote add origin https://github.com/evansmusitu/evansmusitu.github.io.git
          git -C "$RUNNER_TEMP/musitu-source" fetch -q --depth=1 origin "$EXACT_PR32_SHA"
          git -C "$RUNNER_TEMP/musitu-source" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/musitu-source" rev-parse HEAD)" = "$EXACT_PR32_SHA"
          git -C "$RUNNER_TEMP/musitu-source" fetch -q --depth=1 origin "$MEDIA_SOURCE_SHA"
          git -C "$RUNNER_TEMP/musitu-source" show "$MEDIA_SOURCE_SHA:corporate/assets/studio-demo-82s.mp4" > "$RUNNER_TEMP/musitu-source/corporate/assets/studio-demo-82s.mp4"
          git -C "$RUNNER_TEMP/musitu-source" show "$MEDIA_SOURCE_SHA:corporate/assets/studio-poster.png" > "$RUNNER_TEMP/musitu-source/corporate/assets/studio-poster.png"
          printf '%s  %s\n' afd6dfd3c73668e544f3f8a857697fed0abaadccd4927202bb3a185612c2dea0 "$RUNNER_TEMP/musitu-source/corporate/assets/studio-demo-82s.mp4" | sha256sum -c -
          printf '%s  %s\n' 0ea5e961d916375029010dbae01bf8a1783e5fd6b90f74c006dc852df1c285d0 "$RUNNER_TEMP/musitu-source/corporate/assets/studio-poster.png" | sha256sum -c -
          cd "$RUNNER_TEMP/musitu-source/corporate"
          MUSITU_PROTECTED_STAGING_MEDIA=1 python3 scripts/build.py
          python3 -m pytest -q tests/test_site.py tests/test_http.py tests/test_sitemap.py tests/test_studio_and_store.py
          node --check assets/site.js
          python3 - <<'PY'
          import json,os,shutil
          from pathlib import Path
          site=Path(os.environ['RUNNER_TEMP'])/'musitu-source'/'corporate'/'dist'
          dest=Path(os.environ['RUNNER_TEMP'])/'musitu-corporate-pr32'
          manifest=json.loads((site/'manifest.json').read_text())
          assert manifest['route_count']==34 and manifest['production_approved'] is False
          assert manifest['protected_staging_media_included'] is True
          pages=list(site.rglob('index.html'))
          assert len(pages)==34 and all('noindex,nofollow' in p.read_text() for p in pages)
          privacy=(site/'legal/privacy/index.html').read_text().lower()
          terms=(site/'legal/terms/index.html').read_text().lower()
          assert 'support@mftintelligence.com' in privacy and 'working draft' not in privacy
          assert 'support@mftintelligence.com' in terms and 'working draft' not in terms
          axiom=(site/'products/axiom/index.html').read_text()
          assert 'chatgpt.com/plugins/plugin_asdk_app_6ae058ee6cec81919329ae43b76a4c86' in axiom
          assert (site/'assets/studio-demo-82s.mp4').is_file()
          assert (site/'assets/studio-poster.png').is_file()
          assert 'studio-demo-player' in (site/'products/foundry/studio/index.html').read_text()
          shutil.copytree(site,dest,dirs_exist_ok=True)
          # These response-level headers apply only on the Access-protected preview branch.
          (dest/'_headers').write_text(
           '/*\n'
           '  X-Robots-Tag: noindex, nofollow\n'
           '  X-Content-Type-Options: nosniff\n'
           '  Referrer-Policy: strict-origin-when-cross-origin\n'
           '  X-Frame-Options: DENY\n'
           '  Permissions-Policy: geolocation=(), camera=(), microphone=()\n'
           "  Content-Security-Policy: default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'\n"
           ,encoding='utf8')
          print('exact_pr32_source_commit:',os.environ['EXACT_PR32_SHA'])
          print('protected_review_routes:',len(pages))
          print('studio_owner_cleared_media_included:',True)
          print('production_hostname_writes: 0')
          PY
      - name: Install pinned Pages deploy CLI
        id: cli
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/musitu-wrangler" --ignore-scripts --no-audit --no-fund wrangler@4.129.0
          "$RUNNER_TEMP/musitu-wrangler/node_modules/.bin/wrangler" --version

      - name: Rehearse rollback to known historical approved NOINDEX preview
        id: rewind
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/musitu-wrangler/node_modules/.bin/wrangler" pages deploy "$RUNNER_TEMP/musitu-corporate-v4" --project-name "$CF_PAGES_NAME" --branch "$CF_PREVIEW_BRANCH" --commit-hash "7ae0f5427160dd528ab8f253f529cc5e7c41b11b"
          python3 - <<'PY'
          import urllib.request,urllib.error,time,os
          url='https://'+os.environ['CF_PREVIEW_BRANCH']+'.'+os.environ['CF_PAGES_NAME']+'.pages.dev/'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          op=urllib.request.build_opener(NoRedirect)
          for attempt in range(8):
            try:
              with op.open(urllib.request.Request(url),timeout=15) as response:status=response.status;loc=response.headers.get('Location','')
            except urllib.error.HTTPError as e:status=e.code;loc=e.headers.get('Location','')
            print('baseline_anonymous_probe_http_status:',status)
            if status in (301,302,303,307,308) and ('cloudflareaccess.com' in loc or '/cdn-cgi/access/' in loc):break
            if status in (401,403):break  # Access deny or equivalent fail-closed response; Access app was preflight-verified
            if status==200:raise SystemExit('FAIL CLOSED: staging lost Access after baseline rollback')
            time.sleep(3)
          else:raise SystemExit('Anonymous denial not verified after baseline rollback')
          print('staging_baseline_restored_under_access: PASS')
          PY
      - name: Restore exact PR32 candidate even if the rollback test fails
        id: restore
        if: ${{ always() && steps.access.outcome == 'success' && steps.exact.outcome == 'success' && steps.cli.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/musitu-wrangler/node_modules/.bin/wrangler" pages deploy "$RUNNER_TEMP/musitu-corporate-pr32" --project-name "$CF_PAGES_NAME" --branch "$CF_PREVIEW_BRANCH" --commit-hash "$EXACT_PR32_SHA"
          python3 - <<'PY'
          import os,urllib.request,urllib.error,time
          url='https://'+os.environ['CF_PREVIEW_BRANCH']+'.'+os.environ['CF_PAGES_NAME']+'.pages.dev/'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          op=urllib.request.build_opener(NoRedirect)
          for attempt in range(8):
            try:
              with op.open(urllib.request.Request(url),timeout=15) as response:status=response.status;loc=response.headers.get('Location','')
            except urllib.error.HTTPError as exc:status=exc.code;loc=exc.headers.get('Location','')
            print('restored_anonymous_probe_http_status:',status)
            if status in (301,302,303,307,308) and ('cloudflareaccess.com' in loc or '/cdn-cgi/access/' in loc):break
            if status in (401,403):break  # Access deny or equivalent fail-closed response; Access app was preflight-verified
            if status==200:raise SystemExit('FAIL CLOSED: current candidate was exposed')
            time.sleep(3)
          else:raise SystemExit('Restored candidate anonymous denial missing')
          print('exact_pr32_candidate_restored_under_access: PASS')
          print('restored_source_sha:',os.environ['EXACT_PR32_SHA'])
          print('production_dns_or_pages_main_writes: 0')
          print('public_release_authorized: false')
          PY
