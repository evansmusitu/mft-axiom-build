name: MUSITU Corporate Production Launch 20261106
on:
  push:
    branches:
      - audit/musitu-corporate-cloudflare-readonly-20261103
    paths:
      - .github/workflows/musitu-corporate-production-launch-20261106.yml
permissions:
  contents: read
concurrency:
  group: musitu-corporate-production-launch
  cancel-in-progress: true

jobs:
  launch:
    if: github.repository == 'evansmusitu/mft-axiom-build'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: "93f395f5121954671f92fffa453d6b61"
      CF_ZONE_ID: "5b56528f03948ff5917a5e0cd9f7109e"
      CF_PAGES_NAME: "musitu-corporate"
      RELEASE_SHA: "7e0fa23dad220e0e1b7e48a9176e3437b5afc545"
      MERGE_SHA: "bf70edf55b9d67402bbb1d8d0f1d72f14ed1ef86"
      MEDIA_SOURCE_SHA: "c3751047d714033585d20163709f10cef2ea3d2c"
      CANONICAL_ORIGIN: "https://mftintelligence.com"
      EXPECTED_PROD_TAR_SHA256: "49ae864ac4f8dd0d3d3651f03469b3ac4a2eb21a1518b847571da28f547fc79f"
      WWW_REDIRECT_LIST: "musitu_www_to_apex_20261106"
    steps:
      - name: Fetch exact merged source and approved media
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q pytest==8.4.2 beautifulsoup4==4.14.2
          mkdir -p "$RUNNER_TEMP/site"
          git -C "$RUNNER_TEMP/site" init -q
          git -C "$RUNNER_TEMP/site" remote add origin https://github.com/evansmusitu/evansmusitu.github.io.git
          git -C "$RUNNER_TEMP/site" fetch -q --depth=40 origin main "$RELEASE_SHA"
          test "$(git -C "$RUNNER_TEMP/site" rev-parse origin/main)" = "$MERGE_SHA"
          git -C "$RUNNER_TEMP/site" merge-base --is-ancestor "$RELEASE_SHA" "$MERGE_SHA"
          git -C "$RUNNER_TEMP/site" checkout -q --detach "$RELEASE_SHA"
          git -C "$RUNNER_TEMP/site" fetch -q --depth=1 origin "$MEDIA_SOURCE_SHA"
          git -C "$RUNNER_TEMP/site" show "$MEDIA_SOURCE_SHA:corporate/assets/studio-demo-82s.mp4" > "$RUNNER_TEMP/site/corporate/assets/studio-demo-82s.mp4"
          git -C "$RUNNER_TEMP/site" show "$MEDIA_SOURCE_SHA:corporate/assets/studio-poster.png" > "$RUNNER_TEMP/site/corporate/assets/studio-poster.png"
          printf '%s  %s\n' afd6dfd3c73668e544f3f8a857697fed0abaadccd4927202bb3a185612c2dea0 "$RUNNER_TEMP/site/corporate/assets/studio-demo-82s.mp4" | sha256sum -c -
          printf '%s  %s\n' 0ea5e961d916375029010dbae01bf8a1783e5fd6b90f74c006dc852df1c285d0 "$RUNNER_TEMP/site/corporate/assets/studio-poster.png" | sha256sum -c -
          cd "$RUNNER_TEMP/site/corporate"
          MUSITU_BUILD_MODE=production MUSITU_CANONICAL_ORIGIN="$CANONICAL_ORIGIN" MUSITU_INCLUDE_STUDIO_MEDIA=1 python3 scripts/build.py
          python3 -m pytest -q tests/test_production_build.py
          node --check assets/site.js
          tar --sort=name --mtime='UTC 2026-11-06' --owner=0 --group=0 --numeric-owner -cf "$RUNNER_TEMP/production.tar" dist
          actual="$(sha256sum "$RUNNER_TEMP/production.tar"|cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_PROD_TAR_SHA256"
          echo "production_artifact_sha256: $actual"

      - name: Preflight Cloudflare state and rollback permissions without writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.error,urllib.parse,urllib.request
          token=os.environ['CLOUDFLARE_API_TOKEN'];account=os.environ['CF_ACCOUNT_ID'];zone=os.environ['CF_ZONE_ID'];project=os.environ['CF_PAGES_NAME']
          base='https://api.cloudflare.com/client/v4'; headers={'Authorization':'Bearer '+token,'Accept':'application/json','Content-Type':'application/json'}
          def call(method,path,data=None,ok=(200,)):
              req=urllib.request.Request(base+path,headers=headers,method=method,data=None if data is None else json.dumps(data).encode())
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf8','replace')
                  try:body=json.loads(raw)
                  except:body={}
                  if e.code not in ok:return e.code,body
                  return e.code,body
          code,p=call('GET',f'/accounts/{account}/pages/projects/{project}')
          assert code==200 and p.get('success') and p['result']['production_branch']=='main'
          code,domains=call('GET',f'/accounts/{account}/pages/projects/{project}/domains')
          assert code==200 and domains.get('success')
          assert not [d for d in domains.get('result',[]) if d.get('name') in ('mftintelligence.com','www.mftintelligence.com')], 'Production domain already attached unexpectedly'
          pre={'dns':{},'domains':domains.get('result',[])}
          for name in ('mftintelligence.com','www.mftintelligence.com'):
              code,d=call('GET',f'/zones/{zone}/dns_records?'+urllib.parse.urlencode({'name':name,'per_page':100}))
              assert code==200 and d.get('success')
              pre['dns'][name]=d.get('result',[])
              assert not [r for r in pre['dns'][name] if r.get('type') in ('A','AAAA','CNAME')], 'Unexpected web DNS collision '+name
          code,mx=call('GET',f'/zones/{zone}/dns_records?'+urllib.parse.urlencode({'type':'MX','name':'mftintelligence.com','per_page':100}))
          assert code==200 and mx.get('success') and mx.get('result'), 'MX routing missing before launch'
          code,deps=call('GET',f'/accounts/{account}/pages/projects/{project}/deployments')
          assert code==200 and deps.get('success')
          prod=[d for d in deps.get('result',[]) if d.get('environment')=='production']
          pre['previous_production_id']=prod[0].get('id') if prod else None
          open(os.path.join(os.environ['RUNNER_TEMP'],'prestate.json'),'w').write(json.dumps(pre,indent=2))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PREV_PROD_ID='+str(pre['previous_production_id'] or '')+'\n')
          print('cloudflare_preflight: PASS')
          print('previous_production_deployment_present:',bool(pre['previous_production_id']))
          print('mx_records_preserved_prelaunch:',len(mx.get('result',[])))
          print('web_dns_collisions: 0')
          PY

      - name: Mint short-lived zone-scoped DNS Write token
        id: dns_token
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json,os,urllib.error,urllib.request
          parent=os.environ['CLOUDFLARE_API_TOKEN'];account=os.environ['CF_ACCOUNT_ID'];zone=os.environ['CF_ZONE_ID']
          base='https://api.cloudflare.com/client/v4'
          h={'Authorization':'Bearer '+parent,'Accept':'application/json','Content-Type':'application/json'}
          def call(method,path,data=None):
              req=urllib.request.Request(base+path,headers=h,method=method,data=None if data is None else json.dumps(data).encode())
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      raw=r.read().decode();return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf8','replace')
                  try:b=json.loads(raw)
                  except:b={}
                  raise RuntimeError(f'Cloudflare {method} {path} failed HTTP {e.code}: '+json.dumps(b.get('errors',[]))[:600])
          code,groups=call('GET',f'/accounts/{account}/tokens/permission_groups')
          candidates=[g for g in (groups.get('result') or []) if g.get('name') in ('DNS Write','DNS Edit') and g.get('is_selectable',True) is not False]
          assert candidates,'Selectable DNS Write permission group unavailable'
          candidates.sort(key=lambda g:0 if g.get('name')=='DNS Write' else 1)
          gid=candidates[0]['id']
          now=datetime.datetime.now(datetime.timezone.utc)
          expiry=(now+datetime.timedelta(minutes=45)).strftime('%Y-%m-%dT%H:%M:%SZ')
          payload={'name':'MUSITU corporate launch DNS 20261106','policies':[{'effect':'allow','resources':{f'com.cloudflare.api.account.zone.{zone}':'*'},'permission_groups':[{'id':gid}]}],'expires_on':expiry}
          code,res=call('POST',f'/accounts/{account}/tokens',payload)
          assert res.get('success') is True
          token=(res.get('result') or {}).get('value') or '';token_id=(res.get('result') or {}).get('id') or ''
          assert token and token_id,'Temporary DNS token value/id missing'
          print('::add-mask::'+token)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('TEMP_DNS_TOKEN='+token+'\n');f.write('TEMP_DNS_TOKEN_ID='+token_id+'\n')
          th={'Authorization':'Bearer '+token,'Accept':'application/json'}
          req=urllib.request.Request(base+f'/zones/{zone}/dns_records?per_page=1',headers=th,method='GET')
          with urllib.request.urlopen(req,timeout=20) as rr:body=json.load(rr)
          assert body.get('success') is True
          print('temporary_dns_token_scope_and_read: PASS')
          print('temporary_dns_token_expires_on:',expiry)
          PY

      - name: Mint short-lived exact-zone Config Settings token
        id: config_token
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json,os,urllib.request
          parent=os.environ['CLOUDFLARE_API_TOKEN'];account=os.environ['CF_ACCOUNT_ID'];zone=os.environ['CF_ZONE_ID']
          base='https://api.cloudflare.com/client/v4';h={'Authorization':'Bearer '+parent,'Accept':'application/json','Content-Type':'application/json'}
          def call(method,path,data=None):
              req=urllib.request.Request(base+path,headers=h,method=method,data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(req,timeout=25) as r:
                  raw=r.read().decode();return json.loads(raw) if raw else {}
          groups=call('GET',f'/accounts/{account}/tokens/permission_groups');by={x.get('name'):x for x in groups.get('result') or []}
          required=['Zone Read','Zone Settings Read','Config Settings Read','Config Settings Write']
          missing=[n for n in required if n not in by]
          assert not missing,'Missing Config Settings permission groups: '+repr(missing)
          expiry=(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(minutes=45)).strftime('%Y-%m-%dT%H:%M:%SZ')
          payload={'name':'MUSITU corporate launch config 20261106',
                   'policies':[{'effect':'allow','resources':{f'com.cloudflare.api.account.zone.{zone}':'*'},
                                'permission_groups':[{'id':by[n]['id']} for n in required]}],
                   'expires_on':expiry}
          out=call('POST',f'/accounts/{account}/tokens',payload);res=out.get('result') or {}
          token=res.get('value') or '';tid=res.get('id') or ''
          assert out.get('success') and token and tid
          print('::add-mask::'+token)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('TEMP_CONFIG_TOKEN='+token+'\nTEMP_CONFIG_TOKEN_ID='+tid+'\n')
          print('temporary_config_settings_token_created: true')
          print('temporary_config_settings_token_expires_on:',expiry)
          PY

      - name: Install pinned Cloudflare Pages CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/wrangler" --ignore-scripts --no-audit --no-fund wrangler@4.158.0
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" --version

      - name: Install pinned Chromium for public acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q playwright==1.55.0
          python3 -m playwright install --with-deps chromium


      - name: Deploy exact production artifact to Pages main
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" pages deploy "$RUNNER_TEMP/site/corporate/dist" --project-name "$CF_PAGES_NAME" --branch main --commit-hash "$MERGE_SHA" --skip-caching --no-bundle
          python3 - <<'PY'
          import json,os,time,urllib.parse,urllib.request
          token=os.environ['CLOUDFLARE_API_TOKEN'];account=os.environ['CF_ACCOUNT_ID'];project=os.environ['CF_PAGES_NAME'];merge=os.environ['MERGE_SHA']
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}/deployments'
          head={'Authorization':'Bearer '+token,'Accept':'application/json'}
          found=None
          for _ in range(12):
              with urllib.request.urlopen(urllib.request.Request(url,headers=head),timeout=20) as r:b=json.load(r)
              for d in b.get('result',[]):
                  meta=((d.get('deployment_trigger') or {}).get('metadata') or {})
                  if d.get('environment')=='production' and meta.get('commit_hash')==merge:
                      found=d;break
              if found:break
              time.sleep(3)
          assert found,'Production deployment not discoverable after upload'
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('NEW_PROD_ID='+found['id']+'\n')
          print('new_production_deployment_id:',found['id'])
          print('production_pages_deploy: PASS')
          PY

      - name: Attach apex, create Pages DNS, and configure canonical www redirect
        id: domains
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.error,urllib.request
          token=os.environ['CLOUDFLARE_API_TOKEN'];dns_token=os.environ['TEMP_DNS_TOKEN']
          account=os.environ['CF_ACCOUNT_ID'];zone=os.environ['CF_ZONE_ID'];project=os.environ['CF_PAGES_NAME']
          base='https://api.cloudflare.com/client/v4'
          bearer={'Authorization':'Bearer '+token,'Accept':'application/json','Content-Type':'application/json'}
          dnsh={'Authorization':'Bearer '+dns_token,'Accept':'application/json','Content-Type':'application/json'}
          def call(method,path,data=None,expected=(200,),headers=None):
              req=urllib.request.Request(base+path,headers=headers or bearer,method=method,data=None if data is None else json.dumps(data).encode())
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      raw=r.read().decode();return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf8','replace')
                  try:b=json.loads(raw)
                  except:b={}
                  if e.code not in expected:
                      raise RuntimeError(f'Cloudflare {method} {path} failed HTTP {e.code}: '+json.dumps(b.get('errors',[]))[:500])
                  return e.code,b

          # Attach only the canonical apex to Pages.
          code,d=call('POST',f'/accounts/{account}/pages/projects/{project}/domains',{'name':'mftintelligence.com'},expected=(200,201))
          assert d.get('success')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('APEX_DOMAIN_CREATED=1\n')
          print('apex_pages_domain_attach: CREATED')

          # Explicit apex CNAME is allowed at Cloudflare apex through CNAME flattening.
          code,dns=call('POST',f'/zones/{zone}/dns_records',{'type':'CNAME','name':'mftintelligence.com','content':project+'.pages.dev','ttl':1,'proxied':True,'comment':'MUSITU corporate Pages production apex'},expected=(200,201),headers=dnsh)
          assert dns.get('success'); apex_dns_id=dns['result']['id']
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('APEX_DNS_ID='+apex_dns_id+'\n')
          print('apex_pages_cname: CREATED')
          code,retry=call('PATCH',f'/accounts/{account}/pages/projects/{project}/domains/mftintelligence.com',None,expected=(200,))
          assert retry.get('success')
          print('apex_pages_validation_retry: REQUESTED')

          # Cloudflare-recommended www -> apex Bulk Redirect.
          list_name='musitu_www_to_apex_20261106'
          code,l=call('POST',f'/accounts/{account}/rules/lists',{'name':list_name,'description':'MUSITU www to canonical apex redirect','kind':'redirect'},expected=(200,201))
          assert l.get('success'); list_id=l['result']['id']
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('REDIRECT_LIST_ID='+list_id+'\n')
          code,op=call('POST',f'/accounts/{account}/rules/lists/{list_id}/items',[{'redirect':{'source_url':'www.mftintelligence.com/','target_url':'https://mftintelligence.com','status_code':301,'include_subdomains':False,'subpath_matching':True,'preserve_path_suffix':True,'preserve_query_string':True}}],expected=(200,201))
          assert op.get('success'); opid=op['result']['operation_id']
          for _ in range(20):
              code,b=call('GET',f'/accounts/{account}/rules/lists/bulk_operations/{opid}')
              if b.get('result',{}).get('status')=='completed':break
              time.sleep(2)
          else:raise RuntimeError('Bulk redirect list population did not complete')
          code,entry=call('GET',f'/accounts/{account}/rulesets/phases/http_request_redirect/entrypoint',expected=(200,404))
          rule={'ref':'musitu_www_to_apex_20261106','expression':f'http.request.full_uri in $'+list_name,'description':'MUSITU canonical www to apex','action':'redirect','action_parameters':{'from_list':{'name':list_name,'key':'http.request.full_uri'}}}
          if code==404 or not entry.get('success'):
              code,rs=call('POST',f'/accounts/{account}/rulesets',{'name':'MUSITU canonical redirects','kind':'root','phase':'http_request_redirect','rules':[rule]},expected=(200,201))
              assert rs.get('success'); ruleset_id=rs['result']['id']; rule_id=(rs['result'].get('rules') or [{}])[0].get('id')
              with open(os.environ['GITHUB_ENV'],'a') as f:
                  f.write('REDIRECT_RULESET_ID='+ruleset_id+'\nREDIRECT_RULESET_CREATED=1\n')
                  if rule_id:f.write('REDIRECT_RULE_ID='+rule_id+'\n')
          else:
              ruleset_id=entry['result']['id']
              code,rr=call('POST',f'/accounts/{account}/rulesets/{ruleset_id}/rules',rule,expected=(200,201))
              assert rr.get('success'); rule_id=rr['result']['id']
              with open(os.environ['GITHUB_ENV'],'a') as f:
                  f.write('REDIRECT_RULESET_ID='+ruleset_id+'\nREDIRECT_RULE_ID='+rule_id+'\nREDIRECT_RULESET_CREATED=0\n')

          # Cloudflare Pages documented www redirect DNS placeholder.
          code,wdns=call('POST',f'/zones/{zone}/dns_records',{'type':'A','name':'www','content':'192.0.2.1','ttl':1,'proxied':True,'comment':'MUSITU canonical www redirect'},expected=(200,201),headers=dnsh)
          assert wdns.get('success'); www_id=wdns['result']['id']
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('WWW_DNS_ID='+www_id+'\n')
          print('www_bulk_redirect: CREATED')
          print('www_proxy_dns: CREATED')
          PY

      - name: Extend existing browser-host exception without increasing zone rule count
        id: public_security
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.error,urllib.request
          token=os.environ['TEMP_CONFIG_TOKEN'];zone=os.environ['CF_ZONE_ID'];base='https://api.cloudflare.com/client/v4'
          h={'Authorization':'Bearer '+token,'Accept':'application/json','Content-Type':'application/json'}
          def call(method,path,data=None):
              req=urllib.request.Request(base+path,headers=h,method=method,data=None if data is None else json.dumps(data).encode())
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      raw=r.read().decode();b=json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf8','replace')
                  try:b=json.loads(raw)
                  except:b={}
                  raise RuntimeError(f'{method} {path} HTTP {e.code}: '+json.dumps(b.get('errors',[]))[:600])
              assert b.get('success') is True,(path,b.get('errors'))
              return b.get('result')
          sec=call('GET',f'/zones/{zone}/settings/security_level');bic=call('GET',f'/zones/{zone}/settings/browser_check')
          assert sec.get('value')=='under_attack' and bic.get('value')=='on','Global challenge posture changed unexpectedly'
          sets=call('GET',f'/zones/{zone}/rulesets') or []
          cfg=[x for x in sets if x.get('phase')=='http_config_settings' and x.get('kind')=='zone']
          assert len(cfg)==1,'Expected one zone http_config_settings ruleset'
          rid=cfg[0]['id'];detail=call('GET',f'/zones/{zone}/rulesets/{rid}') or {};rules=detail.get('rules') or []
          assert len(rules)==10,'Unexpected configuration-rule count: '+str(len(rules))
          ref='musitu_axiom_browser_world_release_direct_origin_v1'
          hits=[r for r in rules if r.get('ref')==ref];assert len(hits)==1
          r=hits[0];ap=r.get('action_parameters') or {}
          original='(http.host eq "app.mftintelligence.com")'
          expanded='(http.host eq "app.mftintelligence.com" or http.host eq "mftintelligence.com" or http.host eq "www.mftintelligence.com")'
          assert r.get('action')=='set_config' and r.get('enabled') is not False
          assert ap=={'bic':False,'security_level':'essentially_off'}
          assert r.get('expression') in (original,expanded),'Browser-host exception changed unexpectedly'
          rule_id=r['id'];changed=False
          if r.get('expression')==original:
              body={'action':'set_config','action_parameters':{'bic':False,'security_level':'essentially_off'},
                    'expression':expanded,
                    'description':'MUSITU browser-facing public hosts: suppress zone Under Attack/BIC on app and corporate apex/www only; application and Pages security controls remain independent',
                    'enabled':True,'ref':ref}
              call('PATCH',f'/zones/{zone}/rulesets/{rid}/rules/{rule_id}',body)
              changed=True
          check=call('GET',f'/zones/{zone}/rulesets/{rid}') or {};rules2=check.get('rules') or []
          assert len(rules2)==10
          out=[x for x in rules2 if x.get('ref')==ref]
          assert len(out)==1 and out[0].get('expression')==expanded
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('CORP_RULESET_ID='+rid+'\nCORP_RULE_ID='+rule_id+'\nCORP_RULE_CHANGED='+('1' if changed else '0')+'\n')
          print('config_rule_count_after:',len(rules2))
          print('browser_host_exception_consolidated: PASS')
          print('global_under_attack_preserved_outside_app_apex_www: true')
          PY

      - name: Wait for Pages activation, independent public DNS and verified edge HTTPS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,ssl,socket,subprocess,time,urllib.request
          token=os.environ['CLOUDFLARE_API_TOKEN'];account=os.environ['CF_ACCOUNT_ID'];project=os.environ['CF_PAGES_NAME']
          h={'Authorization':'Bearer '+token,'Accept':'application/json'}
          api=f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}/domains/mftintelligence.com'
          active=False
          for i in range(100):
              with urllib.request.urlopen(urllib.request.Request(api,headers=h),timeout=20) as r:b=json.load(r)
              result=b.get('result') or {};status=result.get('status')
              print('apex_domain_status_attempt',i+1,status,'validation=',json.dumps(result.get('validation_data'),sort_keys=True),'verification=',json.dumps(result.get('verification_data'),sort_keys=True))
              if status=='active':active=True;break
              if status in ('error','blocked','deactivated'):raise RuntimeError('Apex domain entered '+str(status))
              time.sleep(5)
          assert active,'Apex domain did not become active'
          print('apex_pages_domain_active: PASS')

          def resolve(name):
              answers=[]
              for typ in ('A','AAAA'):
                  try:
                      url=f'https://dns.google/resolve?name={name}&type={typ}&cd=1'
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MUSITU-Launch-DNS/20261106'}),timeout=15) as r:d=json.load(r)
                      if d.get('Status')==0:
                          answers.extend([x.get('data') for x in d.get('Answer',[]) if x.get('type') in (1,28)])
                  except Exception as e: print('public_dns_probe_error',name,typ,type(e).__name__)
              return answers

          apex_ips=[];www_ips=[]
          for i in range(120):
              apex_ips=resolve('mftintelligence.com');www_ips=resolve('www.mftintelligence.com')
              print('independent_dns_attempt',i+1,'apex=',apex_ips,'www=',www_ips)
              if apex_ips and www_ips:break
              time.sleep(5)
          assert apex_ips and www_ips,'Independent public DNS did not converge'
          apex_v4=next((x for x in apex_ips if ':' not in x),None) or apex_ips[0]
          www_v4=next((x for x in www_ips if ':' not in x),None) or www_ips[0]

          # Probe the real edge while preserving hostname/SNI and bypassing only stale runner resolver caches.
          ready=False;last=''
          for i in range(80):
              p=subprocess.run(['curl','-sS','-D','-','--max-time','20','--resolve',f'mftintelligence.com:443:{apex_v4}','https://mftintelligence.com/'],capture_output=True,text=True)
              out=p.stdout;body=out.split('\r\n\r\n',1)[-1] if '\r\n\r\n' in out else out
              first=out.splitlines()[0] if out.splitlines() else ''
              challenge=('Just a moment' in body or 'cf-chl' in body)
              content=('Intelligence with evidence' in body)
              last=json.dumps({'exit':p.returncode,'first':first,'challenge':challenge,'content':content})
              print('edge_https_attempt',i+1,last)
              if p.returncode==0 and content and not challenge:
                  ready=True;break
              time.sleep(4)
          assert ready,'Production edge did not serve corporate content: '+last
          apex_v4s=[x for x in apex_ips if ':' not in x]
          www_v4s=[x for x in www_ips if ':' not in x]
          assert apex_v4s and www_v4s,'Public IPv4 Cloudflare edges not yet available'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('APEX_EDGE_IP='+apex_v4+'\nWWW_EDGE_IP='+www_v4+'\n')
              f.write('APEX_EDGE_IPS='+','.join(apex_v4s)+'\nWWW_EDGE_IPS='+','.join(www_v4s)+'\n')
          print('independent_public_dns_ready: PASS')
          print('verified_edge_https_content_ready: PASS')
          PY

      - name: Public production Chromium acceptance, DNS and mail preservation
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,time,urllib.parse,urllib.request
          from playwright.sync_api import sync_playwright
          origin='https://mftintelligence.com'
          routes=['/','/company/','/trust/','/accessibility/','/products/','/products/axiom/','/products/education/','/products/foundry/','/products/markets/','/products/fmi/','/products/worldfabric/','/products/education/chemistry-rescue/','/products/foundry/studio/','/solutions/','/solutions/finance-research/','/solutions/learning/','/solutions/creative-production/','/solutions/enterprise-systems/','/experiences/','/experiences/intelligence/','/experiences/lab/','/ecosystem/','/research/','/evidence/','/resources/','/developers/','/news/','/contact/','/support/','/status/','/legal/privacy/','/legal/terms/','/sitemap/']
          page_errors=[]
          apex_edges=[x for x in os.environ['APEX_EDGE_IPS'].split(',') if x]
          www_edges=[x for x in os.environ['WWW_EDGE_IPS'].split(',') if x]
          assert apex_edges and www_edges
          def goto_transient(pg,url,wait_until='domcontentloaded',attempts=5):
              last=None;last_exc=None
              for n in range(attempts):
                  try:
                      last=pg.goto(url,wait_until=wait_until,timeout=30000)
                      if last and last.status<500:return last
                      print('transient_edge_response',url,'attempt',n+1,'status',last.status if last else None)
                  except Exception as e:
                      last_exc=e;print('transient_edge_exception',url,'attempt',n+1,type(e).__name__,str(e)[:140])
                  time.sleep(1.5)
              if last:return last
              if last_exc:raise last_exc
              return None
          with sync_playwright() as pw:
              apex_ip=apex_edges[0];www_ip=www_edges[0]
              browser=pw.chromium.launch(headless=True,args=[f'--host-resolver-rules=MAP mftintelligence.com {apex_ip}, MAP www.mftintelligence.com {www_ip}, EXCLUDE localhost'])
              context=browser.new_context(
                  viewport={'width':1280,'height':900},
                  user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36'
              )
              page=context.new_page()
              page.on('pageerror',lambda e:page_errors.append(str(e)[:200]))
              home=None;last_browser=''
              for attempt in range(30):
                  try:
                      home=page.goto(origin+'/',wait_until='domcontentloaded',timeout=30000)
                      content=page.content()
                      last_browser=f'status={home.status if home else None} url={page.url} title={page.title()!r} bytes={len(content)}'
                      print('browser_home_attempt',attempt+1,last_browser)
                      if home and home.status==200 and 'Intelligence with evidence' in content:break
                  except Exception as e:
                      last_browser=type(e).__name__+': '+str(e)[:220]
                      print('browser_home_attempt',attempt+1,'error=',last_browser)
                  time.sleep(5)
              assert home and home.status==200 and 'Intelligence with evidence' in page.content(),'Apex production did not become browser-reachable: '+last_browser
              hh=home.headers
              assert hh.get('x-content-type-options')=='nosniff'
              assert "frame-ancestors 'none'" in hh.get('content-security-policy','')
              assert 'noindex' not in hh.get('x-robots-tag','').lower()
              assert page.locator('meta[name="robots"]').get_attribute('content')=='index,follow'
              assert page.locator('link[rel="canonical"]').get_attribute('href')==origin+'/'

              failures=[];transient_routes=[]
              for route in routes:
                  try:
                      resp=goto_transient(page,origin+route)
                      if not resp:raise AssertionError('no response')
                      if resp.status>=500:
                          transient_routes.append(route);continue
                      if resp.status!=200:raise AssertionError('HTTP '+str(resp.status))
                      if page.locator('meta[name="robots"]').get_attribute('content')!='index,follow':raise AssertionError('robots meta')
                      if page.locator('link[rel="canonical"]').get_attribute('href')!=origin+route:raise AssertionError('canonical')
                      if page.locator('.review-ribbon').count():raise AssertionError('review ribbon')
                  except Exception as e:
                      failures.append({'route':route,'error':type(e).__name__,'detail':str(e)[:120]})
              if transient_routes and len(apex_edges)>1:
                  second=apex_edges[1]
                  print('second_edge_recheck_routes',second,transient_routes)
                  b2=pw.chromium.launch(headless=True,args=[f'--host-resolver-rules=MAP mftintelligence.com {second}, EXCLUDE localhost'])
                  c2=b2.new_context(viewport={'width':1280,'height':900},user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36')
                  p2=c2.new_page();remaining=[]
                  for route in transient_routes:
                      try:
                          resp=goto_transient(p2,origin+route,attempts=5)
                          if not resp or resp.status!=200:
                              remaining.append({'route':route,'error':'HTTP','detail':str(resp.status if resp else None)});continue
                          if p2.locator('meta[name="robots"]').get_attribute('content')!='index,follow':raise AssertionError('robots meta')
                          if p2.locator('link[rel="canonical"]').get_attribute('href')!=origin+route:raise AssertionError('canonical')
                          if p2.locator('.review-ribbon').count():raise AssertionError('review ribbon')
                      except Exception as e:
                          remaining.append({'route':route,'error':type(e).__name__,'detail':str(e)[:120]})
                  b2.close();transient_routes=[]
                  failures.extend(remaining)
              else:
                  failures.extend([{'route':r,'error':'HTTP5xx','detail':'transient response persisted'} for r in transient_routes])
              assert not failures,'Route failures '+json.dumps(failures)

              # Legal/operator identification and Axiom direct destination.
              page.goto(origin+'/legal/privacy/',wait_until='domcontentloaded',timeout=30000)
              privacy=page.locator('main').inner_text()
              assert 'MUSITU is the website operator and data controller' in privacy
              assert 'Mhundwa Village, Seke, Mashonaland East, Zimbabwe' in privacy
              page.goto(origin+'/products/axiom/',wait_until='domcontentloaded',timeout=30000)
              assert page.locator('a[href="https://chatgpt.com/plugins/plugin_asdk_app_6ae058ee6cec81919329ae43b76a4c86"]').count()>0

              # Verify live Studio media bytes through Chromium, not raw bot-sensitive HTTP.
              media_page=context.new_page()
              media_resp=goto_transient(media_page,origin+'/assets/studio-demo-82s.mp4',wait_until='commit',attempts=6)
              assert media_resp and media_resp.status==200
              media=media_resp.body()
              assert hashlib.sha256(media).hexdigest()=='afd6dfd3c73668e544f3f8a857697fed0abaadccd4927202bb3a185612c2dea0'
              media_page.close()
              page.goto(origin+'/products/foundry/studio/',wait_until='domcontentloaded',timeout=30000)
              video=page.locator('video.studio-demo-player')
              assert video.count()==1
              duration=0
              for _ in range(20):
                  duration=video.evaluate('(v)=>Number.isFinite(v.duration)?v.duration:0')
                  if 81.5<=duration<=82.5:break
                  page.wait_for_timeout(300)
              assert 81.5<=duration<=82.5,'Studio video metadata duration mismatch'

              # robots.xml and sitemap.xml through Chromium response bodies.
              rpage=context.new_page()
              rr=goto_transient(rpage,origin+'/robots.txt',wait_until='commit',attempts=6)
              assert rr and rr.status==200
              robots=rr.body().decode('utf8','replace')
              assert 'Allow: /' in robots and origin+'/sitemap.xml' in robots
              sr=goto_transient(rpage,origin+'/sitemap.xml',wait_until='commit',attempts=6)
              assert sr and sr.status==200
              sitemap=sr.body().decode('utf8','replace')
              assert sitemap.count('<url>')==33
              rpage.close()

              # www must 301/308 to apex while preserving path/query.
              redirect_events=[]
              w=context.new_page()
              w.on('response',lambda r: redirect_events.append({'url':r.url,'status':r.status,'location':r.headers.get('location','')}))
              final=w.goto('https://www.mftintelligence.com/products/axiom/?launch=1',wait_until='domcontentloaded',timeout=30000)
              assert final and final.status==200
              assert w.url.startswith(origin+'/products/axiom/') and 'launch=1' in w.url
              assert any(e['url'].startswith('https://www.mftintelligence.com/') and e['status'] in (301,308) and e['location'].startswith(origin+'/products/axiom/') for e in redirect_events),json.dumps(redirect_events[:8])
              w.close()

              # Existing Intelligence origin must remain independently available.
              intel=context.new_page()
              ir=intel.goto('https://evansmusitu.github.io/',wait_until='domcontentloaded',timeout=30000)
              assert ir and ir.status==200 and 'MUSITU' in intel.content().upper()
              intel.close()
              browser.close()

          assert not page_errors,'Browser JavaScript errors '+json.dumps(page_errors)

          # Mail routing is checked via Cloudflare control plane, independent of browser challenge behavior.
          token=os.environ['CLOUDFLARE_API_TOKEN'];zone=os.environ['CF_ZONE_ID']
          url='https://api.cloudflare.com/client/v4/zones/'+zone+'/dns_records?'+urllib.parse.urlencode({'type':'MX','name':'mftintelligence.com','per_page':100})
          with urllib.request.urlopen(urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json'}),timeout=20) as r:b=json.load(r)
          assert b.get('success') and b.get('result'),'MX records disappeared'

          print('public_chromium_routes_200_indexable:',len(routes))
          print('production_security_headers: PASS')
          print('legal_identification_live: PASS')
          print('axiom_chatgpt_destination_live: PASS')
          print('studio_media_hash_and_82s_metadata_live: PASS')
          print('robots_and_33_url_sitemap: PASS')
          print('www_to_apex_301_preserves_path_query: PASS')
          print('mx_email_routing_preserved: PASS')
          print('existing_intelligence_origin_preserved: PASS')
          print('public_browser_page_errors: 0')
          PY

