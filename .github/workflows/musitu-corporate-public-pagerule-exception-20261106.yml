name: MUSITU Corporate Public PageRule Exception 20261106
on:
  push:
    branches:
      - audit/musitu-corporate-cloudflare-readonly-20261103
    paths:
      - .github/workflows/musitu-corporate-public-pagerule-exception-20261106.yml
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PARENT_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: "93f395f5121954671f92fffa453d6b61"
      CF_ZONE_ID: "5b56528f03948ff5917a5e0cd9f7109e"
    steps:
      - name: Mint exact-zone Page Rules token
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json,os,urllib.request
          p=os.environ['PARENT_TOKEN'];a=os.environ['CF_ACCOUNT_ID'];z=os.environ['CF_ZONE_ID'];base='https://api.cloudflare.com/client/v4'
          h={'Authorization':'Bearer '+p,'Accept':'application/json','Content-Type':'application/json'}
          def call(method,path,data=None):
              q=urllib.request.Request(base+path,headers=h,method=method,data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(q,timeout=25) as r:
                  raw=r.read().decode();return json.loads(raw) if raw else {}
          g=call('GET',f'/accounts/{a}/tokens/permission_groups');by={x.get('name'):x for x in g.get('result') or []}
          required=['Zone Read','Page Rules Read','Page Rules Write']
          assert all(x in by for x in required)
          exp=(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(minutes=25)).strftime('%Y-%m-%dT%H:%M:%SZ')
          payload={'name':'MUSITU corporate public pagerules 20261106','policies':[{'effect':'allow','resources':{f'com.cloudflare.api.account.zone.{z}':'*'},'permission_groups':[{'id':by[n]['id']} for n in required]}],'expires_on':exp}
          out=call('POST',f'/accounts/{a}/tokens',payload);r=out.get('result') or {};t=r.get('value') or '';tid=r.get('id') or ''
          assert out.get('success') and t and tid
          print('::add-mask::'+t)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('TEMP_PAGERULE_TOKEN='+t+'\nTEMP_PAGERULE_TOKEN_ID='+tid+'\n')
          print('temporary_pagerule_token_created: true')
          PY

      - name: Create exact apex/www public Page Rules
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.error,urllib.parse,urllib.request
          t=os.environ['TEMP_PAGERULE_TOKEN'];z=os.environ['CF_ZONE_ID'];base='https://api.cloudflare.com/client/v4'
          h={'Authorization':'Bearer '+t,'Accept':'application/json','Content-Type':'application/json'}
          def call(method,path,data=None,expected=(200,)):
              q=urllib.request.Request(base+path,headers=h,method=method,data=None if data is None else json.dumps(data).encode())
              try:
                  with urllib.request.urlopen(q,timeout=25) as r:
                      raw=r.read().decode();b=json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf8','replace')
                  try:b=json.loads(raw)
                  except:b={}
                  if e.code not in expected:raise RuntimeError(f'{method} {path} HTTP {e.code}: '+json.dumps(b.get('errors',[]))[:600])
                  return e.code,b
              assert b.get('success') is True,(path,b.get('errors'))
              return r.status,b
          code,b=call('GET',f'/zones/{z}/pagerules?per_page=100')
          rules=b.get('result') or []
          desired=['mftintelligence.com/*','www.mftintelligence.com/*']
          created=[]
          for target in desired:
              exact=[]
              for r in rules:
                  vals=[((x.get('constraint') or {}).get('value')) for x in r.get('targets') or [] if x.get('target')=='url']
                  if target in vals: exact.append(r)
              if exact:
                  assert len(exact)==1,'Duplicate existing Page Rules for '+target
                  r=exact[0];acts={a.get('id'):a.get('value') for a in r.get('actions') or []}
                  assert r.get('status')=='active' and acts.get('security_level')=='essentially_off' and acts.get('browser_check')=='off','Conflicting existing Page Rule for '+target
                  print('existing_exact_pagerule_reused:',target)
                  continue
              body={'targets':[{'target':'url','constraint':{'operator':'matches','value':target}}],
                    'actions':[{'id':'security_level','value':'essentially_off'},{'id':'browser_check','value':'off'}],
                    'status':'active'}
              code,out=call('POST',f'/zones/{z}/pagerules',body,expected=(200,201))
              rid=(out.get('result') or {}).get('id');assert rid
              created.append(rid)
              print('pagerule_created:',target)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('CREATED_PAGERULE_IDS='+','.join(created)+'\n')
          print('corporate_public_pagerules_apply: PASS')
          PY

      - name: Verify public edge serves corporate content without challenge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,time,urllib.request
          ready=False;last=[]
          for attempt in range(50):
              with urllib.request.urlopen('https://dns.google/resolve?name=mftintelligence.com&type=A&cd=1',timeout=15) as r:d=json.load(r)
              ips=[x['data'] for x in d.get('Answer',[]) if x.get('type')==1]
              last=[]
              for ip in ips:
                  p=subprocess.run(['curl','-sS','-D','-','--max-time','20','--resolve',f'mftintelligence.com:443:{ip}','https://mftintelligence.com/'],capture_output=True,text=True)
                  out=p.stdout;body=out.split('\r\n\r\n',1)[-1] if '\r\n\r\n' in out else out
                  first=out.splitlines()[0] if out.splitlines() else ''
                  challenge=('Just a moment' in body or 'cf-chl' in body)
                  content=('Intelligence with evidence' in body)
                  last.append({'ip':ip,'exit':p.returncode,'first':first,'challenge':challenge,'content':content})
                  if p.returncode==0 and content and not challenge:ready=True;break
              print('pagerule_edge_probe',attempt+1,json.dumps(last))
              if ready:break
              time.sleep(3)
          assert ready,'Corporate Page Rules did not remove challenge: '+json.dumps(last)
          print('public_edge_corporate_content: PASS')
          PY

      - name: Remove newly-created Page Rules if verification fails
        if: failure() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import os,urllib.request
          t=os.environ.get('TEMP_PAGERULE_TOKEN','');z=os.environ['CF_ZONE_ID']
          for rid in [x for x in os.environ.get('CREATED_PAGERULE_IDS','').split(',') if x]:
              q=urllib.request.Request(f'https://api.cloudflare.com/client/v4/zones/{z}/pagerules/{rid}',headers={'Authorization':'Bearer '+t},method='DELETE')
              try:
                  with urllib.request.urlopen(q,timeout=20) as r:print('failed_pagerule_cleanup_http:',r.status)
              except Exception as e:print('failed_pagerule_cleanup_error:',type(e).__name__)
          PY

      - name: Revoke temporary Page Rules token
        if: always()
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import json,os,urllib.request
          p=os.environ.get('PARENT_TOKEN','');a=os.environ.get('CF_ACCOUNT_ID','');tid=os.environ.get('TEMP_PAGERULE_TOKEN_ID','')
          if not tid:
              print('temporary_pagerule_token_created: false');raise SystemExit(0)
          q=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{a}/tokens/{tid}',headers={'Authorization':'Bearer '+p,'Accept':'application/json'},method='DELETE')
          try:
              with urllib.request.urlopen(q,timeout=20) as r:
                  raw=r.read().decode();b=json.loads(raw) if raw else {};ok=r.status in (200,204) and b.get('success',True) is True
          except Exception:ok=False
          print('temporary_pagerule_token_revoked:',ok)
          if not ok:raise SystemExit(1)
          PY
