name: MUSITU Corporate Public Security Consolidation 20261106
on:
  push:
    branches:
      - audit/musitu-corporate-cloudflare-readonly-20261103
    paths:
      - .github/workflows/musitu-corporate-public-security-consolidation-20261106.yml
permissions:
  contents: read
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PARENT_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: "93f395f5121954671f92fffa453d6b61"
      CF_ZONE_ID: "5b56528f03948ff5917a5e0cd9f7109e"
      TARGET_REF: "musitu_axiom_browser_world_release_direct_origin_v1"
    steps:
      - name: Mint short-lived exact-zone Config Settings token
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json,os,urllib.request
          p=os.environ['PARENT_TOKEN'];a=os.environ['CF_ACCOUNT_ID'];z=os.environ['CF_ZONE_ID']
          base='https://api.cloudflare.com/client/v4';h={'Authorization':'Bearer '+p,'Accept':'application/json','Content-Type':'application/json'}
          def call(method,path,data=None):
              req=urllib.request.Request(base+path,headers=h,method=method,data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(req,timeout=25) as r:
                  raw=r.read().decode();return json.loads(raw) if raw else {}
          g=call('GET',f'/accounts/{a}/tokens/permission_groups');assert g.get('success')
          by={x.get('name'):x for x in g.get('result') or []}
          names=['Zone Read','Zone Settings Read','Config Settings Read','Config Settings Write']
          assert not [n for n in names if n not in by]
          expiry=(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(minutes=25)).strftime('%Y-%m-%dT%H:%M:%SZ')
          payload={'name':'MUSITU corporate consolidated public-host config 20261106','policies':[{'effect':'allow','resources':{f'com.cloudflare.api.account.zone.{z}':'*'},'permission_groups':[{'id':by[n]['id']} for n in names]}],'expires_on':expiry}
          out=call('POST',f'/accounts/{a}/tokens',payload);assert out.get('success')
          v=(out.get('result') or {}).get('value');tid=(out.get('result') or {}).get('id')
          assert v and tid
          print('::add-mask::'+v)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('TEMP_CONFIG_TOKEN='+v+'\nTEMP_CONFIG_TOKEN_ID='+tid+'\n')
          print('temporary_config_token_created: true')
          PY

      - name: Extend existing browser-host exception without increasing rule count
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.error,urllib.request
          t=os.environ['TEMP_CONFIG_TOKEN'];z=os.environ['CF_ZONE_ID'];ref=os.environ['TARGET_REF']
          base='https://api.cloudflare.com/client/v4';h={'Authorization':'Bearer '+t,'Accept':'application/json','Content-Type':'application/json'}
          def call(method,path,data=None):
              req=urllib.request.Request(base+path,headers=h,method=method,data=None if data is None else json.dumps(data).encode())
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      raw=r.read().decode();b=json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf8','replace')
                  try:b=json.loads(raw)
                  except:b={}
                  raise RuntimeError(f'{method} {path} HTTP {e.code}: '+json.dumps(b.get('errors',[]))[:600])
              assert b.get('success') is True,(path,b.get('errors'))
              return b.get('result')
          sets=call('GET',f'/zones/{z}/rulesets') or []
          rs=[x for x in sets if x.get('phase')=='http_config_settings' and x.get('kind')=='zone']
          assert len(rs)==1
          rid=rs[0]['id'];detail=call('GET',f'/zones/{z}/rulesets/{rid}') or {}
          rules=detail.get('rules') or []
          assert len(rules)==10,'Unexpected configuration-rule count'
          hits=[r for r in rules if r.get('ref')==ref]
          assert len(hits)==1
          r=hits[0];ap=r.get('action_parameters') or {}
          original_expr='(http.host eq "app.mftintelligence.com")'
          expanded='(http.host eq "app.mftintelligence.com" or http.host eq "mftintelligence.com" or http.host eq "www.mftintelligence.com")'
          assert r.get('action')=='set_config' and r.get('enabled') is not False
          assert ap=={'bic':False,'security_level':'essentially_off'}
          assert r.get('expression') in (original_expr,expanded),'Target rule was changed unexpectedly'
          rule_id=r['id']
          if r.get('expression')==original_expr:
              body={'action':'set_config','action_parameters':{'bic':False,'security_level':'essentially_off'},'expression':expanded,'description':'MUSITU browser-facing public hosts: suppress zone Under Attack/BIC on app and corporate apex/www only; application and Pages security controls remain independent','enabled':True,'ref':ref}
              call('PATCH',f'/zones/{z}/rulesets/{rid}/rules/{rule_id}',body)
              changed=True
          else:
              changed=False
          check=call('GET',f'/zones/{z}/rulesets/{rid}') or {}
          rules2=check.get('rules') or []
          assert len(rules2)==10
          out=[x for x in rules2 if x.get('ref')==ref]
          assert len(out)==1 and out[0].get('expression')==expanded
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('CONFIG_RULESET_ID='+rid+'\nCONFIG_RULE_ID='+rule_id+'\nCONFIG_RULE_CHANGED='+('1' if changed else '0')+'\n')
          print('config_rule_count_after:',len(rules2))
          print('target_rule_consolidated: PASS')
          print('new_hosts_added_only: mftintelligence.com,www.mftintelligence.com')
          PY

      - name: Verify public apex no longer receives Cloudflare interstitial
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,time,urllib.request
          ok=False;last=[]
          for attempt in range(30):
              with urllib.request.urlopen('https://dns.google/resolve?name=mftintelligence.com&type=A&cd=1',timeout=15) as r:d=json.load(r)
              ips=[x['data'] for x in d.get('Answer',[]) if x.get('type')==1]
              last=[]
              for ip in ips:
                  p=subprocess.run(['curl','-sS','-D','-','--max-time','20','--resolve',f'mftintelligence.com:443:{ip}','https://mftintelligence.com/'],capture_output=True,text=True)
                  out=p.stdout
                  sep='\r\n\r\n' if '\r\n\r\n' in out else '\n\n'
                  body=out.split(sep,1)[-1] if sep in out else out
                  first=out.splitlines()[0] if out.splitlines() else ''
                  challenge=('Just a moment' in body or 'cf-chl' in body)
                  content=('Intelligence with evidence' in body)
                  last.append({'ip':ip,'exit':p.returncode,'first':first,'challenge':challenge,'content':content})
                  if p.returncode==0 and first.endswith(' 200') and content and not challenge:
                      ok=True;break
              print('consolidated_edge_attempt',attempt+1,json.dumps(last))
              if ok:break
              time.sleep(3)
          assert ok,'Apex still challenged: '+json.dumps(last)
          print('public_apex_content_without_interstitial: PASS')
          PY

      - name: Restore original target rule if public verification fails
        if: failure() && steps.patch.outcome == 'success'
        shell: bash
        run: |
          set +e
          if [ "${CONFIG_RULE_CHANGED:-0}" != "1" ]; then exit 0; fi
          python3 - <<'PY'
          import json,os,urllib.request
          t=os.environ.get('TEMP_CONFIG_TOKEN','');z=os.environ['CF_ZONE_ID'];rs=os.environ.get('CONFIG_RULESET_ID','');rid=os.environ.get('CONFIG_RULE_ID','');ref=os.environ['TARGET_REF']
          if not (t and rs and rid):raise SystemExit(0)
          body={'action':'set_config','action_parameters':{'bic':False,'security_level':'essentially_off'},'expression':'(http.host eq "app.mftintelligence.com")','description':'MUSITU Axiom world release: suppress the zone interstitial only on the dedicated application hostname; Worker authentication, rate limiting, CSRF, CSP and session controls remain fail-closed','enabled':True,'ref':ref}
          req=urllib.request.Request(f'https://api.cloudflare.com/client/v4/zones/{z}/rulesets/{rs}/rules/{rid}',headers={'Authorization':'Bearer '+t,'Accept':'application/json','Content-Type':'application/json'},method='PATCH',data=json.dumps(body).encode())
          try:
              with urllib.request.urlopen(req,timeout=25) as r:print('target_rule_restore_http:',r.status)
          except Exception as e:print('target_rule_restore_error:',type(e).__name__)
          PY

      - name: Revoke temporary Config Settings token
        if: always()
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import json,os,urllib.request
          p=os.environ.get('PARENT_TOKEN','');a=os.environ.get('CF_ACCOUNT_ID','');tid=os.environ.get('TEMP_CONFIG_TOKEN_ID','')
          if not tid:raise SystemExit(0)
          req=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{a}/tokens/{tid}',headers={'Authorization':'Bearer '+p,'Accept':'application/json'},method='DELETE')
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  raw=r.read().decode();b=json.loads(raw) if raw else {};ok=r.status in (200,204) and b.get('success',True) is True
          except Exception:ok=False
          print('temporary_config_token_revoked:',ok)
          if not ok:raise SystemExit(1)
          PY
