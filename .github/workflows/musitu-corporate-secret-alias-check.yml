name: MUSITU DNS Credential Alias Check (GET Only)
on:
  push:
    branches:
      - ops/corporate-cf-readonly-20261106
      - ops/cloudflare-preflight-pr33-20261106
      - ops/corporate-cf-token-readonly-20261106
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check configured credential aliases without printing secret values
        env:
          S0: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S1: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          S2: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
          S3: ${{ secrets.CF_DNS_API_TOKEN }}
          S4: ${{ secrets.CF_API_TOKEN }}
          S5: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
          S6: ${{ secrets.MUSITU_CORPORATE_DNS_API_TOKEN }}
          S7: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          S8: ${{ secrets.CLOUDFLARE_EMAIL }}
          S9: ${{ secrets.CLOUDFLARE_AUTH_EMAIL }}
          S10: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          names=["CLOUDFLARE_API_TOKEN","CLOUDFLARE_DNS_API_TOKEN","CLOUDFLARE_DNS_TOKEN","CF_DNS_API_TOKEN","CF_API_TOKEN","CLOUDFLARE_ZONE_API_TOKEN","MUSITU_CORPORATE_DNS_API_TOKEN","CLOUDFLARE_GLOBAL_API_KEY","CLOUDFLARE_EMAIL","CLOUDFLARE_AUTH_EMAIL","CLOUDFLARE_API_KEY"]
          vals={name:os.getenv('S'+str(i),'') for i,name in enumerate(names)}
          print('Configured secret names:',[k for k,v in vals.items() if v])
          seen=set()
          for name,tok in vals.items():
            if not tok or name in ('CLOUDFLARE_GLOBAL_API_KEY','CLOUDFLARE_API_KEY','CLOUDFLARE_EMAIL','CLOUDFLARE_AUTH_EMAIL'):continue
            if tok in seen:continue
            seen.add(tok)
            req=urllib.request.Request('https://api.cloudflare.com/client/v4/zones?name=mftintelligence.com&per_page=5',method='GET',headers={'Authorization':'Bearer '+tok,'Accept':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=15) as r:status=r.status;d=json.loads(r.read(100000))
            except urllib.error.HTTPError as e:
              status=e.code
              try:d=json.loads(e.read(100000))
              except Exception:d={}
            except Exception as e:
              print('Candidate',name,'network exception type',type(e).__name__);continue
            matched=any(z.get('name')=='mftintelligence.com' and (z.get('account') or {}).get('id')=='93f395f5121954671f92fffa453d6b61' for z in (d.get('result') or []))
            print('Candidate',name,'GET status:',status,'correct corporate zone:',matched,'Cloudflare error codes:',[x.get('code') for x in (d.get('errors') or [])][:2])
          print('No DNS changes or token values disclosed.')
          PY
