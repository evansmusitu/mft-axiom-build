name: MUSITU Delivery OS Unified

on:
  push:
    branches:
      - product/musitu-delivery-os-unified-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Pinned OwnFleet foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: delivery-os/vendor/ownfleet/package-lock.json
      - name: Verify upstream pin
        run: test "$(git -C delivery-os/vendor/ownfleet rev-parse HEAD)" = "98744125c827b6e5bbe2af384c3ef9308c445ec8"
      - name: Install foundation dependencies
        working-directory: delivery-os/vendor/ownfleet
        run: npm ci
      - name: Generate Prisma client
        working-directory: delivery-os/vendor/ownfleet
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: API tests
        working-directory: delivery-os/vendor/ownfleet
        run: npm test -w @ownfleet/api -- --runInBand
      - name: Web tests
        working-directory: delivery-os/vendor/ownfleet
        run: npm test -w @ownfleet/web
      - name: API build
        working-directory: delivery-os/vendor/ownfleet
        run: npm run build -w @ownfleet/api
      - name: Prepare deterministic Next font responses
        run: |
          cat > "$RUNNER_TEMP/next-font-mocked-responses.cjs" <<'EOF'
          module.exports = {
            'https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap': `
          /* cyrillic */
          @font-face {
            font-family: 'Manrope';
            font-style: normal;
            font-weight: 400 800;
            font-display: swap;
            src: url(https://mock.invalid/manrope-cyrillic.woff2) format('woff2');
          }
          /* latin */
          @font-face {
            font-family: 'Manrope';
            font-style: normal;
            font-weight: 400 800;
            font-display: swap;
            src: url(https://mock.invalid/manrope-latin.woff2) format('woff2');
          }`,
            'https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap': `
          /* latin */
          @font-face {
            font-family: 'JetBrains Mono';
            font-style: normal;
            font-weight: 400 700;
            font-display: swap;
            src: url(https://mock.invalid/jetbrains-mono-latin.woff2) format('woff2');
          }`,
          }
          EOF
          echo "NEXT_FONT_GOOGLE_MOCKED_RESPONSES=$RUNNER_TEMP/next-font-mocked-responses.cjs" >> "$GITHUB_ENV"
      - name: Web build
        working-directory: delivery-os/vendor/ownfleet
        run: npm run build -w @ownfleet/web

  musitu-core:
    name: MUSITU unified core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Reconstruct exact unified source
        run: |
          cd delivery-os
          cat source-parts/part-* | base64 -d > phase1-src.tar.gz
          sha256sum -c PHASE1_SOURCE_SHA256.txt
          cd ..
          tar -xzf delivery-os/phase1-src.tar.gz -C .
          cd delivery-os
          sha256sum -c PHASE2_UNIFIED_PATCH_SHA256.txt
          sha256sum -c PHASE2_CONSTRAINT_GUARD_PATCH_SHA256.txt
          sha256sum -c PHASE2_DRIVER_AVAILABILITY_PATCH_SHA256.txt
          sha256sum -c PHASE2_STANDARD_V2_HARNESS_PATCH_SHA256.txt
          cd ..
          gzip -dc delivery-os/PHASE2_UNIFIED.patch.gz | git apply --unsafe-paths --directory=delivery-os -
          gzip -dc delivery-os/PHASE2_CONSTRAINT_GUARD.patch.gz | git apply --unsafe-paths --directory=delivery-os -
          gzip -dc delivery-os/PHASE2_DRIVER_AVAILABILITY.patch.gz | git apply --unsafe-paths --directory=delivery-os -
          git apply --unsafe-paths --directory=delivery-os delivery-os/PHASE2_STANDARD_V2_HARNESS.patch
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify pinned OwnFleet foundation
        run: test "$(git -C delivery-os/vendor/ownfleet rev-parse HEAD)" = "98744125c827b6e5bbe2af384c3ef9308c445ec8"
      - name: Unified regression and acceptance gates
        working-directory: delivery-os
        run: npm run verify
      - name: Stage verified reconstructed unified source snapshot
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="$RUNNER_TEMP/musitu-delivery-os-unified-source"
          rm -rf "$SNAPSHOT"
          mkdir -p "$SNAPSHOT"
          tar -C delivery-os \
            --exclude='./vendor/ownfleet/.git' \
            --exclude='./source-parts' \
            --exclude='./phase1-src.tar.gz' \
            --exclude='./PHASE1_SOURCE_SHA256.txt' \
            --exclude='./PHASE2_UNIFIED.patch.gz' \
            --exclude='./PHASE2_UNIFIED_PATCH_SHA256.txt' \
            --exclude='./PHASE2_CONSTRAINT_GUARD.patch.gz' \
            --exclude='./PHASE2_CONSTRAINT_GUARD_PATCH_SHA256.txt' \
            --exclude='./PHASE2_DRIVER_AVAILABILITY.patch.gz' \
            --exclude='./PHASE2_DRIVER_AVAILABILITY_PATCH_SHA256.txt' \
            --exclude='./PHASE2_STANDARD_V2_HARNESS.patch' \
            --exclude='./PHASE2_STANDARD_V2_HARNESS_PATCH_SHA256.txt' \
            -cf - . | tar -C "$SNAPSHOT" -xf -
          cat > "$SNAPSHOT/SNAPSHOT_METADATA.txt" <<EOF
          unified_head=$GITHUB_SHA
          ownfleet_pin=98744125c827b6e5bbe2af384c3ef9308c445ec8
          source_kind=reconstructed_phase1_plus_phase2_patch_chain
          phase2_constraint_guard_sha256=f3e22402a8b51d549c84ef71d7e7d13fd6cd682e7f4b54fd5b7f0b12a47f2e34
          phase2_driver_availability_sha256=3a429997c636e65689212f697650b28646b2869de3d2abbe6e6f3ba61c563777
          phase2_standard_v2_harness_sha256=1f5890d65eba5276b2210f05229146baa3d52dd5bc0e853659639069dbfdec35
          EOF
          (
            cd "$SNAPSHOT"
            find . -type f ! -name MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256
          )
      - uses: actions/upload-artifact@v6
        with:
          name: musitu-delivery-os-unified-source
          path: ${{ runner.temp }}/musitu-delivery-os-unified-source
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  android:
    name: Flutter Android release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Reconstruct exact unified source
        run: |
          cd delivery-os
          cat source-parts/part-* | base64 -d > phase1-src.tar.gz
          sha256sum -c PHASE1_SOURCE_SHA256.txt
          cd ..
          tar -xzf delivery-os/phase1-src.tar.gz -C .
          cd delivery-os
          sha256sum -c PHASE2_UNIFIED_PATCH_SHA256.txt
          sha256sum -c PHASE2_CONSTRAINT_GUARD_PATCH_SHA256.txt
          sha256sum -c PHASE2_DRIVER_AVAILABILITY_PATCH_SHA256.txt
          sha256sum -c PHASE2_STANDARD_V2_HARNESS_PATCH_SHA256.txt
          cd ..
          gzip -dc delivery-os/PHASE2_UNIFIED.patch.gz | git apply --unsafe-paths --directory=delivery-os -
          gzip -dc delivery-os/PHASE2_CONSTRAINT_GUARD.patch.gz | git apply --unsafe-paths --directory=delivery-os -
          gzip -dc delivery-os/PHASE2_DRIVER_AVAILABILITY.patch.gz | git apply --unsafe-paths --directory=delivery-os -
          git apply --unsafe-paths --directory=delivery-os delivery-os/PHASE2_STANDARD_V2_HARNESS.patch
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform scaffold
        working-directory: delivery-os/driver_flutter
        run: |
          flutter create --platforms=android --org com.musitu --project-name musitu_driver .
          ../scripts/configure_android.sh
      - name: Dependencies
        working-directory: delivery-os/driver_flutter
        run: flutter pub get
      - name: Analyze
        working-directory: delivery-os/driver_flutter
        run: flutter analyze
      - name: Test
        working-directory: delivery-os/driver_flutter
        run: flutter test
      - name: Build release APK
        working-directory: delivery-os/driver_flutter
        run: flutter build apk --release --dart-define=MUSITU_API_URL=https://delivery-api.invalid
      - uses: actions/upload-artifact@v6
        with:
          name: musitu-driver-unified-apk
          path: delivery-os/driver_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
