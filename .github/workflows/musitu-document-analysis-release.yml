name: MUSITU Private Text Document Analysis Canary Release

on:
  push:
    branches: [feature/musitu-text-document-intelligence-20261020]
    paths:
      - studio-edge/**
      - .github/workflows/musitu-document-analysis-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-document-canary-release
  cancel-in-progress: false

jobs:
  verify-canary-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CANARY: https://musitu-intelligence-edge-capacity-canary-20261019.mft-education-nexus-93f395f5.workers.dev
      PRODUCTION: https://musitu-intelligence-edge-20261019.mft-education-nexus-93f395f5.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all existing AI tool and document unit tests
        run: |
          set -euo pipefail
          node --check studio-edge/worker.mjs
          node --test studio-edge/tests/*.test.mjs
      - name: Validate secret presence without exposing it
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Deploy isolated canary only
        run: |
          set -euo pipefail
          npx -y wrangler@4.129.0 deploy --config studio-edge/wrangler.canary.jsonc
      - name: Verify live document inference and security on canary
        env:
          TARGET_WORKER: ${{ env.CANARY }}
        run: node studio-edge/tests/document-live.mjs
      - name: Promote tested document capability to production
        run: |
          set -euo pipefail
          npx -y wrangler@4.129.0 deploy --config studio-edge/wrangler.jsonc
          echo 'PRODUCTION_TOUCHED=1' >> "$GITHUB_ENV"
      - name: Verify live document inference in production
        env:
          TARGET_WORKER: ${{ env.PRODUCTION }}
        run: node studio-edge/tests/document-live.mjs
      - name: Restore exact previous deployed source if production acceptance fails
        if: ${{ failure() && env.PRODUCTION_TOUCHED == '1' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/musitu-previous
          for file in worker.mjs research.mjs citations.mjs math.mjs scholar.mjs wrangler.jsonc; do
            git show fa81ad46cd553587a50a79e3f0a039c6db87616d:studio-edge/$file > /tmp/musitu-previous/$file
          done
          npx -y wrangler@4.129.0 deploy --config /tmp/musitu-previous/wrangler.jsonc
          echo 'Previous verified Worker restored'
