name: MUSITU Verified Arithmetic Auto-Routing Release

on:
  push:
    branches: [feature/musitu-verified-math-routing-20261020]
    paths:
      - studio-edge/**
      - .github/workflows/musitu-edge-arithmetic-routing-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-verified-arithmetic-production
  cancel-in-progress: false

jobs:
  canary-then-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CANARY: https://musitu-intelligence-edge-capacity-canary-20261019.mft-education-nexus-93f395f5.workers.dev
      PRODUCTION: https://musitu-intelligence-edge-20261019.mft-education-nexus-93f395f5.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all isolated math and model regression tests
        run: |
          set -euo pipefail
          node --check studio-edge/worker.mjs
          node --check studio-edge/math.mjs
          node --test studio-edge/tests/worker.test.mjs studio-edge/tests/math.test.mjs
      - name: Require configured Cloudflare API credential
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Deploy canary
        run: npx -y wrangler@4.129.0 deploy --config studio-edge/wrangler.canary.jsonc
      - name: Verify automatic calculation without model inference on canary
        env:
          TARGET_WORKER: ${{ env.CANARY }}
        run: node studio-edge/tests/auto-math-live.mjs
      - name: Confirm existing model and tool acceptance on canary
        env:
          TARGET_WORKER: ${{ env.CANARY }}
        run: node studio-edge/tests/live-smoke.mjs
      - name: Promote proven runtime to isolated production Worker
        run: |
          set -euo pipefail
          npx -y wrangler@4.129.0 deploy --config studio-edge/wrangler.jsonc
          echo 'PROD_DEPLOYED=1' >> "$GITHUB_ENV"
      - name: Allow Cloudflare edge deployment propagation
        run: sleep 30
      - name: Verify calculation routing on production
        env:
          TARGET_WORKER: ${{ env.PRODUCTION }}
        run: node studio-edge/tests/auto-math-live.mjs
      - name: Rollback previous verified Worker if production verification fails
        if: ${{ failure() && env.PROD_DEPLOYED == '1' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous
          git show 69e14541e6c32f2afe9657dffa5235ad4ea2b7aa:studio-edge/worker.mjs > /tmp/previous/worker.mjs
          git show 69e14541e6c32f2afe9657dffa5235ad4ea2b7aa:studio-edge/math.mjs > /tmp/previous/math.mjs
          git show 69e14541e6c32f2afe9657dffa5235ad4ea2b7aa:studio-edge/wrangler.jsonc > /tmp/previous/wrangler.jsonc
          npx -y wrangler@4.129.0 deploy --config /tmp/previous/wrangler.jsonc
