name: MUSITU Edge Isolated Cloudflare Inventory

on:
  push:
    branches: [feature/musitu-edge-capacity-20261019]
    paths:
      - .github/workflows/musitu-edge-capacity-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify secret presence without printing it
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Required token not connected'; exit 1; }
      - name: Inspect isolated D1 resources without mutation
        run: |
          set -euo pipefail
          npx -y wrangler@4.129.0 d1 list --json > /tmp/musitu_d1_list.json
          node --input-type=module -e "
            import fs from 'node:fs';
            const dbs=JSON.parse(fs.readFileSync('/tmp/musitu_d1_list.json','utf8'));
            console.log('Cloudflare D1 resource count:',dbs.length);
            console.log('MUSITU edge usage DB already exists:',dbs.some(x=>x.name==='musitu-intelligence-usage'));
            console.log('D1 free-tier safe capacity, assuming Free plan and no concurrent DB creations:', dbs.length<10);
          "
