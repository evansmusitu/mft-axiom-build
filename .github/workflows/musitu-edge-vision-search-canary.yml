name: MUSITU Live Image and Internet Tools Canary

on:
  push:
    branches: [feature/musitu-live-web-image-kimi-20261020]
    paths:
      - studio-edge/**
      - .github/workflows/musitu-edge-vision-search-canary.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-edge-vision-search-canary
  cancel-in-progress: false

jobs:
  qualify-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CANARY: https://musitu-intelligence-edge-capacity-canary-20261019.mft-education-nexus-93f395f5.workers.dev
      PRODUCTION: https://musitu-intelligence-edge-20261019.mft-education-nexus-93f395f5.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify image, source, Kimi billing and existing model gates
        run: |
          set -euo pipefail
          node --check studio-edge/worker.mjs
          node --check studio-edge/vision-search.mjs
          node --check studio-edge/kimi.mjs
          node --test studio-edge/tests/*.test.mjs
      - name: Confirm existing Cloudflare token without revealing it
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Deploy isolated canary Worker only
        run: npx -y wrangler@4.129.0 deploy --config studio-edge/wrangler.canary.jsonc
      - name: Verify real canary AI, live encyclopedia, and generated image
        env:
          TARGET_WORKER: ${{ env.CANARY }}
        run: node studio-edge/tests/live-smoke.mjs
      - name: Promote only after canary verified
        run: |
          set -euo pipefail
          npx -y wrangler@4.129.0 deploy --config studio-edge/wrangler.jsonc
          echo 'PROD_DEPLOYED=1' >> "$GITHUB_ENV"
      - name: Verify production live tools and no unapproved Kimi request
        env:
          TARGET_WORKER: ${{ env.PRODUCTION }}
        run: node studio-edge/tests/live-smoke.mjs
      - name: Roll back pinned previously verified Worker after failed production qualification
        if: ${{ failure() && env.PROD_DEPLOYED == '1' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/musitu-vision-rollback
          git show efda4fe844cd50e8a73ceefff7fcd2cb8a3b609e:studio-edge/worker.mjs > /tmp/musitu-vision-rollback/worker.mjs
          git show efda4fe844cd50e8a73ceefff7fcd2cb8a3b609e:studio-edge/math.mjs > /tmp/musitu-vision-rollback/math.mjs
          git show efda4fe844cd50e8a73ceefff7fcd2cb8a3b609e:studio-edge/wrangler.jsonc > /tmp/musitu-vision-rollback/wrangler.jsonc
          npx -y wrangler@4.129.0 deploy --config /tmp/musitu-vision-rollback/wrangler.jsonc
          echo 'Rolled back to last verified MUSITU Workers AI version'
