name: MUSITU GA historical live Worker patches must be manual-only
on:
  push:
    branches: ['fix/ga-legacy-worker-patch-manual-only-20261029','main']
    paths:
      - '.github/workflows/axiom-live-metering-durability-patch.yml'
      - '.github/workflows/axiom-live-request-id-propagation-patch.yml'
      - '.github/workflows/axiom-modal-edge-service-compat-patch.yml'
      - '.github/workflows/axiom-metering-identity-diagnostic.yml'
      - '.github/workflows/axiom-modal-adapter-repair-probe.yml'
      - '.github/workflows/axiom-modal-edge-transport-repair.yml'
      - '.github/workflows/axiom-kernel-exception-diagnostic.yml'
      - '.github/workflows/axiom-service-binding-runtime-shape.yml'
      - '.github/workflows/axiom-canonical-kernel-payload-capture.yml'
      - '.github/workflows/axiom-modal-adapter-exact-request-probe.yml'
      - '.github/workflows/cloudflare-service-fetch-signature-probe.yml'
      - '.github/workflows/axiom-modal-adapter-transport-diagnostic.yml'
      - '.github/workflows/axiom-service-binding-request-object-probe.yml'
      - 'tests/connect/test_ga_legacy_live_patch_guard.py'
      - '.github/workflows/musitu-ga-legacy-live-patch-guard.yml'
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/axiom-live-metering-durability-patch.yml'
      - '.github/workflows/axiom-live-request-id-propagation-patch.yml'
      - '.github/workflows/axiom-modal-edge-service-compat-patch.yml'
      - '.github/workflows/axiom-metering-identity-diagnostic.yml'
      - '.github/workflows/axiom-modal-adapter-repair-probe.yml'
      - '.github/workflows/axiom-modal-edge-transport-repair.yml'
      - '.github/workflows/axiom-kernel-exception-diagnostic.yml'
      - '.github/workflows/axiom-service-binding-runtime-shape.yml'
      - '.github/workflows/axiom-canonical-kernel-payload-capture.yml'
      - '.github/workflows/axiom-modal-adapter-exact-request-probe.yml'
      - '.github/workflows/cloudflare-service-fetch-signature-probe.yml'
      - '.github/workflows/axiom-modal-adapter-transport-diagnostic.yml'
      - '.github/workflows/axiom-service-binding-request-object-probe.yml'
      - 'tests/connect/test_ga_legacy_live_patch_guard.py'
      - '.github/workflows/musitu-ga-legacy-live-patch-guard.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-no-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prohibit automatic historical Cloudflare Worker patches
        run: python -m unittest tests.connect.test_ga_legacy_live_patch_guard -v
      - name: Preserve full commercial customer admission closed
        run: |
          python qualification/validate_commercial_ga.py --audit
          if python qualification/validate_commercial_ga.py --enforce-ready; then
            echo 'Unexpected commercial release promotion' >&2
            exit 1
          fi
          echo 'GA=BLOCKED'
