      - '.github/workflows/axiom-musitu-modal-backend-cutover.yml'
      - '.github/workflows/axiom-musitu-stage-domain-cutover.yml'
      - '.github/workflows/axiom-plugin-gate-v4-cutover-v2.yml'
      - '.github/workflows/axiom-plugin-gate-v4-cutover-v3.yml'
      - '.github/workflows/axiom-plugin-gate-v4-cutover.yml'
      - '.github/workflows/axiom-mcp-auth-metering-e2e.yml'
      - 'tests/connect/test_ga_privileged_deploy_workflows.py'
      - '.github/workflows/musitu-ga-privileged-deploy-safety.yml'
permissions:
  contents: read
jobs:
  test-nonprivileged:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed-branch-only manual privileged workflows
        run: python -m unittest tests.connect.test_ga_privileged_deploy_workflows -v
      - name: Verify full commercial GA remains blocked
        run: |
          python qualification/validate_commercial_ga.py --audit
          if python qualification/validate_commercial_ga.py --enforce-ready; then
            echo 'Unexpected commercial GA enablement' >&2
            exit 1
          fi
          echo 'GA=STILL_BLOCKED'
