name: MUSITU GA privileged billing workflow safety (non-enabling)
on:
  push:
    branches: ['fix/ga-privileged-workflows-manual-only-20261029', 'main']
    paths:
      - '.github/workflows/axiom-real-money-certification-reconcile.yml'
      - '.github/workflows/axiom-billing-disposable-checkout-e2e.yml'
      - '.github/workflows/axiom-billing-commercial-enable.yml'
      - '.github/workflows/axiom-billing-ingress-production-deploy.yml'
      - '.github/workflows/axiom-billing-checkout-intents-migration.yml'
      - '.github/workflows/axiom-billing-status-contract-patch.yml'
      - '.github/workflows/axiom-billing-checkout-persistence-diagnostic.yml'
      - '.github/workflows/axiom-customer-bearer-compute-metering-e2e-v3.yml'
      - '.github/workflows/axiom-production-customer-bearer-compute-metering-e2e.yml'
      - 'tests/connect/test_privileged_billing_workflows.py'
      - '.github/workflows/musitu-ga-privileged-workflow-safety.yml'
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/axiom-real-money-certification-reconcile.yml'
      - '.github/workflows/axiom-billing-disposable-checkout-e2e.yml'
      - '.github/workflows/axiom-billing-commercial-enable.yml'
      - '.github/workflows/axiom-billing-ingress-production-deploy.yml'
      - '.github/workflows/axiom-billing-checkout-intents-migration.yml'
      - '.github/workflows/axiom-billing-status-contract-patch.yml'
      - '.github/workflows/axiom-billing-checkout-persistence-diagnostic.yml'
      - '.github/workflows/axiom-customer-bearer-compute-metering-e2e-v3.yml'
      - '.github/workflows/axiom-production-customer-bearer-compute-metering-e2e.yml'
      - 'tests/connect/test_privileged_billing_workflows.py'
      - '.github/workflows/musitu-ga-privileged-workflow-safety.yml'
permissions:
  contents: read
jobs:
  test-offline-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prevent automatic real-money and deployment workflow execution
        run: python -m unittest tests.connect.test_privileged_billing_workflows -v
      - name: Preserve commercial release fail-closed state
        run: |
          python qualification/validate_commercial_ga.py --audit
          if python qualification/validate_commercial_ga.py --enforce-ready; then
            echo 'Unexpected commercial admission qualification' >&2
            exit 1
          fi
          echo 'COMMERCIAL_GA=BLOCKED'
