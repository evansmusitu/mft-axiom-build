name: MUSITU Intelligence Edge Cloudflare (isolated)

on:
  push:
    branches: [feature/musitu-intelligence-edge-isolated-20261019]
    paths:
      - studio-edge/**
      - .github/workflows/musitu-intelligence-edge-isolated.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-isolated-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check worker syntax without running inference
        run: node --check studio-edge/worker.mjs
      - name: Confirm secured Cloudflare auth is configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Using repository token secret'
            echo 'CLOUDFLARE_EMAIL=' >> "$GITHUB_ENV"
            echo 'CLOUDFLARE_API_KEY=' >> "$GITHUB_ENV"
          elif [ -n "$CLOUDFLARE_EMAIL" ] && [ -n "$CLOUDFLARE_API_KEY" ]; then
            echo 'Using existing secure Cloudflare account credential pair'
          else
            echo 'Cloudflare connection unavailable; no deployment attempted'
            exit 1
          fi
      - name: Deploy ONLY the isolated edge Worker
        run: |
          set -euo pipefail
          npx -y wrangler@4.129.0 deploy --config studio-edge/wrangler.jsonc
