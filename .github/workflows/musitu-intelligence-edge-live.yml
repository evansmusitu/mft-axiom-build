name: MUSITU Intelligence Edge Live Acceptance

on:
  push:
    branches: [feature/musitu-intelligence-edge-isolated-20261019]
    paths:
      - tests/musitu-intelligence-edge-live.mjs
      - .github/workflows/musitu-intelligence-edge-live.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify endpoint security, CORS and real Cloudflare AI inference
        run: node tests/musitu-intelligence-edge-live.mjs
