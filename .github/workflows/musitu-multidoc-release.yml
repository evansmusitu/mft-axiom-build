name: MUSITU Multi-Document Evidence Canary Release

on:
  push:
    branches: [feature/musitu-multidoc-evidence-20261020]
    paths:
      - studio-edge/**
      - .github/workflows/musitu-multidoc-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-multidoc-release
  cancel-in-progress: false

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CANARY: https://musitu-intelligence-edge-capacity-canary-20261019.mft-education-nexus-93f395f5.workers.dev
      PRODUCTION: https://musitu-intelligence-edge-20261019.mft-education-nexus-93f395f5.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete syntax and regression test suite
        run: |
          set -euo pipefail
          node --check studio-edge/worker.mjs
          node --check studio-edge/document-evidence.mjs
          node --test studio-edge/tests/*.test.mjs
      - name: Confirm existing secure Cloudflare authentication
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Deploy canary only
        run: npx -y wrangler@4.129.0 deploy --config studio-edge/wrangler.canary.jsonc
      - name: Verify PDF file metadata and live dual-document analysis on canary
        env:
          TARGET_WORKER: ${{ env.CANARY }}
        run: node studio-edge/tests/multidoc-live.mjs
      - name: Promote passing Worker to production
        run: |
          set -euo pipefail
          npx -y wrangler@4.129.0 deploy --config studio-edge/wrangler.jsonc
          echo 'PRODUCTION_TOUCHED=1' >> "$GITHUB_ENV"
      - name: Verify production live multi-document analysis
        env:
          TARGET_WORKER: ${{ env.PRODUCTION }}
        run: node studio-edge/tests/multidoc-live.mjs
      - name: Restore previously verified production Worker on failed acceptance
        if: ${{ failure() && env.PRODUCTION_TOUCHED == '1' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/musitu-previous
          for file in worker.mjs research.mjs citations.mjs math.mjs scholar.mjs wrangler.jsonc; do
            git show 2cf7eb8742bf08be260150e177122aee0348cd46:studio-edge/$file > /tmp/musitu-previous/$file
          done
          npx -y wrangler@4.129.0 deploy --config /tmp/musitu-previous/wrangler.jsonc
          echo 'Previous verified Worker restored'
