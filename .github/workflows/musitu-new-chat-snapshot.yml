name: MUSITU Axiom New Chat Control Snapshot

on:
  push:
    paths:
      - '.github/workflows/musitu-new-chat-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build clean control-plane snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, zipfile, hashlib, json, subprocess
          root=pathlib.Path('.')
          out=pathlib.Path('MUSITU_AXIOM_CONTROL_PLANE_CURRENT_20260905.zip')
          exclude={'.git','.github/workflows/musitu-new-chat-snapshot.yml'}
          files=[]
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
            if not raw: continue
            p=pathlib.Path(raw.decode())
            if str(p) in exclude or '.git' in p.parts: continue
            if p.is_file(): files.append(p)
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for p in files: z.write(p,p.as_posix())
          h=hashlib.sha256(out.read_bytes()).hexdigest()
          meta={
            'schema':'musitu.axiom.new_chat_control_snapshot.v1',
            'brand':'MUSITU',
            'repository':'evansmusitu/mft-axiom-build',
            'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'file_count':len(files),
            'zip_sha256':h,
            'proprietary_plaintext_source_in_public_repo':False,
          }
          pathlib.Path('MUSITU_AXIOM_CONTROL_PLANE_CURRENT_20260905.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          print(json.dumps(meta,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-control-plane-current
          path: |
            MUSITU_AXIOM_CONTROL_PLANE_CURRENT_20260905.zip
            MUSITU_AXIOM_CONTROL_PLANE_CURRENT_20260905.json
          retention-days: 14
          if-no-files-found: error
