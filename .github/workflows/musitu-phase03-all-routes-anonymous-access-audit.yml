name: MUSITU Phase03 All 49 Routes Protected Preview Anonymous Access Audit

on:
  push:
    branches:
      - ops/corporate-bing-sitemap-readonly-20261109
    paths:
      - .github/workflows/musitu-phase03-all-routes-anonymous-access-audit.yml

permissions:
  contents: read

jobs:
  protected-content-leak-audit:
    if: ${{ github.repository == 'evansmusitu/mft-axiom-build' && github.ref == 'refs/heads/ops/corporate-bing-sitemap-readonly-20261109' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check every approved route and sensitive review asset from outside Cloudflare Access
        shell: bash
        run: |
          set -euo pipefail
          set +x
          git clone -q --depth=1 --branch phase03-global-discovery-20261107 https://github.com/evansmusitu/evansmusitu.github.io.git /tmp/musitu-49-denial-audit
          test "$(git -C /tmp/musitu-49-denial-audit rev-parse HEAD)" = "4c4489e569a4abbef97cf16614439478f756667b"
          python3 - <<'PY'
          """No provider mutations; no private URLs, email addresses, or API response bodies in receipts."""
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.parse import urlsplit
          import os, sys, urllib.request, urllib.error, json

          sys.path.insert(0,"/tmp/musitu-49-denial-audit/corporate/scripts")
          from seo import read_catalog
          from phase03_publication import approved_sources,article_routes,FR_EN

          core=set(read_catalog()["routes"])
          french=set(FR_EN)
          articles=set(article_routes(approved_sources()))
          page_routes=core|french|articles|{"/404/"}
          if not (len(core)==33 and len(french)==3 and len(articles)==12 and len(page_routes)==49):
              raise SystemExit("HOLD: changed exact-source protected review route cohort")
          sampled_assets={"/robots.txt","/manifest.json","/assets/site.js",
              "/assets/site-data.js","/assets/studio-demo-82s.mp4","/assets/studio-poster.png"}
          routes=sorted(page_routes|sampled_assets|{"/__musitu-preview-protection-negative-20261110/"})
          account="93f395f5121954671f92fffa453d6b61"
          key=os.getenv("CLOUDFLARE_API_TOKEN","").strip()
          if not key:raise SystemExit("HOLD: Cloudflare read-only token unavailable")
          project_url="https://api.cloudflare.com/client/v4/accounts/"+account+"/pages/projects/musitu-corporate"
          def cloudflare(path):
              if path not in ("","/deployments?per_page=10"):
                  raise SystemExit("HOLD: provider endpoint not in GET allowlist")
              req=urllib.request.Request(project_url+path,method="GET",headers={
                  "Authorization":"Bearer "+key,"Accept":"application/json",
                  "User-Agent":"MUSITU-All49-Anonymous-Denial/1.0"})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      if r.status!=200:raise SystemExit("HOLD: unexpected Cloudflare HTTP status")
                      blob=r.read(500001)
              except urllib.error.HTTPError as e:
                  raise SystemExit("HOLD: Cloudflare GET refused HTTP "+str(e.code)) from None
              except (urllib.error.URLError,TimeoutError):
                  raise SystemExit("HOLD: Cloudflare GET network failure") from None
              if len(blob)>500000:raise SystemExit("HOLD: provider data size exceeded")
              try:obj=json.loads(blob)
              except (ValueError,UnicodeError):
                  raise SystemExit("HOLD: malformed Cloudflare response") from None
              if not isinstance(obj,dict) or obj.get("success") is not True:
                  raise SystemExit("HOLD: Cloudflare provider success not established")
              return obj.get("result")
          p=cloudflare("")
          current=(p.get("canonical_deployment") or {}) if isinstance(p,dict) else {}
          current_sha=((current.get("deployment_trigger") or {}).get("metadata") or {}).get("commit_hash")
          if (not isinstance(p,dict) or p.get("name")!="musitu-corporate" or
                  p.get("production_branch")!="main" or
                  "mftintelligence.com" not in p.get("domains",[]) or
                  current.get("environment")!="production" or
                  (current.get("latest_stage") or {}).get("status")!="success" or
                  current_sha!="6b1643ab2d3b03628104b617435db1d364076aa9"):
              raise SystemExit("HOLD: corporate production identity drift")
          result=cloudflare("/deployments?per_page=10")
          if not isinstance(result,list):raise SystemExit("HOLD: Pages deployments list unavailable")
          matches=[d for d in result if isinstance(d,dict)
                  and d.get("environment")=="preview"
                  and ((d.get("deployment_trigger") or {}).get("metadata") or {}).get("commit_hash")=="4c4489e569a4abbef97cf16614439478f756667b"]
          if len(matches)!=1 or (matches[0].get("latest_stage") or {}).get("status")!="success":
              raise SystemExit("HOLD: exact successful Phase03 protected preview not uniquely identified")
          d=matches[0]
          raw_hosts=[d.get("url")]+(d.get("aliases") or [])
          hosts=[]
          for value in raw_hosts:
              if not isinstance(value,str) or not value:continue
              normalized=value if "://" in value else "https://"+value
              parsed=urlsplit(normalized)
              if parsed.scheme!="https" or not parsed.hostname or not parsed.hostname.endswith(".musitu-corporate.pages.dev"):
                  raise SystemExit("HOLD: preview alias outside expected Cloudflare project")
              if parsed.path not in ("","/") or parsed.username or parsed.password or parsed.query:
                  raise SystemExit("HOLD: unsafe preview alias")
              hosts.append("https://"+parsed.hostname)
          hosts=sorted(set(hosts))
          if not hosts:raise SystemExit("HOLD: no valid candidate preview hostname")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  return None
          opener=urllib.request.build_opener(NoRedirect)
          def probe(task):
              host,route=task
              req=urllib.request.Request(host+route,method="GET",headers={
                  "User-Agent":"MUSITU-Anonymous-Preview-Disclosure-Test/1.0",
                  "Accept":"text/html,application/json,*/*"})
              try:
                  with opener.open(req,timeout=20) as resp:
                      status=resp.status;header=resp.headers;body=resp.read(150001)
              except urllib.error.HTTPError as exc:
                  status=exc.code;header=exc.headers;body=exc.read(150001)
              except (urllib.error.URLError,TimeoutError):
                  raise RuntimeError("Preview anonymous access outcome not observed")
              if len(body)>150000:
                  raise RuntimeError("Preview returned excessive response to unauthenticated visitor")
              if status in (401,403):
                  return "denied"
              if status in (301,302,303,307,308):
                  location=header.get("Location","")
                  url=urlsplit(location)
                  if ((url.scheme=="https" and url.hostname and url.hostname.endswith(".cloudflareaccess.com"))
                       or (location.startswith("/cdn-cgi/access/"))):
                      return "access_redirect"
                  raise RuntimeError("Anonymous visitor redirected outside Access policy")
              if status==200:
                  low=body.lower()
                  # A 200 Access login/interstitial may be returned at some edges.
                  if (b"cloudflare access" in low and b"<main id=\"main\"" not in low
                      and b"window.musitu_public" not in low
                      and b"phase03-article" not in low
                      and b"<html lang=\"fr\"" not in low):
                      return "access_interstitial"
                  raise RuntimeError("Publicly retrievable content at an expected private preview path")
              raise RuntimeError("Unexpected anonymous status")
          work=[(host,route) for host in hosts for route in routes]
          with ThreadPoolExecutor(max_workers=10) as pool:
              outcomes=list(pool.map(probe,work))
          if len(outcomes)!=len(work):raise SystemExit("HOLD: unauthenticated probe coverage incomplete")
          print("EXACT-SHA PROTECTED PREVIEW DEPLOYMENT: PASS")
          print("PRODUCTION 404 MAINTENANCE: unchanged")
          print("APPROVED REVIEW PAGE PATHS TESTED:",len(page_routes))
          print("REVIEW ASSETS PLUS NEGATIVE PATHS TESTED:",len(routes)-len(page_routes))
          print("CLOUDFLARE REVIEW HOST ALIASES TESTED:",len(hosts))
          print("TOTAL ANONYMOUS ACCESS REQUESTS:",len(work))
          print("ANONYMOUS REQUESTS DENIED OR SENT TO CLOUDFLARE ACCESS:",len(outcomes))
          print("UNAUTHENTICATED REVIEW CONTENT LEAKS: 0")
          print("CLOUDFLARE API: 2 GET, 0 writes")
          print("PHASE03 PRODUCTION AND GOOGLE/BING 48-URL SUBMISSIONS: NOT PERFORMED")
          print("REVIEW HOSTNAMES, POLICY CONTENT AND PERSONAL DATA: NOT LOGGED")
          PY
