name: MUSITU Production Domain Status Readonly 20261106
on:
  push:
    branches:
      - audit/musitu-corporate-cloudflare-readonly-20261103
    paths:
      - .github/workflows/musitu-production-domain-status-20261106.yml
permissions: {}
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: "93f395f5121954671f92fffa453d6b61"
      ZONE: "5b56528f03948ff5917a5e0cd9f7109e"
      PROJECT: "musitu-corporate"
    steps:
      - name: Read Pages domain validation and web DNS only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          token=os.environ['CF_TOKEN'];a=os.environ['ACCOUNT'];z=os.environ['ZONE'];p=os.environ['PROJECT']
          h={'Authorization':'Bearer '+token,'Accept':'application/json'}
          base='https://api.cloudflare.com/client/v4'
          for name in ('mftintelligence.com','www.mftintelligence.com'):
              with urllib.request.urlopen(urllib.request.Request(f'{base}/accounts/{a}/pages/projects/{p}/domains/{name}',headers=h),timeout=20) as r:b=json.load(r)
              x=b.get('result') or {}
              print('domain',name,'status=',x.get('status'),'validation=',json.dumps(x.get('validation_data'),sort_keys=True),'verification=',json.dumps(x.get('verification_data'),sort_keys=True),'ca=',x.get('certificate_authority'))
              with urllib.request.urlopen(urllib.request.Request(f'{base}/zones/{z}/dns_records?'+urllib.parse.urlencode({'name':name,'per_page':100}),headers=h),timeout=20) as r:d=json.load(r)
              print('web_dns',name,json.dumps([{'type':q.get('type'),'name':q.get('name'),'content':q.get('content'),'proxied':q.get('proxied')} for q in d.get('result',[]) if q.get('type') in ('A','AAAA','CNAME')],sort_keys=True))
          PY
