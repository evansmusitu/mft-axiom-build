name: MUSITU Provision Exact Safe Contract

on:
  push:
    paths:
      - '.github/workflows/musitu-provision-exact-safe-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct protected source
        env:
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          P=deploy_payload/runtime_min
          cat "$P/chunk_00.b64" "$P/chunk_01_02.b64" "$P/chunk_03_04.b64" "$P/chunk_05_06.b64" "$P/chunk_07_08.b64" "$P/chunk_09.b64" > runtime.enc.b64
          base64 -d runtime.enc.b64 > runtime.tar.gz.enc
          test "$(sha256sum runtime.tar.gz.enc | awk '{print $1}')" = 'b82448d6b4b34b302748815af976b535d69922c197d4b7a9056fc2f91a9e12cf'
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in runtime.tar.gz.enc -out runtime.tar.gz -pass env:CLOUDFLARE_GLOBAL_API_KEY
          test "$(sha256sum runtime.tar.gz | awk '{print $1}')" = 'b4d5a0266446523969a619f5e9bb5a04d9b815c78a2ab82ed046ef5e23d53663'
          mkdir runtime && tar -xzf runtime.tar.gz -C runtime
      - name: Emit exact safe provisioning contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re
          src='\n'.join(p.read_text(errors='replace') for p in pathlib.Path('runtime/worker/src').glob('*.js'))

          def body(name):
              m=re.search(r'(?:export\s+)?(?:async\s+)?function\s+'+re.escape(name)+r'\s*\([^)]*\)\s*\{',src)
              if not m:return ''
              st=m.end()-1;d=0;q=None;e=False
              for i in range(st,len(src)):
                  c=src[i]
                  if q:
                      if e:e=False
                      elif c=='\\':e=True
                      elif c==q:q=None
                      continue
                  if c in "'\"\`":q=c;continue
                  if c=='{':d+=1
                  elif c=='}':
                      d-=1
                      if d==0:return src[st+1:i]
              return ''

          def json_fields(name):
              b=body(name)
              roots=set()
              # await request.json(), await parseJson(request), parseJson(request)
              for pat in [
                  r'\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*await\s+request\.json\s*\(',
                  r'\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*await\s+parseJson\s*\(\s*request',
                  r'\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*parseJson\s*\(\s*request',
              ]:
                  roots.update(re.findall(pat,b))
              fields=set()
              for root in roots:
                  # root.foo, root.value.foo, root.data.foo, root.body.foo
                  for m in re.finditer(r'\b'+re.escape(root)+r'\.(?:value\.|data\.|body\.)?([A-Za-z_$][\w$]*)\b',b):
                      x=m.group(1)
                      if x not in {'ok','error','value','data','body'}: fields.add(x)
                  # destructuring from root or root.value/data/body
                  for m in re.finditer(r'\{([^{}]{1,300})\}\s*=\s*'+re.escape(root)+r'(?:\.(?:value|data|body))?',b):
                      for x in re.findall(r'\b([A-Za-z_$][\w$]*)\b',m.group(1)):
                          if x not in {'const','let','var'}: fields.add(x)
              # Validation-related string literals; no secret values.
              literals=sorted(set(x for x in re.findall(r'["\']([^"\']{1,100})["\']',b)
                                  if re.search(r'required|invalid|email|name|plan|label|customer|active|forbidden',x,re.I)))
              return {'parse_roots_count':len(roots),'json_fields':sorted(fields),'validation_literals':literals}

          def insert_columns(table,name):
              b=body(name)
              cols=[]
              for m in re.finditer(r'INSERT\s+INTO\s+'+re.escape(table)+r'\s*\(([^)]+)\)',b,re.I|re.S):
                  cols += [x.strip().strip('"`[]') for x in m.group(1).split(',')]
              return sorted(set(x for x in cols if re.match(r'^[A-Za-z_][A-Za-z0-9_]*$',x)))

          def return_keys(name):
              b=body(name); sets=[]
              for m in re.finditer(r'(?:return\s+)?(?:json\s*\(\s*)?\{([^{}]{0,1800})\}',b,re.S):
                  ks=sorted(set(re.findall(r'(?:^|[,\n]\s*)([A-Za-z_$][\w$]*)\s*:',m.group(1))))
                  if ks: sets.append(ks)
              return sets

          out={
            'schema':'musitu.axiom.provision_exact_safe_contract.v1',
            'adminCreateCustomer':{
              **json_fields('adminCreateCustomer'),
              'insert_columns':insert_columns('customers','adminCreateCustomer'),
              'return_object_key_sets':return_keys('adminCreateCustomer'),
            },
            'adminIssueKey':{
              **json_fields('adminIssueKey'),
              'return_object_key_sets':return_keys('adminIssueKey'),
            },
            'issueKey':{
              'insert_columns':insert_columns('api_keys','issueKey'),
              'return_object_key_sets':return_keys('issueKey'),
            },
            'routes':{
              'create_customer':{'method':'POST','path':'/v1/admin/customers'},
              'issue_key':{'method':'POST','path':'/v1/admin/customers/{customerId}/keys'},
              'rotate_key':{'method':'POST','path':'/v1/admin/keys/{keyId}/rotate'},
              'revoke_key':{'method':'POST','path':'/v1/admin/keys/{keyId}/revoke'},
            },
            'admin_auth':{'header':'x-musitu-control','live_validation_already_proven':True},
            'plaintext_source_committed':False,
          }
          print(json.dumps(out,sort_keys=True))
          PY
