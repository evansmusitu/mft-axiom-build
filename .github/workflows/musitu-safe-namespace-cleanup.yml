name: MUSITU Safe Namespace Cleanup

on:
  push:
    paths:
      - '.github/workflows/musitu-safe-namespace-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build safe MUSITU namespace cleanup blob map
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections,json,os,pathlib,re,subprocess,urllib.request,urllib.error

          helper=pathlib.Path('.github/workflows/musitu-safe-namespace-cleanup.yml')
          protected_runtime=pathlib.Path('deploy_payload/runtime_min')
          binary={'.zip','.gz','.tgz','.png','.jpg','.jpeg','.gif','.webp','.pdf','.pyc','.so','.dll','.exe','.bin','.enc'}

          # These are known currently-live or identity-bearing external handles. They must be
          # migrated by recreate/verify/cutover, not by textual substitution.
          protected_axiom_handles={
            'mft-axiom-build',
            'mft-axiom-bootstrap',
            'mft-axiom-prod',
            'mft-axiom-production',
            'mft-axiom-modal-edge-stage',
            'mft-axiom-v3-modal-staging',
            'mft-axiom-modal-adapter',
            'mft-axiom-staging',
            'mft-axiom-staging-kernel',
          }
          token_re=re.compile(r'(?<![A-Za-z0-9_-])(mft-axiom-[a-z0-9_-]+)')

          def is_text(p):
            if p.suffix.lower() in binary:return False
            try:b=p.read_bytes()
            except OSError:return False
            if b'\0' in b:return False
            try:b.decode('utf-8');return True
            except UnicodeDecodeError:return False

          tracked=[pathlib.Path(x.decode()) for x in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if x]
          changed=[]; replacement_counts=collections.Counter(); protected_seen=collections.Counter()
          for p in tracked:
            if p==helper or p==protected_runtime or protected_runtime in p.parents or not p.is_file() or not is_text(p):continue
            text=p.read_text(encoding='utf-8'); original=text

            def repl(m):
              tok=m.group(1)
              if tok in protected_axiom_handles:
                protected_seen[tok]+=1
                return tok
              new='musitu-axiom-'+tok[len('mft-axiom-'):]
              replacement_counts[f'{tok} -> {new}']+=1
              return new
            text=token_re.sub(repl,text)

            # Local runner paths are not external contracts.
            n=text.count('/tmp/mft-control-secret')
            if n: replacement_counts['/tmp/mft-control-secret -> /tmp/musitu-control-secret']+=n; text=text.replace('/tmp/mft-control-secret','/tmp/musitu-control-secret')
            n=text.count('/tmp/mft-receipt-secret')
            if n: replacement_counts['/tmp/mft-receipt-secret -> /tmp/musitu-receipt-secret']+=n; text=text.replace('/tmp/mft-receipt-secret','/tmp/musitu-receipt-secret')

            # The canonical manifest must not itself keep the retired token as a brand value.
            if p==pathlib.Path('branding/MUSITU_BRAND_CANONICAL.json'):
              try:
                obj=json.loads(text)
                obj['deprecated_company_brand']='RETIRED_THREE_LETTER_NAMESPACE'
                obj['legacy_identifier_policy']='Retired namespace strings may remain only as exact live compatibility handles or immutable historical evidence until verified resource cutover.'
                text=json.dumps(obj,indent=2,sort_keys=True)+'\n'
              except Exception as e:
                raise SystemExit(f'canonical brand manifest parse failed: {type(e).__name__}')

            if text!=original:
              p.write_text(text,encoding='utf-8');changed.append(str(p))

          subprocess.check_call(['git','diff','--check'])
          if not changed: raise SystemExit('Fail-closed: expected safe namespace changes, found none')

          # Build content-addressed blobs but do not move main from this workflow.
          api=os.environ.get('GITHUB_API_URL','https://api.github.com');repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GH_TOKEN'];branch=os.environ.get('GITHUB_REF_NAME','main')
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'MUSITU-Safe-Namespace-Cleanup'}
          def call(method,path,payload=None):
            data=None if payload is None else json.dumps(payload).encode();req=urllib.request.Request(api+path,headers=headers,data=data,method=method)
            try:
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
            except urllib.error.HTTPError as e:raise SystemExit(f'GitHub API {method} {path} failed HTTP {e.code}: {e.read().decode(errors="replace")[:500]}')
          ref=call('GET',f'/repos/{repo}/git/ref/heads/{branch}');parent=ref['object']['sha'];pc=call('GET',f'/repos/{repo}/git/commits/{parent}');base_tree=pc['tree']['sha']
          entries=[]
          for name in sorted(changed):
            blob=call('POST',f'/repos/{repo}/git/blobs',{'content':pathlib.Path(name).read_text(encoding='utf-8'),'encoding':'utf-8'})
            entries.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          evidence={'schema':'musitu.brand.safe_namespace_cleanup.v1','status':'PASS','parent_sha':parent,'base_tree_sha':base_tree,'tree_entries':entries,'changed_file_count':len(changed),'changed_files':sorted(changed),'replacement_counts':dict(sorted(replacement_counts.items())),'protected_axiom_handles':sorted(protected_axiom_handles),'protected_handle_occurrences':dict(sorted(protected_seen.items())),'protected_encrypted_runtime':str(protected_runtime),'plaintext_proprietary_source_exposed':False}
          pathlib.Path('musitu-safe-namespace-cleanup-map.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print('MUSITU_PARENT_SHA='+parent)
          print('MUSITU_BASE_TREE_SHA='+base_tree)
          print('MUSITU_TREE_ENTRIES_JSON='+json.dumps(entries,separators=(',',':')))
          print('MUSITU_CLEANUP_SUMMARY='+json.dumps({'changed_file_count':len(changed),'replacement_total':sum(replacement_counts.values()),'protected_handle_occurrences':dict(sorted(protected_seen.items()))},sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-safe-namespace-cleanup-map
          path: musitu-safe-namespace-cleanup-map.json
          retention-days: 7
          if-no-files-found: error
