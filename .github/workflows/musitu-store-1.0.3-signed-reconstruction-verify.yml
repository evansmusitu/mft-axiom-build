name: MUSITU Store 1.0.3 Signed Reconstruction Verify

on:
  push:
    branches: [musitu-store-native-install-handoff-20260911]
    paths:
      - 'store/phase2/reproducibility/store-1.0.3/**'
      - '.github/workflows/musitu-store-1.0.3-signed-reconstruction-verify.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UNSIGNED_RUN_ID: '34631798237'
      UNSIGNED_ARTIFACT_NAME: musitu-store-1.0.3-unsigned
      EXPECTED_UNSIGNED_SHA: fabb197b0ffeac6c69041a93aa3fc9023dccd841758f817ffd28b7dacdf2559f
      EXPECTED_UNSIGNED_BYTES: '1677040'
      EXPECTED_SIGNED_SHA: 9bbb97b928fcd9130a84f333f3ffe48f3829edec474ec19d18a36df289c36081
      EXPECTED_SIGNED_BYTES: '1692495'
      EXPECTED_CERT_SHA: 43695b6103d7ab57e89166c9a537f1810b7e33053e20332b1d4e7e2e1c612671
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install exact Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'build-tools;36.0.0'
      - name: Download pinned reproducible unsigned artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/musitu-v103-unsigned /tmp/musitu-v103-proof
          mkdir -p /tmp/musitu-v103-unsigned /tmp/musitu-v103-proof
          gh run download "$UNSIGNED_RUN_ID" -n "$UNSIGNED_ARTIFACT_NAME" -D /tmp/musitu-v103-unsigned
          test "$(sha256sum /tmp/musitu-v103-unsigned/MUSITU_Store_1.0.3_UNSIGNED.apk | awk '{print $1}')" = "$EXPECTED_UNSIGNED_SHA"
          test "$(stat -c '%s' /tmp/musitu-v103-unsigned/MUSITU_Store_1.0.3_UNSIGNED.apk)" = "$EXPECTED_UNSIGNED_BYTES"
          echo MUSITU_STORE_1_0_3_PINNED_UNSIGNED=PASS
      - name: Reconstruct canonical signed Store APK without private signing material
        shell: bash
        run: |
          set -euo pipefail
          chmod +x /tmp/musitu-v103-unsigned/android-build-tools/apksigner
          python store/phase2/reproducibility/store-1.0.3/reconstruct_signed_apk.py \
            --unsigned /tmp/musitu-v103-unsigned/MUSITU_Store_1.0.3_UNSIGNED.apk \
            --output /tmp/musitu-v103-proof/MUSITU_Store_1.0.3_SIGNED.apk \
            --apksigner /tmp/musitu-v103-unsigned/android-build-tools/apksigner \
            | tee /tmp/musitu-v103-proof/reconstruction.log
          test "$(sha256sum /tmp/musitu-v103-proof/MUSITU_Store_1.0.3_SIGNED.apk | awk '{print $1}')" = "$EXPECTED_SIGNED_SHA"
          test "$(stat -c '%s' /tmp/musitu-v103-proof/MUSITU_Store_1.0.3_SIGNED.apk)" = "$EXPECTED_SIGNED_BYTES"
          grep -q 'MUSITU_STORE_1_0_3_SIGNED_RECONSTRUCTION=PASS' /tmp/musitu-v103-proof/reconstruction.log
      - name: Verify APK package version and signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/musitu-v103-proof/MUSITU_Store_1.0.3_SIGNED.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/musitu-v103-proof/aapt-badging.txt
          grep -Eq "package: name='com\.musitu\.store'.*versionCode='10003'.*versionName='1\.0\.3'" /tmp/musitu-v103-proof/aapt-badging.txt
          /tmp/musitu-v103-unsigned/android-build-tools/apksigner verify --verbose --print-certs "$APK" | tee /tmp/musitu-v103-proof/apksigner-verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/musitu-v103-proof/apksigner-verify.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/musitu-v103-proof/apksigner-verify.txt
          grep -q "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA" /tmp/musitu-v103-proof/apksigner-verify.txt
          python - <<'PY'
          import hashlib,json,os,pathlib
          apk=pathlib.Path('/tmp/musitu-v103-proof/MUSITU_Store_1.0.3_SIGNED.apk')
          raw=apk.read_bytes()
          proof={
            'schema':'musitu.store.v103.signed_reconstruction_ci.v1',
            'result':'PASS',
            'source_unsigned_run_id':int(os.environ['UNSIGNED_RUN_ID']),
            'unsigned_sha256':os.environ['EXPECTED_UNSIGNED_SHA'],
            'unsigned_bytes':int(os.environ['EXPECTED_UNSIGNED_BYTES']),
            'signed_sha256':hashlib.sha256(raw).hexdigest(),
            'signed_bytes':len(raw),
            'package_id':'com.musitu.store',
            'version_code':10003,
            'version_name':'1.0.3',
            'signing_certificate_sha256':os.environ['EXPECTED_CERT_SHA'],
            'private_signing_material_used_in_ci':False,
          }
          pathlib.Path('/tmp/musitu-v103-proof/proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          print('MUSITU_STORE_1_0_3_SIGNED_RECONSTRUCTION_CI=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-store-1.0.3-canonical-signed
          path: /tmp/musitu-v103-proof
          retention-days: 90
          if-no-files-found: error
