name: MUSITU Store 1.0.3 Unsigned Build

on:
  push:
    branches: [musitu-store-native-install-handoff-20260911]
    paths:
      - 'store/phase1/android-client/**'
      - '.github/workflows/musitu-store-1.0.3-unsigned-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify native handoff source contract
        shell: bash
        run: |
          set -euo pipefail
          python store/phase1/android-client/package_visibility_contract.py
          grep -q 'versionCode 10003' store/phase1/android-client/app/build.gradle
          grep -q "versionName '1.0.3'" store/phase1/android-client/app/build.gradle
          grep -q 'android:launchMode="singleTop"' store/phase1/android-client/app/src/main/AndroidManifest.xml
          grep -q 'onNewIntent' store/phase1/android-client/app/src/main/java/com/musitu/store/MainActivity.java
          grep -q 'musitustore' store/phase1/android-client/app/src/main/java/com/musitu/store/MainActivity.java
          grep -q 'resumePendingInstall' store/phase1/android-client/app/src/main/java/com/musitu/store/StoreCore.java
          grep -q 'canRequestPackageInstalls' store/phase1/android-client/app/src/main/java/com/musitu/store/StoreCore.java
          echo MUSITU_STORE_1_0_3_NATIVE_HANDOFF_SOURCE=PASS
      - name: Build unsigned release APK and export official signing tools
        working-directory: store/phase1/android-client
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/MUSITU_Store_1.0.3_UNSIGNED.apk"
          sha256sum "$GITHUB_WORKSPACE/MUSITU_Store_1.0.3_UNSIGNED.apk" | tee "$GITHUB_WORKSPACE/MUSITU_Store_1.0.3_UNSIGNED.sha256"
          mkdir -p "$GITHUB_WORKSPACE/android-build-tools/lib"
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" "$GITHUB_WORKSPACE/android-build-tools/apksigner"
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" "$GITHUB_WORKSPACE/android-build-tools/lib/apksigner.jar"
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" "$GITHUB_WORKSPACE/android-build-tools/zipalign"
          chmod +x "$GITHUB_WORKSPACE/android-build-tools/apksigner" "$GITHUB_WORKSPACE/android-build-tools/zipalign"
          "$GITHUB_WORKSPACE/android-build-tools/apksigner" --version
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-store-1.0.3-unsigned
          path: |
            MUSITU_Store_1.0.3_UNSIGNED.apk
            MUSITU_Store_1.0.3_UNSIGNED.sha256
            android-build-tools/apksigner
            android-build-tools/lib/apksigner.jar
            android-build-tools/zipalign
          retention-days: 30
          if-no-files-found: error
