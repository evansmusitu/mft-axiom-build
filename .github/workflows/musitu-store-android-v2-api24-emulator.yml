name: MUSITU Store isolated Android API24 V2 runtime qualification

on:
  push:
    branches:
      - feature/musitu-store-android-v2-verified-install-20261011
    paths:
      - '.github/workflows/musitu-store-android-v2-api24-emulator.yml'
      - 'store/phase1/android-client/app/build.gradle'
      - 'store/phase1/android-client/app/src/main/java/com/musitu/store/V2*.java'
      - 'store/phase1/android-client/app/src/androidTest/java/com/musitu/store/V2*.java'

permissions:
  contents: read

jobs:
  v2-api24-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare SDK and check non-production source isolation
        run: |
          set -euo pipefail
          test "$(git hash-object store/phase1/android-client/app/src/main/java/com/musitu/store/StoreCore.java)" = '395b488a7841cd5f32065cac9826983e0454d955'
          test "$(git hash-object store/phase1/android-client/app/src/main/java/com/musitu/store/MainActivity.java)" = 'd5ee6821877a151abfe95c50e8677b2f1b19ae5f'
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable Android emulator KVM where possible
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
      - name: Android API24 actual emulator runtime verification
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: gradle -p store/phase1/android-client --no-daemon :app:connectedDebugAndroidTest
      - name: Assert executed tests were reported
        run: |
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          files=glob.glob('store/phase1/android-client/app/build/outputs/androidTest-results/connected/**/*.xml',recursive=True)
          tests=failures=errors=0
          for file in files:
            try: root=ET.parse(file).getroot()
            except ET.ParseError: continue
            tests+=int(root.get('tests',0))
            failures+=int(root.get('failures',0))
            errors+=int(root.get('errors',0))
          assert tests>=3,(files,tests)
          assert failures==0 and errors==0,(tests,failures,errors)
          print(f'MUSITU_STORE_V2_API24_ANDROID_RUNTIME_PASS tests={tests} failures={failures} errors={errors}')
          PY
