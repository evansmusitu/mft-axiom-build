name: MUSITU Store isolated Android v2 verified install checks

on:
  push:
    branches:
      - feature/musitu-store-android-v2-verified-install-20261011
    paths:
      - '.github/workflows/musitu-store-android-v2-ci.yml'
      - 'store/phase1/android-client/app/build.gradle'
      - 'store/phase1/android-client/app/src/main/java/com/musitu/store/V2*.java'
      - 'store/phase1/android-client/app/src/test/java/com/musitu/store/V2*.java'

permissions:
  contents: read

jobs:
  android-v2-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android 36 SDK with runner-provided SDK tools
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run JVM signed-registry negative-security tests and assemble candidate
        run: |
          set -euo pipefail
          gradle -p store/phase1/android-client --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify existing signed catalog v2 JavaScript regression suite
        run: node --test store/core/catalog/signed-registry-v2.test.mjs
