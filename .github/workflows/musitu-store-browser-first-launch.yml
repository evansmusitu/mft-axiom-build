name: MUSITU Store browser-first launch

on:
  push:
    branches:
      - musitu-store-browser-first-launch-20260913
    paths:
      - 'store/**'
      - '.github/workflows/musitu-store-browser-first-launch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-first-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate Store data from committed signed metadata
        run: python3 store/phase1/web-surface/build_store_data.py

      - name: Syntax check Store renderer
        run: node --check store/phase1/web-surface/render.mjs

      - name: Syntax check Store worker
        run: node --check store/phase1/web-surface/worker.mjs

      - name: Verify native-install handoff and browser-first separation
        run: node --test store/phase1/web-surface/native-install-handoff.test.mjs

      - name: Verify release assets
        run: node --test store/phase1/web-surface/release-assets-v101.test.mjs

      - name: Verify runtime publication state
        run: node --test store/phase1/web-surface/runtime-state.test.mjs

      - name: Verify storefront, accessibility, PWA and browser launch
        run: node --test store/phase1/web-surface/storefront.test.mjs
