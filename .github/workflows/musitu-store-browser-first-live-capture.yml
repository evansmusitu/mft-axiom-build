name: MUSITU Store browser-first exact live capture

on:
  push:
    branches:
      - musitu-store-browser-first-launch-20260913
    paths:
      - '.github/workflows/musitu-store-browser-first-live-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
  STORE_WORKER: musitu-store-phase1
  EXPECTED_COMPATIBILITY_DATE: '2026-09-09'
  LIVE_MODULE_OUTPUT: /tmp/musitu-store-browser-first-live-capture
  STORE_BASE_SHA: 124f025aaab0cd9c02a3a5dc26b4a4a8fa5091ec

jobs:
  exact-live-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated Store branch
        uses: actions/checkout@v4

      - name: Capture exact live Store Worker modules (GET only)
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: python3 store/phase2/capture_live_store_worker_unpinned.py

      - name: Build current verified Store data
        run: python3 store/phase1/web-surface/build_store_data.py

      - name: Compare live bytes with sealed base and browser-first candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$STORE_BASE_SHA"
          mkdir -p /tmp/musitu-store-sealed-base
          for name in worker.mjs render.mjs assets.mjs; do
            git show "$STORE_BASE_SHA:store/phase1/web-surface/$name" > "/tmp/musitu-store-sealed-base/$name"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          names = ('worker.mjs','render.mjs','assets.mjs','generated-data.mjs')
          live_root = Path('/tmp/musitu-store-browser-first-live-capture')
          base_root = Path('/tmp/musitu-store-sealed-base')
          candidate_root = Path('store/phase1/web-surface')
          out = {}
          for name in names:
              live = (live_root / name).read_bytes()
              candidate = (candidate_root / name).read_bytes()
              row = {
                  'live': {'sha256': hashlib.sha256(live).hexdigest(), 'bytes': len(live)},
                  'candidate': {'sha256': hashlib.sha256(candidate).hexdigest(), 'bytes': len(candidate)},
                  'live_equals_candidate': live == candidate,
              }
              base_path = base_root / name
              if base_path.exists():
                  base = base_path.read_bytes()
                  row['base'] = {'sha256': hashlib.sha256(base).hexdigest(), 'bytes': len(base)}
                  row['live_equals_base'] = live == base
                  row['base_equals_candidate'] = base == candidate
              else:
                  row['base'] = None
                  row['live_equals_base'] = None
                  row['base_equals_candidate'] = None
              out[name] = row
          Path('/tmp/musitu-store-browser-first-live-capture/comparison.json').write_text(
              json.dumps(out, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

          for name in worker.mjs render.mjs; do
            echo "===== SEALED BASE -> CURRENT LIVE DIFF: $name ====="
            diff -u "/tmp/musitu-store-sealed-base/$name" "$LIVE_MODULE_OUTPUT/$name" | head -n 300 || true
          done

      - name: Upload exact live capture evidence
        uses: actions/upload-artifact@v4
        with:
          name: musitu-store-browser-first-exact-live-capture
          path: /tmp/musitu-store-browser-first-live-capture
          if-no-files-found: error
          retention-days: 14
