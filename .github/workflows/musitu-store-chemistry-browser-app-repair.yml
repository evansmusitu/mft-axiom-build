name: MUSITU Store Chemistry browser-app route repair

on:
  push:
    branches:
      - musitu-store-browser-first-launch-20260913
    paths:
      - '.github/workflows/musitu-store-chemistry-browser-app-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: musitu-store-chemistry-browser-app-repair
  cancel-in-progress: false

env:
  SEALED_CHEMISTRY_SHA: e8ca9245814a90e3ab5816d71d3e09c036d87f2b
  APP_BASE: https://payments.mftintelligence.com/chemistry/app
  STORE_OPEN: https://payments.mftintelligence.com/store/open
  INSTALL_URL: https://payments.mftintelligence.com/chemistry/install
  STABLE_APK_URL: https://payments.mftintelligence.com/chemistry/download/MUSITU_Chemistry_Mastery_1.3.0.apk
  STABLE_APK_PATH: /chemistry/download/MUSITU_Chemistry_Mastery_1.3.0.apk
  STABLE_APK_SHA256: 4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd
  STABLE_APK_BYTES: '5892286'
  SEALED_REPRO_WEB_ARCHIVE_SHA256: 1445074e87e8c4a9a15281baa586855fe31f92c06dd393a11458adce9821ec30
  ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
  ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e

jobs:
  repair-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact sealed Chemistry source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SEALED_CHEMISTRY_SHA }}
          fetch-depth: 1

      - name: Prove sealed source and stable artifact before mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SEALED_CHEMISTRY_SHA"
          rm -rf /tmp/musitu-browser-app-repair /tmp/musitu-browser-app-evidence
          mkdir -p /tmp/musitu-browser-app-repair/public/chemistry/app /tmp/musitu-browser-app-repair/src /tmp/musitu-browser-app-evidence
          curl --fail --location --silent --show-error --max-time 180 "$STABLE_APK_URL" -o /tmp/musitu-browser-app-repair/stable.apk
          echo "$STABLE_APK_SHA256  /tmp/musitu-browser-app-repair/stable.apk" | sha256sum -c -
          test "$(stat -c %s /tmp/musitu-browser-app-repair/stable.apk)" = "$STABLE_APK_BYTES"

      - name: Reconstruct exact 27-file browser carrier from signed Android release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          manifest=json.load(open('commerce/chemistry/frontier_universal/FULL_PARITY_MANIFEST_20260909.json'))
          expected={k:v['sha256'] for k,v in manifest['files'].items()}
          out=pathlib.Path('/tmp/musitu-browser-app-repair/public/chemistry/app'); observed={}
          with zipfile.ZipFile('/tmp/musitu-browser-app-repair/stable.apk') as z:
              for n in z.namelist():
                  if not n.startswith('assets/www/') or n.endswith('/'): continue
                  rel=n[len('assets/www/'):]
                  if not rel: continue
                  data=z.read(n); p=out/rel; p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
                  observed[rel]=hashlib.sha256(data).hexdigest()
          if observed!=expected:
              raise SystemExit('sealed Android embedded carrier drift')
          print('SEALED_BROWSER_CARRIER=27/27 PASS')
          PY
          python3 commerce/chemistry/frontier_universal/patch_web_event_bridge.py /tmp/musitu-browser-app-repair/public/chemistry/app | tee /tmp/musitu-browser-app-evidence/overlay.json
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/musitu-browser-app-repair/public/chemistry/app')
          base=json.load(open('commerce/chemistry/frontier_universal/FULL_PARITY_MANIFEST_20260909.json'))
          overlay=json.load(open('/tmp/musitu-browser-app-evidence/overlay.json'))
          expected={k:v['sha256'] for k,v in base['files'].items()}
          for k,v in overlay.items(): expected[k]=v['sha256']
          observed={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if observed!=expected:
              raise SystemExit('post-overlay browser carrier drift')
          pathlib.Path('/tmp/musitu-browser-app-evidence/live-expected.json').write_text(json.dumps(expected,indent=2,sort_keys=True)+'\n')
          print('SEALED_BROWSER_CARRIER_POST_OVERLAY=27/27 PASS')
          PY

      - name: Build browser-first Chemistry worker
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/musitu-browser-app-repair/src/index.js <<'JS'
          const APP='/chemistry/app';
          const INSTALL='/chemistry/install';
          const APK='/chemistry/download/MUSITU_Chemistry_Mastery_1.3.0.apk';
          const APK_SHA='4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd';
          const ARCHIVE='1445074e87e8c4a9a15281baa586855fe31f92c06dd393a11458adce9821ec30';
          const OVERLAY='strict-csp-event-bridge-v1';
          const android=ua=>/Android/i.test(ua||'');
          const redirect=(location,status,extra={})=>new Response(null,{status,headers:{location,'cache-control':'no-store',...extra}});
          function secure(response,path){
            const h=new Headers(response.headers);
            h.set('X-Content-Type-Options','nosniff');
            h.set('Referrer-Policy','no-referrer');
            h.set('X-Frame-Options','DENY');
            h.set('Permissions-Policy','camera=(), microphone=(), geolocation=()');
            h.set('Cross-Origin-Resource-Policy','same-origin');
            h.set('X-MUSITU-Carrier','frontier-universal-1.3.0-parity-v2');
            h.set('X-MUSITU-Origin-Archive-SHA256',ARCHIVE);
            h.set('X-MUSITU-Compatibility-Overlay',OVERLAY);
            h.set('X-MUSITU-Carrier-Files','27');
            h.set('X-MUSITU-Platform-Route','universal-browser');
            if(path===APP+'/'||path===APP+'/index.html')h.set('Content-Security-Policy',"default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; script-src-attr 'none'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'");
            if(path===APP+'/'||path===APP+'/index.html'||path.endsWith('/sw.js')||path.endsWith('/manifest.webmanifest'))h.set('Cache-Control','no-cache, no-store, max-age=0');
            else h.set('Cache-Control','public, max-age=86400, immutable');
            return new Response(response.body,{status:response.status,statusText:response.statusText,headers:h});
          }
          export default {async fetch(request,env){
            const u=new URL(request.url),p=u.pathname,ua=request.headers.get('user-agent')||'';
            if(p===INSTALL||p===INSTALL+'/diagnostics'){
              if(android(ua))return redirect(APK,302,{'x-musitu-platform-route':'android-native-install','x-musitu-release-version':'1.3.0','x-musitu-release-sha256':APK_SHA});
              return redirect(APP+'/#help',302,{'x-musitu-platform-route':'browser-install-help','x-musitu-install-surface':'carrier-help'});
            }
            if(p===APP)return redirect(APP+'/',308,{'x-musitu-platform-route':'universal-browser'});
            if(!p.startsWith(APP+'/'))return new Response('Not found',{status:404});
            if(p===APP+'/index.html'){
              const root=new URL(request.url);root.pathname=APP+'/';
              const r=await env.ASSETS.fetch(new Request(root.toString(),request));
              return secure(r,p);
            }
            const r=await env.ASSETS.fetch(request);
            return secure(r,p);
          }};
          JS
          node --check /tmp/musitu-browser-app-repair/src/index.js
          cat > /tmp/musitu-browser-app-repair/wrangler.jsonc <<'JSON'
          {
            "name":"musitu-chemistry-universal-app",
            "account_id":"93f395f5121954671f92fffa453d6b61",
            "compatibility_date":"2026-09-06",
            "workers_dev":false,
            "main":"src/index.js",
            "routes":[
              {"pattern":"payments.mftintelligence.com/chemistry/app*","zone_id":"5b56528f03948ff5917a5e0cd9f7109e"},
              {"pattern":"payments.mftintelligence.com/chemistry/install*","zone_id":"5b56528f03948ff5917a5e0cd9f7109e"}
            ],
            "assets":{"directory":"./public","binding":"ASSETS","run_worker_first":true}
          }
          JSON
          cat > /tmp/musitu-browser-app-repair/wrangler-rollback.jsonc <<'JSON'
          {
            "name":"musitu-chemistry-universal-app",
            "account_id":"93f395f5121954671f92fffa453d6b61",
            "compatibility_date":"2026-09-06",
            "workers_dev":false,
            "main":"src/index.js",
            "routes":[],
            "assets":{"directory":"./public","binding":"ASSETS","run_worker_first":true}
          }
          JSON

      - name: Deploy and prove Store Open ends in browser app on every platform
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          rollback(){
            echo 'Browser-app verification failed; removing bounded app/install routes to restore prior commerce routing.' >&2
            (cd /tmp/musitu-browser-app-repair && npx --yes wrangler@latest deploy --config wrangler-rollback.jsonc) >> /tmp/musitu-browser-app-evidence/rollback.txt 2>&1 || true
          }
          trap rollback ERR
          (cd /tmp/musitu-browser-app-repair && npx --yes wrangler@latest deploy --config wrangler.jsonc) | tee /tmp/musitu-browser-app-evidence/wrangler.txt
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,time,urllib.error,urllib.request
          APP=os.environ['APP_BASE'].rstrip('/'); STORE=os.environ['STORE_OPEN']; INSTALL=os.environ['INSTALL_URL']; APK_PATH=os.environ['STABLE_APK_PATH']
          UAS={
            'android-chrome':'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140 Mobile Safari/537.36',
            'samsung':'Mozilla/5.0 (Linux; Android 14; SAMSUNG SM-S921B) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/27.0 Chrome/125.0 Mobile Safari/537.36',
            'ios-safari':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Version/18.6 Mobile/15E148 Safari/604.1',
            'desktop-chrome':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
          }
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          no=urllib.request.build_opener(NoRedirect); yes=urllib.request.build_opener()
          def req(url,ua,follow=True,accept='text/html'):
            q=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':accept,'Cache-Control':'no-cache, no-store','Pragma':'no-cache'})
            try:
              with (yes if follow else no).open(q,timeout=60) as r:return r.status,r.geturl(),{k.lower():v for k,v in r.headers.items()},r.read()
            except urllib.error.HTTPError as e:return e.code,e.geturl(),{k.lower():v for k,v in e.headers.items()},e.read()
          def browser_ok(status,url,headers,body):
            ctype=headers.get('content-type','').lower(); dispo=headers.get('content-disposition','').lower()
            return (status==200 and url.startswith(APP+'/') and '/install' not in url and not re.search(r'\.(?:apk|ipa|aab|zip|exe|msi)(?:[?#]|$)',url,re.I) and ctype.startswith('text/html') and 'attachment' not in dispo and len(body)>1000 and (b'<html' in body.lower() or b'<!doctype' in body.lower()))
          # Wait until Android itself sees the new browser-first Worker, not just desktop.
          last=None
          for _ in range(90):
            c,u,h,b=req(APP+'/',UAS['android-chrome'],True)
            last=(c,u,h.get('content-type'),h.get('x-musitu-platform-route'),len(b))
            if browser_ok(c,u,h,b) and h.get('x-musitu-platform-route')=='universal-browser': break
            time.sleep(1)
          else: raise SystemExit('Android browser app route did not converge '+repr(last))
          results={}
          for label,ua in UAS.items():
            attempts=[]
            for n in range(1,31):
              c,u,h,b=req(STORE,ua,True)
              ok=browser_ok(c,u,h,b)
              attempts.append({'attempt':n,'status':c,'final_url':u,'content_type':h.get('content-type'),'content_disposition':h.get('content-disposition'),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'ok':ok})
              if ok: break
              time.sleep(1)
            else: raise SystemExit(label+' Store Open did not end in browser app '+repr(attempts[-3:]))
            results[label]=attempts
          # Explicit install remains explicit: Android install may hand off to APK.
          for label in ('android-chrome','samsung'):
            c,u,h,b=req(INSTALL,UAS[label],False)
            if c!=302 or h.get('location')!=APK_PATH or h.get('x-musitu-platform-route')!='android-native-install':
              raise SystemExit(label+' explicit install contract failed '+repr((c,h)))
          # Direct app root must never steer Android into install/download.
          for label,ua in UAS.items():
            c,u,h,b=req(APP,ua,False)
            if c!=308 or h.get('location')!='/chemistry/app/' or h.get('x-musitu-platform-route')!='universal-browser':
              raise SystemExit(label+' direct app root is not universal-browser '+repr((c,h)))
          # All sealed carrier bytes remain exact through production.
          expected=json.load(open('/tmp/musitu-browser-app-evidence/live-expected.json'))
          for rel,want in expected.items():
            url=APP+'/' if rel=='index.html' else APP+'/'+rel
            c,u,h,b=req(url,UAS['desktop-chrome'],True,'*/*')
            if c!=200 or hashlib.sha256(b).hexdigest()!=want or h.get('x-musitu-carrier')!='frontier-universal-1.3.0-parity-v2':
              raise SystemExit('production carrier byte mismatch '+rel)
          ev={
            'schema':'musitu.store.chemistry_browser_app_repair.v1',
            'sealed_chemistry_sha':os.environ['SEALED_CHEMISTRY_SHA'],
            'store_open':STORE,
            'production_app_url':APP+'/',
            'browser_open_platforms':sorted(results),
            'browser_open_verified':True,
            'android_open_downloads_package':False,
            'android_explicit_install_preserved':True,
            'sealed_carrier_27_of_27':True,
            'gate':'MUSITU_STORE_BROWSER_APP_END_TO_END_PASS',
            'observations':results,
          }
          raw=(json.dumps(ev,indent=2,sort_keys=True)+'\n').encode()
          pathlib.Path('/tmp/musitu-browser-app-evidence/result.json').write_bytes(raw)
          pathlib.Path('/tmp/musitu-browser-app-evidence/result.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  result.json\n')
          print(json.dumps(ev,sort_keys=True))
          PY
          trap - ERR
          echo MUSITU_STORE_BROWSER_APP_END_TO_END=PASS

      - name: Upload production repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-store-chemistry-browser-app-repair
          path: /tmp/musitu-browser-app-evidence
          retention-days: 90
          if-no-files-found: warn
