name: MUSITU Store handoff live catalog probe 20260910

on:
  push:
    branches: [musitu-store-handoff-probe-20260910]
    paths:
      - '.github/workflows/musitu-store-handoff-live-catalog-probe-20260910.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact live revision-2 catalog and verify signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff-live
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            'https://payments.mftintelligence.com/store/catalog.json' -o handoff-live/catalog.json
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            'https://payments.mftintelligence.com/store/catalog.sig' -o handoff-live/catalog.sig
          test "$(sha256sum store/phase1/catalog-signing-public.pem | awk '{print $1}')" = '4cf17f70dbab900237d8b82b4e989978c667e6ec841de6df79469aa6c5ebd5c0'
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('handoff-live/catalog.json').read_text())
          assert c['revision']==2, c['revision']
          s=c['releaseControl']['storeClient']
          assert s['version']=='1.0.1'
          assert s['versionCode']==10001
          assert s['sha256']=='b755210f303ebb6d22a3177bb21e5ebae2e076901021ee62ca2fe6ab0f14af82'
          assert c['apps'][0]['releases'][0]['android']['sha256']=='4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd'
          assert c['apps'][0]['releases'][0]['ios']['sha256']=='426d2dc05e2fc8846a7582324d953bbdd2a256f170f8db2b5a956bc1c51cc962'
          PY
          base64 -d < handoff-live/catalog.sig > handoff-live/catalog.sig.der
          openssl dgst -sha256 -verify store/phase1/catalog-signing-public.pem -signature handoff-live/catalog.sig.der handoff-live/catalog.json
          rm handoff-live/catalog.sig.der
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          c=json.loads(Path('handoff-live/catalog.json').read_text())
          out={
            'status':'PASS',
            'source':'https://payments.mftintelligence.com/store/catalog.json',
            'catalogRevision':c['revision'],
            'catalogSha256':sha('handoff-live/catalog.json'),
            'catalogSigSha256':sha('handoff-live/catalog.sig'),
            'catalogSignatureVerification':'PASS',
            'storeVersion':c['releaseControl']['storeClient']['version'],
            'storeSha256':c['releaseControl']['storeClient']['sha256'],
          }
          Path('handoff-live/LIVE_PROBE.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-store-live-catalog-rev2-20260910
          path: handoff-live/
          if-no-files-found: error
          retention-days: 7
