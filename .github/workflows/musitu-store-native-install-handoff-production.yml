name: MUSITU Store Native Install Handoff Production

on:
  push:
    branches: [musitu-store-native-install-handoff-20260911]
    paths:
      - 'evidence/musitu-store/MUSITU_STORE_NATIVE_INSTALL_HANDOFF_EXECUTE_20260911.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: musitu-store-native-install-handoff-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_FIX_HEAD: 5330b04e7c5e00ca7ec671b32fb7e7541ba1e076
      SOURCE_FIX_VERIFY_RUN: '34614511566'
      RAW_OVERRIDE_DIAGNOSTIC_RUN: '34615364218'
      LIVE_WORKER_SHA: e17e0c7bde55d9f8d41b476e917159b6bf39b46c3895b7ec6d2a7b4f705beb81
      LIVE_RENDER_SHA: fc4abcec85fd5338c71e26fad5b21d318c99e6a1e1bd62f09091db9c4e914e04
      LIVE_ASSETS_SHA: 443e558c297d700bedc706ea56647c97162709e5178b80acd63d478054bba4b4
      LIVE_GENERATED_DATA_SHA: 27ab78a914019cb44844de51bd0f4be46dc53bdf4b928a8dff7944228ccce063
      EXPECTED_COMPATIBILITY_DATE: '2026-09-09'
      STORE_SHA: 3a0c4b0f971ec84cd6167a137f8e3d75c7bb20e525c26ab533b3d88044cd0784
      STORE_BYTES: '1679340'
      CATALOG_SHA: 4fa31c5f9f84facc0d1fbf7a91a50b0adcaa5ef4c97b7d82abbe9657ea10b7f9
      CATALOG_SIG_SHA: 9b854358f90368ceb5cc3baab8d99064d8ee94b79ead378a614f8cc1732b06a7
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      ZONE_NAME: mftintelligence.com
      PAYMENTS_HOST: payments.mftintelligence.com
      PAYMENTS_ORIGIN: mft-paynow-transport-gateway
      STORE_WORKER: musitu-store-phase1
      STORE_ROUTE: payments.mftintelligence.com/store*
      STORE_BUCKET: musitu-store-phase1-releases

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove verified source fix, raw-override diagnosis and immutable production baseline record
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'musitu-store-native-install-handoff-20260911'
          git merge-base --is-ancestor "$SOURCE_FIX_HEAD" "$GITHUB_SHA"
          test -z "$(git diff --name-only "$SOURCE_FIX_HEAD"..."$GITHUB_SHA" -- store/phase1/web-surface/render.mjs store/phase1/web-surface/native-install-handoff.test.mjs)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_FIX_VERIFY_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_FIX_VERIFY_RUN" --jq '.head_sha')" = "$SOURCE_FIX_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RAW_OVERRIDE_DIAGNOSTIC_RUN" --jq '.conclusion')" = success
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('evidence/musitu-store/MUSITU_STORE_BROWSER_PRESENTATION_HOTFIX_PRODUCTION_CERTIFICATION_20260911.json')
          d=json.loads(p.read_text())
          assert d['status']=='PASS_RECOVERED_DEPLOY_ROLLBACK_REDEPLOY_VERIFIED'
          prod=d['production']
          assert prod['worker']=='musitu-store-phase1'
          assert prod['final_worker_sha256']==os.environ['LIVE_WORKER_SHA']
          assert prod['render_sha256']==os.environ['LIVE_RENDER_SHA']
          assert prod['assets_sha256']==os.environ['LIVE_ASSETS_SHA']
          assert prod['generated_data_sha256']==os.environ['LIVE_GENERATED_DATA_SHA']
          assert prod['compatibility_date']==os.environ['EXPECTED_COMPATIBILITY_DATE']
          rel=d['release_identity']
          assert rel['store_version']=='1.0.2'
          assert rel['store_apk_sha256']==os.environ['STORE_SHA']
          assert rel['store_apk_bytes']==int(os.environ['STORE_BYTES'])
          assert rel['catalog_sha256']==os.environ['CATALOG_SHA']
          assert rel['catalog_signature_sha256']==os.environ['CATALOG_SIG_SHA']
          print('CERTIFIED_LIVE_BASELINE_RECORD=PASS')
          PY
          python -m py_compile store/phase2/apply-native-install-handoff.py store/phase2/capture_exact_live_store_worker.py store/phase2/deploy-native-install-handoff.py store/phase2/deploy-native-install-handoff-v2.py
          node --check store/phase2/native-install-handoff-smoke.mjs

      - name: Capture exact certified current live Store modules — GET only
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          LIVE_MODULE_OUTPUT: /tmp/musitu-native-live-baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/musitu-native-live-baseline /tmp/musitu-native-candidate /tmp/musitu-native-evidence
          mkdir -p /tmp/musitu-native-evidence
          test -n "$CLOUDFLARE_EMAIL" && test -n "$CLOUDFLARE_GLOBAL_API_KEY"
          python store/phase2/capture_exact_live_store_worker.py | tee /tmp/musitu-native-evidence/live-baseline-capture.json
          grep -q '"result": "PASS_EXACT_LIVE_CAPTURE"' /tmp/musitu-native-evidence/live-baseline-capture.json

      - name: Build exact render-only candidate from captured live modules
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/musitu-native-live-baseline /tmp/musitu-native-candidate
          python store/phase2/apply-native-install-handoff.py /tmp/musitu-native-candidate/render.mjs
          node --check /tmp/musitu-native-candidate/worker.mjs
          node --check /tmp/musitu-native-candidate/render.mjs
          node --check /tmp/musitu-native-candidate/assets.mjs
          node --check /tmp/musitu-native-candidate/generated-data.mjs
          cmp /tmp/musitu-native-live-baseline/worker.mjs /tmp/musitu-native-candidate/worker.mjs
          cmp /tmp/musitu-native-live-baseline/assets.mjs /tmp/musitu-native-candidate/assets.mjs
          cmp /tmp/musitu-native-live-baseline/generated-data.mjs /tmp/musitu-native-candidate/generated-data.mjs
          ! cmp -s /tmp/musitu-native-live-baseline/render.mjs /tmp/musitu-native-candidate/render.mjs
          BASELINE_MODULE_ROOT=/tmp/musitu-native-live-baseline CANDIDATE_MODULE_ROOT=/tmp/musitu-native-candidate node store/phase2/native-install-handoff-smoke.mjs | tee /tmp/musitu-native-evidence/predeploy-smoke.json
          grep -q 'MUSITU_STORE_NATIVE_INSTALL_HANDOFF_PREDEPLOY_PASS' /tmp/musitu-native-evidence/predeploy-smoke.json
          sha256sum /tmp/musitu-native-live-baseline/render.mjs /tmp/musitu-native-candidate/render.mjs | tee /tmp/musitu-native-evidence/render-sha256.txt
          echo NATIVE_INSTALL_HANDOFF_PREDEPLOY=PASS

      - name: Execute render-only production deployment with module-root rollback drill
        id: transaction
        continue-on-error: true
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          BASELINE_MODULE_ROOT: /tmp/musitu-native-live-baseline
          CANDIDATE_MODULE_ROOT: /tmp/musitu-native-candidate
          NATIVE_HANDOFF_HEAD: ${{ github.sha }}
          NATIVE_HANDOFF_EVIDENCE: /tmp/musitu-native-evidence
        shell: bash
        run: |
          set -euo pipefail
          python store/phase2/deploy-native-install-handoff-v2.py

      - name: Upload non-secret deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-store-native-install-handoff-production-v2
          path: /tmp/musitu-native-evidence
          retention-days: 90
          if-no-files-found: error

      - name: Enforce successful production transaction
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.transaction.outcome }}' = success
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/musitu-native-evidence/deployment.json').read_text())
          assert d['schema']=='musitu.store.native_install_handoff.production.v1'
          assert d['gate']=='MUSITU_STORE_NATIVE_INSTALL_HANDOFF_DEPLOY_AND_ROLLBACK_PASS'
          s=d['state']
          assert s['candidate_deployed_once'] is True
          assert s['rollback_drill_performed'] is True
          assert s['rollback_drill_verified'] is True
          assert s['candidate_redeployed_final'] is True
          assert s['final_state_verified'] is True
          assert s['emergency_baseline_restore_performed'] is False
          assert d['checks']['only_render_module_changed'] is True
          assert d['checks']['android_primary_install_routes_to_native_store'] is True
          assert len(d['checks']['machine_endpoint_verification'])==11
          assert d['checks']['machine_probe_policy']['diagnostic_run']==34615364218
          print('MUSITU_STORE_NATIVE_INSTALL_HANDOFF_PRODUCTION=PASS')
          PY
