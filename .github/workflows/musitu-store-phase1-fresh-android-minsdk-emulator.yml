name: MUSITU Store Phase 1 Fresh Android MinSDK Virtual Device

on:
  push:
    branches: [musitu-store-phase1-20260909]
    paths:
      - '.github/scripts/musitu-store-fresh-android-emulator.sh'
      - '.github/workflows/musitu-store-phase1-fresh-android-minsdk-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-store-phase1-fresh-android-minsdk-virtual-device
  cancel-in-progress: false

jobs:
  min-sdk-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STORE_URL: https://payments.mftintelligence.com/store/bootstrap/MUSITU_Store_1.0.1.apk
      STORE_SHA256: b755210f303ebb6d22a3177bb21e5ebae2e076901021ee62ca2fe6ab0f14af82
      STORE_BYTES: '1679572'
      CHEM_URL: https://payments.mftintelligence.com/store/android/repo/MUSITU_Chemistry_Mastery_1.3.0.apk
      CHEM_SHA256: 4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd
      CHEM_BYTES: '5892286'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove sealed repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'musitu-store-phase1-20260909'
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = 'd6a846f6bbe0bccac1758713eb4de167caf07113'
          grep -q 'minSdk 24' store/phase1/android-client/app/build.gradle
          echo MIN_SDK_BOUNDARY=24

      - name: Enable KVM access when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo 'KVM device is not exposed on this runner; emulator action may use its supported fallback.'
          fi

      - name: Prepare API 24 diagnostic wrapper
        shell: bash
        run: |
          set -euo pipefail
          WRAP="$RUNNER_TEMP/musitu-store-minsdk-with-diagnostics.sh"
          cat > "$WRAP" <<'BASH'
          #!/usr/bin/env bash
          set +e
          bash .github/scripts/musitu-store-fresh-android-emulator.sh
          status=$?
          OUT="${RUNNER_TEMP:-/tmp}/musitu-store-fresh-android"
          mkdir -p "$OUT"
          timeout 15s adb logcat -d -v threadtime > "$OUT/api24-final-logcat.txt" 2>&1 || true
          timeout 10s adb shell dumpsys activity activities > "$OUT/api24-final-activities.txt" 2>&1 || true
          timeout 10s adb shell dumpsys package com.musitu.store > "$OUT/api24-final-store-package.txt" 2>&1 || true
          timeout 10s adb shell pidof com.musitu.store > "$OUT/api24-final-store-pid.txt" 2>&1 || true
          exit "$status"
          BASH
          chmod +x "$WRAP"

      - name: Fresh API 24 minimum-supported install and launch
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/musitu-store-minsdk-with-diagnostics.sh"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musitu-store-phase1-fresh-android-minsdk-virtual-device-evidence
          path: ${{ runner.temp }}/musitu-store-fresh-android
          retention-days: 90
          if-no-files-found: warn
