name: MUSITU Store Phase 1 Prebuild

on:
  push:
    branches: [musitu-store-phase1-20260909]
    paths:
      - 'store/phase1/source_bundle.b64.*'
      - 'store/phase1/source-v1.0.1.patch'
      - 'store/phase1/apply-source-v1.0.1.sh'
      - 'store/phase1/android-client/app/build.gradle'
      - 'store/phase1/android-client/app/src/main/AndroidManifest.xml'
      - '.github/workflows/musitu-store-phase1-prebuild.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: musitu-store-phase1-prebuild
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Expand sealed 1.0.0 source and apply verified 1.0.1 delta
        run: bash store/phase1/apply-source-v1.0.1.sh
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Build unsigned MUSITU Store client
        run: |
          set -euo pipefail
          gradle -p store/phase1/android-client --no-daemon :app:assembleRelease
          APK=store/phase1/android-client/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p out
          cp "$APK" out/MUSITU_Store_1.0.1_UNSIGNED.apk
          sha256sum out/MUSITU_Store_1.0.1_UNSIGNED.apk > out/android.sha256
      - uses: actions/upload-artifact@v4
        with: {name: musitu-store-phase1-android-unsigned, path: out, if-no-files-found: error, retention-days: 30}

  seal-prebuilt:
    needs: [android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: musitu-store-phase1-20260909}
      - name: Expand sealed 1.0.0 source and apply verified 1.0.1 delta
        run: bash store/phase1/apply-source-v1.0.1.sh
      - name: Assert unchanged iOS carrier is byte-identical
        run: |
          set -euo pipefail
          IPA=store/phase1/prebuilt/ios/MUSITU_Chemistry_1.3.0.ipa
          test -f "$IPA"
          test "$(stat -c%s "$IPA")" = '3640968'
          echo '426d2dc05e2fc8846a7582324d953bbdd2a256f170f8db2b5a956bc1c51cc962  store/phase1/prebuilt/ios/MUSITU_Chemistry_1.3.0.ipa' | sha256sum -c -
          grep -qx '426d2dc05e2fc8846a7582324d953bbdd2a256f170f8db2b5a956bc1c51cc962  out/MUSITU_Chemistry_1.3.0.ipa' store/phase1/prebuilt/ios/ios.sha256
          echo MUSITU_STORE_IOS_PRESERVATION=PASS
      - uses: actions/download-artifact@v4
        with: {name: musitu-store-phase1-android-unsigned, path: /tmp/android}
      - name: Commit immutable Android 1.0.1 prebuild while preserving iOS bytes
        run: |
          set -euo pipefail
          mkdir -p store/phase1/prebuilt/android
          cp /tmp/android/MUSITU_Store_1.0.1_UNSIGNED.apk store/phase1/prebuilt/android/
          cp /tmp/android/android.sha256 store/phase1/prebuilt/android/
          python - <<'PY'
          import hashlib,json,pathlib
          a=pathlib.Path('store/phase1/prebuilt/android/MUSITU_Store_1.0.1_UNSIGNED.apk')
          i=pathlib.Path('store/phase1/prebuilt/ios/MUSITU_Chemistry_1.3.0.ipa')
          h=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert i.stat().st_size == 3640968
          assert h(i) == '426d2dc05e2fc8846a7582324d953bbdd2a256f170f8db2b5a956bc1c51cc962'
          e={'schema':'musitu.store.phase1.prebuilt.v1','android_unsigned':{'file':a.name,'bytes':a.stat().st_size,'sha256':h(a),'version':'1.0.1','version_code':10001},'ios_unsigned':{'file':i.name,'bytes':i.stat().st_size,'sha256':h(i),'bundle_id':'com.musitu.chemistry','version':'1.3.0'},'private_signing_material_present':False}
          pathlib.Path('store/phase1/prebuilt/PREBUILT.json').write_text(json.dumps(e,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'MUSITU Store Builder'
          git config user.email 'evansmusitu5@gmail.com'
          git add store/phase1/prebuilt/android store/phase1/prebuilt/PREBUILT.json
          if git diff --cached --quiet; then echo PREBUILT_UNCHANGED; exit 0; fi
          git commit -m 'build: seal MUSITU Store Android 1.0.1 unsigned carrier'
          git push origin HEAD:musitu-store-phase1-20260909
