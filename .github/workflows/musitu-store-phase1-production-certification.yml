name: MUSITU Store Phase 1 Production Certification

on:
  push:
    branches: [musitu-store-phase1-20260909]
    paths:
      - '.github/workflows/musitu-store-phase1-production-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      ZONE_NAME: mftintelligence.com
      PAYMENTS_HOST: payments.mftintelligence.com
      PAYMENTS_ORIGIN: mft-paynow-transport-gateway
      STORE_WORKER: musitu-store-phase1
      STORE_ROUTE: payments.mftintelligence.com/store*
      STORE_BUCKET: musitu-store-phase1-releases
      SEALED_MAIN: d6a846f6bbe0bccac1758713eb4de167caf07113
      STORE_APK_SHA256: 71391bf614cc1186cbe1fda17e9e626aad71d96dbf26807228b73bd2ea99b2f8
      STORE_APK_BYTES: '1687882'
      STORE_APK_CERT_SHA256: 43695b6103d7ab57e89166c9a537f1810b7e33053e20332b1d4e7e2e1c612671
      IOS_SHA256: 426d2dc05e2fc8846a7582324d953bbdd2a256f170f8db2b5a956bc1c51cc962
      IOS_BYTES: '3640968'
      CHEMISTRY_SHA256: 4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd
      CHEMISTRY_BYTES: '5892286'
      CHEMISTRY_CERT_SHA256: d4455ac3ec74a6d7cd7993ca640f554a83bba95dfd01ef508f7637b6bc72c0d8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android verification tools
        run: sdkmanager 'build-tools;36.0.0'

      - name: Prove sealed repository and signed-catalog boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'musitu-store-phase1-20260909'
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "$SEALED_MAIN"
          echo '4cf17f70dbab900237d8b82b4e989978c667e6ec841de6df79469aa6c5ebd5c0  store/phase1/catalog-signing-public.pem' | sha256sum -c -
          base64 -d < store/phase1/catalog.sig > /tmp/catalog.sig.der
          openssl dgst -sha256 -verify store/phase1/catalog-signing-public.pem -signature /tmp/catalog.sig.der store/phase1/catalog.json
          echo REPOSITORY_AND_CATALOG_BOUNDARY=PASS

      - name: Read-only public and Cloudflare certification
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_GLOBAL_API_KEY"
          mkdir -p /tmp/store-production-certification /tmp/store-cert-downloads
          python - <<'PY'
          import hashlib,json,os,pathlib,plistlib,urllib.error,urllib.parse,urllib.request,zipfile

          API=os.environ['CF_API']; AID=os.environ['ACCOUNT_ID']; ZID=os.environ['ZONE_ID']; ZONE=os.environ['ZONE_NAME']
          HOST=os.environ['PAYMENTS_HOST']; ORIGIN=os.environ['PAYMENTS_ORIGIN']; WORKER=os.environ['STORE_WORKER']; ROUTE=os.environ['STORE_ROUTE']; BUCKET=os.environ['STORE_BUCKET']; BASE='https://'+HOST
          AUTH={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'Accept':'application/json','User-Agent':'MUSITU-Store-Independent-Certification/1.0'}
          downloads=pathlib.Path('/tmp/store-cert-downloads')
          checks={}

          def req(path,accept='*/*',ua='MUSITU-Store-Independent-Certification/1.0',extra=None):
              h={'Accept':accept,'User-Agent':ua};h.update(extra or {})
              q=urllib.request.Request(BASE+path,headers=h,method='GET')
              try:
                  with urllib.request.urlopen(q,timeout=90) as r:return r.status,r.headers,r.read()
              except urllib.error.HTTPError as e:return e.code,e.headers,e.read()

          def cf(path):
              q=urllib.request.Request(API+path,headers=AUTH,method='GET')
              try:
                  with urllib.request.urlopen(q,timeout=60) as r:c=r.status;b=r.read()
              except urllib.error.HTTPError as e:c=e.code;b=e.read()
              if c!=200:raise RuntimeError(f'Cloudflare GET HTTP {c}: {path}')
              o=json.loads(b or b'{}')
              if o.get('success') is not True:raise RuntimeError('Cloudflare success=false '+path)
              return o.get('result')

          def exact(path,repo_path,accept):
              c,_,b=req(path,accept)
              expected=pathlib.Path(repo_path).read_bytes()
              if c!=200 or b!=expected:raise RuntimeError('exact-byte mismatch '+path)
              return hashlib.sha256(b).hexdigest()

          def sha(b):return hashlib.sha256(b).hexdigest()

          # Exact public signed metadata.
          checks['catalog_sha256']=exact('/store/catalog.json','store/phase1/catalog.json','application/json')
          checks['catalog_sig_sha256']=exact('/store/catalog.sig','store/phase1/catalog.sig','text/plain')

          # Runtime state must be truthful while signed snapshot remains immutable.
          c,h,b=req('/store/healthz','application/json'); o=json.loads(b or b'{}') if c==200 else {}
          if c!=200 or o.get('ok') is not True or o.get('catalog_publication_state')!='private-predeployment' or o.get('runtime_publication_state')!='production' or o.get('production_deployed') is not True or o.get('phase2_authorized') is not False or o.get('fresh_device_phase1_complete') is not False or 'publication_state' in o:raise RuntimeError('Store runtime health contract failed')
          checks['runtime_health']=o
          for path in ('/store/developer','/store/status'):
              c,_,b=req(path,'text/html')
              if c!=200 or b'Signed catalog snapshot' not in b or b'Runtime deployment' not in b or b'private-predeployment' not in b or b'production' not in b:raise RuntimeError('runtime labels failed '+path)

          # Browser/platform routing.
          cases=[
            ('desktop','Mozilla/5.0 (Windows NT 10.0; Win64; x64)',[b'Recommended for this browser',b'Installable PWA']),
            ('android','Mozilla/5.0 (Linux; Android 14; Pixel 8)',[b'Recommended for Android',b'MUSITU_Store_1.0.0.apk']),
            ('iphone','Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)',[b'Recommended for iOS',b'SideStore',b'Open the PWA']),
            ('ipad','Mozilla/5.0 (iPad; CPU OS 18_0 like Mac OS X)',[b'Recommended for iOS',b'SideStore',b'Open the PWA']),
          ]
          for name,ua,needles in cases:
              c,_,b=req('/store/install','text/html',ua)
              if c!=200 or any(n not in b for n in needles):raise RuntimeError('platform routing failed '+name)
              checks['platform_'+name]=True

          # Locale, bandwidth and offline surfaces.
          locales=[('en',b'Install MUSITU'),('sn',b'Isa MUSITU'),('nd',b'Faka i-MUSITU')]
          for lang,needle in locales:
              c,h,b=req('/store?lang='+lang,'text/html')
              if c!=200 or h.get('Content-Language')!=lang or needle not in b:raise RuntimeError('locale failed '+lang)
          c,_,b=req('/store?lite=1','text/html')
          if c!=200 or b'Low-bandwidth mode' not in b:raise RuntimeError('lite mode failed')
          c,_,b=req('/store','text/html',extra={'Save-Data':'on'})
          if c!=200 or b'Low-bandwidth mode' not in b:raise RuntimeError('Save-Data mode failed')
          c,_,b=req('/store/offline','text/html')
          if c!=200 or b'Offline &amp; recovery' not in b or b'SHA-256' not in b:raise RuntimeError('offline recovery surface failed')
          c,_,b=req('/store/sw.js','application/javascript')
          if c!=200 or b'musitu-store-r1' not in b or b'/store/catalog.sig' not in b or b'MUSITU_Store_1.0.0.apk' in b:raise RuntimeError('service-worker cache boundary failed')
          c,_,b=req('/store/manifest.webmanifest','application/manifest+json')
          m=json.loads(b or b'{}') if c==200 else {}
          if m.get('name')!='MUSITU Store' or m.get('scope')!='/store/':raise RuntimeError('manifest failed')

          # Download exact live binaries for independent native identity checks.
          binaries=[
            ('store','/store/bootstrap/MUSITU_Store_1.0.0.apk','MUSITU_Store_1.0.0.apk',int(os.environ['STORE_APK_BYTES']),os.environ['STORE_APK_SHA256']),
            ('ios','/store/ios/MUSITU_Chemistry_1.3.0.ipa','MUSITU_Chemistry_1.3.0.ipa',int(os.environ['IOS_BYTES']),os.environ['IOS_SHA256']),
            ('chemistry','/store/android/repo/MUSITU_Chemistry_Mastery_1.3.0.apk','MUSITU_Chemistry_Mastery_1.3.0.apk',int(os.environ['CHEMISTRY_BYTES']),os.environ['CHEMISTRY_SHA256']),
          ]
          for name,path,fn,size,digest in binaries:
              c,h,b=req(path,'application/octet-stream')
              if c!=200 or len(b)!=size or sha(b)!=digest or h.get('X-Content-SHA256')!=digest:raise RuntimeError('public binary failed '+name)
              (downloads/fn).write_bytes(b);checks[name+'_sha256']=digest

          # IPA internal identity, independent of source metadata page.
          ipa=downloads/'MUSITU_Chemistry_1.3.0.ipa'
          with zipfile.ZipFile(ipa) as z:
              plist_names=[n for n in z.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist')]
              if len(plist_names)!=1:raise RuntimeError('IPA Info.plist count mismatch')
              info=plistlib.loads(z.read(plist_names[0]))
          if info.get('CFBundleIdentifier')!='com.musitu.chemistry' or info.get('CFBundleShortVersionString')!='1.3.0' or str(info.get('CFBundleVersion'))!='10200' or info.get('MinimumOSVersion')!='15.0':raise RuntimeError('IPA identity mismatch')
          checks['ios_bundle_identifier']='com.musitu.chemistry'

          # Chemistry production preservation outside /store.
          c,_,b=req('/chemistry/healthz','application/json')
          if c!=200 or json.loads(b or b'{}').get('ok') is not True:raise RuntimeError('Chemistry health failed')
          c,_,_=req('/chemistry/catalog','application/json')
          if c!=200:raise RuntimeError('Chemistry catalog failed')
          c,_,b=req('/chemistry/download/MUSITU_Chemistry_Mastery_1.3.0.apk','application/vnd.android.package-archive')
          if c!=200 or len(b)!=int(os.environ['CHEMISTRY_BYTES']) or sha(b)!=os.environ['CHEMISTRY_SHA256']:raise RuntimeError('Chemistry canonical APK drift')

          # Cloudflare topology and bindings: read-only.
          zones=cf('/zones?name='+urllib.parse.quote(ZONE)+'&status=active') or []
          if len(zones)!=1 or zones[0].get('id')!=ZID or (zones[0].get('account') or {}).get('id')!=AID:raise RuntimeError('zone/account mismatch')
          domains=cf(f'/accounts/{AID}/workers/domains') or []; dm=[d for d in domains if isinstance(d,dict) and d.get('hostname')==HOST]
          if len(dm)!=1 or dm[0].get('service')!=ORIGIN:raise RuntimeError('payments origin drift')
          routes=cf(f'/zones/{ZID}/workers/routes') or []; exact=[r for r in routes if isinstance(r,dict) and r.get('pattern')==ROUTE]
          if len(exact)!=1 or exact[0].get('script')!=WORKER:raise RuntimeError('Store route drift')
          settings=cf(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(WORKER,safe="")}/settings') or {}; bs={x.get('name'):x for x in settings.get('bindings') or [] if isinstance(x,dict)}
          if set(bs)!={'STORE_RELEASES','STORE_RUNTIME_PUBLICATION_STATE'}:raise RuntimeError('Store binding set drift')
          if (bs.get('STORE_RELEASES') or {}).get('bucket_name')!=BUCKET or (bs.get('STORE_RUNTIME_PUBLICATION_STATE') or {}).get('text')!='production':raise RuntimeError('Store binding values drift')
          buckets=cf(f'/accounts/{AID}/r2/buckets?name_contains='+urllib.parse.quote(BUCKET)+'&per_page=100') or {}; rows=buckets.get('buckets') if isinstance(buckets,dict) else buckets
          if len([x for x in (rows or []) if isinstance(x,dict) and x.get('name')==BUCKET])!=1:raise RuntimeError('Store bucket missing')
          checks['route_id']=exact[0].get('id');checks['route']=ROUTE;checks['worker']=WORKER;checks['bucket']=BUCKET

          out={'schema':'musitu.store.phase1.production_certification.v1','head_sha':os.environ['GITHUB_SHA'],'sealed_main':os.environ['SEALED_MAIN'],'catalog_publication_state':'private-predeployment','runtime_publication_state':'production','production_deployed':True,'catalog_signature_verified':True,'store_apk_sha256':os.environ['STORE_APK_SHA256'],'store_apk_signer_sha256':os.environ['STORE_APK_CERT_SHA256'],'ios_sha256':os.environ['IOS_SHA256'],'chemistry_apk_sha256':os.environ['CHEMISTRY_SHA256'],'chemistry_signer_sha256':os.environ['CHEMISTRY_CERT_SHA256'],'platform_routing_verified':['desktop','android','iphone','ipad'],'locales_verified':['en','sn','nd'],'offline_and_low_bandwidth_verified':True,'cloudflare_topology_verified':True,'chemistry_invariants_preserved':True,'write_performed':False,'phase2_authorized':False,'fresh_device_phase1_complete':False,'checks':checks,'gate':'MUSITU_STORE_PHASE1_PRODUCTION_CERTIFICATION_PASS'}
          raw=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode();pathlib.Path('/tmp/store-production-certification/certification.json').write_bytes(raw);pathlib.Path('/tmp/store-production-certification/certification.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  certification.json\n');print(json.dumps({'gate':out['gate'],'route':ROUTE,'write_performed':False,'platforms':out['platform_routing_verified']},sort_keys=True))
          PY

      - name: Verify downloaded Android package and signer identities
        shell: bash
        run: |
          set -euo pipefail
          STORE=/tmp/store-cert-downloads/MUSITU_Store_1.0.0.apk
          CHEM=/tmp/store-cert-downloads/MUSITU_Chemistry_Mastery_1.3.0.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$STORE" | tee /tmp/store-cert.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$STORE" | grep -q "package: name='com.musitu.store'"
          s="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/store-cert.txt | head -n1 | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          test "$s" = "$STORE_APK_CERT_SHA256"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$CHEM" | tee /tmp/chem-cert.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$CHEM" | grep -q "package: name='com.musitu.chemistry'"
          c="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/chem-cert.txt | head -n1 | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          test "$c" = "$CHEMISTRY_CERT_SHA256"
          echo ANDROID_NATIVE_IDENTITIES=PASS

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-store-phase1-production-certification-evidence
          path: /tmp/store-production-certification
          retention-days: 90
          if-no-files-found: error
