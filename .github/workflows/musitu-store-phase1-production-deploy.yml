name: MUSITU Store Phase 1 Production Deploy

on:
  push:
    branches: [musitu-store-phase1-20260909]
    paths:
      - '.github/workflows/musitu-store-phase1-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-store-phase1-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      ZONE_NAME: mftintelligence.com
      PAYMENTS_HOST: payments.mftintelligence.com
      PAYMENTS_ORIGIN: mft-paynow-transport-gateway
      STORE_WORKER: musitu-store-phase1
      STORE_ROUTE: payments.mftintelligence.com/store*
      STORE_BUCKET: musitu-store-phase1-releases
      SEALED_MAIN: d6a846f6bbe0bccac1758713eb4de167caf07113
      WRANGLER_VERSION: 4.129.1
      STORE_APK_SHA256: 71391bf614cc1186cbe1fda17e9e626aad71d96dbf26807228b73bd2ea99b2f8
      STORE_APK_BYTES: '1687882'
      STORE_APK_CERT_SHA256: 43695b6103d7ab57e89166c9a537f1810b7e33053e20332b1d4e7e2e1c612671
      STORE_UNSIGNED_SHA256: 823b1ec0ec8bb68e3d5454ee1d70dbca6b7b8028d9f06d51149d79f9b9837555
      STORE_UNSIGNED_BYTES: '1675424'
      IOS_SHA256: 426d2dc05e2fc8846a7582324d953bbdd2a256f170f8db2b5a956bc1c51cc962
      IOS_BYTES: '3640968'
      CHEMISTRY_SHA256: 4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd
      CHEMISTRY_BYTES: '5892286'
      WRANGLER_LOG_SANITIZE: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android verification tools
        shell: bash
        run: sdkmanager 'build-tools;36.0.0'

      - name: Prove repository, catalog, web and release-byte gates before mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'musitu-store-phase1-20260909'
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "$SEALED_MAIN"
          python store/phase1/web-surface/build_store_data.py
          node --check store/phase1/web-surface/generated-data.mjs
          node --check store/phase1/web-surface/assets.mjs
          node --check store/phase1/web-surface/render.mjs
          node --check store/phase1/web-surface/worker.mjs
          node --test store/phase1/web-surface/storefront.test.mjs

          ROOT=release-delta/musitu-store-phase1
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('release-delta/musitu-store-phase1')
          m=json.loads((root/'reconstruction-manifest.json').read_text())
          assert m['private_key_required'] is False
          assert m['phase2_authorized'] is False
          ordered=[]
          for part in m['delta']['parts']:
              p=root/part['file']; raw=p.read_bytes()
              assert len(raw)==part['bytes'],p
              assert hashlib.sha256(raw).hexdigest()==part['sha256'],p
              ordered.append(raw)
          joined=b''.join(ordered)
          assert len(joined)==m['delta']['concatenated_base64_bytes']
          assert hashlib.sha256(joined).hexdigest()==m['delta']['concatenated_base64_sha256']
          Path('/tmp/store.patch.xz.b64').write_bytes(joined)
          print('DELTA_TRANSFER=PASS')
          PY
          base64 -d /tmp/store.patch.xz.b64 > /tmp/store.patch.xz
          echo '93a56b2028249c714d93494e9112d3cc04238d86610a61a4b0426cf43ea2d477  /tmp/store.patch.xz' | sha256sum -c -
          xz -dc /tmp/store.patch.xz > /tmp/store.patch
          echo 'f30f115847721eb019a31c5f3283236ee134088585b1015fbd36ddaa7b9c63ac  /tmp/store.patch' | sha256sum -c -

          SRC=store/phase1/prebuilt/android/MUSITU_Store_1.0.0_UNSIGNED.apk
          test "$(stat -c%s "$SRC")" = "$STORE_UNSIGNED_BYTES"
          echo "$STORE_UNSIGNED_SHA256  $SRC" | sha256sum -c -
          rm -rf /tmp/store-release && mkdir -p /tmp/store-release/reconstruct /tmp/store-release/assets
          cp "$SRC" /tmp/store-release/reconstruct/MUSITU_Store_1.0.0.apk
          (
            cd /tmp/store-release/reconstruct
            git init -q
            git config user.name 'MUSITU Store Reconstructor'
            git config user.email 'evansmusitu5@gmail.com'
            git add MUSITU_Store_1.0.0.apk
            git commit -qm 'seed exact unsigned APK'
            git apply --binary /tmp/store.patch
          )
          STORE=/tmp/store-release/reconstruct/MUSITU_Store_1.0.0.apk
          test "$(stat -c%s "$STORE")" = "$STORE_APK_BYTES"
          echo "$STORE_APK_SHA256  $STORE" | sha256sum -c -
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$STORE" | tee /tmp/store-apksigner.txt
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/store-apksigner.txt | head -n1 | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          test "$actual" = "$STORE_APK_CERT_SHA256"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$STORE" | grep -q "package: name='com.musitu.store'"
          cp "$STORE" /tmp/store-release/assets/MUSITU_Store_1.0.0.apk

          IPA=store/phase1/prebuilt/ios/MUSITU_Chemistry_1.3.0.ipa
          test "$(stat -c%s "$IPA")" = "$IOS_BYTES"
          echo "$IOS_SHA256  $IPA" | sha256sum -c -
          cp "$IPA" /tmp/store-release/assets/MUSITU_Chemistry_1.3.0.ipa

          curl --fail --location --retry 4 --silent --show-error \
            https://payments.mftintelligence.com/chemistry/download/MUSITU_Chemistry_Mastery_1.3.0.apk \
            -o /tmp/store-release/assets/MUSITU_Chemistry_Mastery_1.3.0.apk
          CHEM=/tmp/store-release/assets/MUSITU_Chemistry_Mastery_1.3.0.apk
          test "$(stat -c%s "$CHEM")" = "$CHEMISTRY_BYTES"
          echo "$CHEMISTRY_SHA256  $CHEM" | sha256sum -c -
          echo 'PREMUTATION_RELEASE_BYTES=PASS'

      - name: First-install deploy with automatic rollback on any failed invariant
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_GLOBAL_API_KEY"
          test -n "$CLOUDFLARE_API_KEY"
          mkdir -p /tmp/store-deploy-evidence
          python - <<'PY'
          import hashlib,json,os,pathlib,secrets,subprocess,time,urllib.error,urllib.parse,urllib.request

          API=os.environ['CF_API']; AID=os.environ['ACCOUNT_ID']; ZID=os.environ['ZONE_ID']; ZONE=os.environ['ZONE_NAME']
          HOST=os.environ['PAYMENTS_HOST']; ORIGIN=os.environ['PAYMENTS_ORIGIN']; WORKER=os.environ['STORE_WORKER']; ROUTE=os.environ['STORE_ROUTE']; BUCKET=os.environ['STORE_BUCKET']
          BASE='https://'+HOST
          AUTH={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'Accept':'application/json','User-Agent':'MUSITU-Store-Phase1-Deploy/1.0'}
          WRANGLER=['npx','-y','wrangler@'+os.environ['WRANGLER_VERSION']]
          ASSET_DIR=pathlib.Path('/tmp/store-release/assets')
          OBJECTS=[
            ('bootstrap/MUSITU_Store_1.0.0.apk',ASSET_DIR/'MUSITU_Store_1.0.0.apk',os.environ['STORE_APK_SHA256'],int(os.environ['STORE_APK_BYTES']),'application/vnd.android.package-archive','MUSITU_Store_1.0.0.apk'),
            ('ios/MUSITU_Chemistry_1.3.0.ipa',ASSET_DIR/'MUSITU_Chemistry_1.3.0.ipa',os.environ['IOS_SHA256'],int(os.environ['IOS_BYTES']),'application/octet-stream','MUSITU_Chemistry_1.3.0.ipa'),
            ('android/MUSITU_Chemistry_Mastery_1.3.0.apk',ASSET_DIR/'MUSITU_Chemistry_Mastery_1.3.0.apk',os.environ['CHEMISTRY_SHA256'],int(os.environ['CHEMISTRY_BYTES']),'application/vnd.android.package-archive','MUSITU_Chemistry_Mastery_1.3.0.apk'),
          ]
          mut={'bucket':False,'objects':[],'worker':False,'route_id':None}
          pre={'routes':None}

          def req(url,method='GET',headers=None,body=None,timeout=60):
              q=urllib.request.Request(url,headers=dict(headers or {}),method=method,data=body)
              try:
                  with urllib.request.urlopen(q,timeout=timeout) as r:return r.status,r.headers,r.read()
              except urllib.error.HTTPError as e:return e.code,e.headers,e.read()

          def cf(path,method='GET',obj=None,expected=None):
              h=dict(AUTH); body=None
              if obj is not None:
                  h['Content-Type']='application/json'; body=json.dumps(obj,separators=(',',':')).encode()
              c,hh,b=req(API+path,method,h,body)
              if expected is not None:
                  if c not in expected:raise RuntimeError(f'Cloudflare HTTP {c}: {method} {path}: '+b[:300].decode('utf-8','ignore'))
              elif not 200<=c<300:
                  raise RuntimeError(f'Cloudflare HTTP {c}: {method} {path}: '+b[:300].decode('utf-8','ignore'))
              try:x=json.loads(b or b'{}')
              except Exception:x={}
              if isinstance(x,dict) and x.get('success') is False:raise RuntimeError('Cloudflare success=false '+path+' '+str(x.get('errors'))[:300])
              return x.get('result') if isinstance(x,dict) else None

          def cf_optional(path):
              c,hh,b=req(API+path,'GET',AUTH,None)
              if c==404:return None
              if c!=200:raise RuntimeError(f'Cloudflare GET HTTP {c}: {path}')
              x=json.loads(b or b'{}')
              if x.get('success') is not True:raise RuntimeError('Cloudflare success=false '+path)
              return x.get('result')

          def wrangler(*args,check=True):
              p=subprocess.run(WRANGLER+list(args),text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,env=os.environ.copy())
              if check and p.returncode!=0:
                  raise RuntimeError('Wrangler command failed: '+' '.join(args)+'\n'+p.stdout[-1200:])
              return p

          def pub(path,accept='*/*'):
              return req(BASE+path,'GET',{'Accept':accept,'User-Agent':'MUSITU-Store-Phase1-Production-Probe/1.0'},None,90)

          def sha(data):return hashlib.sha256(data).hexdigest()

          def multipart_modules(metadata,modules):
              boundary='----MUSITU'+secrets.token_hex(18); out=[]
              def add(v):out.append(v.encode() if isinstance(v,str) else v)
              add(f'--{boundary}\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n')
              add(json.dumps(metadata,separators=(',',':'))); add('\r\n')
              for name,data in modules:
                  add(f'--{boundary}\r\nContent-Disposition: form-data; name="{name}"; filename="{name}"\r\nContent-Type: application/javascript+module\r\n\r\n')
                  add(data); add('\r\n')
              add(f'--{boundary}--\r\n')
              return boundary,b''.join(out)

          def preflight():
              zones=cf('/zones?name='+urllib.parse.quote(ZONE)+'&status=active') or []
              if len(zones)!=1 or zones[0].get('id')!=ZID or (zones[0].get('account') or {}).get('id')!=AID:raise RuntimeError('canonical zone/account mismatch')
              domains=cf(f'/accounts/{AID}/workers/domains') or []
              pm=[d for d in domains if isinstance(d,dict) and d.get('hostname')==HOST]
              if len(pm)!=1 or pm[0].get('service')!=ORIGIN:raise RuntimeError('payments Custom Domain owner drift')
              routes=cf(f'/zones/{ZID}/workers/routes') or []; pre['routes']=[(r.get('id'),r.get('pattern'),r.get('script')) for r in routes if isinstance(r,dict) and HOST in str(r.get('pattern') or '')]
              if any(r[1]==ROUTE for r in pre['routes']):raise RuntimeError('Store route already exists; refusing overwrite')
              if cf_optional(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(WORKER,safe="")}/settings') is not None:raise RuntimeError('Store worker already exists; refusing overwrite')
              buckets_obj=cf(f'/accounts/{AID}/r2/buckets?name_contains='+urllib.parse.quote(BUCKET)+'&per_page=100') or {}
              buckets=buckets_obj.get('buckets') if isinstance(buckets_obj,dict) else buckets_obj
              if any(isinstance(b,dict) and b.get('name')==BUCKET for b in (buckets or [])):raise RuntimeError('Store R2 bucket already exists; refusing overwrite')
              c,_,_=pub('/store','text/html')
              if c!=404:raise RuntimeError(f'predeploy /store expected 404, got {c}')
              verify_chemistry()

          def verify_chemistry():
              c,_,b=pub('/chemistry/healthz','application/json')
              if c!=200:raise RuntimeError('Chemistry healthz HTTP '+str(c))
              try:o=json.loads(b or b'{}')
              except Exception:raise RuntimeError('Chemistry healthz invalid JSON')
              if o.get('ok') is not True:raise RuntimeError('Chemistry healthz ok != true')
              c,_,_=pub('/chemistry/catalog','application/json')
              if c!=200:raise RuntimeError('Chemistry catalog HTTP '+str(c))
              c,_,b=pub('/chemistry/download/MUSITU_Chemistry_Mastery_1.3.0.apk','application/vnd.android.package-archive')
              if c!=200 or len(b)!=int(os.environ['CHEMISTRY_BYTES']) or sha(b)!=os.environ['CHEMISTRY_SHA256']:raise RuntimeError('Chemistry stable APK invariant failed')

          def create_bucket_and_objects():
              wrangler('r2','bucket','create',BUCKET)
              mut['bucket']=True
              buckets_obj=cf(f'/accounts/{AID}/r2/buckets?name_contains='+urllib.parse.quote(BUCKET)+'&per_page=100') or {}
              buckets=buckets_obj.get('buckets') if isinstance(buckets_obj,dict) else buckets_obj
              if len([b for b in (buckets or []) if isinstance(b,dict) and b.get('name')==BUCKET])!=1:raise RuntimeError('R2 bucket readback failed')
              for key,path,expected_sha,expected_bytes,mime,filename in OBJECTS:
                  if path.stat().st_size!=expected_bytes or sha(path.read_bytes())!=expected_sha:raise RuntimeError('local release object drift '+key)
                  wrangler('r2','object','put',BUCKET+'/'+key,'--file='+str(path),'--remote','--content-type='+mime,'--content-disposition=attachment; filename="'+filename+'"')
                  mut['objects'].append(key)
                  check=pathlib.Path('/tmp/store-release/readback-'+filename)
                  if check.exists():check.unlink()
                  wrangler('r2','object','get',BUCKET+'/'+key,'--file='+str(check),'--remote')
                  raw=check.read_bytes()
                  if len(raw)!=expected_bytes or sha(raw)!=expected_sha:raise RuntimeError('R2 object readback invariant failed '+key)

          def deploy_worker():
              base=pathlib.Path('store/phase1/web-surface')
              modules=[]
              for name in ('worker.mjs','render.mjs','assets.mjs','generated-data.mjs'):
                  data=(base/name).read_bytes()
                  modules.append((name,data))
              metadata={'main_module':'worker.mjs','compatibility_date':'2026-09-09','bindings':[{'type':'r2_bucket','name':'STORE_RELEASES','bucket_name':BUCKET}]}
              boundary,body=multipart_modules(metadata,modules)
              h=dict(AUTH); h['Content-Type']='multipart/form-data; boundary='+boundary
              c,_,b=req(f'{API}/accounts/{AID}/workers/scripts/{urllib.parse.quote(WORKER,safe="")}', 'PUT',h,body,90)
              if not 200<=c<300:raise RuntimeError('Store Worker upload HTTP '+str(c)+' '+b[:500].decode('utf-8','ignore'))
              mut['worker']=True
              cf(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(WORKER,safe="")}/subdomain','POST',{'enabled':False,'previews_enabled':False})
              settings=cf(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(WORKER,safe="")}/settings') or {}
              bindings={x.get('name'):x for x in settings.get('bindings') or [] if isinstance(x,dict)}
              rb=bindings.get('STORE_RELEASES') or {}
              if rb.get('type')!='r2_bucket' or rb.get('bucket_name')!=BUCKET:raise RuntimeError('Store Worker R2 binding readback failed')
              sub=cf(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(WORKER,safe="")}/subdomain') or {}
              if sub.get('enabled') is not False or sub.get('previews_enabled') is not False:raise RuntimeError('Store workers.dev exposure is not disabled')

          def create_route():
              result=cf(f'/zones/{ZID}/workers/routes','POST',{'pattern':ROUTE,'script':WORKER}) or {}
              rid=result.get('id')
              if not rid:raise RuntimeError('Store route id absent')
              mut['route_id']=rid
              routes=cf(f'/zones/{ZID}/workers/routes') or []
              exact=[r for r in routes if isinstance(r,dict) and r.get('pattern')==ROUTE]
              if len(exact)!=1 or exact[0].get('script')!=WORKER or exact[0].get('id')!=rid:raise RuntimeError('Store route readback mismatch')

          def verify_store_public():
              ready=False; last=None
              for _ in range(30):
                  c,h,b=pub('/store','text/html'); last=(c,b[:240])
                  if c==200 and b'MUSITU Store' in b:ready=True;break
                  time.sleep(2)
              if not ready:raise RuntimeError('Store public surface did not become ready: '+repr(last))
              c,_,b=pub('/store/healthz','application/json')
              if c!=200:raise RuntimeError('Store healthz HTTP '+str(c))
              o=json.loads(b or b'{}')
              if o.get('ok') is not True or o.get('phase')!='phase1' or o.get('phase2_authorized') is not False or o.get('fresh_device_phase1_complete') is not False:raise RuntimeError('Store health contract mismatch')
              expected_catalog=pathlib.Path('store/phase1/catalog.json').read_bytes(); expected_sig=pathlib.Path('store/phase1/catalog.sig').read_bytes()
              c,_,b=pub('/store/catalog.json','application/json')
              if c!=200 or b!=expected_catalog:raise RuntimeError('public Store catalog exact-byte mismatch')
              c,_,b=pub('/store/catalog.sig','text/plain')
              if c!=200 or b!=expected_sig:raise RuntimeError('public Store catalog signature exact-byte mismatch')
              c,_,b=pub('/store/sw.js','application/javascript')
              if c!=200 or b'CACHEABLE' not in b or b'MUSITU_Store_1.0.0.apk' in b:raise RuntimeError('Store service-worker cache boundary mismatch')
              c,_,b=pub('/store/manifest.webmanifest','application/manifest+json')
              if c!=200 or json.loads(b).get('name')!='MUSITU Store':raise RuntimeError('Store manifest mismatch')
              c,h,b=pub('/store?lite=1','text/html')
              if c!=200 or b'Low-bandwidth mode' not in b:raise RuntimeError('Store low-bandwidth mode mismatch')
              reqsn=urllib.request.Request(BASE+'/store',headers={'Accept':'text/html','Accept-Language':'sn','User-Agent':'MUSITU-Store-Phase1-Locale-Probe/1.0'},method='GET')
              try:
                  with urllib.request.urlopen(reqsn,timeout=60) as r: sc=r.status; sh=r.headers; sb=r.read()
              except urllib.error.HTTPError as e: sc=e.code; sh=e.headers; sb=e.read()
              if sc!=200 or sh.get('Content-Language')!='sn' or 'Isa MUSITU'.encode() not in sb:raise RuntimeError('Store Shona locale negotiation mismatch')
              for path,_,expected_sha,expected_bytes,_,_ in OBJECTS:
                  public_path={'bootstrap/MUSITU_Store_1.0.0.apk':'/store/bootstrap/MUSITU_Store_1.0.0.apk','ios/MUSITU_Chemistry_1.3.0.ipa':'/store/ios/MUSITU_Chemistry_1.3.0.ipa','android/MUSITU_Chemistry_Mastery_1.3.0.apk':'/store/android/repo/MUSITU_Chemistry_Mastery_1.3.0.apk'}[path]
                  c,h,b=pub(public_path,'application/octet-stream')
                  if c!=200 or len(b)!=expected_bytes or sha(b)!=expected_sha:raise RuntimeError('public release binary invariant failed '+public_path)
                  if h.get('X-Content-SHA256')!=expected_sha:raise RuntimeError('public release integrity header mismatch '+public_path)
              verify_chemistry()
              domains=cf(f'/accounts/{AID}/workers/domains') or []
              pm=[d for d in domains if isinstance(d,dict) and d.get('hostname')==HOST]
              if len(pm)!=1 or pm[0].get('service')!=ORIGIN:raise RuntimeError('payments Custom Domain owner changed')
              routes=cf(f'/zones/{ZID}/workers/routes') or []
              post=[(r.get('id'),r.get('pattern'),r.get('script')) for r in routes if isinstance(r,dict) and HOST in str(r.get('pattern') or '') and r.get('pattern')!=ROUTE]
              if sorted(post)!=sorted(pre['routes']):raise RuntimeError('preexisting payments Worker routes changed')

          def rollback():
              errs=[]
              if mut.get('route_id'):
                  try:cf(f'/zones/{ZID}/workers/routes/{mut["route_id"]}','DELETE',expected={200,204,404})
                  except Exception as e:errs.append('route:'+repr(e))
              if mut.get('worker'):
                  try:cf(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(WORKER,safe="")}','DELETE',expected={200,204,404})
                  except Exception as e:errs.append('worker:'+repr(e))
              for key in reversed(mut.get('objects') or []):
                  p=wrangler('r2','object','delete',BUCKET+'/'+key,'--remote',check=False)
                  if p.returncode!=0:errs.append('object:'+key+':'+p.stdout[-400:])
              if mut.get('bucket'):
                  p=wrangler('r2','bucket','delete',BUCKET,check=False)
                  if p.returncode!=0:errs.append('bucket:'+p.stdout[-400:])
              try:
                  c,_,_=pub('/store','text/html')
                  if c!=404:errs.append('rollback_store_status:'+str(c))
                  verify_chemistry()
              except Exception as e:errs.append('rollback_proof:'+repr(e))
              return errs

          try:
              preflight()
              create_bucket_and_objects()
              deploy_worker()
              create_route()
              verify_store_public()
              out={
                'schema':'musitu.store.phase1.production_deploy_evidence.v1',
                'head_sha':os.environ['GITHUB_SHA'],
                'sealed_main':os.environ['SEALED_MAIN'],
                'store_url':BASE+'/store',
                'worker':WORKER,
                'route':ROUTE,
                'r2_bucket':BUCKET,
                'store_apk_sha256':os.environ['STORE_APK_SHA256'],
                'ios_sha256':os.environ['IOS_SHA256'],
                'chemistry_apk_sha256':os.environ['CHEMISTRY_SHA256'],
                'payments_origin_service':ORIGIN,
                'preexisting_routes_preserved':True,
                'chemistry_invariants_preserved':True,
                'private_signing_key_used':False,
                'phase2_authorized':False,
                'fresh_device_phase1_complete':False,
                'production_deployment_performed':True,
                'rollback_performed':False,
                'gate':'MUSITU_STORE_PHASE1_PRODUCTION_DEPLOY_PASS'
              }
              raw=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode()
              pathlib.Path('/tmp/store-deploy-evidence/deployment.json').write_bytes(raw)
              pathlib.Path('/tmp/store-deploy-evidence/deployment.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  deployment.json\n')
              print(json.dumps(out,sort_keys=True))
          except Exception as original:
              errs=rollback()
              raise RuntimeError('production deploy failed and rollback executed: '+repr(original)+'; rollback_errors='+repr(errs))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-store-phase1-production-deploy-evidence
          path: /tmp/store-deploy-evidence
          retention-days: 90
          if-no-files-found: error
