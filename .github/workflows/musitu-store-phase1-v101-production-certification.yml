name: MUSITU Store Phase 1 v1.0.1 Production Certification

on:
  push:
    branches: [musitu-store-phase1-20260909]
    paths:
      - '.github/workflows/musitu-store-phase1-v101-production-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      ZONE_NAME: mftintelligence.com
      PAYMENTS_HOST: payments.mftintelligence.com
      PAYMENTS_ORIGIN: mft-paynow-transport-gateway
      STORE_WORKER: musitu-store-phase1
      STORE_ROUTE: payments.mftintelligence.com/store*
      STORE_BUCKET: musitu-store-phase1-releases
      SEALED_MAIN: d6a846f6bbe0bccac1758713eb4de167caf07113
      NEW_STORE_SHA: b755210f303ebb6d22a3177bb21e5ebae2e076901021ee62ca2fe6ab0f14af82
      NEW_STORE_BYTES: '1679572'
      OLD_STORE_SHA: 71391bf614cc1186cbe1fda17e9e626aad71d96dbf26807228b73bd2ea99b2f8
      OLD_STORE_BYTES: '1687882'
      STORE_SIGNER_SHA: 43695b6103d7ab57e89166c9a537f1810b7e33053e20332b1d4e7e2e1c612671
      CHEMISTRY_SHA: 4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd
      CHEMISTRY_BYTES: '5892286'
      CHEMISTRY_SIGNER_SHA: d4455ac3ec74a6d7cd7993ca640f554a83bba95dfd01ef508f7637b6bc72c0d8
      IOS_SHA: 426d2dc05e2fc8846a7582324d953bbdd2a256f170f8db2b5a956bc1c51cc962
      IOS_BYTES: '3640968'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android verification tools
        run: sdkmanager 'build-tools;36.0.0'

      - name: Prove exact branch tip, sealed main and signed revision-2 catalog
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'musitu-store-phase1-20260909'
          remote_tip="$(git ls-remote origin 'refs/heads/musitu-store-phase1-20260909' | awk '{print $1}')"
          test "$remote_tip" = "$GITHUB_SHA"
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "$SEALED_MAIN"
          echo '4cf17f70dbab900237d8b82b4e989978c667e6ec841de6df79469aa6c5ebd5c0  store/phase1/catalog-signing-public.pem' | sha256sum -c -
          base64 -d < store/phase1/catalog.sig > /tmp/catalog.sig.der
          openssl dgst -sha256 -verify store/phase1/catalog-signing-public.pem -signature /tmp/catalog.sig.der store/phase1/catalog.json
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('store/phase1/catalog.json').read_text())
          b=json.loads(Path('store/phase1/bootstrap/release.json').read_text())
          assert c['revision']==2
          assert c['releaseControl']['phase']=='phase1'
          assert c['releaseControl']['phase2Authorized'] is False
          assert c['releaseControl']['publicationState']=='private-predeployment'
          sc=c['releaseControl']['storeClient']
          assert sc['version']=='1.0.1' and sc['versionCode']==10001
          assert sc['packageId']=='com.musitu.store'
          assert sc['sha256']=='b755210f303ebb6d22a3177bb21e5ebae2e076901021ee62ca2fe6ab0f14af82'
          assert sc['bytes']==1679572
          assert b['artifactFile']=='MUSITU_Store_1.0.1.apk'
          assert b['sha256']==sc['sha256']
          print('SIGNED_REV2_REPOSITORY_BOUNDARY=PASS')
          PY

      - name: Read-only public and Cloudflare production certification
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_GLOBAL_API_KEY"
          mkdir -p /tmp/store-v101-cert /tmp/store-v101-downloads
          python - <<'PY'
          import hashlib,json,os,pathlib,plistlib,time,urllib.error,urllib.parse,urllib.request,zipfile
          API='https://api.cloudflare.com/client/v4'; AID=os.environ['ACCOUNT_ID']; ZID=os.environ['ZONE_ID']; ZONE=os.environ['ZONE_NAME']
          HOST=os.environ['PAYMENTS_HOST']; ORIGIN=os.environ['PAYMENTS_ORIGIN']; WORKER=os.environ['STORE_WORKER']; ROUTE=os.environ['STORE_ROUTE']; BUCKET=os.environ['STORE_BUCKET']; BASE='https://'+HOST
          AUTH={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'Accept':'application/json','User-Agent':'MUSITU-Store-v101-Independent-Certification/1.0'}
          D=pathlib.Path('/tmp/store-v101-downloads'); checks={}
          expected_catalog=pathlib.Path('store/phase1/catalog.json').read_bytes(); expected_sig=pathlib.Path('store/phase1/catalog.sig').read_bytes()
          def sha(b): return hashlib.sha256(b).hexdigest()
          def req(path,accept='*/*',ua='MUSITU-Store-v101-Independent-Certification/1.0',extra=None):
              h={'Accept':accept,'User-Agent':ua,'Cache-Control':'no-cache','Pragma':'no-cache'}; h.update(extra or {})
              q=urllib.request.Request(BASE+path,headers=h,method='GET')
              try:
                  with urllib.request.urlopen(q,timeout=90) as r:return r.status,r.headers,r.read()
              except urllib.error.HTTPError as e:return e.code,e.headers,e.read()
          def cf(path):
              q=urllib.request.Request(API+path,headers=AUTH,method='GET')
              try:
                  with urllib.request.urlopen(q,timeout=60) as r:c=r.status;b=r.read()
              except urllib.error.HTTPError as e:c=e.code;b=e.read()
              if c!=200: raise RuntimeError(f'Cloudflare GET {path} HTTP {c}')
              o=json.loads(b or b'{}')
              if o.get('success') is not True: raise RuntimeError('Cloudflare success=false '+path)
              return o.get('result')
          # Require stable release truth from three independent no-cache samples.
          samples=[]
          for i in range(3):
              hc,hh,hb=req('/store/healthz','application/json'); h=json.loads(hb or b'{}') if hc==200 else {}
              cc,ch,cb=req('/store/catalog.json','application/json'); sc,sh,sb=req('/store/catalog.sig','text/plain')
              sample={'health_http':hc,'revision':h.get('catalog_revision'),'runtime':h.get('runtime_publication_state'),'catalog_exact':cc==200 and cb==expected_catalog,'signature_exact':sc==200 and sb==expected_sig,'cf_ray':hh.get('CF-Ray')}
              samples.append(sample)
              if not (h.get('ok') is True and h.get('catalog_revision')==2 and h.get('catalog_publication_state')=='private-predeployment' and h.get('runtime_publication_state')=='production' and h.get('production_deployed') is True and h.get('phase2_authorized') is False and h.get('fresh_device_phase1_complete') is False and sample['catalog_exact'] and sample['signature_exact']):
                  raise RuntimeError('revision-2 release truth not stable: '+json.dumps(sample,sort_keys=True))
              time.sleep(1)
          checks['release_truth_samples']=samples
          # Exact public binaries, retaining old rollback object.
          bins=[
            ('store_v101','/store/bootstrap/MUSITU_Store_1.0.1.apk','MUSITU_Store_1.0.1.apk',int(os.environ['NEW_STORE_BYTES']),os.environ['NEW_STORE_SHA']),
            ('store_v100','/store/bootstrap/MUSITU_Store_1.0.0.apk','MUSITU_Store_1.0.0.apk',int(os.environ['OLD_STORE_BYTES']),os.environ['OLD_STORE_SHA']),
            ('chemistry','/store/android/repo/MUSITU_Chemistry_Mastery_1.3.0.apk','MUSITU_Chemistry_Mastery_1.3.0.apk',int(os.environ['CHEMISTRY_BYTES']),os.environ['CHEMISTRY_SHA']),
            ('ios','/store/ios/MUSITU_Chemistry_1.3.0.ipa','MUSITU_Chemistry_1.3.0.ipa',int(os.environ['IOS_BYTES']),os.environ['IOS_SHA']),
          ]
          for name,path,fn,size,digest in bins:
              c,h,b=req(path,'application/octet-stream')
              if c!=200 or len(b)!=size or sha(b)!=digest or h.get('X-Content-SHA256')!=digest: raise RuntimeError('binary mismatch '+name)
              (D/fn).write_bytes(b); checks[name+'_sha256']=digest
          # Platform/customer surfaces.
          cases=[('android','Mozilla/5.0 (Linux; Android 14; Pixel 8)',[b'Recommended for Android',b'MUSITU_Store_1.0.1.apk']),('iphone','Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)',[b'Recommended for iOS',b'SideStore',b'Open the PWA']),('ipad','Mozilla/5.0 (iPad; CPU OS 18_0 like Mac OS X)',[b'Recommended for iOS',b'SideStore',b'Open the PWA']),('desktop','Mozilla/5.0 (Windows NT 10.0; Win64; x64)',[b'Recommended for this browser',b'Installable PWA'])]
          for name,ua,needles in cases:
              c,_,b=req('/store/install','text/html',ua)
              if c!=200 or any(n not in b for n in needles): raise RuntimeError('platform routing '+name)
          for lang,needle in [('en',b'Install MUSITU'),('sn',b'Isa MUSITU'),('nd',b'Faka i-MUSITU')]:
              c,h,b=req('/store?lang='+lang,'text/html')
              if c!=200 or h.get('Content-Language')!=lang or needle not in b: raise RuntimeError('locale '+lang)
          c,_,b=req('/store?lite=1','text/html');
          if c!=200 or b'Low-bandwidth mode' not in b: raise RuntimeError('lite mode')
          c,_,b=req('/store/offline','text/html');
          if c!=200 or b'Offline &amp; recovery' not in b or b'SHA-256' not in b: raise RuntimeError('offline page')
          c,_,b=req('/store/sw.js','application/javascript')
          if c!=200 or b'MUSITU_Store_1.0.1.apk' in b or b'MUSITU_Store_1.0.0.apk' in b: raise RuntimeError('installer cache boundary')
          # iOS carrier identity.
          with zipfile.ZipFile(D/'MUSITU_Chemistry_1.3.0.ipa') as z:
              names=[n for n in z.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist')]
              if len(names)!=1: raise RuntimeError('IPA plist count')
              info=plistlib.loads(z.read(names[0]))
          if info.get('CFBundleIdentifier')!='com.musitu.chemistry' or info.get('CFBundleShortVersionString')!='1.3.0' or str(info.get('CFBundleVersion'))!='10200' or info.get('MinimumOSVersion')!='15.0': raise RuntimeError('IPA identity')
          # Canonical Chemistry outside /store remains exact.
          c,_,b=req('/chemistry/healthz','application/json');
          if c!=200 or json.loads(b or b'{}').get('ok') is not True: raise RuntimeError('Chemistry health')
          c,_,b=req('/chemistry/download/MUSITU_Chemistry_Mastery_1.3.0.apk','application/vnd.android.package-archive')
          if c!=200 or len(b)!=int(os.environ['CHEMISTRY_BYTES']) or sha(b)!=os.environ['CHEMISTRY_SHA']: raise RuntimeError('Chemistry canonical APK drift')
          # Cloudflare topology is read-only and must remain isolated.
          zones=cf('/zones?name='+urllib.parse.quote(ZONE)+'&status=active') or []
          if len(zones)!=1 or zones[0].get('id')!=ZID or (zones[0].get('account') or {}).get('id')!=AID: raise RuntimeError('zone/account')
          domains=cf(f'/accounts/{AID}/workers/domains') or []; dm=[d for d in domains if isinstance(d,dict) and d.get('hostname')==HOST]
          if len(dm)!=1 or dm[0].get('service')!=ORIGIN: raise RuntimeError('payments origin')
          routes=cf(f'/zones/{ZID}/workers/routes') or []; exact=[r for r in routes if isinstance(r,dict) and r.get('pattern')==ROUTE]
          if len(exact)!=1 or exact[0].get('script')!=WORKER: raise RuntimeError('Store route')
          settings=cf(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(WORKER,safe="")}/settings') or {}; bs={x.get('name'):x for x in settings.get('bindings') or [] if isinstance(x,dict)}
          if set(bs)!={'STORE_RELEASES','STORE_RUNTIME_PUBLICATION_STATE'} or (bs['STORE_RELEASES'].get('bucket_name')!=BUCKET) or (bs['STORE_RUNTIME_PUBLICATION_STATE'].get('text')!='production'): raise RuntimeError('Store bindings')
          checks['route_id']=exact[0].get('id')
          out={'schema':'musitu.store.phase1.v101.production_certification.v1','head_sha':os.environ['GITHUB_SHA'],'sealed_main':os.environ['SEALED_MAIN'],'catalog_revision':2,'store_version':'1.0.1','store_sha256':os.environ['NEW_STORE_SHA'],'rollback_store_sha256':os.environ['OLD_STORE_SHA'],'chemistry_sha256':os.environ['CHEMISTRY_SHA'],'ios_sha256':os.environ['IOS_SHA'],'catalog_signature_verified':True,'release_truth_stable':True,'platforms_verified':['android','iphone','ipad','desktop'],'locales_verified':['en','sn','nd'],'offline_low_bandwidth_verified':True,'cloudflare_topology_verified':True,'chemistry_invariants_preserved':True,'write_performed':False,'phase2_authorized':False,'fresh_device_phase1_complete':False,'checks':checks,'gate':'MUSITU_STORE_V101_PRODUCTION_CERTIFICATION_PASS'}
          raw=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode(); pathlib.Path('/tmp/store-v101-cert/certification.json').write_bytes(raw); pathlib.Path('/tmp/store-v101-cert/certification.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  certification.json\n')
          print(json.dumps({'gate':out['gate'],'write_performed':False,'catalog_revision':2,'store_version':'1.0.1'},sort_keys=True))
          PY

      - name: Independently verify Android package and signer identities
        shell: bash
        run: |
          set -euo pipefail
          STORE=/tmp/store-v101-downloads/MUSITU_Store_1.0.1.apk
          CHEM=/tmp/store-v101-downloads/MUSITU_Chemistry_Mastery_1.3.0.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$STORE" | tee /tmp/store-v101-cert/store-apksigner.txt
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/store-v101-cert/store-apksigner.txt | head -n1 | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          test "$actual" = "$STORE_SIGNER_SHA"
          grep -q '^Verified using v1 scheme (JAR signing): false$' /tmp/store-v101-cert/store-apksigner.txt
          grep -q '^Verified using v2 scheme (APK Signature Scheme v2): true$' /tmp/store-v101-cert/store-apksigner.txt
          grep -q '^Verified using v3 scheme (APK Signature Scheme v3): true$' /tmp/store-v101-cert/store-apksigner.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$STORE" | tee /tmp/store-v101-cert/store-aapt.txt
          grep -q "package: name='com.musitu.store' versionCode='10001' versionName='1.0.1'" /tmp/store-v101-cert/store-aapt.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$CHEM" | tee /tmp/store-v101-cert/chem-apksigner.txt
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/store-v101-cert/chem-apksigner.txt | head -n1 | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          test "$actual" = "$CHEMISTRY_SIGNER_SHA"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$CHEM" | tee /tmp/store-v101-cert/chem-aapt.txt
          grep -q "package: name='com.musitu.chemistry' versionCode='10200' versionName='1.3.0'" /tmp/store-v101-cert/chem-aapt.txt
          echo ANDROID_NATIVE_IDENTITIES=PASS

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-store-v101-production-certification
          path: /tmp/store-v101-cert
          retention-days: 90
          if-no-files-found: error
