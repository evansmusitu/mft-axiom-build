name: MUSITU Store Phase 2 Response Body Equivalence

on:
  push:
    branches: [musitu-store-phase2-standards-hardening-20260911]
    paths:
      - 'store/phase2/response-body-equivalence.mjs'
      - 'store/phase2/apply-standards-hardening.py'
      - '.github/workflows/musitu-store-phase2-body-equivalence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SEALED_MAIN: d6a846f6bbe0bccac1758713eb4de167caf07113
      PHASE1_HEAD: ebded495617cc89bb96d7a5531c1ce4fc6bbedd9
      CATALOG_SHA: 4fa31c5f9f84facc0d1fbf7a91a50b0adcaa5ef4c97b7d82abbe9657ea10b7f9
      CATALOG_SIG_SHA: 9b854358f90368ceb5cc3baab8d99064d8ee94b79ead378a614f8cc1732b06a7
      CANDIDATE_WORKER_SHA: ee95b816bc056ab79be4d764cf88a68e25feed7aafdaad33ff23e2188f954616

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove anchors and fetch exact live release truth
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main musitu-store-phase1-20260909
          test "$(git rev-parse origin/main)" = "$SEALED_MAIN"
          test "$(git rev-parse origin/musitu-store-phase1-20260909)" = "$PHASE1_HEAD"
          curl --retry 3 --retry-all-errors -fsSL https://payments.mftintelligence.com/store/catalog.json -o /tmp/catalog.json
          curl --retry 3 --retry-all-errors -fsSL https://payments.mftintelligence.com/store/catalog.sig -o /tmp/catalog.sig
          test "$(sha256sum /tmp/catalog.json | awk '{print $1}')" = "$CATALOG_SHA"
          test "$(sha256sum /tmp/catalog.sig | awk '{print $1}')" = "$CATALOG_SIG_SHA"

      - name: Reconstruct baseline and hardened candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p2-baseline /tmp/p2-candidate /tmp/p2-equivalence
          mkdir -p /tmp/p2-equivalence
          git worktree add --detach /tmp/p2-baseline "$PHASE1_HEAD"
          git worktree add --detach /tmp/p2-candidate "$PHASE1_HEAD"
          for root in /tmp/p2-baseline /tmp/p2-candidate; do
            cp /tmp/catalog.json "$root/store/phase1/catalog.json"
            cp /tmp/catalog.sig "$root/store/phase1/catalog.sig"
            ROOT="$root" python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])/'store/phase1'
          c=json.loads((root/'catalog.json').read_text())
          assert c['revision']==3
          sc=c['releaseControl']['storeClient']
          assert sc['version']=='1.0.2' and sc['versionCode']==10002
          assert sc['sha256']=='3a0c4b0f971ec84cd6167a137f8e3d75c7bb20e525c26ab533b3d88044cd0784'
          bpath=root/'bootstrap/release.json'
          b=json.loads(bpath.read_text())
          b.update({'version':'1.0.2','versionCode':10002,'packageId':'com.musitu.store','artifactFile':'MUSITU_Store_1.0.2.apk','sha256':sc['sha256'],'bytes':1679340,'signingCertificateSha256':'43695b6103d7ab57e89166c9a537f1810b7e33053e20332b1d4e7e2e1c612671'})
          bpath.write_text(json.dumps(b,indent=2)+'\n')
          w=root/'web-surface/worker.mjs'
          s=w.read_text()
          if 'MUSITU_Store_1.0.2.apk' not in s:
              needle='const RELEASE_ASSETS={\n'
              entry="  '/store/bootstrap/MUSITU_Store_1.0.2.apk':{key:'bootstrap/MUSITU_Store_1.0.2.apk',sha256:'3a0c4b0f971ec84cd6167a137f8e3d75c7bb20e525c26ab533b3d88044cd0784',bytes:1679340,type:'application/vnd.android.package-archive',name:'MUSITU_Store_1.0.2.apk'},\n"
              assert needle in s
              w.write_text(s.replace(needle,needle+entry,1))
          PY
            (cd "$root" && python store/phase1/web-surface/build_store_data.py)
          done
          python store/phase2/apply-standards-hardening.py /tmp/p2-candidate/store/phase1/web-surface/worker.mjs
          test "$(sha256sum /tmp/p2-candidate/store/phase1/web-surface/worker.mjs | awk '{print $1}')" = "$CANDIDATE_WORKER_SHA"

      - name: Prove accessibility-relevant response body equivalence
        shell: bash
        env:
          BASELINE_WORKER_PATH: /tmp/p2-baseline/store/phase1/web-surface/worker.mjs
          CANDIDATE_WORKER_PATH: /tmp/p2-candidate/store/phase1/web-surface/worker.mjs
        run: |
          set -euo pipefail
          node store/phase2/response-body-equivalence.mjs "$BASELINE_WORKER_PATH" "$CANDIDATE_WORKER_PATH" | tee /tmp/p2-equivalence/body-equivalence.json
          grep -q '"result": "PASS"' /tmp/p2-equivalence/body-equivalence.json

      - name: Seal equivalence proof
        shell: bash
        run: |
          set -euo pipefail
          sha256sum /tmp/p2-equivalence/body-equivalence.json > /tmp/p2-equivalence/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-store-phase2-body-equivalence
          path: /tmp/p2-equivalence
          retention-days: 90
          if-no-files-found: error
