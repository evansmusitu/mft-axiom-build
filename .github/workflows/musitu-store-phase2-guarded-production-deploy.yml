name: MUSITU Store Phase 2 Guarded Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-store-phase2-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SEALED_MAIN: d6a846f6bbe0bccac1758713eb4de167caf07113
      PHASE1_HEAD: ebded495617cc89bb96d7a5531c1ce4fc6bbedd9
      QUALIFICATION_HEAD: 142da49e1a8ee185a9494690651b8a2a0be81143
      BASELINE_WORKER_SHA: e17e0c7bde55d9f8d41b476e917159b6bf39b46c3895b7ec6d2a7b4f705beb81
      LIVE_RENDER_SHA: fc4abcec85fd5338c71e26fad5b21d318c99e6a1e1bd62f09091db9c4e914e04
      LIVE_ASSETS_SHA: 443e558c297d700bedc706ea56647c97162709e5178b80acd63d478054bba4b4
      LIVE_GENERATED_DATA_SHA: 27ab78a914019cb44844de51bd0f4be46dc53bdf4b928a8dff7944228ccce063
      CANDIDATE_WORKER_SHA: c98e6e36fa153f16a05c627b10b9a562e5f2ffde1f02ec0a7676a8d5121b7cce
      EXPECTED_COMPATIBILITY_DATE: '2026-09-09'
      STORE_SHA: 3a0c4b0f971ec84cd6167a137f8e3d75c7bb20e525c26ab533b3d88044cd0784
      STORE_BYTES: '1679340'
      CATALOG_SHA: 4fa31c5f9f84facc0d1fbf7a91a50b0adcaa5ef4c97b7d82abbe9657ea10b7f9
      CATALOG_SIG_SHA: 9b854358f90368ceb5cc3baab8d99064d8ee94b79ead378a614f8cc1732b06a7
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      ZONE_NAME: mftintelligence.com
      PAYMENTS_HOST: payments.mftintelligence.com
      PAYMENTS_ORIGIN: mft-paynow-transport-gateway
      STORE_WORKER: musitu-store-phase1
      STORE_ROUTE: payments.mftintelligence.com/store*
      STORE_BUCKET: musitu-store-phase1-releases
      MANUAL_PACKET: evidence/musitu-store/MUSITU_STORE_PHASE2_MANUAL_ACCESSIBILITY_CERTIFICATION_PACKET_20260911.json
      CANDIDATE_CERT: evidence/musitu-store/MUSITU_STORE_PHASE2_REPAIRED_LIVE_HARDENED_CANDIDATE_CERTIFICATION_20260911.json
      BODY_EQUIVALENCE_RECORD: evidence/musitu-store/MUSITU_STORE_PHASE2_REPAIRED_LIVE_RESPONSE_BODY_EQUIVALENCE_20260911.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove immutable repository anchors and candidate transform
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'musitu-store-phase2-standards-hardening-20260911'
          git fetch --quiet origin main musitu-store-phase1-20260909
          test "$(git rev-parse origin/main)" = "$SEALED_MAIN"
          test "$(git rev-parse origin/musitu-store-phase1-20260909)" = "$PHASE1_HEAD"
          git merge-base --is-ancestor "$QUALIFICATION_HEAD" "$GITHUB_SHA"
          test -z "$(git diff --name-only "$QUALIFICATION_HEAD"..."$GITHUB_SHA" -- store/phase2/apply-standards-hardening.py store/phase2/browser_machine_presentation.py store/phase2/response-body-equivalence.mjs store/phase2/security-hardening-smoke.mjs store/phase2/standards-browser-smoke.mjs)"
          test -z "$(git diff --name-only "$PHASE1_HEAD"..."$GITHUB_SHA" -- store/phase1 commerce/chemistry)"
          python -m py_compile store/phase2/capture_exact_live_store_worker.py store/phase2/deploy_hardened_store.py store/phase2/validate_manual_accessibility_packet.py
          node --check store/phase2/response-body-equivalence.mjs
          node --check store/phase2/security-hardening-smoke.mjs
          echo PHASE2_DEPLOY_REPOSITORY_ANCHORS=PASS

      - name: Require reviewed real manual accessibility evidence before any production mutation
        shell: bash
        run: |
          set -euo pipefail
          python store/phase2/validate_manual_accessibility_packet.py "$MANUAL_PACKET" . | tee /tmp/manual-accessibility-validation.json
          grep -q '"result": "PASS"' /tmp/manual-accessibility-validation.json
          echo REAL_MANUAL_ACCESSIBILITY_GATE=PASS

      - name: Require repaired-live response-body equivalence proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ['BODY_EQUIVALENCE_RECORD']).read_text())
          assert d['status']=='PASS'
          assert d['repository']['workflow_head']=='142da49e1a8ee185a9494690651b8a2a0be81143'
          assert d['repository']['baseline_live_worker_sha256']==os.environ['BASELINE_WORKER_SHA']
          assert d['repository']['certified_candidate_worker_sha256']==os.environ['CANDIDATE_WORKER_SHA']
          assert d['workflow']['run_id']=='34582501210'
          assert d['workflow']['artifact']['id']=='10192199123'
          assert d['workflow']['artifact']['digest']=='sha256:3b1c157fd2a061c26c9b150c5e018aefc109ddd6cea3d8fab3e1e2908717f497'
          assert d['proof']['normal_store_response_body_byte_equality'] is True
          assert d['proof']['machine_endpoint_payload_byte_equality'] is True
          assert d['proof']['browser_presentation_preserved'] is True
          assert d['proof']['raw_query_override_byte_identical'] is True
          assert d['proof']['unexpected_header_delta'] is False
          assert d['manual_evidence_applicability']['current_live_store_1_0_2_body_may_be_manually_tested_for_candidate'] is True
          print('REPAIRED_LIVE_RESPONSE_BODY_EQUIVALENCE_GATE=PASS')
          PY

      - name: Require repaired-live hardened candidate certification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ['CANDIDATE_CERT']).read_text())
          assert d['status']=='PASS_PREDEPLOY_MANUAL_AND_DEPLOYMENT_PENDING'
          assert d['repository']['qualification_head']=='142da49e1a8ee185a9494690651b8a2a0be81143'
          assert d['baseline']['worker_sha256']==os.environ['BASELINE_WORKER_SHA']
          assert d['candidate']['worker_sha256']==os.environ['CANDIDATE_WORKER_SHA']
          assert d['candidate']['browser_presentation_preserved'] is True
          assert d['candidate']['machine_client_bytes_preserved'] is True
          assert d['candidate']['production_mutation'] is False
          assert d['github_actions']['run_id']==34582501210
          assert d['github_actions']['artifact']['id']==10192199123
          assert d['github_actions']['artifact']['digest']=='sha256:3b1c157fd2a061c26c9b150c5e018aefc109ddd6cea3d8fab3e1e2908717f497'
          assert d['gates']['security_hardening_runtime']=='PASS'
          assert d['gates']['automated_accessibility_low_bandwidth']=='PASS_AUTOMATED'
          assert d['gates']['lighthouse']['result']=='PASS'
          assert d['phase2Complete'] is False
          print('REPAIRED_LIVE_HARDENED_CANDIDATE_GATE=PASS')
          PY

      - name: Capture exact current repaired live Worker — GET only
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          LIVE_WORKER_SHA: ${{ env.BASELINE_WORKER_SHA }}
          LIVE_MODULE_OUTPUT: /tmp/musitu-p2-live-baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/musitu-p2-live-baseline /tmp/musitu-p2-candidate /tmp/musitu-store-phase2-deploy-evidence
          mkdir -p /tmp/musitu-store-phase2-deploy-evidence
          test -n "$CLOUDFLARE_EMAIL" && test -n "$CLOUDFLARE_GLOBAL_API_KEY"
          python store/phase2/capture_exact_live_store_worker.py | tee /tmp/musitu-store-phase2-deploy-evidence/live-baseline-capture.json
          grep -q '"result": "PASS_EXACT_LIVE_CAPTURE"' /tmp/musitu-store-phase2-deploy-evidence/live-baseline-capture.json

      - name: Build exact hardened candidate from captured repaired live modules
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/musitu-p2-live-baseline /tmp/musitu-p2-candidate
          python store/phase2/apply-standards-hardening.py /tmp/musitu-p2-candidate/worker.mjs
          node --check /tmp/musitu-p2-candidate/worker.mjs
          test "$(sha256sum /tmp/musitu-p2-candidate/worker.mjs | awk '{print $1}')" = "$CANDIDATE_WORKER_SHA"
          cmp /tmp/musitu-p2-live-baseline/render.mjs /tmp/musitu-p2-candidate/render.mjs
          cmp /tmp/musitu-p2-live-baseline/assets.mjs /tmp/musitu-p2-candidate/assets.mjs
          cmp /tmp/musitu-p2-live-baseline/generated-data.mjs /tmp/musitu-p2-candidate/generated-data.mjs
          BASELINE_WORKER_PATH=/tmp/musitu-p2-live-baseline/worker.mjs CANDIDATE_WORKER_PATH=/tmp/musitu-p2-candidate/worker.mjs node store/phase2/response-body-equivalence.mjs | tee /tmp/musitu-store-phase2-deploy-evidence/predeploy-equivalence.json
          grep -q '"result": "PASS"' /tmp/musitu-store-phase2-deploy-evidence/predeploy-equivalence.json
          node store/phase2/security-hardening-smoke.mjs /tmp/musitu-p2-candidate/worker.mjs | tee /tmp/musitu-store-phase2-deploy-evidence/predeploy-security.log
          grep -q 'MUSITU_STORE_PHASE2_SECURITY_HARDENING_RUNTIME_PASS' /tmp/musitu-store-phase2-deploy-evidence/predeploy-security.log
          echo PHASE2_EXACT_REPAIRED_LIVE_DEPLOY_IMAGES=PASS

      - name: Execute Worker-only deployment with safe module-root rollback drill
        id: transaction
        continue-on-error: true
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          BASELINE_MODULE_ROOT: /tmp/musitu-p2-live-baseline
          CANDIDATE_MODULE_ROOT: /tmp/musitu-p2-candidate
          PHASE2_HEAD: ${{ github.sha }}
          PHASE2_DEPLOY_EVIDENCE: /tmp/musitu-store-phase2-deploy-evidence
        shell: bash
        run: |
          set -euo pipefail
          python store/phase2/deploy_hardened_store.py

      - name: Upload non-secret Phase 2 deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-store-phase2-production-deploy-evidence
          path: /tmp/musitu-store-phase2-deploy-evidence
          retention-days: 90
          if-no-files-found: warn

      - name: Enforce deployment transaction
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.transaction.outcome }}' = 'success'
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/musitu-store-phase2-deploy-evidence/deployment.json').read_text())
          assert d['schema']=='musitu.store.phase2.safe_module_root_deployment.v2'
          assert d['gate']=='MUSITU_STORE_PHASE2_WORKER_DEPLOY_AND_ROLLBACK_PASS'
          assert d['rollback_method'].startswith('fresh valid multipart rebuilt from exact certified baseline module root')
          s=d['state']
          assert s['initial_baseline_verified'] is True
          assert s['candidate_deployed_once'] is True
          assert s['rollback_drill_performed'] is True
          assert s['rollback_drill_verified'] is True
          assert s['candidate_redeployed_final'] is True
          assert s['final_state_verified'] is True
          assert s['emergency_baseline_restore_performed'] is False
          assert d['checks']['normal_store_response_bodies_unchanged'] is True
          assert len(d['checks']['machine_endpoint_verification'])==11
          assert len(d['checks']['rollback_machine_endpoint_verification'])==11
          print('MUSITU_STORE_PHASE2_PRODUCTION_DEPLOYMENT=PASS')
          PY
