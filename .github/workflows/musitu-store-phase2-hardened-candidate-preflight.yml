name: MUSITU Store Phase 2 Hardened Candidate Preflight

on:
  push:
    branches: [musitu-store-phase2-standards-hardening-20260911]
    paths:
      - 'store/phase2/**'
      - '.github/workflows/musitu-store-phase2-hardened-candidate-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-store-phase2-hardened-candidate-preflight
  cancel-in-progress: false

jobs:
  hardened-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SEALED_MAIN: d6a846f6bbe0bccac1758713eb4de167caf07113
      PHASE1_HEAD: ebded495617cc89bb96d7a5531c1ce4fc6bbedd9
      STORE_SHA: 3a0c4b0f971ec84cd6167a137f8e3d75c7bb20e525c26ab533b3d88044cd0784
      STORE_BYTES: '1679340'
      CATALOG_SHA: 4fa31c5f9f84facc0d1fbf7a91a50b0adcaa5ef4c97b7d82abbe9657ea10b7f9
      CATALOG_SIG_SHA: 9b854358f90368ceb5cc3baab8d99064d8ee94b79ead378a614f8cc1732b06a7

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-prove immutable boundaries
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main musitu-store-phase1-20260909
          test "$(git rev-parse origin/main)" = "$SEALED_MAIN"
          test "$(git rev-parse origin/musitu-store-phase1-20260909)" = "$PHASE1_HEAD"
          test -z "$(git diff --name-only "$PHASE1_HEAD"..."$GITHUB_SHA" -- store/phase1 commerce/chemistry)"
          test -z "$(git diff --name-only "$PHASE1_HEAD"..."$GITHUB_SHA" -- commerce | grep -E 'payment|claim|licen[cs]e|entitlement' || true)"
          echo PHASE2_CANDIDATE_BOUNDARY=PASS

      - name: Run inherited Store regressions
        shell: bash
        run: |
          set -euo pipefail
          python store/phase1/web-surface/build_store_data.py
          node --test store/phase1/web-surface/*.test.mjs

      - name: Fetch and verify exact live Store 1.0.2 inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/musitu-p2-candidate /tmp/musitu-p2-evidence
          mkdir -p /tmp/musitu-p2-evidence
          curl --retry 3 --retry-all-errors -fsSL https://payments.mftintelligence.com/store/catalog.json -o /tmp/catalog.json
          curl --retry 3 --retry-all-errors -fsSL https://payments.mftintelligence.com/store/catalog.sig -o /tmp/catalog.sig
          curl --retry 3 --retry-all-errors -fsSL https://payments.mftintelligence.com/store/bootstrap/MUSITU_Store_1.0.2.apk -o /tmp/store.apk
          test "$(sha256sum /tmp/catalog.json | awk '{print $1}')" = "$CATALOG_SHA"
          test "$(sha256sum /tmp/catalog.sig | awk '{print $1}')" = "$CATALOG_SIG_SHA"
          test "$(stat -c%s /tmp/store.apk)" = "$STORE_BYTES"
          test "$(sha256sum /tmp/store.apk | awk '{print $1}')" = "$STORE_SHA"
          echo PHASE2_LIVE_INPUTS=PASS

      - name: Build hardened candidate from exact production identity
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/musitu-p2-candidate "$GITHUB_SHA"
          cp /tmp/catalog.json /tmp/musitu-p2-candidate/store/phase1/catalog.json
          cp /tmp/catalog.sig /tmp/musitu-p2-candidate/store/phase1/catalog.sig
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/musitu-p2-candidate/store/phase1')
          c=json.loads((root/'catalog.json').read_text())
          assert c['revision']==3
          sc=c['releaseControl']['storeClient']
          assert sc['version']=='1.0.2' and sc['versionCode']==10002
          assert sc['sha256']=='3a0c4b0f971ec84cd6167a137f8e3d75c7bb20e525c26ab533b3d88044cd0784'
          bpath=root/'bootstrap/release.json'
          b=json.loads(bpath.read_text())
          b.update({'version':'1.0.2','versionCode':10002,'packageId':'com.musitu.store','artifactFile':'MUSITU_Store_1.0.2.apk','sha256':sc['sha256'],'bytes':1679340,'signingCertificateSha256':'43695b6103d7ab57e89166c9a537f1810b7e33053e20332b1d4e7e2e1c612671'})
          bpath.write_text(json.dumps(b,indent=2)+'\n')
          worker=root/'web-surface/worker.mjs'
          s=worker.read_text()
          if 'MUSITU_Store_1.0.2.apk' not in s:
              needle='const RELEASE_ASSETS={\n'
              entry="  '/store/bootstrap/MUSITU_Store_1.0.2.apk':{key:'bootstrap/MUSITU_Store_1.0.2.apk',sha256:'3a0c4b0f971ec84cd6167a137f8e3d75c7bb20e525c26ab533b3d88044cd0784',bytes:1679340,type:'application/vnd.android.package-archive',name:'MUSITU_Store_1.0.2.apk'},\n"
              assert needle in s
              worker.write_text(s.replace(needle,needle+entry,1))
          PY
          (cd /tmp/musitu-p2-candidate && python store/phase1/web-surface/build_store_data.py)
          python store/phase2/apply-standards-hardening.py /tmp/musitu-p2-candidate/store/phase1/web-surface/worker.mjs
          node --check /tmp/musitu-p2-candidate/store/phase1/web-surface/worker.mjs
          sha256sum /tmp/musitu-p2-candidate/store/phase1/web-surface/worker.mjs | tee /tmp/musitu-p2-evidence/hardened-worker.sha256

      - name: Install browser audit tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright axe-core lighthouse
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Enforce hardened security runtime
        shell: bash
        run: |
          set -euo pipefail
          node store/phase2/security-hardening-smoke.mjs /tmp/musitu-p2-candidate/store/phase1/web-surface/worker.mjs

      - name: Run accessibility low-bandwidth and browser standards gate
        shell: bash
        env:
          WORKER_PATH: /tmp/musitu-p2-candidate/store/phase1/web-surface/worker.mjs
          PHASE2_BROWSER_EVIDENCE: /tmp/musitu-p2-evidence/browser-standards-evidence.json
        run: |
          set -euo pipefail
          node store/phase2/standards-browser-smoke.mjs "$WORKER_PATH"

      - name: Run Lighthouse budgets on hardened candidate
        shell: bash
        env:
          WORKER_PATH: /tmp/musitu-p2-candidate/store/phase1/web-surface/worker.mjs
        run: |
          set -euo pipefail
          cat >/tmp/p2-serve.mjs <<'JS'
          import http from 'node:http'; import {pathToFileURL} from 'node:url';
          const worker=(await import(pathToFileURL(process.env.WORKER_PATH).href+'?serve='+Date.now())).default;
          const origin='http://127.0.0.1:8787';
          http.createServer(async(req,res)=>{try{const r=await worker.fetch(new Request(origin+req.url,{method:req.method,headers:req.headers}),{STORE_RUNTIME_PUBLICATION_STATE:'production'},{});res.statusCode=r.status;for(const [k,v] of r.headers)res.setHeader(k,v);res.end(Buffer.from(await r.arrayBuffer()));}catch(e){res.statusCode=500;res.end(String(e));}}).listen(8787,'127.0.0.1');
          JS
          node /tmp/p2-serve.mjs >/tmp/p2-server.log 2>&1 & SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/store >/dev/null && break; sleep 0.5; done
          npx lighthouse http://127.0.0.1:8787/store --output=json --output-path=/tmp/musitu-p2-evidence/lighthouse.json --only-categories=performance,accessibility,best-practices --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const b=JSON.parse(fs.readFileSync('commerce/chemistry/storefront/lighthouse-budget.json','utf8'));
          const l=JSON.parse(fs.readFileSync('/tmp/musitu-p2-evidence/lighthouse.json','utf8'));
          const r={performance:l.categories.performance.score,accessibility:l.categories.accessibility.score,best_practices:l.categories['best-practices'].score,lcp_ms:l.audits['largest-contentful-paint'].numericValue,cls:l.audits['cumulative-layout-shift'].numericValue,tbt_ms:l.audits['total-blocking-time'].numericValue};
          const pass=r.performance>=b.performance_score_min&&r.accessibility>=b.accessibility_score_min&&r.best_practices>=b.best_practices_score_min&&r.lcp_ms<=b.lcp_ms_max&&r.cls<=b.cls_max&&r.tbt_ms<=b.tbt_ms_max;
          fs.writeFileSync('/tmp/musitu-p2-evidence/lighthouse-summary.json',JSON.stringify({budget:b,results:r,pass},null,2)+'\n');
          if(!pass)process.exit(1); console.log(JSON.stringify(r));
          JS
          kill "$SERVER_PID" 2>/dev/null || true; trap - EXIT

      - name: Seal hardened candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const browser=JSON.parse(fs.readFileSync('/tmp/musitu-p2-evidence/browser-standards-evidence.json','utf8'));
          const lighthouse=JSON.parse(fs.readFileSync('/tmp/musitu-p2-evidence/lighthouse-summary.json','utf8'));
          const summary={schema:'musitu.store.phase2.hardened_candidate_predeploy.v1',result:'PASS',head:process.env.GITHUB_SHA,sealed_main:process.env.SEALED_MAIN,store_version:'1.0.2',catalog_revision:3,security_hardening:'PASS',automated_accessibility_low_bandwidth:browser.result,lighthouse_budget:lighthouse.pass?'PASS':'FAIL',manual_screen_reader:'PENDING',production_deployment:'PENDING',rollback_proof:'PENDING',production_mutation:false,phase2Complete:false};
          fs.writeFileSync('/tmp/musitu-p2-evidence/summary.json',JSON.stringify(summary,null,2)+'\n');
          JS
          (cd /tmp/musitu-p2-evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: musitu-store-phase2-hardened-candidate-predeploy
          path: /tmp/musitu-p2-evidence
          retention-days: 90
          if-no-files-found: error
