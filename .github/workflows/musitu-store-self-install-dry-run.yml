name: MUSITU Store self-install dry-run

on:
  push:
    branches:
      - musitu-store-self-install-button-20260914
    paths:
      - '.github/workflows/musitu-store-self-install-dry-run.yml'
      - 'store/phase2/build-store-self-install-candidate.py'
      - 'store/phase2/verify-store-self-install-candidate.mjs'
  workflow_dispatch:

permissions:
  contents: read

env:
  ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
  ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
  ZONE_NAME: mftintelligence.com
  PAYMENTS_HOST: payments.mftintelligence.com
  PAYMENTS_ORIGIN: mft-paynow-transport-gateway
  STORE_WORKER: musitu-store-phase1
  STORE_ROUTE: payments.mftintelligence.com/store*
  STORE_BUCKET: musitu-store-phase1-releases
  EXPECTED_COMPATIBILITY_DATE: '2026-09-09'
  BASELINE_MODULE_ROOT: /tmp/musitu-store-self-install-dry-run/baseline
  CANDIDATE_MODULE_ROOT: /tmp/musitu-store-self-install-dry-run/candidate
  LIVE_MODULE_OUTPUT: /tmp/musitu-store-self-install-dry-run/baseline
  STORE_SELF_INSTALL_BUILD_REPORT: /tmp/musitu-store-self-install-dry-run/candidate.json
  EXPECTED_BROWSER_FIRST_ASSETS_SHA: 443e558c297d700bedc706ea56647c97162709e5178b80acd63d478054bba4b4
  EXPECTED_BROWSER_FIRST_GENERATED_DATA_SHA: 27ab78a914019cb44844de51bd0f4be46dc53bdf4b928a8dff7944228ccce063
  EXPECTED_BROWSER_FIRST_RENDER_SHA: d4d0b6aef8b1a8d887449c7be60c75190123e7fbb3183e4faf42d10f69be492c
  EXPECTED_INSTALL_BUTTON_WORKER_SHA: 60fcba26dc4d104c6bb9cb0567c66c8e98d38b217c89217b89625947b9062782

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated Store source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture exact current production baseline read-only
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: python3 store/phase2/capture_live_store_worker_unpinned.py

      - name: Require exact current production hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$BASELINE_MODULE_ROOT/assets.mjs" | awk '{print $1}')" = "$EXPECTED_BROWSER_FIRST_ASSETS_SHA"
          test "$(sha256sum "$BASELINE_MODULE_ROOT/generated-data.mjs" | awk '{print $1}')" = "$EXPECTED_BROWSER_FIRST_GENERATED_DATA_SHA"
          test "$(sha256sum "$BASELINE_MODULE_ROOT/render.mjs" | awk '{print $1}')" = "$EXPECTED_BROWSER_FIRST_RENDER_SHA"
          test "$(sha256sum "$BASELINE_MODULE_ROOT/worker.mjs" | awk '{print $1}')" = "$EXPECTED_INSTALL_BUTTON_WORKER_SHA"
          echo 'MUSITU_STORE_SELF_INSTALL_BASELINE=PASS'

      - name: Build Store self-install worker candidate
        run: python3 store/phase2/build-store-self-install-candidate.py

      - name: Verify candidate locally without production write
        shell: bash
        run: |
          set -euo pipefail
          node --check "$CANDIDATE_MODULE_ROOT/worker.mjs"
          node store/phase2/verify-store-self-install-candidate.mjs
          cmp "$BASELINE_MODULE_ROOT/render.mjs" "$CANDIDATE_MODULE_ROOT/render.mjs"
          cmp "$BASELINE_MODULE_ROOT/assets.mjs" "$CANDIDATE_MODULE_ROOT/assets.mjs"
          cmp "$BASELINE_MODULE_ROOT/generated-data.mjs" "$CANDIDATE_MODULE_ROOT/generated-data.mjs"
          echo "MUSITU_STORE_SELF_INSTALL_CANDIDATE_SHA=$(sha256sum "$CANDIDATE_MODULE_ROOT/worker.mjs" | awk '{print $1}')"
          echo 'MUSITU_STORE_SELF_INSTALL_DRY_RUN=PASS'

      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-store-self-install-dry-run-evidence
          path: /tmp/musitu-store-self-install-dry-run
          if-no-files-found: warn
          retention-days: 30
