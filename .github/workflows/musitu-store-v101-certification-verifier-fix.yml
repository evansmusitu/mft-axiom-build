name: MUSITU Store v1.0.1 Certification Verifier Fix

on:
  push:
    branches: [musitu-store-phase1-20260909]
    paths:
      - '.github/workflows/musitu-store-v101-certification-verifier-fix.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact verifier-only correction and dispatch certification
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: ff079fcdc05ae7a2d055bd4bdc5a580cd0832b9b
          TARGET: .github/workflows/musitu-store-phase1-v101-production-certification.yml
          SELF: .github/workflows/musitu-store-v101-certification-verifier-fix.yml
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/musitu-store-phase1-v101-production-certification.yml')
          s=p.read_text()
          old="grep -q \"package: name='com.musitu.chemistry' versionCode='10200' versionName='1.3.0'\" /tmp/store-v101-cert/chem-aapt.txt"
          new="grep -q \"package: name='com.musitu.chemistry' versionCode='10200' versionName='1.3.0-frontier-u-rc1'\" /tmp/store-v101-cert/chem-aapt.txt"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new)
          assert s.count(new)==1
          p.write_text(s)
          PY
          git diff --check
          git diff -- "$TARGET"
          test "$(git diff --numstat -- "$TARGET" | awk '{print $1+$2}')" = '2'
          rm "$SELF"
          git config user.name 'MUSITU Store Verification Bot'
          git config user.email 'evansmusitu5@gmail.com'
          git add "$TARGET" "$SELF"
          git commit -m 'test: use sealed Chemistry APK version identity in certification'
          git push origin HEAD:musitu-store-phase1-20260909
          gh workflow run musitu-store-phase1-v101-production-certification.yml --ref musitu-store-phase1-20260909
