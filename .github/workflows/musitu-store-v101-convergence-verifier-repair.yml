name: MUSITU Store v1.0.1 Convergence Verifier Repair

on:
  push:
    branches: [musitu-store-phase1-20260909]
    paths:
      - '.github/workflows/musitu-store-v101-convergence-verifier-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SEALED_MAIN: d6a846f6bbe0bccac1758713eb4de167caf07113
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only confirmed post-publication convergence defect
        shell: bash
        run: |
          set -euo pipefail
          remote_tip="$(git ls-remote origin 'refs/heads/musitu-store-phase1-20260909' | awk '{print $1}')"
          test "$remote_tip" = "$GITHUB_SHA"
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "$SEALED_MAIN"
          python - <<'PY'
          from pathlib import Path
          p=Path('store/phase1/release/v101_production_upgrade.py')
          s=p.read_text()
          old_pub='''def pub(path: str, accept: str = "*/*", ua: str = "MUSITU-Store-v101-Production-Probe/1.0"):\n    return req(BASE + path, "GET", {"Accept": accept, "User-Agent": ua}, None, 90)\n'''
          new_pub='''def pub(path: str, accept: str = "*/*", ua: str = "MUSITU-Store-v101-Production-Probe/1.0"):\n    return req(\n        BASE + path,\n        "GET",\n        {\n            "Accept": accept,\n            "User-Agent": ua,\n            "Cache-Control": "no-cache",\n            "Pragma": "no-cache",\n        },\n        None,\n        90,\n    )\n'''
          assert s.count(old_pub)==1
          s=s.replace(old_pub,new_pub,1)
          start=s.index('def verify_new_state():\n')
          end=s.index('\ndef restore_prior_state():\n',start)
          new_verify='''def verify_new_state():\n    route_id = verify_topology()\n    expected_catalog = (ROOT / "store/phase1/catalog.json").read_bytes()\n    expected_sig = (ROOT / "store/phase1/catalog.sig").read_bytes()\n    samples: list[dict[str, object]] = []\n    consecutive_exact = 0\n    ready = None\n    for attempt in range(90):\n        health_code, health_headers, health_raw = pub("/store/healthz", "application/json")\n        if health_code == 200:\n            try:\n                health = json.loads(health_raw or b"{}")\n            except Exception:\n                health = {}\n        else:\n            health = {}\n        catalog_code, catalog_headers, catalog_raw = pub("/store/catalog.json", "application/json")\n        sig_code, sig_headers, sig_raw = pub("/store/catalog.sig", "text/plain")\n        sample = {\n            "attempt": attempt + 1,\n            "health_http": health_code,\n            "health_revision": health.get("catalog_revision"),\n            "health_runtime_state": health.get("runtime_publication_state"),\n            "catalog_http": catalog_code,\n            "catalog_sha256": sha(catalog_raw),\n            "catalog_exact": catalog_code == 200 and catalog_raw == expected_catalog,\n            "catalog_cf_cache_status": catalog_headers.get("CF-Cache-Status"),\n            "catalog_age": catalog_headers.get("Age"),\n            "signature_http": sig_code,\n            "signature_sha256": sha(sig_raw),\n            "signature_exact": sig_code == 200 and sig_raw == expected_sig,\n            "signature_cf_cache_status": sig_headers.get("CF-Cache-Status"),\n            "signature_age": sig_headers.get("Age"),\n            "health_cf_ray": health_headers.get("CF-Ray"),\n        }\n        samples.append(sample)\n        exact = (\n            health.get("ok") is True\n            and health.get("catalog_revision") == 2\n            and health.get("runtime_publication_state") == "production"\n            and health.get("phase2_authorized") is False\n            and health.get("fresh_device_phase1_complete") is False\n            and sample["catalog_exact"] is True\n            and sample["signature_exact"] is True\n        )\n        if exact:\n            consecutive_exact += 1\n            ready = health\n            if consecutive_exact >= 3:\n                break\n        else:\n            consecutive_exact = 0\n            ready = None\n        time.sleep(2)\n    checks["release_truth_convergence"] = {\n        "attempts": len(samples),\n        "required_consecutive_exact": 3,\n        "consecutive_exact": consecutive_exact,\n        "last_samples": samples[-10:],\n    }\n    if ready is None or consecutive_exact < 3:\n        raise RuntimeError("Store revision 2 release truth did not converge")\n    code, headers, raw = pub("/store/bootstrap/MUSITU_Store_1.0.1.apk", "application/vnd.android.package-archive")\n    if code != 200 or len(raw) != NEW_BYTES or sha(raw) != NEW_SHA or headers.get("X-Content-SHA256") != NEW_SHA:\n        raise RuntimeError("public Store 1.0.1 artifact mismatch")\n    code, _, raw = pub("/store/bootstrap/MUSITU_Store_1.0.0.apk", "application/vnd.android.package-archive")\n    if code != 200 or len(raw) != OLD_BYTES or sha(raw) != OLD_SHA:\n        raise RuntimeError("rollback Store 1.0.0 artifact drift")\n    code, _, raw = pub("/store/install", "text/html", "Mozilla/5.0 (Linux; Android 14; Pixel 8)")\n    if code != 200 or b"MUSITU_Store_1.0.1.apk" not in raw:\n        raise RuntimeError("Android install surface does not point at 1.0.1")\n    code, _, raw = pub("/store/sw.js", "application/javascript")\n    if code != 200 or b"MUSITU_Store_1.0.1.apk" in raw or b"MUSITU_Store_1.0.0.apk" in raw:\n        raise RuntimeError("installer entered offline service-worker cache")\n    verify_chemistry()\n    r2_readback(NEW_KEY, EVIDENCE / "r2-new-postdeploy.apk", NEW_BYTES, NEW_SHA)\n    r2_readback(OLD_KEY, EVIDENCE / "r2-old-postdeploy.apk", OLD_BYTES, OLD_SHA)\n    checks["postdeploy_route_id"] = route_id\n    checks["postdeploy_catalog_revision"] = 2\n\n'''
          s=s[:start]+new_verify+s[end+1:]
          p.write_text(s)
          PY
          python -m py_compile store/phase1/release/v101_production_upgrade.py
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('store/phase1/release/v101_production_upgrade.py')
          s=p.read_text(); ast.parse(s)
          assert 'for attempt in range(90):' in s
          assert 'if consecutive_exact >= 3:' in s
          assert '"release_truth_convergence"' in s
          assert '"Cache-Control": "no-cache"' in s
          assert '"Pragma": "no-cache"' in s
          assert s.count('def verify_new_state():')==1
          assert s.count('def restore_prior_state():')==1
          print('CONVERGENCE_VERIFIER_STATIC_CONTRACT=PASS')
          PY
          python store/phase1/web-surface/build_store_data.py
          node --test store/phase1/web-surface/release-assets-v101.test.mjs
          node --test store/phase1/web-surface/storefront.test.mjs
          git diff --check
          test "$(git diff --name-only)" = 'store/phase1/release/v101_production_upgrade.py'
      - name: Commit verified transaction-gate repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MUSITU Store Release Gate'
          git config user.email 'evansmusitu5@gmail.com'
          git add store/phase1/release/v101_production_upgrade.py
          git commit -m 'fix: require Store release-truth convergence before promotion'
          git push origin HEAD:musitu-store-phase1-20260909
