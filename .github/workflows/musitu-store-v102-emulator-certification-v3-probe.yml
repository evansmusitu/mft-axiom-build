name: MUSITU Store v1.0.2 Fresh Emulator Certification v3

on:
  push:
    branches: [musitu-store-handoff-probe-20260910]
    paths:
      - '.github/workflows/musitu-store-v102-emulator-certification-v3-probe.yml'

permissions:
  contents: read

concurrency:
  group: musitu-store-phase1-v102-emulator-certification-v3
  cancel-in-progress: false

jobs:
  fresh-emulator:
    name: API ${{ matrix.api-level }} exact APK install and launch v3
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 36]
    env:
      AUTHORITATIVE_STORE_BRANCH: musitu-store-phase1-20260909
      AUTHORITATIVE_STORE_HEAD: 0ffe2de07c6b18873cc73b157ade3afe589f8a35
      SEALED_MAIN: d6a846f6bbe0bccac1758713eb4de167caf07113
      STORE_V102_URL: https://payments.mftintelligence.com/store/bootstrap/MUSITU_Store_1.0.2.apk
      STORE_V102_SHA: 3a0c4b0f971ec84cd6167a137f8e3d75c7bb20e525c26ab533b3d88044cd0784
      STORE_V102_BYTES: '1679340'
      STORE_V102_SIGNER_SHA: 43695b6103d7ab57e89166c9a537f1810b7e33053e20332b1d4e7e2e1c612671
      STORE_PACKAGE: com.musitu.store
      STORE_VERSION_NAME: '1.0.2'
      STORE_VERSION_CODE: '10002'
      BUILD_TOOLS: '36.0.0'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Pin authoritative refs and fetch exact deployed APK
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'musitu-store-handoff-probe-20260910'
          git fetch --quiet origin "$AUTHORITATIVE_STORE_BRANCH" main
          test "$(git rev-parse origin/$AUTHORITATIVE_STORE_BRANCH)" = "$AUTHORITATIVE_STORE_HEAD"
          test "$(git rev-parse origin/main)" = "$SEALED_MAIN"
          sdkmanager "build-tools;$BUILD_TOOLS" 'platform-tools' >/dev/null
          mkdir -p /tmp/musitu-v102 "evidence/api-${{ matrix.api-level }}"
          curl --fail --location --silent --show-error \
            -H 'Cache-Control: no-cache' \
            "$STORE_V102_URL?emulator_cert_v3=${GITHUB_RUN_ID}-${{ matrix.api-level }}-${GITHUB_RUN_ATTEMPT}" \
            -o /tmp/musitu-v102/MUSITU_Store_1.0.2.apk
          test "$(stat -c%s /tmp/musitu-v102/MUSITU_Store_1.0.2.apk)" = "$STORE_V102_BYTES"
          test "$(sha256sum /tmp/musitu-v102/MUSITU_Store_1.0.2.apk | awk '{print $1}')" = "$STORE_V102_SHA"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/musitu-v102/MUSITU_Store_1.0.2.apk | tee /tmp/musitu-v102/apksigner.txt
          signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/musitu-v102/apksigner.txt | head -n1 | tr -d ':\r\n' | tr 'A-F' 'a-f')"
          test "$signer" = "$STORE_V102_SIGNER_SHA"
          grep -q '^Verified using v1 scheme (JAR signing): false$' /tmp/musitu-v102/apksigner.txt
          grep -q '^Verified using v2 scheme (APK Signature Scheme v2): true$' /tmp/musitu-v102/apksigner.txt
          grep -q '^Verified using v3 scheme (APK Signature Scheme v3): true$' /tmp/musitu-v102/apksigner.txt
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging /tmp/musitu-v102/MUSITU_Store_1.0.2.apk | tee /tmp/musitu-v102/badging.txt
          pkg_line="$(grep '^package:' /tmp/musitu-v102/badging.txt | head -n1)"
          printf '%s\n' "$pkg_line" | grep -q "name='$STORE_PACKAGE'"
          printf '%s\n' "$pkg_line" | grep -q "versionCode='$STORE_VERSION_CODE'"
          printf '%s\n' "$pkg_line" | grep -q "versionName='$STORE_VERSION_NAME'"
          launch_activity="$(sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" /tmp/musitu-v102/badging.txt | head -n1)"
          test -n "$launch_activity"
          printf '%s\n' "$launch_activity" > /tmp/musitu-v102/launch_activity.txt
          cp /tmp/musitu-v102/apksigner.txt "evidence/api-${{ matrix.api-level }}/apk-signature.txt"
          cp /tmp/musitu-v102/badging.txt "evidence/api-${{ matrix.api-level }}/apk-badging.txt"
          echo EXACT_DEPLOYED_APK_GATE=PASS

      - name: Prepare single-process emulator certification harness
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/musitu-v102/run-cert.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          expected_api="$1"
          evidence_dir="evidence/api-${expected_api}"
          apk=/tmp/musitu-v102/MUSITU_Store_1.0.2.apk
          mkdir -p "$evidence_dir"

          actual_api="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          printf '%s\n' "$actual_api" > /tmp/musitu-v102/actual_api.txt
          test "$actual_api" = "$expected_api"

          fingerprint="$(adb shell getprop ro.build.fingerprint | tr -d '\r')"
          printf '%s\n' "$fingerprint" > /tmp/musitu-v102/fingerprint.txt
          test -n "$fingerprint"

          if adb shell pm path "$STORE_PACKAGE" 2>/dev/null | tr -d '\r' | grep -q '^package:'; then
            echo 'Package unexpectedly present before install' >&2
            exit 1
          fi
          printf 'absent\n' > "$evidence_dir/preinstall-package.txt"

          adb logcat -c
          adb install "$apk" | tee "$evidence_dir/install.txt"
          grep -q '^Success$' "$evidence_dir/install.txt"

          installed_path="$(adb shell pm path "$STORE_PACKAGE" | tr -d '\r')"
          printf '%s\n' "$installed_path" > /tmp/musitu-v102/installed_path.txt
          printf '%s\n' "$installed_path" | grep -q '^package:'

          adb shell dumpsys package "$STORE_PACKAGE" > "$evidence_dir/dumpsys-package.txt"
          grep -Eq "versionCode=${STORE_VERSION_CODE}([[:space:]]|$)" "$evidence_dir/dumpsys-package.txt"
          grep -Eq "versionName=${STORE_VERSION_NAME}([[:space:]]|$)" "$evidence_dir/dumpsys-package.txt"

          launch_activity="$(tr -d '\r\n' < /tmp/musitu-v102/launch_activity.txt)"
          test -n "$launch_activity"
          printf '%s\n' "$launch_activity" > /tmp/musitu-v102/launch_activity_runtime.txt

          adb shell am force-stop "$STORE_PACKAGE"
          adb shell am start -W -n "$STORE_PACKAGE/$launch_activity" | tee "$evidence_dir/launch.txt"
          grep -q '^Status: ok$' "$evidence_dir/launch.txt"
          sleep 5

          pid="$(adb shell pidof "$STORE_PACKAGE" 2>/dev/null | tr -d '\r' | xargs || true)"
          if [ -z "$pid" ]; then
            pid="$(adb shell ps | tr -d '\r' | awk -v p="$STORE_PACKAGE" '$NF==p {print $2; exit}')"
          fi
          test -n "$pid"
          printf '%s\n' "$pid" > /tmp/musitu-v102/pid.txt

          adb shell dumpsys activity activities > "$evidence_dir/dumpsys-activity.txt"
          grep -E 'mResumedActivity|topResumedActivity|ResumedActivity|mFocusedActivity' "$evidence_dir/dumpsys-activity.txt" > "$evidence_dir/resumed-activity.txt" || true
          grep -q "$STORE_PACKAGE" "$evidence_dir/resumed-activity.txt"

          adb exec-out screencap -p > "$evidence_dir/screen.png"
          test -s "$evidence_dir/screen.png"
          adb logcat -d > "$evidence_dir/logcat.txt"
          if grep -F "$STORE_PACKAGE" "$evidence_dir/logcat.txt" | grep -q 'FATAL EXCEPTION'; then
            echo 'Package fatal exception detected after launch' >&2
            exit 1
          fi

          EXPECTED_API="$expected_api" EVIDENCE_DIR="$evidence_dir" python /tmp/musitu-v102/write-evidence.py
          test "$(python -c "import json; print(json.load(open('$evidence_dir/certification.json'))['result'])")" = PASS
          echo "MUSITU_STORE_V102_FRESH_EMULATOR_V3_API_${actual_api}=PASS"
          BASH
          chmod 0755 /tmp/musitu-v102/run-cert.sh

          cat > /tmp/musitu-v102/write-evidence.py <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('/tmp/musitu-v102')
          evidence_dir = pathlib.Path(os.environ['EVIDENCE_DIR'])
          apk = (root / 'MUSITU_Store_1.0.2.apk').read_bytes()
          read = lambda name: (root / name).read_text().strip()
          out = {
              'schema': 'musitu.store.phase1.v102.fresh_emulator_certification.v3',
              'result': 'PASS',
              'github_run_id': int(os.environ['GITHUB_RUN_ID']),
              'github_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'workflow_head': os.environ['GITHUB_SHA'],
              'authoritative_store_head': os.environ['AUTHORITATIVE_STORE_HEAD'],
              'sealed_main': os.environ['SEALED_MAIN'],
              'fresh_avd': True,
              'preinstall_package_absent': True,
              'api_level': int(read('actual_api.txt')),
              'expected_api_level': int(os.environ['EXPECTED_API']),
              'build_fingerprint': read('fingerprint.txt'),
              'artifact_url': os.environ['STORE_V102_URL'],
              'artifact_sha256': hashlib.sha256(apk).hexdigest(),
              'artifact_bytes': len(apk),
              'package': os.environ['STORE_PACKAGE'],
              'version_name': os.environ['STORE_VERSION_NAME'],
              'version_code': int(os.environ['STORE_VERSION_CODE']),
              'signer_certificate_sha256': os.environ['STORE_V102_SIGNER_SHA'],
              'launch_activity': read('launch_activity_runtime.txt'),
              'installed_path': read('installed_path.txt'),
              'process_pid': read('pid.txt'),
              'install_success': True,
              'launch_status_ok': True,
              'foreground_activity_proven': True,
              'post_launch_process_alive': True,
              'screenshot_captured': True,
          }
          assert out['api_level'] == out['expected_api_level']
          assert out['artifact_sha256'] == os.environ['STORE_V102_SHA']
          assert out['artifact_bytes'] == int(os.environ['STORE_V102_BYTES'])
          evidence_dir.joinpath('certification.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          PY
          bash -n /tmp/musitu-v102/run-cert.sh
          python -m py_compile /tmp/musitu-v102/write-evidence.py
          echo EMULATOR_CERTIFICATION_HARNESS_V3=READY

      - name: Boot fresh API ${{ matrix.api-level }}, install exact APK and prove launch
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: bash /tmp/musitu-v102/run-cert.sh '${{ matrix.api-level }}'

      - name: Upload API ${{ matrix.api-level }} certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-store-v102-fresh-emulator-v3-api-${{ matrix.api-level }}
          path: evidence/api-${{ matrix.api-level }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce API ${{ matrix.api-level }} evidence gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "evidence/api-${{ matrix.api-level }}/certification.json"
          python - <<'PY'
          import json
          from pathlib import Path
          api=${{ matrix.api-level }}
          o=json.loads((Path('evidence')/f'api-{api}'/'certification.json').read_text())
          assert o['result']=='PASS'
          assert o['fresh_avd'] is True
          assert o['preinstall_package_absent'] is True
          assert o['api_level']==api
          assert o['expected_api_level']==api
          assert o['artifact_sha256']=='3a0c4b0f971ec84cd6167a137f8e3d75c7bb20e525c26ab533b3d88044cd0784'
          assert o['artifact_bytes']==1679340
          assert o['package']=='com.musitu.store'
          assert o['version_name']=='1.0.2'
          assert o['version_code']==10002
          assert o['signer_certificate_sha256']=='43695b6103d7ab57e89166c9a537f1810b7e33053e20332b1d4e7e2e1c612671'
          assert o['install_success'] is True
          assert o['launch_status_ok'] is True
          assert o['foreground_activity_proven'] is True
          assert o['post_launch_process_alive'] is True
          assert o['screenshot_captured'] is True
          PY
          echo MUSITU_STORE_V102_FRESH_EMULATOR_V3_API_${{ matrix.api-level }}_EVIDENCE=PASS

  enforce-both:
    name: Enforce API 24 and API 36 certification v3
    if: always()
    needs: [fresh-emulator]
    runs-on: ubuntu-24.04
    steps:
      - name: Require both matrix jobs to pass
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.fresh-emulator.result }}
        run: |
          set -euo pipefail
          test "$MATRIX_RESULT" = success
          echo MUSITU_STORE_V102_API24_API36_EMULATOR_V3_GATE=PASS
