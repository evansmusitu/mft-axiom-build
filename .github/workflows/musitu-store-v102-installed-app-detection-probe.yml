name: MUSITU Store v1.0.2 Installed-App Detection Certification

on:
  push:
    branches: [musitu-store-handoff-probe-20260910]
    paths:
      - '.github/workflows/musitu-store-v102-installed-app-detection-probe.yml'

permissions:
  contents: read

concurrency:
  group: musitu-store-phase1-v102-installed-app-detection
  cancel-in-progress: false

jobs:
  detect:
    name: API ${{ matrix.api-level }} Chemistry installed-app detection
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 36]
    env:
      AUTHORITATIVE_STORE_BRANCH: musitu-store-phase1-20260909
      AUTHORITATIVE_STORE_HEAD: 0ffe2de07c6b18873cc73b157ade3afe589f8a35
      SEALED_MAIN: d6a846f6bbe0bccac1758713eb4de167caf07113
      STORE_URL: https://payments.mftintelligence.com/store/bootstrap/MUSITU_Store_1.0.2.apk
      STORE_SHA: 3a0c4b0f971ec84cd6167a137f8e3d75c7bb20e525c26ab533b3d88044cd0784
      STORE_BYTES: '1679340'
      STORE_SIGNER: 43695b6103d7ab57e89166c9a537f1810b7e33053e20332b1d4e7e2e1c612671
      STORE_PACKAGE: com.musitu.store
      CHEM_URL: https://payments.mftintelligence.com/chemistry/download/MUSITU_Chemistry_Mastery_1.3.0.apk
      CHEM_SHA: 4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd
      CHEM_BYTES: '5892286'
      CHEM_SIGNER: d4455ac3ec74a6d7cd7993ca640f554a83bba95dfd01ef508f7637b6bc72c0d8
      CHEM_PACKAGE: com.musitu.chemistry
      CHEM_VERSION_CODE: '10200'
      CHEM_MANIFEST_VERSION_NAME: 1.3.0-frontier-u-rc1
      BUILD_TOOLS: '36.0.0'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Pin refs and verify exact production APKs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'musitu-store-handoff-probe-20260910'
          git fetch --quiet origin "$AUTHORITATIVE_STORE_BRANCH" main
          test "$(git rev-parse origin/$AUTHORITATIVE_STORE_BRANCH)" = "$AUTHORITATIVE_STORE_HEAD"
          test "$(git rev-parse origin/main)" = "$SEALED_MAIN"
          sdkmanager "build-tools;$BUILD_TOOLS" 'platform-tools' >/dev/null
          mkdir -p /tmp/musitu-detect "evidence/api-${{ matrix.api-level }}"
          curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$STORE_URL?detect=${GITHUB_RUN_ID}-${{ matrix.api-level }}" -o /tmp/musitu-detect/store.apk
          curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$CHEM_URL?detect=${GITHUB_RUN_ID}-${{ matrix.api-level }}" -o /tmp/musitu-detect/chemistry.apk
          test "$(stat -c%s /tmp/musitu-detect/store.apk)" = "$STORE_BYTES"
          test "$(sha256sum /tmp/musitu-detect/store.apk | awk '{print $1}')" = "$STORE_SHA"
          test "$(stat -c%s /tmp/musitu-detect/chemistry.apk)" = "$CHEM_BYTES"
          test "$(sha256sum /tmp/musitu-detect/chemistry.apk | awk '{print $1}')" = "$CHEM_SHA"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs /tmp/musitu-detect/store.apk > /tmp/musitu-detect/store-sign.txt
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs /tmp/musitu-detect/chemistry.apk > /tmp/musitu-detect/chem-sign.txt
          test "$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/musitu-detect/store-sign.txt | head -n1 | tr -d ':\r\n' | tr 'A-F' 'a-f')" = "$STORE_SIGNER"
          test "$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/musitu-detect/chem-sign.txt | head -n1 | tr -d ':\r\n' | tr 'A-F' 'a-f')" = "$CHEM_SIGNER"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging /tmp/musitu-detect/store.apk > /tmp/musitu-detect/store-badging.txt
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging /tmp/musitu-detect/chemistry.apk > /tmp/musitu-detect/chem-badging.txt
          grep -q "package: name='$STORE_PACKAGE' versionCode='10002' versionName='1.0.2'" /tmp/musitu-detect/store-badging.txt
          grep -q "package: name='$CHEM_PACKAGE' versionCode='$CHEM_VERSION_CODE' versionName='$CHEM_MANIFEST_VERSION_NAME'" /tmp/musitu-detect/chem-badging.txt
          sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" /tmp/musitu-detect/store-badging.txt | head -n1 > /tmp/musitu-detect/store-launch.txt
          test -s /tmp/musitu-detect/store-launch.txt
          echo EXACT_PRODUCTION_APKS=PASS

      - name: Prepare persistent detection harness
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/musitu-detect/run.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          api="$1"; ev="evidence/api-$api"; mkdir -p "$ev"
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "$api"
          for p in "$STORE_PACKAGE" "$CHEM_PACKAGE"; do
            if adb shell pm path "$p" 2>/dev/null | tr -d '\r' | grep -q '^package:'; then echo "unexpected preinstall $p" >&2; exit 1; fi
          done
          adb install /tmp/musitu-detect/chemistry.apk | tee "$ev/install-chemistry.txt"
          grep -q '^Success$' "$ev/install-chemistry.txt"
          adb shell dumpsys package "$CHEM_PACKAGE" > "$ev/chemistry-package.txt"
          grep -Eq "versionCode=${CHEM_VERSION_CODE}([[:space:]]|$)" "$ev/chemistry-package.txt"
          adb install /tmp/musitu-detect/store.apk | tee "$ev/install-store.txt"
          grep -q '^Success$' "$ev/install-store.txt"
          launch="$(tr -d '\r\n' < /tmp/musitu-detect/store-launch.txt)"
          adb shell am force-stop "$STORE_PACKAGE"
          adb shell am start -W -n "$STORE_PACKAGE/$launch" | tee "$ev/store-launch.txt"
          grep -q '^Status: ok$' "$ev/store-launch.txt"
          found=0
          for i in $(seq 1 30); do
            adb shell uiautomator dump /sdcard/musitu-window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/musitu-window.xml "$ev/window.xml" >/dev/null 2>&1 || true
            if test -s "$ev/window.xml" && grep -q 'Installed' "$ev/window.xml" && grep -q 'up to date' "$ev/window.xml" && grep -q 'text="Open"' "$ev/window.xml"; then found=1; break; fi
            sleep 3
          done
          test "$found" = 1
          adb shell dumpsys activity activities > "$ev/dumpsys-activity.txt"
          adb exec-out screencap -p > "$ev/screen.png"
          test -s "$ev/screen.png"
          adb logcat -d > "$ev/logcat.txt"
          if grep -F "$STORE_PACKAGE" "$ev/logcat.txt" | grep -q 'FATAL EXCEPTION'; then exit 1; fi
          API="$api" EV="$ev" python - <<'PY'
          import json,os,pathlib
          ev=pathlib.Path(os.environ['EV'])
          out={'schema':'musitu.store.phase1.v102.installed_app_detection.v1','result':'PASS','api_level':int(os.environ['API']),'github_run_id':int(os.environ['GITHUB_RUN_ID']),'workflow_head':os.environ['GITHUB_SHA'],'authoritative_store_head':os.environ['AUTHORITATIVE_STORE_HEAD'],'sealed_main':os.environ['SEALED_MAIN'],'fresh_avd':True,'store_sha256':os.environ['STORE_SHA'],'chemistry_sha256':os.environ['CHEM_SHA'],'chemistry_package':os.environ['CHEM_PACKAGE'],'chemistry_version_code':int(os.environ['CHEM_VERSION_CODE']),'chemistry_manifest_version_name':os.environ['CHEM_MANIFEST_VERSION_NAME'],'chemistry_preinstall_absent':True,'store_preinstall_absent':True,'chemistry_install_success':True,'store_install_success':True,'runtime_detection_ui_status':'Installed · up to date','runtime_detection_primary_action':'Open','runtime_installed_app_detection_proven':True,'screenshot_captured':True}
          ev.joinpath('certification.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          echo "MUSITU_STORE_V102_INSTALLED_APP_DETECTION_API_${api}=PASS"
          BASH
          chmod 0755 /tmp/musitu-detect/run.sh
          bash -n /tmp/musitu-detect/run.sh

      - name: Fresh API ${{ matrix.api-level }} runtime detection proof
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: bash /tmp/musitu-detect/run.sh '${{ matrix.api-level }}'

      - name: Upload detection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-store-v102-installed-app-detection-api-${{ matrix.api-level }}
          path: evidence/api-${{ matrix.api-level }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce detection evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          api=${{ matrix.api-level }}
          o=json.loads((pathlib.Path('evidence')/f'api-{api}'/'certification.json').read_text())
          assert o['result']=='PASS' and o['api_level']==api
          assert o['runtime_installed_app_detection_proven'] is True
          assert o['store_sha256']=='3a0c4b0f971ec84cd6167a137f8e3d75c7bb20e525c26ab533b3d88044cd0784'
          assert o['chemistry_sha256']=='4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd'
          assert o['chemistry_manifest_version_name']=='1.3.0-frontier-u-rc1'
          assert o['runtime_detection_primary_action']=='Open'
          PY

  enforce-both:
    if: always()
    needs: [detect]
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        env:
          RESULT: ${{ needs.detect.result }}
        run: |
          set -euo pipefail
          test "$RESULT" = success
          echo MUSITU_STORE_V102_INSTALLED_APP_DETECTION_API24_API36=PASS
