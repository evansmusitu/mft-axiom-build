name: MUSITU Store v1.0.2 Installed-App Detection Certification v2

on:
  push:
    branches: [musitu-store-handoff-probe-20260910]
    paths:
      - '.github/workflows/musitu-store-v102-installed-app-detection-v2-probe.yml'

permissions:
  contents: read

concurrency:
  group: musitu-store-phase1-v102-installed-app-detection-v2
  cancel-in-progress: false

jobs:
  detect:
    name: API ${{ matrix.api-level }} provisioned runtime detection
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 36]
    env:
      AUTHORITATIVE_STORE_BRANCH: musitu-store-phase1-20260909
      AUTHORITATIVE_STORE_HEAD: 0ffe2de07c6b18873cc73b157ade3afe589f8a35
      SEALED_MAIN: d6a846f6bbe0bccac1758713eb4de167caf07113
      STORE_URL: https://payments.mftintelligence.com/store/bootstrap/MUSITU_Store_1.0.2.apk
      STORE_SHA: 3a0c4b0f971ec84cd6167a137f8e3d75c7bb20e525c26ab533b3d88044cd0784
      STORE_BYTES: '1679340'
      STORE_SIGNER: 43695b6103d7ab57e89166c9a537f1810b7e33053e20332b1d4e7e2e1c612671
      STORE_PACKAGE: com.musitu.store
      CHEM_URL: https://payments.mftintelligence.com/chemistry/download/MUSITU_Chemistry_Mastery_1.3.0.apk
      CHEM_SHA: 4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd
      CHEM_BYTES: '5892286'
      CHEM_SIGNER: d4455ac3ec74a6d7cd7993ca640f554a83bba95dfd01ef508f7637b6bc72c0d8
      CHEM_PACKAGE: com.musitu.chemistry
      CHEM_VERSION_CODE: '10200'
      CHEM_MANIFEST_VERSION_NAME: 1.3.0-frontier-u-rc1
      BUILD_TOOLS: '36.0.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Verify sealed refs and exact production APKs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin "$AUTHORITATIVE_STORE_BRANCH" main
          test "$(git rev-parse origin/$AUTHORITATIVE_STORE_BRANCH)" = "$AUTHORITATIVE_STORE_HEAD"
          test "$(git rev-parse origin/main)" = "$SEALED_MAIN"
          sdkmanager "build-tools;$BUILD_TOOLS" platform-tools >/dev/null
          mkdir -p /tmp/musitu-detect-v2 "evidence/api-${{ matrix.api-level }}"
          curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$STORE_URL?v2=${GITHUB_RUN_ID}-${{ matrix.api-level }}" -o /tmp/musitu-detect-v2/store.apk
          curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$CHEM_URL?v2=${GITHUB_RUN_ID}-${{ matrix.api-level }}" -o /tmp/musitu-detect-v2/chemistry.apk
          test "$(stat -c%s /tmp/musitu-detect-v2/store.apk)" = "$STORE_BYTES"
          test "$(sha256sum /tmp/musitu-detect-v2/store.apk | awk '{print $1}')" = "$STORE_SHA"
          test "$(stat -c%s /tmp/musitu-detect-v2/chemistry.apk)" = "$CHEM_BYTES"
          test "$(sha256sum /tmp/musitu-detect-v2/chemistry.apk | awk '{print $1}')" = "$CHEM_SHA"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs /tmp/musitu-detect-v2/store.apk > /tmp/musitu-detect-v2/store-sign.txt
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs /tmp/musitu-detect-v2/chemistry.apk > /tmp/musitu-detect-v2/chem-sign.txt
          test "$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/musitu-detect-v2/store-sign.txt | head -n1 | tr -d ':\r\n' | tr A-F a-f)" = "$STORE_SIGNER"
          test "$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/musitu-detect-v2/chem-sign.txt | head -n1 | tr -d ':\r\n' | tr A-F a-f)" = "$CHEM_SIGNER"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging /tmp/musitu-detect-v2/store.apk > /tmp/musitu-detect-v2/store-badging.txt
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging /tmp/musitu-detect-v2/chemistry.apk > /tmp/musitu-detect-v2/chem-badging.txt
          grep -q "package: name='$STORE_PACKAGE' versionCode='10002' versionName='1.0.2'" /tmp/musitu-detect-v2/store-badging.txt
          grep -q "package: name='$CHEM_PACKAGE' versionCode='$CHEM_VERSION_CODE' versionName='$CHEM_MANIFEST_VERSION_NAME'" /tmp/musitu-detect-v2/chem-badging.txt
          sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" /tmp/musitu-detect-v2/store-badging.txt | head -n1 > /tmp/musitu-detect-v2/store-launch.txt
          test -s /tmp/musitu-detect-v2/store-launch.txt
          echo EXACT_PRODUCTION_APKS=PASS
      - name: Prepare provisioned persistent harness
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/musitu-detect-v2/run.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          api="$1"; ev="evidence/api-$api"; mkdir -p "$ev"
          capture(){
            adb shell uiautomator dump /sdcard/musitu-window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/musitu-window.xml "$ev/window.xml" >/dev/null 2>&1 || true
            adb shell dumpsys activity activities > "$ev/dumpsys-activity.txt" 2>/dev/null || true
            adb shell dumpsys window windows > "$ev/dumpsys-window.txt" 2>/dev/null || true
            adb exec-out screencap -p > "$ev/screen.png" 2>/dev/null || true
            adb logcat -d > "$ev/logcat.txt" 2>/dev/null || true
          }
          trap capture EXIT
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "$api"
          adb shell settings put global device_provisioned 1 || true
          adb shell settings put secure user_setup_complete 1 || true
          for p in com.google.android.setupwizard com.android.provision com.google.android.apps.setupwizard.searchselector; do
            adb shell am force-stop "$p" >/dev/null 2>&1 || true
            adb shell pm disable-user --user 0 "$p" >/dev/null 2>&1 || true
          done
          adb shell input keyevent KEYCODE_HOME >/dev/null 2>&1 || true
          sleep 3
          for p in "$STORE_PACKAGE" "$CHEM_PACKAGE"; do
            if adb shell pm path "$p" 2>/dev/null | tr -d '\r' | grep -q '^package:'; then echo "unexpected preinstall $p" >&2; exit 1; fi
          done
          adb install /tmp/musitu-detect-v2/chemistry.apk | tee "$ev/install-chemistry.txt"
          grep -q '^Success$' "$ev/install-chemistry.txt"
          adb shell dumpsys package "$CHEM_PACKAGE" > "$ev/chemistry-package.txt"
          grep -Eq "versionCode=${CHEM_VERSION_CODE}([[:space:]]|$)" "$ev/chemistry-package.txt"
          adb install /tmp/musitu-detect-v2/store.apk | tee "$ev/install-store.txt"
          grep -q '^Success$' "$ev/install-store.txt"
          launch="$(tr -d '\r\n' < /tmp/musitu-detect-v2/store-launch.txt)"
          adb shell am force-stop "$STORE_PACKAGE"
          adb shell am start -W -n "$STORE_PACKAGE/$launch" | tee "$ev/store-launch.txt"
          grep -q '^Status: ok$' "$ev/store-launch.txt"
          found=0
          for i in $(seq 1 40); do
            adb shell uiautomator dump /sdcard/musitu-window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/musitu-window.xml "$ev/window.xml" >/dev/null 2>&1 || true
            if test -s "$ev/window.xml" && grep -Fq 'package="com.musitu.store"' "$ev/window.xml" && grep -Fq 'Installed · up to date' "$ev/window.xml" && grep -Fq 'text="Open"' "$ev/window.xml"; then found=1; break; fi
            if test -s "$ev/window.xml" && grep -Fq "Setup Wizard isn't responding" "$ev/window.xml"; then
              adb shell am force-stop com.google.android.setupwizard >/dev/null 2>&1 || true
              adb shell input keyevent KEYCODE_HOME >/dev/null 2>&1 || true
              adb shell am force-stop "$STORE_PACKAGE" >/dev/null 2>&1 || true
              adb shell am start -W -n "$STORE_PACKAGE/$launch" >/dev/null 2>&1 || true
            fi
            sleep 3
          done
          capture
          test "$found" = 1
          grep -Fq 'package="com.musitu.store"' "$ev/window.xml"
          grep -Fq 'Installed · up to date' "$ev/window.xml"
          grep -Fq 'text="Open"' "$ev/window.xml"
          if grep -F "$STORE_PACKAGE" "$ev/logcat.txt" | grep -q 'FATAL EXCEPTION'; then exit 1; fi
          API="$api" EV="$ev" python - <<'PY'
          import json,os,pathlib
          ev=pathlib.Path(os.environ['EV'])
          o={'schema':'musitu.store.phase1.v102.installed_app_detection.v2','result':'PASS','api_level':int(os.environ['API']),'github_run_id':int(os.environ['GITHUB_RUN_ID']),'workflow_head':os.environ['GITHUB_SHA'],'authoritative_store_head':os.environ['AUTHORITATIVE_STORE_HEAD'],'sealed_main':os.environ['SEALED_MAIN'],'fresh_avd':True,'emulator_provisioned_for_ui_test':True,'store_sha256':os.environ['STORE_SHA'],'chemistry_sha256':os.environ['CHEM_SHA'],'chemistry_package':os.environ['CHEM_PACKAGE'],'chemistry_version_code':int(os.environ['CHEM_VERSION_CODE']),'chemistry_manifest_version_name':os.environ['CHEM_MANIFEST_VERSION_NAME'],'chemistry_preinstall_absent':True,'store_preinstall_absent':True,'chemistry_install_success':True,'store_install_success':True,'runtime_detection_ui_status':'Installed · up to date','runtime_detection_primary_action':'Open','runtime_installed_app_detection_proven':True,'screenshot_captured':ev.joinpath('screen.png').stat().st_size>0}
          ev.joinpath('certification.json').write_text(json.dumps(o,indent=2,sort_keys=True)+'\n')
          PY
          trap - EXIT
          echo "MUSITU_STORE_V102_INSTALLED_APP_DETECTION_V2_API_${api}=PASS"
          BASH
          chmod 0755 /tmp/musitu-detect-v2/run.sh
          bash -n /tmp/musitu-detect-v2/run.sh
      - name: Fresh API ${{ matrix.api-level }} provisioned runtime detection proof
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: bash /tmp/musitu-detect-v2/run.sh '${{ matrix.api-level }}'
      - name: Upload detection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-store-v102-installed-app-detection-v2-api-${{ matrix.api-level }}
          path: evidence/api-${{ matrix.api-level }}
          if-no-files-found: error
          retention-days: 30
      - name: Enforce detection evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          api=${{ matrix.api-level }}
          o=json.loads((pathlib.Path('evidence')/f'api-{api}'/'certification.json').read_text())
          assert o['schema']=='musitu.store.phase1.v102.installed_app_detection.v2'
          assert o['result']=='PASS' and o['api_level']==api
          assert o['runtime_installed_app_detection_proven'] is True
          assert o['runtime_detection_ui_status']=='Installed · up to date'
          assert o['runtime_detection_primary_action']=='Open'
          assert o['store_sha256']=='3a0c4b0f971ec84cd6167a137f8e3d75c7bb20e525c26ab533b3d88044cd0784'
          assert o['chemistry_sha256']=='4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd'
          assert o['sealed_main']=='d6a846f6bbe0bccac1758713eb4de167caf07113'
          PY
  enforce-both:
    if: always()
    needs: [detect]
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        env:
          RESULT: ${{ needs.detect.result }}
        run: |
          set -euo pipefail
          test "$RESULT" = success
          echo MUSITU_STORE_V102_INSTALLED_APP_DETECTION_V2_API24_API36=PASS
