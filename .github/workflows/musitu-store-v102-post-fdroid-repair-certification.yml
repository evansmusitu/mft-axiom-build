name: MUSITU Store v1.0.2 Post-F-Droid Repair Certification

on:
  push:
    branches: [musitu-store-handoff-probe-20260910]
    paths:
      - 'store/phase1/release/v102-live/POST_FDROID_REPAIR_CERT_TRIGGER_20260911'

permissions:
  contents: read

concurrency:
  group: musitu-store-v102-post-fdroid-repair-certification
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AUTHORITATIVE_STORE_BRANCH: musitu-store-phase1-20260909
      AUTHORITATIVE_STORE_HEAD: 0ffe2de07c6b18873cc73b157ade3afe589f8a35
      SEALED_MAIN: d6a846f6bbe0bccac1758713eb4de167caf07113
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      ZONE_NAME: mftintelligence.com
      PAYMENTS_HOST: payments.mftintelligence.com
      PAYMENTS_ORIGIN: mft-paynow-transport-gateway
      STORE_WORKER: musitu-store-phase1
      STORE_ROUTE: payments.mftintelligence.com/store*
      STORE_BUCKET: musitu-store-phase1-releases
      CATALOG_REV3_SHA: 4fa31c5f9f84facc0d1fbf7a91a50b0adcaa5ef4c97b7d82abbe9657ea10b7f9
      CATALOG_REV3_SIG_SHA: 9b854358f90368ceb5cc3baab8d99064d8ee94b79ead378a614f8cc1732b06a7
      CATALOG_PUBLIC_PEM_SHA: 4cf17f70dbab900237d8b82b4e989978c667e6ec841de6df79469aa6c5ebd5c0
      STORE_V102_SHA: 3a0c4b0f971ec84cd6167a137f8e3d75c7bb20e525c26ab533b3d88044cd0784
      STORE_V102_BYTES: '1679340'
      STORE_V102_SIGNER_SHA: 43695b6103d7ab57e89166c9a537f1810b7e33053e20332b1d4e7e2e1c612671
      STORE_V101_SHA: b755210f303ebb6d22a3177bb21e5ebae2e076901021ee62ca2fe6ab0f14af82
      STORE_V101_BYTES: '1679572'
      STORE_V100_SHA: 71391bf614cc1186cbe1fda17e9e626aad71d96dbf26807228b73bd2ea99b2f8
      STORE_V100_BYTES: '1687882'
      CHEMISTRY_APK_SHA: 4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd
      CHEMISTRY_APK_BYTES: '5892286'
      CHEMISTRY_IPA_SHA: 426d2dc05e2fc8846a7582324d953bbdd2a256f170f8db2b5a956bc1c51cc962
      CHEMISTRY_IPA_BYTES: '3640968'
      FDROID_REPO_JAR_SHA: f84f0e720c4d7ff578d17a416ded866c8618b2549b50c0ae79861355a79c3cff
      FDROID_REPO_JAR_BYTES: '3705'
      FDROID_REPO_CERT_SHA: 763484cbccf9f9fdb5a35c7d314011369bc53ed95a1361483a6ace17f388b465
      WRANGLER_VERSION: 4.129.1
      WRANGLER_LOG_SANITIZE: 'true'
      WRANGLER_SEND_METRICS: 'false'
      BUILD_TOOLS: '36.0.0'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Anchor refs and cryptographic expected inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f store/phase1/release/v102-live/POST_FDROID_REPAIR_CERT_TRIGGER_20260911
          git fetch --quiet origin "$AUTHORITATIVE_STORE_BRANCH" main
          test "$(git rev-parse origin/$AUTHORITATIVE_STORE_BRANCH)" = "$AUTHORITATIVE_STORE_HEAD"
          test "$(git rev-parse origin/main)" = "$SEALED_MAIN"
          mkdir -p /tmp/post-repair-cert /tmp/post-repair-evidence
          cp store/phase1/release/v102-live/catalog-revision-3.json /tmp/post-repair-cert/catalog.json
          cp store/phase1/release/v102-live/catalog-revision-3.sig /tmp/post-repair-cert/catalog.sig
          git show "$AUTHORITATIVE_STORE_HEAD:store/phase1/catalog-signing-public.pem" > /tmp/post-repair-cert/catalog-public.pem
          git show "$AUTHORITATIVE_STORE_HEAD:store/phase1/ios/source.json" > /tmp/post-repair-cert/source.json
          git show "$AUTHORITATIVE_STORE_HEAD:store/phase1/android/repo/index-v1.json" > /tmp/post-repair-cert/index-v1.json
          git show "$AUTHORITATIVE_STORE_HEAD:store/phase1/android/repo/index-v1.jar" > /tmp/post-repair-cert/index-v1.jar
          test "$(sha256sum /tmp/post-repair-cert/catalog.json | awk '{print $1}')" = "$CATALOG_REV3_SHA"
          test "$(sha256sum /tmp/post-repair-cert/catalog.sig | awk '{print $1}')" = "$CATALOG_REV3_SIG_SHA"
          test "$(sha256sum /tmp/post-repair-cert/catalog-public.pem | awk '{print $1}')" = "$CATALOG_PUBLIC_PEM_SHA"
          test "$(stat -c%s /tmp/post-repair-cert/index-v1.jar)" = "$FDROID_REPO_JAR_BYTES"
          test "$(sha256sum /tmp/post-repair-cert/index-v1.jar | awk '{print $1}')" = "$FDROID_REPO_JAR_SHA"
          base64 -d < /tmp/post-repair-cert/catalog.sig > /tmp/post-repair-cert/catalog.sig.der
          openssl dgst -sha256 -verify /tmp/post-repair-cert/catalog-public.pem -signature /tmp/post-repair-cert/catalog.sig.der /tmp/post-repair-cert/catalog.json
          jarsigner -verify /tmp/post-repair-cert/index-v1.jar > /tmp/post-repair-cert/repo-jarsigner.txt 2>&1
          grep -q 'jar verified' /tmp/post-repair-cert/repo-jarsigner.txt
          cert="$(keytool -printcert -jarfile /tmp/post-repair-cert/index-v1.jar | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr -d ':\r\n' | tr 'A-F' 'a-f')"
          test "$cert" = "$FDROID_REPO_CERT_SHA"
          sdkmanager "build-tools;$BUILD_TOOLS" >/dev/null
          echo POST_REPAIR_EXPECTED_INPUT_GATE=PASS

      - name: Independent live read-only certification
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_GLOBAL_API_KEY"
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,time,urllib.error,urllib.parse,urllib.request
          API='https://api.cloudflare.com/client/v4'; AID=os.environ['ACCOUNT_ID']; ZID=os.environ['ZONE_ID']; HOST=os.environ['PAYMENTS_HOST']; BASE='https://'+HOST
          WORKER=os.environ['STORE_WORKER']; ROUTE=os.environ['STORE_ROUTE']; BUCKET=os.environ['STORE_BUCKET']; tmp=pathlib.Path('/tmp/post-repair-cert'); ev=pathlib.Path('/tmp/post-repair-evidence')
          auth={'X-Auth-Email':os.environ['CLOUDFLARE_EMAIL'],'X-Auth-Key':os.environ['CLOUDFLARE_GLOBAL_API_KEY'],'Accept':'application/json','User-Agent':'MUSITU-Store-Post-FDroid-Repair-Cert/1.0'}
          def sha(b): return hashlib.sha256(b).hexdigest()
          def req(url,headers=None,timeout=150):
              q=urllib.request.Request(url,headers=headers or {},method='GET')
              try:
                  with urllib.request.urlopen(q,timeout=timeout) as r:return r.status,dict(r.headers),r.read()
              except urllib.error.HTTPError as e:return e.code,dict(e.headers),e.read()
          def cf(path):
              c,_,b=req(API+path,auth); assert c==200,(path,c,b[:200]); x=json.loads(b or b'{}'); assert x.get('success') is True,(path,x.get('errors')); return x.get('result')
          def pub(path,accept='*/*'):
              sep='&' if '?' in path else '?'; return req(BASE+path+sep+'post_repair_cert='+str(time.time_ns()),{'Accept':accept,'User-Agent':'MUSITU-Store-Post-FDroid-Repair-Cert/1.0','Cache-Control':'no-cache','Pragma':'no-cache'})
          zones=cf('/zones?name='+urllib.parse.quote(os.environ['ZONE_NAME'])+'&status=active') or []
          assert len(zones)==1 and zones[0]['id']==ZID and zones[0]['account']['id']==AID
          domains=cf(f'/accounts/{AID}/workers/domains') or []
          dm=[d for d in domains if isinstance(d,dict) and d.get('hostname')==HOST]; assert len(dm)==1 and dm[0].get('service')==os.environ['PAYMENTS_ORIGIN']
          routes=cf(f'/zones/{ZID}/workers/routes') or []; exact=[r for r in routes if isinstance(r,dict) and r.get('pattern')==ROUTE]; assert len(exact)==1 and exact[0].get('script')==WORKER
          settings=cf(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(WORKER,safe="")}/settings') or {}; bs={x.get('name'):x for x in settings.get('bindings') or [] if isinstance(x,dict)}
          assert set(bs)=={'STORE_RELEASES','STORE_RUNTIME_PUBLICATION_STATE'}
          assert bs['STORE_RELEASES'].get('type')=='r2_bucket' and bs['STORE_RELEASES'].get('bucket_name')==BUCKET
          assert bs['STORE_RUNTIME_PUBLICATION_STATE'].get('type')=='plain_text' and bs['STORE_RUNTIME_PUBLICATION_STATE'].get('text')=='production'
          sub=cf(f'/accounts/{AID}/workers/scripts/{urllib.parse.quote(WORKER,safe="")}/subdomain') or {}; assert sub.get('enabled') is False and sub.get('previews_enabled') is False
          c,_,b=pub('/store/healthz','application/json'); assert c==200; h=json.loads(b); assert h.get('ok') is True and h.get('catalog_revision')==3 and h.get('runtime_publication_state')=='production' and h.get('phase2_authorized') is False and h.get('fresh_device_phase1_complete') is False
          c,_,cat=pub('/store/catalog.json','application/json'); assert c==200 and cat==tmp.joinpath('catalog.json').read_bytes() and sha(cat)==os.environ['CATALOG_REV3_SHA']
          c,_,sig=pub('/store/catalog.sig','text/plain'); assert c==200 and sig==tmp.joinpath('catalog.sig').read_bytes() and sha(sig)==os.environ['CATALOG_REV3_SIG_SHA']
          store=[]
          for version,path,n,digest in [('1.0.2','/store/bootstrap/MUSITU_Store_1.0.2.apk',int(os.environ['STORE_V102_BYTES']),os.environ['STORE_V102_SHA']),('1.0.1','/store/bootstrap/MUSITU_Store_1.0.1.apk',int(os.environ['STORE_V101_BYTES']),os.environ['STORE_V101_SHA']),('1.0.0','/store/bootstrap/MUSITU_Store_1.0.0.apk',int(os.environ['STORE_V100_BYTES']),os.environ['STORE_V100_SHA'])]:
              c,headers,data=pub(path,'application/vnd.android.package-archive'); assert c==200 and len(data)==n and sha(data)==digest
              if version=='1.0.2': assert headers.get('X-Content-SHA256')==digest; tmp.joinpath('live-v102.apk').write_bytes(data)
              store.append({'version':version,'http':c,'bytes':len(data),'sha256':sha(data)})
          c,_,b=pub('/chemistry/download/MUSITU_Chemistry_Mastery_1.3.0.apk','application/vnd.android.package-archive'); assert c==200 and len(b)==int(os.environ['CHEMISTRY_APK_BYTES']) and sha(b)==os.environ['CHEMISTRY_APK_SHA']
          c,_,b=pub('/store/ios/MUSITU_Chemistry_1.3.0.ipa','application/octet-stream'); assert c==200 and len(b)==int(os.environ['CHEMISTRY_IPA_BYTES']) and sha(b)==os.environ['CHEMISTRY_IPA_SHA']
          c,_,b=pub('/store/ios/source.json','application/json'); assert c==200 and b==tmp.joinpath('source.json').read_bytes()
          c,_,b=pub('/store/android/repo/index-v1.json','application/json'); assert c==200 and b==tmp.joinpath('index-v1.json').read_bytes()
          c,headers,jar=pub('/store/android/repo/index-v1.jar','application/java-archive'); assert c==200 and len(jar)==int(os.environ['FDROID_REPO_JAR_BYTES']) and sha(jar)==os.environ['FDROID_REPO_JAR_SHA']; assert headers.get('X-Content-SHA256')==os.environ['FDROID_REPO_JAR_SHA']; assert jar==tmp.joinpath('index-v1.jar').read_bytes(); tmp.joinpath('live-index-v1.jar').write_bytes(jar)
          for path,needle in [('/store',b'MUSITU Store'),('/store/apps/chemistry',b'MUSITU Chemistry'),('/store/install?platform=android',b'MUSITU_Store_1.0.2.apk'),('/store?lite=1',b'Low-bandwidth mode'),('/store/offline',b'Offline')]:
              c,_,data=pub(path,'text/html'); assert c==200 and needle.lower() in data.lower(),(path,c,len(data))
          c,_,install=pub('/store/install?platform=android','text/html'); assert c==200 and os.environ['STORE_V102_SHA'].encode() in install
          for lang in ('sn','nd'):
              c,headers,data=pub('/store?lang='+lang,'text/html'); assert c==200 and headers.get('Content-Language')==lang and b'MUSITU Store' in data
          evidence={'schema':'musitu.store.phase1.v102.post_fdroid_repair_certification.v1','result':'PASS','certification_head':os.environ['GITHUB_SHA'],'authoritative_store_head':os.environ['AUTHORITATIVE_STORE_HEAD'],'sealed_main':os.environ['SEALED_MAIN'],'catalog_revision':3,'catalog_sha256':sha(cat),'catalog_signature_sha256':sha(sig),'store_releases':store,'chemistry_apk_preserved':True,'chemistry_ipa_preserved':True,'sidestore_source_exact':True,'fdroid_index_json_exact':True,'fdroid_index_jar_http':200,'fdroid_index_jar_sha256':sha(jar),'fdroid_index_jar_bytes':len(jar),'fdroid_index_jar_exact':True,'topology_exact':True,'bindings_exact':True,'workers_dev_disabled':True,'phase2_authorized':False,'fresh_device_phase1_complete':False}
          raw=(json.dumps(evidence,indent=2,sort_keys=True)+'\n').encode(); ev.joinpath('certification.json').write_bytes(raw); ev.joinpath('certification.sha256').write_text(sha(raw)+'  certification.json\n')
          PY
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/post-repair-cert/live-v102.apk | tee /tmp/post-repair-evidence/store-v102-apksigner.txt
          signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/post-repair-evidence/store-v102-apksigner.txt | head -n1 | tr -d ':\r\n' | tr 'A-F' 'a-f')"
          test "$signer" = "$STORE_V102_SIGNER_SHA"
          grep -q '^Verified using v1 scheme (JAR signing): false$' /tmp/post-repair-evidence/store-v102-apksigner.txt
          grep -q '^Verified using v2 scheme (APK Signature Scheme v2): true$' /tmp/post-repair-evidence/store-v102-apksigner.txt
          grep -q '^Verified using v3 scheme (APK Signature Scheme v3): true$' /tmp/post-repair-evidence/store-v102-apksigner.txt
          jarsigner -verify /tmp/post-repair-cert/live-index-v1.jar > /tmp/post-repair-evidence/live-jar-jarsigner.txt 2>&1
          grep -q 'jar verified' /tmp/post-repair-evidence/live-jar-jarsigner.txt
          cert="$(keytool -printcert -jarfile /tmp/post-repair-cert/live-index-v1.jar | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr -d ':\r\n' | tr 'A-F' 'a-f')"
          test "$cert" = "$FDROID_REPO_CERT_SHA"
          npx -y "wrangler@$WRANGLER_VERSION" r2 object get "$STORE_BUCKET/android/repo/index-v1.jar" --remote --file /tmp/post-repair-cert/r2-index-v1.jar >/tmp/post-repair-cert/wrangler-r2.txt 2>&1
          test "$(stat -c%s /tmp/post-repair-cert/r2-index-v1.jar)" = "$FDROID_REPO_JAR_BYTES"
          test "$(sha256sum /tmp/post-repair-cert/r2-index-v1.jar | awk '{print $1}')" = "$FDROID_REPO_JAR_SHA"
          cmp /tmp/post-repair-cert/index-v1.jar /tmp/post-repair-cert/r2-index-v1.jar
          echo MUSITU_STORE_V102_POST_FDROID_REPAIR_CERTIFICATION=PASS

      - name: Upload independent certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-store-v102-post-fdroid-repair-certification
          path: /tmp/post-repair-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Enforce certification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/post-repair-evidence/certification.json
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('/tmp/post-repair-evidence/certification.json').read_text())
          assert o['result']=='PASS'
          assert o['authoritative_store_head']=='0ffe2de07c6b18873cc73b157ade3afe589f8a35'
          assert o['sealed_main']=='d6a846f6bbe0bccac1758713eb4de167caf07113'
          assert o['catalog_revision']==3
          assert o['fdroid_index_jar_http']==200
          assert o['fdroid_index_jar_sha256']=='f84f0e720c4d7ff578d17a416ded866c8618b2549b50c0ae79861355a79c3cff'
          assert o['fdroid_index_jar_bytes']==3705
          assert o['fdroid_index_jar_exact'] is True
          assert o['chemistry_apk_preserved'] is True
          assert o['chemistry_ipa_preserved'] is True
          assert o['topology_exact'] is True
          assert o['bindings_exact'] is True
          assert o['workers_dev_disabled'] is True
          assert o['phase2_authorized'] is False
          assert o['fresh_device_phase1_complete'] is False
          PY
          echo MUSITU_STORE_V102_POST_FDROID_REPAIR_EVIDENCE_GATE=PASS
