name: MUSITU Store v1.0.2 Guarded Production Deploy

on:
  push:
    branches: [musitu-store-handoff-probe-20260910]
    paths:
      - '.github/workflows/musitu-store-v102-production-deploy-probe.yml'

permissions:
  contents: read

concurrency:
  group: musitu-store-phase1-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AUTHORITATIVE_STORE_BRANCH: musitu-store-phase1-20260909
      AUTHORITATIVE_STORE_HEAD: 0ffe2de07c6b18873cc73b157ade3afe589f8a35
      SEALED_MAIN: d6a846f6bbe0bccac1758713eb4de167caf07113
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      ZONE_ID: 5b56528f03948ff5917a5e0cd9f7109e
      ZONE_NAME: mftintelligence.com
      PAYMENTS_HOST: payments.mftintelligence.com
      PAYMENTS_ORIGIN: mft-paynow-transport-gateway
      STORE_WORKER: musitu-store-phase1
      STORE_ROUTE: payments.mftintelligence.com/store*
      STORE_BUCKET: musitu-store-phase1-releases
      PRIOR_CATALOG_SHA: 3b9361a755266b3ac2ab618062afa7fb75caa28441201131d7c8e5eb70a1a3bf
      PRIOR_SIG_SHA: 57f81cc602de35b7e5414be3e69708c1981fed4877022bc3c248b32a87565a6f
      NEW_CATALOG_SHA: 4fa31c5f9f84facc0d1fbf7a91a50b0adcaa5ef4c97b7d82abbe9657ea10b7f9
      NEW_SIG_SHA: 9b854358f90368ceb5cc3baab8d99064d8ee94b79ead378a614f8cc1732b06a7
      STORE_V100_SHA: 71391bf614cc1186cbe1fda17e9e626aad71d96dbf26807228b73bd2ea99b2f8
      STORE_V100_BYTES: '1687882'
      STORE_V101_SHA: b755210f303ebb6d22a3177bb21e5ebae2e076901021ee62ca2fe6ab0f14af82
      STORE_V101_BYTES: '1679572'
      STORE_V102_SHA: 3a0c4b0f971ec84cd6167a137f8e3d75c7bb20e525c26ab533b3d88044cd0784
      STORE_V102_BYTES: '1679340'
      STORE_SIGNER_SHA: 43695b6103d7ab57e89166c9a537f1810b7e33053e20332b1d4e7e2e1c612671
      CHEMISTRY_APK_SHA: 4ba442122d9c86a0c3cef660334fe337c6ea9ae6fe853c964b5e94961245babd
      CHEMISTRY_APK_BYTES: '5892286'
      CHEMISTRY_IPA_SHA: 426d2dc05e2fc8846a7582324d953bbdd2a256f170f8db2b5a956bc1c51cc962
      CHEMISTRY_IPA_BYTES: '3640968'
      CATALOG_PUBLIC_PEM_SHA: 4cf17f70dbab900237d8b82b4e989978c667e6ec841de6df79469aa6c5ebd5c0
      TXN_SCRIPT_SHA: df168d66e4f7f980f4e641894565fada15697bf8692af4f8ae4fc458d8208168
      WRANGLER_VERSION: 4.129.1
      WRANGLER_LOG_SANITIZE: 'true'
      WRANGLER_SEND_METRICS: 'false'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android verification tools
        shell: bash
        run: sdkmanager 'build-tools;36.0.0'

      - name: Prove immutable anchors, exact candidate, signer and transaction script
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'musitu-store-handoff-probe-20260910'
          git fetch --quiet origin "$AUTHORITATIVE_STORE_BRANCH" main
          test "$(git rev-parse origin/$AUTHORITATIVE_STORE_BRANCH)" = "$AUTHORITATIVE_STORE_HEAD"
          test "$(git rev-parse origin/main)" = "$SEALED_MAIN"
          test "$(sha256sum store/phase1/release/v102-live/catalog-revision-3.json | awk '{print $1}')" = "$NEW_CATALOG_SHA"
          test "$(sha256sum store/phase1/release/v102-live/catalog-revision-3.sig | awk '{print $1}')" = "$NEW_SIG_SHA"
          mkdir -p /tmp/v102-gates
          git show "$AUTHORITATIVE_STORE_HEAD:store/phase1/catalog-signing-public.pem" > /tmp/v102-gates/catalog-signing-public.pem
          test "$(sha256sum /tmp/v102-gates/catalog-signing-public.pem | awk '{print $1}')" = "$CATALOG_PUBLIC_PEM_SHA"
          base64 -d < store/phase1/release/v102-live/catalog-revision-3.sig > /tmp/v102-gates/catalog-revision-3.sig.der
          openssl dgst -sha256 -verify /tmp/v102-gates/catalog-signing-public.pem -signature /tmp/v102-gates/catalog-revision-3.sig.der store/phase1/release/v102-live/catalog-revision-3.json
          cat store/phase1/release/v102-live/txn/part-*.pyfrag > /tmp/v102_production_upgrade.py
          test "$(sha256sum /tmp/v102_production_upgrade.py | awk '{print $1}')" = "$TXN_SCRIPT_SHA"
          python -m py_compile /tmp/v102_production_upgrade.py
          echo PREMUTATION_CRYPTO_AND_SCRIPT_GATE=PASS

      - name: Prepare exact rev2 rollback image and rev3 publication image
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/store-v102-rollback /tmp/store-v102-source
          git worktree add --detach /tmp/store-v102-rollback "$AUTHORITATIVE_STORE_HEAD"
          git worktree add --detach /tmp/store-v102-source "$AUTHORITATIVE_STORE_HEAD"
          (cd /tmp/store-v102-rollback && python store/phase1/web-surface/build_store_data.py)
          cp store/phase1/release/v102-live/catalog-revision-3.json /tmp/store-v102-source/store/phase1/catalog.json
          cp store/phase1/release/v102-live/catalog-revision-3.sig /tmp/store-v102-source/store/phase1/catalog.sig
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/store-v102-source/store/phase1')
          old=json.loads(Path('/tmp/store-v102-rollback/store/phase1/catalog.json').read_text())
          new=json.loads((root/'catalog.json').read_text())
          assert old['revision']==2 and new['revision']==3
          assert old['apps']==new['apps']
          assert new['releaseControl']['phase']=='phase1'
          assert new['releaseControl']['phase2Authorized'] is False
          sc=new['releaseControl']['storeClient']
          assert sc['version']=='1.0.2' and sc['versionCode']==10002
          assert sc['packageId']=='com.musitu.store'
          assert sc['sha256']=='3a0c4b0f971ec84cd6167a137f8e3d75c7bb20e525c26ab533b3d88044cd0784'
          assert sc['bytes']==1679340
          b=json.loads((root/'bootstrap/release.json').read_text())
          b.update({
            'generatedAt':'2026-09-10T14:06:47Z',
            'version':'1.0.2','versionCode':10002,'packageId':'com.musitu.store',
            'artifactFile':'MUSITU_Store_1.0.2.apk',
            'sha256':'3a0c4b0f971ec84cd6167a137f8e3d75c7bb20e525c26ab533b3d88044cd0784',
            'bytes':1679340,
            'signingCertificateSha256':'43695b6103d7ab57e89166c9a537f1810b7e33053e20332b1d4e7e2e1c612671'
          })
          (root/'bootstrap/release.json').write_text(json.dumps(b,indent=2)+'\n')
          w=root/'web-surface/worker.mjs'
          s=w.read_text()
          needle='const RELEASE_ASSETS={\n'
          entry="  '/store/bootstrap/MUSITU_Store_1.0.2.apk':{key:'bootstrap/MUSITU_Store_1.0.2.apk',sha256:'3a0c4b0f971ec84cd6167a137f8e3d75c7bb20e525c26ab533b3d88044cd0784',bytes:1679340,type:'application/vnd.android.package-archive',name:'MUSITU_Store_1.0.2.apk'},\n"
          assert needle in s and 'MUSITU_Store_1.0.2.apk' not in s
          s=s.replace(needle,needle+entry,1)
          w.write_text(s)
          PY
          (cd /tmp/store-v102-source && python store/phase1/web-surface/build_store_data.py)
          node --check /tmp/store-v102-source/store/phase1/web-surface/worker.mjs
          node --check /tmp/store-v102-source/store/phase1/web-surface/render.mjs
          node --check /tmp/store-v102-source/store/phase1/web-surface/assets.mjs
          node --check /tmp/store-v102-source/store/phase1/web-surface/generated-data.mjs
          test "$(sha256sum /tmp/store-v102-source/store/phase1/catalog.json | awk '{print $1}')" = "$NEW_CATALOG_SHA"
          test "$(sha256sum /tmp/store-v102-source/store/phase1/catalog.sig | awk '{print $1}')" = "$NEW_SIG_SHA"
          echo REV2_ROLLBACK_AND_REV3_PUBLICATION_IMAGES=PASS

      - name: Reconstruct and independently verify exact Store 1.0.2 APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/store-v102-source/release-delta/musitu-store-phase1-v102
          B64="$ROOT/store-signed.patch.xz.b64"
          test "$(stat -c%s "$B64")" = '3532'
          echo '25037591d7d1e20d676bf5b5f584f0b3bfc30647c6f5f48d3a476a6d0f4d1456  '$B64 | sha256sum -c -
          base64 -d "$B64" > /tmp/store-v102.patch.xz
          test "$(stat -c%s /tmp/store-v102.patch.xz)" = '2648'
          echo '24ce0ec4dd1d2d43cbf5c2163838069a4e93f3d5135cfbcc54e7b3b69424c3c7  /tmp/store-v102.patch.xz' | sha256sum -c -
          xz -dc /tmp/store-v102.patch.xz > /tmp/store-v102.patch
          test "$(stat -c%s /tmp/store-v102.patch)" = '3084'
          echo 'b653719f1703a84783ea582e9bdbaa153e9338fc782ad486ca6d53f2895f4629  /tmp/store-v102.patch' | sha256sum -c -
          SRC=/tmp/store-v102-source/store/phase1/prebuilt/android/MUSITU_Store_1.0.2_UNSIGNED.apk
          test "$(stat -c%s "$SRC")" = '1675244'
          echo 'c2075829bb5a5c41f11e13cbd854cd71f9dc3e502a0f457532cc4e9c2f4a0640  '$SRC | sha256sum -c -
          rm -rf /tmp/reconstruct && mkdir -p /tmp/reconstruct
          cp "$SRC" /tmp/reconstruct/MUSITU_Store_1.0.2.apk
          cd /tmp/reconstruct
          git init -q
          git config user.name 'MUSITU Store Reconstructor'
          git config user.email 'evansmusitu5@gmail.com'
          git add MUSITU_Store_1.0.2.apk
          git commit -qm 'seed exact unsigned Store 1.0.2 APK'
          git apply --binary /tmp/store-v102.patch
          test "$(stat -c%s MUSITU_Store_1.0.2.apk)" = "$STORE_V102_BYTES"
          echo "$STORE_V102_SHA  MUSITU_Store_1.0.2.apk" | sha256sum -c -
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs MUSITU_Store_1.0.2.apk | tee /tmp/apksigner-v102.txt
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/apksigner-v102.txt | head -n1 | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          test "$cert" = "$STORE_SIGNER_SHA"
          grep -q '^Verified using v1 scheme (JAR signing): false$' /tmp/apksigner-v102.txt
          grep -q '^Verified using v2 scheme (APK Signature Scheme v2): true$' /tmp/apksigner-v102.txt
          grep -q '^Verified using v3 scheme (APK Signature Scheme v3): true$' /tmp/apksigner-v102.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging MUSITU_Store_1.0.2.apk | tee /tmp/aapt-v102.txt
          grep -q "package: name='com.musitu.store' versionCode='10002' versionName='1.0.2'" /tmp/aapt-v102.txt
          echo STORE_V102_APK_IDENTITY=PASS

      - name: Guarded append-only production transaction with exact rollback
        id: deploy_transaction
        continue-on-error: true
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_EMAIL"
          test -n "$CLOUDFLARE_GLOBAL_API_KEY"
          git fetch --quiet origin "$AUTHORITATIVE_STORE_BRANCH" main
          test "$(git rev-parse origin/$AUTHORITATIVE_STORE_BRANCH)" = "$AUTHORITATIVE_STORE_HEAD"
          test "$(git rev-parse origin/main)" = "$SEALED_MAIN"
          export SOURCE_ROOT=/tmp/store-v102-source
          export ROLLBACK_SOURCE_ROOT=/tmp/store-v102-rollback
          export NEW_APK=/tmp/reconstruct/MUSITU_Store_1.0.2.apk
          export SIDESTORE_SHA="$(sha256sum /tmp/store-v102-rollback/store/phase1/ios/source.json | awk '{print $1}')"
          export FDROID_JSON_SHA="$(sha256sum /tmp/store-v102-rollback/store/phase1/android/repo/index-v1.json | awk '{print $1}')"
          python /tmp/v102_production_upgrade.py

      - name: Upload non-secret production transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-store-v102-production-deploy-evidence
          path: /tmp/store-v102-deploy-evidence
          retention-days: 90
          if-no-files-found: error

      - name: Enforce deployment result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.deploy_transaction.outcome }}' = 'success'
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('/tmp/store-v102-deploy-evidence/deployment.json').read_text())
          assert o['gate']=='MUSITU_STORE_V102_PRODUCTION_DEPLOY_PASS'
          assert o['catalog_revision_after']==3
          assert o['rollback_performed'] is False
          assert o['store_v101_preserved'] is True
          assert o['store_v100_preserved'] is True
          assert o['chemistry_invariants_preserved'] is True
          assert o['phase2_authorized'] is False
          assert o['fresh_device_phase1_complete'] is False
          print('MUSITU_STORE_V102_PRODUCTION_TRANSACTION=PASS')
          PY
