name: MUSITU Store 1.0.3 Exact Live Capture

on:
  push:
    branches: [musitu-store-native-install-handoff-20260911]
    paths:
      - '.github/workflows/musitu-store-v103-live-capture.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      STORE_WORKER: musitu-store-phase1
      EXPECTED_COMPATIBILITY_DATE: '2026-09-09'
      LIVE_MODULE_OUTPUT: /tmp/musitu-store-v103-live
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact current live Store modules — GET only
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$LIVE_MODULE_OUTPUT"
          python store/phase2/capture_live_store_worker_unpinned.py | tee "$LIVE_MODULE_OUTPUT/capture.log"
          grep -q 'PASS_READ_ONLY_LIVE_CAPTURE' "$LIVE_MODULE_OUTPUT/capture.json"
      - name: Upload exact non-secret live baseline
        uses: actions/upload-artifact@v4
        with:
          name: musitu-store-v103-exact-live-baseline
          path: /tmp/musitu-store-v103-live
          retention-days: 30
          if-no-files-found: error
