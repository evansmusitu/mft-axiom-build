name: MUSITU Store V2 isolated Cloudflare credential read-only diagnostics
on:
  push:
    branches:
      - feature/musitu-store-v2-package-state-20261012
    paths:
      - '.github/workflows/musitu-store-v2-credential-readonly-diagnostic.yml'
permissions:
  contents: read
  actions: read
jobs:
  credential-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      VAR_CF_API_TOKEN_PRESENT: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}
      VAR_CF_GLOBAL_KEY_PRESENT: ${{ vars.CLOUDFLARE_GLOBAL_API_KEY != '' }}
      VAR_CF_API_KEY_PRESENT: ${{ vars.CLOUDFLARE_API_KEY != '' }}
      VAR_CF_TOKEN_PRESENT: ${{ vars.CF_API_TOKEN != '' }}
    steps:
      - name: Read-only credential and account association qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feature/musitu-store-v2-package-state-20261012
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          root='https://api.cloudflare.com/client/v4'
          account='93f395f5121954671f92fffa453d6b61'
          zone='5b56528f03948ff5917a5e0cd9f7109e'
          tok=os.environ.get('CF_API_TOKEN','')
          email=os.environ.get('CLOUDFLARE_EMAIL','')
          key=os.environ.get('CLOUDFLARE_GLOBAL_API_KEY','')
          modes={
            'scoped_token':({'Authorization':'Bearer '+tok} if tok else None),
            'owner_global_key':({'X-Auth-Email':email,'X-Auth-Key':key} if email and key else None),
          }
          endpoints={
            'current_user':'/user',
            'account':'/accounts/'+account,
            'account_d1_list':'/accounts/'+account+'/d1/database',
            'account_workers_list':'/accounts/'+account+'/workers/scripts',
            'zone_routes_list':'/zones/'+zone+'/workers/routes',
          }
          result={'schema':'musitu.store.cloudflare.credentials.readonly.v1',
                  'methods_used':['GET'],'mutation_attempted':False,'charge_attempted':False,
                  'production_affected':False,
                  'github_variable_presence_only':{
                     name:os.environ.get(name,'false').lower()=='true' for name in (
                       'VAR_CF_API_TOKEN_PRESENT','VAR_CF_GLOBAL_KEY_PRESENT',
                       'VAR_CF_API_KEY_PRESENT','VAR_CF_TOKEN_PRESENT')},
                  'checks':{}}
          for mode,auth in modes.items():
            statuses={}
            for name,path in endpoints.items():
              if auth is None:
                statuses[name]={'configured':False}
                continue
              req=urllib.request.Request(root+path,method='GET',headers={**auth,'Accept':'application/json',
                                     'User-Agent':'MUSITU-Store-Credential-Readonly/1.0'})
              try:
                with urllib.request.urlopen(req,timeout=18) as res:
                  status=res.status
                  parsed=json.loads(res.read(200000))
                  ok=isinstance(parsed,dict) and parsed.get('success') is True
                  if name=='account':
                    ok=ok and isinstance(parsed.get('result'),dict) and parsed['result'].get('id')==account
              except urllib.error.HTTPError as e:
                status=e.code;ok=False
              except (urllib.error.URLError,ValueError,TimeoutError):
                status=None;ok=False
              statuses[name]={'configured':True,'status':status,'verified':bool(ok)}
            result['checks'][mode]=statuses
          with open('musitu-store-v2-cloudflare-credential-readonly.json','w') as f:
            json.dump(result,f,sort_keys=True,indent=2)
          print(json.dumps(result,sort_keys=True))
          PY
      - name: Identify Cloudflare variable names, never values
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.error,urllib.request
          url='https://api.github.com/repos/evansmusitu/mft-axiom-build/actions/variables?per_page=100'
          req=urllib.request.Request(url,headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json',
            'User-Agent':'MUSITU-Store-Scoped-Variable-Inventory/1.0'})
          try:
            with urllib.request.urlopen(req,timeout=18) as resp:
              status=resp.status
              body=json.loads(resp.read(180000))
            names=[str(v.get('name','')) for v in body.get('variables',[]) if isinstance(v,dict)]
            relevant=sorted(n for n in names if any(t in n.upper() for t in ('CLOUDFLARE','CF_','WORKER','D1')))
            out={'status':status,'read_only':True,'values_disclosed':False,
                 'cloudflare_related_variable_names':relevant,'listing_partial':bool(body.get('total_count',0)>len(names))}
          except urllib.error.HTTPError as e:
            out={'status':e.code,'read_only':True,'values_disclosed':False,'cloudflare_related_variable_names':[],'listing_unavailable':True}
          except (urllib.error.URLError,ValueError,TimeoutError):
            out={'status':None,'read_only':True,'values_disclosed':False,'cloudflare_related_variable_names':[],'listing_unavailable':True}
          print('MUSITU_STORE_GITHUB_VARIABLE_NAMES_ONLY='+json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-store-v2-cloudflare-credential-readonly
          path: musitu-store-v2-cloudflare-credential-readonly.json
          retention-days: 7
          if-no-files-found: error
