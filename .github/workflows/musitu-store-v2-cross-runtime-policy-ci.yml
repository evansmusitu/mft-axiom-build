name: MUSITU Store V2 isolated cross-runtime signed-policy parity

on:
  push:
    branches:
      - feature/musitu-store-v2-package-state-20261012
    paths:
      - '.github/workflows/musitu-store-v2-cross-runtime-policy-ci.yml'
      - 'store/core/catalog/**'
      - 'store/phase1/publisher_intake/**'
      - 'store/phase1/android-client/app/src/main/java/com/musitu/store/V2SignedAndroidCatalog.java'
      - 'store/phase1/android-client/app/src/test/java/com/musitu/store/V2SignedAndroidCatalogTest.java'
      - 'store/phase1/android-client/app/src/main/java/com/musitu/store/V2AndroidInstalledPackageState.java'
      - 'store/phase1/android-client/app/src/test/java/com/musitu/store/V2AndroidInstalledPackageStateTest.java'

permissions:
  contents: read

concurrency:
  group: musitu-store-v2-parity-isolated
  cancel-in-progress: true

jobs:
  offline-cross-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preserve signed Store V1 and prohibit broad Android inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object store/phase1/android-client/app/src/main/java/com/musitu/store/StoreCore.java)" = "395b488a7841cd5f32065cac9826983e0454d955"
          test "$(git hash-object store/phase1/android-client/app/src/main/java/com/musitu/store/MainActivity.java)" = "d5ee6821877a151abfe95c50e8677b2f1b19ae5f"
          ! grep -q 'android.permission.QUERY_ALL_PACKAGES' store/phase1/android-client/app/src/main/AndroidManifest.xml
          echo MUSITU_STORE_V2_CROSS_RUNTIME_V1_IMMUTABLE=PASS
      - name: Verify JS signed catalog carrier, rollback and APK safety invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check store/core/catalog/signed-registry-v2.mjs
          node --check store/core/catalog/signed-registry-v2-watermark.mjs
          node --check store/core/catalog/signed-artifact-stage-v2.mjs
          node --test store/core/catalog/signed-registry-v2.test.mjs store/core/catalog/signed-registry-v2-watermark.test.mjs store/core/catalog/signed-artifact-stage-v2.test.mjs
          echo MUSITU_STORE_V2_CROSS_RUNTIME_NODE_POLICY=PASS
      - name: Verify fail-closed offline publisher intake and precise integer ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s store/phase1/publisher_intake -p 'test_*.py' -v
          python3 -m py_compile store/phase1/publisher_intake/intake.py
          echo MUSITU_STORE_V2_CROSS_RUNTIME_PUBLISHER_INTAKE=PASS
      - name: Prepare Android JVM test SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prove Android-Java signed catalog and installed-state parity
        shell: bash
        run: |
          set -euo pipefail
          gradle -p store/phase1/android-client --no-daemon :app:testDebugUnitTest :app:assembleDebug
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          paths=glob.glob('store/phase1/android-client/app/build/test-results/testDebugUnitTest/TEST-*.xml')
          assert paths,'no Android-Java JVM test result XML'
          suites=[ET.parse(p).getroot() for p in paths]
          total=sum(int(s.get('tests','0')) for s in suites)
          bad=sum(int(s.get('failures','0'))+int(s.get('errors','0'))+int(s.get('skipped','0')) for s in suites)
          classes={s.get('name','') for s in suites}
          assert any('V2SignedAndroidCatalogTest' in s for s in classes),classes
          assert any('V2AndroidInstalledPackageStateTest' in s for s in classes),classes
          assert total>=37 and bad==0,(total,bad,paths)
          print(f'MUSITU_STORE_V2_CROSS_RUNTIME_ANDROID_POLICY_PASS tests={total} failures=0')
          PY
          echo MUSITU_STORE_V2_CROSS_RUNTIME_POLICY_PARITY=PASS
