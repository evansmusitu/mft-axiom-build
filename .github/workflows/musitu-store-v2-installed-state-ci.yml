name: MUSITU Store isolated V2 scoped installed-package visibility

on:
  push:
    branches:
      - feature/musitu-store-v2-package-state-20261012
    paths:
      - '.github/workflows/musitu-store-v2-installed-state-ci.yml'
      - 'store/phase1/android-client/app/src/main/java/com/musitu/store/V2AndroidInstalledPackageState.java'
      - 'store/phase1/android-client/app/src/main/java/com/musitu/store/V2AndroidInstallBridge.java'
      - 'store/phase1/android-client/app/src/main/java/com/musitu/store/V2InstallerUriLeasePolicy.java'
      - 'store/phase1/android-client/app/src/main/java/com/musitu/store/V2InstallerUriLeaseReceiver.java'
      - 'store/phase1/android-client/app/src/test/java/com/musitu/store/V2InstallerUriLeaseContract.java'
      - 'store/phase1/android-client/app/src/main/AndroidManifest.xml'
      - 'store/phase1/android-client/app/src/test/java/com/musitu/store/V2AndroidInstalledPackageStateTest.java'

permissions:
  contents: read

jobs:
  scoped-visibility-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run focused visibility and signed-publisher protection tests
        run: gradle -p store/phase1/android-client --no-daemon :app:testDebugUnitTest --tests com.musitu.store.V2AndroidInstalledPackageStateTest
      - name: Regress all V2 Android JVM tests and compile debug APK
        run: gradle -p store/phase1/android-client --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Enforce complete test suite and unchanged original Store
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object store/phase1/android-client/app/src/main/java/com/musitu/store/StoreCore.java)" = "395b488a7841cd5f32065cac9826983e0454d955"
          test "$(git hash-object store/phase1/android-client/app/src/main/java/com/musitu/store/MainActivity.java)" = "d5ee6821877a151abfe95c50e8677b2f1b19ae5f"
          ! grep -Eq 'android.permission.QUERY_ALL_PACKAGES' store/phase1/android-client/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as E
          files=glob.glob('store/phase1/android-client/app/build/test-results/testDebugUnitTest/TEST-*.xml')
          assert files,'no JVM test XML'
          suites=[E.parse(path).getroot() for path in files]
          tests=sum(int(s.get('tests',0)) for s in suites)
          failed=sum(int(s.get('failures',0))+int(s.get('errors',0))+int(s.get('skipped',0)) for s in suites)
          assert tests>=32,(tests,files)
          assert failed==0,(failed,files)
          print(f'MUSITU_V2_INSTALLED_VISIBILITY_POLICY_PASS tests={tests} failures=0')
          PY
          echo MUSITU_V1_SIGNED_STORE_IMMUTABLE=PASS
