name: MUSITU Store V2 private developer identity and review evidence CI
on:
  push:
    branches: [feature/store-v2-publisher-evidence-pilot-20261021]
    paths:
      - 'store/phase1/developer-portal/**'
      - '.github/workflows/musitu-store-v2-private-developer-portal-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-developer-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: storepilot
          POSTGRES_PASSWORD: disposable-pilot-only-no-real-secrets
          POSTGRES_DB: storepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storepilot -d storepilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify signed Store V1 code is not touched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object store/phase1/android-client/app/src/main/java/com/musitu/store/StoreCore.java)" = '395b488a7841cd5f32065cac9826983e0454d955'
          test "$(git hash-object store/phase1/android-client/app/src/main/java/com/musitu/store/MainActivity.java)" = 'd5ee6821877a151abfe95c50e8677b2f1b19ae5f'
      - name: Exercise real P-256 JWT access checks and parameterized storage contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check store/phase1/developer-portal/portal.mjs
          node --check store/phase1/developer-portal/postgres.mjs
          node --test store/phase1/developer-portal/portal.test.mjs store/phase1/developer-portal/postgres.test.mjs
      - name: Exercise real disposable PostgreSQL constraints and triggers
        shell: bash
        run: |
          set -euo pipefail
          id="$(docker ps -q --filter ancestor=postgres:16 | head -1)"
          test -n "$id"
          docker exec -i "$id" psql -U storepilot -d storepilot -v ON_ERROR_STOP=1 \
            < store/phase1/developer-portal/schema.sql
          docker exec -i "$id" psql -U storepilot -d storepilot -v ON_ERROR_STOP=1 \
            < store/phase1/developer-portal/schema.regression.sql
          remaining="$(docker exec "$id" psql -U storepilot -d storepilot -Atc 'select count(*) from store_v2_developer_submissions')"
          test "$remaining" = 0
          test "$(docker exec "$id" psql -U storepilot -d storepilot -Atc 'select count(*) from store_v2_developer_review_evidence')" = 0
          echo MUSITU_STORE_V2_PRIVATE_DEVELOPER_POSTGRES_CONSTRAINTS=PASS
      - name: Fail closed if portal attempts commercial publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('store/phase1/developer-portal')
          portal=(root/'portal.mjs').read_text()
          adapter=(root/'postgres.mjs').read_text()
          sql=(root/'schema.sql').read_text()
          assert 'publicationAuthorized:false' in portal
          assert 'payoutAuthorized:false' in portal
          assert 'entitlementGranted:false' in portal
          assert 'verified' not in adapter.lower() or 'verified token' in adapter.lower()
          for forbidden in ['store_checkout_intents','store_products','store_customer_tokens','store_entitlements','provider_transaction']:
              assert forbidden not in sql,(forbidden,'commerce table forbidden')
          assert 'GRANT' not in sql.upper().replace('NO PUBLIC ROLE GRANTS','')
          assert 'CREATE TRIGGER store_v2_developer_review_immutable' in sql
          print('MUSITU_STORE_V2_DEVELOPER_PRIVATE_EVIDENCE_ONLY=PASS')
          PY
