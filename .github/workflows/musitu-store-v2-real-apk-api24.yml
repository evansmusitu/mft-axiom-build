name: MUSITU Store isolated two real APKs API24 qualification

on:
  push:
    branches:
      - feature/musitu-store-android-v2-real-apk-qualification-20261011
    paths:
      - '.github/workflows/musitu-store-v2-real-apk-api24.yml'
      - 'store/phase1/android-client/settings.gradle'
      - 'store/phase1/android-client/fixturealpha/**'
      - 'store/phase1/android-client/fixturebeta/**'
      - 'store/phase1/android-client/app/src/androidTest/java/com/musitu/store/V2RealApkInstrumentedTest.java'

permissions:
  contents: read

concurrency:
  group: musitu-store-v2-real-apk-api24-isolated
  cancel-in-progress: true

jobs:
  real-apk-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prove preserved V1 implementation and obtain SDK tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object store/phase1/android-client/app/src/main/java/com/musitu/store/StoreCore.java)" = '395b488a7841cd5f32065cac9826983e0454d955'
          test "$(git hash-object store/phase1/android-client/app/src/main/java/com/musitu/store/MainActivity.java)" = 'd5ee6821877a151abfe95c50e8677b2f1b19ae5f'
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile two throwaway Android applications without signing in repository
        shell: bash
        run: |
          set -euo pipefail
          gradle -p store/phase1/android-client --no-daemon :fixturealpha:assembleRelease :fixturebeta:assembleRelease
          mkdir -p "$RUNNER_TEMP/v2-apks"
          echo "TEST_APK_DIR=$RUNNER_TEMP/v2-apks" >> "$GITHUB_ENV"
      - name: Generate two independent ephemeral test signers and sign real APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/v2-apks"
          PASS="$(openssl rand -hex 18)"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"
          for label in alpha beta; do
            module="fixture${label}"
            keytool -genkeypair -alias "$label" -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Isolated MUSITU Store ${label} Test CA" -keystore "$SIGN_DIR/$label.p12" -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" -noprompt >/dev/null 2>&1
            UNSIGNED="$(find "store/phase1/android-client/$module/build/outputs/apk/release" -maxdepth 1 -type f -name '*unsigned.apk' | head -1)"
            test -s "$UNSIGNED"
            "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" "$SIGN_DIR/$label.aligned.apk"
            "$BUILD_TOOLS/apksigner" sign --ks "$SIGN_DIR/$label.p12" --ks-type PKCS12 --ks-key-alias "$label" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --min-sdk-version 24 --out "$SIGN_DIR/$label.apk" "$SIGN_DIR/$label.aligned.apk"
            "$BUILD_TOOLS/apksigner" verify --min-sdk-version 24 "$SIGN_DIR/$label.apk"
            test -s "$SIGN_DIR/$label.apk"
            sha256sum "$SIGN_DIR/$label.apk" >> "$SIGN_DIR/TEST_ARTIFACTS.sha256"
          done
          # Ensure distinct APK signing identities, not just distinct filenames.
          "$BUILD_TOOLS/apksigner" verify --print-certs "$SIGN_DIR/alpha.apk" | grep 'certificate SHA-256 digest' | head -1 > "$SIGN_DIR/alpha.fingerprint"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$SIGN_DIR/beta.apk" | grep 'certificate SHA-256 digest' | head -1 > "$SIGN_DIR/beta.fingerprint"
          ! cmp -s "$SIGN_DIR/alpha.fingerprint" "$SIGN_DIR/beta.fingerprint"
          rm -f "$SIGN_DIR"/*.p12 "$SIGN_DIR"/*.aligned.apk "$SIGN_DIR"/*.fingerprint
          echo MUSITU_STORE_TWO_INDEPENDENT_TEST_SIGNERS=PASS
      - name: Enable emulator hardware virtualization if available
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
      - name: Verify real independently signed APKs on Android API24 system runtime
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            gradle -p store/phase1/android-client --no-daemon :app:installDebug :app:installDebugAndroidTest
            adb push "$TEST_APK_DIR/alpha.apk" /data/local/tmp/v2-real-fixture-alpha.apk
            adb push "$TEST_APK_DIR/beta.apk" /data/local/tmp/v2-real-fixture-beta.apk
            adb shell run-as com.musitu.store mkdir -p files
            adb shell run-as com.musitu.store cp /data/local/tmp/v2-real-fixture-alpha.apk files/v2-real-fixture-alpha.apk
            adb shell run-as com.musitu.store cp /data/local/tmp/v2-real-fixture-beta.apk files/v2-real-fixture-beta.apk
            gradle -p store/phase1/android-client --no-daemon :app:connectedDebugAndroidTest
      - name: Verify the real-APK instrumentation class executed and passed
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          paths=glob.glob('store/phase1/android-client/app/build/outputs/androidTest-results/connected/**/*.xml',recursive=True)
          total=failed=errors=0
          real=None
          for p in paths:
            try: root=ET.parse(p).getroot()
            except ET.ParseError: continue
            total+=int(root.get('tests','0'))
            failed+=int(root.get('failures','0'))
            errors+=int(root.get('errors','0'))
            for sub in root.iter('testsuite'):
              if 'V2RealApkInstrumentedTest' in sub.get('name',''): real=sub
            if 'V2RealApkInstrumentedTest' in root.get('name',''): real=root
          assert real is not None, ('missing real APK test class',paths)
          assert int(real.get('tests','0'))>=6,real.attrib
          assert int(real.get('failures','0'))==0 and int(real.get('errors','0'))==0,real.attrib
          assert total>=13 and failed==0 and errors==0,(total,failed,errors)
          print(f'MUSITU_STORE_V2_GENUINE_APK_API24_PASS tests={total} real_apk_tests={real.get("tests")} failures={failed} errors={errors}')
          PY
      - name: Retain public test checksums without ephemeral private key material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-store-v2-apk-qualification-checksums
          path: ${{ runner.temp }}/v2-apks/TEST_ARTIFACTS.sha256
          retention-days: 30
          if-no-files-found: warn
