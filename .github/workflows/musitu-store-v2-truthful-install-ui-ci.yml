name: MUSITU Store isolated V2 truthful installed-app UI labels

on:
  push:
    branches:
      - feature/musitu-store-v2-truthful-install-ui-20261012
    paths:
      - '.github/workflows/musitu-store-v2-truthful-install-ui-ci.yml'
      - 'store/phase1/android-client/app/src/main/java/com/musitu/store/V2AndroidInstallPresentation.java'
      - 'store/phase1/android-client/app/src/main/java/com/musitu/store/V2AndroidAppBrowser.java'
      - 'store/phase1/android-client/app/src/test/java/com/musitu/store/V2AndroidInstallPresentationTest.java'
permissions:
  contents: read

jobs:
  install-ui-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Provision Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prove truthful presentation assertions
        run: gradle -p store/phase1/android-client --no-daemon :app:testDebugUnitTest --tests com.musitu.store.V2AndroidInstallPresentationTest
      - name: Regress Android unit tests and debug build
        run: gradle -p store/phase1/android-client --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Enforce complete results and signed V1 preservation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object store/phase1/android-client/app/src/main/java/com/musitu/store/StoreCore.java)" = '395b488a7841cd5f32065cac9826983e0454d955'
          test "$(git hash-object store/phase1/android-client/app/src/main/java/com/musitu/store/MainActivity.java)" = 'd5ee6821877a151abfe95c50e8677b2f1b19ae5f'
          ! grep -q 'android.permission.QUERY_ALL_PACKAGES' store/phase1/android-client/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as E
          reports=glob.glob('store/phase1/android-client/app/build/test-results/testDebugUnitTest/TEST-*.xml')
          assert reports,'no JVM unit test reports'
          suites=[E.parse(p).getroot() for p in reports]
          tests=sum(int(s.get('tests','0')) for s in suites)
          failures=sum(int(s.get('failures','0'))+int(s.get('errors','0'))+int(s.get('skipped','0')) for s in suites)
          assert tests>=43,(tests,reports)
          assert failures==0,(failures,reports)
          print(f'MUSITU_V2_TRUTHFUL_STATUS_UI_PASS tests={tests} failures=0 errors=0 skipped=0')
          PY
          echo MUSITU_V1_SIGNED_STORE_IMMUTABLE=PASS
