name: MUSITU Store V2 isolated Windows MSIX signature and publisher intake

on:
  push:
    branches:
      - feature/musitu-store-v2-package-state-20261012
      - feature/store-v2-publisher-evidence-pilot-20261021
    paths:
      - '.github/workflows/musitu-store-v2-windows-msix-ci.yml'
      - 'store/phase1/windows/**'
      - 'store/phase1/web-surface/icon-192.png'
      - 'store/phase1/web-surface/icon-512.png'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-store-v2-windows-private
  cancel-in-progress: true

jobs:
  fail-closed-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject a deliberately unsigned package before native inspection
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          . 'store/phase1/windows/verify-msix.ps1'
          $invalid=Join-Path $env:RUNNER_TEMP 'unsigned-msix-fixture.msix'
          [System.IO.File]::WriteAllText($invalid,'not a signed native Windows package')
          $rejected=$false
          try {
            Test-MusituWindowsMsix -PackagePath $invalid -ExpectedSha256 ('a'*64) -ExpectedCertificateThumbprint ('b'*40) -ExpectedPackageName 'MUSITU.Private.WindowsFixture' -ExpectedPublisher 'CN=MUSITU Disposable MSIX Test' -ExpectedVersion '1.0.0.0' -SignToolPath '/bin/true' | Out-Null
          } catch { $rejected=$true }
          if (-not $rejected){throw 'SECURITY_DEFECT: unsigned and untrusted file passed Windows intake'}
          Write-Output 'MUSITU_WINDOWS_UNSIGNED_FAIL_CLOSED_CONTRACT=PASS'
  disposable-windows-signed-msix:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Assert protected Store V1 source immutability
        run: |
          if ((git hash-object store/phase1/android-client/app/src/main/java/com/musitu/store/StoreCore.java).Trim() -ne '395b488a7841cd5f32065cac9826983e0454d955'){throw 'V1 StoreCore unexpectedly changed'}
          if ((git hash-object store/phase1/android-client/app/src/main/java/com/musitu/store/MainActivity.java).Trim() -ne 'd5ee6821877a151abfe95c50e8677b2f1b19ae5f'){throw 'V1 MainActivity unexpectedly changed'}
      - name: Find Windows SDK signing and packaging tools
        run: |
          $ErrorActionPreference='Stop'
          $sdk=Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $sdkVersionFolders=Get-ChildItem -LiteralPath $sdk -Directory | Sort-Object Name -Descending
          $signtool=$null
          foreach($versionFolder in $sdkVersionFolders){
            $candidate=Join-Path $versionFolder.FullName 'x64\signtool.exe'
            if(Test-Path -LiteralPath $candidate -PathType Leaf){$signtool=Get-Item -LiteralPath $candidate;break}
          }
          if (-not $signtool){throw 'Windows SDK x64 signtool is missing'}
          $makeappx=Join-Path $signtool.DirectoryName 'makeappx.exe'
          if (-not (Test-Path -LiteralPath $makeappx -PathType Leaf)){throw 'Windows SDK makeappx not found'}
          "MUSITU_SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MUSITU_MAKEAPPX=$makeappx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build unsigned native MSIX fixture on Windows
        run: |
          $scratch=Join-Path $env:RUNNER_TEMP 'musitu-store-private-windows-msix'
          $layout=Join-Path $scratch 'layout'
          $assets=Join-Path $layout 'Assets'
          New-Item -Path $assets -ItemType Directory -Force | Out-Null
          Copy-Item -LiteralPath 'C:\Windows\System32\notepad.exe' -Destination (Join-Path $layout 'Fixture.exe')
          Copy-Item -LiteralPath 'store/phase1/web-surface/icon-192.png' -Destination (Join-Path $assets 'Square44x44Logo.png')
          Copy-Item -LiteralPath 'store/phase1/web-surface/icon-512.png' -Destination (Join-Path $assets 'Square150x150Logo.png')
          Copy-Item -LiteralPath 'store/phase1/web-surface/icon-192.png' -Destination (Join-Path $assets 'StoreLogo.png')
          $manifest=@'
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                   xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                   xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities"
                   IgnorableNamespaces="uap rescap">
            <Identity Name="MUSITU.Private.WindowsFixture" Publisher="CN=MUSITU Disposable MSIX Test"
                      Version="1.0.0.0" ProcessorArchitecture="x64"/>
            <Properties><DisplayName>MUSITU disposable Windows fixture</DisplayName>
              <PublisherDisplayName>MUSITU Test Only</PublisherDisplayName>
              <Logo>Assets\StoreLogo.png</Logo></Properties>
            <Resources><Resource Language="en-us"/></Resources>
            <Dependencies><TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0"/></Dependencies>
            <Applications><Application Id="Fixture" Executable="Fixture.exe" EntryPoint="Windows.FullTrustApplication">
              <uap:VisualElements DisplayName="MUSITU Disposable Test" Description="Disposable test package, never published"
                    BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png"
                    Square44x44Logo="Assets\Square44x44Logo.png"/>
            </Application></Applications>
            <Capabilities><rescap:Capability Name="runFullTrust"/></Capabilities>
          </Package>
          '@
          [System.IO.File]::WriteAllText((Join-Path $layout 'AppxManifest.xml'),$manifest,[System.Text.UTF8Encoding]::new($false))
          $unsigned=Join-Path $scratch 'unsigned-fixture.msix'
          $signed=Join-Path $scratch 'signed-fixture.msix'
          & $env:MUSITU_MAKEAPPX pack /d $layout /p $unsigned /o /h SHA256
          if ($LASTEXITCODE -ne 0){throw 'MakeAppx did not construct valid disposable package'}
          Copy-Item -LiteralPath $unsigned -Destination $signed
          "MUSITU_TEST_UNSIGNED_MSIX=$unsigned" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MUSITU_TEST_SIGNED_MSIX=$signed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Generate ephemeral Windows CI-only signer certificate
        run: |
          $ErrorActionPreference='Stop'
          $cert=New-SelfSignedCertificate -Type CodeSigningCert -KeyUsage DigitalSignature -Subject 'CN=MUSITU Disposable MSIX Test' -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddDays(2) -HashAlgorithm SHA256
          "MUSITU_TEST_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output 'MUSITU_WINDOWS_EPHEMERAL_CERT_CREATED=PASS'
      - name: Establish trust for disposable CI signer certificate
        run: |
          $ErrorActionPreference='Stop'
          $public=Join-Path (Join-Path $env:RUNNER_TEMP 'musitu-store-private-windows-msix') 'disposable-public.cer'
          $cert=Get-Item -LiteralPath "Cert:\CurrentUser\My\$env:MUSITU_TEST_CERT_THUMBPRINT"
          Export-Certificate -Cert $cert -FilePath $public | Out-Null
          # TrustedPeople directly accepts a disposable self-signed signer;
          # never add arbitrary CI keys into Windows' Root CA trust store.
          Import-Certificate -FilePath $public -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          Write-Output 'MUSITU_WINDOWS_EPHEMERAL_TRUST=PASS'
      - name: Sign disposable MSIX via Windows SDK
        run: |
          $ErrorActionPreference='Stop'
          & $env:MUSITU_SIGNTOOL sign /fd SHA256 /sha1 $env:MUSITU_TEST_CERT_THUMBPRINT $env:MUSITU_TEST_SIGNED_MSIX
          if ($LASTEXITCODE -ne 0){throw 'test-only MSIX signing failed'}
          Write-Output 'MUSITU_WINDOWS_EPHEMERAL_SIGNED=PASS'
      - name: Verify MSIX via Windows trust provider
        run: |
          $ErrorActionPreference='Stop'
          & $env:MUSITU_SIGNTOOL verify /pa /all $env:MUSITU_TEST_SIGNED_MSIX
          if ($LASTEXITCODE -ne 0){throw 'Windows signature trust verification failed'}
          Write-Output 'MUSITU_WINDOWS_DISPOSABLE_SIGNED_MSIX=PASS'
      - name: Qualify signed Windows MSIX publisher review, fail-closed negative cases
        run: |
          $ErrorActionPreference='Stop'
          & 'store/phase1/windows/verify-msix.test.ps1'
      - name: Install only disposable signed MSIX on CI Windows OS
        shell: powershell
        env:
          MUSITU_WINDOWS_DISPOSABLE_INSTALL: 'true'
        run: |
          $ErrorActionPreference='Stop'
          & 'store/phase1/windows/install-disposable-msix-ci.ps1'
      - name: Qualify actual OS-installed MSIX identity and package state
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & 'store/phase1/windows/os-install-acceptance.test.ps1'
      - name: Construct and independently sign disposable native MSIX update v1.0.0.1
        run: |
          $ErrorActionPreference='Stop'
          $scratch=Join-Path $env:RUNNER_TEMP 'musitu-store-private-windows-msix'
          $layout=Join-Path $scratch 'layout'
          $manifestPath=Join-Path $layout 'AppxManifest.xml'
          $xml=[IO.File]::ReadAllText($manifestPath)
          $old='Version="1.0.0.0"'
          if ($xml.Split(@($old),[StringSplitOptions]::None).Count -ne 2){
            throw 'Unexpected original package version; refusing to generate upgrade'
          }
          $new=$xml.Replace($old,'Version="1.0.0.1"')
          [IO.File]::WriteAllText($manifestPath,$new,[Text.UTF8Encoding]::new($false))
          $upgrade=Join-Path $scratch 'signed-upgrade.msix'
          & $env:MUSITU_MAKEAPPX pack /d $layout /p $upgrade /o /h SHA256
          if ($LASTEXITCODE -ne 0){throw 'Windows SDK failed to construct new MSIX version'}
          & $env:MUSITU_SIGNTOOL sign /fd SHA256 /sha1 $env:MUSITU_TEST_CERT_THUMBPRINT $upgrade
          if ($LASTEXITCODE -ne 0){throw 'Windows SDK failed to sign new MSIX version'}
          & $env:MUSITU_SIGNTOOL verify /pa /all $upgrade
          if ($LASTEXITCODE -ne 0){throw 'Windows SDK failed to verify new MSIX version'}
          "MUSITU_TEST_UPGRADE_MSIX=$upgrade" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output 'MUSITU_WINDOWS_DISPOSABLE_UPGRADE_SIGNED=PASS'
      - name: Upgrade only disposable Windows fixture via OS AppX deployment
        shell: powershell
        env:
          MUSITU_WINDOWS_DISPOSABLE_INSTALL: 'true'
          MUSITU_WINDOWS_DISPOSABLE_UPGRADE: 'true'
        run: |
          $ErrorActionPreference='Stop'
          & 'store/phase1/windows/install-disposable-msix-ci.ps1' -Upgrade
      - name: Require native Windows to apply a signed version upgrade
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & 'store/phase1/windows/os-install-acceptance.test.ps1' -ExpectedVersion '1.0.0.1'
      - name: Refuse signed rollback after native Windows has installed newer version
        shell: powershell
        env:
          MUSITU_WINDOWS_DISPOSABLE_INSTALL: 'true'
        run: |
          $ErrorActionPreference='Stop'
          $rejected=$false
          try {
            & 'store/phase1/windows/install-disposable-msix-ci.ps1'
          } catch {
            if ($_.Exception.Message -notmatch 'Refusing to replace an existing Windows installation'){
              throw 'Unexpected rollback error; does not prove fail-closed version gate'
            }
            $rejected=$true
          }
          if (-not $rejected){throw 'SECURITY_DEFECT: older signed MSIX accepted by Store installer harness'}
          & 'store/phase1/windows/os-install-acceptance.test.ps1' -ExpectedVersion '1.0.0.1'
          Write-Output 'MUSITU_WINDOWS_SIGNED_ROLLBACK_DENIED=PASS current=1.0.0.1'
      - name: Remove disposable OS-installed MSIX and verify complete cleanup
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $fixtures=@(Get-AppxPackage -Name 'MUSITU.Private.WindowsFixture' -ErrorAction Stop)
          foreach($fixture in $fixtures){
            if ($fixture.Publisher -cne 'CN=MUSITU Disposable MSIX Test'){
              throw 'Refusing to remove a non-disposable Windows package'
            }
            Remove-AppxPackage -Package $fixture.PackageFullName -ErrorAction Stop
          }
          if ($env:MUSITU_TEST_SIGNED_MSIX -and $env:MUSITU_TEST_CERT_THUMBPRINT){
            & 'store/phase1/windows/os-install-acceptance.test.ps1' -MustBeAbsent
          }
      - name: Cleanup ephemeral local signing identity
        if: always()
        run: |
          if ($env:MUSITU_TEST_CERT_THUMBPRINT){
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:MUSITU_TEST_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath "Cert:\LocalMachine\TrustedPeople\$env:MUSITU_TEST_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
          $scratch=Join-Path $env:RUNNER_TEMP 'musitu-store-private-windows-msix'
          if (Test-Path -LiteralPath $scratch){Remove-Item -LiteralPath $scratch -Recurse -Force}
          Write-Output 'MUSITU_WINDOWS_DISPOSABLE_PRIVATE_IDENTITY_CLEANUP=PASS'
