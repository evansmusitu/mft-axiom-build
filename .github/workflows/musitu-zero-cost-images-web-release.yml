name: MUSITU Zero-Cost Images & Internet Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-canary-release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CANARY: https://musitu-intelligence-edge-capacity-canary-20261019.mft-education-nexus-93f395f5.workers.dev
      PRODUCTION: https://musitu-intelligence-edge-20261019.mft-education-nexus-93f395f5.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and security policy in isolation
        run: |
          set -euo pipefail
          node --check studio-edge/worker.mjs
          node --test studio-edge/tests/*.test.mjs
      - name: Verify existing secret without exposing it
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          echo 'Secured Cloudflare token exists'
      - name: Deploy free-tier-only isolated canary Worker
        run: npx -y wrangler@4.129.0 deploy --config studio-edge/wrangler.canary.jsonc
      - name: Test canary CORS policy and genuine AI response
        env:
          TARGET_WORKER: ${{ env.CANARY }}
        run: node studio-edge/tests/live-smoke.mjs
      - name: Promote tested Worker to production
        run: |
          set -euo pipefail
          npx -y wrangler@4.129.0 deploy --config studio-edge/wrangler.jsonc
          echo 'PROD_DEPLOYED=1' >> "$GITHUB_ENV"
      - name: Verify production service with genuine inference
        env:
          TARGET_WORKER: ${{ env.PRODUCTION }}
        run: node studio-edge/tests/live-smoke.mjs
      - name: Restore pinned previous Worker after failed production acceptance
        if: ${{ failure() && env.PROD_DEPLOYED == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/musitu-intelligence-rollback
          git show 69e14541e6c32f2afe9657dffa5235ad4ea2b7aa:studio-edge/worker.mjs > /tmp/musitu-intelligence-rollback/worker.mjs
          git show 69e14541e6c32f2afe9657dffa5235ad4ea2b7aa:studio-edge/wrangler.jsonc > /tmp/musitu-intelligence-rollback/wrangler.jsonc
          git show 69e14541e6c32f2afe9657dffa5235ad4ea2b7aa:studio-edge/math.mjs > /tmp/musitu-intelligence-rollback/math.mjs
          npx -y wrangler@4.129.0 deploy --config /tmp/musitu-intelligence-rollback/wrangler.jsonc
          echo 'Production rolled back to the previous isolated verified version'
