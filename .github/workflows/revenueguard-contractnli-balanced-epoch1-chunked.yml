  c3:
    needs: c2
    uses: ./.github/workflows/revenueguard-contractnli-chunk-worker.yml
    with: {mode: balanced, chunk: 3, previous_artifact: revenueguard-contractnli-balanced-e1-c2, output_artifact: revenueguard-contractnli-balanced-e1-c3}
  c4:
    needs: c3
    uses: ./.github/workflows/revenueguard-contractnli-chunk-worker.yml
    with: {mode: balanced, chunk: 4, previous_artifact: revenueguard-contractnli-balanced-e1-c3, output_artifact: revenueguard-contractnli-balanced-e1-c4}
  c5:
