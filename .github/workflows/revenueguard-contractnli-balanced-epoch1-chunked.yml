    uses: ./.github/workflows/revenueguard-contractnli-chunk-worker.yml
    with: {mode: balanced, chunk: 6, previous_artifact: revenueguard-contractnli-balanced-e1-c5, output_artifact: revenueguard-contractnli-balanced-e1-c6}
  c7:
    needs: c6
    uses: ./.github/workflows/revenueguard-contractnli-chunk-worker.yml
    with: {mode: balanced, chunk: 7, previous_artifact: revenueguard-contractnli-balanced-e1-c6, output_artifact: revenueguard-contractnli-balanced-epoch1-final}
