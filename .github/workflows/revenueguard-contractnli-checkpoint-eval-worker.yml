name: RevenueGuard ContractNLI Checkpoint Evaluator

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      training_run_id:
        required: true
        type: string
      checkpoint_artifact:
        required: true
        type: string
      checkpoint_artifact_sha256:
        required: true
        type: string
      output_artifact:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  score:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download exact adapted encoder
        uses: actions/download-artifact@v4
        with:
          name: revenueguard-contractnli-adapted-model
          path: adapted_bundle
          repository: evansmusitu/mft-axiom-build
          run-id: 34676990123
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact semantic checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.checkpoint_artifact }}
          path: checkpoint
          repository: evansmusitu/mft-axiom-build
          run-id: ${{ inputs.training_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install runtime and fetch pinned ContractNLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers==4.56.2'
          curl -fL --retry 4 --retry-delay 2 -o contract-nli.zip 'https://raw.githubusercontent.com/stanfordnlp/contract-nli/eced6528dd3c1d14d73f9a87df8f7bdbc03126f9/resources/contract-nli.zip'
          unzip -q contract-nli.zip
      - name: Score fixed evaluation shard
        shell: bash
        run: |
          set -euo pipefail
          python research/revenueguard/contractnli_joint_checkpoint_shard.py \
            --encoder adapted_bundle/adapted_model \
            --state checkpoint/semantic_state.pt \
            --train-json contract-nli/train.json \
            --dev-json contract-nli/dev.json \
            --shard-index ${{ matrix.shard }} \
            --num-shards 8 \
            --out raw_shard_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: rg-contractnli-${{ inputs.mode }}-raw-${{ matrix.shard }}
          path: raw_shard_${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: score
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rg-contractnli-${{ inputs.mode }}-raw-*
          path: shards
          merge-multiple: true
      - name: Install metric runtime
        shell: bash
        run: python -m pip install 'scikit-learn==1.9.1'
      - name: Freeze calibration choice and grade untouched dev
        shell: bash
        run: |
          set -euo pipefail
          python research/revenueguard/contractnli_joint_checkpoint_aggregate.py \
            --shard-glob 'shards/raw_shard_*.json' \
            --expected-shards 8 \
            --mode '${{ inputs.mode }}' \
            --checkpoint-artifact-sha256 '${{ inputs.checkpoint_artifact_sha256 }}' \
            --out CONTRACTNLI_${{ inputs.mode }}_EPOCH1_EVAL.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_artifact }}
          path: CONTRACTNLI_${{ inputs.mode }}_EPOCH1_EVAL.json
          if-no-files-found: error
          retention-days: 30
