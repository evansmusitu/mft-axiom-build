name: RevenueGuard ContractNLI Decoupled Curriculum Audit

on:
  push:
    branches: [revenueguard-axiom-governor-20260911]
    paths: ['.github/workflows/revenueguard-contractnli-decoupled-curriculum-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ContractNLI and audit exact build-only curriculum
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 -o contract-nli.zip 'https://raw.githubusercontent.com/stanfordnlp/contract-nli/eced6528dd3c1d14d73f9a87df8f7bdbc03126f9/resources/contract-nli.zip'
          unzip -q contract-nli.zip
          python - <<'PY'
          import hashlib, json, re
          from collections import Counter
          from pathlib import Path

          LABEL_MAP={'Contradiction':0,'Entailment':1,'NotMentioned':2}
          def words(s): return set(re.findall(r'[a-z0-9]+',s.lower()))
          def overlap(a,b):
              A,B=words(a),words(b); return len(A&B)/(len(A|B) or 1)
          def partition(d):
              return 'cal' if int(hashlib.sha256(str(d['id']).encode()).hexdigest()[:8],16)%10==0 else 'build'
          def span_texts(d): return [d['text'][a:b].strip() for a,b in d['spans']]
          def normalize_doc(s): return re.sub(r'\s+',' ',s).strip().lower()
          def doc_hash(d): return hashlib.sha256(normalize_doc(d['text']).encode()).hexdigest()

          obj=json.load(open('contract-nli/train.json')); labels=obj['labels']
          build_docs=[d for d in obj['documents'] if partition(d)=='build']
          cal_docs=[d for d in obj['documents'] if partition(d)=='cal']
          build_hashes={doc_hash(d) for d in build_docs}
          duplicate_equivalent_cal=[str(d['id']) for d in cal_docs if doc_hash(d) in build_hashes]

          rel=Counter(); sem=Counter(); semantic_rows=0; negative_rows=0; total_rows=0
          by_hyp=Counter()
          for d in build_docs:
              spans=span_texts(d); anns=d['annotation_sets'][0]['annotations']
              for hid in sorted(labels):
                  h=labels[hid]['hypothesis']; a=anns[hid]; gold=LABEL_MAP[a['choice']]
                  ev=sorted(set(a.get('spans') or [])); evset=set(ev)
                  if gold!=2:
                      for i in ev[:4]:
                          if i<len(spans):
                              rel['relevant']+=1; sem[a['choice']]+=1; semantic_rows+=1; total_rows+=1; by_hyp[hid]+=1
                  negatives=sorted(((overlap(s,h),i) for i,s in enumerate(spans) if i not in evset),reverse=True)
                  take=4 if gold==2 else 3
                  n=min(take,len(negatives)); rel['irrelevant']+=n; negative_rows+=n; total_rows+=n

          rep={
            'schema':'musitu.revenueguard.contractnli.decoupled_curriculum_audit.v1',
            'status':'DEV_RESEARCH_ONLY_TEST_AND_MAUD_UNOPENED',
            'contractnli_commit':'eced6528dd3c1d14d73f9a87df8f7bdbc03126f9',
            'build_documents':len(build_docs),
            'hash_held_calibration_documents':len(cal_docs),
            'duplicate_equivalent_calibration_doc_ids_excluded_at_eval':sorted(duplicate_equivalent_cal),
            'total_training_rows':total_rows,
            'relevance_counts':dict(rel),
            'semantic_counts':dict(sem),
            'semantic_rows':semantic_rows,
            'negative_rows_without_semantic_target':negative_rows,
            'semantic_supervision_rule':'Only genuine evidence spans from Entailment or Contradiction examples receive semantic polarity supervision; relevance negatives receive no semantic label.',
            'calibration_supervision_rule':'Hash-held calibration documents are excluded from training; duplicate-equivalent calibration documents are additionally excluded from calibration evaluation.',
            'hypothesis_semantic_row_counts':dict(sorted(by_hyp.items()))
          }
          assert set(sem).issubset({'Contradiction','Entailment'})
          assert rel['relevant']==semantic_rows
          assert rel['irrelevant']==negative_rows
          rep['pass']=True
          rep['report_sha256']=hashlib.sha256(json.dumps(rep,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path('CONTRACTNLI_DECOUPLED_CURRICULUM_AUDIT.json').write_text(json.dumps(rep,indent=2,sort_keys=True)+'\n')
          print(json.dumps(rep,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: revenueguard-contractnli-decoupled-curriculum-audit
          path: CONTRACTNLI_DECOUPLED_CURRICULUM_AUDIT.json
          if-no-files-found: error
          retention-days: 30
