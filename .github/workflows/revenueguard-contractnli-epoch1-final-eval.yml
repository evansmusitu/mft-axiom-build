name: RevenueGuard ContractNLI Decoupled Epoch2 Locked Dev Eval

on:
  push:
    branches: [revenueguard-axiom-governor-20260911]
    paths: ['.github/workflows/revenueguard-contractnli-epoch1-final-eval.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  await_candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - name: Await exact decoupled training run and fail closed on any non-success
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API='https://api.github.com/repos/evansmusitu/mft-axiom-build/actions/runs/34748996731'
          for i in $(seq 1 360); do
            J=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$API")
            STATUS=$(printf '%s' "$J" | python -c "import sys,json; print(json.load(sys.stdin)['status'])")
            CONCLUSION=$(printf '%s' "$J" | python -c "import sys,json; print(json.load(sys.stdin).get('conclusion') or '')")
            echo "training_status=${STATUS} conclusion=${CONCLUSION}"
            if [ "$STATUS" = completed ]; then
              [ "$CONCLUSION" = success ] || { echo 'bound training run did not succeed'; exit 1; }
              exit 0
            fi
            sleep 30
          done
          echo 'bound training run did not complete inside fail-closed evaluation window'
          exit 1

  score:
    needs: await_candidate
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download exact adapted semantic encoder
        uses: actions/download-artifact@v4
        with:
          name: revenueguard-contractnli-adapted-model
          path: adapted_bundle
          repository: evansmusitu/mft-axiom-build
          run-id: 34676990123
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact decoupled epoch2 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: revenueguard-contractnli-decoupled-epoch2-final
          path: final_checkpoint
          repository: evansmusitu/mft-axiom-build
          run-id: 34748996731
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned evaluator runtime and corpus
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers==4.56.2' 'scikit-learn>=1.5,<2'
          curl -fL --retry 4 --retry-delay 2 -o contract-nli.zip 'https://raw.githubusercontent.com/stanfordnlp/contract-nli/eced6528dd3c1d14d73f9a87df8f7bdbc03126f9/resources/contract-nli.zip'
          unzip -q contract-nli.zip
          test -f contract-nli/train.json
          test -f contract-nli/dev.json
      - name: Assert exact complete decoupled checkpoint identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import torch
          st=torch.load('final_checkpoint/decoupled_epoch2_state.pt',map_location='cpu',weights_only=False)
          assert st['schema']=='musitu.revenueguard.contractnli.decoupled_chunk_state.v1', st.get('schema')
          assert st['mode']=='decoupled', st.get('mode')
          assert st['num_chunks']==4, st['num_chunks']
          assert st['next_chunk']==4, st['next_chunk']
          assert st['global_steps']>0, st['global_steps']
          required={'relevance_head.weight','relevance_head.bias','semantic_head.weight','semantic_head.bias'}
          assert required.issubset(st['trainable_state'].keys()), sorted(st['trainable_state'])
          print({'mode':st['mode'],'next_chunk':st['next_chunk'],'global_steps':st['global_steps'],'trainable_tensors':len(st['trainable_state'])})
          PY
      - name: Score duplicate-clean calibration plus exposed dev shard
        shell: bash
        run: |
          set -euo pipefail
          python research/revenueguard/contractnli_decoupled_checkpoint_shard.py \
            --encoder adapted_bundle/adapted_model \
            --state final_checkpoint/decoupled_epoch2_state.pt \
            --train-json contract-nli/train.json \
            --dev-json contract-nli/dev.json \
            --shard-index ${{ matrix.shard }} \
            --num-shards 8 \
            --out raw_decoupled_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: revenueguard-contractnli-decoupled-e2-eval-shard-${{ matrix.shard }}
          path: raw_decoupled_${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: score
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: revenueguard-contractnli-decoupled-e2-eval-shard-*
          path: shards
          merge-multiple: true
      - name: Install aggregation runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'scikit-learn>=1.5,<2'
      - name: Bind exact checkpoint artifact digest and apply unchanged locked dev gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID=34748996731
          ART='revenueguard-contractnli-decoupled-epoch2-final'
          API="https://api.github.com/repos/evansmusitu/mft-axiom-build/actions/runs/${RUN_ID}/artifacts?name=${ART}"
          DIGEST=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$API" | python -c "import sys,json; o=json.load(sys.stdin); a=[x for x in o['artifacts'] if x['name']=='$ART' and not x['expired']]; assert len(a)==1,a; d=a[0].get('digest',''); assert d.startswith('sha256:'); print(d.split(':',1)[1])")
          python research/revenueguard/contractnli_decoupled_checkpoint_aggregate.py \
            --shard-glob 'shards/raw_decoupled_*.json' \
            --expected-shards 8 \
            --checkpoint-artifact-sha256 "$DIGEST" \
            --out CONTRACTNLI_DECOUPLED_EPOCH2_LOCKED_DEV_EVAL.json
      - uses: actions/upload-artifact@v4
        with:
          name: revenueguard-contractnli-decoupled-epoch2-locked-dev-eval
          path: CONTRACTNLI_DECOUPLED_EPOCH2_LOCKED_DEV_EVAL.json
          if-no-files-found: error
          retention-days: 30
