name: RevenueGuard CUAD Matched-Window Multitask Epoch 2

on:
  push:
    branches: [revenueguard-v41-postgate-research-20261101]
    paths: ['research/revenueguard/TRIGGER_CUAD_MATCHED_WINDOW_MULTITASK.json']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  chunk0:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Assert exact source artifact identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/evansmusitu/mft-axiom-build/actions/runs/41330640096/artifacts?name=revenueguard-cuad-epoch1-chunked-final' > source_meta.json
          python - <<'PY'
          import json
          o=json.load(open('source_meta.json'))
          a=[x for x in o['artifacts'] if x['name']=='revenueguard-cuad-epoch1-chunked-final' and not x['expired']]
          assert len(a)==1,a
          assert a[0]['digest'].startswith('sha256:') and len(a[0]['digest'])==71, a[0]['digest']
          print('retrained source digest', a[0]['digest'])
          print('source artifact identity PASS')
          PY
      - name: Download exact failed epoch1 source model
        uses: actions/download-artifact@v4
        with:
          name: revenueguard-cuad-epoch1-chunked-final
          path: source
          repository: evansmusitu/mft-axiom-build
          run-id: 41330640096
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned runtime and fetch pinned CUAD
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers==4.56.2' safetensors
          curl -fL --retry 4 --retry-delay 2 -o cuad-data.zip 'https://raw.githubusercontent.com/The-Atticus-Project/cuad/67faa0e6023b04fcaae6cc09497ab00e5d63a2a2/data.zip'
          unzip -q cuad-data.zip
      - name: Train matched-window chunk 0 of 4
        shell: bash
        run: |
          set -euo pipefail
          TRAIN=$(find . -name train_separate_questions.json -type f | head -n1)
          python research/revenueguard/cuad_matched_window_multitask_train.py \
            --model-in source/cuad_epoch1_final \
            --train-json "$TRAIN" \
            --chunk-index 0 --num-chunks 4 \
            --model-out cuad_matched_chunk_0 \
            --state-out cuad_matched_state_0.pt \
            --report CUAD_MATCHED_CHUNK_0.json
          python - <<'PY'
          import json
          o=json.load(open('CUAD_MATCHED_CHUNK_0.json'))
          c=o['full_selected_counts']
          assert o['schema']=='musitu.revenueguard.cuad.matched_window_train.v1'
          assert o['max_length']==384 and o['stride']==128 and o['batch_size']==24
          assert o['train_sha256']=='7de21d2bb741ac939e2a839ef9640634a5e0f9f40ea2b82c6833baf7db33dab4'
          assert c['selected_total']==61659 and c['selected_positive']==12305 and c['selected_negative']==49354
          assert c['build_questions']==19989 and c['heldout_questions']==2461
          print('pinned real-data matched-window geometry PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: revenueguard-cuad-matched-window-chunk-0
          path: |
            cuad_matched_chunk_0/
            cuad_matched_state_0.pt
            CUAD_MATCHED_CHUNK_0.json
          if-no-files-found: error
          retention-days: 90

  chunk1:
    needs: chunk0
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: revenueguard-cuad-matched-window-chunk-0
          path: previous
      - name: Install pinned runtime and fetch pinned CUAD
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers==4.56.2' safetensors
          curl -fL --retry 4 --retry-delay 2 -o cuad-data.zip 'https://raw.githubusercontent.com/The-Atticus-Project/cuad/67faa0e6023b04fcaae6cc09497ab00e5d63a2a2/data.zip'
          unzip -q cuad-data.zip
      - name: Train matched-window chunk 1 of 4
        shell: bash
        run: |
          set -euo pipefail
          TRAIN=$(find . -name train_separate_questions.json -type f | head -n1)
          python research/revenueguard/cuad_matched_window_multitask_train.py \
            --model-in previous/cuad_matched_chunk_0 \
            --train-json "$TRAIN" \
            --chunk-index 1 --num-chunks 4 \
            --state-in previous/cuad_matched_state_0.pt \
            --model-out cuad_matched_chunk_1 \
            --state-out cuad_matched_state_1.pt \
            --report CUAD_MATCHED_CHUNK_1.json
      - uses: actions/upload-artifact@v4
        with:
          name: revenueguard-cuad-matched-window-chunk-1
          path: |
            cuad_matched_chunk_1/
            cuad_matched_state_1.pt
            CUAD_MATCHED_CHUNK_1.json
          if-no-files-found: error
          retention-days: 90

  chunk2:
    needs: chunk1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: revenueguard-cuad-matched-window-chunk-1
          path: previous
      - name: Install pinned runtime and fetch pinned CUAD
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers==4.56.2' safetensors
          curl -fL --retry 4 --retry-delay 2 -o cuad-data.zip 'https://raw.githubusercontent.com/The-Atticus-Project/cuad/67faa0e6023b04fcaae6cc09497ab00e5d63a2a2/data.zip'
          unzip -q cuad-data.zip
      - name: Train matched-window chunk 2 of 4
        shell: bash
        run: |
          set -euo pipefail
          TRAIN=$(find . -name train_separate_questions.json -type f | head -n1)
          python research/revenueguard/cuad_matched_window_multitask_train.py \
            --model-in previous/cuad_matched_chunk_1 \
            --train-json "$TRAIN" \
            --chunk-index 2 --num-chunks 4 \
            --state-in previous/cuad_matched_state_1.pt \
            --model-out cuad_matched_chunk_2 \
            --state-out cuad_matched_state_2.pt \
            --report CUAD_MATCHED_CHUNK_2.json
      - uses: actions/upload-artifact@v4
        with:
          name: revenueguard-cuad-matched-window-chunk-2
          path: |
            cuad_matched_chunk_2/
            cuad_matched_state_2.pt
            CUAD_MATCHED_CHUNK_2.json
          if-no-files-found: error
          retention-days: 90

  chunk3:
    needs: chunk2
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: revenueguard-cuad-matched-window-chunk-2
          path: previous
      - name: Install pinned runtime and fetch pinned CUAD
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers==4.56.2' safetensors
          curl -fL --retry 4 --retry-delay 2 -o cuad-data.zip 'https://raw.githubusercontent.com/The-Atticus-Project/cuad/67faa0e6023b04fcaae6cc09497ab00e5d63a2a2/data.zip'
          unzip -q cuad-data.zip
      - name: Train matched-window chunk 3 of 4 and seal candidate
        shell: bash
        run: |
          set -euo pipefail
          TRAIN=$(find . -name train_separate_questions.json -type f | head -n1)
          python research/revenueguard/cuad_matched_window_multitask_train.py \
            --model-in previous/cuad_matched_chunk_2 \
            --train-json "$TRAIN" \
            --chunk-index 3 --num-chunks 4 \
            --state-in previous/cuad_matched_state_2.pt \
            --model-out cuad_matched_epoch2_final \
            --state-out cuad_matched_epoch2_state.pt \
            --report CUAD_MATCHED_EPOCH2_FINAL.json
      - uses: actions/upload-artifact@v4
        with:
          name: revenueguard-cuad-matched-window-epoch2-final
          path: |
            cuad_matched_epoch2_final/
            cuad_matched_epoch2_state.pt
            CUAD_MATCHED_EPOCH2_FINAL.json
          if-no-files-found: error
          retention-days: 90

  dispatch_heldout:
    needs: chunk3
    if: ${{ needs.chunk3.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify final candidate artifact and dispatch unchanged locked heldout scoring
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,re,urllib.request
          repo="evansmusitu/mft-axiom-build"
          run_id=os.environ["GITHUB_RUN_ID"]
          branch="revenueguard-v41-postgate-research-20261101"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def get(url):
           req=urllib.request.Request(url,headers=headers)
           with urllib.request.urlopen(req,timeout=30) as f:return json.load(f)
          run=get(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}")
          assert run["head_branch"]==branch and run["path"]==".github/workflows/revenueguard-cuad-matched-window-multitask-epoch2.yml",run
          jobs=get(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs")["jobs"]
          assert any(j["name"]=="chunk3" and j["conclusion"]=="success" for j in jobs),"TRAINING_CHUNK3_NOT_SUCCESS"
          arts=get(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?name=revenueguard-cuad-matched-window-epoch2-final")["artifacts"]
          valid=[a for a in arts if a["name"]=="revenueguard-cuad-matched-window-epoch2-final" and not a.get("expired")]
          assert len(valid)==1 and re.fullmatch(r"sha256:[0-9a-f]{64}",valid[0].get("digest","")),"CUAD_CHECKPOINT_NOT_READY"
          print(json.dumps({"trained_run":run_id,"head":run["head_sha"],"final_artifact_id":valid[0]["id"],"sha256":valid[0]["digest"]}),flush=True)
          target=f"https://api.github.com/repos/{repo}/actions/workflows/revenueguard-cuad-matched-window-posttrain-heldout.yml/dispatches"
          req=urllib.request.Request(target,headers={**headers,"Content-Type":"application/json"},method="POST",data=json.dumps({"ref":branch}).encode())
          with urllib.request.urlopen(req,timeout=30) as response:
           assert response.status==204,response.status
          print("CUAD_LOCKED_HELDOUT_DISPATCH_ACCEPTED",flush=True)
          PY
