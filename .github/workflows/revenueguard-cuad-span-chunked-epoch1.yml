          curl -fL --retry 4 --retry-delay 2 -o cuad-data.zip 'https://raw.githubusercontent.com/The-Atticus-Project/cuad/67faa0e6023b04fcaae6cc09497ab00e5d63a2a2/data.zip'
          unzip -q cuad-data.zip
      - name: Train chunk 1
        run: |
          TRAIN=$(find . -name train_separate_questions.json -type f | head -n1)
          python research/revenueguard/cuad_chunk_train.py --train-json "$TRAIN" --chunk-index 1 --input-dir previous/cuad_chunk_0 --state-in previous/cuad_state_0.pt --output-dir cuad_chunk_1 --state-out cuad_state_1.pt --report CUAD_CHUNK_1.json
      - uses: actions/upload-artifact@v4
        with:
          name: revenueguard-cuad-chunk-1
          path: |
            cuad_chunk_1/
            cuad_state_1.pt
            CUAD_CHUNK_1.json
