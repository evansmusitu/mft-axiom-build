name: RevenueGuard CUAD Span Chunked Epoch 1

on:
  push:
    branches: [revenueguard-axiom-governor-20260911]
    paths:
      - '.github/workflows/revenueguard-cuad-span-chunked-epoch1.yml'
      - 'research/revenueguard/cuad_chunk_train.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  chunk0:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime and fetch CUAD
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers==4.56.2' 'huggingface-hub==0.34.4' safetensors
          curl -fL --retry 4 --retry-delay 2 -o cuad-data.zip 'https://raw.githubusercontent.com/The-Atticus-Project/cuad/67faa0e6023b04fcaae6cc09497ab00e5d63a2a2/data.zip'
          unzip -q cuad-data.zip
      - name: Train chunk 0
        run: |
          TRAIN=$(find . -name train_separate_questions.json -type f | head -n1)
          python research/revenueguard/cuad_chunk_train.py --train-json "$TRAIN" --chunk-index 0 --output-dir cuad_chunk_0 --state-out cuad_state_0.pt --report CUAD_CHUNK_0.json
      - uses: actions/upload-artifact@v4
        with:
          name: revenueguard-cuad-chunk-0
          path: |
            cuad_chunk_0/
            cuad_state_0.pt
            CUAD_CHUNK_0.json
          if-no-files-found: error
          retention-days: 30

  chunk1:
    needs: chunk0
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: revenueguard-cuad-chunk-0, path: previous}
      - name: Install runtime and fetch CUAD
        run: |
