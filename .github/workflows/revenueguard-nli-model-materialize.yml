name: RevenueGuard Sovereign NLI Model Materializer

on:
  push:
    branches:
      - revenueguard-axiom-governor-20260911
    paths:
      - '.github/workflows/revenueguard-nli-model-materialize.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Materialize pinned public NLI model and offline wheels
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          mkdir -p nli_bundle/wheelhouse nli_bundle/model
          python -m pip download -d nli_bundle/wheelhouse \
            'transformers==4.56.2' 'tokenizers==0.22.0' 'safetensors==0.6.2' \
            'sentencepiece==0.2.1' 'huggingface-hub==0.34.4' 'regex' 'pyyaml' 'requests' 'tqdm'
          python -m pip install 'transformers==4.56.2' 'huggingface-hub==0.34.4' 'sentencepiece==0.2.1'
          python - <<'PY'
          from transformers import AutoTokenizer, AutoModelForSequenceClassification
          from pathlib import Path
          import json, hashlib
          repo='cross-encoder/nli-deberta-v3-small'
          revision='main'
          out=Path('nli_bundle/model')
          tok=AutoTokenizer.from_pretrained(repo, revision=revision)
          mdl=AutoModelForSequenceClassification.from_pretrained(repo, revision=revision)
          tok.save_pretrained(out)
          mdl.save_pretrained(out, safe_serialization=True)
          rows=[]
          for p in sorted(out.rglob('*')):
              if p.is_file():
                  b=p.read_bytes(); rows.append({'path':str(p.relative_to(out)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          manifest={'schema':'musitu.revenueguard.nli_base.v1','source_repo':repo,'revision':revision,'files':rows}
          manifest['manifest_sha256']=hashlib.sha256(json.dumps(manifest,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path('nli_bundle/MODEL_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'files':len(rows),'manifest_sha256':manifest['manifest_sha256']},indent=2))
          PY
          sha256sum nli_bundle/wheelhouse/* > nli_bundle/WHEELHOUSE_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: revenueguard-sovereign-nli-base
          path: nli_bundle/
          if-no-files-found: error
          retention-days: 30
