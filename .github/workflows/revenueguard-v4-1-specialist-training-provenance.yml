name: RevenueGuard V4.1 Specialist Training Provenance Seal

on:
  push:
    branches: [revenueguard-axiom-governor-20260911]
    paths: ['research/revenueguard/TRIGGER_V4_1_SPECIALIST_TRAINING_PROVENANCE.json']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and verify exact training ancestry and final artifact digests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo='evansmusitu/mft-axiom-build'
          token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as r: return json.load(r)
          def exact_artifact(run_id,name,expected):
              obj=get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?name={name}')
              arts=[a for a in obj['artifacts'] if a['name']==name and not a['expired']]
              assert len(arts)==1,(run_id,name,arts)
              digest=arts[0].get('digest','')
              assert digest==f'sha256:{expected}',(run_id,name,digest)
              return expected

          cn_run=get(f'https://api.github.com/repos/{repo}/actions/runs/34748996731')
          cq_run=get(f'https://api.github.com/repos/{repo}/actions/runs/34749003397')
          assert cn_run['head_sha']=='9bde25dab82909ed40e4a9722fdbfb648896d220',cn_run['head_sha']
          assert cq_run['head_sha']=='302d36e9dd26af60464d0ecf4e3d2504f9591f52',cq_run['head_sha']
          assert cn_run['status']=='completed' and cn_run['conclusion']=='success',(cn_run['status'],cn_run['conclusion'])
          assert cq_run['status']=='completed' and cq_run['conclusion']=='success',(cq_run['status'],cq_run['conclusion'])

          cn_source=exact_artifact(34676990123,'revenueguard-contractnli-adapted-model','3d78d473ffde6f790b3919226d1069b81fa8426f0f139007d3ba8b9d9cf23055')
          cq_source=exact_artifact(34683449126,'revenueguard-cuad-epoch1-chunked-final','a5684a5a8ed59909b46c93fd4729ce9ed0f8f672dc0be1474cf94a5e07d6e44b')
          cq_geom=exact_artifact(34706691340,'revenueguard-cuad-matched-window-geometry-audit','7ff5e7ccd10aa3c4747136a0d5b67af2004edaf9777247155ce6e37812c56c04')

          def final_artifact(run_id,name):
              obj=get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?name={name}')
              arts=[a for a in obj['artifacts'] if a['name']==name and not a['expired']]
              assert len(arts)==1,(run_id,name,arts)
              digest=arts[0].get('digest','')
              assert digest.startswith('sha256:') and len(digest)==71,(run_id,name,digest)
              return digest.split(':',1)[1]
          cn_final=final_artifact(34748996731,'revenueguard-contractnli-decoupled-epoch2-final')
          cq_final=final_artifact(34749003397,'revenueguard-cuad-matched-window-epoch2-final')
          vals={
            'CN_ARTIFACT_SHA':cn_final,
            'CUAD_ARTIFACT_SHA':cq_final,
            'CN_SOURCE_ENCODER_SHA':cn_source,
            'CUAD_SOURCE_MODEL_SHA':cq_source,
            'CUAD_GEOMETRY_ARTIFACT_SHA':cq_geom,
            'CN_TRAINING_HEAD_SHA':cn_run['head_sha'],
            'CUAD_TRAINING_HEAD_SHA':cq_run['head_sha'],
          }
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for k,v in vals.items(): f.write(f'{k}={v}\n')
          print('exact specialist ancestry and final artifact identities PASS')
          PY

      - name: Download exact ContractNLI final training artifact
        uses: actions/download-artifact@v4
        with:
          name: revenueguard-contractnli-decoupled-epoch2-final
          path: cn_final
          repository: evansmusitu/mft-axiom-build
          run-id: 34748996731
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact CUAD final training artifact
        uses: actions/download-artifact@v4
        with:
          name: revenueguard-cuad-matched-window-epoch2-final
          path: cuad_final
          repository: evansmusitu/mft-axiom-build
          run-id: 34749003397
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install state-validation runtime
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Assert complete exact training states
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, torch
          from pathlib import Path
          cn=torch.load('cn_final/decoupled_epoch2_state.pt',map_location='cpu',weights_only=False)
          assert cn['schema']=='musitu.revenueguard.contractnli.decoupled_chunk_state.v1'
          assert cn['mode']=='decoupled'
          assert cn['num_chunks']==4 and cn['next_chunk']==4 and cn['global_steps']==615
          keys=sorted(cn['trainable_state'])
          assert len(keys)==68,len(keys)
          name_sha=hashlib.sha256(json.dumps(keys,separators=(',',':')).encode()).hexdigest()
          shapes={k:list(cn['trainable_state'][k].shape) for k in keys}
          shape_sha=hashlib.sha256(json.dumps(shapes,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert name_sha=='a858e138760588bdb8c89cb440e75a0f9441d23f7a3a9993a1755a3dc8f77c05',name_sha
          assert shape_sha=='185cd8b4100f27950ebc20206ccf407a01d2694f8e2a6f6fa8fe6d4f04250b27',shape_sha
          layer_counts={i:sum(k.startswith(f'encoder.encoder.layer.{i}.') for k in keys) for i in range(6)}
          assert layer_counts=={0:0,1:0,2:16,3:16,4:16,5:16},layer_counts
          cq=torch.load('cuad_final/cuad_matched_epoch2_state.pt',map_location='cpu',weights_only=False)
          assert cq['schema']=='musitu.revenueguard.cuad.matched_window_state.v1'
          assert cq['num_chunks']==4 and cq['next_chunk']==4
          assert cq['train_sha256']=='7de21d2bb741ac939e2a839ef9640634a5e0f9f40ea2b82c6833baf7db33dab4'
          assert cq['global_steps']==2571
          assert Path('cuad_final/cuad_matched_epoch2_final/answer_head.pt').is_file()
          cjr=json.load(open('cn_final/CONTRACTNLI_DECOUPLED_EPOCH2_FINAL.json'))
          qjr=json.load(open('cuad_final/CUAD_MATCHED_EPOCH2_FINAL.json'))
          assert cjr['global_steps']==615 and cjr['chunk_index']==3 and cjr['num_chunks']==4
          assert qjr['global_steps']==2571 and qjr['chunk_index']==3 and qjr['num_chunks']==4
          print({'contractnli_global_steps':cn['global_steps'],'contractnli_trainable_tensors':len(keys),'cuad_global_steps':cq['global_steps']})
          PY

      - name: Build fail-closed specialist training provenance seal
        shell: bash
        run: |
          set -euo pipefail
          python research/revenueguard/specialist_training_provenance_seal.py \
            --contractnli-final-report cn_final/CONTRACTNLI_DECOUPLED_EPOCH2_FINAL.json \
            --contractnli-artifact-sha256 "$CN_ARTIFACT_SHA" \
            --contractnli-run-id 34748996731 \
            --contractnli-training-head-sha "$CN_TRAINING_HEAD_SHA" \
            --contractnli-source-encoder-artifact-sha256 "$CN_SOURCE_ENCODER_SHA" \
            --cuad-final-report cuad_final/CUAD_MATCHED_EPOCH2_FINAL.json \
            --cuad-artifact-sha256 "$CUAD_ARTIFACT_SHA" \
            --cuad-run-id 34749003397 \
            --cuad-training-head-sha "$CUAD_TRAINING_HEAD_SHA" \
            --cuad-source-model-artifact-sha256 "$CUAD_SOURCE_MODEL_SHA" \
            --cuad-geometry-artifact-sha256 "$CUAD_GEOMETRY_ARTIFACT_SHA" \
            --cuad-geometry-report research/revenueguard/CUAD_TRAINER_GEOMETRY_ONEPASS_AUDIT_2026-09-13.json \
            --out V4_1_SPECIALIST_TRAINING_PROVENANCE_SEAL.json

      - uses: actions/upload-artifact@v4
        with:
          name: revenueguard-v4-1-specialist-training-provenance-seal
          path: V4_1_SPECIALIST_TRAINING_PROVENANCE_SEAL.json
          if-no-files-found: error
          retention-days: 90
