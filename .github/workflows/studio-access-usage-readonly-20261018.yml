name: MUSITU Studio — Access/Android Production Timeline Read-only
on:
  push:
    branches: [experiments/studio-remote-r2-modal-e2e-20261017]
    paths:
      - '.github/workflows/studio-access-usage-readonly-20261018.yml'
      - 'ops/studio_usage_forensics.py'
      - 'ops/test_studio_usage_forensics.py'
permissions:
  contents: read
jobs:
  provider-readonly-correlation:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test no identity disclosure or false mobile attribution
        run: |
          python -m py_compile ops/studio_usage_forensics.py
          python -m unittest discover -s ops -p 'test_studio_usage_forensics.py' -v
      - name: Read-only exact-zone Cloudflare authentication and sampled HTTP analytics
        run: python ops/studio_usage_forensics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musitu-studio-access-android-timeline-readonly-20261018
          path: studio-access-usage-correlation-20261018.json
          if-no-files-found: warn
          retention-days: 14
