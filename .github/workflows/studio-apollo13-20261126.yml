name: MUSITU Studio Apollo 13 historical film — private T4 film
on:
  push:
    branches: [experiments/studio-apollo13-20261126]
    paths:
      - '.github/workflows/studio-apollo13-20261126.yml'
      - 'musitu_studio/film_apollo13/**'
permissions:
  contents: read
concurrency:
  group: studio-apollo13-20261126
  cancel-in-progress: false
jobs:
  qualify-and-submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Offline validation
        working-directory: musitu_studio/film_apollo13
        run: |
          python -m py_compile *.py
          python -m unittest -v test_contract
      - name: Install pinned Modal SDK
        run: python -m pip install --disable-pip-version-check -q 'modal==1.6.4'
      - name: Inspect existing Modal app without compute
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal app list --json > "$RUNNER_TEMP/modal-apps.json"
          python - <<'PY'
          import json,os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/modal-apps.json'))
          matches=[x for x in data if 'musitu-studio-gpu-smoke-20261126' in json.dumps(x)]
          if not matches:raise SystemExit('ORIGINAL_MODAL_SMOKE_APP_NOT_FOUND')
          print('ORIGINAL_MODAL_SMOKE_APP_PRESENT',json.dumps(matches))
          PY
      - name: Gate on verified superseded film shutdown
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=evansmusitu/mft-axiom-build
          state=pending
          shutdown=""
          for i in $(seq 1 120); do
            shutdown=$(gh api 'repos/'$repo'/actions/runs?head_sha='$GITHUB_SHA --jq '[.workflow_runs[] | select(.name == "MUSITU Studio — stop superseded Last Signal only")][0].id // empty')
            if [ -z "$shutdown" ]; then sleep 5; continue; fi
            state=$(gh api repos/$repo/actions/runs/$shutdown --jq .status)
            [ "$state" = completed ] && break
            sleep 5
          done
          [ "$state" = completed ]
          [ "$(gh api repos/$repo/actions/runs/$shutdown --jq .conclusion)" = success ]
          [ "$(gh api repos/$repo/actions/runs/45763486407 --jq .status)" = completed ]
          echo 'SUPERSEDED_FILM_SHUTDOWN_VERIFIED'
      - name: Deploy dedicated private film app
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy musitu_studio/film_apollo13/film_modal.py
      - name: Build new Blender source and qualify real 12-frame batch
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          mkdir -p film-evidence
          python - <<'PY'
          import json,modal,os,pathlib
          app='musitu-studio-apollo13-20261126';commit=os.environ['GITHUB_SHA']
          source=modal.Function.from_name(app,'prepare').remote(commit)
          pathlib.Path('film-evidence/source.json').write_text(json.dumps(source,indent=2));print('SOURCE',json.dumps(source))
          batch=modal.Function.from_name(app,'render_batch').remote(commit,1,12)
          pathlib.Path('film-evidence/qualification.json').write_text(json.dumps(batch,indent=2))
          assert batch['renderer']=='CYCLES_CUDA' and batch['device']=='Tesla T4' and batch['gpu_peak_utilization']>0 and len(batch['frames'])==12
          assert len(set(x['sha256'] for x in batch['frames']))>1
          print('REAL_12_FRAME_QUALIFICATION_PASS',json.dumps(batch))
          PY
      - name: Submit production controller only after qualification
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import json,modal,os,pathlib
          app='musitu-studio-apollo13-20261126';commit=os.environ['GITHUB_SHA']
          vol=modal.Volume.from_name(app)
          try:state=json.loads(b''.join(vol.read_file(commit+'/status.json')))
          except FileNotFoundError:state={}
          if state.get('state')=='RENDERING' or state.get('status') in ('VERIFIED','VERIFIED_EXISTING'):
              receipt={'status':'EXISTING_CONTROLLER_OR_OUTPUT','commit':commit,'state':state}
          else:
              call=modal.Function.from_name(app,'produce').spawn(commit)
              receipt={'status':'SUBMITTED_NOT_COMPLETE','commit':commit,'function_call_id':call.object_id,'volume':app}
          pathlib.Path('film-evidence/submission.json').write_text(json.dumps(receipt,indent=2));print('PRODUCTION_CONTROLLER',json.dumps(receipt))
          PY
      - name: Retain qualification and submission evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apollo13-production-evidence
          path: film-evidence/
          if-no-files-found: warn
          retention-days: 14
