name: MUSITU Studio Apollo 13 — read-only Modal production diagnostics
on:
  push:
    branches: [experiments/studio-apollo13-20261126]
    paths: ['.github/workflows/studio-apollo13-readback-20261126.yml']
permissions:
  contents: read
concurrency:
  group: studio-apollo13-readback
  cancel-in-progress: false
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -q 'modal==1.6.4'
      - name: Inspect only existing film app and volume without launching compute
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          modal app list --json > "$RUNNER_TEMP/apps.json"
          python - <<'PY'
          import json,os,pathlib,modal,traceback,collections
          name='musitu-studio-apollo13-20261126'
          root='3d6376959f043323c1b35d828bd25c8523103c00'
          apps=json.load(open(os.environ['RUNNER_TEMP']+'/apps.json'))
          report={'app':[x for x in apps if x.get('description')==name], 'render_commit':root}
          v=modal.Volume.from_name(name,create_if_missing=False)
          for rel in ('source.json','status.json','completeness_manifest.json','batches/000001-000012/receipt.json','batches/000001-000012/failed-render.log','build.log'):
              try:
                  raw=b''.join(v.read_file(root+'/'+rel))
                  if rel.endswith('.json'):
                      data=json.loads(raw)
                      if rel=='completeness_manifest.json':data={k:data.get(k) for k in ('status','source','mp4_sha256','mp4_bytes','ffprobe')}
                      report[rel]=data
                  else:report[rel]=raw.decode(errors='replace')[-10000:]
              except Exception as e:report[rel]={'read_error':type(e).__name__+': '+str(e)[:500]}
          try:
              entries=v.listdir(root+'/batches')
              report['batch_dirs']=[str(x.path) for x in entries]
          except Exception as e:report['batch_dirs_error']=str(e)[:500]
          try:report['root_entries']=[{'path':x.path,'size':x.size} for x in v.listdir(root)]
          except Exception as e:report['root_entries_error']=str(e)[:500]
          p=pathlib.Path('evidence/modal-readback.json');p.write_text(json.dumps(report,indent=2,default=str))
          print('MODAL_READBACK',json.dumps(report,default=str)[:45000])
          PY
          appid=$(python -c "import json; a=json.load(open('evidence/modal-readback.json'))['app']; print(a[0]['app_id'] if len(a)==1 else '')")
          if [ -n "$appid" ]; then
            modal app logs --help
            timeout 20s modal app logs "$appid" > "$RUNNER_TEMP/apollo-logs.txt" 2>&1 || true
            tail -c 20000 "$RUNNER_TEMP/apollo-logs.txt" > evidence/modal-app-log-tail.txt
            cat evidence/modal-app-log-tail.txt
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: apollo13-readonly-provider-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
