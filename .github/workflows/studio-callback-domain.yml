name: MUSITU Studio — Callback Custom Domain Without Interactive Access
on:
  push:
    branches: [experiments/studio-full-deploy-20261017]
    paths: ['ops/studio_callback_domain.py','.github/workflows/studio-callback-domain.yml']
permissions: {contents: read}
jobs:
  attach:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Attach only isolated Studio callback Worker under separate hostname
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python ops/studio_callback_domain.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musitu-studio-callback-custom-domain
          path: studio-callback-hostname.json
          retention-days: 14
          if-no-files-found: warn
