name: MUSITU Studio — Error 1010 Origin Security Inventory
on:
  push:
    branches: [experiments/studio-remote-r2-modal-e2e-20261017]
    paths:
      - 'ops/studio_cf_1010_inventory.py'
      - '.github/workflows/studio-cf-1010-inventory.yml'
permissions: {contents: read}
jobs:
  readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Account-scoped Cloudflare GET only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python ops/studio_cf_1010_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-studio-cf1010-sanitized-cause
          path: studio-cloudflare-1010-cause-readonly.json
          retention-days: 7
