name: MUSITU Studio — Complete Verified New-Chat Transfer 2026-10-20
on:
  push:
    branches: [experiments/studio-enterprise-v03-sqlite-do-20261018]
    paths:
      - '.github/workflows/studio-complete-new-chat-handoff-20261020.yml'
      - 'ops/studio_build_new_chat_handoff_20261020.py'
      - 'ops/studio_snapshot_provider_readonly_20261020.py'
      - 'docs/STUDIO_NEW_CHAT_ZERO_LOSS_HANDOFF_20261020.md'
      - 'musitu_studio/neon/**'
      - 'musitu_studio/edge/public_v03/**'
      - 'musitu_studio/edge/tests/v03_scene_preview.test.mjs'
      - 'musitu_studio/edge/tests/v03_glb_export.test.mjs'
      - 'musitu_studio/edge/tests/v03_glb_animation.test.mjs'
      - 'ops/tests/test_studio_complete_handoff_scope_20261023.py'
      - 'ops/studio_build_new_chat_handoff_20261020.py'
      - 'creative/god_mode_2099/**'
      - '.github/workflows/god-mode-2099-*'
      - 'docs/STUDIO_OFFLINE_GLB_EXPORT_AND_PROVIDER_NO_GO_20261022.md'
      - 'docs/STUDIO_V03_BROWSER_SCENE_WORKBENCH_20261022.md'
      - 'ops/studio_v03_export_offline_keyframe_editor_20261022.py'
      - 'ops/tests/test_studio_offline_keyframe_export_20261022.py'
      - 'docs/STUDIO_V03_KEYFRAME_WORKBENCH_20261022.md'
      - 'docs/STUDIO_NEW_CHAT_TRANSFER_BRIEF_20261021.md'
permissions: {contents: read}
concurrency:
  group: musitu-studio-complete-new-chat-transfer-20261020
  cancel-in-progress: false
jobs:
  complete-source-and-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate expected isolation and source syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiments/studio-enterprise-v03-sqlite-do-20261018"
          test -f musitu_studio/edge/src/v03_do_entry.mjs
          test -f musitu_studio/edge/src/r2_entry.mjs
          test -f musitu_studio/modal/studio_modal.py
          test -f musitu_studio/edge/public_v03/index.html
          test -f docs/STUDIO_NEW_CHAT_ZERO_LOSS_HANDOFF_20261020.md
          test -f docs/STUDIO_NEW_CHAT_TRANSFER_BRIEF_20261021.md
          python -m py_compile ops/studio_build_new_chat_handoff_20261020.py ops/studio_snapshot_provider_readonly_20261020.py
          node --check musitu_studio/edge/src/v03_entry.mjs
          node --check musitu_studio/edge/src/v03_do_entry.mjs
          node --check musitu_studio/edge/public_v03/studio.js
          node --check musitu_studio/edge/public_v03/scene-preview.mjs
          node --check musitu_studio/edge/public_v03/glb-export.mjs
          test -f musitu_studio/edge/tests/v03_scene_preview.test.mjs
      - name: Install test dependencies, save exact resolved lockfile in handoff
        working-directory: musitu_studio/edge
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Execute complete Studio edge test suite including V0.2/V0.3
        working-directory: musitu_studio/edge
        run: npm test
      - name: Export independent offline keyframe editor reproducibly
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s ops/tests -p test_studio_offline_keyframe_export_20261022.py
          python -m unittest discover -s ops/tests -p test_studio_complete_handoff_scope_20261023.py
          python ops/studio_v03_export_offline_keyframe_editor_20261022.py --output "$RUNNER_TEMP/MUSITU_STUDIO_V03_OFFLINE_KEYFRAME_ANIMATION_EDITOR.html"
          test -s "$RUNNER_TEMP/MUSITU_STUDIO_V03_OFFLINE_KEYFRAME_ANIMATION_EDITOR.html"
      - uses: actions/upload-artifact@v4
        with:
          name: MUSITU_STUDIO_V03_OFFLINE_KEYFRAME_ANIMATION_EDITOR
          path: ${{ runner.temp }}/MUSITU_STUDIO_V03_OFFLINE_KEYFRAME_ANIMATION_EDITOR.html
          retention-days: 45
          if-no-files-found: error
      - name: Verify Neon migration safety and terminal-asset integrity (offline, no provider compute)
        run: node --test musitu_studio/neon/tests/*.test.mjs
      - name: Read-only provider check without exposing staff emails, cookies or API token
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python ops/studio_snapshot_provider_readonly_20261020.py
      - name: Package ALL tracked Studio sources, workflows, operations and proofs
        shell: bash
        run: |
          set -euo pipefail
          python ops/studio_build_new_chat_handoff_20261020.py
          test -s MUSITU_STUDIO_ENTERPRISE_COMPLETE_HANDOFF_20261021.zip
          test -s STUDIO_NEW_CHAT_HANDOFF_BUILD_RECEIPT_20261020.json
      - name: Independently execute verifier EMBEDDED in the ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile,pathlib,subprocess,sys
          p=pathlib.Path('MUSITU_STUDIO_ENTERPRISE_COMPLETE_HANDOFF_20261021.zip')
          with zipfile.ZipFile(p) as z:
            ver=[x for x in z.namelist() if x.endswith('/07_VERIFY_HANDOFF.py')]
            assert len(ver)==1
            code=z.read(ver[0])
          pathlib.Path('/tmp/studio_verify_transfer.py').write_bytes(code)
          subprocess.run([sys.executable,'/tmp/studio_verify_transfer.py',str(p.resolve())],check=True)
          print('NEW_CHAT_EMBEDDED_VERIFIER=PASS')
          PY
      - name: Prepare DIRECT archive content for a clean non-nested Drive ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,zipfile,json
          p=pathlib.Path('MUSITU_STUDIO_ENTERPRISE_COMPLETE_HANDOFF_20261021.zip')
          dest=pathlib.Path('DIRECT_DRIVE_ZIP_CONTENT')
          dest.mkdir(exist_ok=True)
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            names=z.namelist()
            assert all(not x.startswith('/') and '..' not in pathlib.PurePosixPath(x).parts for x in names)
            for name in names:
              target=dest/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(z.read(name))
          root=dest/'MUSITU_STUDIO_ENTERPRISE_COMPLETE_HANDOFF_20261021'
          assert (root/'MANIFEST_SHA256.json').is_file()
          manifest=json.loads((root/'MANIFEST_SHA256.json').read_text())
          assert len(manifest['files'])>=200
          assert (root/'PRODUCT_SOURCE/.github/workflows/studio-complete-new-chat-handoff-20261020.yml').is_file()
          print('STUDIO_DIRECT_DRIVE_ARCHIVE_CONTENT=PASS',len(names),'files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MUSITU_STUDIO_ENTERPRISE_COMPLETE_HANDOFF_20261021_DIRECT
          path: DIRECT_DRIVE_ZIP_CONTENT/
          retention-days: 45
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MUSITU_STUDIO_ENTERPRISE_COMPLETE_HANDOFF_20261021
          path: |
            MUSITU_STUDIO_ENTERPRISE_COMPLETE_HANDOFF_20261021.zip
            STUDIO_NEW_CHAT_HANDOFF_BUILD_RECEIPT_20261020.json
            PROVIDER_READONLY_HANDOFF_SNAPSHOT_20261020.json
          retention-days: 45
          if-no-files-found: warn
