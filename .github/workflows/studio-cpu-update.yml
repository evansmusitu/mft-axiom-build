name: MUSITU Studio CPU Production Update
on:
  push:
    branches: [experiments/studio-remote-r2-modal-e2e-20261017]
    paths: ['.github/workflows/studio-cpu-update.yml']
permissions: {contents: read}
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test Studio software
        working-directory: musitu_studio/edge
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --test tests/*.test.mjs
          node --check public/studio.js
      - name: Discover existing Modal CPU API
        run: |
          python -m pip install -q 'modal>=1.5,<2'
          python - <<'PY' >> "$GITHUB_ENV"
          import modal
          url=modal.Function.from_name('musitu-studio-v02','submit_asgi').get_web_url()
          if not url or not url.startswith('https://'):raise SystemExit('Modal endpoint missing')
          print('STUDIO_MODAL_ENDPOINT='+url.rstrip('/')+'/jobs')
          PY
      - name: Update isolated Studio Worker
        run: python ops/studio_r2_cpu_staff_deploy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musitu-studio-staff-cpu-activation
          path: studio-r2-cpu-live.json
          if-no-files-found: warn
          retention-days: 14
