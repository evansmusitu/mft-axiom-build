name: MUSITU Studio Modal existing GPU function read-only inspection (NO COMPUTE)
on:
  push:
    branches:
      - experiments/studio-g56-budgeted-render-20261122
    paths:
      - '.github/workflows/studio-g56-modal-gpu-render-readonly-20261124.yml'
permissions:
  contents: read
jobs:
  modal-render-gpu-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Pin interpreter; avoid checking out untrusted code
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install official SDK without credentials
        run: python -m pip install -q --disable-pip-version-check 'modal==1.6.4'
      - name: Read registered Studio function metadata, never spawn
        shell: bash
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          receipt={
            'schema':'musitu.studio.modal-gpu-function-inventory.v1',
            'read_only':True, 'credentials_supplied':False,
            'workspace_authenticated':False,
            'existing_studio_app_readable':False,
            'existing_cpu_pull_function_readable':False,
            'existing_gpu_function_readable':False,
            'existing_gpu_smoke_function_readable':False,
            'provider_budget_hard_limit_verified':False,
            'provider_gpu_entitlement_verified':False,
            'cuda_render_verified':False,
            'gpu_render_180s_created':False,
            'compute_invoked':False,
            'modal_deployed_or_mutated':False,
            'paid_execution_authorized':False
          }
          def metadata(args):
            try:
              p=subprocess.run(args,capture_output=True,text=True,timeout=45,check=False)
              if p.returncode!=0:return False
              data=json.loads(p.stdout)
              return isinstance(data,(dict,list)) and bool(data)
            except (ValueError,OSError,subprocess.TimeoutExpired):
              return False
          try:
            tid=os.environ.get('MODAL_TOKEN_ID','')
            secret=os.environ.get('MODAL_TOKEN_SECRET','')
            if not (tid.startswith('ak-') and secret.startswith('as-')
                    and len(tid)>10 and len(secret)>10):
              raise RuntimeError('NO_MODAL_CREDENTIALS')
            receipt['credentials_supplied']=True
            import modal
            ws=modal.Workspace.from_context()
            ws.hydrate()
            receipt['workspace_authenticated']=bool(ws.name)
            receipt['existing_studio_app_readable']=metadata(
              ['modal','app','info','musitu-studio-v02','--json'])
            receipt['existing_cpu_pull_function_readable']=metadata(
              ['modal','function','info','musitu-studio-v02/render_cpu_pull','--json'])
            receipt['existing_gpu_function_readable']=metadata(
              ['modal','function','info','musitu-studio-v02/render_gpu','--json'])
            receipt['existing_gpu_smoke_function_readable']=metadata(
              ['modal','function','info','musitu-studio-v02/smoke_gpu','--json'])
          except Exception:
            pass
          print('MUSITU_MODAL_GPU_INVENTORY='+json.dumps(receipt,sort_keys=True))
          PY
