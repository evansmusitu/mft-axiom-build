name: MUSITU Studio Modal repo secrets read-only inventory (NO COMPUTE)
on:
  push:
    branches:
      - experiments/studio-g56-budgeted-render-20261122
    paths:
      - '.github/workflows/studio-g56-modal-repo-secrets-inventory-20261124.yml'
permissions:
  contents: read
concurrency:
  group: musitu-studio-modal-repo-secrets-inventory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inventory-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Isolated Python interpreter, no project code checkout
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned official Modal SDK, without any secrets
        run: python -m pip install -q --disable-pip-version-check 'modal==1.6.4'
      - name: Authenticate and inspect EXISTING Studio app and CPU function, read only
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,subprocess,sys
          from decimal import Decimal
          receipt={
            'schema':'musitu.studio.g56.modal-repo-secret-inventory.v1',
            'credentials_supplied':False,
            'workspace_authenticated':False,
            'billing_summary_readable':False,
            'studio_app_accessible':False,
            'studio_cpu_function_accessible':False,
            'app_account_association_observed':False,
            'workspace_hard_budget_verified':False,
            'provider_hard_cap_remaining_verified':False,
            'compute_enabled':False,
            'render_jobs_spawned':False,
            'settings_changed':False,
            'release_permitted':False,
          }
          def info(args):
              # Safe whitelist; never print provider stdout or stderr.
              try:
                  p=subprocess.run(args,capture_output=True,text=True,timeout=50,check=False)
                  if p.returncode!=0:return False
                  obj=json.loads(p.stdout)
                  return isinstance(obj,(dict,list)) and bool(obj)
              except (ValueError,OSError,subprocess.TimeoutExpired):return False
          try:
              tid=os.getenv('MODAL_TOKEN_ID','')
              secret=os.getenv('MODAL_TOKEN_SECRET','')
              if not (tid.startswith('ak-') and secret.startswith('as-')
                      and len(tid)>=11 and len(secret)>=11):
                  raise ValueError('MODAL_CREDENTIALS_MISSING')
              receipt['credentials_supplied']=True
              import modal
              ws=modal.Workspace.from_context()
              ws.hydrate()
              if not isinstance(ws.name,str) or not ws.name:
                  raise ValueError('MODAL_WORKSPACE_AUTH_UNCONFIRMED')
              receipt['workspace_authenticated']=True
              usage=ws.billing.summary(cycle='this month')
              if all(type(getattr(usage,k,None)) is Decimal
                     and getattr(usage,k).is_finite()
                     and getattr(usage,k)>=0
                     for k in ('billed_cost','metered_cost')):
                  receipt['billing_summary_readable']=True
              # Modal app/function info are documented READ operations.
              # They are looked up only in the authenticated token's workspace.
              receipt['studio_app_accessible']=info(
                  ['modal','app','info','musitu-studio-v02','--json'])
              receipt['studio_cpu_function_accessible']=info(
                  ['modal','function','info','musitu-studio-v02/render_cpu_pull','--json'])
              receipt['app_account_association_observed']=(
                  receipt['studio_app_accessible'] and
                  receipt['studio_cpu_function_accessible'])
          except Exception:
              pass
          # Identity and billing summaries do not prove a HARD budget.
          print('MUSITU_STUDIO_MODAL_REPO_SECRETS_READONLY='+
                json.dumps(receipt,sort_keys=True))
          sys.exit(0 if (receipt['workspace_authenticated'] and
                         receipt['billing_summary_readable']) else 1)
          PY
