name: MUSITU Studio G5-G6 offline ledger safety proof
on:
  push:
    branches:
      - experiments/studio-g56-budgeted-render-20261122
    paths:
      - 'musitu_studio/gates56/**'
      - '.github/workflows/studio-g56-offline-proof-20261122.yml'
permissions:
  contents: read
concurrency:
  group: studio-g56-offline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Isolated public source checkout, no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pinned Python 3.13, no package installation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify source-only Python syntax
        run: python -m compileall -q musitu_studio/gates56
      - name: Execute pure offline Gate 5/6 security invariants
        run: |
          python -m unittest -v \
            musitu_studio.gates56.test_ledger \
            musitu_studio.gates56.test_blender_bridge
      - name: Record non-provider result boundary
        run: |
          echo 'STUDIO_G56_SOURCE_ONLY_OFFLINE_TESTS=PASS'
          echo 'NO_REAL_MODAL_GEMINI_BLENDER_PAYNOW_R2_SUPABASE_EXECUTION=TRUE'
          echo 'GATE_5=OPEN'
          echo 'GATE_6=OPEN'
