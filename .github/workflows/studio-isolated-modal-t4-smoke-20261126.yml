name: MUSITU Studio isolated real Modal T4 CUDA Blender smoke — owner approved
on:
  push:
    branches:
      - experiments/studio-g56-budgeted-render-20261122
    paths:
      - '.github/workflows/studio-isolated-modal-t4-smoke-20261126.yml'
permissions:
  contents: read
concurrency:
  group: musitu-studio-owner-approved-single-t4-smoke-20261126
  cancel-in-progress: false
jobs:
  deploy-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout isolated source without persistent GitHub credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Validate Studio sources offline
        run: |
          python -m py_compile musitu_studio/modal/gpu_smoke_isolated_20261126.py musitu_studio/modal/studio_modal.py musitu_studio/studio/execute_job.py musitu_studio/studio/job_schema.py
      - name: Install pinned official Modal SDK without secrets
        run: python -m pip install --disable-pip-version-check -q 'modal==1.6.4'
      - name: Deploy only private dedicated T4 smoke app
        working-directory: musitu_studio
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          modal deploy modal/gpu_smoke_isolated_20261126.py --name musitu-studio-gpu-smoke-20261126
          echo 'MUSITU_MODAL_PRIVATE_T4_APP_DEPLOYED=TRUE'
      - name: Invoke one genuine T4 CUDA Blender smoke and validate provider receipt
        working-directory: musitu_studio
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import json,modal,pathlib
          r=modal.Function.from_name('musitu-studio-gpu-smoke-20261126','smoke_gpu').remote()
          safe={k:r.get(k) for k in ('schema','status','compute','renderer',
                                     'gpu_verified','gpu_device_names',
                                     'job_input_sha256','blender_version',
                                     'files','reason')}
          pathlib.Path('modal-t4-smoke-result.json').write_text(
              json.dumps(safe,indent=2,sort_keys=True)+'\n')
          print('MUSITU_MODAL_T4_SMOKE='+json.dumps(safe,sort_keys=True))
          if (r.get('schema')!='musitu.studio.t4.smoke.v1' or
              r.get('status')!='PASS' or r.get('compute')!='T4' or
              r.get('renderer')!='CYCLES_CUDA' or
              r.get('gpu_verified') is not True or
              not r.get('gpu_device_names') or
              set(r.get('files',{}))!={'scene.blend','scene.glb','preview.png'}):
              raise SystemExit('REAL_MODAL_GPU_SMOKE_NOT_VERIFIED')
          for filename,item in r['files'].items():
              if (not isinstance(item.get('bytes'),int) or item['bytes']<1024 or
                  len(item.get('sha256',''))!=64):
                  raise SystemExit('REAL_MODAL_GPU_ARTIFACT_INVALID')
          print('MUSITU_MODAL_REAL_T4_CUDA_BLENDER_SMOKE=PASS')
          PY
      - name: Retain only private sanitized receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-studio-modal-t4-gpu-smoke-evidence-20261126
          path: musitu_studio/modal-t4-smoke-result.json
          retention-days: 14
          if-no-files-found: ignore
