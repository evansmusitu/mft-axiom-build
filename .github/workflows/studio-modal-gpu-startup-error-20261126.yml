name: MUSITU Studio GPU startup error read-only diagnosis
on:
  push:
    branches: [experiments/studio-g56-budgeted-render-20261122]
    paths: ['.github/workflows/studio-modal-gpu-startup-error-20261126.yml']
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -q --disable-pip-version-check 'modal==1.6.4'
      - name: Show redacted startup error lines (no secret or token output)
        run: |
          python - <<'PY'
          import subprocess,re,json
          p=subprocess.run(['modal','app','logs','musitu-studio-gpu-smoke-20261126'],capture_output=True,text=True,timeout=50)
          if p.returncode:
            print('GPU_LOG_FAILURE='+str(p.returncode))
            raise SystemExit(0)
          lines=p.stdout.splitlines()
          markers=('failed to start','exception','error','traceback','failed to import','modulenotfound','importerror','typeerror','valueerror','runtimeerror','attributeerror','image','invalid','gpu','cuda')
          filtered=[]
          for line in lines:
            if any(k in line.lower() for k in markers):
              s=re.sub(r'(?i)(as-|ak-)[a-z0-9_-]+','[redacted]',line)
              s=re.sub(r'https?://\\S+','[redacted-url]',s)
              s=re.sub(r'(?i)(secret|token|password|authorization)[=:]\\S+',r'\\1=[redacted]',s)
              s=re.sub(r'/home/[^ /]+/','/home/[redacted]/',s)
              s=s[:300]
              filtered.append(s)
          for line in filtered[-32:]:
            print('GPU_STARTUP_ERROR_LINE='+json.dumps(line))
          print('GPU_STARTUP_ERROR_TOTAL_LOG_LINES='+str(len(lines)))
          PY
