name: MUSITU Studio isolated GPU read-only execution diagnostic
on:
  push:
    branches: [experiments/studio-g56-budgeted-render-20261122]
    paths: ['.github/workflows/studio-modal-gpu-state-diagnostic-20261126.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -q --disable-pip-version-check 'modal==1.6.4'
      - name: Inspect existing isolated app, function and recent logs, with bounded I/O
        shell: bash
        run: |
          python - <<'PY'
          import subprocess,json
          cmds={
            'app_info':['modal','app','info','musitu-studio-gpu-smoke-20261126','--json'],
            'function_info':['modal','function','info','musitu-studio-gpu-smoke-20261126/smoke_gpu','--json'],
            'logs_help':['modal','app','logs','--help'],
            'app_history':['modal','app','history','--help'],
            'container_help':['modal','container','--help'],
          }
          for name,argv in cmds.items():
            try:
              p=subprocess.run(argv,text=True,capture_output=True,timeout=22,check=False)
              if argv[-1]=='--json':
                try:
                  data=json.loads(p.stdout)
                  # Metadata only; strip any undocumented values.
                  if name=='app_info':
                    summary={'keys':sorted(data.keys()) if isinstance(data,dict) else 'LIST'}
                  else:
                    summary={'keys':sorted(data.keys()) if isinstance(data,dict) else 'LIST'}
                except Exception:summary={'parse':'unavailable'}
              else:
                summary={'lines':p.stdout.splitlines()[:20]}
              print('GPU_DIAGNOSTIC='+json.dumps({'probe':name,'return_code':p.returncode,'result':summary},sort_keys=True))
            except Exception as e:
              print('GPU_DIAGNOSTIC='+json.dumps({'probe':name,'exception':type(e).__name__}))
          PY
