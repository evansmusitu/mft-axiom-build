name: MUSITU Studio — Live Modal Authenticated API Probe
on:
  push:
    branches: [experiments/studio-full-deploy-20261017]
    paths: ['.github/workflows/studio-modal-web-probe.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q 'modal>=1.5,<2'
      - name: Verify Modal Studio public ASGI endpoint refuses unauthorized jobs
        run: |
          python - <<'PY'
          import modal,urllib.request,urllib.error,json,pathlib,time
          uri=modal.Function.from_name("musitu-studio-v02","submit_asgi").get_web_url()
          if not uri or not uri.startswith("https://"):raise SystemExit("MODAL_WEB_URL_NOT_FOUND")
          statuses=[]
          for trial in range(4):
            req=urllib.request.Request(uri.rstrip("/")+"/jobs",method="POST",headers={"Content-Type":"application/json"},data=b"{}")
            try:
              with urllib.request.urlopen(req,timeout=60) as r:code=r.status
            except urllib.error.HTTPError as e:code=e.code
            statuses.append(code)
            print("STUDIO_MODAL_AUTH_PROBE="+str(trial+1)+":"+str(code))
            if code not in (401,503):
              time.sleep(3)
          passed=sum(code==401 for code in statuses)>=2
          out={"schema":"musitu.studio.modal-auth-probe.v1","endpoint":uri,
               "statuses":statuses,"two_authenticated_boundary_denials":passed,
               "cpu_render_separately_verified":True,"gpu_entitlement":"PAYMENT_METHOD_REQUIRED"}
          pathlib.Path("studio-modal-web-probe.json").write_text(json.dumps(out,indent=2,sort_keys=True))
          if not passed:raise SystemExit("STUDIO_MODAL_UNAUTHENTICATED_BOUNDARY_UNSTABLE")
          print("STUDIO_MODAL_ASGI_AUTH_401_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musitu-studio-live-modal-auth-probe
          path: studio-modal-web-probe.json
          retention-days: 14
          if-no-files-found: warn
