name: MUSITU Studio — Page Rule Headroom Read-only
on:
  push:
    branches: [experiments/studio-remote-r2-modal-e2e-20261017]
    paths: ['ops/studio_pagerule_capacity.py','.github/workflows/studio-pagerule-capacity.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect only number of account Page Rules, never modify Axiom
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python ops/studio_pagerule_capacity.py
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-studio-pagerule-availability
          path: studio-pagerules-capacity.json
          retention-days: 7
