name: MUSITU Studio — Read-only Cloudflare Ray Forensics
on:
  push:
    branches: [experiments/studio-remote-r2-modal-e2e-20261017]
    paths:
      - '.github/workflows/studio-security-events-readonly-20261018.yml'
      - 'ops/studio_security_events_readonly.py'
      - 'ops/test_studio_security_events_readonly.py'
permissions:
  contents: read
jobs:
  readonly-ray-correlation:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify privacy and exact-Ray tests
        run: |
          python -m py_compile ops/studio_security_events_readonly.py
          python -m unittest discover -s ops -p 'test_studio_security_events_readonly.py' -v
      - name: Read only Cloudflare Security Events for two known Studio Ray IDs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python ops/studio_security_events_readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musitu-studio-ray-correlation-readonly-20261018
          path: studio-security-events-ray-correlation-readonly.json
          if-no-files-found: warn
          retention-days: 14
