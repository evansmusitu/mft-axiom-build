name: MUSITU Studio — Uploaded GLB vs Production R2 Digest
on:
  push:
    branches: [experiments/studio-remote-r2-modal-e2e-20261017]
    paths:
      - '.github/workflows/studio-uploaded-glb-r2-fingerprint-20261018.yml'
permissions:
  contents: read
jobs:
  same-bytes-provider-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      USER_UPLOADED_GLB_SHA256: 156e442644330c38b910d1d364df86607142ab8d74351fb36394de04821482a6
      USER_UPLOADED_GLB_BYTES: '75068'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Existing read-only R2 metadata and integrity test suite
        run: |
          python -m unittest discover -s ops -p 'test_studio_r2_live_audit.py' -v
      - name: Install existing Wrangler CLI for R2 GET only
        working-directory: musitu_studio/edge
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Independently compare user's digest with remote R2 manifest AND actual GLB bytes
        shell: bash
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN:-$CF_API_TOKEN}"
          python - <<'PY'
          import hashlib,json,os,pathlib,tempfile
          from datetime import datetime,timezone
          from ops.studio_r2_live_audit import remote_get,summarize_state,check_asset,STATE
          output=pathlib.Path('studio-uploaded-glb-r2-match.json')
          expected=os.environ['USER_UPLOADED_GLB_SHA256']
          size=int(os.environ['USER_UPLOADED_GLB_BYTES'])
          r={'schema':'musitu.studio.user-provided-glb-exact-live-r2-match.v1',
             'checked_at_utc':datetime.now(timezone.utc).isoformat(),
             'read_only':True,'credentials_or_glb_bytes_exposed':False,
             'cloudflare_or_modal_mutated':False,
             'user_uploaded_file_bytes_sent_to_github':False,
             'expected_uploaded_bytes':size,
             'remote_control_state_read':False,'manifest_digest_and_size_match':False,
             'remote_content_integrity_match':False,
             'user_glb_byte_identical_to_r2_by_sha256':False,
             'physical_android_device_attested':False,
             'access_session_cryptographically_linked':False,
             'outcome':'PROVIDER_NOT_YET_CHECKED'}
          try:
              with tempfile.TemporaryDirectory(prefix='studio-r2-glb-compare-') as temp:
                  state=pathlib.Path(temp)/'state.json'
                  if not remote_get(STATE,state):
                      r['outcome']='CONTROL_STATE_R2_READ_UNAVAILABLE'
                  else:
                      info,assets=summarize_state(state.read_bytes())
                      r['remote_control_state_read']=True
                      glb=assets.get('scene.glb')
                      if not glb:
                          r['outcome']='NO_COMPLETED_JOB_GLB_MANIFEST'
                      else:
                          r['manifest_digest_and_size_match']=glb['sha256']==expected and glb['bytes']==size
                          file=pathlib.Path(temp)/'scene.glb'
                          if remote_get(glb['key'],file) and file.stat().st_size<=5_000_000:
                              data=file.read_bytes()
                              r['remote_content_integrity_match']=check_asset('scene.glb',data,glb)
                              r['user_glb_byte_identical_to_r2_by_sha256']=(r['manifest_digest_and_size_match']
                                  and r['remote_content_integrity_match']
                                  and len(data)==size and hashlib.sha256(data).hexdigest()==expected)
                          r['outcome']=('EXACT_GLB_REMOTE_R2_MATCH_VERIFIED' if
                              r['user_glb_byte_identical_to_r2_by_sha256'] else
                              'UPLOADED_GLB_R2_FINGERPRINT_DIFFERENT_OR_UNVERIFIABLE')
          except (OSError,ValueError,TypeError,KeyError):
              r['outcome']='R2_STATE_OR_BINARY_VALIDATION_FAILED'
          output.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print('STUDIO_UPLOADED_GLB_R2_VERIFICATION='+json.dumps(r,sort_keys=True))
          assert r['user_glb_byte_identical_to_r2_by_sha256'], 'uploaded GLB production R2 equality not verified'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musitu-studio-uploaded-glb-live-r2-byte-identity-20261018
          path: studio-uploaded-glb-r2-match.json
          if-no-files-found: warn
          retention-days: 30
