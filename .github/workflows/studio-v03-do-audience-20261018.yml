name: MUSITU Studio V0.3 — Configure Verified Access JWT Audience
on:
  workflow_dispatch: {}
permissions: {contents: read}
concurrency:
  group: studio-v03-verified-access-binding
  cancel-in-progress: false
jobs:
  update-only-v03-worker-identity-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install pinned Wrangler without hooks
        working-directory: musitu_studio/edge
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify new Access policy and old protected team domain, generate ephemeral Wrangler config
        working-directory: musitu_studio/edge
        run: |
          python - <<'PY'
          import json,pathlib,os,urllib.request,urllib.error,re
          account='93f395f5121954671f92fffa453d6b61'
          token=os.getenv('CLOUDFLARE_API_TOKEN') or os.getenv('CF_API_TOKEN')
          base='https://api.cloudflare.com/client/v4'
          def get(path):
            req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=20) as response:
              j=json.load(response)
              if not j.get('success'):raise ValueError('PROVIDER_READBACK_DENIED')
              return j.get('result')
          apps=get('/accounts/'+account+'/access/apps?per_page=100')
          matched=[x for x in apps if isinstance(x,dict) and
            x.get('domain')=='studio-v03.mftintelligence.com' and
            x.get('name')=='MUSITU Studio Enterprise V03' and x.get('type')=='self_hosted']
          assert len(matched)==1,'EXACT_NEW_ACCESS_APP_REQUIRED'
          aud=matched[0].get('aud')
          assert isinstance(aud,str) and re.fullmatch(r'[0-9a-fA-F]{64}',aud),'INVALID_APP_AUD'
          policies=get('/accounts/'+account+'/access/apps/'+matched[0]['id']+'/policies')
          assert len([x for x in policies if x.get('decision')=='allow'])==2
          assert all(x.get('decision') in ('allow','deny') for x in policies)
          for policy in (x for x in policies if x.get('decision')=='allow'):
            assert policy.get('include') and all(
              set(y)=={'email'} and isinstance(y['email'].get('email'),str) and
              '@' in y['email']['email'] for y in policy['include'])
          old=get('/accounts/'+account+'/workers/scripts/musitu-studio-v02/settings')
          values={x.get('name'):x.get('text') for x in old.get('bindings') or []
            if isinstance(x,dict) and x.get('type')=='plain_text'}
          team=values.get('STUDIO_ACCESS_TEAM_DOMAIN')
          assert isinstance(team,str) and re.fullmatch(r'https://[a-z0-9-]+\.cloudflareaccess\.com',team)
          domains=get('/accounts/'+account+'/workers/domains')
          assert not any(x.get('hostname')=='studio-v03.mftintelligence.com' for x in domains)
          current=get('/accounts/'+account+'/workers/scripts/musitu-studio-v03-do/settings')
          assert any(x.get('name')=='STUDIO_LEDGER' and x.get('type')=='durable_object_namespace'
            for x in current.get('bindings') or [])
          original=json.loads(pathlib.Path('wrangler.v03.do.jsonc').read_text())
          assert original['workers_dev'] is False and not original.get('routes')
          assert original['vars']['ENABLE_RENDER_DISPATCH']=='false'
          assert original['vars']['GPU_EXECUTION_APPROVED']=='false'
          original['vars']['STUDIO_ACCESS_TEAM_DOMAIN']=team
          original['vars']['STUDIO_ACCESS_POLICY_AUD']=aud
          pathlib.Path('wrangler.v03.do.runtime-ci.jsonc').write_text(json.dumps(original))
          print('STRICT_ACCESS_POLICY_TEAM_AND_JWT_BINDING_PREFLIGHT=PASS')
          PY
      - name: Update ONLY V03 SQLite Worker with real Access application audience (no public route yet)
        working-directory: musitu_studio/edge
        shell: bash
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN:-$CF_API_TOKEN}"
          npx wrangler deploy --config wrangler.v03.do.runtime-ci.jsonc --outdir .studio-v03-audience-build
      - name: Independently verify Worker values match account Access app; no spending
        run: |
          python - <<'PY'
          import os,json,pathlib,re,urllib.request
          account='93f395f5121954671f92fffa453d6b61'
          token=os.getenv('CLOUDFLARE_API_TOKEN') or os.getenv('CF_API_TOKEN')
          root='https://api.cloudflare.com/client/v4/accounts/'+account
          def get(path):
            req=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+token})
            with urllib.request.urlopen(req,timeout=20) as r:
              d=json.load(r)
              assert d.get('success');return d['result']
          apps=get('/access/apps?per_page=100')
          target=[x for x in apps if x.get('domain')=='studio-v03.mftintelligence.com']
          assert len(target)==1
          settings=get('/workers/scripts/musitu-studio-v03-do/settings')
          bs=settings.get('bindings') or []
          vars={x.get('name'):x.get('text') for x in bs if x.get('type')=='plain_text'}
          checks={
            'access_audience_matches_verifiable_staff_app':vars.get('STUDIO_ACCESS_POLICY_AUD')==target[0].get('aud'),
            'team_domain_matches_cloudflareaccess':bool(re.fullmatch(r'https://[a-z0-9-]+\.cloudflareaccess\.com',
              str(vars.get('STUDIO_ACCESS_TEAM_DOMAIN','')))),
            'cpu_dispatch_off':vars.get('ENABLE_RENDER_DISPATCH')=='false',
            'budget_gate_off':vars.get('BUDGET_GUARD_APPROVED')=='false',
            'gpu_gate_off':vars.get('GPU_EXECUTION_APPROVED')=='false',
            'do_sqlite_binding_readable':any(x.get('type')=='durable_object_namespace' and
              x.get('name')=='STUDIO_LEDGER' for x in bs)}
          result={'schema':'musitu.studio.v03.access-jwt-binding.v1','readback_checks':checks,
            'new_public_domain_attached':False,'production_v02_intentionally_mutated':False,
            'any_staff_identifiers_disclosed':False}
          pathlib.Path('studio-v03-access-jwt-binding.json').write_text(json.dumps(result,indent=2)+'\n')
          print('STUDIO_V03_ACCESS_BINDING='+json.dumps(result,sort_keys=True))
          assert all(checks.values())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musitu-studio-v03-verified-access-jwt-audience-binding
          path: studio-v03-access-jwt-binding.json
          retention-days: 14
          if-no-files-found: warn
