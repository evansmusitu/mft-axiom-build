name: MUSITU Studio V0.3 — Host-only SecurityLevel Unblock
on:
  push:
    branches: [experiments/studio-enterprise-v03-sqlite-do-20261018]
    paths: ['.github/workflows/studio-v03-do-securitylevel-only-20261018.yml']
permissions: {contents: read}
concurrency:
  group: musitu-studio-v03-exact-host-securitylevel-only
  cancel-in-progress: false
jobs:
  one-exact-host-only-waf-rule:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Add only exact V03 Security Level skip after verifying Access and independent Axiom protections
        run: |
          python - <<'PY'
          import json,os,pathlib,re,hashlib,urllib.request,urllib.error
          account='93f395f5121954671f92fffa453d6b61'
          host='studio-v03.mftintelligence.com'
          expr='(http.host eq "studio-v03.mftintelligence.com")'
          desc='MUSITU Studio V03 dedicated staff Access: skip only zone Security Level'
          base='https://api.cloudflare.com/client/v4'
          token=os.getenv('CLOUDFLARE_API_TOKEN') or os.getenv('CF_API_TOKEN')
          receipt={'schema':'musitu.studio.v03.exact-host-securitylevel-skip.v1',
            'target_hostname':host,'scope_expression':expr,
            'read_only_except_one_new_exact_hostname_rule':True,
            'access_app_email_only_verified':False,'signed_worker_aud_verified':False,
            'existing_waf_rules_preserved':False,'rule_added':False,
            'action_parameters':{'products':['securityLevel']},
            'global_security_level_changed':False,'browser_integrity_check_changed':False,
            'existing_studio_v02_rule_changed':False,'axiom_rules_changed':False,
            'post_http_status':None,'outcome':'NO_CHANGE'}
          def call(method,path,data=None):
            h={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
            req=urllib.request.Request(base+path,method=method,headers=h,
              data=json.dumps(data).encode() if data is not None else None)
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                j=json.load(r);return r.status,j.get('result') if j.get('success') else None
            except urllib.error.HTTPError as e:return e.code,None
            except (OSError,ValueError):return 0,None
          def check_email(p):
            return p.get('decision')=='allow' and isinstance(p.get('include'),list) and bool(p['include']) and all(
              isinstance(x,dict) and set(x)=={'email'} and isinstance(x['email'].get('email'),str)
              and '@' in x['email']['email'] for x in p['include'])
          try:
            z,zones=call('GET','/zones?name=mftintelligence.com&status=active')
            found=[x for x in zones or [] if x.get('name')=='mftintelligence.com'
              and (x.get('account') or {}).get('id')==account]
            assert z==200 and len(found)==1,'ZONE_UNVERIFIED'
            zid=found[0]['id']
            st,apps=call('GET','/accounts/'+account+'/access/apps?per_page=100')
            target=[a for a in apps or [] if a.get('domain')==host
              and a.get('name')=='MUSITU Studio Enterprise V03' and a.get('type')=='self_hosted']
            assert st==200 and len(target)==1,'DEDICATED_ACCESS_APP_MISSING'
            st,pol=call('GET','/accounts/'+account+'/access/apps/'+target[0]['id']+'/policies')
            receipt['access_app_email_only_verified']=(st==200 and len(pol or [])==2
              and all(check_email(p) for p in pol))
            assert receipt['access_app_email_only_verified'],'STAFF_POLICY_UNSAFE'
            st,settings=call('GET','/accounts/'+account+'/workers/scripts/musitu-studio-v03-do/settings')
            assert st==200 and isinstance(settings,dict)
            bs=settings.get('bindings') or []
            v={b.get('name'):b.get('text') for b in bs if b.get('type')=='plain_text'}
            receipt['signed_worker_aud_verified']=(v.get('STUDIO_ACCESS_POLICY_AUD')==target[0].get('aud')
              and v.get('ENABLE_RENDER_DISPATCH')=='false' and v.get('GPU_EXECUTION_APPROVED')=='false')
            assert receipt['signed_worker_aud_verified'],'SIGNED_WORKER_GATE_UNSAFE'
            st,domains=call('GET','/accounts/'+account+'/workers/domains')
            assert st==200 and len([d for d in domains or [] if d.get('hostname')==host
              and d.get('service')=='musitu-studio-v03-do'])==1,'DEDICATED_HOST_MISSING'
            st,zone_rules=call('GET','/zones/'+zid+'/rulesets/phases/http_request_firewall_custom/entrypoint')
            assert st==200 and isinstance(zone_rules,dict),'CUSTOM_WAF_NOT_READABLE'
            original=zone_rules.get('rules') or []
            assert len(original)<5,'FREE_CUSTOM_RULE_CAPACITY_EXHAUSTED'
            assert all(r.get('expression')!=expr for r in original),'HOST_ALREADY_HAS_CUSTOM_RULE'
            assert any('studio.mftintelligence.com' in r.get('expression','') and
              'studio-v03.mftintelligence.com' not in r.get('expression','') for r in original), 'V02_SCOPED_PROTECTION_MISSING'
            def sig(r):
              return hashlib.sha256(json.dumps({k:r.get(k) for k in
                ('id','action','action_parameters','expression','enabled','logging','description')},
                sort_keys=True).encode()).hexdigest()
            before={r['id']:sig(r) for r in original}
            proposed={'action':'skip','action_parameters':{'products':['securityLevel']},
              'expression':expr,'description':desc,'enabled':True,'logging':{'enabled':True}}
            status,_=call('POST','/zones/'+zid+'/rulesets/'+zone_rules['id']+'/rules',proposed)
            receipt['post_http_status']=status
            assert status in (200,201),'PROVIDER_REJECTED_SINGLE_SCOPED_RULE'
            st,after=call('GET','/zones/'+zid+'/rulesets/phases/http_request_firewall_custom/entrypoint')
            assert st==200 and isinstance(after,dict)
            new=after.get('rules') or []
            receipt['existing_waf_rules_preserved']=(len(new)==len(original)+1 and all(
              r['id'] in before and before[r['id']]==sig(r) for r in original))
            hits=[r for r in new if r.get('expression')==expr and r.get('action')=='skip'
              and r.get('action_parameters')=={'products':['securityLevel']} and r.get('enabled',True)]
            receipt['rule_added']=len(hits)==1
            receipt['outcome']='EXACT_STUDIO_V03_SECURITYLEVEL_SKIP_VERIFIED' if (
              receipt['existing_waf_rules_preserved'] and receipt['rule_added']) else 'PROVIDER_WRITE_READBACK_MISMATCH'
          except (AssertionError,KeyError,TypeError) as e:
            receipt['outcome']=str(e)
          pathlib.Path('studio-v03-host-only-waf.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('STUDIO_V03_SCOPED_SECURITY_RULE='+json.dumps(receipt,sort_keys=True))
          assert receipt['outcome']=='EXACT_STUDIO_V03_SECURITYLEVEL_SKIP_VERIFIED'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musitu-studio-v03-host-only-securitylevel-exception
          path: studio-v03-host-only-waf.json
          retention-days: 14
