name: MUSITU Studio V0.3 — Offline Security + 3D Qualification
on:
  push:
    branches:
      - experiments/studio-enterprise-v03-sqlite-do-20261018
    paths:
      - 'musitu_studio/neon/**'
      - 'creative/god_mode_2099/**'
      - 'musitu_studio/edge/src/**'
      - 'ops/studio_v03_*.py'
      - 'ops/tests/test_god_mode_2099_*.py'
      - 'musitu_studio/edge/public_v03/**'
      - 'musitu_studio/edge/tests/v03_glb_*.test.mjs'
      - 'musitu_studio/edge/tests/v03_scene_preview.test.mjs'
      - 'ops/tests/test_studio_*.py'
      - '.github/workflows/studio-v03-offline-security-qualification-20261024.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: studio-v03-offline-security-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Verified upstream v4.2.2 commit; do not resolve mutable major tags.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Pure Node Neon security and frozen import tests — no provider access
        run: node --test musitu_studio/neon/tests/*.test.mjs
      - name: Pure GLB / high angular speed / editor preview tests
        run: node --test musitu_studio/edge/tests/v03_glb_*.test.mjs musitu_studio/edge/tests/v03_scene_preview.test.mjs
      - name: Pure offline Edge identity-independent and client submission tests
        run: >-
          node --test
          musitu_studio/edge/tests/session.test.mjs
          musitu_studio/edge/tests/validation.test.mjs
          musitu_studio/edge/tests/v03_do_adapter.test.mjs
          musitu_studio/edge/tests/v03_scene_import_submission.test.mjs
          musitu_studio/edge/tests/v03_pitr_cron_diagnostic.test.mjs
      - name: Python Studio release recovery and offline security tests
        run: python -m unittest discover -s ops/tests -p 'test_studio_*.py' -v
      - name: Offline God Mode 2099 portable launcher mocks — no Blender GPU
        run: python -m unittest discover -s ops/tests -p 'test_god_mode_2099_*.py' -v
      - name: Verify no provider env or deployment script was required
        run: |
          python - <<'PY'
          import os
          assert os.environ['GITHUB_REF_NAME']=='experiments/studio-enterprise-v03-sqlite-do-20261018'
          print('OFFLINE_ONLY_NO_PROVIDER_WRITES_OR_BILLED_RENDERING=PASS')
          PY
