name: MUSITU Studio V0.3 — Owner Verified Guarded Activation
on:
  push:
    branches:
      - experiments/studio-enterprise-v03-sqlite-do-20261018
    paths:
      - .github/workflows/studio-v03-owner-fingerprint-guarded-activation.yml
permissions: {contents: read}
concurrency:
  group: musitu-studio-v03-manual-safe-release
  cancel-in-progress: false
jobs:
  maintain-only-dedicated-v03-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      # Pseudonymous cryptographic owner subject; never store or log raw staff ID.
      OWNER_SUBJECT_SHA256: e97d2e571621add32240ce0c4deb42417293b9f7c757f419f9b17176c24be375
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test all Studio V03 and legacy pilot behavior before deploy
        working-directory: musitu_studio/edge
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --test tests/v03_do_adapter.test.mjs tests/v03_enterprise.test.mjs tests/r2_control.test.mjs tests/session.test.mjs tests/validation.test.mjs
          node --check src/v03_do_entry.mjs
      - name: Rebuild only V03 runtime config from provider-verified Access and existing DO
        working-directory: musitu_studio/edge
        run: |
          python - <<'PY'
          import os,json,pathlib,re,hashlib,datetime,urllib.parse,urllib.request
          account='93f395f5121954671f92fffa453d6b61'
          token=os.getenv('CLOUDFLARE_API_TOKEN') or os.getenv('CF_API_TOKEN')
          root='https://api.cloudflare.com/client/v4'
          def get(path):
            req=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+token},method='GET')
            with urllib.request.urlopen(req,timeout=20) as r:
              data=json.load(r);assert data.get('success');return data['result']
          matches=[z for z in get('/zones?name=mftintelligence.com&status=active') if
            z.get('name')=='mftintelligence.com' and
            (z.get('account') or {}).get('id')==account]
          assert len(matches)==1
          apps=get('/accounts/'+account+'/access/apps?per_page=100')
          selected=[a for a in apps if a.get('name')=='MUSITU Studio Enterprise V03' and
            a.get('domain')=='studio-v03.mftintelligence.com' and a.get('type')=='self_hosted']
          assert len(selected)==1
          app=selected[0]
          assert isinstance(app.get('aud'),str) and re.fullmatch(r'[a-f0-9]{64}',app['aud'],re.I)
          policies=get('/accounts/'+account+'/access/apps/'+app['id']+'/policies')
          assert len(policies)==2
          assert all(x.get('decision')=='allow' and x.get('include') and all(
            set(k)=={'email'} and isinstance(k['email'].get('email'),str)
            and '@' in k['email']['email'] for k in x['include']) for x in policies)
          # Read-only identity qualification. Access users and login logs supply
          # independent provider evidence; no personal data is logged.
          ownerhash=os.environ['OWNER_SUBJECT_SHA256']
          assert re.fullmatch('[a-f0-9]{64}',ownerhash)
          people=[]
          for page in range(1,7):
            user_page=get('/accounts/'+account+'/access/users?per_page=100&page='+str(page))
            assert isinstance(user_page,list),'ACCESS_USERS_UNAVAILABLE'
            people.extend(user_page)
            if len(user_page)<100:break
          matched=[u for u in people if isinstance(u.get('id'),str) and
            hashlib.sha256(u['id'].lower().encode()).hexdigest()==ownerhash]
          assert len(matched)==1,'SIGNED_OWNER_SUBJECT_NOT_VERIFIED'
          addr=str(matched[0].get('email') or '').lower()
          allow_emails=[item['email']['email'].lower() for pol in policies for item in pol['include']]
          assert len(allow_emails)==2 and len(set(allow_emails))==2
          assert addr in allow_emails,'SIGNED_OWNER_NOT_ON_APP_ALLOWLIST'
          since=datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(hours=48)
          args=urllib.parse.urlencode({'limit':100,'direction':'desc',
            'since':since.strftime('%Y-%m-%dT%H:%M:%SZ')})
          logs=get('/accounts/'+account+'/access/logs/access_requests?'+args)
          assert isinstance(logs,list)
          permitted=[l for l in logs if l.get('allowed') is True and
            str(l.get('app_domain','')).rstrip('/')=='studio-v03.mftintelligence.com'
            and str(l.get('user_email','')).lower()==addr]
          assert permitted,'RECENT_OWNER_SIGNIN_NOT_VERIFIED'
          print('SIGNED_OWNER_ACCESS_ID_AND_REAL_LOGIN_QUALIFIED=PASS')
          domains=get('/accounts/'+account+'/workers/domains')
          assert len([x for x in domains if x.get('hostname')=='studio-v03.mftintelligence.com'
            and x.get('service')=='musitu-studio-v03-do'])==1
          assert len([x for x in domains if x.get('hostname')=='studio.mftintelligence.com'
            and x.get('service')=='musitu-studio-v02'])==1
          original=get('/accounts/'+account+'/workers/scripts/musitu-studio-v02/settings')
          v={x.get('name'):x.get('text') for x in original.get('bindings') or [] if x.get('type')=='plain_text'}
          team=v.get('STUDIO_ACCESS_TEAM_DOMAIN')
          assert isinstance(team,str) and re.fullmatch(r'https://[a-z0-9-]+\.cloudflareaccess\.com',team)
          c=json.loads(pathlib.Path('wrangler.v03.do.jsonc').read_text())
          assert c['workers_dev'] is False and not c.get('routes') and 'd1_databases' not in c
          assert c['name']=='musitu-studio-v03-do'
          assert c['vars']['ENABLE_RENDER_DISPATCH']=='false' and c['vars']['BUDGET_GUARD_APPROVED']=='false'
          assert c['vars']['GPU_EXECUTION_APPROVED']=='false'
          assert c['vars'].get('STUDIO_V03_SINGLE_ADMIN_APPROVAL')=='false', 'Checked-in source must fail closed'
          assert c['vars']['STUDIO_V03_GLOBAL_ADMINS']=='', 'No broad global admin promotion'
          c['vars']['STUDIO_V03_SINGLE_ADMIN_APPROVAL']='true'
          c['vars']['STUDIO_V03_SINGLE_ADMIN_SUBJECT_SHA256']=ownerhash
          c['vars']['STUDIO_ACCESS_TEAM_DOMAIN']=team
          c['vars']['STUDIO_ACCESS_POLICY_AUD']=app['aud']
          pathlib.Path('wrangler.v03.do.safe-release-ci.jsonc').write_text(json.dumps(c))
          print('OWNER_BOUND_GUARDED_REDEPLOY_VERIFIED_V03_ONLY=PASS')
          PY
      - name: Deploy ONLY V03 Worker with unchanged strict staff Access identity
        working-directory: musitu_studio/edge
        shell: bash
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN:-$CF_API_TOKEN}"
          npx wrangler deploy --config wrangler.v03.do.safe-release-ci.jsonc --outdir .studio-v03-safe-release
      - name: Post-release independent live Access gate
        run: |
          python - <<'PY'
          import json,pathlib,urllib.request,urllib.error
          class NoFollow(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*args,**kwargs):return None
          op=urllib.request.build_opener(NoFollow)
          receipt={'schema':'musitu.studio.v03.owner-qualified-release.v1',
            'verified_signed_owner_id':True,'independent_recent_staff_login':True,
            'isolated_worker_only':True,'cpu_dispatch_enabled':False,'gpu_execution_enabled':False,
            'original_v02_intentionally_modified':False,'access_redirect_healthy':False}
          req=urllib.request.Request('https://studio-v03.mftintelligence.com/api/projects',
            headers={'User-Agent':'MUSITU-V03-PostRelease-Readback/1'})
          try:
            with op.open(req,timeout=20) as resp:code=resp.status;headers=resp.headers
          except urllib.error.HTTPError as e:code=e.code;headers=e.headers
          location=headers.get('location','')
          receipt['access_redirect_healthy']=(code==302 and
            ('/cdn-cgi/access/login' in location or '.cloudflareaccess.com/' in location))
          import os
          token=os.getenv('CLOUDFLARE_API_TOKEN') or os.getenv('CF_API_TOKEN')
          account='93f395f5121954671f92fffa453d6b61'
          api=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+account+
            '/workers/scripts/musitu-studio-v03-do/settings',headers={'Authorization':'Bearer '+token})
          with urllib.request.urlopen(api,timeout=25) as resp:
            envelope=json.load(resp);assert envelope.get('success')
          b=envelope['result'].get('bindings') or []
          live={x.get('name'):x.get('text') for x in b if x.get('type')=='plain_text'}
          assert live.get('STUDIO_V03_SINGLE_ADMIN_APPROVAL')=='true'
          assert live.get('STUDIO_V03_SINGLE_ADMIN_SUBJECT_SHA256')==os.environ['OWNER_SUBJECT_SHA256']
          assert live.get('STUDIO_V03_GLOBAL_ADMINS')==''
          assert all(live.get(v)=='false' for v in ('ENABLE_RENDER_DISPATCH',
            'BUDGET_GUARD_APPROVED','GPU_EXECUTION_APPROVED'))
          receipt['owner_binding_provider_readback']=True
          receipt['cpu_gpu_off_provider_readback']=True

          pathlib.Path('studio-v03-guarded-redeploy.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('STUDIO_V03_OWNER_BOUND_SAFE_RELEASE='+json.dumps(receipt,sort_keys=True))
          assert receipt['access_redirect_healthy']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musitu-studio-v03-owner-bound-activation
          path: studio-v03-guarded-redeploy.json
          retention-days: 14
          if-no-files-found: warn
