name: MUSITU Studio V0.3 — Recovery Evidence Channel Readonly
on:
  workflow_dispatch: {}
permissions: {contents: read}
concurrency:
  group: musitu-studio-v03-recovery-evidence-probe
  cancel-in-progress: false
jobs:
  provider-capability-no-writes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Read account-scoped evidence-channel metadata without exposing data
        run: python ops/studio_v03_pitr_evidence_channel_readonly_20261021.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musitu-studio-v03-pitr-evidence-channel-readonly-20261021
          path: studio-v03-pitr-safe-evidence-channels-20261021.json
          retention-days: 14
          if-no-files-found: warn
