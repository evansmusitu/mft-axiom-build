name: MUSITU Studio V0.3 — Surgical Temporary PITR V2 Cleanup
on:
  push:
    branches: [experiments/studio-enterprise-v03-sqlite-do-20261018]
    paths: [.github/workflows/studio-v03-pitr-v2-exact-cleanup-20261021.yml]
permissions: {contents: read}
concurrency:
  group: musitu-studio-v03-one-shot-private-pitr-v2
  cancel-in-progress: false
jobs:
  remove-only-verified-disposable-resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Provider-verified surgical cleanup, never touch production workers or customer assets
        run: |
          python -m py_compile ops/studio_v03_pitr_v2_exact_cleanup_20261021.py
          python ops/studio_v03_pitr_v2_exact_cleanup_20261021.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musitu-studio-v03-pitr-v2-cleanup-provider-proof
          path: studio-v03-disposable-pitr-v2-cleanup-20261021.json
          retention-days: 14
          if-no-files-found: warn
