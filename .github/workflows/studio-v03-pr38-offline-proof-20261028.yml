name: MUSITU Studio V0.3 — Isolated PR38 Offline CI Proof
on:
  push:
    branches:
      - experiments/studio-v03-offline-test-reliability-20261027
    paths:
      - 'musitu_studio/neon/**'
      - 'creative/god_mode_2099/**'
      - 'musitu_studio/edge/src/**'
      - 'ops/studio_v03_*.py'
      - 'ops/verified_edge_lock_parts/**'
      - 'ops/tests/test_god_mode_2099_*.py'
      - 'musitu_studio/edge/public_v03/**'
      - 'musitu_studio/edge/tests/v03_glb_*.test.mjs'
      - 'musitu_studio/edge/tests/v03_scene_preview.test.mjs'
      - 'ops/tests/test_studio_*.py'
      - 'ops/studio_v03_bounded_2099_qualification.py'
      - '.github/workflows/studio-v03-pr38-offline-proof-20261028.yml'
permissions:
  contents: read
concurrency:
  group: studio-v03-pr38-offline-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      # Verified upstream v4.2.2 commit; do not resolve mutable major tags.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Pure Node Neon security and frozen import tests — no provider access
        run: node --test musitu_studio/neon/tests/*.test.mjs
      - name: Pure GLB / high angular speed / editor preview tests
        run: node --test musitu_studio/edge/tests/v03_glb_*.test.mjs musitu_studio/edge/tests/v03_scene_preview.test.mjs
      - name: Pure offline Edge identity-independent and client submission tests
        run: >-
          node --test
          musitu_studio/edge/tests/session.test.mjs
          musitu_studio/edge/tests/validation.test.mjs
          musitu_studio/edge/tests/v03_do_adapter.test.mjs
          musitu_studio/edge/tests/v03_scene_import_submission.test.mjs
          musitu_studio/edge/tests/v03_pitr_cron_diagnostic.test.mjs
      - name: Python Studio release recovery and offline security tests
        run: python -m unittest discover -s ops/tests -p 'test_studio_*.py' -v
      - name: Bounded offline God Mode 2099 mocked qualification — no Blender GPU
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from ops.studio_v03_bounded_2099_qualification import qualify
          result = qualify(Path.cwd(), group_size=3, timeout_seconds=150)
          print(json.dumps(result, sort_keys=True))
          PYCODE
      - name: Confirm isolated branch and no provider deployment invoked
        run: |
          python - <<'PY'
          import os
          assert os.environ['GITHUB_REF_NAME']=='experiments/studio-v03-offline-test-reliability-20261027'
          print('OFFLINE_ONLY_NO_PROVIDER_WRITES_OR_BILLED_RENDERING=PASS')
          PY
