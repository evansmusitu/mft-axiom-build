name: MUSITU Studio V0.3 — One-shot Disposable Hosted PITR V2
on:
  push:
    branches: [experiments/studio-enterprise-v03-sqlite-do-20261018]
    paths: [.github/workflows/studio-v03-private-kv-pitr-v2-disposable-20261021.yml]
permissions: {contents: read}
concurrency:
  group: musitu-studio-v03-one-shot-private-pitr-v2
  cancel-in-progress: false
jobs:
  hosted-disposable-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      CLOUDFLARE_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reject invalid source and qualify one-shot diagnostics before provider mutation
        working-directory: musitu_studio/edge
        run: |
          node --check ../../ops/studio_v03_pitr_cron_kv_isolated_20261021.mjs
          python -m py_compile ../../ops/studio_v03_pitr_cron_kv_runner_v2_20261021.py
          node --test tests/v03_pitr_cron_diagnostic.test.mjs
      - name: Verify existing strict Access, preserved V0.2, CPU/GPU disabled (read-only)
        shell: bash
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN:-${CF_API_TOKEN:-}}"
          python ops/studio_snapshot_provider_readonly_20261020.py
      - name: Prove hosted PITR using only fresh private disposable Worker and KV
        working-directory: musitu_studio/edge
        shell: bash
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN:-${CF_API_TOKEN:-}}"
          npm install --ignore-scripts --no-audit --no-fund >/dev/null
          python ../../ops/studio_v03_pitr_cron_kv_runner_v2_20261021.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musitu-studio-v03-hosted-pitr-v2-one-shot-evidence
          path: studio-v03-private-kv-pitr-v2-proof-20261021.json
          retention-days: 30
          if-no-files-found: warn
