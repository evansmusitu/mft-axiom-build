name: MUSITU Studio V03 — Worker Domain Access Block Root Cause
on:
  push:
    branches: [experiments/studio-enterprise-v03-sqlite-do-20261018]
    paths: ['.github/workflows/studio-v03-workersdev-access-readonly-20261018.yml']
permissions: {contents: read}
jobs:
  examine-exact-account-policy-without-identities:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Bounded provider read of Access app types, Worker subdomain and retired test worker
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,pathlib
          account='93f395f5121954671f92fffa453d6b61'
          token=os.environ.get('CLOUDFLARE_API_TOKEN') or os.environ.get('CF_API_TOKEN')
          base='https://api.cloudflare.com/client/v4/accounts/'+account
          receipt={'schema':'musitu.studio.v03.workersdev-access-readonly-diagnosis.v1',
            'read_only':True,'provider_configuration_mutated':False,
            'staff_identity_exposed':False,'access_policy_email_values_logged':False,
            'all_workers_access_apps_count':None,
            'worker_type_access_apps_count':None,
            'workers_dev_self_hosted_apps_count':None,
            'retired_temporary_worker_absent':None,
            'workers_dev_subdomain_configured':None,
            'workers_dev_default_access_enforced':None,'outcome':'NOT_CHECKED'}
          def get(path):
            req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+token},method='GET')
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                data=json.load(r);return r.status,data.get('result') if data.get('success') else None
            except urllib.error.HTTPError as e:return e.code,None
            except (OSError,ValueError):return 0,None
          if token:
            status,apps=get('/access/apps?per_page=100')
            if status==200 and isinstance(apps,list):
              receipt['all_workers_access_apps_count']=sum(a.get('type')=='all_workers' for a in apps if isinstance(a,dict))
              receipt['worker_type_access_apps_count']=sum(a.get('type')=='worker' for a in apps if isinstance(a,dict))
              receipt['workers_dev_self_hosted_apps_count']=sum(a.get('type')=='self_hosted'
                and isinstance(a.get('domain'),str) and a['domain'].endswith('.workers.dev')
                for a in apps if isinstance(a,dict))
              receipt['workers_dev_default_access_enforced']=receipt['all_workers_access_apps_count']>0
            code,sub=get('/workers/subdomain')
            receipt['workers_dev_subdomain_configured']=code==200 and isinstance(sub,dict) and bool(sub.get('subdomain'))
            code,_=get('/workers/scripts/musitu-studio-v03-pitr-proof-20261018')
            receipt['retired_temporary_worker_absent']=code==404
            receipt['outcome']='READ_ONLY_POLICY_INVENTORY_RECORDED'
          pathlib.Path('studio-v03-workersdev-access-inventory.json').write_text(
            json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('STUDIO_V03_WORKERSDEV_ACCESS_CAUSE='+json.dumps(receipt,sort_keys=True))
          assert receipt['retired_temporary_worker_absent'] is True
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musitu-studio-v03-workersdev-security-inventory-readonly
          path: studio-v03-workersdev-access-inventory.json
          retention-days: 14
