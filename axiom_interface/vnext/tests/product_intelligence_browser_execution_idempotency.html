<!doctype html>
<meta charset="utf-8">
<title>MUSITU Axiom Phase 2 browser execution idempotency qualification</title>
<pre id="result">MUSITU_AXIOM_PHASE2_BROWSER_IDEMPOTENCY_RUNNING</pre>
<script type="module">
import {GovernedExecutionStore} from '../execution_store.js';
import {sha256} from '../execution_security.js';

const out=document.querySelector('#result');
const DB='musitu-axiom-execution-v1';
const phase=new URL(location.href).searchParams.get('phase')||'seed';
const invariant=(condition,message)=>{if(!condition)throw new Error(message);};
const deleteDb=()=>new Promise((resolve,reject)=>{
  const request=indexedDB.deleteDatabase(DB);
  request.onsuccess=()=>resolve();
  request.onerror=()=>reject(request.error);
  request.onblocked=()=>reject(new Error('indexedDB deletion blocked'));
});
const authorityFor=projectId=>({
  project_id:projectId,
  actor_id:'agent_operator_browser_1',
  agent_id:'agent_executor_browser_1',
  workload_identity_id:'workload_executor_browser_1',
  agent_status:'ACTIVE',
  kill_switch_engaged:false,
  revoked:false,
  requester_type:'AGENT',
  grant:{
    tool_scopes:['artifact.write'],
    data_scopes:[projectId],
    network_policy:'DENY_ALL_EXTERNAL_NETWORK',
    secrets_policy:'OPAQUE_SHORT_LIVED_OPERATION_SCOPED_NO_PLAINTEXT',
    budget:{max_compute_units:20},
  },
  usage:{compute_units:0},
  incident_posture:'NORMAL',
  jurisdiction:'LOCAL_BROWSER',
});
const terminalReceipts=async(store,projectId,requestSha)=>(await store._all('receipts',projectId)).filter(row=>row.request_sha256===requestSha&&['COMPLETED','FAILED'].includes(row.status));
const completedEvents=async(store,projectId,requestSha)=>(await store._all('events',projectId)).filter(row=>row.kind==='execution.completed'&&row.payload?.request_sha256===requestSha);

try{
  if(phase==='seed'){
    localStorage.clear();
    await deleteDb();
    const projectId='project_browser_restart_12345678';
    const authority=authorityFor(projectId);
    const store=await GovernedExecutionStore.open();
    const sandbox=await store.createSandbox(authority,{label:'Browser restart seed'});
    const proposed=await store.propose(sandbox.sandbox_id,authority,{
      operation:'file.write',
      target:'restart-proof.txt',
      payload:{content:'one governed side effect'},
      compute_units:1,
      instruction_provenance:'GOVERNED_PLAN',
      requested_at:'2026-10-06T13:45:00.000Z',
    });
    invariant(proposed.decision.status==='AUTHORIZED','seed request must be authorized');
    const receipt=await store.execute(proposed.request.request_sha256,authority);
    invariant(receipt.status==='COMPLETED','seed execution must complete');
    invariant((await terminalReceipts(store,projectId,proposed.request.request_sha256)).length===1,'seed must persist one terminal receipt');
    invariant((await completedEvents(store,projectId,proposed.request.request_sha256)).length===1,'seed must persist one completion event');
    localStorage.setItem('axiom_restart_state',JSON.stringify({projectId,authority,requestSha:proposed.request.request_sha256,receiptId:receipt.receipt_id,receiptSha:receipt.receipt_sha256}));
    store.db.close();
    out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_RESTART_SEED_PASS';
  }else if(phase==='replay'){
    const saved=JSON.parse(localStorage.getItem('axiom_restart_state')||'null');
    invariant(saved,'restart seed state missing');
    const store=await GovernedExecutionStore.open();
    const replay=await store.execute(saved.requestSha,saved.authority);
    invariant(replay.receipt_id===saved.receiptId,'restart replay changed terminal receipt id');
    invariant(replay.receipt_sha256===saved.receiptSha,'restart replay changed terminal receipt hash');
    invariant((await terminalReceipts(store,saved.projectId,saved.requestSha)).length===1,'restart replay created duplicate terminal receipt');
    invariant((await completedEvents(store,saved.projectId,saved.requestSha)).length===1,'restart replay repeated completion event');
    store.db.close();
    out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_RESTART_REPLAY_PASS';
  }else if(phase==='concurrent'){
    const projectId='project_browser_concurrent_12345678';
    const authority=authorityFor(projectId);
    const storeA=await GovernedExecutionStore.open();
    const sandbox=await storeA.createSandbox(authority,{label:'Browser concurrent qualification'});
    const proposed=await storeA.propose(sandbox.sandbox_id,authority,{
      operation:'worktree.create',
      target:'concurrent-worktree',
      compute_units:1,
      instruction_provenance:'GOVERNED_PLAN',
      requested_at:'2026-10-06T13:46:00.000Z',
    });
    invariant(proposed.decision.status==='AUTHORIZED','concurrent request must be authorized');
    const storeB=await GovernedExecutionStore.open();
    const settled=await Promise.allSettled([
      storeA.execute(proposed.request.request_sha256,authority),
      storeB.execute(proposed.request.request_sha256,authority),
    ]);
    const terminal=await terminalReceipts(storeA,projectId,proposed.request.request_sha256);
    const events=await completedEvents(storeA,projectId,proposed.request.request_sha256);
    invariant(terminal.length===1,`cross-instance concurrency persisted ${terminal.length} terminal receipts`);
    invariant(events.length===1,`cross-instance concurrency persisted ${events.length} completion events`);
    const canonical=terminal[0];
    for(const item of settled){
      if(item.status==='fulfilled') invariant(item.value.receipt_sha256===canonical.receipt_sha256,'fulfilled concurrent caller observed a noncanonical terminal receipt');
      else invariant(item.reason?.name==='InvalidStateError'||/in.?flight|concurrent/i.test(String(item.reason?.message||item.reason)),'concurrent loser did not fail closed');
    }
    invariant(settled.some(item=>item.status==='fulfilled'),'no concurrent execution winner');
    storeA.db.close();storeB.db.close();
    out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_CROSS_INSTANCE_ATOMIC_PASS';
  }else if(phase==='tab-seed'){
    const projectId='project_browser_tabs_12345678';
    const authority=authorityFor(projectId);
    const store=await GovernedExecutionStore.open();
    const sandbox=await store.createSandbox(authority,{label:'Separate-tab concurrency seed'});
    const proposed=await store.propose(sandbox.sandbox_id,authority,{
      operation:'worktree.create',
      target:'separate-tab-worktree',
      compute_units:1,
      instruction_provenance:'GOVERNED_PLAN',
      requested_at:'2026-10-06T19:00:00.000Z',
    });
    invariant(proposed.decision.status==='AUTHORIZED','separate-tab seed request must be authorized');
    localStorage.setItem('axiom_tab_race_state',JSON.stringify({projectId,authority,requestSha:proposed.request.request_sha256}));
    store.db.close();
    out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_SEPARATE_TAB_SEED_PASS';
  }else if(phase==='tab-race'){
    const saved=JSON.parse(localStorage.getItem('axiom_tab_race_state')||'null');
    invariant(saved,'separate-tab race seed missing');
    const store=await GovernedExecutionStore.open();
    window.__axiomStart=async()=>{
      try{
        const receipt=await store.execute(saved.requestSha,saved.authority);
        out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_TAB_CALLER_FULFILLED:'+receipt.receipt_sha256;
      }catch(error){
        if(error?.name==='InvalidStateError'||/in.?flight|concurrent/i.test(String(error?.message||error)))out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_TAB_CALLER_FAIL_CLOSED';
        else out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_IDEMPOTENCY_FAIL:'+error.name+':'+error.message;
      }
    };
    out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_TAB_CALLER_READY';
  }else if(phase==='tab-inspect'){
    const saved=JSON.parse(localStorage.getItem('axiom_tab_race_state')||'null');
    invariant(saved,'separate-tab inspect seed missing');
    const store=await GovernedExecutionStore.open();
    const terminal=await terminalReceipts(store,saved.projectId,saved.requestSha);
    const events=await completedEvents(store,saved.projectId,saved.requestSha);
    invariant(terminal.length===1,`separate-tab concurrency persisted ${terminal.length} terminal receipts`);
    invariant(events.length===1,`separate-tab concurrency persisted ${events.length} completion events`);
    store.db.close();
    out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_SEPARATE_TAB_ATOMIC_PASS';
  }else if(phase==='stale-seed'){
    const projectId='project_browser_stale_claim_12345678';
    const authority=authorityFor(projectId);
    const store=await GovernedExecutionStore.open();
    const sandbox=await store.createSandbox(authority,{label:'Stale claim recovery seed'});
    const proposed=await store.propose(sandbox.sandbox_id,authority,{
      operation:'file.write',
      target:'stale-recovery.txt',
      payload:{content:'recover after stale claim'},
      compute_units:1,
      instruction_provenance:'GOVERNED_PLAN',
      requested_at:'2026-10-06T19:01:00.000Z',
    });
    invariant(proposed.decision.status==='AUTHORIZED','stale-claim seed request must be authorized');
    const claimBody={
      schema:'musitu.axiom.execution-claim.browser.v1',
      request_sha256:proposed.request.request_sha256,
      project_id:projectId,
      workload_identity_id:authority.workload_identity_id,
      authority_sha256:proposed.request.authority_sha256,
      owner_id:'execution-claim-owner_crashed_1',
      acquired_at:'2026-10-06T18:00:00.000Z',
      expires_at:'2026-10-06T18:00:01.000Z',
    };
    await store._put('execution_claims',{...claimBody,claim_sha256:await sha256(claimBody)});
    localStorage.setItem('axiom_stale_claim_state',JSON.stringify({projectId,authority,requestSha:proposed.request.request_sha256}));
    store.db.close();
    out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_STALE_CLAIM_SEED_PASS';
  }else if(phase==='stale-recover'){
    const saved=JSON.parse(localStorage.getItem('axiom_stale_claim_state')||'null');
    invariant(saved,'stale-claim seed state missing');
    const store=await GovernedExecutionStore.open();
    const receipt=await store.execute(saved.requestSha,saved.authority);
    invariant(receipt.status==='COMPLETED','stale-claim recovery must complete');
    invariant((await terminalReceipts(store,saved.projectId,saved.requestSha)).length===1,'stale-claim recovery created duplicate terminal receipt');
    invariant((await store._all('execution_claims',saved.projectId)).length===0,'stale-claim recovery left an execution claim behind');
    store.db.close();
    out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_STALE_CLAIM_RECOVERY_PASS';
  }else if(phase==='atomic-fault'){
    const projectId='project_browser_atomic_terminal_12345678';
    const authority=authorityFor(projectId);
    const store=await GovernedExecutionStore.open();
    const sandbox=await store.createSandbox(authority,{label:'Atomic terminal commit fault injection'});
    const proposed=await store.propose(sandbox.sandbox_id,authority,{
      operation:'file.write',
      target:'atomic-window.txt',
      payload:{content:'must not survive a failed terminal commit'},
      compute_units:1,
      instruction_provenance:'GOVERNED_PLAN',
      requested_at:'2026-10-06T19:10:00.000Z',
    });
    invariant(proposed.decision.status==='AUTHORIZED','atomic-fault request must be authorized');
    const originalPut=IDBObjectStore.prototype.put;
    let injected=false;
    IDBObjectStore.prototype.put=function(value,...args){
      if(this.name==='events'&&value?.kind==='execution.completed'){
        injected=true;
        throw new DOMException('INJECTED_TERMINAL_EVENT_PUT_FAILURE','AbortError');
      }
      return originalPut.call(this,value,...args);
    };
    let rejected=null;
    try{
      await store.execute(proposed.request.request_sha256,authority);
    }catch(error){
      rejected=error;
    }finally{
      IDBObjectStore.prototype.put=originalPut;
    }
    invariant(injected,'terminal event fault injection was not reached');
    invariant(rejected,'terminal commit fault must reject execution');
    store.db.close();

    const inspect=await GovernedExecutionStore.open();
    const terminal=await terminalReceipts(inspect,projectId,proposed.request.request_sha256);
    const events=await completedEvents(inspect,projectId,proposed.request.request_sha256);
    const persistedSandbox=await inspect.getSandbox(sandbox.sandbox_id);
    invariant(terminal.length===0,`failed terminal commit leaked ${terminal.length} terminal receipts`);
    invariant(events.length===0,`failed terminal commit leaked ${events.length} completion events`);
    invariant(!Object.hasOwn(persistedSandbox.worktrees.main.files,'atomic-window.txt'),'failed terminal commit leaked sandbox side effect');
    const integrity=await inspect.verify(projectId);
    invariant(integrity.status==='PASS',`failed terminal commit damaged store integrity: ${integrity.errors.join(',')}`);
    inspect.db.close();
    out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_TERMINAL_COMMIT_ATOMICITY_PASS';
  }else if(phase==='failed-atomic-fault'){
    const projectId='project_browser_failed_atomic_12345678';
    const authority=authorityFor(projectId);
    const store=await GovernedExecutionStore.open();
    const sandbox=await store.createSandbox(authority,{label:'FAILED terminal fault injection'});
    const proposed=await store.propose(sandbox.sandbox_id,authority,{
      operation:'worktree.create',
      target:'main',
      compute_units:1,
      instruction_provenance:'GOVERNED_PLAN',
      requested_at:'2026-10-06T20:20:00.000Z',
    });
    invariant(proposed.decision.status==='AUTHORIZED','FAILED atomic request must be authorized');
    const originalPut=IDBObjectStore.prototype.put;
    let injected=false;
    IDBObjectStore.prototype.put=function(value,...args){
      if(this.name==='events'&&value?.kind==='execution.failed'){
        injected=true;
        throw new DOMException('INJECTED_FAILED_EVENT_PUT_FAILURE','AbortError');
      }
      return originalPut.call(this,value,...args);
    };
    let rejected=null;
    try{await store.execute(proposed.request.request_sha256,authority);}catch(error){rejected=error;}finally{IDBObjectStore.prototype.put=originalPut;}
    invariant(injected,'FAILED terminal event fault injection was not reached');
    invariant(rejected,'FAILED terminal commit fault must reject execution');
    store.db.close();
    const inspect=await GovernedExecutionStore.open();
    const receipts=(await inspect._all('receipts',projectId)).filter(row=>row.request_sha256===proposed.request.request_sha256&&row.status==='FAILED');
    const events=(await inspect._all('events',projectId)).filter(row=>row.kind==='execution.failed'&&row.payload?.request_sha256===proposed.request.request_sha256);
    const claims=await inspect._all('execution_claims',projectId);
    invariant(receipts.length===0,`failed-path atomic fault leaked ${receipts.length} FAILED receipts`);
    invariant(events.length===0,`failed-path atomic fault leaked ${events.length} FAILED events`);
    invariant(claims.length===0,`failed-path atomic fault left ${claims.length} execution claims`);
    const integrity=await inspect.verify(projectId);
    invariant(integrity.status==='PASS',`FAILED-path atomic fault damaged store integrity: ${integrity.errors.join(',')}`);
    inspect.db.close();
    out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_FAILED_TERMINAL_COMMIT_ATOMICITY_PASS';
  }else if(phase==='blocked-atomic-fault'){
    const projectId='project_browser_blocked_atomic_12345678';
    const authority=authorityFor(projectId);
    const store=await GovernedExecutionStore.open();
    const sandbox=await store.createSandbox(authority,{label:'BLOCKED receipt/event fault injection'});
    const proposed=await store.propose(sandbox.sandbox_id,authority,{
      operation:'repo.mutate',
      target:'frontier/blocked-test',
      payload:{change_sha256:'a'.repeat(64)},
      destination:'https://github.example.test/api/v1/change',
      compute_units:1,
      instruction_provenance:'GOVERNED_PLAN',
      requested_at:'2026-10-06T20:21:00.000Z',
    });
    invariant(proposed.decision.status!=='AUTHORIZED','BLOCKED atomic request must not be immediately authorized');
    const originalPut=IDBObjectStore.prototype.put;
    let injected=false;
    IDBObjectStore.prototype.put=function(value,...args){
      if(this.name==='events'&&value?.kind==='execution.blocked'){
        injected=true;
        throw new DOMException('INJECTED_BLOCKED_EVENT_PUT_FAILURE','AbortError');
      }
      return originalPut.call(this,value,...args);
    };
    let rejected=null;
    try{await store.execute(proposed.request.request_sha256,authority);}catch(error){rejected=error;}finally{IDBObjectStore.prototype.put=originalPut;}
    invariant(injected,'BLOCKED event fault injection was not reached');
    invariant(rejected,'BLOCKED receipt/event fault must reject execution');
    store.db.close();
    const inspect=await GovernedExecutionStore.open();
    const receipts=(await inspect._all('receipts',projectId)).filter(row=>row.request_sha256===proposed.request.request_sha256&&row.status==='BLOCKED');
    const events=(await inspect._all('events',projectId)).filter(row=>row.kind==='execution.blocked'&&row.payload?.request_sha256===proposed.request.request_sha256);
    invariant(receipts.length===0,`blocked atomic fault leaked ${receipts.length} BLOCKED receipts`);
    invariant(events.length===0,`blocked atomic fault leaked ${events.length} BLOCKED events`);
    const integrity=await inspect.verify(projectId);
    invariant(integrity.status==='PASS',`BLOCKED atomic fault damaged store integrity: ${integrity.errors.join(',')}`);
    inspect.db.close();
    out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_BLOCKED_RECEIPT_EVENT_ATOMICITY_PASS';
  }else if(phase==='process-kill-arm'){
    const projectId='project_browser_process_kill_12345678';
    const authority=authorityFor(projectId);
    const store=await GovernedExecutionStore.open();
    const sandbox=await store.createSandbox(authority,{label:'Process-kill terminal transaction'});
    const proposed=await store.propose(sandbox.sandbox_id,authority,{
      operation:'file.write',
      target:'process-kill-window.txt',
      payload:{content:'must not survive SIGKILL before terminal transaction commit'},
      compute_units:1,
      instruction_provenance:'GOVERNED_PLAN',
      requested_at:'2026-10-06T20:10:00.000Z',
    });
    invariant(proposed.decision.status==='AUTHORIZED','process-kill request must be authorized');
    localStorage.setItem('axiom_process_kill_state',JSON.stringify({projectId,authority,requestSha:proposed.request.request_sha256,sandboxId:sandbox.sandbox_id}));
    const originalPut=IDBObjectStore.prototype.put;
    IDBObjectStore.prototype.put=function(value,...args){
      if(this.name==='events'&&value?.kind==='execution.completed'){
        fetch('/__axiom_crash_ready',{method:'POST',body:'terminal-transaction-open',keepalive:true}).catch(()=>{});
        const until=performance.now()+15000;
        while(performance.now()<until){}
      }
      return originalPut.call(this,value,...args);
    };
    out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_PROCESS_KILL_ARMED';
    await store.execute(proposed.request.request_sha256,authority);
    IDBObjectStore.prototype.put=originalPut;
    out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_IDEMPOTENCY_FAIL:Error:process was not killed during terminal transaction';
  }else if(phase==='process-kill-inspect'){
    const projectId='project_browser_process_kill_12345678';
    const store=await GovernedExecutionStore.open();
    const requests=await store._all('requests',projectId);
    invariant(requests.length===1,`process-kill durable request count was ${requests.length}`);
    const request=requests[0];
    const terminal=await terminalReceipts(store,projectId,request.request_sha256);
    const events=await completedEvents(store,projectId,request.request_sha256);
    const sandbox=await store.getSandbox(request.sandbox_id);
    const claims=await store._all('execution_claims',projectId);
    invariant(terminal.length===0,`process kill leaked ${terminal.length} terminal receipts`);
    invariant(events.length===0,`process kill leaked ${events.length} completion events`);
    invariant(!Object.hasOwn(sandbox.worktrees.main.files,'process-kill-window.txt'),'process kill leaked persisted sandbox mutation');
    invariant(claims.length===1,'process kill must preserve one recoverable execution claim');
    const integrity=await store.verify(projectId);
    invariant(integrity.status==='PASS',`process-kill recovery store integrity failed: ${integrity.errors.join(',')}`);
    store.db.close();
    out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_PROCESS_KILL_ATOMICITY_PASS';
  }else if(phase==='upgrade-v1-seed'){
    await deleteDb();
    const projectId='project_browser_upgrade_12345678';
    const sandboxBody={
      schema:'musitu.axiom.execution-sandbox.browser.v1',
      sandbox_id:'sandbox_upgrade_v1_12345678',
      project_id:projectId,
      workload_identity_id:'workload_executor_browser_1',
      label:'v1 upgrade preservation sentinel',
      sandbox_mode:'BROWSER_LOCAL_VIRTUAL_SANDBOX',
      terminal_mode:'BROWSER_LOCAL_VIRTUAL_TERMINAL',
      worktree_mode:'BROWSER_LOCAL_VIRTUAL_WORKTREE',
      network_policy:'DENY_ALL_EXTERNAL_NETWORK',
      secrets_policy:'OPAQUE_SHORT_LIVED_OPERATION_SCOPED_NO_PLAINTEXT',
      base_tree_sha256:null,
      worktrees:{main:{worktree_id:'main',parent_id:null,files:{'preserve.txt':'v1-persisted'},snapshots:[],created_at:'2026-10-06T20:30:00.000Z'}},
      active_worktree_id:'main',
      created_at:'2026-10-06T20:30:00.000Z',
      external_network_enabled:false,
      host_shell_enabled:false,
      plaintext_secret_access:false,
    };
    const sandbox={...sandboxBody,sandbox_sha256:await sha256(sandboxBody)};
    const request=indexedDB.open(DB,1);
    await new Promise((resolve,reject)=>{
      request.onupgradeneeded=()=>{
        const db=request.result;
        for(const [name,key] of [['sandboxes','sandbox_id'],['requests','request_sha256'],['approvals','approval_sha256'],['receipts','receipt_id'],['leases','lease_id'],['events','event_id']]){
          const store=db.createObjectStore(name,{keyPath:key});
          store.createIndex('project_id','project_id',{unique:false});
          if(name==='events')store.createIndex('project_sequence',['project_id','sequence'],{unique:true});
        }
      };
      request.onsuccess=resolve;
      request.onerror=()=>reject(request.error);
    });
    const db=request.result;
    const tx=db.transaction('sandboxes','readwrite');
    tx.objectStore('sandboxes').put(sandbox);
    await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('v1 seed transaction aborted'));});
    db.close();
    localStorage.setItem('axiom_upgrade_state',JSON.stringify({projectId,sandboxId:sandbox.sandbox_id,sandboxSha:sandbox.sandbox_sha256}));
    out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_INDEXEDDB_V1_SEED_PASS';
  }else if(phase==='upgrade-v2-inspect'){
    const saved=JSON.parse(localStorage.getItem('axiom_upgrade_state')||'null');
    invariant(saved,'v1 upgrade seed state missing');
    const store=await GovernedExecutionStore.open();
    invariant(store.db.version===2,`upgraded IndexedDB version was ${store.db.version}`);
    invariant(store.db.objectStoreNames.contains('execution_claims'),'v2 upgrade did not add execution_claims store');
    const sandbox=await store.getSandbox(saved.sandboxId);
    invariant(sandbox,'v1 sandbox was lost during v2 upgrade');
    invariant(sandbox.sandbox_sha256===saved.sandboxSha,'v1 sandbox hash changed during v2 upgrade');
    invariant(sandbox.worktrees.main.files['preserve.txt']==='v1-persisted','v1 sandbox content changed during v2 upgrade');
    const integrity=await store.verify(saved.projectId);
    invariant(integrity.status==='PASS',`v1->v2 upgrade integrity failed: ${integrity.errors.join(',')}`);
    store.db.close();
    out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_INDEXEDDB_V1_TO_V2_UPGRADE_PASS';
  }else{
    throw new Error('unknown qualification phase');
  }
}catch(error){
  out.textContent='MUSITU_AXIOM_PHASE2_BROWSER_IDEMPOTENCY_FAIL:'+error.name+':'+error.message;
  document.body.dataset.failure='true';
}
</script>
