services:
  mqtt:
    image: eclipse-mosquitto:2.1.2
    command: ["mosquitto","-c","/mosquitto/config/mosquitto.conf"]
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: connect
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d connect"]
      interval: 3s
      timeout: 3s
      retries: 20
  temporal-db:
    image: postgres:16.11
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: temporal
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d temporal"]
      interval: 3s
      timeout: 3s
      retries: 20
  temporal:
    image: temporalio/auto-setup:1.32.0
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: temporal-db
    ports: ["7233:7233","8233:8233"]
  otel:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports: ["4317:4317","4318:4318"]
    volumes:
      - ./otel-config.yaml:/etc/otelcol-contrib/config.yaml:ro
