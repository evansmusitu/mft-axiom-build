<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; connect-src 'none'"><title>MFT Intelligence Mail • Business pilot</title><link rel="stylesheet" href="./mail.css"></head>
<body><header><a class="brand" href="./index.html"><span class="logo">M</span><span>MFT Intelligence <b>Mail</b></span></a><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search this folder" aria-label="Search this folder"></label><span class="avatar" title="Business account">D</span></header>
<div class="notice">Private business mailbox pilot • Sign-in required • Provider acceptance is not delivery.</div>
<div class="layout"><aside><button id="compose" class="primary">＋ Compose</button><nav id="folders" aria-label="Mail folders"></nav></aside><main><section class="panel"><div class="bar"><h1 id="heading">Inbox</h1><span id="count"></span><button id="refresh">Clear search</button></div><div id="messages" aria-label="Messages"></div></section><section id="reader" hidden aria-label="Message details"></section></main></div>
<dialog id="editor"><form id="draft-form"><div class="dialoghead"><h2 id="editor-title">New message</h2><button type="button" id="close-editor" aria-label="Close composer">×</button></div><label>To<input name="to" maxlength="254" autocomplete="off" placeholder="recipient@example.com"></label><label>Subject<input name="subject" maxlength="300" autocomplete="off"></label><label>Message<textarea name="body" maxlength="100000" rows="10"></textarea></label><div class="actions"><button type="button" class="primary" id="simulate-send">Send</button><button type="submit">Save draft</button></div><p id="draft-error" role="alert"></p></form></dialog><div id="status" role="status" aria-live="polite"></div><script type="module" src="./app.mjs"></script></body></html>
