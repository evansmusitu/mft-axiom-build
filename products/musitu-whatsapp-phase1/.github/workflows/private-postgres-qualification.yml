# Candidate for a NEW isolated MUSITU WhatsApp SaaS repository only.
# Do not add to AXIOM or MAIL FABRIC production workflows.
name: Private PostgreSQL qualification
on:
  workflow_dispatch:
  push:
    branches: ['sandbox/**']
permissions:
  contents: read
jobs:
  postgres-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: private-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify safe offline suite
        run: npm run verify
      - name: Install isolated PostgreSQL test client
        run: npm install --no-save --ignore-scripts --no-audit --no-fund pg@8
      - name: Native PostgreSQL 17 RLS and concurrency qualification
        env:
          PG_ISOLATED_QUALIFICATION: 'YES'
          PG_ADMIN_URL: postgres://postgres:private-ci-only@127.0.0.1:5432/postgres
        run: node scripts/postgres-native-qualification.mjs
