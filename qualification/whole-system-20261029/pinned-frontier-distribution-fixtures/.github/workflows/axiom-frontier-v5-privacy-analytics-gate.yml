name: MUSITU Axiom Frontier v5 Privacy Analytics Gate

on:
  push:
    branches:
      - frontier/axiom-v5-skill-fabric
    paths:
      - 'frontier_v5/tests/test_privacy_analytics_contract.py'
      - 'frontier_v5/runtime/privacy_analytics.py'
      - '.github/workflows/axiom-frontier-v5-privacy-analytics-gate.yml'
  pull_request:
    paths:
      - 'frontier_v5/tests/test_privacy_analytics_contract.py'
      - 'frontier_v5/runtime/privacy_analytics.py'
      - '.github/workflows/axiom-frontier-v5-privacy-analytics-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musitu-axiom-frontier-v5-privacy-analytics-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  privacy-analytics-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup patch-pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify REV-011 privacy-compliant product analytics
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_privacy_analytics_contract.py | tee /tmp/privacy-analytics.log
          grep -q 'MUSITU_AXIOM_FRONTIER_PRIVACY_ANALYTICS_PASS' /tmp/privacy-analytics.log
