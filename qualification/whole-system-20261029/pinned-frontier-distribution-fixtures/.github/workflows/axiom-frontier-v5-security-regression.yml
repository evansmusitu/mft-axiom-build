name: MUSITU Axiom Frontier v5 Security Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontier_v5/**'
      - '.github/workflows/axiom-frontier-v5-security-regression.yml'

permissions:
  contents: read

concurrency:
  group: musitu-axiom-frontier-v5-security-regression
  cancel-in-progress: true

jobs:
  network-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Verify research redirects fail closed before private target contact
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_research_redirect_preflight.py | tee /tmp/research-redirect-preflight.log
          grep -q 'MUSITU_AXIOM_FRONTIER_RESEARCH_REDIRECT_PREFLIGHT_PASS' /tmp/research-redirect-preflight.log

      - name: Verify browser requests fail closed before private target contact
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_browser_network_preflight.py | tee /tmp/browser-network-preflight.log
          grep -q 'MUSITU_AXIOM_FRONTIER_BROWSER_NETWORK_PREFLIGHT_PASS' /tmp/browser-network-preflight.log

      - name: Verify DNS rebinding cannot change the validated connection target
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python frontier_v5/tests/test_dns_rebinding_pin.py | tee /tmp/dns-rebinding-pin.log
          grep -q 'MUSITU_AXIOM_FRONTIER_DNS_REBINDING_PIN_PASS' /tmp/dns-rebinding-pin.log
