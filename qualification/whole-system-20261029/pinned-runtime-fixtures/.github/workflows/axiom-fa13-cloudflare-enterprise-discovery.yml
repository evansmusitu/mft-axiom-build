# qualification-trigger: cloudflare-access-token-added-20260915
name: MUSITU Axiom FA-13 Cloudflare Enterprise Discovery

on:
  push:
    branches: [frontier/axiom-final-product-fa13-20260915]
    paths: ['.github/workflows/axiom-fa13-cloudflare-enterprise-discovery.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-enterprise-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CF_API: https://api.cloudflare.com/client/v4
      EXPECTED_ACCOUNT_ID: 93f395f5121954671f92fffa453d6b61
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reassert frozen FA-13 authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'frontier/axiom-final-product-fa13-20260915'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -q 'Status: AUTHORITY_FROZEN_FOR_IMPLEMENTATION' docs/axiom_final_product/FA13_PREWRITE_INTENT.md
          grep -q 'Do not invent SSO/organization provider integration' docs/axiom_final_product/FA13_PREWRITE_INTENT.md
          git merge-base --is-ancestor 4b818f04cd722f1e2e620e0e42da7200def1897c HEAD

      - name: Probe token capabilities without exposing responses
        env:
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCESS_API_TOKEN"
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.error,urllib.request
          api=os.environ['CF_API']; aid=os.environ['EXPECTED_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_ACCESS_API_TOKEN']
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}

          def probe(label,path):
              req=urllib.request.Request(api+path,headers=headers,method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read(); code=r.status
              except urllib.error.HTTPError as e:
                  raw=e.read(); code=e.code
              parsed=None
              try: parsed=json.loads(raw) if raw else {}
              except Exception: parsed={}
              row={'endpoint':label,'http_status':code,'body_sha256':hashlib.sha256(raw).hexdigest(),'api_success':bool(isinstance(parsed,dict) and parsed.get('success') is True)}
              return row,parsed if code==200 and row['api_success'] else {}

          rows=[]
          r,_=probe('token_verify','/user/tokens/verify'); rows.append(r)
          r,idps=probe('identity_providers',f'/accounts/{aid}/access/identity_providers?per_page=100'); rows.append(r)
          r,groups=probe('groups',f'/accounts/{aid}/access/groups?per_page=100'); rows.append(r)
          r,apps=probe('apps',f'/accounts/{aid}/access/apps?per_page=100'); rows.append(r)

          safe={'schema':'musitu.axiom.fa13.cloudflare-token-capability-diagnostic.v1','source_commit':os.environ['GITHUB_SHA'],'account_id':aid,'probes':rows,'write_performed':False,'enterprise_row_promoted':False}
          if apps:
              result=apps.get('result') or []
              safe['access_app_count']=len(result)
              relevant=[]
              for app in result:
                  name=str(app.get('name') or ''); domain=str(app.get('domain') or '')
                  if any(x in (name+' '+domain).lower() for x in ('axiom','mftintelligence.com','mft')):
                      app_id=str(app.get('id') or '')
                      if app_id:
                          pr,_=probe('app_policies',f'/accounts/{aid}/access/apps/{app_id}/policies?per_page=100')
                          rows.append(pr)
                          relevant.append({'id':app_id,'name':name,'domain':domain,'policy_probe_http_status':pr['http_status'],'policy_probe_api_success':pr['api_success']})
              safe['relevant_apps']=relevant
          safe['required_read_capabilities_pass']=all(x['http_status']==200 and x['api_success'] for x in rows if x['endpoint'] in {'identity_providers','groups','apps','app_policies'})
          pathlib.Path('fa13-cloudflare-token-diagnostic.json').write_text(json.dumps(safe,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'probe_statuses':[{k:r[k] for k in ('endpoint','http_status','api_success')} for r in rows],'required_read_capabilities_pass':safe['required_read_capabilities_pass']},sort_keys=True))
          if token.encode() in pathlib.Path('fa13-cloudflare-token-diagnostic.json').read_bytes():
              raise SystemExit('Fail-closed: token material detected in evidence')
          PY

      - name: Seal diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f fa13-cloudflare-token-diagnostic.json
          sha256sum fa13-cloudflare-token-diagnostic.json > fa13-cloudflare-token-diagnostic.sha256

      - name: Upload sanitized diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-axiom-fa13-cloudflare-token-diagnostic
          path: |
            fa13-cloudflare-token-diagnostic.json
            fa13-cloudflare-token-diagnostic.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Fail closed unless required Access reads are authorized
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('fa13-cloudflare-token-diagnostic.json').read_text())
          if not d.get('required_read_capabilities_pass'):
              raise SystemExit('Cloudflare Access read capability set incomplete; see sanitized artifact')
          print('fa13_cloudflare_access_read_capability_pass=true')
          PY
