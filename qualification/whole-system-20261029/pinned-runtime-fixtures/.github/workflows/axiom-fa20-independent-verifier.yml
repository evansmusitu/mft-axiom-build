name: MUSITU Axiom FA20 Independent Release-Control Verifier

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      builder_run_id:
        required: true
        type: string
      release_evidence_sha256:
        required: true
        type: string
      release_evidence_b64:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable candidate without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Independently replay release control and preserve staging blocker
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BUILDER_RUN_ID: ${{ inputs.builder_run_id }}
          RELEASE_EVIDENCE_SHA256: ${{ inputs.release_evidence_sha256 }}
          RELEASE_EVIDENCE_B64: ${{ inputs.release_evidence_b64 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base 9de2da15d9e532eff9f992354d25995ff9a76c7a HEAD)" = 9de2da15d9e532eff9f992354d25995ff9a76c7a
          mkdir -p fa20-independent-evidence
          printf '%s' "$RELEASE_EVIDENCE_B64" | base64 -d > fa20-independent-evidence/fa20-release-control.json
          test "$(sha256sum fa20-independent-evidence/fa20-release-control.json | cut -d' ' -f1)" = "$RELEASE_EVIDENCE_SHA256"
          test "$(jq -r .candidate_commit fa20-independent-evidence/fa20-release-control.json)" = "$CANDIDATE_SHA"
          node --test axiom_interface/vnext/tests/*.test.mjs
          node .github/scripts/axiom_fa20_release_evaluate.mjs \
            --role verifier \
            --candidate-commit "$CANDIDATE_SHA" \
            --builder-evidence fa20-independent-evidence/fa20-release-control.json \
            --output fa20-independent-evidence/fa20-independent-verifier.json
          test "$(jq -r .status fa20-independent-evidence/fa20-independent-verifier.json)" = INDEPENDENT_VERIFIED_FA20_RELEASE_CONTROL_STAGING_NOT_EXECUTED
          test "$(jq -r .builder_evidence_sha256 fa20-independent-evidence/fa20-independent-verifier.json)" = "$(jq -r .evidence_sha256 fa20-independent-evidence/fa20-release-control.json)"
          test "$(jq -r .builder_and_verifier_distinct fa20-independent-evidence/fa20-independent-verifier.json)" = true
          test "$(jq -r .release_control_qualification_earned fa20-independent-evidence/fa20-independent-verifier.json)" = true
          test "$(jq -r .staging_authority_present fa20-independent-evidence/fa20-independent-verifier.json)" = false
          test "$(jq -r .staging_executed fa20-independent-evidence/fa20-independent-verifier.json)" = false
          test "$(jq -r .production_executed fa20-independent-evidence/fa20-independent-verifier.json)" = false
          test "$(jq -r .old_app_retained fa20-independent-evidence/fa20-independent-verifier.json)" = true
          test "$(jq -r .phase_exit_earned fa20-independent-evidence/fa20-independent-verifier.json)" = false
          test "$(jq -r .repository_write_authority_present fa20-independent-evidence/fa20-independent-verifier.json)" = false
          test "$(jq -r .production_credentials_present fa20-independent-evidence/fa20-independent-verifier.json)" = false
          test "$(jq -r .production_authority fa20-independent-evidence/fa20-independent-verifier.json)" = false
          printf '%s\n' "$BUILDER_RUN_ID" > fa20-independent-evidence/builder-run-id.txt
          (cd fa20-independent-evidence && sha256sum fa20-independent-verifier.json > fa20-independent-verifier.sha256)
      - name: Upload independent release-control evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-axiom-fa20-independent-release-control-verifier-evidence
          path: fa20-independent-evidence/
          retention-days: 90
